  - $A,B$は中心$O$、半径$r$の球面の上にある
  - $A\neq B$
  - $H$は直線$AB$上にある
  quantifiers:
  - 任意の球面と点$A,B,H$
  conclusion: $H$が$A$と$B$の間に真にあることと$HO<r$は同値である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面の上に相異なる点$A,B$をとり、直線$AB$上の点を$H=A+t(B-A)$と書く。$x=A-O$、$u=B-A\neq0$とおく。
