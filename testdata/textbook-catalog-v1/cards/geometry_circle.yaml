  sketch:
  - 'apply_theorem: The triangle inequality through O gives |AB| ≤ 2r.'
  - 'derive: A diameter has length 2r.'
  - 'derive: If |AB| = 2r, the parallelogram law gives |a+b| = 0 for a = A-O, b = B-O.'
  - 'conclude: Then O is the midpoint of AB.'
  openmath: (forall (o r a b) (-> (and (on_circle a o r) (on_circle b o r)) (and (<= (dist_of a b) (* 2 r)) (<-> (= (dist_of a b) (* 2 r)) (is_diameter a b o r)))))
