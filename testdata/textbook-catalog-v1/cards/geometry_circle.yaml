- id: inscribed_angle_same_side
  kind: named
  level: middle
  topic: 円・円周角の定理
  statement: 平面上で、円の上に点$A,B,X,Y$があり、$A\neq B$で、$X,Y$が直線$AB$に関して同じ側にある（どちらも直線上にない）とき、$\angle AXB=\angle AYB$である（円周角の定理）。
  statement_en: In a Euclidean plane, if A, B, X, Y lie on a circle, A ≠ B, and X, Y lie strictly on the same side of line AB, then ∠AXB = ∠AYB.
  assumptions:
  - 点は平面上にある
  - $A,B,X,Y$は同じ円の上にある
  - $A\neq B$
  - $X,Y$は直線$AB$に関して同じ側にあり、直線上にない
  quantifiers:
  - 任意の円と点$A,B,X,Y$
  conclusion: $\angle AXB=\angle AYB$である。
  answer: |
    平面上の中心$O$、半径$r$の円の上に点$A,B,X,Y$をとり、$A\neq B$とする。$X,Y$は直線$AB$に関して同じ側にあり、直線上にないとする。$A\neq B$より$r>0$である。以下で$U$は$X$または$Y$を表す。$U$は直線$AB$上にないので$U\neq A,B$である。$U$を通る直径のもう一方の端を$U'$とする。直線$UO$と円の共有点は$U,U'$だけで、$O$は$U$と$U'$の間にある。
    まず、円上の点$P\neq U$について$\angle POU'=2\angle PUO$であることを示す。$P=U'$なら両辺は$0$である。$P\neq U'$なら$P$は直線$UO$上にない。三角形$OUP$は$OU=OP$の二等辺三角形なので$\angle OPU=\angle OUP$である。$\angle POU'$はこの三角形の頂点$O$における外角なので、$\angle POU'=\angle OUP+\angle OPU=2\angle PUO$である。
    $O$が直線$AB$上にある場合を考える。$AB$は直径で、$O$はその中点である。半直線$UO$は$\angle AUB$の内部を通るので$\angle AUB=\angle AUO+\angle OUB$である。二等辺三角形$OUA,OUB$より$\angle AUO=\angle UAB$、$\angle OUB=\angle UBA$である。三角形$UAB$の内角の和から$2\angle AUB=\pi$となる。よって$\angle AXB=\angle AYB=\pi/2$である。
    $O$が直線$AB$上にない場合を考える。$O,U$が直線$AB$の同じ側にあれば$\angle AOB=2\angle AUB$であり、反対側にあれば$\angle AOB+2\angle AUB=2\pi$であることを、$A,B$と直線$UO$の位置で分けて示す。
    $A,B$が直線$UO$の反対側にあるとする。線分$AB$と直線$UO$の交点を$D$とする。$D$は弦$AB$の内点なので円の内部にあり、$U$と$U'$の間に真にある。$O$は直線$AB$上にないので$D\neq O$である。半直線$UD$は半直線$UO$に等しく、$D$は線分$AB$上にあるので、$\angle AUB=\angle AUO+\angle OUB$、$\angle AOB=\angle AOD+\angle DOB$である。$D$が$O$と$U'$の間にあれば、$O,U$は直線$AB$の同じ側にある。半直線$OD$は半直線$OU'$に等しいので、$\angle AOB=\angle AOU'+\angle U'OB=2\angle AUO+2\angle OUB=2\angle AUB$である。$D$が$O$と$U$の間にあれば、$O,U$は直線$AB$の反対側にある。半直線$OD$は半直線$OU$に等しいので、$\angle AOB=(\pi-\angle AOU')+(\pi-\angle U'OB)=2\pi-2\angle AUB$である。
    $A,B$が直線$UO$の同じ側にあるか、一方が$U'$に等しいとする。$A\neq B$なので両方が$U'$になることはない。半直線$UA,UB$は直線$UO$を境界とする同じ閉半平面に入るので、$\angle AUB=|\angle AUO-\angle BUO|$である。同様に$\angle AOB=|\angle AOU'-\angle BOU'|=2|\angle AUO-\angle BUO|=2\angle AUB$である。このとき$O,U$は直線$AB$の同じ側にある。反対側にあるなら、線分$OU$と直線$AB$の交点は円の内部にあるので弦$AB$の内点となり、$A,B$が直線$UO$の反対側にあることになるからである。
    以上より$\angle AUB$は、$O,U$が直線$AB$の同じ側なら$\angle AOB/2$、反対側なら$\pi-\angle AOB/2$である。$X,Y$は直線$AB$の同じ側にあるので、$O$との位置関係は$X,Y$で共通である。よって$\angle AXB=\angle AYB$である。
  strategy: Isosceles triangles on the radii give the central angle relation in every position of the center; the inscribed angle then depends only on the side of AB.
  sketch:
  - 'setup: Let U be X or Y and let U'' be the other end of the diameter through U.'
  - 'derive: The isosceles triangle OUP gives angle POU'' = 2 angle PUO for P on the circle, P ≠ U.'
  - 'case_split: If O lies on AB, the triangle angle sum gives angle AUB = π/2.'
  - 'case_split: If A, B lie on opposite sides of UO, the point where AB meets UO decides between angle AOB = 2 angle AUB and angle AOB + 2 angle AUB = 2π.'
  - 'case_split: If A, B lie on one closed side of UO, differences of angles give angle AOB = 2 angle AUB, and O, U lie on the same side of AB.'
  - 'conclude: X and Y have the same position relative to O and AB, so their angles are equal.'
  openmath: (forall (o r a b x y) (-> (and euclidean_plane_ambient (on_circle a o r) (on_circle b o r) (on_circle x o r) (on_circle y o r) (!= a b) (same_side_of_line x y a b)) (= (euclid_angle a x b) (euclid_angle a y b))))
  hard_negative:
    statement: 同じ円の上の点$A,B,X,Y$について、$X,Y$が直線$AB$の反対側にあっても$\angle AXB=\angle AYB$である。
    reason: 単位円で$A=(1,0)$、$B=(0,1)$、$X=(-1,0)$、$Y=(1/\sqrt2,1/\sqrt2)$とすると、$\angle AXB=\pi/4$、$\angle AYB=3\pi/4$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (s : EuclideanGeometry.Sphere P) (A B X Y : P), A ∈ s → B ∈ s → X ∈ s → Y ∈ s → A ≠ B → (line[ℝ, A, B]).SSameSide X Y → EuclideanGeometry.angle A X B = EuclideanGeometry.angle A Y B
  proof: |
    by
      intro V P _ _ _ _ _ s A B X Y hA hB hX hY hAB hs
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have hmA := left_mem_affineSpan_pair ℝ A B
      have hmB := right_mem_affineSpan_pair ℝ A B
      have hXA : X ≠ A := fun h => hs.2.1 (h ▸ hmA)
      have hXB : X ≠ B := fun h => hs.2.1 (h ▸ hmB)
      have hYA : Y ≠ A := fun h => hs.2.2 (h ▸ hmA)
      have hYB : Y ≠ B := fun h => hs.2.2 (h ▸ hmB)
      have h2 := EuclideanGeometry.Sphere.two_zsmul_oangle_eq hA hX hY hB hXA hXB hYA hYB
      have hsign := hs.oangle_sign_eq hmA hmB
      have hne : (EuclideanGeometry.oangle A X B).sign ≠ 0 := by
        intro h0
        have hcol := EuclideanGeometry.oangle_sign_eq_zero_iff_collinear.mp h0
        exact hs.2.1 (hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hAB)
      rw [EuclideanGeometry.angle_eq_iff_oangle_eq_of_sign_eq hXA.symm hXB.symm hYA.symm hYB.symm hsign.symm]
      exact (Real.Angle.two_zsmul_eq_iff_eq hne hsign.symm).mp h2
- id: inscribed_angle_same_side_converse
  kind: textbook
  level: middle
  topic: 円・円周角の定理の逆
  statement: 平面上で、$A\neq B$とし、点$X,Y$が直線$AB$に関して同じ側にある（どちらも直線上にない）とする。$\angle AXB=\angle AYB$ならば、$A,B,X,Y$は同一円周上にある（円周角の定理の逆）。
  statement_en: In a Euclidean plane, if A ≠ B, X and Y lie strictly on the same side of line AB, and ∠AXB = ∠AYB, then A, B, X, Y lie on a common circle.
  assumptions:
  - 点は平面上にある
  - $A\neq B$
  - $X,Y$は直線$AB$に関して同じ側にあり、直線上にない
  - $\angle AXB=\angle AYB$
  quantifiers:
  - 任意の点$A,B,X,Y$
  conclusion: $A,B,X,Y$は同一円周上にある。
  answer: |
    平面上の点$A,B,X,Y$について$A\neq B$とし、$X,Y$は直線$AB$に関して同じ側にあり直線上になく、$\angle AXB=\angle AYB$とする。
    $A,B,X$は一直線上にないので、この3点を通る円$\Gamma$がある。$Y$が$\Gamma$の上にあることを示す。$A,B$の中点を$M$とする。$M$は$\Gamma$の内部にあるので、半直線$MY$は$\Gamma$とただ1点$Z$で交わる。$Z$は直線$AB$に関して$Y$と同じ側、すなわち$X$と同じ側にある。円周角の定理（円の上の$A\neq B$と、直線$AB$の同じ側にある円の上の2点$X,Z$について$\angle AXB=\angle AZB$）より、$\angle AZB=\angle AXB=\angle AYB$である。
    一般に、点$P$が三角形$ABQ$の内部にあれば$\angle APB>\angle AQB$である。半直線$AP$と辺$BQ$の交点を$R$とする。$\angle APB$は三角形$PRB$の頂点$P$における外角なので$\angle APB>\angle ARB$である。$\angle ARB$は三角形$AQR$の頂点$R$における外角なので$\angle ARB>\angle AQB$である。
    $Y\neq Z$と仮定する。$Y,Z$は$M$から出る同じ半直線の上にあり、$M$は辺$AB$の内点である。$Y$が$M$と$Z$の間にあれば、$Y$は三角形$ABZ$の内部にあるので$\angle AYB>\angle AZB$である。$Z$が$M$と$Y$の間にあれば、$Z$は三角形$ABY$の内部にあるので$\angle AZB>\angle AYB$である。どちらも$\angle AZB=\angle AYB$に反する。よって$Y=Z$であり、$A,B,X,Y$は$\Gamma$の上にある。
  strategy: Compare Y with the point where the ray from the midpoint of AB through Y meets the circle ABX; a point inside a triangle sees the opposite side under a larger angle.
  sketch:
  - 'setup: Take the circle through A, B, X and the midpoint M of AB.'
  - 'construct: The ray from M through Y meets the circle at one point Z on the same side as X.'
  - 'apply_theorem: The inscribed angle theorem gives angle AZB = angle AXB = angle AYB.'
  - 'derive: A point inside a triangle ABQ sees AB under a larger angle than Q does, by two exterior angles.'
  - 'contradiction: If Y ≠ Z, one of them lies inside the triangle formed with the other, so the two angles differ.'
  - 'conclude: Y = Z, so the four points are concyclic.'
  openmath: (forall (a b x y) (-> (and euclidean_plane_ambient (!= a b) (same_side_of_line x y a b) (= (euclid_angle a x b) (euclid_angle a y b))) (cospherical_points (set a b x y))))
  hard_negative:
    statement: $\angle AXB=\angle AYB$であれば、$X,Y$が直線$AB$の反対側にあっても$A,B,X,Y$は同一円周上にある。
    reason: $A=(-1,0)$、$B=(1,0)$、$X=(0,2)$、$Y=(0,-2)$では角は等しいが、$A,B,X$を通る円は中心$(0,3/4)$、半径$5/4$で、$Y$はその上にない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (A B X Y : P), A ≠ B → (line[ℝ, A, B]).SSameSide X Y → EuclideanGeometry.angle A X B = EuclideanGeometry.angle A Y B → EuclideanGeometry.Cospherical ({A, B, X, Y} : Set P)
  proof: |
    by
      intro V P _ _ _ _ _ A B X Y hAB hs hang
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have hmA := left_mem_affineSpan_pair ℝ A B
      have hmB := right_mem_affineSpan_pair ℝ A B
      have hsign := hs.oangle_sign_eq hmA hmB
      have heq := EuclideanGeometry.oangle_eq_of_angle_eq_of_sign_eq hang hsign.symm
      have hc : EuclideanGeometry.Cospherical ({A, X, Y, B} : Set P) := by
        refine EuclideanGeometry.cospherical_of_two_zsmul_oangle_eq_of_not_collinear (by rw [heq]) ?_
        intro hcol
        exact hs.2.1 (hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hAB)
      exact hc.subset (by intro x; simp only [Set.mem_insert_iff, Set.mem_singleton_iff]; tauto)
- id: central_angle_twice_inscribed_same_side
  kind: textbook
  level: middle
  topic: 円・中心角と円周角
  statement: 平面上で、中心$O$の円の上に点$A,B,X$があり、$A\neq B$で、$O$と$X$が直線$AB$に関して同じ側にある（どちらも直線上にない）とき、$\angle AOB=2\angle AXB$である。
  statement_en: In a Euclidean plane, if A, B, X lie on a circle with center O, A ≠ B, and O, X lie strictly on the same side of line AB, then ∠AOB = 2∠AXB.
  assumptions:
  - 点は平面上にある
  - $A,B,X$は中心$O$の円の上にある
  - $A\neq B$
  - $O,X$は直線$AB$に関して同じ側にあり、直線上にない
  quantifiers:
  - 任意の円と点$A,B,X$
  conclusion: $\angle AOB=2\angle AXB$である。
  answer: |
    平面上の中心$O$、半径$r$の円の上に点$A,B,X$をとり、$A\neq B$とする。$O,X$は直線$AB$に関して同じ側にあり、直線上にないとする。$A\neq B$より$r>0$であり、$X$は直線$AB$上にないので$X\neq A,B$である。$X$を通る直径のもう一方の端を$X'$とする。直線$XO$と円の共有点は$X,X'$だけで、$O$は$X$と$X'$の間にある。
    まず、円上の点$P\neq X$について$\angle POX'=2\angle PXO$であることを示す。$P=X'$なら両辺は$0$である。$P\neq X'$なら$P$は直線$XO$上にない。三角形$OXP$は$OX=OP$の二等辺三角形なので$\angle OPX=\angle OXP$である。$\angle POX'$はこの三角形の頂点$O$における外角なので、$\angle POX'=\angle OXP+\angle OPX=2\angle PXO$である。
    これを$P=A,B$に用いて、$A,B$と直線$XO$の位置で場合を分ける。
    $A,B$が直線$XO$の同じ側にあるか、一方が$X'$に等しいとする。$A\neq B$なので両方が$X'$になることはない。半直線$XA,XB$は直線$XO$を境界とする同じ閉半平面に入るので、$\angle AXB=|\angle AXO-\angle BXO|$である。同様に$\angle AOB=|\angle AOX'-\angle BOX'|$である。よって$\angle AOB=2|\angle AXO-\angle BXO|=2\angle AXB$である。
    $A,B$が直線$XO$の反対側にあるとする。線分$AB$と直線$XO$の交点を$D$とする。$D$は弦$AB$の内点なので円の内部にあり、$X$と$X'$の間に真にある。$O$は直線$AB$上にないので$D\neq O$である。$O,X$は直線$AB$の同じ側にあるので、$D$は$O$と$X$の間にない。よって$D$は$O$と$X'$の間にある。半直線$OD$は半直線$OX'$に等しく、半直線$XD$は半直線$XO$に等しい。$D$は線分$AB$上にあるので、$\angle AOB=\angle AOX'+\angle X'OB$、$\angle AXB=\angle AXO+\angle OXB$である。したがって$\angle AOB=2\angle AXO+2\angle OXB=2\angle AXB$である。
  strategy: Draw the diameter through X; isosceles triangles on the radii give a doubling relation on each side, and the position of A, B relative to the diameter decides whether to add or subtract.
  sketch:
  - 'setup: Let X'' be the other end of the diameter through X.'
  - 'derive: The isosceles triangle OXP gives angle POX'' = 2 angle PXO for P on the circle, P ≠ X.'
  - 'case_split: If A, B lie on one closed side of XO, both angles are differences, so angle AOB = 2 angle AXB.'
  - 'derive: If A, B lie on opposite sides of XO, the crossing point D of AB and XO lies between O and X'' because O, X are on the same side of AB.'
  - 'conclude: Then both angles are sums, so again angle AOB = 2 angle AXB.'
  openmath: (forall (o r a b x) (-> (and euclidean_plane_ambient (on_circle a o r) (on_circle b o r) (on_circle x o r) (!= a b) (same_side_of_line o x a b)) (= (euclid_angle a o b) (* 2 (euclid_angle a x b)))))
  hard_negative:
    statement: $O$と$X$が直線$AB$の反対側にあっても$\angle AOB=2\angle AXB$である。
    reason: 単位円で$A=(1,0)$、$B=(0,1)$、$X=(1/\sqrt2,1/\sqrt2)$とすると、$\angle AOB=\pi/2$、$\angle AXB=3\pi/4$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (s : EuclideanGeometry.Sphere P) (A B X : P), A ∈ s → B ∈ s → X ∈ s → A ≠ B → (line[ℝ, A, B]).SSameSide s.center X → EuclideanGeometry.angle A s.center B = 2 * EuclideanGeometry.angle A X B
  proof: |
    by
      intro V P _ _ _ _ _ s A B X hA hB hX hAB hs
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have hmA := left_mem_affineSpan_pair ℝ A B
      have hmB := right_mem_affineSpan_pair ℝ A B
      have hXA : X ≠ A := fun h => hs.2.2 (h ▸ hmA)
      have hXB : X ≠ B := fun h => hs.2.2 (h ▸ hmB)
      have hn1 : ¬Collinear ℝ ({A, s.center, B} : Set P) := fun hcol =>
        hs.2.1 (hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hAB)
      have hn2 : ¬Collinear ℝ ({A, X, B} : Set P) := fun hcol =>
        hs.2.2 (hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hAB)
      have hcen := EuclideanGeometry.Sphere.oangle_center_eq_two_zsmul_oangle hA hX hB hXA hXB
      have hsign : (EuclideanGeometry.oangle A s.center B).sign = (EuclideanGeometry.oangle A X B).sign :=
        (hs.oangle_sign_eq hmA hmB).symm
      have hy0 := EuclideanGeometry.angle_pos_of_not_collinear hn1
      have hy1 := EuclideanGeometry.angle_lt_pi_of_not_collinear hn1
      have hx0 := EuclideanGeometry.angle_pos_of_not_collinear hn2
      have hx1 := EuclideanGeometry.angle_lt_pi_of_not_collinear hn2
      set y := EuclideanGeometry.angle A s.center B with hy
      set x := EuclideanGeometry.angle A X B with hx
      have key : (y : Real.Angle) = (2 : ℤ) • (x : Real.Angle) → y = 2 * x := by
        intro h
        have h' : (y : Real.Angle) = ((2 * x : ℝ) : Real.Angle) := by
          rw [h, two_zsmul, ← Real.Angle.coe_add, two_mul]
        obtain ⟨k, hk⟩ := Real.Angle.angle_eq_iff_two_pi_dvd_sub.mp h'
        have hpi := Real.pi_pos
        have k1 : (k : ℝ) < 1 := by nlinarith
        have k2 : (-1 : ℝ) < k := by nlinarith
        have k3 : k = 0 := by
          have : k < 1 := by exact_mod_cast k1
          have : -1 < k := by exact_mod_cast k2
          omega
        rw [k3] at hk
        simp at hk
        linarith
      apply key
      rcases hc : (EuclideanGeometry.oangle A X B).sign with _ | _ | _
      · exfalso
        exact hn2 (EuclideanGeometry.oangle_sign_eq_zero_iff_collinear.mp hc)
      · have ea := EuclideanGeometry.oangle_eq_neg_angle_of_sign_eq_neg_one hc
        have eb := EuclideanGeometry.oangle_eq_neg_angle_of_sign_eq_neg_one (hsign.trans hc)
        rw [ea, eb, smul_neg, neg_inj] at hcen
        exact hcen
      · have ea := EuclideanGeometry.oangle_eq_angle_of_sign_eq_one hc
        have eb := EuclideanGeometry.oangle_eq_angle_of_sign_eq_one (hsign.trans hc)
        rw [ea, eb] at hcen
        exact hcen
- id: central_angle_plus_twice_inscribed_opposite_side
  kind: gap
  level: middle
  topic: 円・中心角と円周角
  statement: 平面上で、中心$O$の円の上に点$A,B,X$があり、$A\neq B$で、$O$と$X$が直線$AB$の反対側にある（どちらも直線上にない）とき、$\angle AOB+2\angle AXB=2\pi$である。これは$X$が劣弧の上にある場合の形である。
  statement_en: Minor-arc form. In a Euclidean plane, if A, B, X lie on a circle with center O, A ≠ B, and O, X lie strictly on opposite sides of line AB, then ∠AOB + 2∠AXB = 2π.
  assumptions:
  - 点は平面上にある
  - $A,B,X$は中心$O$の円の上にある
  - $A\neq B$
  - $O,X$は直線$AB$の反対側にあり、直線上にない
  quantifiers:
  - 任意の円と点$A,B,X$
  conclusion: $\angle AOB+2\angle AXB=2\pi$である。
  answer: |
    平面上の中心$O$、半径$r$の円の上に点$A,B,X$をとり、$A\neq B$とする。$O,X$は直線$AB$の反対側にあり、直線上にないとする。$A\neq B$より$r>0$である。$X$を通る直径のもう一方の端を$X'$とする。$O$は$X$と$X'$の間にある。
    線分$OX$と直線$AB$の交点を$D$とする。$D$は$O$と$X$の間に真にあるので円の内部にある。直線$AB$上で円の内部にある点は弦$AB$の内点なので、$D$は$A$と$B$の間に真にある。$O$は直線$AB$上にないので、直線$XO$と直線$AB$は異なる。よって$A,B$は直線$XO$の反対側にあり、$X,X'$と異なる。
    三角形$OXA$は$OX=OA$の二等辺三角形で、$\angle AOX'$はその頂点$O$における外角なので、$\angle AOX'=2\angle AXO$である。同様に$\angle BOX'=2\angle BXO$である。
    半直線$OD$は半直線$OX$に等しく、半直線$XD$は半直線$XO$に等しい。$D$は線分$AB$上にあるので、$\angle AOB=\angle AOX+\angle XOB$、$\angle AXB=\angle AXO+\angle OXB$である。$X,O,X'$がこの順に並ぶので、$\angle AOX=\pi-\angle AOX'$、$\angle XOB=\pi-\angle X'OB$である。したがって$\angle AOB=2\pi-2\angle AXO-2\angle OXB=2\pi-2\angle AXB$である。
  strategy: The segment OX crosses the chord AB, so the diameter through X splits both angles; isosceles triangles on the radii relate the parts.
  sketch:
  - 'setup: Let X'' be the other end of the diameter through X and D the point where segment OX meets line AB.'
  - 'derive: D lies inside the circle, so it lies strictly between A and B.'
  - 'derive: The isosceles triangles on OA and OB give angle AOX'' = 2 angle AXO and angle BOX'' = 2 angle BXO.'
  - 'derive: Since D lies on AB, angle AOB and angle AXB split along XO.'
  - 'conclude: Using angle AOX = π - angle AOX'' gives angle AOB + 2 angle AXB = 2π.'
  openmath: (forall (o r a b x) (-> (and euclidean_plane_ambient (on_circle a o r) (on_circle b o r) (on_circle x o r) (!= a b) (opposite_side_of_line o x a b)) (= (+ (euclid_angle a o b) (* 2 (euclid_angle a x b))) (* 2 pi))))
  hard_negative:
    statement: $O$と$X$が直線$AB$に関して同じ側にあっても$\angle AOB+2\angle AXB=2\pi$である。
    reason: 単位円で$A=(1,0)$、$B=(0,1)$、$X=(-1,0)$とすると、$\angle AOB=\pi/2$、$\angle AXB=\pi/4$で、和は$\pi$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (s : EuclideanGeometry.Sphere P) (A B X : P), A ∈ s → B ∈ s → X ∈ s → A ≠ B → (line[ℝ, A, B]).SOppSide s.center X → EuclideanGeometry.angle A s.center B + 2 * EuclideanGeometry.angle A X B = 2 * Real.pi
  proof: |
    by
      intro V P _ _ _ _ _ s A B X hA hB hX hAB hs
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have hmA := left_mem_affineSpan_pair ℝ A B
      have hmB := right_mem_affineSpan_pair ℝ A B
      have hXA : X ≠ A := fun h => hs.2.2 (h ▸ hmA)
      have hXB : X ≠ B := fun h => hs.2.2 (h ▸ hmB)
      have hn1 : ¬Collinear ℝ ({A, s.center, B} : Set P) := fun hcol =>
        hs.2.1 (hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hAB)
      have hn2 : ¬Collinear ℝ ({A, X, B} : Set P) := fun hcol =>
        hs.2.2 (hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hAB)
      have hcen := EuclideanGeometry.Sphere.oangle_center_eq_two_zsmul_oangle hA hX hB hXA hXB
      have hsign : (EuclideanGeometry.oangle A s.center B).sign = -(EuclideanGeometry.oangle A X B).sign := by
        rw [hs.symm.oangle_sign_eq_neg hmA hmB]
      have hy0 := EuclideanGeometry.angle_pos_of_not_collinear hn1
      have hy1 := EuclideanGeometry.angle_lt_pi_of_not_collinear hn1
      have hx0 := EuclideanGeometry.angle_pos_of_not_collinear hn2
      have hx1 := EuclideanGeometry.angle_lt_pi_of_not_collinear hn2
      set y := EuclideanGeometry.angle A s.center B with hy
      set x := EuclideanGeometry.angle A X B with hx
      have key : -(y : Real.Angle) = (2 : ℤ) • (x : Real.Angle) → y + 2 * x = 2 * Real.pi := by
        intro h
        have h' : ((y + 2 * x : ℝ) : Real.Angle) = ((0 : ℝ) : Real.Angle) := by
          rw [Real.Angle.coe_add, two_mul, Real.Angle.coe_add, ← two_zsmul, ← h]; simp
        obtain ⟨k, hk⟩ := Real.Angle.angle_eq_iff_two_pi_dvd_sub.mp h'
        have hpi := Real.pi_pos
        have k1 : (k : ℝ) < 2 := by nlinarith
        have k2 : (0 : ℝ) < k := by nlinarith
        have k3 : k = 1 := by
          have : k < 2 := by exact_mod_cast k1
          have : 0 < k := by exact_mod_cast k2
          omega
        rw [k3] at hk
        simp at hk
        linarith
      apply key
      rcases hc : (EuclideanGeometry.oangle A X B).sign with _ | _ | _
      · exfalso
        exact hn2 (EuclideanGeometry.oangle_sign_eq_zero_iff_collinear.mp hc)
      · have ea := EuclideanGeometry.oangle_eq_neg_angle_of_sign_eq_neg_one hc
        have eb := EuclideanGeometry.oangle_eq_angle_of_sign_eq_one (by rw [hsign, hc]; rfl)
        rw [ea, eb, smul_neg] at hcen
        rw [hcen, neg_neg]
      · have ea := EuclideanGeometry.oangle_eq_angle_of_sign_eq_one hc
        have eb := EuclideanGeometry.oangle_eq_neg_angle_of_sign_eq_neg_one (by rw [hsign, hc]; rfl)
        rw [ea, eb] at hcen
        exact hcen
- id: thales_right_angle_iff_on_diameter_circle
  kind: named
  level: middle
  topic: 円・タレスの定理
  statement: 実内積空間上のアフィン空間で、線分$AB$を直径とする球面（平面なら円）と点$X\neq A,B$について、$\angle AXB=\pi/2$であることと$X$がその球面上にあることは同値である（タレスの定理とその逆）。
  statement_en: If AB is a diameter of a sphere (a circle in the plane) in a real inner product affine space and X ≠ A, B, then ∠AXB = π/2 if and only if X lies on the sphere.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $AB$は球面$s$の直径である
  - $X\neq A$、$X\neq B$
  quantifiers:
  - 任意の球面$s$と点$A,B,X$
  conclusion: $\angle AXB=\pi/2$と$X\in s$は同値である。
  answer: |
    実内積空間上のアフィン空間で、$AB$を直径とする中心$O$、半径$r$の球面$s$と、$A,B$と異なる点$X$をとる。$O$は$A,B$の中点である。
    $a=A-O$、$x=X-O$とおくと、$B-O=-a$、$\|a\|=r$である。よって$\langle A-X,B-X\rangle=\langle a-x,-a-x\rangle=\|x\|^2-\|a\|^2=\|x\|^2-r^2$である。
    $A-X,B-X$はともに$0$でないので、$\angle AXB=\pi/2$は内積が$0$であることと同値である。内積が$0$であることは$\|x\|=r$、すなわち$X\in s$と同値である。
  strategy: Expand the inner product of XA and XB from the center; it equals |XO|^2 - r^2.
  sketch:
  - 'setup: Let O be the midpoint of AB and write a = A-O, x = X-O, so B-O = -a.'
  - 'derive: The inner product of A-X and B-X equals |x|^2 - r^2.'
  - 'translate: For nonzero vectors, a right angle means inner product zero.'
  - 'conclude: This holds exactly when |x| = r.'
  openmath: (forall (o r a b x) (-> (and (is_diameter a b o r) (!= x a) (!= x b)) (<-> (= (euclid_angle a x b) (/ pi 2)) (on_circle x o r))))
  hard_negative:
    statement: 円の任意の弦$AB$と円上の点$X\neq A,B$について$\angle AXB=\pi/2$である。
    reason: 単位円で$A=(1,0)$、$B=(0,1)$、$X=(-1,0)$とすると$\angle AXB=\pi/4$である。直径であることが必要である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B X : P), s.IsDiameter A B → X ≠ A → X ≠ B → (EuclideanGeometry.angle A X B = Real.pi / 2 ↔ X ∈ s)
  proof: |
    by
      intro V P _ _ _ _ s A B X h _ _
      exact EuclideanGeometry.Sphere.angle_eq_pi_div_two_iff_mem_sphere_of_isDiameter h
- id: right_angle_on_circle_chord_is_diameter
  kind: gap
  level: middle
  topic: 円・タレスの定理の逆
  statement: 平面上で、円の上の点$A,B,X$について$X\neq A,B$かつ$\angle AXB=\pi/2$ならば、$AB$はこの円の直径である。
  statement_en: In a Euclidean plane, if A, B, X lie on a circle, X ≠ A, B and ∠AXB = π/2, then AB is a diameter of the circle.
  assumptions:
  - 点は平面上にある
  - $A,B,X$は円$s$の上にある
  - $X\neq A$、$X\neq B$
  - $\angle AXB=\pi/2$
  quantifiers:
  - 任意の円$s$と点$A,B,X$
  conclusion: $AB$は$s$の直径である。
  answer: |
    平面上の中心$O$、半径$r$の円の上に点$A,B,X$をとり、$X\neq A,B$、$\angle AXB=\pi/2$とする。$A\neq B$である。$A=B$なら$\angle AXB=0$となるからである。
    $M$を$A,B$の中点とする。ベクトル$a=A-M$、$x=X-M$について$B-M=-a$であり、$\langle A-X,B-X\rangle=\|x\|^2-\|a\|^2=0$である。よって$MA=MB=MX$である。
    $O$と$M$はともに$A,B,X$から等距離にある。$\angle AXB=\pi/2$なので$A,B,X$は一直線上になく、平面上でこの3点から等距離にある点はただ1つである。線分$AX$の垂直二等分線と線分$BX$の垂直二等分線は平行でなく、1点でしか交わらないからである。したがって$O=M$であり、$A,B$は中心について対称な円上の点である。すなわち$AB$は直径である。
  strategy: The midpoint of AB is equidistant from A, B, X, and in the plane the circumcenter is unique.
  sketch:
  - 'setup: Let M be the midpoint of AB.'
  - 'derive: The right angle gives |MX| = |MA| = |MB|.'
  - 'derive: A, B, X are not collinear, so the plane contains only one point equidistant from them.'
  - 'conclude: The center equals M, so AB is a diameter.'
  openmath: (forall (o r a b x) (-> (and euclidean_plane_ambient (on_circle a o r) (on_circle b o r) (on_circle x o r) (!= x a) (!= x b) (= (euclid_angle a x b) (/ pi 2))) (is_diameter a b o r)))
  hard_negative:
    statement: 3次元の球面の上の点$A,B,X$について$X\neq A,B$かつ$\angle AXB=\pi/2$ならば、$AB$は球面の直径である。
    reason: 球面を大円でない平面で切った小円の直径を$AB$とし、$X$をその小円の上の点とすると、角は直角だが$AB$の長さは球面の直径より短い。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (s : EuclideanGeometry.Sphere P) (A B X : P), A ∈ s → B ∈ s → X ∈ s → X ≠ A → X ≠ B → EuclideanGeometry.angle A X B = Real.pi / 2 → s.IsDiameter A B
  proof: |
    by
      intro V P _ _ _ _ _ s A B X hA hB hX hXA hXB h
      exact EuclideanGeometry.Sphere.isDiameter_of_angle_eq_pi_div_two hA hX hB hXA.symm hXB h
- id: angle_on_diameter_inside_outside
  kind: gap
  level: high
  topic: 円・直径を見込む角
  statement: 実内積空間上のアフィン空間で、$AB$を直径とする中心$O$、半径$r$の球面（平面なら円）と点$X\neq A,B$について、$\angle AXB>\pi/2$と$XO<r$は同値であり、$\angle AXB<\pi/2$と$XO>r$は同値である。
  statement_en: If AB is a diameter of a sphere with center O and radius r (a circle in the plane) and X ≠ A, B, then ∠AXB > π/2 iff |XO| < r, and ∠AXB < π/2 iff |XO| > r.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $AB$は中心$O$、半径$r$の球面の直径である
  - $X\neq A$、$X\neq B$
  quantifiers:
  - 任意の球面と点$A,B,X$
  conclusion: $\angle AXB>\pi/2\iff XO<r$かつ$\angle AXB<\pi/2\iff XO>r$である。
  answer: |
    実内積空間上のアフィン空間で、$AB$を直径とする中心$O$、半径$r$の球面と、$A,B$と異なる点$X$をとる。$r\geq0$である。
    $a=A-O$、$x=X-O$とおくと$B-O=-a$、$\|a\|=r$なので、$\langle A-X,B-X\rangle=\|x\|^2-r^2=XO^2-r^2$である。この内積は$\cos\angle AXB\cdot\|A-X\|\|B-X\|$に等しく、$\|A-X\|\|B-X\|>0$である。よって$\cos\angle AXB$の符号は$XO^2-r^2$の符号に等しい。
    $\angle AXB\in[0,\pi]$なので、$\cos\angle AXB<0$は$\angle AXB>\pi/2$と同値で、$\cos\angle AXB>0$は$\angle AXB<\pi/2$と同値である。$XO,r\geq0$なので、$XO^2-r^2$の符号は$XO-r$の符号に等しい。以上で2つの同値が得られる。
  strategy: The cosine of the angle has the sign of |XO|^2 - r^2.
  sketch:
  - 'setup: Write a = A-O, x = X-O, so B-O = -a.'
  - 'derive: The inner product of A-X and B-X equals |XO|^2 - r^2.'
  - 'derive: This inner product is cos of angle AXB times a positive number.'
  - 'translate: The sign of the cosine on [0,π] decides acute or obtuse.'
  - 'conclude: Comparing signs gives both equivalences.'
  openmath: (forall (o r a b x) (-> (and (is_diameter a b o r) (!= x a) (!= x b)) (and (<-> (> (euclid_angle a x b) (/ pi 2)) (< (dist_of x o) r)) (<-> (< (euclid_angle a x b) (/ pi 2)) (> (dist_of x o) r)))))
  hard_negative:
    statement: 円の任意の弦$AB$について、円の内部の点$X$から見た$\angle AXB$は$\pi/2$より大きい。
    reason: 単位円で$A=(1,0)$、$B=(0,1)$、$X=(-9/10,0)$とすると、$X$は内部にあるが$X-A$と$X-B$の内積は正で、角は鋭角である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B X : P), s.IsDiameter A B → X ≠ A → X ≠ B → (Real.pi / 2 < EuclideanGeometry.angle A X B ↔ dist X s.center < s.radius) ∧ (EuclideanGeometry.angle A X B < Real.pi / 2 ↔ s.radius < dist X s.center)
  proof: |
    by
      intro V P _ _ _ _ s A B X h hXA hXB
      have hA : dist A s.center = s.radius := h.left_mem
      have hr : 0 ≤ s.radius := hA ▸ dist_nonneg
      have hc : s.center = midpoint ℝ A B := h.midpoint_eq_center.symm
      have hopp : B -ᵥ s.center = -(A -ᵥ s.center) := by
        rw [hc, left_vsub_midpoint, right_vsub_midpoint, ← smul_neg, neg_vsub_eq_vsub_rev]
      have hnA : ‖A -ᵥ s.center‖ = s.radius := by rw [← dist_eq_norm_vsub V, hA]
      have hd : dist X s.center = ‖X -ᵥ s.center‖ := dist_eq_norm_vsub V _ _
      have hin : inner ℝ (A -ᵥ X) (B -ᵥ X) = dist X s.center ^ 2 - s.radius ^ 2 := by
        rw [← vsub_sub_vsub_cancel_right A X s.center, ← vsub_sub_vsub_cancel_right B X s.center, hopp, hd, ← hnA]
        simp only [inner_sub_left, inner_sub_right, inner_neg_left, inner_neg_right, real_inner_self_eq_norm_sq]
        rw [real_inner_comm (A -ᵥ s.center) (X -ᵥ s.center)]
        ring
      have hk : 0 < ‖A -ᵥ X‖ * ‖B -ᵥ X‖ := mul_pos (norm_pos_iff.mpr (vsub_ne_zero.mpr hXA.symm)) (norm_pos_iff.mpr (vsub_ne_zero.mpr hXB.symm))
      have hcos : Real.cos (EuclideanGeometry.angle A X B) * (‖A -ᵥ X‖ * ‖B -ᵥ X‖) = dist X s.center ^ 2 - s.radius ^ 2 := by
        rw [← hin]; exact InnerProductGeometry.cos_angle_mul_norm_mul_norm _ _
      have h0 := EuclideanGeometry.angle_nonneg A X B
      have h1 := EuclideanGeometry.angle_le_pi A X B
      have hdn : 0 ≤ dist X s.center := dist_nonneg
      have hpi := Real.pi_pos
      rcases lt_trichotomy (EuclideanGeometry.angle A X B) (Real.pi / 2) with hlt | heq | hgt
      · have hc' : 0 < Real.cos (EuclideanGeometry.angle A X B) := Real.cos_pos_of_mem_Ioo ⟨by linarith, hlt⟩
        have : s.radius < dist X s.center := by
          have := mul_pos hc' hk
          nlinarith
        exact ⟨⟨fun h' => by linarith, fun h' => by linarith⟩, ⟨fun _ => this, fun _ => hlt⟩⟩
      · rw [heq, Real.cos_pi_div_two, zero_mul] at hcos
        have : dist X s.center = s.radius := by nlinarith
        rw [heq, this]
        simp
      · have hc' : Real.cos (EuclideanGeometry.angle A X B) < 0 := Real.cos_neg_of_pi_div_two_lt_of_lt hgt (by linarith)
        have : dist X s.center < s.radius := by
          have := mul_neg_of_neg_of_pos hc' hk
          nlinarith
        exact ⟨⟨fun _ => this, fun _ => hgt⟩, ⟨fun h' => by linarith, fun h' => by linarith⟩⟩
- id: two_right_angles_on_segment_concyclic
  kind: gap
  level: high
  topic: 円・直角と共円
  statement: 実内積空間上のアフィン空間で、点$X,Y$がともに$A,B$と異なり、$\angle AXB=\angle AYB=\pi/2$ならば、$A,B,X,Y$は同一球面上（平面なら同一円周上）にある。$X,Y$の位置に関する条件はいらない。
  statement_en: If X, Y are different from A, B and ∠AXB = ∠AYB = π/2, then A, B, X, Y lie on a common sphere (a common circle in the plane), with no condition on the sides of X and Y.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $X,Y$は$A,B$と異なる
  - $\angle AXB=\pi/2$
  - $\angle AYB=\pi/2$
  quantifiers:
  - 任意の点$A,B,X,Y$
  conclusion: $A,B,X,Y$は同一球面上にある。
  answer: |
    実内積空間上のアフィン空間の点$A,B,X,Y$について、$X,Y$は$A,B$と異なり、$\angle AXB=\angle AYB=\pi/2$とする。$M$を$A,B$の中点とし、$r=|AB|/2$とする。
    $U$を$X$または$Y$とする。$a=A-M$、$u=U-M$とおくと$B-M=-a$であり、$0=\langle A-U,B-U\rangle=\|u\|^2-\|a\|^2$である。よって$|UM|=\|a\|=r$である。$A,B$も$M$から距離$r$にあるので、4点は中心$M$、半径$r$の球面の上にある。
  strategy: A right angle over AB places the vertex on the sphere with diameter AB.
  sketch:
  - 'setup: Let M be the midpoint of AB and r = |AB|/2.'
  - 'derive: For U = X or Y the right angle gives |UM| = r.'
  - 'conclude: A, B, X, Y all lie on the sphere with center M and radius r.'
  openmath: (forall (a b x y) (-> (and (!= x a) (!= x b) (!= y a) (!= y b) (= (euclid_angle a x b) (/ pi 2)) (= (euclid_angle a y b) (/ pi 2))) (cospherical_points (set a b x y))))
  hard_negative:
    statement: $\angle AXB=\angle AYB$であれば、角が直角でなくても側の条件なしに$A,B,X,Y$は同一円周上にある。
    reason: $A=(-1,0)$、$B=(1,0)$、$X=(0,2)$、$Y=(0,-2)$では角は等しいが、$A,B,X$を通る円の上に$Y$はない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B X Y : P), X ≠ A → X ≠ B → Y ≠ A → Y ≠ B → EuclideanGeometry.angle A X B = Real.pi / 2 → EuclideanGeometry.angle A Y B = Real.pi / 2 → EuclideanGeometry.Cospherical ({A, B, X, Y} : Set P)
  proof: |
    by
      intro V P _ _ _ _ A B X Y _ _ _ _ hX hY
      have hd := EuclideanGeometry.Sphere.isDiameter_ofDiameter A B
      refine EuclideanGeometry.cospherical_iff_exists_sphere.mpr ⟨EuclideanGeometry.Sphere.ofDiameter A B, ?_⟩
      intro p hp
      simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hp
      rcases hp with rfl | rfl | rfl | rfl
      · exact hd.left_mem
      · exact hd.right_mem
      · exact (EuclideanGeometry.Sphere.angle_eq_pi_div_two_iff_mem_sphere_of_isDiameter hd).mp hX
      · exact (EuclideanGeometry.Sphere.angle_eq_pi_div_two_iff_mem_sphere_of_isDiameter hd).mp hY
- id: altitude_to_diameter_geometric_mean
  kind: gap
  level: high
  topic: 円・直径への垂線
  statement: 実内積空間上のアフィン空間で、$AB$を直径とする球面（平面なら円）の上の点$X$から直線$AB$に下ろした垂線の足を$H$とすると、$XH^2=HA\cdot HB$である。
  statement_en: If AB is a diameter of a sphere (a circle in the plane), X lies on it, and H is the foot of the perpendicular from X to line AB, then |XH|^2 = |HA||HB|.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $AB$は球面$s$の直径である
  - $X\in s$
  - $H$は直線$AB$上にあり、$X-H$は$B-A$に直交する
  quantifiers:
  - 任意の球面$s$と点$A,B,X,H$
  conclusion: $XH^2=HA\cdot HB$である。
  answer: |
    実内積空間上のアフィン空間で、$AB$を直径とする中心$O$、半径$r$の球面の上に点$X$をとり、$H$を直線$AB$上の点で$\langle X-H,B-A\rangle=0$を満たすものとする。
    $u=A-O$とおくと$B-O=-u$、$\|u\|=r$である。$H$は直線$AB$上にあるので$H-O=tu$となる実数$t$がある。$H-O$は$B-A=-2u$の実数倍なので$\langle X-H,H-O\rangle=0$である。三平方の定理より$r^2=XO^2=XH^2+HO^2$である。
    一方、$HA\cdot HB=\|tu-u\|\|tu+u\|=|t^2-1|r^2$であり、$HO^2=t^2r^2$である。$r^2-HO^2=XH^2\geq0$より$(1-t^2)r^2\geq0$なので、$HA\cdot HB=(1-t^2)r^2=r^2-HO^2=XH^2$である。
  strategy: Combine the Pythagorean theorem at H with the power of H with respect to the sphere.
  sketch:
  - 'setup: Let O be the center and write H-O as t(A-O).'
  - 'derive: Since XH is perpendicular to AB, r^2 = |XH|^2 + |HO|^2.'
  - 'derive: The distances give |HA||HB| = |1-t^2| r^2.'
  - 'derive: The first equation shows (1-t^2) r^2 is nonnegative.'
  - 'conclude: So |HA||HB| = r^2 - |HO|^2 = |XH|^2.'
  openmath: (forall (o r a b x h) (-> (and (is_diameter a b o r) (on_circle x o r) (on_line h a b) (= (inner_product (- x h) (- b a)) 0)) (= (^ (dist_of x h) 2) (* (dist_of h a) (dist_of h b)))))
  hard_negative:
    statement: 直径$AB$上の任意の点$H$と円上の点$X$について$XH^2=HA\cdot HB$である。
    reason: $A=(-1,0)$、$B=(1,0)$、$X=(0,1)$、$H=(1/2,0)$とすると$XH^2=5/4$、$HA\cdot HB=3/4$である。$H$が垂線の足であることが必要である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B X H : P), s.IsDiameter A B → X ∈ s → H ∈ line[ℝ, A, B] → inner ℝ (X -ᵥ H) (B -ᵥ A) = 0 → dist X H ^ 2 = dist H A * dist H B
  proof: |
    by
      intro V P _ _ _ _ s A B X H h hX hH hperp
      have hO : s.center ∈ line[ℝ, A, B] := h.wbtw.mem_affineSpan
      have hsub : H -ᵥ s.center ∈ (line[ℝ, A, B]).direction := AffineSubspace.vsub_mem_direction hH hO
      rw [direction_affineSpan, mem_vectorSpan_pair_rev] at hsub
      obtain ⟨k, hk⟩ := hsub
      have hin : inner ℝ (X -ᵥ H) (H -ᵥ s.center) = 0 := by
        rw [← hk, inner_smul_right, hperp, mul_zero]
      have hpy : dist X s.center ^ 2 = dist X H ^ 2 + dist H s.center ^ 2 := by
        rw [dist_eq_norm_vsub V X s.center, dist_eq_norm_vsub V X H, dist_eq_norm_vsub V H s.center, ← vsub_add_vsub_cancel X H s.center, norm_add_sq_real, hin]
        ring
      have hp := EuclideanGeometry.Sphere.mul_dist_eq_abs_power hH h.left_mem h.right_mem
      have hXr : dist X s.center = s.radius := hX
      rw [hp, EuclideanGeometry.Sphere.power, abs_of_nonpos]
      · rw [hXr] at hpy; linarith
      · rw [hXr] at hpy; nlinarith [sq_nonneg (dist X H)]
- id: cyclic_quadrilateral_opposite_angles_sum_pi
  kind: textbook
  level: high
  topic: 円・内接四角形
  statement: 平面上で、円の上の点$A,B,C,D$について$A\neq C$で、$B,D$が直線$AC$の反対側にある（どちらも直線上にない）とき、$\angle ABC+\angle CDA=\pi$である（内接四角形の対角の和）。
  statement_en: In a Euclidean plane, if A, B, C, D lie on a circle, A ≠ C, and B, D lie strictly on opposite sides of line AC, then ∠ABC + ∠CDA = π.
  assumptions:
  - 点は平面上にある
  - $A,B,C,D$は同じ円の上にある
  - $A\neq C$
  - $B,D$は直線$AC$の反対側にあり、直線上にない
  quantifiers:
  - 任意の円と点$A,B,C,D$
  conclusion: $\angle ABC+\angle CDA=\pi$である。
  answer: |
    平面上の円の上に点$A,B,C,D$をとり、$A\neq C$とする。$B,D$は直線$AC$の反対側にあり、直線上にないとする。4点は相異なる。
    線分$BD$と直線$AC$の交点を$E$とする。$E$は弦$BD$の内点なので円の内部にある。直線$AC$上で円の内部にある点は弦$AC$の内点なので、$E$は$A$と$C$の間に真にあり、$B$と$D$の間に真にもある。
    半直線$BD$は$E$を通るので、$\angle ABC=\angle ABD+\angle DBC$である。同様に$\angle CDA=\angle CDB+\angle BDA$である。
    4点のうち2点を通る直線$AB,BC,CD,DA$のそれぞれについて、残りの2点は$E$と同じ側にある。たとえば直線$DA$について、直線$AC$は直線$DA$と$A$だけで交わり、$E$は$A$から見て$C$と同じ向きにあるので、$C$と$E$は同じ側にある。直線$BD$は直線$DA$と$D$だけで交わり、$E$は$D$から見て$B$と同じ向きにあるので、$B$と$E$は同じ側にある。他の3本も同様である。
    したがって円周角の定理（円の上の$U\neq W$と、直線$UW$の同じ側にある円の上の2点$X,Y$について$\angle UXW=\angle UYW$）より、$\angle ABD=\angle ACD$、$\angle DBC=\angle DAC$、$\angle CDB=\angle CAB$、$\angle BDA=\angle BCA$である。
    これらを足すと$\angle ABC+\angle CDA=(\angle ACD+\angle DAC)+(\angle CAB+\angle BCA)$である。三角形$ACD$と$ABC$の内角の和より、右辺は$(\pi-\angle CDA)+(\pi-\angle ABC)$に等しい。よって$2(\angle ABC+\angle CDA)=2\pi$であり、$\angle ABC+\angle CDA=\pi$である。
  strategy: The diagonals cross inside the circle; split the two angles along the diagonal BD, transfer the parts with the inscribed angle theorem and use the angle sums of triangles ABC and ACD.
  sketch:
  - 'setup: Let E be the crossing point of BD and AC; it lies strictly inside both chords.'
  - 'derive: The ray BD splits angle ABC, and the ray DB splits angle CDA.'
  - 'derive: For each side line of the quadrilateral, the other two vertices lie on the side of E.'
  - 'apply_theorem: The inscribed angle theorem transfers the four parts to angles of triangles ABC and ACD.'
  - 'conclude: The two triangle angle sums give 2(angle ABC + angle CDA) = 2π.'
  openmath: (forall (o r a b c d) (-> (and euclidean_plane_ambient (on_circle a o r) (on_circle b o r) (on_circle c o r) (on_circle d o r) (!= a c) (opposite_side_of_line b d a c)) (= (+ (euclid_angle a b c) (euclid_angle c d a)) pi)))
  hard_negative:
    statement: 円の上の点について、$B,D$が直線$AC$に関して同じ側にあっても$\angle ABC+\angle CDA=\pi$である。
    reason: 単位円で$A=(1,0)$、$C=(0,1)$、$B=(-1,0)$、$D=(0,-1)$とすると、どちらの角も$\pi/4$で、和は$\pi/2$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (s : EuclideanGeometry.Sphere P) (A B C D : P), A ∈ s → B ∈ s → C ∈ s → D ∈ s → A ≠ C → (line[ℝ, A, C]).SOppSide B D → EuclideanGeometry.angle A B C + EuclideanGeometry.angle C D A = Real.pi
  proof: |
    by
      intro V P _ _ _ _ _ s A B C D hA hB hC hD hAC hs
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have hmA := left_mem_affineSpan_pair ℝ A C
      have hmC := right_mem_affineSpan_pair ℝ A C
      have hBA : B ≠ A := fun h => hs.2.1 (h ▸ hmA)
      have hBC : B ≠ C := fun h => hs.2.1 (h ▸ hmC)
      have hDA : D ≠ A := fun h => hs.2.2 (h ▸ hmA)
      have hDC : D ≠ C := fun h => hs.2.2 (h ▸ hmC)
      have hn1 : ¬Collinear ℝ ({A, B, C} : Set P) := fun hcol =>
        hs.2.1 (hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hAC)
      have hn2 : ¬Collinear ℝ ({C, D, A} : Set P) := fun hcol =>
        hs.2.2 (hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hAC)
      have h2 := EuclideanGeometry.Sphere.two_zsmul_oangle_eq hA hB hD hC hBA hBC hDA hDC
      have hsign := hs.oangle_sign_eq_neg hmA hmC
      have hsign' : (EuclideanGeometry.oangle C D A).sign = (EuclideanGeometry.oangle A B C).sign := by
        rw [EuclideanGeometry.oangle_rev, Real.Angle.sign_neg, hsign, neg_neg]
      have hsum : (2 : ℤ) • (EuclideanGeometry.oangle A B C + EuclideanGeometry.oangle C D A) = 0 := by
        rw [smul_add, h2, EuclideanGeometry.oangle_rev A D C, smul_neg]; simp
      have hx0 := EuclideanGeometry.angle_pos_of_not_collinear hn1
      have hx1 := EuclideanGeometry.angle_lt_pi_of_not_collinear hn1
      have hy0 := EuclideanGeometry.angle_pos_of_not_collinear hn2
      have hy1 := EuclideanGeometry.angle_lt_pi_of_not_collinear hn2
      set x := EuclideanGeometry.angle A B C with hx
      set y := EuclideanGeometry.angle C D A with hy
      have key : (2 : ℤ) • (((x + y : ℝ)) : Real.Angle) = 0 → x + y = Real.pi := by
        intro h
        rw [Real.Angle.two_zsmul_eq_zero_iff] at h
        have hθ : ((x + y - Real.pi : ℝ) : Real.Angle).toReal = x + y - Real.pi :=
          Real.Angle.toReal_coe_eq_self_iff.mpr ⟨by linarith, by linarith⟩
        rcases h with h | h
        · exfalso
          have : ((x + y - Real.pi : ℝ) : Real.Angle) = (Real.pi : Real.Angle) := by
            rw [Real.Angle.coe_sub, h]; simp
          rw [this, Real.Angle.toReal_pi] at hθ
          linarith
        · have : ((x + y - Real.pi : ℝ) : Real.Angle) = 0 := by
            rw [Real.Angle.coe_sub, h]; simp
          rw [this, Real.Angle.toReal_zero] at hθ
          linarith
      apply key
      rcases hc : (EuclideanGeometry.oangle A B C).sign with _ | _ | _
      · exfalso
        exact hn1 (EuclideanGeometry.oangle_sign_eq_zero_iff_collinear.mp hc)
      · have ea := EuclideanGeometry.oangle_eq_neg_angle_of_sign_eq_neg_one hc
        have eb := EuclideanGeometry.oangle_eq_neg_angle_of_sign_eq_neg_one (hsign'.trans hc)
        rw [ea, eb] at hsum
        rw [Real.Angle.coe_add]
        rw [← neg_add, smul_neg, neg_eq_zero] at hsum
        exact hsum
      · have ea := EuclideanGeometry.oangle_eq_angle_of_sign_eq_one hc
        have eb := EuclideanGeometry.oangle_eq_angle_of_sign_eq_one (hsign'.trans hc)
        rw [ea, eb] at hsum
        rw [Real.Angle.coe_add]
        exact hsum
- id: cyclic_quadrilateral_opposite_angles_converse
  kind: textbook
  level: high
  topic: 円・内接四角形の逆
  statement: 平面上で、$A\neq C$とし、点$B,D$が直線$AC$の反対側にある（どちらも直線上にない）とする。$\angle ABC+\angle CDA=\pi$ならば、$A,B,C,D$は同一円周上にある。
  statement_en: In a Euclidean plane, if A ≠ C, B and D lie strictly on opposite sides of line AC, and ∠ABC + ∠CDA = π, then A, B, C, D lie on a common circle.
  assumptions:
  - 点は平面上にある
  - $A\neq C$
  - $B,D$は直線$AC$の反対側にあり、直線上にない
  - $\angle ABC+\angle CDA=\pi$
  quantifiers:
  - 任意の点$A,B,C,D$
  conclusion: $A,B,C,D$は同一円周上にある。
  answer: |
    平面上の点$A,B,C,D$について$A\neq C$とし、$B,D$は直線$AC$の反対側にあり直線上になく、$\angle ABC+\angle CDA=\pi$とする。
    $A,B,C$は一直線上にないので、この3点を通る円$\Gamma$がある。$A,C$の中点を$M$とする。$M$は$\Gamma$の内部にあるので、半直線$MD$は$\Gamma$と1点$D'$で交わる。$D'$は直線$AC$に関して$D$と同じ側にあり、$B$と反対側にある。
    内接四角形の対角の和の定理（円の上の$A\neq C$と、直線$AC$の反対側にある円の上の2点$B,D'$について$\angle ABC+\angle CD'A=\pi$）より、$\angle CD'A=\pi-\angle ABC=\angle CDA$である。
    $D,D'$は直線$AC$の同じ側にあるので、円周角の定理の逆（$A\neq C$で、直線$AC$の同じ側にある2点$D,D'$について$\angle ADC=\angle AD'C$ならば$A,C,D,D'$は同一円周上にある）より、$D$は$A,C,D'$を通る円の上にある。この3点は一直線上にないので、これらを通る円は$\Gamma$だけである。よって$A,B,C,D$は$\Gamma$の上にある。
  strategy: Take a point D' of the circle ABC on the side of D; the direct theorem gives equal angles at D and D', and the converse of the inscribed angle theorem finishes.
  sketch:
  - 'setup: Take the circle through A, B, C and the point D'' where the ray from the midpoint of AC through D meets it.'
  - 'apply_theorem: The opposite angle theorem gives angle ABC + angle CD''A = π.'
  - 'derive: The hypothesis then gives angle CD''A = angle CDA.'
  - 'apply_theorem: The converse of the inscribed angle theorem puts D on the circle through A, C, D''.'
  - 'conclude: That circle is the circle through A, B, C.'
  openmath: (forall (a b c d) (-> (and euclidean_plane_ambient (!= a c) (opposite_side_of_line b d a c) (= (+ (euclid_angle a b c) (euclid_angle c d a)) pi)) (cospherical_points (set a b c d))))
  hard_negative:
    statement: $B,D$が直線$AC$に関して同じ側にあっても、$\angle ABC+\angle CDA=\pi$ならば4点は同一円周上にある。
    reason: $A=(-1,0)$、$C=(1,0)$、$B=(0,1/\sqrt3)$、$D=(0,\sqrt3)$とすると角は$2\pi/3$と$\pi/3$で和は$\pi$だが、$A,C,D$を通る円の中心は$B$なので$B$は円上にない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (A B C D : P), A ≠ C → (line[ℝ, A, C]).SOppSide B D → EuclideanGeometry.angle A B C + EuclideanGeometry.angle C D A = Real.pi → EuclideanGeometry.Cospherical ({A, B, C, D} : Set P)
  proof: |
    by
      intro V P _ _ _ _ _ A B C D hAC hs hsum
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have hmA := left_mem_affineSpan_pair ℝ A C
      have hmC := right_mem_affineSpan_pair ℝ A C
      have hn1 : ¬Collinear ℝ ({A, B, C} : Set P) := fun hcol =>
        hs.2.1 (hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hAC)
      have hsign := hs.oangle_sign_eq_neg hmA hmC
      have hsign' : (EuclideanGeometry.oangle C D A).sign = (EuclideanGeometry.oangle A B C).sign := by
        rw [EuclideanGeometry.oangle_rev, Real.Angle.sign_neg, hsign, neg_neg]
      have hpi : (2 : ℤ) • ((EuclideanGeometry.angle A B C : Real.Angle) + (EuclideanGeometry.angle C D A : Real.Angle)) = 0 := by
        rw [← Real.Angle.coe_add, hsum, Real.Angle.two_zsmul_coe_pi]
      have hc : EuclideanGeometry.Cospherical ({A, B, D, C} : Set P) := by
        refine EuclideanGeometry.cospherical_of_two_zsmul_oangle_eq_of_not_collinear ?_ hn1
        have h0 : (2 : ℤ) • (EuclideanGeometry.oangle A B C + EuclideanGeometry.oangle C D A) = 0 := by
          rcases hc : (EuclideanGeometry.oangle A B C).sign with _ | _ | _
          · exfalso
            exact hn1 (EuclideanGeometry.oangle_sign_eq_zero_iff_collinear.mp hc)
          · have ea := EuclideanGeometry.oangle_eq_neg_angle_of_sign_eq_neg_one hc
            have eb := EuclideanGeometry.oangle_eq_neg_angle_of_sign_eq_neg_one (hsign'.trans hc)
            rw [ea, eb, ← neg_add, smul_neg, hpi, neg_zero]
          · have ea := EuclideanGeometry.oangle_eq_angle_of_sign_eq_one hc
            have eb := EuclideanGeometry.oangle_eq_angle_of_sign_eq_one (hsign'.trans hc)
            rw [ea, eb, hpi]
        rw [smul_add, EuclideanGeometry.oangle_rev A D C, smul_neg] at h0
        exact eq_of_sub_eq_zero (by rw [sub_eq_add_neg]; exact h0)
      exact hc.subset (by intro x; simp only [Set.mem_insert_iff, Set.mem_singleton_iff]; tauto)
- id: cyclic_quadrilateral_exterior_angle
  kind: gap
  level: high
  topic: 円・内接四角形の外角
  statement: 平面上で、円の上の点$A,B,C,D$について$B\neq D$で、$A,C$が直線$BD$の反対側にあり（どちらも直線上にない）、点$E$が辺$BC$の$C$の先の延長上にある（$C$が$B$と$E$の間に真にある）とき、$\angle DCE=\angle BAD$である。
  statement_en: In a Euclidean plane, if A, B, C, D lie on a circle, B ≠ D, A and C lie strictly on opposite sides of line BD, and C lies strictly between B and E, then ∠DCE = ∠BAD.
  assumptions:
  - 点は平面上にある
  - $A,B,C,D$は同じ円の上にある
  - $B\neq D$
  - $A,C$は直線$BD$の反対側にあり、直線上にない
  - $C$は$B$と$E$の間に真にある
  quantifiers:
  - 任意の円と点$A,B,C,D,E$
  conclusion: $\angle DCE=\angle BAD$である。
  answer: |
    平面上の円の上に点$A,B,C,D$をとり、$B\neq D$とする。$A,C$は直線$BD$の反対側にあり直線上にないとする。点$E$は、$C$が$B$と$E$の間に真にあるようにとる。
    内接四角形の対角の和の定理（円の上の点で、頂点の組が対角線の反対側にあれば対角の和は$\pi$）を対角線$BD$に用いると、$\angle BAD+\angle DCB=\pi$である。
    $C$は$B$と$E$の間にあるので$C-B$と$E-C$は同じ向きであり、$\angle DCB+\angle DCE=\pi$である。2式から$\angle DCE=\angle BAD$である。
  strategy: Combine the opposite-angle theorem with the supplementary angles on the line BE.
  sketch:
  - 'apply_theorem: The opposite angles at A and C sum to π.'
  - 'derive: The angles DCB and DCE sum to π because C lies between B and E.'
  - 'conclude: Subtract to get angle DCE = angle BAD.'
  openmath: (forall (o r a b c d e) (-> (and euclidean_plane_ambient (on_circle a o r) (on_circle b o r) (on_circle c o r) (on_circle d o r) (!= b d) (opposite_side_of_line a c b d) (strictly_between b c e)) (= (euclid_angle d c e) (euclid_angle b a d))))
  hard_negative:
    statement: 円に内接しない四角形でも、外角は隣り合う内角の対角に等しい。
    reason: 直角でない平行四辺形$ABCD$では$\angle DCE=\pi-\angle BCD=\pi-\angle BAD$であり、$\angle BAD\neq\pi/2$なので$\angle BAD$に等しくない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (s : EuclideanGeometry.Sphere P) (A B C D E : P), A ∈ s → B ∈ s → C ∈ s → D ∈ s → B ≠ D → (line[ℝ, B, D]).SOppSide A C → Sbtw ℝ B C E → EuclideanGeometry.angle D C E = EuclideanGeometry.angle B A D
  proof: |
    by
      intro V P _ _ _ _ _ s A B C D E hA hB hC hD hBD hs hE
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have hsum : EuclideanGeometry.angle B A D + EuclideanGeometry.angle D C B = Real.pi := by
        have hmB := left_mem_affineSpan_pair ℝ B D
        have hmD := right_mem_affineSpan_pair ℝ B D
        have hAB : A ≠ B := fun h => hs.2.1 (h ▸ hmB)
        have hAD : A ≠ D := fun h => hs.2.1 (h ▸ hmD)
        have hCB : C ≠ B := fun h => hs.2.2 (h ▸ hmB)
        have hCD : C ≠ D := fun h => hs.2.2 (h ▸ hmD)
        have hn1 : ¬Collinear ℝ ({B, A, D} : Set P) := fun hcol =>
          hs.2.1 (hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hBD)
        have hn2 : ¬Collinear ℝ ({D, C, B} : Set P) := fun hcol =>
          hs.2.2 (hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hBD)
        have h2 := EuclideanGeometry.Sphere.two_zsmul_oangle_eq hB hA hC hD hAB hAD hCB hCD
        have hsign := hs.oangle_sign_eq_neg hmB hmD
        have hsign' : (EuclideanGeometry.oangle D C B).sign = (EuclideanGeometry.oangle B A D).sign := by
          rw [EuclideanGeometry.oangle_rev, Real.Angle.sign_neg, hsign, neg_neg]
        have hsum : (2 : ℤ) • (EuclideanGeometry.oangle B A D + EuclideanGeometry.oangle D C B) = 0 := by
          rw [smul_add, h2, EuclideanGeometry.oangle_rev B C D, smul_neg]; simp
        have hx0 := EuclideanGeometry.angle_pos_of_not_collinear hn1
        have hx1 := EuclideanGeometry.angle_lt_pi_of_not_collinear hn1
        have hy0 := EuclideanGeometry.angle_pos_of_not_collinear hn2
        have hy1 := EuclideanGeometry.angle_lt_pi_of_not_collinear hn2
        set x := EuclideanGeometry.angle B A D with hx
        set y := EuclideanGeometry.angle D C B with hy
        have key : (2 : ℤ) • (((x + y : ℝ)) : Real.Angle) = 0 → x + y = Real.pi := by
          intro h
          rw [Real.Angle.two_zsmul_eq_zero_iff] at h
          have hθ : ((x + y - Real.pi : ℝ) : Real.Angle).toReal = x + y - Real.pi :=
            Real.Angle.toReal_coe_eq_self_iff.mpr ⟨by linarith, by linarith⟩
          rcases h with h | h
          · exfalso
            have : ((x + y - Real.pi : ℝ) : Real.Angle) = (Real.pi : Real.Angle) := by
              rw [Real.Angle.coe_sub, h]; simp
            rw [this, Real.Angle.toReal_pi] at hθ
            linarith
          · have : ((x + y - Real.pi : ℝ) : Real.Angle) = 0 := by
              rw [Real.Angle.coe_sub, h]; simp
            rw [this, Real.Angle.toReal_zero] at hθ
            linarith
        apply key
        rcases hc : (EuclideanGeometry.oangle B A D).sign with _ | _ | _
        · exfalso
          exact hn1 (EuclideanGeometry.oangle_sign_eq_zero_iff_collinear.mp hc)
        · have ea := EuclideanGeometry.oangle_eq_neg_angle_of_sign_eq_neg_one hc
          have eb := EuclideanGeometry.oangle_eq_neg_angle_of_sign_eq_neg_one (hsign'.trans hc)
          rw [ea, eb] at hsum
          rw [Real.Angle.coe_add]
          rw [← neg_add, smul_neg, neg_eq_zero] at hsum
          exact hsum
        · have ea := EuclideanGeometry.oangle_eq_angle_of_sign_eq_one hc
          have eb := EuclideanGeometry.oangle_eq_angle_of_sign_eq_one (hsign'.trans hc)
          rw [ea, eb] at hsum
          rw [Real.Angle.coe_add]
          exact hsum
      have hpi := EuclideanGeometry.angle_add_angle_eq_pi_of_angle_eq_pi D hE.angle₁₂₃_eq_pi
      linarith
- id: parallel_chords_equal_cross_chords
  kind: gap
  level: high
  topic: 円・平行な弦
  statement: 実内積空間上のアフィン空間で、球面（平面なら円）の上の点$A,B,C,D$について、$A\neq B$、$C\neq D$で直線$AB$と直線$CD$が平行ならば、$AC=BD$である。
  statement_en: If A, B, C, D lie on a sphere (a circle in the plane), A ≠ B, C ≠ D, and lines AB and CD are parallel, then |AC| = |BD|.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $A,B,C,D$は同じ球面の上にある
  - $A\neq B$、$C\neq D$
  - 直線$AB$と直線$CD$は平行である
  quantifiers:
  - 任意の球面と点$A,B,C,D$
  conclusion: $AC=BD$である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面の上に点$A,B,C,D$をとる。$A\neq B$、$C\neq D$で、直線$AB$と$CD$は平行とする。
    $a=A-O$、$c=C-O$、$u=B-A$とおく。平行なので$D-C=ku$となる実数$k$があり、$C\neq D$より$k\neq0$である。
    $\|a+u\|=\|a\|$より$2\langle a,u\rangle+\|u\|^2=0$である。$\|c+ku\|=\|c\|$より$2k\langle c,u\rangle+k^2\|u\|^2=0$であり、$k$で割ると$2\langle c,u\rangle+k\|u\|^2=0$である。
    $A-C=a-c$であり、$B-D=(a-c)+(1-k)u$である。よって
    $BD^2-AC^2=(1-k)\bigl(2\langle a,u\rangle-2\langle c,u\rangle+(1-k)\|u\|^2\bigr)=(1-k)\bigl(-\|u\|^2+k\|u\|^2+(1-k)\|u\|^2\bigr)=0$である。
  strategy: Expand both distances from the center using that the chords have a common direction.
  sketch:
  - 'setup: Write a = A-O, c = C-O, u = B-A and D-C = ku with k ≠ 0.'
  - 'derive: Equal norms give 2<a,u>+|u|^2 = 0 and 2<c,u>+k|u|^2 = 0.'
  - 'derive: B-D equals (a-c)+(1-k)u.'
  - 'conclude: Expanding gives |BD|^2 - |AC|^2 = 0.'
  openmath: (forall (o r a b c d) (-> (and (on_circle a o r) (on_circle b o r) (on_circle c o r) (on_circle d o r) (!= a b) (!= c d) (parallel_lines a b c d)) (= (dist_of a c) (dist_of b d))))
  hard_negative:
    statement: 同じ円の上の相異なる2弦$AB,CD$について、平行でなくても$AC=BD$である。
    reason: 単位円で$A=(1,0)$、$B=(-1,0)$、$C=(0,1)$、$D=(1,0)$とすると、$AC=\sqrt2$、$BD=2$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B C D : P), A ∈ s → B ∈ s → C ∈ s → D ∈ s → A ≠ B → C ≠ D → (line[ℝ, A, B]).Parallel line[ℝ, C, D] → dist A C = dist B D
  proof: |
    by
      intro V P _ _ _ _ s A B C D hA hB hC hD hAB hCD hpar
      have hdir := hpar.direction_eq
      have hmem : D -ᵥ C ∈ (line[ℝ, A, B]).direction := by
        rw [hdir]
        exact AffineSubspace.vsub_mem_direction (right_mem_affineSpan_pair ℝ C D) (left_mem_affineSpan_pair ℝ C D)
      rw [direction_affineSpan, mem_vectorSpan_pair_rev] at hmem
      obtain ⟨k, hk⟩ := hmem
      have hk0 : k ≠ 0 := by
        rintro rfl
        rw [zero_smul] at hk
        exact hCD (vsub_eq_zero_iff_eq.mp hk.symm).symm
      have hN : ∀ {X : P}, X ∈ s → ‖X -ᵥ s.center‖ ^ 2 = s.radius ^ 2 := by
        intro X hX
        rw [← dist_eq_norm_vsub V, EuclideanGeometry.mem_sphere.mp hX]
      set a := A -ᵥ s.center with ha
      set c := C -ᵥ s.center with hc
      set u := B -ᵥ A with hu
      have hb : B -ᵥ s.center = a + u := by rw [ha, hu, add_comm, vsub_add_vsub_cancel]
      have hd : D -ᵥ s.center = c + k • u := by rw [hc, hk, add_comm, vsub_add_vsub_cancel]
      have e1 := hN hB
      have e2 := hN hD
      rw [hb, norm_add_sq_real, hN hA] at e1
      rw [hd, norm_add_sq_real, inner_smul_right, norm_smul, mul_pow, Real.norm_eq_abs, sq_abs, ← hN hC] at e2
      have e3 : 2 * inner ℝ c u + k * ‖u‖ ^ 2 = 0 := by
        have : k * (2 * inner ℝ c u + k * ‖u‖ ^ 2) = 0 := by linear_combination e2
        exact (mul_eq_zero.mp this).resolve_left hk0
      have hAC : A -ᵥ C = a - c := (vsub_sub_vsub_cancel_right _ _ _).symm
      have hBD : B -ᵥ D = (a - c) + (1 - k) • u := by
        rw [← vsub_sub_vsub_cancel_right B D s.center, hb, hd]
        module
      rw [dist_eq_norm_vsub V A C, dist_eq_norm_vsub V B D, hAC, hBD]
      refine (sq_eq_sq₀ (norm_nonneg _) (norm_nonneg _)).mp ?_
      rw [norm_add_sq_real, inner_smul_right, norm_smul, mul_pow, Real.norm_eq_abs, sq_abs, inner_sub_left]
      linear_combination (-(1 - k)) * e1 + (1 - k) * e3
- id: chord_eq_two_radius_sin_inscribed_angle
  kind: gap
  level: high
  topic: 円・弦の長さと円周角
  statement: 平面上で、半径$r$の円の上の点$A,B,X$について$A\neq B$、$X\neq A,B$ならば、$AB=2r\sin\angle AXB$である。
  statement_en: In a Euclidean plane, if A, B, X lie on a circle of radius r, A ≠ B and X ≠ A, B, then |AB| = 2r sin∠AXB.
  assumptions:
  - 点は平面上にある
  - $A,B,X$は半径$r$の円の上にある
  - $A\neq B$
  - $X\neq A$、$X\neq B$
  quantifiers:
  - 任意の円と点$A,B,X$
  conclusion: $AB=2r\sin\angle AXB$である。
  answer: |
    平面上の中心$O$、半径$r$の円の上に点$A,B,X$をとり、$A\neq B$、$X\neq A,B$とする。$A\neq B$より$r>0$である。円と直線の共有点は高々2個なので、$X$は直線$AB$上にない。$A$を通る直径のもう一方の端を$A'$とする。$AA'=2r$である。
    $B=A'$のとき、$AB=2r$であり、タレスの定理（直径の両端と異なる円上の点から、その直径を見込む角は$\pi/2$である）より$\angle AXB=\pi/2$である。よって$2r\sin\angle AXB=2r=AB$である。
    $B\neq A'$のとき、$A'$は直線$AB$上になく、タレスの定理より$\angle ABA'=\pi/2$である。直角三角形$ABA'$から$AB=AA'\sin\angle AA'B=2r\sin\angle AA'B$である。
    $X,A'$が直線$AB$の同じ側にあれば、円周角の定理（円の上の$A\neq B$と、直線$AB$の同じ側にある円の上の2点について、$AB$を見込む角は等しい）より$\angle AXB=\angle AA'B$である。$X,A'$が直線$AB$の反対側にあれば、内接四角形の対角の和の定理（円の上の$A\neq B$と、直線$AB$の反対側にある円の上の2点について、$AB$を見込む角の和は$\pi$）より$\angle AXB=\pi-\angle AA'B$である。どちらの場合も$\sin\angle AXB=\sin\angle AA'B$なので、$AB=2r\sin\angle AXB$である。
  strategy: Compare X with the point A' opposite A; the right triangle ABA' gives the formula at A', and the inscribed angle theorem transfers the sine to X.
  sketch:
  - 'setup: Let A'' be the other end of the diameter through A.'
  - 'case_split: If B = A'', then AB = 2r and Thales gives a right angle at X.'
  - 'derive: Otherwise Thales makes ABA'' a right triangle, so |AB| = 2r sin of angle AA''B.'
  - 'case_split: X and A'' on the same side give equal angles; on opposite sides they give supplementary angles.'
  - 'conclude: In both cases the sines agree, so |AB| = 2r sin of angle AXB.'
  openmath: (forall (o r a b x) (-> (and euclidean_plane_ambient (on_circle a o r) (on_circle b o r) (on_circle x o r) (!= a b) (!= x a) (!= x b)) (= (dist_of a b) (* (* 2 r) (sin (euclid_angle a x b))))))
  hard_negative:
    statement: 3次元の半径$r$の球面の上の点$A,B,X$についても$AB=2r\sin\angle AXB$である。
    reason: 大円でない小円の上に3点をとると、その小円の半径を$r'<r$として$AB=2r'\sin\angle AXB$となるので、$AB<2r\sin\angle AXB$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (s : EuclideanGeometry.Sphere P) (A B X : P), A ∈ s → B ∈ s → X ∈ s → A ≠ B → X ≠ A → X ≠ B → dist A B = 2 * s.radius * Real.sin (EuclideanGeometry.angle A X B)
  proof: |
    by
      intro V P _ _ _ _ _ s A B X hA hB hX hAB hXA hXB
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have h := EuclideanGeometry.Sphere.dist_div_sin_oangle_eq_two_mul_radius hA hX hB hXA.symm hAB hXB
      rw [← Real.Angle.sin_toReal, Real.abs_sin_eq_sin_abs_of_abs_le_pi (Real.Angle.abs_toReal_le_pi _), ← EuclideanGeometry.angle_eq_abs_oangle_toReal hXA.symm hXB.symm] at h
      by_cases h0 : Real.sin (EuclideanGeometry.angle A X B) = 0
      · rw [h0, div_zero] at h
        have hr : s.radius = 0 := by linarith
        have h1 : dist A s.center = 0 := by rw [EuclideanGeometry.mem_sphere.mp hA, hr]
        have h2 : dist B s.center = 0 := by rw [EuclideanGeometry.mem_sphere.mp hB, hr]
        exact absurd ((dist_eq_zero.mp h1).trans (dist_eq_zero.mp h2).symm) hAB
      · exact (div_eq_iff h0).mp h
- id: equal_inscribed_angles_equal_chords
  kind: gap
  level: high
  topic: 円・円周角と弦
  statement: 平面上で、同じ円の上の点$A,B,C,D,X,Y$について$A\neq B$、$C\neq D$、$X\neq A,B$、$Y\neq C,D$で、$\angle AXB=\angle CYD$ならば、$AB=CD$である。
  statement_en: In a Euclidean plane, if A, B, C, D, X, Y lie on one circle, A ≠ B, C ≠ D, X ≠ A, B, Y ≠ C, D and ∠AXB = ∠CYD, then |AB| = |CD|.
  assumptions:
  - 点は平面上にある
  - $A,B,C,D,X,Y$は同じ円の上にある
  - $A\neq B$、$C\neq D$
  - $X\neq A,B$、$Y\neq C,D$
  - $\angle AXB=\angle CYD$
  quantifiers:
  - 任意の円と点$A,B,C,D,X,Y$
  conclusion: $AB=CD$である。
  answer: |
    平面上の半径$r$の円の上に点$A,B,C,D,X,Y$をとり、$A\neq B$、$C\neq D$、$X\neq A,B$、$Y\neq C,D$、$\angle AXB=\angle CYD$とする。
    弦の長さと円周角の関係（半径$r$の円の上の点$U,W,Z$が$U\neq W$、$Z\neq U,W$を満たすとき$UW=2r\sin\angle UZW$）を2回用いると、$AB=2r\sin\angle AXB=2r\sin\angle CYD=CD$である。
  strategy: Apply the formula chord = 2r sin(inscribed angle) to both chords.
  sketch:
  - 'apply_theorem: |AB| = 2r sin of angle AXB.'
  - 'apply_theorem: |CD| = 2r sin of angle CYD.'
  - 'conclude: Equal angles give equal chords.'
  openmath: (forall (o r a b c d x y) (-> (and euclidean_plane_ambient (on_circle a o r) (on_circle b o r) (on_circle c o r) (on_circle d o r) (on_circle x o r) (on_circle y o r) (!= a b) (!= c d) (!= x a) (!= x b) (!= y c) (!= y d) (= (euclid_angle a x b) (euclid_angle c y d))) (= (dist_of a b) (dist_of c d))))
  hard_negative:
    statement: 同じ円の上で$AB=CD$ならば$\angle AXB=\angle CYD$である。
    reason: 同じ弦でも反対の弧から見ると補角になる。単位円で$A=C=(1,0)$、$B=D=(0,1)$、$X=(-1,0)$、$Y=(1/\sqrt2,1/\sqrt2)$とすると、角は$\pi/4$と$3\pi/4$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (s : EuclideanGeometry.Sphere P) (A B C D X Y : P), A ∈ s → B ∈ s → C ∈ s → D ∈ s → X ∈ s → Y ∈ s → A ≠ B → C ≠ D → X ≠ A → X ≠ B → Y ≠ C → Y ≠ D → EuclideanGeometry.angle A X B = EuclideanGeometry.angle C Y D → dist A B = dist C D
  proof: |
    by
      intro V P _ _ _ _ _ s A B C D X Y hA hB hC hD hX hY hAB hCD hXA hXB hYC hYD hang
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have key : ∀ U W Z : P, U ∈ s → W ∈ s → Z ∈ s → U ≠ W → Z ≠ U → Z ≠ W → dist U W = 2 * s.radius * Real.sin (EuclideanGeometry.angle U Z W) := by
        intro U W Z hU hW hZ hUW hZU hZW
        have h := EuclideanGeometry.Sphere.dist_div_sin_oangle_eq_two_mul_radius hU hZ hW hZU.symm hUW hZW
        rw [← Real.Angle.sin_toReal, Real.abs_sin_eq_sin_abs_of_abs_le_pi (Real.Angle.abs_toReal_le_pi _), ← EuclideanGeometry.angle_eq_abs_oangle_toReal hZU.symm hZW.symm] at h
        by_cases h0 : Real.sin (EuclideanGeometry.angle U Z W) = 0
        · rw [h0, div_zero] at h
          have hr : s.radius = 0 := by linarith
          have h1 : dist U s.center = 0 := by rw [EuclideanGeometry.mem_sphere.mp hU, hr]
          have h2 : dist W s.center = 0 := by rw [EuclideanGeometry.mem_sphere.mp hW, hr]
          exact absurd ((dist_eq_zero.mp h1).trans (dist_eq_zero.mp h2).symm) hUW
        · exact (div_eq_iff h0).mp h
      rw [key A B X hA hB hX hAB hXA hXB, key C D Y hC hD hY hCD hYC hYD, hang]
- id: chord_midpoint_perpendicular_to_center_line
  kind: gap
  level: middle
  topic: 円・弦の性質
  statement: 実内積空間上のアフィン空間で、中心$O$の球面（平面なら円）の上の点$A,B$について、弦$AB$の中点を$M$とすると$\langle O-M,B-A\rangle=0$である。$A\neq B$かつ$O\neq M$のとき、これは直線$OM$が弦$AB$に垂直であることを意味する。
  statement_en: If A, B lie on a sphere with center O (a circle in the plane) and M is the midpoint of AB, then the inner product of O-M and B-A is zero.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $A,B$は中心$O$の球面の上にある
  - $M$は$A,B$の中点である
  quantifiers:
  - 任意の球面と点$A,B$
  conclusion: $\langle O-M,B-A\rangle=0$である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$の球面の上に点$A,B$をとり、$M$を$A,B$の中点とする。$a=A-O$、$b=B-O$とおくと$\|a\|=\|b\|$である。
    $O-M=-\tfrac12(a+b)$、$B-A=b-a$なので、$\langle O-M,B-A\rangle=-\tfrac12\langle a+b,b-a\rangle=-\tfrac12(\|b\|^2-\|a\|^2)=0$である。
  strategy: Expand the inner product from the center using equal radii.
  sketch:
  - 'setup: Write a = A-O, b = B-O with equal norms.'
  - 'derive: O-M = -(a+b)/2 and B-A = b-a.'
  - 'conclude: The inner product equals (|a|^2-|b|^2)/2 = 0.'
