  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $A,B$は半径$r$の球面の上にある
  quantifiers:
  - 任意の球面と点$A,B$
  conclusion: $AB\leq2r$であり、$AB=2r$と$AB$が直径であることは同値である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面の上に点$A,B$をとる。三角不等式より$AB\leq AO+OB=2r$である。
