    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B : P), A ∈ s → B ∈ s → dist A B ≤ 2 * s.radius ∧ (dist A B = 2 * s.radius ↔ s.IsDiameter A B)
