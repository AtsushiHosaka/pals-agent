  conclusion: 直線$TX$が$T$で接することと$\angle XTO=\pi/2$は同値である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r>0$の球面の上に点$T$をとり、$X\neq T$とする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    $T-O\neq0$、$X-T\neq0$なので、$\angle XTO=\pi/2$は$\langle X-T,O-T\rangle=0$、すなわち$\langle X-T,T-O\rangle=0$と同値である。
    直線$TX$が$T$で接するなら$U=X$としてこの式を得る。逆にこの式が成り立つとする。直線上の点は$U=T+t(X-T)$と書けるので、$\langle U-T,T-O\rangle=t\langle X-T,T-O\rangle=0$である。よって直線$TX$は$T$で接する。
  strategy: Translate the right angle into orthogonality of X-T and T-O and scale along the line.
  sketch:
  - 'translate: The angle is π/2 exactly when X-T is orthogonal to T-O.'
  - 'derive: Tangency gives this by taking U = X.'
  - 'derive: Conversely every point of the line has the form T + t(X-T).'
  - 'conclude: So all points of the line satisfy the orthogonality.'
  openmath: (forall (o r t x) (-> (and (> r 0) (on_circle t o r) (!= x t)) (<-> (tangent_to_circle_at t x o r) (= (euclid_angle x t o) (/ pi 2)))))
  hard_negative:
    statement: 点$T$が円上になくても、$OT$に垂直で$T$を通る直線は円に接する。
    reason: 単位円と$T=(2,0)$では、直線$x=2$は$OT$に垂直だが円と交わらない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (T X : P), 0 < s.radius → T ∈ s → X ≠ T → (s.IsTangentAt T line[ℝ, T, X] ↔ EuclideanGeometry.angle X T s.center = Real.pi / 2)
  proof: |
    by
      intro V P _ _ _ _ s T X _ hT _
      exact EuclideanGeometry.Sphere.IsTangentAt_iff_angle_eq_pi_div_two hT
- id: tangent_iff_unique_common_point
  kind: textbook
  level: middle
  topic: 円・接線の特徴づけ
  statement: 実内積空間上のアフィン空間で、中心$O$の球面（平面なら円）の上の点$T$と点$X\neq T$について、直線$TX$が半径に垂直である意味で$T$で接することと、直線$TX$と球面の共有点が$T$だけであることは同値である。
  statement_en: If T lies on a sphere with center O (a circle in the plane) and X ≠ T, then line TX is orthogonal to the radius at T if and only if T is the only common point of the line and the sphere.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $T$は中心$O$の球面の上にある
  - $X\neq T$
  quantifiers:
  - 任意の球面と点$T,X$
  conclusion: 直線$TX$が$T$で接することと、共有点が$T$だけであることは同値である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$の球面の上に点$T$をとり、$X\neq T$とする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    $v=X-T\neq0$、$x=T-O$とおく。直線上の点$T+tv$が球面上にあることは$\|x+tv\|^2=\|x\|^2$、すなわち$t\bigl(2\langle x,v\rangle+t\|v\|^2\bigr)=0$と同値である。この解は$t=0$と$t=-2\langle x,v\rangle/\|v\|^2$である。
    したがって共有点が$T$だけであることは$\langle x,v\rangle=0$と同値である。また、直線上の点$U=T+tv$について$\langle U-T,x\rangle=t\langle v,x\rangle$なので、$\langle x,v\rangle=0$は直線が$T$で接することと同値である。
  strategy: Solve the quadratic for the parameter of the common points of the line and the sphere.
  sketch:
  - 'setup: Parametrize the line as T + tv with v = X-T.'
  - 'derive: Common points correspond to t(2<x,v> + t|v|^2) = 0 with x = T-O.'
  - 'derive: The only solution is t = 0 exactly when <x,v> = 0.'
  - 'conclude: That condition is the same as orthogonality of the line to the radius.'
  openmath: (forall (o r t x) (-> (and (on_circle t o r) (!= x t)) (<-> (tangent_to_circle_at t x o r) (forall (q) (-> (and (on_line q t x) (on_circle q o r)) (= q t))))))
  hard_negative:
    statement: 点$T$が円上にないとき、直線$TX$上で円に属する点がすべて$T$に等しければ、直線$TX$は$T$で接する。
    reason: 単位円と$T=(2,0)$、$X=(2,1)$では直線は円と交わらないので条件は空虚に成り立つが、$T$は円上にない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (T X : P), T ∈ s → X ≠ T → (s.IsTangentAt T line[ℝ, T, X] ↔ ∀ Q ∈ line[ℝ, T, X], Q ∈ s → Q = T)
  proof: |
    by
      intro V P _ _ _ _ s T X hT _
      constructor
      · intro h Q hQ hQs
        exact h.eq_of_mem_of_mem hQs hQ
      · intro h
        have hsec := h (s.secondInter T (X -ᵥ T)) (s.secondInter_vsub_mem_affineSpan T X) ((EuclideanGeometry.Sphere.secondInter_mem (X -ᵥ T)).mpr hT)
        have hin : inner ℝ (X -ᵥ T) (T -ᵥ s.center) = 0 := EuclideanGeometry.Sphere.secondInter_eq_self_iff.mp hsec
        refine ⟨hT, left_mem_affineSpan_pair ℝ T X, ?_⟩
        rw [affineSpan_le]
        intro p hp
        simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hp
        rcases hp with rfl | rfl
        · exact EuclideanGeometry.Sphere.self_mem_orthRadius s _
        · exact EuclideanGeometry.Sphere.mem_orthRadius_iff_inner_left.mpr hin
- id: tangent_lengths_equal
  kind: textbook
  level: middle
  topic: 円・接線の長さ
  statement: 実内積空間上のアフィン空間で、点$Q$から球面（平面なら円）に引いた2本の接線の接点を$A,B$とする（$Q\neq A,B$）と、$QA=QB$である。
  statement_en: If lines QA and QB are tangent to a sphere (a circle in the plane) at A and B with Q ≠ A, B, then |QA| = |QB|.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $Q\neq A$、$Q\neq B$
  - 直線$QA$は$A$で接する
  - 直線$QB$は$B$で接する
  quantifiers:
  - 任意の球面と点$Q,A,B$
  conclusion: $QA=QB$である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面をとり、$Q\neq A,B$とする。直線$QA$が$A$で、直線$QB$が$B$で接するとする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    $Q-A$は$A-O$に直交するので、三平方の定理より$QO^2=QA^2+AO^2=QA^2+r^2$である。同様に$QO^2=QB^2+r^2$である。よって$QA^2=QB^2$であり、$QA=QB$である。
  strategy: Apply the Pythagorean theorem to the two right triangles with hypotenuse QO.
  sketch:
  - 'derive: Tangency at A gives |QO|^2 = |QA|^2 + r^2.'
  - 'derive: Tangency at B gives |QO|^2 = |QB|^2 + r^2.'
  - 'conclude: So |QA| = |QB|.'
  openmath: (forall (o r q a b) (-> (and (!= q a) (!= q b) (tangent_to_circle_at a q o r) (tangent_to_circle_at b q o r)) (= (dist_of q a) (dist_of q b))))
  hard_negative:
    statement: 同じ点$Q$から異なる2円に引いた接線の長さは等しい。
    reason: $Q=(3,0)$から原点中心の半径$1$の円への接線の長さは$\sqrt8$、半径$2$の円への接線の長さは$\sqrt5$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (Q A B : P), Q ≠ A → Q ≠ B → s.IsTangentAt A line[ℝ, Q, A] → s.IsTangentAt B line[ℝ, Q, B] → dist Q A = dist Q B
  proof: |
    by
      intro V P _ _ _ _ s Q A B _ _ hA hB
      exact hA.dist_eq_of_mem_of_mem hB (left_mem_affineSpan_pair ℝ Q A) (left_mem_affineSpan_pair ℝ Q B)
- id: tangent_iff_length_sq_eq_power
  kind: gap
  level: high
  topic: 円・接線と方べきの値
  statement: 実内積空間上のアフィン空間で、中心$O$、半径$r$の球面（平面なら円）の上の点$T$と点$Q\neq T$について、直線$QT$が$T$で接することと$QT^2=QO^2-r^2$は同値である。
  statement_en: If T lies on a sphere with center O and radius r (a circle in the plane) and Q ≠ T, then line QT is tangent at T if and only if |QT|^2 = |QO|^2 - r^2.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $T$は中心$O$、半径$r$の球面の上にある
  - $Q\neq T$
  quantifiers:
  - 任意の球面と点$Q,T$
  conclusion: 直線$QT$が$T$で接することと$QT^2=QO^2-r^2$は同値である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面の上に点$T$をとり、$Q\neq T$とする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    $Q-O=(Q-T)+(T-O)$と$\|T-O\|=r$より、$QO^2=QT^2+2\langle Q-T,T-O\rangle+r^2$である。よって$QT^2=QO^2-r^2$は$\langle Q-T,T-O\rangle=0$と同値である。
    直線$QT$が$T$で接するならこの内積は$0$である。逆に内積が$0$なら、直線上の点は$U=T+t(Q-T)$と書けて$\langle U-T,T-O\rangle=t\langle Q-T,T-O\rangle=0$である。よって直線$QT$は$T$で接する。
  strategy: Expand |QO|^2 through T; the cross term vanishes exactly at tangency.
  sketch:
  - 'derive: |QO|^2 = |QT|^2 + 2<Q-T,T-O> + r^2.'
  - 'translate: The stated equation means <Q-T,T-O> = 0.'
  - 'conclude: That orthogonality is equivalent to tangency of the line QT at T.'
  openmath: (forall (o r q t) (-> (and (on_circle t o r) (!= q t)) (<-> (tangent_to_circle_at t q o r) (= (^ (dist_of q t) 2) (- (^ (dist_of q o) 2) (^ r 2))))))
  hard_negative:
    statement: 点$T$が円上になくても、$QT^2=QO^2-r^2$ならば直線$QT$は$T$で接する。
    reason: 単位円で$Q=(1,1)$、$T=(1,2)$とすると$QT^2=1=QO^2-r^2$だが、$T$は円上にない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (Q T : P), T ∈ s → Q ≠ T → (s.IsTangentAt T line[ℝ, Q, T] ↔ dist Q T ^ 2 = dist Q s.center ^ 2 - s.radius ^ 2)
  proof: |
    by
      intro V P _ _ _ _ s Q T hT _
      exact EuclideanGeometry.Sphere.isTangentAt_iff_dist_sq_eq_power hT
- id: tangents_center_line_bisects_angles
  kind: gap
  level: middle
  topic: 円・接線と中心線
  statement: 実内積空間上のアフィン空間で、点$Q$から中心$O$の球面（平面なら円）に引いた2本の接線の接点を$A,B$とする（$Q\neq A,B$）と、$\angle AQO=\angle BQO$かつ$\angle AOQ=\angle BOQ$である。
  statement_en: If lines QA and QB are tangent at A and B to a sphere with center O (a circle in the plane) and Q ≠ A, B, then ∠AQO = ∠BQO and ∠AOQ = ∠BOQ.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $Q\neq A$、$Q\neq B$
  - 直線$QA$は$A$で接する
  - 直線$QB$は$B$で接する
  quantifiers:
  - 任意の球面と点$Q,A,B$
  conclusion: $\angle AQO=\angle BQO$かつ$\angle AOQ=\angle BOQ$である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面をとり、$Q\neq A,B$とする。直線$QA$が$A$で、直線$QB$が$B$で接するとする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    $r=0$なら$A=B=O$なので結論は明らかである。$r>0$とする。三平方の定理より$QA^2=QO^2-r^2=QB^2$なので$QA=QB$である。また$OA=OB=r$で、$QO$は共通である。3辺が等しいので三角形$AQO$と$BQO$は合同である。対応する角が等しいので、$\angle AQO=\angle BQO$、$\angle AOQ=\angle BOQ$である。
  strategy: The triangles AQO and BQO are congruent by three sides.
  sketch:
  - 'derive: Equal tangent lengths give |QA| = |QB|.'
  - 'derive: |OA| = |OB| = r and QO is common.'
  - 'apply_theorem: The triangles AQO and BQO are congruent by SSS.'
  - 'conclude: Corresponding angles are equal.'
  openmath: (forall (o r q a b) (-> (and (!= q a) (!= q b) (tangent_to_circle_at a q o r) (tangent_to_circle_at b q o r)) (and (= (euclid_angle a q o) (euclid_angle b q o)) (= (euclid_angle a o q) (euclid_angle b o q)))))
  hard_negative:
    statement: 同じ設定で$\angle AQO=\angle AOQ$である。
    reason: $QO=2r$のとき$\angle AQO=\pi/6$、$\angle AOQ=\pi/3$である。等しいのは$A$側と$B$側の対応する角である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (Q A B : P), Q ≠ A → Q ≠ B → s.IsTangentAt A line[ℝ, Q, A] → s.IsTangentAt B line[ℝ, Q, B] → EuclideanGeometry.angle A Q s.center = EuclideanGeometry.angle B Q s.center ∧ EuclideanGeometry.angle A s.center Q = EuclideanGeometry.angle B s.center Q
  proof: |
    by
      intro V P _ _ _ _ s Q A B _ _ hA hB
      have h1 : dist A Q = dist B Q := by
        rw [dist_comm A, dist_comm B]
        exact hA.dist_eq_of_mem_of_mem hB (left_mem_affineSpan_pair ℝ Q A) (left_mem_affineSpan_pair ℝ Q B)
      have h2 : dist s.center A = dist s.center B := by
        rw [EuclideanGeometry.mem_sphere'.mp hA.mem_sphere, EuclideanGeometry.mem_sphere'.mp hB.mem_sphere]
      have hc := EuclideanGeometry.side_side_side h1 rfl h2
      exact ⟨EuclideanGeometry.angle_eq_of_congruent hc 0 1 2, EuclideanGeometry.angle_eq_of_congruent hc 0 2 1⟩
- id: contact_chord_perpendicular_bisected_by_center_line
  kind: gap
  level: high
  topic: 円・接点を結ぶ弦
  statement: 平面上で、中心$O$、半径$r>0$の円に点$Q$から引いた2本の接線の相異なる接点を$A,B$とする（$Q\neq A,B$）と、直線$QO$は弦$AB$に垂直で、弦$AB$の中点を通る。
  statement_en: In a Euclidean plane, if lines QA and QB are tangent at distinct points A and B to a circle with center O and radius r > 0, and Q ≠ A, B, then QO is perpendicular to AB and the midpoint of AB lies on line QO.
  assumptions:
  - 点は平面上にある
  - $r>0$
  - $A\neq B$
  - $Q\neq A$、$Q\neq B$
  - 直線$QA$は$A$で接する
  - 直線$QB$は$B$で接する
  quantifiers:
  - 任意の円と点$Q,A,B$
  conclusion: $\langle Q-O,B-A\rangle=0$であり、$A,B$の中点は直線$QO$上にある。
  answer: |
    平面上の中心$O$、半径$r>0$の円をとる。$A\neq B$、$Q\neq A,B$で、直線$QA$が$A$で、直線$QB$が$B$で接するとする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    三平方の定理より$QA^2=QO^2-r^2=QB^2$なので$QA=QB$である。$M$を$A,B$の中点とする。$Q,O,M$はいずれも$A,B$から等距離にある。一般に$Y$が$A,B$から等距離なら、$y=Y-M$、$a=A-M$として$\|y-a\|=\|y+a\|$より$\langle y,a\rangle=0$なので、$Y-M$は$B-A$に直交する。これを$Y=Q,O$に用いると$\langle Q-O,B-A\rangle=0$である。
    また$Q-M$と$O-M$はどちらも$B-A$に直交する。平面で$0$でないベクトルに直交するベクトルは1次元の空間をなす。$Q$は接線上の接点以外の点なので$QO^2=QA^2+r^2>r^2$であり、$Q\neq O$である。したがって$M$は$Q,O$を通る直線上にある。
  strategy: Q, O and the midpoint are all equidistant from A and B, and in the plane the set of such points is a line.
  sketch:
  - 'derive: Equal tangent lengths give |QA| = |QB|.'
  - 'derive: Any point equidistant from A and B has Z-M orthogonal to B-A.'
  - 'derive: So Q-O is orthogonal to B-A.'
  - 'translate: In the plane, vectors orthogonal to B-A form a line.'
  - 'conclude: Since Q ≠ O, the midpoint lies on line QO.'
  openmath: (forall (o r q a b) (-> (and euclidean_plane_ambient (> r 0) (!= a b) (!= q a) (!= q b) (tangent_to_circle_at a q o r) (tangent_to_circle_at b q o r)) (and (perpendicular_lines q o a b) (on_line (midpoint_of a b) q o))))
  hard_negative:
    statement: 3次元の球面に点$Q$から引いた2本の接線の接点$A,B$について、弦$AB$の中点は常に直線$QO$上にある。
    reason: 接点全体は直線$QO$を軸とする円をなす。その円の直径でない弦$AB$の中点は軸の上にない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (s : EuclideanGeometry.Sphere P) (Q A B : P), 0 < s.radius → A ≠ B → Q ≠ A → Q ≠ B → s.IsTangentAt A line[ℝ, Q, A] → s.IsTangentAt B line[ℝ, Q, B] → inner ℝ (Q -ᵥ s.center) (B -ᵥ A) = 0 ∧ midpoint ℝ A B ∈ line[ℝ, Q, s.center]
  proof: |
    by
      intro V P _ _ _ _ _ s Q A B _ hAB _ _ hA hB
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have hQ : dist Q A = dist Q B := hA.dist_eq_of_mem_of_mem hB (left_mem_affineSpan_pair ℝ Q A) (left_mem_affineSpan_pair ℝ Q B)
      have hO : dist A s.center = dist B s.center := by
        rw [EuclideanGeometry.mem_sphere.mp hA.mem_sphere, EuclideanGeometry.mem_sphere.mp hB.mem_sphere]
      have hQ' : dist A Q = dist B Q := by rw [dist_comm A, dist_comm B]; exact hQ
      have h1 : inner ℝ (Q -ᵥ s.center) (B -ᵥ A) = 0 := EuclideanGeometry.inner_vsub_vsub_of_dist_eq_of_dist_eq hO hQ'
      refine ⟨h1, ?_⟩
      have h2 : inner ℝ (midpoint ℝ A B -ᵥ s.center) (B -ᵥ A) = 0 := EuclideanGeometry.inner_vsub_vsub_of_dist_eq_of_dist_eq hO (dist_left_midpoint_eq_dist_right_midpoint A B)
      have hne : B -ᵥ A ≠ 0 := vsub_ne_zero.mpr hAB.symm
      have hOQ : Q ≠ s.center := by
        intro h
        have := hA.radius_lt_dist_center (left_mem_affineSpan_pair ℝ Q A) ‹Q ≠ A›
        rw [h, dist_self] at this
        linarith
      let o : Orientation ℝ V (Fin 2) := Module.Oriented.positiveOrientation
      have r1 := (o.inner_eq_zero_iff_eq_zero_or_eq_smul_rotation_pi_div_two (x := B -ᵥ A) (y := Q -ᵥ s.center)).mp (by rw [real_inner_comm]; exact h1)
      have r2 := (o.inner_eq_zero_iff_eq_zero_or_eq_smul_rotation_pi_div_two (x := B -ᵥ A) (y := midpoint ℝ A B -ᵥ s.center)).mp (by rw [real_inner_comm]; exact h2)
      obtain ⟨a, ha⟩ := r1.resolve_left hne
      obtain ⟨b, hb⟩ := r2.resolve_left hne
      have ha0 : a ≠ 0 := by
        rintro rfl
        rw [zero_smul] at ha
        exact hOQ (vsub_eq_zero_iff_eq.mp ha.symm)
      have : midpoint ℝ A B = AffineMap.lineMap Q s.center (1 - b / a) := by
        have e1 : midpoint ℝ A B -ᵥ Q = (midpoint ℝ A B -ᵥ s.center) - (Q -ᵥ s.center) := (vsub_sub_vsub_cancel_right _ _ _).symm
        have e2 : s.center -ᵥ Q = -(Q -ᵥ s.center) := (neg_vsub_eq_vsub_rev _ _).symm
        have e3 : (1 - b / a) * a = a - b := by field_simp
        rw [AffineMap.lineMap_apply, eq_vadd_iff_vsub_eq, e1, e2, ← hb, ← ha, smul_neg, smul_smul, e3]
        module
      rw [this]
      exact AffineMap.lineMap_mem_affineSpan_pair _ _ _
- id: tangent_chord_angle
  kind: named
  level: high
  topic: 円・接弦定理
  statement: 平面上で、円の上の点$A,B,C$について$A\neq B$とし、直線$AT$が$A$で円に接し、$T,C$が直線$AB$の反対側にある（どちらも直線上にない）とき、$\angle TAB=\angle ACB$である（接弦定理）。
  statement_en: In a Euclidean plane, if A, B, C lie on a circle, A ≠ B, line AT is tangent at A, and T, C lie strictly on opposite sides of line AB, then ∠TAB = ∠ACB.
  assumptions:
  - 点は平面上にある
  - $A,B,C$は同じ円の上にある
  - $A\neq B$
  - 直線$AT$は$A$で接する
  - $T,C$は直線$AB$の反対側にあり、直線上にない
  quantifiers:
  - 任意の円と点$A,B,C,T$
  conclusion: $\angle TAB=\angle ACB$である。
  answer: |
    平面上の中心$O$、半径$r$の円の上に点$A,B,C$をとり、$A\neq B$とする。直線$AT$は$A$で接し、$T,C$は直線$AB$の反対側にあり直線上にないとする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    $A\neq B$より$r>0$である。$T,C$は直線$AB$上にないので、$T\neq A$、$C\neq A,B$である。$A$を通る直径のもう一方の端を$A'$とする。$T-A$は$A-O$に直交し、$A'-A$は$A-O$の実数倍なので、$\angle TAA'=\pi/2$である。
    $B=A'$のとき、$\angle TAB=\pi/2$であり、タレスの定理（直径の両端と異なる円上の点から、その直径を見込む角は$\pi/2$である）より$\angle ACB=\pi/2$である。
    以下$B\neq A'$とする。$A'$は直線$AB$上にない。タレスの定理より$\angle ABA'=\pi/2$なので、$\angle BAA'+\angle AA'B=\pi/2$であり、特に$\angle BAA'<\pi/2$である。
    $A',C$が直線$AB$の同じ側にある場合を考える。円周角の定理（円の上の$A\neq B$と、直線$AB$の同じ側にある円の上の2点について、$AB$を見込む角は等しい）より$\angle ACB=\angle AA'B$である。$T,A'$は直線$AB$の反対側にあるので、$\angle TAB+\angle BAA'$は$\angle TAA'=\pi/2$または$2\pi-\angle TAA'=3\pi/2$に等しい。$\angle TAB<\pi$、$\angle BAA'<\pi/2$より和は$3\pi/2$より小さいので、$\pi/2$である。よって$\angle TAB=\pi/2-\angle BAA'=\angle AA'B=\angle ACB$である。
    $A',C$が直線$AB$の反対側にある場合を考える。内接四角形の対角の和の定理（円の上の$A\neq B$と、直線$AB$の反対側にある円の上の2点について、$AB$を見込む角の和は$\pi$）より$\angle ACB=\pi-\angle AA'B$である。$T,A'$は直線$AB$の同じ側にあるので、$|\angle TAB-\angle BAA'|=\angle TAA'=\pi/2$である。$\angle BAA'<\pi/2$より$\angle TAB=\angle BAA'+\pi/2$である。よって$\angle TAB=(\pi/2-\angle AA'B)+\pi/2=\pi-\angle AA'B=\angle ACB$である。
  strategy: Draw the diameter through A; the tangent makes a right angle with it, the triangle ABA' has a right angle at B, and the inscribed angle theorem moves the angle at A' to C.
  sketch:
  - 'setup: Let A'' be the other end of the diameter through A; tangency gives angle TAA'' = π/2.'
  - 'case_split: If B = A'', both angles equal π/2.'
  - 'derive: Otherwise Thales gives angle BAA'' + angle AA''B = π/2.'
  - 'case_split: If A'', C lie on the same side of AB, then angle ACB = angle AA''B and the rays give angle TAB = π/2 - angle BAA''.'
  - 'case_split: If A'', C lie on opposite sides, then angle ACB = π - angle AA''B and the rays give angle TAB = π/2 + angle BAA''.'
  - 'conclude: In every case angle TAB = angle ACB.'
  openmath: (forall (o r a b c t) (-> (and euclidean_plane_ambient (tangent_to_circle_at a t o r) (on_circle b o r) (on_circle c o r) (!= a b) (opposite_side_of_line t c a b)) (= (euclid_angle t a b) (euclid_angle a c b))))
  hard_negative:
    statement: $T,C$が直線$AB$に関して同じ側にあっても$\angle TAB=\angle ACB$である。
    reason: 単位円で$A=(1,0)$、$B=(0,1)$、$C=(-1,0)$、$T=(1,-1)$とすると、$T,C$は同じ側にあり、$\angle TAB=3\pi/4$、$\angle ACB=\pi/4$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (s : EuclideanGeometry.Sphere P) (A B C T : P), s.IsTangentAt A line[ℝ, A, T] → B ∈ s → C ∈ s → A ≠ B → (line[ℝ, A, B]).SOppSide T C → EuclideanGeometry.angle T A B = EuclideanGeometry.angle A C B
  proof: |
    by
      intro V P _ _ _ _ _ s A B C T ht hB hC hAB hs
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have hT : T ∈ line[ℝ, A, T] := right_mem_affineSpan_pair ℝ A T
      have hA : A ∈ s := ht.mem_sphere
      have hmA := left_mem_affineSpan_pair ℝ A B
      have hmB := right_mem_affineSpan_pair ℝ A B
      have hTA : T ≠ A := fun h => hs.2.1 (h ▸ hmA)
      have hCA : C ≠ A := fun h => hs.2.2 (h ▸ hmA)
      have hCB : C ≠ B := fun h => hs.2.2 (h ▸ hmB)
      have hOA : s.center ≠ A := by
        intro h
        apply hAB
        have h1 : dist B s.center = s.radius := hB
        have h2 : dist A s.center = s.radius := hA
        rw [h, dist_self] at h2
        rw [h, ← h2, dist_eq_zero] at h1
        exact h1.symm
      have h90 : EuclideanGeometry.angle T A s.center = Real.pi / 2 :=
        EuclideanGeometry.Sphere.IsTangentAt.angle_eq_pi_div_two ht hT
      have h2T : (2 : ℤ) • EuclideanGeometry.oangle T A s.center = (Real.pi : Real.Angle) := by
        rcases EuclideanGeometry.oangle_eq_angle_or_eq_neg_angle hTA hOA with h | h
        · rw [h, h90, Real.Angle.two_zsmul_coe_div_two]
        · rw [h, h90, smul_neg, Real.Angle.two_zsmul_coe_div_two, Real.Angle.neg_coe_pi]
      have hadd := EuclideanGeometry.oangle_add hTA hOA hAB.symm
      have hpi := EuclideanGeometry.Sphere.two_zsmul_oangle_center_add_two_zsmul_oangle_eq_pi hA hC hB hCA hCB hAB
      have h2 : (2 : ℤ) • EuclideanGeometry.oangle T A B = (2 : ℤ) • EuclideanGeometry.oangle A C B := by
        rw [← hadd, smul_add, h2T, ← hpi, EuclideanGeometry.oangle_rev B A s.center, smul_neg]
        abel
      have hsign : (EuclideanGeometry.oangle T A B).sign = (EuclideanGeometry.oangle A C B).sign := by
        rw [hs.oangle_sign_eq_neg hmA hmB, EuclideanGeometry.oangle_swap₁₂_sign]
      have hne : (EuclideanGeometry.oangle T A B).sign ≠ 0 := by
        intro h0
        have hcol := EuclideanGeometry.oangle_sign_eq_zero_iff_collinear.mp h0
        exact hs.2.1 (hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hAB)
      rw [EuclideanGeometry.angle_eq_iff_oangle_eq_of_sign_eq hTA hAB.symm hCA.symm hCB.symm hsign]
      exact (Real.Angle.two_zsmul_eq_iff_eq hne hsign).mp h2
- id: tangent_chord_angle_converse
  kind: textbook
  level: high
  topic: 円・接弦定理の逆
  statement: 平面上で、円の上の点$A,B,C$について$A\neq B$とし、点$T$と$C$が直線$AB$の反対側にある（どちらも直線上にない）とする。$\angle TAB=\angle ACB$ならば、直線$AT$は$A$で円に接する。
  statement_en: In a Euclidean plane, if A, B, C lie on a circle, A ≠ B, T and C lie strictly on opposite sides of line AB, and ∠TAB = ∠ACB, then line AT is tangent to the circle at A.
  assumptions:
  - 点は平面上にある
  - $A,B,C$は同じ円の上にある
  - $A\neq B$
  - $T,C$は直線$AB$の反対側にあり、直線上にない
  - $\angle TAB=\angle ACB$
  quantifiers:
  - 任意の円と点$A,B,C,T$
  conclusion: 直線$AT$は$A$で円に接する。
  answer: |
    平面上の中心$O$の円の上に点$A,B,C$をとり、$A\neq B$とする。$T,C$は直線$AB$の反対側にあり直線上になく、$\angle TAB=\angle ACB$とする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    $A\neq B$より$A-O\neq0$である。$A$を通り$A-O$に直交する直線を$\ell$とする。$\ell$は定義により$A$で円に接する。$\|(B-A)+(A-O)\|=\|A-O\|$より$\langle B-A,A-O\rangle=-\tfrac12\|B-A\|^2\neq0$なので、$B$は$\ell$上にない。よって$\ell$は直線$AB$と$A$で交わり、$\ell$上には$T$と同じ側の点$T'$がある。
    $T',C$は直線$AB$の反対側にあるので、接弦定理（$A$での接線上の点$T'$と円の上の点$C$が直線$AB$の反対側にあるとき$\angle T'AB=\angle ACB$）より、$\angle T'AB=\angle ACB=\angle TAB$である。$T,T'$は直線$AB$の同じ側にあり、半直線$AB$となす角が等しいので、半直線$AT$と半直線$AT'$は一致する。したがって$T$は$\ell$上にあり、直線$AT$は$\ell$に等しい。よって直線$AT$は$A$で円に接する。
  strategy: Compare AT with the true tangent at A; the tangent chord theorem gives the same angle with AB on the same side, so the rays coincide.
  sketch:
  - 'setup: Let l be the line through A orthogonal to A-O; it is tangent at A.'
  - 'derive: B is not on l, so l has a point T'' on the side of T.'
  - 'apply_theorem: The tangent chord theorem gives angle T''AB = angle ACB = angle TAB.'
  - 'derive: T and T'' lie on the same side of AB with equal angles, so the rays AT and AT'' coincide.'
  - 'conclude: Line AT equals l, so it is tangent at A.'
  openmath: (forall (o r a b c t) (-> (and euclidean_plane_ambient (on_circle a o r) (on_circle b o r) (on_circle c o r) (!= a b) (opposite_side_of_line t c a b) (= (euclid_angle t a b) (euclid_angle a c b))) (tangent_to_circle_at a t o r)))
  hard_negative:
    statement: $T,C$が直線$AB$に関して同じ側にあっても、$\angle TAB=\angle ACB$ならば直線$AT$は接線である。
    reason: 単位円で$A=(1,0)$、$B=(0,1)$、$C=(-1,0)$、$T=(0,0)$とすると、どちらの角も$\pi/4$だが、直線$AT$は中心を通り接線ではない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (s : EuclideanGeometry.Sphere P) (A B C T : P), A ∈ s → B ∈ s → C ∈ s → A ≠ B → (line[ℝ, A, B]).SOppSide T C → EuclideanGeometry.angle T A B = EuclideanGeometry.angle A C B → s.IsTangentAt A line[ℝ, A, T]
  proof: |
    by
      intro V P _ _ _ _ _ s A B C T hA hB hC hAB hs hang
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have hmA := left_mem_affineSpan_pair ℝ A B
      have hmB := right_mem_affineSpan_pair ℝ A B
      have hTA : T ≠ A := fun h => hs.2.1 (h ▸ hmA)
      have hCA : C ≠ A := fun h => hs.2.2 (h ▸ hmA)
      have hCB : C ≠ B := fun h => hs.2.2 (h ▸ hmB)
      have hOA : s.center ≠ A := by
        intro h
        apply hAB
        have h1 : dist B s.center = s.radius := hB
        have h2 : dist A s.center = s.radius := hA
        rw [h, dist_self] at h2
        rw [h, ← h2, dist_eq_zero] at h1
        exact h1.symm
      have hsign : (EuclideanGeometry.oangle T A B).sign = (EuclideanGeometry.oangle A C B).sign := by
        rw [hs.oangle_sign_eq_neg hmA hmB, EuclideanGeometry.oangle_swap₁₂_sign]
      have heq : EuclideanGeometry.oangle T A B = EuclideanGeometry.oangle A C B :=
        EuclideanGeometry.oangle_eq_of_angle_eq_of_sign_eq hang hsign
      have hadd := EuclideanGeometry.oangle_add hTA hOA hAB.symm
      have hpi := EuclideanGeometry.Sphere.two_zsmul_oangle_center_add_two_zsmul_oangle_eq_pi hA hC hB hCA hCB hAB
      have h2T : (2 : ℤ) • EuclideanGeometry.oangle T A s.center = (Real.pi : Real.Angle) := by
        have h3 : (2 : ℤ) • EuclideanGeometry.oangle T A s.center = (2 : ℤ) • EuclideanGeometry.oangle T A B - (2 : ℤ) • EuclideanGeometry.oangle s.center A B := by
          rw [← hadd, smul_add]; abel
        rw [h3, heq, ← hpi, EuclideanGeometry.oangle_rev B A s.center, smul_neg]
        abel
      have h90 : EuclideanGeometry.angle T A s.center = Real.pi / 2 := by
        rcases Real.Angle.two_zsmul_eq_pi_iff.mp h2T with h | h
        · exact EuclideanGeometry.angle_eq_pi_div_two_of_oangle_eq_pi_div_two h
        · exact EuclideanGeometry.angle_eq_pi_div_two_of_oangle_eq_neg_pi_div_two h
      exact EuclideanGeometry.Sphere.IsTangentAt_of_angle_eq_pi_div_two h90 hA
- id: foot_distance_eq_radius_iff_tangent
  kind: gap
  level: high
  topic: 円・中心と直線の距離
  statement: 実内積空間上のアフィン空間で、中心$O$、半径$r$の球面（平面なら円）と直線$XY$（$X\neq Y$）について、$O$から直線に下ろした垂線の足を$H$とすると、直線が$H$で接することと$OH=r$は同値である。
  statement_en: If X ≠ Y and H is the foot of the perpendicular from the center O of a sphere of radius r (a circle in the plane) to line XY, then the line is tangent at H if and only if |OH| = r.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $X\neq Y$
  - $H$は直線$XY$上にある
  - $\langle O-H,Y-X\rangle=0$
  quantifiers:
  - 任意の球面と点$X,Y,H$
  conclusion: 直線$XY$が$H$で接することと$OH=r$は同値である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面と相異なる点$X,Y$をとり、直線$XY$上の点$H$は$\langle O-H,Y-X\rangle=0$を満たすとする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    直線が$H$で接するなら$H$は球面上にあるので$OH=r$である。
    逆に$OH=r$とすると$H$は球面上にある。直線上の点$U$について$U-H$は$Y-X$の実数倍なので、$\langle U-H,H-O\rangle=0$である。よって直線は$H$で接する。
  strategy: Being the foot already gives orthogonality, so only membership of H in the sphere remains.
  sketch:
  - 'derive: Tangency at H puts H on the sphere, so |OH| = r.'
  - 'derive: Conversely |OH| = r puts H on the sphere.'
  - 'derive: Any U on the line has U-H a multiple of Y-X.'
  - 'conclude: Hence U-H is orthogonal to H-O and the line is tangent at H.'
  openmath: (forall (o r x y h) (-> (and (!= x y) (on_line h x y) (= (inner_product (- o h) (- y x)) 0)) (<-> (line_tangent_to_circle_at x y h o r) (= (dist_of o h) r))))
  hard_negative:
    statement: 直線上の点$H$について$OH=r$ならば、$H$が垂線の足でなくても直線は$H$で接する。
    reason: 単位円で直線$x+y=1$と$H=(1,0)$をとると$OH=1$だが、この直線は円と2点で交わる。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (X Y H : P), X ≠ Y → H ∈ line[ℝ, X, Y] → inner ℝ (s.center -ᵥ H) (Y -ᵥ X) = 0 → (s.IsTangentAt H line[ℝ, X, Y] ↔ dist s.center H = s.radius)
  proof: |
    by
      intro V P _ _ _ _ s X Y H _ hH hperp
      constructor
      · intro h
        exact EuclideanGeometry.mem_sphere'.mp h.mem_sphere
      · intro h
        refine ⟨EuclideanGeometry.mem_sphere'.mpr h, hH, ?_⟩
        intro Q hQ
        have hsub : Q -ᵥ H ∈ (line[ℝ, X, Y]).direction := AffineSubspace.vsub_mem_direction hQ hH
        rw [direction_affineSpan, mem_vectorSpan_pair_rev] at hsub
        obtain ⟨k, hk⟩ := hsub
        refine EuclideanGeometry.Sphere.mem_orthRadius_iff_inner_left.mpr ?_
        rw [← hk, inner_smul_left, ← neg_vsub_eq_vsub_rev s.center H, inner_neg_right, real_inner_comm, hperp]
        simp
- id: power_value_inside_chord
  kind: gap
  level: high
  topic: 円・方べきの値（内部の点）
  statement: 実内積空間上のアフィン空間で、中心$O$、半径$r$の球面（平面なら円）の上の点$A,B$と、$A,B$の間に真にある点$H$について、$HA\cdot HB=r^2-HO^2$である。これは内部の点での形である。
  statement_en: Inside form. If A, B lie on a sphere with center O and radius r (a circle in the plane) and H is strictly between A and B, then |HA||HB| = r^2 - |HO|^2.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $A,B$は中心$O$、半径$r$の球面の上にある
  - $H$は$A$と$B$の間に真にある
  quantifiers:
  - 任意の球面と点$A,B,H$
  conclusion: $HA\cdot HB=r^2-HO^2$である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面の上に点$A,B$をとり、$H$は$A$と$B$の間に真にあるとする。$H=A+tu$、$u=B-A$、$0<t<1$と書ける。
    $x=A-O$とおくと、$\|x+u\|=\|x\|=r$より$2\langle x,u\rangle+\|u\|^2=0$である。よって$HO^2-r^2=\|x+tu\|^2-\|x\|^2=2t\langle x,u\rangle+t^2\|u\|^2=-t(1-t)\|u\|^2$である。
    一方$HA=t\|u\|$、$HB=(1-t)\|u\|$なので、$HA\cdot HB=t(1-t)\|u\|^2=r^2-HO^2$である。
  strategy: Parametrize H on the chord and compute |HO|^2 - r^2.
  sketch:
  - 'setup: Write H = A + tu with u = B-A and 0 < t < 1.'
  - 'derive: Equal radii give 2<x,u> + |u|^2 = 0 for x = A-O.'
  - 'derive: So |HO|^2 - r^2 = -t(1-t)|u|^2.'
  - 'conclude: Also |HA||HB| = t(1-t)|u|^2.'
  openmath: (forall (o r a b h) (-> (and (on_circle a o r) (on_circle b o r) (strictly_between a h b)) (= (* (dist_of h a) (dist_of h b)) (- (^ r 2) (^ (dist_of h o) 2)))))
  hard_negative:
    statement: 弦の内点$H$について$HA\cdot HB=HO^2-r^2$である。
    reason: 符号が逆である。単位円の直径の中点$H=O$では左辺が$1$、右辺が$-1$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B H : P), A ∈ s → B ∈ s → Sbtw ℝ A H B → dist H A * dist H B = s.radius ^ 2 - dist H s.center ^ 2
  proof: |
    by
      intro V P _ _ _ _ s A B H hA hB hs
      have hlt := EuclideanGeometry.Sphere.dist_center_lt_radius_of_sbtw hA hB hs
      rw [dist_comm] at hlt
      rw [EuclideanGeometry.Sphere.mul_dist_eq_neg_power_of_dist_center_le_radius (s.radius_nonneg_of_mem hA) hs.wbtw.mem_affineSpan hA hB hlt.le, EuclideanGeometry.Sphere.power]
      ring
- id: power_value_outside_secant
  kind: gap
  level: high
  topic: 円・方べきの値（外部の点）
  statement: 実内積空間上のアフィン空間で、中心$O$、半径$r$の球面（平面なら円）の上の点$A,B$と直線$AB$上の点$H$について、$HO\geq r$ならば$HA\cdot HB=HO^2-r^2$である。これは球面の外部または球面上の点での形である。
  statement_en: Outside form. If A, B lie on a sphere with center O and radius r (a circle in the plane), H lies on line AB, and |HO| ≥ r, then |HA||HB| = |HO|^2 - r^2.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $A,B$は中心$O$、半径$r$の球面の上にある
  - $H$は$A,B$のアフィン包に属する
  - $HO\geq r$
  quantifiers:
  - 任意の球面と点$A,B,H$
  conclusion: $HA\cdot HB=HO^2-r^2$である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面の上に点$A,B$をとり、$H$は$A,B$のアフィン包に属し$HO\geq r$とする。$H=A+tu$、$u=B-A$と書ける（$A=B$なら$u=0$である）。
    $x=A-O$とおくと、$\|x+u\|=\|x\|$より$2\langle x,u\rangle+\|u\|^2=0$である。よって$HO^2-r^2=2t\langle x,u\rangle+t^2\|u\|^2=(t^2-t)\|u\|^2$である。
    一方$HA\cdot HB=|t||t-1|\|u\|^2=|t^2-t|\|u\|^2=\bigl|HO^2-r^2\bigr|$である。$HO\geq r\geq0$より$HO^2-r^2\geq0$なので、$HA\cdot HB=HO^2-r^2$である。
  strategy: Compute |HO|^2 - r^2 as (t^2-t)|B-A|^2 and use its sign.
  sketch:
  - 'setup: Write H = A + tu with u = B-A.'
  - 'derive: |HO|^2 - r^2 = (t^2-t)|u|^2.'
  - 'derive: |HA||HB| is the absolute value of the same number.'
  - 'conclude: The hypothesis |HO| ≥ r makes it nonnegative.'
  openmath: (forall (o r a b h) (-> (and (on_circle a o r) (on_circle b o r) (on_line h a b) (>= (dist_of h o) r)) (= (* (dist_of h a) (dist_of h b)) (- (^ (dist_of h o) 2) (^ r 2)))))
  hard_negative:
    statement: $H$が直線$AB$上になくても、$HO\geq r$ならば$HA\cdot HB=HO^2-r^2$である。
    reason: 単位円で$A=(1,0)$、$B=(-1,0)$、$H=(0,2)$とすると、左辺は$5$、右辺は$3$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B H : P), A ∈ s → B ∈ s → H ∈ line[ℝ, A, B] → s.radius ≤ dist H s.center → dist H A * dist H B = dist H s.center ^ 2 - s.radius ^ 2
  proof: |
    by
      intro V P _ _ _ _ s A B H hA hB hH hle
      exact EuclideanGeometry.Sphere.mul_dist_eq_power_of_radius_le_dist_center (s.radius_nonneg_of_mem hA) hH hA hB hle
- id: tangent_secant_power
  kind: named
  level: high
  topic: 円・方べきの定理（接線と割線）
  statement: 実内積空間上のアフィン空間で、球面（平面なら円）の上の点$A,B$について、点$Q$が直線$AB$上にあり、$Q\neq T$で直線$QT$が$T$で接するとき、$QT^2=QA\cdot QB$である（方べきの定理の接線の形）。
  statement_en: Tangent-secant form of the power of a point. If A, B lie on a sphere (a circle in the plane), Q lies on line AB, Q ≠ T, and line QT is tangent at T, then |QT|^2 = |QA||QB|.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $A,B$は球面の上にある
  - $Q$は$A,B$のアフィン包に属する
  - $Q\neq T$
  - 直線$QT$は$T$で接する
  quantifiers:
  - 任意の球面と点$A,B,T,Q$
  conclusion: $QT^2=QA\cdot QB$である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面の上に点$A,B$をとり、$Q$は$A,B$のアフィン包に属するとする。$Q\neq T$で、直線$QT$は$T$で接するとする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    $Q-T$は$T-O$に直交するので、三平方の定理より$QO^2=QT^2+r^2$である。特に$QO\geq r$である。
    $Q=A+tu$、$u=B-A$、$x=A-O$とおくと、$\|x+u\|=\|x\|$より$2\langle x,u\rangle+\|u\|^2=0$であり、$QO^2-r^2=(t^2-t)\|u\|^2$である。一方$QA\cdot QB=|t^2-t|\|u\|^2=|QO^2-r^2|=QO^2-r^2$である。よって$QT^2=QO^2-r^2=QA\cdot QB$である。
  strategy: Both sides equal the power |QO|^2 - r^2 of Q.
  sketch:
  - 'derive: The right angle at T gives |QT|^2 = |QO|^2 - r^2.'
  - 'derive: Parametrizing line AB gives |QA||QB| = abs(|QO|^2 - r^2).'
  - 'derive: Q is not inside the sphere, so the absolute value can be dropped.'
  - 'conclude: Hence |QT|^2 = |QA||QB|.'
  openmath: (forall (o r a b t q) (-> (and (on_circle a o r) (on_circle b o r) (on_line q a b) (!= q t) (tangent_to_circle_at t q o r)) (= (^ (dist_of q t) 2) (* (dist_of q a) (dist_of q b)))))
  hard_negative:
    statement: $Q$が直線$AB$上になくても$QT^2=QA\cdot QB$である。
    reason: 単位円で$A=(1,0)$、$B=(-1,0)$、$Q=(0,2)$とすると、接線の長さの2乗は$3$、$QA\cdot QB$は$5$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B T Q : P), A ∈ s → B ∈ s → Q ∈ line[ℝ, A, B] → Q ≠ T → s.IsTangentAt T line[ℝ, Q, T] → dist Q T ^ 2 = dist Q A * dist Q B
  proof: |
    by
      intro V P _ _ _ _ s A B T Q hA hB hQ _ ht
      exact EuclideanGeometry.Sphere.dist_sq_eq_mul_dist_of_tangent_and_secant hA hB hQ ht
- id: tangent_secant_converse
  kind: textbook
  level: high
  topic: 円・方べきの定理の逆（接線）
  statement: 実内積空間上のアフィン空間で、球面（平面なら円）の上の点$A,B,T$について、$A$が$Q$と$B$の間に真にあり$QT^2=QA\cdot QB$ならば、直線$QT$は$T$で接する。
  statement_en: If A, B, T lie on a sphere (a circle in the plane), A is strictly between Q and B, and |QT|^2 = |QA||QB|, then line QT is tangent at T.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $A,B,T$は同じ球面の上にある
  - $A$は$Q$と$B$の間に真にある
  - $QT^2=QA\cdot QB$
  quantifiers:
  - 任意の球面と点$A,B,T,Q$
  conclusion: 直線$QT$は$T$で接する。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面の上に点$A,B,T$をとり、$A$は$Q$と$B$の間に真にあり、$QT^2=QA\cdot QB$とする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    $A,B$は相異なる。$v=A-Q\neq0$とおくと$B-Q=\lambda v$、$\lambda>1$と書ける。$x=Q-O$、$w=QO^2-r^2$とおく。$\|x+v\|^2=r^2$と$\|x+\lambda v\|^2=r^2$より、$w+2\langle x,v\rangle+\|v\|^2=0$と$w+2\lambda\langle x,v\rangle+\lambda^2\|v\|^2=0$である。第1式の$\lambda$倍から第2式を引くと$(\lambda-1)(w-\lambda\|v\|^2)=0$なので、$w=\lambda\|v\|^2=QA\cdot QB$である。
    よって$QT^2=QO^2-r^2$である。一方$Q-O=(Q-T)+(T-O)$より$QO^2=QT^2+2\langle Q-T,T-O\rangle+r^2$なので、$\langle Q-T,T-O\rangle=0$である。直線$QT$上の点は$U=T+t(Q-T)$と書けるので$\langle U-T,T-O\rangle=0$であり、直線$QT$は$T$で接する。
  strategy: Show the product equals the power of Q, then read the Pythagorean equation backwards.
  sketch:
  - 'setup: Write B-Q = λ(A-Q) with λ > 1.'
  - 'derive: The two sphere equations give |QO|^2 - r^2 = λ|A-Q|^2 = |QA||QB|.'
  - 'derive: So |QT|^2 = |QO|^2 - r^2.'
  - 'derive: Expanding |QO|^2 through T gives <Q-T,T-O> = 0.'
  - 'conclude: The line QT is orthogonal to the radius at T, so it is tangent.'
  openmath: (forall (o r a b t q) (-> (and (on_circle a o r) (on_circle b o r) (on_circle t o r) (strictly_between q a b) (= (^ (dist_of q t) 2) (* (dist_of q a) (dist_of q b)))) (tangent_to_circle_at t q o r)))
  hard_negative:
    statement: $Q$が$A,B$の間にあっても、$QT^2=QA\cdot QB$ならば直線$QT$は$T$で接する。
    reason: 単位円で$Q=O$、$A=(1,0)$、$B=(-1,0)$、$T=(0,1)$とすると等式は成り立つが、直線$QT$は中心を通る。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B T Q : P), A ∈ s → B ∈ s → T ∈ s → Sbtw ℝ Q A B → dist Q T ^ 2 = dist Q A * dist Q B → s.IsTangentAt T line[ℝ, Q, T]
  proof: |
    by
      intro V P _ _ _ _ s A B T Q hA hB hT hs h
      refine EuclideanGeometry.Sphere.isTangentAt_of_dist_sq_eq_power hT ?_
      have hQ : Q ∈ line[ℝ, A, B] := by
        have := hs.wbtw.collinear
        have hne := hs.ne_right.symm
        have hAB : A ≠ B := hs.ne_right
        exact this.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hAB
      have hout : s.radius ≤ dist Q s.center := by
        by_contra hlt
        push Not at hlt
        have hcol : Collinear ℝ ({A, Q, B} : Set P) := by
          rw [Set.insert_comm]; exact hs.wbtw.collinear
        have hb := EuclideanGeometry.sbtw_of_collinear_of_dist_center_lt_radius hcol hA hlt hB hs.ne_right
        have h1 := hb.wbtw.dist_add_dist
        have h2 := hs.wbtw.dist_add_dist
        have h3 : Q ≠ A := hs.ne_left.symm
        have h4 : 0 < dist Q A := dist_pos.mpr h3
        rw [dist_comm A Q] at h1
        linarith [dist_nonneg (x := A) (y := B)]
      rw [h, EuclideanGeometry.Sphere.mul_dist_eq_power_of_radius_le_dist_center (s.radius_nonneg_of_mem hA) hQ hA hB hout]
- id: intersecting_chords_converse
  kind: textbook
  level: high
  topic: 円・方べきの定理の逆（交わる弦）
  statement: 実内積空間上のアフィン空間で、点$H$が$A,B$の間と$C,D$の間に真にあり、$A,H,C$が一直線上になく、$AH\cdot BH=CH\cdot DH$ならば、$A,B,C,D$は同一球面上（平面なら同一円周上）にある。
  statement_en: If H is strictly between A and B and strictly between C and D, A, H, C are not collinear, and |AH||BH| = |CH||DH|, then A, B, C, D lie on a common sphere (a common circle in the plane).
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $H$は$A$と$B$の間に真にある
  - $H$は$C$と$D$の間に真にある
  - $A,H,C$は一直線上にない
  - $AH\cdot BH=CH\cdot DH$
  quantifiers:
  - 任意の点$A,B,C,D,H$
  conclusion: $A,B,C,D$は同一球面上にある。
  answer: |
    実内積空間上のアフィン空間で、点$H$は$A,B$の間と$C,D$の間に真にあり、$A,H,C$は一直線上になく、$AH\cdot BH=CH\cdot DH$とする。
    $A,B,C$は一直線上にない。一直線上なら$H,C$がともに直線$AB$上にあり、$A,H,C$が一直線上になるからである。そこで$A,B,C$を通る円の中心を$O$、半径を$r$とする。$O$はこの3点を含む平面の上にある。
    $x=H-O$、$v=C-H$、$w=HO^2-r^2$とおく。$H$は弦$AB$の内点なので$AH\cdot BH=r^2-HO^2=-w$である（弦の内点での方べきの値）。$H$は$C,D$の間にあるので$D-H=-\lambda v$、$\lambda>0$と書けて、$CH\cdot DH=\lambda\|v\|^2$である。したがって$w=-\lambda\|v\|^2$である。
    $C$が球面上にあることから$w+2\langle x,v\rangle+\|v\|^2=0$である。よって$\|x-\lambda v\|^2-r^2=w-2\lambda\langle x,v\rangle+\lambda^2\|v\|^2=w+\lambda(w+\|v\|^2)+\lambda^2\|v\|^2=(1+\lambda)(w+\lambda\|v\|^2)=0$である。すなわち$DO=r$であり、4点は中心$O$、半径$r$の球面の上にある。
  strategy: Take the circle through A, B, C and verify that D lies on it using the power of H.
  sketch:
  - 'setup: A, B, C are not collinear, so they lie on a circle with center O and radius r.'
  - 'derive: The power of H gives |AH||BH| = r^2 - |HO|^2.'
  - 'derive: With D-H = -λ(C-H), the hypothesis gives |HO|^2 - r^2 = -λ|C-H|^2.'
  - 'derive: Substituting the equation for C factors |DO|^2 - r^2 as (1+λ)(w+λ|v|^2).'
  - 'conclude: Therefore D lies on the same sphere.'
  openmath: (forall (a b c d h) (-> (and (strictly_between a h b) (strictly_between c h d) (not (collinear_points a h c)) (= (* (dist_of a h) (dist_of b h)) (* (dist_of c h) (dist_of d h)))) (cospherical_points (set a b c d))))
  hard_negative:
    statement: $H$が$C,D$の間になくても、$H$が$A,B$の間にあって積が等しければ4点は同一円周上にある。
    reason: $H=(0,0)$、$A=(-1,0)$、$B=(1,0)$、$C=(0,1/2)$、$D=(0,2)$とすると積はともに$1$だが、$A,B,C$を通る円は中心$(0,-3/4)$、半径$5/4$で、$D$はその上にない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D H : P), Sbtw ℝ A H B → Sbtw ℝ C H D → ¬Collinear ℝ ({A, H, C} : Set P) → dist A H * dist B H = dist C H * dist D H → EuclideanGeometry.Cospherical ({A, B, C, D} : Set P)
  proof: |
    by
      intro V P _ _ _ _ A B C D H h1 h2 hn h
      exact EuclideanGeometry.cospherical_of_mul_dist_eq_mul_dist_of_angle_eq_pi h (EuclideanGeometry.angle_eq_pi_iff_sbtw.mpr h1) (EuclideanGeometry.angle_eq_pi_iff_sbtw.mpr h2) hn
- id: secants_converse
  kind: textbook
  level: high
  topic: 円・方べきの定理の逆（割線）
  statement: 実内積空間上のアフィン空間で、$A$が$Q$と$B$の間に真にあり、$C$が$Q$と$D$の間に真にあり、$Q,A,C$が一直線上になく、$QA\cdot QB=QC\cdot QD$ならば、$A,B,C,D$は同一球面上（平面なら同一円周上）にある。
  statement_en: If A is strictly between Q and B, C is strictly between Q and D, Q, A, C are not collinear, and |QA||QB| = |QC||QD|, then A, B, C, D lie on a common sphere (a common circle in the plane).
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $A$は$Q$と$B$の間に真にある
  - $C$は$Q$と$D$の間に真にある
  - $Q,A,C$は一直線上にない
  - $QA\cdot QB=QC\cdot QD$
  quantifiers:
  - 任意の点$A,B,C,D,Q$
  conclusion: $A,B,C,D$は同一球面上にある。
  answer: |
    実内積空間上のアフィン空間で、$A$は$Q,B$の間に、$C$は$Q,D$の間に真にあり、$Q,A,C$は一直線上になく、$QA\cdot QB=QC\cdot QD$とする。
    $A,B,C$は一直線上にない。一直線上なら$Q,C$がともに直線$AB$上にあり、$Q,A,C$が一直線上になるからである。そこで$A,B,C$を通る円の中心を$O$、半径を$r$とする。
    $x=Q-O$、$w=QO^2-r^2$とおく。$B-Q=\mu(A-Q)$、$D-Q=\lambda(C-Q)$、$\mu,\lambda>1$と書き、$y=A-Q$、$v=C-Q$とおく。$A,B$が球面上にあることから$w+2\langle x,y\rangle+\|y\|^2=0$、$w+2\mu\langle x,y\rangle+\mu^2\|y\|^2=0$である。第1式の$\mu$倍から第2式を引くと$(\mu-1)(w-\mu\|y\|^2)=0$なので、$w=\mu\|y\|^2=QA\cdot QB$である。仮定より$w=QC\cdot QD=\lambda\|v\|^2$である。
    $C$が球面上にあることから$w+2\langle x,v\rangle+\|v\|^2=0$である。よって$\|x+\lambda v\|^2-r^2=w+2\lambda\langle x,v\rangle+\lambda^2\|v\|^2=w-\lambda(w+\|v\|^2)+\lambda^2\|v\|^2=(1-\lambda)(w-\lambda\|v\|^2)=0$である。すなわち$DO=r$であり、4点は同一球面上にある。
  strategy: Take the circle through A, B, C; the product hypothesis then forces D onto it.
  sketch:
  - 'setup: A, B, C are not collinear, so they lie on a circle with center O and radius r.'
  - 'derive: The two equations for A and B give |QO|^2 - r^2 = |QA||QB|.'
  - 'derive: The hypothesis gives |QO|^2 - r^2 = λ|C-Q|^2 where D-Q = λ(C-Q).'
  - 'derive: With the equation for C, |DO|^2 - r^2 factors as (1-λ)(w-λ|v|^2) = 0.'
  - 'conclude: D lies on the same sphere.'
  openmath: (forall (a b c d q) (-> (and (strictly_between q a b) (strictly_between q c d) (not (collinear_points q a c)) (= (* (dist_of q a) (dist_of q b)) (* (dist_of q c) (dist_of q d)))) (cospherical_points (set a b c d))))
  hard_negative:
    statement: $Q$が$C,D$の間にあっても、$A$が$Q,B$の間にあって積が等しければ4点は同一円周上にある。
    reason: $Q=(0,0)$、$A=(0,1/2)$、$B=(0,2)$、$C=(-1,0)$、$D=(1,0)$とすると積はともに$1$だが、$A,C,D$を通る円の上に$B$はない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D Q : P), Sbtw ℝ Q A B → Sbtw ℝ Q C D → ¬Collinear ℝ ({Q, A, C} : Set P) → dist Q A * dist Q B = dist Q C * dist Q D → EuclideanGeometry.Cospherical ({A, B, C, D} : Set P)
  proof: |
    by
      intro V P _ _ _ _ A B C D Q h1 h2 hn h
      have hAB : A ≠ B := h1.ne_right
      have hind : ¬Collinear ℝ ({A, B, C} : Set P) := by
        intro hc
        apply hn
        have hC : C ∈ line[ℝ, A, B] := hc.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hAB
        have hQ : Q ∈ line[ℝ, A, B] := h1.wbtw.collinear.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hAB
        have := collinear_insert_insert_of_mem_affineSpan_pair hQ hC
        exact this.subset (by intro x; simp only [Set.mem_insert_iff, Set.mem_singleton_iff]; tauto)
      let t : Affine.Triangle ℝ P := ⟨![A, B, C], affineIndependent_iff_not_collinear_set.mpr hind⟩
      let s := t.circumsphere
      have hA : A ∈ s := t.mem_circumsphere 0
      have hB : B ∈ s := t.mem_circumsphere 1
      have hC : C ∈ s := t.mem_circumsphere 2
      have hD : D ∈ s := by
        obtain ⟨⟨t, ⟨ht0, ht1⟩, ht⟩, hAQ, hAB'⟩ := h1
        obtain ⟨⟨u, ⟨hu0, hu1⟩, hu⟩, hCQ, hCD⟩ := h2
        have hu0' : u ≠ 0 := by
          rintro rfl
          exact hCQ (by rw [← hu]; simp)
        have ht1' : t ≠ 1 := by
          rintro rfl
          exact hAB' (by rw [← ht]; simp)
        have hN : ∀ {X : P}, X ∈ s → ‖X -ᵥ s.center‖ ^ 2 = s.radius ^ 2 := by
          intro X hX
          rw [← dist_eq_norm_vsub V, EuclideanGeometry.mem_sphere.mp hX]
        have hexp : ∀ (k : ℝ) (w : V), ‖(Q -ᵥ s.center) + k • w‖ ^ 2 = ‖Q -ᵥ s.center‖ ^ 2 + 2 * k * inner ℝ (Q -ᵥ s.center) w + k ^ 2 * ‖w‖ ^ 2 := by
          intro k w
          rw [norm_add_sq_real, inner_smul_right, norm_smul, mul_pow, Real.norm_eq_abs, sq_abs]
          ring
        have hle : ∀ {X Y : P} {k : ℝ}, AffineMap.lineMap Q Y k = X → X -ᵥ s.center = (Q -ᵥ s.center) + k • (Y -ᵥ Q) := by
          intro X Y k hk
          rw [← hk, ← vsub_add_vsub_cancel (AffineMap.lineMap Q Y k) Q s.center, AffineMap.lineMap_vsub_left, add_comm]
        have hd : ∀ {X Y : P} {k : ℝ}, 0 ≤ k → AffineMap.lineMap Q Y k = X → dist Q X = k * ‖Y -ᵥ Q‖ := by
          intro X Y k hk hX
          rw [dist_comm, dist_eq_norm_vsub V X Q, ← hX, AffineMap.lineMap_vsub_left, norm_smul, Real.norm_eq_abs, abs_of_nonneg hk]
        have e1 := hN hA
        have e2 := hN hB
        have e3 := hN hC
        rw [hle ht, hexp] at e1
        have e2' : ‖(Q -ᵥ s.center) + (1 : ℝ) • (B -ᵥ Q)‖ ^ 2 = s.radius ^ 2 := by
          rw [one_smul, add_comm, vsub_add_vsub_cancel]; exact e2
        rw [hexp] at e2'
        rw [hle hu, hexp] at e3
        have hprod := h
        rw [hd ht0 ht, hd hu0 hu, show dist Q B = 1 * ‖B -ᵥ Q‖ by rw [one_mul, dist_comm, dist_eq_norm_vsub V], show dist Q D = 1 * ‖D -ᵥ Q‖ by rw [one_mul, dist_comm, dist_eq_norm_vsub V]] at hprod
        have ha : ‖Q -ᵥ s.center‖ ^ 2 - s.radius ^ 2 = t * ‖B -ᵥ Q‖ ^ 2 := by
          have : (1 - t) * (‖Q -ᵥ s.center‖ ^ 2 - s.radius ^ 2 - t * ‖B -ᵥ Q‖ ^ 2) = 0 := by
            linear_combination e1 - t * e2'
          have := (mul_eq_zero.mp this).resolve_left (sub_ne_zero.mpr ht1'.symm)
          linarith
        have hprod' : t * ‖B -ᵥ Q‖ ^ 2 = u * ‖D -ᵥ Q‖ ^ 2 := by linear_combination hprod
        have hz : ‖D -ᵥ Q‖ ^ 2 + 2 * inner ℝ (Q -ᵥ s.center) (D -ᵥ Q) + u * ‖D -ᵥ Q‖ ^ 2 = 0 := by
          have : u * (‖D -ᵥ Q‖ ^ 2 + 2 * inner ℝ (Q -ᵥ s.center) (D -ᵥ Q) + u * ‖D -ᵥ Q‖ ^ 2) = 0 := by
            linear_combination e3 - ha - hprod'
          exact (mul_eq_zero.mp this).resolve_left hu0'
        have hgoal : ‖(Q -ᵥ s.center) + (1 : ℝ) • (D -ᵥ Q)‖ ^ 2 = s.radius ^ 2 := by
          rw [hexp]
          linear_combination hz + ha + hprod'
        rw [one_smul, add_comm, vsub_add_vsub_cancel] at hgoal
        have hrn := s.radius_nonneg_of_mem hA
        exact EuclideanGeometry.mem_sphere.mpr (by rw [dist_eq_norm_vsub V]; exact (sq_eq_sq₀ (norm_nonneg _) hrn).mp hgoal)
      refine EuclideanGeometry.cospherical_iff_exists_sphere.mpr ⟨s, ?_⟩
      intro p hp
      simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hp
      rcases hp with rfl | rfl | rfl | rfl <;> assumption
- id: intersecting_chords_similar_ratio
  kind: gap
  level: high
  topic: 円・交わる弦と相似
  statement: 実内積空間上のアフィン空間で、$A,B,C,D$が同一球面上（平面なら同一円周上）にあり、点$H$が$A,B$の間と$C,D$の間に真にあるとき、$AC\cdot HD=DB\cdot HA$である。三角形$HAC$と$HDB$の相似から出る比の形である。
  statement_en: If A, B, C, D lie on a common sphere (a common circle in the plane) and H is strictly between A and B and strictly between C and D, then |AC||HD| = |DB||HA|, the ratio from the similarity of triangles HAC and HDB.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $A,B,C,D$は同一球面上にある
  - $H$は$A$と$B$の間に真にある
  - $H$は$C$と$D$の間に真にある
  quantifiers:
  - 任意の点$A,B,C,D,H$
  conclusion: $AC\cdot HD=DB\cdot HA$である。
  answer: |
    実内積空間上のアフィン空間で、$A,B,C,D$は同一球面上にあり、$H$は$A,B$の間と$C,D$の間に真にあるとする。
    方べきの定理より$HA\cdot HB=HC\cdot HD$である。$HD>0$なので$k=HA/HD$とおくと、$HA=k\,HD$であり、$HC=k\,HB$である。
    $H$が2つの線分の内点なので、$\angle AHC$と$\angle DHB$は対頂角で等しい。余弦定理より$AC^2=HA^2+HC^2-2HA\cdot HC\cos\angle AHC=k^2(HD^2+HB^2-2HD\cdot HB\cos\angle DHB)=k^2DB^2$である。よって$AC=k\,DB$であり、両辺に$HD$を掛けて$AC\cdot HD=DB\cdot HA$を得る。
  strategy: The power of H gives proportional sides around equal vertical angles; the law of cosines finishes.
  sketch:
  - 'apply_theorem: The power of a point gives |HA||HB| = |HC||HD|.'
  - 'derive: With k = |HA|/|HD|, also |HC| = k|HB|.'
  - 'derive: Vertical angles give angle AHC = angle DHB.'
  - 'apply_theorem: The law of cosines gives |AC| = k|DB|.'
  - 'conclude: Multiply by |HD|.'
  openmath: (forall (a b c d h) (-> (and (cospherical_points (set a b c d)) (strictly_between a h b) (strictly_between c h d)) (= (* (dist_of a c) (dist_of h d)) (* (dist_of d b) (dist_of h a)))))
  hard_negative:
    statement: 4点が同一円周上になくても、弦が内点$H$で交われば$AC\cdot HD=DB\cdot HA$である。
    reason: $H=(0,0)$、$A=(1,0)$、$B=(-1,0)$、$C=(0,1)$、$D=(0,-2)$とすると、左辺は$2\sqrt2$、右辺は$\sqrt5$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D H : P), EuclideanGeometry.Cospherical ({A, B, C, D} : Set P) → Sbtw ℝ A H B → Sbtw ℝ C H D → dist A C * dist H D = dist D B * dist H A
  proof: |
    by
      intro V P _ _ _ _ A B C D H hc h1 h2
      have hmul := EuclideanGeometry.mul_dist_eq_mul_dist_of_cospherical hc h1.wbtw.mem_affineSpan h2.wbtw.mem_affineSpan
      have hHD : dist D H ≠ 0 := dist_ne_zero.mpr h2.ne_right.symm
      have hang : EuclideanGeometry.angle A H C = EuclideanGeometry.angle D H B := by
        rw [EuclideanGeometry.angle_eq_angle_of_angle_eq_pi_of_angle_eq_pi (EuclideanGeometry.angle_eq_pi_iff_sbtw.mpr h1) (EuclideanGeometry.angle_eq_pi_iff_sbtw.mpr h2), EuclideanGeometry.angle_comm]
      have h3 := EuclideanGeometry.dist_mul_of_eq_angle_of_dist_mul D H B A H C (dist A H / dist D H) hang (by field_simp) (by field_simp; linarith)
      rw [dist_comm H D, dist_comm H A, h3]
      field_simp
- id: common_chord_perpendicular_bisected_by_center_line
  kind: gap
  level: high
  topic: 2円・共通弦と中心線
  statement: 平面上で、中心$O_1,O_2$（$O_1\neq O_2$）の2円が相異なる2点$A,B$を共有するとき、直線$O_1O_2$は弦$AB$に垂直で、弦$AB$の中点を通る。
  statement_en: In a Euclidean plane, if two circles with distinct centers O1, O2 share distinct points A, B, then O1O2 is perpendicular to AB and the midpoint of AB lies on line O1O2.
  assumptions:
  - 点は平面上にある
  - $O_1\neq O_2$
  - $A\neq B$
  - $A,B$は2円の共有点である
  quantifiers:
  - 任意の2円と点$A,B$
  conclusion: $\langle O_2-O_1,B-A\rangle=0$であり、$A,B$の中点は直線$O_1O_2$上にある。
  answer: |
    平面上に中心$O_1\neq O_2$の2円をとり、相異なる点$A,B$を共有するとする。$M$を$A,B$の中点とする。
    $Z$が$A,B$から等距離にあれば、$z=Z-M$、$a=A-M$として$\|z-a\|=\|z+a\|$より$\langle z,a\rangle=0$である。すなわち$Z-M$は$B-A$に直交する。$O_1,O_2$は$A,B$から等距離なので、$O_1-M,O_2-M$は$B-A$に直交する。引き算して$\langle O_2-O_1,B-A\rangle=0$である。
    平面で$0$でないベクトル$B-A$に直交するベクトルは1次元の空間をなす。$O_2-O_1\neq0$はこの空間に属するので、$M-O_1$はその実数倍である。よって$M$は直線$O_1O_2$上にある。
  strategy: The centers and the midpoint are all equidistant from A and B, and in the plane these points form a line.
  sketch:
  - 'derive: A point equidistant from A and B has Z-M orthogonal to B-A.'
  - 'derive: Applying this to both centers gives that O2-O1 is orthogonal to B-A.'
  - 'translate: In the plane the orthogonal complement of B-A has dimension one.'
  - 'conclude: M-O1 is a multiple of O2-O1, so M lies on line O1O2.'
  openmath: (forall (o1 r1 o2 r2 a b) (-> (and euclidean_plane_ambient (!= o1 o2) (!= a b) (on_circle a o1 r1) (on_circle b o1 r1) (on_circle a o2 r2) (on_circle b o2 r2)) (and (perpendicular_lines o2 o1 a b) (on_line (midpoint_of a b) o1 o2))))
  hard_negative:
    statement: 3次元の2つの球面が相異なる2点$A,B$を共有すれば、$A,B$の中点は中心を結ぶ直線上にある。
    reason: 2つの球面の交わりは中心線を軸とする円であり、その円の直径でない弦の中点は軸の上にない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (s₁ s₂ : EuclideanGeometry.Sphere P) (A B : P), s₁.center ≠ s₂.center → A ≠ B → A ∈ s₁ → B ∈ s₁ → A ∈ s₂ → B ∈ s₂ → inner ℝ (s₂.center -ᵥ s₁.center) (B -ᵥ A) = 0 ∧ midpoint ℝ A B ∈ line[ℝ, s₁.center, s₂.center]
  proof: |
    by
      intro V P _ _ _ _ _ s₁ s₂ A B hc hAB hA1 hB1 hA2 hB2
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have h1 : inner ℝ (s₂.center -ᵥ s₁.center) (B -ᵥ A) = 0 := EuclideanGeometry.inner_vsub_vsub_of_mem_sphere_of_mem_sphere hA1 hB1 hA2 hB2
      refine ⟨h1, ?_⟩
      have h2 : inner ℝ (midpoint ℝ A B -ᵥ s₁.center) (B -ᵥ A) = 0 := by
        have := EuclideanGeometry.Sphere.inner_vsub_center_midpoint_vsub hA1 hB1
        rw [← neg_vsub_eq_vsub_rev, inner_neg_left, neg_eq_zero] at this
        exact this
      have hne : B -ᵥ A ≠ 0 := vsub_ne_zero.mpr hAB.symm
      let o : Orientation ℝ V (Fin 2) := Module.Oriented.positiveOrientation
      have r1 := (o.inner_eq_zero_iff_eq_zero_or_eq_smul_rotation_pi_div_two (x := B -ᵥ A) (y := s₂.center -ᵥ s₁.center)).mp (by rw [real_inner_comm]; exact h1)
      have r2 := (o.inner_eq_zero_iff_eq_zero_or_eq_smul_rotation_pi_div_two (x := B -ᵥ A) (y := midpoint ℝ A B -ᵥ s₁.center)).mp (by rw [real_inner_comm]; exact h2)
      obtain ⟨a, ha⟩ := r1.resolve_left hne
      obtain ⟨b, hb⟩ := r2.resolve_left hne
      have ha0 : a ≠ 0 := by
        rintro rfl
        rw [zero_smul] at ha
        exact hc (vsub_eq_zero_iff_eq.mp ha.symm).symm
      have : midpoint ℝ A B = AffineMap.lineMap s₁.center s₂.center (b / a) := by
        have e3 : (b / a) * a = b := by field_simp
        rw [AffineMap.lineMap_apply, eq_vadd_iff_vsub_eq, ← hb, ← ha, smul_smul, e3]
      rw [this]
      exact AffineMap.lineMap_mem_affineSpan_pair _ _ _
- id: two_circles_at_most_two_common_points
  kind: gap
  level: high
  topic: 2円・共有点の個数
  statement: 平面上の相異なる2円が相異なる2点$A,B$を共有するとき、2円の共有点は$A,B$だけである。
  statement_en: In a Euclidean plane, if two different circles share distinct points A and B, then every common point equals A or B.
  assumptions:
  - 点は平面上にある
  - 2円は異なる
  - $A\neq B$
  - $A,B,Q$は2円の共有点である
  quantifiers:
  - 任意の2円と点$A,B,Q$
  conclusion: $Q=A$または$Q=B$である。
  answer: |
    平面上の相異なる2円の中心を$O_1,O_2$、半径を$r_1,r_2$とし、相異なる点$A,B$と点$Q$がともに2円の共有点であるとする。
    $O_1=O_2$なら、$A$までの距離から$r_1=r_2$となり2円は一致するので、$O_1\neq O_2$である。
    共有点$Z$について$\|Z-O_1\|^2-r_1^2=\|Z-O_2\|^2-r_2^2$である。原点を固定して展開すると$2\langle Z,O_2-O_1\rangle$が定数に等しいという式になり、$O_2-O_1\neq0$なので、これは平面上の直線の方程式である。よって$A,B,Q$は1本の直線上にある。この直線は直線$AB$である。
    直線上の点$A+t(B-A)$が第1の円の上にあることは$t(t-1)\|B-A\|^2=0$と同値なので、共有点は$t=0,1$に限る。よって$Q=A$または$Q=B$である。
  strategy: Common points satisfy a linear equation, so they lie on a line, and a line meets a circle at most twice.
  sketch:
  - 'derive: Different circles through A have different centers.'
  - 'derive: Subtracting the circle equations gives a linear equation for common points.'
  - 'derive: So A, B, Q lie on one line.'
  - 'conclude: The line AB meets a circle only at A and B.'
  openmath: (forall (o1 r1 o2 r2 a b q) (-> (and euclidean_plane_ambient (or (!= o1 o2) (!= r1 r2)) (!= a b) (on_circle a o1 r1) (on_circle b o1 r1) (on_circle q o1 r1) (on_circle a o2 r2) (on_circle b o2 r2) (on_circle q o2 r2)) (or (= q a) (= q b))))
  hard_negative:
    statement: 3次元の相異なる2つの球面の共有点は高々2個である。
    reason: 2つの球面は一般に円で交わるので、共有点は無限個ある。平面であることが必要である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (s₁ s₂ : EuclideanGeometry.Sphere P) (A B Q : P), s₁ ≠ s₂ → A ≠ B → A ∈ s₁ → B ∈ s₁ → Q ∈ s₁ → A ∈ s₂ → B ∈ s₂ → Q ∈ s₂ → Q = A ∨ Q = B
  proof: |
    by
      intro V P _ _ _ _ _ s₁ s₂ A B Q hs hAB hA1 hB1 hQ1 hA2 hB2 hQ2
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      exact EuclideanGeometry.eq_of_mem_sphere_of_mem_sphere_of_finrank_eq_two Fact.out hs hAB hA1 hB1 hQ1 hA2 hB2 hQ2
- id: externally_tangent_iff_center_distance
  kind: textbook
  level: high
  topic: 2円・外接
  statement: 実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$r_1,r_2$の2つの球面（平面なら2円）が外接する（共有点$T$が線分$O_1O_2$上にある）ことと、$O_1O_2=r_1+r_2$かつ$r_1,r_2\geq0$は同値である。
  statement_en: Two spheres (circles in the plane) with centers O1, O2 and radii r1, r2 are externally tangent, meaning that some common point lies on segment O1O2, if and only if |O1O2| = r1 + r2 and r1, r2 ≥ 0.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - 外接とは、共有点が線分$O_1O_2$上にあることである
  quantifiers:
  - 任意の2つの球面
  conclusion: 外接することと、$O_1O_2=r_1+r_2$かつ$r_1,r_2\geq0$は同値である。
  answer: |
    実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$r_1,r_2$の2つの球面をとる。外接するとは、共有点$T$で線分$O_1O_2$上にあるものが存在することである。
    外接するとき、$r_1=O_1T\geq0$、$r_2=O_2T\geq0$であり、$T$が線分上にあるので$O_1O_2=O_1T+TO_2=r_1+r_2$である。
    逆に$O_1O_2=r_1+r_2$、$r_1,r_2\geq0$とする。$r_1+r_2=0$なら$r_1=r_2=0$、$O_1=O_2$であり、$T=O_1$が条件を満たす。$r_1+r_2>0$なら$T=O_1+\dfrac{r_1}{r_1+r_2}(O_2-O_1)$とおく。$T$は線分上にあり、$O_1T=r_1$、$O_2T=r_2$である。
  strategy: Add distances along the segment, and conversely divide the segment in the ratio r1 to r2.
  sketch:
  - 'derive: A common point on the segment gives |O1O2| = r1 + r2.'
  - 'construct: Conversely take the point dividing the segment in the ratio r1 to r2.'
  - 'case_split: The case r1 + r2 = 0 is the point circle.'
  - 'conclude: This point is a common point on the segment.'
  openmath: (forall (o1 r1 o2 r2) (<-> (externally_tangent_circles o1 r1 o2 r2) (and (= (dist_of o1 o2) (+ r1 r2)) (>= r1 0) (>= r2 0))))
  hard_negative:
    statement: 共有点をもつ2円が$O_1O_2=|r_1-r_2|$を満たせば外接する。
    reason: 半径$1,3$で中心間距離$2$の2円は共有点$T$をもつが、$T$は線分$O_1O_2$の外にあり、内接である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s₁ s₂ : EuclideanGeometry.Sphere P), s₁.IsExtTangent s₂ ↔ dist s₁.center s₂.center = s₁.radius + s₂.radius ∧ 0 ≤ s₁.radius ∧ 0 ≤ s₂.radius
  proof: |
    by
      intro V P _ _ _ _ s₁ s₂
      exact EuclideanGeometry.Sphere.isExtTangent_iff_dist_center
- id: internally_tangent_iff_center_distance
  kind: textbook
  level: high
  topic: 2円・内接
  statement: 実内積空間（$0$でない）上のアフィン空間で、中心$O_1,O_2$、半径$r_1,r_2$の2つの球面（平面なら2円）について、第1の球面が第2の球面に内接する（共有点$T$があり、$O_1$が線分$O_2T$上にある）ことと、$O_1O_2=r_2-r_1$かつ$r_1,r_2\geq0$は同値である。なお同一の球面（$O_1=O_2$かつ$r_1=r_2$）や半径$0$の球面も、この定義では内接に含める。
  statement_en: In a nonzero real inner product affine space, the sphere with center O1 and radius r1 is internally tangent to the sphere with center O2 and radius r2, meaning that some common point T has O1 on segment O2T, if and only if |O1O2| = r2 - r1 and r1, r2 ≥ 0. Coincident spheres and spheres of radius 0 count as internally tangent under this definition.
  assumptions:
  - 点は実内積空間上のアフィン空間にあり、空間は$0$でない
  - 内接とは、共有点$T$について$O_1$が線分$O_2T$上にあることである
  quantifiers:
  - 任意の2つの球面
  conclusion: 第1の球面が第2の球面に内接することと、$O_1O_2=r_2-r_1$かつ$r_1,r_2\geq0$は同値である。
  answer: |
    $0$でない実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$r_1,r_2$の2つの球面をとる。第1が第2に内接するとは、共有点$T$で$O_1$が線分$O_2T$上にあるものが存在することである。
    内接するとき、$r_1,r_2\geq0$であり、$O_2T=O_2O_1+O_1T$より$O_1O_2=r_2-r_1$である。
    逆に$O_1O_2=r_2-r_1$、$r_1,r_2\geq0$とする。$O_1=O_2$なら$r_1=r_2$で2つの球面は一致する。空間が$0$でないので単位ベクトル$e$があり、$T=O_1+r_1e$が条件を満たす。$O_1\neq O_2$なら$d=O_1O_2>0$として$T=O_2+\dfrac{r_2}{d}(O_1-O_2)$とおく。$O_2T=r_2$である。$r_2/d\geq1$なので$O_1$は線分$O_2T$上にあり、$O_1T=r_2-d=r_1$である。
  strategy: Add distances along O2, O1, T, and conversely extend the ray from O2 through O1 to distance r2.
  sketch:
  - 'derive: A common point T with O1 on segment O2T gives |O1O2| = r2 - r1.'
  - 'case_split: If O1 = O2 the spheres coincide and any point of them works.'
  - 'construct: Otherwise extend the ray from O2 through O1 to distance r2.'
  - 'conclude: That point lies on both spheres and has O1 on segment O2T.'
  openmath: (forall (o1 r1 o2 r2) (<-> (internally_tangent_circles o1 r1 o2 r2) (and (= (dist_of o1 o2) (- r2 r1)) (>= r1 0) (>= r2 0))))
  hard_negative:
    statement: 半径の大小によらず、第1の球面が第2の球面に内接することと$O_1O_2=|r_1-r_2|$は同値である。
    reason: $r_1=3$、$r_2=1$、$O_1O_2=2$では、内側にあるのは第2の球面であり、第1が第2に内接するのではない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Nontrivial V] (s₁ s₂ : EuclideanGeometry.Sphere P), s₁.IsIntTangent s₂ ↔ dist s₁.center s₂.center = s₂.radius - s₁.radius ∧ 0 ≤ s₁.radius ∧ 0 ≤ s₂.radius
  proof: |
    by
      intro V P _ _ _ _ _ s₁ s₂
      exact EuclideanGeometry.Sphere.isIntTangent_iff_dist_center
- id: externally_tangent_unique_common_point
  kind: gap
  level: high
  topic: 2円・外接と共有点
  statement: 実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$r_1,r_2>0$の2つの球面（平面なら2円）について、$O_1O_2=r_1+r_2$ならば共有点はただ1つである。
  statement_en: If two spheres (circles in the plane) with radii r1, r2 > 0 have center distance r1 + r2, then they have exactly one common point.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $r_1>0$、$r_2>0$
  - $O_1O_2=r_1+r_2$
  quantifiers:
  - 任意の2つの球面
  conclusion: 共有点はただ1つである。
  answer: |
    実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$r_1,r_2>0$の2つの球面をとり、$d=O_1O_2=r_1+r_2$とする。$y=O_2-O_1$とおくと$\|y\|=d>0$である。
    $T=O_1+\dfrac{r_1}{d}y$とおくと、$TO_1=r_1$、$TO_2=(1-r_1/d)d=r_2$なので、$T$は共有点である。
    $Q$を共有点とし$x=Q-O_1$とおく。$\|x\|=r_1$、$\|y-x\|=r_2$より$\langle x,y\rangle=\tfrac12(r_1^2+d^2-r_2^2)=r_1(r_1+r_2)=\|x\|\|y\|$である。コーシー・シュワルツの不等式の等号条件より$\|y\|x=\|x\|y$、すなわち$x=\dfrac{r_1}{d}y$である。よって$Q=T$である。
  strategy: A common point attains equality in Cauchy-Schwarz, which determines it.
  sketch:
  - 'construct: The point dividing the segment in the ratio r1 to r2 is a common point.'
  - 'derive: For a common point Q, the inner product of Q-O1 and O2-O1 equals the product of norms.'
  - 'apply_theorem: The equality case of Cauchy-Schwarz gives Q-O1 = (r1/d)(O2-O1).'
  - 'conclude: Hence Q is that point.'
  openmath: (forall (o1 r1 o2 r2) (-> (and (> r1 0) (> r2 0) (= (dist_of o1 o2) (+ r1 r2))) (exists (t) (and (on_circle t o1 r1) (on_circle t o2 r2) (forall (q) (-> (and (on_circle q o1 r1) (on_circle q o2 r2)) (= q t)))))))
  hard_negative:
    statement: $0<O_1O_2<r_1+r_2$ならば2円の共有点はただ1つである。
    reason: 半径$1,1$で中心間距離$1$の2円は2点で交わる。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s₁ s₂ : EuclideanGeometry.Sphere P), 0 < s₁.radius → 0 < s₂.radius → dist s₁.center s₂.center = s₁.radius + s₂.radius → ∃! T : P, T ∈ s₁ ∧ T ∈ s₂
  proof: |
    by
      intro V P _ _ _ _ s₁ s₂ h1 h2 hd
      obtain ⟨T, hT⟩ := EuclideanGeometry.Sphere.isExtTangent_iff_dist_center.mpr ⟨hd, h1.le, h2.le⟩
      have key : ∀ Q : P, Q ∈ s₁ → Q ∈ s₂ → (s₁.radius + s₂.radius) • (Q -ᵥ s₁.center) = s₁.radius • (s₂.center -ᵥ s₁.center) := by
        intro Q hQ1 hQ2
        have nx : ‖Q -ᵥ s₁.center‖ = s₁.radius := by rw [← dist_eq_norm_vsub V]; exact hQ1
        have ny : ‖s₂.center -ᵥ s₁.center‖ = s₁.radius + s₂.radius := by rw [← dist_eq_norm_vsub V, dist_comm]; exact hd
        have nz : ‖(s₂.center -ᵥ s₁.center) - (Q -ᵥ s₁.center)‖ = s₂.radius := by
          rw [vsub_sub_vsub_cancel_right, ← dist_eq_norm_vsub V, dist_comm]; exact hQ2
        have hin : inner ℝ (Q -ᵥ s₁.center) (s₂.center -ᵥ s₁.center) = ‖Q -ᵥ s₁.center‖ * ‖s₂.center -ᵥ s₁.center‖ := by
          have h3 := norm_sub_sq_real (s₂.center -ᵥ s₁.center) (Q -ᵥ s₁.center)
          rw [nz, ny, nx, real_inner_comm] at h3
          rw [ny, nx]
          linear_combination (1 / 2) * h3
        have h4 := inner_eq_norm_mul_iff_real.mp hin
        rw [ny, nx] at h4
        exact h4
      refine ⟨T, ⟨hT.mem_left, hT.mem_right⟩, ?_⟩
      rintro Q ⟨hQ1, hQ2⟩
      have e := (key Q hQ1 hQ2).trans (key T hT.mem_left hT.mem_right).symm
      have hne : s₁.radius + s₂.radius ≠ 0 := by positivity
      have := smul_right_injective V hne e
      exact vsub_left_injective _ this
- id: internally_tangent_unique_common_point
  kind: gap
  level: high
  topic: 2円・内接と共有点
  statement: 実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$0<r_1<r_2$の2つの球面（平面なら2円）について、$O_1O_2=r_2-r_1$ならば共有点はただ1つである。
  statement_en: If two spheres (circles in the plane) with radii 0 < r1 < r2 have center distance r2 - r1, then they have exactly one common point.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $0<r_1<r_2$
  - $O_1O_2=r_2-r_1$
  quantifiers:
  - 任意の2つの球面
  conclusion: 共有点はただ1つである。
  answer: |
    実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$0<r_1<r_2$の2つの球面をとり、$d=O_1O_2=r_2-r_1>0$とする。$y=O_1-O_2$とおくと$\|y\|=d$である。
    $T=O_1+\dfrac{r_1}{d}y$とおくと、$TO_1=r_1$、$TO_2=(1+r_1/d)d=r_2$なので、$T$は共有点である。
    $Q$を共有点とし$x=Q-O_1$とおく。$\|x\|=r_1$、$\|x+y\|=r_2$より$\langle x,y\rangle=\tfrac12(r_2^2-r_1^2-d^2)=r_1(r_2-r_1)=\|x\|\|y\|$である。コーシー・シュワルツの不等式の等号条件より$\|y\|x=\|x\|y$、すなわち$x=\dfrac{r_1}{d}y$である。よって$Q=T$である。
  strategy: A common point attains equality in Cauchy-Schwarz, which determines it.
  sketch:
  - 'construct: The point on the ray from O2 through O1 at distance r2 is a common point.'
  - 'derive: For a common point Q, the inner product of Q-O1 and O1-O2 equals the product of norms.'
  - 'apply_theorem: The equality case of Cauchy-Schwarz gives Q-O1 = (r1/d)(O1-O2).'
  - 'conclude: Hence Q is that point.'
  openmath: (forall (o1 r1 o2 r2) (-> (and (> r1 0) (< r1 r2) (= (dist_of o1 o2) (- r2 r1))) (exists (t) (and (on_circle t o1 r1) (on_circle t o2 r2) (forall (q) (-> (and (on_circle q o1 r1) (on_circle q o2 r2)) (= q t)))))))
  hard_negative:
    statement: $r_1=r_2$で$O_1O_2=r_2-r_1$でも共有点はただ1つである。
    reason: このとき$O_1=O_2$で2円は一致し、共有点は無限個ある。$r_1<r_2$が必要である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s₁ s₂ : EuclideanGeometry.Sphere P), 0 < s₁.radius → s₁.radius < s₂.radius → dist s₁.center s₂.center = s₂.radius - s₁.radius → ∃! T : P, T ∈ s₁ ∧ T ∈ s₂
  proof: |
    by
      intro V P _ _ _ _ s₁ s₂ h1 h2 hd
      have hd0 : s₂.radius - s₁.radius ≠ 0 := by linarith
      haveI : Nontrivial V := by
        refine ⟨⟨s₂.center -ᵥ s₁.center, 0, ?_⟩⟩
        intro h
        rw [vsub_eq_zero_iff_eq] at h
        rw [h, dist_self] at hd
        exact hd0 hd.symm
      obtain ⟨T, hT⟩ := EuclideanGeometry.Sphere.isIntTangent_iff_dist_center.mpr ⟨hd, h1.le, by linarith⟩
      have key : ∀ Q : P, Q ∈ s₁ → Q ∈ s₂ → (s₂.radius - s₁.radius) • (Q -ᵥ s₁.center) = s₁.radius • (s₁.center -ᵥ s₂.center) := by
        intro Q hQ1 hQ2
        have nx : ‖Q -ᵥ s₁.center‖ = s₁.radius := by rw [← dist_eq_norm_vsub V]; exact hQ1
        have ny : ‖s₁.center -ᵥ s₂.center‖ = s₂.radius - s₁.radius := by rw [← dist_eq_norm_vsub V]; exact hd
        have nz : ‖(Q -ᵥ s₁.center) + (s₁.center -ᵥ s₂.center)‖ = s₂.radius := by
          rw [vsub_add_vsub_cancel, ← dist_eq_norm_vsub V]; exact hQ2
        have hin : inner ℝ (Q -ᵥ s₁.center) (s₁.center -ᵥ s₂.center) = ‖Q -ᵥ s₁.center‖ * ‖s₁.center -ᵥ s₂.center‖ := by
          have h3 := norm_add_sq_real (Q -ᵥ s₁.center) (s₁.center -ᵥ s₂.center)
          rw [nz, ny, nx] at h3
          rw [ny, nx]
          linear_combination (-1 / 2) * h3
        have h4 := inner_eq_norm_mul_iff_real.mp hin
        rw [ny, nx] at h4
        exact h4
      refine ⟨T, ⟨hT.mem_left, hT.mem_right⟩, ?_⟩
      rintro Q ⟨hQ1, hQ2⟩
      have e := (key Q hQ1 hQ2).trans (key T hT.mem_left hT.mem_right).symm
      have := smul_right_injective V hd0 e
      exact vsub_left_injective _ this
- id: common_tangent_at_contact_on_center_line
  kind: gap
  level: high
  topic: 2円・接点での共通接線
  statement: 実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$r_1>0,r_2$の2つの球面（平面なら2円）が直線$O_1O_2$上の点$T$を共有するとする。$X\neq T$で直線$TX$が第1の球面に$T$で接するならば、直線$TX$は第2の球面にも$T$で接する。
  statement_en: If two spheres (circles in the plane) with centers O1, O2 and r1 > 0 share a point T on line O1O2, X ≠ T, and line TX is tangent to the first at T, then line TX is tangent to the second at T.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $r_1>0$
  - $X\neq T$
  - $T$は直線$O_1O_2$上にある
  - $T$は第2の球面の上にある
  - 直線$TX$は第1の球面に$T$で接する
  quantifiers:
  - 任意の2つの球面と点$T,X$
  conclusion: 直線$TX$は第2の球面に$T$で接する。
  answer: |
    実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$r_1>0,r_2$の2つの球面をとる。$T$は直線$O_1O_2$上で第2の球面の上にあり、$X\neq T$、直線$TX$は第1の球面に$T$で接するとする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    $w=O_2-O_1$とおくと、$T-O_1=kw$、$T-O_2=(k-1)w$となる実数$k$がある。$\|T-O_1\|=r_1>0$より$k\neq0$である。
    直線$TX$上の点$U$について$\langle U-T,kw\rangle=\langle U-T,T-O_1\rangle=0$なので$\langle U-T,w\rangle=0$である。よって$\langle U-T,T-O_2\rangle=(k-1)\langle U-T,w\rangle=0$である。$T$は第2の球面の上にあるので、直線$TX$は第2の球面に$T$で接する。
  strategy: Both radii at T are multiples of O2-O1, so orthogonality to one gives orthogonality to the other.
  sketch:
  - 'setup: Write T-O1 = kw and T-O2 = (k-1)w with w = O2-O1.'
  - 'derive: r1 > 0 forces k ≠ 0.'
  - 'derive: Tangency to the first sphere gives that U-T is orthogonal to w.'
  - 'conclude: So U-T is orthogonal to T-O2.'
  openmath: (forall (o1 r1 o2 r2 t x) (-> (and (> r1 0) (!= x t) (on_line t o1 o2) (on_circle t o2 r2) (tangent_to_circle_at t x o1 r1)) (tangent_to_circle_at t x o2 r2)))
  hard_negative:
    statement: 2円の任意の共有点$T$で、一方の接線は他方の接線でもある。
    reason: 半径$1$で中心が$(0,0),(1,0)$の2円の共有点$(1/2,\sqrt3/2)$では、2本の接線は異なる。$T$が中心線上にあることが必要である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s₁ s₂ : EuclideanGeometry.Sphere P) (T X : P), 0 < s₁.radius → X ≠ T → T ∈ line[ℝ, s₁.center, s₂.center] → T ∈ s₂ → s₁.IsTangentAt T line[ℝ, T, X] → s₂.IsTangentAt T line[ℝ, T, X]
  proof: |
    by
      intro V P _ _ _ _ s₁ s₂ T X hr _ hT hT2 ht
      obtain ⟨k, hk⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hT
      have hT1 : dist T s₁.center = s₁.radius := ht.mem_sphere
      have h1 : T -ᵥ s₁.center = k • (s₂.center -ᵥ s₁.center) := by
        rw [← hk, AffineMap.lineMap_vsub_left]
      have h2 : T -ᵥ s₂.center = (k - 1) • (s₂.center -ᵥ s₁.center) := by
        rw [← vsub_sub_vsub_cancel_right T s₂.center s₁.center, h1]
        module
      have hk0 : k ≠ 0 := by
        rintro rfl
        rw [zero_smul] at h1
        rw [dist_eq_norm_vsub V, h1, norm_zero] at hT1
        linarith
      refine ⟨hT2, ht.mem_space, ?_⟩
      intro Q hQ
      have h3 := ht.inner_left_eq_zero_of_mem hQ
      rw [h1, inner_smul_right] at h3
      have h4 := (mul_eq_zero.mp h3).resolve_left hk0
      refine EuclideanGeometry.Sphere.mem_orthRadius_iff_inner_left.mpr ?_
      rw [h2, inner_smul_right, h4, mul_zero]
- id: two_circles_common_point_triangle_inequality
  kind: gap
  level: high
  topic: 2円・共有点と中心間距離
  statement: 実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$r_1,r_2$の2つの球面（平面なら2円）が共有点をもつならば、$|r_1-r_2|\leq O_1O_2\leq r_1+r_2$である。
  statement_en: If two spheres (circles in the plane) with centers O1, O2 and radii r1, r2 have a common point, then |r1 - r2| ≤ |O1O2| ≤ r1 + r2.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $T$は2つの球面の共有点である
  quantifiers:
  - 任意の2つの球面と点$T$
  conclusion: $|r_1-r_2|\leq O_1O_2\leq r_1+r_2$である。
  answer: |
    実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$r_1,r_2$の2つの球面をとり、$T$を共有点とする。$TO_1=r_1$、$TO_2=r_2$である。
    三角不等式より$O_1O_2\leq O_1T+TO_2=r_1+r_2$である。また$r_1=TO_1\leq TO_2+O_2O_1=r_2+O_1O_2$であり、同様に$r_2\leq r_1+O_1O_2$である。後の2式は$|r_1-r_2|\leq O_1O_2$を意味する。
  strategy: Apply the triangle inequality to the triangle with vertices O1, O2, T.
  sketch:
  - 'apply_theorem: The triangle inequality gives |O1O2| ≤ r1 + r2.'
  - 'apply_theorem: It also gives r1 ≤ r2 + |O1O2| and r2 ≤ r1 + |O1O2|.'
  - 'conclude: These are the stated bounds.'
  openmath: (forall (o1 r1 o2 r2 t) (-> (and (on_circle t o1 r1) (on_circle t o2 r2)) (and (<= (abs (- r1 r2)) (dist_of o1 o2)) (<= (dist_of o1 o2) (+ r1 r2)))))
  hard_negative:
    statement: 2円が共有点をもてば$O_1O_2=r_1+r_2$である。
    reason: 半径$1,1$で中心間距離$1$の2円は共有点をもつが、$O_1O_2\neq r_1+r_2$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s₁ s₂ : EuclideanGeometry.Sphere P) (T : P), T ∈ s₁ → T ∈ s₂ → |s₁.radius - s₂.radius| ≤ dist s₁.center s₂.center ∧ dist s₁.center s₂.center ≤ s₁.radius + s₂.radius
  proof: |
    by
      intro V P _ _ _ _ s₁ s₂ T h1 h2
      have e1 : dist T s₁.center = s₁.radius := h1
      have e2 : dist T s₂.center = s₂.radius := h2
      have t1 := dist_triangle_left s₁.center s₂.center T
      have t2 := dist_triangle T s₁.center s₂.center
      have t3 := dist_triangle T s₂.center s₁.center
      rw [dist_comm s₂.center s₁.center] at t3
      rw [e1, e2] at t1 t2 t3
      refine ⟨abs_sub_le_iff.mpr ⟨by linarith, by linarith⟩, t1⟩
- id: two_circles_common_point_exists_in_plane
  kind: textbook
  level: high
  topic: 2円・共有点の存在
  statement: 平面上で、中心$O_1\neq O_2$、半径$r_1,r_2>0$の2円について、$|r_1-r_2|\leq O_1O_2\leq r_1+r_2$ならば共有点が存在する。
  statement_en: In a Euclidean plane, two circles with distinct centers O1, O2 and radii r1, r2 > 0 with |r1 - r2| ≤ |O1O2| ≤ r1 + r2 have a common point.
  assumptions:
  - 点は平面上にある
  - $O_1\neq O_2$
  - $r_1>0$、$r_2>0$
  - $|r_1-r_2|\leq O_1O_2\leq r_1+r_2$
  quantifiers:
  - 任意の2円
  conclusion: 2円の共有点が存在する。
  answer: |
    平面上で、中心$O_1\neq O_2$、半径$r_1,r_2>0$の2円をとり、$d=O_1O_2$は$|r_1-r_2|\leq d\leq r_1+r_2$を満たすとする。$y=O_2-O_1$とし、$y$を直角に回転したベクトルを$Jy$とする。$\|Jy\|=d$、$\langle y,Jy\rangle=0$である。
    $a=\dfrac{d^2+r_1^2-r_2^2}{2d}$とおくと、$r_1^2-a^2=\dfrac{(r_1+r_2+d)(r_1+r_2-d)(d+r_1-r_2)(d-r_1+r_2)}{4d^2}\geq0$である。$b=\sqrt{r_1^2-a^2}$とおき、$T=O_1+\dfrac ad y+\dfrac bd Jy$とする。
    直交性より$TO_1^2=a^2+b^2=r_1^2$であり、$TO_2^2=(a-d)^2+b^2=r_1^2-2ad+d^2=r_2^2$である。半径は正なので$T$は2円の共有点である。
  strategy: Construct the common point explicitly from the projection a on the center line and the height b.
  sketch:
  - 'setup: Let y = O2-O1 and let Jy be its rotation by a right angle.'
  - 'construct: Set a = (d^2+r1^2-r2^2)/(2d).'
  - 'derive: The hypotheses make r1^2 - a^2 a nonnegative product over 4d^2.'
  - 'construct: Let b be its square root and T = O1 + (a/d)y + (b/d)Jy.'
  - 'conclude: The Pythagorean theorem gives |TO1| = r1 and |TO2| = r2.'
  openmath: (forall (o1 r1 o2 r2) (-> (and euclidean_plane_ambient (!= o1 o2) (> r1 0) (> r2 0) (<= (abs (- r1 r2)) (dist_of o1 o2)) (<= (dist_of o1 o2) (+ r1 r2))) (exists (t) (and (on_circle t o1 r1) (on_circle t o2 r2)))))
  hard_negative:
    statement: 直線上（1次元）でも、同じ不等式を満たす2つの「球面」は共有点をもつ。
    reason: 直線上で中心$0,1$、半径$1,1$とすると、球面はそれぞれ$\{-1,1\}$と$\{0,2\}$で共有点がない。2次元以上であることが必要である。
  target: |
