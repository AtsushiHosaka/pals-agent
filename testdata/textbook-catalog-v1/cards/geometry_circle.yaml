  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B : P), A ∈ s → B ∈ s → inner ℝ (s.center -ᵥ midpoint ℝ A B) (B -ᵥ A) = 0
  proof: |
    by
      intro V P _ _ _ _ s A B hA hB
      exact EuclideanGeometry.Sphere.inner_vsub_center_midpoint_vsub hA hB
- id: perpendicular_from_center_bisects_chord
  kind: gap
  level: middle
  topic: 円・弦の性質
  statement: 実内積空間上のアフィン空間で、中心$O$の球面（平面なら円）の上の相異なる点$A,B$と直線$AB$上の点$H$について、$O-H$が$B-A$に直交するならば、$H$は$A,B$の中点である。
  statement_en: If A ≠ B lie on a sphere with center O (a circle in the plane), H lies on line AB, and O-H is orthogonal to B-A, then H is the midpoint of AB.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $A,B$は中心$O$の球面の上にある
  - $A\neq B$
  - $H$は直線$AB$上にある
  - $\langle O-H,B-A\rangle=0$
  quantifiers:
  - 任意の球面と点$A,B,H$
  conclusion: $H$は$A,B$の中点である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$の球面の上に相異なる点$A,B$をとり、直線$AB$上の点$H$は$\langle O-H,B-A\rangle=0$を満たすとする。$M$を$A,B$の中点とする。
    $a=A-O$、$b=B-O$とおくと$\|a\|=\|b\|$なので、$\langle M-O,B-A\rangle=\tfrac12\langle a+b,b-a\rangle=0$である。仮定と合わせて$\langle M-H,B-A\rangle=0$である。
    $M,H$はともに直線$AB$上にあるので$M-H=k(B-A)$となる実数$k$がある。よって$k\|B-A\|^2=0$である。$A\neq B$より$k=0$であり、$H=M$である。
  strategy: The midpoint already satisfies the orthogonality, and two such points on the line must coincide.
  sketch:
  - 'derive: The midpoint M satisfies that M-O is orthogonal to B-A.'
  - 'derive: Subtracting gives that M-H is orthogonal to B-A.'
  - 'derive: M-H is a multiple k(B-A), so k|B-A|^2 = 0.'
  - 'conclude: A ≠ B forces k = 0, so H = M.'
  openmath: (forall (o r a b h) (-> (and (on_circle a o r) (on_circle b o r) (!= a b) (on_line h a b) (= (inner_product (- o h) (- b a)) 0)) (= h (midpoint_of a b))))
