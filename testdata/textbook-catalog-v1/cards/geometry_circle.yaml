    実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$r_1,r_2$の2つの球面をとり、$T_1\neq T_2$の直線$T_1T_2$が第1に$T_1$で、第2に$T_2$で接するとする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。$O_1,O_2$は直線の反対側にあるとする。これは、直線上の点$p_1,p_2$と$\alpha,\beta>0$があって$\alpha(O_1-p_1)=\beta(p_2-O_2)$となり、$O_1,O_2$が直線上にないことである。
    $u=T_1-O_1$、$v=T_2-O_2$、$w=T_2-T_1\neq0$とおく。接することから$\langle w,u\rangle=\langle w,v\rangle=0$であり、$\|u\|=r_1$、$\|v\|=r_2$である。$T_1-p_1=aw$、$T_2-p_2=bw$と書くと、$O_1-p_1=aw-u$、$p_2-O_2=v-bw$である。
    $\alpha(aw-u)=\beta(v-bw)$と$w$の内積をとると$(\alpha a+\beta b)\|w\|^2=0$なので$\alpha a=-\beta b$であり、$-\alpha u=\beta v$である。ノルムをとると$\alpha r_1=\beta r_2$である。$v$との内積をとると$-\alpha\langle u,v\rangle=\beta r_2^2=\alpha r_1r_2$なので、$\langle u,v\rangle=-r_1r_2$である。
    $O_2-O_1=u+w-v$と直交性より、$O_1O_2^2=\|w\|^2+\|u-v\|^2=T_1T_2^2+r_1^2+r_2^2+2r_1r_2=T_1T_2^2+(r_1+r_2)^2$である。
  strategy: Decompose O2-O1 into the tangent segment and the radii; on opposite sides the radii point opposite ways.
  sketch:
  - 'setup: Write u = T1-O1, v = T2-O2, w = T2-T1; then u and v are orthogonal to w.'
  - 'translate: The opposite-side condition gives α(aw-u) = β(v-bw) with α, β > 0.'
  - 'derive: The inner product with w gives αa = -βb, hence -αu = βv.'
  - 'derive: So <u,v> = -r1 r2.'
  - 'conclude: Expanding O2-O1 = u+w-v gives the formula.'
  openmath: (forall (o1 r1 o2 r2 t1 t2) (-> (and (!= t1 t2) (tangent_to_circle_at t1 t2 o1 r1) (tangent_to_circle_at t2 t1 o2 r2) (opposite_side_of_line o1 o2 t1 t2)) (= (^ (dist_of t1 t2) 2) (- (^ (dist_of o1 o2) 2) (^ (+ r1 r2) 2)))))
  hard_negative:
    statement: $O_1,O_2$が接線の反対側にあるとき$T_1T_2^2=O_1O_2^2-(r_1-r_2)^2$である。
    reason: 中心$(0,1),(4,-1)$、半径$1,1$、接線$y=0$では$T_1T_2^2=16$、右辺は$20$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s₁ s₂ : EuclideanGeometry.Sphere P) (T₁ T₂ : P), T₁ ≠ T₂ → s₁.IsTangentAt T₁ line[ℝ, T₁, T₂] → s₂.IsTangentAt T₂ line[ℝ, T₁, T₂] → (line[ℝ, T₁, T₂]).SOppSide s₁.center s₂.center → dist T₁ T₂ ^ 2 = dist s₁.center s₂.center ^ 2 - (s₁.radius + s₂.radius) ^ 2
  proof: |
    by
      intro V P _ _ _ _ s₁ s₂ T₁ T₂ hT h1 h2 hs
      set u := T₁ -ᵥ s₁.center with hu
      set v := T₂ -ᵥ s₂.center with hv
      set w := T₂ -ᵥ T₁ with hw
      have hw0 : w ≠ 0 := vsub_ne_zero.mpr hT.symm
      have hw2 : ‖w‖ ^ 2 ≠ 0 := pow_ne_zero 2 (norm_ne_zero_iff.mpr hw0)
      have iu : inner ℝ w u = 0 := h1.inner_left_eq_zero_of_mem (right_mem_affineSpan_pair ℝ T₁ T₂)
      have iv : inner ℝ w v = 0 := by
        have := h2.inner_left_eq_zero_of_mem (left_mem_affineSpan_pair ℝ T₁ T₂)
        rw [← neg_vsub_eq_vsub_rev, inner_neg_left, neg_eq_zero] at this
        exact this
      have nu : ‖u‖ = s₁.radius := by rw [hu, ← dist_eq_norm_vsub V]; exact h1.mem_sphere
      have nv : ‖v‖ = s₂.radius := by rw [hv, ← dist_eq_norm_vsub V]; exact h2.mem_sphere
      obtain ⟨⟨p₁, hp₁, p₂, hp₂, hr⟩, hn1, hn2⟩ := hs
      have hdir : ∀ {p q : P}, p ∈ line[ℝ, T₁, T₂] → q ∈ line[ℝ, T₁, T₂] → ∃ a : ℝ, a • w = p -ᵥ q := by
        intro p q hp hq
        have := AffineSubspace.vsub_mem_direction hp hq
        rw [direction_affineSpan, mem_vectorSpan_pair_rev] at this
        exact this
      obtain ⟨a, ha⟩ := hdir (left_mem_affineSpan_pair ℝ T₁ T₂) hp₁
      obtain ⟨b, hb⟩ := hdir (right_mem_affineSpan_pair ℝ T₁ T₂) hp₂
      have hx : s₁.center -ᵥ p₁ ≠ 0 := vsub_ne_zero.mpr (fun h => hn1 (h ▸ hp₁))
      have hy : p₂ -ᵥ s₂.center ≠ 0 := vsub_ne_zero.mpr (fun h => hn2 (h ▸ hp₂))
      obtain ⟨α, β, hα, hβ, heq⟩ := hr.exists_pos hx hy
      have xe : s₁.center -ᵥ p₁ = a • w - u := by rw [ha, hu, vsub_sub_vsub_cancel_left]
      have ye : p₂ -ᵥ s₂.center = v - b • w := by rw [hb, hv, vsub_sub_vsub_cancel_left]
      rw [xe, ye] at heq
      have hab : α * a = -(β * b) := by
        have h3 := congrArg (inner ℝ w) heq
        simp only [inner_smul_right, inner_sub_right, iu, iv, real_inner_self_eq_norm_sq] at h3
        have : (α * a + β * b) * ‖w‖ ^ 2 = 0 := by linear_combination h3
        have := (mul_eq_zero.mp this).resolve_right hw2
        linarith
      have huv : -(α • u) = β • v := by
        have : -(α • u) - β • v = -(α * a + β * b) • w := by
          linear_combination (norm := module) heq
        rw [hab, neg_add_cancel, neg_zero, zero_smul] at this
        exact sub_eq_zero.mp this
      have hnorm : α * s₁.radius = β * s₂.radius := by
        have := congrArg norm huv
        rwa [norm_neg, norm_smul, norm_smul, Real.norm_eq_abs, Real.norm_eq_abs, abs_of_pos hα, abs_of_pos hβ, nu, nv] at this
      have hin : -(α * inner ℝ u v) = β * s₂.radius ^ 2 := by
        have := congrArg (fun z => inner ℝ z v) huv
        simp only [inner_neg_left, inner_smul_left, real_inner_self_eq_norm_sq, nv] at this
        simpa using this
      have huv' : inner ℝ u v = -(s₁.radius * s₂.radius) := by
        have : α * (inner ℝ u v + s₁.radius * s₂.radius) = 0 := by linear_combination -hin + s₂.radius * hnorm
        have := (mul_eq_zero.mp this).resolve_left hα.ne'
        linarith
      have hc : s₂.center -ᵥ s₁.center = u + w - v := by
        rw [hu, hv, hw, add_comm, vsub_add_vsub_cancel, vsub_sub_vsub_cancel_left]
      rw [dist_comm s₁.center, dist_eq_norm_vsub V s₂.center, dist_eq_norm_vsub V T₁ T₂, ← neg_vsub_eq_vsub_rev T₂ T₁, norm_neg, hc, norm_sub_sq_real, norm_add_sq_real, inner_add_left, real_inner_comm w u, iu, iv, huv', nu, nv]
      ring
- id: pitot_tangential_quadrilateral
  kind: named
  level: high
  topic: 円・ピトーの定理
  statement: 実内積空間上のアフィン空間で、球面（平面なら円）に四角形$ABCD$の4辺の直線が接し、接点$E,F,G,H$がそれぞれ線分$AB,BC,CD,DA$の上にあるとき、$AB+CD=BC+DA$である（ピトーの定理）。
  statement_en: If the lines AB, BC, CD, DA are tangent to a sphere (a circle in the plane) at points E, F, G, H lying on the segments AB, BC, CD, DA respectively, then |AB| + |CD| = |BC| + |DA|.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - 直線$AB,BC,CD,DA$はそれぞれ$E,F,G,H$で接する
  - $E,F,G,H$はそれぞれ線分$AB,BC,CD,DA$の上にある
  quantifiers:
  - 任意の球面と点$A,B,C,D,E,F,G,H$
  conclusion: $AB+CD=BC+DA$である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面をとる。直線$AB,BC,CD,DA$はそれぞれ$E,F,G,H$で接し、$E,F,G,H$はそれぞれ線分$AB,BC,CD,DA$の上にあるとする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    接線上の点$U$と接点$T$について、三平方の定理より$UO^2=UT^2+r^2$である。$A$は$E,H$での接線の上にあるので$AE^2=AO^2-r^2=AH^2$、すなわち$AE=AH$である。同様に$BE=BF$、$CF=CG$、$DG=DH$である。
    接点は辺の上にあるので$AB=AE+EB$、$BC=BF+FC$、$CD=CG+GD$、$DA=DH+HA$である。よって$AB+CD=AE+EB+CG+GD=AH+BF+CF+DH=(BF+FC)+(DH+HA)=BC+DA$である。
  strategy: Group the four sides into pairs of equal tangent segments from each vertex.
  sketch:
  - 'derive: The Pythagorean theorem gives equal tangent lengths from each vertex.'
  - 'derive: Each side is the sum of two tangent segments because the contact points lie on the sides.'
  - 'conclude: Regrouping gives |AB|+|CD| = |BC|+|DA|.'
  openmath: (forall (o r a b c d e f g h) (-> (and (line_tangent_to_circle_at a b e o r) (line_tangent_to_circle_at b c f o r) (line_tangent_to_circle_at c d g o r) (line_tangent_to_circle_at d a h o r) (weakly_between a e b) (weakly_between b f c) (weakly_between c g d) (weakly_between d h a)) (= (+ (dist_of a b) (dist_of c d)) (+ (dist_of b c) (dist_of d a)))))
  hard_negative:
    statement: 任意の凸四角形で$AB+CD=BC+DA$である。
    reason: 辺の長さが$1,2$の長方形では左辺が$2$、右辺が$4$である。内接円があることが必要である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B C D E F G H : P), s.IsTangentAt E line[ℝ, A, B] → s.IsTangentAt F line[ℝ, B, C] → s.IsTangentAt G line[ℝ, C, D] → s.IsTangentAt H line[ℝ, D, A] → Wbtw ℝ A E B → Wbtw ℝ B F C → Wbtw ℝ C G D → Wbtw ℝ D H A → dist A B + dist C D = dist B C + dist D A
  proof: |
    by
      intro V P _ _ _ _ s A B C D E F G H h1 h2 h3 h4 w1 w2 w3 w4
      have e1 := h1.dist_eq_of_mem_of_mem h4 (left_mem_affineSpan_pair ℝ A B) (right_mem_affineSpan_pair ℝ D A)
      have e2 := h1.dist_eq_of_mem_of_mem h2 (right_mem_affineSpan_pair ℝ A B) (left_mem_affineSpan_pair ℝ B C)
      have e3 := h2.dist_eq_of_mem_of_mem h3 (right_mem_affineSpan_pair ℝ B C) (left_mem_affineSpan_pair ℝ C D)
      have e4 := h3.dist_eq_of_mem_of_mem h4 (right_mem_affineSpan_pair ℝ C D) (left_mem_affineSpan_pair ℝ D A)
      have d1 := w1.dist_add_dist
      have d2 := w2.dist_add_dist
      have d3 := w3.dist_add_dist
      have d4 := w4.dist_add_dist
      rw [dist_comm E B] at d1
      rw [dist_comm F C] at d2
      rw [dist_comm G D] at d3
      rw [dist_comm H A] at d4
      linarith
- id: triangle_incircle_tangent_length
  kind: gap
  level: high
  topic: 円・内接円の接点までの長さ
  statement: 実内積空間上のアフィン空間で、球面（平面なら円）に三角形$ABC$の3辺の直線$BC,CA,AB$が$D,E,F$で接し、接点がそれぞれ線分$BC,CA,AB$の上にあるとき、$2AF=AB+AC-BC$である。
  statement_en: If lines BC, CA, AB are tangent to a sphere (a circle in the plane) at points D, E, F lying on the segments BC, CA, AB, then 2|AF| = |AB| + |AC| - |BC|.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - 直線$BC,CA,AB$はそれぞれ$D,E,F$で接する
  - $D,E,F$はそれぞれ線分$BC,CA,AB$の上にある
  quantifiers:
  - 任意の球面と点$A,B,C,D,E,F$
  conclusion: $2AF=AB+AC-BC$である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面をとる。直線$BC,CA,AB$はそれぞれ$D,E,F$で接し、$D,E,F$はそれぞれ線分$BC,CA,AB$の上にあるとする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。
    接線上の点$U$と接点$T$について$UO^2=UT^2+r^2$なので、同じ点からの接線の長さは等しい。よって$AF=AE$、$BF=BD$、$CD=CE$である。
    接点は辺の上にあるので、$AB+AC-BC=(AF+FB)+(AE+EC)-(BD+DC)=2AF+(BF-BD)+(CE-CD)=2AF$である。
  strategy: Substitute equal tangent lengths into the sum of the sides.
  sketch:
  - 'derive: Equal tangent lengths give |AF| = |AE|, |BF| = |BD| and |CD| = |CE|.'
  - 'derive: Each side splits at its contact point.'
  - 'conclude: Substituting gives |AB|+|AC|-|BC| = 2|AF|.'
  openmath: (forall (o r a b c d e f) (-> (and (line_tangent_to_circle_at b c d o r) (line_tangent_to_circle_at c a e o r) (line_tangent_to_circle_at a b f o r) (weakly_between b d c) (weakly_between c e a) (weakly_between a f b)) (= (* 2 (dist_of a f)) (- (+ (dist_of a b) (dist_of a c)) (dist_of b c)))))
  hard_negative:
    statement: 同じ設定で$2AF=AB+BC-AC$である。
    reason: $AB=3$、$AC=4$、$BC=5$の直角三角形では$AF=1$で、右辺は$4$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B C D E F : P), s.IsTangentAt D line[ℝ, B, C] → s.IsTangentAt E line[ℝ, C, A] → s.IsTangentAt F line[ℝ, A, B] → Wbtw ℝ B D C → Wbtw ℝ C E A → Wbtw ℝ A F B → 2 * dist A F = dist A B + dist A C - dist B C
  proof: |
    by
      intro V P _ _ _ _ s A B C D E F h1 h2 h3 w1 w2 w3
      have e1 := h3.dist_eq_of_mem_of_mem h2 (left_mem_affineSpan_pair ℝ A B) (right_mem_affineSpan_pair ℝ C A)
      have e2 := h3.dist_eq_of_mem_of_mem h1 (right_mem_affineSpan_pair ℝ A B) (left_mem_affineSpan_pair ℝ B C)
      have e3 := h1.dist_eq_of_mem_of_mem h2 (right_mem_affineSpan_pair ℝ B C) (left_mem_affineSpan_pair ℝ C A)
      have d1 := w1.dist_add_dist
      have d2 := w2.dist_add_dist
      have d3 := w3.dist_add_dist
      rw [dist_comm D C] at d1
      rw [dist_comm E A] at d2
      rw [dist_comm F B] at d3
      rw [dist_comm C A] at d2
      linarith
