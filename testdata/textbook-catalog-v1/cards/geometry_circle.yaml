  statement: 実内積空間上のアフィン空間で、中心$O$、半径$r$の球面（平面なら円）の上の相異なる点$A,B$と直線$AB$上の点$H$について、$H$が$A$と$B$の間に真にあることと$HO<r$は同値である。
