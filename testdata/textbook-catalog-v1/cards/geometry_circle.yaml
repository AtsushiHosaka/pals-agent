    statement: 直線$AB$の外の任意の点$X$から直線$AB$に下ろした垂線の足は、弦$AB$の中点である。
    reason: 単位円で$A=(-1,0)$、$B=(1,0)$、$X=(1/2,1)$とすると足は$(1/2,0)$で、中点$(0,0)$ではない。中心からの垂線であることが必要である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B H : P), A ∈ s → B ∈ s → A ≠ B → H ∈ line[ℝ, A, B] → inner ℝ (s.center -ᵥ H) (B -ᵥ A) = 0 → H = midpoint ℝ A B
  proof: |
    by
      intro V P _ _ _ _ s A B H hA hB hAB hH hperp
      have hM := EuclideanGeometry.Sphere.inner_vsub_center_midpoint_vsub hA hB
      have hsub : midpoint ℝ A B -ᵥ H ∈ (line[ℝ, A, B]).direction := AffineSubspace.vsub_mem_direction (wbtw_midpoint ℝ A B).mem_affineSpan hH
      rw [direction_affineSpan, mem_vectorSpan_pair_rev] at hsub
      obtain ⟨k, hk⟩ := hsub
      have hz : inner ℝ (midpoint ℝ A B -ᵥ H) (B -ᵥ A) = 0 := by
        rw [← vsub_sub_vsub_cancel_right (midpoint ℝ A B) H s.center, inner_sub_left, ← neg_vsub_eq_vsub_rev s.center (midpoint ℝ A B), ← neg_vsub_eq_vsub_rev s.center H, inner_neg_left, inner_neg_left, hM, hperp]
        simp
      rw [← hk, inner_smul_left, real_inner_self_eq_norm_sq] at hz
      have hne : ‖B -ᵥ A‖ ≠ 0 := norm_ne_zero_iff.mpr (vsub_ne_zero.mpr hAB.symm)
      have hk0 : k = 0 := by
        simpa [hne] using hz
      rw [hk0, zero_smul] at hk
      exact (vsub_eq_zero_iff_eq.mp hk.symm).symm
- id: half_chord_center_distance_pythagoras
  kind: gap
  level: middle
  topic: 円・弦と中心の距離
  statement: 実内積空間上のアフィン空間で、中心$O$、半径$r$の球面（平面なら円）の上の点$A,B$について、弦$AB$の中点を$M$とすると$OM^2+(AB/2)^2=r^2$である。
  statement_en: If A, B lie on a sphere with center O and radius r (a circle in the plane) and M is the midpoint of AB, then |OM|^2 + (|AB|/2)^2 = r^2.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $A,B$は中心$O$、半径$r$の球面の上にある
  - $M$は$A,B$の中点である
  quantifiers:
  - 任意の球面と点$A,B$
  conclusion: $OM^2+(AB/2)^2=r^2$である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面の上に点$A,B$をとり、$M$を$A,B$の中点とする。$a=A-O$、$b=B-O$とおくと$\|a\|=\|b\|=r$である。
    $M-O=\tfrac12(a+b)$、$A-B=a-b$である。中線定理（平行四辺形の法則）$\|a+b\|^2+\|a-b\|^2=2\|a\|^2+2\|b\|^2$より、$OM^2+(AB/2)^2=\tfrac14(\|a+b\|^2+\|a-b\|^2)=\tfrac14\cdot4r^2=r^2$である。
  strategy: Apply the parallelogram law to the two radius vectors.
  sketch:
  - 'setup: Write a = A-O, b = B-O, both of norm r.'
  - 'translate: M-O = (a+b)/2 and A-B = a-b.'
  - 'apply_theorem: The parallelogram law gives |a+b|^2 + |a-b|^2 = 4r^2.'
  - 'conclude: Dividing by 4 gives the claim.'
  openmath: (forall (o r a b) (-> (and (on_circle a o r) (on_circle b o r)) (= (+ (^ (dist_of (midpoint_of a b) o) 2) (^ (/ (dist_of a b) 2) 2)) (^ r 2))))
  hard_negative:
    statement: 弦の中点$M$について$OM+AB/2=r$である。
    reason: 単位円で$A=(1,0)$、$B=(0,1)$とすると$OM=AB/2=\sqrt2/2$で、和は$\sqrt2$である。成り立つのは2乗の和である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B : P), A ∈ s → B ∈ s → dist (midpoint ℝ A B) s.center ^ 2 + (dist A B / 2) ^ 2 = s.radius ^ 2
  proof: |
    by
      intro V P _ _ _ _ s A B hA hB
      have hA' : ‖A -ᵥ s.center‖ = s.radius := by rw [← dist_eq_norm_vsub V]; exact hA
      have hB' : ‖B -ᵥ s.center‖ = s.radius := by rw [← dist_eq_norm_vsub V]; exact hB
      have hm : midpoint ℝ A B -ᵥ s.center = (1 / 2 : ℝ) • ((A -ᵥ s.center) + (B -ᵥ s.center)) := by
        rw [midpoint_vsub, smul_add]; simp
      rw [dist_eq_norm_vsub V (midpoint ℝ A B), dist_eq_norm_vsub V A B, hm, ← vsub_sub_vsub_cancel_right A B s.center, norm_smul]
      have hp := parallelogram_law_with_norm ℝ (A -ᵥ s.center) (B -ᵥ s.center)
      rw [hA', hB', vsub_sub_vsub_cancel_right] at hp
      norm_num
      nlinarith
- id: equal_chords_iff_equal_center_distance
  kind: gap
  level: high
  topic: 円・等しい弦
  statement: 実内積空間上のアフィン空間で、同じ球面（平面なら円）の上の点$A,B,C,D$について、$AB=CD$であることと、中心から弦$AB$の中点までの距離が中心から弦$CD$の中点までの距離に等しいことは同値である。
  statement_en: For points A, B, C, D on one sphere with center O (a circle in the plane), |AB| = |CD| if and only if the midpoints of AB and CD are at the same distance from O.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $A,B,C,D$は中心$O$の同じ球面の上にある
  quantifiers:
  - 任意の球面と点$A,B,C,D$
  conclusion: $AB=CD$と$OM=ON$は同値である。ここで$M,N$は$AB,CD$の中点である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r$の球面の上に点$A,B,C,D$をとり、$M,N$を$AB,CD$の中点とする。
    $a=A-O$、$b=B-O$とおくと、平行四辺形の法則より$OM^2+(AB/2)^2=\tfrac14(\|a+b\|^2+\|a-b\|^2)=r^2$である。同様に$ON^2+(CD/2)^2=r^2$である。
    よって$AB=CD$なら$OM^2=ON^2$であり、距離は非負なので$OM=ON$である。逆に$OM=ON$なら$(AB/2)^2=(CD/2)^2$であり、$AB=CD$である。
  strategy: Both quantities are tied by |OM|^2 + (|AB|/2)^2 = r^2.
  sketch:
  - 'apply_theorem: For each chord, the squared distance from the center plus the squared half chord equals r^2.'
  - 'derive: Equal chords give equal squared distances, and conversely.'
  - 'conclude: Nonnegativity removes the squares.'
  openmath: (forall (o r a b c d) (-> (and (on_circle a o r) (on_circle b o r) (on_circle c o r) (on_circle d o r)) (<-> (= (dist_of a b) (dist_of c d)) (= (dist_of (midpoint_of a b) o) (dist_of (midpoint_of c d) o)))))
  hard_negative:
    statement: 半径の異なる2円でも、等しい弦は中心から等距離にある。
    reason: 半径$1$の円の長さ$2$の弦は中心を通るが、半径$2$の円の長さ$2$の弦の中点は中心から距離$\sqrt3$にある。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B C D : P), A ∈ s → B ∈ s → C ∈ s → D ∈ s → (dist A B = dist C D ↔ dist (midpoint ℝ A B) s.center = dist (midpoint ℝ C D) s.center)
  proof: |
    by
      intro V P _ _ _ _ s A B C D hA hB hC hD
      have key : ∀ X Y : P, X ∈ s → Y ∈ s → dist (midpoint ℝ X Y) s.center ^ 2 + (dist X Y / 2) ^ 2 = s.radius ^ 2 := by
        intro X Y hX hY
        have hA' : ‖X -ᵥ s.center‖ = s.radius := by rw [← dist_eq_norm_vsub V]; exact hX
        have hB' : ‖Y -ᵥ s.center‖ = s.radius := by rw [← dist_eq_norm_vsub V]; exact hY
        have hm : midpoint ℝ X Y -ᵥ s.center = (1 / 2 : ℝ) • ((X -ᵥ s.center) + (Y -ᵥ s.center)) := by
          rw [midpoint_vsub, smul_add]; simp
        rw [dist_eq_norm_vsub V (midpoint ℝ X Y), dist_eq_norm_vsub V X Y, hm, ← vsub_sub_vsub_cancel_right X Y s.center, norm_smul]
        have hp := parallelogram_law_with_norm ℝ (X -ᵥ s.center) (Y -ᵥ s.center)
        rw [hA', hB', vsub_sub_vsub_cancel_right] at hp
        norm_num
        nlinarith
      have h1 := key A B hA hB
      have h2 := key C D hC hD
      constructor
      · intro h
        rw [h] at h1
        have : dist (midpoint ℝ A B) s.center ^ 2 = dist (midpoint ℝ C D) s.center ^ 2 := by linarith
        exact (sq_eq_sq₀ dist_nonneg dist_nonneg).mp this
      · intro h
        rw [h] at h1
        have : (dist A B / 2) ^ 2 = (dist C D / 2) ^ 2 := by linarith
        have := (sq_eq_sq₀ (by positivity) (by positivity)).mp this
        linarith
- id: equal_chords_iff_equal_central_angles
  kind: gap
  level: middle
  topic: 円・中心角と弦
  statement: 実内積空間上のアフィン空間で、中心$O$、半径$r>0$の球面（平面なら円）の上の点$A,B,C,D$について、$AB=CD$であることと$\angle AOB=\angle COD$であることは同値である。
  statement_en: For points A, B, C, D on a sphere with center O and radius r > 0 (a circle in the plane), |AB| = |CD| if and only if ∠AOB = ∠COD.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $A,B,C,D$は中心$O$、半径$r$の球面の上にある
  - $r>0$
  quantifiers:
  - 任意の球面と点$A,B,C,D$
  conclusion: $AB=CD$と$\angle AOB=\angle COD$は同値である。
  answer: |
    実内積空間上のアフィン空間で、中心$O$、半径$r>0$の球面の上に点$A,B,C,D$をとる。
    余弦定理より$AB^2=2r^2-2r^2\cos\angle AOB$、$CD^2=2r^2-2r^2\cos\angle COD$である。
    $\angle AOB=\angle COD$なら右辺が等しく、長さは非負なので$AB=CD$である。逆に$AB=CD$なら、$r>0$より$\cos\angle AOB=\cos\angle COD$である。2つの角は$[0,\pi]$にあり、$\cos$はそこで単射なので、$\angle AOB=\angle COD$である。
  strategy: Use the law of cosines at the center and injectivity of cosine on [0,π].
  sketch:
  - 'apply_theorem: The law of cosines gives each squared chord as 2r^2 - 2r^2 cos of the central angle.'
  - 'derive: Equal angles give equal squared chords.'
  - 'derive: Equal chords and r > 0 give equal cosines.'
  - 'conclude: Cosine is injective on [0,π].'
  openmath: (forall (o r a b c d) (-> (and (> r 0) (on_circle a o r) (on_circle b o r) (on_circle c o r) (on_circle d o r)) (<-> (= (dist_of a b) (dist_of c d)) (= (euclid_angle a o b) (euclid_angle c o d)))))
  hard_negative:
    statement: 半径の異なる2円でも、中心角が等しければ弦の長さは等しい。
    reason: 中心角$\pi$の弦の長さは半径$1$の円で$2$、半径$2$の円で$4$である。同じ円であることが必要である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s : EuclideanGeometry.Sphere P) (A B C D : P), 0 < s.radius → A ∈ s → B ∈ s → C ∈ s → D ∈ s → (dist A B = dist C D ↔ EuclideanGeometry.angle A s.center B = EuclideanGeometry.angle C s.center D)
  proof: |
    by
      intro V P _ _ _ _ s A B C D hr hA hB hC hD
      have key : ∀ X Y : P, X ∈ s → Y ∈ s → dist X Y ^ 2 = 2 * s.radius ^ 2 - 2 * s.radius ^ 2 * Real.cos (EuclideanGeometry.angle X s.center Y) := by
        intro X Y hX hY
        have h := EuclideanGeometry.dist_sq_eq_dist_sq_add_dist_sq_sub_two_mul_dist_mul_dist_mul_cos_angle X s.center Y
        have hX' : dist X s.center = s.radius := hX
        have hY' : dist Y s.center = s.radius := hY
        rw [sq, h, hX', hY']
        ring
      have h1 := key A B hA hB
      have h2 := key C D hC hD
      have hr2 : 0 < s.radius ^ 2 := by positivity
      constructor
      · intro h
        rw [h, h2] at h1
        have hcos : Real.cos (EuclideanGeometry.angle A s.center B) = Real.cos (EuclideanGeometry.angle C s.center D) := by
          have : 2 * s.radius ^ 2 * (Real.cos (EuclideanGeometry.angle A s.center B) - Real.cos (EuclideanGeometry.angle C s.center D)) = 0 := by linarith
          have := (mul_eq_zero.mp this).resolve_left (by positivity)
          linarith
        exact Real.injOn_cos ⟨EuclideanGeometry.angle_nonneg _ _ _, EuclideanGeometry.angle_le_pi _ _ _⟩ ⟨EuclideanGeometry.angle_nonneg _ _ _, EuclideanGeometry.angle_le_pi _ _ _⟩ hcos
      · intro h
        rw [h, ← h2] at h1
        exact (sq_eq_sq₀ dist_nonneg dist_nonneg).mp h1
