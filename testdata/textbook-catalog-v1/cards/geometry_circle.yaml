- id: common_tangent_bisected_by_common_chord
  kind: gap
  level: high
  topic: 2円・共通接線と共通弦
  statement: 実内積空間上のアフィン空間で、2つの球面（平面なら2円）が点$A,B$を共有し、直線$T_1T_2$（$T_1\neq T_2$）が第1の球面に$T_1$で、第2の球面に$T_2$で接するとする。直線$AB$と直線$T_1T_2$の共有点$H$は$T_1,T_2$の中点である。
  statement_en: If two spheres (circles in the plane) share points A, B and line T1T2 with T1 ≠ T2 is tangent to the first at T1 and to the second at T2, then any common point H of lines AB and T1T2 is the midpoint of T1T2.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $T_1\neq T_2$
  - 直線$T_1T_2$は第1の球面に$T_1$で、第2の球面に$T_2$で接する
  - $A,B$は2つの球面の共有点である
  - $H$は$A,B$のアフィン包と直線$T_1T_2$の両方に属する
  quantifiers:
  - 任意の2つの球面と点$A,B,T_1,T_2,H$
  conclusion: $H$は$T_1,T_2$の中点である。
  answer: |
    実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$r_1,r_2$の2つの球面をとり、点$A,B$を共有するとする。$T_1\neq T_2$で、直線$T_1T_2$は第1の球面に$T_1$で、第2の球面に$T_2$で接するとする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。$H$は$A,B$のアフィン包と直線$T_1T_2$の両方に属するとする。
    $H$は接線上にあるので、三平方の定理より$HO_1^2=HT_1^2+r_1^2$である。$H=A+tu$、$u=B-A$と書き、$x=A-O_1$とおく。$\|x+u\|=\|x\|=r_1$より$2\langle x,u\rangle+\|u\|^2=0$なので、$HO_1^2-r_1^2=(t^2-t)\|u\|^2$である。一方$HA\cdot HB=|t^2-t|\|u\|^2$である。$HO_1^2-r_1^2=HT_1^2\geq0$なので、$HT_1^2=HA\cdot HB$である。同じ計算で$HT_2^2=HA\cdot HB$である。よって$HT_1=HT_2$である。
    $H=T_1+s(T_2-T_1)$と書くと、$HT_1=|s|\,T_1T_2$、$HT_2=|1-s|\,T_1T_2$である。$T_1T_2>0$より$|s|=|1-s|$なので$s=1/2$である。すなわち$H$は中点である。
  strategy: The tangent lengths from H to both spheres equal the square root of |HA||HB|.
  sketch:
  - 'apply_theorem: The tangent-secant theorem for each sphere gives |HT1|^2 = |HA||HB| = |HT2|^2.'
  - 'setup: Write H = T1 + t(T2-T1).'
  - 'derive: The equal distances give |t| = |1-t|.'
  - 'conclude: So t = 1/2 and H is the midpoint.'
  openmath: (forall (o1 r1 o2 r2 a b t1 t2 h) (-> (and (!= t1 t2) (tangent_to_circle_at t1 t2 o1 r1) (tangent_to_circle_at t2 t1 o2 r2) (on_circle a o1 r1) (on_circle b o1 r1) (on_circle a o2 r2) (on_circle b o2 r2) (on_line h a b) (on_line h t1 t2)) (= h (midpoint_of t1 t2))))
  hard_negative:
    statement: 半径の異なる2円の共通接線は、中心線との交点で二等分される。
    reason: 中心$(0,1),(4,2)$、半径$1,2$の2円の接線$y=0$では接点は$(0,0),(4,0)$だが、中心線は$(-4,0)$を通る。二等分するのは共通弦の直線である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s₁ s₂ : EuclideanGeometry.Sphere P) (A B T₁ T₂ H : P), T₁ ≠ T₂ → s₁.IsTangentAt T₁ line[ℝ, T₁, T₂] → s₂.IsTangentAt T₂ line[ℝ, T₁, T₂] → A ∈ s₁ → B ∈ s₁ → A ∈ s₂ → B ∈ s₂ → H ∈ line[ℝ, A, B] → H ∈ line[ℝ, T₁, T₂] → H = midpoint ℝ T₁ T₂
  proof: |
    by
      intro V P _ _ _ _ s₁ s₂ A B T₁ T₂ H hT h1 h2 hA1 hB1 hA2 hB2 hH hHT
      have t1 : s₁.IsTangentAt T₁ line[ℝ, H, T₁] :=
        ⟨h1.mem_sphere, right_mem_affineSpan_pair ℝ H T₁, (affineSpan_pair_le_of_mem_of_mem hHT (left_mem_affineSpan_pair ℝ T₁ T₂)).trans h1.le_orthRadius⟩
      have t2 : s₂.IsTangentAt T₂ line[ℝ, H, T₂] :=
        ⟨h2.mem_sphere, right_mem_affineSpan_pair ℝ H T₂, (affineSpan_pair_le_of_mem_of_mem hHT (right_mem_affineSpan_pair ℝ T₁ T₂)).trans h2.le_orthRadius⟩
      have e1 := EuclideanGeometry.Sphere.dist_sq_eq_mul_dist_of_tangent_and_secant hA1 hB1 hH t1
      have e2 := EuclideanGeometry.Sphere.dist_sq_eq_mul_dist_of_tangent_and_secant hA2 hB2 hH t2
      have heq : dist H T₁ = dist H T₂ := (sq_eq_sq₀ dist_nonneg dist_nonneg).mp (e1.trans e2.symm)
      obtain ⟨t, ht⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hHT
      rw [← ht, dist_lineMap_left, dist_lineMap_right] at heq
      have hL : dist T₁ T₂ ≠ 0 := dist_ne_zero.mpr hT
      have habs : ‖t‖ = ‖1 - t‖ := mul_right_cancel₀ hL heq
      simp only [Real.norm_eq_abs] at habs
      have ht12 : t = 1 / 2 := by
        rcases abs_eq_abs.mp habs with h | h <;> linarith
      rw [← ht, ht12]
      simp [midpoint]
- id: external_common_tangent_length
  kind: gap
  level: high
  topic: 2円・共通外接線の長さ
  statement: 実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$r_1,r_2$の2つの球面（平面なら2円）に直線$T_1T_2$（$T_1\neq T_2$）が$T_1,T_2$で接し、$O_1,O_2$が直線の同じ側にある（どちらも直線上にない。3次元以上では、直線を境界とする同じ半平面にあることをいう）とき、$T_1T_2^2=O_1O_2^2-(r_1-r_2)^2$である。
  statement_en: If line T1T2 with T1 ≠ T2 is tangent at T1 and T2 to spheres (circles in the plane) with centers O1, O2 and radii r1, r2, and O1, O2 lie strictly on the same side of the line, then |T1T2|^2 = |O1O2|^2 - (r1 - r2)^2.
  assumptions:
  - 点は実内積空間上のアフィン空間にある
  - $T_1\neq T_2$
  - 直線$T_1T_2$は第1の球面に$T_1$で、第2の球面に$T_2$で接する
  - $O_1,O_2$は直線$T_1T_2$の同じ側にあり、直線上にない
  quantifiers:
  - 任意の2つの球面と点$T_1,T_2$
  conclusion: $T_1T_2^2=O_1O_2^2-(r_1-r_2)^2$である。
  answer: |
    実内積空間上のアフィン空間で、中心$O_1,O_2$、半径$r_1,r_2$の2つの球面をとり、$T_1\neq T_2$の直線$T_1T_2$が第1に$T_1$で、第2に$T_2$で接するとする。ここで直線が中心$O'$の球面（平面なら円）に、その上の点$Z$で接するとは、直線上の任意の点$U$について$\langle U-Z,Z-O'\rangle=0$となることである。$O_1,O_2$は直線の同じ側にあるとする。これは、直線上の点$p_1,p_2$と$\alpha,\beta>0$があって$\alpha(O_1-p_1)=\beta(O_2-p_2)$となり、$O_1,O_2$が直線上にないことである。
    $u=T_1-O_1$、$v=T_2-O_2$、$w=T_2-T_1\neq0$とおく。接することから$\langle w,u\rangle=\langle w,v\rangle=0$であり、$\|u\|=r_1$、$\|v\|=r_2$である。$T_1-p_1=aw$、$T_2-p_2=bw$と書くと、$O_1-p_1=aw-u$、$O_2-p_2=bw-v$である。
    $\alpha(aw-u)=\beta(bw-v)$と$w$の内積をとると$(\alpha a-\beta b)\|w\|^2=0$なので$\alpha a=\beta b$であり、$\alpha u=\beta v$である。ノルムをとると$\alpha r_1=\beta r_2$である。$v$との内積をとると$\alpha\langle u,v\rangle=\beta r_2^2=\alpha r_1r_2$なので、$\langle u,v\rangle=r_1r_2$である。
    $O_2-O_1=u+w-v$と直交性より、$O_1O_2^2=\|w\|^2+\|u-v\|^2=T_1T_2^2+r_1^2+r_2^2-2r_1r_2=T_1T_2^2+(r_1-r_2)^2$である。
  strategy: Decompose O2-O1 into the tangent segment and the radii; on the same side the radii point the same way.
  sketch:
  - 'setup: Write u = T1-O1, v = T2-O2, w = T2-T1; then u and v are orthogonal to w.'
  - 'translate: The same-side condition gives α(aw-u) = β(bw-v) with α, β > 0.'
  - 'derive: The inner product with w gives αa = βb, hence αu = βv.'
  - 'derive: So <u,v> = r1 r2.'
  - 'conclude: Expanding O2-O1 = u+w-v gives the formula.'
  openmath: (forall (o1 r1 o2 r2 t1 t2) (-> (and (!= t1 t2) (tangent_to_circle_at t1 t2 o1 r1) (tangent_to_circle_at t2 t1 o2 r2) (same_side_of_line o1 o2 t1 t2)) (= (^ (dist_of t1 t2) 2) (- (^ (dist_of o1 o2) 2) (^ (- r1 r2) 2)))))
  hard_negative:
    statement: $O_1,O_2$が接線の同じ側にあるとき$T_1T_2^2=O_1O_2^2-(r_1+r_2)^2$である。
    reason: 中心$(0,1),(4,1)$、半径$1,1$、接線$y=0$では$T_1T_2^2=16$、右辺は$12$である。和の形は反対側にあるときの式である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (s₁ s₂ : EuclideanGeometry.Sphere P) (T₁ T₂ : P), T₁ ≠ T₂ → s₁.IsTangentAt T₁ line[ℝ, T₁, T₂] → s₂.IsTangentAt T₂ line[ℝ, T₁, T₂] → (line[ℝ, T₁, T₂]).SSameSide s₁.center s₂.center → dist T₁ T₂ ^ 2 = dist s₁.center s₂.center ^ 2 - (s₁.radius - s₂.radius) ^ 2
  proof: |
    by
      intro V P _ _ _ _ s₁ s₂ T₁ T₂ hT h1 h2 hs
      set u := T₁ -ᵥ s₁.center with hu
      set v := T₂ -ᵥ s₂.center with hv
      set w := T₂ -ᵥ T₁ with hw
      have hw0 : w ≠ 0 := vsub_ne_zero.mpr hT.symm
      have hw2 : ‖w‖ ^ 2 ≠ 0 := pow_ne_zero 2 (norm_ne_zero_iff.mpr hw0)
      have iu : inner ℝ w u = 0 := h1.inner_left_eq_zero_of_mem (right_mem_affineSpan_pair ℝ T₁ T₂)
      have iv : inner ℝ w v = 0 := by
        have := h2.inner_left_eq_zero_of_mem (left_mem_affineSpan_pair ℝ T₁ T₂)
        rw [← neg_vsub_eq_vsub_rev, inner_neg_left, neg_eq_zero] at this
        exact this
      have nu : ‖u‖ = s₁.radius := by rw [hu, ← dist_eq_norm_vsub V]; exact h1.mem_sphere
      have nv : ‖v‖ = s₂.radius := by rw [hv, ← dist_eq_norm_vsub V]; exact h2.mem_sphere
      obtain ⟨⟨p₁, hp₁, p₂, hp₂, hr⟩, hn1, hn2⟩ := hs
      have hdir : ∀ {p q : P}, p ∈ line[ℝ, T₁, T₂] → q ∈ line[ℝ, T₁, T₂] → ∃ a : ℝ, a • w = p -ᵥ q := by
        intro p q hp hq
        have := AffineSubspace.vsub_mem_direction hp hq
        rw [direction_affineSpan, mem_vectorSpan_pair_rev] at this
        exact this
      obtain ⟨a, ha⟩ := hdir (left_mem_affineSpan_pair ℝ T₁ T₂) hp₁
      obtain ⟨b, hb⟩ := hdir (right_mem_affineSpan_pair ℝ T₁ T₂) hp₂
      have hx : s₁.center -ᵥ p₁ ≠ 0 := vsub_ne_zero.mpr (fun h => hn1 (h ▸ hp₁))
      have hy : s₂.center -ᵥ p₂ ≠ 0 := vsub_ne_zero.mpr (fun h => hn2 (h ▸ hp₂))
      obtain ⟨α, β, hα, hβ, heq⟩ := hr.exists_pos hx hy
      have xe : s₁.center -ᵥ p₁ = a • w - u := by rw [ha, hu, vsub_sub_vsub_cancel_left]
      have ye : s₂.center -ᵥ p₂ = b • w - v := by rw [hb, hv, vsub_sub_vsub_cancel_left]
      rw [xe, ye] at heq
      have hab : α * a = β * b := by
        have h3 := congrArg (inner ℝ w) heq
        simp only [inner_smul_right, inner_sub_right, iu, iv, real_inner_self_eq_norm_sq] at h3
        have : (α * a - β * b) * ‖w‖ ^ 2 = 0 := by linear_combination h3
        have := (mul_eq_zero.mp this).resolve_right hw2
        linarith
      have huv : α • u = β • v := by
        have : α • u - β • v = (α * a - β * b) • w := by
          linear_combination (norm := module) -heq
        rw [hab, sub_self, zero_smul] at this
        exact sub_eq_zero.mp this
      have hnorm : α * s₁.radius = β * s₂.radius := by
        have := congrArg norm huv
        rwa [norm_smul, norm_smul, Real.norm_eq_abs, Real.norm_eq_abs, abs_of_pos hα, abs_of_pos hβ, nu, nv] at this
      have hin : α * inner ℝ u v = β * s₂.radius ^ 2 := by
        have := congrArg (fun z => inner ℝ z v) huv
        simp only [inner_smul_left, real_inner_self_eq_norm_sq, nv] at this
        simpa using this
      have huv' : inner ℝ u v = s₁.radius * s₂.radius := by
        have : α * (inner ℝ u v - s₁.radius * s₂.radius) = 0 := by linear_combination hin - s₂.radius * hnorm
        have := (mul_eq_zero.mp this).resolve_left hα.ne'
        linarith
      have hc : s₂.center -ᵥ s₁.center = u + w - v := by
        rw [hu, hv, hw, add_comm, vsub_add_vsub_cancel, vsub_sub_vsub_cancel_left]
      rw [dist_comm s₁.center, dist_eq_norm_vsub V s₂.center, dist_eq_norm_vsub V T₁ T₂, ← neg_vsub_eq_vsub_rev T₂ T₁, norm_neg, hc, norm_sub_sq_real, norm_add_sq_real, inner_add_left, real_inner_comm w u, iu, iv, huv', nu, nv]
      ring
