- id: rat_algebraic_integer_iff_integer
  kind: gap
  level: 3
  topic: 代数的整数論・有理整数との交わり
  statement: 有理数$q$が代数的整数である（$\mathbb{Z}$係数のモニック多項式の根である）ための必要十分条件は、$q$が整数であることである。
  statement_en: A rational number q is integral over the integers if and only if q is an integer.
  assumptions:
  - $q\in\mathbb{Q}$
  quantifiers:
  - 任意の有理数$q$
  conclusion: $q$が代数的整数であることと$q\in\mathbb{Z}$は同値である。
  answer: |
    $q$を有理数とする。

    $q$が代数的整数であると仮定し、$q=a/b$（$a,b\in\mathbb{Z}$、$b\geq 1$、$\gcd(a,b)=1$）と既約分数で表す。整数$c_1,\dots,c_n$を用いて$q^n+c_1q^{n-1}+\dots+c_n=0$と書ける。両辺に$b^n$を掛けると$a^n=-b\,(c_1a^{n-1}+c_2a^{n-2}b+\dots+c_nb^{n-1})$となり、$b$は$a^n$を割る。$\gcd(a,b)=1$より$\gcd(a^n,b)=1$なので$b=1$であり、$q$は整数である。

    逆に$q$が整数なら、$q$はモニック多項式$X-q\in\mathbb{Z}[X]$の根である。
  strategy: Clear denominators in a monic integer relation and use coprimality of numerator and denominator.
  sketch:
  - 'setup: Write q = a/b in lowest terms with a monic integer relation.'
  - 'derive: Multiplying by b^n shows that b divides a^n.'
  - 'derive: Coprimality forces b = 1.'
  - 'conclude: Conversely an integer n is a root of X - n.'
  openmath: (forall (q) (-> (in q Q) (<-> (algebraic_integer q) (in q Z))))
  hard_negative:
    statement: 有理数$q$がモニックとは限らない$\mathbb{Z}$係数の$0$でない多項式の根なら、$q$は整数である。
    reason: $q=1/2$は$2X-1$の根だが整数でない。
  target: |
    ∀ q : ℚ, IsIntegral ℤ q ↔ ∃ n : ℤ, q = n
  proof: |
    by
      intro q
      rw [IsIntegrallyClosed.isIntegral_iff (R := ℤ) (K := ℚ)]
      constructor
      · rintro ⟨n, hn⟩; exact ⟨n, by simpa using hn.symm⟩
      · rintro ⟨n, hn⟩; exact ⟨n, by simpa using hn.symm⟩
- id: algebraic_integer_iff_minpoly_integer_coeffs
  kind: textbook
  level: 3
  topic: 代数的整数論・最小多項式
  statement: 数体$K$の元$x$が代数的整数であるための必要十分条件は、$x$の$\mathbb{Q}$上の最小多項式の係数がすべて整数であることである。
  statement_en: An element x of a number field is an algebraic integer if and only if all coefficients of its minimal polynomial over Q are integers.
  assumptions:
  - $K$は数体
  - $x\in K$
  quantifiers:
  - 任意の数体$K$と$x\in K$
  conclusion: $x$が代数的整数であることと、$x$の$\mathbb{Q}$上の最小多項式が$\mathbb{Z}[X]$に属することは同値である。
  answer: |
    $K$を数体、$x\in K$とし、$f\in\mathbb{Q}[X]$を$x$の最小多項式とする。

    $f\in\mathbb{Z}[X]$なら、$f$はモニックなので$x$は代数的整数である。

    逆に$x$がモニック多項式$g\in\mathbb{Z}[X]$の根であるとする。$f$は$g$を割るので、モニックな$h\in\mathbb{Q}[X]$により$g=fh$と書ける。正の整数$a,b$を、$af$と$bh$がともに原始多項式となるようにとる。$f,h$はモニックなので、$af$の最高次係数は$a$、$bh$の最高次係数は$b$である。Gauss の補題より$(af)(bh)=ab\,g$は原始多項式である。$g$は$\mathbb{Z}[X]$の元なので係数はすべて$ab$で割り切れ、原始性から$ab=1$となる。よって$a=1$であり、$f=af\in\mathbb{Z}[X]$である。
  strategy: The forward direction factors a monic integer polynomial and applies Gauss's lemma.
  sketch:
  - 'setup: Let f be the minimal polynomial and g a monic integer polynomial killing x.'
  - 'derive: Write g = f h with f and h monic rational polynomials.'
  - 'apply_theorem: Gauss''s lemma applied to primitive multiples of f and h forces integer coefficients.'
  - 'conclude: Conversely f itself is a monic integer relation.'
  openmath: (forall (K x) (-> (and (number_field K) (in x K)) (<-> (algebraic_integer x) (forall (i) (-> (in i N) (in (poly_coeff (minimal_polynomial x Q) i) Z))))))
  hard_negative:
    statement: 数体の元$x$が代数的整数なら、$x$を根にもつ有理数係数のモニック多項式の係数はすべて整数である。
    reason: $x=1$は$(X-1)(X-1/2)$の根であるが、この多項式の係数は整数でない。最小多項式に限ることが必要である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (x : K), IsIntegral ℤ x ↔ ∀ i, ∃ n : ℤ, (minpoly ℚ x).coeff i = n
  proof: |
    by
      intro K _ _ x
      constructor
      · intro hx i
        rw [minpoly.isIntegrallyClosed_eq_field_fractions' ℚ hx]
        exact ⟨(minpoly ℤ x).coeff i, by simp⟩
      · intro H
        have hx : IsIntegral ℚ x := Algebra.IsIntegral.isIntegral x
        have h : minpoly ℚ x ∈ Polynomial.lifts (algebraMap ℤ ℚ) :=
          (Polynomial.lifts_iff_coeff_lifts _).2 (fun i => by
            obtain ⟨n, hn⟩ := H i
            exact ⟨n, by simp [hn]⟩)
        obtain ⟨q, hq, _, hm⟩ := Polynomial.lifts_and_natDegree_eq_and_monic h (minpoly.monic hx)
        refine ⟨q, hm, ?_⟩
        rw [← Polynomial.aeval_def, ← Polynomial.aeval_map_algebraMap ℚ, hq]
        exact minpoly.aeval ℚ x
- id: number_field_integer_multiple_is_integral
  kind: gap
  level: 3
  topic: 代数的整数論・分母の払い
  statement: 数体$K$の任意の元$x$に対し、$0$でない整数$d$で$dx$が代数的整数となるものが存在する。
  statement_en: For every element x of a number field there is a nonzero integer d such that dx is an algebraic integer.
  assumptions:
  - $K$は数体
  - $x\in K$
  quantifiers:
  - 任意の数体$K$と$x\in K$
  - ある整数$d\neq 0$
  conclusion: $dx$は代数的整数である。
  answer: |
    $K$を数体、$x\in K$とする。$x$は$\mathbb{Q}$上代数的なので、有理数$c_1,\dots,c_n$により$x^n+c_1x^{n-1}+\dots+c_n=0$と書ける。$c_1,\dots,c_n$の分母の公倍数である正の整数を$d$とする。両辺に$d^n$を掛けると$(dx)^n+(dc_1)(dx)^{n-1}+(d^2c_2)(dx)^{n-2}+\dots+d^nc_n=0$となる。各係数$d^ic_i$は整数なので、$dx$は$\mathbb{Z}$係数のモニック多項式の根であり、代数的整数である。
  strategy: Multiply a monic rational relation by a power of a common denominator.
  sketch:
  - 'setup: Take a monic rational relation for x.'
  - 'construct: Let d be a common denominator of the coefficients.'
  - 'derive: Multiplying by d^n gives a monic integer relation for dx.'
  openmath: (forall (K x) (-> (and (number_field K) (in x K)) (exists (d) (and (in d Z) (!= d 0) (algebraic_integer (* d x))))))
  hard_negative:
    statement: 数体$K$に対し、$0$でない整数$d$を$K$全体で共通にとれば、すべての$x\in K$で$dx$が代数的整数になる。
    reason: $K=\mathbb{Q}$で$d\neq 0$を固定し$x=1/(2d)$とすると、$dx=1/2$は整数でない。$d$は$x$に依存する。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (x : K), ∃ d : ℤ, d ≠ 0 ∧ IsIntegral ℤ ((d : K) * x)
  proof: |
    by
      intro K _ _ x
      have h : IsAlgebraic ℤ x := (IsFractionRing.isAlgebraic_iff ℤ ℚ K).2 (Algebra.IsAlgebraic.isAlgebraic x)
      obtain ⟨d, hd, hz⟩ := h.exists_integral_multiple
      exact ⟨d, hd, by simpa [zsmul_eq_mul] using hz⟩
- id: norm_trace_of_algebraic_integer_are_integers
  kind: gap
  level: 3
  topic: 代数的整数論・ノルムとトレース
  statement: 数体$K$の代数的整数$x$について、$N_{K/\mathbb{Q}}(x)$と$\mathrm{Tr}_{K/\mathbb{Q}}(x)$はともに整数である。
  statement_en: The norm and the trace from a number field to Q of an algebraic integer are integers.
  assumptions:
  - $K$は数体
  - $x\in K$は代数的整数
  quantifiers:
  - 任意の数体$K$と代数的整数$x\in K$
  conclusion: $N_{K/\mathbb{Q}}(x)\in\mathbb{Z}$かつ$\mathrm{Tr}_{K/\mathbb{Q}}(x)\in\mathbb{Z}$である。
  answer: |
    $K$を数体、$x\in K$を代数的整数とし、$f\in\mathbb{Z}[X]$を$x$を根にもつモニック多項式とする。$K$から$\mathbb{C}$への体の埋め込み$\sigma$全体について、$N_{K/\mathbb{Q}}(x)=\prod_\sigma\sigma(x)$、$\mathrm{Tr}_{K/\mathbb{Q}}(x)=\sum_\sigma\sigma(x)$が成り立つ。

    $f(\sigma(x))=\sigma(f(x))=0$なので、各$\sigma(x)$は$\mathbb{C}$の中の代数的整数である。代数的整数の全体は和と積で閉じるので、$N_{K/\mathbb{Q}}(x)$と$\mathrm{Tr}_{K/\mathbb{Q}}(x)$は代数的整数である。この二つは有理数でもあるので、有理数である代数的整数は整数であることから、ともに整数である。
  strategy: Express norm and trace through conjugates, which are algebraic integers, and use that rational algebraic integers are integers.
  sketch:
  - 'translate: Write norm and trace as a product and a sum over complex embeddings.'
  - 'derive: Each conjugate is a root of the same monic integer polynomial.'
  - 'derive: Algebraic integers are closed under sums and products.'
  - 'conclude: A rational algebraic integer is an integer.'
  openmath: (forall (K x) (-> (and (number_field K) (in x K) (algebraic_integer x)) (and (in (relative_norm Q K x) Z) (in (relative_trace Q K x) Z))))
  hard_negative:
    statement: 数体の元$x$のノルムとトレースがともに整数なら、$x$は代数的整数である。
    reason: $x$を$X^3+\tfrac12X+1$（既約）の根とすると、トレースは$0$、ノルムは$-1$だが、最小多項式の係数が整数でないので$x$は代数的整数でない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (x : K), IsIntegral ℤ x → (∃ n : ℤ, Algebra.norm ℚ x = n) ∧ (∃ m : ℤ, Algebra.trace ℚ K x = m)
  proof: |
    by
      intro K _ _ x hx
      constructor
      · obtain ⟨n, hn⟩ := IsIntegrallyClosed.isIntegral_iff.1 (Algebra.isIntegral_norm (R := ℤ) ℚ hx)
        exact ⟨n, by simpa using hn.symm⟩
      · obtain ⟨n, hn⟩ := IsIntegrallyClosed.isIntegral_iff.1 (Algebra.isIntegral_trace (R := ℤ) (L := ℚ) hx)
        exact ⟨n, by simpa using hn.symm⟩
- id: kronecker_conjugates_modulus_one_root_of_unity
  kind: named
  level: 4
  topic: 代数的整数論・Kronecker の定理
  statement: Kronecker の定理。数体$K$の代数的整数$x$について、すべての埋め込み$\varphi\colon K\to\mathbb{C}$で$|\varphi(x)|=1$なら、$x$は$1$の冪根である。
  statement_en: Kronecker's theorem. If x is an algebraic integer of a number field and |φ(x)| = 1 for every complex embedding φ, then x^n = 1 for some positive integer n.
  assumptions:
  - $K$は数体
  - $x\in K$は代数的整数
  - すべての埋め込み$\varphi\colon K\to\mathbb{C}$で$|\varphi(x)|=1$
  quantifiers:
  - 任意の数体$K$とその元$x$
  - ある正の整数$n$
  conclusion: $x^n=1$である。
  answer: |
    $K$を数体、$x\in K$を代数的整数とし、すべての埋め込み$\varphi\colon K\to\mathbb{C}$で$|\varphi(x)|=1$と仮定する。

    すべての正の整数$k$について、$x^k$は代数的整数で、$|\varphi(x^k)|=1$を満たす。$K$の代数的整数のうち、すべての共役の絶対値が$1$以下のものは有限個しかない。よって$x,x^2,x^3,\dots$の中に等しいものがあり、$k<l$で$x^k=x^l$となる。$|\varphi(x)|=1$より$x\neq 0$なので、$x^{l-k}=1$である。
  strategy: The powers of x lie in a finite set of algebraic integers with bounded conjugates, so two of them coincide.
  sketch:
  - 'setup: All powers of x are algebraic integers whose conjugates have modulus one.'
  - 'apply_theorem: Only finitely many algebraic integers of K have all conjugates bounded by one.'
  - 'derive: Hence x^k = x^l for some k < l.'
  - 'conclude: Since x is nonzero, x^(l-k) = 1.'
  openmath: (forall (K x) (-> (and (number_field K) (in x K) (algebraic_integer x) (forall (s) (-> (complex_embedding s K) (= (abs (fn_value s x)) 1)))) (exists (n) (and (in n N) (> n 0) (= (^ x n) 1)))))
  hard_negative:
    statement: 数体の元$x$のすべての共役の絶対値が$1$なら、代数的整数でなくても$x$は$1$の冪根である。
    reason: $x=(3+4i)/5\in\mathbb{Q}(i)$は両方の共役の絶対値が$1$だが、$1$の冪根なら代数的整数になるはずなのに最小多項式$X^2-\tfrac65X+1$の係数が整数でない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (x : K), IsIntegral ℤ x → (∀ φ : K →+* ℂ, ‖φ x‖ = 1) → ∃ n : ℕ, 0 < n ∧ x ^ n = 1
  proof: |
    by
      intro K _ _ x hx h
      obtain ⟨n, hn, hxn⟩ := NumberField.Embeddings.pow_eq_one_of_norm_eq_one K ℂ hx h
      exact ⟨n, hn, hxn⟩
- id: finite_algebraic_integers_bounded_conjugates
  kind: textbook
  level: 4
  topic: 代数的整数論・共役の有界性
  statement: 数体$K$と実数$B$に対し、$K$の代数的整数$x$のうち、すべての埋め込み$\varphi\colon K\to\mathbb{C}$で$|\varphi(x)|\leq B$を満たすものは有限個である。
  statement_en: For a number field K and a real number B, only finitely many algebraic integers x of K satisfy |φ(x)| ≤ B for every complex embedding φ.
  assumptions:
  - $K$は数体
  - $B\in\mathbb{R}$
  quantifiers:
  - 任意の数体$K$と実数$B$
  conclusion: 条件を満たす$x\in K$の全体は有限集合である。
  answer: |
    $K$を数体、$n=[K:\mathbb{Q}]$、$B$を実数とする。$B<0$なら条件を満たす$x$はないので、$B\geq 0$とする。

    条件を満たす$x$に対し、$g_x(X)=\prod_\varphi(X-\varphi(x))$とおく。積は$n$個の埋め込み全体を動く。$x$の最小多項式を$f$とすると、$g_x=f^{[K:\mathbb{Q}(x)]}$である。$x$は代数的整数なので$f\in\mathbb{Z}[X]$であり、$g_x\in\mathbb{Z}[X]$となる。$g_x$の$X^{n-k}$の係数は$\binom{n}{k}$個の積の和の符号違いなので、絶対値が$\binom{n}{k}B^k$以下である。

    整数で有界な係数をもつ$n$次モニック多項式は有限個しかなく、それぞれの根も有限個である。埋め込みを一つ固定して$\varphi_0$とすると、$\varphi_0(x)$は$g_x$の根である。$\varphi_0$は単射なので、$x$は有限個しかない。
  strategy: The characteristic polynomials have bounded integer coefficients, so there are finitely many of them and finitely many roots.
  sketch:
  - 'construct: Attach to x the polynomial g_x, the product of X - φ(x) over all embeddings.'
  - 'derive: g_x has integer coefficients because it is a power of the minimal polynomial.'
  - 'derive: The coefficients are bounded in terms of n and B.'
  - 'conclude: Finitely many polynomials have finitely many roots, and one embedding is injective.'
  openmath: (forall (K B) (-> (and (number_field K) (in B R)) (finite_set (bounded_conjugate_integers K B))))
  hard_negative:
    statement: 数体$K$と実数$B$に対し、すべての共役の絶対値が$B$以下である$K$の元は有限個である。
    reason: $K=\mathbb{Q}$、$B=1$とすると、$[-1,1]$の有理数は無限個ある。代数的整数の仮定が必要である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (B : ℝ), {x : K | IsIntegral ℤ x ∧ ∀ φ : K →+* ℂ, ‖φ x‖ ≤ B}.Finite
  proof: |
    by
      intro K _ _ B
      exact NumberField.Embeddings.finite_of_norm_le K ℂ B
- id: nonzero_algebraic_integer_has_large_conjugate
  kind: gap
  level: 3
  topic: 代数的整数論・共役の下界
  statement: 数体$K$の$0$でない代数的整数$x$には、$|\sigma(x)|\geq 1$となる埋め込み$\sigma\colon K\to\mathbb{C}$が存在する。
  statement_en: A nonzero algebraic integer x of a number field has a complex embedding σ with |σ(x)| ≥ 1.
  assumptions:
  - $K$は数体
  - $x\in K$は$0$でない代数的整数
  quantifiers:
  - 任意の数体$K$と$0$でない代数的整数$x\in K$
  - ある埋め込み$\sigma\colon K\to\mathbb{C}$
  conclusion: $|\sigma(x)|\geq 1$である。
  answer: |
    $K$を数体、$x\in K$を$0$でない代数的整数とする。$N_{K/\mathbb{Q}}(x)=\prod_\sigma\sigma(x)$は整数である。各$\sigma$は単射で$x\neq 0$なので、この積は$0$でない。よって$\prod_\sigma|\sigma(x)|=|N_{K/\mathbb{Q}}(x)|\geq 1$である。すべての$\sigma$で$|\sigma(x)|<1$なら積も$1$未満になるので、$|\sigma(x)|\geq 1$となる$\sigma$が存在する。
  strategy: The product of the absolute values of the conjugates is a nonzero integer in absolute value.
  sketch:
  - 'translate: The norm is the product of the conjugates and is a nonzero integer.'
  - 'contradiction: If all conjugates had modulus below one, the product would too.'
  openmath: (forall (K x) (-> (and (number_field K) (in x K) (algebraic_integer x) (!= x 0)) (exists (s) (and (complex_embedding s K) (>= (abs (fn_value s x)) 1)))))
  hard_negative:
    statement: 数体の$0$でない代数的整数は、すべての埋め込みで$|\sigma(x)|\geq 1$を満たす。
    reason: $x=(1+\sqrt5)/2$の共役$(1-\sqrt5)/2$は絶対値が$1$未満である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (x : K), IsIntegral ℤ x → x ≠ 0 → ∃ σ : K →+* ℂ, 1 ≤ ‖σ x‖
  proof: |
    by
      intro K _ _ x hx h0
      let a : NumberField.RingOfIntegers K := ⟨x, hx⟩
      have ha : a ≠ 0 := by
        intro h
        apply h0
        have := congrArg (algebraMap (NumberField.RingOfIntegers K) K) h
        simpa [a] using this
      exact NumberField.exists_conjugate_one_le_norm ha
- id: number_field_norm_trace_transitive
  kind: textbook
  level: 3
  topic: 代数的整数論・ノルムとトレースの推移律
  statement: 数体の拡大の塔$K\subset F\subset L$と$x\in L$について、$N_{F/K}(N_{L/F}(x))=N_{L/K}(x)$かつ$\mathrm{Tr}_{F/K}(\mathrm{Tr}_{L/F}(x))=\mathrm{Tr}_{L/K}(x)$である。
  statement_en: For a tower K ⊂ F ⊂ L of number fields and x in L, N_{F/K}(N_{L/F}(x)) = N_{L/K}(x) and Tr_{F/K}(Tr_{L/F}(x)) = Tr_{L/K}(x).
  assumptions:
  - $K,F,L$は数体
  - $K\subset F\subset L$は体の塔
  - $x\in L$
  quantifiers:
  - 任意の数体の塔$K\subset F\subset L$と$x\in L$
  conclusion: ノルムとトレースはそれぞれ合成に関して推移的である。
  answer: |
    $K\subset F\subset L$を数体の塔、$x\in L$とする。$F$の$K$上の基底を$a_1,\dots,a_r$、$L$の$F$上の基底を$b_1,\dots,b_s$とすると、$a_ib_j$は$L$の$K$上の基底である。

    $x$倍の表現行列を$xb_j=\sum_kc_{kj}b_k$（$c_{kj}\in F$）とする。$c=(c_{kj})$は$F$成分の$s$次行列で、$N_{L/F}(x)=\det c$、$\mathrm{Tr}_{L/F}(x)=\sum_jc_{jj}$である。各$c_{kj}$を$a_1,\dots,a_r$に関する$K$成分の$r$次行列$\rho(c_{kj})$で表すと、$\rho$は$F$から行列環への環準同型で、基底$a_ib_j$に関する$x$倍の行列はブロック行列$(\rho(c_{kj}))_{k,j}$である。

    トレースは対角ブロックのトレースの和なので、$\mathrm{Tr}_{L/K}(x)=\sum_j\mathrm{Tr}\,\rho(c_{jj})=\sum_j\mathrm{Tr}_{F/K}(c_{jj})=\mathrm{Tr}_{F/K}(\mathrm{Tr}_{L/F}(x))$である。

    ブロック$\rho(c_{kj})$は互いに可換である。可換なブロックをもつ行列の行列式の公式より、全体の行列式はブロックを成分とみた行列式$\rho(\det c)$の行列式に等しい。よって$N_{L/K}(x)=\det\rho(\det c)=N_{F/K}(\det c)=N_{F/K}(N_{L/F}(x))$である。
  strategy: Write multiplication by x as a block matrix with commuting blocks in a product basis.
  sketch:
  - 'setup: Use the product basis a_i b_j of L over K.'
  - 'translate: Multiplication by x becomes a block matrix built from the regular representation of F.'
  - 'derive: Summing diagonal blocks gives transitivity of the trace.'
  - 'apply_theorem: The determinant formula for commuting blocks gives transitivity of the norm.'
  openmath: (forall (K F L x) (-> (and (number_field K) (number_field F) (number_field L) (intermediate_tower K F L) (in x L)) (and (= (relative_norm K F (relative_norm F L x)) (relative_norm K L x)) (= (relative_trace K F (relative_trace F L x)) (relative_trace K L x)))))
  hard_negative:
    statement: 体の塔$K\subset F\subset L$と$x\in L$について、$N_{L/K}(x)=N_{L/F}(x)$である。
    reason: $K=\mathbb{Q}$、$F=L=\mathbb{Q}(i)$、$x=1+i$とすると$N_{L/F}(x)=1+i$だが$N_{L/K}(x)=2$である。
  target: |
    ∀ (K F L : Type*) [Field K] [Field F] [Field L] [NumberField K] [NumberField F] [NumberField L] [Algebra K F] [Algebra F L] [Algebra K L] [IsScalarTower K F L] (x : L), Algebra.norm K (Algebra.norm F x) = Algebra.norm K x ∧ Algebra.trace K F (Algebra.trace F L x) = Algebra.trace K L x
  proof: |
    by
      intro K F L _ _ _ _ _ _ _ _ _ _ x
      exact ⟨Algebra.norm_norm, Algebra.trace_trace x⟩
- id: number_field_norm_trace_via_embeddings
  kind: textbook
  level: 3
  topic: 代数的整数論・ノルムとトレースと埋め込み
  statement: 数体$K$と$x\in K$について、$N_{K/\mathbb{Q}}(x)=\prod_\sigma\sigma(x)$かつ$\mathrm{Tr}_{K/\mathbb{Q}}(x)=\sum_\sigma\sigma(x)$である。ただし$\sigma$は$K$から$\mathbb{C}$への体の埋め込み全体を動き、ノルムとトレースは$x$倍写像の行列式と跡で定める。
  statement_en: For a number field K and x in K, the norm and trace of x, defined as determinant and trace of multiplication by x, equal the product and the sum of σ(x) over all complex embeddings σ of K.
  assumptions:
  - $K$は数体
  - $x\in K$
  quantifiers:
  - 任意の数体$K$と$x\in K$
  conclusion: $N_{K/\mathbb{Q}}(x)=\prod_\sigma\sigma(x)$かつ$\mathrm{Tr}_{K/\mathbb{Q}}(x)=\sum_\sigma\sigma(x)$である。
  answer: |
    $K$を数体、$x\in K$、$n=[K:\mathbb{Q}]$とする。$f$を$x$の最小多項式、$r=\deg f$、$m=[K:\mathbb{Q}(x)]$とすると$n=rm$である。

    $K$の$\mathbb{Q}(x)$上の基底を$c_1,\dots,c_m$とすると、$x^ic_j$（$0\leq i<r$）は$K$の$\mathbb{Q}$上の基底である。この基底で$x$倍写像は$f$の同伴行列を$m$個並べたブロック対角行列になるので、特性多項式は$f^m$である。

    一方、$\mathbb{Q}(x)$の埋め込みは$f$の$r$個の相異なる根に対応し、それぞれが$K$の埋め込みに$m$通りに延びる。したがって$\prod_\sigma(X-\sigma(x))=f^m$である。

    二つの多項式はともに$x$倍写像の特性多項式に等しい。定数項を比べると$(-1)^nN_{K/\mathbb{Q}}(x)=(-1)^n\prod_\sigma\sigma(x)$、$X^{n-1}$の係数を比べると$-\mathrm{Tr}_{K/\mathbb{Q}}(x)=-\sum_\sigma\sigma(x)$を得る。
  strategy: Identify the characteristic polynomial of multiplication by x with the product of X - σ(x), then compare coefficients.
  sketch:
  - 'setup: Let f be the minimal polynomial and m the degree of K over Q(x).'
  - 'derive: The characteristic polynomial of multiplication by x is f^m.'
  - 'derive: Each root of f has m embeddings above it, so the product of X - σ(x) is also f^m.'
  - 'conclude: Compare the constant coefficient and the coefficient of X^(n-1).'
  openmath: (forall (K x) (-> (and (number_field K) (in x K)) (and (= (relative_norm Q K x) (prod_over (complex_embeddings K) (lambda (s) (fn_value s x)))) (= (relative_trace Q K x) (finset_sum (complex_embeddings K) (lambda (s) (fn_value s x)))))))
  hard_negative:
    statement: 数体$K$のノルムは、複素共役で移り合う埋め込みの組から一つずつ選んだ積に等しい。
    reason: $K=\mathbb{Q}(i)$、$x=1+i$では、選んだ積は$1+i$または$1-i$だが、ノルムは$2$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (x : K), ((Algebra.norm ℚ x : ℚ) : ℂ) = ∏ σ : K →ₐ[ℚ] ℂ, σ x ∧ ((Algebra.trace ℚ K x : ℚ) : ℂ) = ∑ σ : K →ₐ[ℚ] ℂ, σ x
  proof: |
    by
      intro K _ _ x
      constructor
      · simpa using Algebra.norm_eq_prod_embeddings ℚ ℂ x
      · simpa using trace_eq_sum_embeddings ℂ (K := ℚ) (x := x)
- id: power_basis_generator_norm_trace
  kind: gap
  level: 3
  topic: 代数的整数論・生成元のノルムとトレース
  statement: 数体$K$の元$\alpha$について$1,\alpha,\dots,\alpha^{n-1}$が$K$の$\mathbb{Q}$上の基底であるとする（$n=[K:\mathbb{Q}]$）。$\alpha$の最小多項式を$f=X^n+c_{n-1}X^{n-1}+\dots+c_0$とすると、$N_{K/\mathbb{Q}}(\alpha)=(-1)^nc_0$、$\mathrm{Tr}_{K/\mathbb{Q}}(\alpha)=-c_{n-1}$である。
  statement_en: If the powers 1, α, ..., α^(n-1) form a Q-basis of a number field K and f = X^n + c_(n-1) X^(n-1) + ... + c_0 is the minimal polynomial of α, then N(α) = (-1)^n c_0 and Tr(α) = -c_(n-1).
  assumptions:
  - $K$は数体で$n=[K:\mathbb{Q}]$
  - $1,\alpha,\dots,\alpha^{n-1}$は$K$の$\mathbb{Q}$上の基底
  - $f$は$\alpha$の最小多項式
  quantifiers:
  - 任意の数体$K$と生成元$\alpha$
  conclusion: $N_{K/\mathbb{Q}}(\alpha)=(-1)^nc_0$かつ$\mathrm{Tr}_{K/\mathbb{Q}}(\alpha)=-c_{n-1}$である。
  answer: |
    $K$を数体、$n=[K:\mathbb{Q}]$とし、$1,\alpha,\dots,\alpha^{n-1}$を$K$の基底、$f=X^n+c_{n-1}X^{n-1}+\dots+c_0$を$\alpha$の最小多項式とする。

    この基底で$\alpha$倍写像の行列を求める。$i<n-1$なら$\alpha\cdot\alpha^i=\alpha^{i+1}$であり、$\alpha\cdot\alpha^{n-1}=-c_0-c_1\alpha-\dots-c_{n-1}\alpha^{n-1}$である。よって行列は$f$の同伴行列で、その特性多項式は$f$である。特性多項式の定数項は$(-1)^n\det$、$X^{n-1}$の係数は$-\mathrm{Tr}$なので、$c_0=(-1)^nN_{K/\mathbb{Q}}(\alpha)$、$c_{n-1}=-\mathrm{Tr}_{K/\mathbb{Q}}(\alpha)$である。これを書き直すと主張を得る。
  strategy: Multiplication by α in the power basis is the companion matrix of f.
  sketch:
  - 'translate: Write multiplication by α in the power basis.'
  - 'derive: The matrix is the companion matrix of f, whose characteristic polynomial is f.'
  - 'conclude: Read off the determinant and the trace from the coefficients.'
  openmath: (forall (K a n) (-> (and (number_field K) (power_basis_generator a K) (= n (extension_degree K Q))) (and (= (relative_norm Q K a) (* (^ (neg 1) n) (poly_coeff (minimal_polynomial a Q) 0))) (= (relative_trace Q K a) (neg (poly_coeff (minimal_polynomial a Q) (- n 1)))))))
  hard_negative:
    statement: 数体$K$の任意の元$x$について、最小多項式を$f$、$d=\deg f$とすると$N_{K/\mathbb{Q}}(x)=(-1)^df(0)$である。
    reason: $K=\mathbb{Q}(i)$、$x=2$では$f=X-2$なので右辺は$2$だが、$N_{K/\mathbb{Q}}(2)=4$である。$x$が$K$を生成することが必要である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (pb : PowerBasis ℚ K), Algebra.norm ℚ pb.gen = (-1) ^ pb.dim * (minpoly ℚ pb.gen).coeff 0 ∧ Algebra.trace ℚ K pb.gen = -(minpoly ℚ pb.gen).nextCoeff
  proof: |
    by
      intro K _ _ pb
      exact ⟨Algebra.PowerBasis.norm_gen_eq_coeff_zero_minpoly pb, PowerBasis.trace_gen_eq_nextCoeff_minpoly pb⟩
- id: number_field_trace_form_nondegenerate
  kind: gap
  level: 3
  topic: 代数的整数論・トレース形式
  statement: 数体$K$の元$x$が、すべての$y\in K$について$\mathrm{Tr}_{K/\mathbb{Q}}(xy)=0$を満たすなら、$x=0$である。
  statement_en: If an element x of a number field satisfies Tr_{K/Q}(xy) = 0 for all y in K, then x = 0.
  assumptions:
  - $K$は数体
  - $x\in K$
  - すべての$y\in K$で$\mathrm{Tr}_{K/\mathbb{Q}}(xy)=0$
  quantifiers:
  - 任意の数体$K$と$x\in K$
  conclusion: $x=0$である。
  answer: |
    $K$を数体、$x\in K$とし、すべての$y\in K$で$\mathrm{Tr}_{K/\mathbb{Q}}(xy)=0$と仮定する。$x\neq 0$なら$y=x^{-1}$ととれて、$\mathrm{Tr}_{K/\mathbb{Q}}(xy)=\mathrm{Tr}_{K/\mathbb{Q}}(1)=[K:\mathbb{Q}]\neq 0$となり、仮定に反する。よって$x=0$である。
  strategy: Test the hypothesis on the inverse of x, using that the trace of 1 is the degree.
  sketch:
  - 'contradiction: Suppose x is nonzero and take y to be its inverse.'
  - 'derive: The trace of 1 is the degree of K, which is nonzero.'
  - 'conclude: This contradicts the hypothesis, so x = 0.'
  openmath: (forall (K x) (-> (and (number_field K) (in x K) (forall (y) (-> (in y K) (= (relative_trace Q K (* x y)) 0)))) (= x 0)))
  hard_negative:
    statement: 数体の元$x$が$\mathrm{Tr}_{K/\mathbb{Q}}(x)=0$を満たすなら$x=0$である。
    reason: $K=\mathbb{Q}(i)$、$x=i$では$\mathrm{Tr}(i)=0$だが$i\neq 0$である。すべての$y$を掛けて調べることが必要である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (x : K), (∀ y : K, Algebra.trace ℚ K (x * y) = 0) → x = 0
  proof: |
    by
      intro K _ _ x h
      exact (traceForm_nondegenerate ℚ K).1 x (fun y => by simpa using h y)
- id: algebraic_integer_divides_its_norm
  kind: gap
  level: 4
  topic: 代数的整数論・ノルムと整除
  statement: 数体$K$の整数環$\mathcal{O}_K$の元$x$は、$\mathcal{O}_K$の中で整数$N_{K/\mathbb{Q}}(x)$を割り切る。
  statement_en: An element x of the ring of integers of a number field divides the integer N_{K/Q}(x) in the ring of integers.
  assumptions:
  - $K$は数体
  - $x\in\mathcal{O}_K$
  quantifiers:
  - 任意の数体$K$と$x\in\mathcal{O}_K$
  conclusion: $x$は$\mathcal{O}_K$で$N_{K/\mathbb{Q}}(x)$を割り切る。
  answer: |
    $K$を数体、$x\in\mathcal{O}_K$とする。$x=0$ならノルムも$0$なので成り立つ。$x\neq 0$とし、$y=N_{K/\mathbb{Q}}(x)/x\in K$とおく。$y\in\mathcal{O}_K$を示せばよい。

    埋め込み$\varphi_0\colon K\to\mathbb{C}$を一つ固定する。$N_{K/\mathbb{Q}}(x)=\prod_\sigma\sigma(x)$は有理数なので$\varphi_0$で動かないから、$\varphi_0(y)=\prod_{\sigma\neq\varphi_0}\sigma(x)$である。各$\sigma(x)$は代数的整数なので、$\varphi_0(y)$も代数的整数である。$\varphi_0$は単射で$\mathbb{Q}$を固定するので、$\varphi_0(y)$を根にもつモニック整数係数多項式は$y$も根にもつ。よって$y\in\mathcal{O}_K$であり、$N_{K/\mathbb{Q}}(x)=xy$となる。
  strategy: The quotient of the norm by x is the product of the other conjugates, hence integral.
  sketch:
  - 'case_split: The case x = 0 is immediate.'
  - 'construct: Let y be the norm divided by x, an element of K.'
  - 'derive: Under one embedding y becomes the product of the remaining conjugates, an algebraic integer.'
  - 'conclude: Injectivity of the embedding shows y is integral, so x divides the norm.'
  openmath: (forall (K x) (-> (and (number_field K) (in x (ring_of_integers K))) (exists (y) (and (in y (ring_of_integers K)) (= (relative_norm Q K x) (* x y))))))
  hard_negative:
    statement: 数体の整数環の元$x$について、$N_{K/\mathbb{Q}}(x)$は$x$を割り切る。
    reason: $K=\mathbb{Q}(i)$、$x=2$では$N(x)=4$で、$4$は$\mathbb{Z}[i]$で$2$を割り切らない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (x : NumberField.RingOfIntegers K), x ∣ ((Algebra.norm ℤ x : ℤ) : NumberField.RingOfIntegers K)
  proof: |
    by
      intro K _ _ x
      have := Algebra.dvd_algebraMap_intNorm_self ℤ (NumberField.RingOfIntegers K) x
      rwa [Algebra.intNorm_eq_norm, eq_intCast] at this
- id: ring_of_integers_discr_basis_independent
  kind: gap
  level: 3
  topic: 代数的整数論・判別式の基底によらないこと
  statement: 数体$K$の整数環$\mathcal{O}_K$の二つの$\mathbb{Z}$基底$b,b'$について、判別式は一致し$\mathrm{disc}(b)=\mathrm{disc}(b')$であり、その値は$0$でない。ここで$\mathrm{disc}(b)=\det(\mathrm{Tr}_{K/\mathbb{Q}}(b_ib_j))$である。
  statement_en: Any two Z-bases b, b' of the ring of integers of a number field have the same discriminant det(Tr(b_i b_j)), and this value is nonzero.
  assumptions:
  - $K$は数体
  - $b,b'$は$\mathcal{O}_K$の$\mathbb{Z}$基底
  quantifiers:
  - 任意の数体$K$と$\mathcal{O}_K$の$\mathbb{Z}$基底$b,b'$
  conclusion: $\mathrm{disc}(b)=\mathrm{disc}(b')\neq 0$である。
  answer: |
    $K$を数体、$b=(b_i)$、$b'=(b'_i)$を$\mathcal{O}_K$の$\mathbb{Z}$基底とする。$\mathbb{Z}$加群の基底の濃度は一致するので、添字は同じ有限集合としてよい。

    $b'_i=\sum_jA_{ij}b_j$となる整数行列$A$と、その逆向きの整数行列がとれるので、$\det A=\pm 1$である。$T=(\mathrm{Tr}_{K/\mathbb{Q}}(b_ib_j))$、$T'=(\mathrm{Tr}_{K/\mathbb{Q}}(b'_ib'_j))$とすると、トレースの$\mathbb{Q}$線形性から$T'=ATA^{\mathsf T}$である。よって$\det T'=(\det A)^2\det T=\det T$である。

    $b$は$K$の$\mathbb{Q}$基底でもある。$\det T=0$なら、$0$でない有理数ベクトル$(c_j)$で$\sum_jT_{ij}c_j=0$がすべての$i$で成り立つものがある。$x=\sum_jc_jb_j\neq 0$とおくと、すべての$i$で$\mathrm{Tr}_{K/\mathbb{Q}}(b_ix)=0$なので、すべての$y\in K$で$\mathrm{Tr}_{K/\mathbb{Q}}(xy)=0$となる。$y=x^{-1}$とすると$[K:\mathbb{Q}]=0$となり矛盾する。よって$\det T\neq 0$である。
  strategy: A change of integral basis has determinant ±1, and nondegeneracy of the trace form gives nonvanishing.
  sketch:
  - 'setup: The two bases differ by an integer matrix A with determinant ±1.'
  - 'derive: The trace matrices satisfy T'' = A T A^t, so the determinants agree.'
  - 'contradiction: A vanishing determinant would give a nonzero x orthogonal to K under the trace form.'
  openmath: (forall (K b c) (-> (and (number_field K) (integral_basis b K) (integral_basis c K)) (and (= (family_discriminant Q b) (family_discriminant Q c)) (!= (family_discriminant Q b) 0))))
  hard_negative:
    statement: 数体$K$の整数環の部分環の$\mathbb{Z}$基底であれば、判別式は$\mathcal{O}_K$の判別式と一致する。
    reason: $K=\mathbb{Q}(i)$で$\mathbb{Z}[2i]$の基底$1,2i$の判別式は$-16$だが、$\mathcal{O}_K=\mathbb{Z}[i]$の判別式は$-4$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (ι κ : Type*) [Fintype ι] [DecidableEq ι] [Fintype κ] [DecidableEq κ] (b : Module.Basis ι ℤ (NumberField.RingOfIntegers K)) (b' : Module.Basis κ ℤ (NumberField.RingOfIntegers K)), Algebra.discr ℤ b = Algebra.discr ℤ b' ∧ Algebra.discr ℤ b ≠ 0
  proof: |
    by
      intro K _ _ ι κ _ _ _ _ b b'
      rw [NumberField.discr_eq_discr K b, NumberField.discr_eq_discr K b']
      exact ⟨rfl, NumberField.discr_ne_zero K⟩
- id: discr_change_of_basis_det_squared
  kind: gap
  level: 3
  topic: 代数的整数論・判別式の変換則
  statement: 体の有限次拡大$L/F$、$L$の元の有限族$(b_i)_{i\in I}$、$F$成分の$I\times I$行列$P$について、$b'_i=\sum_jP_{ij}b_j$とおくと$\mathrm{disc}_{L/F}(b')=(\det P)^2\mathrm{disc}_{L/F}(b)$である。ここで$\mathrm{disc}_{L/F}(b)=\det(\mathrm{Tr}_{L/F}(b_ib_j))$である。
  statement_en: For a finite field extension L/F, a finite family b of elements of L and a square matrix P over F, the family b'_i = sum_j P_ij b_j satisfies disc(b') = det(P)^2 disc(b), where disc(b) = det(Tr(b_i b_j)).
  assumptions:
  - $L/F$は体の有限次拡大
  - $(b_i)_{i\in I}$は$L$の元の有限族
  - $P$は$F$成分の正方行列
  quantifiers:
  - 任意の$L/F$、$b$、$P$
  conclusion: $\mathrm{disc}_{L/F}(b')=(\det P)^2\mathrm{disc}_{L/F}(b)$である。
  answer: |
    $L/F$を体の有限次拡大、$(b_i)_{i\in I}$を$L$の元の有限族、$P$を$F$成分の$I\times I$行列とし、$b'_i=\sum_jP_{ij}b_j$とおく。トレースは$F$線形なので、
    $\mathrm{Tr}_{L/F}(b'_ib'_k)=\sum_{j,l}P_{ij}P_{kl}\mathrm{Tr}_{L/F}(b_jb_l)$である。よって$T=(\mathrm{Tr}_{L/F}(b_jb_l))$、$T'=(\mathrm{Tr}_{L/F}(b'_ib'_k))$は$T'=PTP^{\mathsf T}$を満たす。行列式をとると$\det T'=(\det P)^2\det T$である。
  strategy: The trace matrix transforms as a bilinear form under the change of family.
  sketch:
  - 'derive: Bilinearity of the trace gives T'' = P T P^t.'
  - 'conclude: Taking determinants gives the factor det(P)^2.'
  openmath: (forall (F L b A) (-> (and (finite_extension L F) (matrix_over A F)) (= (family_discriminant F (matrix_times_family A b)) (* (^ (matrix_det A) 2) (family_discriminant F b)))))
  hard_negative:
    statement: 同じ状況で$\mathrm{disc}_{L/F}(b')=\det P\cdot\mathrm{disc}_{L/F}(b)$である。
    reason: $L=F=\mathbb{Q}$、$b=(1)$、$P=(2)$とすると、$\mathrm{disc}(2)=\mathrm{Tr}(4)=4$だが、$\det P\cdot\mathrm{disc}(1)=2$である。
  target: |
    ∀ (F : Type*) [Field F] (L : Type*) [Field L] [Algebra F L] (ι : Type*) [Fintype ι] [DecidableEq ι] (b : ι → L) (P : Matrix ι ι F), Algebra.discr F ((P.map (algebraMap F L)).mulVec b) = P.det ^ 2 * Algebra.discr F b
  proof: |
    by
      intro F _ L _ _ ι _ _ b P
      exact Algebra.discr_of_matrix_mulVec b P
- id: discr_eq_det_embeddings_squared
  kind: textbook
  level: 3
  topic: 代数的整数論・判別式と埋め込み
  statement: 数体$K$、$K$の元の有限族$(b_i)_{i\in I}$、$I$と埋め込み$K\to\mathbb{C}$全体との全単射$i\mapsto\sigma_i$について、$\det(\mathrm{Tr}_{K/\mathbb{Q}}(b_ib_j))=\det(\sigma_j(b_i))^2$である。
  statement_en: For a number field K, a finite family b indexed by I and a bijection i ↦ σ_i from I to the complex embeddings of K, the discriminant det(Tr(b_i b_j)) equals det(σ_j(b_i))^2.
  assumptions:
  - $K$は数体
  - $(b_i)_{i\in I}$は$K$の元の有限族
  - $i\mapsto\sigma_i$は$I$から埋め込み全体への全単射
  quantifiers:
  - 任意の$K$、$b$、全単射$i\mapsto\sigma_i$
  conclusion: 判別式は行列$(\sigma_j(b_i))$の行列式の平方に等しい。
  answer: |
    $K$を数体、$(b_i)_{i\in I}$を$K$の元の有限族、$i\mapsto\sigma_i$を$I$から埋め込み$K\to\mathbb{C}$全体への全単射とする。$M=(\sigma_j(b_i))_{i,j}$とおく。$MM^{\mathsf T}$の$(i,k)$成分は$\sum_j\sigma_j(b_i)\sigma_j(b_k)=\sum_j\sigma_j(b_ib_k)=\mathrm{Tr}_{K/\mathbb{Q}}(b_ib_k)$である。行列式をとると$\det(\mathrm{Tr}_{K/\mathbb{Q}}(b_ib_k))=\det(M)\det(M^{\mathsf T})=\det(M)^2$である。
  strategy: The matrix of embeddings times its transpose is the trace matrix.
  sketch:
  - 'construct: Let M be the matrix of values σ_j(b_i).'
  - 'derive: The trace is the sum over embeddings, so M M^t is the trace matrix.'
  - 'conclude: Take determinants.'
  openmath: (forall (K b s) (-> (and (number_field K) (enumerates_embeddings s K)) (= (family_discriminant Q b) (^ (matrix_det (embedding_matrix b s)) 2))))
  hard_negative:
    statement: 同じ状況で判別式は$\det(\sigma_j(b_i))$そのものに等しい。
    reason: $K=\mathbb{Q}(i)$、$b=(1,i)$では$\det(\sigma_j(b_i))=\pm 2i$だが、判別式は$-4$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (ι : Type*) [Fintype ι] [DecidableEq ι] (b : ι → K) (e : ι ≃ (K →ₐ[ℚ] ℂ)), ((Algebra.discr ℚ b : ℚ) : ℂ) = (Matrix.of fun i j => e j (b i)).det ^ 2
  proof: |
    by
      intro K _ _ ι _ _ b e
      have h := Algebra.discr_eq_det_embeddingsMatrixReindex_pow_two ℚ ℂ b e
      have h2 : Algebra.embeddingsMatrixReindex ℚ ℂ b e = Matrix.of fun i j => e j (b i) := by
        ext i j; simp [Algebra.embeddingsMatrixReindex, Algebra.embeddingsMatrix]
      rw [h2] at h
      simpa using h
- id: discr_power_basis_norm_derivative
  kind: textbook
  level: 3
  topic: 代数的整数論・冪基底の判別式
  statement: 数体$K$（$n=[K:\mathbb{Q}]$）の元$\alpha$について$1,\alpha,\dots,\alpha^{n-1}$が基底で、$f$が$\alpha$の最小多項式なら、この基底の判別式は$(-1)^{n(n-1)/2}N_{K/\mathbb{Q}}(f'(\alpha))$である。
  statement_en: If 1, α, ..., α^(n-1) is a Q-basis of a number field K of degree n and f is the minimal polynomial of α, then the discriminant of this basis is (-1)^(n(n-1)/2) N_{K/Q}(f'(α)).
  assumptions:
  - $K$は数体で$n=[K:\mathbb{Q}]$
  - $1,\alpha,\dots,\alpha^{n-1}$は$K$の$\mathbb{Q}$上の基底
  - $f$は$\alpha$の最小多項式
  quantifiers:
  - 任意の$K$と生成元$\alpha$
  conclusion: 判別式は$(-1)^{n(n-1)/2}N_{K/\mathbb{Q}}(f'(\alpha))$に等しい。
  answer: |
    $K$を数体、$n=[K:\mathbb{Q}]$、$1,\alpha,\dots,\alpha^{n-1}$を基底、$f$を$\alpha$の最小多項式とする。埋め込みを$\sigma_1,\dots,\sigma_n$、$\alpha_i=\sigma_i(\alpha)$とする。

    判別式は行列$(\sigma_j(\alpha^i))=(\alpha_j^i)$の行列式の平方であり、Vandermonde の行列式より$\prod_{i<j}(\alpha_j-\alpha_i)^2$に等しい。

    $f=\prod_j(X-\alpha_j)$なので$f'(\alpha_i)=\prod_{j\neq i}(\alpha_i-\alpha_j)$である。これを$i$について掛けると、$N_{K/\mathbb{Q}}(f'(\alpha))=\prod_i\sigma_i(f'(\alpha))=\prod_if'(\alpha_i)=\prod_{i\neq j}(\alpha_i-\alpha_j)$である。各組$i<j$は$(\alpha_i-\alpha_j)(\alpha_j-\alpha_i)=-(\alpha_j-\alpha_i)^2$を与え、組は$n(n-1)/2$個あるので、$N_{K/\mathbb{Q}}(f'(\alpha))=(-1)^{n(n-1)/2}\prod_{i<j}(\alpha_j-\alpha_i)^2$である。両辺に$(-1)^{n(n-1)/2}$を掛けて主張を得る。
  strategy: Compute the discriminant with Vandermonde and rewrite the product of differences as the norm of f'(α).
  sketch:
  - 'translate: The discriminant is the squared Vandermonde determinant of the conjugates.'
  - 'derive: f''(α_i) is the product of α_i - α_j over j different from i.'
  - 'derive: Multiplying over i and pairing factors produces the sign.'
  - 'conclude: Compare the two expressions.'
  openmath: (forall (K a n) (-> (and (number_field K) (power_basis_generator a K) (= n (extension_degree K Q))) (= (family_discriminant Q (power_family a n)) (* (^ (neg 1) (/ (* n (- n 1)) 2)) (relative_norm Q K (poly_eval (poly_derivative (minimal_polynomial a Q)) a))))))
  hard_negative:
    statement: 同じ状況で判別式は符号なしで$N_{K/\mathbb{Q}}(f'(\alpha))$に等しい。
    reason: $K=\mathbb{Q}(i)$、$\alpha=i$では$f'(\alpha)=2i$のノルムは$4$だが、基底$1,i$の判別式は$-4$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (pb : PowerBasis ℚ K), Algebra.discr ℚ pb.basis = (-1) ^ (Module.finrank ℚ K * (Module.finrank ℚ K - 1) / 2) * Algebra.norm ℚ (Polynomial.aeval pb.gen (Polynomial.derivative (minpoly ℚ pb.gen)))
  proof: |
    by
      intro K _ _ pb
      exact Algebra.discr_powerBasis_eq_norm ℚ pb
- id: discr_mul_integer_mem_adjoin
  kind: gap
  level: 4
  topic: 代数的整数論・判別式と指数
  statement: 数体$K$（$n=[K:\mathbb{Q}]$）の代数的整数$\theta$について$1,\theta,\dots,\theta^{n-1}$が基底で、その判別式を$d$とする。このとき$K$の任意の代数的整数$z$について$dz\in\mathbb{Z}[\theta]$である。
  statement_en: If θ is an algebraic integer whose powers below the degree form a Q-basis of a number field K, and d is the discriminant of this basis, then dz lies in Z[θ] for every algebraic integer z of K.
  assumptions:
  - $K$は数体で$n=[K:\mathbb{Q}]$
  - $\theta\in K$は代数的整数で$1,\theta,\dots,\theta^{n-1}$は基底
  - $z\in K$は代数的整数
  - $d$は基底$1,\theta,\dots,\theta^{n-1}$の判別式
  quantifiers:
  - 任意の$K$、$\theta$、$z$
  conclusion: $dz\in\mathbb{Z}[\theta]$である。
  answer: |
    $K$を数体、$n=[K:\mathbb{Q}]$、$\theta,z\in K$を代数的整数とし、$1,\theta,\dots,\theta^{n-1}$を基底、$d$をその判別式とする。$z=\sum_{j=0}^{n-1}c_j\theta^j$（$c_j\in\mathbb{Q}$）と書く。

    $i=0,\dots,n-1$について$z\theta^i$の$\mathrm{Tr}_{K/\mathbb{Q}}$をとると、$\sum_jc_j\mathrm{Tr}_{K/\mathbb{Q}}(\theta^{i+j})=\mathrm{Tr}_{K/\mathbb{Q}}(z\theta^i)$となる。代数的整数のトレースは整数なので、係数行列$T=(\mathrm{Tr}_{K/\mathbb{Q}}(\theta^{i+j}))$と右辺はすべて整数である。$\det T=d\neq 0$であり、Cramer の公式より$dc_j$は$T$の余因子と右辺の整数係数の和になる。よって$dc_j\in\mathbb{Z}$であり、$dz=\sum_jdc_j\theta^j\in\mathbb{Z}[\theta]$である。
  strategy: Solve for the coordinates of z with the integer trace matrix and Cramer's rule.
  sketch:
  - 'setup: Write z in the power basis with rational coordinates.'
  - 'translate: Taking traces of z θ^i gives a linear system with integer data and determinant d.'
  - 'apply_theorem: Cramer''s rule shows d times each coordinate is an integer.'
  - 'conclude: Hence dz lies in Z[θ].'
  openmath: (forall (K t z n) (-> (and (number_field K) (algebraic_integer t) (power_basis_generator t K) (= n (extension_degree K Q)) (algebraic_integer z) (in z K)) (in (* (family_discriminant Q (power_family t n)) z) (integer_adjoin t))))
  hard_negative:
    statement: 同じ状況で$K$の任意の代数的整数$z$は$\mathbb{Z}[\theta]$に属する。
    reason: $K=\mathbb{Q}(\sqrt5)$、$\theta=\sqrt5$、$z=(1+\sqrt5)/2$では$z\notin\mathbb{Z}[\sqrt5]$である。判別式$20$を掛けることが必要である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (B : PowerBasis ℚ K), IsIntegral ℤ B.gen → ∀ z : K, IsIntegral ℤ z → Algebra.discr ℚ B.basis • z ∈ Algebra.adjoin ℤ {B.gen}
  proof: |
    by
      intro K _ _ B hB z hz
      exact Algebra.discr_mul_isIntegral_mem_adjoin ℚ hB hz
- id: number_field_discr_sign
  kind: textbook
  level: 4
  topic: 代数的整数論・判別式の符号
  statement: 数体$K$の複素素点の個数を$r_2$とすると、$K$の判別式$d_K$の符号は$(-1)^{r_2}$である。
  statement_en: The sign of the discriminant d_K of a number field K is (-1)^(r_2), where r_2 is the number of complex places.
  assumptions:
  - $K$は数体
  - $r_2$は複素素点の個数
  quantifiers:
  - 任意の数体$K$
  conclusion: $d_K$の符号は$(-1)^{r_2}$である。
  answer: |
    $K$を数体、$b_1,\dots,b_n$を$\mathcal{O}_K$の$\mathbb{Z}$基底、$\sigma_1,\dots,\sigma_n$を埋め込み全体とし、$M=(\sigma_j(b_i))$とおく。$d_K=(\det M)^2$であり、$d_K\neq 0$である。

    複素共役は埋め込みの集合に作用する。実埋め込みは固定され、非実の埋め込みは$r_2$個の組として入れ替わる。よって$\overline{M}$は$M$の列を$r_2$個の互換で並べ替えた行列であり、$\overline{\det M}=(-1)^{r_2}\det M$である。

    $r_2$が偶数なら$\det M$は$0$でない実数で、$d_K>0$である。$r_2$が奇数なら$\det M$は$0$でない純虚数で、$d_K<0$である。いずれの場合も$d_K$の符号は$(-1)^{r_2}$である。
  strategy: Complex conjugation permutes the columns of the embedding matrix by r_2 transpositions.
  sketch:
  - 'setup: Write d_K as the square of the determinant of the embedding matrix.'
  - 'derive: Conjugation swaps r_2 pairs of columns, so the conjugate determinant has sign (-1)^(r_2).'
  - 'case_split: The determinant is real or purely imaginary according to the parity of r_2.'
  - 'conclude: Squaring gives the sign.'
  openmath: (forall (K) (-> (number_field K) (= (sign_of (absolute_discriminant K)) (^ (neg 1) (complex_places_count K)))))
  hard_negative:
    statement: 数体$K$の判別式の符号は実素点の個数$r_1$により$(-1)^{r_1}$である。
    reason: $K=\mathbb{Q}$では$r_1=1$なので$(-1)^{r_1}=-1$だが、$d_{\mathbb{Q}}=1>0$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], (NumberField.discr K).sign = (-1) ^ NumberField.InfinitePlace.nrComplexPlaces K
  proof: |
    by
      intro K _ _
      exact NumberField.sign_discr K
- id: minkowski_discriminant_lower_bound
  kind: textbook
  level: 4
  topic: 代数的整数論・判別式の下界
  statement: 次数$n$、複素素点の個数$r_2$の数体$K$の判別式について、$|d_K|\geq\dfrac{n^{2n}}{(4/\pi)^{2r_2}(n!)^2}$である。
  statement_en: A number field K of degree n with r_2 complex places satisfies |d_K| ≥ n^(2n) / ((4/π)^(2 r_2) (n!)^2).
  assumptions:
  - $K$は数体で$n=[K:\mathbb{Q}]$
  - $r_2$は複素素点の個数
  quantifiers:
  - 任意の数体$K$
  conclusion: $|d_K|\geq n^{2n}/((4/\pi)^{2r_2}(n!)^2)$である。
  answer: |
    $K$を次数$n$、複素素点の個数$r_2$の数体とする。Minkowski の評価より、$0$でない$a\in\mathcal{O}_K$で$|N_{K/\mathbb{Q}}(a)|\leq(4/\pi)^{r_2}\dfrac{n!}{n^n}\sqrt{|d_K|}$を満たすものが存在する。$a\neq 0$なので$N_{K/\mathbb{Q}}(a)$は$0$でない整数であり、左辺は$1$以上である。よって$\sqrt{|d_K|}\geq(\pi/4)^{r_2}n^n/n!$である。両辺を$2$乗して主張を得る。
  strategy: Apply the Minkowski bound for a nonzero integer and use that its norm is at least one in absolute value.
  sketch:
  - 'apply_theorem: The Minkowski bound gives a nonzero integer with small norm.'
  - 'derive: The absolute value of the norm of a nonzero integer is at least 1.'
  - 'conclude: Rearrange and square.'
  openmath: (forall (K n) (-> (and (number_field K) (= n (extension_degree K Q))) (<= (/ (^ n (* 2 n)) (* (^ (/ 4 pi) (* 2 (complex_places_count K))) (^ (factorial n) 2))) (abs (absolute_discriminant K)))))
  hard_negative:
    statement: 数体について$|d_K|\geq n^{2n}/(n!)^2$である。
    reason: $K=\mathbb{Q}(\sqrt{-3})$では右辺は$16/4=4$だが$|d_K|=3$である。$r_2$に応じた因子$(\pi/4)^{2r_2}$を落とせない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], (Module.finrank ℚ K : ℝ) ^ (2 * Module.finrank ℚ K) / ((4 / Real.pi) ^ (2 * NumberField.InfinitePlace.nrComplexPlaces K) * ((Module.finrank ℚ K).factorial : ℝ) ^ 2) ≤ |(NumberField.discr K : ℝ)|
  proof: |
    by
      intro K _ _
      simpa using NumberField.abs_discr_ge' K
- id: number_field_abs_discr_gt_two
  kind: gap
  level: 4
  topic: 代数的整数論・判別式の下界
  statement: $\mathbb{Q}$と異なる数体$K$（$[K:\mathbb{Q}]\geq 2$）の判別式は$|d_K|>2$を満たす。
  statement_en: A number field K of degree at least 2 has |d_K| > 2.
  assumptions:
  - $K$は数体で$n=[K:\mathbb{Q}]\geq 2$
  quantifiers:
  - 任意の次数$2$以上の数体$K$
  conclusion: $|d_K|>2$である。
  answer: |
    $K$を次数$n\geq 2$、複素素点の個数$r_2$の数体とする。Minkowski の下界より$|d_K|\geq(\pi/4)^{2r_2}n^{2n}/(n!)^2$である。$2r_2\leq n$かつ$\pi/4<1$なので、右辺は$a_n=(\pi/4)^nn^{2n}/(n!)^2$以上である。

    $a_2=(\pi/4)^2\cdot 16/4=\pi^2/4>2$である。また$a_{n+1}/a_n=(\pi/4)(1+1/n)^{2n}$であり、$(1+1/n)^n\geq 2$より$(1+1/n)^{2n}\geq 4$なので、$a_{n+1}/a_n\geq\pi>1$である。よって$n\geq 2$で$a_n\geq a_2>2$であり、$|d_K|>2$を得る。
  strategy: Bound the Minkowski expression below by a sequence increasing in n and evaluate it at n = 2.
  sketch:
  - 'apply_theorem: Start from the Minkowski lower bound for |d_K|.'
  - 'derive: Since 2 r_2 ≤ n, it dominates a_n = (π/4)^n n^(2n)/(n!)^2.'
  - 'induction: The ratio a_(n+1)/a_n is at least π, so a_n grows.'
  - 'conclude: a_2 = π²/4 is larger than 2.'
  openmath: (forall (K) (-> (and (number_field K) (>= (extension_degree K Q) 2)) (> (abs (absolute_discriminant K)) 2)))
  hard_negative:
    statement: 次数$2$以上の数体は$|d_K|>3$を満たす。
    reason: $K=\mathbb{Q}(\sqrt{-3})$では$|d_K|=3$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], 1 < Module.finrank ℚ K → 2 < |NumberField.discr K|
  proof: |
    by
      intro K _ _ h
      exact NumberField.abs_discr_gt_two h
- id: prime_unramified_iff_not_dvd_discr
  kind: named
  level: 4
  topic: 代数的整数論・Dedekind の判別定理
  statement: Dedekind の判別定理。数体$K$と素数$p$について、$p\nmid d_K$であることと、$p$を含む$\mathcal{O}_K$の素イデアルがすべて$\mathbb{Z}$上不分岐であることは同値である。
  statement_en: Dedekind's discriminant theorem. For a number field K and a prime p, p does not divide d_K if and only if every prime ideal of the ring of integers containing p is unramified over Z.
  assumptions:
  - $K$は数体
  - $p$は素数
  quantifiers:
  - 任意の数体$K$と素数$p$
  - $p$を含む$\mathcal{O}_K$の任意の素イデアル
  conclusion: $p\nmid d_K$と、$p$の上の素イデアルがすべて不分岐であることは同値である。
  answer: |
    $K$を数体、$p$を素数、$n=[K:\mathbb{Q}]$とする。$A=\mathcal{O}_K/p\mathcal{O}_K$は$\mathbb{F}_p$上$n$次元の代数である。$\mathcal{O}_K$の$\mathbb{Z}$基底$b_i$の還元$\bar b_i$は$A$の基底であり、$x$倍写像のトレースは還元と両立するので、$d_K$の$p$による還元は$\det(\mathrm{Tr}_{A/\mathbb{F}_p}(\bar b_i\bar b_j))$である。よって$p\nmid d_K$は、$A$のトレース形式が非退化であることと同値である。

    $p\mathcal{O}_K=\prod_i\mathfrak{p}_i^{e_i}$と分解すると、中国剰余定理より$A\cong\prod_i\mathcal{O}_K/\mathfrak{p}_i^{e_i}$である。

    ある$e_i\geq 2$なら、$A$は$0$でない冪零元$y$をもつ。任意の$z\in A$で$yz$は冪零なのでトレースは$0$であり、トレース形式は退化する。よって$p\mid d_K$である。

    すべての$e_i=1$なら、$A$は有限体の直積である。有限体の拡大は分離的なので各成分のトレース形式は非退化であり、直積でも非退化である。よって$p\nmid d_K$である。

    有限体の拡大は分離的なので、不分岐であることは$e_i=1$と同じ意味であり、主張を得る。
  strategy: Reduce the discriminant modulo p to the trace form of O_K/pO_K and analyze this algebra by its nilpotents.
  sketch:
  - 'translate: The reduction of d_K mod p is the discriminant of the trace form of A = O_K/pO_K.'
  - 'derive: The factorization of p gives A as a product of local pieces.'
  - 'case_split: A ramified prime yields a nilpotent in the radical of the trace form.'
  - 'case_split: If nothing ramifies, A is a product of finite fields with nondegenerate trace forms.'
  openmath: (forall (K p) (-> (and (number_field K) (in p P)) (<-> (not (dvd p (absolute_discriminant K))) (forall (q) (-> (and (prime_ideal q (ring_of_integers K)) (prime_number_in_ideal p q)) (not (ramified_prime q K)))))))
  hard_negative:
    statement: $p\mid d_K$なら、$p$を含む$\mathcal{O}_K$の素イデアルはすべて分岐する。
    reason: $\theta^3-\theta-1=0$で定まる判別式$-23$の$3$次体では、$X^3-X-1\equiv(X-10)^2(X-3)\pmod{23}$なので$23\mathcal{O}_K=\mathfrak{p}^2\mathfrak{q}$となり、$\mathfrak{q}$は不分岐である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (p : ℤ), Prime p → (¬ p ∣ NumberField.discr K ↔ ∀ (P : Ideal (NumberField.RingOfIntegers K)) (_ : P.IsPrime), (p : NumberField.RingOfIntegers K) ∈ P → Algebra.IsUnramifiedAt ℤ P)
  proof: |
    by
      intro K _ _ p hp
      exact NumberField.not_dvd_discr_iff_forall_mem K _ hp
- id: exists_ramified_prime_over_rationals
  kind: named
  level: 4
  topic: 代数的整数論・Minkowski の分岐定理
  statement: Minkowski の分岐定理。$[K:\mathbb{Q}]\neq 1$である数体$K$では、$\mathcal{O}_K$のある極大イデアルが$\mathbb{Z}$上分岐する。
  statement_en: Minkowski's ramification theorem. If K is a number field of degree different from 1, then some maximal ideal of the ring of integers is ramified over Z.
  assumptions:
  - $K$は数体
  - $[K:\mathbb{Q}]\neq 1$
  quantifiers:
  - 任意の数体$K$
  - $\mathcal{O}_K$のある極大イデアル
  conclusion: その極大イデアルは$\mathbb{Z}$上分岐する。
  answer: |
    $K$を$[K:\mathbb{Q}]\neq 1$である数体とする。次数は正なので$[K:\mathbb{Q}]\geq 2$であり、Minkowski の下界から$|d_K|>2$である。よって$|d_K|$を割る素数$p$が存在する。Dedekind の判別定理より、$p$を含む素イデアル$\mathfrak{p}$で分岐するものがある。$\mathfrak{p}$は$0$でない素イデアルなので、$\mathcal{O}_K$の極大イデアルである。
  strategy: The discriminant has absolute value above 1, so a prime divides it, and that prime ramifies.
  sketch:
  - 'apply_theorem: The lower bound gives |d_K| > 2.'
  - 'derive: Hence a prime p divides d_K.'
  - 'apply_theorem: Dedekind''s theorem yields a ramified prime ideal over p.'
  - 'conclude: Nonzero primes of the ring of integers are maximal.'
  openmath: (forall (K) (-> (and (number_field K) (!= (extension_degree K Q) 1)) (exists (q) (and (maximal_ideal q (ring_of_integers K)) (ramified_prime q K)))))
  hard_negative:
    statement: 数体の任意の非自明な拡大$L/K$で、$\mathcal{O}_K$のある素イデアルが$L$で分岐する。
    reason: $K=\mathbb{Q}(\sqrt{-5})$、$L=K(i)$は$K$の有限素点すべてで不分岐な$2$次拡大である。基礎体が$\mathbb{Q}$であることが必要である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], Module.finrank ℚ K ≠ 1 → ∃ (P : Ideal (NumberField.RingOfIntegers K)) (_ : P.IsMaximal), ¬ Algebra.IsUnramifiedAt ℤ P
  proof: |
    by
      intro K _ _ h
      exact NumberField.exists_not_isUnramifiedAt_int h
- id: ring_of_integers_has_integral_basis
  kind: textbook
  level: 3
  topic: 代数的整数論・整基底の存在
  statement: 数体$K$（$n=[K:\mathbb{Q}]$）の整数環$\mathcal{O}_K$は、階数$n$の自由$\mathbb{Z}$加群である。すなわち$\mathcal{O}_K$は$n$個の元からなる$\mathbb{Z}$基底をもつ。
  statement_en: The ring of integers of a number field K of degree n is a free Z-module of rank n, that is, it has a Z-basis with n elements.
  assumptions:
  - $K$は数体で$n=[K:\mathbb{Q}]$
  quantifiers:
  - 任意の数体$K$
  conclusion: $\mathcal{O}_K$は$n$個の元からなる$\mathbb{Z}$基底をもつ。
  answer: |
    $K$を数体、$n=[K:\mathbb{Q}]$とする。$K$の$\mathbb{Q}$基底の各元に$0$でない整数を掛けると代数的整数になるので、$\mathcal{O}_K$の元からなる$\mathbb{Q}$基底$b_1,\dots,b_n$がとれる。

    トレース形式$(x,y)\mapsto\mathrm{Tr}_{K/\mathbb{Q}}(xy)$は非退化なので、$\mathrm{Tr}_{K/\mathbb{Q}}(b_ib_j^*)=\delta_{ij}$となる双対基底$b_1^*,\dots,b_n^*$が存在する。$x\in\mathcal{O}_K$を$x=\sum_ic_ib_i^*$と書くと、$c_i=\mathrm{Tr}_{K/\mathbb{Q}}(xb_i)$である。$xb_i$は代数的整数なので$c_i\in\mathbb{Z}$である。

    よって$\bigoplus_i\mathbb{Z}b_i\subset\mathcal{O}_K\subset\bigoplus_i\mathbb{Z}b_i^*$である。階数$n$の自由$\mathbb{Z}$加群の部分加群は階数$n$以下の自由加群であり、$\mathcal{O}_K$は階数$n$の自由加群を含むので、階数はちょうど$n$である。
  strategy: Sandwich the ring of integers between a lattice spanned by a basis of integers and the lattice of its trace dual.
  sketch:
  - 'construct: Choose a Q-basis of K consisting of algebraic integers.'
  - 'derive: The trace dual basis exists since the trace form is nondegenerate.'
  - 'derive: Integrality of traces places O_K inside the dual lattice.'
  - 'apply_theorem: Subgroups of free abelian groups of rank n are free of rank at most n.'
  openmath: (forall (K) (-> (number_field K) (exists (b) (and (integral_basis b K) (= (size b) (extension_degree K Q))))))
  hard_negative:
    statement: 数体$K$の整数環の$\mathbb{Z}$基底は、ある$\theta\in\mathcal{O}_K$により$1,\theta,\dots,\theta^{n-1}$の形に必ずとれる。
    reason: Dedekind の例である$\theta^3-\theta^2-2\theta-8=0$で定まる$3$次体では、$2$がどの$\theta'\in\mathcal{O}_K$についても指数を割るので、そのような基底は存在しない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], Nonempty (Module.Basis (Fin (Module.finrank ℚ K)) ℤ (NumberField.RingOfIntegers K))
  proof: |
    by
      intro K _ _
      exact ⟨Module.finBasisOfFinrankEq ℤ _ (NumberField.RingOfIntegers.rank K)⟩
- id: quadratic_field_norm_trace
  kind: gap
  level: 3
  topic: 代数的整数論・2次体のノルムとトレース
  statement: $K$を$\mathbb{Q}$上2次の数体、$d\in\mathbb{Q}$、$s\in K$を$s^2=d$、$s\notin\mathbb{Q}$を満たす元とする。有理数$a,b$について、$\mathrm{Tr}_{K/\mathbb{Q}}(a+bs)=2a$、$N_{K/\mathbb{Q}}(a+bs)=a^2-db^2$である。
  statement_en: Let K be a number field of degree 2, d a rational number and s in K with s^2 = d and s not in Q. For rationals a, b, Tr(a + b s) = 2a and N(a + b s) = a^2 - d b^2.
  assumptions:
  - $K$は数体で$[K:\mathbb{Q}]=2$
  - $d\in\mathbb{Q}$、$s\in K$、$s^2=d$、$s\notin\mathbb{Q}$
  - $a,b\in\mathbb{Q}$
  quantifiers:
  - 任意の$K,d,s,a,b$
  conclusion: $\mathrm{Tr}_{K/\mathbb{Q}}(a+bs)=2a$かつ$N_{K/\mathbb{Q}}(a+bs)=a^2-db^2$である。
  answer: |
    $K$を2次の数体、$d\in\mathbb{Q}$、$s\in K$を$s^2=d$、$s\notin\mathbb{Q}$を満たす元、$a,b\in\mathbb{Q}$とし、$x=a+bs$とおく。$s\notin\mathbb{Q}$なので$1,s$は$\mathbb{Q}$上1次独立であり、$[K:\mathbb{Q}]=2$より$K$の基底である。

    $x\cdot 1=a+bs$、$x\cdot s=bd+as$なので、この基底に関する$x$倍写像の行列は$\begin{pmatrix}a&bd\\b&a\end{pmatrix}$である。よってトレースは$2a$、行列式は$a^2-db^2$である。
  strategy: Compute the matrix of multiplication by a + b s in the basis 1, s.
  sketch:
  - 'setup: The elements 1 and s form a Q-basis of K.'
  - 'derive: Multiplication by x has matrix with rows (a, bd) and (b, a).'
  - 'conclude: Read off the trace and determinant.'
  openmath: (forall (K d s a b) (-> (and (number_field K) (= (extension_degree K Q) 2) (in d Q) (in s K) (= (* s s) d) (notin s Q) (in a Q) (in b Q)) (and (= (relative_trace Q K (+ a (* b s))) (* 2 a)) (= (relative_norm Q K (+ a (* b s))) (- (^ a 2) (* d (^ b 2)))))))
  hard_negative:
    statement: 同じ状況で$N_{K/\mathbb{Q}}(a+bs)=a^2+db^2$である。
    reason: $d=2$、$a=0$、$b=1$とすると$N(s)=-2$だが、右辺は$2$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (d : ℚ) (s : K), Module.finrank ℚ K = 2 → s * s = algebraMap ℚ K d → s ∉ Set.range (algebraMap ℚ K) → ∀ a b : ℚ, Algebra.trace ℚ K (algebraMap ℚ K a + algebraMap ℚ K b * s) = 2 * a ∧ Algebra.norm ℚ (algebraMap ℚ K a + algebraMap ℚ K b * s) = a ^ 2 - d * b ^ 2
  proof: |
    by
      intro K _ _ d s h2 hs hns a b
      have hli : LinearIndependent ℚ ![(1 : K), s] := by
        rw [LinearIndependent.pair_iff]
        intro c e hce
        by_cases he : e = 0
        · subst he; simp at hce; exact ⟨hce, rfl⟩
        · exfalso
          apply hns
          refine ⟨-c / e, ?_⟩
          have : (e : ℚ) • s = -(c • (1 : K)) := by
            have := hce; rw [add_comm] at this; exact eq_neg_of_add_eq_zero_left this
          have he' : algebraMap ℚ K e ≠ 0 := by simpa using he
          rw [map_div₀, map_neg, div_eq_iff he', mul_comm]
          simpa [Algebra.smul_def] using this.symm
      let B : Module.Basis (Fin 2) ℚ K := basisOfLinearIndependentOfCardEqFinrank hli (by simp [h2])
      have hB0 : B 0 = 1 := by simp [B]
      have hB1 : B 1 = s := by simp [B]
      let x : K := algebraMap ℚ K a + algebraMap ℚ K b * s
      have e0 : x * B 0 = a • B 0 + b • B 1 := by
        simp [x, hB0, hB1, Algebra.smul_def]
      have e1 : x * B 1 = (b * d) • B 0 + a • B 1 := by
        simp only [x, hB0, hB1, Algebra.smul_def, map_mul, add_mul, mul_one]
        rw [mul_assoc, hs]; ring
      have hM : Algebra.leftMulMatrix B x = !![a, b * d; b, a] := by
        ext i j
        rw [Algebra.leftMulMatrix_eq_repr_mul]
        fin_cases i <;> fin_cases j
        · simp [e0]
        · simp [e1]
        · simp [e0]
        · simp [e1]
      constructor
      · change Algebra.trace ℚ K x = _
        rw [Algebra.trace_eq_matrix_trace B, hM, Matrix.trace_fin_two]; simp; ring
      · change Algebra.norm ℚ x = _
        rw [Algebra.norm_eq_matrix_det B, hM, Matrix.det_fin_two]; simp; ring
- id: quadratic_integers_parity_mod_four
  kind: gap
  level: 3
  topic: 代数的整数論・2次体の整数環の補題
  statement: 整数$d,A,B$について$4\mid A^2-dB^2$とする。$d\equiv 2,3\pmod 4$なら$A,B$はともに偶数であり、$d\equiv 1\pmod 4$なら$A\equiv B\pmod 2$である。
  statement_en: Let d, A, B be integers with 4 dividing A^2 - d B^2. If d is 2 or 3 modulo 4, then A and B are even. If d is 1 modulo 4, then A and B have the same parity.
  assumptions:
  - $d,A,B\in\mathbb{Z}$
  - $4\mid A^2-dB^2$
  quantifiers:
  - 任意の整数$d,A,B$
  conclusion: $d\equiv 2,3\pmod 4$なら$A,B$は偶数、$d\equiv 1\pmod 4$なら$A\equiv B\pmod 2$である。
  answer: |
    $d,A,B$を整数とし、$4\mid A^2-dB^2$とする。整数の平方は$4$を法として$0$または$1$であり、偶数の平方は$0$、奇数の平方は$1$である。

    $d\equiv 2,3\pmod 4$とする。$B$が奇数なら$A^2\equiv d\pmod 4$となるが、$d\equiv 2,3$は平方でないので矛盾する。よって$B$は偶数で、$A^2\equiv 0\pmod 4$となり$A$も偶数である。

    $d\equiv 1\pmod 4$とする。このとき$A^2\equiv B^2\pmod 4$なので、$A$と$B$の偶奇は一致する。
  strategy: Squares are 0 or 1 modulo 4, according to parity.
  sketch:
  - 'setup: Squares modulo 4 are 0 for even numbers and 1 for odd numbers.'
  - 'case_split: If d is 2 or 3 mod 4, an odd B makes A^2 a nonsquare mod 4.'
  - 'case_split: If d is 1 mod 4, then A^2 and B^2 agree mod 4.'
  openmath: (forall (d x y) (-> (and (in d Z) (in x Z) (in y Z) (dvd 4 (- (^ x 2) (* d (^ y 2))))) (and (-> (or (dvd 4 (- d 2)) (dvd 4 (- d 3))) (and (dvd 2 x) (dvd 2 y))) (-> (dvd 4 (- d 1)) (dvd 2 (- x y))))))
  hard_negative:
    statement: $d\equiv 1\pmod 4$で$4\mid A^2-dB^2$なら、$A,B$はともに偶数である。
    reason: $d=5$、$A=B=1$では$A^2-dB^2=-4$は$4$で割り切れるが、$A,B$は奇数である。
  target: |
    ∀ (d A B : ℤ), (4 : ℤ) ∣ A ^ 2 - d * B ^ 2 → (d % 4 = 2 ∨ d % 4 = 3 → 2 ∣ A ∧ 2 ∣ B) ∧ (d % 4 = 1 → (A - B) % 2 = 0)
  proof: |
    by
      intro d A B h
      have hA : A % 4 = 0 ∨ A % 4 = 1 ∨ A % 4 = 2 ∨ A % 4 = 3 := by omega
      have hB : B % 4 = 0 ∨ B % 4 = 1 ∨ B % 4 = 2 ∨ B % 4 = 3 := by omega
      have hmod : (A ^ 2 - d * B ^ 2) % 4 = 0 := Int.emod_eq_zero_of_dvd h
      constructor
      · intro hd
        rcases hd with hd | hd <;> rcases hA with hA | hA | hA | hA <;> rcases hB with hB | hB | hB | hB <;>
          simp [pow_two, Int.sub_emod, Int.mul_emod, hA, hB, hd] at hmod <;> omega
      · intro hd
        rcases hA with hA | hA | hA | hA <;> rcases hB with hB | hB | hB | hB <;>
          simp [pow_two, Int.sub_emod, Int.mul_emod, hA, hB, hd] at hmod <;> omega
- id: quadratic_field_ring_of_integers
  kind: textbook
  level: 3
  topic: 代数的整数論・2次体の整数環
  statement: $K$を2次の数体、$d$を平方因子をもたない整数、$s\in K$を$s^2=d$、$s\notin\mathbb{Q}$を満たす元とし、$a,b\in\mathbb{Q}$とする。$d\equiv 2,3\pmod 4$なら、$a+bs\in\mathcal{O}_K$は$a,b\in\mathbb{Z}$と同値である。$d\equiv 1\pmod 4$なら、$a+bs\in\mathcal{O}_K$は、$m\equiv n\pmod 2$を満たす整数$m,n$により$a=m/2$、$b=n/2$と書けることと同値である。
  statement_en: Let K be a quadratic number field, d a squarefree integer and s in K with s^2 = d, s not rational, and a, b rational. If d is 2 or 3 mod 4, then a + b s is integral iff a, b are integers. If d is 1 mod 4, then a + b s is integral iff a = m/2, b = n/2 for integers m, n of the same parity.
  assumptions:
  - $K$は数体で$[K:\mathbb{Q}]=2$
  - $d$は平方因子をもたない整数
  - $s\in K$、$s^2=d$、$s\notin\mathbb{Q}$
  - $a,b\in\mathbb{Q}$
  quantifiers:
  - 任意の$K,d,s,a,b$
  conclusion: $d$を$4$で割った余りに応じて、$\mathcal{O}_K$の元は上の形の元と一致する。
  answer: |
    $K$を2次の数体、$d$を平方因子をもたない整数、$s\in K$を$s^2=d$、$s\notin\mathbb{Q}$を満たす元、$a,b\in\mathbb{Q}$とし、$x=a+bs$とおく。$\mathrm{Tr}_{K/\mathbb{Q}}(x)=2a$、$N_{K/\mathbb{Q}}(x)=a^2-db^2$である。$x^2-2ax+(a^2-db^2)=0$なので、$2a$と$a^2-db^2$が整数なら$x$は代数的整数である。

    逆に$x$が代数的整数なら、トレースとノルムは整数なので$A=2a$と$c=a^2-db^2$は整数である。$r=2b$とおくと$dr^2=A^2-4c$は整数である。$r=u/v$を既約分数（$v\geq 1$）とすると$du^2=(A^2-4c)v^2$となり、$\gcd(u,v)=1$より$v^2\mid d$である。$d$は平方因子をもたないので$v=1$であり、$B=2b$は整数である。このとき$A^2-dB^2=4c$である。

    以上から、$x$が代数的整数であることは、整数$A,B$で$a=A/2$、$b=B/2$、$4\mid A^2-dB^2$を満たすものが存在することと同値である。

    $d\equiv 2,3\pmod 4$なら、平方の剰余から$4\mid A^2-dB^2$は$A,B$がともに偶数であることと同値であり、これは$a,b\in\mathbb{Z}$を意味する。

    $d\equiv 1\pmod 4$なら、$4\mid A^2-dB^2$は$A^2\equiv B^2\pmod 4$、すなわち$A\equiv B\pmod 2$と同値である。$m=A$、$n=B$とすれば主張を得る。
  strategy: Characterize integrality by trace and norm, show 2b is an integer by squarefreeness, then analyze the congruence modulo 4.
  sketch:
  - 'translate: x is integral iff its trace 2a and norm a² - d b² are integers.'
  - 'derive: Squarefreeness of d forces 2b to be an integer.'
  - 'derive: With A = 2a and B = 2b the condition is 4 | A² - d B².'
  - 'case_split: Solve this congruence for d congruent to 2, 3 or 1 modulo 4.'
  openmath: (forall (K d s a b) (-> (and (number_field K) (= (extension_degree K Q) 2) (squarefree_integer d) (in s K) (= (* s s) d) (notin s Q) (in a Q) (in b Q)) (and (-> (or (dvd 4 (- d 2)) (dvd 4 (- d 3))) (<-> (in (+ a (* b s)) (ring_of_integers K)) (and (in a Z) (in b Z)))) (-> (dvd 4 (- d 1)) (<-> (in (+ a (* b s)) (ring_of_integers K)) (exists (m n) (and (in m Z) (in n Z) (dvd 2 (- m n)) (= a (/ m 2)) (= b (/ n 2)))))))))
  hard_negative:
    statement: 平方因子をもたない整数$d$について、常に$\mathcal{O}_K=\mathbb{Z}[\sqrt d]$である。
    reason: $d=5$では$(1+\sqrt5)/2$は$X^2-X-1$の根なので$\mathcal{O}_K$に属するが、$\mathbb{Z}[\sqrt5]$には属さない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (d : ℤ) (s : K), Module.finrank ℚ K = 2 → s * s = (d : K) → s ∉ Set.range (algebraMap ℚ K) → Squarefree d → ∀ a b : ℚ, (d % 4 = 2 ∨ d % 4 = 3 → (IsIntegral ℤ (algebraMap ℚ K a + algebraMap ℚ K b * s) ↔ ∃ m n : ℤ, a = m ∧ b = n)) ∧ (d % 4 = 1 → (IsIntegral ℤ (algebraMap ℚ K a + algebraMap ℚ K b * s) ↔ ∃ m n : ℤ, (m - n) % 2 = 0 ∧ a = (m : ℚ) / 2 ∧ b = (n : ℚ) / 2))
  proof: |
    by
      intro K _ _ d s h2 hs hns hd a b
      have hs' : s * s = algebraMap ℚ K (d : ℚ) := by simpa using hs
      have tn : ∀ a b : ℚ, Algebra.trace ℚ K (algebraMap ℚ K a + algebraMap ℚ K b * s) = 2 * a ∧ Algebra.norm ℚ (algebraMap ℚ K a + algebraMap ℚ K b * s) = a ^ 2 - d * b ^ 2 := by
        intro a b
        have hli : LinearIndependent ℚ ![(1 : K), s] := by
          rw [LinearIndependent.pair_iff]
          intro c e hce
          by_cases he : e = 0
          · subst he; simp at hce; exact ⟨hce, rfl⟩
          · exfalso
            apply hns
            refine ⟨-c / e, ?_⟩
            have : (e : ℚ) • s = -(c • (1 : K)) := by
              have := hce; rw [add_comm] at this; exact eq_neg_of_add_eq_zero_left this
            have he' : algebraMap ℚ K e ≠ 0 := by simpa using he
            rw [map_div₀, map_neg, div_eq_iff he', mul_comm]
            simpa [Algebra.smul_def] using this.symm
        let B : Module.Basis (Fin 2) ℚ K := basisOfLinearIndependentOfCardEqFinrank hli (by simp [h2])
        have hB0 : B 0 = 1 := by simp [B]
        have hB1 : B 1 = s := by simp [B]
        let x : K := algebraMap ℚ K a + algebraMap ℚ K b * s
        have e0 : x * B 0 = a • B 0 + b • B 1 := by
          simp [x, hB0, hB1, Algebra.smul_def]
        have e1 : x * B 1 = (b * d) • B 0 + a • B 1 := by
          simp only [x, hB0, hB1, Algebra.smul_def, map_mul, add_mul, mul_one]
          rw [mul_assoc, hs']; ring
        have hM : Algebra.leftMulMatrix B x = !![a, b * d; b, a] := by
          ext i j
          rw [Algebra.leftMulMatrix_eq_repr_mul]
          fin_cases i <;> fin_cases j
          · simp [e0]
          · simp [e1]
          · simp [e0]
          · simp [e1]
        constructor
        · change Algebra.trace ℚ K x = _
          rw [Algebra.trace_eq_matrix_trace B, hM, Matrix.trace_fin_two]; simp; ring
        · change Algebra.norm ℚ x = _
          rw [Algebra.norm_eq_matrix_det B, hM, Matrix.det_fin_two]; simp; ring
      have arith1 : ∀ a b : ℚ, (∃ A : ℤ, 2 * a = A) → (∃ c : ℤ, a ^ 2 - d * b ^ 2 = c) → ∃ B : ℤ, 2 * b = B := by
        intro a b ⟨A, hA⟩ ⟨c, hc⟩
        have key : (d : ℚ) * (2 * b) ^ 2 = ((A ^ 2 - 4 * c : ℤ) : ℚ) := by
          push_cast; rw [← hA, ← hc]; ring
        set r : ℚ := 2 * b with hr
        have h1 : (d : ℚ) * ((r.num : ℚ) / r.den) ^ 2 = ((A ^ 2 - 4 * c : ℤ) : ℚ) := by
          rw [Rat.num_div_den]; exact key
        have hden : (r.den : ℚ) ≠ 0 := by exact_mod_cast r.den_nz
        have h2' : d * r.num ^ 2 = (A ^ 2 - 4 * c) * (r.den : ℤ) ^ 2 := by
          field_simp at h1
          have h3 : d * r.num ^ 2 = (r.den : ℤ) ^ 2 * (A ^ 2 - 4 * c) := by exact_mod_cast h1
          rw [h3]; ring
        have hcop : IsCoprime ((r.den : ℤ) ^ 2) (r.num ^ 2) := by
          have : IsCoprime (r.num) (r.den : ℤ) := by
            rw [Int.isCoprime_iff_gcd_eq_one]; exact r.reduced
          exact (this.symm.pow)
        have hdvd : (r.den : ℤ) * r.den ∣ d := by
          have : (r.den : ℤ) ^ 2 ∣ d * r.num ^ 2 := ⟨A ^ 2 - 4 * c, by rw [h2']; ring⟩
          rw [← sq]
          exact hcop.dvd_of_dvd_mul_right this
        have hu := hd _ hdvd
        have hden1 : r.den = 1 := by
          have := Int.isUnit_iff.1 hu
          omega
        refine ⟨r.num, ?_⟩
        have := (Rat.num_div_den r).symm
        rw [hden1] at this
        simpa using this
      have arith2 : ∀ A B : ℤ, (4 : ℤ) ∣ A ^ 2 - d * B ^ 2 → (d % 4 = 2 ∨ d % 4 = 3 → 2 ∣ A ∧ 2 ∣ B) ∧ (d % 4 = 1 → (A - B) % 2 = 0) := by
        intro A B h
        have hA : A % 4 = 0 ∨ A % 4 = 1 ∨ A % 4 = 2 ∨ A % 4 = 3 := by omega
        have hB : B % 4 = 0 ∨ B % 4 = 1 ∨ B % 4 = 2 ∨ B % 4 = 3 := by omega
        have hmod : (A ^ 2 - d * B ^ 2) % 4 = 0 := Int.emod_eq_zero_of_dvd h
        constructor
        · intro hd4
          rcases hd4 with hd4 | hd4 <;> rcases hA with hA | hA | hA | hA <;> rcases hB with hB | hB | hB | hB <;>
            simp [pow_two, Int.sub_emod, Int.mul_emod, hA, hB, hd4] at hmod <;> omega
        · intro hd4
          rcases hA with hA | hA | hA | hA <;> rcases hB with hB | hB | hB | hB <;>
            simp [pow_two, Int.sub_emod, Int.mul_emod, hA, hB, hd4] at hmod <;> omega
      have ratint : ∀ (y : K), IsIntegral ℤ y → (∃ n : ℤ, Algebra.norm ℚ y = n) ∧ (∃ m : ℤ, Algebra.trace ℚ K y = m) := by
        intro y hy
        constructor
        · obtain ⟨n, hn⟩ := IsIntegrallyClosed.isIntegral_iff.1 (Algebra.isIntegral_norm (R := ℤ) ℚ hy)
          exact ⟨n, by simpa using hn.symm⟩
        · obtain ⟨n, hn⟩ := IsIntegrallyClosed.isIntegral_iff.1 (Algebra.isIntegral_trace (R := ℤ) (L := ℚ) hy)
          exact ⟨n, by simpa using hn.symm⟩
      have forward : IsIntegral ℤ (algebraMap ℚ K a + algebraMap ℚ K b * s) → ∃ A B : ℤ, 2 * a = A ∧ 2 * b = B ∧ (4 : ℤ) ∣ A ^ 2 - d * B ^ 2 := by
        intro hx
        obtain ⟨⟨c, hc⟩, ⟨A, hA⟩⟩ := ratint _ hx
        rw [(tn a b).2] at hc
        rw [(tn a b).1] at hA
        obtain ⟨B, hB⟩ := arith1 a b ⟨A, hA⟩ ⟨c, hc⟩
        refine ⟨A, B, hA, hB, c, ?_⟩
        have : ((A ^ 2 - d * B ^ 2 : ℤ) : ℚ) = ((4 * c : ℤ) : ℚ) := by
          push_cast; rw [← hA, ← hB, ← hc]; ring
        exact_mod_cast this
      have backward : ∀ c A : ℤ, 2 * a = A → a ^ 2 - d * b ^ 2 = c → IsIntegral ℤ (algebraMap ℚ K a + algebraMap ℚ K b * s) := by
        intro c A hA hc
        refine ⟨Polynomial.X ^ 2 + (Polynomial.C (-A) * Polynomial.X + Polynomial.C c), ?_, ?_⟩
        · apply Polynomial.monic_X_pow_add
          exact (Polynomial.degree_linear_le).trans_lt (by norm_num)
        · have hA' : ((A : ℤ) : K) = algebraMap ℚ K (2 * a) := by rw [hA]; simp
          have hc' : ((c : ℤ) : K) = algebraMap ℚ K (a ^ 2 - d * b ^ 2) := by rw [hc]; simp
          simp only [Polynomial.eval₂_add, Polynomial.eval₂_mul, Polynomial.eval₂_pow, Polynomial.eval₂_X, Polynomial.eval₂_C]
          simp only [eq_intCast, Int.cast_neg]
          rw [hA', hc']
          simp only [map_mul, map_sub, map_pow, map_ofNat, map_intCast]
          linear_combination (algebraMap ℚ K b) ^ 2 * hs
      constructor
      · intro hd4
        constructor
        · intro hx
          obtain ⟨A, B, hA, hB, h4⟩ := forward hx
          obtain ⟨⟨m, rfl⟩, ⟨n, rfl⟩⟩ := (arith2 A B h4).1 hd4
          refine ⟨m, n, ?_, ?_⟩
          · push_cast at hA; linarith
          · push_cast at hB; linarith
        · rintro ⟨m, n, rfl, rfl⟩
          exact backward (m ^ 2 - d * n ^ 2) (2 * m) (by push_cast; ring) (by push_cast; ring)
      · intro hd4
        constructor
        · intro hx
          obtain ⟨A, B, hA, hB, h4⟩ := forward hx
          refine ⟨A, B, (arith2 A B h4).2 hd4, ?_, ?_⟩
          · rw [← hA]; ring
          · rw [← hB]; ring
        · rintro ⟨m, n, hmn, rfl, rfl⟩
          have h4 : (4 : ℤ) ∣ m ^ 2 - d * n ^ 2 := by
            have hm : m % 4 = 0 ∨ m % 4 = 1 ∨ m % 4 = 2 ∨ m % 4 = 3 := by omega
            have hn : n % 4 = 0 ∨ n % 4 = 1 ∨ n % 4 = 2 ∨ n % 4 = 3 := by omega
            apply Int.dvd_of_emod_eq_zero
            rcases hm with hm | hm | hm | hm <;> rcases hn with hn | hn | hn | hn <;> first | (exfalso; omega) | (simp [pow_two, Int.sub_emod, Int.mul_emod, hm, hn, hd4])
          obtain ⟨c, hc⟩ := h4
          refine backward c m (by ring) ?_
          have : ((m ^ 2 - d * n ^ 2 : ℤ) : ℚ) = ((4 * c : ℤ) : ℚ) := by rw [hc]
          push_cast at this
          linear_combination this / 4
- id: quadratic_field_basis_discriminants
  kind: gap
  level: 3
  topic: 代数的整数論・2次体の判別式
  statement: $K$を2次の数体、$d\in\mathbb{Q}$、$s\in K$を$s^2=d$、$s\notin\mathbb{Q}$を満たす元とする。基底$1,s$の判別式は$4d$であり、基底$1,(1+s)/2$の判別式は$d$である。
  statement_en: Let K be a quadratic number field, d rational and s in K with s^2 = d and s not rational. The discriminant of the basis 1, s is 4d and the discriminant of the basis 1, (1+s)/2 is d.
  assumptions:
  - $K$は数体で$[K:\mathbb{Q}]=2$
  - $d\in\mathbb{Q}$、$s\in K$、$s^2=d$、$s\notin\mathbb{Q}$
  quantifiers:
  - 任意の$K,d,s$
  conclusion: $\mathrm{disc}(1,s)=4d$かつ$\mathrm{disc}(1,(1+s)/2)=d$である。
  answer: |
    $K$を2次の数体、$d\in\mathbb{Q}$、$s\in K$を$s^2=d$、$s\notin\mathbb{Q}$を満たす元とする。有理数$a,b$について$\mathrm{Tr}_{K/\mathbb{Q}}(a+bs)=2a$である。

    $\mathrm{Tr}(1)=2$、$\mathrm{Tr}(s)=0$、$\mathrm{Tr}(s^2)=2d$なので、$\mathrm{disc}(1,s)=\det\begin{pmatrix}2&0\\0&2d\end{pmatrix}=4d$である。

    $w=(1+s)/2$とおく。$\mathrm{Tr}(w)=1$であり、$w^2=(1+d)/4+s/2$より$\mathrm{Tr}(w^2)=(1+d)/2$である。よって$\mathrm{disc}(1,w)=\det\begin{pmatrix}2&1\\1&(1+d)/2\end{pmatrix}=1+d-1=d$である。
  strategy: Compute the two trace matrices directly from Tr(a + b s) = 2a.
  sketch:
  - 'derive: Traces of 1, s and s² are 2, 0 and 2d.'
  - 'derive: Traces of w and w² are 1 and (1+d)/2.'
  - 'conclude: Evaluate the two 2 by 2 determinants.'
  openmath: (forall (K d s) (-> (and (number_field K) (= (extension_degree K Q) 2) (in d Q) (in s K) (= (* s s) d) (notin s Q)) (and (= (family_discriminant Q (ordered_pair 1 s)) (* 4 d)) (= (family_discriminant Q (ordered_pair 1 (/ (+ 1 s) 2))) d))))
  hard_negative:
    statement: 同じ状況で基底$1,s$の判別式は$d$である。
    reason: $d=2$ではトレース行列は対角成分が$2,4$の対角行列なので、判別式は$8=4d$であって$2$でない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (d : ℚ) (s : K), Module.finrank ℚ K = 2 → s * s = algebraMap ℚ K d → s ∉ Set.range (algebraMap ℚ K) → Algebra.discr ℚ ![(1 : K), s] = 4 * d ∧ Algebra.discr ℚ ![(1 : K), (1 + s) / 2] = d
  proof: |
    by
      intro K _ _ d s h2 hs hns
      have tn : ∀ a b : ℚ, Algebra.trace ℚ K (algebraMap ℚ K a + algebraMap ℚ K b * s) = 2 * a := by
        intro a b
        have hli : LinearIndependent ℚ ![(1 : K), s] := by
          rw [LinearIndependent.pair_iff]
          intro c e hce
          by_cases he : e = 0
          · subst he; simp at hce; exact ⟨hce, rfl⟩
          · exfalso
            apply hns
            refine ⟨-c / e, ?_⟩
            have : (e : ℚ) • s = -(c • (1 : K)) := by
              have := hce; rw [add_comm] at this; exact eq_neg_of_add_eq_zero_left this
            have he' : algebraMap ℚ K e ≠ 0 := by simpa using he
            rw [map_div₀, map_neg, div_eq_iff he', mul_comm]
            simpa [Algebra.smul_def] using this.symm
        let B : Module.Basis (Fin 2) ℚ K := basisOfLinearIndependentOfCardEqFinrank hli (by simp [h2])
        have hB0 : B 0 = 1 := by simp [B]
        have hB1 : B 1 = s := by simp [B]
        let x : K := algebraMap ℚ K a + algebraMap ℚ K b * s
        have e0 : x * B 0 = a • B 0 + b • B 1 := by
          simp [x, hB0, hB1, Algebra.smul_def]
        have e1 : x * B 1 = (b * d) • B 0 + a • B 1 := by
          simp only [x, hB0, hB1, Algebra.smul_def, map_mul, add_mul, mul_one]
          rw [mul_assoc, hs]; ring
        have hM : Algebra.leftMulMatrix B x = !![a, b * d; b, a] := by
          ext i j
          rw [Algebra.leftMulMatrix_eq_repr_mul]
          fin_cases i <;> fin_cases j
          · simp [e0]
          · simp [e1]
          · simp [e0]
          · simp [e1]
        change Algebra.trace ℚ K x = _
        rw [Algebra.trace_eq_matrix_trace B, hM, Matrix.trace_fin_two]; simp; ring
      have t1 : Algebra.trace ℚ K 1 = 2 := by simpa using tn 1 0
      have ts : Algebra.trace ℚ K s = 0 := by simpa using tn 0 1
      have tss : Algebra.trace ℚ K (s * s) = 2 * d := by rw [hs]; simpa using tn d 0
      have tw : Algebra.trace ℚ K ((1 + s) / 2) = 1 := by
        have := tn (1 / 2) (1 / 2)
        rw [show algebraMap ℚ K (1 / 2) + algebraMap ℚ K (1 / 2) * s = (1 + s) / 2 by simp; ring] at this
        simpa using this
      have tww : Algebra.trace ℚ K (((1 + s) / 2) * ((1 + s) / 2)) = (1 + d) / 2 := by
        have := tn ((1 + d) / 4) (1 / 2)
        rw [show algebraMap ℚ K ((1 + d) / 4) + algebraMap ℚ K (1 / 2) * s = ((1 + s) / 2) * ((1 + s) / 2) by
          have : (((1 + s) / 2) * ((1 + s) / 2) : K) = (1 + 2 * s + s * s) / 4 := by ring
          rw [this, hs]; simp; ring] at this
        rw [this]; ring
      constructor
      · rw [Algebra.discr_def, Matrix.det_fin_two]
        simp [Algebra.traceMatrix_apply, Algebra.traceForm_apply, t1, ts, tss]
        ring
      · rw [Algebra.discr_def, Matrix.det_fin_two]
        simp only [Algebra.traceMatrix_apply, Algebra.traceForm_apply, Matrix.cons_val_zero, Matrix.cons_val_one, mul_one, one_mul, t1, tw, tww]
        ring
- id: ideal_norm_multiplicative
  kind: textbook
  level: 4
  topic: 代数的整数論・イデアルのノルムの乗法性
  statement: 数体$K$の整数環$\mathcal{O}_K$の$0$でないイデアル$I,J$について、$|\mathcal{O}_K/IJ|=|\mathcal{O}_K/I|\cdot|\mathcal{O}_K/J|$である。
  statement_en: For nonzero ideals I, J of the ring of integers of a number field, the index of IJ is the product of the indices of I and J.
  assumptions:
  - $K$は数体
  - $I,J$は$\mathcal{O}_K$の$0$でないイデアル
  quantifiers:
  - 任意の数体$K$と$0$でないイデアル$I,J$
  conclusion: $|\mathcal{O}_K/IJ|=|\mathcal{O}_K/I|\cdot|\mathcal{O}_K/J|$である。
  answer: |
    $K$を数体、$I,J$を$\mathcal{O}_K$の$0$でないイデアルとする。$N(\mathfrak{a})=|\mathcal{O}_K/\mathfrak{a}|$とおく。$\mathcal{O}_K$は Dedekind 環なので、$\mathfrak{a}$は素イデアルの冪の積に一意に分解する。

    相異なる素イデアルの冪は互いに素なので、中国剰余定理より$\mathcal{O}_K/\prod_i\mathfrak{p}_i^{a_i}\cong\prod_i\mathcal{O}_K/\mathfrak{p}_i^{a_i}$である。よって$N(\prod_i\mathfrak{p}_i^{a_i})=\prod_iN(\mathfrak{p}_i^{a_i})$であり、$N(\mathfrak{p}^a)=N(\mathfrak{p})^a$を示せば$N(IJ)=N(I)N(J)$が従う。

    $\mathfrak{p}$を$0$でない素イデアルとする。一意分解より$\mathfrak{p}^{i+1}\subsetneq\mathfrak{p}^i$であり、その間に別のイデアルはない。$\mathfrak{p}^i/\mathfrak{p}^{i+1}$は$\mathcal{O}_K/\mathfrak{p}$上のベクトル空間で、部分空間は間のイデアルに対応するので、$1$次元である。よって$|\mathfrak{p}^i/\mathfrak{p}^{i+1}|=N(\mathfrak{p})$である。列$\mathcal{O}_K\supset\mathfrak{p}\supset\dots\supset\mathfrak{p}^a$で指数を掛けると$N(\mathfrak{p}^a)=N(\mathfrak{p})^a$を得る。
  strategy: Reduce by the Chinese remainder theorem to prime powers and count along the chain of powers of a prime.
  sketch:
  - 'setup: Factor ideals into prime powers.'
  - 'apply_theorem: The Chinese remainder theorem reduces to one prime power.'
  - 'derive: Each quotient p^i/p^(i+1) is one-dimensional over the residue field.'
  - 'conclude: Multiplying along the chain gives N(p^a) = N(p)^a, hence multiplicativity.'
  openmath: (forall (K I J) (-> (and (number_field K) (ideal_of I (ring_of_integers K)) (ideal_of J (ring_of_integers K)) (!= I 0) (!= J 0)) (= (ideal_norm (ideal_mul I J)) (* (ideal_norm I) (ideal_norm J)))))
  hard_negative:
    statement: 数体の整数環の$0$でないイデアルについて、$N(I+J)=N(I)+N(J)$である。
    reason: $\mathbb{Z}$で$I=(2)$、$J=(3)$とすると$I+J=(1)$なので$N(I+J)=1$だが、$N(I)+N(J)=5$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (I J : Ideal (NumberField.RingOfIntegers K)), I ≠ ⊥ → J ≠ ⊥ → Nat.card (NumberField.RingOfIntegers K ⧸ (I * J)) = Nat.card (NumberField.RingOfIntegers K ⧸ I) * Nat.card (NumberField.RingOfIntegers K ⧸ J)
  proof: |
    by
      intro K _ _ I J _ _
      have h := map_mul (Ideal.absNorm (S := NumberField.RingOfIntegers K)) I J
      simpa [Ideal.absNorm_apply, Submodule.cardQuot_apply] using h
- id: ideal_norm_principal_abs_norm
  kind: textbook
  level: 4
  topic: 代数的整数論・単項イデアルのノルム
  statement: 数体$K$の整数環の$0$でない元$x$について、$|\mathcal{O}_K/(x)|=|N_{K/\mathbb{Q}}(x)|$である。
  statement_en: For a nonzero element x of the ring of integers of a number field, the index of the principal ideal (x) equals |N_{K/Q}(x)|.
  assumptions:
  - $K$は数体
  - $x\in\mathcal{O}_K$、$x\neq 0$
  quantifiers:
  - 任意の数体$K$と$0$でない$x\in\mathcal{O}_K$
  conclusion: $|\mathcal{O}_K/(x)|=|N_{K/\mathbb{Q}}(x)|$である。
  answer: |
    $K$を数体、$x\in\mathcal{O}_K$を$0$でない元とする。$\mathcal{O}_K$の$\mathbb{Z}$基底$b_1,\dots,b_n$をとると、これは$K$の$\mathbb{Q}$基底でもある。$xb_j=\sum_iA_{ij}b_i$となる整数行列$A$は$x$倍写像の行列なので、$\det A=N_{K/\mathbb{Q}}(x)$である。

    $(x)=x\mathcal{O}_K$は$\mathbb{Z}^n$の中で$A$の列が張る部分加群に対応する。$\det A\neq 0$なので、単因子標準形を考えると、その指数は$|\det A|$である。よって$|\mathcal{O}_K/(x)|=|N_{K/\mathbb{Q}}(x)|$である。
  strategy: The ideal (x) is the image of the lattice under the integer matrix of multiplication by x, whose determinant is the norm.
  sketch:
  - 'setup: Fix a Z-basis of O_K.'
  - 'translate: Multiplication by x has an integer matrix A with determinant N(x).'
  - 'apply_theorem: The index of A Z^n in Z^n is |det A|.'
  openmath: (forall (K x) (-> (and (number_field K) (in x (ring_of_integers K)) (!= x 0)) (= (ideal_norm (principal_ideal x)) (abs (relative_norm Q K x)))))
  hard_negative:
    statement: 数体の整数環の$0$でない元$x$について、$|\mathcal{O}_K/(x)|=|\mathrm{Tr}_{K/\mathbb{Q}}(x)|$である。
    reason: $K=\mathbb{Q}(i)$、$x=1+i$では指数は$2$でトレースも$2$だが、$x=i$では指数は$1$なのにトレースは$0$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (x : NumberField.RingOfIntegers K), x ≠ 0 → Nat.card (NumberField.RingOfIntegers K ⧸ Ideal.span {x}) = (Algebra.norm ℤ x).natAbs
  proof: |
    by
      intro K _ _ x _
      rw [← Ideal.absNorm_span_singleton, Ideal.absNorm_apply, Submodule.cardQuot_apply]
- id: element_prime_of_prime_norm
  kind: gap
  level: 4
  topic: 代数的整数論・素なノルムをもつ元
  statement: 数体$K$の整数環の元$x$について、$N_{K/\mathbb{Q}}(x)$が素数または素数の符号違いなら、$x$は$\mathcal{O}_K$の素元である。
  statement_en: If the norm of an element x of the ring of integers of a number field is a prime number up to sign, then x is a prime element.
  assumptions:
  - $K$は数体
  - $x\in\mathcal{O}_K$
  - $|N_{K/\mathbb{Q}}(x)|$は素数
  quantifiers:
  - 任意の数体$K$と$x\in\mathcal{O}_K$
  conclusion: $x$は$\mathcal{O}_K$の素元である。
  answer: |
    $K$を数体、$x\in\mathcal{O}_K$とし、$p=|N_{K/\mathbb{Q}}(x)|$を素数とする。$p\neq 0$なので$x\neq 0$であり、$|\mathcal{O}_K/(x)|=p$である。位数が素数$p$の単位的環は$\mathbb{Z}/p\mathbb{Z}$と同型である。実際、$1$の生成する加法部分群は位数が$1$より大きく$p$を割るので環全体になる。よって$\mathcal{O}_K/(x)$は体であり、$(x)$は素イデアルである。$(x)\neq\mathcal{O}_K$なので$x$は単元でなく、$x$は素元である。
  strategy: The quotient by (x) has prime order, hence is a field.
  sketch:
  - 'translate: The index of (x) equals |N(x)| = p.'
  - 'derive: A unital ring of prime order is Z/pZ.'
  - 'conclude: Hence (x) is a nonzero prime ideal and x is a prime element.'
  openmath: (forall (K x) (-> (and (number_field K) (in x (ring_of_integers K)) (in (abs (relative_norm Q K x)) P)) (prime_element x (ring_of_integers K))))
  hard_negative:
    statement: 数体の整数環の素元のノルムは、常に素数の符号違いである。
    reason: $3$は$\mathbb{Z}[i]$の素元だが、ノルムは$9$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (x : NumberField.RingOfIntegers K), Prime (Algebra.norm ℤ x) → Prime x
  proof: |
    by
      intro K _ _ x h
      have hx : x ≠ 0 := by
        rintro rfl
        have hn : Algebra.norm ℤ (0 : NumberField.RingOfIntegers K) = 0 := by simp
        exact h.ne_zero hn
      apply Ideal.prime_of_irreducible_absNorm_span hx
      rw [Ideal.absNorm_span_singleton]
      exact (Int.prime_iff_natAbs_prime.1 h).prime.irreducible
- id: finite_ideals_bounded_norm
  kind: textbook
  level: 4
  topic: 代数的整数論・ノルムの有界なイデアルの有限性
  statement: 数体$K$と自然数$n$に対し、$\mathcal{O}_K$の$0$でないイデアルで$|\mathcal{O}_K/I|\leq n$を満たすものは有限個である。
  statement_en: For a number field K and a natural number n, the ring of integers has only finitely many nonzero ideals of norm at most n.
  assumptions:
  - $K$は数体
  - $n$は自然数
  quantifiers:
  - 任意の数体$K$と自然数$n$
  conclusion: 条件を満たすイデアルは有限個である。
  answer: |
    $K$を数体、$n$を自然数とする。$0$でないイデアル$I$の指数を$m=|\mathcal{O}_K/I|$とする。加法群$\mathcal{O}_K/I$の位数が$m$なので、$m\cdot 1\in I$である。よって$I\supset m\mathcal{O}_K$である。

    $\mathcal{O}_K\cong\mathbb{Z}^{[K:\mathbb{Q}]}$なので$\mathcal{O}_K/m\mathcal{O}_K$は有限であり、$m\mathcal{O}_K$を含むイデアルは有限個である。$m$は$1,\dots,n$の有限通りなので、条件を満たす$I$は有限個である。
  strategy: An ideal of index m contains m, and only finitely many ideals contain m.
  sketch:
  - 'derive: An ideal of index m contains m by Lagrange.'
  - 'derive: The ring O_K/mO_K is finite, so finitely many ideals contain m.'
  - 'conclude: Take the union over m from 1 to n.'
  openmath: (forall (K n) (-> (and (number_field K) (in n N)) (finite_set (ideals_norm_le K n))))
  hard_negative:
    statement: 数体の整数環で、ノルムの絶対値が$n$以下の元は有限個である。
    reason: $\mathbb{Z}[\sqrt2]$の単元$(1+\sqrt2)^k$は無限個あり、ノルムはすべて$\pm 1$である。イデアルと元は異なる。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (n : ℕ), {I : Ideal (NumberField.RingOfIntegers K) | I ≠ ⊥ ∧ Ideal.absNorm I ≤ n}.Finite
  proof: |
    by
      intro K _ _ n
      exact (Ideal.finite_setOf_absNorm_le n).subset (fun I hI => hI.2)
- id: prime_ideal_norm_prime_power
  kind: gap
  level: 4
  topic: 代数的整数論・素イデアルのノルム
  statement: 数体$K$の整数環の$0$でない素イデアル$\mathfrak{p}$に対し、素数$p$と正の整数$n$で、$p\in\mathfrak{p}$かつ$|\mathcal{O}_K/\mathfrak{p}|=p^n$となるものが存在する。
  statement_en: For a nonzero prime ideal of the ring of integers of a number field there are a prime number p contained in it and a positive integer n such that its index is p^n.
  assumptions:
  - $K$は数体
  - $\mathfrak{p}$は$\mathcal{O}_K$の$0$でない素イデアル
  quantifiers:
  - 任意の数体$K$と$0$でない素イデアル$\mathfrak{p}$
  - ある素数$p$と正の整数$n$
  conclusion: $p\in\mathfrak{p}$かつ$|\mathcal{O}_K/\mathfrak{p}|=p^n$である。
  answer: |
    $K$を数体、$\mathfrak{p}$を$\mathcal{O}_K$の$0$でない素イデアルとする。$\mathcal{O}_K/\mathfrak{p}$は有限な整域なので有限体である。その標数を$p$とすると$p$は素数で、$\mathcal{O}_K/\mathfrak{p}$で$p\cdot 1=0$なので$p\in\mathfrak{p}$である。有限体は$\mathbb{F}_p$上のベクトル空間として有限次元なので、次元を$n\geq 1$とすれば$|\mathcal{O}_K/\mathfrak{p}|=p^n$である。
  strategy: The residue ring is a finite field, whose order is a power of its characteristic.
  sketch:
  - 'derive: The quotient is a finite integral domain, hence a finite field.'
  - 'construct: Let p be its characteristic, so p lies in the ideal.'
  - 'conclude: A finite field of characteristic p has order p^n with n positive.'
  openmath: (forall (K q) (-> (and (number_field K) (prime_ideal q (ring_of_integers K)) (!= q 0)) (exists (p n) (and (in p P) (in n N) (> n 0) (prime_number_in_ideal p q) (= (ideal_norm q) (^ p n))))))
  hard_negative:
    statement: 数体の整数環の$0$でない素イデアルのノルムは素数である。
    reason: $\mathbb{Z}[i]$の素イデアル$(3)$の指数は$9$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (P : Ideal (NumberField.RingOfIntegers K)), P ≠ ⊥ → P.IsPrime → ∃ (p n : ℕ), p.Prime ∧ 0 < n ∧ (p : NumberField.RingOfIntegers K) ∈ P ∧ Ideal.absNorm P = p ^ n
  proof: |
    by
      intro K _ _ P h0 hP
      have := hP.isMaximal h0
      obtain ⟨p, n, hn, hp, hp', h⟩ := Ideal.exists_prime_and_absNorm_eq_pow P
      exact ⟨p, n, hp', hn, hp, h⟩
- id: relative_norm_of_extended_ideal
  kind: gap
  level: 4
  topic: 代数的整数論・相対ノルム
  statement: 数体の拡大$L/K$と$\mathcal{O}_K$のイデアル$I$について、相対ノルムは$N_{L/K}(I\mathcal{O}_L)=I^{[L:K]}$を満たす。ここで$\mathcal{O}_L$のイデアル$J$の相対ノルム$N_{L/K}(J)$は、$J$の元の相対ノルムが生成する$\mathcal{O}_K$のイデアルである。
  statement_en: For an extension L/K of number fields and an ideal I of O_K, the relative norm of the extended ideal I O_L is I^[L:K], where the relative norm of an ideal J of O_L is the ideal of O_K generated by the norms of elements of J.
  assumptions:
  - $L/K$は数体の拡大
  - $I$は$\mathcal{O}_K$のイデアル
  quantifiers:
  - 任意の$L/K$とイデアル$I$
  conclusion: $N_{L/K}(I\mathcal{O}_L)=I^{[L:K]}$である。
  answer: |
    $L/K$を数体の拡大、$n=[L:K]$、$I$を$\mathcal{O}_K$のイデアル、$J=I\mathcal{O}_L$とする。$N_{L/K}(J)$は$J$の元の相対ノルムが生成する$\mathcal{O}_K$のイデアルである。$I=0$なら両辺とも$0$である。

    $I\neq 0$とする。$\mathcal{O}_K$の二つのイデアルは、すべての極大イデアルでの局所化が一致すれば等しい。そこで$\mathcal{O}_K$の極大イデアル$\mathfrak{p}$を固定し、$S=\mathcal{O}_K\setminus\mathfrak{p}$、$A=S^{-1}\mathcal{O}_K$、$B=S^{-1}\mathcal{O}_L$とおく。$A$は離散付値環である。素元を$\pi$とし、$IA=\pi^kA$（$k\geq 0$）と書くと、$S^{-1}J=\pi^kB$である。

    $N_{L/K}(J)A$は$\{N_{L/K}(z):z\in S^{-1}J\}$で生成される。実際、$z\in S^{-1}J$は$z=y/t$（$y\in J$、$t\in S$）と書けて、$N_{L/K}(z)=N_{L/K}(y)/t^n\in N_{L/K}(J)A$である。逆に$J\subset S^{-1}J$である。

    $z\in S^{-1}J$を$z=\pi^kw$（$w\in B$）と書くと、$N_{L/K}(z)=\pi^{kn}N_{L/K}(w)$である。$w$は$A$上整なので、共役の積である$N_{L/K}(w)$も$A$上整な$K$の元である。$A$は整閉なので$N_{L/K}(w)\in A$である。よって$N_{L/K}(J)A\subset\pi^{kn}A$である。一方$\pi^k\in S^{-1}J$で$N_{L/K}(\pi^k)=\pi^{kn}$である。

    以上から$N_{L/K}(J)A=\pi^{kn}A=I^nA$である。$\mathfrak{p}$は任意なので$N_{L/K}(J)=I^n$である。
  strategy: Check the equality after localizing at each maximal ideal, where the extended ideal is generated by a power of a uniformizer.
  sketch:
  - 'case_split: The zero ideal is immediate.'
  - 'translate: Two ideals of O_K agree if they agree after localizing at every maximal ideal p.'
  - 'setup: In the discrete valuation ring A = (O_K)_p write IA = (π^k), so the localized extended ideal is π^k B.'
  - 'derive: The localized norm ideal is generated by norms of elements of π^k B.'
  - 'derive: Each such norm is π^(kn) times an element of A, and π^k itself has norm π^(kn).'
  - 'conclude: Hence the norm ideal localizes to I^n A for every p.'
  openmath: (forall (K L I) (-> (and (number_field K) (number_field L) (finite_extension L K) (ideal_of I (ring_of_integers K))) (= (relative_ideal_norm K (extended_ideal I (ring_of_integers L))) (ideal_power I (extension_degree L K)))))
  hard_negative:
    statement: 同じ状況で$N_{L/K}(I\mathcal{O}_L)=I$である。
    reason: $K=\mathbb{Q}$、$L=\mathbb{Q}(i)$、$I=(3)$では、$3$の$L/K$ノルムは$9$なので相対ノルムは$(9)=I^2$であり、$I$と異なる。
  target: |
    ∀ (K L : Type*) [Field K] [NumberField K] [Field L] [NumberField L] [Algebra K L] (I : Ideal (NumberField.RingOfIntegers K)), Ideal.relNorm (NumberField.RingOfIntegers K) (Ideal.map (algebraMap (NumberField.RingOfIntegers K) (NumberField.RingOfIntegers L)) I) = I ^ Module.finrank K L
  proof: |
    by
      intro K L _ _ _ _ _ I
      letI := FractionRing.liftAlgebra (NumberField.RingOfIntegers K) (FractionRing (NumberField.RingOfIntegers L))
      have := Ideal.relNorm_algebraMap (NumberField.RingOfIntegers L) I
      rw [Algebra.IsAlgebraic.finrank_of_isFractionRing (NumberField.RingOfIntegers K) (FractionRing (NumberField.RingOfIntegers K)) (NumberField.RingOfIntegers L) (FractionRing (NumberField.RingOfIntegers L))] at this
      rwa [← Algebra.IsAlgebraic.finrank_of_isFractionRing (NumberField.RingOfIntegers K) K (NumberField.RingOfIntegers L) L] at this
- id: sum_ramification_inertia_number_field
  kind: named
  level: 4
  topic: 代数的整数論・基本等式
  statement: 基本等式。数体の拡大$L/K$と$\mathcal{O}_K$の$0$でない素イデアル$\mathfrak{p}$について、$\mathfrak{p}$の上の$\mathcal{O}_L$の素イデアル$\mathfrak{P}$全体にわたる和は$\sum_{\mathfrak{P}}e(\mathfrak{P}|\mathfrak{p})f(\mathfrak{P}|\mathfrak{p})=[L:K]$である。
  statement_en: The fundamental identity. For an extension L/K of number fields and a nonzero prime p of O_K, the sum of e(P|p) f(P|p) over the primes P of O_L above p equals [L:K].
  assumptions:
  - $L/K$は数体の拡大
  - $\mathfrak{p}$は$\mathcal{O}_K$の$0$でない素イデアル
  quantifiers:
  - 任意の$L/K$と$\mathfrak{p}$
  conclusion: $\sum_{\mathfrak{P}}e(\mathfrak{P}|\mathfrak{p})f(\mathfrak{P}|\mathfrak{p})=[L:K]$である。
  answer: |
    $L/K$を数体の拡大、$n=[L:K]$、$\mathfrak{p}$を$\mathcal{O}_K$の$0$でない素イデアル、$k=\mathcal{O}_K/\mathfrak{p}$とする。$\mathfrak{p}\mathcal{O}_L=\prod_i\mathfrak{P}_i^{e_i}$と分解し、$f_i=[\mathcal{O}_L/\mathfrak{P}_i:k]$とする。

    まず$\dim_k\mathcal{O}_L/\mathfrak{p}\mathcal{O}_L=n$を示す。$\mathfrak{p}$での局所化$A=(\mathcal{O}_K)_{\mathfrak{p}}$は離散付値環で、$B=A\mathcal{O}_L$は有限生成ねじれなし$A$加群なので、階数$n$の自由加群である。$B/\mathfrak{p}B\cong\mathcal{O}_L/\mathfrak{p}\mathcal{O}_L$なので、次元は$n$である。

    次に中国剰余定理より$\mathcal{O}_L/\mathfrak{p}\mathcal{O}_L\cong\prod_i\mathcal{O}_L/\mathfrak{P}_i^{e_i}$である。列$\mathcal{O}_L\supset\mathfrak{P}_i\supset\dots\supset\mathfrak{P}_i^{e_i}$の各商は$\mathcal{O}_L/\mathfrak{P}_i$上$1$次元なので、$\dim_k\mathcal{O}_L/\mathfrak{P}_i^{e_i}=e_if_i$である。次元を足して$\sum_ie_if_i=n$を得る。
  strategy: Compute the dimension of O_L/pO_L over the residue field in two ways.
  sketch:
  - 'derive: Localizing at p makes O_L free of rank n, so the quotient has dimension n.'
  - 'apply_theorem: The Chinese remainder theorem splits the quotient along the primes above p.'
  - 'derive: Each factor has dimension e_i f_i by the chain of powers.'
  - 'conclude: Add the dimensions.'
  openmath: (forall (K L p) (-> (and (number_field K) (number_field L) (finite_extension L K) (prime_ideal p (ring_of_integers K)) (!= p 0)) (= (finset_sum (primes_over p L) (lambda (q) (* (ramification_index p q) (inertia_degree p q)))) (extension_degree L K))))
  hard_negative:
    statement: 同じ状況で$\sum_{\mathfrak{P}}e(\mathfrak{P}|\mathfrak{p})=[L:K]$である。
    reason: $K=\mathbb{Q}$、$L=\mathbb{Q}(i)$、$\mathfrak{p}=(3)$では、上の素イデアルは$(3)$だけで$e=1$、$f=2$なので、$e$の和は$1$である。
  target: |
    ∀ (K L : Type*) [Field K] [NumberField K] [Field L] [NumberField L] [Algebra K L] (p : Ideal (NumberField.RingOfIntegers K)) [p.IsMaximal], p ≠ ⊥ → ∑ P ∈ IsDedekindDomain.primesOverFinset p (NumberField.RingOfIntegers L), p.ramificationIdx P * p.inertiaDeg P = Module.finrank K L
  proof: |
    by
      intro K L _ _ _ _ _ p _ h
      exact Ideal.sum_ramification_inertia _ K L h
- id: primes_over_count_ramification_bounds
  kind: gap
  level: 4
  topic: 代数的整数論・素イデアル分解の評価
  statement: 数体の拡大$L/K$と$\mathcal{O}_K$の$0$でない素イデアル$\mathfrak{p}$について、$\mathfrak{p}$の上の素イデアルは$[L:K]$個以下であり、その各々について$e(\mathfrak{P}|\mathfrak{p})\leq[L:K]$かつ$f(\mathfrak{P}|\mathfrak{p})\leq[L:K]$である。
  statement_en: For an extension L/K of number fields and a nonzero prime p of O_K, there are at most [L:K] primes above p, and each such prime P satisfies e(P|p) ≤ [L:K] and f(P|p) ≤ [L:K].
  assumptions:
  - $L/K$は数体の拡大
  - $\mathfrak{p}$は$\mathcal{O}_K$の$0$でない素イデアル
  quantifiers:
  - 任意の$L/K$と$\mathfrak{p}$
  - $\mathfrak{p}$の上の任意の素イデアル$\mathfrak{P}$
  conclusion: 上の素イデアルの個数、$e$、$f$はすべて$[L:K]$以下である。
  answer: |
    $L/K$を数体の拡大、$\mathfrak{p}$を$\mathcal{O}_K$の$0$でない素イデアルとする。基本等式より、$\mathfrak{p}$の上の素イデアル$\mathfrak{P}$全体で$\sum_{\mathfrak{P}}e(\mathfrak{P}|\mathfrak{p})f(\mathfrak{P}|\mathfrak{p})=[L:K]$である。各項の$e,f$は$1$以上の整数なので、項数は$[L:K]$以下である。また一つの項について$e,f\leq ef\leq[L:K]$である。
  strategy: All terms of the fundamental identity are positive integers.
  sketch:
  - 'apply_theorem: Start from the fundamental identity.'
  - 'derive: Each e and f is at least 1, so the number of terms is at most the degree.'
  - 'conclude: Each single term bounds its e and f.'
  openmath: (forall (K L p) (-> (and (number_field K) (number_field L) (finite_extension L K) (prime_ideal p (ring_of_integers K)) (!= p 0)) (and (<= (size (primes_over p L)) (extension_degree L K)) (forall (q) (-> (in q (primes_over p L)) (and (<= (ramification_index p q) (extension_degree L K)) (<= (inertia_degree p q) (extension_degree L K))))))))
  hard_negative:
    statement: 同じ状況で、$\mathfrak{p}$の上の素イデアルの個数は$[L:K]$を割り切る。
    reason: 非 Galois の$3$次体では$p\mathcal{O}_K=\mathfrak{P}_1\mathfrak{P}_2$（$f_1=1$、$f_2=2$）となる素数$p$があり、個数$2$は$3$を割らない。例えば$X^3-2$で$p=5$である。
  target: |
    ∀ (K L : Type*) [Field K] [NumberField K] [Field L] [NumberField L] [Algebra K L] (p : Ideal (NumberField.RingOfIntegers K)) [p.IsMaximal], p ≠ ⊥ → (IsDedekindDomain.primesOverFinset p (NumberField.RingOfIntegers L)).card ≤ Module.finrank K L ∧ ∀ (P : Ideal (NumberField.RingOfIntegers L)) [P.IsPrime] [P.LiesOver p], p.ramificationIdx P ≤ Module.finrank K L ∧ p.inertiaDeg P ≤ Module.finrank K L
  proof: |
    by
      intro K L _ _ _ _ _ p _ h
      haveI : NoZeroSMulDivisors (NumberField.RingOfIntegers K) (NumberField.RingOfIntegers L) :=
        ⟨fun {c x} hc => by
          rw [Algebra.smul_def] at hc
          rcases mul_eq_zero.1 hc with h1 | h1
          · exact Or.inl (NumberField.RingOfIntegers.algebraMap.injective K L (by simpa using h1))
          · exact Or.inr h1⟩
      exact ⟨Ideal.card_primesOverFinset_le_finrank _ K L h, fun P _ _ => ⟨Ideal.ramificationIdx_le_finrank _ K L P, Ideal.inertiaDeg_le_finrank _ K L P h⟩⟩
- id: ramification_inertia_tower
  kind: gap
  level: 4
  topic: 代数的整数論・分岐指数と剰余次数の塔
  statement: 数体の塔$K\subset F\subset L$と$0$でない素イデアル$\mathfrak{p}\subset\mathcal{O}_K$、$\mathfrak{P}\subset\mathcal{O}_F$、素イデアル$\mathfrak{Q}\subset\mathcal{O}_L$が$\mathfrak{Q}$は$\mathfrak{P}$の上、$\mathfrak{P}$は$\mathfrak{p}$の上にあるとき、$e(\mathfrak{Q}|\mathfrak{p})=e(\mathfrak{P}|\mathfrak{p})e(\mathfrak{Q}|\mathfrak{P})$かつ$f(\mathfrak{Q}|\mathfrak{p})=f(\mathfrak{P}|\mathfrak{p})f(\mathfrak{Q}|\mathfrak{P})$である。
  statement_en: For a tower K ⊂ F ⊂ L of number fields and nonzero primes p, P with a prime Q above P and P above p, e(Q|p) = e(P|p) e(Q|P) and f(Q|p) = f(P|p) f(Q|P).
  assumptions:
  - $K\subset F\subset L$は数体の塔
  - $\mathfrak{p}\subset\mathcal{O}_K$、$\mathfrak{P}\subset\mathcal{O}_F$は$0$でない素イデアル
  - $\mathfrak{Q}\subset\mathcal{O}_L$は素イデアル
  - $\mathfrak{Q}$は$\mathfrak{P}$の上、$\mathfrak{P}$は$\mathfrak{p}$の上にある
  quantifiers:
  - 任意の塔と素イデアルの組
  conclusion: $e$と$f$はともに塔で乗法的である。
  answer: |
    $K\subset F\subset L$を数体の塔とし、$\mathfrak{p},\mathfrak{P}$を$0$でない素イデアル、$\mathfrak{Q}$を$\mathfrak{P}$の上の素イデアル、$\mathfrak{P}$を$\mathfrak{p}$の上の素イデアルとする。$e=e(\mathfrak{P}|\mathfrak{p})$、$e'=e(\mathfrak{Q}|\mathfrak{P})$とおく。

    $\mathfrak{p}\mathcal{O}_F=\mathfrak{P}^e\mathfrak{a}$（$\mathfrak{P}\nmid\mathfrak{a}$）、$\mathfrak{P}\mathcal{O}_L=\mathfrak{Q}^{e'}\mathfrak{b}$（$\mathfrak{Q}\nmid\mathfrak{b}$）と書く。$\mathfrak{a}\mathcal{O}_L$は$\mathfrak{Q}$で割り切れない。割り切れるとすると$\mathfrak{Q}\cap\mathcal{O}_F=\mathfrak{P}$が$\mathfrak{a}$を含むことになり、$\mathfrak{P}\mid\mathfrak{a}$に反するからである。よって$\mathfrak{p}\mathcal{O}_L=\mathfrak{Q}^{ee'}\mathfrak{b}^e\mathfrak{a}\mathcal{O}_L$の$\mathfrak{Q}$の指数は$ee'$である。

    剰余体は体の塔$\mathcal{O}_K/\mathfrak{p}\subset\mathcal{O}_F/\mathfrak{P}\subset\mathcal{O}_L/\mathfrak{Q}$をなすので、拡大次数の積の公式から$f$の等式を得る。
  strategy: Compare exponents in successive factorizations and apply the degree formula to the residue fields.
  sketch:
  - 'setup: Factor p in O_F and then P in O_L, isolating P and Q.'
  - 'derive: The cofactor of P stays prime to Q because Q contracts to P.'
  - 'derive: Hence the exponent of Q in pO_L is e e''.'
  - 'conclude: The residue fields form a tower, which gives the formula for f.'
  openmath: (forall (K F L p q r) (-> (and (number_field K) (number_field F) (number_field L) (intermediate_tower K F L) (prime_ideal p (ring_of_integers K)) (!= p 0) (prime_ideal q (ring_of_integers F)) (!= q 0) (prime_ideal r (ring_of_integers L)) (lies_over q p) (lies_over r q)) (and (= (ramification_index p r) (* (ramification_index p q) (ramification_index q r))) (= (inertia_degree p r) (* (inertia_degree p q) (inertia_degree q r))))))
  hard_negative:
    statement: 同じ状況で$e(\mathfrak{Q}|\mathfrak{p})=e(\mathfrak{P}|\mathfrak{p})+e(\mathfrak{Q}|\mathfrak{P})$である。
    reason: $\mathbb{Q}\subset\mathbb{Q}(\zeta_8)\subset\mathbb{Q}(\zeta_{16})$の$2$の上では、各段の$e$は$4,2$で全体の$e$は$8$であり、和の$6$と異なる。
  target: |
    ∀ (K F L : Type*) [Field K] [Field F] [Field L] [NumberField K] [NumberField F] [NumberField L] [Algebra K F] [Algebra F L] [Algebra K L] [IsScalarTower K F L] (p : Ideal (NumberField.RingOfIntegers K)) (P : Ideal (NumberField.RingOfIntegers F)) (Q : Ideal (NumberField.RingOfIntegers L)) [p.IsMaximal] [P.IsMaximal] [Q.IsPrime] [P.LiesOver p] [Q.LiesOver P], p ≠ ⊥ → P ≠ ⊥ → p.ramificationIdx Q = p.ramificationIdx P * P.ramificationIdx Q ∧ p.inertiaDeg Q = p.inertiaDeg P * P.inertiaDeg Q
  proof: |
    by
      intro K F L _ _ _ _ _ _ _ _ _ _ p P Q _ _ _ _ _ hp hP
      have h1 : Ideal.map (algebraMap (NumberField.RingOfIntegers F) (NumberField.RingOfIntegers L)) P ≠ ⊥ :=
        Ideal.map_ne_bot_of_ne_bot hP
      have h2 : Ideal.map (algebraMap (NumberField.RingOfIntegers K) (NumberField.RingOfIntegers L)) p ≠ ⊥ :=
        Ideal.map_ne_bot_of_ne_bot hp
      exact ⟨Ideal.ramificationIdx_algebra_tower h1 h2 (Ideal.map_le_of_le_comap (Ideal.LiesOver.over (P := Q) (p := P)).le), Ideal.inertiaDeg_algebra_tower p P Q⟩
- id: galois_primes_over_transitive
  kind: textbook
  level: 4
  topic: 代数的整数論・Galois 群の推移的作用
  statement: 数体の Galois 拡大$L/K$と$\mathcal{O}_K$のイデアル$\mathfrak{p}$について、$\mathfrak{p}$の上の$\mathcal{O}_L$の素イデアル$\mathfrak{P},\mathfrak{Q}$に対し、$\sigma\in\mathrm{Gal}(L/K)$で$\sigma^{-1}(\mathfrak{P})=\mathfrak{Q}$となるものが存在する。
  statement_en: For a Galois extension L/K of number fields and an ideal p of O_K, any two primes P, Q of O_L above p are related by some σ in Gal(L/K) with σ^(-1)(P) = Q.
  assumptions:
  - $L/K$は数体の Galois 拡大
  - $\mathfrak{p}$は$\mathcal{O}_K$のイデアル
  - $\mathfrak{P},\mathfrak{Q}$は$\mathfrak{p}$の上の$\mathcal{O}_L$の素イデアル
  quantifiers:
  - 任意の$L/K$、$\mathfrak{p}$、$\mathfrak{P}$、$\mathfrak{Q}$
  - ある$\sigma\in\mathrm{Gal}(L/K)$
  conclusion: $\sigma^{-1}(\mathfrak{P})=\mathfrak{Q}$である。
  answer: |
    $L/K$を数体の Galois 拡大、$G=\mathrm{Gal}(L/K)$、$\mathfrak{p}$を$\mathcal{O}_K$のイデアル、$\mathfrak{P},\mathfrak{Q}$を$\mathfrak{p}$の上の素イデアルとする。

    $\mathfrak{p}$が$0$なら、$\mathfrak{P},\mathfrak{Q}$はともに整拡大で$0$に縮約する素イデアルなので$0$であり、任意の$\sigma$でよい。$\mathfrak{p}\neq 0$とすると、$\mathfrak{P},\mathfrak{Q}$は極大イデアルであり、各$\sigma\in G$について$\sigma^{-1}(\mathfrak{P})$も$\mathfrak{p}$の上の極大イデアルである。

    すべての$\sigma$で$\sigma^{-1}(\mathfrak{P})\neq\mathfrak{Q}$と仮定する。中国剰余定理より、$x\in\mathcal{O}_L$で$x\in\mathfrak{Q}$かつ、すべての$\sigma$で$x\notin\sigma^{-1}(\mathfrak{P})$となるものがある。$y=\prod_{\sigma\in G}\sigma(x)$は$G$不変で整なので$\mathcal{O}_K$に属する。$\sigma=\mathrm{id}$の因子$x$が$\mathfrak{Q}$に属するので$y\in\mathfrak{Q}\cap\mathcal{O}_K=\mathfrak{p}\subset\mathfrak{P}$である。$\mathfrak{P}$は素イデアルなので、ある$\sigma$で$\sigma(x)\in\mathfrak{P}$、すなわち$x\in\sigma^{-1}(\mathfrak{P})$となり、矛盾する。
  strategy: Separate Q from all conjugates of P by the Chinese remainder theorem and take the norm.
  sketch:
  - 'case_split: Dispose of the zero ideal, so that all primes involved are maximal.'
  - 'contradiction: If Q is no conjugate of P, choose x in Q outside every conjugate of P.'
  - 'derive: The norm of x lies in Q ∩ O_K = p, which is contained in P.'
  - 'conclude: Primality of P puts some σ(x) in P, a contradiction.'
  openmath: (forall (K L p q r) (-> (and (number_field K) (number_field L) (galois_extension L K) (ideal_of p (ring_of_integers K)) (prime_ideal q (ring_of_integers L)) (prime_ideal r (ring_of_integers L)) (lies_over q p) (lies_over r p)) (exists (s) (and (in s (galois_group L K)) (= (galois_image_ideal s q) r)))))
  hard_negative:
    statement: Galois とは限らない数体の拡大でも、同じ素イデアルの上の素イデアルは自己同型で移り合う。
    reason: $K=\mathbb{Q}(\sqrt[3]{2})$では$5\mathcal{O}_K=\mathfrak{P}_1\mathfrak{P}_2$で$f_1=1$、$f_2=2$であり、$K$の$\mathbb{Q}$上の自己同型は恒等写像だけなので移り合わない。
  target: |
    ∀ (K L : Type*) [Field K] [NumberField K] [Field L] [NumberField L] [Algebra K L] [IsGalois K L] (p : Ideal (NumberField.RingOfIntegers K)) (P Q : Ideal (NumberField.RingOfIntegers L)), P ∈ p.primesOver (NumberField.RingOfIntegers L) → Q ∈ p.primesOver (NumberField.RingOfIntegers L) → ∃ σ : L ≃ₐ[K] L, P.comap (galRestrict (NumberField.RingOfIntegers K) K L (NumberField.RingOfIntegers L) σ) = Q
  proof: |
    by
      intro K L _ _ _ _ _ _ p P Q hP hQ
      exact Ideal.exists_comap_galRestrict_eq _ K L _ hP hQ
- id: galois_primes_gef_eq_degree
  kind: gap
  level: 4
  topic: 代数的整数論・Galois 拡大の素イデアル分解
  statement: 数体の Galois 拡大$L/K$と$\mathcal{O}_K$の$0$でない素イデアル$\mathfrak{p}$について、$\mathfrak{p}$の上の素イデアルの個数を$g$とすると、$\mathfrak{p}$の上の任意の素イデアル$\mathfrak{P}$で$g\,e(\mathfrak{P}|\mathfrak{p})f(\mathfrak{P}|\mathfrak{p})=[L:K]$である。
  statement_en: For a Galois extension L/K of number fields and a nonzero prime p of O_K with g primes above it, every prime P above p satisfies g e(P|p) f(P|p) = [L:K].
  assumptions:
  - $L/K$は数体の Galois 拡大
  - $\mathfrak{p}$は$\mathcal{O}_K$の$0$でない素イデアル
  - $\mathfrak{P}$は$\mathfrak{p}$の上の素イデアル
  - $g$は$\mathfrak{p}$の上の素イデアルの個数
  quantifiers:
  - 任意の$L/K$、$\mathfrak{p}$、$\mathfrak{P}$
  conclusion: $g\,e(\mathfrak{P}|\mathfrak{p})f(\mathfrak{P}|\mathfrak{p})=[L:K]$である。
  answer: |
    $L/K$を数体の Galois 拡大、$\mathfrak{p}$を$\mathcal{O}_K$の$0$でない素イデアルとする。$\mathfrak{p}\mathcal{O}_L=\prod_i\mathfrak{P}_i^{e_i}$と分解する。$\sigma\in\mathrm{Gal}(L/K)$を$\mathfrak{p}\mathcal{O}_L$に作用させても$\mathfrak{p}\mathcal{O}_L$は変わらないので、$\sigma$は素イデアルの指数を保つ。$\sigma$は環同型$\mathcal{O}_L/\mathfrak{P}\to\mathcal{O}_L/\sigma(\mathfrak{P})$で$\mathcal{O}_K/\mathfrak{p}$上のものを誘導するので、剰余次数も保つ。Galois 群は$\mathfrak{p}$の上の素イデアルに推移的に作用するので、$e_i$と$f_i$は$i$によらない。基本等式$\sum_ie_if_i=[L:K]$で項数は$g$なので、$g\,ef=[L:K]$である。
  strategy: The Galois group acts transitively on the primes above p and preserves e and f, so all terms of the fundamental identity agree.
  sketch:
  - 'derive: Automorphisms fix pO_L and hence preserve exponents and residue degrees.'
  - 'apply_theorem: Transitivity shows e and f are independent of the prime above p.'
  - 'conclude: The fundamental identity becomes g e f = [L:K].'
  openmath: (forall (K L p q) (-> (and (number_field K) (number_field L) (galois_extension L K) (prime_ideal p (ring_of_integers K)) (!= p 0) (in q (primes_over p L))) (= (* (size (primes_over p L)) (* (ramification_index p q) (inertia_degree p q))) (extension_degree L K))))
  hard_negative:
    statement: Galois とは限らない数体の拡大でも$g\,ef=[L:K]$である。
    reason: $K=\mathbb{Q}(\sqrt[3]{2})$、$p=5$では$g=2$で、$(e,f)$は$(1,1)$と$(1,2)$なので、いずれの$\mathfrak{P}$でも$gef\neq 3$である。
  target: |
    ∀ (K L : Type*) [Field K] [NumberField K] [Field L] [NumberField L] [Algebra K L] [IsGalois K L] (p : Ideal (NumberField.RingOfIntegers K)) [p.IsMaximal], p ≠ ⊥ → ∀ (P : Ideal (NumberField.RingOfIntegers L)) [P.IsPrime] [P.LiesOver p], (p.primesOver (NumberField.RingOfIntegers L)).ncard * (p.ramificationIdx P * p.inertiaDeg P) = Module.finrank K L
  proof: |
    by
      intro K L _ _ _ _ _ _ p _ h P hP _
      have hG : IsGaloisGroup (L ≃ₐ[K] L) (NumberField.RingOfIntegers K) (NumberField.RingOfIntegers L) := IsGaloisGroup.of_isFractionRing _ _ _ K L
      have h1 := Ideal.ncard_primesOver_mul_ramificationIdxIn_mul_inertiaDegIn p (NumberField.RingOfIntegers L) (L ≃ₐ[K] L)
      rw [Ideal.ramificationIdxIn_eq_ramificationIdx p P (L ≃ₐ[K] L), Ideal.inertiaDegIn_eq_inertiaDeg p P (L ≃ₐ[K] L)] at h1
      have hPb : P ≠ ⊥ := Ideal.ne_bot_of_liesOver_of_ne_bot h P
      haveI : P.IsMaximal := hP.isMaximal hPb
      rw [Ideal.ramificationIdx_eq_ramificationIdx' p P h, Ideal.inertiaDeg_eq_inertiaDeg' p P, ← IsGalois.card_aut_eq_finrank, ← h1]
- id: kummer_dedekind_factorization
  kind: named
  level: 4
  topic: 代数的整数論・Kummer–Dedekind の定理
  statement: Kummer–Dedekind の定理。数体$K$の$\theta\in\mathcal{O}_K$と素数$p$について、$d\mathcal{O}_K\subset\mathbb{Z}[\theta]$となる最小の正整数を$d$（なければ$0$）とし、$p\nmid d$とする。$\theta$の最小多項式を$f$とすると、$p$の上の素イデアルと$\bar f\in\mathbb{F}_p[X]$のモニック既約因子の間に全単射がある。モニック既約因子$\bar g$（$g\in\mathbb{Z}[X]$）に対応する素イデアルは$(p,g(\theta))$であり、その剰余次数は$\deg\bar g$、分岐指数は$\bar f$における$\bar g$の重複度である。
  statement_en: Kummer–Dedekind. Let θ be in the ring of integers of a number field and p a prime not dividing the least positive d with d O_K in Z[θ] (or 0 if none). The primes above p correspond bijectively to the monic irreducible factors of the minimal polynomial f of θ mod p; the factor g mod p corresponds to the prime (p, g(θ)), whose inertia degree is deg g mod p and whose ramification index is the multiplicity of g mod p in f mod p.
  assumptions:
  - $K$は数体、$\theta\in\mathcal{O}_K$
  - $p$は素数で$p\nmid d$
  - $d$は$d\mathcal{O}_K\subset\mathbb{Z}[\theta]$となる最小の正整数（なければ$0$）
  - $f$は$\theta$の最小多項式
  quantifiers:
  - 任意の$K,\theta,p$
  - $\bar f$の任意のモニック既約因子$\bar g$と、その整数係数の持ち上げ$g$
  conclusion: 全単射が存在し、対応する素イデアルは$(p,g(\theta))$で、剰余次数は$\deg\bar g$、分岐指数は$\bar g$の重複度である。
  answer: |
    $K$を数体、$\theta\in\mathcal{O}_K$、$p$を$p\nmid d$である素数、$f$を$\theta$の最小多項式とする。$p\nmid d$より$d\neq 0$なので$\mathbb{Z}[\theta]$は$\mathcal{O}_K$の中で有限指数であり、$\theta$は$K$を生成する。$n=\deg f=[K:\mathbb{Q}]$である。

    $ud+vp=1$となる整数$u,v$をとる。$x\in\mathcal{O}_K$は$x=u(dx)+vpx$と書けるので$\mathcal{O}_K=\mathbb{Z}[\theta]+p\mathcal{O}_K$である。また$\mathbb{Z}[\theta]\cap p\mathcal{O}_K=p\mathbb{Z}[\theta]$である。実際$py\in\mathbb{Z}[\theta]$（$y\in\mathcal{O}_K$）なら$y=u(dy)+v(py)\in\mathbb{Z}[\theta]$である。したがって$\mathbb{F}_p[X]/(\bar f)\cong\mathbb{Z}[\theta]/p\mathbb{Z}[\theta]\cong\mathcal{O}_K/p\mathcal{O}_K$である。

    $\bar f=\prod_i\bar g_i^{e_i}$と分解する。左の環の極大イデアルは$(\bar g_i)$であり、対応して$p$の上の素イデアルは$\mathfrak{P}_i=(p,g_i(\theta))$の全体である。剰余体は$\mathbb{F}_p[X]/(\bar g_i)$なので、$f_i=\deg\bar g_i$である。

    $f(\theta)=0$より$\prod_ig_i(\theta)^{e_i}\in p\mathcal{O}_K$なので、$\prod_i\mathfrak{P}_i^{e_i}\subset p\mathcal{O}_K$である。よって$p\mathcal{O}_K=\prod_i\mathfrak{P}_i^{a_i}$と書くと$a_i\leq e_i$である。基本等式より$\sum_ia_if_i=n=\deg\bar f=\sum_ie_if_i$なので、すべての$i$で$a_i=e_i$である。
  strategy: Identify O_K/pO_K with F_p[X]/(f mod p), read off primes and residue degrees, and pin down exponents by the fundamental identity.
  sketch:
  - 'derive: p not dividing d gives O_K/pO_K isomorphic to F_p[X]/(f mod p).'
  - 'translate: Maximal ideals correspond to irreducible factors, with residue degree the degree of the factor.'
  - 'derive: The relation f(θ) = 0 bounds the true exponents by the multiplicities.'
  - 'apply_theorem: The fundamental identity forces equality.'
  openmath: (forall (K t p) (-> (and (number_field K) (in t (ring_of_integers K)) (in p P) (not (dvd p (conductor_exponent t)))) (and (forall (g) (-> (monic_irreducible_factor_mod g t p) (and (prime_ideal (ideal_sum (principal_ideal p) (principal_ideal (poly_eval g t))) (ring_of_integers K)) (lies_over (ideal_sum (principal_ideal p) (principal_ideal (poly_eval g t))) (principal_ideal p)) (= (inertia_degree (principal_ideal p) (ideal_sum (principal_ideal p) (principal_ideal (poly_eval g t)))) (degree_mod g p)) (= (ramification_index (principal_ideal p) (ideal_sum (principal_ideal p) (principal_ideal (poly_eval g t)))) (multiplicity_mod g t p))))) (forall (q) (-> (and (prime_ideal q (ring_of_integers K)) (lies_over q (principal_ideal p))) (exists (g) (and (monic_irreducible_factor_mod g t p) (= q (ideal_sum (principal_ideal p) (principal_ideal (poly_eval g t)))))))) (forall (g h) (-> (and (monic_irreducible_factor_mod g t p) (monic_irreducible_factor_mod h t p) (= (ideal_sum (principal_ideal p) (principal_ideal (poly_eval g t))) (ideal_sum (principal_ideal p) (principal_ideal (poly_eval h t))))) (= (poly_reduction_mod g p) (poly_reduction_mod h p)))))))
  hard_negative:
    statement: すべての素数$p$について、$p$の上の素イデアルは$\bar f$の既約因子に対応する。
    reason: $K=\mathbb{Q}(\sqrt5)$、$\theta=\sqrt5$、$p=2$では$\bar f=(X+1)^2$だが、$2$は$\mathcal{O}_K$で素イデアルのままで不分岐である。指数の条件$p\nmid d$（ここでは$d=2$）が必要である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (θ : NumberField.RingOfIntegers K) (p : ℕ) [Fact p.Prime], ¬ p ∣ RingOfIntegers.exponent θ → ∃ e : ↑((Ideal.span {(p : ℤ)}).primesOver (NumberField.RingOfIntegers K)) ≃ ↥(RingOfIntegers.monicFactorsMod θ p), ∀ (Q : Polynomial ℤ) (hQ : Polynomial.map (Int.castRingHom (ZMod p)) Q ∈ RingOfIntegers.monicFactorsMod θ p), (Ideal.span {(p : ℤ)}).inertiaDeg (e.symm ⟨Polynomial.map (Int.castRingHom (ZMod p)) Q, hQ⟩ : Ideal (NumberField.RingOfIntegers K)) = (Polynomial.map (Int.castRingHom (ZMod p)) Q).natDegree ∧ (Ideal.span {(p : ℤ)}).ramificationIdx (e.symm ⟨Polynomial.map (Int.castRingHom (ZMod p)) Q, hQ⟩ : Ideal (NumberField.RingOfIntegers K)) = multiplicity (Polynomial.map (Int.castRingHom (ZMod p)) Q) (Polynomial.map (Int.castRingHom (ZMod p)) (minpoly ℤ θ)) ∧ (e.symm ⟨Polynomial.map (Int.castRingHom (ZMod p)) Q, hQ⟩ : Ideal (NumberField.RingOfIntegers K)) = Ideal.span {(p : NumberField.RingOfIntegers K), Polynomial.aeval θ Q}
  proof: |
    by
      intro K _ _ θ p _ hp
      refine ⟨NumberField.Ideal.primesOverSpanEquivMonicFactorsMod hp, fun Q hQ => ⟨?_, ?_, ?_⟩⟩
      · exact NumberField.Ideal.inertiaDeg_primesOverSpanEquivMonicFactorsMod_symm_apply hp hQ
      · exact NumberField.Ideal.ramificationIdx_primesOverSpanEquivMonicFactorsMod_symm_apply hp hQ
      · exact NumberField.Ideal.primesOverSpanEquivMonicFactorsMod_symm_apply_eq_span hp hQ
- id: cyclotomic_ramification_inertia
  kind: textbook
  level: 4
  topic: 代数的整数論・円分体の素イデアル分解
  statement: 素数$p$、$k\geq 0$、$p\nmid m$、$n=p^{k+1}m$とし、$K$を$\mathbb{Q}$の$n$次円分拡大とする。$p$の上の$\mathcal{O}_K$の素イデアル$\mathfrak{P}$について、分岐指数は$p^k(p-1)$であり、剰余次数は$\mathbb{Z}/m\mathbb{Z}$における$p$の乗法的位数である。
  statement_en: Let p be a prime, k ≥ 0, p not dividing m, n = p^(k+1) m and K the n-th cyclotomic extension of Q. Every prime P of O_K above p has ramification index p^k (p-1) and inertia degree the multiplicative order of p modulo m.
  assumptions:
  - $p$は素数、$k\geq 0$、$p\nmid m$、$n=p^{k+1}m$
  - $K$は$\mathbb{Q}$の$n$次円分拡大
  - $\mathfrak{P}$は$p$の上の$\mathcal{O}_K$の素イデアル
  quantifiers:
  - 任意の$p,k,m,K,\mathfrak{P}$
  conclusion: $e(\mathfrak{P}|p)=p^k(p-1)$かつ$f(\mathfrak{P}|p)$は$p$の$m$を法とする位数である。
  answer: |
    $p$を素数、$p\nmid m$、$n=p^{k+1}m$、$K$を$n$次円分拡大とし、$F=\mathbb{Q}(\zeta_m)\subset K$とする。$f_0$を$p$の$m$を法とする位数とする。

    まず$F$での分解を調べる。$\mathcal{O}_F=\mathbb{Z}[\zeta_m]$である。$p\nmid m$なので$X^m-1$は$\mathbb{F}_p$上重根をもたず、その因子$\Phi_m$も同様である。$\zeta_m$の還元は$\bar{\mathbb{F}}_p$の原始$m$乗根であり、これを含む最小の$\mathbb{F}_{p^d}$は$m\mid p^d-1$となる最小の$d=f_0$で定まる。よって Kummer–Dedekind の定理より、$p$の上の$F$の素イデアル$\mathfrak{q}$はすべて$e=1$、$f=f_0$である。

    次に$K=F(\zeta)$（$\zeta=\zeta_{p^{k+1}}$）を調べる。$[K:F]=\varphi(p^{k+1})=p^k(p-1)$である。$\zeta-1$の最小多項式は$h(X)=\Phi_{p^{k+1}}(X+1)$で、次数は$p^k(p-1)$、$\mathfrak{q}$に関して Eisenstein 多項式である。実際、$p$は$\mathfrak{q}$で不分岐であり、$h$の最高次以外の係数は$p$で割り切れ、$h(0)=p$である。Eisenstein 多項式の根を添加した拡大は完全分岐なので、$\mathfrak{q}$の上の$K$の素イデアルは一つで、$e=p^k(p-1)$、$f=1$である。

    分岐指数と剰余次数は塔で乗法的なので、$e(\mathfrak{P}|p)=p^k(p-1)$、$f(\mathfrak{P}|p)=f_0$である。
  strategy: Split the extension into the unramified layer Q(ζ_m) and the totally ramified layer obtained from an Eisenstein polynomial.
  sketch:
  - 'setup: Let F be the m-th cyclotomic subfield.'
  - 'apply_theorem: Kummer–Dedekind shows p is unramified in F with residue degree the order of p mod m.'
  - 'derive: Φ_(p^(k+1))(X+1) is Eisenstein at primes of F above p, so K/F is totally ramified there.'
  - 'conclude: Multiply e and f along the tower.'
  openmath: (forall (p k m n K q) (-> (and (in p P) (in k N) (in n N) (in m N) (= n (* (^ p (+ k 1)) m)) (not (dvd p m)) (cyclotomic_over_rationals K n) (number_field K) (prime_ideal q (ring_of_integers K)) (lies_over q (principal_ideal p))) (and (= (ramification_index (principal_ideal p) q) (* (^ p k) (- p 1))) (= (inertia_degree (principal_ideal p) q) (multiplicative_order p m)))))
  hard_negative:
    statement: 同じ状況で、$\mathfrak{P}$の剰余次数は$\mathbb{Z}/n\mathbb{Z}$における$p$の位数である。
    reason: $p$は$p\mid n$なので$\mathbb{Z}/n\mathbb{Z}$の単元でなく、位数は定まらない。$m$を法とする位数が正しい。
  target: |
    ∀ (n m p k : ℕ) [Fact p.Prime] (K : Type*) [Field K] [NumberField K] [IsCyclotomicExtension {n} ℚ K] (P : Ideal (NumberField.RingOfIntegers K)) [P.IsPrime] [P.LiesOver (Ideal.span {(p : ℤ)})], n = p ^ (k + 1) * m → ¬ p ∣ m → P.ramificationIdx' ℤ = p ^ k * (p - 1) ∧ P.inertiaDeg' ℤ = orderOf (p : ZMod m)
  proof: |
    by
      intro n m p k _ K _ _ _ P _ _ hn hm
      exact ⟨IsCyclotomicExtension.Rat.ramificationIdx_eq n K P hn hm, IsCyclotomicExtension.Rat.inertiaDeg_eq n K P hn hm⟩
- id: prime_power_cyclotomic_total_ramification
  kind: gap
  level: 4
  topic: 代数的整数論・素数冪円分体の完全分岐
  statement: 素数$p$と$k\geq 0$について、$K$を$\mathbb{Q}$の$p^{k+1}$次円分拡大、$\zeta$を$1$の原始$p^{k+1}$乗根とする。$\mathcal{O}_K$のイデアルとして$(p)=(\zeta-1)^{[K:\mathbb{Q}]}$であり、$p$の上の素イデアルはただ一つである。
  statement_en: Let p be a prime, k ≥ 0, K the p^(k+1)-th cyclotomic extension of Q and ζ a primitive p^(k+1)-th root of unity. As ideals of O_K, (p) = (ζ - 1)^[K:Q], and there is exactly one prime above p.
  assumptions:
  - $p$は素数、$k\geq 0$
  - $K$は$\mathbb{Q}$の$p^{k+1}$次円分拡大
  - $\zeta\in K$は$1$の原始$p^{k+1}$乗根
  quantifiers:
  - 任意の$p,k,K,\zeta$
  conclusion: $(p)=(\zeta-1)^{[K:\mathbb{Q}]}$であり、$p$の上の素イデアルは一つである。
  answer: |
    $p$を素数、$k\geq 0$、$q=p^{k+1}$、$K$を$q$次円分拡大、$\zeta$を原始$q$乗根とし、$n=[K:\mathbb{Q}]=\varphi(q)$とする。

    $\Phi_q(X)=\prod_{(j,p)=1}(X-\zeta^j)$（$1\leq j<q$）であり、$\Phi_q(X)=(X^q-1)/(X^{q/p}-1)$より$\Phi_q(1)=p$である。よって$p=\prod_{(j,p)=1}(1-\zeta^j)$である。

    $j$が$p$と互いに素なら$(1-\zeta^j)/(1-\zeta)=1+\zeta+\dots+\zeta^{j-1}\in\mathcal{O}_K$である。$jj'\equiv 1\pmod q$をとると$\zeta=(\zeta^j)^{j'}$なので、逆数$(1-\zeta)/(1-\zeta^j)$も$\mathcal{O}_K$に属する。よって$(1-\zeta^j)$と$(1-\zeta)$は同じイデアルであり、$(p)=(\zeta-1)^n$である。

    $p$は単元でないので$(\zeta-1)$は単位イデアルでない。$(\zeta-1)=\prod_i\mathfrak{P}_i^{a_i}$と分解すると$(p)=\prod_i\mathfrak{P}_i^{na_i}$である。基本等式より$\sum_ina_if_i=n$なので、$\sum_ia_if_i=1$である。よって分解は素イデアル一つからなり、$a_1=f_1=1$である。したがって$(\zeta-1)$は素イデアルであり、$p$の上の素イデアルはこれだけである。
  strategy: Factor p as the product of 1 - ζ^j, show all factors are associates of 1 - ζ, and use the fundamental identity.
  sketch:
  - 'derive: Evaluating the cyclotomic polynomial at 1 gives p as a product of 1 - ζ^j.'
  - 'derive: Each 1 - ζ^j is an associate of 1 - ζ.'
  - 'translate: Hence (p) = (ζ - 1)^n with n = [K:Q].'
  - 'apply_theorem: The fundamental identity forces (ζ - 1) to be prime and unique above p.'
  openmath: (forall (p k K z) (-> (and (in p P) (in k N) (cyclotomic_over_rationals K (^ p (+ k 1))) (number_field K) (primitive_root_of_unity z (^ p (+ k 1)))) (and (= (principal_ideal p) (ideal_power (principal_ideal (- z 1)) (extension_degree K Q))) (= (size (primes_over (principal_ideal p) K)) 1))))
  hard_negative:
    statement: $K$が素数冪でない$n$次の円分体でも$(p)=(\zeta_n-1)^{[K:\mathbb{Q}]}$である。
    reason: $n$が素数冪でないとき$\zeta_n-1$は単元なので$(\zeta_n-1)$は単位イデアルであり、$(p)$と異なる。
  target: |
    ∀ (p k : ℕ) [Fact p.Prime] (K : Type*) [Field K] [NumberField K] [IsCyclotomicExtension {p ^ (k + 1)} ℚ K] (ζ : K) (hζ : IsPrimitiveRoot ζ (p ^ (k + 1))), Ideal.span {((p : ℕ) : NumberField.RingOfIntegers K)} = Ideal.span {hζ.toInteger - 1} ^ Module.finrank ℚ K ∧ ((Ideal.span {(p : ℤ)}).primesOver (NumberField.RingOfIntegers K)).ncard = 1
  proof: |
    by
      intro p k _ K _ _ _ ζ hζ
      refine ⟨?_, IsCyclotomicExtension.Rat.ncard_primesOver_of_prime_pow p k K⟩
      have := IsCyclotomicExtension.Rat.map_eq_span_zeta_sub_one_pow p k hζ
      simpa [Ideal.map_span] using this
- id: cyclotomic_prime_discriminant
  kind: textbook
  level: 4
  topic: 代数的整数論・素数次円分体の判別式
  statement: 奇素数$p$について、$K$を$\mathbb{Q}$の$p$次円分拡大、$\zeta$を$1$の原始$p$乗根とする。$K$の基底$(\zeta-1)^i$（$0\leq i\leq p-2$）の判別式は$(-1)^{(p-1)/2}p^{p-2}$である。
  statement_en: For an odd prime p, let K be the p-th cyclotomic extension of Q and ζ a primitive p-th root of unity. The basis (ζ-1)^i, 0 ≤ i ≤ p-2, of K has discriminant (-1)^((p-1)/2) p^(p-2).
  assumptions:
  - $p$は奇素数
  - $K$は$\mathbb{Q}$の$p$次円分拡大
  - $\zeta\in K$は$1$の原始$p$乗根
  quantifiers:
  - 任意の$p,K,\zeta$
  conclusion: 基底$(\zeta-1)^i$の判別式は$(-1)^{(p-1)/2}p^{p-2}$である。
  answer: |
    $p$を奇素数、$K$を$p$次円分拡大、$\zeta$を原始$p$乗根とする。$n=p-1=[K:\mathbb{Q}]$である。

    $(\zeta-1)^i$は$\zeta^i$と低次の項の整数結合であり、基底$\zeta^i$から基底$(\zeta-1)^i$への変換行列は対角成分が$1$の三角行列である。その行列式は$1$なので、両者の判別式は等しい。

    基底$\zeta^i$の判別式は$(-1)^{n(n-1)/2}N_{K/\mathbb{Q}}(\Phi_p'(\zeta))$である。$(X-1)\Phi_p(X)=X^p-1$を微分して$X=\zeta$を代入すると$(\zeta-1)\Phi_p'(\zeta)=p\zeta^{p-1}$である。

    ノルムをとる。$N(\zeta-1)=\prod_j(\zeta^j-1)=(-1)^n\Phi_p(1)=p$である（$n$は偶数）。$\zeta$の共役の積は$\Phi_p(0)=1$なので$N(\zeta)=1$である。$N(p)=p^{p-1}$である。よって$N(\Phi_p'(\zeta))=p^{p-1}/p=p^{p-2}$である。

    符号は$n(n-1)/2=(p-1)(p-2)/2$で定まる。$p-2$は奇数なので、これは$(p-1)/2$と偶奇が同じである。以上から判別式は$(-1)^{(p-1)/2}p^{p-2}$である。
  strategy: Reduce to the basis of powers of ζ and compute the norm of Φ_p'(ζ) by differentiating (X-1)Φ_p(X) = X^p - 1.
  sketch:
  - 'derive: The change of basis to powers of ζ - 1 has determinant 1.'
  - 'apply_theorem: The discriminant of a power basis is ± the norm of Φ_p''(ζ).'
  - 'derive: Differentiation gives (ζ-1)Φ_p''(ζ) = pζ^(p-1).'
  - 'conclude: Compute the norms and determine the sign.'
  openmath: (forall (p K z) (-> (and (in p P) (!= p 2) (cyclotomic_over_rationals K p) (primitive_root_of_unity z p)) (= (family_discriminant Q (power_family (- z 1) (- p 1))) (* (^ (neg 1) (/ (- p 1) 2)) (^ p (- p 2))))))
  hard_negative:
    statement: 同じ状況で判別式は$(-1)^{(p-1)/2}p^{p-1}$である。
    reason: $p=3$では$K=\mathbb{Q}(\sqrt{-3})$で判別式は$-3$だが、この式は$-9$である。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (K : Type*) [Field K] [CharZero K] [IsCyclotomicExtension {p} ℚ K] (ζ : K) (hζ : IsPrimitiveRoot ζ p), p ≠ 2 → Algebra.discr ℚ (IsPrimitiveRoot.subOnePowerBasis ℚ hζ).basis = (-1) ^ ((p - 1) / 2) * (p : ℚ) ^ (p - 2)
  proof: |
    by
      intro p _ K _ _ _ ζ hζ h
      exact IsCyclotomicExtension.Rat.discr_odd_prime' hζ h
- id: zeta_sub_one_unit_non_prime_power
  kind: gap
  level: 4
  topic: 代数的整数論・円分単数
  statement: $n>2$が素数冪でないとき、$K$を$\mathbb{Q}$の$n$次円分拡大、$\zeta$を$1$の原始$n$乗根とすると、$\zeta-1$は$\mathcal{O}_K$の単元である。
  statement_en: If n > 2 is not a prime power, K is the n-th cyclotomic extension of Q and ζ a primitive n-th root of unity, then ζ - 1 is a unit of the ring of integers.
  assumptions:
  - $n>2$は素数冪でない
  - $K$は$\mathbb{Q}$の$n$次円分拡大
  - $\zeta\in K$は$1$の原始$n$乗根
  quantifiers:
  - 任意の$n,K,\zeta$
  conclusion: $\zeta-1$は$\mathcal{O}_K$の単元である。
  answer: |
    $n>2$を素数冪でない整数、$K$を$n$次円分拡大、$\zeta$を原始$n$乗根とする。

    $X^n-1=\prod_{d\mid n}\Phi_d(X)$を$X-1$で割って$X=1$を代入すると、$n=\prod_{d\mid n,\,d>1}\Phi_d(1)$である。素数冪$d=q^j$について$\Phi_d(1)=q$である。$n=\prod_iq_i^{a_i}$と分解すると、$d$が素数冪である因子の積は$\prod_iq_i^{a_i}=n$である。よって残りの$d$（素数冪でない$d>1$）について$\prod_d\Phi_d(1)=1$である。$\Phi_d(1)$は整数なので、各$\Phi_d(1)=\pm 1$であり、特に$\Phi_n(1)=\pm 1$である。

    一方$\Phi_n(1)=\prod_{(j,n)=1}(1-\zeta^j)$であり、$j=1$の因子$1-\zeta$は$\mathcal{O}_K$で$\pm 1$を割り切る。よって$\zeta-1$は単元である。
  strategy: Show Φ_n(1) = ±1 by comparing the product of Φ_d(1) with n, then read 1 - ζ as a divisor of it.
  sketch:
  - 'derive: The product of Φ_d(1) over divisors d > 1 of n equals n.'
  - 'derive: Prime power divisors already contribute n, so the others have product 1.'
  - 'derive: Hence Φ_n(1) = ±1.'
  - 'conclude: 1 - ζ divides Φ_n(1) in the ring of integers.'
  openmath: (forall (n K z) (-> (and (in n N) (> n 2) (not (exists (p k) (and (in p P) (in k N) (= n (^ p k))))) (cyclotomic_over_rationals K n) (number_field K) (primitive_root_of_unity z n)) (unit_element (- z 1) (ring_of_integers K))))
  hard_negative:
    statement: すべての$n>2$で$\zeta_n-1$は単元である。
    reason: $n=3$では$N(\zeta_3-1)=3$なので単元でない。素数冪の場合は除く必要がある。
  target: |
    ∀ (n : ℕ) [NeZero n] (K : Type*) [Field K] [NumberField K] [IsCyclotomicExtension {n} ℚ K] (ζ : K) (hζ : IsPrimitiveRoot ζ n), 2 < n → (∀ (p k : ℕ), p.Prime → p ^ k ≠ n) → IsUnit (hζ.toInteger - 1)
  proof: |
    by
      intro n _ K _ _ _ ζ hζ h2 h
      have h1 : Algebra.norm ℤ (hζ.toInteger - 1) = 1 := hζ.norm_toInteger_sub_one_eq_one h2 (fun {p} hp k => h p k hp)
      have h3 := Algebra.coe_norm_int (K := K) (hζ.toInteger - 1)
      rw [h1] at h3
      rw [NumberField.isUnit_iff_norm]
      simp only [map_sub, map_one] at h3 ⊢
      simp at h3 ⊢
      rw [← h3]; simp
- id: cyclotomic_three_five_pid
  kind: textbook
  level: 4
  topic: 代数的整数論・円分体の類数
  statement: $\mathbb{Q}$の$3$次円分拡大の整数環と$5$次円分拡大の整数環は、ともに単項イデアル整域である。
  statement_en: The rings of integers of the 3rd and 5th cyclotomic extensions of Q are principal ideal domains.
  assumptions:
  - $K$は$\mathbb{Q}$の$3$次円分拡大
  - $L$は$\mathbb{Q}$の$5$次円分拡大
  quantifiers:
  - 任意の$K,L$
  conclusion: $\mathcal{O}_K$と$\mathcal{O}_L$は単項イデアル整域である。
  answer: |
    $K,L$をそれぞれ$\mathbb{Q}$の$3$次、$5$次円分拡大とする。次数$n$、複素素点の個数$r_2$、判別式$d$の数体では、任意のイデアル類が$N(I)\leq M=(4/\pi)^{r_2}\dfrac{n!}{n^n}\sqrt{|d|}$を満たす$0$でないイデアル$I$を含む。$M<2$なら各類が$N(I)=1$、すなわち$I=\mathcal{O}$を含むので、類群は自明で単項イデアル整域である。

    $K$は$n=2$、$r_2=1$、$|d|=3$なので、$M=(4/\pi)(1/2)\sqrt3=2\sqrt3/\pi<2$である。

    $L$は$n=4$、$r_2=2$、$|d|=5^3=125$である。$M=(4/\pi)^2(24/256)\sqrt{125}=(16/\pi^2)(3/32)\sqrt{125}=\dfrac{3\sqrt{125}}{2\pi^2}$であり、$\sqrt{125}<12$、$\pi^2>9$より$M<\dfrac{36}{18}=2$である。

    いずれも$M<2$なので、主張を得る。
  strategy: The Minkowski bound is below 2, so every ideal class contains the unit ideal.
  sketch:
  - 'apply_theorem: Every class contains an ideal of norm at most the Minkowski bound M.'
  - 'derive: If M < 2 the class group is trivial.'
  - 'derive: Compute M for the two fields from n, r_2 and the discriminant.'
  - 'conclude: Both values are below 2.'
  openmath: (forall (K L) (-> (and (number_field K) (number_field L) (cyclotomic_over_rationals K 3) (cyclotomic_over_rationals L 5)) (and (principal_ideal_domain (ring_of_integers K)) (principal_ideal_domain (ring_of_integers L)))))
  hard_negative:
    statement: すべての素数$p$について、$p$次円分体の整数環は単項イデアル整域である。
    reason: $p=23$では類数が$3$であることが知られており、単項イデアル整域でない。
  target: |
    ∀ (K L : Type*) [Field K] [NumberField K] [Field L] [NumberField L] [IsCyclotomicExtension {3} ℚ K] [IsCyclotomicExtension {5} ℚ L], IsPrincipalIdealRing (NumberField.RingOfIntegers K) ∧ IsPrincipalIdealRing (NumberField.RingOfIntegers L)
  proof: |
    by
      intro K L _ _ _ _ _ _
      exact ⟨IsCyclotomicExtension.Rat.three_pid K, IsCyclotomicExtension.Rat.five_pid L⟩
- id: third_cyclotomic_units
  kind: gap
  level: 3
  topic: 代数的整数論・Eisenstein 整数の単数
  statement: $K$を$\mathbb{Q}$の$3$次円分拡大、$\zeta$を$1$の原始$3$乗根とする。$\mathcal{O}_K$の単元は$\pm\zeta^j$（$j=0,1,2$）の形である。
  statement_en: If K is the 3rd cyclotomic extension of Q and ζ a primitive cube root of unity, then every unit of the ring of integers has the form ±ζ^j with j in {0, 1, 2}.
  assumptions:
  - $K$は$\mathbb{Q}$の$3$次円分拡大
  - $\zeta\in K$は$1$の原始$3$乗根
  - $u$は$\mathcal{O}_K$の単元
  quantifiers:
  - 任意の$K,\zeta,u$
  - ある符号$\varepsilon=\pm 1$と$j\in\{0,1,2\}$
  conclusion: $u=\varepsilon\zeta^j$である。
  answer: |
    $K$を$3$次円分拡大、$\zeta$を原始$3$乗根、$u$を$\mathcal{O}_K$の単元とする。$K=\mathbb{Q}(\sqrt{-3})$で$-3\equiv 1\pmod 4$なので、$\mathcal{O}_K=\mathbb{Z}[\zeta]$であり、$u=a+b\zeta$（$a,b\in\mathbb{Z}$）と書ける。$\zeta^2+\zeta+1=0$と共役$\bar\zeta=\zeta^2$から、$N_{K/\mathbb{Q}}(u)=(a+b\zeta)(a+b\zeta^2)=a^2-ab+b^2$である。

    $u$は単元なのでノルムは$\pm 1$であり、$a^2-ab+b^2\geq 0$より$a^2-ab+b^2=1$である。$4$倍すると$(2a-b)^2+3b^2=4$である。よって$b\in\{0,\pm 1\}$である。$b=0$なら$a=\pm 1$である。$b=\pm 1$なら$2a-b=\pm 1$である。解は$(a,b)=\pm(1,0),\pm(0,1),\pm(1,1)$の六つである。

    これらは$u=\pm 1$、$\pm\zeta$、$\pm(1+\zeta)=\mp\zeta^2$なので、$u=\pm\zeta^j$の形である。
  strategy: Solve the norm equation a² - ab + b² = 1 in integers.
  sketch:
  - 'setup: Write a unit as a + bζ using that Z[ζ] is the ring of integers.'
  - 'translate: The norm form gives a² - ab + b² = 1.'
  - 'case_split: Completing the square leaves six integer solutions.'
  - 'conclude: Identify them with ±ζ^j.'
  openmath: (forall (K z u) (-> (and (number_field K) (cyclotomic_over_rationals K 3) (primitive_root_of_unity z 3) (unit_element u (ring_of_integers K))) (exists (t j) (and (or (= t 1) (= t (neg 1))) (in j N) (< j 3) (= u (* t (^ z j)))))))
  hard_negative:
    statement: 同じ状況で$\mathcal{O}_K$の単元は$\pm 1$だけである。
    reason: $\zeta$自身が$\zeta\cdot\zeta^2=1$より単元であり、$\pm 1$でない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] [IsCyclotomicExtension {3} ℚ K] (ζ : K) (hζ : IsPrimitiveRoot ζ 3) (u : (NumberField.RingOfIntegers K)ˣ), ∃ (ε : ℤ) (j : ℕ), (ε = 1 ∨ ε = -1) ∧ j < 3 ∧ (u : NumberField.RingOfIntegers K) = (ε : NumberField.RingOfIntegers K) * hζ.toInteger ^ j
  proof: |
    by
      intro K _ _ _ ζ hζ u
      have h := IsCyclotomicExtension.Rat.Three.Units.mem hζ u
      simp only [List.mem_cons, List.not_mem_nil, or_false] at h
      rcases h with h | h | h | h | h | h
      · exact ⟨1, 0, by simp, by simp, by simp [h]⟩
      · exact ⟨-1, 0, by simp, by simp, by simp [h]⟩
      · exact ⟨1, 1, by simp, by simp, by simp [h]⟩
      · exact ⟨-1, 1, by simp, by simp, by simp [h]⟩
      · exact ⟨1, 2, by simp, by simp, by simp [h]⟩
      · exact ⟨-1, 2, by simp, by simp, by simp [h]⟩
- id: minkowski_convex_body_theorem
  kind: named
  level: 4
  topic: 代数的整数論・Minkowski の凸体定理
  statement: Minkowski の凸体定理。$E$を有限次元実ノルム空間、$\mu$を加法的 Haar 測度、$L$を可算な部分群、$F$を$L$の基本領域とする。$s\subset E$が原点対称な凸集合で、$\mu(F)2^{\dim E}<\mu(s)$なら、$s$は$L$の$0$でない元を含む。
  statement_en: Minkowski's convex body theorem. Let E be a finite-dimensional real normed space, μ an additive Haar measure, L a countable subgroup and F a fundamental domain of L. If s is a symmetric convex set with μ(F) 2^dim(E) < μ(s), then s contains a nonzero element of L.
  assumptions:
  - $E$は有限次元実ノルム空間で$\mu$は加法的 Haar 測度
  - $L$は$E$の可算な部分群で$F$はその基本領域
  - $s$は原点対称な凸集合
  - $\mu(F)2^{\dim E}<\mu(s)$
  quantifiers:
  - 任意の$E,\mu,L,F,s$
  - ある$x\in L$
  conclusion: $x\neq 0$かつ$x\in s$である。
  answer: |
    $E$を有限次元実ノルム空間、$n=\dim E$、$\mu$を加法的 Haar 測度、$L$を可算な部分群、$F$をその基本領域、$s$を原点対称な凸集合とし、$\mu(F)2^n<\mu(s)$と仮定する。凸集合の境界は$\mu$測度$0$なので、$s$は$\mu$に関して可測として扱える。$t=\tfrac12s$とおくと$\mu(t)=2^{-n}\mu(s)>\mu(F)$である。

    $E$は$F+l$（$l\in L$）のほぼ互いに素な和なので、$\mu(t)=\sum_{l\in L}\mu(t\cap(F+l))=\sum_{l\in L}\mu((t-l)\cap F)$である。この和は$\mu(F)$より大きいので、集合$(t-l)\cap F$は互いに素ではありえない。よって相異なる$l,l'\in L$と$x,y\in t$で$x-l=y-l'$となるものがある。

    $w=l'-l=y-x\in L$は$0$でない。$2x,2y\in s$であり、$s$の対称性から$-2x\in s$である。凸性より$w=\tfrac12(2y)+\tfrac12(-2x)\in s$である。
  strategy: Blichfeldt's pigeonhole argument applied to s/2 produces two points differing by a lattice element, and convexity places it in s.
  sketch:
  - 'setup: Let t = s/2, whose measure exceeds that of F.'
  - 'derive: The translates of t by L cannot be disjoint inside F.'
  - 'construct: So x - l = y - l'' for distinct lattice points, giving w = y - x in L.'
  - 'conclude: Symmetry and convexity place w in s.'
  openmath: (forall (E m L F s) (-> (and (additive_haar_measure m E) (lattice_fundamental_domain F L m) (forall (x) (-> (in x s) (in (neg x) s))) (convex_set s) (< (* (measure_of m F) (^ 2 (vector_finrank E))) (measure_of m s))) (exists (x) (and (in x L) (!= x 0) (in x s)))))
  hard_negative:
    statement: 同じ状況で、$s$が原点対称でなくても結論が成り立つ。
    reason: $E=\mathbb{R}^2$、$L=\mathbb{Z}^2$、$F=[0,1)^2$、$s=(1/10,\,9/10)\times\mathbb{R}$とすると、$s$は凸で測度は無限大だが、$\mathbb{Z}^2$の点を含まない。
  target: |
    ∀ (E : Type*) [MeasurableSpace E] [NormedAddCommGroup E] [NormedSpace ℝ E] [BorelSpace E] [FiniteDimensional ℝ E] (μ : MeasureTheory.Measure E) [μ.IsAddHaarMeasure] (L : AddSubgroup E) [Countable L] (F s : Set E), MeasureTheory.IsAddFundamentalDomain L F μ → (∀ x ∈ s, -x ∈ s) → Convex ℝ s → μ F * 2 ^ Module.finrank ℝ E < μ s → ∃ x : L, x ≠ 0 ∧ (x : E) ∈ s
  proof: |
    by
      intro E _ _ _ _ _ μ _ L _ F s hF hs hc h
      exact MeasureTheory.exists_ne_zero_mem_lattice_of_measure_mul_two_pow_lt_measure hF hs hc h
- id: ideal_contains_small_norm_element
  kind: textbook
  level: 4
  topic: 代数的整数論・Minkowski の評価
  statement: 次数$n$、複素素点の個数$r_2$の数体$K$と$\mathcal{O}_K$の$0$でないイデアル$I$について、$I$の$0$でない元$a$で$|N_{K/\mathbb{Q}}(a)|\leq N(I)(4/\pi)^{r_2}\dfrac{n!}{n^n}\sqrt{|d_K|}$を満たすものが存在する。
  statement_en: For a number field K of degree n with r_2 complex places and a nonzero ideal I of its ring of integers, there is a nonzero a in I with |N(a)| ≤ N(I) (4/π)^(r_2) n!/n^n sqrt(|d_K|).
  assumptions:
  - $K$は数体で$n=[K:\mathbb{Q}]$、$r_2$は複素素点の個数
  - $I$は$\mathcal{O}_K$の$0$でないイデアル
  quantifiers:
  - 任意の$K,I$
  - ある$a\in I$
  conclusion: $a\neq 0$かつ$|N_{K/\mathbb{Q}}(a)|\leq N(I)(4/\pi)^{r_2}\dfrac{n!}{n^n}\sqrt{|d_K|}$である。
  answer: |
    $K$を次数$n$、実素点の個数$r_1$、複素素点の個数$r_2$の数体、$I$を$\mathcal{O}_K$の$0$でないイデアルとする。実埋め込みと複素埋め込みの代表を並べて$K\to E=\mathbb{R}^{r_1}\times\mathbb{C}^{r_2}$を作る。$\mathcal{O}_K$の$\mathbb{Z}$基底$b_i$と埋め込み$\sigma_j$について$|\det(\sigma_j(b_i))|=\sqrt{|d_K|}$である。複素座標を実部と虚部に直すと行列式の絶対値は$2^{-r_2}$倍になるので、$\mathcal{O}_K$の像は基本領域の体積が$2^{-r_2}\sqrt{|d_K|}$の格子である。$I$は指数$N(I)$の部分格子なので、基本領域の体積は$V=2^{-r_2}\sqrt{|d_K|}N(I)$である。

    $t>0$について$S_t=\{(x_v):\sum_{v\text{ 実}}|x_v|+2\sum_{v\text{ 複素}}|x_v|\leq t\}$とおく。$S_t$はコンパクトで凸、原点対称である。体積は$2^{r_1}(\pi/2)^{r_2}t^n/n!$である。これは座標を一つずつ積分する帰納法で確かめられる。体積が$ct^m/m!$の形なら、実座標を一つ足すと$2\int_0^tc(t-x)^m/m!\,dx=2ct^{m+1}/(m+1)!$である。複素座標を一つ足すと、$u=2\rho$とおいて$2\pi\int_0^{t/2}c(t-2\rho)^m/m!\,\rho\,d\rho=\tfrac{\pi c}{2}\int_0^t(t-u)^mu\,du/m!=\tfrac{\pi}{2}ct^{m+2}/(m+2)!$である。$t_0$を$\mu(S_{t_0})=2^nV$で定め、$t>t_0$なら$\mu(S_t)>2^nV$なので、凸体定理より$S_t$は$I$の$0$でない像を含む。$t\downarrow t_0$とする。格子とコンパクト集合の交わりは有限なので、ある$0$でない$a\in I$がすべての$t>t_0$の$S_t$に属し、$a$の像は$S_{t_0}$に属する。

    相加相乗平均より、$|N_{K/\mathbb{Q}}(a)|=\prod_{v\text{ 実}}|x_v|\prod_{v\text{ 複素}}|x_v|^2\leq(t_0/n)^n$である。$t_0^n=2^nVn!/(2^{r_1}(\pi/2)^{r_2})$と$r_1+2r_2=n$から$t_0^n=(4/\pi)^{r_2}n!\sqrt{|d_K|}N(I)$である。よって主張の評価を得る。
  strategy: Apply the convex body theorem to the sum-norm ball in the Minkowski space and use the AM-GM inequality.
  sketch:
  - 'setup: Embed I as a lattice with covolume 2^(-r_2) sqrt|d_K| N(I).'
  - 'construct: Use the convex symmetric sets S_t with known volume.'
  - 'apply_theorem: The convex body theorem and a compactness limit give a nonzero point in S_(t_0).'
  - 'conclude: AM-GM bounds the norm by (t_0/n)^n.'
  openmath: (forall (K I) (-> (and (number_field K) (ideal_of I (ring_of_integers K)) (!= I 0)) (exists (a) (and (in a I) (!= a 0) (<= (abs (relative_norm Q K a)) (* (ideal_norm I) (minkowski_constant K)))))))
  hard_negative:
    statement: 同じ状況で$I$の$0$でない元$a$を$|N_{K/\mathbb{Q}}(a)|=N(I)$となるようにとれる。
    reason: $I$が単項でないときは成り立たない。実際$|N(a)|=N(I)$なら$(a)\subset I$の指数が一致して$I=(a)$となる。$\mathbb{Z}[\sqrt{-5}]$の$(2,1+\sqrt{-5})$が反例である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (I : Ideal (NumberField.RingOfIntegers K)), I ≠ ⊥ → ∃ a ∈ I, a ≠ 0 ∧ (|Algebra.norm ℤ a| : ℝ) ≤ (Ideal.absNorm I : ℝ) * (4 / Real.pi) ^ NumberField.InfinitePlace.nrComplexPlaces K * ((Module.finrank ℚ K).factorial : ℝ) / (Module.finrank ℚ K : ℝ) ^ Module.finrank ℚ K * Real.sqrt |(NumberField.discr K : ℝ)|
  proof: |
    by
      intro K _ _ I hI
      have hI' : (I : FractionalIdeal (nonZeroDivisors (NumberField.RingOfIntegers K)) K) ≠ 0 := by
        simpa using hI
      obtain ⟨a, ha, ha0, hle⟩ := NumberField.exists_ne_zero_mem_ideal_of_norm_le_mul_sqrt_discr K (Units.mk0 _ hI')
      obtain ⟨x, hx, rfl⟩ := (FractionalIdeal.mem_coeIdeal _).1 ha
      refine ⟨x, hx, by simpa using ha0, ?_⟩
      rw [Units.val_mk0, FractionalIdeal.coeIdeal_absNorm] at hle
      have h3 := Algebra.coe_norm_int (K := K) x
      rw [← h3] at hle
      simpa using hle
- id: ideal_class_minkowski_bound
  kind: textbook
  level: 4
  topic: 代数的整数論・類群の評価
  statement: 次数$n$、複素素点の個数$r_2$の数体$K$の任意のイデアル類は、$N(I)\leq(4/\pi)^{r_2}\dfrac{n!}{n^n}\sqrt{|d_K|}$を満たす$\mathcal{O}_K$の$0$でないイデアル$I$を含む。
  statement_en: Every ideal class of a number field K of degree n with r_2 complex places contains a nonzero ideal I of the ring of integers with N(I) ≤ (4/π)^(r_2) n!/n^n sqrt(|d_K|).
  assumptions:
  - $K$は数体で$n=[K:\mathbb{Q}]$、$r_2$は複素素点の個数
  - $C$は$K$のイデアル類
  quantifiers:
  - 任意の$K,C$
  - ある$0$でないイデアル$I$
  conclusion: $I\in C$かつ$N(I)\leq(4/\pi)^{r_2}\dfrac{n!}{n^n}\sqrt{|d_K|}$である。
  answer: |
    $K$を数体、$C$をイデアル類とし、$M=(4/\pi)^{r_2}\dfrac{n!}{n^n}\sqrt{|d_K|}$とおく。類群は群なので、逆の類$C^{-1}$に属する$\mathcal{O}_K$の$0$でないイデアル$J$がとれる。Minkowski の評価より、$0$でない$a\in J$で$|N_{K/\mathbb{Q}}(a)|\leq N(J)M$を満たすものがある。

    $a\in J$なので$(a)=JI$となる$\mathcal{O}_K$のイデアル$I$がある。$JI$は単項なので、$I$の類は$J$の類の逆、すなわち$C$である。ノルムの乗法性より$N(J)N(I)=|N_{K/\mathbb{Q}}(a)|\leq N(J)M$であり、$N(I)\leq M$である。
  strategy: Apply the Minkowski estimate to an ideal in the inverse class and divide.
  sketch:
  - 'construct: Pick an ideal J in the inverse class.'
  - 'apply_theorem: Find a nonzero a in J with |N(a)| ≤ N(J) M.'
  - 'derive: Write (a) = J I, so I lies in the class C.'
  - 'conclude: Multiplicativity of the norm gives N(I) ≤ M.'
  openmath: (forall (K c) (-> (and (number_field K) (in c (class_group (ring_of_integers K)))) (exists (I) (and (ideal_of I (ring_of_integers K)) (!= I 0) (= (ideal_class I) c) (<= (ideal_norm I) (minkowski_constant K))))))
  hard_negative:
    statement: 同じ状況で、各類の任意のイデアルが$N(I)\leq M$を満たす。
    reason: 単項イデアル$(m)\subset\mathbb{Z}$は$m$が大きいとノルムが大きいが、自明な類に属する。評価は各類の代表を一つとれることを主張する。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (C : ClassGroup (NumberField.RingOfIntegers K)), ∃ I : nonZeroDivisors (Ideal (NumberField.RingOfIntegers K)), ClassGroup.mk0 I = C ∧ (Ideal.absNorm (I : Ideal (NumberField.RingOfIntegers K)) : ℝ) ≤ (4 / Real.pi) ^ NumberField.InfinitePlace.nrComplexPlaces K * (((Module.finrank ℚ K).factorial : ℝ) / (Module.finrank ℚ K : ℝ) ^ Module.finrank ℚ K * Real.sqrt |(NumberField.discr K : ℝ)|)
  proof: |
    by
      intro K _ _ C
      simpa using NumberField.exists_ideal_in_class_of_norm_le C
- id: class_group_equal_iff_scalar_multiples
  kind: gap
  level: 4
  topic: 代数的整数論・イデアル類の相等
  statement: 数体$K$の整数環の$0$でないイデアル$I,J$が同じイデアル類に属するための必要十分条件は、$0$でない$x,y\in\mathcal{O}_K$で$(x)I=(y)J$となるものが存在することである。
  statement_en: Nonzero ideals I, J of the ring of integers of a number field lie in the same class if and only if (x)I = (y)J for some nonzero integers x, y of the field.
  assumptions:
  - $K$は数体
  - $I,J$は$\mathcal{O}_K$の$0$でないイデアル
  quantifiers:
  - 任意の$K,I,J$
  conclusion: $I,J$の類が等しいことと、$0$でない$x,y$で$(x)I=(y)J$となることは同値である。
  answer: |
    $K$を数体、$I,J$を$\mathcal{O}_K$の$0$でないイデアルとする。類群は$0$でない分数イデアルの群を単項分数イデアルで割った群である。

    $I,J$の類が等しいとする。$I=cJ$となる$c\in K^\times$がある。$c=y/x$（$x,y\in\mathcal{O}_K$は$0$でない）と書くと、$xI=yJ$、すなわち$(x)I=(y)J$である。

    逆に$(x)I=(y)J$なら、$I=(y/x)J$である。よって$I$と$J$は単項分数イデアル$(y/x)$の違いしかなく、同じ類に属する。
  strategy: Translate the equality of classes into a scalar factor in K and clear its denominator.
  sketch:
  - 'translate: Equal classes mean I = cJ for some nonzero c in K.'
  - 'derive: Writing c = y/x gives (x)I = (y)J.'
  - 'conclude: The converse divides by x.'
  openmath: (forall (K I J) (-> (and (number_field K) (ideal_of I (ring_of_integers K)) (!= I 0) (ideal_of J (ring_of_integers K)) (!= J 0)) (<-> (= (ideal_class I) (ideal_class J)) (exists (x y) (and (in x (ring_of_integers K)) (in y (ring_of_integers K)) (!= x 0) (!= y 0) (= (ideal_mul (principal_ideal x) I) (ideal_mul (principal_ideal y) J)))))))
  hard_negative:
    statement: $I,J$が同じ類に属するなら、$0$でない$x\in\mathcal{O}_K$で$(x)I=J$となる。
    reason: $\mathbb{Z}$で$I=(2)$、$J=(3)$は同じ類だが、$(x)(2)=(3)$となる整数$x$はない。両辺に単項イデアルを掛ける必要がある。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (I J : nonZeroDivisors (Ideal (NumberField.RingOfIntegers K))), ClassGroup.mk0 I = ClassGroup.mk0 J ↔ ∃ x y : NumberField.RingOfIntegers K, x ≠ 0 ∧ y ≠ 0 ∧ Ideal.span {x} * (I : Ideal (NumberField.RingOfIntegers K)) = Ideal.span {y} * J
  proof: |
    by
      intro K _ _ I J
      rw [ClassGroup.mk0_eq_mk0_iff]
      constructor
      · rintro ⟨x, y, hx, hy, h⟩; exact ⟨x, y, hx, hy, h⟩
      · rintro ⟨x, y, hx, hy, h⟩; exact ⟨x, y, hx, hy, h⟩
- id: ideal_pow_class_number_principal
  kind: gap
  level: 4
  topic: 代数的整数論・類数と単項イデアル
  statement: 数体$K$の類数を$h$とすると、$\mathcal{O}_K$の$0$でないイデアル$I$について$I^h$は単項イデアルである。
  statement_en: If h is the class number of a number field K, then I^h is principal for every nonzero ideal I of the ring of integers.
  assumptions:
  - $K$は数体で類数は$h$
  - $I$は$\mathcal{O}_K$の$0$でないイデアル
  quantifiers:
  - 任意の$K,I$
  conclusion: $I^h$は単項イデアルである。
  answer: |
    $K$を数体、$h$をその類数、$I$を$\mathcal{O}_K$の$0$でないイデアルとする。類群は位数$h$の有限群なので、$I$の類$[I]$は$[I]^h=1$を満たす。$[I]^h=[I^h]$なので、$I^h$の類は自明である。$0$でないイデアルの類が自明であることは単項イデアルであることと同値なので、$I^h$は単項である。
  strategy: Apply Lagrange's theorem in the class group.
  sketch:
  - 'apply_theorem: In a finite group of order h, every element has h-th power 1.'
  - 'derive: The class of I^h is the h-th power of the class of I.'
  - 'conclude: A trivial class means a principal ideal.'
  openmath: (forall (K I) (-> (and (number_field K) (ideal_of I (ring_of_integers K)) (!= I 0)) (ideal_is_principal (ideal_power I (class_number K)))))
  hard_negative:
    statement: $I^m$が単項なら$m$は類数$h$で割り切れる。
    reason: $I$が単項なら$m=1$でも$I^m$は単項だが、$h>1$なら$h\nmid 1$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (I : Ideal (NumberField.RingOfIntegers K)), I ≠ ⊥ → Submodule.IsPrincipal (I ^ NumberField.classNumber K)
  proof: |
    by
      intro K _ _ I hI
      have hI' : I ∈ nonZeroDivisors (Ideal (NumberField.RingOfIntegers K)) := mem_nonZeroDivisors_of_ne_zero hI
      have hp : I ^ NumberField.classNumber K ∈ nonZeroDivisors (Ideal (NumberField.RingOfIntegers K)) := pow_mem hI' _
      rw [← ClassGroup.mk0_eq_one_iff hp]
      have : (⟨I ^ NumberField.classNumber K, hp⟩ : nonZeroDivisors (Ideal (NumberField.RingOfIntegers K))) = ⟨I, hI'⟩ ^ NumberField.classNumber K := rfl
      rw [this, map_pow, NumberField.classNumber, pow_card_eq_one]
- id: ideal_principal_of_coprime_power
  kind: gap
  level: 4
  topic: 代数的整数論・類数と互いに素な冪
  statement: 数体$K$の類数を$h$とする。$\mathcal{O}_K$の$0$でないイデアル$I$と$h$と互いに素な自然数$m$について、$I^m$が単項なら$I$も単項である。
  statement_en: Let h be the class number of a number field K. If I is a nonzero ideal of the ring of integers, m is coprime to h and I^m is principal, then I is principal.
  assumptions:
  - $K$は数体で類数は$h$
  - $I$は$\mathcal{O}_K$の$0$でないイデアル
  - $m$は$h$と互いに素な自然数
  - $I^m$は単項イデアル
  quantifiers:
  - 任意の$K,I,m$
  conclusion: $I$は単項イデアルである。
  answer: |
    $K$を数体、$h$をその類数、$I$を$\mathcal{O}_K$の$0$でないイデアル、$m$を$h$と互いに素な自然数とし、$I^m$は単項とする。$I$の類を$c$とすると、$c^m=[I^m]=1$である。また$c^h=1$である。$c$の位数は$m$と$h$の公約数なので$1$である。よって$c=1$であり、$I$は単項である。
  strategy: The order of the class of I divides both m and h, hence equals 1.
  sketch:
  - 'derive: The class of I has m-th power 1 and h-th power 1.'
  - 'derive: Its order divides gcd(m, h) = 1.'
  - 'conclude: The class is trivial, so I is principal.'
  openmath: (forall (K I m) (-> (and (number_field K) (ideal_of I (ring_of_integers K)) (!= I 0) (in m N) (= (gcd m (class_number K)) 1) (ideal_is_principal (ideal_power I m))) (ideal_is_principal I)))
  hard_negative:
    statement: $m$と$h$が互いに素でなくても、$I^m$が単項なら$I$は単項である。
    reason: $\mathbb{Z}[\sqrt{-5}]$では類数$h=2$で、$I=(2,1+\sqrt{-5})$は単項でないが、$I^2=(2)$は単項である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (I : Ideal (NumberField.RingOfIntegers K)) (m : ℕ), I ≠ ⊥ → Nat.Coprime m (NumberField.classNumber K) → Submodule.IsPrincipal (I ^ m) → Submodule.IsPrincipal I
  proof: |
    by
      intro K _ _ I m hI hm h
      have hI' : I ∈ nonZeroDivisors (Ideal (NumberField.RingOfIntegers K)) := mem_nonZeroDivisors_of_ne_zero hI
      have hp : I ^ m ∈ nonZeroDivisors (Ideal (NumberField.RingOfIntegers K)) := pow_mem hI' _
      rw [← ClassGroup.mk0_eq_one_iff hI']
      rw [← ClassGroup.mk0_eq_one_iff hp] at h
      have h1 : (ClassGroup.mk0 ⟨I, hI'⟩) ^ m = 1 := by
        rw [← map_pow]; exact h
      have h2 : (ClassGroup.mk0 ⟨I, hI'⟩) ^ NumberField.classNumber K = 1 := by
        rw [NumberField.classNumber, pow_card_eq_one]
      exact orderOf_eq_one_iff.1 (Nat.eq_one_of_dvd_coprimes hm (orderOf_dvd_of_pow_eq_one h1) (orderOf_dvd_of_pow_eq_one h2))
- id: principal_ideal_domain_of_small_discriminant
  kind: gap
  level: 4
  topic: 代数的整数論・判別式と単項性
  statement: 次数$n$、複素素点の個数$r_2$の数体$K$で$|d_K|<\left(2(\pi/4)^{r_2}\dfrac{n^n}{n!}\right)^2$なら、$\mathcal{O}_K$は単項イデアル整域である。
  statement_en: If a number field K of degree n with r_2 complex places satisfies |d_K| < (2 (π/4)^(r_2) n^n/n!)^2, then its ring of integers is a principal ideal domain.
  assumptions:
  - $K$は数体で$n=[K:\mathbb{Q}]$、$r_2$は複素素点の個数
  - $|d_K|<\left(2(\pi/4)^{r_2}n^n/n!\right)^2$
  quantifiers:
  - 任意の$K$
  conclusion: $\mathcal{O}_K$は単項イデアル整域である。
  answer: |
    $K$を次数$n$、複素素点の個数$r_2$の数体とし、仮定の不等式が成り立つとする。両辺の平方根をとって整理すると、$M=(4/\pi)^{r_2}\dfrac{n!}{n^n}\sqrt{|d_K|}<2$である。

    任意のイデアル類は$N(I)\leq M<2$を満たす$0$でないイデアル$I$を含む。$N(I)$は正の整数なので$N(I)=1$であり、$I=\mathcal{O}_K$である。よってすべての類は自明な類に等しい。類群が自明なので、$\mathcal{O}_K$は単項イデアル整域である。
  strategy: The hypothesis says the Minkowski bound is below 2, so every class contains the unit ideal.
  sketch:
  - 'translate: The hypothesis is equivalent to the Minkowski bound M being below 2.'
  - 'apply_theorem: Each class contains an ideal of norm at most M.'
  - 'conclude: Such an ideal is the unit ideal, so the class group is trivial.'
  openmath: (forall (K n) (-> (and (number_field K) (= n (extension_degree K Q)) (< (abs (absolute_discriminant K)) (^ (* (* 2 (^ (/ pi 4) (complex_places_count K))) (/ (^ n n) (factorial n))) 2))) (principal_ideal_domain (ring_of_integers K))))
  hard_negative:
    statement: 単項イデアル整域である整数環では、必ず$|d_K|<\left(2(\pi/4)^{r_2}n^n/n!\right)^2$である。
    reason: $K=\mathbb{Q}(\sqrt{-163})$の整数環は単項イデアル整域だが、$n=2$、$r_2=1$で右辺は$\pi^2$に等しく、$|d_K|=163$より小さい。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], (|NumberField.discr K| : ℝ) < (2 * (Real.pi / 4) ^ NumberField.InfinitePlace.nrComplexPlaces K * ((Module.finrank ℚ K : ℝ) ^ Module.finrank ℚ K / ((Module.finrank ℚ K).factorial : ℝ))) ^ 2 → IsPrincipalIdealRing (NumberField.RingOfIntegers K)
  proof: |
    by
      intro K _ _ h
      exact RingOfIntegers.isPrincipalIdealRing_of_abs_discr_lt (by simpa using h)
- id: dirichlet_unit_rank
  kind: named
  level: 4
  topic: 代数的整数論・Dirichlet の単数定理
  statement: Dirichlet の単数定理。実素点の個数$r_1$、複素素点の個数$r_2$の数体$K$について、単数群$\mathcal{O}_K^\times$の$\mathbb{Z}$階数$r$は$r+1=r_1+r_2$を満たす。
  statement_en: Dirichlet's unit theorem. For a number field K with r_1 real and r_2 complex places, the Z-rank r of the unit group of the ring of integers satisfies r + 1 = r_1 + r_2.
  assumptions:
  - $K$は数体
  - $r_1,r_2$は実素点、複素素点の個数
  quantifiers:
  - 任意の数体$K$
  conclusion: $\mathcal{O}_K^\times$の階数に$1$を足すと$r_1+r_2$である。
  answer: |
    $K$を数体、$V$を無限素点の集合（$|V|=r_1+r_2$）、$m_v$を実素点で$1$、複素素点で$2$とする。$\ell\colon\mathcal{O}_K^\times\to\mathbb{R}^V$を$\ell(u)=(m_v\log|u|_v)_v$で定めると準同型である。単数のノルムは$\pm 1$なので、$\ell$の像は超平面$H=\{\sum_vt_v=0\}$に入る。

    上界を示す。有界な集合に像をもつ単数は、すべての共役が有界な代数的整数なので有限個である。よって$\ell$の像は$H$の離散部分群であり、核は$1$の冪根からなる有限群である。したがって階数は$\dim H=|V|-1$以下である。

    下界を示す。各$v_0\in V$について、$v\neq v_0$で$\ell(u)_v<0$となる単数$u$を構成する。$C$を$K$だけで定まる十分大きな定数とする。$0$でない$\alpha\in\mathcal{O}_K$に対し、$v\neq v_0$では$c_v=|\alpha|_v/2$とし、$c_{v_0}$を$\prod_vc_v^{m_v}=C$となるようにとる。凸体$\{x:|x_v|<c_v\}$は原点対称で、体積は$2^{r_1}\pi^{r_2}C$である。$C$が大きければ、これは$\mathcal{O}_K$の格子の基本領域の体積の$2^n$倍を超える（$n=[K:\mathbb{Q}]$）。Minkowski の凸体定理より、$0$でない$\beta\in\mathcal{O}_K$で、すべての$v$で$|\beta|_v<c_v$となるものがある。このとき$v\neq v_0$で$|\beta|_v<|\alpha|_v/2$であり、$|N(\beta)|<C$である。$\alpha_1=1$から始めてこれを繰り返すと、$|N(\alpha_i)|<C$で$v\neq v_0$の絶対値が狭義減少する列$\alpha_i$を得る。ノルムが$C$以下の単項イデアルは有限個なので、$(\alpha_i)=(\alpha_j)$（$i<j$）となり、$u=\alpha_j/\alpha_i$は$v\neq v_0$で$|u|_v<1$を満たす単数である。

    このような$u_{v_0}$の$\ell$の像の行列は、非対角成分が負で各行の和が$0$である。この形の行列から同じ番号の行と列を一つ除いた小行列は、除いた列の分だけ対角成分が他の成分の和を上回るので、狭義対角優越であり正則である。よって像は$H$を張り、階数は$|V|-1$以上である。

    以上から$r=|V|-1=r_1+r_2-1$である。
  strategy: The logarithmic embedding gives a lattice in the trace-zero hyperplane; Minkowski's theorem produces enough units.
  sketch:
  - 'construct: Define the logarithmic embedding into the hyperplane of sum zero.'
  - 'derive: Bounded sets contain finitely many images, so the image is discrete and the rank is at most r_1 + r_2 - 1.'
  - 'apply_theorem: Minkowski''s theorem yields elements of bounded norm with shrinking absolute values.'
  - 'derive: Their ratios are units negative at all places but one.'
  - 'conclude: Diagonal dominance shows these units span the hyperplane.'
  openmath: (forall (K) (-> (number_field K) (= (+ (unit_group_rank K) 1) (+ (real_places_count K) (complex_places_count K)))))
  hard_negative:
    statement: 数体の単数群の階数は$[K:\mathbb{Q}]-1$である。
    reason: $K=\mathbb{Q}(i)$では$[K:\mathbb{Q}]-1=1$だが、単数群は位数$4$の有限群で階数は$0$である。$r_1+r_2-1$が正しい。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], Module.finrank ℤ (Additive (NumberField.RingOfIntegers K)ˣ) + 1 = NumberField.InfinitePlace.nrRealPlaces K + NumberField.InfinitePlace.nrComplexPlaces K
  proof: |
    by
      intro K _ _
      have h3 := NumberField.InfinitePlace.card_eq_nrRealPlaces_add_nrComplexPlaces (K := K)
      have h4 := NumberField.Units.finrank_eq K
      have hpos : 0 < Fintype.card (NumberField.InfinitePlace K) := Fintype.card_pos
      rw [NumberField.Units.rank] at h4
      omega
- id: dirichlet_fundamental_system_of_units
  kind: named
  level: 4
  topic: 代数的整数論・基本単数系
  statement: 基本単数系の存在。数体$K$の無限素点の個数を$r+1$とすると、単数$u_1,\dots,u_r\in\mathcal{O}_K^\times$が存在して、任意の単数$x$は$1$の冪根$\zeta\in\mathcal{O}_K^\times$と整数$e_1,\dots,e_r$により$x=\zeta\prod_iu_i^{e_i}$と一意に表される。
  statement_en: Existence of a fundamental system. If a number field K has r+1 infinite places, there are units u_1, ..., u_r such that every unit x is uniquely of the form ζ times the product of the u_i^(e_i), with ζ a root of unity in the units and e_i integers.
  assumptions:
  - $K$は数体
  - $r+1$は無限素点の個数
  quantifiers:
  - 任意の数体$K$
  - ある$u_1,\dots,u_r$
  - 任意の単数$x$
  conclusion: $x=\zeta\prod_iu_i^{e_i}$となる組$(\zeta,e_1,\dots,e_r)$がただ一つ存在する。
  answer: |
    $K$を数体、$r+1$を無限素点の個数とする。$\mu$を$\mathcal{O}_K^\times$の中の$1$の冪根全体とすると、$\mu$は有限群である。対数写像$u\mapsto(m_v\log|u|_v)_v$（$m_v$は実素点で$1$、複素素点で$2$）の像は超平面の離散部分群で、核は$\mu$である。よって$\mathcal{O}_K^\times$は有限生成アーベル群であり、ねじれ部分群は$\mu$である。Dirichlet の単数定理より階数は$r$である。

    有限生成アーベル群の構造定理より、$\mathcal{O}_K^\times/\mu$は階数$r$の自由アーベル群である。その基底の代表を$u_1,\dots,u_r$とする。単数$x$の$\mathcal{O}_K^\times/\mu$での像は$u_i$の像の整数結合として一意に表される。よって$x\prod_iu_i^{-e_i}\in\mu$となる$(e_i)$は一意に定まり、$\zeta=x\prod_iu_i^{-e_i}$も定まる。
  strategy: Choose lifts of a Z-basis of the free quotient of the unit group by its torsion.
  sketch:
  - 'apply_theorem: The unit group is finitely generated of rank r with torsion μ.'
  - 'derive: The quotient by μ is free of rank r.'
  - 'construct: Lift a basis of the quotient to units u_i.'
  - 'conclude: Coordinates in the quotient determine the e_i, and then ζ.'
  openmath: (forall (K) (-> (number_field K) (exists (u) (and (fundamental_unit_family u K) (forall (x) (-> (in x (unit_group K)) (unique_torsion_exponents x u K)))))))
  hard_negative:
    statement: 同じ状況で、任意の単数は$\prod_iu_i^{e_i}$の形に表される。
    reason: $K=\mathbb{Q}$では$r=0$で空積は$1$だが、単数$-1$がある。$1$の冪根の因子を落とせない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], ∃ u : Fin (NumberField.Units.rank K) → (NumberField.RingOfIntegers K)ˣ, ∀ x : (NumberField.RingOfIntegers K)ˣ, ∃! ζe : NumberField.Units.torsion K × (Fin (NumberField.Units.rank K) → ℤ), x = ζe.1 * ∏ i, u i ^ ζe.2 i
  proof: |
    by
      intro K _ _
      exact ⟨NumberField.Units.fundSystem K, NumberField.Units.exist_unique_eq_mul_prod K⟩
- id: unit_torsion_iff_conjugates_modulus_one
  kind: gap
  level: 4
  topic: 代数的整数論・単数のねじれ
  statement: 数体$K$の単数$u$について、$u$が$1$の冪根であること（ある正の整数$n$で$u^n=1$）と、すべての埋め込み$\varphi\colon K\to\mathbb{C}$で$|\varphi(u)|=1$であることは同値である。
  statement_en: A unit u of the ring of integers of a number field is a root of unity if and only if |φ(u)| = 1 for every complex embedding φ.
  assumptions:
  - $K$は数体
  - $u\in\mathcal{O}_K^\times$
  quantifiers:
  - 任意の$K,u$
  conclusion: $u$が$1$の冪根であることと、すべての共役の絶対値が$1$であることは同値である。
  answer: |
    $K$を数体、$u\in\mathcal{O}_K^\times$とする。

    $u^n=1$（$n>0$）なら、$\varphi(u)^n=1$なので$|\varphi(u)|=1$である。

    逆に、すべての$\varphi$で$|\varphi(u)|=1$とする。$u$は代数的整数なので、Kronecker の定理より$u$は$1$の冪根である。
  strategy: One direction is immediate; the other is Kronecker's theorem.
  sketch:
  - 'derive: A root of unity has conjugates of modulus one.'
  - 'apply_theorem: Kronecker''s theorem gives the converse.'
  openmath: (forall (K u) (-> (and (number_field K) (in u (unit_group K))) (<-> (exists (n) (and (in n N) (> n 0) (= (^ u n) 1))) (forall (s) (-> (complex_embedding s K) (= (abs (fn_value s u)) 1))))))
  hard_negative:
    statement: 数体の単数$u$について、ある埋め込みで$|\varphi(u)|=1$なら、$u$は$1$の冪根である。
    reason: Salem 数は単数で、ある共役の絶対値が$1$だが$1$の冪根でない。例えば$X^4-X^3-X^2-X+1$の根である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (u : (NumberField.RingOfIntegers K)ˣ), (∃ n : ℕ, 0 < n ∧ u ^ n = 1) ↔ ∀ φ : K →+* ℂ, ‖φ (algebraMap (NumberField.RingOfIntegers K) K u)‖ = 1
  proof: |
    by
      intro K _ _ u
      have h := NumberField.Units.mem_torsion K (x := u)
      rw [NumberField.InfinitePlace.eq_iff_eq] at h
      rw [← h, NumberField.Units.torsion, CommGroup.mem_torsion, isOfFinOrder_iff_pow_eq_one]
- id: unit_torsion_finite_cyclic
  kind: gap
  level: 4
  topic: 代数的整数論・単数のねじれ
  statement: 数体$K$の単数群$\mathcal{O}_K^\times$のねじれ部分群、すなわち$K$の$1$の冪根全体は有限巡回群である。
  statement_en: The torsion subgroup of the unit group of a number field, that is, the group of roots of unity of K, is finite and cyclic.
  assumptions:
  - $K$は数体
  quantifiers:
  - 任意の数体$K$
  conclusion: $\mathcal{O}_K^\times$のねじれ部分群は有限巡回群である。
  answer: |
    $K$を数体とする。$K$の$1$の冪根は代数的整数で、すべての共役の絶対値が$1$である。そのような元は有限個しかないので、$1$の冪根全体$\mu$は有限群である。

    $\mu$は体$K$の乗法群の有限部分群である。位数$w$の群$\mu$で$X^d=1$の解は高々$d$個なので、有限アーベル群の構造定理より$\mu$は巡回群である。
  strategy: Finiteness comes from bounded conjugates, cyclicity from counting roots of X^d - 1 in a field.
  sketch:
  - 'derive: Roots of unity are algebraic integers with conjugates of modulus one.'
  - 'apply_theorem: Only finitely many such elements exist.'
  - 'conclude: A finite subgroup of the multiplicative group of a field is cyclic.'
  openmath: (forall (K) (-> (number_field K) (and (finite_set (torsion_units K)) (cyclic_group (torsion_units K)))))
  hard_negative:
    statement: 数体の単数群$\mathcal{O}_K^\times$は有限巡回群である。
    reason: $\mathbb{Z}[\sqrt2]$の単数$(1+\sqrt2)^k$は無限個ある。有限なのはねじれ部分群である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], Finite (NumberField.Units.torsion K) ∧ IsCyclic (NumberField.Units.torsion K)
  proof: |
    by
      intro K _ _
      exact ⟨inferInstance, inferInstance⟩
- id: unit_log_sum_zero
  kind: gap
  level: 4
  topic: 代数的整数論・単数の対数
  statement: 数体$K$の単数$u$について、無限素点$w$全体にわたる和は$\sum_wm_w\log|u|_w=0$である。ここで$m_w$は実素点で$1$、複素素点で$2$である。
  statement_en: For a unit u of a number field, the sum over the infinite places w of m_w log|u|_w is 0, where m_w is 1 for real and 2 for complex places.
  assumptions:
  - $K$は数体
  - $u\in\mathcal{O}_K^\times$
  - $m_w$は実素点で$1$、複素素点で$2$
  quantifiers:
  - 任意の$K,u$
  conclusion: $\sum_wm_w\log|u|_w=0$である。
  answer: |
    $K$を数体、$u\in\mathcal{O}_K^\times$とする。埋め込み全体は、実素点ごとに一つ、複素素点ごとに共役な二つからなるので、$\prod_w|u|_w^{m_w}=\prod_\sigma|\sigma(u)|=|N_{K/\mathbb{Q}}(u)|$である。

    $u$と$u^{-1}$はともに$\mathcal{O}_K$に属するので、$N_{K/\mathbb{Q}}(u)$と$N_{K/\mathbb{Q}}(u^{-1})$は積が$1$の整数である。よって$|N_{K/\mathbb{Q}}(u)|=1$である。各$|u|_w>0$なので、対数をとると$\sum_wm_w\log|u|_w=0$である。
  strategy: The product of the absolute values with multiplicities is the absolute norm of u, which is 1.
  sketch:
  - 'translate: The product of |u|_w^(m_w) over places is |N(u)|.'
  - 'derive: The norm of a unit is ±1.'
  - 'conclude: Take logarithms.'
  openmath: (forall (K u) (-> (and (number_field K) (in u (unit_group K))) (= (finset_sum (infinite_places K) (lambda (w) (* (place_multiplicity w) (ln (place_value w u))))) 0)))
  hard_negative:
    statement: 同じ状況で重みをつけない和$\sum_w\log|u|_w$は$0$である。
    reason: 実素点と複素素点が混在する$\mathbb{Q}(\sqrt[3]{2})$の単数$u=\sqrt[3]{2}-1$では、$|u|_{\text{実}}|u|_{\text{複素}}^2=1$であり$|u|_{\text{複素}}\neq 1$なので重みなしの和は$0$でない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (u : (NumberField.RingOfIntegers K)ˣ), ∑ w : NumberField.InfinitePlace K, (w.mult : ℝ) * Real.log (w (algebraMap (NumberField.RingOfIntegers K) K u)) = 0
  proof: |
    by
      intro K _ _ u
      exact NumberField.Units.sum_mult_mul_log u
- id: torsion_order_divides_norm_sub_one
  kind: gap
  level: 4
  topic: 代数的整数論・1の冪根と素イデアル
  statement: 数体$K$の$1$の冪根の個数を$w$とする。$\mathcal{O}_K$の$0$でない素イデアル$\mathfrak{p}$について$N(\mathfrak{p})$と$w$が互いに素なら、$w\mid N(\mathfrak{p})-1$である。
  statement_en: Let w be the number of roots of unity of a number field K. If P is a nonzero prime ideal with N(P) coprime to w, then w divides N(P) - 1.
  assumptions:
  - $K$は数体
  - $w$は$K$の$1$の冪根の個数
  - $\mathfrak{p}$は$\mathcal{O}_K$の$0$でない素イデアル
  - $N(\mathfrak{p})$と$w$は互いに素
  quantifiers:
  - 任意の$K,\mathfrak{p}$
  conclusion: $w\mid N(\mathfrak{p})-1$である。
  answer: |
    $K$を数体、$\mu$を$1$の冪根全体、$w=|\mu|$、$\mathfrak{p}$を$0$でない素イデアルとし、$N(\mathfrak{p})$と$w$は互いに素とする。還元により群準同型$\mu\to(\mathcal{O}_K/\mathfrak{p})^\times$が定まる。

    これが単射であることを示す。$\zeta\in\mu$を位数$m>1$の元とし、$\zeta\equiv 1\pmod{\mathfrak{p}}$と仮定する。$X^{m-1}+\dots+1=\prod_{j=1}^{m-1}(X-\zeta^j)$に$X=1$を代入すると$m=\prod_{j=1}^{m-1}(1-\zeta^j)$である。$1-\zeta\in\mathfrak{p}$なので$m\in\mathfrak{p}$である。$\mathfrak{p}$の下の素数を$p$とすると$p\mid m$であり、$m\mid w$なので$p\mid w$である。一方$N(\mathfrak{p})$は$p$の冪で$N(\mathfrak{p})>1$なので$p\mid N(\mathfrak{p})$となり、互いに素であることに反する。

    単射なので$\mu$は位数$N(\mathfrak{p})-1$の群$(\mathcal{O}_K/\mathfrak{p})^\times$の部分群と同型であり、Lagrange の定理より$w\mid N(\mathfrak{p})-1$である。
  strategy: Roots of unity inject into the residue field units when the norm is coprime to w.
  sketch:
  - 'construct: Reduce roots of unity modulo the prime.'
  - 'contradiction: A nontrivial kernel element of order m would put m in the prime, contradicting coprimality.'
  - 'apply_theorem: Lagrange in the multiplicative group of the residue field gives the divisibility.'
  openmath: (forall (K q) (-> (and (number_field K) (prime_ideal q (ring_of_integers K)) (!= q 0) (= (gcd (ideal_norm q) (torsion_order K)) 1)) (dvd (torsion_order K) (- (ideal_norm q) 1))))
  hard_negative:
    statement: 互いに素の仮定がなくても$w\mid N(\mathfrak{p})-1$である。
    reason: $K=\mathbb{Q}$では$w=2$で、$\mathfrak{p}=(2)$なら$N(\mathfrak{p})-1=1$は$2$で割り切れない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (P : Ideal (NumberField.RingOfIntegers K)), P ≠ ⊥ → P.IsPrime → Nat.Coprime (Ideal.absNorm P) (NumberField.Units.torsionOrder K) → NumberField.Units.torsionOrder K ∣ Ideal.absNorm P - 1
  proof: |
    by
      intro K _ _ P h0 hP hc
      exact NumberField.torsionOrder_dvd_absNorm_sub_one h0 hP hc
- id: imaginary_quadratic_units_finite
  kind: gap
  level: 4
  topic: 代数的整数論・虚2次体の単数
  statement: 実素点をもたない$2$次の数体$K$（虚$2$次体）の単数群$\mathcal{O}_K^\times$は有限群である。
  statement_en: The unit group of a quadratic number field without real places, an imaginary quadratic field, is finite.
  assumptions:
  - $K$は数体で$[K:\mathbb{Q}]=2$
  - $K$は実素点をもたない
  quantifiers:
  - 任意の虚$2$次体$K$
  conclusion: $\mathcal{O}_K^\times$は有限群である。
  answer: |
    $K$を実素点をもたない$2$次の数体とする。$K$から$\mathbb{C}$への埋め込みは、互いに複素共役な$\sigma,\bar\sigma$の二つである。

    $u\in\mathcal{O}_K^\times$とする。$u$と$u^{-1}$は代数的整数なので、$N_{K/\mathbb{Q}}(u)$と$N_{K/\mathbb{Q}}(u^{-1})$は積が$1$の整数であり、$N_{K/\mathbb{Q}}(u)=\pm 1$である。一方$N_{K/\mathbb{Q}}(u)=\sigma(u)\bar\sigma(u)=|\sigma(u)|^2$なので、$|\sigma(u)|=|\bar\sigma(u)|=1$である。

    $K$の代数的整数のうち、すべての共役の絶対値が$1$以下のものは有限個である。よって$\mathcal{O}_K^\times$は有限群である。
  strategy: A unit has norm ±1, and in an imaginary quadratic field the norm is the squared modulus, so all conjugates of a unit have modulus one.
  sketch:
  - 'setup: The two embeddings are complex conjugates of each other.'
  - 'derive: The norm of a unit is ±1 and equals |σ(u)|^2, so |σ(u)| = 1.'
  - 'apply_theorem: Only finitely many algebraic integers of K have all conjugates bounded by 1.'
  openmath: (forall (K) (-> (and (number_field K) (= (extension_degree K Q) 2) (= (real_places_count K) 0)) (finite_set (unit_group K))))
  hard_negative:
    statement: すべての$2$次の数体で単数群は有限である。
    reason: $\mathbb{Q}(\sqrt2)$の単数$1+\sqrt2$は無限位数である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], Module.finrank ℚ K = 2 → NumberField.InfinitePlace.nrRealPlaces K = 0 → Finite (NumberField.RingOfIntegers K)ˣ
  proof: |
    by
      intro K _ _ h2 h0
      have h1 := NumberField.InfinitePlace.card_add_two_mul_card_eq_rank K
      have h3 := NumberField.InfinitePlace.card_eq_nrRealPlaces_add_nrComplexPlaces (K := K)
      have h4 := NumberField.Units.finrank_eq K
      have hr : NumberField.Units.rank K = 0 := by
        rw [NumberField.Units.rank]; omega
      have hall : ∀ u : (NumberField.RingOfIntegers K)ˣ, u ∈ NumberField.Units.torsion K := by
        intro u
        have hz : Module.finrank ℤ (Additive (NumberField.RingOfIntegers K)ˣ) = 0 := by rw [h4, hr]
        obtain ⟨a, ha, hu⟩ := (Module.finrank_eq_zero_iff.1 hz) (Additive.ofMul u)
        rw [NumberField.Units.torsion, CommGroup.mem_torsion, isOfFinOrder_iff_zpow_eq_one]
        exact ⟨a, ha, by simpa using congrArg Additive.toMul hu⟩
      exact Finite.of_injective (fun u => (⟨u, hall u⟩ : NumberField.Units.torsion K)) (fun a b h => by simpa using congrArg Subtype.val h)
- id: real_quadratic_unit_infinite_order
  kind: gap
  level: 4
  topic: 代数的整数論・実2次体の単数
  statement: 複素素点をもたない$2$次の数体$K$（実$2$次体）には、無限位数の単数が存在する。
  statement_en: A quadratic number field without complex places, a real quadratic field, has a unit of infinite order.
  assumptions:
  - $K$は数体で$[K:\mathbb{Q}]=2$
  - $K$は複素素点をもたない
  quantifiers:
  - 任意の実$2$次体$K$
  - ある単数$u$
  conclusion: すべての正の整数$n$で$u^n\neq 1$である。
  answer: |
    $K$を複素素点をもたない$2$次の数体とする。$r_1+2r_2=2$、$r_2=0$より$r_1=2$である。Dirichlet の単数定理より、単数群の階数は$r_1+r_2-1=1$である。すべての単数が有限位数なら階数は$0$になるので、無限位数の単数$u$が存在する。すなわちすべての正の整数$n$で$u^n\neq 1$である。
  strategy: The unit rank is 1, so not all units can have finite order.
  sketch:
  - 'derive: r_2 = 0 and degree 2 give r_1 = 2.'
  - 'apply_theorem: Dirichlet''s theorem gives rank 1.'
  - 'contradiction: If all units were torsion, the rank would be 0.'
  openmath: (forall (K) (-> (and (number_field K) (= (extension_degree K Q) 2) (= (complex_places_count K) 0)) (exists (u) (and (in u (unit_group K)) (forall (n) (-> (and (in n N) (> n 0)) (!= (^ u n) 1)))))))
  hard_negative:
    statement: 実$2$次体の単数は$\pm 1$を除いてすべてノルムが$-1$である。
    reason: $\mathbb{Q}(\sqrt3)$の単数$2+\sqrt3$はノルムが$1$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], Module.finrank ℚ K = 2 → NumberField.InfinitePlace.nrComplexPlaces K = 0 → ∃ u : (NumberField.RingOfIntegers K)ˣ, ∀ n : ℕ, 0 < n → u ^ n ≠ 1
  proof: |
    by
      intro K _ _ h2 h0
      have h1 := NumberField.InfinitePlace.card_add_two_mul_card_eq_rank K
      have h3 := NumberField.InfinitePlace.card_eq_nrRealPlaces_add_nrComplexPlaces (K := K)
      have h4 := NumberField.Units.finrank_eq K
      have hr : NumberField.Units.rank K = 1 := by
        rw [NumberField.Units.rank]; omega
      by_contra hcon
      push Not at hcon
      have hz : Module.finrank ℤ (Additive (NumberField.RingOfIntegers K)ˣ) = 0 := by
        rw [Module.finrank_eq_zero_iff]
        intro x
        obtain ⟨n, hn, hx⟩ := hcon (Additive.toMul x)
        refine ⟨n, by omega, ?_⟩
        have : (n : ℤ) • x = Additive.ofMul ((Additive.toMul x) ^ n) := by simp
        rw [this, hx]; rfl
      omega
- id: cyclotomic_unit_group_rank
  kind: gap
  level: 4
  topic: 代数的整数論・円分体の単数階数
  statement: $n>2$のとき、$\mathbb{Q}$の$n$次円分拡大$K$の単数群の階数$r$は$2(r+1)=\varphi(n)$を満たす。
  statement_en: For n > 2, the unit rank r of the n-th cyclotomic extension K of Q satisfies 2(r + 1) = φ(n).
  assumptions:
  - $n>2$
  - $K$は$\mathbb{Q}$の$n$次円分拡大
  quantifiers:
  - 任意の$n,K$
  conclusion: $2(r+1)=\varphi(n)$である。
  answer: |
    $n>2$、$K$を$n$次円分拡大、$\zeta$を原始$n$乗根とする。$K$の埋め込み$\sigma$について、$\sigma(\zeta)$は原始$n$乗根であり、$n>2$なので実数でない。よって$K$に実素点はなく、$r_1=0$である。$[K:\mathbb{Q}]=\varphi(n)$と$r_1+2r_2=\varphi(n)$より$2r_2=\varphi(n)$である。Dirichlet の単数定理より$r+1=r_1+r_2=r_2$なので、$2(r+1)=\varphi(n)$である。
  strategy: Primitive roots of unity of order above 2 are not real, so K is totally complex; apply Dirichlet's theorem.
  sketch:
  - 'derive: Images of ζ are nonreal for n > 2, so r_1 = 0.'
  - 'derive: The degree φ(n) equals 2 r_2.'
  - 'apply_theorem: Dirichlet''s theorem gives r + 1 = r_2.'
  openmath: (forall (n K) (-> (and (in n N) (> n 2) (cyclotomic_over_rationals K n) (number_field K)) (= (* 2 (+ (unit_group_rank K) 1)) (euler_phi n))))
  hard_negative:
    statement: 同じ公式は$n=2$でも成り立つ。
    reason: $n=2$では$K=\mathbb{Q}$で階数は$0$なので左辺は$2$だが、$\varphi(2)=1$である。
  target: |
    ∀ (n : ℕ) [NeZero n] (K : Type*) [Field K] [NumberField K] [IsCyclotomicExtension {n} ℚ K], 2 < n → 2 * (Module.finrank ℤ (Additive (NumberField.RingOfIntegers K)ˣ) + 1) = n.totient
  proof: |
    by
      intro n _ K _ _ _ h2
      obtain ⟨ζ, hζ⟩ := IsCyclotomicExtension.exists_isPrimitiveRoot (S := {n}) ℚ K rfl (NeZero.ne n)
      have h0 := NumberField.InfinitePlace.IsPrimitiveRoot.nrRealPlaces_eq_zero_of_two_lt h2 hζ
      have h1 := NumberField.InfinitePlace.card_add_two_mul_card_eq_rank K
      have h3 := NumberField.InfinitePlace.card_eq_nrRealPlaces_add_nrComplexPlaces (K := K)
      have h4 := NumberField.Units.finrank_eq K
      have hpos : 0 < Fintype.card (NumberField.InfinitePlace K) := Fintype.card_pos
      have h5 := IsCyclotomicExtension.Rat.finrank (k := n) K
      rw [NumberField.Units.rank] at h4
      omega
- id: infinite_places_count_formula
  kind: gap
  level: 3
  topic: 代数的整数論・無限素点の個数
  statement: 数体$K$の実素点の個数を$r_1$、複素素点の個数を$r_2$とすると、$r_1+2r_2=[K:\mathbb{Q}]$である。
  statement_en: A number field K with r_1 real and r_2 complex places satisfies r_1 + 2 r_2 = [K:Q].
  assumptions:
  - $K$は数体
  - $r_1,r_2$は実素点、複素素点の個数
  quantifiers:
  - 任意の数体$K$
  conclusion: $r_1+2r_2=[K:\mathbb{Q}]$である。
  answer: |
    $K$を数体、$n=[K:\mathbb{Q}]$とする。$K$から$\mathbb{C}$への埋め込みはちょうど$n$個ある。複素共役は埋め込みの集合に作用し、固定されるものが実埋め込み、他は二つずつ組になる。無限素点は埋め込みの共役類なので、実素点は固定される埋め込みに、複素素点は共役な組に対応する。よって埋め込みの個数を数えて$n=r_1+2r_2$である。
  strategy: Count the complex embeddings according to the action of complex conjugation.
  sketch:
  - 'setup: K has exactly n complex embeddings.'
  - 'derive: Complex conjugation fixes real embeddings and pairs the others.'
  - 'conclude: Counting gives r_1 + 2 r_2 = n.'
  openmath: (forall (K) (-> (number_field K) (= (+ (real_places_count K) (* 2 (complex_places_count K))) (extension_degree K Q))))
  hard_negative:
    statement: 数体について$r_1+r_2=[K:\mathbb{Q}]$である。
    reason: $K=\mathbb{Q}(i)$では$r_1=0$、$r_2=1$で和は$1$だが、次数は$2$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], NumberField.InfinitePlace.nrRealPlaces K + 2 * NumberField.InfinitePlace.nrComplexPlaces K = Module.finrank ℚ K
  proof: |
    by
      intro K _ _
      exact NumberField.InfinitePlace.card_add_two_mul_card_eq_rank K
- id: infinite_places_product_abs_norm
  kind: gap
  level: 4
  topic: 代数的整数論・無限素点とノルム
  statement: 数体$K$の元$x$について、無限素点$w$全体にわたる積は$\prod_w|x|_w^{m_w}=|N_{K/\mathbb{Q}}(x)|$である。ここで$m_w$は実素点で$1$、複素素点で$2$である。
  statement_en: For x in a number field K, the product over the infinite places w of |x|_w^(m_w) equals |N_{K/Q}(x)|, where m_w is 1 for real and 2 for complex places.
  assumptions:
  - $K$は数体
  - $x\in K$
  - $m_w$は実素点で$1$、複素素点で$2$
  quantifiers:
  - 任意の$K,x$
  conclusion: $\prod_w|x|_w^{m_w}=|N_{K/\mathbb{Q}}(x)|$である。
  answer: |
    $K$を数体、$x\in K$とする。$N_{K/\mathbb{Q}}(x)=\prod_\sigma\sigma(x)$なので、$|N_{K/\mathbb{Q}}(x)|=\prod_\sigma|\sigma(x)|$である。無限素点$w$に対応する埋め込みは、実素点なら一つ、複素素点なら共役な二つであり、いずれも$|\sigma(x)|=|x|_w$である。よって$\sigma$についての積をまとめると$\prod_w|x|_w^{m_w}$である。
  strategy: Group the factors of the norm by infinite place.
  sketch:
  - 'translate: Write |N(x)| as the product of |σ(x)| over embeddings.'
  - 'derive: Each place contributes m_w embeddings with the same absolute value.'
  - 'conclude: Regroup the product.'
  openmath: (forall (K x) (-> (and (number_field K) (in x K)) (= (prod_over (infinite_places K) (lambda (w) (^ (place_value w x) (place_multiplicity w)))) (abs (relative_norm Q K x)))))
  hard_negative:
    statement: 同じ状況で$\prod_w|x|_w=|N_{K/\mathbb{Q}}(x)|$である。
    reason: $K=\mathbb{Q}(i)$、$x=2$では左辺は$2$だが、ノルムは$4$である。複素素点には重み$2$が必要である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (x : K), ∏ w : NumberField.InfinitePlace K, w x ^ w.mult = |((Algebra.norm ℚ x : ℚ) : ℝ)|
  proof: |
    by
      intro K _ _ x
      simpa using NumberField.InfinitePlace.prod_eq_abs_norm x
- id: number_field_product_formula
  kind: named
  level: 4
  topic: 代数的整数論・積公式
  statement: 積公式。数体$K$の$0$でない元$x$について、有限素点$v$での値$|x|_v=N(\mathfrak{p}_v)^{-\mathrm{ord}_{\mathfrak{p}_v}(x)}$が$1$と異なる$v$は有限個で、$\prod_w|x|_w^{m_w}\prod_v|x|_v=1$である。ここで$w$は無限素点を動き、$m_w$は実素点で$1$、複素素点で$2$である。
  statement_en: The product formula. For a nonzero x in a number field, the values |x|_v = N(p_v)^(-ord(x)) at finite places differ from 1 only finitely often, and the product of |x|_w^(m_w) over infinite places times the product of |x|_v over finite places is 1.
  assumptions:
  - $K$は数体
  - $x\in K$、$x\neq 0$
  - 有限素点の値は$N(\mathfrak{p})^{-\mathrm{ord}_{\mathfrak{p}}(x)}$で正規化する
  quantifiers:
  - 任意の$K,x$
  conclusion: 有限素点の積は有限積であり、全素点の積は$1$である。
  answer: |
    $K$を数体、$x\in K$を$0$でない元とする。単項分数イデアルは$(x)=\prod_{\mathfrak{p}}\mathfrak{p}^{a_{\mathfrak{p}}}$と分解し、$a_{\mathfrak{p}}=\mathrm{ord}_{\mathfrak{p}}(x)$は有限個を除いて$0$である。よって$|x|_{\mathfrak{p}}\neq 1$となる$\mathfrak{p}$は有限個である。

    ノルムの乗法性より$\prod_{\mathfrak{p}}N(\mathfrak{p})^{a_{\mathfrak{p}}}=N((x))$である。$x=a/b$（$a,b\in\mathcal{O}_K$は$0$でない）と書くと、$N((x))=N((a))/N((b))=|N_{K/\mathbb{Q}}(a)|/|N_{K/\mathbb{Q}}(b)|=|N_{K/\mathbb{Q}}(x)|$である。したがって$\prod_{\mathfrak{p}}|x|_{\mathfrak{p}}=|N_{K/\mathbb{Q}}(x)|^{-1}$である。

    一方$\prod_w|x|_w^{m_w}=|N_{K/\mathbb{Q}}(x)|$である。二つを掛けて主張を得る。
  strategy: Both the finite and the infinite product are expressed through |N(x)|, with opposite exponents.
  sketch:
  - 'derive: The factorization of (x) has finite support.'
  - 'derive: Multiplicativity of ideal norms gives the finite product |N(x)|^(-1).'
  - 'derive: The infinite product is |N(x)|.'
  - 'conclude: Multiply.'
  openmath: (forall (K x) (-> (and (number_field K) (in x K) (!= x 0)) (and (finite_support_one (finite_places K) (lambda (v) (place_value v x))) (= (* (prod_over (infinite_places K) (lambda (w) (^ (place_value w x) (place_multiplicity w)))) (finite_support_product (finite_places K) (lambda (v) (place_value v x)))) 1))))
  hard_negative:
    statement: 同じ状況で、無限素点の重み$m_w$を除いても全素点の積は$1$である。
    reason: $K=\mathbb{Q}(i)$、$x=2$では$|2|_w=2$で、有限素点の積は$N((2))^{-1}=1/4$である。積は$1/2$になり$1$でない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (x : K), x ≠ 0 → (Function.mulSupport fun w : NumberField.FinitePlace K => w x).Finite ∧ (∏ w : NumberField.InfinitePlace K, w x ^ w.mult) * ∏ᶠ w : NumberField.FinitePlace K, w x = 1
  proof: |
    by
      intro K _ _ x hx
      exact ⟨NumberField.FinitePlace.hasFiniteMulSupport hx, NumberField.prod_abs_eq_one hx⟩
- id: integrality_iff_all_valuations_le_one
  kind: gap
  level: 4
  topic: 代数的整数論・付値による整数の判定
  statement: 数体$K$の元$x$が代数的整数であるための必要十分条件は、$\mathcal{O}_K$の$0$でない素イデアル$\mathfrak{p}$すべてで$x$の$\mathfrak{p}$進付値が$0$以上（乗法的な値が$1$以下）であることである。
  statement_en: An element x of a number field K is an algebraic integer if and only if its valuation at every nonzero prime ideal of the ring of integers is nonnegative, that is, its multiplicative value is at most 1.
  assumptions:
  - $K$は数体
  - $x\in K$
  quantifiers:
  - 任意の$K,x$
  - $\mathcal{O}_K$の$0$でない任意の素イデアル$\mathfrak{p}$
  conclusion: $x$が代数的整数であることと、すべての$\mathfrak{p}$で$\mathrm{ord}_{\mathfrak{p}}(x)\geq 0$であることは同値である。
  answer: |
    $K$を数体、$x\in K$とする。$x=0$なら両辺とも成り立つので、$x\neq 0$とする。単項分数イデアルを$(x)=\prod_{\mathfrak{p}}\mathfrak{p}^{a_{\mathfrak{p}}}$と分解すると、$a_{\mathfrak{p}}=\mathrm{ord}_{\mathfrak{p}}(x)$である。

    $x$が代数的整数なら$(x)\subset\mathcal{O}_K$は整イデアルなので、一意分解よりすべての$a_{\mathfrak{p}}\geq 0$である。

    逆にすべての$a_{\mathfrak{p}}\geq 0$なら、$(x)=\prod_{\mathfrak{p}}\mathfrak{p}^{a_{\mathfrak{p}}}\subset\mathcal{O}_K$なので、$x\in\mathcal{O}_K$である。
  strategy: Compare with the prime factorization of the fractional ideal (x).
  sketch:
  - 'translate: The exponents of (x) are the valuations of x.'
  - 'derive: An integral ideal has nonnegative exponents.'
  - 'conclude: Conversely nonnegative exponents make (x) an integral ideal.'
  openmath: (forall (K x) (-> (and (number_field K) (in x K)) (<-> (algebraic_integer x) (forall (q) (-> (in q (nonzero_primes K)) (prime_valuation_le_one q x))))))
  hard_negative:
    statement: ある$0$でない素イデアルで付値が$0$以上なら、$x$は代数的整数である。
    reason: $K=\mathbb{Q}$、$x=1/2$は$3$進付値が$0$だが、整数でない。すべての素イデアルで調べる必要がある。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (x : K), (∀ v : IsDedekindDomain.HeightOneSpectrum (NumberField.RingOfIntegers K), IsDedekindDomain.HeightOneSpectrum.valuation K v x ≤ 1) ↔ IsIntegral ℤ x
  proof: |
    by
      intro K _ _ x
      constructor
      · intro h
        obtain ⟨y, rfl⟩ := IsDedekindDomain.HeightOneSpectrum.mem_integers_of_valuation_le_one K x h
        exact NumberField.RingOfIntegers.isIntegral_coe y
      · intro h v
        have : x = algebraMap (NumberField.RingOfIntegers K) K ⟨x, h⟩ := rfl
        rw [this]
        exact IsDedekindDomain.HeightOneSpectrum.valuation_le_one v _
- id: frobenius_element_exists
  kind: textbook
  level: 4
  topic: 代数的整数論・Frobenius 元の存在
  statement: 数体の Galois 拡大$L/K$と$\mathcal{O}_L$の$0$でない素イデアル$\mathfrak{Q}$に対し、$q=|\mathcal{O}_K/(\mathfrak{Q}\cap\mathcal{O}_K)|$とおくと、$\sigma\in\mathrm{Gal}(L/K)$で、すべての$x\in\mathcal{O}_L$について$\sigma(x)-x^q\in\mathfrak{Q}$となるものが存在する。
  statement_en: For a Galois extension L/K of number fields and a nonzero prime Q of O_L, with q the size of the residue ring of O_K at the contraction of Q, there is σ in Gal(L/K) with σ(x) - x^q in Q for every x in O_L.
  assumptions:
  - $L/K$は数体の Galois 拡大
  - $\mathfrak{Q}$は$\mathcal{O}_L$の$0$でない素イデアル
  - $q=|\mathcal{O}_K/(\mathfrak{Q}\cap\mathcal{O}_K)|$
  quantifiers:
  - 任意の$L/K,\mathfrak{Q}$
  - ある$\sigma\in\mathrm{Gal}(L/K)$
  - 任意の$x\in\mathcal{O}_L$
  conclusion: $\sigma(x)-x^q\in\mathfrak{Q}$である。
  answer: |
    $L/K$を数体の Galois 拡大、$G=\mathrm{Gal}(L/K)$、$\mathfrak{Q}$を$\mathcal{O}_L$の$0$でない素イデアル、$\mathfrak{p}=\mathfrak{Q}\cap\mathcal{O}_K$、$q=|\mathcal{O}_K/\mathfrak{p}|$とする。$\kappa=\mathcal{O}_L/\mathfrak{Q}$は有限体である。$\kappa^\times$の生成元$\bar a$をとる。

    中国剰余定理より、$y\in\mathcal{O}_L$で$y\equiv a\pmod{\mathfrak{Q}}$かつ、$\tau(\mathfrak{Q})\neq\mathfrak{Q}$である各$\tau\in G$で$y\in\tau^{-1}(\mathfrak{Q})$となるものがある。$g(X)=\prod_{\tau\in G}(X-\tau(y))$は係数が$G$不変で整なので$\mathcal{O}_K[X]$に属する。$\bar g\in(\mathcal{O}_K/\mathfrak{p})[X]$は$\bar a$を根にもつ。$\mathcal{O}_K/\mathfrak{p}$の元は$q$乗で不変なので$\bar g(\bar a^q)=\bar g(\bar a)^q=0$である。よって、ある$\sigma\in G$で$a^q\equiv\sigma(y)\pmod{\mathfrak{Q}}$である。

    $\bar a\neq 0$なので$\sigma(y)\notin\mathfrak{Q}$、すなわち$y\notin\sigma^{-1}(\mathfrak{Q})$である。$y$のとり方より$\sigma(\mathfrak{Q})=\mathfrak{Q}$である。

    $x\in\mathcal{O}_L$とする。$x\in\mathfrak{Q}$なら$\sigma(x)\in\mathfrak{Q}$、$x^q\in\mathfrak{Q}$なので成り立つ。$x\notin\mathfrak{Q}$なら$x\equiv y^j\pmod{\mathfrak{Q}}$となる$j$があり、$\sigma(\mathfrak{Q})=\mathfrak{Q}$より$\sigma(x)\equiv\sigma(y)^j\equiv a^{qj}\equiv x^q\pmod{\mathfrak{Q}}$である。
  strategy: Lift a generator of the residue field to an element avoiding the other conjugates of Q and use its characteristic polynomial.
  sketch:
  - 'construct: Choose y lifting a generator of the residue field and lying in every other conjugate of Q.'
  - 'derive: The polynomial over O_K with roots τ(y) has a^q as a root modulo Q, so a^q ≡ σ(y).'
  - 'derive: Since a^q is nonzero, σ fixes Q.'
  - 'conclude: Powers of y give the congruence for all x.'
  openmath: (forall (K L q) (-> (and (number_field K) (number_field L) (galois_extension L K) (prime_ideal q (ring_of_integers L)) (!= q 0)) (exists (s) (and (in s (galois_group L K)) (arithmetic_frobenius_at s q K)))))
  hard_negative:
    statement: 同じ状況で、そのような$\sigma$は常にただ一つである。
    reason: $\mathbb{Q}(i)/\mathbb{Q}$の$(1+i)$では剰余体が$\mathbb{F}_2$で、恒等写像と複素共役の両方が$\sigma(x)\equiv x^2\pmod{(1+i)}$を満たす。分岐する素イデアルでは一意でない。
  target: |
    ∀ (K L : Type*) [Field K] [NumberField K] [Field L] [NumberField L] [Algebra K L] [IsGalois K L] (Q : Ideal (NumberField.RingOfIntegers L)) [Q.IsPrime], Q ≠ ⊥ → ∃ σ : L ≃ₐ[K] L, ∀ x : NumberField.RingOfIntegers L, σ • x - x ^ Nat.card (NumberField.RingOfIntegers K ⧸ Q.under (NumberField.RingOfIntegers K)) ∈ Q
  proof: |
    by
      intro K L _ _ _ _ _ _ Q _ h0
      haveI : Finite (NumberField.RingOfIntegers L ⧸ Q) := (Ideal.absNorm_ne_zero_iff Q).1 (fun h => h0 (Ideal.absNorm_eq_zero_iff.1 h))
      haveI hG := IsGaloisGroup.of_isFractionRing (L ≃ₐ[K] L) (NumberField.RingOfIntegers K) (NumberField.RingOfIntegers L) K L
      obtain ⟨σ, hσ⟩ := IsArithFrobAt.exists_of_isInvariant (NumberField.RingOfIntegers K) (L ≃ₐ[K] L) Q
      exact ⟨σ, hσ⟩
- id: frobenius_acts_on_roots_of_unity
  kind: gap
  level: 4
  topic: 代数的整数論・Frobenius 元と1の冪根
  statement: 数体の Galois 拡大$L/K$と$\mathcal{O}_L$の$0$でない素イデアル$\mathfrak{Q}$、$q=|\mathcal{O}_K/(\mathfrak{Q}\cap\mathcal{O}_K)|$について、$\sigma\in\mathrm{Gal}(L/K)$がすべての$x\in\mathcal{O}_L$で$\sigma(x)-x^q\in\mathfrak{Q}$を満たすとする。$\zeta\in\mathcal{O}_L$が$\zeta^m=1$で$m\notin\mathfrak{Q}$なら、$\sigma(\zeta)=\zeta^q$である。
  statement_en: Let L/K be a Galois extension of number fields, Q a nonzero prime of O_L, q the residue ring size below Q and σ a Frobenius element at Q. If ζ in O_L satisfies ζ^m = 1 and m is not in Q, then σ(ζ) = ζ^q.
  assumptions:
  - $L/K$は数体の Galois 拡大、$\mathfrak{Q}$は$\mathcal{O}_L$の$0$でない素イデアル
  - $q=|\mathcal{O}_K/(\mathfrak{Q}\cap\mathcal{O}_K)|$
  - $\sigma\in\mathrm{Gal}(L/K)$はすべての$x\in\mathcal{O}_L$で$\sigma(x)-x^q\in\mathfrak{Q}$を満たす
  - $\zeta\in\mathcal{O}_L$、$\zeta^m=1$、$m\notin\mathfrak{Q}$
  quantifiers:
  - 任意の$L/K,\mathfrak{Q},\sigma,\zeta,m$
  conclusion: $\sigma(\zeta)=\zeta^q$である。
  answer: |
    $L/K$を数体の Galois 拡大、$\mathfrak{Q}$を$\mathcal{O}_L$の$0$でない素イデアル、$q=|\mathcal{O}_K/(\mathfrak{Q}\cap\mathcal{O}_K)|$とし、$\sigma$はすべての$x\in\mathcal{O}_L$で$\sigma(x)\equiv x^q\pmod{\mathfrak{Q}}$を満たすとする。$\zeta\in\mathcal{O}_L$は$\zeta^m=1$、$m\notin\mathfrak{Q}$を満たすとする。$m\neq 0$である。

    $\eta=\sigma(\zeta)$と$\xi=\zeta^q$はともに$\mathcal{O}_L$の$m$乗して$1$になる元で、仮定から$\eta\equiv\xi\pmod{\mathfrak{Q}}$である。$\eta\neq\xi$と仮定する。体$L$で$X^m-1=(X-\eta)(X-\xi)h(X)$（$h\in\mathcal{O}_L[X]$）と書ける。$\mathfrak{Q}$で還元すると$X^m-1$は$\mathcal{O}_L/\mathfrak{Q}$上で$\bar\eta$を重根にもつ。すると導関数$mX^{m-1}$も$\bar\eta$で$0$になる。$\bar\eta^m=1$より$\bar\eta\neq 0$なので$m\in\mathfrak{Q}$となり、仮定に反する。よって$\eta=\xi$である。
  strategy: Two distinct m-th roots of unity cannot coincide modulo Q when m is not in Q, since X^m - 1 is then separable modulo Q.
  sketch:
  - 'setup: σ(ζ) and ζ^q are m-th roots of unity congruent modulo Q.'
  - 'contradiction: If they differ, X^m - 1 has a double root modulo Q.'
  - 'derive: The derivative test then forces m to lie in Q.'
  openmath: (forall (K L q s z m) (-> (and (number_field K) (number_field L) (galois_extension L K) (prime_ideal q (ring_of_integers L)) (!= q 0) (in s (galois_group L K)) (arithmetic_frobenius_at s q K) (in z (ring_of_integers L)) (in m N) (= (^ z m) 1) (notin m q)) (= (automorphism_apply s z) (^ z (residue_size_below K q)))))
  hard_negative:
    statement: $m\in\mathfrak{Q}$でも$\sigma(\zeta)=\zeta^q$である。
    reason: $L=\mathbb{Q}(\zeta_3)$、$K=\mathbb{Q}$、$\mathfrak{Q}=(1-\zeta_3)$では$q=3$で、$\zeta_3^3=1$なので$\zeta_3^q=1$である。一方$\sigma$を複素共役にとると、剰余体が$\mathbb{F}_3$で$\sigma(x)\equiv x\equiv x^3$なので仮定を満たすが、$\sigma(\zeta_3)=\zeta_3^2\neq 1$である。
  target: |
    ∀ (K L : Type*) [Field K] [NumberField K] [Field L] [NumberField L] [Algebra K L] [IsGalois K L] (Q : Ideal (NumberField.RingOfIntegers L)) [Q.IsPrime] (σ : L ≃ₐ[K] L) (ζ : NumberField.RingOfIntegers L) (m : ℕ), (∀ x : NumberField.RingOfIntegers L, σ • x - x ^ Nat.card (NumberField.RingOfIntegers K ⧸ Q.under (NumberField.RingOfIntegers K)) ∈ Q) → ζ ^ m = 1 → (m : NumberField.RingOfIntegers L) ∉ Q → σ • ζ = ζ ^ Nat.card (NumberField.RingOfIntegers K ⧸ Q.under (NumberField.RingOfIntegers K))
  proof: |
    by
      intro K L _ _ _ _ _ _ Q _ σ ζ m h hζ hm
      have H : (MulSemiringAction.toAlgHom (NumberField.RingOfIntegers K) (NumberField.RingOfIntegers L) σ).IsArithFrobAt Q := h
      exact H.apply_of_pow_eq_one hζ hm
- id: dedekind_zeta_residue_positive
  kind: gap
  level: 4
  topic: 代数的整数論・Dedekind ゼータの留数
  statement: 数体$K$について、Dedekind ゼータ関数の$s=1$での留数の値$\dfrac{2^{r_1}(2\pi)^{r_2}Rh}{w\sqrt{|d_K|}}$は正である。ここで$r_1,r_2$は実素点、複素素点の個数、$R$は単数基準、$h$は類数、$w$は$1$の冪根の個数である。
  statement_en: For a number field K, the residue value 2^(r_1) (2π)^(r_2) R h / (w sqrt|d_K|) of the Dedekind zeta function at s = 1 is positive, with R the regulator, h the class number and w the number of roots of unity.
  assumptions:
  - $K$は数体
  - $r_1,r_2,R,h,w,d_K$は$K$の不変量
  quantifiers:
  - 任意の数体$K$
  conclusion: $\dfrac{2^{r_1}(2\pi)^{r_2}Rh}{w\sqrt{|d_K|}}>0$である。
  answer: |
    $K$を数体とする。$2^{r_1}>0$、$(2\pi)^{r_2}>0$である。類数$h$は有限な類群の位数なので$h\geq 1$である。$w$は$1$の冪根の個数なので$w\geq 1$である。$d_K\neq 0$なので$\sqrt{|d_K|}>0$である。

    単数基準$R$は、基本単数系の対数からなる$r\times r$行列の行列式の絶対値である（$r=r_1+r_2-1$）。Dirichlet の単数定理の証明より、基本単数の対数ベクトルは超平面$\sum_vt_v=0$の中で$\mathbb{R}$上$1$次独立である。一つの座標を除いた射影はこの超平面上で単射なので、この行列式は$0$でない。よって$R>0$である（$r=0$なら$R=1$）。

    すべての因子が正なので、全体も正である。
  strategy: Each factor is positive, and the regulator is nonzero by the unit theorem.
  sketch:
  - 'derive: Powers of 2 and 2π, h, w and sqrt|d_K| are positive.'
  - 'apply_theorem: The log vectors of a fundamental system are linearly independent, so R > 0.'
  - 'conclude: A quotient of positive numbers is positive.'
  openmath: (forall (K) (-> (number_field K) (> (/ (* (* (* (^ 2 (real_places_count K)) (^ (* 2 pi) (complex_places_count K))) (regulator K)) (class_number K)) (* (torsion_order K) (root (abs (absolute_discriminant K)) 2))) 0)))
  hard_negative:
    statement: $K$の留数の値は常に$1$以上である。
    reason: $K=\mathbb{Q}(\sqrt{-3})$では$r_2=1$、$R=1$、$h=1$、$w=6$、$|d_K|=3$なので、値は$2\pi/(6\sqrt3)\approx 0.60$である。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], 0 < (2 ^ NumberField.InfinitePlace.nrRealPlaces K * (2 * Real.pi) ^ NumberField.InfinitePlace.nrComplexPlaces K * NumberField.Units.regulator K * NumberField.classNumber K) / (NumberField.Units.torsionOrder K * Real.sqrt |(NumberField.discr K : ℝ)|)
  proof: |
    by
      intro K _ _
      have := NumberField.dedekindZeta_residue_pos K
      rwa [NumberField.dedekindZeta_residue_def] at this
- id: analytic_class_number_formula
  kind: named
  level: 4
  topic: 代数的整数論・解析的類数公式
  statement: 解析的類数公式。数体$K$の Dedekind ゼータ関数$\zeta_K(s)=\sum_{I\neq 0}N(I)^{-s}$について、実数$s$を$1$に右から近づけると$(s-1)\zeta_K(s)\to\dfrac{2^{r_1}(2\pi)^{r_2}Rh}{w\sqrt{|d_K|}}$である。記号は$r_1,r_2$が素点の個数、$R$が単数基準、$h$が類数、$w$が$1$の冪根の個数である。
  statement_en: The analytic class number formula. For the Dedekind zeta function of a number field K, as real s tends to 1 from above, (s - 1) ζ_K(s) tends to 2^(r_1) (2π)^(r_2) R h / (w sqrt|d_K|).
  assumptions:
  - $K$は数体
  - $\zeta_K$は Dedekind ゼータ関数
  - $s$は$1$より大きい実数で$1$に近づく
  quantifiers:
  - 任意の数体$K$
  conclusion: $(s-1)\zeta_K(s)$は上の値に収束する。
  answer: |
    $K$を数体とし、$\kappa=\dfrac{2^{r_1}(2\pi)^{r_2}Rh}{w\sqrt{|d_K|}}$とおく。$N(I)\leq x$である$0$でないイデアルの個数を$A(x)$とする。イデアル個数の漸近公式より$A(x)/x\to\kappa$（$x\to\infty$）である。

    特に$A(x)=O(x)$なので、$s>1$で級数は収束し、Abel の総和法より、$\zeta_K(s)=\sum_{n\geq 1}(A(n)-A(n-1))n^{-s}=s\int_1^\infty A(x)x^{-s-1}dx$である。

    $\varepsilon>0$をとる。$x\geq x_0$で$|A(x)-\kappa x|\leq\varepsilon x$とする。積分を$[1,x_0]$と$[x_0,\infty)$に分ける。$[1,x_0]$の積分は$s$について有界なので、$(s-1)$を掛けると$0$に収束する。$[x_0,\infty)$の部分について、$(s-1)s\int_{x_0}^\infty x^{-s}dx=sx_0^{1-s}\to 1$なので、$(s-1)\zeta_K(s)$の上極限と下極限は$\kappa\pm\varepsilon$の間にある。$\varepsilon$は任意なので$(s-1)\zeta_K(s)\to\kappa$である。
  strategy: Deduce the limit from the asymptotic count of ideals by Abel summation.
  sketch:
  - 'apply_theorem: The number of ideals of norm at most x is asymptotic to κ x.'
  - 'derive: Abel summation writes ζ_K(s) as s times an integral of A(x) x^(-s-1).'
  - 'derive: The integral over a bounded range is negligible after multiplying by s - 1.'
  - 'conclude: The tail is controlled by κ ± ε.'
  openmath: (forall (K) (-> (number_field K) (right_limit_equals (lambda (s) (* (- s 1) (dedekind_zeta K s))) 1 (/ (* (* (* (^ 2 (real_places_count K)) (^ (* 2 pi) (complex_places_count K))) (regulator K)) (class_number K)) (* (torsion_order K) (root (abs (absolute_discriminant K)) 2))))))
  hard_negative:
    statement: 極限は$\dfrac{2^{r_1}(2\pi)^{r_2}Rh}{\sqrt{|d_K|}}$である。
    reason: $K=\mathbb{Q}$では真の極限は$1$である。実際$r_1=1$、$R=h=1$、$w=2$で、$w$を除くと値は$2$になり誤りである。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], Filter.Tendsto (fun s : ℝ => ((s : ℂ) - 1) * NumberField.dedekindZeta K s) (nhdsWithin 1 (Set.Ioi 1)) (nhds (((2 ^ NumberField.InfinitePlace.nrRealPlaces K * (2 * Real.pi) ^ NumberField.InfinitePlace.nrComplexPlaces K * NumberField.Units.regulator K * NumberField.classNumber K) / (NumberField.Units.torsionOrder K * Real.sqrt |(NumberField.discr K : ℝ)|) : ℝ) : ℂ))
  proof: |
    by
      intro K _ _
      have := NumberField.tendsto_sub_one_mul_dedekindZeta_nhdsGT K
      rwa [NumberField.dedekindZeta_residue_def] at this
- id: ideal_count_asymptotic
  kind: named
  level: 4
  topic: 代数的整数論・イデアルの個数の漸近公式
  statement: Weber の定理。数体$K$の整数環のイデアルでノルムが$s$以下のものの個数を$A(s)$とすると、実数$s\to\infty$で$A(s)/s\to\dfrac{2^{r_1}(2\pi)^{r_2}Rh}{w\sqrt{|d_K|}}$である。ここで零イデアルのノルムは$0$とする。
  statement_en: Weber's theorem. If A(s) counts the ideals of the ring of integers of a number field with norm at most s, where the zero ideal has norm 0, then A(s)/s tends to 2^(r_1) (2π)^(r_2) R h / (w sqrt|d_K|) as s tends to infinity.
  assumptions:
  - $K$は数体
  - $A(s)$はノルムが$s$以下のイデアルの個数
  - $s\to\infty$（実数）
  quantifiers:
  - 任意の数体$K$
  conclusion: $A(s)/s$は$\dfrac{2^{r_1}(2\pi)^{r_2}Rh}{w\sqrt{|d_K|}}$に収束する。
  answer: |
    $K$を数体、$n=[K:\mathbb{Q}]$、$V$を無限素点の集合、$m_v$を実素点で$1$、複素素点で$2$、$r=r_1+r_2-1$、$u_1,\dots,u_r$を基本単数系とする。零イデアルは$1$個なので、$0$でないイデアルについて示せばよい。$h$個のイデアル類ごとに数える。

    類$C$を固定し、逆の類の整イデアル$J$をとる。$I\in C$は$IJ=(a)$（$0\neq a\in J$）と対応し、$N(I)\leq s$は$|N_{K/\mathbb{Q}}(a)|\leq sN(J)$と同値である。$a$は単数倍を除いて定まる。

    $E=\mathbb{R}^{r_1}\times\mathbb{C}^{r_2}$とし、$E^\times$を全座標が$0$でない点の集合、$N(x)=\prod_v|x_v|^{m_v}$、$\ell(x)=(m_v\log|x_v|)_v\in\mathbb{R}^V$とする。$\ell(u_i)$は超平面$H=\{\sum_vt_v=0\}$の基底であり、$\mathbb{R}^V=\mathbb{R}(m_v)_v\oplus H$である。$D\subset E^\times$を、$\ell(x)=\frac{T}{n}(m_v)_v+\sum_ic_i\ell(u_i)$（$T\in\mathbb{R}$、$0\leq c_i<1$）と書ける点の集合とする。このとき$T=\log N(x)$であり、$D$は正の実数倍で不変である。単数$u$を掛けると$\ell$に$\ell(u)$が加わり、$1$の冪根は$\ell$を変えない。よって各$a\neq 0$について、$ua\in D$となる単数$u$はちょうど$w$個ある。したがって類$C$の$N(I)\leq s$であるイデアルの個数は、格子$J$の$0$でない点のうち$D\cap\{N\leq sN(J)\}$に属するものの個数の$1/w$である。

    $D_1=D\cap\{N\leq 1\}$、$\lambda=(sN(J))^{1/n}$とすると、$D\cap\{N\leq sN(J)\}=\lambda D_1$である。$\tau=e^{T/n}$、$g_v(c)=\exp(\sum_ic_i\ell(u_i)_v/m_v)$とおくと、$D_1$の点は実座標で$\pm\tau g_v(c)$、複素座標で$\tau g_v(c)e^{i\theta_v}$と表される。パラメータ$(\tau,c,\theta)\in[0,1]\times[0,1]^r\times[0,2\pi]^{r_2}$は$1+r+r_2=n$個あり、この表示は滑らかである。よって$D_1$は有界で、その境界は$n-1$次元の立方体の面の Lipschitz 像に含まれる。

    ここで格子点の数え上げの基本定理を引用する。このような集合と格子$\Lambda$について、$\#(\Lambda\cap\lambda D_1)=\mathrm{vol}(D_1)\lambda^n/\mathrm{covol}(\Lambda)+O(\lambda^{n-1})$である。

    体積を計算する。$t_v=m_v\log|x_v|$とすると、実座標の体積要素は各符号で$e^{t_v}dt_v$、複素座標の体積要素は$\frac12e^{t_v}dt_vd\theta_v$である。符号と角を積分すると、$\mathrm{vol}(D_1)=2^{r_1}\pi^{r_2}\int e^{\sum_vt_v}dt$である。変数を$(T,c)$に替えるヤコビアンの絶対値は、列$(m_v/n)_v,\ell(u_1),\dots,\ell(u_r)$の行列式の絶対値である。すべての行を一つの行に足すと、その行は$(1,0,\dots,0)$になるので、この値は単数基準$R$である。よって$\mathrm{vol}(D_1)=2^{r_1}\pi^{r_2}R\int_{-\infty}^0e^TdT=2^{r_1}\pi^{r_2}R$である。また$\mathrm{covol}(J)=2^{-r_2}\sqrt{|d_K|}N(J)$である。

    したがって類ごとの個数は$\dfrac{1}{w}\cdot\dfrac{2^{r_1}\pi^{r_2}R\cdot sN(J)}{2^{-r_2}\sqrt{|d_K|}N(J)}=\dfrac{2^{r_1}(2\pi)^{r_2}R}{w\sqrt{|d_K|}}s$に漸近する。$h$個の類について足して主張を得る。
  strategy: Count ideals class by class as lattice points in a dilated fundamental cone of the unit action.
  sketch:
  - 'translate: Ideals in a class correspond to elements of a lattice modulo units.'
  - 'construct: Use a fundamental cone for the action of units.'
  - 'apply_theorem: Lattice point counting in a dilate of a Lipschitz domain gives the volume ratio.'
  - 'derive: Compute the volume of the cone and the covolume of the lattice.'
  - 'conclude: Sum over the h classes.'
  openmath: (forall (K) (-> (number_field K) (fn_limit_at_top (lambda (s) (/ (ideal_count_norm_le K s) s)) (/ (* (* (* (^ 2 (real_places_count K)) (^ (* 2 pi) (complex_places_count K))) (regulator K)) (class_number K)) (* (torsion_order K) (root (abs (absolute_discriminant K)) 2))))))
  hard_negative:
    statement: $A(s)/s$の極限は常に$1$である。
    reason: $K=\mathbb{Q}(i)$では$r_2=1$、$R=h=1$、$w=4$、$|d_K|=4$なので極限は$\pi/4$である。Gauss の円問題と一致する。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], Filter.Tendsto (fun s : ℝ => (Nat.card {I : Ideal (NumberField.RingOfIntegers K) // (Ideal.absNorm I : ℝ) ≤ s} : ℝ) / s) Filter.atTop (nhds ((2 ^ NumberField.InfinitePlace.nrRealPlaces K * (2 * Real.pi) ^ NumberField.InfinitePlace.nrComplexPlaces K * NumberField.Units.regulator K * NumberField.classNumber K) / (NumberField.Units.torsionOrder K * Real.sqrt |(NumberField.discr K : ℝ)|)))
  proof: |
    by
      intro K _ _
      exact NumberField.Ideal.tendsto_norm_le_div_atTop K
- id: finite_adele_unit_iff
  kind: gap
  level: 4
  topic: 代数的整数論・有限アデール
  statement: 数体$K$の有限アデール$a=(a_v)_v$が可逆であるための必要十分条件は、すべての有限素点$v$で$a_v\neq 0$であり、かつ有限個を除く$v$で$|a_v|_v=1$であることである。
  statement_en: A finite adele a = (a_v) of a number field K is a unit if and only if a_v is nonzero for every finite place v and |a_v|_v = 1 for all but finitely many v.
  assumptions:
  - $K$は数体
  - $a$は$K$の有限アデール（有限個を除く$v$で$a_v\in\mathcal{O}_v$である$\prod_vK_v$の元）
  quantifiers:
  - 任意の$K,a$
  conclusion: $a$が可逆であることは、すべての$v$で$a_v\neq 0$かつ有限個を除いて$|a_v|_v=1$であることと同値である。
  answer: |
    $K$を数体、$a=(a_v)_v$を有限アデールとする。有限個を除く$v$で$a_v\in\mathcal{O}_v$である。

    $a$が可逆で逆元を$b=(b_v)_v$とする。すべての$v$で$a_vb_v=1$なので$a_v\neq 0$である。有限個を除く$v$で$a_v,b_v\in\mathcal{O}_v$であり、$|a_v|_v|b_v|_v=1$と$|a_v|_v,|b_v|_v\leq 1$から$|a_v|_v=1$である。

    逆に、すべての$v$で$a_v\neq 0$、有限個を除いて$|a_v|_v=1$とする。$b_v=a_v^{-1}$とおくと、$|a_v|_v=1$である$v$で$|b_v|_v=1$なので$b_v\in\mathcal{O}_v$である。よって$b=(b_v)_v$は有限アデールで、$ab=1$である。
  strategy: Inverses are componentwise, and the restricted product condition is equivalent to almost all values being 1.
  sketch:
  - 'derive: If a has inverse b, almost all components of both are integral, so |a_v| = 1 for those v.'
  - 'construct: Conversely define b componentwise by inverses.'
  - 'conclude: The condition makes b a finite adele.'
  openmath: (forall (K a) (-> (and (number_field K) (in a (finite_adele_ring K))) (<-> (unit_element a (finite_adele_ring K)) (and (forall (v) (-> (in v (nonzero_primes K)) (!= (adele_component a v) 0))) (almost_all_components_norm_one K a)))))
  hard_negative:
    statement: 有限アデール$a$は、すべての$v$で$a_v\neq 0$なら可逆である。
    reason: $K=\mathbb{Q}$で$a_p=p$とすると$a$は有限アデールですべての成分が$0$でないが、成分ごとの逆$1/p$は$\mathbb{Z}_p$に入らないので有限アデールでない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K] (a : IsDedekindDomain.FiniteAdeleRing (NumberField.RingOfIntegers K) K), IsUnit a ↔ (∀ v, a v ≠ 0) ∧ ∀ᶠ v in Filter.cofinite, Valued.v (a v) = 1
  proof: |
    by
      intro K _ _ a
      exact IsDedekindDomain.FiniteAdeleRing.isUnit_iff
- id: infinite_adele_weak_approximation
  kind: textbook
  level: 4
  topic: 代数的整数論・無限素点での弱近似
  statement: 数体$K$は、無限素点での完備化の直積$\prod_{w\mid\infty}K_w$に対角に埋め込むと稠密である。
  statement_en: A number field K is dense in the product of its completions at the infinite places under the diagonal embedding.
  assumptions:
  - $K$は数体
  - $\prod_{w\mid\infty}K_w$は無限素点での完備化の直積
  quantifiers:
  - 任意の数体$K$
  conclusion: $K$の像は$\prod_{w\mid\infty}K_w$で稠密である。
  answer: |
    $K$を数体、$n=[K:\mathbb{Q}]$とする。実素点の完備化は$\mathbb{R}$、複素素点の完備化は$\mathbb{C}$なので、$A=\prod_{w\mid\infty}K_w$は$\mathbb{R}$上$n$次元である。

    $K$の$\mathbb{Q}$基底を$b_1,\dots,b_n$とする。行列$(\sigma(b_i))_{i,\sigma}$の行列式は$\sqrt{\mathrm{disc}(b)}$の符号違いで$0$でないので、実部と虚部に分けて考えると、$b_1,\dots,b_n$の像は$A$の$\mathbb{R}$基底である。

    よって$\mathbb{R}$線形同型$\mathbb{R}^n\to A$、$(t_i)\mapsto\sum_it_ib_i$が得られる。$\mathbb{Q}^n$は$\mathbb{R}^n$で稠密であり、線形同型は同相なので、像$\sum_i\mathbb{Q}b_i=K$は$A$で稠密である。
  strategy: A Q-basis of K maps to an R-basis of the product of completions, and Q^n is dense in R^n.
  sketch:
  - 'derive: The product of completions has real dimension n.'
  - 'derive: Nonvanishing of the discriminant shows a Q-basis of K gives an R-basis.'
  - 'conclude: Density of Q^n in R^n transfers along the linear homeomorphism.'
  openmath: (forall (K) (-> (number_field K) (dense_image_of_field K (infinite_adele_ring K))))
  hard_negative:
    statement: $\mathcal{O}_K$は$\prod_{w\mid\infty}K_w$で稠密である。
    reason: $\mathcal{O}_K$の像は格子であり離散である。例えば$K=\mathbb{Q}$で$\mathbb{Z}$は$\mathbb{R}$で稠密でない。
  target: |
    ∀ (K : Type*) [Field K] [NumberField K], DenseRange (algebraMap K (NumberField.InfiniteAdeleRing K))
  proof: |
    by
      intro K _ _
      exact NumberField.InfiniteAdeleRing.denseRange_algebraMap K
- id: nonarchimedean_local_field_integer_ring
  kind: textbook
  level: 4
  topic: 代数的整数論・局所体の整数環
  statement: 非アルキメデス局所体$K$（付値の位相をもつ局所コンパクトな位相体で、付値が自明でないもの）の付値環$\mathcal{O}$はコンパクトな離散付値環であり、剰余体は有限である。
  statement_en: The valuation ring of a nonarchimedean local field K, a locally compact topological field with the topology of a nontrivial valuation, is a compact discrete valuation ring with finite residue field.
  assumptions:
  - $K$は付値の位相をもつ局所コンパクトな位相体
  - 付値は自明でない
  quantifiers:
  - 任意の非アルキメデス局所体$K$
  conclusion: 付値環$\mathcal{O}$はコンパクトな離散付値環で、剰余体は有限である。
  answer: |
    $K$を非アルキメデス局所体、$v$をその付値、$\mathcal{O}=\{v\leq 1\}$、$\mathfrak{m}=\{v<1\}$とする。

    コンパクト性を示す。局所コンパクト性より$0$のコンパクトな近傍$U$があり、位相は付値で定まるので、ある値$\gamma$で$\{v<\gamma\}\subset U$である。$v$が自明でないので$0<v(\pi)<1$となる$\pi$がある。値$\gamma$をとる元に$\pi$を掛けて、$v(c)<\gamma$となる$c\neq 0$をとる。閉集合$\{v\leq v(c)\}=c\mathcal{O}$は$U$に含まれるのでコンパクトであり、$c^{-1}$倍の同相で$\mathcal{O}$に写るので、$\mathcal{O}$はコンパクトである。

    剰余体が有限であることを示す。$\mathfrak{m}$は$\mathcal{O}$の開部分群なので、$\mathcal{O}$は$\mathfrak{m}$の互いに素な開な剰余類で覆われる。コンパクト性より剰余類は有限個である。

    離散付値環であることを示す。$\mathfrak{m}$は$\mathcal{O}$で開かつ閉なのでコンパクトである。開集合$\{v\leq v(x)\}$（$x\in\mathfrak{m}\setminus\{0\}$）は$\mathfrak{m}$を覆うので、有限部分被覆から、すべての$x\in\mathfrak{m}$で$v(x)\leq v(\varpi)$となる$\varpi\in\mathfrak{m}\setminus\{0\}$がとれる。$x\in\mathfrak{m}$なら$v(x/\varpi)\leq 1$なので$\mathfrak{m}=(\varpi)$である。$0$でない$x$が$\bigcap_n(\varpi^n)$に属すると仮定する。$x\mathcal{O}$は開部分群なので$\mathcal{O}/x\mathcal{O}$は有限であり、減少列$(\varpi^n)\supset(x)$は止まる。すると$(\varpi^n)=(\varpi^{n+1})$となり$\varpi$が単元になるので矛盾する。よって$0$でない元は$\varpi$の冪と単元の積であり、$\mathcal{O}$は離散付値環である。
  strategy: Rescale a compact neighbourhood of 0 to get compactness, then use open covers for finiteness of the residue field and for principality of the maximal ideal.
  sketch:
  - 'derive: Scaling a compact neighbourhood of 0 shows the valuation ring is compact.'
  - 'derive: The cosets of the open maximal ideal form a finite cover, so the residue field is finite.'
  - 'derive: Compactness of the maximal ideal gives a largest value below 1.'
  - 'conclude: A generator of the maximal ideal makes the ring a discrete valuation ring.'
  openmath: (forall (K) (-> (local_field K) (and (compact_space (valuation_integers K)) (discrete_valuation_ring (valuation_integers K)) (finite_set (residue_field_of (valuation_integers K))))))
  hard_negative:
    statement: 非アルキメデス局所体$K$自身もコンパクトである。
    reason: 付値が自明でないので$\pi^{-n}$の値は非有界であり、$K$は有界でない。例えば$\mathbb{Q}_p$はコンパクトでない。
  target: |
    ∀ (K : Type*) [Field K] [ValuativeRel K] [TopologicalSpace K] [IsNonarchimedeanLocalField K], CompactSpace (Valuation.integer (ValuativeRel.valuation K)) ∧ IsDiscreteValuationRing (Valuation.integer (ValuativeRel.valuation K)) ∧ Finite (IsLocalRing.ResidueField (Valuation.integer (ValuativeRel.valuation K)))
  proof: |
    by
      intro K _ _ _ _
      exact ⟨inferInstance, inferInstance, inferInstance⟩
- id: padic_val_rat_mul_div_zpow
  kind: gap
  level: 3
  topic: p進数・p進付値の計算則
  statement: 素数$p$と$0$でない有理数$q,r$について、$p$進付値は$v_p(qr)=v_p(q)+v_p(r)$、$v_p(q/r)=v_p(q)-v_p(r)$を満たし、任意の整数$k$について$v_p(q^k)=kv_p(q)$である。
  statement_en: For a prime p and nonzero rationals q, r, the p-adic valuation satisfies v_p(qr) = v_p(q) + v_p(r), v_p(q/r) = v_p(q) - v_p(r), and v_p(q^k) = k v_p(q) for every integer k.
  assumptions:
  - $p$は素数
  - $q,r\in\mathbb{Q}$は$0$でない
  - $k\in\mathbb{Z}$
  quantifiers:
  - 任意の$p,q,r,k$
  conclusion: 積、商、整数冪の$p$進付値の公式が成り立つ。
  answer: |
    $p$を素数、$q,r$を$0$でない有理数、$k$を整数とする。$q=p^a\,m/n$、$r=p^b\,m'/n'$（$a=v_p(q)$、$b=v_p(r)$、$m,n,m',n'$は$p$と互いに素な整数）と書く。

    $qr=p^{a+b}\,mm'/(nn')$であり、$p$は素数なので$mm'$と$nn'$は$p$と互いに素である。よって$v_p(qr)=a+b$である。$q/r=p^{a-b}\,mn'/(nm')$も同様に$v_p(q/r)=a-b$である。

    $k\geq 0$なら積の公式の繰り返しで$v_p(q^k)=ka$である。$k<0$なら、商の公式より$v_p(q^k)=v_p(1)-v_p(q^{-k})=ka$である。
  strategy: Write q and r as a power of p times a fraction prime to p.
  sketch:
  - 'setup: Write q and r as p^a m/n and p^b m''/n'' with the rest prime to p.'
  - 'derive: Products and quotients of integers prime to p remain prime to p.'
  - 'conclude: Integer powers follow by repetition and the quotient rule.'
  openmath: (forall (p q r k) (-> (and (in p P) (in q Q) (in r Q) (!= q 0) (!= r 0) (in k Z)) (and (= (padic_valuation p (* q r)) (+ (padic_valuation p q) (padic_valuation p r))) (= (padic_valuation p (/ q r)) (- (padic_valuation p q) (padic_valuation p r))) (= (padic_valuation p (^ q k)) (* k (padic_valuation p q))))))
  hard_negative:
    statement: $0$でない有理数$q,r$で$q+r\neq 0$なら$v_p(q+r)=v_p(q)+v_p(r)$である。
    reason: $p=2$、$q=2$、$r=4$では$v_2(6)=1$だが、右辺は$3$である。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (q r : ℚ) (k : ℤ), q ≠ 0 → r ≠ 0 → padicValRat p (q * r) = padicValRat p q + padicValRat p r ∧ padicValRat p (q / r) = padicValRat p q - padicValRat p r ∧ padicValRat p (q ^ k) = k * padicValRat p q
  proof: |
    by
      intro p _ q r k hq hr
      exact ⟨padicValRat.mul hq hr, padicValRat.div hq hr, padicValRat.zpow q⟩
- id: padic_norm_dvd_iff
  kind: gap
  level: 3
  topic: p進数・ノルムと整除
  statement: 素数$p$、自然数$n$、整数$z$について、$p^n\mid z$であることと、$p$進ノルムについて$|z|_p\leq p^{-n}$であることは同値である。
  statement_en: For a prime p, a natural number n and an integer z, p^n divides z if and only if the p-adic norm satisfies |z|_p ≤ p^(-n).
  assumptions:
  - $p$は素数
  - $n\in\mathbb{N}$、$z\in\mathbb{Z}$
  quantifiers:
  - 任意の$p,n,z$
  conclusion: $p^n\mid z$と$|z|_p\leq p^{-n}$は同値である。
  answer: |
    $p$を素数、$n$を自然数、$z$を整数とする。$z=0$なら$|z|_p=0\leq p^{-n}$であり、$p^n\mid 0$なので両方成り立つ。

    $z\neq 0$とし、$a=v_p(z)$とおくと$a\geq 0$、$|z|_p=p^{-a}$である。$p^n\mid z$は$n\leq a$と同値である。$p>1$なので、$n\leq a$は$p^{-a}\leq p^{-n}$と同値である。
  strategy: Translate both conditions into a comparison of the valuation with n.
  sketch:
  - 'case_split: The case z = 0 is immediate.'
  - 'translate: For z nonzero, p^n | z is equivalent to n ≤ v_p(z).'
  - 'conclude: This is equivalent to p^(-v_p(z)) ≤ p^(-n).'
  openmath: (forall (p n z) (-> (and (in p P) (in n N) (in z Z)) (<-> (dvd (^ p n) z) (<= (padic_norm p z) (^ p (neg n))))))
  hard_negative:
    statement: $p^n\mid z$は$|z|_p<p^{-n}$と同値である。
    reason: $z=p^n$では$p^n\mid z$だが、$|z|_p=p^{-n}$で狭義の不等式は成り立たない。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (n : ℕ) (z : ℤ), ((p ^ n : ℕ) : ℤ) ∣ z ↔ padicNorm p z ≤ (p : ℚ) ^ (-(n : ℤ))
  proof: |
    by
      intro p _ n z
      exact padicNorm.dvd_iff_norm_le
- id: padic_norm_finite_sum
  kind: gap
  level: 3
  topic: p進数・有限和の評価
  statement: 素数$p$、$t\geq 0$、有理数の有限族$(F_i)_{i\in s}$がすべての$i\in s$で$|F_i|_p\leq t$を満たすなら、$|\sum_{i\in s}F_i|_p\leq t$である。
  statement_en: If p is a prime, t ≥ 0 and a finite family of rationals F_i satisfies |F_i|_p ≤ t for all i in s, then the p-adic norm of the sum of F_i over s is at most t.
  assumptions:
  - $p$は素数
  - $t\in\mathbb{Q}$、$t\geq 0$
  - $s$は有限集合で、すべての$i\in s$で$|F_i|_p\leq t$
  quantifiers:
  - 任意の$p,t,s,F$
  conclusion: $|\sum_{i\in s}F_i|_p\leq t$である。
  answer: |
    $p$を素数、$t\geq 0$、$s$を有限集合、$(F_i)_{i\in s}$を有理数の族とし、すべての$i\in s$で$|F_i|_p\leq t$とする。$s$の元の個数についての帰納法で示す。

    $s$が空なら和は$0$で、$|0|_p=0\leq t$である。$s=s'\cup\{i_0\}$（$i_0\notin s'$）で$s'$について成り立つとすると、超距離不等式より$|\sum_{s}F_i|_p\leq\max(|\sum_{s'}F_i|_p,|F_{i_0}|_p)\leq t$である。
  strategy: Induct on the finite set using the ultrametric inequality.
  sketch:
  - 'induction: The empty sum has norm 0 ≤ t.'
  - 'derive: Adding one term preserves the bound by the ultrametric inequality.'
  openmath: (forall (p t s F) (-> (and (in p P) (in t Q) (>= t 0) (finite_set s) (forall (i) (-> (in i s) (<= (padic_norm p (fn_value F i)) t)))) (<= (padic_norm p (finset_sum s (lambda (i) (fn_value F i)))) t)))
  hard_negative:
    statement: 同じ状況で$|\sum_{i\in s}F_i|_p$は$\max_i|F_i|_p$に等しい。
    reason: $p=2$、$F_1=F_2=1$では最大値は$1$だが、$|2|_2=1/2$である。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (α : Type*) (F : α → ℚ) (t : ℚ) (s : Finset α), 0 ≤ t → (∀ i ∈ s, padicNorm p (F i) ≤ t) → padicNorm p (∑ i ∈ s, F i) ≤ t
  proof: |
    by
      intro p _ α F t s ht h
      exact padicNorm.sum_le' h ht
- id: qp_valuation_mul_inv_add
  kind: gap
  level: 3
  topic: p進数・Q_pの付値
  statement: 素数$p$と$\mathbb{Q}_p$の$0$でない元$x,y$について、$v(xy)=v(x)+v(y)$、$v(x^{-1})=-v(x)$であり、$x+y\neq 0$なら$\min(v(x),v(y))\leq v(x+y)$である。ここで$v$は$|x|_p=p^{-v(x)}$で定まる付値である。
  statement_en: For a prime p and nonzero x, y in Q_p, the valuation v defined by |x|_p = p^(-v(x)) satisfies v(xy) = v(x) + v(y), v(x^(-1)) = -v(x), and min(v(x), v(y)) ≤ v(x + y) if x + y is nonzero.
  assumptions:
  - $p$は素数
  - $x,y\in\mathbb{Q}_p$は$0$でない
  quantifiers:
  - 任意の$p,x,y$
  conclusion: 積、逆元、和についての付値の関係が成り立つ。
  answer: |
    $p$を素数、$x,y$を$\mathbb{Q}_p$の$0$でない元とする。$p$進ノルムは乗法的で超距離不等式を満たす。

    $p^{-v(xy)}=|xy|_p=|x|_p|y|_p=p^{-v(x)-v(y)}$なので$v(xy)=v(x)+v(y)$である。$y=x^{-1}$とすると$v(1)=0$より$v(x^{-1})=-v(x)$である。

    $x+y\neq 0$なら、$p^{-v(x+y)}=|x+y|_p\leq\max(|x|_p,|y|_p)=p^{-\min(v(x),v(y))}$である。$p>1$なので$v(x+y)\geq\min(v(x),v(y))$である。
  strategy: Translate multiplicativity and the ultrametric inequality of the norm through the logarithm base p.
  sketch:
  - 'translate: The valuation is minus the logarithm base p of the norm.'
  - 'derive: Multiplicativity of the norm gives the product and inverse rules.'
  - 'derive: The ultrametric inequality gives the bound for sums.'
  openmath: (forall (p x y) (-> (and (in p P) (in x (padic_field p)) (in y (padic_field p)) (!= x 0) (!= y 0)) (and (= (padic_valuation p (* x y)) (+ (padic_valuation p x) (padic_valuation p y))) (= (padic_valuation p (/ 1 x)) (neg (padic_valuation p x))) (-> (!= (+ x y) 0) (<= (min_of (padic_valuation p x) (padic_valuation p y)) (padic_valuation p (+ x y)))))))
  hard_negative:
    statement: $\mathbb{Q}_p$の$0$でない元について常に$v(x+y)=\min(v(x),v(y))$である。
    reason: $p=2$、$x=y=1$では$v(2)=1$だが、右辺は$0$である。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (x y : Padic p), x ≠ 0 → y ≠ 0 → (x * y).valuation = x.valuation + y.valuation ∧ x⁻¹.valuation = -x.valuation ∧ (x + y ≠ 0 → min x.valuation y.valuation ≤ (x + y).valuation)
  proof: |
    by
      intro p _ x y hx hy
      exact ⟨Padic.valuation_mul hx hy, Padic.valuation_inv x, fun h => Padic.le_valuation_add h⟩
- id: rat_padic_integer_iff_den
  kind: gap
  level: 3
  topic: p進数・有理数とp進整数
  statement: 素数$p$と有理数$r$について、$|r|_p\leq 1$であることと、既約分数で表した$r$の分母が$p$で割り切れないことは同値である。
  statement_en: For a prime p and a rational r, |r|_p ≤ 1 if and only if p does not divide the denominator of r in lowest terms.
  assumptions:
  - $p$は素数
  - $r\in\mathbb{Q}$
  quantifiers:
  - 任意の$p,r$
  conclusion: $|r|_p\leq 1$と$p\nmid(r\text{ の分母})$は同値である。
  answer: |
    $p$を素数、$r=u/v$を既約分数（$v\geq 1$）とする。$r=0$なら$v=1$で、どちらも成り立つ。$r\neq 0$とすると$v_p(r)=v_p(u)-v_p(v)$である。

    $p\nmid v$なら$v_p(v)=0$なので$v_p(r)=v_p(u)\geq 0$であり、$|r|_p=p^{-v_p(r)}\leq 1$である。

    $p\mid v$なら、既約分数なので$p\nmid u$であり、$v_p(r)=-v_p(v)<0$である。よって$|r|_p>1$である。
  strategy: Compute the valuation of a fraction in lowest terms.
  sketch:
  - 'case_split: The case r = 0 is immediate.'
  - 'derive: If p does not divide v, the valuation of r is nonnegative.'
  - 'derive: If p divides v, then p does not divide u, so the valuation is negative.'
  openmath: (forall (p r) (-> (and (in p P) (in r Q)) (<-> (<= (padic_norm p r) 1) (not (dvd p (rational_denominator r))))))
  hard_negative:
    statement: 有理数$r=u/v$（既約とは限らない）について、$|r|_p\leq 1$なら$p\nmid v$である。
    reason: $r=2/2$は$|r|_2=1$だが、この表示の分母$2$は$2$で割り切れる。既約分数であることが必要である。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (r : ℚ), ‖(r : Padic p)‖ ≤ 1 ↔ ¬ p ∣ r.den
  proof: |
    by
      intro p _ r
      constructor
      · intro h hd
        have hu := PadicInt.isUnit_den r h
        have h1 := PadicInt.isUnit_iff.1 hu
        have h2 : ‖(r.den : PadicInt p)‖ < 1 := by
          rw [PadicInt.norm_lt_one_iff_dvd]
          exact_mod_cast (Nat.cast_dvd_cast hd : (p : PadicInt p) ∣ (r.den : PadicInt p))
        rw [h1] at h2
        exact lt_irrefl _ h2
      · exact Padic.norm_rat_le_one
- id: nat_dense_in_padic_integers
  kind: gap
  level: 3
  topic: p進数・自然数の稠密性
  statement: 素数$p$について、自然数全体は$\mathbb{Z}_p$で稠密である。
  statement_en: For a prime p, the natural numbers are dense in Z_p.
  assumptions:
  - $p$は素数
  quantifiers:
  - 任意の素数$p$
  conclusion: $\mathbb{N}$の像は$\mathbb{Z}_p$で稠密である。
  answer: |
    $p$を素数、$x\in\mathbb{Z}_p$、$\varepsilon>0$とする。$p^{-n}<\varepsilon$となる$n\geq 1$をとる。$\mathbb{Q}_p$の定義より$\mathbb{Q}$は稠密なので、$r\in\mathbb{Q}$で$|x-r|_p<p^{-n}$となるものがある。超距離不等式より$|r|_p\leq 1$なので、$r=u/v$（既約、$p\nmid v$）と書ける。

    $vw\equiv 1\pmod{p^n}$となる整数$w$をとり、$uw\equiv a\pmod{p^n}$となる自然数$a$をとる。$r-a=(u-av)/v$であり、$u-av\equiv u-uwv\equiv 0\pmod{p^n}$、$|v|_p=1$なので、$|r-a|_p\leq p^{-n}$である。

    超距離不等式より$|x-a|_p\leq\max(|x-r|_p,|r-a|_p)\leq p^{-n}<\varepsilon$である。
  strategy: Approximate x by a rational with denominator prime to p and invert the denominator modulo p^n.
  sketch:
  - 'derive: Approximate x by a rational r = u/v with p not dividing v.'
  - 'construct: Choose a natural number a congruent to u times an inverse of v modulo p^n.'
  - 'conclude: The ultrametric inequality gives |x - a|_p ≤ p^(-n).'
  openmath: (forall (p) (-> (in p P) (dense_in N (padic_integers p))))
  hard_negative:
    statement: 自然数全体は$\mathbb{Q}_p$で稠密である。
    reason: 自然数はすべて$|n|_p\leq 1$を満たす閉集合$\mathbb{Z}_p$に入るので、$|p^{-1}|_p=p$である$p^{-1}$に近づけない。
  target: |
    ∀ (p : ℕ) [Fact p.Prime], DenseRange (Nat.cast : ℕ → PadicInt p)
  proof: |
    by
      intro p _
      exact PadicInt.denseRange_natCast
- id: padic_integers_compact_complete
  kind: textbook
  level: 3
  topic: p進数・Z_pのコンパクト性と完備性
  statement: 素数$p$について、$\mathbb{Z}_p$はコンパクトかつ完備である。
  statement_en: For a prime p, the ring Z_p is compact and complete.
  assumptions:
  - $p$は素数
  quantifiers:
  - 任意の素数$p$
  conclusion: $\mathbb{Z}_p$はコンパクトかつ完備である。
  answer: |
    $p$を素数とする。$\mathbb{Z}_p=\{x\in\mathbb{Q}_p:|x|_p\leq 1\}$は完備距離空間$\mathbb{Q}_p$の閉集合なので、完備である。

    全有界性を示す。$\varepsilon>0$をとり、$p^{-n}<\varepsilon$とする。$\mathbb{N}$は$\mathbb{Z}_p$で稠密なので、$x\in\mathbb{Z}_p$に対し$|x-a|_p\leq p^{-n}$となる自然数$a$がある。$a$を$p^n$で割った余り$a_0\in\{0,\dots,p^n-1\}$をとると、$|a-a_0|_p\leq p^{-n}$なので、$|x-a_0|_p\leq p^{-n}<\varepsilon$である。よって$p^n$個の点$0,\dots,p^n-1$を中心とする半径$\varepsilon$の球が$\mathbb{Z}_p$を覆う。

    完備かつ全有界な距離空間はコンパクトである。
  strategy: A closed subset of a complete space is complete; residues modulo p^n form finite nets.
  sketch:
  - 'derive: Z_p is closed in the complete space Q_p.'
  - 'construct: The integers from 0 to p^n - 1 form a finite ε-net.'
  - 'conclude: A complete totally bounded metric space is compact.'
  openmath: (forall (p) (-> (in p P) (and (compact_space (padic_integers p)) (complete_space (padic_integers p)))))
  hard_negative:
    statement: $\mathbb{Z}$は$p$進距離に関して完備である。
    reason: 整数列$\sum_{k\leq n}(-p)^k$は$p$進距離で Cauchy 列であり、$\mathbb{Q}_p$で$1/(1+p)$に収束する。$1+p\geq 3$なので、この極限は整数でない。
  target: |
    ∀ (p : ℕ) [Fact p.Prime], CompactSpace (PadicInt p) ∧ CompleteSpace (PadicInt p)
  proof: |
    by
      intro p _
      exact ⟨inferInstance, inferInstance⟩
- id: padic_field_locally_compact_not_compact
  kind: gap
  level: 3
  topic: p進数・Q_pの局所コンパクト性
  statement: 素数$p$について、$\mathbb{Q}_p$の任意の閉球はコンパクトであるが、$\mathbb{Q}_p$自身はコンパクトでない。
  statement_en: For a prime p, every closed ball of Q_p is compact, but Q_p itself is not compact.
  assumptions:
  - $p$は素数
  - $x\in\mathbb{Q}_p$、$r\in\mathbb{R}$
  quantifiers:
  - 任意の$p,x,r$
  conclusion: 閉球$\{y:|y-x|_p\leq r\}$はコンパクトで、$\mathbb{Q}_p$はコンパクトでない。
  answer: |
    $p$を素数、$x\in\mathbb{Q}_p$、$r\in\mathbb{R}$とする。$r<0$なら閉球は空集合でコンパクトである。$r\geq 0$なら、$p^k\geq r$となる整数$k$をとる。閉球は$x+p^{-k}\mathbb{Z}_p$に含まれる閉集合である。写像$y\mapsto x+p^{-k}y$は$\mathbb{Z}_p$から$x+p^{-k}\mathbb{Z}_p$への同相写像であり、$\mathbb{Z}_p$はコンパクトなので、$x+p^{-k}\mathbb{Z}_p$もコンパクトである。コンパクト集合の閉部分集合なので、閉球はコンパクトである。

    $|p^{-n}|_p=p^n$は$n$とともに非有界である。コンパクトな距離空間は有界なので、$\mathbb{Q}_p$はコンパクトでない。
  strategy: Closed balls sit inside scaled translates of the compact set Z_p, and Q_p is unbounded.
  sketch:
  - 'derive: A closed ball is closed in a translate of p^(-k) Z_p.'
  - 'apply_theorem: Z_p is compact and scaling is a homeomorphism.'
  - 'contradiction: The norms of p^(-n) are unbounded, so Q_p is not compact.'
  openmath: (forall (p x r) (-> (and (in p P) (in x (padic_field p)) (in r R)) (and (compact_in (closed_ball x r) (padic_field p)) (not (compact_space (padic_field p))))))
  hard_negative:
    statement: $\mathbb{Q}_p$の有界な部分集合はすべてコンパクトである。
    reason: $\mathbb{Z}_p\setminus\{0\}$は有界だが閉集合でなく、点列$p^n\to 0$の極限を含まないのでコンパクトでない。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (x : Padic p) (r : ℝ), IsCompact (Metric.closedBall x r) ∧ ¬ CompactSpace (Padic p)
  proof: |
    by
      intro p _ x r
      refine ⟨isCompact_closedBall x r, fun h => ?_⟩
      obtain ⟨C, hC⟩ := isBounded_iff_forall_norm_le.1 (isCompact_univ (X := Padic p)).isBounded
      obtain ⟨y, hy⟩ := NormedField.exists_lt_norm (Padic p) C
      exact absurd (hC y (Set.mem_univ y)) (not_le.2 hy)
- id: padic_summable_iff_tendsto_zero
  kind: gap
  level: 3
  topic: p進数・級数の収束判定
  statement: 素数$p$と$\mathbb{Q}_p$の点列$(a_n)$について、級数$\sum_na_n$が無条件に収束することと、$a_n\to 0$であることは同値である。
  statement_en: For a prime p and a sequence a_n in Q_p, the series of a_n is unconditionally summable if and only if a_n tends to 0.
  assumptions:
  - $p$は素数
  - $(a_n)$は$\mathbb{Q}_p$の点列
  quantifiers:
  - 任意の$p,(a_n)$
  conclusion: $\sum_na_n$の無条件収束と$a_n\to 0$は同値である。
  answer: |
    $p$を素数、$(a_n)$を$\mathbb{Q}_p$の点列とする。

    級数が無条件に収束すれば、部分和の差として$a_n\to 0$である。

    逆に$a_n\to 0$とする。$\varepsilon>0$に対し、$n\geq N$で$|a_n|_p<\varepsilon$となる$N$をとる。$\{0,\dots,N-1\}$と交わらない有限集合$S$について、超距離不等式より$|\sum_{n\in S}a_n|_p\leq\max_{n\in S}|a_n|_p<\varepsilon$である。よって有限部分和の網は Cauchy であり、$\mathbb{Q}_p$は完備なので収束する。すなわち級数は無条件に収束する。
  strategy: In an ultrametric complete space, the Cauchy criterion for finite sums reduces to the size of single terms.
  sketch:
  - 'derive: Summable series have terms tending to 0.'
  - 'derive: The ultrametric inequality bounds finite tail sums by the largest term.'
  - 'apply_theorem: Completeness of Q_p gives convergence of the Cauchy net.'
  openmath: (forall (p a) (-> (and (in p P) (padic_sequence a p)) (<-> (summable_sequence_qp p a) (seq_tends_to a 0))))
  hard_negative:
    statement: 実数の点列についても、$a_n\to 0$なら$\sum_na_n$は収束する。
    reason: $a_n=1/n$は$0$に収束するが、調和級数は発散する。超距離性が必要である。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (a : ℕ → Padic p), Summable a ↔ Filter.Tendsto a Filter.atTop (nhds 0)
  proof: |
    by
      intro p _ a
      refine ⟨Summable.tendsto_atTop_zero, fun h => ?_⟩
      apply NonarchimedeanAddGroup.summable_of_tendsto_cofinite_zero
      rwa [Nat.cofinite_eq_atTop]
- id: padic_geometric_series
  kind: gap
  level: 3
  topic: p進数・等比級数
  statement: 素数$p$と$|x|_p<1$である$x\in\mathbb{Q}_p$について、$\sum_{n\geq 0}x^n$は$\mathbb{Q}_p$で$(1-x)^{-1}$に収束する。
  statement_en: For a prime p and x in Q_p with |x|_p < 1, the series of x^n over n ≥ 0 converges in Q_p to (1 - x)^(-1).
  assumptions:
  - $p$は素数
  - $x\in\mathbb{Q}_p$、$|x|_p<1$
  quantifiers:
  - 任意の$p,x$
  conclusion: $\sum_{n\geq 0}x^n=(1-x)^{-1}$である。
  answer: |
    $p$を素数、$x\in\mathbb{Q}_p$、$|x|_p<1$とする。$|x^n|_p=|x|_p^n\to 0$なので、級数$\sum_nx^n$は無条件に収束する。$|1-x|_p=1$なので$1-x\neq 0$である。

    $(1-x)\sum_{k<n}x^k=1-x^n$より、部分和は$(1-x^n)(1-x)^{-1}$である。$x^n\to 0$なので、和は$(1-x)^{-1}$である。
  strategy: The terms tend to 0, and the telescoping identity identifies the limit.
  sketch:
  - 'derive: The norm of x^n tends to 0, so the series is summable.'
  - 'derive: Partial sums equal (1 - x^n)/(1 - x).'
  - 'conclude: Let n tend to infinity.'
  openmath: (forall (p x) (-> (and (in p P) (in x (padic_field p)) (< (padic_norm p x) 1)) (has_sum_fn (lambda (n) (^ x n)) (/ 1 (- 1 x)))))
  hard_negative:
    statement: $|x|_p=1$である$x\neq 1$についても$\sum_nx^n$は$(1-x)^{-1}$に収束する。
    reason: $p=3$、$x=-1$では$|x^n|_3=1$なので項が$0$に収束せず、級数は収束しない。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (x : Padic p), ‖x‖ < 1 → HasSum (fun n : ℕ => x ^ n) (1 - x)⁻¹
  proof: |
    by
      intro p _ x h
      exact hasSum_geometric_of_norm_lt_one h
- id: padic_converges_of_consecutive_diff
  kind: gap
  level: 3
  topic: p進数・点列の収束判定
  statement: 素数$p$と$\mathbb{Q}_p$の点列$(x_n)$について、$x_{n+1}-x_n\to 0$なら$(x_n)$は$\mathbb{Q}_p$で収束する。
  statement_en: For a prime p and a sequence x_n in Q_p, if x_(n+1) - x_n tends to 0, then x_n converges in Q_p.
  assumptions:
  - $p$は素数
  - $(x_n)$は$\mathbb{Q}_p$の点列
  - $x_{n+1}-x_n\to 0$
  quantifiers:
  - 任意の$p,(x_n)$
  - ある$L\in\mathbb{Q}_p$
  conclusion: $x_n\to L$である。
  answer: |
    $p$を素数、$(x_n)$を$\mathbb{Q}_p$の点列とし、$x_{n+1}-x_n\to 0$とする。$\varepsilon>0$に対し、$n\geq N$で$|x_{n+1}-x_n|_p<\varepsilon$となる$N$をとる。$m>n\geq N$なら、$x_m-x_n=\sum_{k=n}^{m-1}(x_{k+1}-x_k)$と超距離不等式より$|x_m-x_n|_p<\varepsilon$である。よって$(x_n)$は Cauchy 列であり、$\mathbb{Q}_p$は完備なので収束する。
  strategy: Telescoping and the ultrametric inequality turn the hypothesis into the Cauchy condition.
  sketch:
  - 'derive: Write x_m - x_n as a telescoping sum of consecutive differences.'
  - 'derive: The ultrametric inequality bounds it by the largest difference.'
  - 'apply_theorem: Completeness of Q_p gives the limit.'
  openmath: (forall (p x) (-> (and (in p P) (padic_sequence x p) (indexed_tends_to (lambda (n) (- (seq_value x (+ n 1)) (seq_value x n))) 0)) (exists (l) (and (in l (padic_field p)) (seq_tends_to x l)))))
  hard_negative:
    statement: 実数の点列でも$x_{n+1}-x_n\to 0$なら収束する。
    reason: $x_n=\sum_{k\leq n}1/k$は差が$0$に収束するが、発散する。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (x : ℕ → Padic p), Filter.Tendsto (fun n => x (n + 1) - x n) Filter.atTop (nhds 0) → ∃ L, Filter.Tendsto x Filter.atTop (nhds L)
  proof: |
    by
      intro p _ x h
      have hs : Summable (fun n => x (n + 1) - x n) := by
        apply NonarchimedeanAddGroup.summable_of_tendsto_cofinite_zero
        rwa [Nat.cofinite_eq_atTop]
      refine ⟨∑' n, (x (n + 1) - x n) + x 0, ?_⟩
      have h1 := hs.hasSum.tendsto_sum_nat
      have h2 := h1.add_const (x 0)
      refine h2.congr (fun n => ?_)
      rw [Finset.sum_range_sub]; ring
- id: padic_ball_any_center_clopen
  kind: gap
  level: 3
  topic: p進数・球の性質
  statement: 素数$p$、$x,y\in\mathbb{Q}_p$、$r\in\mathbb{R}$について、$y$が開球$B(x,r)=\{z:|z-x|_p<r\}$に属するなら$B(x,r)=B(y,r)$であり、$B(x,r)$は開かつ閉である。
  statement_en: For a prime p, x, y in Q_p and real r, if y lies in the open ball B(x, r), then B(x, r) = B(y, r), and B(x, r) is both open and closed.
  assumptions:
  - $p$は素数
  - $x,y\in\mathbb{Q}_p$、$r\in\mathbb{R}$
  - $|y-x|_p<r$
  quantifiers:
  - 任意の$p,x,y,r$
  conclusion: $B(x,r)=B(y,r)$であり、$B(x,r)$は開かつ閉である。
  answer: |
    $p$を素数、$x,y\in\mathbb{Q}_p$、$r\in\mathbb{R}$とし、$|y-x|_p<r$とする。

    $z\in B(x,r)$なら、超距離不等式より$|z-y|_p\leq\max(|z-x|_p,|x-y|_p)<r$なので$z\in B(y,r)$である。逆も同様なので$B(x,r)=B(y,r)$である。

    開球は開集合である。閉であることを示す。$w\notin B(x,r)$とする。$B(w,r)$と$B(x,r)$が共通点$z$をもつなら、前半より$B(w,r)=B(z,r)=B(x,r)$となり、$w\in B(w,r)$に反する（$r>0$である）。よって$B(w,r)$は$B(x,r)$の補集合に含まれる$w$の開近傍であり、補集合は開である。
  strategy: The ultrametric inequality makes every point a center; complementary points have disjoint balls.
  sketch:
  - 'derive: The ultrametric inequality shows B(x, r) is contained in B(y, r), and conversely.'
  - 'derive: Two balls of the same radius are either equal or disjoint.'
  - 'conclude: The complement is a union of open balls, so the ball is closed.'
  openmath: (forall (p x y r) (-> (and (in p P) (in x (padic_field p)) (in y (padic_field p)) (in r R) (in y (open_ball x r))) (and (= (open_ball x r) (open_ball y r)) (and (open_set (open_ball x r)) (closed_set (open_ball x r))))))
  hard_negative:
    statement: $\mathbb{R}$でも開球の任意の点を中心にとり直せる。
    reason: $\mathbb{R}$で$B(0,1)=(-1,1)$の点$1/2$を中心にすると$B(1/2,1)=(-1/2,3/2)$であり、異なる。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (x y : Padic p) (r : ℝ), y ∈ Metric.ball x r → Metric.ball x r = Metric.ball y r ∧ IsClopen (Metric.ball x r)
  proof: |
    by
      intro p _ x y r h
      exact ⟨IsUltrametricDist.ball_eq_of_mem h, IsUltrametricDist.isClopen_ball x r⟩
- id: padic_unit_ball_open_compact
  kind: gap
  level: 3
  topic: p進数・Q_pの中のZ_p
  statement: 素数$p$について、$\mathbb{Q}_p$の部分集合$\{x:|x|_p\leq 1\}$は開集合であり、かつコンパクトである。
  statement_en: For a prime p, the subset of x in Q_p with |x|_p ≤ 1 is open and compact.
  assumptions:
  - $p$は素数
  quantifiers:
  - 任意の素数$p$
  conclusion: $\{x:|x|_p\leq 1\}$は開かつコンパクトである。
  answer: |
    $p$を素数、$A=\{x\in\mathbb{Q}_p:|x|_p\leq 1\}$とする。$A$は$\mathbb{Z}_p$なのでコンパクトである。

    開であることを示す。$x\in A$、$|y-x|_p<1$とすると、超距離不等式より$|y|_p\leq\max(|y-x|_p,|x|_p)\leq 1$なので$y\in A$である。よって$x$を中心とする半径$1$の開球は$A$に含まれ、$A$は開集合である。
  strategy: The ultrametric inequality shows the closed unit ball contains an open ball around each of its points.
  sketch:
  - 'derive: The set is Z_p, which is compact.'
  - 'derive: Points within distance below 1 of a point of the set stay in the set.'
  openmath: (forall (p) (-> (in p P) (and (open_set (padic_unit_ball p)) (compact_in (padic_unit_ball p) (padic_field p)))))
  hard_negative:
    statement: $\mathbb{R}$の閉区間$[-1,1]$も開集合である。
    reason: $1$の任意の近傍は$1$より大きい実数を含むので、$[-1,1]$は開でない。
  target: |
    ∀ (p : ℕ) [Fact p.Prime], IsOpen {x : Padic p | ‖x‖ ≤ 1} ∧ IsCompact {x : Padic p | ‖x‖ ≤ 1}
  proof: |
    by
      intro p _
      have h : {x : Padic p | ‖x‖ ≤ 1} = Metric.closedBall 0 1 := by
        ext x; simp
      rw [h]
      exact ⟨(IsUltrametricDist.isClopen_closedBall 0 one_ne_zero).isOpen, isCompact_closedBall 0 1⟩
- id: padic_integers_ideals_powers_of_p
  kind: gap
  level: 3
  topic: p進数・Z_pのイデアル
  statement: 素数$p$について、$\mathbb{Z}_p$の極大イデアルは$(p)$であり、$0$でない任意のイデアルはある自然数$n$により$(p^n)$と書ける。
  statement_en: For a prime p, the maximal ideal of Z_p is (p), and every nonzero ideal of Z_p has the form (p^n) for some natural number n.
  assumptions:
  - $p$は素数
  - $I$は$\mathbb{Z}_p$の$0$でないイデアル
  quantifiers:
  - 任意の$p,I$
  - ある自然数$n$
  conclusion: $\mathbb{Z}_p$の極大イデアルは$(p)$であり、$I=(p^n)$である。
  answer: |
    $p$を素数とする。$x\in\mathbb{Z}_p$が単元であることは$|x|_p=1$と同値である。非単元は$|x|_p<1$、すなわち$|x|_p\leq p^{-1}$である元であり、このとき$|x/p|_p\leq 1$なので$x\in(p)$である。よって非単元の全体は$(p)$に等しく、これが唯一の極大イデアルである。

    $I$を$0$でないイデアルとする。$|x|_p$の値は$p^{-k}$（$k\geq 0$）の形なので、$I$の$0$でない元の$|x|_p$の最大値が存在する。それを$p^{-n}$とし、$x_0\in I$で達成されるとする。$u=x_0/p^n$は$|u|_p=1$なので単元であり、$p^n=u^{-1}x_0\in I$である。$y\in I$なら$|y|_p\leq p^{-n}$なので、$y/p^n\in\mathbb{Z}_p$であり$y\in(p^n)$である。よって$I=(p^n)$である。
  strategy: Divide by powers of p according to the norm; the element of largest norm generates the ideal.
  sketch:
  - 'derive: Nonunits are the elements of norm at most 1/p, that is, multiples of p.'
  - 'construct: In a nonzero ideal choose an element of largest norm p^(-n).'
  - 'derive: Dividing by a unit shows p^n lies in the ideal.'
  - 'conclude: Every other element is a multiple of p^n.'
  openmath: (forall (p I) (-> (and (in p P) (ideal_of I (padic_integers p)) (!= I 0)) (and (maximal_ideal (principal_ideal p) (padic_integers p)) (exists (n) (and (in n N) (= I (principal_ideal (^ p n))))))))
  hard_negative:
    statement: $\mathbb{Z}$の$0$でないイデアルも$(p^n)$の形である。
    reason: $\mathbb{Z}$のイデアル$(q)$（$q\neq p$は素数）は$(p^n)$の形でない。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (I : Ideal (PadicInt p)), I ≠ ⊥ → IsLocalRing.maximalIdeal (PadicInt p) = Ideal.span {(p : PadicInt p)} ∧ ∃ n : ℕ, I = Ideal.span {(p : PadicInt p) ^ n}
  proof: |
    by
      intro p _ I h
      exact ⟨PadicInt.maximalIdeal_eq_span_p, PadicInt.ideal_eq_span_pow_p h⟩
- id: padic_field_unit_mul_pow
  kind: gap
  level: 3
  topic: p進数・Q_pの元の標準形
  statement: 素数$p$と$\mathbb{Q}_p$の$0$でない元$x$について、$|u|_p=1$である$u\in\mathbb{Q}_p$と整数$n$で$x=up^n$となるものが存在する。
  statement_en: For a prime p and a nonzero x in Q_p, there are u in Q_p with |u|_p = 1 and an integer n such that x = u p^n.
  assumptions:
  - $p$は素数
  - $x\in\mathbb{Q}_p$、$x\neq 0$
  quantifiers:
  - 任意の$p,x$
  - ある$u\in\mathbb{Q}_p$と整数$n$
  conclusion: $|u|_p=1$かつ$x=up^n$である。
  answer: |
    $p$を素数、$x\in\mathbb{Q}_p$を$0$でない元とする。$p$進ノルムの$0$でない値は$p$の整数冪なので、$|x|_p=p^{-n}$となる整数$n$がある。$u=xp^{-n}$とおくと$|u|_p=|x|_p\,|p^{-n}|_p=p^{-n}p^{n}=1$であり、$x=up^n$である。
  strategy: Divide x by the power of p that has the same norm.
  sketch:
  - 'setup: Write |x|_p = p^(-n) with n an integer.'
  - 'construct: Let u = x p^(-n).'
  - 'conclude: Multiplicativity of the norm gives |u|_p = 1.'
  openmath: (forall (p x) (-> (and (in p P) (in x (padic_field p)) (!= x 0)) (exists (u n) (and (in u (padic_field p)) (in n Z) (= (padic_norm p u) 1) (= x (* u (^ p n)))))))
  hard_negative:
    statement: $\mathbb{Q}_p$の$0$でない元はすべて$x=p^n$の形である。
    reason: $p$と互いに素な整数$a\neq\pm 1$は$|a|_p=1$だが$p$の冪でない。単元の因子が必要である。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (x : Padic p), x ≠ 0 → ∃ (u : Padic p) (n : ℤ), ‖u‖ = 1 ∧ x = u * (p : Padic p) ^ n
  proof: |
    by
      intro p _ x hx
      have hp : (p : Padic p) ≠ 0 := by simpa using (Fact.out : p.Prime).ne_zero
      refine ⟨x * (p : Padic p) ^ (-x.valuation), x.valuation, ?_, ?_⟩
      · rw [norm_mul, Padic.norm_p_zpow, Padic.norm_eq_zpow_neg_valuation hx, ← zpow_add₀ (by exact_mod_cast (Fact.out : p.Prime).ne_zero)]
        simp
      · rw [mul_assoc, ← zpow_add₀ hp]; simp
- id: padic_integers_mod_power_quotient
  kind: textbook
  level: 3
  topic: p進数・Z_p/p^n
  statement: 素数$p$と自然数$n$について、還元準同型$\pi_n\colon\mathbb{Z}_p\to\mathbb{Z}/p^n\mathbb{Z}$は全射であり、その核は$(p^n)$である。ここで$\pi_n(x)$は$|x-a|_p\leq p^{-n}$となる自然数$a$の剰余類である。
  statement_en: For a prime p and a natural number n, the reduction homomorphism from Z_p to Z/p^n Z, sending x to the class of a natural number a with |x - a|_p ≤ p^(-n), is surjective with kernel (p^n).
  assumptions:
  - $p$は素数、$n\in\mathbb{N}$
  - $\pi_n$は還元準同型
  quantifiers:
  - 任意の$p,n$
  conclusion: $\pi_n$は全射で、$\ker\pi_n=(p^n)$である。
  answer: |
    $p$を素数、$n$を自然数とする。$\mathbb{N}$は$\mathbb{Z}_p$で稠密なので、$x\in\mathbb{Z}_p$に対し$|x-a|_p\leq p^{-n}$となる自然数$a$がある。$a'$も同じ条件を満たすと、$|a-a'|_p\leq p^{-n}$より$p^n\mid a-a'$である。よって$\pi_n(x)=a\bmod p^n$は定まる。和と積を保つことは超距離不等式から従う。

    自然数$a$については$\pi_n(a)=a\bmod p^n$なので、$\pi_n$は全射である。

    $x\in\ker\pi_n$は、$p^n\mid a$となる$a$で$|x-a|_p\leq p^{-n}$を満たす元である。$|a|_p\leq p^{-n}$なので$|x|_p\leq p^{-n}$である。これは$x/p^n\in\mathbb{Z}_p$、すなわち$x\in(p^n)$と同値である。逆に$x\in(p^n)$なら$|x-0|_p\leq p^{-n}$なので$\pi_n(x)=0$である。
  strategy: Density of the natural numbers makes the reduction well defined, and the kernel is read off from the norm.
  sketch:
  - 'construct: Define the reduction using natural approximations of x.'
  - 'derive: Natural numbers map onto Z/p^n Z, so the map is surjective.'
  - 'derive: x lies in the kernel iff |x|_p ≤ p^(-n), iff x is in (p^n).'
  openmath: (forall (p n) (-> (and (in p P) (in n N)) (and (surjective (reduction_mod_power p n)) (= (ring_kernel (reduction_mod_power p n)) (principal_ideal (^ p n))))))
  hard_negative:
    statement: 同じ還元で$\mathbb{Z}_p$は$\mathbb{Z}/q\mathbb{Z}$（$q\neq p$は素数）に環準同型で写る。
    reason: $q$は$\mathbb{Z}_p$の単元なので、$\mathbb{Z}/q\mathbb{Z}$への環準同型があると$q$の像が$0$かつ単元となり、$\mathbb{Z}/q\mathbb{Z}$が零環になって矛盾する。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (n : ℕ), Function.Surjective (PadicInt.toZModPow (p := p) n) ∧ RingHom.ker (PadicInt.toZModPow (p := p) n) = Ideal.span {(p : PadicInt p) ^ n}
  proof: |
    by
      intro p _ n
      refine ⟨fun a => ?_, PadicInt.ker_toZModPow n⟩
      obtain ⟨m, rfl⟩ := ZMod.natCast_zmod_surjective (n := p ^ n) a
      exact ⟨m, by simp⟩
- id: padic_integer_unique_digit
  kind: gap
  level: 3
  topic: p進数・最低桁
  statement: 素数$p$と$x\in\mathbb{Z}_p$について、$0\leq n<p$で$|x-n|_p<1$を満たす整数$n$がただ一つ存在する。
  statement_en: For a prime p and x in Z_p, there is exactly one integer n with 0 ≤ n < p and |x - n|_p < 1.
  assumptions:
  - $p$は素数
  - $x\in\mathbb{Z}_p$
  quantifiers:
  - 任意の$p,x$
  conclusion: $0\leq n<p$かつ$|x-n|_p<1$を満たす$n$がただ一つ存在する。
  answer: |
    $p$を素数、$x\in\mathbb{Z}_p$とする。$\mathbb{N}$は稠密なので、$|x-a|_p<1$となる自然数$a$がある。$a$を$p$で割った余りを$n$とすると$|a-n|_p\leq p^{-1}<1$なので、超距離不等式より$|x-n|_p<1$である。

    $0\leq n,n'<p$がともに条件を満たすとすると、超距離不等式より$|n-n'|_p<1$であり、$p\mid n-n'$である。$|n-n'|<p$なので$n=n'$である。
  strategy: Approximate by a natural number and reduce modulo p; uniqueness follows from divisibility by p.
  sketch:
  - 'construct: Take a natural number close to x and reduce it modulo p.'
  - 'derive: The ultrametric inequality preserves the closeness.'
  - 'derive: Two valid digits differ by a multiple of p of absolute value below p.'
  openmath: (forall (p x) (-> (and (in p P) (in x (padic_integers p))) (exists (n) (and (in n N) (< n p) (< (padic_norm p (- x n)) 1) (forall (m) (-> (and (in m N) (< m p) (< (padic_norm p (- x m)) 1)) (= m n)))))))
  hard_negative:
    statement: $0\leq n<p$の制限なしでも$|x-n|_p<1$となる自然数$n$はただ一つである。
    reason: $x=0$では$n=0$と$n=p$がともに条件を満たす。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (x : PadicInt p), ∃! n : ℕ, n < p ∧ ‖x - n‖ < 1
  proof: |
    by
      intro p _ x
      have := PadicInt.existsUnique_mem_range x
      simpa [IsLocalRing.mem_maximalIdeal, mem_nonunits_iff, PadicInt.not_isUnit_iff] using this
- id: padic_integers_inverse_limit_universal
  kind: textbook
  level: 3
  topic: p進数・Z_pの普遍性
  statement: 素数$p$と単位元をもつ半環$R$（乗法の結合律は仮定しない）、環準同型の族$f_n\colon R\to\mathbb{Z}/p^n\mathbb{Z}$が還元と両立するとする。すなわち$k_1\leq k_2$なら$f_{k_2}$を$\mathbb{Z}/p^{k_1}\mathbb{Z}$へ還元すると$f_{k_1}$である。このとき環準同型$g\colon R\to\mathbb{Z}_p$で、すべての$n$について$\pi_n\circ g=f_n$となるものがただ一つ存在する。
  statement_en: Let p be a prime, R a unital semiring without assumed associativity of multiplication and f_n from R to Z/p^n Z ring homomorphisms compatible with reductions. Then there is a unique ring homomorphism g from R to Z_p with π_n ∘ g = f_n for all n.
  assumptions:
  - $p$は素数
  - $R$は単位元をもつ半環
  - $(f_n)$は還元と両立する環準同型の族
  quantifiers:
  - 任意の$p,R,(f_n)$
  - ただ一つの$g$
  conclusion: すべての$n$で$\pi_n\circ g=f_n$である。
  answer: |
    $p$を素数、$R$を単位元をもつ半環、$(f_n)$を還元と両立する環準同型の族とする。$r\in R$に対し、$f_n(r)$の代表で$0\leq a_n<p^n$となる整数を$a_n$とする。両立性より$a_{n+1}\equiv a_n\pmod{p^n}$なので$|a_{n+1}-a_n|_p\leq p^{-n}\to 0$である。よって$(a_n)$は$\mathbb{Z}_p$で収束する。$g(r)=\lim_na_n$とおく。

    任意の$m\geq n$で$a_m\equiv a_n\pmod{p^n}$なので、極限をとると$|g(r)-a_n|_p\leq p^{-n}$である。よって$\pi_n(g(r))=f_n(r)$である。

    $g(r+s)-g(r)-g(s)$と$g(rs)-g(r)g(s)$は、すべての$n$で$\pi_n$の像が$0$なので、$p^n$で割り切れる。$\bigcap_n(p^n)=0$なので$0$であり、$g(1)=1$も同様である。よって$g$は環準同型である。

    一意性を示す。$g'$も条件を満たすとすると、すべての$n$で$\pi_n(g(r))=\pi_n(g'(r))$なので、$g(r)-g'(r)\in\bigcap_n(p^n)=0$である。
  strategy: Define g as the limit of compatible representatives and use that an element of Z_p is determined by its residues.
  sketch:
  - 'construct: Take representatives a_n of f_n(r) in the range 0 to p^n - 1.'
  - 'derive: Compatibility makes (a_n) converge, and the limit reduces to f_n(r).'
  - 'derive: Additivity and multiplicativity hold modulo every p^n, hence exactly.'
  - 'conclude: Uniqueness follows since the intersection of (p^n) is zero.'
  openmath: (forall (p A f) (-> (and (in p P) (compatible_mod_power_family f p)) (exists (g) (and (ring_hom g A (padic_integers p)) (forall (n) (-> (in n N) (= (ring_hom_comp (reduction_mod_power p n) g) (fn_value f n)))) (forall (h) (-> (and (ring_hom h A (padic_integers p)) (forall (n) (-> (in n N) (= (ring_hom_comp (reduction_mod_power p n) h) (fn_value f n))))) (= h g)))))))
  hard_negative:
    statement: 両立しない族$(f_n)$に対しても、すべての$n$で$\pi_n\circ g=f_n$となる$g$が存在する。
    reason: $R=\mathbb{Z}[X]$で$f_1(X)=0$、$f_2(X)=1$とすると、$\pi_1\circ g$は$\pi_2\circ g$の還元なので、$g$があれば$f_1(X)$は$f_2(X)=1$の還元に等しくなり矛盾する。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (R : Type*) [NonAssocSemiring R] (f : ∀ n : ℕ, R →+* ZMod (p ^ n)), (∀ (k₁ k₂ : ℕ) (hk : k₁ ≤ k₂), (ZMod.castHom (pow_dvd_pow p hk) (ZMod (p ^ k₁))).comp (f k₂) = f k₁) → ∃! g : R →+* PadicInt p, ∀ n, (PadicInt.toZModPow n).comp g = f n
  proof: |
    by
      intro p _ R _ f h
      exact ⟨PadicInt.lift h, PadicInt.lift_spec h, fun g hg => (PadicInt.lift_unique h g hg).symm⟩
- id: hensel_simple_root_padic
  kind: textbook
  level: 4
  topic: p進数・Hensel の補題の単純根の形
  statement: Hensel の補題の単純根の形。素数$p$、$F\in\mathbb{Z}_p[X]$、$a\in\mathbb{Z}_p$について、$|F(a)|_p<1$かつ$|F'(a)|_p=1$なら、$F(z)=0$かつ$|z-a|_p<1$を満たす$z\in\mathbb{Z}_p$がただ一つ存在する。これは一般形$|F(a)|_p<|F'(a)|_p^2$の特別な場合である。
  statement_en: Hensel's lemma for simple roots. For a prime p, F in Z_p[X] and a in Z_p, if |F(a)|_p < 1 and |F'(a)|_p = 1, there is a unique z in Z_p with F(z) = 0 and |z - a|_p < 1. This is the special case of the general form |F(a)|_p < |F'(a)|_p^2.
  assumptions:
  - $p$は素数
  - $F\in\mathbb{Z}_p[X]$、$a\in\mathbb{Z}_p$
  - $|F(a)|_p<1$、$|F'(a)|_p=1$
  quantifiers:
  - 任意の$p,F,a$
  - ただ一つの$z\in\mathbb{Z}_p$
  conclusion: $F(z)=0$かつ$|z-a|_p<1$である。
  answer: |
    $p$を素数、$F\in\mathbb{Z}_p[X]$、$a\in\mathbb{Z}_p$とし、$c=|F(a)|_p<1$、$|F'(a)|_p=1$とする。

    $F$は$\mathbb{Z}_p$係数なので、二項展開より、$x,h\in\mathbb{Z}_p$について$F(x+h)=F(x)+F'(x)h+h^2G(x,h)$（$G(x,h)\in\mathbb{Z}_p$）と書ける。同様に$x-y$は$\mathbb{Z}_p$で$F'(x)-F'(y)$を割るので、$|F'(x)-F'(y)|_p\leq|x-y|_p$である。よって$|x-a|_p<1$なら$|F'(x)-F'(a)|_p<1$であり、$|F'(x)|_p=1$である。これを（＊）とする。

    存在を示す。$a_0=a$、$a_{n+1}=a_n-F(a_n)/F'(a_n)$と定める。$n$についての帰納法で、$a_n\in\mathbb{Z}_p$、$|a_n-a|_p\leq c$、$|F(a_n)|_p\leq c^{2^n}$を示す。$n=0$では$a_0=a$、$|F(a)|_p=c$なので成り立つ。$n$で成り立つとする。（＊）より$|F'(a_n)|_p=1$なので、$h=-F(a_n)/F'(a_n)$は$\mathbb{Z}_p$の元で、$|h|_p=|F(a_n)|_p\leq c^{2^n}\leq c$である。超距離不等式より$|a_{n+1}-a|_p\leq\max(|a_n-a|_p,|h|_p)\leq c$である。展開式で$F(a_n)+F'(a_n)h=0$なので、$F(a_{n+1})=h^2G(a_n,h)$であり、$|F(a_{n+1})|_p\leq|h|_p^2\leq c^{2^{n+1}}$である。

    $c<1$なので$|a_{n+1}-a_n|_p\to 0$であり、$\mathbb{Z}_p$は完備なので$a_n$は$z\in\mathbb{Z}_p$に収束する。$F$は連続なので$F(z)=\lim_nF(a_n)=0$である。また$|z-a|_p\leq c<1$である。

    一意性を示す。$w\in\mathbb{Z}_p$が$F(w)=0$、$|w-a|_p<1$を満たすとし、$h=w-z$とおく。超距離不等式より$|h|_p<1$である。展開式より$0=F(w)=F(z)+F'(z)h+h^2G(z,h)=h(F'(z)+hG(z,h))$である。（＊）より$|F'(z)|_p=1$で、$|hG(z,h)|_p<1$なので、$|F'(z)+hG(z,h)|_p=1$である。よって$h=0$であり、$w=z$である。
  strategy: Run Newton's iteration from a, which converges quadratically because the derivative stays a unit on the residue disk.
  sketch:
  - 'derive: Taylor expansion over Z_p gives F(x+h) = F(x) + F''(x)h + h^2 G(x,h), and |F''(x)| = 1 whenever |x-a| < 1.'
  - 'construct: Define a_(n+1) = a_n - F(a_n)/F''(a_n).'
  - 'induction: |a_n - a| ≤ c and |F(a_n)| ≤ c^(2^n), where c = |F(a)| < 1.'
  - 'derive: The sequence converges in Z_p to a root z with |z - a| < 1.'
  - 'conclude: If w is another root in the disk, then h = w - z satisfies h(F''(z) + hG) = 0 with the second factor nonzero, so h = 0.'
  openmath: (forall (p F a) (-> (and (in p P) (in F (polynomial_ring (padic_integers p))) (in a (padic_integers p)) (< (padic_norm p (poly_eval F a)) 1) (= (padic_norm p (poly_eval (poly_derivative F) a)) 1)) (exists (z) (and (in z (padic_integers p)) (= (poly_eval F z) 0) (< (padic_norm p (- z a)) 1) (forall (w) (-> (and (in w (padic_integers p)) (= (poly_eval F w) 0) (< (padic_norm p (- w a)) 1)) (= w z)))))))
  hard_negative:
    statement: $|F(a)|_p<1$だけで、$a$の近くに$F$の根が存在する。
    reason: $p=3$、$F=X^2-3$、$a=0$では$|F(0)|_3=1/3<1$だが、$3$の$3$進付値が奇数なので$F$は$\mathbb{Z}_3$に根をもたない。$|F'(a)|_p=1$が必要である。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (F : Polynomial (PadicInt p)) (a : PadicInt p), ‖Polynomial.eval a F‖ < 1 → ‖Polynomial.eval a (Polynomial.derivative F)‖ = 1 → ∃! z : PadicInt p, Polynomial.eval z F = 0 ∧ ‖z - a‖ < 1
  proof: |
    by
      intro p _ F a h0 h1
      have hl : ‖Polynomial.aeval a F‖ < ‖Polynomial.aeval a (Polynomial.derivative F)‖ ^ 2 := by
        simpa [Polynomial.coe_aeval_eq_eval, h1] using h0
      obtain ⟨z, hz, hd, _, hu⟩ := hensels_lemma hl
      have h1' : ‖Polynomial.aeval a (Polynomial.derivative F)‖ = 1 := by simpa [Polynomial.coe_aeval_eq_eval] using h1
      rw [h1'] at hd hu
      refine ⟨z, ⟨by simpa [Polynomial.coe_aeval_eq_eval] using hz, hd⟩, ?_⟩
      rintro w ⟨hw, hwa⟩
      exact hu w (by simpa [Polynomial.coe_aeval_eq_eval] using hw) hwa
- id: hensel_square_root_odd_prime
  kind: gap
  level: 4
  topic: p進数・奇素数での平方根の持ち上げ
  statement: 奇素数$p$と$u,a\in\mathbb{Z}_p$について、$|u|_p=1$かつ$|a^2-u|_p<1$なら、$z^2=u$かつ$|z-a|_p<1$を満たす$z\in\mathbb{Z}_p$が存在する。
  statement_en: For an odd prime p and u, a in Z_p with |u|_p = 1 and |a^2 - u|_p < 1, there is z in Z_p with z^2 = u and |z - a|_p < 1.
  assumptions:
  - $p$は奇素数
  - $u,a\in\mathbb{Z}_p$、$|u|_p=1$、$|a^2-u|_p<1$
  quantifiers:
  - 任意の$p,u,a$
  - ある$z\in\mathbb{Z}_p$
  conclusion: $z^2=u$かつ$|z-a|_p<1$である。
  answer: |
    $p$を奇素数、$u,a\in\mathbb{Z}_p$とし、$|u|_p=1$、$|a^2-u|_p<1$とする。

    まず$|a|_p=1$を示す。$|a|_p<1$なら$|a^2|_p<1=|u|_p$なので、ノルムが異なる二元の和のノルムの公式より$|a^2-u|_p=1$となり、仮定に反する。

    $F=X^2-u$とする。$F(a)=a^2-u$より$|F(a)|_p<1$である。$F'(a)=2a$であり、$p$は奇数なので$|2|_p=1$である。よって$|F'(a)|_p=1$である。Hensel の補題の単純根の形より、$F(z)=0$かつ$|z-a|_p<1$となる$z$が存在する。
  strategy: Apply Hensel's lemma to X² - u at a, whose derivative has norm 1 for odd p.
  sketch:
  - 'derive: The hypotheses force |a|_p = 1.'
  - 'derive: For odd p, |2a|_p = 1.'
  - 'apply_theorem: Hensel''s lemma for simple roots gives z.'
  openmath: (forall (p u a) (-> (and (in p P) (!= p 2) (in u (padic_integers p)) (in a (padic_integers p)) (= (padic_norm p u) 1) (< (padic_norm p (- (^ a 2) u)) 1)) (exists (z) (and (in z (padic_integers p)) (= (^ z 2) u) (< (padic_norm p (- z a)) 1)))))
  hard_negative:
    statement: $p=2$でも同じ結論が成り立つ。
    reason: $p=2$、$u=3$、$a=1$では$|a^2-u|_2=1/2<1$だが、奇数の平方は$8$を法として$1$なので$3$は$\mathbb{Z}_2$で平方でない。
  target: |
    ∀ (p : ℕ) [Fact p.Prime], p ≠ 2 → ∀ (u a : PadicInt p), ‖u‖ = 1 → ‖a ^ 2 - u‖ < 1 → ∃ z : PadicInt p, z ^ 2 = u ∧ ‖z - a‖ < 1
  proof: |
    by
      intro p _ hp2 u a hu hau
      have hP := (Fact.out : p.Prime)
      have ha : ‖a‖ = 1 := by
        by_contra hne
        have hlt : ‖a‖ < 1 := lt_of_le_of_ne (PadicInt.norm_le_one a) hne
        have h2 : ‖a ^ 2‖ < 1 := by
          rw [norm_pow]; nlinarith [norm_nonneg a]
        have h3 : ‖a ^ 2 - u‖ = 1 := by
          have := PadicInt.norm_add_eq_max_of_ne (q := a ^ 2) (r := -u) (by rw [norm_neg, hu]; exact h2.ne)
          rw [← sub_eq_add_neg, norm_neg, hu, max_eq_right h2.le] at this
          exact this
        linarith
      have h2n : ‖(2 : PadicInt p)‖ = 1 := by
        have := PadicInt.norm_natCast_eq_one_iff (p := p) (n := 2)
        have h' := this.2 (((Nat.prime_two.coprime_iff_not_dvd).2 (fun h => hp2 ((Nat.prime_dvd_prime_iff_eq Nat.prime_two hP).1 h).symm)).symm)
        simpa using h'
      let F : Polynomial (PadicInt p) := Polynomial.X ^ 2 - Polynomial.C u
      have hF : ∀ z, Polynomial.eval z F = z ^ 2 - u := by intro z; simp [F]
      have hF' : Polynomial.eval a (Polynomial.derivative F) = 2 * a := by
        simp [F]; left; exact one_add_one_eq_two
      have hl : ‖Polynomial.aeval a F‖ < ‖Polynomial.aeval a (Polynomial.derivative F)‖ ^ 2 := by
        simp only [Polynomial.coe_aeval_eq_eval, hF, hF', norm_mul, h2n, ha]; simpa using hau
      obtain ⟨z, hz, hd, _, _⟩ := hensels_lemma hl
      simp only [Polynomial.coe_aeval_eq_eval, hF, hF', norm_mul, h2n, ha, one_mul] at hz hd
      exact ⟨z, sub_eq_zero.1 hz, hd⟩
- id: two_adic_square_one_mod_eight
  kind: gap
  level: 4
  topic: p進数・2進の平方
  statement: $u\in\mathbb{Z}_2$が$|u-1|_2\leq 1/8$（$u\equiv 1\pmod 8$）を満たすなら、$z^2=u$となる$z\in\mathbb{Z}_2$が存在する。
  statement_en: If u in Z_2 satisfies |u - 1|_2 ≤ 1/8, that is u ≡ 1 mod 8, then u = z^2 for some z in Z_2.
  assumptions:
  - $u\in\mathbb{Z}_2$
  - $|u-1|_2\leq 1/8$
  quantifiers:
  - 任意の$u\in\mathbb{Z}_2$
  - ある$z\in\mathbb{Z}_2$
  conclusion: $z^2=u$である。
  answer: |
    $u\in\mathbb{Z}_2$、$|u-1|_2\leq 1/8$とする。$F=X^2-u$、$a=1$とおく。$F(1)=1-u$より$|F(1)|_2\leq 1/8$である。$F'(1)=2$より$|F'(1)|_2^2=1/4$である。$1/8<1/4$なので Hensel の補題の一般形が適用でき、$F(z)=0$となる$z\in\mathbb{Z}_2$が存在する。すなわち$z^2=u$である。
  strategy: Apply the general form of Hensel's lemma at a = 1.
  sketch:
  - 'setup: Take F = X² - u and a = 1.'
  - 'derive: |F(1)|_2 ≤ 1/8 and |F''(1)|_2² = 1/4.'
  - 'apply_theorem: Hensel''s inequality holds, which gives a root.'
  openmath: (forall (u) (-> (and (in u (padic_integers 2)) (<= (padic_norm 2 (- u 1)) (/ 1 8))) (exists (z) (and (in z (padic_integers 2)) (= (^ z 2) u)))))
  hard_negative:
    statement: $|u-1|_2\leq 1/4$なら$u$は$\mathbb{Z}_2$で平方である。
    reason: $u=5$では$|u-1|_2=1/4$だが、奇数の平方は$8$を法として$1$なので$5$は平方でない。
  target: |
    ∀ (u : PadicInt 2), ‖u - 1‖ ≤ 1 / 8 → ∃ z : PadicInt 2, z ^ 2 = u
  proof: |
    by
      intro u hu
      let F : Polynomial (PadicInt 2) := Polynomial.X ^ 2 - Polynomial.C u
      have hF : ∀ z, Polynomial.eval z F = z ^ 2 - u := by intro z; simp [F]
      have hF' : Polynomial.eval (1 : PadicInt 2) (Polynomial.derivative F) = 2 := by
        simp [F]; exact one_add_one_eq_two
      have h2 : ‖(2 : PadicInt 2)‖ = 1 / 2 := by
        have := PadicInt.norm_p (p := 2)
        simpa using this
      have hl : ‖Polynomial.aeval (1 : PadicInt 2) F‖ < ‖Polynomial.aeval (1 : PadicInt 2) (Polynomial.derivative F)‖ ^ 2 := by
        simp only [Polynomial.coe_aeval_eq_eval, hF, hF', h2]
        have : ‖(1 : PadicInt 2) ^ 2 - u‖ = ‖u - 1‖ := by rw [one_pow, norm_sub_rev]
        rw [this]; linarith
      obtain ⟨z, hz, _, _, _⟩ := hensels_lemma hl
      simp only [Polynomial.coe_aeval_eq_eval, hF] at hz
      exact ⟨z, sub_eq_zero.1 hz⟩
- id: padic_teichmuller_root_of_unity
  kind: gap
  level: 4
  topic: p進数・Teichmüller 代表
  statement: 素数$p$と$|a|_p=1$である$a\in\mathbb{Z}_p$について、$z^{p-1}=1$かつ$|z-a|_p<1$を満たす$z\in\mathbb{Z}_p$がただ一つ存在する。
  statement_en: For a prime p and a in Z_p with |a|_p = 1, there is a unique z in Z_p with z^(p-1) = 1 and |z - a|_p < 1.
  assumptions:
  - $p$は素数
  - $a\in\mathbb{Z}_p$、$|a|_p=1$
  quantifiers:
  - 任意の$p,a$
  - ただ一つの$z\in\mathbb{Z}_p$
  conclusion: $z^{p-1}=1$かつ$|z-a|_p<1$である。
  answer: |
    $p$を素数、$a\in\mathbb{Z}_p$、$|a|_p=1$とする。$F=X^{p-1}-1$とおく。

    $a$は単元なので、$\mathbb{F}_p$への還元$\bar a$は$0$でなく、Fermat の小定理より$\bar a^{p-1}=1$である。よって$a^{p-1}-1$は還元が$0$であり、$|F(a)|_p<1$である。

    $F'(a)=(p-1)a^{p-2}$である。$p-1$は$p$と互いに素なので$|p-1|_p=1$であり、$|a|_p=1$なので$|F'(a)|_p=1$である（$p=2$なら$F'(a)=1$である）。

    Hensel の補題の単純根の形より、$F(z)=0$かつ$|z-a|_p<1$となる$z$がただ一つ存在する。
  strategy: Apply Hensel's lemma to X^(p-1) - 1, using Fermat's little theorem at a.
  sketch:
  - 'derive: Fermat''s little theorem gives |a^(p-1) - 1|_p < 1.'
  - 'derive: The derivative (p-1) a^(p-2) has norm 1.'
  - 'apply_theorem: Hensel''s lemma for simple roots gives a unique lift.'
  openmath: (forall (p a) (-> (and (in p P) (in a (padic_integers p)) (= (padic_norm p a) 1)) (exists (z) (and (in z (padic_integers p)) (= (^ z (- p 1)) 1) (< (padic_norm p (- z a)) 1) (forall (w) (-> (and (in w (padic_integers p)) (= (^ w (- p 1)) 1) (< (padic_norm p (- w a)) 1)) (= w z)))))))
  hard_negative:
    statement: $|a|_p<1$である$a$についても、同じ条件を満たす$z$が存在する。
    reason: $z^{p-1}=1$なら$|z|_p=1$なので、$|a|_p<1$のとき$|z-a|_p=1$となり、条件を満たさない。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (a : PadicInt p), ‖a‖ = 1 → ∃! z : PadicInt p, z ^ (p - 1) = 1 ∧ ‖z - a‖ < 1
  proof: |
    by
      intro p _ a ha
      have hP := (Fact.out : p.Prime)
      let F : Polynomial (PadicInt p) := Polynomial.X ^ (p - 1) - 1
      have hF : ∀ z, Polynomial.eval z F = z ^ (p - 1) - 1 := by intro z; simp [F]
      have hF' : Polynomial.eval a (Polynomial.derivative F) = ((p - 1 : ℕ) : PadicInt p) * a ^ (p - 2) := by
        simp [F, Polynomial.derivative_X_pow]
        exact Or.inl (by rw [Nat.sub_sub])
      have h0 : ‖a ^ (p - 1) - 1‖ < 1 := by
        have hu : PadicInt.toZMod a ≠ 0 := by
          intro h
          have hm : a ∈ IsLocalRing.maximalIdeal (PadicInt p) := by
            rw [← PadicInt.ker_toZMod]; exact h
          have := (IsLocalRing.mem_maximalIdeal a).1 hm
          exact this (PadicInt.isUnit_iff.2 ha)
        have h1 : PadicInt.toZMod (a ^ (p - 1) - 1) = 0 := by
          simp [ZMod.pow_card_sub_one_eq_one hu]
        have hm : a ^ (p - 1) - 1 ∈ IsLocalRing.maximalIdeal (PadicInt p) := by
          rw [← PadicInt.ker_toZMod]; exact h1
        exact PadicInt.not_isUnit_iff.1 ((IsLocalRing.mem_maximalIdeal _).1 hm)
      have h1 : ‖((p - 1 : ℕ) : PadicInt p) * a ^ (p - 2)‖ = 1 := by
        rw [norm_mul, norm_pow, ha, one_pow, mul_one, PadicInt.norm_natCast_p_sub_one]
      have hl : ‖Polynomial.aeval a F‖ < ‖Polynomial.aeval a (Polynomial.derivative F)‖ ^ 2 := by
        simp only [Polynomial.coe_aeval_eq_eval, hF, hF', h1]; simpa using h0
      obtain ⟨z, hz, hd, _, hu⟩ := hensels_lemma hl
      simp only [Polynomial.coe_aeval_eq_eval, hF, hF', h1] at hz hd hu
      refine ⟨z, ⟨sub_eq_zero.1 hz, hd⟩, ?_⟩
      rintro w ⟨hw, hwa⟩
      exact hu w (by simp [hw]) hwa
- id: padic_integers_neg_one_square_iff
  kind: gap
  level: 4
  topic: p進数・-1 の平方根
  statement: 奇素数$p$について、$\mathbb{Z}_p$に$z^2=-1$となる元が存在するための必要十分条件は、$p\equiv 1\pmod 4$である。
  statement_en: For an odd prime p, there is z in Z_p with z^2 = -1 if and only if p ≡ 1 mod 4.
  assumptions:
  - $p$は奇素数
  quantifiers:
  - 任意の奇素数$p$
  conclusion: $\mathbb{Z}_p$に$-1$の平方根が存在することと$p\equiv 1\pmod 4$は同値である。
  answer: |
    $p$を奇素数とする。$-1$が$\mathbb{F}_p$で平方であることは、$p\equiv 1\pmod 4$と同値である（第1補充法則）。

    $z\in\mathbb{Z}_p$が$z^2=-1$を満たすなら、$\mathbb{F}_p$への還元は$-1$の平方根である。よって$p\equiv 1\pmod 4$である。

    逆に$p\equiv 1\pmod 4$とする。整数$n$で$n^2\equiv -1\pmod p$となるものがある。$u=-1$、$a=n$とおくと$|u|_p=1$、$|a^2-u|_p<1$である。奇素数での平方根の持ち上げより、$z^2=-1$となる$z\in\mathbb{Z}_p$が存在する。
  strategy: Reduce modulo p for one direction and lift a square root by Hensel's lemma for the other.
  sketch:
  - 'apply_theorem: -1 is a square mod p iff p ≡ 1 mod 4.'
  - 'derive: A square root in Z_p reduces to one mod p.'
  - 'apply_theorem: Hensel''s lemma lifts a square root mod p to Z_p.'
  openmath: (forall (p) (-> (and (in p P) (!= p 2)) (<-> (exists (z) (and (in z (padic_integers p)) (= (^ z 2) (neg 1)))) (dvd 4 (- p 1)))))
  hard_negative:
    statement: $-1$はすべての奇素数$p$で$\mathbb{Z}_p$の平方である。
    reason: $p=3$では$\mathbb{F}_3$の平方は$0,1$だけで、$-1\equiv 2$は平方でない。
  target: |
    ∀ (p : ℕ) [Fact p.Prime], p ≠ 2 → ((∃ z : PadicInt p, z ^ 2 = -1) ↔ p % 4 = 1)
  proof: |
    by
      intro p _ hp2
      have hP := (Fact.out : p.Prime)
      have hodd : p % 2 = 1 := hP.eq_two_or_odd.resolve_left hp2
      have hmod : p % 4 ≠ 3 ↔ p % 4 = 1 := by omega
      rw [← hmod, ← ZMod.exists_sq_eq_neg_one_iff]
      constructor
      · rintro ⟨z, hz⟩
        refine ⟨PadicInt.toZMod z, ?_⟩
        have := congrArg PadicInt.toZMod hz
        simp only [map_pow, map_neg, map_one] at this
        rw [← this, sq]
      · rintro ⟨y, hy⟩
        obtain ⟨n, rfl⟩ := ZMod.natCast_zmod_surjective y
        let a : PadicInt p := n
        let u : PadicInt p := -1
        have hu : ‖u‖ = 1 := by simp [u]
        have h1 : PadicInt.toZMod (a ^ 2 - u) = 0 := by
          simp only [a, u, map_sub, map_pow, map_neg, map_one, map_natCast]
          rw [sq, ← hy]; simp
        have hm : a ^ 2 - u ∈ IsLocalRing.maximalIdeal (PadicInt p) := by
          rw [← PadicInt.ker_toZMod]; exact h1
        have hlt : ‖a ^ 2 - u‖ < 1 := PadicInt.not_isUnit_iff.1 ((IsLocalRing.mem_maximalIdeal _).1 hm)
        have ha : ‖a‖ = 1 := by
          by_contra hne
          have hl : ‖a‖ < 1 := lt_of_le_of_ne (PadicInt.norm_le_one a) hne
          have h2 : ‖a ^ 2‖ < 1 := by rw [norm_pow]; nlinarith [norm_nonneg a]
          have h3 : ‖a ^ 2 - u‖ = 1 := by
            have := PadicInt.norm_add_eq_max_of_ne (q := a ^ 2) (r := -u) (by rw [norm_neg, hu]; exact h2.ne)
            rw [← sub_eq_add_neg, norm_neg, hu, max_eq_right h2.le] at this
            exact this
          linarith
        have h2n : ‖(2 : PadicInt p)‖ = 1 := by
          have := PadicInt.norm_natCast_eq_one_iff (p := p) (n := 2)
          have h' := this.2 (((Nat.prime_two.coprime_iff_not_dvd).2 (fun h => hp2 ((Nat.prime_dvd_prime_iff_eq Nat.prime_two hP).1 h).symm)).symm)
          simpa using h'
        let F : Polynomial (PadicInt p) := Polynomial.X ^ 2 - Polynomial.C u
        have hF : ∀ z, Polynomial.eval z F = z ^ 2 - u := by intro z; simp [F]
        have hF' : Polynomial.eval a (Polynomial.derivative F) = 2 * a := by
          simp [F]; left; exact one_add_one_eq_two
        have hl : ‖Polynomial.aeval a F‖ < ‖Polynomial.aeval a (Polynomial.derivative F)‖ ^ 2 := by
          simp only [Polynomial.coe_aeval_eq_eval, hF, hF', norm_mul, h2n, ha]; simpa using hlt
        obtain ⟨z, hz, _, _, _⟩ := hensels_lemma hl
        simp only [Polynomial.coe_aeval_eq_eval, hF] at hz
        exact ⟨z, sub_eq_zero.1 hz⟩
- id: ostrowski_theorem_rationals
  kind: named
  level: 4
  topic: p進数・Ostrowski の定理
  statement: Ostrowski の定理。$\mathbb{Q}$上の自明でない絶対値$f$は、通常の絶対値と同値であるか、ただ一つの素数$p$に対する$p$進絶対値と同値である。ここで同値とは、ある$c>0$で$f^c$がもう一方に等しいことである。
  statement_en: Ostrowski's theorem. A nontrivial absolute value f on Q is equivalent to the usual absolute value or to the p-adic absolute value for exactly one prime p, where equivalence means that f^c equals the other for some c > 0.
  assumptions:
  - $f$は$\mathbb{Q}$上の自明でない実数値絶対値
  quantifiers:
  - 任意の$f$
  - ただ一つの素数$p$
  conclusion: $f$は通常の絶対値と同値か、$p$進絶対値と同値である。
  answer: |
    $f$を$\mathbb{Q}$上の自明でない絶対値とする。$f(n)$の性質で場合を分ける。

    ある自然数$n$で$f(n)>1$の場合を考える。整数$a,b\geq 2$をとる。$b^k$を$a$進展開すると桁数は$k\log_ab+1$以下で、各桁$d<a$は$f(d)\leq d<a$を満たす。よって$f(b^k)\leq(k\log_ab+1)\,a\max(1,f(a))^{k\log_ab}$である。$k$乗根をとって$k\to\infty$とすると、$f(b)\leq\max(1,f(a))^{\log_ab}$である。$b=n$とすると$f(a)>1$がすべての$a\geq 2$で従う。よって$f(b)\leq f(a)^{\log_ab}$であり、$a,b$を入れ替えて等号を得る。したがって$\log f(a)/\log a$は定数$s>0$であり、$f(n)=n^s$である。乗法性より$\mathbb{Q}$全体で$f=|\cdot|^s$であり、通常の絶対値と同値である。

    すべての自然数$n$で$f(n)\leq 1$の場合を考える。$f(x+y)^k=f((x+y)^k)\leq(k+1)\max(f(x),f(y))^k$の$k$乗根から超距離不等式を得る。$f$は自明でないので、$f(n)<1$となる$n\geq 1$がある。$\{n\in\mathbb{Z}:f(n)<1\}$は$\mathbb{Z}$の$0$でない素イデアルなので、素数$p$で$(p)$と書ける。$p\nmid m$なら$f(m)=1$なので、$f(n)=f(p)^{v_p(n)}$である。$s=-\log f(p)/\log p>0$とおくと$f=|\cdot|_p^s$であり、$p$進絶対値と同値である。

    一意性を示す。同値な絶対値では$\{x:f(x)<1\}$が一致する。$p\neq q$なら$|p|_p<1$、$|p|_q=1$なので、$p$進絶対値と$q$進絶対値は同値でない。
  strategy: Separate the unbounded case, handled by base expansions, from the bounded case, where the absolute value is ultrametric and determined by one prime.
  sketch:
  - 'case_split: Some natural number has f(n) > 1, or none does.'
  - 'derive: In the first case base expansions give f(b) = f(a)^(log_a b), so f = |·|^s.'
  - 'derive: In the second case f is ultrametric, and the integers with f < 1 form a prime ideal (p).'
  - 'derive: Then f(n) = f(p)^(v_p(n)), so f is a power of the p-adic absolute value.'
  - 'conclude: Different primes give inequivalent absolute values.'
  openmath: (forall (f) (-> (rational_absolute_value f) (or (absolute_value_equivalent f usual_absolute_value) (exists (p) (and (in p P) (absolute_value_equivalent f (padic_absolute_value p)) (forall (q) (-> (and (in q P) (absolute_value_equivalent f (padic_absolute_value q))) (= q p))))))))
  hard_negative:
    statement: $\mathbb{Q}$上の自明でない絶対値は、通常の絶対値か$p$進絶対値に等しい。
    reason: $|\cdot|^{1/2}$は自明でない絶対値だが、通常の絶対値にも$p$進絶対値にも等しくない。同値までしか定まらない。
  target: |
    ∀ (f : AbsoluteValue ℚ ℝ), f.IsNontrivial → f.IsEquiv Rat.AbsoluteValue.real ∨ ∃! p : ℕ, ∃ _ : Fact p.Prime, f.IsEquiv (Rat.AbsoluteValue.padic p)
  proof: |
    by
      intro f hf
      exact Rat.AbsoluteValue.equiv_real_or_padic f hf
- id: mahler_expansion_padic
  kind: named
  level: 4
  topic: p進数・Mahler の定理
  statement: Mahler の定理。素数$p$、$\mathbb{Z}_p$上の完備な超距離ノルム加群$E$、連続写像$f\colon\mathbb{Z}_p\to E$について、$\Delta f(x)=f(x+1)-f(x)$とおくと、$\Delta^nf(0)\to 0$であり、$f=\sum_{n\geq 0}\binom{x}{n}\Delta^nf(0)$は$\mathbb{Z}_p$上で一様収束する。ここでスカラー倍はノルムについて有界である。
  statement_en: Mahler's theorem. For a prime p, a complete ultrametric normed Z_p-module E with bounded scalar action and a continuous f from Z_p to E, with Δf(x) = f(x+1) - f(x), the elements Δ^n f(0) tend to 0, and f is the uniformly convergent sum of binomial(x, n) Δ^n f(0).
  assumptions:
  - $p$は素数
  - $E$は$\mathbb{Z}_p$上の完備な超距離ノルム加群で、スカラー倍は有界
  - $f\colon\mathbb{Z}_p\to E$は連続
  quantifiers:
  - 任意の$p,E,f$
  conclusion: $\Delta^nf(0)\to 0$であり、$f=\sum_n\binom{x}{n}\Delta^nf(0)$は一様収束する。
  answer: |
    $p$を素数、$E$を仮定を満たす加群、$f\colon\mathbb{Z}_p\to E$を連続写像とする。$T$を$Tf(x)=f(x+1)$で定めると、$\Delta=T-1$である。$\mathbb{Z}_p$はコンパクトなので$f$は有界で一様連続であり、$\|f\|=\sup_x\|f(x)\|$とおく。

    二項定理より$\Delta^{p^s}=(T-1)^{p^s}=T^{p^s}-1+pA$であり、$A$は$T$の整数係数の多項式である（$p=2$での符号の違いも$pA$に含める）。$\|p\,v\|\leq p^{-1}\|v\|$なので、任意の連続写像$g$で$\|\Delta^{p^s}g\|\leq\max(\|(T^{p^s}-1)g\|,p^{-1}\|g\|)$である。$g$は一様連続なので、$s$を大きくとれば$\|(T^{p^s}-1)g\|\leq p^{-1}\|g\|$であり、$\|\Delta^{p^s}g\|\leq p^{-1}\|g\|$となる。

    これを$g=f$から繰り返すと、任意の$k$に対し$\|\Delta^{m}f\|\leq p^{-k}\|f\|$となる$m$がある。超距離不等式より$\|\Delta h\|\leq\|h\|$なので、$\|\Delta^nf\|$は単調減少であり$0$に収束する。特に$\Delta^nf(0)\to 0$である。

    二項係数$\binom{x}{n}$は$\mathbb{N}$上で整数値をとるので、$\mathbb{N}$の稠密性から$\mathbb{Z}_p$上で連続に$\mathbb{Z}_p$の値をとる。よって項のノルムは$\|\Delta^nf(0)\|$以下であり、級数$g=\sum_n\binom{x}{n}\Delta^nf(0)$は一様収束して連続である。$x\in\mathbb{N}$では Newton の前進差分公式より$g(x)=f(x)$である。$\mathbb{N}$は稠密なので$g=f$である。
  strategy: Show iterated differences tend to 0 using (T-1)^(p^s) ≡ T^(p^s) ± 1 mod p and uniform continuity, then compare with f on the dense set of natural numbers.
  sketch:
  - 'derive: Modulo p the operator Δ^(p^s) is T^(p^s) ± 1.'
  - 'derive: Uniform continuity makes (T^(p^s) - 1)g small, so differences of high order have small norm.'
  - 'derive: Hence Δ^n f(0) tends to 0 and the series converges uniformly since binomials have norm at most 1.'
  - 'conclude: Newton''s formula gives equality on N, and density gives equality on Z_p.'
  openmath: (forall (p E f) (-> (and (in p P) (ultrametric_complete_module E p) (continuous_between f (padic_integers p) E)) (and (indexed_tends_to (lambda (n) (iterated_difference_at_zero f n)) 0) (mahler_series_uniformly f p))))
  hard_negative:
    statement: 連続写像$f\colon\mathbb{Z}_p\to\mathbb{Q}_p$は$\mathbb{Z}_p$上の多項式である。
    reason: 連続写像は Mahler 級数で表されるが、$\Delta^nf(0)$が無限個$0$でない場合は多項式でない。例えば$\sum_np^n\binom{x}{n}$である。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (E : Type*) [NormedAddCommGroup E] [Module (PadicInt p) E] [IsBoundedSMul (PadicInt p) E] [IsUltrametricDist E] [CompleteSpace E] (f : C(PadicInt p, E)), Filter.Tendsto (fun n : ℕ => (fwdDiff (1 : PadicInt p))^[n] f 0) Filter.atTop (nhds 0) ∧ HasSum (fun n : ℕ => PadicInt.mahlerTerm ((fwdDiff (1 : PadicInt p))^[n] f 0) n) f
  proof: |
    by
      intro p _ E _ _ _ _ _ f
      exact ⟨PadicInt.fwdDiff_tendsto_zero f, PadicInt.hasSum_mahler f⟩
- id: witt_frobenius_verschiebung_eq_mul_p
  kind: gap
  level: 4
  topic: Witt ベクトル・FとVの関係
  statement: 素数$p$と可換環$R$について、$p$進 Witt ベクトル環$W(R)$の元$x$は$F(V(x))=xp$を満たす。ここで$F$は Frobenius、$V$は Verschiebung である。
  statement_en: For a prime p and a commutative ring R, every p-typical Witt vector x over R satisfies F(V(x)) = x p, where F is Frobenius and V is Verschiebung.
  assumptions:
  - $p$は素数
  - $R$は可換環
  - $x\in W(R)$
  quantifiers:
  - 任意の$p,R,x$
  conclusion: $F(V(x))=xp$である。
  answer: |
    $p$を素数、$R$を可換環、$x\in W(R)$とする。$F$、$V$、環演算の各成分は、$x$の成分についての整数係数の普遍多項式で与えられる。よって$F(V(x))-xp$の各成分も普遍多項式である。これが$0$であることは、$R=\mathbb{Z}[x_0,x_1,\dots]$で$x=(x_0,x_1,\dots)$の場合に示せばよい。一般の$R$と$x$へは、$x_i$を$x$の成分に送る環準同型で移せるからである。

    $\mathbb{Z}[x_0,x_1,\dots]$は$p$倍が単射な環なので、ゴースト成分の写像$(w_n)_n$が単射である。$w_n(x)=\sum_{i\leq n}p^ix_i^{p^{n-i}}$であり、$w_n(F(y))=w_{n+1}(y)$、$w_{n+1}(V(y))=pw_n(y)$である。よって$w_n(F(V(x)))=w_{n+1}(V(x))=pw_n(x)=w_n(xp)$であり、$F(V(x))=xp$である。
  strategy: Reduce to a universal torsion-free ring and compare ghost components.
  sketch:
  - 'translate: Components of F(V(x)) - xp are universal integer polynomials.'
  - 'derive: It suffices to work over a polynomial ring over Z, where the ghost map is injective.'
  - 'derive: Ghost components satisfy w_n(FV(x)) = p w_n(x).'
  - 'conclude: Hence F(V(x)) = xp.'
  openmath: (forall (p A x) (-> (and (in p P) (comm_ring A) (in x (witt_vectors p A))) (= (witt_frobenius (witt_verschiebung x)) (* x p))))
  hard_negative:
    statement: 一般の可換環$R$で$V(F(x))=xp$も成り立つ。
    reason: $R=\mathbb{Z}$では$V(F(x))$の$0$成分は$0$だが、$x=1$なら$p\in W(\mathbb{Z})$の$0$成分は$p$である。標数$p$の仮定が必要である。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (R : Type*) [CommRing R] (x : WittVector p R), WittVector.frobenius (WittVector.verschiebung x) = x * p
  proof: |
    by
      intro p _ R _ x
      exact WittVector.frobenius_verschiebung x
- id: witt_iterated_verschiebung_frobenius
  kind: gap
  level: 4
  topic: Witt ベクトル・標数pでのVF
  statement: 素数$p$と標数$p$の可換環$R$について、$x\in W(R)$と自然数$n$に対し$V^n(F^n(x))=xp^n$である。
  statement_en: For a prime p and a commutative ring R of characteristic p, every x in W(R) and natural number n satisfy V^n(F^n(x)) = x p^n.
  assumptions:
  - $p$は素数
  - $R$は標数$p$の可換環
  - $x\in W(R)$、$n\in\mathbb{N}$
  quantifiers:
  - 任意の$p,R,x,n$
  conclusion: $V^n(F^n(x))=xp^n$である。
  answer: |
    $p$を素数、$R$を標数$p$の可換環、$x\in W(R)$とする。標数$p$では$F$は成分ごとの$p$乗であり、$V$は成分を一つずらすので、$F$と$V$は可換である。よって$F(V(y))=yp$（任意の$y\in W(R)$）から$V(F(y))=yp$である。

    $n$についての帰納法で示す。$n=0$では両辺とも$x$である。$n$で成り立つとすると、$V^{n+1}(F^{n+1}(x))=V^n(V(F(F^n(x))))=V^n(F^n(x)\,p)$である。$V^n$は加法的なので$V^n(yp)=V^n(y)p$であり、$V^n(F^n(x)p)=V^n(F^n(x))p=xp^np=xp^{n+1}$である。
  strategy: In characteristic p, F and V commute, so VF = p, and induction gives the iterated form.
  sketch:
  - 'derive: In characteristic p, F and V commute, so V(F(y)) = y p.'
  - 'induction: Peel off one V and F and use additivity of V^n.'
  openmath: (forall (p A x n) (-> (and (in p P) (comm_ring A) (ring_characteristic A p) (in x (witt_vectors p A)) (in n N)) (= (witt_iterated_verschiebung_frobenius x n) (* x (^ p n)))))
  hard_negative:
    statement: 標数$p$の仮定がなくても$V^n(F^n(x))=xp^n$である。
    reason: $R=\mathbb{Z}$、$n=1$、$x=1$では左辺の$0$成分は$0$だが、右辺$p$の$0$成分は$p$である。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (R : Type*) [CommRing R] [CharP R p] (x : WittVector p R) (n : ℕ), (⇑WittVector.verschiebung)^[n] ((⇑WittVector.frobenius)^[n] x) = x * (p : WittVector p R) ^ n
  proof: |
    by
      intro p _ R _ _ x n
      exact WittVector.iterate_verschiebung_iterate_frobenius x n
- id: witt_mul_p_coefficients
  kind: gap
  level: 4
  topic: Witt ベクトル・p倍の成分
  statement: 素数$p$と標数$p$の可換環$R$、$x=(x_0,x_1,\dots)\in W(R)$について、$xp$の成分は$(xp)_0=0$、$(xp)_{i+1}=x_i^p$である。
  statement_en: For a prime p, a commutative ring R of characteristic p and x = (x_0, x_1, ...) in W(R), the components of x p are (x p)_0 = 0 and (x p)_(i+1) = x_i^p.
  assumptions:
  - $p$は素数
  - $R$は標数$p$の可換環
  - $x\in W(R)$
  quantifiers:
  - 任意の$p,R,x$と自然数$i$
  conclusion: $(xp)_0=0$かつ$(xp)_{i+1}=x_i^p$である。
  answer: |
    $p$を素数、$R$を標数$p$の可換環、$x\in W(R)$とする。標数$p$では$xp=V(F(x))$である。$F(x)=(x_0^p,x_1^p,\dots)$であり、$V(y)=(0,y_0,y_1,\dots)$なので、$xp=(0,x_0^p,x_1^p,\dots)$である。
  strategy: In characteristic p, multiplication by p is the composite of Frobenius and the shift.
  sketch:
  - 'apply_theorem: In characteristic p, x p = V(F(x)).'
  - 'derive: F raises components to the p-th power, and V shifts them.'
  openmath: (forall (p A x i) (-> (and (in p P) (comm_ring A) (ring_characteristic A p) (in x (witt_vectors p A)) (in i N)) (and (= (witt_coeff (* x p) 0) 0) (= (witt_coeff (* x p) (+ i 1)) (^ (witt_coeff x i) p)))))
  hard_negative:
    statement: 同じ状況で$(xp)_i=px_i$である。
    reason: 標数$p$では右辺はすべて$0$だが、$x=1$の$xp=p$は$1$成分が$1$である。$p$倍は成分ごとの積ではない。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (R : Type*) [CommRing R] [CharP R p] (x : WittVector p R) (i : ℕ), (x * p).coeff 0 = 0 ∧ (x * p).coeff (i + 1) = x.coeff i ^ p
  proof: |
    by
      intro p _ R _ _ x i
      exact ⟨WittVector.mul_charP_coeff_zero x, WittVector.mul_charP_coeff_succ x i⟩
- id: witt_vector_unit_iff_coeff_zero
  kind: gap
  level: 4
  topic: Witt ベクトル・単元の判定
  statement: 素数$p$と標数$p$の体$k$について、$x\in W(k)$が単元であるための必要十分条件は、$0$成分$x_0$が$0$でないことである。
  statement_en: For a prime p and a field k of characteristic p, x in W(k) is a unit if and only if its zeroth component x_0 is nonzero.
  assumptions:
  - $p$は素数
  - $k$は標数$p$の体
  - $x\in W(k)$
  quantifiers:
  - 任意の$p,k,x$
  conclusion: $x$が単元であることと$x_0\neq 0$は同値である。
  answer: |
    $p$を素数、$k$を標数$p$の体、$x\in W(k)$とする。

    $0$成分を取る写像$W(k)\to k$は環準同型である。実際、$0$番目の Witt 多項式は$X_0$であり、和と積の$0$成分は$0$成分の和と積である。よって$x$が単元なら$x_0$も単元であり、$x_0\neq 0$である。

    逆に$x_0\neq 0$とする。$xy=1$となる$y$の成分を順に定める。$y_0=x_0^{-1}$とする。$(xy)_n$は$y_0,\dots,y_n$の多項式であり、$y_n$については$x_0^{p^n}y_n$と$y_0,\dots,y_{n-1}$および$x$の成分の多項式の和である。$x_0\neq 0$なので、$(xy)_n$が$1$の$n$成分（$n\geq 1$なら$0$）に等しくなるように$y_n$を解ける。こうして得た$y$が$xy=1$を満たす。
  strategy: The zeroth component is a ring homomorphism; conversely solve for the inverse component by component.
  sketch:
  - 'derive: Taking the zeroth component is a ring homomorphism, so units map to units.'
  - 'construct: Solve (xy)_n recursively for y_n, which appears linearly with coefficient x_0^(p^n).'
  - 'conclude: Since x_0 is nonzero, the recursion defines an inverse.'
  openmath: (forall (p k x) (-> (and (in p P) (field_of_char k p) (in x (witt_vectors p k))) (<-> (unit_element x (witt_vectors p k)) (!= (witt_coeff x 0) 0))))
  hard_negative:
    statement: 一般の標数$p$の可換環$R$で、$x_0\neq 0$なら$x$は$W(R)$の単元である。
    reason: $R=\mathbb{F}_p[X]$、$x_0=X$は$0$でないが、$0$成分の準同型の像$X$が$R$の単元でないので$x$は単元でない。
  target: |
    ∀ (p : ℕ) [Fact p.Prime] (k : Type*) [Field k] [CharP k p] (x : WittVector p k), IsUnit x ↔ x.coeff 0 ≠ 0
  proof: |
    by
      intro p _ k _ _ x
      constructor
      · intro h
        have := h.map (WittVector.constantCoeff (p := p) (R := k))
        simpa using this.ne_zero
      · exact WittVector.isUnit_of_coeff_zero_ne_zero x
- id: witt_vectors_zmod_iso_padic_integers
  kind: named
  level: 4
  topic: Witt ベクトル・W(F_p) と Z_p
  statement: 素数$p$について、$W(\mathbb{F}_p)$は$\mathbb{Z}_p$と環同型である。
  statement_en: For a prime p, the ring of Witt vectors W(F_p) is isomorphic as a ring to Z_p.
  assumptions:
  - $p$は素数
  quantifiers:
  - 任意の素数$p$
  conclusion: $W(\mathbb{F}_p)\cong\mathbb{Z}_p$（環同型）である。
  answer: |
    $p$を素数とする。$W_n=W(\mathbb{F}_p)/V^nW(\mathbb{F}_p)$を長さ$n$の Witt ベクトル環とする。成分は最初の$n$個で定まるので$|W_n|=p^n$である。

    標数$p$では$V^nF^n$は$p^n$倍であり、$\mathbb{F}_p$では$F$は恒等写像である。よって$p^n=V^n(1)$であり、$V^nW(\mathbb{F}_p)=p^nW(\mathbb{F}_p)$である。また$p^{n-1}=V^{n-1}(1)$は$W_n$で$0$でない。したがって環準同型$\mathbb{Z}/p^n\mathbb{Z}\to W_n$は単射であり、両辺の元の個数が等しいので同型である。

    この同型は還元と両立する。$W(\mathbb{F}_p)$の元は成分の列で定まるので、$W(\mathbb{F}_p)$は$W_n$の射影極限である。$\mathbb{Z}_p$は$\mathbb{Z}/p^n\mathbb{Z}$の射影極限なので、極限をとって環同型$W(\mathbb{F}_p)\cong\mathbb{Z}_p$を得る。
  strategy: Identify truncated Witt vectors with Z/p^n Z by counting and pass to the inverse limit.
  sketch:
  - 'derive: The truncation W_n has p^n elements, and p^n = V^n(1) over F_p.'
  - 'derive: So Z/p^n Z maps isomorphically to W_n.'
  - 'conclude: Pass to the inverse limit over n.'
  openmath: (forall (p) (-> (in p P) (ring_isomorphic (witt_vectors p (zmod_ring p)) (padic_integers p))))
  hard_negative:
    statement: $W(\mathbb{F}_{p^2})$も$\mathbb{Z}_p$と環同型である。
    reason: $W(\mathbb{F}_{p^2})$の剰余体は$\mathbb{F}_{p^2}$だが、$\mathbb{Z}_p$の剰余体は$\mathbb{F}_p$である。
  target: |
    ∀ (p : ℕ) [Fact p.Prime], Nonempty (WittVector p (ZMod p) ≃+* PadicInt p)
  proof: |
    by
      intro p _
      exact ⟨WittVector.equiv p⟩
