  answer: |
    $K$を標数$0$の体、$L$を有限次元 Lie 環で$\kappa$は非退化、$H$を Cartan 部分環とし、各$\mathrm{ad}\,h$の一般固有空間が$L$を張るとする。$\beta\neq 0$、$\beta=c\alpha$より$\alpha\neq 0$、$c\neq 0$である。
    まず、$\gamma\neq 0$が根なら$k\geq 2$の整数について$k\gamma$は根でないことを示す。そうでないとして、$k\geq 2$を最大にとる。$\mathfrak{sl}_2$三つ組$(h,e,f)$を$e\in L_\gamma$、$f\in L_{-\gamma}$、$h=\gamma^\vee$となるようにとる。$x\in L_{k\gamma}$、$x\neq 0$をとると$[e,x]\in L_{(k+1)\gamma}=0$であり、$[h,x]=2kx$なので、$x$は固有値$2k$の原始ベクトルである。$i\leq 2k$で$(\mathrm{ad}\,f)^ix\neq 0$である。
    $u=(\mathrm{ad}\,f)^{k-1}x\in L_\gamma$は$0$でなく、$L_\gamma$は$1$次元なので$u$は$e$の定数倍である。よって$[e,u]=0$である。一方、公式より$[e,u]=(k-1)(2k-k+2)(\mathrm{ad}\,f)^{k-2}x=(k-1)(k+2)(\mathrm{ad}\,f)^{k-2}x\neq 0$である。矛盾である。
    次に、根の列の定理より$\beta(\alpha^\vee)=2c$と$\alpha(\beta^\vee)=2/c$は整数である。$\alpha=c^{-1}\beta$も用いた。整数の積が$4$なので$2c\in\{\pm 1,\pm 2,\pm 4\}$、すなわち$c\in\{\pm 1/2,\pm 1,\pm 2\}$である。
    $c=2$なら$\beta=2\alpha$、$c=-2$なら$\beta=2(-\alpha)$で、$-\alpha$も根なので前段に反する。$c=\pm 1/2$なら$\alpha=\pm 2\beta$であり、同じく前段に反する。よって$c=\pm 1$である。
  strategy: Exclude integer multiples at least 2 by an sl_2 string, then use integrality of the pairings.
  sketch:
  - 'derive: For k at least 2 maximal with k gamma a root, x in L_(k gamma) is primitive of eigenvalue 2k.'
  - 'derive: (ad f)^(k-1) x is a nonzero element of the line L_gamma, so e kills it.'
  - 'contradiction: The e-formula gives a nonzero value.'
  - 'apply_theorem: Root strings make 2c and 2/c integers.'
  - 'derive: So c is one of plus or minus 1/2, 1, 2.'
  - 'conclude: Multiples by 2 are excluded, so c is 1 or -1.'
  openmath: (forall (K L H a b c) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (finite_dimensional L) (killing_nondegenerate L) (cartan_subalgebra H L) (triangularizable_action H L) (lie_weight a H) (lie_root b H) (in c K) (= b (* c a))) (or (= b a) (= b (neg a)))))
  hard_negative:
    statement: 任意の有限次元 Lie 環で、比例する根は符号を除いて等しい。
    reason: $L=Kx\ltimes(Ky+Kz)$、$[x,y]=y$、$[x,z]=2z$、$[y,z]=0$で$H=Kx$とすると、根は$\alpha(x)=1$と$2\alpha$である。この環の$\kappa$は退化している。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] [LieAlgebra.IsKilling K L] (H : LieSubalgebra K L) [H.IsCartanSubalgebra] [LieModule.IsTriangularizable K H L] (α β : LieModule.Weight K H L) (c : K), β.IsNonZero → (β : H → K) = c • (α : H → K) → β = -α ∨ β = α
  proof: |
    by
      intro K L _ _ _ _ _ _ H _ _ α β c hβ h
      exact LieAlgebra.IsKilling.eq_neg_or_eq_of_eq_smul α β hβ c h
- id: lie_root_string_theorem
  kind: textbook
  level: 4
  topic: Lie環・根の列
  statement: Killing 形式が非退化な有限次元 Lie 環（標数$0$）と Cartan 部分環$H$（各$\mathrm{ad}\,h$の一般固有空間が$L$を張る）について、$\alpha\neq 0$を根、$\beta$を重みとする。ある$p,q\in\mathbb{N}$があって、$L_{\beta+n\alpha}\neq 0$（$n\in\mathbb{Z}$）と$-q\leq n\leq p$は同値であり、$\beta(\alpha^\vee)=q-p$である。
  statement_en: Root string theorem. For a finite-dimensional Lie algebra over a field of characteristic 0 with nondegenerate Killing form, a Cartan subalgebra with generalized eigenspaces spanning L, a nonzero root alpha and a weight beta, there are natural numbers p and q such that L_(beta + n alpha) is nonzero exactly for -q at most n at most p, and beta(coroot of alpha) = q - p.
  assumptions:
  - $K$は標数$0$の体、$L$は有限次元 Lie 環で$\kappa$は非退化
  - $H$は Cartan 部分環、各$\mathrm{ad}\,h$の一般固有空間は$L$を張る
  - $\alpha\neq 0$は根、$\beta$は重み
  quantifiers:
  - 任意の$\alpha,\beta$
  conclusion: $L_{\beta+n\alpha}\neq 0\iff-q\leq n\leq p$であり、$\beta(\alpha^\vee)=q-p$である。
  answer: |
    $K$を標数$0$の体、$L$を有限次元 Lie 環で$\kappa$は非退化、$H$を Cartan 部分環とし、各$\mathrm{ad}\,h$の一般固有空間が$L$を張るとする。$\alpha\neq 0$を根、$\beta$を重みとし、$\mathfrak{sl}_2$三つ組$(h,e,f)$を$e\in L_\alpha$、$f\in L_{-\alpha}$、$h=\alpha^\vee$となるようにとる。$S=\{n\in\mathbb{Z}\mid L_{\beta+n\alpha}\neq 0\}$は有限集合で$0$を含む。$L_{\beta+n\alpha}$上で$h$は$\beta(h)+2n$倍である。
    $S$に隙間がないことを示す。$a<b$が$S$の元で$a+1,\dots,b-1\notin S$、$b-a\geq 2$であるとする。$x\in L_{\beta+a\alpha}$、$x\neq 0$は$[e,x]=0$を満たすので固有値$\beta(h)+2a$の原始ベクトルであり、この固有値は非負整数である。$y\in L_{\beta+b\alpha}$、$y\neq 0$は$[f,y]=0$を満たすので、三つ組$(-h,f,e)$の固有値$-\beta(h)-2b$の原始ベクトルであり、この固有値も非負整数である。二つの和$2(a-b)$は非負整数なので$a\geq b$となり、矛盾である。よって$S=\{-q,\dots,p\}$、$p,q\geq 0$である。
    $x\in L_{\beta+p\alpha}$、$x\neq 0$は$[e,x]=0$を満たし、$\mu=\beta(h)+2p\in\mathbb{N}$の原始ベクトルである。$i\leq\mu$で$(\mathrm{ad}\,f)^ix\neq 0$であり、これは$L_{\beta+(p-i)\alpha}$の元なので$p-\mu\in S$である。よって$p-\mu\geq-q$、すなわち$\beta(h)\leq q-p$である。
    同様に$y\in L_{\beta-q\alpha}$、$y\neq 0$は三つ組$(-h,f,e)$の固有値$\mu'=2q-\beta(h)\in\mathbb{N}$の原始ベクトルであり、$-q+\mu'\in S$である。よって$-q+\mu'\leq p$、すなわち$\beta(h)\geq q-p$である。したがって$\beta(\alpha^\vee)=q-p$である。
  strategy: Use primitive vectors at the ends of gaps and at the ends of the string for the triple attached to alpha.
  sketch:
  - 'setup: S, the set of n with L_(beta + n alpha) nonzero, is finite and contains 0.'
  - 'contradiction: A gap gives primitive vectors with incompatible eigenvalues.'
  - 'derive: So S is an interval from -q to p.'
  - 'derive: The top vector has eigenvalue mu = beta(h) + 2p, and its f-string shows beta(h) is at most q - p.'
  - 'derive: The bottom vector gives beta(h) at least q - p.'
  - 'conclude: beta(coroot) = q - p.'
  openmath: (forall (K L H a b) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (finite_dimensional L) (killing_nondegenerate L) (cartan_subalgebra H L) (triangularizable_action H L) (lie_root a H) (lie_weight b H)) (exists (p q) (and (in p N) (in q N) (forall (n) (-> (in n Z) (<-> (not (zero_lie_ideal (root_space H (+ b (* n a))))) (and (<= (neg q) n) (<= n p))))) (= (fn_value b (lie_coroot a)) (- q p))))))
  hard_negative:
    statement: 同じ状況で$\beta(\alpha^\vee)=p-q$である。
    reason: $\mathfrak{sl}_2$で$\beta=\alpha$とすると、$n=0,-1,-2$で$L_{\beta+n\alpha}\neq 0$なので$p=0$、$q=2$である。$\alpha(\alpha^\vee)=2=q-p$であり、$p-q=-2$ではない。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] [LieAlgebra.IsKilling K L] (H : LieSubalgebra K L) [H.IsCartanSubalgebra] [LieModule.IsTriangularizable K H L] (α β : LieModule.Weight K H L), α.IsNonZero → ∃ p q : ℕ, (∀ n : ℤ, LieAlgebra.rootSpace H (n • (α : H → K) + β) ≠ ⊥ ↔ -(q : ℤ) ≤ n ∧ n ≤ p) ∧ β (LieAlgebra.IsKilling.coroot α) = ((q : ℤ) - (p : ℤ) : ℤ)
  proof: |
    by
      intro K L _ _ _ _ _ _ H _ _ α β hα
      refine ⟨LieModule.chainTopCoeff (α : H → K) β, LieModule.chainBotCoeff (α : H → K) β, fun n => ?_, LieAlgebra.IsKilling.apply_coroot_eq_cast α β⟩
      rw [LieAlgebra.IsKilling.rootSpace_zsmul_add_ne_bot_iff α β hα n]
      omega
- id: lie_root_reflection_is_root
  kind: gap
  level: 4
  topic: Lie環・根の列
  statement: Killing 形式が非退化な有限次元 Lie 環（標数$0$）と Cartan 部分環$H$（各$\mathrm{ad}\,h$の一般固有空間が$L$を張る）について、重み$\alpha,\beta$に対し$\beta-\beta(\alpha^\vee)\alpha$も重みである。ただし$\alpha=0$のとき$\alpha^\vee=0$とする。
  statement_en: For a finite-dimensional Lie algebra over a field of characteristic 0 with nondegenerate Killing form and a Cartan subalgebra with generalized eigenspaces spanning L, if alpha and beta are weights, then beta - beta(coroot of alpha) alpha is a weight, where the coroot of 0 is 0.
  assumptions:
  - $K$は標数$0$の体、$L$は有限次元 Lie 環で$\kappa$は非退化
  - $H$は Cartan 部分環、各$\mathrm{ad}\,h$の一般固有空間は$L$を張る
  - $\alpha,\beta$は重み、$\alpha=0$なら$\alpha^\vee=0$
  quantifiers:
  - 任意の$\alpha,\beta$
  conclusion: $L_{\beta-\beta(\alpha^\vee)\alpha}\neq 0$である。
  answer: |
    $K$を標数$0$の体、$L$を有限次元 Lie 環で$\kappa$は非退化、$H$を Cartan 部分環とし、各$\mathrm{ad}\,h$の一般固有空間が$L$を張るとする。$\alpha,\beta$を重みとする。$\alpha=0$なら$\beta-\beta(\alpha^\vee)\alpha=\beta$であり主張は明らかである。
    $\alpha\neq 0$とする。根の列の定理より$p,q\in\mathbb{N}$があって、$L_{\beta+n\alpha}\neq 0\iff-q\leq n\leq p$であり、$\beta(\alpha^\vee)=q-p$である。$n=p-q$とおくと$-q\leq p-q\leq p$である。よって$L_{\beta+(p-q)\alpha}\neq 0$であり、$\beta+(p-q)\alpha=\beta-\beta(\alpha^\vee)\alpha$である。
  strategy: Apply the root string theorem with n = p - q.
  sketch:
  - 'case_split: If alpha = 0 the expression is beta.'
  - 'apply_theorem: Otherwise the root string theorem gives p, q with beta(coroot) = q - p.'
  - 'derive: n = p - q lies between -q and p.'
  - 'conclude: beta - beta(coroot) alpha is a weight.'
  openmath: (forall (K L H a b) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (finite_dimensional L) (killing_nondegenerate L) (cartan_subalgebra H L) (triangularizable_action H L) (lie_weight a H) (lie_weight b H)) (not (zero_lie_ideal (root_space H (- b (* (fn_value b (lie_coroot a)) a)))))))
  hard_negative:
    statement: 同じ状況で$\beta+\beta(\alpha^\vee)\alpha$も重みである。
    reason: $\mathfrak{sl}_2$で$\beta=\alpha$とすると$\alpha+2\alpha=3\alpha$であり、これは重みでない。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] [LieAlgebra.IsKilling K L] (H : LieSubalgebra K L) [H.IsCartanSubalgebra] [LieModule.IsTriangularizable K H L] (α β : LieModule.Weight K H L), LieAlgebra.rootSpace H ((β : H → K) - β (LieAlgebra.IsKilling.coroot α) • (α : H → K)) ≠ ⊥
  proof: |
    by
      intro K L _ _ _ _ _ _ H _ _ α β
      exact (LieAlgebra.IsKilling.reflectRoot α β).genWeightSpace_ne_bot
- id: lie_root_system_reduced_crystallographic
  kind: textbook
  level: 4
  topic: Lie環・根系
  statement: Killing 形式が非退化な有限次元 Lie 環（標数$0$）と Cartan 部分環$H$（各$\mathrm{ad}\,h$の一般固有空間が$L$を張る）について、$0$でない根とその余根は、$H^*$と$H$の間の被約で整数値の根系をなす。
  statement_en: For a finite-dimensional Lie algebra over a field of characteristic 0 with nondegenerate Killing form and a Cartan subalgebra with generalized eigenspaces spanning L, the nonzero roots and their coroots form a reduced crystallographic root system between the dual of H and H.
  assumptions:
  - $K$は標数$0$の体、$L$は有限次元 Lie 環で$\kappa$は非退化
  - $H$は Cartan 部分環、各$\mathrm{ad}\,h$の一般固有空間は$L$を張る
  quantifiers:
  - 任意の$H$
  conclusion: $0$でない根と余根は被約で整数値の根系である。
  answer: |
    $K$を標数$0$の体、$L$を有限次元 Lie 環で$\kappa$は非退化、$H$を Cartan 部分環とし、各$\mathrm{ad}\,h$の一般固有空間が$L$を張るとする。$\Phi$を$0$でない根の全体とする。$\Phi$は有限集合である。$H^*$と$H$の自然な双対で考える。
    $\alpha\in\Phi$について$\alpha(\alpha^\vee)=2$である。$\beta\in\Phi$について$\beta-\beta(\alpha^\vee)\alpha$は重みである。この重みが$0$なら$\beta$は$\alpha$に比例し、比例する根は$\pm\alpha$に限られるが、$\beta=\pm\alpha$なら値は$\mp\alpha\neq 0$なので$0$にならない。よってこれは$\Phi$の元であり、反射は$\Phi$を保つ。
    余根についても同じことを確かめる。$H^*$上の対称形式を$(\beta,\gamma)=\kappa(t_\beta,t_\gamma)=\beta(t_\gamma)$とすると、$\alpha^\vee=2t_\alpha/(\alpha,\alpha)$、$\beta(\alpha^\vee)=2(\beta,\alpha)/(\alpha,\alpha)$である。$s_\alpha(\gamma)=\gamma-\gamma(\alpha^\vee)\alpha$は形式$(\ ,\ )$を保つ。$H$側の反射$s_\alpha^\vee(y)=y-\alpha(y)\alpha^\vee$について、計算すると$s_\alpha^\vee(t_\gamma)=t_{s_\alpha\gamma}$である。よって$s_\alpha^\vee(\beta^\vee)=2t_{s_\alpha\beta}/(\beta,\beta)=2t_{s_\alpha\beta}/(s_\alpha\beta,s_\alpha\beta)=(s_\alpha\beta)^\vee$であり、余根の集合も保たれる。
    $h\in H$で$\beta(h)=0$（$\beta\in\Phi$）なら、$\kappa(h,v)=\sum_\beta(\dim L_\beta)\beta(h)\beta(v)=0$（$v\in H$）より$h=0$である。よって$\Phi$は$H^*$を張る。$t_\alpha$は$\kappa|_H$の同型で$\alpha$に対応するので、余根は$H$を張る。
    根の列の定理より$\beta(\alpha^\vee)=q-p\in\mathbb{Z}$なので整数値である。比例する根は$\pm$に限られるので被約である。
  strategy: Assemble the pairing axiom, reflection stability, spanning, integrality and reducedness.
  sketch:
  - 'setup: Phi is the finite set of nonzero roots.'
  - 'derive: alpha(coroot) = 2, and reflections preserve Phi.'
  - 'derive: The Killing form identifies the coroot reflections with the root reflections.'
  - 'derive: Roots separate H, so roots span the dual of H and coroots span H.'
  - 'conclude: The root string theorem gives integrality, and proportional roots are plus or minus one another.'
  openmath: (forall (K L H) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (finite_dimensional L) (killing_nondegenerate L) (cartan_subalgebra H L) (triangularizable_action H L)) (root_system_of_cartan H)))
  hard_negative:
    statement: $\kappa$が退化した有限次元 Lie 環でも、Cartan 部分環の$0$でない根は根系をなす。
    reason: $L=Kx\ltimes(Ky+Kz)$、$[x,y]=y$、$[x,z]=2z$では根は$\alpha$と$2\alpha$であり、$-\alpha$が根でないので反射で閉じない。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] [LieAlgebra.IsKilling K L] (H : LieSubalgebra K L) [H.IsCartanSubalgebra] [LieModule.IsTriangularizable K H L], (LieAlgebra.IsKilling.rootSystem H).IsRootSystem ∧ (LieAlgebra.IsKilling.rootSystem H).IsCrystallographic ∧ (LieAlgebra.IsKilling.rootSystem H).IsReduced
  proof: |
    by
      intro K L _ _ _ _ _ _ H _ _
      exact ⟨inferInstance, inferInstance, inferInstance⟩
- id: root_reflection_involution_negates_root
  kind: gap
  level: 4
  topic: 根系・鏡映
  statement: 可換環$R$上の根対$P$（根$\alpha_i\in M$、余根$\alpha_i^\vee\in N$、$\langle\alpha_i,\alpha_i^\vee\rangle=2$）の鏡映$s_i(x)=x-\langle x,\alpha_i^\vee\rangle\alpha_i$について、$s_i(s_i(x))=x$かつ$s_i(\alpha_i)=-\alpha_i$である。
  statement_en: For a root pairing over a commutative ring with roots alpha_i, coroots with pairing value 2, and reflections s_i(x) = x - <x, coroot_i> alpha_i, one has s_i(s_i(x)) = x and s_i(alpha_i) = -alpha_i.
  assumptions:
  - $R$は可換環、$P$は$M,N$の間の根対
  quantifiers:
  - 任意の$i$と$x\in M$
  conclusion: $s_i^2(x)=x$、$s_i(\alpha_i)=-\alpha_i$である。
  answer: |
    $R$を可換環、$P$を$R$加群$M,N$の間の根対とし、根を$\alpha_i$、余根を$\alpha_i^\vee$とする。$x\in M$とし、$c=\langle x,\alpha_i^\vee\rangle$とおく。$s_i(x)=x-c\alpha_i$である。
    $\langle s_i(x),\alpha_i^\vee\rangle=c-2c=-c$なので、$s_i(s_i(x))=x-c\alpha_i+c\alpha_i=x$である。
    また$s_i(\alpha_i)=\alpha_i-2\alpha_i=-\alpha_i$である。
  strategy: Compute directly from the pairing value 2.
  sketch:
  - 'setup: Put c = <x, coroot_i>.'
  - 'derive: The pairing of s_i(x) with the coroot is -c.'
  - 'derive: Hence s_i(s_i(x)) = x.'
  - 'conclude: s_i(alpha_i) = alpha_i - 2 alpha_i = -alpha_i.'
  openmath: (forall (Rg Pr i x) (-> (and (comm_ring Rg) (root_pairing Pr)) (and (= (fn_value (root_reflection Pr i) (fn_value (root_reflection Pr i) x)) x) (= (fn_value (root_reflection Pr i) (root_of Pr i)) (neg (root_of Pr i))))))
  hard_negative:
    statement: 鏡映は自身の根$\alpha_i$を固定する。
    reason: $s_i(\alpha_i)=-\alpha_i$であり、$2\alpha_i\neq 0$なら$\alpha_i$を固定しない。例えば$R=\mathbb{Q}$、$M=\mathbb{Q}$、根$1$の場合に$s(1)=-1$である。
  target: |
    ∀ (ι : Type*) (R : Type*) (M : Type*) (N : Type*) [CommRing R] [AddCommGroup M] [Module R M] [AddCommGroup N] [Module R N] (P : RootPairing ι R M N) (i : ι) (x : M), P.reflection i (P.reflection i x) = x ∧ P.reflection i (P.root i) = -P.root i
  proof: |
    by
      intro ι R M N _ _ _ _ _ P i x
      exact ⟨P.reflection_same i x, P.reflection_apply_self i⟩
- id: root_reflection_conjugation
  kind: gap
  level: 4
  topic: 根系・鏡映
  statement: 根対で$\alpha_{\sigma}=s_i(\alpha_j)$の添字を$\sigma=\sigma_i(j)$とすると、$s_\sigma=s_is_js_i$である。
  statement_en: In a root pairing, if sigma is the index of the root s_i(alpha_j), then the reflection s_sigma equals s_i s_j s_i.
  assumptions:
  - $R$は可換環、$P$は根対
  - $\sigma=\sigma_i(j)$は$\alpha_\sigma=s_i(\alpha_j)$、$\alpha_\sigma^\vee=s_i^\vee(\alpha_j^\vee)$を満たす添字
  quantifiers:
  - 任意の$i,j$
  conclusion: $s_\sigma=s_is_js_i$である。
  answer: |
    $R$を可換環、$P$を根対とする。根対の定義より、$\alpha_\sigma=s_i(\alpha_j)$の添字$\sigma$について$\alpha_\sigma^\vee=s_i^\vee(\alpha_j^\vee)$である。ここで$s_i^\vee(y)=y-\langle\alpha_i,y\rangle\alpha_i^\vee$である。計算すると$\langle x,s_i^\vee(y)\rangle=\langle x,y\rangle-\langle\alpha_i,y\rangle\langle x,\alpha_i^\vee\rangle=\langle s_i(x),y\rangle$である。
    $x\in M$に対し、$s_i^2=1$と上の随伴性より
    $s_is_js_i(x)=s_i\bigl(s_i(x)-\langle s_i(x),\alpha_j^\vee\rangle\alpha_j\bigr)=x-\langle x,\alpha_\sigma^\vee\rangle\alpha_\sigma=s_\sigma(x)$
    である。
  strategy: Use the adjointness of s_i and its dual, together with s_i squared equal to 1.
  sketch:
  - 'setup: The index sigma has root s_i(alpha_j) and coroot the dual reflection of coroot_j.'
  - 'derive: <x, dual s_i(y)> = <s_i(x), y>.'
  - 'derive: Expanding s_i s_j s_i(x) gives x - <x, coroot_sigma> alpha_sigma.'
  - 'conclude: This is s_sigma(x).'
  openmath: (forall (Rg Pr i j) (-> (and (comm_ring Rg) (root_pairing Pr)) (= (root_reflection Pr (root_index_reflection Pr i j)) (* (root_reflection Pr i) (* (root_reflection Pr j) (root_reflection Pr i))))))
  hard_negative:
    statement: $s_\sigma=s_j$である。
    reason: 根系$A_2$で$\alpha_\sigma=s_1(\alpha_2)=\alpha_1+\alpha_2$である。$s_{\alpha_1+\alpha_2}$は$\alpha_2$を$-\alpha_1$へ移すが、$s_2$は$\alpha_2$を$-\alpha_2$へ移す。
  target: |
