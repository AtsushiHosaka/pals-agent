- id: root_coxeter_weight_values
  kind: textbook
  level: 4
  topic: 根系・有限性
  statement: 標数$0$の体上の有限個の根を持つ整数値の根対について、$\langle\alpha_i,\alpha_j^\vee\rangle\langle\alpha_j,\alpha_i^\vee\rangle\in\{0,1,2,3,4\}$である。
  statement_en: For a crystallographic root pairing with finitely many roots over a field of characteristic 0, the product <alpha_i, coroot_j> <alpha_j, coroot_i> lies in {0,1,2,3,4}.
  assumptions:
  - $R$は標数$0$の体、$P$は有限個の根を持つ整数値の根対
  quantifiers:
  - 任意の$i,j$
  conclusion: 積は$\{0,1,2,3,4\}$に属する。
  answer: |
    $R$を標数$0$の体、$P$を有限個の根を持つ整数値の根対とする。$a_{ij}=\langle\alpha_i,\alpha_j^\vee\rangle\in\mathbb{Z}$とおく。$M$上の対称形式を$B(x,y)=\sum_k\langle x,\alpha_k^\vee\rangle\langle y,\alpha_k^\vee\rangle$と定める。
    $\langle s_i(x),\alpha_k^\vee\rangle$は$\langle x,\alpha_{\sigma_i(k)}^\vee\rangle$に等しく、$\sigma_i$は添字の置換なので、$B(s_ix,s_iy)=B(x,y)$である。$s_j(\alpha_j)=-\alpha_j$を用いると、$B(x,\alpha_j)=B(s_jx,-\alpha_j)=-B(x,\alpha_j)+\langle x,\alpha_j^\vee\rangle B(\alpha_j,\alpha_j)$である。よって$2B(x,\alpha_j)=\langle x,\alpha_j^\vee\rangle B(\alpha_j,\alpha_j)$である。
    $B_{ij}=B(\alpha_i,\alpha_j)$は整数ベクトル$(a_{ik})_k$と$(a_{jk})_k$の内積である。$B_{ii}\geq a_{ii}^2=4>0$である。上式より$2B_{ij}=a_{ij}B_{jj}=a_{ji}B_{ii}$なので
    $a_{ij}a_{ji}B_{ii}B_{jj}=4B_{ij}^2$
    である。Cauchy-Schwarz の不等式より$B_{ij}^2\leq B_{ii}B_{jj}$なので、$0\leq a_{ij}a_{ji}\leq 4$である。$a_{ij}a_{ji}$は整数なので$\{0,1,2,3,4\}$に属する。
  strategy: Define the invariant form from all coroots and apply Cauchy-Schwarz.
  sketch:
  - 'construct: B(x,y) is the sum over k of <x,coroot_k><y,coroot_k>.'
  - 'derive: B is reflection invariant, so 2B(x,alpha_j) = <x,coroot_j> B(alpha_j,alpha_j).'
  - 'derive: B_ij is an inner product of integer vectors, with B_ii positive.'
  - 'derive: a_ij a_ji B_ii B_jj = 4 B_ij^2.'
  - 'conclude: Cauchy-Schwarz bounds the integer product by 4.'
  openmath: (forall (Rg Pr i j) (-> (and (field Rg) (field_of_char Rg 0) (root_pairing Pr) (finite_root_pairing Pr) (crystallographic_pairing Pr)) (or (= (* (root_pairing_value Pr i j) (root_pairing_value Pr j i)) 0) (= (* (root_pairing_value Pr i j) (root_pairing_value Pr j i)) 1) (= (* (root_pairing_value Pr i j) (root_pairing_value Pr j i)) 2) (= (* (root_pairing_value Pr i j) (root_pairing_value Pr j i)) 3) (= (* (root_pairing_value Pr i j) (root_pairing_value Pr j i)) 4))))
  hard_negative:
    statement: $\langle\alpha_i,\alpha_j^\vee\rangle\langle\alpha_j,\alpha_i^\vee\rangle\leq 3$である。
    reason: $i=j$とすると積は$2\cdot 2=4$である。$\alpha_j=-\alpha_i$でも積は$(-2)(-2)=4$である。
  target: |
    ∀ (ι : Type*) (R : Type*) (M : Type*) (N : Type*) [Finite ι] [Field R] [CharZero R] [AddCommGroup M] [Module R M] [AddCommGroup N] [Module R N] (P : RootPairing ι R M N) [P.IsCrystallographic] (i j : ι), P.pairingIn ℤ i j * P.pairingIn ℤ j i ∈ ({0, 1, 2, 3, 4} : Set ℤ)
  proof: |
    by
      intro ι R M N _ _ _ _ _ _ _ P _ i j
      exact P.coxeterWeightIn_mem_set_of_isCrystallographic i j
- id: root_pairing_table_reduced
  kind: gap
  level: 4
  topic: 根系・有限性
  statement: 標数$0$の体上の有限個の根を持つ整数値で被約な根対について、$\alpha_i\neq\pm\alpha_j$なら、$(\langle\alpha_i,\alpha_j^\vee\rangle,\langle\alpha_j,\alpha_i^\vee\rangle)$は$(0,0)$、$\pm(1,1)$、$\pm(1,2)$、$\pm(2,1)$、$\pm(1,3)$、$\pm(3,1)$のいずれかである。
  statement_en: For a reduced crystallographic root pairing with finitely many roots over a field of characteristic 0, if alpha_i is neither alpha_j nor -alpha_j, then the pair of pairings is (0,0), plus or minus (1,1), (1,2), (2,1), (1,3) or (3,1).
  assumptions:
  - $R$は標数$0$の体、$P$は有限個の根を持つ整数値で被約な根対
  - $\alpha_i\neq\alpha_j$、$\alpha_i\neq-\alpha_j$
  quantifiers:
  - 任意の$i,j$
  conclusion: 値の組は表の$11$通りのいずれかである。
  answer: |
    $R$を標数$0$の体、$P$を有限個の根を持つ整数値で被約な根対とし、$\alpha_i\neq\pm\alpha_j$とする。$a=\langle\alpha_i,\alpha_j^\vee\rangle$、$b=\langle\alpha_j,\alpha_i^\vee\rangle$とおく。$ab\in\{0,1,2,3,4\}$である。
    被約なので$\alpha_i,\alpha_j$は線形独立である。線形独立であることと$ab\neq 4$は同値なので、$ab\in\{0,1,2,3\}$である。
    形式$B(x,y)=\sum_k\langle x,\alpha_k^\vee\rangle\langle y,\alpha_k^\vee\rangle$について$2B(\alpha_i,\alpha_j)=aB(\alpha_j,\alpha_j)=bB(\alpha_i,\alpha_i)$であり、$B(\alpha_i,\alpha_i),B(\alpha_j,\alpha_j)>0$である。よって$a,b$は同符号であり、一方が$0$なら他方も$0$である。
    $ab=0$なら$(0,0)$である。$ab=1,2,3$は素数または$1$なので、同符号の整数の分解は$\pm(1,1)$、$\pm(1,2)$、$\pm(2,1)$、$\pm(1,3)$、$\pm(3,1)$に限られる。
  strategy: Exclude product 4 by independence, then factor the small integers with equal signs.
  sketch:
  - 'derive: ab lies in {0,1,2,3,4}.'
  - 'derive: Reducedness gives independence, which excludes ab = 4.'
  - 'derive: The invariant form shows a and b have the same sign and vanish together.'
  - 'conclude: Factoring 0, 1, 2, 3 gives the table.'
  openmath: (forall (Rg Pr i j) (-> (and (field Rg) (field_of_char Rg 0) (root_pairing Pr) (finite_root_pairing Pr) (crystallographic_pairing Pr) (reduced_pairing Pr) (!= (root_of Pr i) (root_of Pr j)) (!= (root_of Pr i) (neg (root_of Pr j)))) (or (and (= (root_pairing_value Pr i j) 0) (= (root_pairing_value Pr j i) 0)) (and (= (root_pairing_value Pr i j) 1) (= (root_pairing_value Pr j i) 1)) (and (= (root_pairing_value Pr i j) (neg 1)) (= (root_pairing_value Pr j i) (neg 1))) (and (= (root_pairing_value Pr i j) 1) (= (root_pairing_value Pr j i) 2)) (and (= (root_pairing_value Pr i j) (neg 1)) (= (root_pairing_value Pr j i) (neg 2))) (and (= (root_pairing_value Pr i j) 2) (= (root_pairing_value Pr j i) 1)) (and (= (root_pairing_value Pr i j) (neg 2)) (= (root_pairing_value Pr j i) (neg 1))) (and (= (root_pairing_value Pr i j) 1) (= (root_pairing_value Pr j i) 3)) (and (= (root_pairing_value Pr i j) (neg 1)) (= (root_pairing_value Pr j i) (neg 3))) (and (= (root_pairing_value Pr i j) 3) (= (root_pairing_value Pr j i) 1)) (and (= (root_pairing_value Pr i j) (neg 3)) (= (root_pairing_value Pr j i) (neg 1))))))
  hard_negative:
    statement: 被約でない根対でも$\alpha_i\neq\pm\alpha_j$なら同じ表に入る。
    reason: $M=\mathbb{Q}$で根を$\pm 1,\pm 2$、余根を$\pm 2,\pm 1$とする。$\alpha_i=2$、$\alpha_j=1$なら組は$(4,1)$で表にない。
  target: |
    ∀ (ι : Type*) (R : Type*) (M : Type*) (N : Type*) [Finite ι] [Field R] [CharZero R] [AddCommGroup M] [Module R M] [AddCommGroup N] [Module R N] (P : RootPairing ι R M N) [P.IsCrystallographic] [P.IsReduced] (i j : ι), P.root i ≠ P.root j → P.root i ≠ -P.root j → (P.pairingIn ℤ i j, P.pairingIn ℤ j i) ∈ ({(0, 0), (1, 1), (-1, -1), (1, 2), (2, 1), (-1, -2), (-2, -1), (1, 3), (3, 1), (-1, -3), (-3, -1)} : Set (ℤ × ℤ))
  proof: |
