  sketch:
  - 'derive: s_i s_j(x) = x - <x,coroot_j> alpha_j - <x,coroot_i> alpha_i.'
  - 'derive: The same holds for s_j s_i(x).'
  - 'conclude: The reflections commute.'
  openmath: (forall (Rg Pr i j) (-> (and (comm_ring Rg) (root_pairing Pr) (= (root_pairing_value Pr i j) 0) (= (root_pairing_value Pr j i) 0)) (= (* (root_reflection Pr i) (root_reflection Pr j)) (* (root_reflection Pr j) (root_reflection Pr i)))))
