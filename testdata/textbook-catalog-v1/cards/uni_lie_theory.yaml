- id: lie_ideal_bracket_eq_linear_span
  kind: gap
  level: 3
  topic: Lie環・イデアルの括弧
  statement: 可換環$R$上の Lie 環$L$、$L$加群$M$、イデアル$I$、部分加群$N$について、$[I,N]$は$\{[x,n]\mid x\in I,\ n\in N\}$の$R$線形包に等しい。部分加群を生成し直す必要はない。
  statement_en: For a Lie algebra L over a commutative ring R, an L-module M, an ideal I and a submodule N, the submodule [I,N] equals the R-linear span of the elements [x,n] with x in I and n in N.
  assumptions:
  - $R$は可換環、$L$は$R$上の Lie 環、$M$は$L$加群
  - $I$は$L$のイデアル、$N$は$M$の部分加群
  quantifiers:
  - 任意の$R,L,M,I,N$
  conclusion: $[I,N]$は元$[x,n]$（$x\in I$、$n\in N$）の$R$線形包である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$M$を$L$加群、$I$を$L$のイデアル、$N$を$M$の部分加群とする。$[I,N]$は元$[x,n]$（$x\in I$、$n\in N$）を含む最小の部分加群である。これらの元の$R$線形包を$S$とおく。
    $S$は$[I,N]$に含まれる。逆の包含を示すには、$S$が$L$の作用で閉じていることを示せばよい。$y\in L$、$x\in I$、$n\in N$に対し、
    $[y,[x,n]]=[[y,x],n]+[x,[y,n]]$
    が成り立つ。$I$はイデアルなので$[y,x]\in I$であり、$N$は部分加群なので$[y,n]\in N$である。よって右辺は$S$に属する。作用は線形なので$[y,S]\subseteq S$となる。したがって$S$は生成元を含む部分加群であり、$[I,N]\subseteq S$である。ゆえに$[I,N]=S$である。
  strategy: Show the linear span is already stable under L by the module Jacobi identity.
  sketch:
  - 'setup: Let S be the linear span of the brackets [x,n].'
  - 'derive: S is contained in [I,N] because [I,N] is a submodule containing the generators.'
  - 'derive: For y in L, [y,[x,n]] = [[y,x],n] + [x,[y,n]] lies in S.'
  - 'conclude: S is a submodule containing the generators, so [I,N] = S.'
  openmath: (forall (Rg L M I U) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_module M L Rg) (lie_ideal I L) (lie_submodule U M L)) (= (lie_ideal_module_bracket I U) (lie_brackets_span I U))))
  hard_negative:
    statement: $[I,N]$は集合$\{[x,n]\mid x\in I,\ n\in N\}$そのものである。
    reason: $V$を基底$e_1,\dots,e_4$を持つ空間とし、$L=V\oplus\Lambda^2V$に$[u,v]=u\wedge v$（$u,v\in V$）、他の括弧を$0$として$I=N=L$とする。$e_1\wedge e_2+e_3\wedge e_4$は$[L,L]$に属するが、分解可能な$2$ベクトルではないので単独の括弧ではない。
  target: |
    ∀ (R : Type*) (L : Type*) (M : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] [AddCommGroup M] [Module R M] [LieRingModule L M] [LieModule R L M] (I : LieIdeal R L) (N : LieSubmodule R L M), (⁅I, N⁆ : LieSubmodule R L M).toSubmodule = Submodule.span R {m | ∃ x ∈ I, ∃ n ∈ N, ⁅x, n⁆ = m}
  proof: |
    by
      intro R L M _ _ _ _ _ _ _ I N
      rw [LieSubmodule.lieIdeal_oper_eq_linear_span']
- id: lie_ideal_bracket_additive
  kind: gap
  level: 3
  topic: Lie環・イデアルの括弧
  statement: Lie 環$L$のイデアル$I,J$と$L$加群$M$の部分加群$N,N'$について、$[I+J,N]=[I,N]+[J,N]$と$[I,N+N']=[I,N]+[I,N']$が成り立つ。
  statement_en: For ideals I, J of a Lie algebra L over a commutative ring and submodules N, N' of an L-module, [I+J,N] = [I,N] + [J,N] and [I,N+N'] = [I,N] + [I,N'].
  assumptions:
  - $L$は可換環$R$上の Lie 環、$M$は$L$加群
  - $I,J$は$L$のイデアル、$N,N'$は$M$の部分加群
  quantifiers:
  - 任意の$I,J,N,N'$
  conclusion: 括弧は両変数について和を保つ。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$M$を$L$加群、$I,J$を$L$のイデアル、$N,N'$を$M$の部分加群とする。$[I,N]$は元$[x,n]$（$x\in I$、$n\in N$）を含む最小の部分加群である。
    第一の等式を示す。$I,J\subseteq I+J$より$[I,N]+[J,N]\subseteq[I+J,N]$である。逆に$x\in I$、$y\in J$、$n\in N$に対し$[x+y,n]=[x,n]+[y,n]\in[I,N]+[J,N]$である。右辺は部分加群なので$[I+J,N]\subseteq[I,N]+[J,N]$となる。
    第二の等式も同様である。$N,N'\subseteq N+N'$より$[I,N]+[I,N']\subseteq[I,N+N']$である。逆に$x\in I$、$n\in N$、$n'\in N'$に対し$[x,n+n']=[x,n]+[x,n']$は右辺に属する。右辺は部分加群なので$[I,N+N']\subseteq[I,N]+[I,N']$となる。
  strategy: Compare generators in both directions using bilinearity.
  sketch:
  - 'derive: Monotonicity gives the inclusions of the right-hand sides.'
  - 'derive: Bilinearity puts every generator of the left-hand sides in the right-hand sides.'
  - 'conclude: The right-hand sides are submodules, so equality holds.'
  openmath: (forall (Rg L M I J U V) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_module M L Rg) (lie_ideal I L) (lie_ideal J L) (lie_submodule U M L) (lie_submodule V M L)) (and (= (lie_ideal_module_bracket (lie_sup I J) U) (lie_sup (lie_ideal_module_bracket I U) (lie_ideal_module_bracket J U))) (= (lie_ideal_module_bracket I (lie_sup U V)) (lie_sup (lie_ideal_module_bracket I U) (lie_ideal_module_bracket I V))))))
  hard_negative:
    statement: $[I\cap J,N]=[I,N]\cap[J,N]$が常に成り立つ。
    reason: $L$を基底$x,y$を持つ可換 Lie 環、$M$を$1$次元で$x,y$がともに恒等写像で作用する加群、$I=Kx$、$J=Ky$、$N=M$とする。$I\cap J=0$なので左辺は$0$だが、右辺は$M$である。
  target: |
    ∀ (R : Type*) (L : Type*) (M : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] [AddCommGroup M] [Module R M] [LieRingModule L M] [LieModule R L M] (I J : LieIdeal R L) (N N' : LieSubmodule R L M), ⁅I ⊔ J, N⁆ = ⁅I, N⁆ ⊔ ⁅J, N⁆ ∧ ⁅I, N ⊔ N'⁆ = ⁅I, N⁆ ⊔ ⁅I, N'⁆
  proof: |
    by
      intro R L M _ _ _ _ _ _ _ I J N N'
      exact ⟨LieSubmodule.sup_lie N I J, LieSubmodule.lie_sup N N' I⟩
- id: lie_ideal_bracket_jacobi_le
  kind: gap
  level: 3
  topic: Lie環・イデアルの括弧
  statement: Lie 環$L$のイデアル$I,J$と$L$加群の部分加群$N$について、$[[I,J],N]\subseteq[I,[J,N]]+[J,[I,N]]$が成り立つ。
  statement_en: For ideals I, J of a Lie algebra and a submodule N of an L-module, [[I,J],N] is contained in [I,[J,N]] + [J,[I,N]].
  assumptions:
  - $L$は可換環$R$上の Lie 環、$M$は$L$加群
  - $I,J$は$L$のイデアル、$N$は$M$の部分加群
  quantifiers:
  - 任意の$I,J,N$
  conclusion: $[[I,J],N]\subseteq[I,[J,N]]+[J,[I,N]]$である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$M$を$L$加群、$I,J$を$L$のイデアル、$N$を$M$の部分加群とする。右辺を$T$とおく。$T$は部分加群である。
    $[I,J]$は元$[x,y]$（$x\in I$、$y\in J$）の$R$線形包に等しい。作用は$L$の変数について線形なので、$[x,y]$と$n\in N$について$[[x,y],n]\in T$を示せば十分である。加群の公理より
    $[[x,y],n]=[x,[y,n]]-[y,[x,n]]$
    である。$[y,n]\in[J,N]$なので$[x,[y,n]]\in[I,[J,N]]$であり、$[x,n]\in[I,N]$なので$[y,[x,n]]\in[J,[I,N]]$である。よって$[[x,y],n]\in T$である。
  strategy: Reduce to generators [x,y] and apply the module axiom [[x,y],n] = [x,[y,n]] - [y,[x,n]].
  sketch:
  - 'setup: Let T be the right-hand side, a submodule.'
  - 'translate: [I,J] is the linear span of the brackets [x,y].'
  - 'derive: [[x,y],n] = [x,[y,n]] - [y,[x,n]] lies in T.'
  - 'conclude: By linearity every generator of the left side lies in T.'
  openmath: (forall (Rg L M I J U) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_module M L Rg) (lie_ideal I L) (lie_ideal J L) (lie_submodule U M L)) (subset (lie_ideal_module_bracket (lie_ideal_bracket I J) U) (lie_sup (lie_ideal_module_bracket I (lie_ideal_module_bracket J U)) (lie_ideal_module_bracket J (lie_ideal_module_bracket I U))))))
  hard_negative:
    statement: $[[I,J],N]\subseteq[I,[J,N]]$が常に成り立つ。
    reason: $3$次狭義上三角行列の Lie 環を$x=E_{12}$、$y=E_{23}$、$z=E_{13}$で表し、$M=K^3$、$N=M$、$I=Ky+Kz$、$J=Kx+Kz$とする。$[J,M]=Ke_1$、$[I,Ke_1]=0$なので右辺は$0$だが、$[I,J]=Kz$より左辺は$Ke_1$である。
  target: |
    ∀ (R : Type*) (L : Type*) (M : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] [AddCommGroup M] [Module R M] [LieRingModule L M] [LieModule R L M] (I J : LieIdeal R L) (N : LieSubmodule R L M), ⁅⁅I, J⁆, N⁆ ≤ ⁅I, ⁅J, N⁆⁆ ⊔ ⁅J, ⁅I, N⁆⁆
  proof: |
    by
      intro R L M _ _ _ _ _ _ _ I J N
      rw [LieSubmodule.lie_le_iff]
      intro z hz m hm
      have hz' : z ∈ Submodule.span R {m : L | ∃ x ∈ I, ∃ n ∈ J, ⁅x, n⁆ = m} := by
        rw [← LieSubmodule.lieIdeal_oper_eq_linear_span']
        exact hz
      clear hz
      induction hz' using Submodule.span_induction with
      | mem z hz =>
        obtain ⟨x, hx, y, hy, rfl⟩ := hz
        rw [lie_lie]
        exact Submodule.sub_mem _ (LieSubmodule.mem_sup_left (LieSubmodule.lie_mem_lie hx (LieSubmodule.lie_mem_lie hy hm))) (LieSubmodule.mem_sup_right (LieSubmodule.lie_mem_lie hy (LieSubmodule.lie_mem_lie hx hm)))
      | zero => simp
      | add a b _ _ ha hb =>
        rw [add_lie]
        exact add_mem ha hb
      | smul r a _ ha =>
        rw [smul_lie]
        exact Submodule.smul_mem _ r ha
- id: lie_hom_first_isomorphism
  kind: textbook
  level: 3
  topic: Lie環・準同型定理
  statement: 可換環$R$上の Lie 環の準同型$f\colon L\to L'$に対し、$x+\ker f\mapsto f(x)$は$L/\ker f$から像$f(L)$への Lie 環の同型である。
  statement_en: First isomorphism theorem for Lie algebras over a commutative ring. For a homomorphism f from L to L', the map x + ker f to f(x) is a Lie algebra isomorphism from L/ker f onto the range of f.
  assumptions:
  - $R$は可換環、$L,L'$は$R$上の Lie 環
  - $f\colon L\to L'$は Lie 環の準同型
  quantifiers:
  - 任意の$R,L,L',f$
  conclusion: $x+\ker f\mapsto f(x)$は$L/\ker f\cong f(L)$を与える。
  answer: |
    $R$を可換環、$L,L'$を$R$上の Lie 環、$f\colon L\to L'$を準同型とする。$I=\ker f$は$L$のイデアルである。実際$y\in L$、$x\in I$なら$f([y,x])=[f(y),f(x)]=0$である。
    $\bar f(x+I)=f(x)$と定める。$x-x'\in I$なら$f(x)=f(x')$なので、$\bar f$は矛盾なく定まり、$L/I$から$f(L)$への線形写像である。$\bar f([x+I,y+I])=f([x,y])=[f(x),f(y)]$なので括弧を保つ。
    $f(L)$の定義から$\bar f$は全射である。$\bar f(x+I)=0$なら$x\in I$なので$\bar f$は単射である。全単射な準同型の逆写像も線形で括弧を保つので、$\bar f$は同型である。
  strategy: Check the induced map is well defined, bracket preserving and bijective.
  sketch:
  - 'setup: The kernel I of f is an ideal.'
  - 'construct: Define the map on L/I by x + I to f(x).'
  - 'derive: It is linear and preserves brackets.'
  - 'conclude: It is onto the range and injective, so an isomorphism.'
  openmath: (forall (Rg L M f) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_algebra M Rg) (lie_algebra_hom f L M)) (lie_algebras_isomorphic_by f L M)))
  hard_negative:
    statement: Lie 環の準同型$f\colon L\to L'$について、常に$L/\ker f\cong L'$である。
    reason: $L=L'=K$（可換 Lie 環）で$f=0$とすると$L/\ker f=0$だが$L'\neq 0$である。同型になるのは像であり、$f$が全射のときだけ$L'$に一致する。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] (L' : Type*) [LieRing L'] [LieAlgebra R L'] (f : L →ₗ⁅R⁆ L'), ∃ e : (L ⧸ f.ker) ≃ₗ⁅R⁆ f.range, ∀ x : L, ((e (LieSubmodule.Quotient.mk x) : f.range) : L') = f x
  proof: |
    by
      intro R L _ _ _ L' _ _ f
      exact ⟨f.quotKerEquivRange, fun x => rfl⟩
- id: lie_ideal_correspondence_surjective
  kind: textbook
  level: 3
  topic: Lie環・イデアルの対応
  statement: Lie 環の全射準同型$f\colon L\to L'$について、$L'$のイデアル$J$は$f(f^{-1}(J))=J$を満たし、$L$のイデアル$I$は$f^{-1}(f(I))=I+\ker f$を満たす。
  statement_en: For a surjective Lie algebra homomorphism f from L to L', every ideal J of L' satisfies f(f^{-1}(J)) = J and every ideal I of L satisfies f^{-1}(f(I)) = I + ker f.
  assumptions:
  - $L,L'$は可換環$R$上の Lie 環
  - $f\colon L\to L'$は全射準同型
  quantifiers:
  - 任意の$L'$のイデアル$J$と$L$のイデアル$I$
  conclusion: $f(f^{-1}(J))=J$かつ$f^{-1}(f(I))=I+\ker f$である。
  answer: |
    $R$を可換環、$L,L'$を$R$上の Lie 環、$f\colon L\to L'$を全射準同型とする。全射なので、$L$のイデアル$I$の像$f(I)$は$L'$のイデアルである。実際$f(y)\in L'$、$x\in I$に対し$[f(y),f(x)]=f([y,x])\in f(I)$である。
    $J$を$L'$のイデアルとする。$f(f^{-1}(J))\subseteq J$は明らかである。$y\in J$をとると全射性より$y=f(x)$と書け、$x\in f^{-1}(J)$なので$y\in f(f^{-1}(J))$である。
    $I$を$L$のイデアルとする。$x\in I$、$z\in\ker f$なら$f(x+z)=f(x)\in f(I)$なので$I+\ker f\subseteq f^{-1}(f(I))$である。逆に$f(w)\in f(I)$なら$f(w)=f(x)$となる$x\in I$があり、$w-x\in\ker f$なので$w=x+(w-x)\in I+\ker f$である。
  strategy: Use surjectivity to lift elements and compare fibres of f.
  sketch:
  - 'derive: The image of an ideal under a surjection is an ideal.'
  - 'derive: Every element of J lifts to the preimage of J.'
  - 'derive: If f(w) = f(x) with x in I, then w - x lies in ker f.'
  - 'conclude: Both equalities follow.'
  openmath: (forall (Rg L M f) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_algebra M Rg) (lie_algebra_hom f L M) (lie_hom_surjective f)) (and (forall (J) (-> (lie_ideal J M) (= (lie_ideal_image f (lie_ideal_preimage f J)) J))) (forall (I) (-> (lie_ideal I L) (= (lie_ideal_preimage f (lie_ideal_image f I)) (lie_sup I (lie_hom_kernel f))))))))
  hard_negative:
    statement: 全射準同型について$f^{-1}(f(I))=I$が常に成り立つ。
    reason: $L=K$（可換）、$L'=0$、$f=0$、$I=0$とすると$f^{-1}(f(I))=K\neq I$である。$\ker f\subseteq I$のときだけ成り立つ。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] (L' : Type*) [LieRing L'] [LieAlgebra R L'] (f : L →ₗ⁅R⁆ L'), Function.Surjective f → (∀ J : LieIdeal R L', LieIdeal.map f (LieIdeal.comap f J) = J) ∧ (∀ I : LieIdeal R L, LieIdeal.comap f (LieIdeal.map f I) = I ⊔ f.ker)
  proof: |
    by
      intro R L _ _ _ L' _ _ f hf
      constructor
      · intro J
        apply le_antisymm LieIdeal.map_comap_le
        intro y hy
        obtain ⟨x, rfl⟩ := hf y
        exact LieIdeal.mem_map (by simpa using hy)
      · intro I
        apply LieIdeal.comap_map_eq
        ext y
        constructor
        · intro hy
          obtain ⟨x, rfl⟩ := LieIdeal.mem_map_of_surjective hf hy
          exact ⟨x, x.2, rfl⟩
        · rintro ⟨x, hx, rfl⟩
          exact LieIdeal.mem_map hx
- id: lie_derived_series_sup_le
  kind: gap
  level: 3
  topic: Lie環・導来列
  statement: Lie 環$L$のイデアル$I,J$と$k,l\geq 0$について、イデアルの導来列を$D^0I=I$、$D^{k+1}I=[D^kI,D^kI]$とすると、$D^{k+l}(I+J)\subseteq D^kI+D^lJ$である。
  statement_en: For ideals I, J of a Lie algebra and k, l at least 0, with D^0 I = I and D^(k+1) I = [D^k I, D^k I], one has D^(k+l)(I+J) contained in D^k I + D^l J.
  assumptions:
  - $L$は可換環$R$上の Lie 環、$I,J$はイデアル
  - $D^0I=I$、$D^{k+1}I=[D^kI,D^kI]$
  quantifiers:
  - 任意の$I,J$と$k,l\geq 0$
  conclusion: $D^{k+l}(I+J)\subseteq D^kI+D^lJ$である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$I,J$を$L$のイデアルとする。イデアルの括弧はイデアルなので、各$D^nI$はイデアルである。$A\subseteq A'$なら$D^nA\subseteq D^nA'$であり、定義から$D^{k+l}A=D^l(D^kA)$である。
    まず、イデアル$A,B$と$n\geq 0$について$D^n(A+B)\subseteq A+D^nB$を$n$の帰納法で示す。$n=0$では等号である。$n$で成り立つとすると
    $D^{n+1}(A+B)=[D^n(A+B),D^n(A+B)]\subseteq[A+D^nB,A+D^nB]\subseteq A+[D^nB,D^nB]=A+D^{n+1}B$
    となる。第二の包含には、$A$がイデアルなので$A$を含む括弧がすべて$A$に入ることを用いた。
    この補題で$A,B$を入れ替えると$D^k(I+J)\subseteq D^kI+J$である。単調性と、$A=D^kI$、$B=J$、$n=l$の場合の補題より
    $D^{k+l}(I+J)=D^l(D^k(I+J))\subseteq D^l(D^kI+J)\subseteq D^kI+D^lJ$
    を得る。
  strategy: Prove D^n(A+B) is contained in A + D^n B for ideals, then apply it twice.
  sketch:
  - 'setup: Each D^n I is an ideal, and D^(k+l) = D^l composed with D^k.'
  - 'induction: D^n(A+B) lies in A + D^n B because A is an ideal.'
  - 'derive: Swapping roles gives D^k(I+J) inside D^k I + J.'
  - 'conclude: Applying the lemma with A = D^k I and B = J gives the claim.'
  openmath: (forall (Rg L I J k l) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_ideal I L) (lie_ideal J L) (in k N) (in l N)) (subset (lie_derived_series_of_ideal (lie_sup I J) (+ k l)) (lie_sup (lie_derived_series_of_ideal I k) (lie_derived_series_of_ideal J l)))))
  hard_negative:
    statement: $D^{\max(k,l)}(I+J)\subseteq D^kI+D^lJ$が常に成り立つ。
    reason: 基底$x,y,z$、$[x,y]=z$、$z$中心の Heisenberg 環で$I=Kx+Kz$、$J=Ky+Kz$、$k=l=1$とする。$I,J$は可換なので右辺は$0$だが、左辺は$[I+J,I+J]=Kz$である。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] (I J : LieIdeal R L) (k l : ℕ), LieAlgebra.derivedSeriesOfIdeal R L (k + l) (I ⊔ J) ≤ LieAlgebra.derivedSeriesOfIdeal R L k I ⊔ LieAlgebra.derivedSeriesOfIdeal R L l J
  proof: |
    by
      intro R L _ _ _ I J k l
      exact LieAlgebra.derivedSeriesOfIdeal_add_le_add I J k l
- id: lie_solvable_of_ideal_and_quotient
  kind: textbook
  level: 3
  topic: Lie環・可解性の閉性
  statement: Lie 環$L$のイデアル$I$について、$I$と$L/I$がともに可解なら$L$は可解である。
  statement_en: If an ideal I of a Lie algebra L over a commutative ring and the quotient L/I are both solvable, then L is solvable.
  assumptions:
  - $L$は可換環$R$上の Lie 環、$I$はイデアル
  - $I$と$L/I$は可解
  quantifiers:
  - 任意の$L,I$
  conclusion: $L$は可解である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$I$をイデアルとし、$I$と$L/I$が可解であるとする。$D^0L=L$、$D^{n+1}L=[D^nL,D^nL]$とおく。
    自然な射影$\pi\colon L\to L/I$は全射準同型なので、$n$の帰納法より$\pi(D^nL)=D^n(L/I)$である。$L/I$は可解なので$D^l(L/I)=0$となる$l$がある。すると$\pi(D^lL)=0$より$D^lL\subseteq I$である。
    $I$は可解なので$D^kI=0$となる$k$がある。単調性より$D^{k+l}L=D^k(D^lL)\subseteq D^kI=0$である。よって$L$は可解である。
  strategy: Push the derived series to the quotient, land in I, then use solvability of I.
  sketch:
  - 'derive: The projection maps D^n L onto D^n(L/I).'
  - 'derive: If D^l(L/I) = 0 then D^l L lies in I.'
  - 'derive: If D^k I = 0 then D^(k+l) L lies in D^k I = 0.'
  - 'conclude: L is solvable.'
  openmath: (forall (Rg L I) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_ideal I L) (solvable_lie_algebra I) (solvable_lie_algebra (lie_quotient L I))) (solvable_lie_algebra L)))
  hard_negative:
    statement: $I$と$L/I$がともに冪零なら$L$は冪零である。
    reason: 基底$x,y$、$[x,y]=y$の Lie 環で$I=Ky$とすると、$I$と$L/I$は$1$次元で冪零だが、$\mathrm{ad}\,x$は$y$を固定するので$L$は冪零でない。可解の場合と異なり冪零は拡大で閉じない。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] (I : LieIdeal R L), LieAlgebra.IsSolvable I → LieAlgebra.IsSolvable (L ⧸ I) → LieAlgebra.IsSolvable L
  proof: |
    by
      intro R L _ _ _ I hI hQ
      obtain ⟨l, hl⟩ := LieAlgebra.IsSolvable.solvable R (L ⧸ I)
      obtain ⟨k, hk⟩ := LieAlgebra.IsSolvable.solvable R I
      let π : L →ₗ⁅R⁆ L ⧸ I := { (LieSubmodule.Quotient.mk' I : L →ₗ[R] L ⧸ I) with map_lie' := fun {x y} => LieSubmodule.Quotient.mk_bracket I x y }
      have hπ : Function.Surjective π := LieSubmodule.Quotient.surjective_mk' I
      have h1 : LieAlgebra.derivedSeries R L l ≤ I := by
        have h2 : LieIdeal.map π (LieAlgebra.derivedSeries R L l) = ⊥ := by
          rw [LieIdeal.derivedSeries_map_eq l hπ, hl]
        rw [LieIdeal.map_eq_bot_iff] at h2
        intro x hx
        have h3 := h2 hx
        rw [LieHom.mem_ker] at h3
        exact (LieSubmodule.Quotient.mk_eq_zero (N := I)).mp h3
      rw [LieIdeal.derivedSeries_eq_bot_iff] at hk
      refine LieAlgebra.IsSolvable.mk (R := R) (k := k + l) ?_
      rw [LieAlgebra.derivedSeries_def, LieAlgebra.derivedSeriesOfIdeal_add]
      exact eq_bot_iff.mpr (hk ▸ LieAlgebra.derivedSeriesOfIdeal_mono h1 k)
- id: lie_solvable_subalgebra
  kind: gap
  level: 3
  topic: Lie環・可解性の閉性
  statement: 可解な Lie 環$L$の部分 Lie 環$H$は可解である。
  statement_en: Every Lie subalgebra of a solvable Lie algebra over a commutative ring is solvable.
  assumptions:
  - $L$は可換環$R$上の可解な Lie 環
  - $H$は$L$の部分 Lie 環
  quantifiers:
  - 任意の$L,H$
  conclusion: $H$は可解である。
  answer: |
    $R$を可換環、$L$を$R$上の可解な Lie 環、$H$を部分 Lie 環とする。$D^0H=H$、$D^{n+1}H=[D^nH,D^nH]$とおく。
    $n$の帰納法で$D^nH\subseteq D^nL$を示す。$n=0$では$H\subseteq L$である。$D^nH\subseteq D^nL$なら、$D^{n+1}H$は括弧$[u,v]$（$u,v\in D^nH$）で生成され、これらは$[D^nL,D^nL]=D^{n+1}L$に入る。
    $L$は可解なので$D^kL=0$となる$k$がある。このとき$D^kH=0$であり、$H$は可解である。
  strategy: Compare the derived series of H and L term by term.
  sketch:
  - 'induction: D^n H lies in D^n L for every n.'
  - 'derive: D^k L = 0 for some k.'
  - 'conclude: D^k H = 0, so H is solvable.'
  openmath: (forall (Rg L H) (-> (and (comm_ring Rg) (lie_algebra L Rg) (solvable_lie_algebra L) (lie_subalgebra H L)) (solvable_lie_algebra H)))
  hard_negative:
    statement: 部分 Lie 環$H$が可解なら、$L$も可解である。
    reason: 標数$0$の体上の$\mathfrak{sl}_2$で$H=Kh$とする。$H$は可換だが、$[\mathfrak{sl}_2,\mathfrak{sl}_2]=\mathfrak{sl}_2$なので全体は可解でない。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] (H : LieSubalgebra R L), LieAlgebra.IsSolvable L → LieAlgebra.IsSolvable H
  proof: |
    by
      intro R L _ _ _ H h
      exact (show Function.Injective H.incl from Subtype.val_injective).lieAlgebra_isSolvable
- id: lie_solvable_sup_ideals
  kind: textbook
  level: 3
  topic: Lie環・可解性の閉性
  statement: Lie 環$L$の可解イデアル$I,J$の和$I+J$は可解である。
  statement_en: The sum of two solvable ideals of a Lie algebra over a commutative ring is solvable.
  assumptions:
  - $L$は可換環$R$上の Lie 環
  - $I,J$は$L$の可解イデアル
  quantifiers:
  - 任意の$L,I,J$
  conclusion: $I+J$は可解である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$I,J$を可解イデアルとする。イデアル$A$に対し$D^0A=A$、$D^{n+1}A=[D^nA,D^nA]$とおく。$I,J$は可解なので$D^kI=0$、$D^lJ=0$となる$k,l$がある。
    $n$の帰納法で$D^n(I+J)\subseteq I+D^nJ$が成り立つ。実際$D^{n+1}(I+J)\subseteq[I+D^nJ,I+D^nJ]\subseteq I+[D^nJ,D^nJ]$であり、$I$がイデアルであることを用いた。同様に$D^k(I+J)\subseteq D^kI+J=J$である。
    よって$D^{k+l}(I+J)=D^l(D^k(I+J))\subseteq D^lJ=0$であり、$I+J$は可解である。
  strategy: Bound the derived series of I+J using that I is an ideal.
  sketch:
  - 'setup: Choose k, l with D^k I = 0 and D^l J = 0.'
  - 'induction: D^k(I+J) lies in D^k I + J = J.'
  - 'derive: Then D^(k+l)(I+J) lies in D^l J = 0.'
  - 'conclude: I+J is solvable.'
  openmath: (forall (Rg L I J) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_ideal I L) (lie_ideal J L) (solvable_lie_algebra I) (solvable_lie_algebra J)) (solvable_lie_algebra (lie_sup I J))))
  hard_negative:
    statement: 可解な部分 Lie 環$A,B$の和が部分 Lie 環になれば、それは可解である。
    reason: 標数$0$の体上の$\mathfrak{sl}_2$で$A=Kh+Ke$、$B=Kh+Kf$とする。どちらも可解だが、和は$\mathfrak{sl}_2$全体であり可解でない。イデアルであることが必要である。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] (I J : LieIdeal R L), LieAlgebra.IsSolvable I → LieAlgebra.IsSolvable J → LieAlgebra.IsSolvable (I ⊔ J : LieIdeal R L)
  proof: |
    by
      intro R L _ _ _ I J hI hJ
      exact LieAlgebra.isSolvableAdd R L
- id: lie_solvable_ideal_contains_abelian
  kind: gap
  level: 3
  topic: Lie環・可解イデアル
  statement: Lie 環$L$の$0$でない可解イデアル$I$は、$0$でない可換なイデアル$J\subseteq I$を含む。ここで$J$は$L$のイデアルである。
  statement_en: A nonzero solvable ideal I of a Lie algebra L over a commutative ring contains a nonzero abelian ideal of L.
  assumptions:
  - $L$は可換環$R$上の Lie 環
  - $I\neq 0$は$L$の可解イデアル
  quantifiers:
  - 任意の$L,I$
  conclusion: $J\subseteq I$、$J\neq 0$である$L$の可換イデアル$J$が存在する。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$I\neq 0$を可解イデアルとする。$D^0I=I$、$D^{n+1}I=[D^nI,D^nI]$とおく。各$D^nI$は$L$のイデアルであり、$I$に含まれる。
    $I$は可解なので$D^mI=0$となる$m$があり、$D^0I\neq 0$なので$m\geq 1$である。そのような$m$のうち最小のものをとり、$J=D^{m-1}I$とおく。最小性より$J\neq 0$である。$[J,J]=D^mI=0$なので$J$は可換である。
  strategy: Take the last nonzero term of the derived series of I.
  sketch:
  - 'setup: Each D^n I is an ideal of L inside I.'
  - 'construct: Let m be minimal with D^m I = 0, so m is at least 1.'
  - 'conclude: J = D^(m-1) I is a nonzero abelian ideal.'
  openmath: (forall (Rg L I) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_ideal I L) (solvable_lie_algebra I) (not (zero_lie_ideal I))) (exists (J) (and (lie_ideal J L) (subset J I) (not (zero_lie_ideal J)) (abelian_lie_algebra J)))))
  hard_negative:
    statement: $0$でない可解イデアルは可換である。
    reason: 基底$x,y$、$[x,y]=y$の Lie 環$L$で$I=L$とすると、$I$は可解だが可換でない。可換になるのは導来列の最後の項である。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] (I : LieIdeal R L), LieAlgebra.IsSolvable I → I ≠ ⊥ → ∃ J : LieIdeal R L, J ≤ I ∧ J ≠ ⊥ ∧ IsLieAbelian J
  proof: |
    by
      intro R L _ _ _ I hI h
      refine ⟨LieAlgebra.derivedAbelianOfIdeal I, ?_, ?_, LieAlgebra.abelian_derivedAbelianOfIdeal I⟩
      · dsimp only [LieAlgebra.derivedAbelianOfIdeal]
        split
        · exact bot_le
        · exact LieAlgebra.derivedSeriesOfIdeal_le_self I _
      · exact fun h' => h ((LieAlgebra.abelian_of_solvable_ideal_eq_bot_iff I).mp h')
- id: lie_trivial_radical_iff_no_abelian_ideals
  kind: gap
  level: 3
  topic: Lie環・根基
  statement: 可換環上の Lie 環$L$の根基（可解イデアルすべての和）が$0$であることと、$L$の可換イデアルがすべて$0$であることは同値である。
  statement_en: The radical of a Lie algebra over a commutative ring, meaning the supremum of its solvable ideals, is zero if and only if every abelian ideal of L is zero.
  assumptions:
  - $L$は可換環$R$上の Lie 環
  - 根基$\mathrm{rad}\,L$は可解イデアルすべての和
  quantifiers:
  - 任意の$L$
  conclusion: $\mathrm{rad}\,L=0$と、可換イデアルが$0$のみであることは同値である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環とし、$\mathrm{rad}\,L$を可解イデアルすべての和とする。
    $\mathrm{rad}\,L=0$とする。可換イデアル$I$は可解なので$I\subseteq\mathrm{rad}\,L=0$である。
    逆に可換イデアルがすべて$0$であるとする。$\mathrm{rad}\,L\neq 0$なら、和の項のうち$0$でない可解イデアル$I$がある。$I$の導来列の最後の$0$でない項$J$は$L$のイデアルで、$[J,J]=0$を満たす。これは$0$でない可換イデアルであり、仮定に反する。よって$\mathrm{rad}\,L=0$である。
  strategy: Abelian ideals are solvable, and a nonzero solvable ideal contains a nonzero abelian ideal.
  sketch:
  - 'derive: An abelian ideal is solvable, so it lies in the radical.'
  - 'contradiction: If the radical is nonzero, some solvable ideal I is nonzero.'
  - 'derive: The last nonzero derived term of I is a nonzero abelian ideal.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (Rg L) (-> (and (comm_ring Rg) (lie_algebra L Rg)) (<-> (zero_lie_ideal (lie_radical L)) (forall (I) (-> (and (lie_ideal I L) (abelian_lie_algebra I)) (zero_lie_ideal I))))))
  hard_negative:
    statement: Lie 環の根基が$0$であることと、中心が$0$であることは同値である。
    reason: 基底$x,y$、$[x,y]=y$の Lie 環は中心が$0$だが、全体が可解なので根基は全体である。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L], LieAlgebra.HasTrivialRadical R L ↔ ∀ I : LieIdeal R L, IsLieAbelian I → I = ⊥
  proof: |
    by
      intro R L _ _ _
      exact LieAlgebra.hasTrivialRadical_iff_no_abelian_ideals R L
- id: lie_quotient_radical_trivial_radical
  kind: gap
  level: 3
  topic: Lie環・根基
  statement: 可換環$R$上の Lie 環$L$が$R$加群として Noether 的なら、$L/\mathrm{rad}\,L$の根基は$0$である。
  statement_en: If a Lie algebra L over a commutative ring R is Noetherian as an R-module, then the quotient L/rad L has zero radical.
  assumptions:
  - $L$は可換環$R$上の Lie 環で、$R$加群として Noether 的
  quantifiers:
  - 任意の$R,L$
  conclusion: $L/\mathrm{rad}\,L$の可解イデアルは$0$のみである。
  answer: |
    $R$を可換環、$L$を$R$加群として Noether 的な$R$上の Lie 環とし、$\mathfrak r=\mathrm{rad}\,L$とする。可解イデアルの和は可解であり、Noether 性より$\mathfrak r$は有限個の可解イデアルの和なので、$\mathfrak r$は可解である。$\pi\colon L\to L/\mathfrak r$を射影とする。
    $J$を$L/\mathfrak r$の可解イデアルとし、$A=\pi^{-1}(J)$とおく。$A$は$L$のイデアルで$\mathfrak r\subseteq A$、$\pi(A)=J$である。$J$は可解なので$D^kJ=0$となる$k$がある。$\pi$は準同型なので$\pi(D^kA)\subseteq D^k\pi(A)=D^kJ=0$であり、$D^kA\subseteq\mathfrak r$である。
    $\mathfrak r$は可解なので$D^l\mathfrak r=0$となる$l$がある。すると$D^{k+l}A\subseteq D^l\mathfrak r=0$であり、$A$は可解イデアルである。根基の定義より$A\subseteq\mathfrak r$である。よって$J=\pi(A)=0$である。
  strategy: Pull back a solvable ideal of the quotient and use that extensions of solvable by solvable are solvable.
  sketch:
  - 'setup: Noetherianity makes the radical r itself solvable.'
  - 'construct: Let A be the preimage of a solvable ideal J of L/r.'
  - 'derive: D^k A lies in r when D^k J = 0, so D^(k+l) A = 0.'
  - 'derive: A is a solvable ideal, so A lies in r.'
  - 'conclude: J = pi(A) = 0.'
  openmath: (forall (Rg L) (-> (and (comm_ring Rg) (lie_algebra L Rg)) (forall (J) (-> (and (noetherian_module Rg L) (lie_ideal J (lie_quotient L (lie_radical L))) (solvable_lie_algebra J)) (zero_lie_ideal J)))))
  hard_negative:
    statement: $L/Z(L)$の中心は$0$である。
    reason: $L$を$4$次狭義上三角行列の Lie 環とすると、$Z(L)=KE_{14}$であり、$E_{13}$の像は$L/Z(L)$の$0$でない中心元である。実際$[E_{13},E_{34}]=E_{14}\in Z(L)$である。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L], IsNoetherian R L → LieAlgebra.HasTrivialRadical R (L ⧸ LieAlgebra.radical R L)
  proof: |
    by
      intro R L _ _ _ h
      set Rad := LieAlgebra.radical R L with hRad
      apply LieAlgebra.hasTrivialRadical_of_no_solvable_ideals
      intro J hJ
      let π : L →ₗ⁅R⁆ L ⧸ Rad := { (LieSubmodule.Quotient.mk' Rad : L →ₗ[R] L ⧸ Rad) with map_lie' := fun {x y} => LieSubmodule.Quotient.mk_bracket Rad x y }
      have hπ : Function.Surjective π := LieSubmodule.Quotient.surjective_mk' Rad
      have hmap : ∀ (I : LieIdeal R L) (k : ℕ), LieIdeal.map π (LieAlgebra.derivedSeriesOfIdeal R L k I) ≤ LieAlgebra.derivedSeriesOfIdeal R (L ⧸ Rad) k (LieIdeal.map π I) := by
        intro I k
        induction k with
        | zero => exact le_rfl
        | succ k ih =>
          rw [LieAlgebra.derivedSeriesOfIdeal_succ, LieAlgebra.derivedSeriesOfIdeal_succ]
          exact LieIdeal.map_bracket_le π |>.trans (LieSubmodule.mono_lie ih ih)
      obtain ⟨k, hk⟩ := LieAlgebra.IsSolvable.solvable R J
      rw [LieIdeal.derivedSeries_eq_bot_iff] at hk
      have hC : LieIdeal.map π (LieIdeal.comap π J) = J := by
        apply le_antisymm LieIdeal.map_comap_le
        intro y hy
        obtain ⟨x, rfl⟩ := hπ y
        exact LieIdeal.mem_map (by simpa using hy)
      have h1 : LieAlgebra.derivedSeriesOfIdeal R L k (LieIdeal.comap π J) ≤ Rad := by
        have h2 := hmap (LieIdeal.comap π J) k
        rw [hC, hk, le_bot_iff, LieIdeal.map_eq_bot_iff] at h2
        intro x hx
        have h3 := h2 hx
        rw [LieHom.mem_ker] at h3
        exact (LieSubmodule.Quotient.mk_eq_zero (N := Rad)).mp h3
      have hsolv : LieAlgebra.IsSolvable (LieIdeal.comap π J) := by
        obtain ⟨l, hl⟩ := LieAlgebra.IsSolvable.solvable R Rad
        rw [LieIdeal.derivedSeries_eq_bot_iff] at hl
        refine LieAlgebra.IsSolvable.mk (R := R) (k := l + k) ?_
        rw [LieIdeal.derivedSeries_eq_bot_iff, LieAlgebra.derivedSeriesOfIdeal_add]
        exact eq_bot_iff.mpr (hl ▸ LieAlgebra.derivedSeriesOfIdeal_mono h1 l)
      have h4 : LieIdeal.comap π J ≤ Rad := (LieAlgebra.LieIdeal.solvable_iff_le_radical R L _).mp hsolv
      rw [← hC, eq_bot_iff, LieIdeal.map_le_iff_le_comap]
      intro x hx
      have := h4 hx
      rw [LieIdeal.mem_comap]
      exact (LieSubmodule.Quotient.mk_eq_zero (N := Rad)).mpr this
- id: lie_lower_central_bracket_le
  kind: gap
  level: 3
  topic: Lie環・下降中心列
  statement: Lie 環$L$の下降中心列を$C^0L=L$、$C^{k+1}L=[L,C^kL]$とすると、$i,j\geq 0$について$[C^iL,C^jL]\subseteq C^{i+j+1}L$である。
  statement_en: With the lower central series C^0 L = L and C^(k+1) L = [L, C^k L] of a Lie algebra, one has [C^i L, C^j L] contained in C^(i+j+1) L for all i, j at least 0.
  assumptions:
  - $L$は可換環$R$上の Lie 環
  - $C^0L=L$、$C^{k+1}L=[L,C^kL]$
  quantifiers:
  - 任意の$i,j\geq 0$
  conclusion: $[C^iL,C^jL]\subseteq C^{i+j+1}L$である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環とする。各$C^kL$はイデアルである。任意の$j$についての主張として$i$の帰納法で示す。
    $i=0$のとき$[L,C^jL]=C^{j+1}L$である。
    $i$で成り立つとする。$[C^{i+1}L,C^jL]=[[L,C^iL],C^jL]$の生成元は、$a\in L$、$b\in C^iL$、$c\in C^jL$に対する$[[a,b],c]$であり、Jacobi 恒等式より
    $[[a,b],c]=[a,[b,c]]-[b,[a,c]]$
    である。帰納法の仮定より$[b,c]\in C^{i+j+1}L$なので$[a,[b,c]]\in C^{i+j+2}L$である。$[a,c]\in C^{j+1}L$なので、$j+1$に対する帰納法の仮定より$[b,[a,c]]\in C^{i+j+2}L$である。よって$[C^{i+1}L,C^jL]\subseteq C^{(i+1)+j+1}L$である。
  strategy: Induct on i for all j, using the Jacobi identity to move the outer bracket.
  sketch:
  - 'setup: Induct on i, with j arbitrary.'
  - 'derive: For i = 0 this is the definition of C^(j+1) L.'
  - 'derive: [[a,b],c] = [a,[b,c]] - [b,[a,c]] splits a generator.'
  - 'conclude: Both terms lie in C^(i+j+2) L by the induction hypothesis.'
  openmath: (forall (Rg L i j) (-> (and (comm_ring Rg) (lie_algebra L Rg) (in i N) (in j N)) (subset (lie_ideal_bracket (lie_lower_central_series L i) (lie_lower_central_series L j)) (lie_lower_central_series L (+ i j 1)))))
  hard_negative:
    statement: $[C^iL,C^jL]\subseteq C^{i+j+2}L$である。
    reason: Heisenberg 環で$i=j=0$とすると$[L,L]=Kz=C^1L$であり、$C^2L=0$に含まれない。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] (i j : ℕ), ⁅LieModule.lowerCentralSeries R L L i, LieModule.lowerCentralSeries R L L j⁆ ≤ LieModule.lowerCentralSeries R L L (i + j + 1)
  proof: |
    by
      intro R L _ _ _ i j
      have jac : ∀ I J K : LieIdeal R L, ⁅⁅I, J⁆, K⁆ ≤ ⁅I, ⁅J, K⁆⁆ ⊔ ⁅J, ⁅I, K⁆⁆ := by
        intro I J K
        rw [LieSubmodule.lie_le_iff]
        intro z hz m hm
        have hz' : z ∈ Submodule.span R {m : L | ∃ x ∈ I, ∃ n ∈ J, ⁅x, n⁆ = m} := by
          rw [← LieSubmodule.lieIdeal_oper_eq_linear_span']
          exact hz
        clear hz
        induction hz' using Submodule.span_induction with
        | mem z hz =>
          obtain ⟨x, hx, y, hy, rfl⟩ := hz
          rw [lie_lie]
          exact Submodule.sub_mem _ (LieSubmodule.mem_sup_left (LieSubmodule.lie_mem_lie hx (LieSubmodule.lie_mem_lie hy hm))) (LieSubmodule.mem_sup_right (LieSubmodule.lie_mem_lie hy (LieSubmodule.lie_mem_lie hx hm)))
        | zero => simp
        | add a b _ _ ha hb =>
          rw [add_lie]
          exact add_mem ha hb
        | smul r a _ ha =>
          rw [smul_lie]
          exact Submodule.smul_mem _ r ha
      induction i generalizing j with
      | zero =>
        rw [LieModule.lowerCentralSeries_zero, Nat.zero_add, LieModule.lowerCentralSeries_succ]
      | succ i ih =>
        rw [LieModule.lowerCentralSeries_succ R L L i]
        refine (jac _ _ _).trans (sup_le ?_ ?_)
        · have h1 := ih j
          calc ⁅(⊤ : LieIdeal R L), ⁅LieModule.lowerCentralSeries R L L i, LieModule.lowerCentralSeries R L L j⁆⁆
              ≤ ⁅(⊤ : LieIdeal R L), LieModule.lowerCentralSeries R L L (i + j + 1)⁆ := LieSubmodule.mono_lie_right _ h1
            _ = LieModule.lowerCentralSeries R L L (i + 1 + j + 1) := by
                rw [show i + 1 + j + 1 = (i + j + 1) + 1 by omega, LieModule.lowerCentralSeries_succ R L L (i + j + 1)]
        · have h2 := ih (j + 1)
          rw [show i + 1 + j + 1 = i + (j + 1) + 1 by omega, ← LieModule.lowerCentralSeries_succ]
          exact h2
