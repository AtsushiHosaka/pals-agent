  conclusion: $s_is_j=s_js_i$である。
  answer: |
    $R$を可換環、$P$を根対とし、$\langle\alpha_i,\alpha_j^\vee\rangle=\langle\alpha_j,\alpha_i^\vee\rangle=0$とする。$x\in M$に対し
    $s_is_j(x)=s_j(x)-\langle s_j(x),\alpha_i^\vee\rangle\alpha_i=x-\langle x,\alpha_j^\vee\rangle\alpha_j-\langle x,\alpha_i^\vee\rangle\alpha_i$
    である。$\langle\alpha_j,\alpha_i^\vee\rangle=0$を用いた。右辺は$i,j$について対称なので、$\langle\alpha_i,\alpha_j^\vee\rangle=0$を用いた同じ計算より$s_js_i(x)$に等しい。
