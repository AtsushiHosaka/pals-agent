- id: lie_cartan_abelian_of_killing
  kind: textbook
  level: 4
  topic: Lie環・根空間とKilling形式
  statement: 標数$0$の体上の有限次元 Lie 環$L$の Killing 形式が非退化なら、Cartan 部分環$H$（各$\mathrm{ad}\,h$の一般固有空間が$L$を張る）は可換である。
  statement_en: If the Killing form of a finite-dimensional Lie algebra over a field of characteristic 0 is nondegenerate, then a Cartan subalgebra H whose ad action has generalized eigenspaces spanning L is abelian.
  assumptions:
  - $K$は標数$0$の体、$L$は有限次元 Lie 環で$\kappa$は非退化
  - $H$は Cartan 部分環、各$\mathrm{ad}\,h$の一般固有空間は$L$を張る
  quantifiers:
  - 任意の$H$
  conclusion: $H$は可換である。
  answer: |
    $K$を標数$0$の体、$L$を有限次元 Lie 環で$\kappa$は非退化、$H$を Cartan 部分環とし、各$\mathrm{ad}\,h$の一般固有空間が$L$を張るとする。$L=\bigoplus_\chi L_\chi$である。$L_\chi$上で$\mathrm{ad}\,h-\chi(h)$は冪零であり、$\chi$は$H$の有限次元加群の重みなので線形で$[H,H]$上消える。
    $u\in[H,H]$、$v\in H$とする。$L_\chi$は$H$で保たれ、$\mathrm{ad}\,u,\mathrm{ad}\,v$の$L_\chi$上の作用を$\chi(u)+N_u$、$\chi(v)+N_v$と書く。$\chi$の線形性と$[H,H]$上の消滅より、$N$は$H$の冪零な作用を与えるので、Engel の定理より$N_uN_v$は冪零である。よって$\mathrm{tr}_{L_\chi}(\mathrm{ad}\,u\,\mathrm{ad}\,v)=(\dim L_\chi)\chi(u)\chi(v)=0$である。
    足し合わせると$\kappa(u,v)=0$である。$\kappa$の$H$への制限は非退化なので$u=0$である。よって$[H,H]=0$である。
