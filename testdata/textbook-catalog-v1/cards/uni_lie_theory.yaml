    statement: 冪零 Lie 環は$[L,L]\subseteq Z(L)$を満たす。
    reason: $4$次狭義上三角行列の Lie 環では$E_{13}=[E_{12},E_{23}]\in[L,L]$だが、$[E_{13},E_{34}]=E_{14}\neq 0$なので$E_{13}$は中心に入らない。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L], LieAlgebra.derivedSeries R L 1 ≤ LieAlgebra.center R L → LieRing.IsNilpotent L
