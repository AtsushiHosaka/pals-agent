- id: lie_not_nilpotent_of_nonzero_eigenvector
  kind: gap
  level: 3
  topic: Lie環・冪零性の判定
  statement: 体$K$上の Lie 環$L$に$y\neq 0$、$x\in L$、$c\neq 0$があって$[x,y]=cy$なら、$L$は冪零でない。
  statement_en: If a Lie algebra L over a field K has elements x and y with y nonzero and [x,y] = cy for a nonzero scalar c, then L is not nilpotent.
  assumptions:
  - $L$は体$K$上の Lie 環
  - $x,y\in L$、$y\neq 0$、$c\in K$、$c\neq 0$、$[x,y]=cy$
  quantifiers:
  - 任意の$x,y,c$
  conclusion: $L$は冪零でない。
  answer: |
    $K$を体、$L$を$K$上の Lie 環、$x,y\in L$、$y\neq 0$、$c\in K$、$c\neq 0$、$[x,y]=cy$とする。$L$が冪零であると仮定する。$C^nL=0$となる$n$がある。
    $(\mathrm{ad}\,x)^k$は$L$を$C^kL$へ移すので、$(\mathrm{ad}\,x)^n=0$である。一方、$[x,y]=cy$を繰り返し用いると$(\mathrm{ad}\,x)^ny=c^ny$である。$c^n\neq 0$、$y\neq 0$よりこれは$0$でない。矛盾である。
  strategy: A nonzero eigenvalue of ad x contradicts nilpotency of ad x.
  sketch:
  - 'contradiction: Suppose C^n L = 0.'
  - 'derive: (ad x)^n maps L into C^n L, so it vanishes.'
  - 'derive: (ad x)^n y = c^n y is nonzero.'
  - 'conclude: L is not nilpotent.'
  openmath: (forall (K L x y c) (-> (and (field K) (lie_algebra L K) (in x L) (in y L) (in c K) (!= c 0) (!= y 0) (= (lie_bracket x y) (* c y))) (not (nilpotent_lie_algebra L))))
  hard_negative:
    statement: $y\neq 0$、$[x,y]=cy$なら、$c$の値によらず$L$は冪零でない。
    reason: $c=0$なら仮定は$[x,y]=0$にすぎない。可換 Lie 環はこれを満たし冪零である。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [LieRing L] [LieAlgebra K L] (x y : L) (c : K), c ≠ 0 → y ≠ 0 → ⁅x, y⁆ = c • y → ¬ LieRing.IsNilpotent L
  proof: |
    by
      intro K L _ _ _ x y c hc hy hxy hL
      obtain ⟨n, hn⟩ := LieAlgebra.nilpotent_ad_of_nilpotent_algebra K L
      have key : ∀ k : ℕ, ((LieAlgebra.ad K L x) ^ k) y = c ^ k • y := by
        intro k
        induction k with
        | zero => simp
        | succ k ih =>
          rw [pow_succ', Module.End.mul_apply, ih, map_smul, LieAlgebra.ad_apply, hxy, smul_smul, pow_succ]
      have h0 := key n
      rw [hn x, LinearMap.zero_apply] at h0
      exact (smul_ne_zero (pow_ne_zero n hc) hy) h0.symm
- id: lie_ad_pow_leibniz
  kind: gap
  level: 3
  topic: Lie環・随伴表現の計算則
  statement: Lie 環の元$x,y,z$と$n\geq 0$について、$(\mathrm{ad}\,x)^n[y,z]=\sum_{i+j=n}\binom{n}{i}[(\mathrm{ad}\,x)^iy,(\mathrm{ad}\,x)^jz]$が成り立つ。
  statement_en: General Leibniz rule for ad. For x, y, z in a Lie algebra over a commutative ring and n at least 0, (ad x)^n [y,z] is the sum over i+j=n of C(n,i) [(ad x)^i y, (ad x)^j z].
  assumptions:
  - $L$は可換環$R$上の Lie 環
  - $x,y,z\in L$、$n\geq 0$
  quantifiers:
  - 任意の$x,y,z,n$
  conclusion: $(\mathrm{ad}\,x)^n[y,z]=\sum_{i+j=n}\binom{n}{i}[(\mathrm{ad}\,x)^iy,(\mathrm{ad}\,x)^jz]$である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$x,y,z\in L$とする。$D=\mathrm{ad}\,x$とおく。Jacobi 恒等式より$D[u,v]=[Du,v]+[u,Dv]$である。$n$の帰納法で示す。
    $n=0$は両辺とも$[y,z]$である。$n$で成り立つとすると、$D$を施して
    $D^{n+1}[y,z]=\sum_{i+j=n}\binom{n}{i}\bigl([D^{i+1}y,D^jz]+[D^iy,D^{j+1}z]\bigr)$
    を得る。$[D^py,D^qz]$（$p+q=n+1$）の係数は$\binom{n}{p-1}+\binom{n}{p}=\binom{n+1}{p}$である。ただし範囲外の二項係数は$0$とする。これは$n+1$の場合の式である。
  strategy: Induct on n using that ad x is a derivation and Pascal's rule.
  sketch:
  - 'setup: D = ad x satisfies D[u,v] = [Du,v] + [u,Dv].'
  - 'induction: Apply D to the formula for n.'
  - 'derive: The coefficient of [D^p y, D^q z] is C(n,p-1) + C(n,p) = C(n+1,p).'
  - 'conclude: This is the formula for n+1.'
  openmath: (forall (Rg L x y z n) (-> (and (comm_ring Rg) (lie_algebra L Rg) (in x L) (in y L) (in z L) (in n N)) (= (fn_value (map_power (adjoint_map L x) n) (lie_bracket y z)) (ad_leibniz_sum x y z n))))
  hard_negative:
    statement: $(\mathrm{ad}\,x)^n[y,z]=[(\mathrm{ad}\,x)^ny,z]+[y,(\mathrm{ad}\,x)^nz]$である。
    reason: 標数$0$の体上の$\mathfrak{sl}_2$で$x=h$、$y=e$、$z=f$、$n=2$とする。左辺は$(\mathrm{ad}\,h)^2h=0$だが、右辺は$[4e,f]+[e,4f]=8h\neq 0$である。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] (x y z : L) (n : ℕ), ((LieAlgebra.ad R L x) ^ n) ⁅y, z⁆ = ∑ ij ∈ Finset.antidiagonal n, n.choose ij.1 • ⁅((LieAlgebra.ad R L x) ^ ij.1) y, ((LieAlgebra.ad R L x) ^ ij.2) z⁆
  proof: |
    by
      intro R L _ _ _ x y z n
      simp only [Module.End.pow_apply]
      have e : ⇑(LieAlgebra.ad R L x) = ⇑(LieDerivation.ad R L x) := by
        ext w
        simp
      rw [e]
      exact LieDerivation.iterate_apply_lie (LieDerivation.ad R L x) n y z
- id: lie_ad_pow_eq_zero_of_pow_eq_zero
  kind: gap
  level: 3
  topic: Lie環・随伴表現の計算則
  statement: 環$A$の元$a$が$a^{n+1}=0$を満たすとき、$T(b)=ab-ba$で定まる写像は$T^{2n+1}=0$を満たす。特に冪零元の$\mathrm{ad}$は冪零である。
  statement_en: If an element a of a ring A satisfies a^(n+1) = 0, then the map T(b) = ab - ba satisfies T^(2n+1) = 0. In particular ad a is nilpotent for a nilpotent element a.
  assumptions:
  - $A$は環、$a\in A$、$n\geq 0$、$a^{n+1}=0$
  quantifiers:
  - 任意の$b\in A$
  conclusion: $T^{2n+1}(b)=0$である。
  answer: |
    $A$を環、$a\in A$、$a^{n+1}=0$とする。$l(b)=ab$、$r(b)=ba$とおくと、$l,r$は$A$の加法自己準同型で$lr=rl$を満たし、$T=l-r$である。$l^{n+1}=0$かつ$r^{n+1}=0$である。
    $l$と$r$は可換なので二項定理より
    $T^{2n+1}=\sum_{i+j=2n+1}\binom{2n+1}{i}(-1)^jl^ir^j$
    である。$i+j=2n+1$なら$i\geq n+1$または$j\geq n+1$なので、各項は$0$である。よって$T^{2n+1}=0$である。
