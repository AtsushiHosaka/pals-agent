  proof: |
    by
      intro K L _ _ _ _ _ _ H _ _ α hα
      exact LieAlgebra.IsKilling.root_apply_coroot hα
- id: lie_root_space_one_dimensional
  kind: textbook
  level: 4
  topic: Lie環・根の性質
  statement: Killing 形式が非退化な有限次元 Lie 環（標数$0$）と Cartan 部分環$H$（各$\mathrm{ad}\,h$の一般固有空間が$L$を張る）について、$0$でない根$\alpha$の根空間は$1$次元である。
  statement_en: For a finite-dimensional Lie algebra over a field of characteristic 0 with nondegenerate Killing form and a Cartan subalgebra with generalized eigenspaces spanning L, each root space of a nonzero root is one-dimensional.
  assumptions:
  - $K$は標数$0$の体、$L$は有限次元 Lie 環で$\kappa$は非退化
  - $H$は Cartan 部分環、各$\mathrm{ad}\,h$の一般固有空間は$L$を張る
  - $\alpha\neq 0$は根
  quantifiers:
  - 任意の根$\alpha\neq 0$
  conclusion: $\dim L_\alpha=1$である。
  answer: |
    $K$を標数$0$の体、$L$を有限次元 Lie 環で$\kappa$は非退化、$H$を Cartan 部分環とし、各$\mathrm{ad}\,h$の一般固有空間が$L$を張るとする。$\alpha\neq 0$を根とする。$\mathfrak{sl}_2$三つ組$(h,e,f)$で$e\in L_\alpha$、$f\in L_{-\alpha}$、$h=\alpha^\vee$となるものをとる。
    $\dim L_\alpha\geq 2$と仮定する。$v\mapsto\kappa(v,f)$は$L_\alpha$上の線形形式なので、$v\neq 0$で$\kappa(v,f)=0$となる$v\in L_\alpha$がある。公式$[v,f]=\kappa(v,f)t_\alpha$より$[f,v]=0$である。また$[h,v]=\alpha(h)v=2v$である。
    $(-h,f,e)$も$\mathfrak{sl}_2$三つ組である。$v$は随伴加群の原始ベクトルであり、$[f,v]=0$かつ$[-h,v]=-2v$なので固有値は$-2$である。$L$は有限次元なので原始ベクトルの固有値は非負整数であり、矛盾である。$L_\alpha\neq 0$なので$\dim L_\alpha=1$である。
  strategy: A second independent vector would be a primitive vector of negative eigenvalue.
  sketch:
  - 'setup: Take an sl_2 triple attached to alpha.'
  - 'contradiction: If dim L_alpha is at least 2, choose v nonzero with kappa(v,f) = 0.'
  - 'derive: Then [f,v] = 0 and [h,v] = 2v.'
  - 'derive: v is primitive of eigenvalue -2 for the triple (-h,f,e).'
  - 'conclude: Eigenvalues must be natural numbers, so the dimension is 1.'
  openmath: (forall (K L H a) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (finite_dimensional L) (killing_nondegenerate L) (cartan_subalgebra H L) (triangularizable_action H L) (lie_root a H)) (= (dim_of K (root_space H a)) 1)))
