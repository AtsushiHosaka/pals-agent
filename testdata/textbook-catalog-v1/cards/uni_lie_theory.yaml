    ∀ (K : Type*) (L : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] [LieAlgebra.IsKilling K L] (H : LieSubalgebra K L) [H.IsCartanSubalgebra] [LieModule.IsTriangularizable K H L] (α : LieModule.Weight K H L), α.IsNonZero → ∃ h e f : L, IsSl2Triple h e f ∧ e ∈ LieAlgebra.rootSpace H α ∧ f ∈ LieAlgebra.rootSpace H (-α) ∧ h = LieAlgebra.IsKilling.coroot α
