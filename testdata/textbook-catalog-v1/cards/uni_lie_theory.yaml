  statement: Killing 形式が非退化な有限次元 Lie 環（標数$0$）と Cartan 部分環$H$（各$\mathrm{ad}\,h$の一般固有空間が$L$を張る）について、$0$でない根$\alpha$に対し$e\in L_\alpha$、$f\in L_{-\alpha}$、$h=\alpha^\vee$となる$\mathfrak{sl}_2$三つ組$(h,e,f)$が存在する。
