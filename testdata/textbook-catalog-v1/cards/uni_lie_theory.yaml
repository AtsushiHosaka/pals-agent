  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] [LieAlgebra.IsKilling K L] (H : LieSubalgebra K L) [H.IsCartanSubalgebra] [LieModule.IsTriangularizable K H L] (α : LieModule.Weight K H L), α.IsNonZero → Module.finrank K (LieAlgebra.rootSpace H α) = 1
  proof: |
