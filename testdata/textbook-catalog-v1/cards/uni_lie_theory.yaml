    $R$を可換環、$L$を$R$上の Lie 環とし、$[L,L]\subseteq Z(L)$とする。$C^1L=[L,L]$であり、
    $C^2L=[L,C^1L]=[L,[L,L]]\subseteq[L,Z(L)]=0$
    である。よって$L$は冪零である。
  strategy: Compute C^2 L directly.
  sketch:
  - 'derive: C^1 L = [L,L] lies in Z(L).'
  - 'conclude: C^2 L = [L, C^1 L] = 0.'
