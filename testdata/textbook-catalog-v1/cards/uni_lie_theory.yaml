- id: root_add_sub_mem_of_pairing_sign
  kind: gap
  level: 4
  topic: 根系・和と差
  statement: 標数$0$の体上の有限個の根を持つ整数値の根対について、$i\neq j$で$\langle\alpha_i,\alpha_j^\vee\rangle>0$なら$\alpha_i-\alpha_j$は根であり、$\alpha_i\neq-\alpha_j$で$\langle\alpha_i,\alpha_j^\vee\rangle<0$なら$\alpha_i+\alpha_j$は根である。
  statement_en: For a crystallographic root pairing with finitely many roots over a field of characteristic 0, if i and j differ and <alpha_i, coroot_j> is positive, then alpha_i - alpha_j is a root; if alpha_i is not -alpha_j and the pairing is negative, then alpha_i + alpha_j is a root.
  assumptions:
  - $R$は標数$0$の体、$P$は有限個の根を持つ整数値の根対
  quantifiers:
  - 任意の$i,j$
  conclusion: 符号に応じて$\alpha_i-\alpha_j$または$\alpha_i+\alpha_j$が根である。
  answer: |
    $R$を標数$0$の体、$P$を有限個の根を持つ整数値の根対とする。根全体は$-1$倍で閉じる。$s_k(\alpha_k)=-\alpha_k$であり鏡映は根を根へ移すからである。また$\langle\alpha_i,-\alpha_j^\vee\rangle=-\langle\alpha_i,\alpha_j^\vee\rangle$である。$-\alpha_j$の余根は$-\alpha_j^\vee$である。
    $i\neq j$、$a=\langle\alpha_i,\alpha_j^\vee\rangle>0$とする。$b=\langle\alpha_j,\alpha_i^\vee\rangle$は$a$と同符号であり$1\leq ab\leq 4$である。$a=b=2$なら$ab=4$なので$\alpha_i,\alpha_j$は線形従属であり、$\alpha_i=c\alpha_j$から$a=2c=2$より$c=1$となる。根の写像は単射なので$i=j$となり矛盾である。よって$a=1$または$b=1$である。
    $a=1$なら$s_j(\alpha_i)=\alpha_i-\alpha_j$は根である。$b=1$なら$s_i(\alpha_j)=\alpha_j-\alpha_i$は根であり、$-1$倍も根なので$\alpha_i-\alpha_j$は根である。
    次に$\alpha_i\neq-\alpha_j$、$\langle\alpha_i,\alpha_j^\vee\rangle<0$とする。$\alpha_k=-\alpha_j$となる$k$をとると$k\neq i$であり、$\langle\alpha_i,\alpha_k^\vee\rangle>0$である。前半より$\alpha_i-\alpha_k=\alpha_i+\alpha_j$は根である。
  strategy: One of the two pairings equals 1, so a reflection produces the difference; pass to -alpha_j for the sum.
  sketch:
  - 'derive: Roots are closed under negation.'
  - 'derive: For positive a, the product ab is at most 4, and a = b = 2 forces i = j.'
  - 'derive: So a = 1 or b = 1, and a reflection gives alpha_i - alpha_j up to sign.'
  - 'conclude: Applying this to -alpha_j gives the sum statement.'
  openmath: (forall (Rg Pr i j) (-> (and (field Rg) (field_of_char Rg 0) (root_pairing Pr) (finite_root_pairing Pr) (crystallographic_pairing Pr)) (and (-> (and (!= i j) (> (root_pairing_value Pr i j) 0)) (in (- (root_of Pr i) (root_of Pr j)) (root_set Pr))) (-> (and (!= (root_of Pr i) (neg (root_of Pr j))) (< (root_pairing_value Pr i j) 0)) (in (+ (root_of Pr i) (root_of Pr j)) (root_set Pr))))))
  hard_negative:
    statement: $\langle\alpha_i,\alpha_j^\vee\rangle=0$なら$\alpha_i\pm\alpha_j$は根でない。
    reason: 根系$B_2$の短い根$\alpha=e_1$、$\beta=e_2$は直交するが、$e_1+e_2$と$e_1-e_2$は根である。
  target: |
    ∀ (ι : Type*) (R : Type*) (M : Type*) (N : Type*) [Finite ι] [Field R] [CharZero R] [AddCommGroup M] [Module R M] [AddCommGroup N] [Module R N] (P : RootPairing ι R M N) [P.IsCrystallographic] (i j : ι), (i ≠ j → 0 < P.pairingIn ℤ i j → P.root i - P.root j ∈ Set.range P.root) ∧ (P.root i ≠ -P.root j → P.pairingIn ℤ i j < 0 → P.root i + P.root j ∈ Set.range P.root)
  proof: |
    by
      intro ι R M N _ _ _ _ _ _ _ P _ i j
      exact ⟨fun h₁ h₂ => P.root_sub_root_mem_of_pairingIn_pos h₂ h₁, fun h₁ h₂ => P.root_add_root_mem_of_pairingIn_neg h₂ h₁⟩
- id: root_coxeter_four_iff_dependent
  kind: gap
  level: 4
  topic: 根系・有限性
  statement: 標数$0$の体上の有限個の根を持つ整数値の根対について、$\alpha_i,\alpha_j$が線形独立であることと$\langle\alpha_i,\alpha_j^\vee\rangle\langle\alpha_j,\alpha_i^\vee\rangle\neq 4$は同値である。
  statement_en: For a crystallographic root pairing with finitely many roots over a field of characteristic 0, alpha_i and alpha_j are linearly independent if and only if the product of their two pairings differs from 4.
  assumptions:
  - $R$は標数$0$の体、$P$は有限個の根を持つ整数値の根対
  quantifiers:
  - 任意の$i,j$
  conclusion: 線形独立性と積$\neq 4$は同値である。
  answer: |
    $R$を標数$0$の体、$P$を有限個の根を持つ整数値の根対とする。$a=\langle\alpha_i,\alpha_j^\vee\rangle$、$b=\langle\alpha_j,\alpha_i^\vee\rangle$とおく。
    $\alpha_i,\alpha_j$が線形従属とする。根は$0$でないので$\alpha_i=c\alpha_j$、$c\neq 0$と書ける。$a=2c$であり、$\alpha_j=c^{-1}\alpha_i$より$b=2c^{-1}$である。よって$ab=4$である。
    逆に$ab=4$で$\alpha_i,\alpha_j$が線形独立であるとする。$u=s_is_j$とおく。$s_j\alpha_i=\alpha_i-a\alpha_j$、$s_i\alpha_j=\alpha_j-b\alpha_i$から、$u\alpha_i=(ab-1)\alpha_i-a\alpha_j=3\alpha_i-a\alpha_j$、$u\alpha_j=b\alpha_i-\alpha_j$である。$w=2\alpha_i-a\alpha_j$とおくと$(u-1)\alpha_i=w$である。$ab=4$より$(u-1)\alpha_j=b\alpha_i-2\alpha_j=(b/2)w$である。
    よって$(u-1)w=2w-a(b/2)w=0$であり、$u^n\alpha_i=\alpha_i+nw$である。独立性より$w\neq 0$であり、標数$0$よりこれらは互いに異なる根である。根は有限個なので矛盾である。
  strategy: Compute the pairings for proportional roots; for the converse, s_i s_j acts unipotently and produces infinitely many roots.
  sketch:
  - 'derive: If alpha_i = c alpha_j then a = 2c and b = 2/c, so ab = 4.'
  - 'contradiction: Suppose ab = 4 with independent roots, and let u = s_i s_j.'
  - 'derive: (u-1) alpha_i = w and (u-1) alpha_j = (b/2) w with w = 2 alpha_i - a alpha_j.'
  - 'derive: (u-1) w = 0, so u^n alpha_i = alpha_i + n w.'
  - 'conclude: These are infinitely many distinct roots, a contradiction.'
  openmath: (forall (Rg Pr i j) (-> (and (field Rg) (field_of_char Rg 0) (root_pairing Pr) (finite_root_pairing Pr) (crystallographic_pairing Pr)) (<-> (linearly_independent_pair (root_of Pr i) (root_of Pr j)) (!= (* (root_pairing_value Pr i j) (root_pairing_value Pr j i)) 4))))
  hard_negative:
    statement: 積が$4$なら$\alpha_i=\alpha_j$である。
    reason: $\alpha_j=-\alpha_i$なら積は$(-2)(-2)=4$だが、$\alpha_i\neq\alpha_j$である。
  target: |
    ∀ (ι : Type*) (R : Type*) (M : Type*) (N : Type*) [Finite ι] [Field R] [CharZero R] [AddCommGroup M] [Module R M] [AddCommGroup N] [Module R N] (P : RootPairing ι R M N) [P.IsCrystallographic] (i j : ι), LinearIndependent R ![P.root i, P.root j] ↔ P.pairing i j * P.pairing j i ≠ 4
  proof: |
    by
      intro ι R M N _ _ _ _ _ _ _ P _ i j
      exact P.linearIndependent_iff_coxeterWeight_ne_four
- id: root_cartan_matrix_diag_offdiag
  kind: gap
  level: 4
  topic: 根系・Cartan行列
  statement: 標数$0$の体上の有限個の根を持つ整数値の根対の基底$b$（単純根と単純余根がそれぞれ線形独立で、各根が単純根の、各余根が単純余根の自然数係数の和またはその符号違いであるもの）について、Cartan 行列$c_{ij}=\langle\alpha_i,\alpha_j^\vee\rangle$は$c_{ii}=2$を満たし、$i\neq j$なら$c_{ij}\leq 0$である。
  statement_en: For a base of a crystallographic root pairing with finitely many roots over a field of characteristic 0, the Cartan matrix c_ij = <alpha_i, coroot_j> has c_ii = 2 and c_ij at most 0 for i different from j.
  assumptions:
  - $R$は標数$0$の体、$P$は有限個の根を持つ整数値の根対
  - $b$は$P$の基底
  quantifiers:
  - 任意の単純根の添字$i,j$
  conclusion: $c_{ii}=2$であり、$i\neq j$なら$c_{ij}\leq 0$である。
  answer: |
    $R$を標数$0$の体、$P$を有限個の根を持つ整数値の根対、$b$を基底とする。$c_{ii}=\langle\alpha_i,\alpha_i^\vee\rangle=2$である。
    $i\neq j$を単純根の添字とし、$c_{ij}>0$と仮定する。根の和と差の性質より$\alpha_i-\alpha_j$は根である。基底の定義より、この根またはその$-1$倍は単純根の自然数係数の和である。単純根は線形独立なので係数は一意だが、$\alpha_i-\alpha_j$の係数は$+1$と$-1$であり、すべて同符号ではない。矛盾である。よって$c_{ij}\leq 0$である。
  strategy: A positive off-diagonal entry makes the difference of simple roots a root, which has mixed signs.
  sketch:
  - 'derive: The diagonal entries are 2 by the pairing axiom.'
  - 'contradiction: If c_ij is positive, alpha_i - alpha_j is a root.'
  - 'derive: Roots have coefficients of one sign in the base.'
  - 'conclude: Independence of simple roots gives a contradiction.'
  openmath: (forall (Rg Pr b i j) (-> (and (field Rg) (field_of_char Rg 0) (root_pairing Pr) (finite_root_pairing Pr) (crystallographic_pairing Pr) (root_base b Pr)) (and (= (cartan_matrix_entry b i i) 2) (-> (!= i j) (<= (cartan_matrix_entry b i j) 0)))))
  hard_negative:
    statement: 任意の二つの根$\alpha,\beta$（$\alpha\neq\beta$）について$\langle\alpha,\beta^\vee\rangle\leq 0$である。
    reason: 根系$A_2$の根$\alpha_1$と$\alpha_1+\alpha_2$について、$\langle\alpha_1,(\alpha_1+\alpha_2)^\vee\rangle=1>0$である。これらは同時に単純根にならない。
  target: |
    ∀ (ι : Type*) (R : Type*) (M : Type*) (N : Type*) [Finite ι] [Field R] [CharZero R] [AddCommGroup M] [Module R M] [AddCommGroup N] [Module R N] (P : RootPairing ι R M N) [P.IsCrystallographic] (b : P.Base) (i j : b.support), b.cartanMatrix i i = 2 ∧ (i ≠ j → b.cartanMatrix i j ≤ 0)
  proof: |
    by
      intro ι R M N _ _ _ _ _ _ _ P _ b i j
      exact ⟨b.cartanMatrix_apply_same i, b.cartanMatrix_le_zero_of_ne i j⟩
- id: root_cartan_matrix_nondegenerate
  kind: textbook
  level: 4
  topic: 根系・Cartan行列
  statement: 標数$0$の体上の有限個の根を持つ整数値の根系の基底（単純根と単純余根がそれぞれ線形独立で、各根が単純根の、各余根が単純余根の自然数係数の和またはその符号違いであるもの）について、Cartan 行列は非退化である。
  statement_en: For a base of a crystallographic root system with finitely many roots over a field of characteristic 0, the Cartan matrix is nondegenerate.
  assumptions:
  - $R$は標数$0$の体、$P$は有限個の根を持つ整数値の根系
  - $b$は$P$の基底
  quantifiers:
  - 任意の$b$
  conclusion: Cartan 行列は非退化である。
  answer: |
    $R$を標数$0$の体、$P$を有限個の根を持つ整数値の根系、$b$を基底とする。根系なので根は$M$を張り、余根は$N$を張る。基底の定義より各根は単純根の整数係数の和なので、単純根は$M$を張る。単純根は線形独立なので$M$の基底である。同様に単純余根は$N$の基底である。
    双対は完全なので、$M$の基底と$N$の基底に関する行列$(\langle\alpha_i,\alpha_j^\vee\rangle)$は$R$上可逆である。この行列の成分は整数であり、その行列式は整数の像である。標数$0$より整数$\mathbb{Z}\to R$は単射なので、整数行列としての行列式も$0$でない。行列式が$0$でない正方行列は非退化である。
  strategy: Simple roots and coroots are bases of a perfect pairing, so the integer matrix has nonzero determinant.
  sketch:
  - 'derive: Simple roots form a basis of M and simple coroots a basis of N.'
  - 'derive: The matrix of a perfect pairing in these bases is invertible.'
  - 'derive: Its integer determinant is nonzero by characteristic 0.'
  - 'conclude: The Cartan matrix is nondegenerate.'
  openmath: (forall (Rg Pr b) (-> (and (field Rg) (field_of_char Rg 0) (root_pairing Pr) (finite_root_pairing Pr) (crystallographic_pairing Pr) (root_system Pr) (root_base b Pr)) (cartan_matrix_nondegenerate b)))
  hard_negative:
    statement: Cartan 行列は対称行列である。
    reason: 根系$B_2$の Cartan 行列の非対角成分は$-1$と$-2$であり、対称でない。
  target: |
    ∀ (ι : Type*) (R : Type*) (M : Type*) (N : Type*) [Finite ι] [Field R] [CharZero R] [AddCommGroup M] [Module R M] [AddCommGroup N] [Module R N] (P : RootPairing ι R M N) [P.IsCrystallographic] [P.IsRootSystem] (b : P.Base), b.cartanMatrix.Nondegenerate
  proof: |
    by
      intro ι R M N _ _ _ _ _ _ _ P _ _ b
      exact b.cartanMatrix_nondegenerate
- id: root_simple_difference_not_root
  kind: gap
  level: 4
  topic: 根系・単純根
  statement: 標数$0$の体上の根対の基底の単純根$\alpha_i,\alpha_j$について、$\alpha_i-\alpha_j$は根でない。
  statement_en: For simple roots alpha_i and alpha_j of a base of a root pairing over a field of characteristic 0, the difference alpha_i - alpha_j is not a root.
  assumptions:
  - $R$は標数$0$の体、$P$は根対
  - $b$は$P$の基底、$\alpha_i,\alpha_j$は単純根
  quantifiers:
  - 任意の単純根の添字$i,j$
  conclusion: $\alpha_i-\alpha_j$は根でない。
  answer: |
    $R$を標数$0$の体、$P$を根対、$b$を基底、$i,j$を単純根の添字とする。
    $i=j$なら$\alpha_i-\alpha_j=0$である。根は$0$でないので、これは根でない。実際$\langle\alpha,\alpha^\vee\rangle=2\neq 0$である。
    $i\neq j$とし、$\alpha_i-\alpha_j$が根であると仮定する。基底の定義より、この根またはその$-1$倍は単純根の自然数係数の和である。単純根は線形独立なので表示は一意であり、$\alpha_i$の係数は$1$、$\alpha_j$の係数は$-1$である。係数の符号が一致しないので矛盾である。
  strategy: Root expansions in a base have coefficients of one sign.
  sketch:
  - 'case_split: For i = j the difference is 0, which is not a root.'
  - 'contradiction: For i and j different, suppose the difference is a root.'
  - 'derive: Its coefficients in the base must all have one sign.'
  - 'conclude: The coefficients 1 and -1 give a contradiction.'
  openmath: (forall (Rg Pr b i j) (-> (and (field Rg) (field_of_char Rg 0) (root_pairing Pr) (root_base b Pr) (simple_root_index b i) (simple_root_index b j)) (notin (- (root_of Pr i) (root_of Pr j)) (root_set Pr))))
  hard_negative:
    statement: 単純根$\alpha_i,\alpha_j$の和$\alpha_i+\alpha_j$も根でない。
    reason: 根系$A_2$で$\alpha_1+\alpha_2$は根である。
  target: |
    ∀ (ι : Type*) (R : Type*) (M : Type*) (N : Type*) [Field R] [CharZero R] [AddCommGroup M] [Module R M] [AddCommGroup N] [Module R N] (P : RootPairing ι R M N) (b : P.Base) (i j : ι), i ∈ b.support → j ∈ b.support → P.root i - P.root j ∉ Set.range P.root
  proof: |
    by
      intro ι R M N _ _ _ _ _ _ P b i j hi hj
      exact b.sub_notMem_range_root hi hj
- id: lie_commutator_mem_sl
  kind: gap
  level: 3
  topic: 古典Lie環・sl
  statement: 可換環上の有限集合$n$で添字づけた正方行列$X,Y$について、$XY-YX$はトレースが$0$であり、$\mathfrak{sl}(n,R)$に属する。
  statement_en: For square matrices X, Y over a commutative ring indexed by a finite set n, the commutator XY - YX has trace 0, so it lies in sl(n,R).
  assumptions:
  - $R$は可換環、$n$は有限集合
  - $X,Y$は$n$で添字づけた$R$上の正方行列
  quantifiers:
  - 任意の$X,Y$
  conclusion: $XY-YX\in\mathfrak{sl}(n,R)$である。
  answer: |
    $R$を可換環、$n$を有限集合、$X,Y$を$n$で添字づけた$R$上の正方行列とする。$\mathfrak{sl}(n,R)$はトレース$0$の行列全体である。
    $\mathrm{tr}(XY)=\sum_{i,j}X_{ij}Y_{ji}=\sum_{i,j}Y_{ji}X_{ij}=\mathrm{tr}(YX)$なので、$\mathrm{tr}(XY-YX)=0$である。よって$XY-YX\in\mathfrak{sl}(n,R)$である。
  strategy: Use tr(XY) = tr(YX).
  sketch:
  - 'setup: sl(n,R) consists of the matrices with trace 0.'
  - 'derive: tr(XY) = tr(YX) by swapping the sum.'
  - 'conclude: XY - YX lies in sl(n,R).'
  openmath: (forall (Rg n X Y) (-> (and (comm_ring Rg) (finite_set n) (in X (matrix_ring n Rg)) (in Y (matrix_ring n Rg))) (in (- (matrix_mul X Y) (matrix_mul Y X)) (lie_sl n Rg))))
  hard_negative:
    statement: $\mathfrak{sl}(n,R)$は行列の積で閉じる。
    reason: $E_{12},E_{21}\in\mathfrak{sl}(2,R)$だが、$E_{12}E_{21}=E_{11}$のトレースは$1$である。
  target: |
    ∀ (R : Type*) (n : Type*) [CommRing R] [Fintype n] [DecidableEq n] (X Y : Matrix n n R), X * Y - Y * X ∈ LieAlgebra.SpecialLinear.sl n R
  proof: |
    by
      intro R n _ _ _ X Y
      rw [LieAlgebra.SpecialLinear.sl]
      change Matrix.trace (X * Y - Y * X) = 0
      rw [Matrix.trace_sub, Matrix.trace_mul_comm, sub_self]
- id: lie_sl_finrank
  kind: textbook
  level: 3
  topic: 古典Lie環・sl
  statement: 体$K$と空でない有限集合$n$について、$\dim_K\mathfrak{sl}(n,K)=|n|^2-1$である。
  statement_en: For a field K and a nonempty finite set n, the dimension of sl(n,K) over K is |n|^2 - 1.
  assumptions:
  - $K$は体、$n$は空でない有限集合
  quantifiers:
  - 任意の$K,n$
  conclusion: $\dim\mathfrak{sl}(n,K)=|n|^2-1$である。
  answer: |
    $K$を体、$n$を空でない有限集合とする。トレースは線形写像$\mathrm{tr}\colon M_n(K)\to K$で、核が$\mathfrak{sl}(n,K)$である。
    $n$は空でないので$i\in n$をとれる。$c\in K$に対し$\mathrm{tr}(cE_{ii})=c$なので、$\mathrm{tr}$は全射である。次元定理より$\dim\mathfrak{sl}(n,K)=\dim M_n(K)-1=|n|^2-1$である。
  strategy: sl is the kernel of the surjective trace map.
  sketch:
  - 'setup: sl(n,K) is the kernel of the trace.'
  - 'derive: The trace is surjective since tr(c E_ii) = c.'
  - 'conclude: Rank-nullity gives the dimension.'
  openmath: (forall (K n) (-> (and (field K) (finite_set n) (nonempty_set n)) (= (dim_of K (lie_sl n K)) (- (^ (size n) 2) 1))))
  hard_negative:
    statement: $\dim\mathfrak{sl}(n,K)=|n|^2-|n|$である。
    reason: $|n|=2$なら基底は$E_{12},E_{21},E_{11}-E_{22}$なので次元は$3$であり、$4-2=2$ではない。
  target: |
    ∀ (K : Type*) (n : Type*) [Field K] [Fintype n] [DecidableEq n] [Nonempty n], Module.finrank K (LieAlgebra.SpecialLinear.sl n K) = Fintype.card n ^ 2 - 1
  proof: |
    by
      intro K n _ _ _ _
      have hs : Function.Surjective (Matrix.traceLinearMap n K K) := by
        intro c
        obtain ⟨i⟩ := ‹Nonempty n›
        exact ⟨Matrix.single i i c, by simp⟩
      have h := LinearMap.finrank_range_add_finrank_ker (Matrix.traceLinearMap n K K)
      rw [LinearMap.range_eq_top.mpr hs, finrank_top, Module.finrank_self, Module.finrank_matrix] at h
      change Module.finrank K (LinearMap.ker (Matrix.traceLinearMap n K K)) = _
      simp only [Module.finrank_self, mul_one] at h
      rw [pow_two]
      omega
- id: lie_skew_adjoint_closed_under_commutator
  kind: gap
  level: 3
  topic: 古典Lie環・歪随伴
  statement: 可換環上の正方行列$J$について、$A^TJ=-JA$と$B^TJ=-JB$を満たす$A,B$の交換子$AB-BA$も同じ式を満たす。$J=1$なら$\mathfrak{so}$、$J$が標準形なら$\mathfrak{sp}$を与える。
  statement_en: For a square matrix J over a commutative ring, if A^T J = -JA and B^T J = -JB, then the commutator AB - BA satisfies the same relation. J = 1 gives so and the standard form gives sp.
  assumptions:
  - $R$は可換環、$n$は有限集合
  - $J,A,B$は$n$で添字づけた行列、$A^TJ=-JA$、$B^TJ=-JB$
  quantifiers:
  - 任意の$J,A,B$
  conclusion: $(AB-BA)^TJ=-J(AB-BA)$である。
  answer: |
    $R$を可換環、$n$を有限集合、$J,A,B$を$n$で添字づけた行列とし、$A^TJ=-JA$、$B^TJ=-JB$とする。$(AB-BA)^T=B^TA^T-A^TB^T$である。仮定を繰り返し用いると
    $B^TA^TJ=-B^TJA=JBA,\quad A^TB^TJ=-A^TJB=JAB$
    である。よって$(AB-BA)^TJ=JBA-JAB=-J(AB-BA)$である。
  strategy: Move J across with the hypotheses.
  sketch:
  - 'derive: (AB-BA)^T = B^T A^T - A^T B^T.'
  - 'derive: B^T A^T J = JBA and A^T B^T J = JAB.'
  - 'conclude: Subtracting gives the relation.'
  openmath: (forall (Rg n J A B) (-> (and (comm_ring Rg) (finite_set n) (in J (matrix_ring n Rg)) (in A (matrix_ring n Rg)) (in B (matrix_ring n Rg)) (= (matrix_mul (matrix_transpose A) J) (neg (matrix_mul J A))) (= (matrix_mul (matrix_transpose B) J) (neg (matrix_mul J B)))) (= (matrix_mul (matrix_transpose (- (matrix_mul A B) (matrix_mul B A))) J) (neg (matrix_mul J (- (matrix_mul A B) (matrix_mul B A)))))))
  hard_negative:
    statement: 同じ仮定の下で積$AB$も$(AB)^TJ=-JAB$を満たす。
    reason: 標数$2$でない体上で$J=1$、$A=B=\begin{pmatrix}0&1\\-1&0\end{pmatrix}$とすると$AB=-1$であり、$(AB)^T=-1$だが$-AB=1$である。
  target: |
    ∀ (R : Type*) (n : Type*) [CommRing R] [Fintype n] (J A B : Matrix n n R), A.transpose * J = -(J * A) → B.transpose * J = -(J * B) → (A * B - B * A).transpose * J = -(J * (A * B - B * A))
  proof: |
    by
      intro R n _ _ J A B hA hB
      rw [Matrix.transpose_sub, Matrix.transpose_mul, Matrix.transpose_mul, sub_mul, mul_assoc, mul_assoc, hA, hB]
      simp only [mul_neg, ← mul_assoc, hA, hB]
      noncomm_ring
- id: lie_so_le_sl
  kind: gap
  level: 3
  topic: 古典Lie環・so
  statement: 標数$2$でない体$K$上で、$A^T=-A$を満たす行列$A$（$\mathfrak{so}(n,K)$の元）はトレースが$0$であり、$\mathfrak{so}(n,K)\subseteq\mathfrak{sl}(n,K)$である。
  statement_en: Over a field K of characteristic different from 2, a matrix A with A^T = -A, an element of so(n,K), has trace 0, so so(n,K) is contained in sl(n,K).
  assumptions:
  - $K$は体で$2\neq 0$、$n$は有限集合
  quantifiers:
  - 任意の$A\in\mathfrak{so}(n,K)$
  conclusion: $\mathrm{tr}A=0$である。
  answer: |
    $K$を$2\neq 0$の体、$n$を有限集合、$A\in\mathfrak{so}(n,K)$とする。$A^T=-A$である。トレースは転置で変わらないので
    $\mathrm{tr}A=\mathrm{tr}A^T=-\mathrm{tr}A$
    である。よって$2\mathrm{tr}A=0$であり、$2\neq 0$より$\mathrm{tr}A=0$である。
  strategy: The trace is invariant under transpose.
  sketch:
  - 'derive: tr A = tr A^T = -tr A.'
  - 'conclude: 2 is invertible, so tr A = 0.'
  openmath: (forall (K n A) (-> (and (field K) (!= (+ 1 1) 0) (finite_set n) (in A (lie_so n K))) (in A (lie_sl n K))))
  hard_negative:
    statement: 標数$2$でも$\mathfrak{so}(n,K)\subseteq\mathfrak{sl}(n,K)$である。
    reason: 標数$2$で$|n|$が奇数なら単位行列は$A^T=A=-A$を満たすが、トレースは$|n|=1\neq 0$である。
  target: |
    ∀ (K : Type*) (n : Type*) [Field K] [NeZero (2 : K)] [Fintype n] [DecidableEq n], LieAlgebra.Orthogonal.so n K ≤ LieAlgebra.SpecialLinear.sl n K
  proof: |
    by
      intro K n _ _ _ _ A hA
      have h : A.transpose = -A := (LieAlgebra.Orthogonal.mem_so n K A).mp hA
      change Matrix.trace A = 0
      have h2 : Matrix.trace A = -Matrix.trace A := by
        conv_lhs => rw [← Matrix.trace_transpose, h, Matrix.trace_neg]
      have h3 : (2 : K) * Matrix.trace A = 0 := by
        rw [two_mul]
        nth_rw 1 [h2]
        simp
      exact (mul_eq_zero.mp h3).resolve_left (NeZero.ne 2)
- id: lie_so_finrank
  kind: textbook
  level: 3
  topic: 古典Lie環・so
  statement: 標数$2$でない体$K$上で$\dim_K\mathfrak{so}(n,K)=n(n-1)/2$である。
  statement_en: Over a field K of characteristic different from 2, the dimension of so(n,K) is n(n-1)/2.
  assumptions:
  - $K$は体で$2\neq 0$、$n\geq 0$
  quantifiers:
  - 任意の$K,n$
  conclusion: $\dim\mathfrak{so}(n,K)=n(n-1)/2$である。
  answer: |
    $K$を$2\neq 0$の体、$n\geq 0$とする。$A\in\mathfrak{so}(n,K)$なら$A_{ji}=-A_{ij}$である。$i=j$なら$A_{ii}=-A_{ii}$であり、$2\neq 0$より$A_{ii}=0$である。
    線形写像$\varphi\colon\mathfrak{so}(n,K)\to K^{\{(i,j)\mid i<j\}}$を$\varphi(A)=(A_{ij})_{i<j}$で定める。$\varphi(A)=0$なら、上の関係より$A$のすべての成分が$0$なので$\varphi$は単射である。
    任意の$(c_{ij})_{i<j}$に対し、$i<j$で$B_{ij}=c_{ij}$、$B_{ji}=-c_{ij}$、$B_{ii}=0$と定めると$B^T=-B$で$\varphi(B)=c$なので、$\varphi$は全射である。
    よって$\dim\mathfrak{so}(n,K)$は$i<j$の組の個数に等しい。$j$を固定すると$i$は$j$通り（$0\leq i<j$）なので、個数は$\sum_{j=0}^{n-1}j=n(n-1)/2$である。
  strategy: The strictly upper triangular entries are free coordinates.
  sketch:
  - 'derive: Skewness gives zero diagonal since 2 is nonzero.'
  - 'construct: phi sends A to its entries above the diagonal.'
  - 'derive: phi is injective and surjective.'
  - 'conclude: The count of pairs i < j is n(n-1)/2.'
  openmath: (forall (K n) (-> (and (field K) (!= (+ 1 1) 0) (in n N)) (= (* 2 (dim_of K (lie_so n K))) (* n (- n 1)))))
  hard_negative:
    statement: $\dim\mathfrak{so}(n,K)=n(n+1)/2$である。
    reason: $n=2$なら$\mathfrak{so}(2,K)$は$E_{12}-E_{21}$で張られる$1$次元の空間であり、$3$次元ではない。$n(n+1)/2$は対称行列の次元である。
  target: |
    ∀ (K : Type*) (n : ℕ) [Field K] [NeZero (2 : K)], Module.finrank K (LieAlgebra.Orthogonal.so (Fin n) K) = n * (n - 1) / 2
  proof: |
    by
      intro K n _ _
      have h2 : ∀ a : K, a = -a → a = 0 := by
        intro a ha
        have h3 : (2 : K) * a = 0 := by
          rw [two_mul]
          nth_rw 1 [ha]
          simp
        exact (mul_eq_zero.mp h3).resolve_left (NeZero.ne 2)
      let φ : LieAlgebra.Orthogonal.so (Fin n) K →ₗ[K] ({p : Fin n × Fin n // p.1 < p.2} → K) :=
        { toFun := fun A p => (A : Matrix (Fin n) (Fin n) K) p.1.1 p.1.2
          map_add' := fun _ _ => rfl
          map_smul' := fun _ _ => rfl }
      have hφ : Function.Bijective φ := by
        constructor
        · rw [injective_iff_map_eq_zero]
          intro A hA
          have hskew : (A : Matrix (Fin n) (Fin n) K).transpose = -(A : Matrix (Fin n) (Fin n) K) := (LieAlgebra.Orthogonal.mem_so (Fin n) K A).mp A.2
          have hs : ∀ i j, (A : Matrix (Fin n) (Fin n) K) j i = -(A : Matrix (Fin n) (Fin n) K) i j := fun i j => by
            simpa using congrFun (congrFun hskew i) j
          have hu : ∀ i j, i < j → (A : Matrix (Fin n) (Fin n) K) i j = 0 := fun i j hij => congrFun hA ⟨(i, j), hij⟩
          apply Subtype.ext
          ext i j
          rcases lt_trichotomy i j with h | h | h
          · exact hu i j h
          · subst h
            exact h2 _ (hs i i)
          · change (A : Matrix (Fin n) (Fin n) K) i j = 0
            rw [hs j i, hu j i h, neg_zero]
        · intro f
          let B : Matrix (Fin n) (Fin n) K := Matrix.of fun i j => if h : i < j then f ⟨(i, j), h⟩ else if h' : j < i then -f ⟨(j, i), h'⟩ else 0
          have hB : B ∈ LieAlgebra.Orthogonal.so (Fin n) K := by
            rw [LieAlgebra.Orthogonal.mem_so]
            ext i j
            simp only [Matrix.transpose_apply, Matrix.neg_apply, B, Matrix.of_apply]
            rcases lt_trichotomy i j with h | h | h
            · simp [h, not_lt_of_gt h]
            · subst h
              simp
            · simp [h, not_lt_of_gt h]
          refine ⟨⟨B, hB⟩, ?_⟩
          ext p
          simp [φ, B, p.2]
      have h1 := (LinearEquiv.ofBijective φ hφ).finrank_eq
      rw [h1, Module.finrank_fintype_fun_eq_card]
      have h3 : Fintype.card {p : Fin n × Fin n // p.1 < p.2} = Fintype.card (Σ j : Fin n, Fin (j : ℕ)) := by
        apply Fintype.card_congr
        exact
          { toFun := fun p => ⟨p.1.2, ⟨p.1.1, p.2⟩⟩
            invFun := fun q => ⟨(⟨q.2, q.2.2.trans q.1.2⟩, q.1), q.2.2⟩
            left_inv := fun p => rfl
            right_inv := fun q => rfl }
      rw [h3, Fintype.card_sigma]
      simp only [Fintype.card_fin]
      rw [Fin.sum_univ_eq_sum_range (fun i => i) n, Finset.sum_range_id]
- id: lie_sp_block_form
  kind: textbook
  level: 3
  topic: 古典Lie環・sp
  statement: $J=\begin{pmatrix}0&-1\\1&0\end{pmatrix}$（ブロックは$l$で添字づけた行列）に対し、$A^TJ=-JA$を満たす行列$A$の全体を$\mathfrak{sp}(l,R)$とする。$A\in\mathfrak{sp}(l,R)$であることと、$A=\begin{pmatrix}a&b\\c&-a^T\end{pmatrix}$、$b^T=b$、$c^T=c$と書けることは同値である。
  statement_en: With J the block matrix with rows (0,-1) and (1,0), let sp(l,R) be the set of A with A^T J = -JA. Then A lies in sp(l,R) if and only if A is the block matrix with rows (a,b) and (c,-a^T) where b^T = b and c^T = c.
  assumptions:
  - $R$は可換環、$l$は有限集合
  - $A$は$l\sqcup l$で添字づけた行列
  quantifiers:
  - 任意の$A$
  conclusion: $A\in\mathfrak{sp}(l,R)$と、$A$のブロック表示$\begin{pmatrix}a&b\\c&-a^T\end{pmatrix}$（$b,c$は対称）は同値である。
  answer: |
    $R$を可換環、$l$を有限集合、$A=\begin{pmatrix}a&b\\c&d\end{pmatrix}$を$l\sqcup l$で添字づけた行列とする。ブロックの積を計算すると
    $A^TJ=\begin{pmatrix}c^T&-a^T\\d^T&-b^T\end{pmatrix},\quad -JA=\begin{pmatrix}c&d\\-a&-b\end{pmatrix}$
    である。
    よって$A^TJ=-JA$は、$c^T=c$、$d=-a^T$、$d^T=-a$、$b^T=b$と同値である。第三の式は第二の式の転置である。したがって、これは$d=-a^T$、$b^T=b$、$c^T=c$と同値であり、主張の表示を意味する。
  strategy: Compute both sides in block form.
  sketch:
  - 'setup: Write A in blocks a, b, c, d.'
  - 'derive: A^T J has blocks c^T, -a^T, d^T, -b^T.'
  - 'derive: -JA has blocks c, d, -a, -b.'
  - 'conclude: Comparing blocks gives d = -a^T and symmetric b, c.'
  openmath: (forall (Rg l A) (-> (and (comm_ring Rg) (finite_set l)) (<-> (in A (lie_sp l Rg)) (exists (a b c) (and (= A (block_matrix a b c (neg (matrix_transpose a)))) (= (matrix_transpose b) b) (= (matrix_transpose c) c))))))
  hard_negative:
    statement: $A\in\mathfrak{sp}(l,R)$の右下のブロックは$a^T$である。
    reason: $R$を標数$2$でない体、$|l|=1$とする。$A=\mathrm{diag}(1,-1)$は$a=1$、$b=c=0$、$d=-1$であり、$A^TJ=-JA$を満たすので$A\in\mathfrak{sp}$である。右下のブロックは$-1$であり、$a^T=1$ではない。
  target: |
    ∀ (R : Type*) (l : Type*) [CommRing R] [Fintype l] [DecidableEq l] (A : Matrix (l ⊕ l) (l ⊕ l) R), A ∈ LieAlgebra.Symplectic.sp l R ↔ ∃ a b c : Matrix l l R, A = Matrix.fromBlocks a b c (-a.transpose) ∧ b.transpose = b ∧ c.transpose = c
  proof: |
    by
      intro R l _ _ _ A
      have key : A ∈ LieAlgebra.Symplectic.sp l R ↔ A.transpose * Matrix.J l R = Matrix.J l R * (-A) := by
        rw [LieAlgebra.Symplectic.sp, mem_skewAdjointMatricesLieSubalgebra, mem_skewAdjointMatricesSubmodule]
        rfl
      rw [key]
      constructor
      · intro h
        obtain ⟨a, b, c, d, rfl⟩ : ∃ a b c d, A = Matrix.fromBlocks a b c d := ⟨_, _, _, _, (Matrix.fromBlocks_toBlocks A).symm⟩
        simp only [Matrix.J, Matrix.fromBlocks_transpose, Matrix.fromBlocks_multiply, Matrix.fromBlocks_neg] at h
        simp only [Matrix.mul_zero, Matrix.mul_one, Matrix.zero_mul, Matrix.one_mul, Matrix.mul_neg, Matrix.neg_mul, zero_add, add_zero, neg_neg, neg_zero, Matrix.fromBlocks_inj] at h
        obtain ⟨h1, h2, h3, h4⟩ := h
        refine ⟨a, b, c, ?_, ?_, h1⟩
        · rw [← h2]
        · simpa using h4
      · rintro ⟨a, b, c, rfl, hb, hc⟩
        simp [Matrix.J, Matrix.fromBlocks_transpose, Matrix.fromBlocks_multiply, Matrix.fromBlocks_neg, hb, hc]
- id: lie_sp_le_sl
  kind: gap
  level: 3
  topic: 古典Lie環・sp
  statement: 可換環上の$\mathfrak{sp}(l,R)$の元はトレースが$0$である。すなわち$\mathfrak{sp}(l,R)\subseteq\mathfrak{sl}(l\sqcup l,R)$である。
  statement_en: Elements of sp(l,R) over a commutative ring have trace 0, so sp(l,R) is contained in sl(l plus l, R).
  assumptions:
  - $R$は可換環、$l$は有限集合
  quantifiers:
  - 任意の$A\in\mathfrak{sp}(l,R)$
  conclusion: $\mathrm{tr}A=0$である。
  answer: |
    $R$を可換環、$l$を有限集合、$A\in\mathfrak{sp}(l,R)$とする。$A$をブロック$a,b,c,d$に分ける。$A^TJ=-JA$の右上のブロックを比較すると$-a^T=d$である。
    $\mathrm{tr}A=\mathrm{tr}\,a+\mathrm{tr}\,d=\mathrm{tr}\,a-\mathrm{tr}\,a^T=0$である。標数の仮定は要らない。
  strategy: The block relation d = -a^T makes the diagonal traces cancel.
  sketch:
  - 'setup: Write A in blocks a, b, c, d.'
  - 'derive: Comparing upper right blocks gives d = -a^T.'
  - 'conclude: tr A = tr a - tr a^T = 0.'
  openmath: (forall (Rg l A) (-> (and (comm_ring Rg) (finite_set l) (in A (lie_sp l Rg))) (= (matrix_trace A) 0)))
  hard_negative:
    statement: $\mathfrak{sp}(l,K)=\mathfrak{sl}(l\sqcup l,K)$である。
    reason: $|l|=2$なら$\dim\mathfrak{sp}=|l|^2+2\cdot 3=10$であり、$\dim\mathfrak{sl}_4=15$である。
  target: |
    ∀ (R : Type*) (l : Type*) [CommRing R] [Fintype l] [DecidableEq l], LieAlgebra.Symplectic.sp l R ≤ LieAlgebra.SpecialLinear.sl (l ⊕ l) R
  proof: |
    by
      intro R l _ _ _ A hA
      have key : A.transpose * Matrix.J l R = Matrix.J l R * (-A) := by
        rw [LieAlgebra.Symplectic.sp, mem_skewAdjointMatricesLieSubalgebra, mem_skewAdjointMatricesSubmodule] at hA
        exact hA
      obtain ⟨a, b, c, d, rfl⟩ : ∃ a b c d, A = Matrix.fromBlocks a b c d := ⟨_, _, _, _, (Matrix.fromBlocks_toBlocks A).symm⟩
      simp only [Matrix.J, Matrix.fromBlocks_transpose, Matrix.fromBlocks_multiply, Matrix.fromBlocks_neg] at key
      simp only [Matrix.mul_zero, Matrix.mul_one, Matrix.zero_mul, Matrix.one_mul, Matrix.mul_neg, Matrix.neg_mul, zero_add, add_zero, neg_neg, neg_zero, Matrix.fromBlocks_inj] at key
      obtain ⟨h1, h2, h3, h4⟩ := key
      subst h2
      change Matrix.trace (Matrix.fromBlocks a b c (-a.transpose)) = 0
      simp [Matrix.trace, Fintype.sum_sum_type]
- id: lie_cross_product_hat_commutator
  kind: gap
  level: 3
  topic: 古典Lie環・so3と外積
  statement: 可換環$R$上の$3$次元ベクトル$u$に歪対称行列$\hat u$（$\hat ux=u\times x$）を対応させると、$\widehat{v\times w}=\hat v\hat w-\hat w\hat v$である。
  statement_en: Sending a three-dimensional vector u over a commutative ring to the skew-symmetric matrix hat(u) with hat(u) x = u cross x, one has hat(v cross w) = hat(v) hat(w) - hat(w) hat(v).
  assumptions:
  - $R$は可換環、$v,w\in R^3$
  - $\hat u$は行$(0,-u_2,u_1)$、$(u_2,0,-u_0)$、$(-u_1,u_0,0)$の行列
  quantifiers:
  - 任意の$v,w$
  conclusion: $\widehat{v\times w}=\hat v\hat w-\hat w\hat v$である。
  answer: |
    $R$を可換環、$v,w\in R^3$とする。行列の定義より$\hat ux=u\times x$（$x\in R^3$）である。多項式の恒等式$a\times(b\times c)=b(a\cdot c)-c(a\cdot b)$を用いる。これは可換環上で成分の比較から成り立つ。$x\in R^3$に対し
    $(\hat v\hat w-\hat w\hat v)x=v\times(w\times x)-w\times(v\times x)=w(v\cdot x)-v(w\cdot x)$
    である。一方、$(v\times w)\times x=-x\times(v\times w)=-v(x\cdot w)+w(x\cdot v)$である。両者は等しいので、$(\hat v\hat w-\hat w\hat v)x=\widehat{v\times w}x$である。$x$を標準基底にとると行列の等式を得る。
  strategy: Evaluate both matrices on a vector using the triple product expansion.
  sketch:
  - 'derive: hat(u) x = u cross x.'
  - 'derive: The commutator applied to x is w(v.x) - v(w.x).'
  - 'derive: (v cross w) cross x has the same expansion.'
  - 'conclude: Evaluate on the standard basis.'
  openmath: (forall (Rg v w) (-> (comm_ring Rg) (= (cross_hat (cross_product v w)) (- (matrix_mul (cross_hat v) (cross_hat w)) (matrix_mul (cross_hat w) (cross_hat v))))))
  hard_negative:
    statement: $\widehat{v\times w}=\hat v\hat w$である。
    reason: $v=w=e_1$とすると$v\times w=0$だが、$\hat e_1^2$は$\mathrm{diag}(0,-1,-1)$であり$0$でない。
  target: |
    ∀ (R : Type*) [CommRing R] (v w : Fin 3 → R), let hat : (Fin 3 → R) → Matrix (Fin 3) (Fin 3) R := fun u => !![0, -u 2, u 1; u 2, 0, -u 0; -u 1, u 0, 0]; hat (crossProduct v w) = hat v * hat w - hat w * hat v
  proof: |
    by
      intro R _ v w hat
      ext i j
      fin_cases i <;> fin_cases j <;> simp [hat, crossProduct, Matrix.mul_apply, Fin.sum_univ_three] <;> ring
- id: lie_uea_universal_property
  kind: textbook
  level: 4
  topic: Lie環・普遍包絡環
  statement: 可換環$R$上の Lie 環$L$と単位的結合$R$代数$A$（括弧は交換子）について、Lie 環の準同型$f\colon L\to A$に対し、$g(\iota x)=f(x)$を満たす$R$代数の準同型$g\colon U(L)\to A$が一意に存在する。
  statement_en: Universal property of the universal enveloping algebra. For a Lie algebra L over a commutative ring and a unital associative algebra A with the commutator bracket, each Lie algebra homomorphism f from L to A has a unique algebra homomorphism g from U(L) to A with g(iota x) = f(x).
  assumptions:
  - $R$は可換環、$L$は$R$上の Lie 環
  - $A$は単位的結合$R$代数、$f\colon L\to A$は Lie 環の準同型
  quantifiers:
  - 任意の$f$
  conclusion: $g\circ\iota=f$となる代数準同型$g$が一意に存在する。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$A$を単位的結合$R$代数、$f\colon L\to A$を Lie 環の準同型とする。$U(L)$はテンソル代数$T(L)$を、元$x\otimes y-y\otimes x-[x,y]$（$x,y\in L$）で生成される両側イデアル$J$で割ったものであり、$\iota$は$L\to T(L)\to U(L)$である。
    テンソル代数の普遍性より、$f$は代数準同型$F\colon T(L)\to A$に延びる。$F(x\otimes y-y\otimes x-[x,y])=f(x)f(y)-f(y)f(x)-f([x,y])=0$なので、$F(J)=0$である。よって$F$は$g\colon U(L)\to A$を誘導し、$g(\iota x)=f(x)$である。
    一意性を示す。$T(L)$は$L$の元で生成されるので、$U(L)$は$\iota(L)$で生成される。$\iota(L)$上で一致する代数準同型は等しいので、$g$は一意である。
  strategy: Lift through the tensor algebra and observe that the defining relations are killed.
  sketch:
  - 'setup: U(L) is T(L) modulo x tensor y - y tensor x - [x,y].'
  - 'construct: f extends to an algebra map F on T(L).'
  - 'derive: F kills the relations since f preserves brackets.'
  - 'derive: F induces g with g(iota x) = f(x).'
  - 'conclude: iota(L) generates U(L), so g is unique.'
  openmath: (forall (Rg L A f) (-> (and (comm_ring Rg) (lie_algebra L Rg) (algebra_over A Rg) (lie_algebra_hom f L A)) (exists (g) (and (algebra_hom_of g Rg (universal_enveloping_algebra L Rg) A) (forall (x) (-> (in x L) (= (fn_value g (uea_map x)) (fn_value f x)))) (forall (k) (-> (and (algebra_hom_of k Rg (universal_enveloping_algebra L Rg) A) (forall (x) (-> (in x L) (= (fn_value k (uea_map x)) (fn_value f x))))) (= k g)))))))
  hard_negative:
    statement: 線形写像$f\colon L\to A$なら、括弧を保たなくても$g\circ\iota=f$となる代数準同型$g$が存在する。
    reason: $L=K^2$を可換 Lie 環、$A=M_2(K)$、$f(e_1)=E_{12}$、$f(e_2)=E_{21}$とする。$\iota e_1,\iota e_2$は$U(L)$で可換だが、$f(e_1),f(e_2)$は可換でない。
  target: |
    ∀ (R : Type*) (L : Type*) (A : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] [Ring A] [Algebra R A], (letI : LieRing A := LieRing.ofAssociativeRing; letI : LieAlgebra R A := LieAlgebra.ofAssociativeAlgebra; ∀ f : L →ₗ⁅R⁆ A, ∃! g : UniversalEnvelopingAlgebra R L →ₐ[R] A, ∀ x : L, g (UniversalEnvelopingAlgebra.ι R x) = f x)
  proof: |
    by
      intro R L A _ _ _ _ _
      letI : LieRing A := LieRing.ofAssociativeRing
      letI : LieAlgebra R A := LieAlgebra.ofAssociativeAlgebra
      intro f
      refine ⟨UniversalEnvelopingAlgebra.lift R f, fun x => UniversalEnvelopingAlgebra.lift_ι_apply R f x, ?_⟩
      intro g hg
      apply (UniversalEnvelopingAlgebra.lift_unique R f g).mp
      ext x
      exact hg x
- id: lie_uea_action_on_module
  kind: gap
  level: 4
  topic: Lie環・普遍包絡環
  statement: 可換環$R$上の Lie 環$L$の加群$M$に対し、$\rho(\iota x)m=[x,m]$を満たす$R$代数の準同型$\rho\colon U(L)\to\mathrm{End}_R(M)$が一意に存在する。
  statement_en: For a module M over a Lie algebra L over a commutative ring, there is a unique algebra homomorphism rho from U(L) to End(M) with rho(iota x) m = [x,m].
  assumptions:
  - $R$は可換環、$L$は$R$上の Lie 環、$M$は$L$加群
  quantifiers:
  - 任意の$M$
  conclusion: $\rho(\iota x)m=[x,m]$となる$\rho$が一意に存在する。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$M$を$L$加群とする。$\phi\colon L\to\mathrm{End}_R(M)$を$\phi(x)(m)=[x,m]$で定める。これは線形である。加群の公理$[[x,y],m]=[x,[y,m]]-[y,[x,m]]$は$\phi([x,y])=\phi(x)\phi(y)-\phi(y)\phi(x)$を意味するので、$\phi$は交換子に関する Lie 環の準同型である。
    普遍包絡環の普遍性より、$\rho\circ\iota=\phi$となる代数準同型$\rho\colon U(L)\to\mathrm{End}_R(M)$が一意に存在する。条件$\rho(\iota x)m=[x,m]$は$\rho\circ\iota=\phi$と同じである。
  strategy: The action is a Lie homomorphism into End(M); apply the universal property.
  sketch:
  - 'construct: phi(x)(m) = [x,m] defines a linear map to End(M).'
  - 'derive: The module axiom says phi preserves brackets.'
  - 'apply_theorem: The universal property gives a unique rho.'
  - 'conclude: The condition on rho is rho composed with iota equal to phi.'
  openmath: (forall (Rg L M) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_module M L Rg)) (exists (g) (and (algebra_hom_of g Rg (universal_enveloping_algebra L Rg) (endomorphism_lie_algebra Rg M)) (forall (x m) (-> (and (in x L) (in m M)) (= (fn_value (fn_value g (uea_map x)) m) (lie_action x m)))) (forall (k) (-> (and (algebra_hom_of k Rg (universal_enveloping_algebra L Rg) (endomorphism_lie_algebra Rg M)) (forall (x m) (-> (and (in x L) (in m M)) (= (fn_value (fn_value k (uea_map x)) m) (lie_action x m))))) (= k g)))))))
  hard_negative:
    statement: この$\rho$は常に単射である。
    reason: $L=K$を$1$次元 Lie 環、$M$を自明な$1$次元加群とする。$U(L)=K[t]$であり、$\rho(t)=0$なので$\rho$は単射でない。
  target: |
    ∀ (R : Type*) (L : Type*) (M : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] [AddCommGroup M] [Module R M] [LieRingModule L M] [LieModule R L M], ∃! ρ : UniversalEnvelopingAlgebra R L →ₐ[R] Module.End R M, ∀ (x : L) (m : M), ρ (UniversalEnvelopingAlgebra.ι R x) m = ⁅x, m⁆
  proof: |
    by
      intro R L M _ _ _ _ _ _ _
      letI : LieRing (Module.End R M) := LieRing.ofAssociativeRing
      letI : LieAlgebra R (Module.End R M) := LieAlgebra.ofAssociativeAlgebra
      refine ⟨UniversalEnvelopingAlgebra.lift R (LieModule.toEnd R L M), fun x m => ?_, ?_⟩
      · rw [UniversalEnvelopingAlgebra.lift_ι_apply]
        rfl
      · intro g hg
        apply (UniversalEnvelopingAlgebra.lift_unique R (LieModule.toEnd R L M) g).mp
        ext x m
        exact hg x m
- id: lie_free_universal_property
  kind: textbook
  level: 4
  topic: Lie環・自由Lie環
  statement: 可換環$R$上の自由 Lie 環$F(X)$は普遍性を持つ。すなわち Lie 環$L$と写像$f\colon X\to L$に対し、$g(x)=f(x)$を満たす Lie 環の準同型$g\colon F(X)\to L$が一意に存在する。
  statement_en: Universal property of the free Lie algebra F(X) over a commutative ring. For a Lie algebra L and a map f from X to L, there is a unique Lie algebra homomorphism g from F(X) to L with g(x) = f(x).
  assumptions:
  - $R$は可換環、$X$は集合、$L$は$R$上の Lie 環
  - $f\colon X\to L$は写像
  quantifiers:
  - 任意の$X,L,f$
  conclusion: $g(x)=f(x)$となる Lie 環の準同型$g$が一意に存在する。
  answer: |
    $R$を可換環、$X$を集合、$L$を$R$上の Lie 環、$f\colon X\to L$を写像とする。$F(X)$は、$X$上の自由非結合代数$N(X)$を、交代性$a\cdot a=0$と Jacobi 恒等式が生成する合同関係で割ったものである。
    $L$を括弧を積とする非結合代数とみると、$N(X)$の普遍性より、$f$は積を保つ線形写像$G\colon N(X)\to L$に延びる。$L$は Lie 環なので交代性と Jacobi 恒等式を満たす。よって$G$は合同関係で同じ類の元を同じ値へ移し、Lie 環の準同型$g\colon F(X)\to L$を誘導する。$g(x)=f(x)$である。
    $F(X)$は$X$の像で生成される Lie 環なので、$X$上で一致する準同型は等しい。よって$g$は一意である。
  strategy: Lift through the free nonassociative algebra and pass to the quotient.
  sketch:
  - 'setup: F(X) is the free nonassociative algebra modulo the Lie relations.'
  - 'construct: f extends to a multiplicative linear map G.'
  - 'derive: G respects the Lie relations since L is a Lie algebra.'
  - 'conclude: The induced g is unique because X generates F(X).'
  openmath: (forall (Rg L X f) (-> (and (comm_ring Rg) (lie_algebra L Rg)) (exists (g) (and (lie_algebra_hom g (free_lie_algebra Rg X) L) (forall (x) (-> (in x X) (= (fn_value g (free_lie_generator x)) (fn_value f x)))) (forall (k) (-> (and (lie_algebra_hom k (free_lie_algebra Rg X) L) (forall (x) (-> (in x X) (= (fn_value k (free_lie_generator x)) (fn_value f x))))) (= k g)))))))
  hard_negative:
    statement: 生成元の写像$f\colon\{e,f\}\to L$は、$\mathfrak{sl}_2$からの準同型へ常に延びる。
    reason: $\mathrm{char}\,K\neq 2$、$L=K$（可換）、$e,f\mapsto 1$とする。準同型なら$h=[e,f]\mapsto 0$であり、$[h,e]=2e$から$0=2$となる。$\mathfrak{sl}_2$は$e,f$上の自由 Lie 環でない。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] (X : Type*) (f : X → L), ∃! g : FreeLieAlgebra R X →ₗ⁅R⁆ L, ∀ x : X, g (FreeLieAlgebra.of R x) = f x
  proof: |
    by
      intro R L _ _ _ X f
      refine ⟨FreeLieAlgebra.lift R f, fun x => FreeLieAlgebra.lift_of_apply f x, ?_⟩
      intro g hg
      apply (FreeLieAlgebra.lift_unique f g).mp
      ext x
      exact hg x
- id: lie_group_left_invariant_field_determined
  kind: gap
  level: 4
  topic: Lie群・左不変ベクトル場
  statement: 体$\mathbb{K}$上の Lie 群$G$（$\mathbb{R},\mathbb{C}$上は$C^3$級、他の体では解析的）のベクトル場$V$が、すべての左移動$L_g$による引き戻しで不変なら、$V$は$V(1)$から定まる左不変場$X_{V(1)}$に等しい。ここで$X_v(g)=d(L_g)_1v$である。
  statement_en: If a vector field V on a Lie group G over a nontrivially normed field, of class C^3 over the reals or complex numbers and analytic otherwise, is invariant under pullback by every left translation, then V equals the left-invariant field X_{V(1)}, where X_v(g) = d(L_g)_1 v.
  assumptions:
  - $\mathbb{K}$は非自明な付値を持つ正規体、$G$はその上の Lie 群（$\mathbb{R},\mathbb{C}$上は$C^3$級、他は解析的）
  - $V$は$G$のベクトル場で、すべての$g$について$L_g^*V=V$
  quantifiers:
  - 任意の$V$
  conclusion: $X_{V(1)}=V$である。
  answer: |
    $\mathbb{K}$を非自明な付値を持つ正規体、$G$を$\mathbb{K}$上の Lie 群とし、$V$を$L_g^*V=V$（すべての$g$）を満たすベクトル場とする。$(L_g^*V)(x)=(d(L_g)_x)^{-1}V(gx)$である。$L_g$は逆写像$L_{g^{-1}}$を持つ可微分同相なので、微分は可逆である。
    $g\in G$を固定し、$x=1$で不変性を用いると$(d(L_g)_1)^{-1}V(g)=V(1)$である。よって$V(g)=d(L_g)_1V(1)=X_{V(1)}(g)$である。$g$は任意なので$V=X_{V(1)}$である。
  strategy: Evaluate the invariance at the identity.
  sketch:
  - 'setup: The pullback is (d(L_g)_x)^(-1) V(gx).'
  - 'derive: At x = 1 invariance gives V(g) = d(L_g)_1 V(1).'
  - 'conclude: So V = X_{V(1)}.'
  openmath: (forall (G V) (-> (and (lie_group G) (left_pullback_invariant V)) (= (left_invariant_field (field_value_at_one V)) V)))
  hard_negative:
    statement: ベクトル場$V$は、不変性を仮定しなくても$V(1)$で定まる。
    reason: 加法群$G=\mathbb{R}$で$V(t)=t\,\partial_t$とすると$V(0)=0$だが$V\neq 0$である。不変でないベクトル場は$1$での値で定まらない。
  target: |
    ∀ (𝕜 : Type*) [NontriviallyNormedField 𝕜] (H : Type*) [TopologicalSpace H] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] (I : ModelWithCorners 𝕜 E H) (G : Type*) [TopologicalSpace G] [ChartedSpace H G] [Group G] [LieGroup I (minSmoothness 𝕜 3) G] (V : (g : G) → TangentSpace I g), (∀ g : G, VectorField.mpullback I I (fun x => g * x) V = V) → mulInvariantVectorField (V 1) = V
  proof: |
    by
      intro 𝕜 _ H _ E _ _ I G _ _ _ _ V hV
      ext g
      rw [mulInvariantVectorField_eq_mpullback, hV]
- id: lie_group_bracket_of_invariant_fields
  kind: textbook
  level: 4
  topic: Lie群・左不変ベクトル場
  statement: 完備な正規空間をモデルとする Lie 群$G$（$\mathbb{R},\mathbb{C}$上は$C^3$級、他の体では解析的）で、$T_1G$の括弧を$[v,w]=[X_v,X_w](1)$と定めると、$X_{[v,w]}=[X_v,X_w]$である。すなわち左不変場の括弧は左不変である。
  statement_en: For a Lie group G modelled on a complete normed space, of class C^3 over the reals or complex numbers and analytic otherwise, with bracket [v,w] = [X_v,X_w](1) on the tangent space at 1, one has X_{[v,w]} = [X_v,X_w]; thus the bracket of left-invariant fields is left-invariant.
  assumptions:
  - $G$は完備な正規空間をモデルとする Lie 群（$\mathbb{R},\mathbb{C}$上は$C^3$級、他は解析的）
  - $v,w\in T_1G$、$X_v(g)=d(L_g)_1v$
  quantifiers:
  - 任意の$v,w$
  conclusion: $X_{[v,w]}=[X_v,X_w]$である。
  answer: |
    $G$を完備な正規空間をモデルとする Lie 群とし、$v,w\in T_1G$とする。$X_v$は$L_g^*X_v=X_v$を満たす。実際、連鎖律より$d(L_g)_x\,d(L_x)_1v=d(L_{gx})_1v$なので$X_v(gx)=d(L_g)_xX_v(x)$である。また$X_v$は$C^2$級である。
    ベクトル場の括弧は可微分同相の引き戻しと可換である。よって
    $L_g^*[X_v,X_w]=[L_g^*X_v,L_g^*X_w]=[X_v,X_w]$
    であり、$[X_v,X_w]$は不変である。引き戻しで不変なベクトル場は$1$での値から定まるので、$[X_v,X_w]=X_{[X_v,X_w](1)}=X_{[v,w]}$である。
  strategy: Invariance of X_v and naturality of the bracket make [X_v,X_w] invariant; invariant fields are determined at 1.
  sketch:
  - 'derive: X_v is invariant under left translation by the chain rule.'
  - 'derive: Pullback by a diffeomorphism commutes with the bracket.'
  - 'derive: So [X_v,X_w] is invariant.'
  - 'conclude: It equals X with value [v,w] at 1.'
  openmath: (forall (G v w) (-> (and (lie_group G) (in v (lie_group_tangent G)) (in w (lie_group_tangent G))) (= (left_invariant_field (lie_bracket v w)) (vector_field_bracket (left_invariant_field v) (left_invariant_field w)))))
  hard_negative:
    statement: 右不変ベクトル場$R_v$でも$R_{[v,w]}=[R_v,R_w]$である。
    reason: 右不変場については逆元との対応で符号が変わり、$[R_v,R_w]=-R_{[v,w]}$である。$G$が非可換で$[v,w]\neq 0$なら両者は異なる。
  target: |
    ∀ (𝕜 : Type*) [NontriviallyNormedField 𝕜] (H : Type*) [TopologicalSpace H] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [CompleteSpace E] (I : ModelWithCorners 𝕜 E H) (G : Type*) [TopologicalSpace G] [ChartedSpace H G] [Group G] [LieGroup I (minSmoothness 𝕜 3) G] (v w : GroupLieAlgebra I G), mulInvariantVectorField ⁅v, w⁆ = VectorField.mlieBracket I (mulInvariantVectorField v) (mulInvariantVectorField w)
  proof: |
    by
      intro 𝕜 _ H _ E _ _ _ I G _ _ _ _ v w
      exact mulInvariantVector_mlieBracket v w
- id: lie_group_tangent_jacobi
  kind: textbook
  level: 4
  topic: Lie群・Lie環
  statement: 完備な正規空間をモデルとする Lie 群$G$（$\mathbb{R},\mathbb{C}$上は$C^3$級、他の体では解析的）の$T_1G$は、括弧$[v,w]=[X_v,X_w](1)$について$[v,v]=0$と Jacobi 恒等式$[u,[v,w]]=[[u,v],w]+[v,[u,w]]$を満たす。すなわち Lie 環である。
  statement_en: The tangent space at the identity of a Lie group G modelled on a complete normed space, of class C^3 over the reals or complex numbers and analytic otherwise, satisfies [v,v] = 0 and the Jacobi identity for the bracket [v,w] = [X_v,X_w](1), so it is a Lie algebra.
  assumptions:
  - $G$は完備な正規空間をモデルとする Lie 群（$\mathbb{R},\mathbb{C}$上は$C^3$級、他は解析的）
  - $u,v,w\in T_1G$
  quantifiers:
  - 任意の$u,v,w$
  conclusion: $[v,v]=0$かつ$[u,[v,w]]=[[u,v],w]+[v,[u,w]]$である。
  answer: |
    $G$を完備な正規空間をモデルとする Lie 群、$u,v,w\in T_1G$とする。ベクトル場の括弧は$[V,V]=0$を満たすので、$[v,v]=[X_v,X_v](1)=0$である。
    左不変場の括弧の公式$X_{[v,w]}=[X_v,X_w]$より
    $[u,[v,w]]=[X_u,X_{[v,w]}](1)=[X_u,[X_v,X_w]](1)$
    である。同様に$[[u,v],w]=[[X_u,X_v],X_w](1)$、$[v,[u,w]]=[X_v,[X_u,X_w]](1)$である。$X_u,X_v,X_w$は$C^2$級なので、ベクトル場の Jacobi 恒等式$[X_u,[X_v,X_w]]=[[X_u,X_v],X_w]+[X_v,[X_u,X_w]]$が成り立つ。$1$で評価すれば主張を得る。
  strategy: Transfer the Jacobi identity of vector fields through X_{[v,w]} = [X_v,X_w].
  sketch:
  - 'derive: [v,v] = [X_v,X_v](1) = 0.'
  - 'derive: X_{[v,w]} = [X_v,X_w] rewrites each double bracket as a bracket of fields.'
  - 'apply_theorem: The Jacobi identity holds for C^2 vector fields.'
  - 'conclude: Evaluating at 1 gives the identity.'
  openmath: (forall (G u v w) (-> (and (lie_group G) (in u (lie_group_tangent G)) (in v (lie_group_tangent G)) (in w (lie_group_tangent G))) (and (= (lie_bracket v v) 0) (= (lie_bracket u (lie_bracket v w)) (+ (lie_bracket (lie_bracket u v) w) (lie_bracket v (lie_bracket u w)))))))
  hard_negative:
    statement: $T_1G$の括弧は結合的である。
    reason: $G=SO(3)$では$T_1G$は外積を括弧とする$\mathbb{R}^3$である。$e_1\times(e_1\times e_2)=-e_2$だが$(e_1\times e_1)\times e_2=0$である。
  target: |
    ∀ (𝕜 : Type*) [NontriviallyNormedField 𝕜] (H : Type*) [TopologicalSpace H] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [CompleteSpace E] (I : ModelWithCorners 𝕜 E H) (G : Type*) [TopologicalSpace G] [ChartedSpace H G] [Group G] [LieGroup I (minSmoothness 𝕜 3) G] (u v w : GroupLieAlgebra I G), ⁅v, v⁆ = 0 ∧ ⁅u, ⁅v, w⁆⁆ = ⁅⁅u, v⁆, w⁆ + ⁅v, ⁅u, w⁆⁆
  proof: |
    by
      intro 𝕜 _ H _ E _ _ _ I G _ _ _ _ u v w
      exact ⟨lie_self v, leibniz_lie u v w⟩
- id: lie_group_left_invariant_derivation_commutator
  kind: gap
  level: 4
  topic: Lie群・左不変導分
  statement: 滑らかな乗法を持つ多様体$G$の滑らかな関数環の左不変導分$X,Y$（$X(f\circ L_g)=(Xf)\circ L_g$）について、$Z(f)=X(Yf)-Y(Xf)$で定まる$Z$も左不変導分である。
  statement_en: For left-invariant derivations X, Y of the smooth functions on a manifold G with smooth multiplication, meaning X(f composed with L_g) = (Xf) composed with L_g, the operator Z(f) = X(Yf) - Y(Xf) is again a left-invariant derivation.
  assumptions:
  - $G$は滑らかな乗法を持つ多様体
  - $X,Y$は$C^\infty(G)$の左不変導分
  quantifiers:
  - 任意の$X,Y$
  conclusion: $Z=XY-YX$は左不変導分である。
  answer: |
    $G$を滑らかな乗法を持つ多様体、$X,Y$を$C^\infty(G)$の左不変導分とする。左不変性は、すべての$g$と$f$について$X(f\circ L_g)=(Xf)\circ L_g$が成り立つことと同値である。$Z(f)=X(Yf)-Y(Xf)$とおく。
    $Z$は線形である。$f,k\in C^\infty(G)$について、Leibniz 則より$X(Y(fk))=X(f\,Yk+k\,Yf)=Xf\,Yk+f\,XYk+Xk\,Yf+k\,XYf$である。$X,Y$を入れ替えて引くと、中間の項が打ち消し合い$Z(fk)=f\,Z(k)+k\,Z(f)$である。よって$Z$は導分である。
    左不変性より$X(Y(f\circ L_g))=X((Yf)\circ L_g)=(XYf)\circ L_g$である。同様に$Y(X(f\circ L_g))=(YXf)\circ L_g$である。差をとると$Z(f\circ L_g)=(Zf)\circ L_g$である。
  strategy: Check the Leibniz rule and left invariance of the commutator.
  sketch:
  - 'derive: Expanding X(Y(fk)) and Y(X(fk)), the cross terms cancel.'
  - 'derive: So Z is a derivation.'
  - 'derive: X(Y(f composed with L_g)) = (XYf) composed with L_g.'
  - 'conclude: Z is left-invariant.'
  openmath: (forall (G X Y) (-> (and (left_invariant_derivation X G) (left_invariant_derivation Y G)) (exists (W) (and (left_invariant_derivation W G) (forall (f) (= (derivation_apply W f) (- (derivation_apply X (derivation_apply Y f)) (derivation_apply Y (derivation_apply X f)))))))))
  hard_negative:
    statement: 左不変導分の合成$XY$も導分である。
    reason: $G=\mathbb{R}$、$X=Y=d/dt$、$f=g=t$とすると$(fg)''=2$だが、$f\,g''+g\,f''=0$である。
  target: |
    ∀ (𝕜 : Type*) [NontriviallyNormedField 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] (H : Type*) [TopologicalSpace H] (I : ModelWithCorners 𝕜 E H) (G : Type*) [TopologicalSpace G] [ChartedSpace H G] [Monoid G] [ContMDiffMul I (⊤ : ENat) G] (X Y : LeftInvariantDerivation I G), ∃ Z : LeftInvariantDerivation I G, ∀ f : ContMDiffMap I (modelWithCornersSelf 𝕜 𝕜) G 𝕜 (⊤ : ENat), Z f = X (Y f) - Y (X f)
  proof: |
    by
      intro 𝕜 _ E _ _ H _ I G _ _ _ _ X Y
      exact ⟨⁅X, Y⁆, fun f => LeftInvariantDerivation.commutator_apply X Y f⟩
