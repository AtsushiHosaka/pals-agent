  answer: |
    $K$を標数$0$の体、$L$を有限次元 Lie 環、$H$を Cartan 部分環とし、各$\mathrm{ad}\,h$の一般固有空間が$L$を張るとする。このとき$L=\bigoplus_\chi L_\chi$で、$L_\chi\neq 0$となる$\chi$は有限個である。
