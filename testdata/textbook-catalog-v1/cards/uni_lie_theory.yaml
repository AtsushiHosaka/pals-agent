- id: lie_root_apply_coroot
  kind: gap
  level: 4
  topic: Lie環・根の性質
  statement: Killing 形式が非退化な有限次元 Lie 環（標数$0$）と Cartan 部分環$H$（各$\mathrm{ad}\,h$の一般固有空間が$L$を張る）について、$0$でない根$\alpha$は$\alpha(t_\alpha)\neq 0$を満たし、余根$\alpha^\vee=2t_\alpha/\alpha(t_\alpha)$は$\alpha(\alpha^\vee)=2$を満たす。
  statement_en: For a finite-dimensional Lie algebra over a field of characteristic 0 with nondegenerate Killing form and a Cartan subalgebra with generalized eigenspaces spanning L, a nonzero root alpha satisfies alpha(t_alpha) nonzero, and the coroot 2 t_alpha / alpha(t_alpha) satisfies alpha(coroot) = 2.
  assumptions:
  - $K$は標数$0$の体、$L$は有限次元 Lie 環で$\kappa$は非退化
  - $H$は Cartan 部分環、各$\mathrm{ad}\,h$の一般固有空間は$L$を張る
  - $\alpha\neq 0$は根
  quantifiers:
  - 任意の根$\alpha\neq 0$
  conclusion: $\alpha(\alpha^\vee)=2$である。
  answer: |
    $K$を標数$0$の体、$L$を有限次元 Lie 環で$\kappa$は非退化、$H$を Cartan 部分環とし、各$\mathrm{ad}\,h$の一般固有空間が$L$を張るとする。$\alpha\neq 0$を根とし、$t=t_\alpha$とおく。$\alpha\neq 0$なので$t\neq 0$である。$\alpha(t)\neq 0$を示せば、$\alpha(\alpha^\vee)=2\alpha(t)/\alpha(t)=2$である。
    $\alpha(t)=0$と仮定する。$e\in L_\alpha$、$e\neq 0$をとる。$\kappa$は非退化で根空間の直交性があるので、$\kappa(e,f)\neq 0$となる$f\in L_{-\alpha}$がある。定数倍して$\kappa(e,f)=1$とすると$[e,f]=t$である。
    $\beta$を任意の根とする。$M=\bigoplus_{n\in\mathbb{Z}}L_{\beta+n\alpha}$は有限和で、$\mathrm{ad}\,e,\mathrm{ad}\,f$で保たれる。$t=[e,f]$は$M$上で交換子として働くので$\mathrm{tr}_M\mathrm{ad}\,t=0$である。一方、$L_{\beta+n\alpha}$上で$\mathrm{ad}\,t$は$(\beta+n\alpha)(t)=\beta(t)$倍である。よって$(\dim M)\beta(t)=0$であり、標数$0$と$\dim M>0$より$\beta(t)=0$である。
    すべての根$\beta$で$\beta(t)=0$なので、$h\in H$について$\kappa(t,h)=\sum_\beta(\dim L_\beta)\beta(t)\beta(h)=0$である。$\kappa|_H$の非退化性より$t=0$となり、矛盾である。
  strategy: If alpha(t) = 0, a trace on an alpha-string shows every root vanishes at t, forcing t = 0.
  sketch:
  - 'setup: Reduce to alpha(t) nonzero.'
  - 'contradiction: Suppose alpha(t) = 0 and choose e, f with [e,f] = t.'
  - 'derive: On the string M through beta, the trace of ad t is 0 and also (dim M) beta(t).'
  - 'derive: So beta(t) = 0 for every root beta.'
  - 'derive: kappa(t,h) is a sum containing beta(t), so it vanishes.'
  - 'conclude: t = 0, contradicting alpha nonzero.'
  openmath: (forall (K L H a) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (finite_dimensional L) (killing_nondegenerate L) (cartan_subalgebra H L) (triangularizable_action H L) (lie_root a H)) (and (!= (fn_value a (killing_dual_vector a)) 0) (= (fn_value a (lie_coroot a)) 2))))
