  assumptions:
  - $K$は標数$0$の体、$L$は有限次元 Lie 環で$\kappa$は非退化
  - $H$は Cartan 部分環、各$\mathrm{ad}\,h$の一般固有空間は$L$を張る
  - $\alpha\neq 0$は根
  quantifiers:
  - 任意の根$\alpha\neq 0$
  conclusion: $e\in L_\alpha$、$f\in L_{-\alpha}$、$h=\alpha^\vee$の三つ組が存在する。
  answer: |
    $K$を標数$0$の体、$L$を有限次元 Lie 環で$\kappa$は非退化、$H$を Cartan 部分環とし、各$\mathrm{ad}\,h$の一般固有空間が$L$を張るとする。$\alpha\neq 0$を根とする。$e\in L_\alpha$、$e\neq 0$をとる。
    $\kappa$は非退化で、根空間の直交性より$e$と内積が$0$でないのは$L_{-\alpha}$の元だけなので、$\kappa(e,f')\neq 0$となる$f'\in L_{-\alpha}$がある。$\alpha(t_\alpha)\neq 0$なので、$f'$を定数倍して$\kappa(e,f)=2/\alpha(t_\alpha)$となる$f\in L_{-\alpha}$をとれる。
