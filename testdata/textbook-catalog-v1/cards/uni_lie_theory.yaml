  topic: Lie環・根空間とKilling形式
  statement: 標数$0$の体上の有限次元 Lie 環$L$の Killing 形式が非退化で、$H$が Cartan 部分環（各$\mathrm{ad}\,h$の一般固有空間が$L$を張る）なら、$x\in L_\alpha$、$h\in H$について$[h,x]=\alpha(h)x$である。すなわち一般固有ベクトルは固有ベクトルである。
  statement_en: If the Killing form of a finite-dimensional Lie algebra over a field of characteristic 0 is nondegenerate and H is a Cartan subalgebra with generalized eigenspaces of ad h spanning L, then [h,x] = alpha(h) x for x in the root space L_alpha and h in H.
  assumptions:
  - $K$は標数$0$の体、$L$は有限次元 Lie 環で$\kappa$は非退化
  - $H$は Cartan 部分環、各$\mathrm{ad}\,h$の一般固有空間は$L$を張る
  - $x\in L_\alpha$、$h\in H$
  quantifiers:
  - 任意の$\alpha,x,h$
  conclusion: $[h,x]=\alpha(h)x$である。
  answer: |
    $K$を標数$0$の体、$L$を有限次元 Lie 環で$\kappa$は非退化、$H$を Cartan 部分環とし、各$\mathrm{ad}\,h$の一般固有空間が$L$を張るとする。$H$は可換であり、$\kappa|_H$は非退化である。$h\in H$を固定し、$D=\mathrm{ad}\,h$とおく。$D$が対角化可能であることを示せばよい。対角化可能なら一般固有空間と固有空間が一致するので、$x\in L_\alpha$について$[h,x]=\alpha(h)x$が従う。
    仮定より$L$は$D$の一般固有空間$L^\lambda$の直和である。$s$を各$L^\lambda$上で$\lambda$倍となる線形写像とし、$n=D-s$とおく。$s$は対角化可能、$n$は冪零、$sn=ns$であり、中国剰余定理より$s,n$は$D$の定数項のない多項式である。
    $s,n$が導分であることを示す。$D$は導分なので$(D-\lambda-\mu)[u,v]=[(D-\lambda)u,v]+[u,(D-\mu)v]$であり、これを繰り返すと$[L^\lambda,L^\mu]\subseteq L^{\lambda+\mu}$を得る。よって$u\in L^\lambda$、$v\in L^\mu$について$s[u,v]=(\lambda+\mu)[u,v]=[su,v]+[u,sv]$であり、$s$は導分である。$n=D-s$も導分である。$\kappa$は非退化なので導分は内部導分であり、$n=\mathrm{ad}\,h_n$となる$h_n\in L$がある。
    $H$は可換なので$D$は$H$を消す。$n$は$D$の定数項のない多項式なので$n(H)=0$である。よって$[h_n,H]=0$であり、$h_n$は$H$を正規化する。$H$は自己正規化なので$h_n\in H$である。
    $v\in H$に対し$\mathrm{ad}\,h_n$と$\mathrm{ad}\,v$は可換で$\mathrm{ad}\,h_n$は冪零なので、積は冪零であり$\kappa(h_n,v)=0$である。$\kappa|_H$の非退化性より$h_n=0$である。よって$n=0$であり、$D=s$は対角化可能である。
  strategy: The nilpotent part of ad h is an inner derivation by an element of H that is Killing-orthogonal to H, hence zero.
  sketch:
  - 'setup: Reduce to diagonalizability of D = ad h.'
  - 'construct: Let s act by lambda on each generalized eigenspace L^lambda, and put n = D - s; both are polynomials in D without constant term.'
  - 'derive: [L^lambda, L^mu] lies in L^(lambda+mu), so s and n are derivations.'
  - 'apply_theorem: Derivations are inner, so n = ad h_n.'
  - 'derive: n kills H, so h_n normalizes H and lies in H.'
  - 'derive: ad h_n ad v is nilpotent for v in H, so kappa(h_n,H) = 0.'
  - 'conclude: h_n = 0, so D = s is diagonalizable and [h,x] = alpha(h) x.'
  openmath: (forall (K L H a x h) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (finite_dimensional L) (killing_nondegenerate L) (cartan_subalgebra H L) (triangularizable_action H L) (in x (root_space H a)) (in h H)) (= (lie_bracket h x) (* (fn_value a h) x))))
