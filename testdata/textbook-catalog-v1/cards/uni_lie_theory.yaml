- id: lie_cartan_exists_engel
  kind: textbook
  level: 4
  topic: Lie環・Cartan部分環
  statement: 無限体$K$上の有限次元 Lie 環$L$には、$E(x)$が Cartan 部分環になる$x\in L$が存在する。
  statement_en: A finite-dimensional Lie algebra L over an infinite field has an element x such that the Engel subalgebra E(x) is a Cartan subalgebra.
  assumptions:
  - $K$は無限体、$L$は有限次元 Lie 環
  quantifiers:
  - 任意の$L$
  conclusion: $E(x)$が Cartan 部分環となる$x$が存在する。
  answer: |
    $K$を無限体、$L$を有限次元 Lie 環とする。$\dim E(x)$が最小となる$x$をとり、$E=E(x)$、$n=\dim E$とおく。$E$は部分 Lie 環であり自己正規化である。$E$が冪零であることを示せばよい。
    $y\in E$、$t\in K$とし、$z_t=x+ty$とおく。$z_t\in E$なので$\mathrm{ad}\,z_t$は$E$と$L/E$を保つ。$d(t)$を$L/E$上の$\mathrm{ad}\,z_t$の行列式とする。$d$は$t$の多項式である。Fitting の補題より$\mathrm{ad}\,x$は$L/E$上可逆なので$d(0)\neq 0$であり、$d\neq 0$である。
    $K$は無限体なので、$d(t)\neq 0$となる$t$は無限個ある。そのような$t$では$\mathrm{ad}\,z_t$は$L/E$上可逆なので$E(z_t)\subseteq E$である。最小性より$E(z_t)=E$であり、$\mathrm{ad}\,z_t$は$E$上冪零で、$(\mathrm{ad}_Ez_t)^n=0$である。
    $(\mathrm{ad}_Ex+t\,\mathrm{ad}_Ey)^n$の各成分は$t$の多項式で、無限個の$t$で$0$なので恒等的に$0$である。$t^n$の係数を見ると$(\mathrm{ad}_Ey)^n=0$である。$y\in E$は任意なので、Engel の定理より$E$は冪零である。
  strategy: Take E(x) of minimal dimension; a polynomial argument shows every element of E acts nilpotently on E.
  sketch:
  - 'setup: Choose x with E = E(x) of minimal dimension n.'
  - 'construct: For y in E put z_t = x + ty and let d(t) be the determinant on L/E.'
  - 'derive: d(0) is nonzero, so d(t) is nonzero for infinitely many t.'
  - 'derive: For those t, E(z_t) = E, so (ad z_t on E)^n = 0.'
  - 'derive: As a polynomial identity in t, the coefficient of t^n gives (ad y on E)^n = 0.'
  - 'apply_theorem: Engel''s theorem makes E nilpotent, and E is self-normalizing.'
  openmath: (forall (K L) (-> (and (field K) (infinite_set K) (lie_algebra L K) (finite_dimensional L)) (exists (x) (and (in x L) (cartan_subalgebra (engel_subalgebra x) L)))))
  hard_negative:
    statement: すべての$x\in L$について$E(x)$は Cartan 部分環である。
    reason: $x=0$なら$E(0)=L$である。標数$0$の体上の$L=\mathfrak{sl}_2$は冪零でないので Cartan 部分環でない。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] [Infinite K], ∃ x : L, (LieSubalgebra.engel K x).IsCartanSubalgebra
  proof: |
    by
      intro K L _ _ _ _ _
      exact LieAlgebra.exists_isCartanSubalgebra_engel K L
