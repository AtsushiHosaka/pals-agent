- id: lie_engel_subalgebra_self_normalizing
  kind: gap
  level: 4
  topic: Lie環・Cartan部分環
  statement: Lie 環$L$の元$x$に対し$E(x)=\{y\mid(\mathrm{ad}\,x)^ny=0\ \text{となる}\ n\ \text{がある}\}$とおくと、$E(x)$は自己正規化な部分 Lie 環である。
  statement_en: For x in a Lie algebra L over a commutative ring, the Engel subalgebra E(x), the set of y with (ad x)^n y = 0 for some n, is its own normalizer.
  assumptions:
  - $L$は可換環$R$上の Lie 環、$x\in L$
  quantifiers:
  - 任意の$x$
  conclusion: $E(x)$の正規化部分環は$E(x)$である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$x\in L$とする。$(\mathrm{ad}\,x)^n[y,z]=\sum_{i+j=n}\binom{n}{i}[(\mathrm{ad}\,x)^iy,(\mathrm{ad}\,x)^jz]$より、$E(x)$は部分 Lie 環である。よって$E(x)$は自身の正規化部分環に含まれる。
    逆に$y$が$E(x)$を正規化するとする。$[x,x]=0$より$x\in E(x)$なので、$[y,x]\in E(x)$であり$[x,y]\in E(x)$である。$(\mathrm{ad}\,x)^n[x,y]=0$となる$n$があり、$(\mathrm{ad}\,x)^{n+1}y=0$である。よって$y\in E(x)$である。
  strategy: x lies in E(x), so normalizing elements are killed by a power of ad x.
  sketch:
  - 'derive: The Leibniz rule makes E(x) a subalgebra.'
  - 'derive: x lies in E(x), so [x,y] lies in E(x) for y in the normalizer.'
  - 'conclude: (ad x)^(n+1) y = 0, so y lies in E(x).'
  openmath: (forall (Rg L x) (-> (and (comm_ring Rg) (lie_algebra L Rg) (in x L)) (= (lie_normalizer (engel_subalgebra x)) (engel_subalgebra x))))
