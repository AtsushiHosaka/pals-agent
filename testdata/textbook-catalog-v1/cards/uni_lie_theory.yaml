- id: lie_sl2_primitive_e_on_f_power
  kind: gap
  level: 4
  topic: Lie環・sl2の表現
  statement: $\mathfrak{sl}_2$三つ組$(h,e,f)$と固有値$\mu$の原始ベクトル$m$について、$e(f^{n+1}m)=(n+1)(\mu-n)f^nm$である。
  statement_en: For an sl_2 triple (h,e,f) and a primitive vector m with eigenvalue mu, one has e(f^(n+1) m) = (n+1)(mu - n) f^n m.
  assumptions:
  - $L$は可換環$R$上の Lie 環、$M$は$L$加群
  - $(h,e,f)$は$\mathfrak{sl}_2$三つ組、$m$は固有値$\mu$の原始ベクトル
  quantifiers:
  - 任意の$n\geq 0$
  conclusion: $e(f^{n+1}m)=(n+1)(\mu-n)f^nm$である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$M$を$L$加群、$(h,e,f)$を$\mathfrak{sl}_2$三つ組、$m$を固有値$\mu$の原始ベクトルとする。$h(f^nm)=(\mu-2n)f^nm$は$[h,f]=-2f$からの帰納法で得られる。$n$の帰納法で主張を示す。
    $n=0$のとき$e(fm)=[e,f]m+f(em)=hm=\mu m$であり、右辺$1\cdot\mu\cdot m$に等しい。
    $n$で成り立つとする。$[e,f]=h$より
    $e(f^{n+2}m)=h(f^{n+1}m)+f(e(f^{n+1}m))=(\mu-2n-2)f^{n+1}m+(n+1)(\mu-n)f^{n+1}m$
    である。係数は$(\mu-2n-2)+(n+1)(\mu-n)=(n+2)(\mu-n-1)$なので、$n+1$の場合の式を得る。
  strategy: Induct on n commuting e past f with [e,f] = h.
  sketch:
  - 'setup: h f^n m = (mu - 2n) f^n m.'
  - 'derive: For n = 0, e f m = h m = mu m.'
  - 'induction: e f^(n+2) m = h f^(n+1) m + f e f^(n+1) m.'
  - 'conclude: The coefficient simplifies to (n+2)(mu - n - 1).'
  openmath: (forall (Rg L M h e f m c n) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_module M L Rg) (sl2_triple h e f) (sl2_primitive_vector h e f m c) (in n N)) (= (lie_action e (fn_value (map_power (lie_action_op f M) (+ n 1)) m)) (* (* (+ n 1) (- c n)) (fn_value (map_power (lie_action_op f M) n) m)))))
  hard_negative:
    statement: $e(f^{n+1}m)=(n+1)\mu f^nm$である。
    reason: 標数$0$の体上の$\mathfrak{sl}_2$の随伴加群で$m=e$、$\mu=2$、$n=1$とする。$f^2e=-2f$なので$e(f^2e)=-2h$である。$fe=-h$より正しい係数は$2\cdot(2-1)=2$であり、$2\cdot 2=4$ではない。
  target: |
    ∀ (R : Type*) (L : Type*) (M : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] [AddCommGroup M] [Module R M] [LieRingModule L M] [LieModule R L M] (h e f : L) (t : IsSl2Triple h e f) (m : M) (μ : R) (n : ℕ), t.HasPrimitiveVectorWith m μ → ⁅e, ((LieModule.toEnd R L M f) ^ (n + 1)) m⁆ = ((n + 1) * (μ - n)) • ((LieModule.toEnd R L M f) ^ n) m
  proof: |
    by
      intro R L M _ _ _ _ _ _ _ h e f t m μ n P
      exact P.lie_e_pow_succ_toEnd_f n
- id: lie_sl2_primitive_eigenvalue_nat
  kind: textbook
  level: 4
  topic: Lie環・sl2の表現
  statement: 標数$0$の体上で、$\mathfrak{sl}_2$三つ組が作用する有限次元加群の原始ベクトルの固有値$\mu$は非負整数である。
  statement_en: Over a field of characteristic 0, the eigenvalue of a primitive vector of a finite-dimensional module, for an sl_2 triple, is a nonnegative integer.
  assumptions:
  - $K$は標数$0$の体、$L$は$K$上の Lie 環
  - $M$は有限次元$L$加群、$(h,e,f)$は$\mathfrak{sl}_2$三つ組
  - $m$は固有値$\mu$の原始ベクトル
  quantifiers:
  - 任意の$m,\mu$
  conclusion: $\mu=n$となる$n\in\mathbb{N}$が存在する。
  answer: |
    $K$を標数$0$の体、$L$を$K$上の Lie 環、$M$を有限次元$L$加群、$(h,e,f)$を$\mathfrak{sl}_2$三つ組、$m$を固有値$\mu$の原始ベクトルとする。
    $h(f^im)=(\mu-2i)f^im$である。標数$0$なので固有値$\mu-2i$は互いに異なる。異なる固有値の固有ベクトルは線形独立であり、$M$は有限次元なので、ある$i$で$f^im=0$である。$m\neq 0$なので、$f^nm\neq 0$、$f^{n+1}m=0$となる$n\geq 0$がある。
    公式$e(f^{n+1}m)=(n+1)(\mu-n)f^nm$の左辺は$0$である。$n+1\neq 0$、$f^nm\neq 0$より$\mu=n$である。
  strategy: The f-string must end by finite dimension, and the e-formula then forces mu = n.
  sketch:
  - 'derive: The vectors f^i m are eigenvectors of h with distinct eigenvalues mu - 2i.'
  - 'derive: Finite dimension gives n with f^n m nonzero and f^(n+1) m = 0.'
  - 'derive: 0 = e f^(n+1) m = (n+1)(mu - n) f^n m.'
  - 'conclude: Hence mu = n.'
  openmath: (forall (K L M h e f m c) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (lie_module M L K) (finite_dimensional M) (sl2_triple h e f) (sl2_primitive_vector h e f m c)) (exists (n) (and (in n N) (= c n)))))
  hard_negative:
    statement: 無限次元の加群でも原始ベクトルの固有値は非負整数である。
    reason: 基底$v_0,v_1,\dots$に$hv_i=(\mu-2i)v_i$、$fv_i=v_{i+1}$、$ev_{i+1}=(i+1)(\mu-i)v_i$、$ev_0=0$で作用させると、任意の$\mu$について加群になり、$v_0$は固有値$\mu$の原始ベクトルである。
  target: |
    ∀ (K : Type*) (L : Type*) (M : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [AddCommGroup M] [Module K M] [LieRingModule L M] [LieModule K L M] [FiniteDimensional K M] (h e f : L) (t : IsSl2Triple h e f) (m : M) (μ : K), t.HasPrimitiveVectorWith m μ → ∃ n : ℕ, μ = n
  proof: |
    by
      intro K L M _ _ _ _ _ _ _ _ _ h e f t m μ P
      exact P.exists_nat
- id: lie_sl2_primitive_string_nonzero_until_highest
  kind: gap
  level: 4
  topic: Lie環・sl2の表現
  statement: 標数$0$の体上の有限次元加群で、$m$が$\mathfrak{sl}_2$三つ組の固有値$n\in\mathbb{N}$の原始ベクトルなら、$i\leq n$で$f^im\neq 0$であり、$f^{n+1}m=0$である。
  statement_en: In a finite-dimensional module over a field of characteristic 0, if m is a primitive vector with natural number eigenvalue n for an sl_2 triple, then f^i m is nonzero for i at most n and f^(n+1) m = 0.
  assumptions:
  - $K$は標数$0$の体、$M$は有限次元$L$加群
  - $m$は$\mathfrak{sl}_2$三つ組$(h,e,f)$の固有値$n\in\mathbb{N}$の原始ベクトル
  quantifiers:
  - 任意の$m,n$
  conclusion: $i\leq n$で$f^im\neq 0$、かつ$f^{n+1}m=0$である。
  answer: |
    $K$を標数$0$の体、$L$を$K$上の Lie 環、$M$を有限次元$L$加群、$(h,e,f)$を$\mathfrak{sl}_2$三つ組、$m$を固有値$n\in\mathbb{N}$の原始ベクトルとする。公式$e(f^{i+1}m)=(i+1)(n-i)f^im$と$h(f^im)=(n-2i)f^im$を用いる。
    $i\leq n$で$f^im=0$となるものがあるとし、最小の$i$をとる。$m\neq 0$より$i\geq 1$である。$0=e(f^im)=i(n-i+1)f^{i-1}m$であり、係数は$1\leq i\leq n$より$0$でないので$f^{i-1}m=0$となる。これは最小性に反する。
    次に$v=f^{n+1}m\neq 0$と仮定する。$ev=(n+1)(n-n)f^nm=0$であり、$hv=(n-2n-2)v=(-n-2)v$である。よって$v$は固有値$-n-2$の原始ベクトルである。原始ベクトルの固有値は非負整数なので矛盾である。よって$f^{n+1}m=0$である。
  strategy: Use the e-formula downward for nonvanishing and primitivity of the next vector for vanishing.
  sketch:
  - 'contradiction: A minimal i at most n with f^i m = 0 forces f^(i-1) m = 0.'
  - 'derive: If v = f^(n+1) m is nonzero, then ev = 0 and hv = (-n-2) v.'
  - 'contradiction: Primitive eigenvalues are natural numbers, but -n-2 is negative.'
  - 'conclude: The string has nonzero terms exactly up to n.'
  openmath: (forall (K L M h e f m n) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (lie_module M L K) (finite_dimensional M) (sl2_triple h e f) (in n N) (sl2_primitive_vector h e f m n)) (and (forall (i) (-> (and (in i N) (<= i n)) (!= (fn_value (map_power (lie_action_op f M) i) m) 0))) (= (fn_value (map_power (lie_action_op f M) (+ n 1)) m) 0))))
  hard_negative:
    statement: 同じ仮定の下で$f^nm=0$である。
    reason: $M=K^2$、$m=e_1$、$n=1$とすると$fm=e_2\neq 0$である。消えるのは$f^{n+1}m$である。
  target: |
    ∀ (K : Type*) (L : Type*) (M : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [AddCommGroup M] [Module K M] [LieRingModule L M] [LieModule K L M] [FiniteDimensional K M] (h e f : L) (t : IsSl2Triple h e f) (m : M) (n : ℕ), t.HasPrimitiveVectorWith m (n : K) → (∀ i ≤ n, ((LieModule.toEnd K L M f) ^ i) m ≠ 0) ∧ ((LieModule.toEnd K L M f) ^ (n + 1)) m = 0
  proof: |
    by
      intro K L M _ _ _ _ _ _ _ _ _ h e f t m n P
      exact ⟨fun i hi => P.pow_toEnd_f_ne_zero_of_eq_nat rfl hi, P.pow_toEnd_f_eq_zero_of_eq_nat rfl⟩
- id: lie_sl2_primitive_vector_exists
  kind: gap
  level: 4
  topic: Lie環・sl2の表現
  statement: 標数$0$の代数閉体上で、$\mathfrak{sl}_2$三つ組が作用する$0$でない有限次元加群は原始ベクトルを持つ。
  statement_en: Over an algebraically closed field of characteristic 0, a nonzero finite-dimensional module acted on by an sl_2 triple has a primitive vector.
  assumptions:
  - $K$は標数$0$の代数閉体
  - $M\neq 0$は有限次元$L$加群、$(h,e,f)$は$\mathfrak{sl}_2$三つ組
  quantifiers:
  - 任意の$M$
  conclusion: 原始ベクトルが存在する。
  answer: |
    $K$を標数$0$の代数閉体、$L$を$K$上の Lie 環、$M\neq 0$を有限次元$L$加群、$(h,e,f)$を$\mathfrak{sl}_2$三つ組とする。$K$は代数閉体なので$h$は固有ベクトル$m_0\neq 0$を持ち、$hm_0=\mu_0m_0$とする。
    $[h,e]=2e$より$h(e^km_0)=(\mu_0+2k)e^km_0$である。標数$0$なので固有値は互いに異なり、$M$は有限次元なので、ある$k$で$e^km_0=0$である。$e^km_0\neq 0$、$e^{k+1}m_0=0$となる$k$をとる。
    $v=e^km_0$とおく。$v\neq 0$、$ev=0$、$hv=(\mu_0+2k)v$なので、$v$は原始ベクトルである。
  strategy: Raise an eigenvector of h by powers of e until it vanishes.
  sketch:
  - 'setup: Take an eigenvector m_0 of h.'
  - 'derive: e^k m_0 has eigenvalue mu_0 + 2k, and these are distinct.'
  - 'derive: Finite dimension forces e^(k+1) m_0 = 0 with e^k m_0 nonzero.'
  - 'conclude: v = e^k m_0 is primitive.'
  openmath: (forall (K L M h e f) (-> (and (alg_closed_field K) (field_of_char K 0) (lie_algebra L K) (lie_module M L K) (finite_dimensional M) (not (zero_lie_ideal M)) (sl2_triple h e f)) (exists (c m) (sl2_primitive_vector h e f m c))))
  hard_negative:
    statement: 無限次元の$0$でない加群でも原始ベクトルが存在する。
    reason: 基底$v_0,v_1,\dots$に$ev_i=v_{i+1}$、$hv_i=(\mu+2i)v_i$、$fv_{i+1}=-(i+1)(\mu+i)v_i$、$fv_0=0$で作用させた加群では$e$が単射なので、$em=0$となる$m\neq 0$がない。
  target: |
    ∀ (K : Type*) (L : Type*) (M : Type*) [Field K] [CharZero K] [IsAlgClosed K] [LieRing L] [LieAlgebra K L] [AddCommGroup M] [Module K M] [LieRingModule L M] [LieModule K L M] [FiniteDimensional K M] (h e f : L) (t : IsSl2Triple h e f), Nontrivial M → ∃ (μ : K) (m : M), t.HasPrimitiveVectorWith m μ
  proof: |
    by
      intro K L M _ _ _ _ _ _ _ _ _ _ h e f t _
      obtain ⟨μ, m, _, P⟩ := t.exists_hasPrimitiveVectorWith (R := K) (M := M)
      exact ⟨μ, m, P⟩
- id: lie_root_space_bracket_add
  kind: gap
  level: 4
  topic: Lie環・根空間と括弧
  statement: $H$を$L$の冪零部分 Lie 環、$M$を$L$加群とする。$x$が根空間$L_\alpha$の元で、$m$が一般重み空間$M_\chi$の元なら、$[x,m]\in M_{\alpha+\chi}$である。特に$[L_\alpha,L_\beta]\subseteq L_{\alpha+\beta}$である。ここで$M_\chi$は、各$h\in H$について$(h-\chi(h))^km=0$となる$k$がある$m$の全体である。
  statement_en: Let H be a nilpotent subalgebra of a Lie algebra L and M an L-module. If x lies in the root space L_alpha and m in the generalized weight space M_chi, then [x,m] lies in M_(alpha+chi). In particular [L_alpha,L_beta] lies in L_(alpha+beta).
  assumptions:
  - $L$は可換環$R$上の Lie 環、$H$は冪零部分 Lie 環、$M$は$L$加群
  - $\alpha,\chi\colon H\to R$は関数、$x\in L_\alpha$、$m\in M_\chi$
  quantifiers:
  - 任意の$\alpha,\chi,x,m$
  conclusion: $[x,m]\in M_{\alpha+\chi}$である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$H$を冪零部分 Lie 環、$M$を$L$加群とし、$x\in L_\alpha$、$m\in M_\chi$とする。$h\in H$を固定し、$a=\alpha(h)$、$b=\chi(h)$、$A=\mathrm{ad}\,h-a$、$B=h-b$（$M$上）とおく。
    加群の公理より$[h,[u,v]]=[[h,u],v]+[u,[h,v]]$なので、$(h-a-b)[u,v]=[Au,v]+[u,Bv]$である。これを繰り返すと
    $(h-a-b)^N[x,m]=\sum_{i+j=N}\binom{N}{i}[A^ix,B^jm]$
    である。$A^px=0$、$B^qm=0$となる$p,q$があるので、$N\geq p+q$なら各項で$i\geq p$または$j\geq q$となり、右辺は$0$である。$h$は任意なので$[x,m]\in M_{\alpha+\chi}$である。
  strategy: Expand the shifted operator by the Leibniz rule.
  sketch:
  - 'setup: Fix h and set A = ad h - alpha(h), B = h - chi(h).'
  - 'derive: (h - a - b)[u,v] = [Au,v] + [u,Bv].'
  - 'derive: Iterating gives a binomial sum over [A^i x, B^j m].'
  - 'conclude: For large N all terms vanish.'
  openmath: (forall (Rg L H M a c x m) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_subalgebra H L) (nilpotent_lie_algebra H) (lie_module M L Rg) (in x (root_space H a)) (in m (gen_weight_space M c))) (in (lie_action x m) (gen_weight_space M (+ a c)))))
  hard_negative:
    statement: $x\in L_\alpha$、$m\in M_\chi$なら$[x,m]\in M_\chi$である。
    reason: 標数$0$の体$K$上の$\mathfrak{sl}_2$、$H=Kh$で$x=e$、$m=f$とすると、$\alpha(h)=2$、$\chi(h)=-2$である。$[e,f]=h$は重み$0$の元であり、$L_\chi=Kf$に入らない。
  target: |
    ∀ (R : Type*) (L : Type*) (M : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] [AddCommGroup M] [Module R M] [LieRingModule L M] [LieModule R L M] (H : LieSubalgebra R L) [LieRing.IsNilpotent H] (α χ : H → R) (x : L) (m : M), x ∈ LieAlgebra.rootSpace H α → m ∈ LieModule.genWeightSpace M χ → ⁅x, m⁆ ∈ LieModule.genWeightSpace M (α + χ)
  proof: |
    by
      intro R L M _ _ _ _ _ _ _ H _ α χ x m hx hm
      exact LieAlgebra.lie_mem_genWeightSpace_of_mem_genWeightSpace hx hm
- id: lie_root_element_ad_nilpotent
  kind: gap
  level: 4
  topic: Lie環・根空間と括弧
  statement: 標数$0$の体上の有限次元 Lie 環$L$と冪零部分 Lie 環$H$について、$\mathrm{ad}\,H$の各元の一般固有空間が$L$を張るとする。$\alpha\neq 0$なら根空間$L_\alpha$の元$x$の$\mathrm{ad}\,x$は冪零である。
  statement_en: For a finite-dimensional Lie algebra L over a field of characteristic 0 and a nilpotent subalgebra H such that generalized eigenspaces of each ad h span L, every element x of a root space L_alpha with alpha nonzero has ad x nilpotent.
  assumptions:
  - $K$は標数$0$の体、$L$は有限次元 Lie 環、$H$は冪零部分 Lie 環
  - 各$h\in H$について$\mathrm{ad}\,h$の一般固有空間は$L$を張る
  - $\alpha\neq 0$、$x\in L_\alpha$
  quantifiers:
  - 任意の$\alpha,x$
  conclusion: $\mathrm{ad}\,x$は冪零である。
  answer: |
    $K$を標数$0$の体、$L$を有限次元 Lie 環、$H$を冪零部分 Lie 環とし、各$\mathrm{ad}\,h$の一般固有空間が$L$を張るとする。$H$は冪零なので一般固有空間は$H$で保たれ、$h$を順に動かして細分すると$L=\bigoplus_\chi L_\chi$を得る。$L$は有限次元なので$L_\chi\neq 0$となる$\chi$は有限個である。
    $\alpha\neq 0$、$x\in L_\alpha$とする。$[L_\alpha,L_\chi]\subseteq L_{\alpha+\chi}$より$(\mathrm{ad}\,x)^kL_\chi\subseteq L_{k\alpha+\chi}$である。標数$0$と$\alpha\neq 0$より$k\alpha+\chi$は互いに異なるので、$L_{k\alpha+\chi}\neq 0$となる$k$は有限個である。よって十分大きい$k$で$(\mathrm{ad}\,x)^kL_\chi=0$である。$\chi$は有限個なので、共通の$k$で$(\mathrm{ad}\,x)^k=0$である。
  strategy: Powers of ad x shift weights by multiples of alpha, and only finitely many weights occur.
  sketch:
  - 'setup: L is the direct sum of finitely many weight spaces.'
  - 'derive: (ad x)^k maps L_chi into L_(k alpha + chi).'
  - 'derive: In characteristic 0 these weights are distinct, so the target vanishes for large k.'
  - 'conclude: ad x is nilpotent.'
  openmath: (forall (K L H a x) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (finite_dimensional L) (lie_subalgebra H L) (nilpotent_lie_algebra H) (triangularizable_action H L) (!= a 0) (in x (root_space H a))) (nilpotent_op (adjoint_map L x))))
  hard_negative:
    statement: 零の根空間$L_0$の元$x$でも$\mathrm{ad}\,x$は冪零である。
    reason: $\mathfrak{sl}_2$で$H=Kh$とすると$h\in L_0$だが、$\mathrm{ad}\,h$は固有値$\pm 2$を持つ。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] (H : LieSubalgebra K L) [LieRing.IsNilpotent H] [LieModule.IsTriangularizable K H L] (α : H → K) (x : L), α ≠ 0 → x ∈ LieAlgebra.rootSpace H α → IsNilpotent (LieAlgebra.ad K L x)
  proof: |
    by
      intro K L _ _ _ _ _ H _ _ α x hα hx
      exact LieAlgebra.isNilpotent_ad_of_mem_rootSpace H hα hx
- id: lie_weight_spaces_independent
  kind: gap
  level: 4
  topic: Lie環・重み空間
  statement: 体上の冪零 Lie 環$L$の加群$M$の一般重み空間$M_\chi$（$\chi\colon L\to K$）は線形独立である。すなわち各$M_\chi$は他の重み空間の和と交わりが$0$である。
  statement_en: The generalized weight spaces M_chi of a module M over a nilpotent Lie algebra L over a field are independent, meaning each M_chi meets the sum of the others in 0.
  assumptions:
  - $K$は体、$L$は冪零 Lie 環、$M$は$L$加群
  quantifiers:
  - 任意の$M$
  conclusion: $\{M_\chi\}$は独立である。
  answer: |
    $K$を体、$L$を冪零 Lie 環、$M$を$L$加群とする。$L$は冪零なので各$\mathrm{ad}\,x$は冪零である。したがって$L=L_0$であり、$[L_0,M_\chi]\subseteq M_\chi$より各$M_\chi$は部分加群である。
    独立でないとすると、相異なる$\chi_1,\dots,\chi_r$と$0$でない$m_i\in M_{\chi_i}$で$m_1+\dots+m_r=0$となるものがある。$r$が最小のものをとる。$r\geq 2$である。$\chi_1\neq\chi_2$なので$\chi_1(x)\neq\chi_2(x)$となる$x\in L$がある。
    $T=x-\chi_2(x)$とする。$T^Nm_2=0$となる$N$をとる。$T$は各$M_{\chi_i}$を保つ。$M_{\chi_1}$上で$x-\chi_1(x)$は局所冪零であり$\chi_1(x)-\chi_2(x)\neq 0$なので、$T$は$M_{\chi_1}$上単射である。よって$T^Nm_1\neq 0$である。
    和に$T^N$を施すと、$m_2$の項が消えた関係式$\sum_{i\neq 2}T^Nm_i=0$を得る。$T^Nm_1\neq 0$なので、$0$でない項は$r-1$個以下で少なくとも$1$個ある。これは最小性に反する。
  strategy: Take a shortest relation and kill one term with a power of x - chi_2(x).
  sketch:
  - 'setup: Each M_chi is a submodule since L is nilpotent.'
  - 'contradiction: Take a shortest nontrivial relation among distinct weights.'
  - 'derive: Choose x separating chi_1 and chi_2, and put T = x - chi_2(x).'
  - 'derive: T^N kills m_2 but not m_1.'
  - 'conclude: This gives a shorter relation.'
  openmath: (forall (K L M) (-> (and (field K) (lie_algebra L K) (nilpotent_lie_algebra L) (lie_module M L K)) (independent_weight_spaces M)))
  hard_negative:
    statement: 冪零 Lie 環の有限次元加群は常に一般重み空間の直和である。
    reason: $K=\mathbb{R}$、$L=Kx$、$M=\mathbb{R}^2$で$x$を$90$度回転とすると、$x$は実固有値を持たないので$M_\chi=0$である。独立性は成り立つが和は$M$にならない。
  target: |
    ∀ (K : Type*) (L : Type*) (M : Type*) [Field K] [LieRing L] [LieAlgebra K L] [AddCommGroup M] [Module K M] [LieRingModule L M] [LieModule K L M] [LieRing.IsNilpotent L], iSupIndep (fun χ : L → K => LieModule.genWeightSpace M χ)
  proof: |
    by
      intro K L M _ _ _ _ _ _ _ _
      exact LieModule.iSupIndep_genWeightSpace K L M
- id: lie_fitting_decomposition
  kind: textbook
  level: 4
  topic: Lie環・Fitting分解
  statement: 体上の冪零 Lie 環$L$の有限次元加群$M$は、$M=M_0\oplus M^+$と分解する。ここで$M_0$は零重みの一般重み空間、$M^+$は各$x\in L$についての$\bigcap_kx^kM$の和である。
  statement_en: Fitting decomposition. A finite-dimensional module M over a nilpotent Lie algebra over a field is the direct sum of the zero generalized weight space M_0 and M^+, the sum over x in L of the intersection of the images x^k M.
  assumptions:
  - $K$は体、$L$は冪零 Lie 環、$M$は有限次元$L$加群
  - $M^+=\sum_{x\in L}\bigcap_kx^kM$
  quantifiers:
  - 任意の$M$
  conclusion: $M=M_0\oplus M^+$である。
  answer: |
    $K$を体、$L$を冪零 Lie 環、$M$を有限次元$L$加群とする。$x\in L$に対し$M_0(x)=\bigcup_k\ker x^k$、$M_1(x)=\bigcap_kx^kM$とおくと、単一の線形写像に対する Fitting の補題より$M=M_0(x)\oplus M_1(x)$である。
    どちらも部分加群である。実際$\mathrm{ad}\,x$は冪零で$(\mathrm{ad}\,x)^N=0$とすると、$y\in L$について$yx^n=\sum_{i<N}(-1)^i\binom{n}{i}x^{n-i}((\mathrm{ad}\,x)^iy)$なので$yx^nM\subseteq x^{n-N+1}M$であり、$M_1(x)$は保たれる。$M_0(x)$は$x$についての零一般固有空間で、$[L_0,M_0]\subseteq M_0$と同じ計算で保たれる。
    $\dim M$の帰納法で示す。すべての$x$で$M_1(x)=0$なら$M=M_0(x)$がすべての$x$で成り立ち、$M=M_0$、$M^+=0$である。そうでないとき$M_1(x)\neq 0$となる$x$をとり、$N=M_0(x)$とおく。$\dim N<\dim M$なので$N=N_0\oplus N^+$である。$M_0\subseteq N$より$N_0=M_0$である。
    $M^+=N^++M_1(x)$を示す。$\supseteq$は定義より明らかである。$y\in L$について、$M=N\oplus M_1(x)$は部分加群の分解なので$M_1(y)$は$N$の部分と$M_1(x)$の部分の和であり、$M_1(y)\subseteq N^++M_1(x)$となる。よって$M^+\subseteq N^++M_1(x)$である。
    したがって$M=N\oplus M_1(x)=M_0\oplus N^+\oplus M_1(x)=M_0\oplus M^+$である。
  strategy: Use the Fitting lemma for one element, show both parts are submodules, and induct on dimension.
  sketch:
  - 'apply_theorem: The Fitting lemma gives M = M_0(x) + M_1(x) for each x.'
  - 'derive: Both summands are submodules because ad x is nilpotent.'
  - 'case_split: If all M_1(x) vanish then M = M_0 and M^+ = 0.'
  - 'induction: Otherwise apply the claim to N = M_0(x), with N_0 = M_0.'
  - 'derive: M^+ = N^+ + M_1(x).'
  - 'conclude: M = M_0 + N^+ + M_1(x) = M_0 + M^+ is direct.'
  openmath: (forall (K L M) (-> (and (field K) (lie_algebra L K) (nilpotent_lie_algebra L) (lie_module M L K) (finite_dimensional M)) (complementary_lie_ideals (gen_weight_space M 0) (fitting_one_component M) M)))
  hard_negative:
    statement: 体上の有限次元空間の自己準同型$x$について、$M=\ker x\oplus xM$である。
    reason: $M=K^2$、$x=E_{12}$とすると$\ker x=xM=Ke_1$である。Fitting 分解は十分大きな冪の核と像で成り立つ。
  target: |
    ∀ (K : Type*) (L : Type*) (M : Type*) [Field K] [LieRing L] [LieAlgebra K L] [AddCommGroup M] [Module K M] [LieRingModule L M] [LieModule K L M] [LieRing.IsNilpotent L] [FiniteDimensional K M], IsCompl (LieModule.genWeightSpace M (0 : L → K)) (LieModule.posFittingComp K L M)
  proof: |
    by
      intro K L M _ _ _ _ _ _ _ _ _
      exact LieModule.isCompl_genWeightSpace_zero_posFittingComp K L M
- id: lie_weight_true_eigenvector
  kind: gap
  level: 4
  topic: Lie環・重み空間
  statement: 標数$0$の体上の冪零 Lie 環$L$の有限次元加群$M$で$M_\chi\neq 0$なら、すべての$x\in L$で$[x,m]=\chi(x)m$となる$m\neq 0$が存在する。
  statement_en: For a finite-dimensional module M over a nilpotent Lie algebra L over a field of characteristic 0, if M_chi is nonzero, then there is a nonzero m with [x,m] = chi(x) m for all x in L.
  assumptions:
  - $K$は標数$0$の体、$L$は冪零 Lie 環、$M$は有限次元$L$加群
  - $\chi\colon L\to K$、$M_\chi\neq 0$
  quantifiers:
  - 任意の$\chi$
  conclusion: すべての$x$で$[x,m]=\chi(x)m$となる$m\neq 0$が存在する。
  answer: |
    $K$を標数$0$の体、$L$を冪零 Lie 環、$M$を有限次元$L$加群とし、$M_\chi\neq 0$とする。$M_\chi$は部分加群である。トレースを比較すると、$\chi$は線形で$\chi([x,y])=0$を満たす。実際$M_\chi$上で$x-\chi(x)$は冪零なので$\mathrm{tr}_{M_\chi}x=(\dim M_\chi)\chi(x)$であり、$\dim M_\chi\neq 0$は$K$で可逆である。
    $W=M_\chi$上に$x*m=[x,m]-\chi(x)m$と定める。$\chi$が線形で$[L,L]$上消えるので、これは$L$の加群の構造である。各$x$は$W$に冪零に作用する。Engel の定理の共通零ベクトル形より、すべての$x$で$x*m=0$となる$m\neq 0$がある。これが求めるベクトルである。
  strategy: Shift the action on M_chi by chi and apply Engel's theorem.
  sketch:
  - 'derive: chi is linear and vanishes on [L,L] by the trace formula.'
  - 'construct: x*m = [x,m] - chi(x) m is a module structure on M_chi.'
  - 'derive: Each x acts nilpotently for this structure.'
  - 'conclude: A common null vector is a common eigenvector.'
  openmath: (forall (K L M c) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (nilpotent_lie_algebra L) (lie_module M L K) (finite_dimensional M) (not (zero_lie_ideal (gen_weight_space M c)))) (exists (m) (and (in m M) (!= m 0) (forall (x) (-> (in x L) (= (lie_action x m) (* (fn_value c x) m))))))))
  hard_negative:
    statement: 正標数でも冪零 Lie 環の有限次元加群の一般重み空間には共通固有ベクトルがある。
    reason: 標数$p$で$K[t]/(t^p)$に$x=d/dt$、$y=t$、$z=1$（Heisenberg 環）を作用させる。共通固有ベクトル$v$があれば$[x,y]$は$v$を$0$倍するが、$z=[x,y]$は恒等写像である。
  target: |
    ∀ (K : Type*) (L : Type*) (M : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [AddCommGroup M] [Module K M] [LieRingModule L M] [LieModule K L M] [LieRing.IsNilpotent L] [FiniteDimensional K M] (χ : L → K), LieModule.genWeightSpace M χ ≠ ⊥ → ∃ m : M, m ≠ 0 ∧ ∀ x : L, ⁅x, m⁆ = χ x • m
  proof: |
    by
      intro K L M _ _ _ _ _ _ _ _ _ _ χ h
      exact LieModule.exists_forall_lie_eq_smul K L M ⟨χ, h⟩
- id: lie_weight_linear_vanishes_derived
  kind: gap
  level: 4
  topic: Lie環・重み空間
  statement: 標数$0$の体上の冪零 Lie 環$L$の有限次元加群$M$で$M_\chi\neq 0$なら、$\chi$は線形であり$[L,L]$上で$0$である。
  statement_en: For a finite-dimensional module M over a nilpotent Lie algebra L over a field of characteristic 0, if M_chi is nonzero, then chi is linear and vanishes on [L,L].
  assumptions:
  - $K$は標数$0$の体、$L$は冪零 Lie 環、$M$は有限次元$L$加群
  - $\chi\colon L\to K$、$M_\chi\neq 0$
  quantifiers:
  - 任意の$\chi$
  conclusion: $\chi$は線形で、$\chi([x,y])=0$である。
  answer: |
    $K$を標数$0$の体、$L$を冪零 Lie 環、$M$を有限次元$L$加群とし、$M_\chi\neq 0$とする。$L$は冪零なので$\mathrm{ad}\,x$は冪零であり、$[L_0,M_\chi]\subseteq M_\chi$より$W=M_\chi$は部分加群である。$d=\dim W$とおくと、$d\geq 1$であり標数$0$より$d$は$K$で可逆である。
    $x\in L$について、$W$上で$x-\chi(x)$は冪零である。冪零作用素のトレースは$0$なので$\mathrm{tr}_W(x)=d\,\chi(x)$である。よって$\chi(x)=d^{-1}\mathrm{tr}_W(x)$である。
    $\mathrm{tr}_W$は$x$について線形なので$\chi$は線形である。$[x,y]$は$W$上で交換子として働くのでトレースが$0$であり、$\chi([x,y])=0$である。
  strategy: Express chi as the normalized trace on M_chi.
  sketch:
  - 'setup: W = M_chi is a nonzero submodule of dimension d.'
  - 'derive: x - chi(x) is nilpotent on W, so tr_W(x) = d chi(x).'
  - 'derive: In characteristic 0, chi = tr_W / d.'
  - 'conclude: The trace is linear and vanishes on commutators.'
  openmath: (forall (K L M c) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (nilpotent_lie_algebra L) (lie_module M L K) (finite_dimensional M) (not (zero_lie_ideal (gen_weight_space M c)))) (and (dual_functional c K L) (forall (x y) (-> (and (in x L) (in y L)) (= (fn_value c (lie_bracket x y)) 0))))))
  hard_negative:
    statement: 正標数でも一般重みは$[L,L]$上で$0$である。
    reason: 標数$p$で$K[t]/(t^p)$に$x=d/dt$、$y=t$、$z=1$を作用させると、$z=[x,y]$は恒等写像なので重みは$\chi(z)=1\neq 0$である。
  target: |
    ∀ (K : Type*) (L : Type*) (M : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [AddCommGroup M] [Module K M] [LieRingModule L M] [LieModule K L M] [LieRing.IsNilpotent L] [FiniteDimensional K M] (χ : L → K), LieModule.genWeightSpace M χ ≠ ⊥ → (∀ x y, χ (x + y) = χ x + χ y) ∧ (∀ (t : K) x, χ (t • x) = t * χ x) ∧ ∀ x y : L, χ ⁅x, y⁆ = 0
  proof: |
    by
      intro K L M _ _ _ _ _ _ _ _ _ _ χ h
      exact ⟨LieModule.LinearWeights.map_add χ h, LieModule.LinearWeights.map_smul χ h, LieModule.LinearWeights.map_lie χ h⟩
- id: lie_trace_form_weight_sum
  kind: gap
  level: 4
  topic: Lie環・重み空間
  statement: 標数$0$の代数閉体上の冪零 Lie 環$L$の有限次元加群$M$について、$\mathrm{tr}_M(xy)=\sum_\chi(\dim M_\chi)\chi(x)\chi(y)$である。和は$M_\chi\neq 0$となる$\chi$全体をわたる。
  statement_en: For a finite-dimensional module M over a nilpotent Lie algebra L over an algebraically closed field of characteristic 0, tr_M(xy) is the sum over the weights chi of (dim M_chi) chi(x) chi(y).
  assumptions:
  - $K$は標数$0$の代数閉体、$L$は冪零 Lie 環、$M$は有限次元$L$加群
  quantifiers:
  - 任意の$x,y\in L$
  conclusion: $\mathrm{tr}_M(xy)=\sum_\chi(\dim M_\chi)\chi(x)\chi(y)$である。
  answer: |
    $K$を標数$0$の代数閉体、$L$を冪零 Lie 環、$M$を有限次元$L$加群とする。$K$は代数閉体なので各$x$の一般固有空間は$M$を張り、$L$の冪零性より部分加群なので、$M=\bigoplus_\chi M_\chi$である。$xy$は各$M_\chi$を保つので、$\mathrm{tr}_M(xy)=\sum_\chi\mathrm{tr}_{M_\chi}(xy)$である。
    $W=M_\chi\neq 0$を固定する。$\chi$は線形で$[L,L]$上消えるので、$x*m=[x,m]-\chi(x)m$は$W$上の$L$の加群の構造であり、各元は冪零に作用する。Engel の定理より$W$はこの作用で冪零加群である。$x,y$の作用を$N_x,N_y$とすると、$N_xN_y$は下降中心列を$2$段下げるので冪零である。特に$\mathrm{tr}N_x=\mathrm{tr}N_y=\mathrm{tr}N_xN_y=0$である。
    $W$上で$x=\chi(x)+N_x$、$y=\chi(y)+N_y$なので
    $\mathrm{tr}_W(xy)=(\dim W)\chi(x)\chi(y)+\chi(x)\mathrm{tr}N_y+\chi(y)\mathrm{tr}N_x+\mathrm{tr}N_xN_y=(\dim W)\chi(x)\chi(y)$
    である。これを$\chi$について足せばよい。
  strategy: Decompose M into weight spaces and compute the trace on each using Engel's theorem.
  sketch:
  - 'setup: M is the direct sum of its generalized weight spaces.'
  - 'derive: On W = M_chi, x = chi(x) + N_x with N_x a nilpotent module action.'
  - 'apply_theorem: Engel''s theorem makes W nilpotent for this action, so N_x N_y is nilpotent.'
  - 'derive: tr_W(xy) = (dim W) chi(x) chi(y).'
  - 'conclude: Sum over the weights.'
  openmath: (forall (K L M x y) (-> (and (alg_closed_field K) (field_of_char K 0) (lie_algebra L K) (nilpotent_lie_algebra L) (lie_module M L K) (finite_dimensional M) (in x L) (in y L)) (= (trace_form_value M x y) (trace_form_weight_sum M x y))))
  hard_negative:
    statement: $\mathrm{tr}_M(xy)=\sum_\chi\chi(x)\chi(y)$である。重みの重複度は要らない。
    reason: $L=Kx$、$M=K^2$で$x$を恒等写像とすると、重みは$\chi(x)=1$の一つだけで、$\mathrm{tr}(x^2)=2$である。
  target: |
    ∀ (K : Type*) (L : Type*) (M : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [AddCommGroup M] [Module K M] [LieRingModule L M] [LieModule K L M] [LieRing.IsNilpotent L] [FiniteDimensional K M] [IsAlgClosed K] (x y : L), LieModule.traceForm K L M x y = ∑ χ : LieModule.Weight K L M, Module.finrank K (LieModule.genWeightSpace M χ) • (χ x * χ y)
  proof: |
    by
      intro K L M _ _ _ _ _ _ _ _ _ _ _ x y
      exact LieModule.traceForm_eq_sum_finrank_nsmul_mul K L M x y
- id: lie_cartan_zero_root_space
  kind: gap
  level: 4
  topic: Lie環・Cartan部分環
  statement: 体上の有限次元 Lie 環$L$の Cartan 部分環$H$（冪零で自己正規化）について、零の根空間$L_0(H)$は$H$に等しい。
  statement_en: For a Cartan subalgebra H, meaning nilpotent and self-normalizing, of a finite-dimensional Lie algebra L over a field, the zero root space L_0(H) equals H.
  assumptions:
  - $K$は体、$L$は有限次元 Lie 環
  - $H$は Cartan 部分環
  quantifiers:
  - 任意の$H$
  conclusion: $L_0(H)=H$である。
  answer: |
    $K$を体、$L$を有限次元 Lie 環、$H$を Cartan 部分環とする。$H$は冪零なので、$h\in H$の$\mathrm{ad}\,h$は$H$上で冪零であり、$H\subseteq L_0(H)$である。
    $L_0(H)\neq H$と仮定する。$L_0(H)$は$H$で保たれるので、$Q=L_0(H)/H\neq 0$は$H$の有限次元加群である。各$h\in H$は$L_0(H)$上で冪零に作用するので、$Q$上でも冪零に作用する。Engel の定理の共通零ベクトル形より、$z\in L_0(H)\setminus H$で$[H,z]\subseteq H$となるものがある。
    これは$z$が$H$の正規化部分環に入ることを意味する。$H$は自己正規化なので$z\in H$となり矛盾である。よって$L_0(H)=H$である。
  strategy: Apply Engel's theorem to L_0(H)/H and use self-normalization.
  sketch:
  - 'derive: H lies in L_0(H) because H is nilpotent.'
  - 'contradiction: If they differ, H acts nilpotently on the nonzero quotient.'
  - 'apply_theorem: Engel gives z outside H with [H,z] inside H.'
  - 'conclude: z normalizes H, contradicting self-normalization.'
  openmath: (forall (K L H) (-> (and (field K) (lie_algebra L K) (finite_dimensional L) (cartan_subalgebra H L)) (= (root_space H 0) H)))
  hard_negative:
    statement: 冪零部分 Lie 環$H$なら常に$L_0(H)=H$である。
    reason: $\mathfrak{sl}_2$で$H=0$とすると、$H$は冪零だが$L_0(H)=\mathfrak{sl}_2$である。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] (H : LieSubalgebra K L) [H.IsCartanSubalgebra], LieAlgebra.zeroRootSubalgebra K L H = H
  proof: |
    by
      intro K L _ _ _ _ H _
      exact LieAlgebra.zeroRootSubalgebra_eq_of_is_cartan K L H
- id: lie_cartan_iff_zero_root_space
  kind: gap
  level: 4
  topic: Lie環・Cartan部分環
  statement: 体上の有限次元 Lie 環$L$の冪零部分 Lie 環$H$について、$H$が Cartan 部分環であることと$L_0(H)=H$は同値である。
  statement_en: A nilpotent subalgebra H of a finite-dimensional Lie algebra L over a field is a Cartan subalgebra if and only if L_0(H) = H.
  assumptions:
  - $K$は体、$L$は有限次元 Lie 環
  - $H$は冪零部分 Lie 環
  quantifiers:
  - 任意の$H$
  conclusion: $H$が Cartan 部分環であることと$L_0(H)=H$は同値である。
  answer: |
    $K$を体、$L$を有限次元 Lie 環、$H$を冪零部分 Lie 環とする。
    $H$が Cartan 部分環なら$L_0(H)=H$である。実際$H\subseteq L_0(H)$であり、$L_0(H)\neq H$なら$H$は$L_0(H)/H\neq 0$に冪零に作用するので、Engel の定理より$z\in L_0(H)\setminus H$で$[H,z]\subseteq H$となるものがあり、自己正規化に反する。
    逆に$L_0(H)=H$とする。$z$が$H$を正規化するとする。$h\in H$について$[h,z]\in H$であり、$\mathrm{ad}\,h$は$H$上冪零なので、$(\mathrm{ad}\,h)^{k+1}z=(\mathrm{ad}\,h)^k[h,z]=0$となる$k$がある。よって$z\in L_0(H)=H$である。$H$は冪零で自己正規化なので Cartan 部分環である。
  strategy: Engel's theorem for one direction, and the normalizer lies in L_0(H) for the other.
  sketch:
  - 'apply_theorem: If H is Cartan, Engel''s theorem on L_0(H)/H gives L_0(H) = H.'
  - 'setup: Conversely let z normalize H.'
  - 'derive: (ad h)^(k+1) z = (ad h)^k [h,z] = 0 for large k.'
  - 'conclude: z lies in L_0(H) = H, so H is self-normalizing.'
