- id: root_orthogonal_reflections_commute
  kind: gap
  level: 4
  topic: 根系・鏡映
  statement: 根対で$\langle\alpha_i,\alpha_j^\vee\rangle=0$かつ$\langle\alpha_j,\alpha_i^\vee\rangle=0$なら、$s_i$と$s_j$は可換である。
  statement_en: In a root pairing, if <alpha_i, coroot_j> = 0 and <alpha_j, coroot_i> = 0, then the reflections s_i and s_j commute.
  assumptions:
