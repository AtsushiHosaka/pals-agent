  sketch:
  - 'setup: T = l - r with l and r commuting and both killed by the power n+1.'
  - 'derive: Expand T^(2n+1) by the binomial theorem.'
  - 'derive: In each term one exponent is at least n+1.'
  - 'conclude: All terms vanish.'
  openmath: (forall (A a b n) (-> (and (is_ring A) (in a A) (in b A) (in n N) (= (^ a (+ n 1)) 0)) (= (ring_commutator_iterate a b (+ (* 2 n) 1)) 0)))
  hard_negative:
    statement: $a^{n+1}=0$なら$T^{n+1}=0$である。
    reason: $A=M_2(K)$、$\mathrm{char}\,K\neq 2$、$a=E_{12}$、$n=1$とする。$T^2(E_{21})=a^2E_{21}-2aE_{21}a+E_{21}a^2=-2E_{12}\neq 0$である。
  target: |
    ∀ (A : Type*) [Ring A] (a b : A) (n : ℕ), a ^ (n + 1) = 0 → (fun x => a * x - x * a)^[2 * n + 1] b = 0
  proof: |
    by
      intro A _ a b n ha
      have hl : (LinearMap.mulLeft ℤ a) ^ (n + 1) = 0 := by
        rw [LinearMap.pow_mulLeft, ha, LinearMap.mulLeft_zero_eq_zero]
      have hr : (-LinearMap.mulRight ℤ a) ^ (n + 1) = 0 := by
        rw [neg_pow, LinearMap.pow_mulRight, ha, LinearMap.mulRight_zero_eq_zero, mul_zero]
      have hc : Commute (LinearMap.mulLeft ℤ a) (-LinearMap.mulRight ℤ a) := (LinearMap.commute_mulLeft_right a a).neg_right
      have h := hc.add_pow_eq_zero_of_add_le_succ_of_pow_eq_zero hl hr (k := 2 * n + 1) (by omega)
      have e : (fun x => a * x - x * a) = ⇑(LinearMap.mulLeft ℤ a + -LinearMap.mulRight ℤ a) := by
        ext x
        simp [sub_eq_add_neg]
      rw [e, ← Module.End.pow_apply, h, LinearMap.zero_apply]
- id: lie_ad_of_inner_derivation
  kind: gap
  level: 3
  topic: Lie環・導分
  statement: Lie 環$L$の導分$D$と$x\in L$について、導分環の括弧で$[D,\mathrm{ad}\,x]=\mathrm{ad}(Dx)$が成り立つ。特に内部導分は導分環のイデアルをなす。
  statement_en: For a derivation D of a Lie algebra L and x in L, the commutator of D and ad x is ad(Dx). In particular the inner derivations form an ideal of the derivation algebra.
  assumptions:
  - $L$は可換環$R$上の Lie 環
  - $D$は$L$の導分、$x\in L$
  quantifiers:
  - 任意の$D,x$
  conclusion: $[D,\mathrm{ad}\,x]=\mathrm{ad}(Dx)$である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$D$を$L$の導分、$x\in L$とする。$y\in L$に対し、導分の性質$D[x,y]=[Dx,y]+[x,Dy]$より
    $[D,\mathrm{ad}\,x](y)=D[x,y]-[x,Dy]=[Dx,y]=\mathrm{ad}(Dx)(y)$
    である。よって$[D,\mathrm{ad}\,x]=\mathrm{ad}(Dx)$である。右辺は内部導分なので、内部導分全体は導分環のイデアルである。
  strategy: Evaluate the commutator on y and apply the derivation rule.
  sketch:
  - 'setup: Fix y in L.'
  - 'derive: D[x,y] - [x,Dy] = [Dx,y] by the derivation rule.'
  - 'conclude: The commutator equals ad(Dx).'
  openmath: (forall (Rg L D x) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_derivation D L) (in x L)) (= (lie_bracket D (inner_derivation x)) (inner_derivation (fn_value D x)))))
  hard_negative:
    statement: 導分$D$と内部導分$\mathrm{ad}\,x$は常に可換である。
    reason: $\mathfrak{sl}_2$で$D=\mathrm{ad}\,h$、$x=e$とすると$[D,\mathrm{ad}\,e]=\mathrm{ad}[h,e]=2\,\mathrm{ad}\,e$であり、標数$2$でなければ$0$でない。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] (D : LieDerivation R L L) (x : L), ⁅D, LieDerivation.ad R L x⁆ = LieDerivation.ad R L (D x)
  proof: |
    by
      intro R L _ _ _ D x
      exact LieDerivation.lie_der_ad_eq_ad_der D x
- id: lie_derivation_exp_map_lie
  kind: textbook
  level: 4
  topic: Lie環・導分の指数写像
  statement: $\mathbb{Q}$上の Lie 環の構造も持つ Lie 環$L$の導分$D$が線形写像として冪零なら、有限和$\exp D=\sum_{k\geq 0}D^k/k!$は括弧を保つ。すなわち$\exp D[x,y]=[\exp D\,x,\exp D\,y]$である。
  statement_en: If D is a nilpotent derivation of a Lie algebra L that is also a Lie algebra over the rationals, then the finite sum exp D = sum of D^k/k! preserves brackets, so exp D [x,y] = [exp D x, exp D y].
  assumptions:
  - $L$は可換環$R$上の Lie 環で、$\mathbb{Q}$上の Lie 環でもある
  - $D$は$L$の$R$導分で、線形写像として冪零
  quantifiers:
  - 任意の$x,y\in L$
  conclusion: $\exp D[x,y]=[\exp D\,x,\exp D\,y]$である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環で$\mathbb{Q}$上の Lie 環でもあるものとする。$D$を冪零な導分とし、$D^N=0$とする。$\exp D=\sum_{k<N}D^k/k!$である。$x,y\in L$をとる。
    導分に対する Leibniz 則より$D^n[x,y]=\sum_{i+j=n}\binom{n}{i}[D^ix,D^jy]$である。両辺を$n!$で割ると
    $\frac{D^n[x,y]}{n!}=\sum_{i+j=n}\Bigl[\frac{D^ix}{i!},\frac{D^jy}{j!}\Bigr]$
    である。$n$について和をとる。$i\geq N$または$j\geq N$の項は$0$であり、$n\geq 2N-1$なら右辺は$0$なので、和はすべて有限である。左辺の和は$\exp D[x,y]$であり、右辺の和は$\bigl[\sum_iD^ix/i!,\sum_jD^jy/j!\bigr]=[\exp D\,x,\exp D\,y]$である。
  strategy: Divide the Leibniz rule by n! and sum over n.
  sketch:
  - 'setup: Fix N with D^N = 0.'
  - 'derive: D^n[x,y]/n! is the sum over i+j=n of [D^i x/i!, D^j y/j!].'
  - 'derive: All sums are finite because D is nilpotent.'
  - 'conclude: Summing over n gives exp D [x,y] = [exp D x, exp D y].'
  openmath: (forall (Rg L D x y) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_algebra L Q) (lie_derivation D L) (nilpotent_op D) (in x L) (in y L)) (= (fn_value (nilpotent_op_exp D) (lie_bracket x y)) (lie_bracket (fn_value (nilpotent_op_exp D) x) (fn_value (nilpotent_op_exp D) y)))))
  hard_negative:
    statement: 冪零な線形写像$D$なら、導分でなくても$\exp D$は括弧を保つ。
    reason: 基底$x,y$、$[x,y]=y$の Lie 環で$Dx=0$、$Dy=x$とする。$D^2=0$であり、$\exp D[x,y]=y+x$だが$[\exp D\,x,\exp D\,y]=[x,y+x]=y$である。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] [LieAlgebra ℚ L] (D : LieDerivation R L L) (x y : L), IsNilpotent D.toLinearMap → IsNilpotent.exp D.toLinearMap ⁅x, y⁆ = ⁅IsNilpotent.exp D.toLinearMap x, IsNilpotent.exp D.toLinearMap y⁆
  proof: |
    by
      intro R L _ _ _ _ D x y h
      rw [← LieDerivation.exp_map_apply D h, ← LieDerivation.exp_map_apply D h, ← LieDerivation.exp_map_apply D h, LieEquiv.map_lie]
- id: lie_simple_perfect
  kind: gap
  level: 3
  topic: Lie環・単純Lie環
  statement: 単純 Lie 環$L$（可換でなく、イデアルが$0$と$L$のみ）は$[L,L]=L$を満たす。
  statement_en: A simple Lie algebra L, meaning non-abelian with only the ideals 0 and L, over a commutative ring satisfies [L,L] = L.
  assumptions:
  - $L$は可換環$R$上の単純 Lie 環
  - 単純とは、可換でなく、イデアルが$0$と$L$のみであること
  quantifiers:
  - 任意の$L$
  conclusion: $[L,L]=L$である。
  answer: |
    $R$を可換環、$L$を$R$上の単純 Lie 環とする。$[L,L]$は$L$のイデアルなので、$0$または$L$である。$[L,L]=0$なら$L$は可換であり、単純の定義に反する。よって$[L,L]=L$である。
  strategy: The derived algebra is an ideal, and it cannot vanish.
  sketch:
  - 'derive: [L,L] is an ideal, so it is 0 or L.'
  - 'case_split: [L,L] = 0 would make L abelian.'
  - 'conclude: Hence [L,L] = L.'
  openmath: (forall (Rg L) (-> (and (comm_ring Rg) (lie_algebra L Rg) (simple_lie_algebra L)) (= (lie_derived_series L 1) L)))
  hard_negative:
    statement: $[L,L]=L$を満たす Lie 環は単純である。
    reason: 標数$0$の体上の$\mathfrak{sl}_2\oplus\mathfrak{sl}_2$は$[L,L]=L$を満たすが、各直和因子が$0$でも全体でもないイデアルになる。
  target: |
    ∀ (R : Type*) (L : Type*) [CommRing R] [LieRing L] [LieAlgebra R L], LieAlgebra.IsSimple R L → LieAlgebra.derivedSeries R L 1 = ⊤
  proof: |
    by
      intro R L _ _ _ h
      rcases h.eq_bot_or_eq_top (LieAlgebra.derivedSeries R L 1) with h0 | h0
      · exfalso
        apply h.non_abelian
        rw [LieAlgebra.derivedSeries_def, LieAlgebra.derivedSeriesOfIdeal_succ, LieAlgebra.derivedSeriesOfIdeal_zero, LieSubmodule.lie_eq_bot_iff] at h0
        exact ⟨fun x y => h0 x (LieSubmodule.mem_top x) y (LieSubmodule.mem_top y)⟩
      · exact h0
- id: lie_module_nilpotent_sup
  kind: gap
  level: 3
  topic: Lie環・冪零加群
  statement: Lie 環$L$の加群$M$の部分加群$N_1,N_2$がともに冪零な$L$加群なら、$N_1+N_2$も冪零な$L$加群である。ここで加群$N$が冪零とは、$C^0N=N$、$C^{k+1}N=[L,C^kN]$が有限回で$0$になることをいう。
  statement_en: If submodules N_1 and N_2 of a module over a Lie algebra L are nilpotent L-modules, meaning that C^0 N = N and C^(k+1) N = [L, C^k N] reaches 0, then N_1 + N_2 is a nilpotent L-module.
  assumptions:
  - $L$は可換環$R$上の Lie 環、$M$は$L$加群
  - $N_1,N_2$は$M$の部分加群で、冪零な$L$加群
  quantifiers:
  - 任意の$N_1,N_2$
  conclusion: $N_1+N_2$は冪零な$L$加群である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$M$を$L$加群、$N_1,N_2$を冪零な部分加群とする。$k$の帰納法で$C^k(N_1+N_2)=C^kN_1+C^kN_2$を示す。$k=0$では定義そのものである。
    $k$で成り立つとすると、括弧の加法性より
    $C^{k+1}(N_1+N_2)=[L,C^kN_1+C^kN_2]=[L,C^kN_1]+[L,C^kN_2]=C^{k+1}N_1+C^{k+1}N_2$
    である。
    仮定より$C^{k_1}N_1=0$、$C^{k_2}N_2=0$となる$k_1,k_2$がある。系列は減少するので、$k=\max(k_1,k_2)$で$C^k(N_1+N_2)=0$である。
  strategy: The lower central series of a submodule is additive in the submodule.
  sketch:
  - 'induction: C^k(N_1+N_2) = C^k N_1 + C^k N_2.'
  - 'derive: The series of N_1 and N_2 vanish for large k.'
  - 'conclude: The series of N_1+N_2 vanishes at the larger index.'
  openmath: (forall (Rg L M A B) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_module M L Rg) (lie_submodule A M L) (lie_submodule B M L) (nilpotent_lie_module A L) (nilpotent_lie_module B L)) (nilpotent_lie_module (lie_sup A B) L)))
  hard_negative:
    statement: $N_1\cap N_2$が冪零な$L$加群なら、$N_1+N_2$は冪零な$L$加群である。
    reason: $L=Kx$、$M=K^2$で$x$を恒等写像とし、$N_1=Ke_1$、$N_2=Ke_2$とする。$N_1\cap N_2=0$は冪零だが、$[L,M]=M$なので$M$は冪零でない。
  target: |
    ∀ (R : Type*) (L : Type*) (M : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] [AddCommGroup M] [Module R M] [LieRingModule L M] [LieModule R L M] (N₁ N₂ : LieSubmodule R L M), LieModule.IsNilpotent L N₁ → LieModule.IsNilpotent L N₂ → LieModule.IsNilpotent L (N₁ ⊔ N₂ : LieSubmodule R L M)
  proof: |
    by
      intro R L M _ _ _ _ _ _ _ N₁ N₂ h₁ h₂
      infer_instance
- id: lie_engel_module_iff
  kind: textbook
  level: 3
  topic: Lie環・Engelの定理
  statement: 体$K$上の Lie 環$L$の有限次元加群$M$が冪零であることと、すべての$x\in L$が$M$に冪零に作用することは同値である。Lie 環の場合の Engel の定理を加群へ一般化した形である。
  statement_en: Engel's theorem for modules, a generalization of the Lie algebra form. A finite-dimensional module M over a Lie algebra L over a field is nilpotent if and only if every element of L acts on M by a nilpotent endomorphism.
  assumptions:
  - $K$は体、$L$は$K$上の Lie 環
  - $M$は有限次元$L$加群
  quantifiers:
  - 任意の$L,M$
  conclusion: $M$が冪零であることと、各$x\in L$の作用が冪零であることは同値である。
  answer: |
    $K$を体、$L$を$K$上の Lie 環、$M$を有限次元$L$加群とする。$M$が冪零で$C^kM=0$とする。$x\in L$の作用を$X$とすると、$X^kM\subseteq C^kM=0$なので$X$は冪零である。
    逆に各$x$の作用が冪零であるとし、$\dim M$の帰納法で示す。$M=0$なら明らかである。$M\neq 0$とする。Engel の定理の共通零ベクトル形（$M\neq 0$上で各元が冪零に作用すれば、すべての$x$で$[x,v]=0$となる$v\neq 0$がある）より、そのような$v$をとる。$Kv$は部分加群であり、$M/Kv$上でも各$x$は冪零に作用する。
    帰納法の仮定より$C^k(M/Kv)=0$となる$k$がある。射影は$C^kM$を$C^k(M/Kv)$へ移すので$C^kM\subseteq Kv$である。よって$C^{k+1}M\subseteq[L,Kv]=0$であり、$M$は冪零である。
  strategy: One direction uses powers inside the lower central series, the other induction with a common null vector.
  sketch:
  - 'derive: If C^k M = 0 then each X^k maps M into C^k M = 0.'
  - 'setup: Conversely induct on the dimension of M.'
  - 'apply_theorem: The common null vector form of Engel''s theorem gives v.'
  - 'derive: By induction C^k(M/Kv) = 0, so C^k M lies in Kv.'
  - 'conclude: C^(k+1) M = 0.'
  openmath: (forall (K L M) (-> (and (field K) (lie_algebra L K) (lie_module M L K) (finite_dimensional M)) (<-> (nilpotent_lie_module M L) (forall (x) (-> (in x L) (nilpotent_op (lie_action_op x M)))))))
  hard_negative:
    statement: $L$の生成元がすべて$M$に冪零に作用すれば、$M$は冪零である。
    reason: 標数$0$の体上の$\mathfrak{sl}_2$と$M=K^2$を考える。生成元$e,f$は冪零に作用するが、$h=[e,f]$は固有値$\pm 1$を持ち冪零でない。
  target: |
    ∀ (K : Type*) (L : Type*) (M : Type*) [Field K] [LieRing L] [LieAlgebra K L] [AddCommGroup M] [Module K M] [LieRingModule L M] [LieModule K L M] [FiniteDimensional K M], LieModule.IsNilpotent L M ↔ ∀ x : L, IsNilpotent (LieModule.toEnd K L M x)
  proof: |
    by
      intro K L M _ _ _ _ _ _ _ _
      exact LieModule.isNilpotent_iff_forall'
- id: lie_engel_common_null_vector
  kind: named
  level: 3
  topic: Lie環・Engelの定理
  statement: Engel の定理の共通零ベクトル形。体$K$上の Lie 環$L$の$0$でない有限次元加群$M$で各$x\in L$が冪零に作用するなら、すべての$x$について$[x,v]=0$となる$v\neq 0$が存在する。
  statement_en: Engel's theorem, common null vector form. If every element of a Lie algebra L over a field acts nilpotently on a nonzero finite-dimensional module M, then there is a nonzero v in M with [x,v] = 0 for all x in L.
  assumptions:
  - $K$は体、$L$は$K$上の Lie 環
  - $M\neq 0$は有限次元$L$加群
  - 各$x\in L$の$M$への作用は冪零
  quantifiers:
  - 任意の$L,M$
  conclusion: すべての$x\in L$で$[x,v]=0$となる$v\neq 0$が存在する。
  answer: |
    $K$を体、$L$を$K$上の Lie 環、$M\neq 0$を有限次元$L$加群とし、各元が冪零に作用するとする。作用の像$\mathfrak g\subseteq\mathrm{End}(M)$は有限次元の部分 Lie 環で、冪零な自己準同型からなる。$\mathfrak g$について主張を示せばよく、$\dim\mathfrak g$の帰納法を用いる。主張は$\mathfrak g$と$M$の両方を動かして帰納する。
    $\dim\mathfrak g=0$なら任意の$v\neq 0$でよい。$\mathfrak g\neq 0$とし、真の部分 Lie 環$\mathfrak h$で次元最大のものをとる。$0$は真の部分 Lie 環なので、これは存在する。
    $x\in\mathfrak h$とする。$x$は冪零なので、$\mathrm{End}(M)$上の$\mathrm{ad}\,x$は左乗法と右乗法の差として冪零である。$\mathrm{ad}\,x$は$\mathfrak g$と$\mathfrak h$を保つので、$\mathfrak g/\mathfrak h$に冪零に作用する。$\mathfrak h$の$\mathrm{End}(\mathfrak g/\mathfrak h)$での像は次元が$\dim\mathfrak g$より小さく、$\mathfrak g/\mathfrak h\neq 0$なので、帰納法の仮定より$[\mathfrak h,z]\subseteq\mathfrak h$となる$z\in\mathfrak g\setminus\mathfrak h$がある。
    $\mathfrak h+Kz$は部分 Lie 環で$\mathfrak h$より大きいので、最大性より$\mathfrak g$に等しい。$\mathfrak h$に帰納法の仮定を用いると、$W=\{m\in M\mid \mathfrak h m=0\}$は$0$でない。$x\in\mathfrak h$、$m\in W$に対し$x(zm)=z(xm)+[x,z]m=0$なので、$zW\subseteq W$である。
    $z$は$W\neq 0$上で冪零なので、$zv=0$となる$v\in W$、$v\neq 0$がある。この$v$は$\mathfrak h$と$z$で消えるので、$\mathfrak g$全体で消える。
  strategy: Induct on dimension of the image in End(M) using a maximal proper subalgebra, which is a codimension-one ideal.
  sketch:
  - 'setup: Replace L by its image g in End(M) and induct on dim g.'
  - 'construct: Take a proper subalgebra h of largest dimension.'
  - 'apply_theorem: By induction on g/h there is z outside h with [h,z] inside h.'
  - 'derive: Then g = h + Kz.'
  - 'derive: W = {m : hm = 0} is nonzero and stable under z.'
  - 'conclude: A null vector of z in W is killed by all of g.'
  openmath: (forall (K L M) (-> (and (field K) (lie_algebra L K) (lie_module M L K) (finite_dimensional M) (not (zero_lie_ideal M)) (forall (x) (-> (in x L) (nilpotent_op (lie_action_op x M))))) (exists (v) (and (in v M) (!= v 0) (forall (x) (-> (in x L) (= (lie_action x v) 0)))))))
  hard_negative:
    statement: $0$でない有限次元加群で各$x$が固有ベクトルを持てば、共通の固有ベクトルが存在する。
    reason: 代数閉体上の$\mathfrak{sl}_2$と$M=K^2$を考える。各元は固有ベクトルを持つが、$e$の固有直線は$Ke_1$のみ、$f$の固有直線は$Ke_2$のみなので共通のものはない。
  target: |
    ∀ (K : Type*) (L : Type*) (M : Type*) [Field K] [LieRing L] [LieAlgebra K L] [AddCommGroup M] [Module K M] [LieRingModule L M] [LieModule K L M] [FiniteDimensional K M], Nontrivial M → (∀ x : L, IsNilpotent (LieModule.toEnd K L M x)) → ∃ m : M, m ≠ 0 ∧ ∀ x : L, ⁅x, m⁆ = 0
  proof: |
    by
      intro K L M _ _ _ _ _ _ _ _ h₂ h₃
      have hN : LieModule.IsNilpotent L M := (LieModule.isNilpotent_iff_forall' (R := K)).mpr h₃
      have h := LieModule.nontrivial_max_triv_of_isNilpotent K L M
      obtain ⟨⟨m, hm⟩, hm0⟩ := exists_ne (0 : LieModule.maxTrivSubmodule K L M)
      exact ⟨m, fun h0 => hm0 (Subtype.ext h0), (LieModule.mem_maxTrivSubmodule K L M m).mp hm⟩
- id: lie_engel_subalgebra_of_nilpotent_endomorphisms
  kind: gap
  level: 3
  topic: Lie環・Engelの定理
  statement: 体上の有限次元空間$V$について、$\mathrm{End}(V)$の部分 Lie 環$H$（括弧は交換子）の元がすべて冪零な自己準同型なら、$H$は冪零 Lie 環である。
  statement_en: If a Lie subalgebra H of End(V), with the commutator bracket, for a finite-dimensional vector space V over a field consists of nilpotent endomorphisms, then H is a nilpotent Lie algebra.
  assumptions:
  - $K$は体、$V$は有限次元$K$線形空間
  - $H$は$\mathrm{End}(V)$の部分 Lie 環で、各元は冪零
  quantifiers:
  - 任意の$V,H$
  conclusion: $H$は冪零 Lie 環である。
  answer: |
    $K$を体、$V$を有限次元$K$線形空間、$H\subseteq\mathrm{End}(V)$を冪零な自己準同型からなる部分 Lie 環とする。$H$は有限次元である。
    $f\in H$とする。$f^{n+1}=0$なら、$\mathrm{End}(V)$上の$T(g)=fg-gf$は$T^{2n+1}=0$を満たす。実際、$T$は可換な左乗法と右乗法の差であり、二項展開の各項で一方の指数が$n+1$以上になる。$\mathrm{ad}_Hf$は$T$の$H$への制限なので冪零である。
    したがって$H$の随伴加群$H$に各元が冪零に作用する。Engel の定理（有限次元加群が冪零であることと、各元が冪零に作用することは同値）より$H$は冪零である。
  strategy: Nilpotent operators are ad-nilpotent, then apply Engel's theorem to the adjoint module.
  sketch:
  - 'derive: T(g) = fg - gf is nilpotent on End(V) when f is nilpotent.'
  - 'derive: ad of f on H is the restriction of T.'
  - 'apply_theorem: Engel''s theorem makes H nilpotent.'
  openmath: (forall (K V H) (-> (and (field K) (finite_dimensional V) (lie_subalgebra H (endomorphism_lie_algebra K V)) (forall (f) (-> (in f H) (nilpotent_op f)))) (nilpotent_lie_algebra H)))
  hard_negative:
    statement: $\mathrm{End}(V)$の冪零な部分 Lie 環の元は冪零な自己準同型である。
    reason: $V\neq 0$で$H=K\cdot\mathrm{id}$とする。$H$は可換なので冪零 Lie 環だが、$\mathrm{id}$は冪零でない。
  target: |
    ∀ (K : Type*) (V : Type*) [Field K] [AddCommGroup V] [Module K V] [FiniteDimensional K V], (letI : LieRing (Module.End K V) := LieRing.ofAssociativeRing; letI : LieAlgebra K (Module.End K V) := LieAlgebra.ofAssociativeAlgebra; ∀ H : LieSubalgebra K (Module.End K V), (∀ f ∈ H, IsNilpotent f) → LieRing.IsNilpotent H)
  proof: |
    by
      intro K V _ _ _ _
      letI : LieRing (Module.End K V) := LieRing.ofAssociativeRing
      letI : LieAlgebra K (Module.End K V) := LieAlgebra.ofAssociativeAlgebra
      intro H h
      rw [LieAlgebra.isNilpotent_iff_forall (R := K)]
      intro x
      apply LieSubalgebra.isNilpotent_ad_of_isNilpotent_ad H
      exact LieAlgebra.ad_nilpotent_of_nilpotent (h x x.2)
- id: lie_module_hom_iff_invariant
  kind: gap
  level: 3
  topic: Lie環・加群の準同型
  statement: Lie 環$L$の加群$M,N$の間の線形写像$f$に$(x\cdot f)(m)=[x,f(m)]-f([x,m])$で作用を定めるとき、すべての$x$で$x\cdot f=0$であることと、$f$が加群の準同型であることは同値である。
  statement_en: For modules M, N over a Lie algebra L and a linear map f from M to N, with (x.f)(m) = [x,f(m)] - f([x,m]), one has x.f = 0 for all x if and only if f is a module homomorphism.
  assumptions:
  - $L$は可換環$R$上の Lie 環、$M,N$は$L$加群
  - $f\colon M\to N$は$R$線形
  quantifiers:
  - 任意の$f$
  conclusion: すべての$x$で$x\cdot f=0$と、$f([x,m])=[x,f(m)]$がすべての$x,m$で成り立つことは同値である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$M,N$を$L$加群、$f\colon M\to N$を$R$線形写像とする。$x\in L$、$m\in M$に対し、定義より$(x\cdot f)(m)=[x,f(m)]-f([x,m])$である。
    したがって$(x\cdot f)(m)=0$と$f([x,m])=[x,f(m)]$は同値である。$x,m$を動かすと、$x\cdot f=0$がすべての$x$で成り立つことと、$f$が準同型であることの同値を得る。
  strategy: Evaluate the action on m and compare.
  sketch:
  - 'setup: Write (x.f)(m) = [x,f(m)] - f([x,m]).'
  - 'derive: This vanishes exactly when f([x,m]) = [x,f(m)].'
  - 'conclude: Quantifying over x and m gives the equivalence.'
  openmath: (forall (Rg L M U f) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_module M L Rg) (lie_module U L Rg) (linear_map_between f M U)) (<-> (forall (x) (-> (in x L) (= (lie_hom_action x f) 0))) (lie_module_hom_property f))))
  hard_negative:
    statement: $f$が$L$加群の準同型であることと、$f(M)$が$N$の不変元に含まれることは同値である。
    reason: $M=N$が非自明な加群で$f=\mathrm{id}$なら、$f$は準同型だが、$f(M)=M$は不変元からなる部分に含まれない。
  target: |
    ∀ (R : Type*) (L : Type*) (M : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] [AddCommGroup M] [Module R M] [LieRingModule L M] [LieModule R L M] (N : Type*) [AddCommGroup N] [Module R N] [LieRingModule L N] [LieModule R L N] (f : M →ₗ[R] N), (∀ x : L, ⁅x, f⁆ = 0) ↔ ∀ (x : L) (m : M), f ⁅x, m⁆ = ⁅x, f m⁆
  proof: |
    by
      intro R L M _ _ _ _ _ _ _ N _ _ _ _ f
      constructor
      · intro h x m
        have := LinearMap.congr_fun (h x) m
        rw [LieHom.lie_apply, LinearMap.zero_apply, sub_eq_zero] at this
        exact this.symm
      · intro h x
        ext m
        rw [LieHom.lie_apply, LinearMap.zero_apply, sub_eq_zero, h]
- id: lie_lcs_le_iff_le_ucs
  kind: gap
  level: 3
  topic: Lie環・中心列
  statement: $L$加群$M$の部分加群に対し$N_0=N$、$N_{k+1}=[L,N_k]$、および$N^0=N$、$N^{k+1}=\{m\mid [L,m]\subseteq N^k\}$と定める。部分加群$A,B$について、$A_k\subseteq B$と$A\subseteq B^k$は同値である。
  statement_en: 'For submodules of an L-module define N_0 = N, N_(k+1) = [L, N_k] and N^0 = N, N^(k+1) = {m : [L,m] inside N^k}. For submodules A and B, A_k is contained in B if and only if A is contained in B^k.'
  assumptions:
  - $L$は可換環$R$上の Lie 環、$M$は$L$加群
  - $A,B$は$M$の部分加群、$k\geq 0$
  quantifiers:
  - 任意の$A,B,k$
  conclusion: $A_k\subseteq B$と$A\subseteq B^k$は同値である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$M$を$L$加群とする。まず部分加群$A,B$について$[L,A]\subseteq B$と$A\subseteq B^1$が同値であることに注意する。どちらも「すべての$a\in A$、$x\in L$で$[x,a]\in B$」を意味する。
    任意の$A,B$についての主張として$k$の帰納法で示す。$k=0$は$A\subseteq B$同士である。$k$で成り立つとする。$A_{k+1}=[L,A_k]$であり、上の注意より$A_{k+1}\subseteq B$は$A_k\subseteq B^1$と同値である。帰納法の仮定より、これは$A\subseteq(B^1)^k$と同値である。
    定義を$k$回たどると$(B^1)^k=B^{k+1}$である。よって$A_{k+1}\subseteq B$と$A\subseteq B^{k+1}$は同値である。
  strategy: The case k = 1 is a Galois connection; iterate it by induction.
  sketch:
  - 'derive: [L,A] inside B is equivalent to A inside B^1.'
  - 'induction: A_(k+1) inside B iff A_k inside B^1 iff A inside (B^1)^k.'
  - 'conclude: (B^1)^k = B^(k+1).'
  openmath: (forall (Rg L M A B k) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_module M L Rg) (lie_submodule A M L) (lie_submodule B M L) (in k N)) (<-> (subset (lie_lcs_from A k) B) (subset A (lie_ucs_from B k)))))
  hard_negative:
    statement: $A_k\subseteq B$と$A\subseteq B$は同値である。
    reason: $L$が自明に作用する$M\neq 0$で$A=M$、$B=0$、$k=1$とする。$A_1=[L,M]=0\subseteq B$だが$A\not\subseteq B$である。
  target: |
    ∀ (R : Type*) (L : Type*) (M : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] [AddCommGroup M] [Module R M] [LieRingModule L M] [LieModule R L M] (N₁ N₂ : LieSubmodule R L M) (k : ℕ), N₁.lcs k ≤ N₂ ↔ N₁ ≤ N₂.ucs k
  proof: |
    by
      intro R L M _ _ _ _ _ _ _ N₁ N₂ k
      exact LieSubmodule.lcs_le_iff k
- id: lie_theorem_common_eigenvector
  kind: named
  level: 4
  topic: Lie環・Lieの定理
  statement: Lie の定理。標数$0$の代数閉体$K$上の有限次元可解 Lie 環$L$の$0$でない有限次元加群$M$には、線形形式$\chi\colon L\to K$と$v\neq 0$があって、すべての$x\in L$で$[x,v]=\chi(x)v$となる。
  statement_en: Lie's theorem. A nonzero finite-dimensional module M over a finite-dimensional solvable Lie algebra L over an algebraically closed field of characteristic 0 has a linear form chi on L and a nonzero v with [x,v] = chi(x) v for all x.
  assumptions:
  - $K$は標数$0$の代数閉体
  - $L$は有限次元可解 Lie 環、$M\neq 0$は有限次元$L$加群
  quantifiers:
  - 任意の$L,M$
  conclusion: すべての$x$で$[x,v]=\chi(x)v$となる線形形式$\chi$と$v\neq 0$が存在する。
  answer: |
    $K$を標数$0$の代数閉体、$L$を有限次元可解 Lie 環、$M\neq 0$を有限次元$L$加群とする。$\dim L$の帰納法で示す。$L=0$なら$\chi=0$と任意の$v\neq 0$でよい。
    $L\neq 0$とする。可解なので$[L,L]\neq L$である。$[L,L]$を含む余次元$1$の部分空間$A$をとる。$A$はイデアルで可解である。$L=A+Kz$とする。帰納法の仮定より$\chi\in A^*$があって、$W=\{w\in M\mid [a,w]=\chi(a)w\ (a\in A)\}$は$0$でない。
    $W$が$L$で保たれることを示す。$x\in L$、$w\in W$、$a\in A$に対し
    $[a,[x,w]]=[x,[a,w]]-[[x,a],w]=\chi(a)[x,w]-\chi([x,a])w$
    なので、$\chi([x,a])=0$を示せばよい。$w\neq 0$とし、$w_i=X^iw$（$X$は$x$の作用）とする。$w_0,\dots,w_{n-1}$が線形独立で$w_n$がそれらに従属する最小の$n$をとり、$U_i$を$w_0,\dots,w_{i-1}$の張る空間、$U=U_n$とする。$U$は$X$で保たれる。
    $b\in A$について、$i$の帰納法で$[b,w_i]-\chi(b)w_i\in U_i$である。実際$[b,w_i]=X[b,w_{i-1}]-[[x,b],w_{i-1}]$であり、$[b,w_{i-1}]\equiv\chi(b)w_{i-1}$（$U_{i-1}$を法）と$[[x,b],w_{i-1}]\in U_i$より従う。よって$b$は$U$を保ち、$U$上のトレースは$n\chi(b)$である。
    $b=[x,a]$とする。$U$上で$[x,a]$は$U$を保つ二つの作用素$X,a$の交換子として働くのでトレースは$0$である。したがって$n\chi([x,a])=0$であり、標数$0$より$\chi([x,a])=0$である。
    よって$W$は$z$で保たれる。$K$は代数閉体なので、$z$は$W$に固有ベクトル$v\neq 0$を持ち、$[z,v]=\lambda v$とする。$\chi(a+tz)=\chi(a)+t\lambda$で$\chi$を$L$へ拡張すると、$[x,v]=\chi(x)v$がすべての$x\in L$で成り立つ。
  strategy: Induct on dim L via a codimension-one ideal; the invariance lemma uses a trace computation in characteristic 0.
  sketch:
  - 'setup: Choose an ideal A of codimension one containing [L,L], with L = A + Kz.'
  - 'apply_theorem: By induction the weight space W of chi on A is nonzero.'
  - 'derive: [a,[x,w]] = chi(a)[x,w] - chi([x,a])w reduces invariance to chi([x,a]) = 0.'
  - 'construct: Build a chain U_i spanned by the X^i w, on which elements of A are triangular with diagonal chi.'
  - 'derive: The trace of [x,a] on U is n chi([x,a]) and also 0.'
  - 'derive: Characteristic 0 gives chi([x,a]) = 0, so W is stable under z.'
  - 'conclude: An eigenvector of z in W is a common eigenvector.'
  openmath: (forall (K L M) (-> (and (alg_closed_field K) (field_of_char K 0) (lie_algebra L K) (finite_dimensional L) (solvable_lie_algebra L) (lie_module M L K) (finite_dimensional M) (not (zero_lie_ideal M))) (exists (c v) (and (dual_functional c K L) (in v M) (!= v 0) (forall (x) (-> (in x L) (= (lie_action x v) (* (fn_value c x) v))))))))
  hard_negative:
    statement: 正標数の代数閉体上でも、可解 Lie 環の有限次元加群は共通固有ベクトルを持つ。
    reason: 標数$p$で基底$x,y$、$[x,y]=y$の Lie 環を$K^p$へ$x=\mathrm{diag}(0,1,\dots,p-1)$、$y$=巡回置換行列（$ye_{i}=e_{i+1}$）で作用させる。$y$の固有ベクトルの成分はすべて$0$でなく、$x$の固有ベクトルは座標軸上にあるので、$p\geq 2$では共通のものがない。
  target: |
    ∀ (K : Type*) (L : Type*) (M : Type*) [Field K] [LieRing L] [LieAlgebra K L] [AddCommGroup M] [Module K M] [LieRingModule L M] [LieModule K L M] [FiniteDimensional K L] [FiniteDimensional K M] [CharZero K] [IsAlgClosed K], LieAlgebra.IsSolvable L → Nontrivial M → ∃ χ : Module.Dual K L, ∃ v : M, v ≠ 0 ∧ ∀ x : L, ⁅x, v⁆ = χ x • v
  proof: |
    by
      intro K L M _ _ _ _ _ _ _ _ _ _ _ h₁ h₂
      obtain ⟨χ, hχ⟩ := LieModule.exists_nontrivial_weightSpace_of_isSolvable K L M
      obtain ⟨⟨v, hv⟩, hv0⟩ := exists_ne (0 : LieModule.weightSpace M χ)
      exact ⟨χ, v, fun h0 => hv0 (Subtype.ext h0), (LieModule.mem_weightSpace χ v).mp hv⟩
- id: lie_irreducible_faithful_radical_central
  kind: textbook
  level: 4
  topic: Lie環・既約忠実加群
  statement: 標数$0$の代数閉体上の有限次元 Lie 環$L$が有限次元の既約で忠実な加群$M$を持つなら、$\mathrm{rad}\,L=Z(L)$であり、$x\in Z(L)$であることと$x$が$M$にスカラーで作用することは同値である。
  statement_en: If a finite-dimensional Lie algebra L over an algebraically closed field of characteristic 0 has a finite-dimensional irreducible faithful module M, then rad L = Z(L), and x lies in Z(L) if and only if x acts on M by a scalar.
  assumptions:
  - $K$は標数$0$の代数閉体、$L$は有限次元 Lie 環
  - $M$は有限次元で既約かつ忠実な$L$加群
  quantifiers:
  - 任意の$L,M$
  conclusion: $\mathrm{rad}\,L=Z(L)$であり、$x\in Z(L)$と$x$のスカラー作用は同値である。
  answer: |
    $K$を標数$0$の代数閉体、$L$を有限次元 Lie 環、$M$を有限次元の既約で忠実な$L$加群とし、$\mathfrak r=\mathrm{rad}\,L$とする。既約なので$M\neq 0$である。$\mathfrak r$は可解イデアルである。Lie の定理を$\mathfrak r$の$M$への作用に用いると、線形形式$\chi$があって$W=\{w\in M\mid [r,w]=\chi(r)w\ (r\in\mathfrak r)\}\neq 0$である。
    $W$が$L$で保たれることを示す。$x\in L$、$w\in W$、$r\in\mathfrak r$に対し$[r,[x,w]]=\chi(r)[x,w]-\chi([x,r])w$である。$w\neq 0$について、$w,Xw,X^2w,\dots$の張る$X$不変な部分空間$U$（$X$は$x$の作用）を考える。$b\in\mathfrak r$について$[b,X^iw]=X[b,X^{i-1}w]-[[x,b],X^{i-1}w]$であり、$[x,b]\in\mathfrak r$である。よって$i$の帰納法より$[b,X^iw]-\chi(b)X^iw$は$w,\dots,X^{i-1}w$の張る空間に入る。すなわち$b$は$U$を保ち、$w,Xw,\dots$の順の基底に関して三角型で対角成分$\chi(b)$を持つので、$U$上のトレースは$(\dim U)\chi(b)$である。$b=[x,r]$は$U$上で交換子として働くのでトレース$0$であり、標数$0$より$\chi([x,r])=0$である。
    よって$W$は$0$でない部分加群であり、既約性より$W=M$である。すなわち各$r\in\mathfrak r$は$M$にスカラー$\chi(r)$で作用する。$x\in L$に対し$[x,r]$の作用は$X$とスカラーの交換子なので$0$であり、忠実性より$[x,r]=0$である。したがって$\mathfrak r\subseteq Z(L)$である。$Z(L)$は可換イデアルなので$Z(L)\subseteq\mathfrak r$であり、$\mathfrak r=Z(L)$である。
    $x\in Z(L)=\mathfrak r$ならスカラーで作用することはすでに示した。逆に$x$がスカラーで作用するなら、任意の$y$について$[x,y]$の作用はスカラーと$Y$の交換子なので$0$であり、忠実性より$[x,y]=0$である。よって$x\in Z(L)$である。
  strategy: Apply Lie's theorem to the radical; irreducibility makes it act by scalars and faithfulness makes it central.
  sketch:
  - 'apply_theorem: Lie''s theorem gives a nonzero weight space W for rad L.'
  - 'derive: The trace argument shows W is stable under L.'
  - 'derive: Irreducibility gives W = M, so the radical acts by scalars.'
  - 'derive: Faithfulness shows the radical is central.'
  - 'conclude: The center is an abelian ideal, so rad L = Z(L), and the scalar criterion follows.'
  openmath: (forall (K L M) (-> (and (alg_closed_field K) (field_of_char K 0) (lie_algebra L K) (finite_dimensional L) (lie_module M L K) (finite_dimensional M) (lie_irreducible_module M L) (lie_faithful_module L M)) (and (= (lie_radical L) (lie_center L)) (forall (x) (-> (in x L) (<-> (in x (lie_center L)) (exists (c) (and (in c K) (= (lie_action_op x M) (scalar_op c M))))))))))
  hard_negative:
    statement: 有限次元の既約で忠実な加群を持つ Lie 環は半単純である。
    reason: $\mathfrak{gl}_n(K)$は$K^n$に既約かつ忠実に作用するが、中心がスカラー行列全体なので半単純でない。
  target: |
    ∀ (K : Type*) (L : Type*) (M : Type*) [Field K] [LieRing L] [LieAlgebra K L] [AddCommGroup M] [Module K M] [LieRingModule L M] [LieModule K L M] [FiniteDimensional K L] [FiniteDimensional K M] [CharZero K] [IsAlgClosed K], LieModule.IsIrreducible K L M → LieModule.IsFaithful K L M → LieAlgebra.radical K L = LieAlgebra.center K L ∧ ∀ x : L, x ∈ LieAlgebra.center K L ↔ ∃ c : K, LieModule.toEnd K L M x = c • LinearMap.id
  proof: |
    by
      intro K L M _ _ _ _ _ _ _ _ _ _ _ h₁ h₂
      obtain ⟨h3, h4⟩ := LieAlgebra.hasCentralRadical_and_of_isIrreducible_of_isFaithful K L M
      refine ⟨h3.radical_eq_center, fun x => (h4 x).trans ?_⟩
      rw [Submodule.mem_span_singleton]
      exact ⟨fun ⟨c, hc⟩ => ⟨c, hc.symm⟩, fun ⟨c, hc⟩ => ⟨c, hc.symm⟩⟩
- id: lie_trace_form_symmetric_invariant
  kind: gap
  level: 4
  topic: Lie環・Killing形式の計算則
  statement: 体$K$上の Lie 環$L$の有限次元加群$M$について、$B(x,y)=\mathrm{tr}_M(xy)$は対称で、$B([x,y],z)=B(x,[y,z])$を満たす。$M=L$とすると Killing 形式の場合である。
  statement_en: For a finite-dimensional module M over a Lie algebra L over a field, the trace form B(x,y) = tr_M(xy) is symmetric and satisfies B([x,y],z) = B(x,[y,z]). The case M = L is the Killing form.
  assumptions:
  - $K$は体、$L$は$K$上の Lie 環
  - $M$は有限次元$L$加群
  quantifiers:
  - 任意の$x,y,z\in L$
  conclusion: $B(x,y)=B(y,x)$かつ$B([x,y],z)=B(x,[y,z])$である。
  answer: |
    $K$を体、$L$を$K$上の Lie 環、$M$を有限次元$L$加群とし、$x,y,z\in L$の作用を$X,Y,Z$とする。$B(x,y)=\mathrm{tr}(XY)$である。トレースの性質$\mathrm{tr}(ST)=\mathrm{tr}(TS)$より$B(x,y)=B(y,x)$である。
    $[x,y]$の作用は$XY-YX$なので
    $B([x,y],z)=\mathrm{tr}(XYZ)-\mathrm{tr}(YXZ),\quad B(x,[y,z])=\mathrm{tr}(XYZ)-\mathrm{tr}(XZY)$
    である。$\mathrm{tr}(YXZ)=\mathrm{tr}(Y(XZ))=\mathrm{tr}((XZ)Y)=\mathrm{tr}(XZY)$なので、両者は等しい。
  strategy: Use tr(ST) = tr(TS) for operators representing x, y, z.
  sketch:
  - 'derive: Symmetry is tr(XY) = tr(YX).'
  - 'derive: Expand both sides of the invariance formula.'
  - 'conclude: tr(YXZ) = tr(XZY) gives equality.'
  openmath: (forall (K L M x y z) (-> (and (field K) (lie_algebra L K) (lie_module M L K) (finite_dimensional M) (in x L) (in y L) (in z L)) (and (= (trace_form_value M x y) (trace_form_value M y x)) (= (trace_form_value M (lie_bracket x y) z) (trace_form_value M x (lie_bracket y z))))))
  hard_negative:
    statement: $B([x,y],z)=B([x,z],y)$である。
    reason: 標数$0$の体上の$\mathfrak{sl}_2$の Killing 形式では$\kappa([e,f],h)=\kappa(h,h)=8$だが、$\kappa([e,h],f)=-2\kappa(e,f)=-8$である。正しい入れ替えでは符号が変わる。
  target: |
    ∀ (K : Type*) (L : Type*) (M : Type*) [Field K] [LieRing L] [LieAlgebra K L] [AddCommGroup M] [Module K M] [LieRingModule L M] [LieModule K L M] [FiniteDimensional K M] (x y z : L), LieModule.traceForm K L M x y = LieModule.traceForm K L M y x ∧ LieModule.traceForm K L M ⁅x, y⁆ z = LieModule.traceForm K L M x ⁅y, z⁆
  proof: |
    by
      intro K L M _ _ _ _ _ _ _ _ x y z
      exact ⟨LieModule.traceForm_comm K L M x y, LieModule.traceForm_apply_lie_apply K L M x y z⟩
- id: lie_killing_orthogonal_of_ideal_is_ideal
  kind: gap
  level: 4
  topic: Lie環・Killing形式の計算則
  statement: 有限次元 Lie 環$L$のイデアル$I$について、$\kappa(x,I)=0$なる$x$全体は$L$の元の括弧で閉じる。すなわち$\kappa(x,I)=0$なら任意の$y$で$\kappa([y,x],I)=0$である。よって$I^\perp$はイデアルである。
  statement_en: For an ideal I of a finite-dimensional Lie algebra L over a field, if the Killing form satisfies kappa(x,I) = 0, then kappa([y,x],I) = 0 for every y in L, so the orthogonal complement of I is an ideal.
  assumptions:
  - $K$は体、$L$は有限次元 Lie 環、$\kappa$は Killing 形式
  - $I$はイデアル、$\kappa(x,I)=0$
  quantifiers:
  - 任意の$y\in L$と$z\in I$
  conclusion: $\kappa([y,x],z)=0$である。
  answer: |
    $K$を体、$L$を有限次元 Lie 環、$\kappa$を Killing 形式、$I$をイデアルとし、$x\in L$は$\kappa(x,I)=0$を満たすとする。$y\in L$、$z\in I$をとる。Killing 形式の不変性$\kappa([u,v],w)=\kappa(u,[v,w])$より
    $\kappa([y,x],z)=-\kappa([x,y],z)=-\kappa(x,[y,z])$
    である。$I$はイデアルなので$[y,z]\in I$であり、右辺は$0$である。
  strategy: Move the bracket with invariance and use that I is an ideal.
  sketch:
  - 'derive: kappa([y,x],z) = -kappa(x,[y,z]) by invariance.'
  - 'derive: [y,z] lies in I.'
  - 'conclude: The value is 0.'
  openmath: (forall (K L I x y z) (-> (and (field K) (lie_algebra L K) (finite_dimensional L) (lie_ideal I L) (in x L) (in y L) (in z I) (forall (w) (-> (in w I) (= (killing_value L x w) 0)))) (= (killing_value L (lie_bracket y x) z) 0)))
  hard_negative:
    statement: 部分 Lie 環の Killing 形式に関する直交は部分 Lie 環である。
    reason: 標数$0$の体上の$\mathfrak{sl}_2$で$H=Kh$とすると$H^\perp=Ke+Kf$である。$[e,f]=h\notin H^\perp$なので部分 Lie 環でない。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] (I : LieIdeal K L) (x y : L), (∀ z ∈ I, killingForm K L x z = 0) → ∀ z ∈ I, killingForm K L ⁅y, x⁆ z = 0
  proof: |
    by
      intro K L _ _ _ _ I x y h z hz
      rw [← lie_skew, map_neg, LinearMap.neg_apply, LieModule.traceForm_apply_lie_apply K L L x y z, h _ (lie_mem_right K L I y z hz), neg_zero]
- id: lie_killing_form_ideal_restriction
  kind: gap
  level: 4
  topic: Lie環・Killing形式の計算則
  statement: 体上の有限次元 Lie 環$L$のイデアル$I$について、$I$自身の Killing 形式は$L$の Killing 形式の$I$への制限に等しい。
  statement_en: For an ideal I of a finite-dimensional Lie algebra L over a field, the Killing form of I is the restriction of the Killing form of L.
  assumptions:
  - $K$は体、$L$は有限次元 Lie 環
  - $I$は$L$のイデアル
  quantifiers:
  - 任意の$x,y\in I$
  conclusion: $\kappa_I(x,y)=\kappa_L(x,y)$である。
  answer: |
    $K$を体、$L$を有限次元 Lie 環、$I$をイデアルとし、$x,y\in I$をとる。$T=\mathrm{ad}_Lx\,\mathrm{ad}_Ly$とおく。$I$はイデアルなので$T(L)\subseteq I$である。
    $I$の基底を$L$の基底へ延長して$T$の行列を見る。$T(L)\subseteq I$より、延長部分の対角成分は$0$である。よって$\mathrm{tr}_L(T)=\mathrm{tr}_I(T|_I)$である。$T|_I=\mathrm{ad}_Ix\,\mathrm{ad}_Iy$なので、$\kappa_L(x,y)=\kappa_I(x,y)$である。
  strategy: The operator maps L into I, so its trace can be computed on I.
  sketch:
  - 'setup: T = ad x ad y maps L into I.'
  - 'derive: In a basis extending one of I, the remaining diagonal entries vanish.'
  - 'conclude: tr_L(T) = tr_I(T restricted to I).'
  openmath: (forall (K L I x y) (-> (and (field K) (lie_algebra L K) (finite_dimensional L) (lie_ideal I L) (in x I) (in y I)) (= (killing_value I x y) (killing_value L x y))))
  hard_negative:
    statement: 部分 Lie 環$H$の Killing 形式は$L$の Killing 形式の制限に等しい。
    reason: 標数$0$の体上の$\mathfrak{sl}_2$で$H=Kh$とすると$\kappa_H(h,h)=0$だが$\kappa_L(h,h)=8$である。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] (I : LieIdeal K L) (x y : I), killingForm K I x y = killingForm K L (x : L) (y : L)
  proof: |
    by
      intro K L _ _ _ _ I x y
      rw [LieIdeal.killingForm_eq]
      rfl
- id: lie_killing_abelian_ideal_in_kernel
  kind: gap
  level: 4
  topic: Lie環・Killing形式の計算則
  statement: 体上の有限次元 Lie 環$L$の可換イデアル$I$の元$x$は、すべての$y\in L$について$\kappa(x,y)=0$を満たす。
  statement_en: An element x of an abelian ideal I of a finite-dimensional Lie algebra L over a field satisfies kappa(x,y) = 0 for every y in L.
  assumptions:
  - $K$は体、$L$は有限次元 Lie 環
  - $I$は可換イデアル、$x\in I$
  quantifiers:
  - 任意の$y\in L$
  conclusion: $\kappa(x,y)=0$である。
  answer: |
    $K$を体、$L$を有限次元 Lie 環、$I$を可換イデアル、$x\in I$、$y\in L$とする。$T=\mathrm{ad}\,x\,\mathrm{ad}\,y$とおく。$z\in L$に対し$Tz=[x,[y,z]]\in I$である。
    さらに$w\in I$なら$Tw=[x,[y,w]]$で、$[y,w]\in I$と$I$の可換性より$Tw=0$である。よって$T^2=0$であり、$\kappa(x,y)=\mathrm{tr}\,T=0$である。
  strategy: Show the operator ad x ad y squares to zero.
  sketch:
  - 'derive: T = ad x ad y maps L into I.'
  - 'derive: T kills I because [y,w] lies in I and I is abelian.'
  - 'conclude: T^2 = 0, so its trace vanishes.'
  openmath: (forall (K L I x y) (-> (and (field K) (lie_algebra L K) (finite_dimensional L) (lie_ideal I L) (abelian_lie_algebra I) (in x I) (in y L)) (= (killing_value L x y) 0)))
  hard_negative:
    statement: 可換な部分 Lie 環の元は Killing 形式の核に入る。
    reason: 標数$0$の体上の$\mathfrak{sl}_2$で$Kh$は可換な部分 Lie 環だが、$\kappa(h,h)=8\neq 0$である。イデアルであることが必要である。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] (I : LieIdeal K L) (x y : L), IsLieAbelian I → x ∈ I → killingForm K L x y = 0
  proof: |
    by
      intro K L _ _ _ _ I x y hI hx
      have h := LieIdeal.le_killingCompl_top_of_isLieAbelian K L I hx
      rw [LieIdeal.mem_killingCompl] at h
      rw [LieModule.traceForm_comm]
      exact h y (LieSubmodule.mem_top y)
- id: lie_killing_nilpotent_zero
  kind: gap
  level: 4
  topic: Lie環・Killing形式の計算則
  statement: 体上の有限次元冪零 Lie 環の Killing 形式は恒等的に$0$である。
  statement_en: The Killing form of a finite-dimensional nilpotent Lie algebra over a field is identically zero.
  assumptions:
  - $K$は体、$L$は有限次元冪零 Lie 環
  quantifiers:
  - 任意の$x,y\in L$
  conclusion: $\kappa(x,y)=0$である。
  answer: |
    $K$を体、$L$を有限次元冪零 Lie 環とし、$C^kL=0$とする。$x,y\in L$をとり、$T=\mathrm{ad}\,x\,\mathrm{ad}\,y$とおく。
    $T(C^iL)\subseteq C^{i+2}L$なので、$T^kL\subseteq C^{2k}L\subseteq C^kL=0$である。$T$は冪零なので$\kappa(x,y)=\mathrm{tr}\,T=0$である。
  strategy: The product ad x ad y shifts the lower central series and hence is nilpotent.
  sketch:
  - 'derive: T maps C^i L into C^(i+2) L.'
  - 'derive: T^k vanishes when C^k L = 0.'
  - 'conclude: A nilpotent operator has trace 0.'
  openmath: (forall (K L x y) (-> (and (field K) (lie_algebra L K) (finite_dimensional L) (nilpotent_lie_algebra L) (in x L) (in y L)) (= (killing_value L x y) 0)))
  hard_negative:
    statement: Killing 形式が恒等的に$0$の有限次元 Lie 環は冪零である。
    reason: $\mathbb{C}$上で$L=\mathbb{C}x\ltimes\mathbb{C}^3$とし、$\mathrm{ad}\,x$を$\mathbb{C}^3$上$\mathrm{diag}(1,\omega,\omega^2)$（$\omega$は$1$の原始$3$乗根）とする。$\kappa(x,x)=1+\omega^2+\omega^4=0$で他の値も$0$だが、$[x,e_1]=e_1$なので冪零でない。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L], LieRing.IsNilpotent L → killingForm K L = 0
  proof: |
    by
      intro K L _ _ _ _ h
      exact LieModule.traceForm_eq_zero_of_isNilpotent K L L
- id: lie_killing_nondegenerate_semisimple
  kind: named
  level: 4
  topic: Lie環・半単純性
  statement: 体上の有限次元 Lie 環$L$の Killing 形式が非退化なら、$L$は半単純である。ここで半単純とは、$L$が非可換な極小イデアル（単純イデアル）の直和であることをいう。
  statement_en: If the Killing form of a finite-dimensional Lie algebra L over a field is nondegenerate, then L is semisimple, meaning the direct sum of its non-abelian minimal ideals.
  assumptions:
  - $K$は体、$L$は有限次元 Lie 環
  - Killing 形式$\kappa$は非退化
  quantifiers:
  - 任意の$L$
  conclusion: $L$は非可換な極小イデアルの直和である。
  answer: |
    $K$を体、$L$を有限次元 Lie 環とし、$\kappa$は非退化であるとする。可換イデアルの元は$\kappa$の核に入るので、$L$の可換イデアルは$0$のみである。
    イデアル$I$に対し$I^\perp$はイデアルである。$J=I\cap I^\perp$とする。$x,y\in J$、$z\in L$なら$\kappa([x,y],z)=\kappa(x,[y,z])=0$である。$x\in I^\perp$、$[y,z]\in I$だからである。非退化性より$[x,y]=0$であり、$J$は可換イデアルなので$J=0$である。非退化性より$\dim I^\perp=\dim L-\dim I$なので$L=I\oplus I^\perp$である。$[I,I^\perp]\subseteq I\cap I^\perp=0$なので、$I$のイデアルと$I^\perp$のイデアルは$L$のイデアルである。
    $\dim L$の帰納法で、$L$が極小イデアルの直和であることを示す。$L=0$は空の直和である。$L\neq 0$なら極小イデアル$I$をとる。$\kappa_I,\kappa_{I^\perp}$は$\kappa$の制限であり、$L=I\oplus I^\perp$は直交分解なので非退化である。帰納法の仮定より$I^\perp$は自身の極小イデアルの直和であり、それらは$L$の極小イデアルである。よって$L=S_1\oplus\dots\oplus S_r$（$S_i$は極小イデアル）である。可換イデアルは$0$のみなので各$S_i$は非可換である。
    $A$を$L$の任意の極小イデアルとする。$[A,L]=0$なら$A$は可換イデアルになるので$[A,L]\neq 0$である。$[A,L]=\sum_i[A,S_i]$なので、ある$i$で$[A,S_i]\neq 0$である。$[A,S_i]\subseteq A\cap S_i$は$0$でないイデアルなので、極小性より$A=S_i$である。よって極小イデアルは$S_1,\dots,S_r$に限られ、$L$はそれらの直和である。
  strategy: Split off minimal ideals using orthogonal complements and identify all minimal ideals.
  sketch:
  - 'derive: Abelian ideals vanish because they lie in the kernel of kappa.'
  - 'derive: For an ideal I, the intersection with its orthogonal is abelian, so L = I + I^perp is direct.'
  - 'induction: Restrictions stay nondegenerate, so L is a direct sum of minimal ideals S_i.'
  - 'derive: Each S_i is non-abelian.'
  - 'derive: Any minimal ideal A has [A,S_i] nonzero for some i, so A = S_i.'
  - 'conclude: L is the direct sum of its non-abelian minimal ideals.'
  openmath: (forall (K L) (-> (and (field K) (lie_algebra L K) (finite_dimensional L) (killing_nondegenerate L)) (semisimple_lie_algebra L)))
  hard_negative:
    statement: 体上の有限次元 Lie 環の Killing 形式が非退化なら、$L$は単純である。
    reason: 標数$0$の体上の$\mathfrak{sl}_2\oplus\mathfrak{sl}_2$は Killing 形式が直交和で非退化だが、直和因子が非自明なイデアルなので単純でない。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L], (killingForm K L).Nondegenerate → LieAlgebra.IsSemisimple K L
  proof: |
    by
      intro K L _ _ _ _ h
      haveI : LieAlgebra.IsKilling K L := ⟨by
        rw [eq_bot_iff]
        intro x hx
        rw [LieIdeal.mem_killingCompl] at hx
        have hx0 : x = 0 := h.1 x (fun y => by
          rw [LieModule.traceForm_comm]
          exact hx y (LieSubmodule.mem_top y))
        simp [hx0]⟩
      infer_instance
- id: lie_killing_iff_trivial_radical
  kind: named
  level: 4
  topic: Lie環・Cartanの判定法
  statement: Cartan の半単純性判定法。標数$0$の体上の有限次元 Lie 環$L$について、$\mathrm{rad}\,L=0$であることと Killing 形式が非退化であることは同値である。
  statement_en: Cartan's criterion for semisimplicity. A finite-dimensional Lie algebra L over a field of characteristic 0 has rad L = 0 if and only if its Killing form is nondegenerate.
  assumptions:
  - $K$は標数$0$の体
  - $L$は有限次元 Lie 環
  quantifiers:
  - 任意の$L$
  conclusion: $\mathrm{rad}\,L=0$と$\kappa$の非退化性は同値である。
  answer: |
    $K$を標数$0$の体、$L$を有限次元 Lie 環とする。
    $\kappa$が非退化であるとする。可換イデアルの元は$\kappa$の核に入るので、可換イデアルは$0$のみである。$0$でない可解イデアルは導来列の最後の$0$でない項として$0$でない可換イデアルを含むので、可解イデアルも$0$のみであり、$\mathrm{rad}\,L=0$である。
    $\mathrm{rad}\,L=0$とする。$S=\ker\kappa=\{x\mid\kappa(x,L)=0\}$はイデアルである。Killing 形式の不変性による。イデアルの Killing 形式は全体の Killing 形式の制限なので、$\kappa_S=0$である。Cartan の可解性判定法（$\kappa_S(S,[S,S])=0$なら$S$は可解）より$S$は可解なので、$S\subseteq\mathrm{rad}\,L=0$である。よって$\kappa$は非退化である。
  strategy: Use abelian ideals in the kernel in one direction and Cartan's solvability criterion on the kernel in the other.
  sketch:
  - 'derive: If kappa is nondegenerate, abelian ideals vanish.'
  - 'derive: Then solvable ideals vanish, since they contain abelian ideals.'
  - 'setup: Conversely let S be the kernel of kappa, an ideal.'
  - 'derive: The Killing form of S is the restriction of kappa, hence 0.'
  - 'apply_theorem: Cartan''s solvability criterion makes S solvable.'
  - 'conclude: S lies in rad L = 0.'
  openmath: (forall (K L) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (finite_dimensional L)) (<-> (zero_lie_ideal (lie_radical L)) (killing_nondegenerate L))))
  hard_negative:
    statement: 正標数の体上でも、$\mathrm{rad}\,L=0$なら Killing 形式は非退化である。
    reason: 標数$3$の$\mathfrak{psl}_3$は単純で根基が$0$である。一方$\mathfrak{sl}_3$の Killing 形式は$6\,\mathrm{tr}(xy)=0$であり、中心は$\mathrm{ad}$の核なので$\mathfrak{psl}_3$の Killing 形式も$0$である。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L], LieAlgebra.HasTrivialRadical K L ↔ LieAlgebra.IsKilling K L
  proof: |
    by
      intro K L _ _ _ _ _
      exact LieAlgebra.hasTrivialRadical_iff_isKilling K L
- id: lie_cartan_solvability_criterion
  kind: named
  level: 4
  topic: Lie環・Cartanの判定法
  statement: Cartan の可解性判定法。標数$0$の体上の有限次元 Lie 環$L$で、すべての$x\in L$、$y\in[L,L]$について$\kappa(x,y)=0$なら、$L$は可解である。
  statement_en: Cartan's criterion for solvability. If a finite-dimensional Lie algebra L over a field of characteristic 0 satisfies kappa(x,y) = 0 for all x in L and y in [L,L], then L is solvable.
  assumptions:
  - $K$は標数$0$の体
  - $L$は有限次元 Lie 環
  - すべての$x\in L$、$y\in[L,L]$で$\kappa(x,y)=0$
  quantifiers:
  - 任意の$L$
  conclusion: $L$は可解である。
  answer: |
    $K$を標数$0$の体、$L$を有限次元 Lie 環とし、$\kappa(L,[L,L])=0$とする。$\bar K$を$K$の代数閉包、$\bar L=L\otimes_K\bar K$とする。$\bar L$の Killing 形式は$\kappa$の係数拡大であり、$D^n\bar L=(D^nL)\otimes_K\bar K$である。よって仮定は$\bar L$でも成り立ち、$\bar L$が可解なら$L$も可解である。以下、$K$は代数閉体とする。
    まずトレース判定を示す。$V$を$K$上の有限次元空間、$\mathfrak g\subseteq\mathrm{End}(V)$を部分 Lie 環とし、すべての$x\in[\mathfrak g,\mathfrak g]$、$y\in\mathfrak g$で$\mathrm{tr}(xy)=0$とする。このとき$[\mathfrak g,\mathfrak g]$の元はすべて冪零である。
    $\mathfrak m=\{z\in\mathrm{End}(V)\mid[z,\mathfrak g]\subseteq[\mathfrak g,\mathfrak g]\}$とおくと$\mathfrak g\subseteq\mathfrak m$である。$u,v\in\mathfrak g$、$z\in\mathfrak m$に対し$\mathrm{tr}([u,v]z)=\mathrm{tr}(u[v,z])=-\mathrm{tr}(u[z,v])$であり、$[z,v]\in[\mathfrak g,\mathfrak g]$なので、これは仮定より$0$である。よって$x\in[\mathfrak g,\mathfrak g]$、$z\in\mathfrak m$なら$\mathrm{tr}(xz)=0$である。
    $x\in[\mathfrak g,\mathfrak g]$をとり、Jordan 分解$x=s+n$を考える。$s$は対角化可能、$n$は冪零、$sn=ns$である。$V$の基底$v_1,\dots,v_m$を$sv_i=a_iv_i$となるようにとる。$a_1,\dots,a_m$の張る$K$の$\mathbb{Q}$部分空間を$W$とし、$W=0$を示す。
    $\varphi\colon W\to\mathbb{Q}$を$\mathbb{Q}$線形写像とし、$y\in\mathrm{End}(V)$を$yv_i=\varphi(a_i)v_i$で定める。この基底に関する行列単位$E_{ij}$について$(\mathrm{ad}\,s)E_{ij}=(a_i-a_j)E_{ij}$、$(\mathrm{ad}\,y)E_{ij}=\varphi(a_i-a_j)E_{ij}$である。$K$係数の多項式$r$を、$r(0)=0$かつすべての$i,j$で$r(a_i-a_j)=\varphi(a_i-a_j)$となるように Lagrange 補間でとると、$\mathrm{ad}\,y=r(\mathrm{ad}\,s)$である。
    $\mathrm{ad}\,s$は対角化可能である。$\mathrm{ad}\,n$は可換な左乗法と右乗法の差なので冪零である。両者は可換なので、$\mathrm{ad}\,x=\mathrm{ad}\,s+\mathrm{ad}\,n$は$\mathrm{ad}\,x$の Jordan 分解であり、$\mathrm{ad}\,s$は$\mathrm{ad}\,x$の定数項のない多項式である。ゆえに$\mathrm{ad}\,y$も$\mathrm{ad}\,x$の定数項のない多項式である。$\mathrm{ad}\,x$は$\mathfrak g$を$[\mathfrak g,\mathfrak g]$へ移し、$[\mathfrak g,\mathfrak g]$を自身へ移すので、$[y,\mathfrak g]\subseteq[\mathfrak g,\mathfrak g]$である。すなわち$y\in\mathfrak m$であり、$\mathrm{tr}(xy)=0$である。
    $n$は$s$の固有空間を保ち、$y$は各固有空間でスカラーなので、$ny=yn$であり$ny$は冪零である。したがって$0=\mathrm{tr}(xy)=\mathrm{tr}(sy)+\mathrm{tr}(ny)=\sum_ia_i\varphi(a_i)$である。$\varphi(a_i)$は有理数なので、$\varphi$を施すと$\sum_i\varphi(a_i)^2=0$を得る。よってすべての$i$で$\varphi(a_i)=0$であり、$\varphi=0$である。$\varphi$は任意なので$W=0$である。すなわち$s=0$であり、$x=n$は冪零である。
    本題に戻る。$V=L$、$\mathfrak g=\mathrm{ad}\,L$とする。$[\mathfrak g,\mathfrak g]=\mathrm{ad}[L,L]$である。$x\in[L,L]$、$y\in L$に対し$\mathrm{tr}(\mathrm{ad}\,x\,\mathrm{ad}\,y)=\kappa(y,x)=0$なので、トレース判定より$x\in[L,L]$の$\mathrm{ad}\,x$は$L$上で冪零である。
    $\mathrm{ad}_{[L,L]}x$は$\mathrm{ad}\,x$の制限なので冪零である。Engel の定理より$[L,L]$は冪零であり、特に可解である。$L/[L,L]$は可換なので可解である。イデアルと商がともに可解なので$L$は可解である。
  strategy: Prove the trace criterion on End(V) with a rational functional on the eigenvalues of the semisimple part, apply it to ad L, then use Engel's theorem and the extension property of solvability.
  sketch:
  - 'setup: Extend scalars to an algebraic closure; solvability descends.'
  - 'derive: For g in End(V) with tr([g,g] g) = 0, the trace also vanishes against every z with [z,g] inside [g,g].'
  - 'construct: For x in [g,g] with semisimple part s and eigenvalues a_i, and a rational functional phi on their rational span, let y act on the eigenvectors by phi(a_i).'
  - 'derive: ad y is a polynomial without constant term in ad x, so tr(xy) = 0 gives the sum of a_i phi(a_i) = 0.'
  - 'derive: Applying phi gives phi = 0, so s = 0 and x is nilpotent.'
  - 'derive: With g = ad L, ad x is nilpotent for x in [L,L] because kappa vanishes on L times [L,L].'
  - 'apply_theorem: Engel''s theorem makes [L,L] nilpotent, hence solvable.'
  - 'conclude: L/[L,L] is abelian, so L is solvable.'
  openmath: (forall (K L) (-> (and (field K) (field_of_char K 0) (lie_algebra L K) (finite_dimensional L) (forall (x y) (-> (and (in x L) (in y (lie_derived_series L 1))) (= (killing_value L x y) 0)))) (solvable_lie_algebra L)))
  hard_negative:
    statement: 同じ仮定の下で$L$は冪零である。
    reason: 基底$x,y$、$[x,y]=y$の Lie 環では$[L,L]=Ky$であり、$\mathrm{ad}\,u\,\mathrm{ad}\,y$は$y$を消し$L$を$Ky$へ移すのでトレース$0$である。よって仮定は成り立つが、$L$は冪零でない。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [CharZero K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L], (∀ x, ∀ y ∈ LieAlgebra.derivedSeries K L 1, killingForm K L x y = 0) → LieAlgebra.IsSolvable L
  proof: |
    by
      intro K L _ _ _ _ _ h
      exact LieAlgebra.isSolvable_of_killingForm_apply_lie_eq_zero h
- id: lie_ideal_killing_complement
  kind: gap
  level: 4
  topic: Lie環・半単純性
  statement: 体上の有限次元 Lie 環$L$の Killing 形式が非退化なら、任意のイデアル$I$について$L=I\oplus I^\perp$である。
  statement_en: If the Killing form of a finite-dimensional Lie algebra L over a field is nondegenerate, then L is the direct sum of any ideal I and its Killing orthogonal complement.
  assumptions:
  - $K$は体、$L$は有限次元 Lie 環
  - Killing 形式は非退化、$I$はイデアル
  quantifiers:
  - 任意の$I$
  conclusion: $I$と$I^\perp$はイデアルとして補い合う。
  answer: |
    $K$を体、$L$を有限次元 Lie 環で$\kappa$は非退化とし、$I$をイデアルとする。$I^\perp$はイデアルである。$J=I\cap I^\perp$はイデアルである。
    $x,y\in J$、$z\in L$に対し$\kappa([x,y],z)=\kappa(x,[y,z])$である。$y\in I$より$[y,z]\in I$であり、$x\in I^\perp$なので値は$0$である。非退化性より$[x,y]=0$なので$J$は可換イデアルである。可換イデアルの元は$\kappa$の核に入るので、非退化性より$J=0$である。
    $\kappa$は非退化なので$\dim I+\dim I^\perp=\dim L$である。$I\cap I^\perp=0$と合わせて$L=I\oplus I^\perp$である。
  strategy: The intersection is an abelian ideal, hence zero, and dimensions add up.
  sketch:
  - 'derive: J = I intersect I^perp is an ideal.'
  - 'derive: kappa([x,y],z) = kappa(x,[y,z]) = 0 shows J is abelian.'
  - 'derive: Abelian ideals lie in the kernel of kappa, so J = 0.'
  - 'conclude: Dimension count gives L = I + I^perp, direct.'
  openmath: (forall (K L I) (-> (and (field K) (lie_algebra L K) (finite_dimensional L) (killing_nondegenerate L) (lie_ideal I L)) (complementary_lie_ideals I (killing_orthogonal L I) L)))
  hard_negative:
    statement: 任意の有限次元 Lie 環のイデアル$I$について$L=I\oplus I^\perp$である。
    reason: 標数$0$の体上の$\mathfrak{gl}_2$で$I$をスカラー行列全体とすると、$\mathrm{ad}$が$I$で消えるので$I^\perp=L$であり、$I\cap I^\perp=I\neq 0$である。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] [LieAlgebra.IsKilling K L] (I : LieIdeal K L), IsCompl I I.killingCompl
  proof: |
    by
      intro K L _ _ _ _ _ I
      exact LieIdeal.isCompl_killingCompl I
- id: lie_killing_derivations_inner
  kind: textbook
  level: 4
  topic: Lie環・導分
  statement: 体上の有限次元 Lie 環$L$の Killing 形式が非退化なら、$L$の導分はすべて内部導分である。
  statement_en: If the Killing form of a finite-dimensional Lie algebra L over a field is nondegenerate, then every derivation of L is inner.
  assumptions:
  - $K$は体、$L$は有限次元 Lie 環
  - Killing 形式は非退化
  quantifiers:
  - 任意の導分$D$
  conclusion: $D=\mathrm{ad}\,x$となる$x\in L$が存在する。
  answer: |
    $K$を体、$L$を有限次元 Lie 環で$\kappa_L$は非退化とする。$\mathfrak d$を導分全体の Lie 環とする。これは有限次元である。$\mathfrak i=\mathrm{ad}\,L$は$\mathfrak d$のイデアルである。$[D,\mathrm{ad}\,x]=\mathrm{ad}(Dx)$による。$\kappa_L$が非退化なら$Z(L)=0$なので、$\mathrm{ad}\colon L\to\mathfrak i$は同型である。
    イデアルの Killing 形式は全体の制限なので、$\kappa_{\mathfrak d}$の$\mathfrak i$への制限は$\kappa_{\mathfrak i}$であり、同型により$\kappa_L$に対応して非退化である。$\mathfrak i^\perp$を$\kappa_{\mathfrak d}$に関する$\mathfrak i$の直交とする。制限が非退化なので$\mathfrak i\cap\mathfrak i^\perp=0$であり、$\mathfrak d=\mathfrak i\oplus\mathfrak i^\perp$である。
    $D\in\mathfrak i^\perp$とする。$\mathfrak i^\perp$はイデアルなので、$x\in L$について$[D,\mathrm{ad}\,x]\in\mathfrak i\cap\mathfrak i^\perp=0$である。よって$\mathrm{ad}(Dx)=0$であり、$Z(L)=0$より$Dx=0$である。$x$は任意なので$D=0$である。ゆえに$\mathfrak i^\perp=0$であり、$\mathfrak d=\mathfrak i$である。
  strategy: Inner derivations form an ideal with nondegenerate restricted Killing form; its orthogonal complement vanishes.
  sketch:
  - 'setup: ad L is an ideal i of the derivation algebra d, isomorphic to L.'
  - 'derive: The Killing form of d restricts nondegenerately to i.'
  - 'derive: So d = i + i^perp is direct.'
  - 'derive: For D in i^perp, ad(Dx) = [D, ad x] = 0, so Dx = 0.'
  - 'conclude: i^perp = 0 and every derivation is inner.'
  openmath: (forall (K L D) (-> (and (field K) (lie_algebra L K) (finite_dimensional L) (killing_nondegenerate L) (lie_derivation D L)) (exists (x) (and (in x L) (forall (y) (-> (in y L) (= (fn_value D y) (lie_bracket x y))))))))
  hard_negative:
    statement: 体上の有限次元 Lie 環の導分はすべて内部導分である。
    reason: $L=K^2$を可換 Lie 環とすると、$\mathrm{End}(L)$の任意の元が導分だが、内部導分は$0$のみである。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] [LieAlgebra.IsKilling K L] (D : LieDerivation K L L), ∃ x : L, ∀ y : L, D y = ⁅x, y⁆
  proof: |
    by
      intro K L _ _ _ _ _ D
      obtain ⟨x, hx⟩ := LieDerivation.IsKilling.exists_eq_ad (R := K) (L := L) D
      exact ⟨x, fun y => by rw [← hx]; simp⟩
- id: lie_killing_perfect
  kind: gap
  level: 4
  topic: Lie環・半単純性
  statement: 体上の有限次元 Lie 環$L$の Killing 形式が非退化なら、$[L,L]=L$である。
  statement_en: If the Killing form of a finite-dimensional Lie algebra L over a field is nondegenerate, then [L,L] = L.
  assumptions:
  - $K$は体、$L$は有限次元 Lie 環
  - Killing 形式は非退化
  quantifiers:
  - 任意の$L$
  conclusion: $[L,L]=L$である。
  answer: |
    $K$を体、$L$を有限次元 Lie 環で$\kappa$は非退化とする。$D=[L,L]$はイデアルなので、$L=D\oplus D^\perp$である。$D^\perp=0$を示す。
    $x\in D^\perp$をとる。$u,v\in L$に対し$\kappa([x,u],v)=\kappa(x,[u,v])=0$である。$[u,v]\in D$だからである。非退化性より$[x,u]=0$である。よって$x\in Z(L)$である。$Z(L)$は可換イデアルなので$\kappa$の核に入り、非退化性より$Z(L)=0$である。したがって$x=0$であり、$D^\perp=0$である。ゆえに$L=D$である。
  strategy: Show the orthogonal complement of [L,L] lies in the center, which vanishes.
  sketch:
  - 'setup: L = D + D^perp with D = [L,L].'
  - 'derive: kappa([x,u],v) = kappa(x,[u,v]) = 0 for x in D^perp.'
  - 'derive: So D^perp lies in the center.'
  - 'conclude: The center is zero, hence D = L.'
  openmath: (forall (K L) (-> (and (field K) (lie_algebra L K) (finite_dimensional L) (killing_nondegenerate L)) (= (lie_derived_series L 1) L)))
  hard_negative:
    statement: 根基が$0$でなくても$[L,L]=L$であれば Killing 形式は非退化である。
    reason: 標数$0$の体上の$\mathfrak{sl}_2\ltimes K^2$（標準表現との半直積）は$[L,L]=L$を満たすが、$K^2$は可換イデアルで$\kappa$の核に入るので退化している。
  target: |
    ∀ (K : Type*) (L : Type*) [Field K] [LieRing L] [LieAlgebra K L] [FiniteDimensional K L] [LieAlgebra.IsKilling K L], LieAlgebra.derivedSeries K L 1 = ⊤
  proof: |
    by
      intro K L _ _ _ _ _
      have hC := LieIdeal.isCompl_killingCompl (LieAlgebra.derivedSeries K L 1)
      have hbot : (LieAlgebra.derivedSeries K L 1).killingCompl = ⊥ := by
        rw [eq_bot_iff]
        intro x hx
        rw [LieIdeal.mem_killingCompl] at hx
        have hcen : x ∈ LieAlgebra.center K L := by
          rw [LieModule.mem_maxTrivSubmodule]
          intro u
          rw [← lie_skew, neg_eq_zero]
          apply (LieAlgebra.IsKilling.killingForm_nondegenerate K L).1
          intro v
          rw [LieModule.traceForm_apply_lie_apply K L L x u v, LieModule.traceForm_comm]
          refine hx _ ?_
          simp only [LieAlgebra.derivedSeriesOfIdeal_succ, LieAlgebra.derivedSeriesOfIdeal_zero]
          exact LieSubmodule.lie_mem_lie (LieSubmodule.mem_top u) (LieSubmodule.mem_top v)
        rwa [LieAlgebra.center_eq_bot K L] at hcen
      have h := hC.sup_eq_top
      rwa [hbot, sup_bot_eq] at h
- id: lie_h_eigen_shift
  kind: gap
  level: 4
  topic: Lie環・固有値のずれ
  statement: Lie 環$L$の加群$M$で$h,x\in L$、$m\in M$が$[h,x]=ax$、$[h,m]=bm$を満たすなら、$[h,[x,m]]=(a+b)[x,m]$である。
  statement_en: In a module over a Lie algebra, if [h,x] = ax and [h,m] = bm, then [h,[x,m]] = (a+b)[x,m].
  assumptions:
  - $L$は可換環$R$上の Lie 環、$M$は$L$加群
  - $h,x\in L$、$m\in M$、$a,b\in R$、$[h,x]=ax$、$[h,m]=bm$
  quantifiers:
  - 任意の$h,x,m,a,b$
  conclusion: $[h,[x,m]]=(a+b)[x,m]$である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$M$を$L$加群とし、$h,x\in L$、$m\in M$、$a,b\in R$は$[h,x]=ax$、$[h,m]=bm$を満たすとする。加群の公理より
    $[h,[x,m]]=[[h,x],m]+[x,[h,m]]=a[x,m]+b[x,m]=(a+b)[x,m]$
    である。
  strategy: Apply the module Jacobi identity.
  sketch:
  - 'derive: [h,[x,m]] = [[h,x],m] + [x,[h,m]].'
  - 'conclude: Substituting the eigenvalue relations gives (a+b)[x,m].'
  openmath: (forall (Rg L M h x m a b) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_module M L Rg) (in h L) (in x L) (in m M) (in a Rg) (in b Rg) (= (lie_bracket h x) (* a x)) (= (lie_action h m) (* b m))) (= (lie_action h (lie_action x m)) (* (+ a b) (lie_action x m)))))
  hard_negative:
    statement: 同じ仮定の下で$[h,[x,m]]=ab[x,m]$である。
    reason: 標数$0$の体上の$\mathfrak{sl}_2$の随伴加群で$x=e$、$m=h$とすると$a=2$、$b=0$であり、$[h,[e,h]]=[h,-2e]=-4e=2\cdot(-2e)$である。$ab=0$なら$0$となり一致しない。
  target: |
    ∀ (R : Type*) (L : Type*) (M : Type*) [CommRing R] [LieRing L] [LieAlgebra R L] [AddCommGroup M] [Module R M] [LieRingModule L M] [LieModule R L M] (h x : L) (m : M) (a b : R), ⁅h, x⁆ = a • x → ⁅h, m⁆ = b • m → ⁅h, ⁅x, m⁆⁆ = (a + b) • ⁅x, m⁆
  proof: |
    by
      intro R L M _ _ _ _ _ _ _ h x m a b hx hm
      rw [leibniz_lie, hx, hm, smul_lie, lie_smul, add_smul]
- id: lie_sl2_matrix_units_triple
  kind: gap
  level: 4
  topic: Lie環・sl2三つ組
  statement: 可換環$R\neq 0$と有限集合$n$上の行列環で、添字$i\neq j$について$h=E_{ii}-E_{jj}$、$e=E_{ij}$、$f=E_{ji}$は$h\neq 0$、$[e,f]=h$、$[h,e]=2e$、$[h,f]=-2f$を満たす。$n=\{1,2\}$なら標準的な$\mathfrak{sl}_2$の三つ組である。
  statement_en: In the matrix ring over a nonzero commutative ring, for indices i different from j, the elements h = E_ii - E_jj, e = E_ij, f = E_ji satisfy h nonzero, [e,f] = h, [h,e] = 2e and [h,f] = -2f. For two indices this is the standard sl_2 triple.
  assumptions:
  - $R\neq 0$は可換環、$n$は有限集合
  - $i,j\in n$、$i\neq j$
  quantifiers:
  - 任意の$i\neq j$
  conclusion: $(E_{ii}-E_{jj},E_{ij},E_{ji})$は$\mathfrak{sl}_2$三つ組である。
  answer: |
    $R\neq 0$を可換環、$n$を有限集合、$i\neq j$を$n$の元とする。行列単位は$E_{ab}E_{cd}=\delta_{bc}E_{ad}$を満たす。$h$の$(i,i)$成分は$1$なので$h\neq 0$である。
    $[e,f]=E_{ij}E_{ji}-E_{ji}E_{ij}=E_{ii}-E_{jj}=h$である。
    $he=(E_{ii}-E_{jj})E_{ij}=E_{ij}$、$eh=E_{ij}(E_{ii}-E_{jj})=-E_{ij}$なので$[h,e]=2e$である。
    $hf=(E_{ii}-E_{jj})E_{ji}=-E_{ji}$、$fh=E_{ji}(E_{ii}-E_{jj})=E_{ji}$なので$[h,f]=-2f$である。
  strategy: Compute with the multiplication rule of matrix units.
  sketch:
  - 'derive: The (i,i) entry of h is 1, so h is nonzero.'
  - 'derive: [e,f] = E_ii - E_jj.'
  - 'derive: he = e, eh = -e, hf = -f and fh = f.'
  - 'conclude: The sl_2 relations hold.'
  openmath: (forall (Rg n i j) (-> (and (comm_ring Rg) (finite_set n) (in i n) (in j n) (!= i j)) (sl2_triple (- (matrix_unit i i 1) (matrix_unit j j 1)) (matrix_unit i j 1) (matrix_unit j i 1))))
  hard_negative:
    statement: $i=j$でも$(E_{ii}-E_{jj},E_{ij},E_{ji})$は$\mathfrak{sl}_2$三つ組である。
    reason: $i=j$なら$h=0$となり、三つ組の条件$h\neq 0$に反する。
  target: |
    ∀ (R : Type*) (n : Type*) [CommRing R] [Nontrivial R] [Fintype n] [DecidableEq n] (i j : n), i ≠ j → (letI : LieRing (Matrix n n R) := LieRing.ofAssociativeRing; IsSl2Triple (Matrix.single i i (1 : R) - Matrix.single j j 1) (Matrix.single i j 1) (Matrix.single j i 1))
  proof: |
    by
      intro R n _ _ _ _ i j hij
      letI : LieRing (Matrix n n R) := LieRing.ofAssociativeRing
      have hji : j ≠ i := hij.symm
      refine ⟨?_, ?_, ?_, ?_⟩
      · intro h
        have := congrFun (congrFun h i) i
        simp [Matrix.single, hji] at this
      · rw [LieRing.of_associative_ring_bracket, Matrix.single_mul_single_same, Matrix.single_mul_single_same, one_mul]
      · rw [LieRing.of_associative_ring_bracket, sub_mul, mul_sub, Matrix.single_mul_single_same, Matrix.single_mul_single_of_ne _ _ _ _ hji _, Matrix.single_mul_single_of_ne _ _ _ _ hji _, Matrix.single_mul_single_same]
        simp [two_smul]
      · rw [LieRing.of_associative_ring_bracket, sub_mul, mul_sub, Matrix.single_mul_single_of_ne _ _ _ _ hij _, Matrix.single_mul_single_same, Matrix.single_mul_single_same, Matrix.single_mul_single_of_ne _ _ _ _ hij _]
        simp [two_smul]
        abel
- id: lie_sl2_primitive_h_on_f_power
  kind: gap
  level: 4
  topic: Lie環・sl2の表現
  statement: $\mathfrak{sl}_2$三つ組$(h,e,f)$と加群の原始ベクトル$m$（$m\neq 0$、$hm=\mu m$、$em=0$）について、$h(f^nm)=(\mu-2n)f^nm$である。
  statement_en: For an sl_2 triple (h,e,f) and a primitive vector m of a module, meaning m nonzero, hm = mu m and em = 0, one has h(f^n m) = (mu - 2n) f^n m.
  assumptions:
  - $L$は可換環$R$上の Lie 環、$M$は$L$加群
  - $(h,e,f)$は$\mathfrak{sl}_2$三つ組、$m$は固有値$\mu$の原始ベクトル
  quantifiers:
  - 任意の$n\geq 0$
  conclusion: $h(f^nm)=(\mu-2n)f^nm$である。
  answer: |
    $R$を可換環、$L$を$R$上の Lie 環、$M$を$L$加群、$(h,e,f)$を$\mathfrak{sl}_2$三つ組、$m$を固有値$\mu$の原始ベクトルとする。$n$の帰納法で示す。$n=0$は$hm=\mu m$である。
    $n$で成り立つとする。$[h,f]=-2f$と加群の公理より
    $h(f^{n+1}m)=[h,f](f^nm)+f(h(f^nm))=-2f^{n+1}m+(\mu-2n)f^{n+1}m=(\mu-2(n+1))f^{n+1}m$
    である。
  strategy: Induct on n using [h,f] = -2f.
  sketch:
  - 'derive: The case n = 0 is hm = mu m.'
  - 'induction: h f^(n+1) m = [h,f] f^n m + f h f^n m.'
  - 'conclude: The eigenvalue decreases by 2 at each step.'
  openmath: (forall (Rg L M h e f m c n) (-> (and (comm_ring Rg) (lie_algebra L Rg) (lie_module M L Rg) (sl2_triple h e f) (sl2_primitive_vector h e f m c) (in n N)) (= (lie_action h (fn_value (map_power (lie_action_op f M) n) m)) (* (- c (* 2 n)) (fn_value (map_power (lie_action_op f M) n) m)))))
  hard_negative:
    statement: $h(f^nm)=(\mu+2n)f^nm$である。
    reason: 標数$0$の体$K$上の$\mathfrak{sl}_2$の標準表現$M=K^2$で、$m=e_1$、$\mu=1$、$n=1$とすると$fm=e_2$で$he_2=-e_2=(1-2)e_2$である。$1+2=3$ではない。
  target: |
