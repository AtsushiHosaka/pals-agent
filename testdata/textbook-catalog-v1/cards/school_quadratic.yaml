  - $a\neq 0$
  - $ar^2+br+c=0$
  quantifiers:
  - 任意の実数$a,b,c,r$
  - 任意の実数$x$
  conclusion: 任意の$x$で$ax^2+bx+c=a(x-r)\left(x+\frac{b}{a}+r\right)$であり、$ax^2+bx+c=0$の解は$x=r$と$x=-\frac{b}{a}-r$だけである。
  answer: |
    $a,b,c,r$を実数とし、$a\neq 0$、$ar^2+br+c=0$とする。$c=-ar^2-br$を代入すると、$ax^2+bx+c=a(x^2-r^2)+b(x-r)=(x-r)\{a(x+r)+b\}$である。$a\neq 0$なので$a(x+r)+b=a\left(x+r+\frac{b}{a}\right)$と書ける。したがって$ax^2+bx+c=a(x-r)\left(x-\left(-\frac{b}{a}-r\right)\right)$となる。$a\neq 0$なので、$ax^2+bx+c=0$の解は$x=r$と$x=-\frac{b}{a}-r$だけである。
  strategy: Eliminate c using the root equation and factor out x − r.
  sketch:
  - 'derive: From the root equation, c = −a r² − b r.'
  - 'derive: Substituting gives (x − r)(a(x + r) + b).'
  - 'derive: Factor out a to get a (x − r)(x − (−b/a − r)).'
  - 'conclude: Since a ≠ 0, the solutions are exactly r and −b/a − r.'
  openmath: (forall (a b c r x) (-> (and (!= a 0) (= (+ (* a (^ r 2)) (* b r) c) 0)) (and (= (+ (* a (^ x 2)) (* b x) c) (* a (- x r) (- x (- (/ (neg b) a) r)))) (<-> (= (+ (* a (^ x 2)) (* b x) c) 0) (or (= x r) (= x (- (/ (neg b) a) r)))))))
  hard_negative:
    statement: $a\neq 0$で$r$が解なら、もう一方の解は$\frac{c}{a}-r$である。
    reason: 和の関係と積の関係を混同している。$x^2-3x+2=0$で$r=1$とすると、$\frac{c}{a}-r=1$だが、もう一方の解は$2$である。
  target: |
    ∀ (a b c r : ℝ), a ≠ 0 → a * r ^ 2 + b * r + c = 0 → (∀ x : ℝ, a * x ^ 2 + b * x + c = a * (x - r) * (x - (-b / a - r))) ∧ (∀ x : ℝ, a * x ^ 2 + b * x + c = 0 ↔ x = r ∨ x = -b / a - r)
  proof: |
    by
      intro a b c r ha h
      have key : ∀ x : ℝ, a * x ^ 2 + b * x + c = a * (x - r) * (x - (-b / a - r)) := by
        intro x
        have hc : c = -a * r ^ 2 - b * r := by linarith
        subst hc
        field_simp
        ring
      refine ⟨key, fun x => ?_⟩
      rw [key x]
      simp [ha, sub_eq_zero]
- id: real_root_iff_discriminant_nonneg
  kind: textbook
  level: high
  topic: 二次方程式・判別式
  statement: $a\neq 0$のとき、$ax^2+bx+c=0$が実数解をもつことは、$b^2-4ac\geq 0$と同値である。
  statement_en: For a ≠ 0, the equation a x² + b x + c = 0 has a real solution if and only if b² − 4ac ≥ 0.
  assumptions:
  - $a,b,c$は実数
  - $a\neq 0$
  quantifiers:
  - 任意の実数$a,b,c$
  conclusion: 実数解の存在と$b^2-4ac\geq 0$は同値である。
  answer: |
    $a,b,c$を実数とし、$a\neq 0$とする。任意の実数$x$について、$4a(ax^2+bx+c)=(2ax+b)^2-(b^2-4ac)$である。
    実数解$x$があれば、この式から$b^2-4ac=(2ax+b)^2\geq 0$である。
    逆に$b^2-4ac\geq 0$とし、$s=\sqrt{b^2-4ac}$、$x=\frac{-b+s}{2a}$とおく。$2ax+b=s$なので$4a(ax^2+bx+c)=s^2-(b^2-4ac)=0$である。$4a\neq 0$より$ax^2+bx+c=0$となる。
  strategy: Use the identity 4a f(x) = (2ax+b)² − D in both directions.
  sketch:
  - 'derive: For every x, 4a(a x² + b x + c) = (2ax + b)² − (b² − 4ac).'
  - 'derive: A real root gives b² − 4ac = (2ax + b)² ≥ 0.'
  - 'construct: If the discriminant is nonnegative, set x = (−b + √(b²−4ac))/(2a).'
  - 'conclude: Then 2ax + b = √(b²−4ac), so x is a root because 4a ≠ 0.'
  openmath: (forall (a b c) (-> (!= a 0) (<-> (exists (x) (= (+ (* a (^ x 2)) (* b x) c) 0)) (>= (- (^ b 2) (* 4 a c)) 0))))
  hard_negative:
    statement: $a\neq 0$のとき、$ax^2+bx+c=0$が実数解をもつことは、$b^2-4ac>0$と同値である。
    reason: 重解の場合を落としている。$x^2=0$は実数解をもつが、判別式は$0$である。
  target: |
    ∀ (a b c : ℝ), a ≠ 0 → ((∃ x : ℝ, a * x ^ 2 + b * x + c = 0) ↔ 0 ≤ b ^ 2 - 4 * a * c)
  proof: |
    by
      intro a b c ha
      constructor
      · rintro ⟨x, hx⟩
        have h : b ^ 2 - 4 * a * c = (2 * a * x + b) ^ 2 := by linear_combination (-4 * a) * hx
        rw [h]
        exact sq_nonneg _
      · intro hD
        have hs := Real.sq_sqrt hD
        generalize Real.sqrt (b ^ 2 - 4 * a * c) = s at hs
        refine ⟨(-b + s) / (2 * a), ?_⟩
        have hx : 2 * a * ((-b + s) / (2 * a)) = -b + s := by field_simp
        generalize (-b + s) / (2 * a) = x at hx ⊢
        have h1 : (4 * a) * (a * x ^ 2 + b * x + c) = 0 := by
          linear_combination (2 * a * x + b + s) * hx + hs
        exact (mul_eq_zero.1 h1).resolve_left (mul_ne_zero (by norm_num) ha)
