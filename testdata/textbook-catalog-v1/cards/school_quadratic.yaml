- id: quadratic_range_convex
  kind: textbook
  level: high
  topic: 二次関数・頂点と軸
  statement: $a>0$のとき、$ax^2+bx+c$が$x$の実数全体でとる値の全体は、$\frac{4ac-b^2}{4a}$以上の実数全体である。
  statement_en: For a > 0, the set of values of a x² + b x + c over real x equals the closed ray [(4ac − b²)/(4a), ∞).
  assumptions:
  - $a,b,c$は実数
  - $a>0$
  quantifiers:
  - 任意の実数$a,b,c,y$
  conclusion: $y$が$ax^2+bx+c$の値であることと、$y\geq\frac{4ac-b^2}{4a}$であることは同値である。
  answer: |
    $a,b,c$を実数とし、$a>0$とする。$m=\frac{4ac-b^2}{4a}$とおくと、平方完成により$ax^2+bx+c=a\left(x+\frac{b}{2a}\right)^2+m$である。$a>0$より、とる値はすべて$m$以上である。
    逆に$y\geq m$とする。$\frac{y-m}{a}\geq 0$なので、$s=\sqrt{\frac{y-m}{a}}$とおける。$x=-\frac{b}{2a}+s$を代入すると、値は$as^2+m=(y-m)+m=y$となる。したがって$y$は値としてとられる。
  strategy: Use the vertex form for the lower bound and solve for x with a square root for surjectivity.
  sketch:
  - 'setup: Put m = (4ac − b²)/(4a) and write the quadratic as a (x + b/(2a))² + m.'
  - 'derive: Since a > 0, every value is at least m.'
  - 'construct: For y ≥ m set s = √((y − m)/a) and x = −b/(2a) + s.'
  - 'derive: Then the value at x is a s² + m = y.'
  - 'conclude: The range is exactly [m, ∞).'
  openmath: (forall (a b c y) (-> (> a 0) (<-> (exists (x) (= (+ (* a (^ x 2)) (* b x) c) y)) (>= y (/ (- (* 4 a c) (^ b 2)) (* 4 a))))))
  hard_negative:
    statement: $a\neq 0$であれば、値の全体は$\frac{4ac-b^2}{4a}$以上の実数全体である。
    reason: $a<0$では値の全体は$\frac{4ac-b^2}{4a}$以下の実数全体になり、向きが逆になる。
  target: |
    ∀ (a b c : ℝ), 0 < a → Set.range (fun x : ℝ => a * x ^ 2 + b * x + c) = Set.Ici ((4 * a * c - b ^ 2) / (4 * a))
  proof: |
    by
      intro a b c ha
      have ha' : a ≠ 0 := ha.ne'
      have key : ∀ x : ℝ, a * x ^ 2 + b * x + c = a * (x + b / (2 * a)) ^ 2 + (4 * a * c - b ^ 2) / (4 * a) := by
        intro x
        field_simp
        ring
      ext y
      simp only [Set.mem_range, Set.mem_Ici]
      constructor
      · rintro ⟨x, rfl⟩
        have := mul_nonneg ha.le (sq_nonneg (x + b / (2 * a)))
        rw [key x]
        linarith
      · intro hy
        have hnn : 0 ≤ (y - (4 * a * c - b ^ 2) / (4 * a)) / a := div_nonneg (by linarith) ha.le
        have hs := Real.sq_sqrt hnn
        refine ⟨-(b / (2 * a)) + Real.sqrt ((y - (4 * a * c - b ^ 2) / (4 * a)) / a), ?_⟩
        rw [key]
        have e : -(b / (2 * a)) + Real.sqrt ((y - (4 * a * c - b ^ 2) / (4 * a)) / a) + b / (2 * a) = Real.sqrt ((y - (4 * a * c - b ^ 2) / (4 * a)) / a) := by ring
        rw [e, hs]
        field_simp
        ring
- id: symmetric_about_line_iff_axis
  kind: gap
  level: high
  topic: 二次関数・頂点と軸
  statement: $a\neq 0$とし、$f(x)=ax^2+bx+c$とする。$y=f(x)$のグラフが直線$x=k$に関して対称であることは、$k=-\frac{b}{2a}$と同値である。対称であることは、任意の$t$で$f(k+t)=f(k-t)$が成り立つことで表す。
  statement_en: 'For a ≠ 0 and f(x) = a x² + b x + c: f(k + t) = f(k − t) for all real t if and only if k = −b/(2a).'
  assumptions:
  - $a,b,c,k$は実数
  - $a\neq 0$
  - $f(x)=ax^2+bx+c$
  quantifiers:
  - 任意の実数$a,b,c,k$
  - 対称性の条件では任意の実数$t$
  conclusion: 任意の$t$で$f(k+t)=f(k-t)$となることと、$k=-\frac{b}{2a}$は同値である。
  answer: |
    $a,b,c,k$を実数とし、$a\neq 0$、$f(x)=ax^2+bx+c$とする。展開すると、任意の$t$について$f(k+t)-f(k-t)=2t(2ak+b)$である。
    任意の$t$で$f(k+t)=f(k-t)$ならば、$t=1$として$2ak+b=0$を得る。$a\neq 0$より$k=-\frac{b}{2a}$である。逆に$k=-\frac{b}{2a}$ならば$2ak+b=0$なので、差は任意の$t$で$0$となる。
  strategy: Compute f(k+t) − f(k−t) = 2t(2ak+b) and read off the condition.
  sketch:
  - 'derive: Expand to f(k+t) − f(k−t) = 2t(2ak + b).'
  - 'apply_theorem: Taking t = 1 forces 2ak + b = 0.'
  - 'derive: Since a ≠ 0, this gives k = −b/(2a).'
  - 'conclude: Conversely k = −b/(2a) makes the difference vanish for every t.'
  openmath: (forall (a b c k) (-> (!= a 0) (<-> (forall (t) (= (+ (* a (^ (+ k t) 2)) (* b (+ k t)) c) (+ (* a (^ (- k t) 2)) (* b (- k t)) c))) (= k (/ (neg b) (* 2 a))))))
  hard_negative:
    statement: ある実数$t$で$f(k+t)=f(k-t)$となれば、$k=-\frac{b}{2a}$である。
    reason: $t=0$では等式がつねに成り立つので、$k$について何も言えない。「任意の$t$で」という条件は外せない。
  target: |
    ∀ (a b c k : ℝ), a ≠ 0 → ((∀ t : ℝ, a * (k + t) ^ 2 + b * (k + t) + c = a * (k - t) ^ 2 + b * (k - t) + c) ↔ k = -b / (2 * a))
  proof: |
    by
      intro a b c k ha
      constructor
      · intro h
        have h1 := h 1
        rw [eq_div_iff (mul_ne_zero two_ne_zero ha)]
        linear_combination (1 / 2) * h1
      · intro hk t
        have h2 : 2 * a * k + b = 0 := by
          rw [hk]
          field_simp
          ring
        linear_combination (2 * t) * h2
- id: equal_values_midpoint_on_axis
  kind: gap
  level: high
  topic: 二次関数・頂点と軸
  statement: $a\neq 0$、$p\neq q$のとき、$ax^2+bx+c$の$x=p$と$x=q$での値が等しければ、$p,q$の中点は軸上にある。すなわち$\frac{p+q}{2}=-\frac{b}{2a}$である。
  statement_en: If a ≠ 0, p ≠ q and a p² + b p + c = a q² + b q + c, then (p + q)/2 = −b/(2a).
  assumptions:
  - $a,b,c,p,q$は実数
  - $a\neq 0$
  - $p\neq q$
  - $ap^2+bp+c=aq^2+bq+c$
  quantifiers:
  - 任意の実数$a,b,c,p,q$
  conclusion: $\frac{p+q}{2}=-\frac{b}{2a}$である。
  answer: |
    $a,b,c,p,q$を実数とし、$a\neq 0$、$p\neq q$、$ap^2+bp+c=aq^2+bq+c$とする。移項して因数分解すると$(p-q)\{a(p+q)+b\}=0$である。$p\neq q$より$a(p+q)+b=0$となる。両辺を$2a$で割ると$\frac{p+q}{2}=-\frac{b}{2a}$を得る。
  strategy: Factor the difference of the two values and cancel p − q.
  sketch:
  - 'derive: Rearrange the equal values to (p − q)(a(p + q) + b) = 0.'
  - 'derive: Cancel p − q ≠ 0 to get a(p + q) + b = 0.'
  - 'conclude: Divide by 2a to get (p + q)/2 = −b/(2a).'
  openmath: (forall (a b c p q) (-> (and (!= a 0) (!= p q) (= (+ (* a (^ p 2)) (* b p) c) (+ (* a (^ q 2)) (* b q) c))) (= (/ (+ p q) 2) (/ (neg b) (* 2 a)))))
  hard_negative:
    statement: $a\neq 0$で$x=p$と$x=q$の値が等しければ、$p=q$の場合も含めて$\frac{p+q}{2}=-\frac{b}{2a}$である。
    reason: $p=q$なら値は当然等しく、$p$は任意である。たとえば$a=1,\ b=0,\ c=0,\ p=q=1$で$\frac{p+q}{2}=1\neq 0$なので、$p\neq q$は外せない。
  target: |
    ∀ (a b c p q : ℝ), a ≠ 0 → p ≠ q → a * p ^ 2 + b * p + c = a * q ^ 2 + b * q + c → (p + q) / 2 = -b / (2 * a)
  proof: |
    by
      intro a b c p q ha hpq h
      have h1 : (p - q) * (a * (p + q) + b) = (p - q) * 0 := by linear_combination h
      have h2 : a * (p + q) + b = 0 := mul_left_cancel₀ (sub_ne_zero.2 hpq) h1
      field_simp
      linear_combination h2
- id: quadratic_monotone_each_side_of_axis
  kind: textbook
  level: high
  topic: 二次関数・頂点と軸
  statement: $a>0$のとき、$ax^2+bx+c$は$x\geq-\frac{b}{2a}$で狭義単調増加し、$x\leq-\frac{b}{2a}$で狭義単調減少する。
  statement_en: For a > 0, x ↦ a x² + b x + c is strictly increasing on [−b/(2a), ∞) and strictly decreasing on (−∞, −b/(2a)].
  assumptions:
  - $a,b,c$は実数
  - $a>0$
  quantifiers:
  - 任意の実数$a,b,c$
  - 区間内の任意の実数$p<q$
  conclusion: 軸の右側で狭義単調増加、左側で狭義単調減少である。
  answer: |
    $a,b,c$を実数とし、$a>0$、$f(x)=ax^2+bx+c$、$v=-\frac{b}{2a}$とする。$b=-2av$なので、$p<q$に対して$f(q)-f(p)=a(q-p)(p+q-2v)$である。
    $v\leq p<q$ならば$p+q-2v=(p-v)+(q-v)>0$なので、$f(p)<f(q)$となる。$p<q\leq v$ならば$p+q-2v<0$なので、$f(p)>f(q)$となる。
  strategy: Factor f(q) − f(p) using b = −2av and determine the sign on each side.
  sketch:
  - 'setup: Put v = −b/(2a), so b = −2av.'
  - 'derive: For p < q, f(q) − f(p) = a(q − p)(p + q − 2v).'
  - 'case_split: If v ≤ p < q then p + q − 2v > 0, so f(p) < f(q).'
  - 'case_split: If p < q ≤ v then p + q − 2v < 0, so f(p) > f(q).'
  - 'conclude: f is strictly monotone on each side of the axis.'
  openmath: (forall (a b c p q) (-> (and (> a 0) (< p q)) (and (-> (<= (/ (neg b) (* 2 a)) p) (< (+ (* a (^ p 2)) (* b p) c) (+ (* a (^ q 2)) (* b q) c))) (-> (<= q (/ (neg b) (* 2 a))) (> (+ (* a (^ p 2)) (* b p) c) (+ (* a (^ q 2)) (* b q) c))))))
  hard_negative:
    statement: $a>0$のとき、$ax^2+bx+c$は$x\geq 0$で狭義単調増加する。
    reason: 単調性の境目は原点ではなく軸である。$a=1,\ b=-2,\ c=0$なら$x=\frac{1}{2}$での値は$x=0$での値より小さい。
  target: |
    ∀ (a b c : ℝ), 0 < a → StrictMonoOn (fun x : ℝ => a * x ^ 2 + b * x + c) (Set.Ici (-b / (2 * a))) ∧ StrictAntiOn (fun x : ℝ => a * x ^ 2 + b * x + c) (Set.Iic (-b / (2 * a)))
  proof: |
    by
      intro a b c ha
      have hb : b = -2 * a * (-b / (2 * a)) := by
        field_simp
      generalize -b / (2 * a) = v at hb ⊢
      subst hb
      constructor
      · intro p hp q _ hpq
        simp only [Set.mem_Ici] at hp
        have h := mul_pos ha (mul_pos (sub_pos.2 hpq) (by linarith : 0 < p + q - 2 * v))
        show a * p ^ 2 + -2 * a * v * p + c < a * q ^ 2 + -2 * a * v * q + c
        nlinarith
      · intro p _ q hq hpq
        simp only [Set.mem_Iic] at hq
        have h := mul_pos ha (mul_pos (sub_pos.2 hpq) (by linarith : 0 < 2 * v - p - q))
        show a * q ^ 2 + -2 * a * v * q + c < a * p ^ 2 + -2 * a * v * p + c
        nlinarith
- id: quadratic_coefficients_unique
  kind: gap
  level: high
  topic: 二次関数・恒等式
  statement: 2次式に限った形（一般の次数の係数比較は別カード）として、すべての実数$x$で$ax^2+bx+c=dx^2+ex+f$が成り立つならば、$a=d,\ b=e,\ c=f$である。
  statement_en: 'Degree-2 special form of coefficient comparison: if a x² + b x + c = d x² + e x + f for every real x, then a = d, b = e and c = f.'
  assumptions:
  - $a,b,c,d,e,f$は実数
  - すべての実数$x$で$ax^2+bx+c=dx^2+ex+f$
  quantifiers:
  - 任意の実数$a,b,c,d,e,f$
  conclusion: $a=d$、$b=e$、$c=f$である。
  answer: |
    $a,b,c,d,e,f$を実数とし、すべての実数$x$で$ax^2+bx+c=dx^2+ex+f$とする。$x=0$を代入すると$c=f$である。$x=1$と$x=-1$を代入すると$a+b+c=d+e+f$と$a-b+c=d-e+f$を得る。この2式の差から$b=e$、和と$c=f$から$a=d$が従う。
  strategy: Substitute x = 0, 1, −1 and solve the resulting linear system.
  sketch:
  - 'apply_theorem: Substitute x = 0 to obtain c = f.'
  - 'apply_theorem: Substitute x = 1 and x = −1.'
  - 'derive: The difference gives b = e and the sum with c = f gives a = d.'
  - 'conclude: All three coefficients agree.'
  openmath: (forall (a b c d e f) (-> (forall (x) (= (+ (* a (^ x 2)) (* b x) c) (+ (* d (^ x 2)) (* e x) f))) (and (= a d) (= b e) (= c f))))
  hard_negative:
    statement: ある$x$で$ax^2+bx+c=dx^2+ex+f$となれば、$a=d,\ b=e,\ c=f$である。
    reason: 1点で値が等しいだけでは足りない。$x^2$と$x$は$x=1$で等しいが、係数は異なる。
  target: |
    ∀ (a b c d e f : ℝ), (∀ x : ℝ, a * x ^ 2 + b * x + c = d * x ^ 2 + e * x + f) → a = d ∧ b = e ∧ c = f
  proof: |
    by
      intro a b c d e f h
      have h0 := h 0
      have h1 := h 1
      have h2 := h (-1)
      refine ⟨?_, ?_, ?_⟩
      · linear_combination (1 / 2) * h1 + (1 / 2) * h2 - h0
      · linear_combination (1 / 2) * h1 - (1 / 2) * h2
      · linear_combination h0
- id: vertex_form_coefficients
  kind: gap
  level: high
  topic: 二次関数・頂点と軸
  statement: すべての実数$x$で$ax^2+bx+c=a(x-p)^2+q$が成り立つことは、$b=-2ap$かつ$c=ap^2+q$と同値である。
  statement_en: The identity a x² + b x + c = a (x − p)² + q holds for all real x if and only if b = −2ap and c = a p² + q.
  assumptions:
  - $a,b,c,p,q$は実数
  quantifiers:
  - 任意の実数$a,b,c,p,q$
  conclusion: 恒等式の成立と、$b=-2ap$かつ$c=ap^2+q$は同値である。
  answer: |
    $a,b,c,p,q$を実数とする。恒等式が成り立つとする。$x=0$を代入すると$c=ap^2+q$である。$x=1$を代入すると$a+b+c=a(1-p)^2+q=a-2ap+ap^2+q$となり、$c=ap^2+q$と合わせて$b=-2ap$を得る。
    逆に$b=-2ap$、$c=ap^2+q$ならば、$ax^2+bx+c=ax^2-2apx+ap^2+q=a(x-p)^2+q$である。
  strategy: Substitute two values of x for the forward direction and expand for the converse.
  sketch:
  - 'apply_theorem: Substitute x = 0 to get c = a p² + q.'
  - 'apply_theorem: Substitute x = 1 and use the previous equality to get b = −2ap.'
  - 'derive: Conversely, substitute the formulas for b and c into the left side.'
  - 'conclude: Expanding a (x − p)² + q gives the identity.'
  openmath: (forall (a b c p q) (<-> (forall (x) (= (+ (* a (^ x 2)) (* b x) c) (+ (* a (^ (- x p) 2)) q))) (and (= b (* (neg 2) a p)) (= c (+ (* a (^ p 2)) q)))))
  hard_negative:
    statement: 恒等式が成り立つならば$p=\frac{b}{2a}$である。
    reason: 符号が逆である。正しくは$b=-2ap$なので、$a\neq 0$のとき$p=-\frac{b}{2a}$となる。
  target: |
    ∀ (a b c p q : ℝ), (∀ x : ℝ, a * x ^ 2 + b * x + c = a * (x - p) ^ 2 + q) ↔ b = -2 * a * p ∧ c = a * p ^ 2 + q
  proof: |
    by
      intro a b c p q
      constructor
      · intro h
        have h0 := h 0
        have h1 := h 1
        constructor
        · linear_combination h1 - h0
        · linear_combination h0
      · rintro ⟨rfl, rfl⟩ x
        ring
- id: convex_quadratic_min_on_interval_cases
  kind: textbook
  level: high
  topic: 二次関数・定義域つきの最大最小
  statement: $a>0$、$s\leq t$とし、$v=-\frac{b}{2a}$とする。区間$[s,t]$上の$ax^2+bx+c$の最小値は、$v<s$なら$x=s$で、$s\leq v\leq t$なら$x=v$で、$t<v$なら$x=t$でとる。
  statement_en: Let a > 0, s ≤ t, v = −b/(2a) and f(x) = a x² + b x + c. On [s, t], f is minimized at s if v < s, at v if s ≤ v ≤ t, and at t if t < v.
  assumptions:
  - $a,b,c,s,t$は実数
  - $a>0$
  - $s\leq t$
  quantifiers:
  - 任意の実数$a,b,c,s,t$
  - $[s,t]$内の任意の$x$
  conclusion: 軸の位置で分けた3つの場合のそれぞれで、示した点が$[s,t]$上の最小値を与える。
  answer: |
    $a,b,c,s,t$を実数とし、$a>0$、$s\leq t$、$f(x)=ax^2+bx+c$、$v=-\frac{b}{2a}$とする。$b=-2av$なので、任意の$x,u$について$f(x)-f(u)=a(x-u)(x+u-2v)$である。$x\in[s,t]$をとる。
    $v<s$のとき、$x-s\geq 0$かつ$x+s-2v>0$なので$f(x)\geq f(s)$である。
    $s\leq v\leq t$のとき、$f(x)-f(v)=a(x-v)^2\geq 0$である。
    $t<v$のとき、$x-t\leq 0$かつ$x+t-2v<0$なので$f(x)\geq f(t)$である。
  strategy: Factor f(x) − f(u) with b = −2av and determine its sign in each of the three axis positions.
  sketch:
  - 'setup: Put v = −b/(2a), so that f(x) − f(u) = a(x − u)(x + u − 2v).'
  - 'case_split: If v < s then x − s ≥ 0 and x + s − 2v > 0, so f(s) ≤ f(x).'
  - 'case_split: If s ≤ v ≤ t then f(x) − f(v) = a (x − v)² ≥ 0.'
  - 'case_split: If t < v then x − t ≤ 0 and x + t − 2v < 0, so f(t) ≤ f(x).'
  - 'conclude: The minimum point is as claimed in each case.'
  openmath: (forall (a b c s t x) (-> (and (> a 0) (<= s t) (<= s x) (<= x t)) (and (-> (< (/ (neg b) (* 2 a)) s) (<= (+ (* a (^ s 2)) (* b s) c) (+ (* a (^ x 2)) (* b x) c))) (-> (and (<= s (/ (neg b) (* 2 a))) (<= (/ (neg b) (* 2 a)) t)) (<= (+ (* a (^ (/ (neg b) (* 2 a)) 2)) (* b (/ (neg b) (* 2 a))) c) (+ (* a (^ x 2)) (* b x) c))) (-> (< t (/ (neg b) (* 2 a))) (<= (+ (* a (^ t 2)) (* b t) c) (+ (* a (^ x 2)) (* b x) c))))))
  hard_negative:
    statement: $a>0$なら、区間$[s,t]$上の最小値はつねに$x=-\frac{b}{2a}$でとる。
    reason: 軸が区間の外にあるときは成り立たない。$a=1,\ b=c=0,\ [s,t]=[1,2]$では軸は$x=0$で区間外にあり、最小値は$x=1$でとる。
  target: |
    ∀ (a b c s t : ℝ), 0 < a → s ≤ t → (-b / (2 * a) < s → ∀ x : ℝ, s ≤ x → x ≤ t → a * s ^ 2 + b * s + c ≤ a * x ^ 2 + b * x + c) ∧ (s ≤ -b / (2 * a) → -b / (2 * a) ≤ t → ∀ x : ℝ, s ≤ x → x ≤ t → a * (-b / (2 * a)) ^ 2 + b * (-b / (2 * a)) + c ≤ a * x ^ 2 + b * x + c) ∧ (t < -b / (2 * a) → ∀ x : ℝ, s ≤ x → x ≤ t → a * t ^ 2 + b * t + c ≤ a * x ^ 2 + b * x + c)
  proof: |
    by
      intro a b c s t ha _
      have hb : b = -2 * a * (-b / (2 * a)) := by
        field_simp
      generalize -b / (2 * a) = v at hb ⊢
      subst hb
      refine ⟨?_, ?_, ?_⟩
      · intro hv x hsx _
        have h := mul_nonneg ha.le (mul_nonneg (sub_nonneg.2 hsx) (by linarith : 0 ≤ x + s - 2 * v))
        nlinarith
      · intro _ _ x _ _
        have h := mul_nonneg ha.le (sq_nonneg (x - v))
        nlinarith
      · intro hv x _ hxt
        have h := mul_nonneg ha.le (mul_nonneg (sub_nonneg.2 hxt) (by linarith : 0 ≤ 2 * v - x - t))
        nlinarith
- id: convex_quadratic_max_at_farther_endpoint
  kind: gap
  level: high
  topic: 二次関数・定義域つきの最大最小
  statement: $a>0$のとき、区間$[s,t]$上の$ax^2+bx+c$の最大値は、軸から遠い端点でとる。すなわち$\frac{s+t}{2}\leq-\frac{b}{2a}$なら$x=s$で、$-\frac{b}{2a}\leq\frac{s+t}{2}$なら$x=t$でとる。
  statement_en: 'For a > 0 and x in [s, t], with f(x) = a x² + b x + c: if (s+t)/2 ≤ −b/(2a) then f(x) ≤ f(s), and if −b/(2a) ≤ (s+t)/2 then f(x) ≤ f(t).'
  assumptions:
  - $a,b,c,s,t,x$は実数
  - $a>0$
  - $s\leq x\leq t$
  quantifiers:
  - 任意の実数$a,b,c,s,t,x$
  conclusion: 軸が区間の中点以上なら$f(x)\leq f(s)$、中点以下なら$f(x)\leq f(t)$である。
  answer: |
    $a,b,c,s,t,x$を実数とし、$a>0$、$s\leq x\leq t$、$f(x)=ax^2+bx+c$、$v=-\frac{b}{2a}$とする。$b=-2av$なので、$f(s)-f(x)=a(x-s)(2v-s-x)$である。
    $\frac{s+t}{2}\leq v$のとき、$2v-s-x\geq t-x\geq 0$なので$f(x)\leq f(s)$である。
    同様に$f(t)-f(x)=a(t-x)(t+x-2v)$である。$v\leq\frac{s+t}{2}$のとき、$t+x-2v\geq x-s\geq 0$なので$f(x)\leq f(t)$である。
  strategy: Compare f(x) with the endpoint value by factoring with b = −2av.
  sketch:
  - 'setup: Put v = −b/(2a), so that b = −2av.'
  - 'derive: f(s) − f(x) = a(x − s)(2v − s − x).'
  - 'case_split: If (s+t)/2 ≤ v then 2v − s − x ≥ t − x ≥ 0, so f(x) ≤ f(s).'
  - 'derive: f(t) − f(x) = a(t − x)(t + x − 2v).'
  - 'case_split: If v ≤ (s+t)/2 then t + x − 2v ≥ x − s ≥ 0, so f(x) ≤ f(t).'
  openmath: (forall (a b c s t x) (-> (and (> a 0) (<= s x) (<= x t)) (and (-> (<= (/ (+ s t) 2) (/ (neg b) (* 2 a))) (<= (+ (* a (^ x 2)) (* b x) c) (+ (* a (^ s 2)) (* b s) c))) (-> (<= (/ (neg b) (* 2 a)) (/ (+ s t) 2)) (<= (+ (* a (^ x 2)) (* b x) c) (+ (* a (^ t 2)) (* b t) c))))))
  hard_negative:
    statement: $a>0$のとき、区間$[s,t]$上の最大値は軸に近い端点でとる。
    reason: 逆である。$a=1,\ b=c=0,\ [s,t]=[1,3]$では軸$x=0$に近い$x=1$の値は$1$、遠い$x=3$の値は$9$である。
  target: |
    ∀ (a b c s t x : ℝ), 0 < a → s ≤ x → x ≤ t → ((s + t) / 2 ≤ -b / (2 * a) → a * x ^ 2 + b * x + c ≤ a * s ^ 2 + b * s + c) ∧ (-b / (2 * a) ≤ (s + t) / 2 → a * x ^ 2 + b * x + c ≤ a * t ^ 2 + b * t + c)
  proof: |
    by
      intro a b c s t x ha hsx hxt
      have hb : b = -2 * a * (-b / (2 * a)) := by
        field_simp
      generalize -b / (2 * a) = v at hb ⊢
      subst hb
      constructor
      · intro hv
        have h := mul_nonneg ha.le (mul_nonneg (sub_nonneg.2 hsx) (by linarith : 0 ≤ 2 * v - s - x))
        nlinarith
      · intro hv
        have h := mul_nonneg ha.le (mul_nonneg (sub_nonneg.2 hxt) (by linarith : 0 ≤ t + x - 2 * v))
        nlinarith
- id: concave_quadratic_nonneg_from_endpoints
  kind: gap
  level: high
  topic: 二次関数・定義域つきの最大最小
  statement: $a<0$のとき、$ax^2+bx+c$の値が$x=s$と$x=t$でともに$0$以上ならば、区間$[s,t]$全体で$0$以上である。
  statement_en: If a < 0, s ≤ x ≤ t, and a s² + b s + c ≥ 0, a t² + b t + c ≥ 0, then a x² + b x + c ≥ 0.
  assumptions:
  - $a,b,c,s,t,x$は実数
  - $a<0$
  - $s\leq x\leq t$
  - $as^2+bs+c\geq 0$
  - $at^2+bt+c\geq 0$
  quantifiers:
  - 任意の実数$a,b,c,s,t,x$
  conclusion: $ax^2+bx+c\geq 0$である。
  answer: |
    $a,b,c,s,t,x$を実数とし、$a<0$、$s\leq x\leq t$、$f(s)\geq 0$、$f(t)\geq 0$とする。ただし$f(x)=ax^2+bx+c$である。$s=t$なら$x=s$となり、結論は仮定$f(s)\geq 0$そのものである。
    $s<t$とする。展開して確かめると$(t-s)f(x)=(t-x)f(s)+(x-s)f(t)-a(x-s)(t-x)(t-s)$である。右辺の各項は$0$以上であり、$t-s>0$なので$f(x)\geq 0$となる。
  strategy: Express (t−s) f(x) as a nonnegative combination of the endpoint values plus a nonnegative term.
  sketch:
  - 'case_split: If s = t then x = s and the claim is a hypothesis.'
  - 'derive: For s < t, (t − s) f(x) = (t − x) f(s) + (x − s) f(t) − a (x − s)(t − x)(t − s).'
  - 'derive: Each term on the right is nonnegative since a < 0.'
  - 'conclude: Dividing by t − s > 0 gives f(x) ≥ 0.'
  openmath: (forall (a b c s t x) (-> (and (< a 0) (<= s x) (<= x t) (>= (+ (* a (^ s 2)) (* b s) c) 0) (>= (+ (* a (^ t 2)) (* b t) c) 0)) (>= (+ (* a (^ x 2)) (* b x) c) 0)))
  hard_negative:
    statement: $a>0$でも、$x=s$と$x=t$で$0$以上なら$[s,t]$全体で$0$以上である。
    reason: 下に凸では成り立たない。$x^2-1$は$x=\pm 2$で正だが、$x=0$で負である。
  target: |
    ∀ (a b c s t x : ℝ), a < 0 → s ≤ x → x ≤ t → 0 ≤ a * s ^ 2 + b * s + c → 0 ≤ a * t ^ 2 + b * t + c → 0 ≤ a * x ^ 2 + b * x + c
  proof: |
    by
      intro a b c s t x ha hsx hxt hs ht
      rcases (hsx.trans hxt).eq_or_lt with hst | hst
      · have hxs : x = s := le_antisymm (by rw [hst]; exact hxt) hsx
        rw [hxs]
        exact hs
      · have key : (t - s) * (a * x ^ 2 + b * x + c) = (t - x) * (a * s ^ 2 + b * s + c) + (x - s) * (a * t ^ 2 + b * t + c) + (-a) * ((x - s) * ((t - x) * (t - s))) := by
          ring
        have h1 := mul_nonneg (sub_nonneg.2 hxt) hs
        have h2 := mul_nonneg (sub_nonneg.2 hsx) ht
        have h3 := mul_nonneg (neg_nonneg.2 ha.le) (mul_nonneg (sub_nonneg.2 hsx) (mul_nonneg (sub_nonneg.2 hxt) (sub_pos.2 hst).le))
        by_contra hn
        push_neg at hn
        have h4 := mul_neg_of_pos_of_neg (sub_pos.2 hst) hn
        linarith
- id: product_with_fixed_sum_maximum
  kind: gap
  level: high
  topic: 二次関数・定義域つきの最大最小
  statement: 実数$x,y$の和が$s$のとき、積$xy$は$\frac{s^2}{4}$以下であり、等号は$x=y$のときに限り成り立つ。
  statement_en: If real x, y satisfy x + y = s, then x y ≤ s²/4, with equality if and only if x = y.
  assumptions:
  - $x,y,s$は実数
  - $x+y=s$
  quantifiers:
  - 任意の実数$x,y,s$
  conclusion: $xy\leq\frac{s^2}{4}$であり、等号成立は$x=y$と同値である。
  answer: |
    $x,y,s$を実数とし、$x+y=s$とする。$y=s-x$を代入すると、$\frac{s^2}{4}-xy=x^2-sx+\frac{s^2}{4}=\left(x-\frac{s}{2}\right)^2\geq 0$である。よって$xy\leq\frac{s^2}{4}$である。等号が成り立つのは$x=\frac{s}{2}$のときで、これは$y=s-x=\frac{s}{2}$、すなわち$x=y$と同値である。
  strategy: Substitute y = s − x and complete the square in x.
  sketch:
  - 'translate: Substitute y = s − x so that s²/4 − x y = x² − s x + s²/4.'
  - 'derive: This equals (x − s/2)², which is nonnegative.'
  - 'derive: Equality holds if and only if x = s/2.'
  - 'conclude: Since y = s − x, this is equivalent to x = y.'
  openmath: (forall (x y s) (-> (= (+ x y) s) (and (<= (* x y) (/ (^ s 2) 4)) (<-> (= (* x y) (/ (^ s 2) 4)) (= x y)))))
  hard_negative:
    statement: 実数$x,y$の和が$s$のとき、積$xy$には最小値がある。
    reason: 最大値しかない。$x$を大きくして$y=s-x$を小さくすると、$xy$は際限なく小さくなる。
  target: |
    ∀ (x y s : ℝ), x + y = s → x * y ≤ s ^ 2 / 4 ∧ (x * y = s ^ 2 / 4 ↔ x = y)
  proof: |
    by
      intro x y s hs
      subst hs
      constructor
      · nlinarith [sq_nonneg (x - y)]
      · constructor
        · intro h
          have h1 : (x - y) ^ 2 = 0 := by linear_combination (-4) * h
          have h2 : x - y = 0 := pow_eq_zero_iff (two_ne_zero) |>.1 h1
          linarith
        · rintro rfl
          ring
- id: quadratic_formula
  kind: named
  level: middle
  topic: 二次方程式・解の公式
  statement: $a\neq 0$、$b^2-4ac\geq 0$のとき、$ax^2+bx+c=0$の解は$x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}$である（解の公式）。
  statement_en: 'Quadratic formula: if a ≠ 0 and b² − 4ac ≥ 0, then a x² + b x + c = 0 if and only if x = (−b + √(b²−4ac))/(2a) or x = (−b − √(b²−4ac))/(2a).'
  assumptions:
  - $a,b,c,x$は実数
  - $a\neq 0$
  - $b^2-4ac\geq 0$
  quantifiers:
  - 任意の実数$a,b,c,x$
  conclusion: $ax^2+bx+c=0$と、$x=\frac{-b+\sqrt{b^2-4ac}}{2a}$または$x=\frac{-b-\sqrt{b^2-4ac}}{2a}$は同値である。
  answer: |
    $a,b,c,x$を実数とし、$a\neq 0$、$b^2-4ac\geq 0$とする。$s=\sqrt{b^2-4ac}$とおくと、$s^2=b^2-4ac$である。両辺に$4a$を掛けて整理すると、$4a(ax^2+bx+c)=(2ax+b)^2-s^2=(2ax+b-s)(2ax+b+s)$となる。$4a\neq 0$なので、$ax^2+bx+c=0$は$2ax+b=s$または$2ax+b=-s$と同値である。$2a$で割ると$x=\frac{-b+s}{2a}$または$x=\frac{-b-s}{2a}$を得る。
  strategy: Multiply by 4a, complete the square, and factor as a difference of squares.
  sketch:
  - 'setup: Put s = √(b² − 4ac), so s² = b² − 4ac because the discriminant is nonnegative.'
  - 'translate: 4a(a x² + b x + c) = (2ax + b)² − s².'
  - 'derive: Factor the right side as (2ax + b − s)(2ax + b + s).'
  - 'derive: Since 4a ≠ 0, the equation holds if and only if 2ax + b = ±s.'
  - 'conclude: Divide by 2a to get the two formulas.'
  openmath: (forall (a b c x) (-> (and (!= a 0) (>= (- (^ b 2) (* 4 a c)) 0)) (<-> (= (+ (* a (^ x 2)) (* b x) c) 0) (or (= x (/ (+ (neg b) (root (- (^ b 2) (* 4 a c)) 2)) (* 2 a))) (= x (/ (- (neg b) (root (- (^ b 2) (* 4 a c)) 2)) (* 2 a)))))))
  hard_negative:
    statement: $a\neq 0$であれば、判別式の符号によらず実数解は$x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}$である。
    reason: $b^2-4ac<0$では実数解がない。$x^2+1=0$は実数解をもたず、根号の中が負なので実数の範囲では式も意味をもたない。
  target: |
    ∀ (a b c x : ℝ), a ≠ 0 → 0 ≤ b ^ 2 - 4 * a * c → (a * x ^ 2 + b * x + c = 0 ↔ x = (-b + Real.sqrt (b ^ 2 - 4 * a * c)) / (2 * a) ∨ x = (-b - Real.sqrt (b ^ 2 - 4 * a * c)) / (2 * a))
  proof: |
    by
      intro a b c x ha hD
      have hs : discrim a b c = Real.sqrt (b ^ 2 - 4 * a * c) * Real.sqrt (b ^ 2 - 4 * a * c) := by
        rw [Real.mul_self_sqrt hD, discrim]
      have e : a * x ^ 2 + b * x + c = a * (x * x) + b * x + c := by ring
      rw [e]
      exact quadratic_eq_zero_iff ha hs x
