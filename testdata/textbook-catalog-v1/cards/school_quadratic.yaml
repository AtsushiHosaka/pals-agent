        have h : b ^ 2 - 4 * a * c = (2 * a * x + b) ^ 2 := by linear_combination (-4 * a) * hx
        nlinarith [sq_nonneg (2 * a * x + b)]
- id: rational_root_iff_discriminant_square
  kind: gap
  level: high
  topic: 二次方程式・判別式
  statement: $a,b,c$が有理数で$a\neq 0$のとき、$ax^2+bx+c=0$が有理数解をもつことは、$b^2-4ac$が有理数の平方であることと同値である。
  statement_en: For rational a ≠ 0, b, c, the equation a x² + b x + c = 0 has a rational solution if and only if b² − 4ac is the square of a rational number.
  assumptions:
  - $a,b,c$は有理数
  - $a\neq 0$
  quantifiers:
  - 任意の有理数$a,b,c$
  conclusion: 有理数解の存在と、$b^2-4ac=s^2$となる有理数$s$の存在は同値である。
  answer: |
    $a,b,c$を有理数とし、$a\neq 0$とする。任意の有理数$x$について、$4a(ax^2+bx+c)=(2ax+b)^2-(b^2-4ac)$である。
