    reason: 逆は成り立たない。$a=d=0,\ b=1,\ c=0,\ e=1,\ f=1$では$(af-dc)^2=0$、$(ae-db)(bf-ec)=0\cdot 1=0$で等式が成り立つが、$x=0$と$x+1=0$に共通の解はない。実数か複素数かに関係なく成り立つ反例である。
