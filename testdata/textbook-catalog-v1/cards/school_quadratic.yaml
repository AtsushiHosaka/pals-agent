  openmath: (forall (a b c) (-> (!= a 0) (and (-> (> (- (^ b 2) (* 4 a c)) 0) (= (size (suchthat R (lambda (x) (= (+ (* a (^ x 2)) (* b x) c) 0)))) 2)) (-> (= (- (^ b 2) (* 4 a c)) 0) (= (size (suchthat R (lambda (x) (= (+ (* a (^ x 2)) (* b x) c) 0)))) 1)) (-> (< (- (^ b 2) (* 4 a c)) 0) (= (suchthat R (lambda (x) (= (+ (* a (^ x 2)) (* b x) c) 0))) emptyset)))))
  hard_negative:
