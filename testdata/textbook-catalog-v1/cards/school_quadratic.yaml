  statement_en: 'Vieta''s formulas for quadratics: for a ≠ 0, a x² + b x + c = a (x − p)(x − q) for all real x if and only if p + q = −b/a and p q = c/a.'
  assumptions:
  - $a,b,c,p,q$は実数
  - $a\neq 0$
  quantifiers:
  - 任意の実数$a,b,c,p,q$
