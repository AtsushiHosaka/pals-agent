  hard_negative:
    statement: 放物線上の$x=p,q$の2点を結ぶ直線の傾きは$2a(p+q)+b$である。
    reason: 係数が2倍違う。$y=x^2$で$p=0,\ q=1$とすると傾きは$1$であり、$2a(p+q)+b=2$ではない。
  target: |
    ∀ (a b c p q : ℝ), p ≠ q → ((a * q ^ 2 + b * q + c) - (a * p ^ 2 + b * p + c)) / (q - p) = a * (p + q) + b
  proof: |
    by
      intro a b c p q hpq
      rw [div_eq_iff (sub_ne_zero.2 hpq.symm)]
      ring
- id: three_roots_force_zero_polynomial
  kind: gap
  level: high
  topic: 二次関数・グラフとx軸の位置関係
  statement: 相異なる3つの実数$p,q,r$で$ax^2+bx+c$の値がすべて$0$ならば、$a=b=c=0$である。
  statement_en: If a x² + b x + c vanishes at three distinct real numbers, then a = b = c = 0.
  assumptions:
  - $a,b,c,p,q,r$は実数
  - $p,q,r$は相異なる
  - $x=p,q,r$で$ax^2+bx+c=0$
  quantifiers:
  - 任意の実数$a,b,c,p,q,r$
  conclusion: $a=0$、$b=0$、$c=0$である。
  answer: |
    $a,b,c,p,q,r$を実数とし、$p,q,r$は相異なり、$x=p,q,r$で$ax^2+bx+c=0$とする。$x=p$と$x=q$の式の差は$(p-q)\{a(p+q)+b\}=0$である。$p\neq q$より$a(p+q)+b=0$となる。同様に$a(p+r)+b=0$である。この2式の差は$a(q-r)=0$であり、$q\neq r$より$a=0$である。すると$b=0$であり、最後に$c=0$となる。
  strategy: Subtract pairs of equations and cancel the nonzero differences.
  sketch:
  - 'derive: Subtracting the equations at p and q gives a(p + q) + b = 0.'
  - 'derive: Similarly a(p + r) + b = 0.'
  - 'derive: The difference gives a(q − r) = 0, so a = 0.'
  - 'conclude: Then b = 0 and c = 0.'
  openmath: (forall (a b c p q r) (-> (and (!= p q) (!= q r) (!= p r) (= (+ (* a (^ p 2)) (* b p) c) 0) (= (+ (* a (^ q 2)) (* b q) c) 0) (= (+ (* a (^ r 2)) (* b r) c) 0)) (and (= a 0) (= b 0) (= c 0))))
  hard_negative:
    statement: 相異なる2つの実数で$ax^2+bx+c$の値が$0$ならば、$a=b=c=0$である。
    reason: 2点では足りない。$x^2-1$は$x=\pm 1$で$0$となる。
  target: |
    ∀ (a b c p q r : ℝ), p ≠ q → q ≠ r → p ≠ r → a * p ^ 2 + b * p + c = 0 → a * q ^ 2 + b * q + c = 0 → a * r ^ 2 + b * r + c = 0 → a = 0 ∧ b = 0 ∧ c = 0
  proof: |
    by
      intro a b c p q r hpq hqr hpr hp hq hr
      have h1 : a * (p + q) + b = 0 := mul_left_cancel₀ (sub_ne_zero.2 hpq) (by linear_combination hp - hq : (p - q) * (a * (p + q) + b) = (p - q) * 0)
      have h2 : a * (p + r) + b = 0 := mul_left_cancel₀ (sub_ne_zero.2 hpr) (by linear_combination hp - hr : (p - r) * (a * (p + r) + b) = (p - r) * 0)
      have h3 : a = 0 := mul_left_cancel₀ (sub_ne_zero.2 hqr) (by linear_combination h1 - h2 : (q - r) * a = (q - r) * 0)
      subst h3
      have h4 : b = 0 := by linarith
      subst h4
      refine ⟨rfl, rfl, ?_⟩
      linarith
- id: parabola_through_three_points
  kind: textbook
  level: high
  topic: 二次関数・グラフとx軸の位置関係
  statement: 相異なる$p,q,r$と任意の$u,v,w$に対して、$x=p,q,r$での値がそれぞれ$u,v,w$となる2次以下の式$ax^2+bx+c$は、ちょうど1つ存在する。
  statement_en: For distinct real p, q, r and any real u, v, w, there is exactly one triple (a, b, c) of reals with a p² + b p + c = u, a q² + b q + c = v and a r² + b r + c = w.
  assumptions:
  - $p,q,r,u,v,w$は実数
  - $p,q,r$は相異なる
  quantifiers:
  - 任意の実数$p,q,r,u,v,w$
  conclusion: 条件をみたす$(a,b,c)$はちょうど1組である。
  answer: |
    $p,q,r,u,v,w$を実数とし、$p,q,r$は相異なるとする。
    存在を示す。$s_1=\frac{v-u}{q-p}$、$s_2=\frac{w-u}{r-p}$、$a=\frac{s_2-s_1}{r-q}$、$b=s_1-a(p+q)$、$c=u-ap^2-bp$とおく。$c$の定め方から$x=p$での値は$u$である。$x=q$での値は$u+(q-p)\{a(p+q)+b\}=u+(q-p)s_1=v$である。$a(p+r)+b=a(r-q)+s_1=s_2$なので、$x=r$での値は$u+(r-p)s_2=w$である。
    一意性を示す。別の$(a',b',c')$も条件をみたすとする。$A=a'-a$、$B=b'-b$、$C=c'-c$とおくと、$x=p,q,r$で$Ax^2+Bx+C=0$である。$x=p,q$の式の差から$A(p+q)+B=0$、$x=p,r$の式の差から$A(p+r)+B=0$を得る。この差$A(q-r)=0$から$A=0$となり、順に$B=0$、$C=0$が従う。
  strategy: Construct the coefficients by divided differences and show uniqueness by subtracting two solutions.
  sketch:
  - 'construct: Put s1 = (v − u)/(q − p), s2 = (w − u)/(r − p), a = (s2 − s1)/(r − q), b = s1 − a(p + q), c = u − a p² − b p.'
  - 'derive: The value at p is u by the definition of c.'
  - 'derive: The values at q and r follow from a(p + q) + b = s1 and a(p + r) + b = s2.'
  - 'setup: For uniqueness let A, B, C be the differences of two solutions.'
  - 'derive: A x² + B x + C vanishes at p, q, r.'
  - 'conclude: Subtracting and cancelling gives A = B = C = 0.'
  openmath: (forall (p q r u v w) (-> (and (!= p q) (!= q r) (!= p r)) (exists (a b c) (and (= (+ (* a (^ p 2)) (* b p) c) u) (= (+ (* a (^ q 2)) (* b q) c) v) (= (+ (* a (^ r 2)) (* b r) c) w) (forall (d e f) (-> (and (= (+ (* d (^ p 2)) (* e p) f) u) (= (+ (* d (^ q 2)) (* e q) f) v) (= (+ (* d (^ r 2)) (* e r) f) w)) (and (= d a) (= e b) (= f c))))))))
  hard_negative:
    statement: 相異なる$p,q,r$と任意の$u,v,w$に対して、これらの点を通る放物線、すなわち$a\neq 0$の$y=ax^2+bx+c$がつねに存在する。
    reason: 3点が一直線上にあると$a=0$となり、放物線にならない。$(0,0),(1,1),(2,2)$を通る2次以下の式は$x$だけである。
  target: |
    ∀ (p q r u v w : ℝ), p ≠ q → q ≠ r → p ≠ r → ∃! t : ℝ × ℝ × ℝ, t.1 * p ^ 2 + t.2.1 * p + t.2.2 = u ∧ t.1 * q ^ 2 + t.2.1 * q + t.2.2 = v ∧ t.1 * r ^ 2 + t.2.1 * r + t.2.2 = w
  proof: |
    by
      intro p q r u v w hpq hqr hpr
      have hs1 : (v - u) / (q - p) * (q - p) = v - u := div_mul_cancel₀ _ (sub_ne_zero.2 hpq.symm)
      have hs2 : (w - u) / (r - p) * (r - p) = w - u := div_mul_cancel₀ _ (sub_ne_zero.2 hpr.symm)
      generalize (v - u) / (q - p) = s1 at hs1
      generalize (w - u) / (r - p) = s2 at hs2
      have ha : (s2 - s1) / (r - q) * (r - q) = s2 - s1 := div_mul_cancel₀ _ (sub_ne_zero.2 hqr.symm)
      generalize (s2 - s1) / (r - q) = a at ha
      refine ⟨(a, s1 - a * (p + q), u - a * p ^ 2 - (s1 - a * (p + q)) * p), ?_, ?_⟩
      · dsimp only
        refine ⟨by ring, ?_, ?_⟩
        · linear_combination hs1
        · linear_combination hs2 + (r - p) * ha
      · rintro ⟨a', b', c'⟩ ⟨h1, h2, h3⟩
        dsimp only at h1 h2 h3
        have hp : a * p ^ 2 + (s1 - a * (p + q)) * p + (u - a * p ^ 2 - (s1 - a * (p + q)) * p) = u := by ring
        have hq : a * q ^ 2 + (s1 - a * (p + q)) * q + (u - a * p ^ 2 - (s1 - a * (p + q)) * p) = v := by
          linear_combination hs1
        have hr : a * r ^ 2 + (s1 - a * (p + q)) * r + (u - a * p ^ 2 - (s1 - a * (p + q)) * p) = w := by
          linear_combination hs2 + (r - p) * ha
        generalize hb : s1 - a * (p + q) = b at hp hq hr ⊢
        generalize hc : u - a * p ^ 2 - b * p = c at hp hq hr ⊢
        have e1 : (a' - a) * (p + q) + (b' - b) = 0 := mul_left_cancel₀ (sub_ne_zero.2 hpq) (by linear_combination h1 - h2 - hp + hq : (p - q) * ((a' - a) * (p + q) + (b' - b)) = (p - q) * 0)
        have e2 : (a' - a) * (p + r) + (b' - b) = 0 := mul_left_cancel₀ (sub_ne_zero.2 hpr) (by linear_combination h1 - h3 - hp + hr : (p - r) * ((a' - a) * (p + r) + (b' - b)) = (p - r) * 0)
        have e3 : a' - a = 0 := mul_left_cancel₀ (sub_ne_zero.2 hqr) (by linear_combination e1 - e2 : (q - r) * (a' - a) = (q - r) * 0)
        have e4 : a' = a := by linarith
        subst e4
        have e5 : b' = b := by linarith
        subst e5
        have e6 : c' = c := by linarith
        subst e6
        rfl
- id: sign_change_unique_root_between
  kind: gap
  level: high
  topic: 二次関数・グラフとx軸の位置関係
  statement: $p<q$で、$ax^2+bx+c$の$x=p$と$x=q$での値が異符号ならば、$p<x<q$の範囲に$ax^2+bx+c=0$の解がちょうど1つある。
  statement_en: If p < q and (a p² + b p + c)(a q² + b q + c) < 0, then a x² + b x + c = 0 has exactly one solution in the open interval (p, q).
  assumptions:
  - $a,b,c,p,q$は実数
  - $p<q$
  - $(ap^2+bp+c)(aq^2+bq+c)<0$
  quantifiers:
  - 任意の実数$a,b,c,p,q$
  conclusion: $p<x<q$をみたす解がちょうど1つある。
  answer: |
    $a,b,c,p,q$を実数とし、$p<q$、$f(x)=ax^2+bx+c$、$f(p)f(q)<0$とする。$f$は連続で$f(p)$と$f(q)$は異符号なので、中間値の定理により$p<x<q$で$f(x)=0$となる$x$がある。
    $p<x<q$の範囲に解が2つあるとし、それを$x\neq y$とする。$f(x)-f(y)=(x-y)\{a(x+y)+b\}=0$より$b=-a(x+y)$である。これと$f(x)=0$から$c=axy$となるので、$f(t)=a(t-x)(t-y)$である。すると$f(p)f(q)=a^2(x-p)(y-p)(q-x)(q-y)\geq 0$となり、仮定に反する。したがって解は1つだけである。
  strategy: Apply the intermediate value theorem for existence and factor through two hypothetical roots for uniqueness.
  sketch:
  - 'apply_theorem: f is continuous with values of opposite sign at p and q, so a root exists in (p, q).'
  - 'setup: Suppose x ≠ y are two roots in (p, q).'
  - 'derive: Then b = −a(x + y) and c = a x y, so f(t) = a(t − x)(t − y).'
  - 'derive: This gives f(p) f(q) = a²(x − p)(y − p)(q − x)(q − y) ≥ 0.'
  - 'contradiction: This contradicts f(p) f(q) < 0.'
  openmath: (forall (a b c p q) (-> (and (< p q) (< (* (+ (* a (^ p 2)) (* b p) c) (+ (* a (^ q 2)) (* b q) c)) 0)) (exists (x) (and (< p x) (< x q) (= (+ (* a (^ x 2)) (* b x) c) 0) (forall (y) (-> (and (< p y) (< y q) (= (+ (* a (^ y 2)) (* b y) c) 0)) (= y x)))))))
  hard_negative:
    statement: $p<q$で$x=p$と$x=q$での値が同符号ならば、$p<x<q$に解はない。
    reason: 同符号でも解が2つある場合がある。$x^2-1$は$x=\pm 2$でともに正だが、$-2<x<2$に解$\pm 1$をもつ。
  target: |
    ∀ (a b c p q : ℝ), p < q → (a * p ^ 2 + b * p + c) * (a * q ^ 2 + b * q + c) < 0 → ∃! x : ℝ, p < x ∧ x < q ∧ a * x ^ 2 + b * x + c = 0
  proof: |
    by
      intro a b c p q hpq h
      have hcont : Continuous (fun x : ℝ => a * x ^ 2 + b * x + c) := by fun_prop
      have hex : ∃ x ∈ Set.Ioo p q, a * x ^ 2 + b * x + c = 0 := by
        rcases mul_neg_iff.1 h with ⟨h1, h2⟩ | ⟨h1, h2⟩
        · obtain ⟨x, hx, hfx⟩ := intermediate_value_Ioo' hpq.le hcont.continuousOn ⟨h2, h1⟩
          exact ⟨x, hx, hfx⟩
        · obtain ⟨x, hx, hfx⟩ := intermediate_value_Ioo hpq.le hcont.continuousOn ⟨h1, h2⟩
          exact ⟨x, hx, hfx⟩
      obtain ⟨x, ⟨hx1, hx2⟩, hx⟩ := hex
      refine ⟨x, ⟨hx1, hx2, hx⟩, ?_⟩
      rintro y ⟨hy1, hy2, hy⟩
      by_contra hne
      have h1 : a * (y + x) + b = 0 := mul_left_cancel₀ (sub_ne_zero.2 hne) (by linear_combination hy - hx : (y - x) * (a * (y + x) + b) = (y - x) * 0)
      have hb : b = -a * (y + x) := by linarith
      have hc : c = a * y * x := by
        rw [hb] at hx
        linear_combination hx
      subst hb hc
      have e : (a * p ^ 2 + -a * (y + x) * p + a * y * x) * (a * q ^ 2 + -a * (y + x) * q + a * y * x) = a ^ 2 * ((y - p) * (x - p)) * ((q - y) * (q - x)) := by ring
      have h2 : 0 ≤ a ^ 2 * ((y - p) * (x - p)) * ((q - y) * (q - x)) :=
        mul_nonneg (mul_nonneg (sq_nonneg a) (mul_nonneg (by linarith) (by linarith))) (mul_nonneg (by linarith) (by linarith))
      rw [e] at h
      linarith
- id: factored_inequality_between_and_outside
  kind: gap
  level: high
  topic: 二次不等式
  statement: $a>0$、$p<q$のとき、$a(x-p)(x-q)<0$の解は$p<x<q$であり、$a(x-p)(x-q)>0$の解は$x<p$または$q<x$である。
  statement_en: 'For a > 0 and p < q: a (x − p)(x − q) < 0 if and only if p < x < q, and a (x − p)(x − q) > 0 if and only if x < p or q < x.'
  assumptions:
  - $a,p,q,x$は実数
  - $a>0$
  - $p<q$
  quantifiers:
  - 任意の実数$a,p,q,x$
  conclusion: 負になるのは2解の間、正になるのは2解の外側である。
  answer: |
    $a,p,q,x$を実数とし、$a>0$、$p<q$とする。$a>0$なので、$a(x-p)(x-q)$の符号は$(x-p)(x-q)$の符号と等しい。積が負になるのは、因数の符号が異なるときである。$x-p>0$かつ$x-q<0$なら$p<x<q$である。$x-p<0$かつ$x-q>0$は$x<p<q<x$となるので起こらない。積が正になるのは、因数がともに正、またはともに負のときである。ともに正なら$q<x$、ともに負なら$x<p$である。逆に、$p<x<q$なら$x-p>0$かつ$x-q<0$で積は負である。$x<p$なら$x-q<0$でもあるので積は正であり、$q<x$なら$x-p>0$でもあるので積は正である。
  strategy: Reduce to the sign of the product of the two linear factors and split into cases.
  sketch:
  - 'translate: Since a > 0, the sign equals that of (x − p)(x − q).'
  - 'case_split: The product is negative exactly when the factors have opposite signs, which with p < q means p < x < q.'
  - 'case_split: The product is positive exactly when both factors have the same sign, that is x < p or q < x.'
  - 'conclude: The converse directions follow from the factor signs.'
  openmath: (forall (a p q x) (-> (and (> a 0) (< p q)) (and (<-> (< (* a (- x p) (- x q)) 0) (and (< p x) (< x q))) (<-> (> (* a (- x p) (- x q)) 0) (or (< x p) (< q x))))))
  hard_negative:
    statement: $a\neq 0$、$p<q$のとき、$a(x-p)(x-q)<0$の解は$p<x<q$である。
    reason: $a<0$では符号が逆になる。$-(x-1)(x-2)<0$の解は$x<1$または$2<x$である。
  target: |
    ∀ (a p q x : ℝ), 0 < a → p < q → (a * (x - p) * (x - q) < 0 ↔ p < x ∧ x < q) ∧ (0 < a * (x - p) * (x - q) ↔ x < p ∨ q < x)
  proof: |
    by
      intro a p q x ha hpq
      rw [mul_assoc]
      constructor
      · constructor
        · intro h
          have h2 : (x - p) * (x - q) < 0 := by
            by_contra hn
            push_neg at hn
            have := mul_nonneg ha.le hn
            linarith
          rcases mul_neg_iff.1 h2 with ⟨h3, h4⟩ | ⟨h3, h4⟩
          · exact ⟨by linarith, by linarith⟩
          · exfalso
            linarith
        · rintro ⟨h1, h2⟩
          exact mul_neg_of_pos_of_neg ha (mul_neg_of_pos_of_neg (by linarith) (by linarith))
      · constructor
        · intro h
          have h2 : 0 < (x - p) * (x - q) := (mul_pos_iff_of_pos_left ha).1 h
          rcases mul_pos_iff.1 h2 with ⟨_, h4⟩ | ⟨h3, _⟩
          · right
            linarith
          · left
            linarith
        · rintro (h1 | h1)
          · exact mul_pos ha (mul_pos_of_neg_of_neg (by linarith) (by linarith))
          · exact mul_pos ha (mul_pos (by linarith) (by linarith))
