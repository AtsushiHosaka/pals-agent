  statement: 1次の係数が偶数倍の形$ax^2+2bx+c=0$のとき、$a\neq 0$、$b^2-ac\geq 0$ならば解は$x=\frac{-b\pm\sqrt{b^2-ac}}{a}$である。これは解の公式の特殊形である。
  statement_en: 'Special form of the quadratic formula: if a ≠ 0 and b² − ac ≥ 0, then a x² + 2 b x + c = 0 if and only if x = (−b + √(b²−ac))/a or x = (−b − √(b²−ac))/a.'
  assumptions:
