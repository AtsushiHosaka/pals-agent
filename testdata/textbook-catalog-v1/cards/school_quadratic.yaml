  topic: 二次方程式・解と係数の関係
  statement: $p,q$が$ax^2+bx+c=0$の解で、$S_n=p^n+q^n$とおくと、$0$以上のすべての整数$n$で$aS_{n+2}+bS_{n+1}+cS_n=0$である。ただし$p^0=q^0=1$とする。
  statement_en: If p and q are solutions of a x² + b x + c = 0 and S_n = pⁿ + qⁿ (with p⁰ = q⁰ = 1), then a S_{n+2} + b S_{n+1} + c S_n = 0 for every integer n ≥ 0.
  assumptions:
  - $a,b,c,p,q$は実数
  - $ap^2+bp+c=0$
  - $aq^2+bq+c=0$
  - $n$は$0$以上の整数
  quantifiers:
  - 任意の実数$a,b,c,p,q$
  - $0$以上の任意の整数$n$
  conclusion: $a(p^{n+2}+q^{n+2})+b(p^{n+1}+q^{n+1})+c(p^n+q^n)=0$である。
  answer: |
    $a,b,c,p,q$を実数とし、$ap^2+bp+c=0$、$aq^2+bq+c=0$とする。$n$を$0$以上の整数とする（$p^0=q^0=1$とする）。第1式に$p^n$を掛けると$ap^{n+2}+bp^{n+1}+cp^n=0$である。第2式に$q^n$を掛けると$aq^{n+2}+bq^{n+1}+cq^n=0$である。この2式を足すと結論を得る。
  strategy: Multiply each root equation by the appropriate power and add.
  sketch:
  - 'derive: Multiply a p² + b p + c = 0 by pⁿ.'
  - 'derive: Multiply a q² + b q + c = 0 by qⁿ.'
  - 'conclude: Adding the two equations gives the recurrence.'
  openmath: (forall (a b c p q n) (-> (and (in n N) (= (+ (* a (^ p 2)) (* b p) c) 0) (= (+ (* a (^ q 2)) (* b q) c) 0)) (= (+ (* a (+ (^ p (+ n 2)) (^ q (+ n 2)))) (* b (+ (^ p (+ n 1)) (^ q (+ n 1)))) (* c (+ (^ p n) (^ q n)))) 0)))
  hard_negative:
    statement: $p,q$が解なら、$S_{n+2}=bS_{n+1}+cS_n$である。
    reason: 係数と符号が異なる。$a=1$でも$S_{n+2}=-bS_{n+1}-cS_n$である。$x^2-3x+2=0$で$p=1,\ q=2$なら$S_2=5$、$S_1=3$、$S_0=2$で、$bS_1+cS_0=-5$である。
  target: |
    ∀ (a b c p q : ℝ) (n : ℕ), a * p ^ 2 + b * p + c = 0 → a * q ^ 2 + b * q + c = 0 → a * (p ^ (n + 2) + q ^ (n + 2)) + b * (p ^ (n + 1) + q ^ (n + 1)) + c * (p ^ n + q ^ n) = 0
  proof: |
    by
      intro a b c p q n hp hq
      linear_combination p ^ n * hp + q ^ n * hq
