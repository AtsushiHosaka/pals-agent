  statement: $a\neq 0$とする。$y=ax^2+bx+c$のグラフを$x$軸方向に$p$、$y$軸方向に$q$だけ平行移動したグラフは$y=ax^2+(b-2ap)x+(ap^2-bp+c+q)$であり、頂点の$x$座標は$p$増え、$y$座標は$q$増える。
