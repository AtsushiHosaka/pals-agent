  sketch:
  - 'setup: Put s = √(b² − ac), so s² = b² − ac.'
  - 'translate: a(a x² + 2 b x + c) = (a x + b)² − s².'
  - 'derive: The right side factors as (a x + b − s)(a x + b + s).'
  - 'conclude: Since a ≠ 0, the equation holds if and only if x = (−b ± s)/a.'
  openmath: (forall (a b c x) (-> (and (!= a 0) (>= (- (^ b 2) (* a c)) 0)) (<-> (= (+ (* a (^ x 2)) (* (* 2 b) x) c) 0) (or (= x (/ (+ (neg b) (root (- (^ b 2) (* a c)) 2)) a)) (= x (/ (- (neg b) (root (- (^ b 2) (* a c)) 2)) a))))))
