  proof: |
    by
      intro a b c p q ha
      refine ⟨fun x => by ring, ?_, ?_⟩
      · field_simp
        ring
      · field_simp
        ring
- id: translate_iff_same_leading_coefficient
  kind: gap
  level: high
  topic: 二次関数・平行移動と対称移動
  statement: $a\neq 0$のとき、放物線$y=dx^2+ex+f$が$y=ax^2+bx+c$の平行移動であることは、$d=a$と同値である。
  statement_en: 'For a ≠ 0: there exist real p, q with d x² + e x + f = a (x − p)² + b (x − p) + c + q for all x if and only if d = a.'
  assumptions:
  - $a,b,c,d,e,f$は実数
  - $a\neq 0$
  quantifiers:
  - 任意の実数$a,b,c,d,e,f$
  conclusion: 平行移動で重なることと、2次の係数が等しいことは同値である。
  answer: |
    $a,b,c,d,e,f$を実数とし、$a\neq 0$とする。ある$p,q$ですべての$x$について$dx^2+ex+f=a(x-p)^2+b(x-p)+c+q$とする。$x=1$と$x=-1$の式の和から$x=0$の式の2倍を引くと、左辺は$2d$、右辺は$2a$となる。よって$d=a$である。
