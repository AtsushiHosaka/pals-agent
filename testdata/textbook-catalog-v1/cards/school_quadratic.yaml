- id: quadratic_inequality_by_discriminant
  kind: textbook
  level: high
  topic: 二次不等式
  statement: $a>0$、$b^2-4ac>0$とし、$\alpha=\frac{-b-\sqrt{b^2-4ac}}{2a}$、$\beta=\frac{-b+\sqrt{b^2-4ac}}{2a}$とする。$ax^2+bx+c<0$の解は$\alpha<x<\beta$であり、$ax^2+bx+c>0$の解は$x<\alpha$または$\beta<x$である。
  statement_en: 'For a > 0 and b² − 4ac > 0, with α = (−b − √(b²−4ac))/(2a) and β = (−b + √(b²−4ac))/(2a): a x² + b x + c < 0 if and only if α < x < β, and a x² + b x + c > 0 if and only if x < α or β < x.'
  assumptions:
  - $a,b,c,x$は実数
  - $a>0$
  - $b^2-4ac>0$
  quantifiers:
  - 任意の実数$a,b,c,x$
  conclusion: 負になるのは$\alpha<x<\beta$、正になるのは$x<\alpha$または$\beta<x$である。
  answer: |
    $a,b,c,x$を実数とし、$a>0$、$b^2-4ac>0$とする。$v=-\frac{b}{2a}$、$t=\frac{\sqrt{b^2-4ac}}{2a}>0$とおくと、$\alpha=v-t$、$\beta=v+t$である。また$b=-2av$、$c=a(v^2-t^2)$が成り立つ。実際、$a(v^2-t^2)=a\cdot\frac{b^2-(b^2-4ac)}{4a^2}=c$である。よって$ax^2+bx+c=a(x-\alpha)(x-\beta)$である。$a>0$なので符号は$(x-\alpha)(x-\beta)$の符号と等しい。$\alpha<\beta$より$x-\beta<x-\alpha$なので、積が負になるのは$x-\beta<0<x-\alpha$、すなわち$\alpha<x<\beta$のときである。積が正になるのは、$x-\alpha<0$すなわち$x<\alpha$のとき、または$x-\beta>0$すなわち$\beta<x$のときである。
  strategy: Factor by the two roots and read off the signs.
  sketch:
  - 'setup: Put v = −b/(2a) and t = √(b²−4ac)/(2a) > 0, so α = v − t and β = v + t.'
  - 'derive: Then b = −2av and c = a(v² − t²).'
  - 'derive: Hence a x² + b x + c = a (x − α)(x − β).'
  - 'case_split: Analyze the sign of the product using α < β.'
  - 'conclude: This gives the two solution sets.'
