  answer: |
    $a,p,q,x$を実数とし、$a\neq 0$とする。実数の積が$0$になるのは、いずれかの因数が$0$のときに限る。$a\neq 0$なので、$a(x-p)(x-q)=0$は$x-p=0$または$x-q=0$と同値である。これは$x=p$または$x=q$である。
  strategy: Apply the zero-product property.
  sketch:
  - 'apply_theorem: A product of reals is zero only if some factor is zero.'
  - 'conclude: Since a ≠ 0, the remaining factors give x = p or x = q.'
  openmath: (forall (a p q x) (-> (!= a 0) (<-> (= (* a (- x p) (- x q)) 0) (or (= x p) (= x q)))))
