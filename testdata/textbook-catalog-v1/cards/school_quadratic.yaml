  answer: |
    $a,b,c,d,e,f,r$を実数とし、$ar^2+br+c=0$、$dr^2+er+f=0$とする。$P=ae-db$、$Q=af-dc$、$R=bf-ec$とおく。第2式の$a$倍から第1式の$d$倍を引くと、$r^2$の項が消えて$Pr+Q=0$となる。第1式の$e$倍から第2式の$b$倍を引くと、$r$の項が消えて$Pr^2-R=0$となる。前者から$Q=-Pr$なので$Q^2=P\cdot Pr^2$であり、後者から$Pr^2=R$なので$Q^2=PR$である。
