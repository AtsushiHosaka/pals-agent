  - $a\neq 0$
  - $b^2-ac\geq 0$
  quantifiers:
  - 任意の実数$a,b,c,x$
  conclusion: $ax^2+2bx+c=0$と、$x=\frac{-b+\sqrt{b^2-ac}}{a}$または$x=\frac{-b-\sqrt{b^2-ac}}{a}$は同値である。
  answer: |
    $a,b,c,x$を実数とし、$a\neq 0$、$b^2-ac\geq 0$とする。$s=\sqrt{b^2-ac}$とおくと$s^2=b^2-ac$である。このとき$a(ax^2+2bx+c)=(ax+b)^2-s^2=(ax+b-s)(ax+b+s)$である。$a\neq 0$なので、$ax^2+2bx+c=0$は$ax+b=s$または$ax+b=-s$と同値である。$a$で割ると$x=\frac{-b+s}{a}$または$x=\frac{-b-s}{a}$を得る。
