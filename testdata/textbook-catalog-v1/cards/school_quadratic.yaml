  sketch:
  - 'translate: The translated graph is y = a (x − p)² + b (x − p) + c + q.'
  - 'derive: Expanding gives the new coefficients.'
  - 'derive: The vertex formula gives x-coordinate −b/(2a) + p.'
  - 'conclude: The vertex formula gives y-coordinate (4ac − b²)/(4a) + q.'
  openmath: (forall (a b c p q) (-> (!= a 0) (and (forall (x) (= (+ (+ (* a (^ (- x p) 2)) (* b (- x p)) c) q) (+ (* a (^ x 2)) (* (- b (* 2 a p)) x) (+ (* a (^ p 2)) (neg (* b p)) c q)))) (= (/ (neg (- b (* 2 a p))) (* 2 a)) (+ (/ (neg b) (* 2 a)) p)) (= (/ (- (* 4 a (+ (* a (^ p 2)) (neg (* b p)) c q)) (^ (- b (* 2 a p)) 2)) (* 4 a)) (+ (/ (- (* 4 a c) (^ b 2)) (* 4 a)) q)))))
  hard_negative:
