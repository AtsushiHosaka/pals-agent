  strategy: Take a second difference of the identity for necessity and solve for p, q for sufficiency.
  sketch:
  - 'derive: Evaluate the identity at x = 1, −1 and 0.'
  - 'derive: The second difference gives 2d = 2a.'
  - 'construct: Conversely put p = (b − e)/(2a) and q = f − a p² + b p − c.'
  - 'conclude: Expanding shows the identity holds.'
  openmath: (forall (a b c d e f) (-> (!= a 0) (<-> (exists (p q) (forall (x) (= (+ (* d (^ x 2)) (* e x) f) (+ (+ (* a (^ (- x p) 2)) (* b (- x p)) c) q)))) (= d a))))
  hard_negative:
    statement: $y=dx^2+ex+f$が$y=ax^2+bx+c$の平行移動であることは、$d=a$かつ$e=b$と同値である。
    reason: 1次の係数は平行移動で変わる。$y=x^2+2x$は$y=x^2$を平行移動したものだが、1次の係数は異なる。
  target: |
    ∀ (a b c d e f : ℝ), a ≠ 0 → ((∃ p q : ℝ, ∀ x : ℝ, d * x ^ 2 + e * x + f = a * (x - p) ^ 2 + b * (x - p) + c + q) ↔ d = a)
  proof: |
    by
      intro a b c d e f ha
      constructor
      · rintro ⟨p, q, h⟩
        have h0 := h 0
        have h1 := h 1
        have h2 := h (-1)
        linear_combination (1 / 2) * h1 + (1 / 2) * h2 - h0
      · intro hd
        subst hd
        have hp : 2 * d * ((b - e) / (2 * d)) = b - e := by field_simp
        generalize (b - e) / (2 * d) = p at hp
        refine ⟨p, f - d * p ^ 2 + b * p - c, fun x => ?_⟩
        linear_combination x * hp
