- id: complete_square_general
  kind: gap
  level: high
  topic: 二次関数・頂点と軸
  statement: $a\neq 0$のとき、一般の2次式は$ax^2+bx+c=a\left(x+\frac{b}{2a}\right)^2-\frac{b^2-4ac}{4a}$と平方完成できる。
  statement_en: 'For real a ≠ 0, b, c, x: a x² + b x + c = a (x + b/(2a))² − (b² − 4ac)/(4a).'
  assumptions:
  - $a,b,c,x$は実数
  - $a\neq 0$
  quantifiers:
  - 任意の実数$a,b,c,x$
  conclusion: $ax^2+bx+c=a\left(x+\frac{b}{2a}\right)^2-\frac{b^2-4ac}{4a}$が成り立つ。
  answer: |
    $a,b,c,x$を実数とし、$a\neq 0$とする。右辺を展開すると、$a\left(x+\frac{b}{2a}\right)^2=ax^2+bx+\frac{b^2}{4a}$である。ここから$\frac{b^2-4ac}{4a}=\frac{b^2}{4a}-c$を引くと$ax^2+bx+c$になり、左辺と一致する。
  strategy: Expand the right-hand side after dividing by the nonzero leading coefficient.
  sketch:
  - 'setup: Assume a ≠ 0 so that b/(2a) is meaningful.'
  - 'derive: Expand a (x + b/(2a))² to a x² + b x + b²/(4a).'
  - 'conclude: Subtract (b² − 4ac)/(4a) = b²/(4a) − c to obtain a x² + b x + c.'
  openmath: (forall (a b c x) (-> (!= a 0) (= (+ (* a (^ x 2)) (* b x) c) (- (* a (^ (+ x (/ b (* 2 a))) 2)) (/ (- (^ b 2) (* 4 a c)) (* 4 a))))))
  hard_negative:
    statement: $a=0$でも同じ式が成り立つ。
    reason: $a=0$では$\frac{b}{2a}$が定義されない。平方完成は$a\neq 0$の2次式に対する変形である。
  target: |
    ∀ (a b c x : ℝ), a ≠ 0 → a * x ^ 2 + b * x + c = a * (x + b / (2 * a)) ^ 2 - (b ^ 2 - 4 * a * c) / (4 * a)
  proof: |
    by
      intro a b c x ha
      field_simp
      ring
- id: quadratic_min_at_vertex_unique
  kind: gap
  level: high
  topic: 二次関数・頂点と軸
  statement: $a>0$のとき、$ax^2+bx+c$の最小値は$\frac{4ac-b^2}{4a}$であり、この値をとる$x$は$x=-\frac{b}{2a}$だけである。
  statement_en: For a > 0, a x² + b x + c ≥ (4ac − b²)/(4a) for all real x, with equality exactly at x = −b/(2a).
  assumptions:
  - $a,b,c,x$は実数
  - $a>0$
  quantifiers:
  - 任意の実数$a,b,c,x$
  conclusion: $ax^2+bx+c\geq\frac{4ac-b^2}{4a}$であり、等号成立は$x=-\frac{b}{2a}$と同値である。
  answer: |
    $a,b,c,x$を実数とし、$a>0$とする。平方完成により$ax^2+bx+c-\frac{4ac-b^2}{4a}=a\left(x+\frac{b}{2a}\right)^2$である。右辺は$a>0$より$0$以上なので、不等式が従う。等号が成り立つのは$a\left(x+\frac{b}{2a}\right)^2=0$のときである。$a\neq 0$だから、これは$x+\frac{b}{2a}=0$、すなわち$x=-\frac{b}{2a}$と同値である。
  strategy: Write the difference from the claimed minimum as a times a square.
  sketch:
  - 'translate: Write a x² + b x + c − (4ac − b²)/(4a) as a (x + b/(2a))².'
  - 'derive: Since a > 0 the square term is nonnegative.'
  - 'derive: The term vanishes if and only if x + b/(2a) = 0.'
  - 'conclude: The minimum is attained exactly at x = −b/(2a).'
  openmath: (forall (a b c x) (-> (> a 0) (and (>= (+ (* a (^ x 2)) (* b x) c) (/ (- (* 4 a c) (^ b 2)) (* 4 a))) (<-> (= (+ (* a (^ x 2)) (* b x) c) (/ (- (* 4 a c) (^ b 2)) (* 4 a))) (= x (/ (neg b) (* 2 a)))))))
  hard_negative:
    statement: $a\neq 0$であれば、$ax^2+bx+c$は$x=-\frac{b}{2a}$で最小値をとる。
    reason: $a<0$では$x=-\frac{b}{2a}$は最大値を与え、最小値は存在しない。$a=-1,\ b=c=0$が反例である。
  target: |
    ∀ (a b c x : ℝ), 0 < a → (4 * a * c - b ^ 2) / (4 * a) ≤ a * x ^ 2 + b * x + c ∧ (a * x ^ 2 + b * x + c = (4 * a * c - b ^ 2) / (4 * a) ↔ x = -b / (2 * a))
  proof: |
    by
      intro a b c x ha
      have ha' : a ≠ 0 := ha.ne'
      have key : a * x ^ 2 + b * x + c - (4 * a * c - b ^ 2) / (4 * a) = a * (x + b / (2 * a)) ^ 2 := by
        field_simp
        ring
      constructor
      · have := mul_nonneg ha.le (sq_nonneg (x + b / (2 * a)))
        linarith
      · constructor
        · intro h
          have h0 : a * (x + b / (2 * a)) ^ 2 = 0 := by rw [← key, h, sub_self]
          have h1 : (x + b / (2 * a)) ^ 2 = 0 := (mul_eq_zero.1 h0).resolve_left ha'
          have h2 : x + b / (2 * a) = 0 := pow_eq_zero_iff (two_ne_zero) |>.1 h1
          rw [neg_div]
          linarith
        · intro h
          have h0 : x + b / (2 * a) = 0 := by
            rw [h, neg_div]
            ring
          have h1 := key
          rw [h0] at h1
          have h2 : a * (0 : ℝ) ^ 2 = 0 := by ring
          linarith
