- id: other_root_from_one_root
  kind: gap
  level: high
  topic: 二次方程式・解の公式
  statement: $a\neq 0$で$r$が$ax^2+bx+c=0$の解ならば、$ax^2+bx+c=a(x-r)\left(x-\left(-\frac{b}{a}-r\right)\right)$であり、もう一方の解は$-\frac{b}{a}-r$である。
  statement_en: If a ≠ 0 and a r² + b r + c = 0, then a x² + b x + c = a (x − r)(x − (−b/a − r)) for every real x, and the solutions of a x² + b x + c = 0 are exactly r and −b/a − r.
  assumptions:
