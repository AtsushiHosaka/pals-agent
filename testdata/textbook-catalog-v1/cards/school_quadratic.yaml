  conclusion: $(x-h)^2=k$と、$x=h+\sqrt{k}$または$x=h-\sqrt{k}$は同値である。
  answer: |
    $x,h,k$を実数とし、$k\geq 0$とする。$s=\sqrt{k}$とおくと$s^2=k$である。$(x-h)^2-k=(x-h-s)(x-h+s)$なので、$(x-h)^2=k$は$x-h=s$または$x-h=-s$と同値である。これは$x=h+s$または$x=h-s$と同じである。
  strategy: Write k as the square of its root and factor the difference of squares.
  sketch:
  - 'setup: Put s = √k, so s² = k.'
  - 'derive: (x − h)² − k = (x − h − s)(x − h + s).'
  - 'conclude: The product vanishes exactly when x = h + s or x = h − s.'
