- id: square_less_than_iff_between
  kind: gap
  level: high
  topic: 二次不等式
  statement: $k>0$のとき、$x^2<k$の解は$-\sqrt{k}<x<\sqrt{k}$である。
  statement_en: 'For k > 0: x² < k if and only if −√k < x < √k.'
  assumptions:
  - $k,x$は実数
  - $k>0$
  quantifiers:
  - 任意の実数$k,x$
  conclusion: $x^2<k$と$-\sqrt{k}<x<\sqrt{k}$は同値である。
  answer: |
    $k,x$を実数とし、$k>0$、$s=\sqrt{k}>0$とする。$s^2=k$なので、$x^2<k$は$(x-s)(x+s)<0$と同値である。$x+s>x-s$なので、積が負になるのは$x-s<0<x+s$のときである。これは$-s<x<s$である。
  strategy: Rewrite as a product of two linear factors using k = (√k)².
  sketch:
  - 'setup: Put s = √k > 0, so s² = k.'
  - 'translate: x² < k is equivalent to (x − s)(x + s) < 0.'
  - 'conclude: Since x − s < x + s, this holds exactly when −s < x < s.'
  openmath: (forall (k x) (-> (> k 0) (<-> (< (^ x 2) k) (and (< (neg (root k 2)) x) (< x (root k 2))))))
  hard_negative:
    statement: $k>0$のとき、$x^2<k$の解は$x<\sqrt{k}$である。
    reason: 下側の条件を落としている。$k=1,\ x=-2$は$x<\sqrt{k}$をみたすが、$x^2=4>1$である。
  target: |
    ∀ (k x : ℝ), 0 < k → (x ^ 2 < k ↔ -Real.sqrt k < x ∧ x < Real.sqrt k)
  proof: |
    by
      intro k x _
      exact Real.sq_lt
- id: inequality_solution_set_determines_coefficients
  kind: gap
  level: high
  topic: 二次不等式
  statement: $p<q$とする。$ax^2+bx+c<0$の解全体が開区間$(p,q)$に一致するならば、$a>0$、$b=-a(p+q)$、$c=apq$である。
  statement_en: If p < q and the solution set of a x² + b x + c < 0 is exactly the open interval (p, q), then a > 0, b = −a(p + q) and c = a p q.
  assumptions:
  - $a,b,c,p,q$は実数
  - $p<q$
  - $ax^2+bx+c<0$の解全体は$(p,q)$
  quantifiers:
  - 任意の実数$a,b,c,p,q$
  conclusion: $a>0$、$b=-a(p+q)$、$c=apq$である。
  answer: |
    $a,b,c,p,q$を実数とし、$p<q$、$f(x)=ax^2+bx+c$とする。$f(x)<0$の解全体が$(p,q)$であるとする。
    $f$は連続で、$(p,q)$上で$f<0$なので、閉区間$[p,q]$上で$f\leq 0$である。一方$p,q$は解ではないので$f(p)\geq 0$、$f(q)\geq 0$である。よって$f(p)=f(q)=0$である。
    $f(p)-f(q)=(p-q)\{a(p+q)+b\}=0$と$p\neq q$から$b=-a(p+q)$である。これを$f(p)=0$に代入して$c=apq$を得る。したがって$f(x)=a(x-p)(x-q)$である。
    中点$m=\frac{p+q}{2}$は解なので、$f(m)=-\frac{a(q-p)^2}{4}<0$である。よって$a>0$である。
  strategy: Show the endpoints are roots by continuity, compare coefficients, and test the midpoint for the sign of a.
  sketch:
  - 'derive: By continuity f ≤ 0 on the closure [p, q].'
  - 'derive: The endpoints are not solutions, so f(p) ≥ 0 and f(q) ≥ 0; hence both vanish.'
  - 'derive: Subtracting and cancelling p − q gives b = −a(p + q); then c = a p q.'
  - 'apply_theorem: The midpoint is a solution, so −a (q − p)²/4 < 0.'
  - 'conclude: Therefore a > 0.'
  openmath: (forall (a b c p q) (-> (and (< p q) (forall (x) (<-> (< (+ (* a (^ x 2)) (* b x) c) 0) (and (< p x) (< x q))))) (and (> a 0) (= b (neg (* a (+ p q)))) (= c (* a p q)))))
  hard_negative:
    statement: $ax^2+bx+c>0$の解全体が$(p,q)$であれば、$a>0$である。
    reason: 解が2解の間に来るのは上に凸のときである。$-(x-1)(x-2)>0$の解は$(1,2)$であり、$a=-1<0$である。
  target: |
    ∀ (a b c p q : ℝ), p < q → {x : ℝ | a * x ^ 2 + b * x + c < 0} = Set.Ioo p q → 0 < a ∧ b = -a * (p + q) ∧ c = a * p * q
  proof: |
    by
      intro a b c p q hpq hset
      have hcl : IsClosed {x : ℝ | a * x ^ 2 + b * x + c ≤ 0} := isClosed_le (by fun_prop) continuous_const
      have hsub : Set.Ioo p q ⊆ {x : ℝ | a * x ^ 2 + b * x + c ≤ 0} := by
        intro x hx
        rw [← hset] at hx
        exact (show a * x ^ 2 + b * x + c < 0 from hx).le
      have hIcc : Set.Icc p q ⊆ {x : ℝ | a * x ^ 2 + b * x + c ≤ 0} := by
        rw [← closure_Ioo hpq.ne]
        exact closure_minimal hsub hcl
      have hp1 : a * p ^ 2 + b * p + c ≤ 0 := hIcc (Set.left_mem_Icc.2 hpq.le)
      have hq1 : a * q ^ 2 + b * q + c ≤ 0 := hIcc (Set.right_mem_Icc.2 hpq.le)
      have hp2 : ¬ a * p ^ 2 + b * p + c < 0 := by
        intro h
        have h1 : p ∈ {x : ℝ | a * x ^ 2 + b * x + c < 0} := h
        rw [hset] at h1
        exact lt_irrefl _ h1.1
      have hq2 : ¬ a * q ^ 2 + b * q + c < 0 := by
        intro h
        have h1 : q ∈ {x : ℝ | a * x ^ 2 + b * x + c < 0} := h
        rw [hset] at h1
        exact lt_irrefl _ h1.2
      have hp0 : a * p ^ 2 + b * p + c = 0 := le_antisymm hp1 (not_lt.1 hp2)
      have hq0 : a * q ^ 2 + b * q + c = 0 := le_antisymm hq1 (not_lt.1 hq2)
      have h1 : a * (p + q) + b = 0 := mul_left_cancel₀ (sub_ne_zero.2 hpq.ne) (by linear_combination hp0 - hq0 : (p - q) * (a * (p + q) + b) = (p - q) * 0)
      have hb : b = -a * (p + q) := by linarith
      have hc : c = a * p * q := by linear_combination hp0 - p * h1
      refine ⟨?_, hb, hc⟩
      have hm : (p + q) / 2 ∈ {x : ℝ | a * x ^ 2 + b * x + c < 0} := by
        rw [hset]
        constructor <;> linarith
      have hm' : a * ((p + q) / 2) ^ 2 + b * ((p + q) / 2) + c < 0 := hm
      rw [hb, hc] at hm'
      by_contra hn
      have hn' : 0 ≤ -a := by linarith [not_lt.1 hn]
      have h2 := mul_nonneg hn' (sq_nonneg (q - p))
      nlinarith
- id: both_roots_greater_than_iff
  kind: textbook
  level: high
  topic: 二次方程式・解の配置
  statement: $a>0$のとき、すべての実数$x$で$ax^2+bx+c=a(x-p)(x-q)$となる実数$p,q$で、ともに$k$より大きいものが存在することは、$b^2-4ac\geq 0$、$k<-\frac{b}{2a}$、$ak^2+bk+c>0$がすべて成り立つことと同値である。
  statement_en: 'For a > 0: there exist real p, q > k with a x² + b x + c = a (x − p)(x − q) for all x if and only if b² − 4ac ≥ 0, k < −b/(2a) and a k² + b k + c > 0.'
  assumptions:
  - $a,b,c,k$は実数
  - $a>0$
  quantifiers:
  - 任意の実数$a,b,c,k$
  conclusion: 2つの実数解がともに$k$より大きいことと、判別式・軸・端点の値の3条件は同値である。
  answer: |
    $a,b,c,k$を実数とし、$a>0$、$f(x)=ax^2+bx+c$とする。
    すべての実数$x$で$f(x)=a(x-p)(x-q)$、$k<p$、$k<q$とする。係数を比べて$b=-a(p+q)$、$c=apq$である。よって$b^2-4ac=a^2(p-q)^2\geq 0$であり、$-\frac{b}{2a}=\frac{p+q}{2}>k$である。また$f(k)=a(p-k)(q-k)>0$である。
    逆に3条件を仮定する。$v=-\frac{b}{2a}$、$t=\frac{\sqrt{b^2-4ac}}{2a}\geq 0$とおくと、$b=-2av$、$c=a(v^2-t^2)$なので$f(x)=a\{x-(v-t)\}\{x-(v+t)\}$である。$p=v-t$、$q=v+t$とする。$q\geq v>k$である。$p\leq k$と仮定すると、$0<v-k\leq t$より$(k-v)^2\leq t^2$となり、$f(k)=a\{(k-v)^2-t^2\}\leq 0$となって矛盾する。よって$k<p$である。
  strategy: Compare coefficients for the forward direction; for the converse write the roots as v ± t and use the sign of f(k).
  sketch:
  - 'derive: A factorization gives b = −a(p + q) and c = a p q.'
  - 'derive: The three conditions follow from a²(p − q)² ≥ 0, (p + q)/2 > k and a(p − k)(q − k) > 0.'
  - 'construct: For the converse put v = −b/(2a), t = √(b²−4ac)/(2a), so f(x) = a(x − (v − t))(x − (v + t)).'
  - 'derive: The larger root v + t exceeds k because v > k and t ≥ 0.'
  - 'contradiction: If v − t ≤ k then (k − v)² ≤ t², so f(k) ≤ 0, contrary to the hypothesis.'
  openmath: (forall (a b c k) (-> (> a 0) (<-> (exists (p q) (and (forall (x) (= (+ (* a (^ x 2)) (* b x) c) (* a (- x p) (- x q)))) (< k p) (< k q))) (and (>= (- (^ b 2) (* 4 a c)) 0) (< k (/ (neg b) (* 2 a))) (> (+ (* a (^ k 2)) (* b k) c) 0)))))
  hard_negative:
    statement: $a>0$のとき、$b^2-4ac\geq 0$かつ$ak^2+bk+c>0$ならば、2解はともに$k$より大きい。
    reason: 軸の条件を落としている。$(x+2)(x+1)$は$k=0$で値$2>0$となるが、2解はともに$0$より小さい。
  target: |
    ∀ (a b c k : ℝ), 0 < a → ((∃ p q : ℝ, (∀ x : ℝ, a * x ^ 2 + b * x + c = a * (x - p) * (x - q)) ∧ k < p ∧ k < q) ↔ 0 ≤ b ^ 2 - 4 * a * c ∧ k < -b / (2 * a) ∧ 0 < a * k ^ 2 + b * k + c)
  proof: |
    by
      intro a b c k ha
      constructor
      · rintro ⟨p, q, h, hp, hq⟩
        have h0 := h 0
        have h1 := h 1
        have h2 := h (-1)
        have hb : b = -a * (p + q) := by linear_combination (1 / 2) * h1 - (1 / 2) * h2
        have hc : c = a * p * q := by linear_combination h0
        subst hb hc
        refine ⟨?_, ?_, ?_⟩
        · have e : (-a * (p + q)) ^ 2 - 4 * a * (a * p * q) = (a * (p - q)) ^ 2 := by ring
          rw [e]
          exact sq_nonneg _
        · rw [lt_div_iff₀ (by positivity)]
          nlinarith [mul_pos ha (sub_pos.2 hp), mul_pos ha (sub_pos.2 hq)]
        · have e := mul_pos ha (mul_pos (sub_pos.2 hp) (sub_pos.2 hq))
          nlinarith
      · rintro ⟨hD, hk, hf⟩
        obtain ⟨v, t, ht, hb, hc, hv⟩ : ∃ v t : ℝ, 0 ≤ t ∧ b = -2 * a * v ∧ c = a * (v ^ 2 - t ^ 2) ∧ v = -b / (2 * a) := by
          have hs2 := Real.sq_sqrt hD
          refine ⟨-b / (2 * a), |Real.sqrt (b ^ 2 - 4 * a * c) / (2 * a)|, abs_nonneg _, by field_simp, ?_, rfl⟩
          rw [sq_abs, div_pow, div_pow, hs2]
          field_simp
          ring
        rw [← hv] at hk
        clear hv hD
        subst hb hc
        refine ⟨v - t, v + t, fun x => by ring, ?_, by linarith⟩
        by_contra hcon
        push_neg at hcon
        have h1 := mul_nonneg (by linarith : 0 ≤ t - (v - k)) (by linarith : 0 ≤ t + (v - k))
        have h2 := mul_nonneg ha.le h1
        nlinarith
