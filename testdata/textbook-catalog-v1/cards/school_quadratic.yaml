    逆に有理数$s$が$s^2=b^2-4ac$をみたすとき、$x=\frac{-b+s}{2a}$は有理数である。$2ax+b=s$なので$4a(ax^2+bx+c)=s^2-(b^2-4ac)=0$となり、$4a\neq 0$より$x$は解である。
  strategy: Use the same identity over the rationals; s = 2ax + b is the witness in one direction and x = (−b+s)/(2a) in the other.
  sketch:
  - 'derive: Over Q, 4a(a x² + b x + c) = (2ax + b)² − (b² − 4ac).'
  - 'construct: A rational root x yields the rational square root s = 2ax + b.'
  - 'construct: A rational s with s² = b² − 4ac yields x = (−b + s)/(2a).'
  - 'conclude: Then 2ax + b = s, so x is a root because 4a ≠ 0.'
  openmath: (forall (a b c) (-> (and (in a Q) (in b Q) (in c Q) (!= a 0)) (<-> (exists (x) (and (in x Q) (= (+ (* a (^ x 2)) (* b x) c) 0))) (exists (s) (and (in s Q) (= (^ s 2) (- (^ b 2) (* 4 a c))))))))
  hard_negative:
    statement: $a,b,c$が実数でも、$ax^2+bx+c=0$が有理数解をもつことは、$b^2-4ac$が有理数の平方であることと同値である。
    reason: 係数が有理数であることが必要である。$x^2-\sqrt{2}\,x=0$は有理数解$0$をもつが、判別式は$2$で有理数の平方ではない。
  target: |
    ∀ (a b c : ℚ), a ≠ 0 → ((∃ x : ℚ, a * x ^ 2 + b * x + c = 0) ↔ ∃ s : ℚ, s ^ 2 = b ^ 2 - 4 * a * c)
  proof: |
    by
      intro a b c ha
      constructor
      · rintro ⟨x, hx⟩
        exact ⟨2 * a * x + b, by linear_combination (4 * a) * hx⟩
      · rintro ⟨s, hs⟩
        refine ⟨(-b + s) / (2 * a), ?_⟩
        have hx : 2 * a * ((-b + s) / (2 * a)) = -b + s := by field_simp
        generalize (-b + s) / (2 * a) = x at hx ⊢
        have h1 : (4 * a) * (a * x ^ 2 + b * x + c) = 0 := by
          linear_combination (2 * a * x + b + s) * hx + hs
        exact (mul_eq_zero.1 h1).resolve_left (mul_ne_zero (by norm_num) ha)
- id: odd_coefficients_no_rational_root
  kind: gap
  level: high
  topic: 二次方程式・判別式
  statement: $a,b,c$がすべて奇数の整数ならば、$ax^2+bx+c=0$は有理数解をもたない。
  statement_en: If a, b, c are odd integers, then a x² + b x + c = 0 has no rational solution.
  assumptions:
  - $a,b,c$は整数
  - $a,b,c$はすべて奇数
  quantifiers:
  - 任意の奇数$a,b,c$
  conclusion: $ax^2+bx+c=0$をみたす有理数$x$は存在しない。
  answer: |
    $a,b,c$を奇数の整数とする。有理数解$x$があるとして矛盾を導く。$x=\frac{n}{d}$と既約分数で表すと、分母を払って$an^2+bnd+cd^2=0$を得る。$n,d$は既約なのでともに偶数ではない。
    $n,d$がともに奇数なら、左辺は奇数を3つ足したものなので奇数である。$n$が偶数で$d$が奇数なら、$an^2$と$bnd$が偶数で$cd^2$が奇数なので奇数である。$n$が奇数で$d$が偶数なら、$an^2$が奇数で残りが偶数なので奇数である。
    どの場合も左辺は奇数であり、$0$に等しいことに矛盾する。
  strategy: Clear denominators in lowest terms and compare parities in each case.
  sketch:
  - 'setup: Suppose x = n/d in lowest terms is a root.'
  - 'translate: Clearing denominators gives a n² + b n d + c d² = 0 in the integers.'
  - 'derive: n and d are not both even because they are coprime.'
  - 'case_split: In each remaining parity case the left side is odd.'
  - 'contradiction: An odd integer cannot equal 0.'
  openmath: (forall (a b c) (-> (and (in a Z) (in b Z) (in c Z) (exists (u v w) (and (in u Z) (in v Z) (in w Z) (= a (+ (* 2 u) 1)) (= b (+ (* 2 v) 1)) (= c (+ (* 2 w) 1))))) (not (exists (x) (and (in x Q) (= (+ (* a (^ x 2)) (* b x) c) 0))))))
  hard_negative:
    statement: $a,b,c$がすべて奇数の整数ならば、$ax^2+bx+c=0$は実数解をもたない。
    reason: 有理数解がないだけで、実数解はありうる。$x^2+3x+1=0$は判別式が$5$なので、実数解をもつ。
  target: |
    ∀ (a b c : ℤ), Odd a → Odd b → Odd c → ¬ ∃ x : ℚ, (a : ℚ) * x ^ 2 + (b : ℚ) * x + (c : ℚ) = 0
  proof: |
    by
      rintro a b c ha hb hc ⟨x, hx⟩
      have hn : x * (x.den : ℚ) = (x.num : ℚ) := Rat.mul_den_eq_num x
      have hQ : (a : ℚ) * (x.num : ℚ) ^ 2 + (b : ℚ) * (x.num : ℚ) * ((x.den : ℤ) : ℚ) + (c : ℚ) * ((x.den : ℤ) : ℚ) ^ 2 = 0 := by
        push_cast
        linear_combination (x.den : ℚ) ^ 2 * hx - ((a : ℚ) * ((x.num : ℚ) + x * (x.den : ℚ)) + (b : ℚ) * (x.den : ℚ)) * hn
      have hZ : a * x.num ^ 2 + b * x.num * (x.den : ℤ) + c * (x.den : ℤ) ^ 2 = 0 := by
        exact_mod_cast hQ
      have hcop : ¬ (Even x.num ∧ Even (x.den : ℤ)) := by
        rintro ⟨h1, h2⟩
        have h3 : 2 ∣ x.num.natAbs := Int.natCast_dvd.1 (by exact_mod_cast h1.two_dvd)
        have h4 : 2 ∣ x.den := by exact_mod_cast h2.two_dvd
        have h5 := Nat.dvd_gcd h3 h4
        rw [x.reduced] at h5
        omega
      have ha' : ¬ Even a := Int.not_even_iff_odd.2 ha
      have hb' : ¬ Even b := Int.not_even_iff_odd.2 hb
      have hc' : ¬ Even c := Int.not_even_iff_odd.2 hc
      have he : Even (a * x.num ^ 2 + b * x.num * (x.den : ℤ) + c * (x.den : ℤ) ^ 2) := by
        rw [hZ]
        exact Even.zero
      simp only [Int.even_add, Int.even_mul, Int.even_pow, ha', hb', hc'] at he
      tauto
- id: conjugate_surd_root
  kind: gap
  level: high
  topic: 二次方程式・判別式
  statement: $a,b,c,u,v,d$が有理数で$\sqrt{d}$が無理数のとき、$u+v\sqrt{d}$が$ax^2+bx+c=0$の解ならば、$u-v\sqrt{d}$も解である。
  statement_en: 'For rational a, b, c, u, v, d with √d irrational: if u + v√d is a solution of a x² + b x + c = 0, then u − v√d is also a solution.'
  assumptions:
  - $a,b,c,u,v,d$は有理数
  - $\sqrt{d}$は無理数
  - $u+v\sqrt{d}$は$ax^2+bx+c=0$の解
  quantifiers:
  - 任意の有理数$a,b,c,u,v,d$
  conclusion: $u-v\sqrt{d}$も$ax^2+bx+c=0$の解である。
  answer: |
    $a,b,c,u,v,d$を有理数とし、$s=\sqrt{d}$が無理数で、$u+vs$が$ax^2+bx+c=0$の解であるとする。$s$が無理数なので$d\geq 0$であり、$s^2=d$である。代入して整理すると$A+Bs=0$となる。ここで$A=a(u^2+v^2d)+bu+c$、$B=2auv+bv$はともに有理数である。
    $B\neq 0$なら$s=-\frac{A}{B}$は有理数となり、$s$が無理数であることに反する。よって$B=0$であり、このとき$A=0$である。
    $u-vs$を代入した値は$A-Bs$であるから$0$となる。
  strategy: Split the value into a rational part and a rational multiple of the surd, and use irrationality to force both to vanish.
  sketch:
  - 'setup: Put s = √d. Irrationality forces d ≥ 0, so s² = d.'
  - 'translate: The equation becomes A + B s = 0 with A = a(u² + v² d) + b u + c and B = 2auv + bv rational.'
  - 'contradiction: If B ≠ 0 then s = −A/B would be rational.'
  - 'derive: Hence B = 0 and then A = 0.'
  - 'conclude: The value at u − v s equals A − B s = 0.'
  openmath: (forall (a b c u v d) (-> (and (in a Q) (in b Q) (in c Q) (in u Q) (in v Q) (in d Q) (notin (root d 2) Q) (= (+ (* a (^ (+ u (* v (root d 2))) 2)) (* b (+ u (* v (root d 2)))) c) 0)) (= (+ (* a (^ (- u (* v (root d 2))) 2)) (* b (- u (* v (root d 2)))) c) 0)))
  hard_negative:
    statement: $a,b,c$が実数でも、$u+v\sqrt{d}$が解なら$u-v\sqrt{d}$も解である。
    reason: 係数が有理数であることが必要である。$x^2-\sqrt{2}\,x=0$は$\sqrt{2}$を解にもつが、$x=-\sqrt{2}$を代入すると値は$4$であり、$-\sqrt{2}$は解ではない。
  target: |
    ∀ (a b c u v d : ℚ), Irrational (Real.sqrt (d : ℝ)) → (a : ℝ) * ((u : ℝ) + (v : ℝ) * Real.sqrt (d : ℝ)) ^ 2 + (b : ℝ) * ((u : ℝ) + (v : ℝ) * Real.sqrt (d : ℝ)) + (c : ℝ) = 0 → (a : ℝ) * ((u : ℝ) - (v : ℝ) * Real.sqrt (d : ℝ)) ^ 2 + (b : ℝ) * ((u : ℝ) - (v : ℝ) * Real.sqrt (d : ℝ)) + (c : ℝ) = 0
  proof: |
    by
      intro a b c u v d hirr h
      have hd : (0 : ℝ) ≤ (d : ℝ) := by
        by_contra hn
        push_neg at hn
        have h0 := Real.sqrt_eq_zero_of_nonpos hn.le
        rw [h0] at hirr
        exact not_irrational_zero hirr
      have hs := Real.sq_sqrt hd
      generalize Real.sqrt (d : ℝ) = s at hirr hs h ⊢
      obtain ⟨A, hA⟩ : ∃ A : ℚ, A = a * (u ^ 2 + v ^ 2 * d) + b * u + c := ⟨_, rfl⟩
      obtain ⟨B, hB⟩ : ∃ B : ℚ, B = 2 * a * u * v + b * v := ⟨_, rfl⟩
      have hA' : (A : ℝ) = (a : ℝ) * ((u : ℝ) ^ 2 + (v : ℝ) ^ 2 * (d : ℝ)) + (b : ℝ) * (u : ℝ) + (c : ℝ) := by
        rw [hA]
        push_cast
        ring
      have hB' : (B : ℝ) = 2 * (a : ℝ) * (u : ℝ) * (v : ℝ) + (b : ℝ) * (v : ℝ) := by
        rw [hB]
        push_cast
        ring
      have hrel : (A : ℝ) + (B : ℝ) * s = 0 := by
        rw [hA', hB']
        linear_combination h - (a : ℝ) * (v : ℝ) ^ 2 * hs
      have hB0 : B = 0 := by
        by_contra hne
        have hne' : (B : ℝ) ≠ 0 := by exact_mod_cast hne
        apply hirr
        refine ⟨-A / B, ?_⟩
        rw [Rat.cast_div, Rat.cast_neg, div_eq_iff hne']
        linarith
      have hB1 : (B : ℝ) = 0 := by exact_mod_cast hB0
      have hA1 : (A : ℝ) = 0 := by
        rw [hB1] at hrel
        linarith
      rw [hA'] at hA1
      rw [hB'] at hB1
      linear_combination hA1 - s * hB1 + (a : ℝ) * (v : ℝ) ^ 2 * hs
- id: root_difference_from_discriminant
  kind: gap
  level: high
  topic: 二次方程式・判別式
  statement: $a\neq 0$で$ax^2+bx+c=a(x-p)(x-q)$、$p\leq q$のとき、2解の差は$q-p=\frac{\sqrt{b^2-4ac}}{|a|}$である。これは放物線が$x$軸から切り取る線分の長さである。
  statement_en: If a ≠ 0, p ≤ q and a x² + b x + c = a (x − p)(x − q) for all real x, then q − p = √(b² − 4ac)/|a|.
  assumptions:
  - $a,b,c,p,q$は実数
  - $a\neq 0$
  - $p\leq q$
  - すべての実数$x$で$ax^2+bx+c=a(x-p)(x-q)$
  quantifiers:
  - 任意の実数$a,b,c,p,q$
  conclusion: $q-p=\frac{\sqrt{b^2-4ac}}{|a|}$である。
  answer: |
    $a,b,c,p,q$を実数とし、$a\neq 0$、$p\leq q$、すべての実数$x$で$ax^2+bx+c=a(x-p)(x-q)$とする。係数を比べると$b=-a(p+q)$、$c=apq$である。よって$b^2-4ac=a^2\{(p+q)^2-4pq\}=a^2(q-p)^2$となる。$|a|(q-p)\geq 0$なので$\sqrt{b^2-4ac}=|a|(q-p)$である。$|a|\neq 0$で割ると結論を得る。
  strategy: Compare coefficients, simplify the discriminant to a²(q−p)², and take a square root using q ≥ p.
  sketch:
  - 'derive: Comparing coefficients gives b = −a(p + q) and c = a p q.'
  - 'derive: Hence b² − 4ac = a²(q − p)².'
  - 'derive: Since |a|(q − p) ≥ 0, the square root equals |a|(q − p).'
  - 'conclude: Divide by |a| ≠ 0.'
  openmath: (forall (a b c p q) (-> (and (!= a 0) (<= p q) (forall (x) (= (+ (* a (^ x 2)) (* b x) c) (* a (- x p) (- x q))))) (= (- q p) (/ (root (- (^ b 2) (* 4 a c)) 2) (abs a)))))
  hard_negative:
    statement: 同じ条件で$q-p=\frac{\sqrt{b^2-4ac}}{a}$である。
    reason: $a<0$では右辺が負になる。$-x^2+1=-(x+1)(x-1)$では$q-p=2$だが、$\frac{\sqrt{4}}{-1}=-2$である。絶対値が必要である。
  target: |
    ∀ (a b c p q : ℝ), a ≠ 0 → p ≤ q → (∀ x : ℝ, a * x ^ 2 + b * x + c = a * (x - p) * (x - q)) → q - p = Real.sqrt (b ^ 2 - 4 * a * c) / |a|
  proof: |
    by
      intro a b c p q ha hpq h
      have h0 := h 0
      have h1 := h 1
      have h2 := h (-1)
      have hb : b = -a * (p + q) := by linear_combination (1 / 2) * h1 - (1 / 2) * h2
      have hc : c = a * p * q := by linear_combination h0
      have hD : b ^ 2 - 4 * a * c = (|a| * (q - p)) ^ 2 := by
        rw [mul_pow, sq_abs, hb, hc]
        ring
      have hne : |a| ≠ 0 := abs_ne_zero.2 ha
      rw [hD, Real.sqrt_sq (mul_nonneg (abs_nonneg a) (sub_nonneg.2 hpq))]
      exact (mul_div_cancel_left₀ _ hne).symm
- id: quadratic_positive_everywhere_iff
  kind: textbook
  level: high
  topic: 二次関数・グラフとx軸の位置関係
  statement: $a\neq 0$のとき、すべての実数$x$で$ax^2+bx+c>0$となることは、$a>0$かつ$b^2-4ac<0$と同値である。
  statement_en: For a ≠ 0, a x² + b x + c > 0 for every real x if and only if a > 0 and b² − 4ac < 0.
  assumptions:
  - $a,b,c$は実数
  - $a\neq 0$
  quantifiers:
  - 任意の実数$a,b,c$
  conclusion: すべての実数$x$で正であることと、$a>0$かつ$b^2-4ac<0$は同値である。
  answer: |
    $a,b,c$を実数とし、$a\neq 0$とする。すべての$x$で$ax^2+bx+c>0$とする。$x=0$から$c>0$である。$a<0$と仮定し、$t=\sqrt{\frac{c}{-a}}$とおく。$x=t$と$x=-t$での値の和は$2(at^2+c)=0$となり、ともに正であることに矛盾する。よって$a>0$である。次に$x=-\frac{b}{2a}$での値は$\frac{4ac-b^2}{4a}$であり、これが正で$a>0$だから$b^2-4ac<0$である。
    逆に$a>0$、$b^2-4ac<0$とする。$4a(ax^2+bx+c)=(2ax+b)^2-(b^2-4ac)>0$であり、$4a>0$なので$ax^2+bx+c>0$である。
  strategy: Test x = 0 and ±t to get the sign of a, test the vertex for the discriminant, and use the square identity for the converse.
  sketch:
  - 'derive: x = 0 gives c > 0.'
  - 'contradiction: If a < 0, take t = √(c/(−a)); the values at ±t add up to 2(a t² + c) = 0, contradicting positivity.'
  - 'derive: The value at x = −b/(2a) is (4ac − b²)/(4a) > 0, so b² − 4ac < 0.'
  - 'derive: Conversely 4a f(x) = (2ax + b)² − (b² − 4ac) > 0.'
  - 'conclude: Since 4a > 0, f(x) > 0 for every x.'
  openmath: (forall (a b c) (-> (!= a 0) (<-> (forall (x) (> (+ (* a (^ x 2)) (* b x) c) 0)) (and (> a 0) (< (- (^ b 2) (* 4 a c)) 0)))))
  hard_negative:
    statement: すべての実数$x$で$ax^2+bx+c>0$となることは、$a,b,c$によらず$a>0$かつ$b^2-4ac<0$と同値である。
    reason: $a=0$を許すと成り立たない。$a=b=0,\ c=1$では値はつねに正だが、$a>0$ではない。
  target: |
    ∀ (a b c : ℝ), a ≠ 0 → ((∀ x : ℝ, 0 < a * x ^ 2 + b * x + c) ↔ 0 < a ∧ b ^ 2 - 4 * a * c < 0)
  proof: |
    by
      intro a b c ha
      constructor
      · intro h
        have hc : 0 < c := by simpa using h 0
        have hapos : 0 < a := by
          by_contra hn
          have hneg : a < 0 := lt_of_le_of_ne (not_lt.1 hn) ha
          have hq : 0 ≤ c / (-a) := div_nonneg hc.le (by linarith)
          have hs := Real.sq_sqrt hq
          generalize Real.sqrt (c / (-a)) = t at hs
          have h1 := h t
          have h2 := h (-t)
          have h3 : a * t ^ 2 = -c := by
            rw [hs]
            field_simp
          nlinarith
        refine ⟨hapos, ?_⟩
        have h4 := h (-b / (2 * a))
        have e : 4 * a * (a * (-b / (2 * a)) ^ 2 + b * (-b / (2 * a)) + c) = -(b ^ 2 - 4 * a * c) := by
          field_simp
          ring
        have h5 := mul_pos (by positivity : 0 < 4 * a) h4
        linarith
      · rintro ⟨hapos, hD⟩ x
        have e : 4 * a * (a * x ^ 2 + b * x + c) = (2 * a * x + b) ^ 2 - (b ^ 2 - 4 * a * c) := by ring
        have h1 : 0 < 4 * a * (a * x ^ 2 + b * x + c) := by
          rw [e]
          nlinarith [sq_nonneg (2 * a * x + b)]
        exact (mul_pos_iff_of_pos_left (by positivity)).1 h1
- id: quadratic_nonneg_everywhere_iff_general
  kind: gap
  level: high
  topic: 二次関数・グラフとx軸の位置関係
  statement: $a=0$の場合も含めて、すべての実数$x$で$ax^2+bx+c\geq 0$となることは、「$a=b=0$かつ$c\geq 0$」または「$a>0$かつ$b^2-4ac\leq 0$」と同値である。
  statement_en: 'Without assuming a ≠ 0: a x² + b x + c ≥ 0 for every real x if and only if either a = b = 0 and c ≥ 0, or a > 0 and b² − 4ac ≤ 0.'
  assumptions:
  - $a,b,c$は実数
  quantifiers:
  - 任意の実数$a,b,c$
  conclusion: すべての実数$x$で$0$以上であることと、「$a=b=0$かつ$c\geq 0$」または「$a>0$かつ$b^2-4ac\leq 0$」は同値である。
  answer: |
    $a,b,c$を実数とする。すべての$x$で$ax^2+bx+c\geq 0$とする。$x=0$から$c\geq 0$である。
    $a<0$と仮定し、$t=\sqrt{\frac{c+1}{-a}}$とおく。$x=\pm t$での値の和は$2(at^2+c)=-2$となり、ともに$0$以上であることに矛盾する。よって$a\geq 0$である。
    $a=0$のとき、$b\neq 0$なら$x=-\frac{c+1}{b}$での値が$-1$となって矛盾するので、$b=0$である。
    $a>0$のとき、$x=-\frac{b}{2a}$での値$\frac{4ac-b^2}{4a}$が$0$以上なので$b^2-4ac\leq 0$である。
    逆を示す。$a=b=0$、$c\geq 0$なら値はつねに$c\geq 0$である。$a>0$、$b^2-4ac\leq 0$なら、$4a(ax^2+bx+c)=(2ax+b)^2-(b^2-4ac)\geq 0$と$4a>0$より$ax^2+bx+c\geq 0$である。
  strategy: Rule out a < 0 by symmetric test points, treat the degenerate linear case, and test the vertex when a > 0.
  sketch:
  - 'derive: x = 0 gives c ≥ 0.'
  - 'contradiction: If a < 0, take t = √((c+1)/(−a)); the values at ±t add up to −2.'
  - 'case_split: If a = 0 and b ≠ 0, the value at −(c+1)/b is −1, so b = 0.'
  - 'case_split: If a > 0, the vertex value gives b² − 4ac ≤ 0.'
  - 'conclude: The converse follows from 4a f(x) = (2ax + b)² − (b² − 4ac).'
  openmath: (forall (a b c) (<-> (forall (x) (>= (+ (* a (^ x 2)) (* b x) c) 0)) (or (and (= a 0) (= b 0) (>= c 0)) (and (> a 0) (<= (- (^ b 2) (* 4 a c)) 0)))))
  hard_negative:
    statement: すべての実数$x$で$ax^2+bx+c\geq 0$となることは、$a>0$かつ$b^2-4ac\leq 0$と同値である。
    reason: 定数の場合を落としている。$a=b=0,\ c=1$は不等式をみたすが、$a>0$ではない。
  target: |
    ∀ (a b c : ℝ), (∀ x : ℝ, 0 ≤ a * x ^ 2 + b * x + c) ↔ (a = 0 ∧ b = 0 ∧ 0 ≤ c) ∨ (0 < a ∧ b ^ 2 - 4 * a * c ≤ 0)
  proof: |
    by
      intro a b c
      constructor
      · intro h
        have hc : 0 ≤ c := by simpa using h 0
        rcases lt_trichotomy a 0 with hneg | rfl | hpos
        · exfalso
          have hq : 0 ≤ (c + 1) / (-a) := div_nonneg (by linarith) (by linarith)
          have hs := Real.sq_sqrt hq
          generalize Real.sqrt ((c + 1) / (-a)) = t at hs
          have h1 := h t
          have h2 := h (-t)
          have h3 : a * t ^ 2 = -(c + 1) := by
            rw [hs]
            field_simp [hneg.ne]
          nlinarith
        · left
          refine ⟨rfl, ?_, hc⟩
          by_contra hb
          have h1 := h (-(c + 1) / b)
          have e : (0 : ℝ) * (-(c + 1) / b) ^ 2 + b * (-(c + 1) / b) + c = -1 := by
            field_simp
            ring
          linarith
        · right
          refine ⟨hpos, ?_⟩
          have h4 := h (-b / (2 * a))
          have e : 4 * a * (a * (-b / (2 * a)) ^ 2 + b * (-b / (2 * a)) + c) = -(b ^ 2 - 4 * a * c) := by
            field_simp
            ring
          have h5 := mul_nonneg (by positivity : 0 ≤ 4 * a) h4
          linarith
      · rintro (⟨rfl, rfl, hc⟩ | ⟨hpos, hD⟩) x
        · simpa using hc
        · have e : 4 * a * (a * x ^ 2 + b * x + c) = (2 * a * x + b) ^ 2 - (b ^ 2 - 4 * a * c) := by ring
          have h1 : 0 ≤ 4 * a * (a * x ^ 2 + b * x + c) := by
            rw [e]
            nlinarith [sq_nonneg (2 * a * x + b)]
          by_contra hn
          push_neg at hn
          have h2 := mul_neg_of_pos_of_neg (by positivity : 0 < 4 * a) hn
          linarith
- id: homogeneous_quadratic_positive_definite_iff
  kind: textbook
  level: high
  topic: 二次関数・グラフとx軸の位置関係
  statement: $(x,y)\neq(0,0)$であるすべての実数$x,y$で$ax^2+bxy+cy^2>0$となることは、$a>0$かつ$b^2-4ac<0$と同値である。
  statement_en: a x² + b x y + c y² > 0 for all real (x, y) ≠ (0, 0) if and only if a > 0 and b² − 4ac < 0.
  assumptions:
  - $a,b,c$は実数
  quantifiers:
  - 任意の実数$a,b,c$
  conclusion: 原点以外で正であることと、$a>0$かつ$b^2-4ac<0$は同値である。
  answer: |
    $a,b,c$を実数とする。原点以外のすべての$(x,y)$で$ax^2+bxy+cy^2>0$とする。$(x,y)=(1,0)$から$a>0$である。$(x,y)=\left(-\frac{b}{2a},1\right)$での値は$\frac{4ac-b^2}{4a}$であり、これが正なので$b^2-4ac<0$である。
    逆に$a>0$、$b^2-4ac<0$とする。任意の$x,y$について$4a(ax^2+bxy+cy^2)=(2ax+by)^2+(4ac-b^2)y^2$である。$y\neq 0$なら第2項が正なので右辺は正である。$y=0$なら$x\neq 0$であり、右辺は$(2ax)^2>0$である。$4a>0$より$ax^2+bxy+cy^2>0$となる。
  strategy: Test (1, 0) and (−b/(2a), 1), and complete the square in x for the converse.
  sketch:
  - 'derive: Testing (1, 0) gives a > 0.'
  - 'derive: Testing (−b/(2a), 1) gives (4ac − b²)/(4a) > 0.'
  - 'translate: 4a(a x² + b x y + c y²) = (2ax + by)² + (4ac − b²) y².'
  - 'case_split: If y ≠ 0 the second term is positive; if y = 0 then x ≠ 0 and the first term is positive.'
  - 'conclude: Since 4a > 0, the form is positive off the origin.'
  openmath: (forall (a b c) (<-> (forall (x y) (-> (or (!= x 0) (!= y 0)) (> (+ (* a (^ x 2)) (* b x y) (* c (^ y 2))) 0))) (and (> a 0) (< (- (^ b 2) (* 4 a c)) 0))))
  hard_negative:
    statement: 原点以外で$ax^2+bxy+cy^2>0$となることは、$a>0$かつ$c>0$と同値である。
    reason: $a>0$かつ$c>0$だけでは足りない。$x^2+3xy+y^2$は$(x,y)=(1,-1)$で$-1$である。
  target: |
    ∀ (a b c : ℝ), (∀ x y : ℝ, (x ≠ 0 ∨ y ≠ 0) → 0 < a * x ^ 2 + b * x * y + c * y ^ 2) ↔ 0 < a ∧ b ^ 2 - 4 * a * c < 0
  proof: |
    by
      intro a b c
      constructor
      · intro h
        have ha : 0 < a := by simpa using h 1 0 (Or.inl one_ne_zero)
        refine ⟨ha, ?_⟩
        have h1 := h (-b / (2 * a)) 1 (Or.inr one_ne_zero)
        have e : 4 * a * (a * (-b / (2 * a)) ^ 2 + b * (-b / (2 * a)) * 1 + c * 1 ^ 2) = -(b ^ 2 - 4 * a * c) := by
          field_simp
          ring
        have h2 := mul_pos (by positivity : 0 < 4 * a) h1
        linarith
      · rintro ⟨ha, hD⟩ x y hxy
        have key : 4 * a * (a * x ^ 2 + b * x * y + c * y ^ 2) = (2 * a * x + b * y) ^ 2 + (4 * a * c - b ^ 2) * y ^ 2 := by ring
        have h1 : 0 < 4 * a * (a * x ^ 2 + b * x * y + c * y ^ 2) := by
          rw [key]
          by_cases hy : y = 0
          · subst hy
            have hx : x ≠ 0 := hxy.resolve_right (not_not.2 rfl)
            have h2 : 2 * a * x + b * 0 ≠ 0 := by
              simp [ha.ne', hx]
            have h3 := sq_pos_iff.2 h2
            nlinarith
          · have h3 : 0 < y ^ 2 := sq_pos_iff.2 hy
            have h4 := mul_pos (by linarith : 0 < 4 * a * c - b ^ 2) h3
            nlinarith [sq_nonneg (2 * a * x + b * y)]
        exact (mul_pos_iff_of_pos_left (by positivity)).1 h1
- id: parabola_line_tangent_iff_discriminant
  kind: gap
  level: high
  topic: 二次関数・放物線と直線
  statement: $a\neq 0$のとき、放物線$y=ax^2+bx+c$と直線$y=mx+n$の共有点がちょうど1つであることは、$(b-m)^2-4a(c-n)=0$と同値である。
  statement_en: For a ≠ 0, the parabola y = a x² + b x + c and the line y = m x + n meet in exactly one point if and only if (b − m)² − 4a(c − n) = 0.
  assumptions:
  - $a,b,c,m,n$は実数
  - $a\neq 0$
  quantifiers:
  - 任意の実数$a,b,c,m,n$
  conclusion: 共有点がちょうど1つであることと、$(b-m)^2-4a(c-n)=0$は同値である。
  answer: |
    $a,b,c,m,n$を実数とし、$a\neq 0$とする。共有点の$x$座標は$ax^2+bx+c=mx+n$、すなわち$ax^2+(b-m)x+(c-n)=0$の実数解である。$B=b-m$、$C=c-n$とおく。
    実数解がちょうど1つで、それを$r$とする。$C=-ar^2-Br$を代入すると$ax^2+Bx+C=(x-r)\{a(x+r)+B\}$となるので、$-\frac{B}{a}-r$も解である。一意性から$-\frac{B}{a}-r=r$、すなわち$2ar+B=0$である。$r$が解であることから$B^2-4aC=(2ar+B)^2=0$となる。
    逆に$B^2-4aC=0$なら$4a(ax^2+Bx+C)=(2ax+B)^2$なので、解は$x=-\frac{B}{2a}$だけである。
  strategy: Reduce to the uniqueness of a real root of the difference and apply the discriminant criterion.
  sketch:
  - 'translate: A common point corresponds to a real solution of a x² + (b − m) x + (c − n) = 0.'
  - 'apply_theorem: This quadratic has a unique real root exactly when its discriminant vanishes.'
  - 'conclude: The discriminant is (b − m)² − 4a(c − n).'
  openmath: (forall (a b c m n) (-> (!= a 0) (<-> (exists (r) (and (= (+ (* a (^ r 2)) (* b r) c) (+ (* m r) n)) (forall (x) (-> (= (+ (* a (^ x 2)) (* b x) c) (+ (* m x) n)) (= x r))))) (= (- (^ (- b m) 2) (* 4 a (- c n))) 0))))
  hard_negative:
    statement: $a\neq 0$のとき、放物線と直線の共有点がちょうど1つであることは、$b^2-4ac=0$と同値である。
    reason: 判別式は放物線の係数だけでなく差の2次式について取る。$y=x^2+1$と$y=2x$は$x=1$で接するが、$b^2-4ac=-4$である。
  target: |
    ∀ (a b c m n : ℝ), a ≠ 0 → ((∃! x : ℝ, a * x ^ 2 + b * x + c = m * x + n) ↔ (b - m) ^ 2 - 4 * a * (c - n) = 0)
  proof: |
    by
      intro a b c m n ha
      have e : (∃! x : ℝ, a * x ^ 2 + b * x + c = m * x + n) ↔ ∃! x : ℝ, a * (x * x) + (b - m) * x + (c - n) = 0 := by
        apply existsUnique_congr
        intro x
        constructor
        · intro h
          linear_combination h
        · intro h
          linear_combination h
      rw [e]
      exact (discrim_eq_zero_iff ha).symm
- id: parabola_above_tangent_line
  kind: gap
  level: high
  topic: 二次関数・放物線と直線
  statement: $a>0$のとき、放物線$y=ax^2+bx+c$は$x=p$での接線$y=ap^2+bp+c+(2ap+b)(x-p)$より下にはなく、接点以外では真に上にある。
  statement_en: 'For a > 0: a p² + b p + c + (2ap + b)(x − p) ≤ a x² + b x + c for all real x, p, with equality exactly at x = p.'
  assumptions:
  - $a,b,c,p,x$は実数
  - $a>0$
  quantifiers:
  - 任意の実数$a,b,c,p,x$
  conclusion: $ap^2+bp+c+(2ap+b)(x-p)\leq ax^2+bx+c$であり、等号成立は$x=p$と同値である。
  answer: |
    $a,b,c,p,x$を実数とし、$a>0$とする。展開すると、$(ax^2+bx+c)-\{ap^2+bp+c+(2ap+b)(x-p)\}=a(x-p)^2$である。$a>0$より右辺は$0$以上なので、不等式が成り立つ。等号は$a(x-p)^2=0$のときで、$a\neq 0$より$x=p$と同値である。
  strategy: Show that the gap between the parabola and the line equals a (x − p)².
  sketch:
  - 'derive: The difference between the parabola and the line is a (x − p)².'
  - 'derive: Since a > 0, this is nonnegative.'
  - 'conclude: It vanishes if and only if x = p.'
  openmath: (forall (a b c p x) (-> (> a 0) (and (<= (+ (+ (* a (^ p 2)) (* b p) c) (* (+ (* 2 a p) b) (- x p))) (+ (* a (^ x 2)) (* b x) c)) (<-> (= (+ (+ (* a (^ p 2)) (* b p) c) (* (+ (* 2 a p) b) (- x p))) (+ (* a (^ x 2)) (* b x) c)) (= x p)))))
  hard_negative:
    statement: $a\neq 0$であれば、放物線は接線より下にはない。
    reason: $a<0$では逆に、放物線は接線より上にはない。差は$a(x-p)^2$で、符号は$a$で決まる。
  target: |
    ∀ (a b c p x : ℝ), 0 < a → a * p ^ 2 + b * p + c + (2 * a * p + b) * (x - p) ≤ a * x ^ 2 + b * x + c ∧ (a * p ^ 2 + b * p + c + (2 * a * p + b) * (x - p) = a * x ^ 2 + b * x + c ↔ x = p)
  proof: |
    by
      intro a b c p x ha
      have e : a * x ^ 2 + b * x + c - (a * p ^ 2 + b * p + c + (2 * a * p + b) * (x - p)) = a * (x - p) ^ 2 := by ring
      constructor
      · have := mul_nonneg ha.le (sq_nonneg (x - p))
        linarith
      · constructor
        · intro h
          have h0 : a * (x - p) ^ 2 = 0 := by linarith
          have h1 : (x - p) ^ 2 = 0 := (mul_eq_zero.1 h0).resolve_left ha.ne'
          have h2 : x - p = 0 := pow_eq_zero_iff (two_ne_zero) |>.1 h1
          linarith
        · rintro rfl
          ring
- id: parabola_chord_slope
  kind: gap
  level: high
  topic: 二次関数・放物線と直線
  statement: $p\neq q$のとき、放物線$y=ax^2+bx+c$上の$x=p,q$の2点を結ぶ直線の傾きは$a(p+q)+b$である。
  statement_en: If p ≠ q, the slope of the chord of y = a x² + b x + c between x = p and x = q is a (p + q) + b.
  assumptions:
  - $a,b,c,p,q$は実数
  - $p\neq q$
  quantifiers:
  - 任意の実数$a,b,c,p,q$
  conclusion: $\frac{(aq^2+bq+c)-(ap^2+bp+c)}{q-p}=a(p+q)+b$である。
  answer: |
    $a,b,c,p,q$を実数とし、$p\neq q$とする。分子を因数分解すると$a(q^2-p^2)+b(q-p)=(q-p)\{a(p+q)+b\}$である。$q-p\neq 0$で割ると、傾きは$a(p+q)+b$となる。
  strategy: Factor q − p out of the numerator and cancel.
  sketch:
  - 'derive: The numerator equals (q − p)(a(p + q) + b).'
  - 'conclude: Cancel q − p ≠ 0.'
