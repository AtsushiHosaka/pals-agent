    $a,b,c,p,q$を実数とし、$a\neq 0$とする。すべての$x$で$ax^2+bx+c=a(x-p)(x-q)$とする。右辺は$ax^2-a(p+q)x+apq$である。$x=0$を代入して$c=apq$を得る。$x=1$と$x=-1$を代入した式の差から$b=-a(p+q)$を得る。$a$で割ると$p+q=-\frac{b}{a}$、$pq=\frac{c}{a}$である。
