  strategy: Compare coefficients of the factorized form in one direction and expand in the other.
  sketch:
  - 'derive: Expanding gives a x² − a(p + q) x + a p q.'
  - 'apply_theorem: Substituting x = 0 and x = ±1 gives c = a p q and b = −a(p + q).'
  - 'derive: Dividing by a gives the sum and product.'
  - 'conclude: Conversely, substitute b and c back and factor.'
  openmath: (forall (a b c p q) (-> (!= a 0) (<-> (forall (x) (= (+ (* a (^ x 2)) (* b x) c) (* a (- x p) (- x q)))) (and (= (+ p q) (/ (neg b) a)) (= (* p q) (/ c a))))))
  hard_negative:
    statement: $ax^2+bx+c=a(x-p)(x-q)$ならば、$p+q=\frac{b}{a}$である。
    reason: 符号が逆である。$x^2-3x+2=(x-1)(x-2)$では$p+q=3$だが、$\frac{b}{a}=-3$である。
  target: |
    ∀ (a b c p q : ℝ), a ≠ 0 → ((∀ x : ℝ, a * x ^ 2 + b * x + c = a * (x - p) * (x - q)) ↔ p + q = -b / a ∧ p * q = c / a)
