  openmath: (forall (a b c x) (-> (< a 0) (and (<= (+ (* a (^ x 2)) (* b x) c) (/ (- (* 4 a c) (^ b 2)) (* 4 a))) (<-> (= (+ (* a (^ x 2)) (* b x) c) (/ (- (* 4 a c) (^ b 2)) (* 4 a))) (= x (/ (neg b) (* 2 a)))))))
