  level: high
  topic: 三角関数・置き換えと値域
  statement: 実数値関数$f$と実数$y$について、$f(\sin x)=y$をみたす実数$x$が存在することは、$-1\leq t\leq1$かつ$f(t)=y$をみたす実数$t$が存在することと同値である。$\cos$についても同じである。
