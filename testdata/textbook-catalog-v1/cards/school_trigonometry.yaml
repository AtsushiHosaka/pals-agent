  - $y$は実数
  quantifiers:
  - 任意の実数値関数$f$と実数$y$
  conclusion: $f(\sin x)$と$f(\cos x)$の値域は$f$の区間$[-1,1]$での値域に等しい。
  answer: |
    $f$を実数値関数、$y$を実数とする。$f(\sin x)=y$となる$x$があれば、$t=\sin x$は$-1\leq t\leq1$と$f(t)=y$をみたす。逆に$-1\leq t\leq1$かつ$f(t)=y$となる$t$があるとする。$\sin$は連続で$\sin(-\pi/2)=-1$、$\sin(\pi/2)=1$であるから、中間値の定理により$\sin x=t$となる$x$がとれる。この$x$について$f(\sin x)=y$である。$\cos$については$\cos0=1$、$\cos\pi=-1$を用いて同様に示せる。
