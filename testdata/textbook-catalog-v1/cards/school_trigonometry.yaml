- id: sin_sq_add_cos_sq
  kind: named
  level: high
  topic: 三角比・基本の相互関係
  statement: 任意の実数$x$について$\sin^2x+\cos^2x=1$である。
  statement_en: For every real x, sin²x + cos²x = 1.
  assumptions:
  - $x$は実数
  quantifiers:
  - 任意の実数$x$
  conclusion: $\sin^2x+\cos^2x=1$が成り立つ。
  answer: |
    $x$を実数とする。$\cos x,\sin x$は、角$x$の動径と単位円$u^2+v^2=1$の交点の座標$(u,v)=(\cos x,\sin x)$として定義される。この点は単位円上にあるので、円の方程式に代入すると$\cos^2x+\sin^2x=1$を得る。
  strategy: Substitute the unit-circle coordinates of the angle into the circle equation.
  sketch:
  - 'setup: Take the point of the unit circle at angle x, whose coordinates are (cos x, sin x).'
  - 'conclude: Substituting the coordinates into u² + v² = 1 gives the identity.'
  openmath: (forall (x) (= (+ (^ (sin x) 2) (^ (cos x) 2)) 1))
  hard_negative:
    statement: 任意の実数$x$について$\sin x+\cos x=1$である。
    reason: $x=\pi/4$では左辺は$\sqrt{2}$である。成り立つのは平方の和についてである。
  target: |
    ∀ x : ℝ, Real.sin x ^ 2 + Real.cos x ^ 2 = 1
  proof: |
    by
      intro x
      exact Real.sin_sq_add_cos_sq x
- id: one_add_tan_sq
  kind: textbook
  level: high
  topic: 三角比・基本の相互関係
  statement: 実数$x$が$\cos x\neq0$をみたすとき、$1+\tan^2x=\dfrac{1}{\cos^2x}$である。
  statement_en: If x is real and cos x ≠ 0, then 1 + tan²x = 1/cos²x.
  assumptions:
  - $x$は実数
  - $\cos x\neq0$
  quantifiers:
  - $\cos x\neq0$をみたす任意の実数$x$
  conclusion: $1+\tan^2x=1/\cos^2x$が成り立つ。
  answer: |
    $x$を$\cos x\neq0$をみたす実数とする。$\tan x=\sin x/\cos x$であるから
    $1+\tan^2x=\frac{\cos^2x+\sin^2x}{\cos^2x}=\frac{1}{\cos^2x}$
    である。最後の等号には$\sin^2x+\cos^2x=1$を用いた。
  strategy: Rewrite tan as sin over cos, put the sum over cos², and apply the Pythagorean identity.
  sketch:
  - 'setup: Assume cos x ≠ 0 so that tan x = sin x / cos x.'
  - 'derive: 1 + tan²x = (cos²x + sin²x) / cos²x.'
  - 'conclude: The numerator equals 1.'
  openmath: (forall (x) (-> (!= (cos x) 0) (= (+ 1 (^ (tan x) 2)) (/ 1 (^ (cos x) 2)))))
  hard_negative:
    statement: 実数$x$が$\cos x\neq0$をみたすとき、$1-\tan^2x=\dfrac{1}{\cos^2x}$である。
    reason: $x=\pi/4$では左辺は$0$、右辺は$2$である。
  target: |
    ∀ x : ℝ, Real.cos x ≠ 0 → 1 + Real.tan x ^ 2 = 1 / Real.cos x ^ 2
  proof: |
    by
      intro x hx
      have h := Real.sin_sq_add_cos_sq x
      rw [Real.tan_eq_sin_div_cos]
      field_simp
      linarith
- id: sin_mul_cos_of_add_eq
  kind: gap
  level: high
  topic: 三角関数・和と積の置き換え
  statement: 実数$x,t$が$\sin x+\cos x=t$をみたすとき、$\sin x\cos x=\dfrac{t^2-1}{2}$である。
  statement_en: If x and t are real and sin x + cos x = t, then sin x cos x = (t² - 1)/2.
  assumptions:
  - $x,t$は実数
  - $\sin x+\cos x=t$
  quantifiers:
  - $\sin x+\cos x=t$をみたす任意の実数$x,t$
  conclusion: $\sin x\cos x=(t^2-1)/2$が成り立つ。
  answer: |
    $x,t$を$\sin x+\cos x=t$をみたす実数とする。両辺を2乗すると$\sin^2x+2\sin x\cos x+\cos^2x=t^2$である。$\sin^2x+\cos^2x=1$を代入すると$1+2\sin x\cos x=t^2$となり、$\sin x\cos x=(t^2-1)/2$を得る。
  strategy: Square the defining relation and eliminate sin²x + cos²x.
  sketch:
  - 'setup: Assume sin x + cos x = t.'
  - 'derive: Squaring gives sin²x + 2 sin x cos x + cos²x = t².'
  - 'apply_theorem: Replace sin²x + cos²x by 1.'
  - 'conclude: Solve for sin x cos x.'
  openmath: (forall (x t) (-> (= (+ (sin x) (cos x)) t) (= (* (sin x) (cos x)) (/ (- (^ t 2) 1) 2))))
  hard_negative:
    statement: 実数$x,t$が$\sin x-\cos x=t$をみたすとき、$\sin x\cos x=\dfrac{t^2-1}{2}$である。
    reason: $x=\pi/4$では$t=0$であり、左辺は$1/2$、右辺は$-1/2$である。差の場合は$(1-t^2)/2$になる。
  target: |
    ∀ x t : ℝ, Real.sin x + Real.cos x = t → Real.sin x * Real.cos x = (t ^ 2 - 1) / 2
  proof: |
    by
      intro x t ht
      subst ht
      linear_combination (-1 / 2) * Real.sin_sq_add_cos_sq x
- id: sin_cos_bounds
  kind: textbook
  level: high
  topic: 三角関数・値域
  statement: 任意の実数$x$について$-1\leq\sin x\leq1$かつ$-1\leq\cos x\leq1$である。
  statement_en: For every real x, -1 ≤ sin x ≤ 1 and -1 ≤ cos x ≤ 1.
  assumptions:
  - $x$は実数
  quantifiers:
  - 任意の実数$x$
  conclusion: $\sin x$と$\cos x$はともに$-1$以上$1$以下である。
  answer: |
    $x$を実数とする。$\sin^2x+\cos^2x=1$と$\cos^2x\geq0$から$\sin^2x\leq1$であり、したがって$-1\leq\sin x\leq1$である。$\sin$と$\cos$を入れ替えた同じ議論により$-1\leq\cos x\leq1$である。
  strategy: Bound each square by the Pythagorean identity and take square roots.
  sketch:
  - 'apply_theorem: Use sin²x + cos²x = 1.'
  - 'derive: Since cos²x ≥ 0, sin²x ≤ 1, hence |sin x| ≤ 1.'
  - 'conclude: The same argument with the roles exchanged bounds cos x.'
  openmath: (forall (x) (and (<= (neg 1) (sin x)) (<= (sin x) 1) (<= (neg 1) (cos x)) (<= (cos x) 1)))
  hard_negative:
    statement: $\cos x\neq0$をみたす任意の実数$x$について$-1\leq\tan x\leq1$である。
    reason: $x=\pi/3$では$\tan x=\sqrt{3}>1$である。$\tan$の値域は実数全体である。
  target: |
    ∀ x : ℝ, -1 ≤ Real.sin x ∧ Real.sin x ≤ 1 ∧ -1 ≤ Real.cos x ∧ Real.cos x ≤ 1
  proof: |
    by
      intro x
      exact ⟨Real.neg_one_le_sin x, Real.sin_le_one x, Real.neg_one_le_cos x, Real.cos_le_one x⟩
- id: sin_eq_sqrt_of_mem_interval
  kind: gap
  level: high
  topic: 三角比・正弦と余弦の変換
  statement: 実数$x$が$0\leq x\leq\pi$をみたすとき、$\sin x=\sqrt{1-\cos^2x}$である。この区間に限った形である。
  statement_en: If 0 ≤ x ≤ π, then sin x = √(1 - cos²x). This form is restricted to that interval.
  assumptions:
  - $x$は実数
  - $0\leq x\leq\pi$
  quantifiers:
  - $0\leq x\leq\pi$をみたす任意の実数$x$
  conclusion: $\sin x=\sqrt{1-\cos^2x}$が成り立つ。
  answer: |
    $x$を$0\leq x\leq\pi$をみたす実数とする。$\sin^2x+\cos^2x=1$より$1-\cos^2x=\sin^2x$である。この区間では$\sin x\geq0$なので、$\sqrt{\sin^2x}=\sin x$となる。よって$\sin x=\sqrt{1-\cos^2x}$である。
  strategy: Use the Pythagorean identity and the nonnegativity of sine on [0, π] to remove the square root.
  sketch:
  - 'apply_theorem: The Pythagorean identity gives 1 - cos²x = sin²x.'
  - 'derive: On [0, π] we have sin x ≥ 0.'
  - 'conclude: So the square root of sin²x equals sin x.'
  openmath: (forall (x) (-> (and (<= 0 x) (<= x pi)) (= (sin x) (root (- 1 (^ (cos x) 2)) 2))))
  hard_negative:
    statement: 任意の実数$x$について$\sin x=\sqrt{1-\cos^2x}$である。
    reason: $x=-\pi/2$では左辺は$-1$、右辺は$1$である。一般には$|\sin x|=\sqrt{1-\cos^2x}$である。
  target: |
    ∀ x : ℝ, 0 ≤ x → x ≤ Real.pi → Real.sin x = Real.sqrt (1 - Real.cos x ^ 2)
  proof: |
    by
      intro x h0 hpi
      have hs : 0 ≤ Real.sin x := Real.sin_nonneg_of_nonneg_of_le_pi h0 hpi
      have h : 1 - Real.cos x ^ 2 = Real.sin x ^ 2 := by linarith [Real.sin_sq_add_cos_sq x]
      rw [h, Real.sqrt_sq hs]
- id: exists_angle_of_unit_circle
  kind: gap
  level: high
  topic: 三角関数・単位円の媒介変数表示
  statement: 実数$a,b$が$a^2+b^2=1$をみたすとき、$a=\cos\theta$かつ$b=\sin\theta$となる実数$\theta$が存在する。
  statement_en: If a and b are real with a² + b² = 1, then there is a real θ with a = cos θ and b = sin θ.
  assumptions:
  - $a,b$は実数
  - $a^2+b^2=1$
  quantifiers:
  - $a^2+b^2=1$をみたす任意の実数$a,b$
  - ある実数$\theta$
  conclusion: $a=\cos\theta$かつ$b=\sin\theta$となる$\theta$が存在する。
  answer: |
    $a,b$を$a^2+b^2=1$をみたす実数とする。$a^2\leq1$より$-1\leq a\leq1$である。$\cos$は$[0,\pi]$で連続であり$\cos0=1$、$\cos\pi=-1$なので、中間値の定理により$\cos t=a$となる$t\in[0,\pi]$がとれる。この$t$について$\sin t\geq0$であり、$\sin^2t=1-a^2=b^2$であるから$\sin t=|b|$である。$b\geq0$なら$\theta=t$とおき、$b<0$なら$\theta=-t$とおく。どちらの場合も$\cos\theta=\cos t=a$であり、$\sin\theta=b$である。
  strategy: Choose t in [0, π] with cos t = a and fix the sign of sine by replacing t with -t if needed.
  sketch:
  - 'derive: The relation forces -1 ≤ a ≤ 1.'
  - 'apply_theorem: The intermediate value theorem gives t in [0, π] with cos t = a.'
  - 'derive: sin t ≥ 0 and sin²t = b², so sin t = |b|.'
  - 'case_split: Take θ = t if b ≥ 0 and θ = -t if b < 0.'
  - 'conclude: Both coordinates match.'
  openmath: (forall (a b) (-> (= (+ (^ a 2) (^ b 2)) 1) (exists (t) (and (= a (cos t)) (= b (sin t))))))
  hard_negative:
    statement: 実数$a,b$が$a^2+b^2=1$をみたすとき、$a=\cos\theta$かつ$b=\sin\theta$となる$\theta$を$0\leq\theta\leq\pi$の範囲でとれる。
    reason: $(a,b)=(0,-1)$では$\sin\theta=-1$が必要だが、$0\leq\theta\leq\pi$では$\sin\theta\geq0$である。
  target: |
    ∀ a b : ℝ, a ^ 2 + b ^ 2 = 1 → ∃ θ : ℝ, a = Real.cos θ ∧ b = Real.sin θ
  proof: |
    by
      intro a b h
      have hn : ‖(⟨a, b⟩ : ℂ)‖ = 1 := by
        rw [Complex.norm_def, Complex.normSq_apply]
        have : a * a + b * b = 1 := by nlinarith
        simp [this]
      refine ⟨Complex.arg ⟨a, b⟩, ?_, ?_⟩
      · have := Complex.norm_mul_cos_arg (⟨a, b⟩ : ℂ)
        rw [hn, one_mul] at this
        exact this.symm
      · have := Complex.norm_mul_sin_arg (⟨a, b⟩ : ℂ)
        rw [hn, one_mul] at this
        exact this.symm
- id: sin_cos_pi_div_two_sub
  kind: gap
  level: high
  topic: 三角比・余角
  statement: 任意の実数$x$について$\sin\left(\dfrac{\pi}{2}-x\right)=\cos x$かつ$\cos\left(\dfrac{\pi}{2}-x\right)=\sin x$である。
  statement_en: For every real x, sin(π/2 - x) = cos x and cos(π/2 - x) = sin x.
  assumptions:
  - $x$は実数
  quantifiers:
  - 任意の実数$x$
  conclusion: 余角の正弦は余弦に、余角の余弦は正弦に等しい。
  answer: |
    $x$を実数とする。加法定理と$\sin(\pi/2)=1$、$\cos(\pi/2)=0$より
    $\sin\left(\frac{\pi}{2}-x\right)=\sin\frac{\pi}{2}\cos x-\cos\frac{\pi}{2}\sin x=\cos x,$
    $\cos\left(\frac{\pi}{2}-x\right)=\cos\frac{\pi}{2}\cos x+\sin\frac{\pi}{2}\sin x=\sin x$
    である。
  strategy: Expand with the subtraction formulas and the values at π/2.
  sketch:
  - 'apply_theorem: Apply the subtraction formulas to π/2 - x.'
  - 'derive: Substitute sin(π/2) = 1 and cos(π/2) = 0.'
  - 'conclude: Both identities follow.'
  openmath: (forall (x) (and (= (sin (- (/ pi 2) x)) (cos x)) (= (cos (- (/ pi 2) x)) (sin x))))
  hard_negative:
    statement: 任意の実数$x$について$\cos\left(\dfrac{\pi}{2}+x\right)=\sin x$である。
    reason: $x=\pi/2$では左辺は$-1$、右辺は$1$である。正しくは$\cos(\pi/2+x)=-\sin x$である。
  target: |
    ∀ x : ℝ, Real.sin (Real.pi / 2 - x) = Real.cos x ∧ Real.cos (Real.pi / 2 - x) = Real.sin x
  proof: |
    by
      intro x
      exact ⟨Real.sin_pi_div_two_sub x, Real.cos_pi_div_two_sub x⟩
- id: tan_pi_div_two_sub
  kind: gap
  level: high
  topic: 三角比・余角
  statement: 実数$x$が$\sin x\neq0$かつ$\cos x\neq0$をみたすとき、$\tan\left(\dfrac{\pi}{2}-x\right)=\dfrac{1}{\tan x}$である。
  statement_en: If x is real with sin x ≠ 0 and cos x ≠ 0, then tan(π/2 - x) = 1/tan x.
  assumptions:
  - $x$は実数
  - $\sin x\neq0$
  - $\cos x\neq0$
  quantifiers:
  - $\sin x\neq0$かつ$\cos x\neq0$をみたす任意の実数$x$
  conclusion: 余角の正接は正接の逆数に等しい。
  answer: |
    $x$を$\sin x\neq0$かつ$\cos x\neq0$をみたす実数とする。$\sin(\pi/2-x)=\cos x$、$\cos(\pi/2-x)=\sin x$であり、$\cos(\pi/2-x)\neq0$なので
    $\tan\left(\frac{\pi}{2}-x\right)=\frac{\cos x}{\sin x}=\frac{1}{\sin x/\cos x}=\frac{1}{\tan x}$
    である。
  strategy: Write the tangent as a quotient and apply the complementary-angle formulas.
  sketch:
  - 'setup: Assume sin x and cos x are nonzero, so all the quotients are defined.'
  - 'apply_theorem: sin(π/2 - x) = cos x and cos(π/2 - x) = sin x.'
  - 'conclude: The quotient is cos x / sin x = 1 / tan x.'
  openmath: (forall (x) (-> (and (!= (sin x) 0) (!= (cos x) 0)) (= (tan (- (/ pi 2) x)) (/ 1 (tan x)))))
  hard_negative:
    statement: $\sin x\neq0$かつ$\cos x\neq0$をみたす実数$x$について$\tan\left(\dfrac{\pi}{2}-x\right)=\tan x$である。
    reason: 余角では正接は逆数になる。$x=\pi/6$では$\tan(\pi/3)=\sqrt{3}$だが$\tan(\pi/6)=1/\sqrt{3}$であり一致しない。等しくなるのは$\tan x=\pm1$のときに限る。
  target: |
    ∀ x : ℝ, Real.sin x ≠ 0 → Real.cos x ≠ 0 → Real.tan (Real.pi / 2 - x) = 1 / Real.tan x
  proof: |
    by
      intro x _ _
      rw [Real.tan_pi_div_two_sub, one_div]
- id: sin_cos_tan_pi_sub
  kind: gap
  level: high
  topic: 三角比・補角
  statement: 任意の実数$x$について$\sin(\pi-x)=\sin x$かつ$\cos(\pi-x)=-\cos x$であり、$\cos x\neq0$ならば$\tan(\pi-x)=-\tan x$である。
  statement_en: For every real x, sin(π - x) = sin x and cos(π - x) = -cos x, and if cos x ≠ 0 then tan(π - x) = -tan x.
  assumptions:
  - $x$は実数
  - $\tan$の式については$\cos x\neq0$
  quantifiers:
  - 任意の実数$x$
  conclusion: 補角の正弦は等しく、余弦と正接は符号が反転する。
  answer: |
    $x$を実数とする。加法定理と$\sin\pi=0$、$\cos\pi=-1$より
    $\sin(\pi-x)=\sin\pi\cos x-\cos\pi\sin x=\sin x,$
    $\cos(\pi-x)=\cos\pi\cos x+\sin\pi\sin x=-\cos x$
    である。$\cos x\neq0$のときは$\cos(\pi-x)\neq0$であり、$\tan(\pi-x)=\sin x/(-\cos x)=-\tan x$となる。
  strategy: Expand with the subtraction formulas at π and divide.
  sketch:
  - 'apply_theorem: Apply the subtraction formulas to π - x.'
  - 'derive: Substitute sin π = 0 and cos π = -1.'
  - 'derive: If cos x ≠ 0, divide the sine by the cosine.'
  - 'conclude: This gives all three identities.'
  openmath: (forall (x) (and (= (sin (- pi x)) (sin x)) (= (cos (- pi x)) (neg (cos x))) (-> (!= (cos x) 0) (= (tan (- pi x)) (neg (tan x))))))
  hard_negative:
    statement: $\cos x\neq0$をみたす任意の実数$x$について$\tan(\pi-x)=\tan x$である。
    reason: $x=\pi/4$では左辺は$-1$、右辺は$1$である。周期の式$\tan(\pi+x)=\tan x$と混同している。
  target: |
    ∀ x : ℝ, Real.sin (Real.pi - x) = Real.sin x ∧ Real.cos (Real.pi - x) = -Real.cos x ∧ (Real.cos x ≠ 0 → Real.tan (Real.pi - x) = -Real.tan x)
  proof: |
    by
      intro x
      exact ⟨Real.sin_pi_sub x, Real.cos_pi_sub x, fun _ => Real.tan_pi_sub x⟩
- id: sin_cos_shift_half_pi_pi
  kind: gap
  level: high
  topic: 三角関数・角の平行移動
  statement: 任意の実数$x$について$\sin\left(x+\dfrac{\pi}{2}\right)=\cos x$、$\cos\left(x+\dfrac{\pi}{2}\right)=-\sin x$、$\sin(x+\pi)=-\sin x$、$\cos(x+\pi)=-\cos x$である。
  statement_en: For every real x, sin(x + π/2) = cos x, cos(x + π/2) = -sin x, sin(x + π) = -sin x and cos(x + π) = -cos x.
  assumptions:
  - $x$は実数
  quantifiers:
  - 任意の実数$x$
  conclusion: 角に$\pi/2$または$\pi$を加えたときの正弦と余弦は上の4式で表される。
  answer: |
    $x$を実数とする。加法定理に$\sin(\pi/2)=1$、$\cos(\pi/2)=0$を代入すると
    $\sin(x+\pi/2)=\cos x$、$\cos(x+\pi/2)=-\sin x$である。同様に$\sin\pi=0$、$\cos\pi=-1$を代入すると$\sin(x+\pi)=-\sin x$、$\cos(x+\pi)=-\cos x$である。
  strategy: Expand with the addition formulas and the values at π/2 and π.
  sketch:
  - 'apply_theorem: Apply the addition formulas with second angle π/2.'
  - 'apply_theorem: Apply the addition formulas with second angle π.'
  - 'conclude: Substitute the values of sine and cosine at those angles.'
  openmath: (forall (x) (and (= (sin (+ x (/ pi 2))) (cos x)) (= (cos (+ x (/ pi 2))) (neg (sin x))) (= (sin (+ x pi)) (neg (sin x))) (= (cos (+ x pi)) (neg (cos x)))))
  hard_negative:
    statement: 任意の実数$x$について$\cos\left(x+\dfrac{\pi}{2}\right)=\sin x$である。
    reason: $x=\pi/2$では左辺は$-1$、右辺は$1$である。符号が逆である。
  target: |
    ∀ x : ℝ, Real.sin (x + Real.pi / 2) = Real.cos x ∧ Real.cos (x + Real.pi / 2) = -Real.sin x ∧ Real.sin (x + Real.pi) = -Real.sin x ∧ Real.cos (x + Real.pi) = -Real.cos x
  proof: |
    by
      intro x
      exact ⟨Real.sin_add_pi_div_two x, Real.cos_add_pi_div_two x, Real.sin_add_pi x, Real.cos_add_pi x⟩
- id: angle_sum_pi_sin_cos
  kind: gap
  level: high
  topic: 三角比・和が π の三つの角
  statement: 実数$A,B,C$が$A+B+C=\pi$をみたすとき、$\sin(A+B)=\sin C$、$\cos(A+B)=-\cos C$、$\sin\dfrac{A+B}{2}=\cos\dfrac{C}{2}$、$\cos\dfrac{A+B}{2}=\sin\dfrac{C}{2}$である。
  statement_en: If A, B, C are real with A + B + C = π, then sin(A+B) = sin C, cos(A+B) = -cos C, sin((A+B)/2) = cos(C/2) and cos((A+B)/2) = sin(C/2).
  assumptions:
  - $A,B,C$は実数
  - $A+B+C=\pi$
  quantifiers:
  - $A+B+C=\pi$をみたす任意の実数$A,B,C$
  conclusion: $A+B$の三角関数を$C$で表す4つの等式が成り立つ。
  answer: |
    $A,B,C$を$A+B+C=\pi$をみたす実数とする。$A+B=\pi-C$であるから、補角の公式により$\sin(A+B)=\sin C$、$\cos(A+B)=-\cos C$である。また$(A+B)/2=\pi/2-C/2$であるから、余角の公式により$\sin((A+B)/2)=\cos(C/2)$、$\cos((A+B)/2)=\sin(C/2)$である。
  strategy: Rewrite A + B as π - C and apply the supplementary and complementary angle formulas.
  sketch:
  - 'translate: A + B = π - C and (A + B)/2 = π/2 - C/2.'
  - 'apply_theorem: Use the supplementary angle formulas for A + B.'
  - 'apply_theorem: Use the complementary angle formulas for (A + B)/2.'
  - 'conclude: The four identities follow.'
  openmath: (forall (a b c) (-> (= (+ (+ a b) c) pi) (and (= (sin (+ a b)) (sin c)) (= (cos (+ a b)) (neg (cos c))) (= (sin (/ (+ a b) 2)) (cos (/ c 2))) (= (cos (/ (+ a b) 2)) (sin (/ c 2))))))
  hard_negative:
    statement: 実数$A,B,C$が$A+B+C=2\pi$をみたすとき、$\sin(A+B)=\sin C$である。
    reason: $A=B=C=2\pi/3$では左辺は$-\sqrt{3}/2$、右辺は$\sqrt{3}/2$である。和が$2\pi$のときは$\sin(A+B)=-\sin C$である。
  target: |
    ∀ A B C : ℝ, A + B + C = Real.pi → Real.sin (A + B) = Real.sin C ∧ Real.cos (A + B) = -Real.cos C ∧ Real.sin ((A + B) / 2) = Real.cos (C / 2) ∧ Real.cos ((A + B) / 2) = Real.sin (C / 2)
  proof: |
    by
      intro A B C h
      have h1 : A + B = Real.pi - C := by linarith
      have h2 : (A + B) / 2 = Real.pi / 2 - C / 2 := by rw [h1]; ring
      rw [h2, h1]
      exact ⟨Real.sin_pi_sub C, Real.cos_pi_sub C, Real.sin_pi_div_two_sub _, Real.cos_pi_div_two_sub _⟩
- id: sin_cos_add_two_int_pi
  kind: gap
  level: high
  topic: 三角関数・周期
  statement: 任意の実数$x$と整数$n$について$\sin(x+2n\pi)=\sin x$かつ$\cos(x+2n\pi)=\cos x$である。
  statement_en: For every real x and integer n, sin(x + 2nπ) = sin x and cos(x + 2nπ) = cos x.
  assumptions:
  - $x$は実数
  - $n$は整数
  quantifiers:
  - 任意の実数$x$と整数$n$
  conclusion: $\sin$と$\cos$は$2n\pi$の平行移動で不変である。
  answer: |
    $x$を実数、$n$を整数とする。$\sin 2\pi=0$、$\cos 2\pi=1$と加法定理から、任意の実数$y$について$\sin(y+2\pi)=\sin y$、$\cos(y+2\pi)=\cos y$である。$y$を$y-2\pi$に置き換えれば$\sin(y-2\pi)=\sin y$、$\cos(y-2\pi)=\cos y$も得られる。$n\geq0$のときは前者を$n$回、$n<0$のときは後者を$-n$回繰り返すと、結論を得る。
  strategy: Prove invariance under ±2π by the addition formulas and iterate over the integer n.
  sketch:
  - 'apply_theorem: The addition formulas with sin 2π = 0 and cos 2π = 1 give period 2π.'
  - 'derive: Replacing y by y - 2π handles the negative direction.'
  - 'induction: Iterate |n| times.'
  - 'conclude: The value at x + 2nπ equals the value at x.'
  openmath: (forall (x n) (-> (in n Z) (and (= (sin (+ x (* (* 2 n) pi))) (sin x)) (= (cos (+ x (* (* 2 n) pi))) (cos x)))))
  hard_negative:
    statement: 任意の実数$x$と整数$n$について$\sin(x+n\pi)=\sin x$である。
    reason: $x=\pi/2$、$n=1$では左辺は$-1$、右辺は$1$である。$\pi$は$\sin$の周期ではない。
  target: |
    ∀ (x : ℝ) (n : ℤ), Real.sin (x + 2 * n * Real.pi) = Real.sin x ∧ Real.cos (x + 2 * n * Real.pi) = Real.cos x
  proof: |
    by
      intro x n
      have h : x + 2 * (n : ℝ) * Real.pi = x + n * (2 * Real.pi) := by ring
      rw [h]
      exact ⟨Real.sin_add_int_mul_two_pi x n, Real.cos_add_int_mul_two_pi x n⟩
- id: tan_add_int_mul_pi
  kind: gap
  level: high
  topic: 三角関数・周期
  statement: 実数$x$が$\cos x\neq0$をみたし、$n$が整数のとき、$\tan(x+n\pi)=\tan x$である。
  statement_en: If x is real with cos x ≠ 0 and n is an integer, then tan(x + nπ) = tan x.
  assumptions:
  - $x$は実数
  - $\cos x\neq0$
  - $n$は整数
  quantifiers:
  - $\cos x\neq0$をみたす任意の実数$x$と任意の整数$n$
  conclusion: $\tan$は$n\pi$の平行移動で不変である。
  answer: |
    $x$を$\cos x\neq0$をみたす実数、$n$を整数とする。任意の実数$y$について$\sin(y+\pi)=-\sin y$、$\cos(y+\pi)=-\cos y$であり、$y$を$y-\pi$に置き換えると$\sin(y-\pi)=-\sin y$、$\cos(y-\pi)=-\cos y$でもある。$n\geq0$なら前者を、$n<0$なら後者を$|n|$回繰り返すと$\sin(x+n\pi)=(-1)^n\sin x$、$\cos(x+n\pi)=(-1)^n\cos x$である。$\cos(x+n\pi)\neq0$であり、割り算で$(-1)^n$が消えるので$\tan(x+n\pi)=\sin x/\cos x=\tan x$である。
  strategy: Shifting by nπ multiplies both sine and cosine by (-1)^n, which cancels in the quotient.
  sketch:
  - 'setup: Assume cos x ≠ 0.'
  - 'derive: Iterating the shift by π gives the factor (-1)^n on both sine and cosine.'
  - 'derive: In particular cos(x + nπ) ≠ 0.'
  - 'conclude: The factor cancels in the quotient.'
  openmath: (forall (x n) (-> (and (!= (cos x) 0) (in n Z)) (= (tan (+ x (* n pi))) (tan x))))
  hard_negative:
    statement: 実数$x$が$\cos x\neq0$かつ$\sin x\neq0$をみたし、$n$が整数のとき、$\tan\left(x+\dfrac{n\pi}{2}\right)=\tan x$である。
    reason: $x=\pi/4$、$n=1$では左辺は$\tan(3\pi/4)=-1$、右辺は$1$である。$\tan$の周期は$\pi$である。
  target: |
    ∀ (x : ℝ) (n : ℤ), Real.cos x ≠ 0 → Real.tan (x + n * Real.pi) = Real.tan x
  proof: |
    by
      intro x n _
      exact Real.tan_add_int_mul_pi x n
- id: sin_cos_tan_parity
  kind: textbook
  level: high
  topic: 三角関数・偶奇
  statement: 任意の実数$x$について$\sin(-x)=-\sin x$かつ$\cos(-x)=\cos x$であり、$\cos x\neq0$ならば$\tan(-x)=-\tan x$である。
  statement_en: For every real x, sin(-x) = -sin x and cos(-x) = cos x, and if cos x ≠ 0 then tan(-x) = -tan x.
  assumptions:
  - $x$は実数
  - $\tan$の式については$\cos x\neq0$
  quantifiers:
  - 任意の実数$x$
  conclusion: $\sin$と$\tan$は奇関数、$\cos$は偶関数である。
  answer: |
    $x$を実数とする。角$x$の単位円上の点$(\cos x,\sin x)$と角$-x$の点は第1座標の軸について対称なので、$\cos(-x)=\cos x$、$\sin(-x)=-\sin x$である。$\cos x\neq0$のときは$\cos(-x)\neq0$であり、$\tan(-x)=-\sin x/\cos x=-\tan x$である。
  strategy: Reflect the unit-circle point across the first axis and divide.
  sketch:
  - 'setup: Compare the unit-circle points at angles x and -x.'
  - 'derive: They are mirror images across the first axis, so cosine agrees and sine changes sign.'
  - 'conclude: If cos x ≠ 0, the quotient changes sign.'
  openmath: (forall (x) (and (= (sin (neg x)) (neg (sin x))) (= (cos (neg x)) (cos x)) (-> (!= (cos x) 0) (= (tan (neg x)) (neg (tan x))))))
  hard_negative:
    statement: 任意の実数$x$について$\cos(-x)=-\cos x$である。
    reason: $x=0$では左辺は$1$、右辺は$-1$である。$\cos$は奇関数ではなく偶関数である。
  target: |
    ∀ x : ℝ, Real.sin (-x) = -Real.sin x ∧ Real.cos (-x) = Real.cos x ∧ (Real.cos x ≠ 0 → Real.tan (-x) = -Real.tan x)
  proof: |
    by
      intro x
      exact ⟨Real.sin_neg x, Real.cos_neg x, fun _ => Real.tan_neg x⟩
