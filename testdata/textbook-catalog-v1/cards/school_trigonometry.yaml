      have h1 : 1 + Real.tan x * Real.tan y = (Real.cos x * Real.cos y + Real.sin x * Real.sin y) / (Real.cos x * Real.cos y) := by
        rw [Real.tan_eq_sin_div_cos, Real.tan_eq_sin_div_cos]
        field_simp
      have h2 : Real.tan x - Real.tan y = (Real.sin x * Real.cos y - Real.cos x * Real.sin y) / (Real.cos x * Real.cos y) := by
        rw [Real.tan_eq_sin_div_cos, Real.tan_eq_sin_div_cos]
        field_simp
      rw [h1, h2, Real.tan_eq_sin_div_cos, Real.sin_sub, Real.cos_sub]
      field_simp
- id: tan_mul_tan_eq_one_iff
  kind: gap
  level: high
  topic: 三角関数・正接の積
  statement: 実数$x,y$が$\cos x\neq0$、$\cos y\neq0$をみたすとき、$\tan x\tan y=1$と$\cos(x+y)=0$は同値である。
  statement_en: If x, y are real with cos x ≠ 0 and cos y ≠ 0, then tan x tan y = 1 if and only if cos(x+y) = 0.
  assumptions:
  - $x,y$は実数
  - $\cos x\neq0$
  - $\cos y\neq0$
  quantifiers:
  - 上の条件をみたす任意の実数$x,y$
  conclusion: $\tan x\tan y=1$と$\cos(x+y)=0$は同値である。
  answer: |
    $x,y$を$\cos x\neq0$、$\cos y\neq0$をみたす実数とする。$\tan x\tan y=\dfrac{\sin x\sin y}{\cos x\cos y}$であるから、$\tan x\tan y=1$は$\sin x\sin y=\cos x\cos y$、すなわち$\cos x\cos y-\sin x\sin y=0$と同値である。左辺は加法定理により$\cos(x+y)$に等しい。
  strategy: Clear the denominator and recognize the addition formula for cosine.
  sketch:
  - 'setup: Assume cos x and cos y are nonzero.'
  - 'translate: tan x tan y = 1 is equivalent to sin x sin y = cos x cos y.'
  - 'apply_theorem: cos x cos y - sin x sin y = cos(x+y).'
  - 'conclude: Hence the two conditions are equivalent.'
  openmath: (forall (x y) (-> (and (!= (cos x) 0) (!= (cos y) 0)) (<-> (= (* (tan x) (tan y)) 1) (= (cos (+ x y)) 0))))
  hard_negative:
    statement: 実数$x,y$が$\cos x\neq0$、$\cos y\neq0$をみたすとき、$\tan x\tan y=1$と$\cos(x-y)=0$は同値である。
    reason: $x=\pi/4$、$y=-\pi/4$では$\cos(x-y)=0$だが$\tan x\tan y=-1$である。$\cos(x-y)=0$に対応するのは$\tan x\tan y=-1$である。
  target: |
    ∀ x y : ℝ, Real.cos x ≠ 0 → Real.cos y ≠ 0 → (Real.tan x * Real.tan y = 1 ↔ Real.cos (x + y) = 0)
  proof: |
    by
      intro x y hx hy
      rw [Real.tan_eq_sin_div_cos, Real.tan_eq_sin_div_cos, Real.cos_add]
      have h : Real.sin x / Real.cos x * (Real.sin y / Real.cos y) = Real.sin x * Real.sin y / (Real.cos x * Real.cos y) := by
        field_simp
      rw [h, div_eq_one_iff_eq (mul_ne_zero hx hy)]
      constructor
      · intro e
        rw [e]
        ring
      · intro e
        linarith
- id: sin_cos_add_mul_sub
  kind: gap
  level: high
  topic: 三角関数・加法定理の積
  statement: 任意の実数$x,y$について$\sin(x+y)\sin(x-y)=\sin^2x-\sin^2y$かつ$\cos(x+y)\cos(x-y)=\cos^2x-\sin^2y$である。
  statement_en: For all real x, y, sin(x+y)sin(x-y) = sin²x - sin²y and cos(x+y)cos(x-y) = cos²x - sin²y.
  assumptions:
  - $x,y$は実数
  quantifiers:
  - 任意の実数$x,y$
  conclusion: 和の角と差の角の積が平方の差で表される。
  answer: |
    $x,y$を実数とする。加法定理で展開すると
    $\sin(x+y)\sin(x-y)=\sin^2x\cos^2y-\cos^2x\sin^2y$である。$\cos^2y=1-\sin^2y$、$\cos^2x=1-\sin^2x$を代入すると、$\sin^2x\sin^2y$の項が消えて$\sin^2x-\sin^2y$となる。同様に$\cos(x+y)\cos(x-y)=\cos^2x\cos^2y-\sin^2x\sin^2y$であり、$\cos^2y=1-\sin^2y$を代入すると$\cos^2x-(\cos^2x+\sin^2x)\sin^2y=\cos^2x-\sin^2y$となる。
  strategy: Expand both factors by the addition formulas and eliminate cosines with the Pythagorean identity.
  sketch:
  - 'apply_theorem: Expand both products by the addition and difference formulas.'
  - 'derive: The product is a difference of squares in sin x cos y and cos x sin y.'
  - 'apply_theorem: Replace cos²y by 1 - sin²y and cos²x by 1 - sin²x where needed.'
  - 'conclude: The mixed terms cancel.'
  openmath: (forall (x y) (and (= (* (sin (+ x y)) (sin (- x y))) (- (^ (sin x) 2) (^ (sin y) 2))) (= (* (cos (+ x y)) (cos (- x y))) (- (^ (cos x) 2) (^ (sin y) 2)))))
  hard_negative:
    statement: 任意の実数$x,y$について$\cos(x+y)\cos(x-y)=\cos^2x-\cos^2y$である。
    reason: $x=y=0$では左辺は$1$、右辺は$0$である。右辺の第2項は$\sin^2y$である。
  target: |
    ∀ x y : ℝ, Real.sin (x + y) * Real.sin (x - y) = Real.sin x ^ 2 - Real.sin y ^ 2 ∧ Real.cos (x + y) * Real.cos (x - y) = Real.cos x ^ 2 - Real.sin y ^ 2
  proof: |
    by
      intro x y
      have h1 := Real.sin_sq_add_cos_sq x
      have h2 := Real.sin_sq_add_cos_sq y
      rw [Real.sin_add, Real.sin_sub, Real.cos_add, Real.cos_sub]
      constructor
      · linear_combination Real.sin x ^ 2 * h2 - Real.sin y ^ 2 * h1
      · linear_combination Real.cos x ^ 2 * h2 - Real.sin y ^ 2 * h1
- id: sin_cos_eq_iff_two_pi
  kind: gap
  level: high
  topic: 三角方程式・角の決定
  statement: 実数$x,y$について、$\sin x=\sin y$かつ$\cos x=\cos y$であることと、$x=y+2n\pi$となる整数$n$が存在することは同値である。
  statement_en: For real x, y, sin x = sin y and cos x = cos y hold if and only if x = y + 2nπ for some integer n.
  assumptions:
  - $x,y$は実数
  quantifiers:
  - 任意の実数$x,y$
  - ある整数$n$
  conclusion: 正弦と余弦がともに等しいことは、角の差が$2\pi$の整数倍であることと同値である。
  answer: |
    $x,y$を実数とする。$\sin x=\sin y$かつ$\cos x=\cos y$とする。差の角の公式より$\cos(x-y)=\cos^2y+\sin^2y=1$である。$x-y=2n\pi+r$となる整数$n$と$0\leq r<2\pi$をとると$\cos r=1$である。$r>0$なら$0<r/2<\pi$より$\sin(r/2)>0$であり、$\cos r=1-2\sin^2(r/2)<1$となって矛盾する。したがって$r=0$であり、$x=y+2n\pi$である。逆に$x=y+2n\pi$なら、$\sin,\cos$が$2\pi$を周期にもつことから両方の等式が成り立つ。
  strategy: Reduce the equalities to cos(x-y) = 1 and locate its solutions by the half-angle identity.
  sketch:
  - 'derive: Equal sine and cosine give cos(x-y) = 1 by the difference formula.'
  - 'construct: Write x - y = 2nπ + r with 0 ≤ r < 2π.'
  - 'contradiction: If r > 0, then cos r = 1 - 2 sin²(r/2) < 1.'
  - 'derive: So r = 0 and x = y + 2nπ.'
  - 'conclude: The converse follows from the period 2π.'
  openmath: (forall (x y) (<-> (and (= (sin x) (sin y)) (= (cos x) (cos y))) (exists (n) (and (in n Z) (= x (+ y (* (* 2 n) pi)))))))
  hard_negative:
    statement: 実数$x,y$について、$\sin x=\sin y$であることと、$x=y+2n\pi$となる整数$n$が存在することは同値である。
    reason: $x=0$、$y=\pi$では$\sin x=\sin y$だが、$x-y=-\pi$は$2\pi$の整数倍ではない。
  target: |
    ∀ x y : ℝ, (Real.sin x = Real.sin y ∧ Real.cos x = Real.cos y) ↔ ∃ n : ℤ, x = y + 2 * n * Real.pi
  proof: |
    by
      intro x y
      constructor
      · rintro ⟨hs, hc⟩
        have h : Real.cos (x - y) = 1 := by
          rw [Real.cos_sub, hs, hc]
          linarith [Real.sin_sq_add_cos_sq y]
        obtain ⟨n, hn⟩ := (Real.cos_eq_one_iff (x - y)).mp h
        exact ⟨n, by linarith⟩
      · rintro ⟨n, rfl⟩
        have h : y + 2 * (n : ℝ) * Real.pi = y + n * (2 * Real.pi) := by ring
        rw [h]
        exact ⟨Real.sin_add_int_mul_two_pi y n, Real.cos_add_int_mul_two_pi y n⟩
