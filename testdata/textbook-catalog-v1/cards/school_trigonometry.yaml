  - 'apply_theorem: 1 + t² = 1/c².'
  - 'derive: sin x = 2sc = 2t c² by the double-angle formula.'
  - 'derive: cos x = c² - s² = c²(1 - t²).'
  - 'conclude: Substitute c² = 1/(1 + t²).'
  openmath: (forall (x t) (-> (and (!= (cos (/ x 2)) 0) (= t (tan (/ x 2)))) (and (= (sin x) (/ (* 2 t) (+ 1 (^ t 2)))) (= (cos x) (/ (- 1 (^ t 2)) (+ 1 (^ t 2)))))))
