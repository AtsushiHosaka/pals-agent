    statement: 実数$a,b$について、任意の実数$x$で$a\sin x+b\cos x=(a+b)\sin(x+\alpha)$となる実数$\alpha$が存在する。
    reason: $a=b=1$では左辺の最大値は$\sqrt{2}$だが、右辺は最大値$2$をとる。振幅は$\sqrt{a^2+b^2}$である。
