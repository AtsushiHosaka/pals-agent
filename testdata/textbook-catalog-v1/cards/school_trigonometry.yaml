    $a\sin x+b\cos x=r(\cos\alpha\sin x+\sin\alpha\cos x)=r\sin(x+\alpha)$である。
  strategy: Normalize (a, b) to a point of the unit circle, name its angle, and recognize the addition formula.
  sketch:
  - 'setup: Put r = √(a²+b²) > 0.'
  - 'apply_theorem: (a/r, b/r) lies on the unit circle, so it equals (cos α, sin α) for some α.'
  - 'derive: a sin x + b cos x = r(cos α sin x + sin α cos x).'
  - 'conclude: The addition formula gives r sin(x+α).'
