  - 'conclude: Subtracting cancels the sin u cos v terms.'
  openmath: (forall (x y) (= (- (sin x) (sin y)) (* (* 2 (cos (/ (+ x y) 2))) (sin (/ (- x y) 2)))))
  hard_negative:
