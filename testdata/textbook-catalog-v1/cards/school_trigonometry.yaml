  kind: textbook
  level: high
  topic: 三角関数・三倍角の公式
  statement: 任意の実数$x$について$\sin3x=3\sin x-4\sin^3x$である。
  statement_en: For every real x, sin 3x = 3 sin x - 4 sin³x.
  assumptions:
  - $x$は実数
  quantifiers:
  - 任意の実数$x$
  conclusion: $\sin3x$は$\sin x$の3次式で表される。
  answer: |
    $x$を実数とする。加法定理と倍角の公式より
    $\sin3x=\sin2x\cos x+\cos2x\sin x=2\sin x\cos^2x+(1-2\sin^2x)\sin x$である。$\cos^2x=1-\sin^2x$を代入して整理すると$3\sin x-4\sin^3x$となる。
  strategy: Split 3x as 2x + x and rewrite everything in terms of sin x.
  sketch:
  - 'apply_theorem: Use the addition formula with 2x and x.'
  - 'apply_theorem: Replace sin 2x and cos 2x by the double-angle formulas.'
  - 'derive: Replace cos²x by 1 - sin²x.'
  - 'conclude: Collect the terms.'
  openmath: (forall (x) (= (sin (* 3 x)) (- (* 3 (sin x)) (* 4 (^ (sin x) 3)))))
  hard_negative:
    statement: 任意の実数$x$について$\sin3x=4\sin^3x-3\sin x$である。
    reason: $x=\pi/2$では左辺は$-1$、右辺は$1$である。$\cos$の三倍角の形と取り違えている。
  target: |
    ∀ x : ℝ, Real.sin (3 * x) = 3 * Real.sin x - 4 * Real.sin x ^ 3
  proof: |
    by
      intro x
      exact Real.sin_three_mul x
- id: cos_triple_angle
  kind: textbook
  level: high
  topic: 三角関数・三倍角の公式
  statement: 任意の実数$x$について$\cos3x=4\cos^3x-3\cos x$である。
