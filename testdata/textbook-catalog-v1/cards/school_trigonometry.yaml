- id: angle_sum_pi_tan_identity
  kind: gap
  level: high
  topic: 三角関数・和が π の三つの角
  statement: 実数$A,B,C$が$A+B+C=\pi$、$\cos A\neq0$、$\cos B\neq0$、$\cos C\neq0$をみたすとき、$\tan A+\tan B+\tan C=\tan A\tan B\tan C$である。
  statement_en: If A, B, C are real with A + B + C = π and cos A, cos B, cos C all nonzero, then tan A + tan B + tan C = tan A tan B tan C.
  assumptions:
  - $A,B,C$は実数
  - $A+B+C=\pi$
  - $\cos A,\cos B,\cos C$はいずれも$0$でない
  quantifiers:
  - 上の条件をみたす任意の実数$A,B,C$
  conclusion: 三つの正接の和と積が等しい。
  answer: |
    $A,B,C$を$A+B+C=\pi$、$\cos A\neq0$、$\cos B\neq0$、$\cos C\neq0$をみたす実数とする。$C=\pi-(A+B)$より$\sin C=\sin(A+B)=\sin A\cos B+\cos A\sin B$、$\cos C=-\cos(A+B)=\sin A\sin B-\cos A\cos B$である。結論の両辺に$\cos A\cos B\cos C\neq0$を掛けると、示すべき式は
    $(\sin A\cos B+\cos A\sin B)\cos C+\cos A\cos B\sin C=\sin A\sin B\sin C$となる。左辺の括弧は$\sin C$であるから、左辺は$\sin C(\cos C+\cos A\cos B)$である。$\cos C+\cos A\cos B=\sin A\sin B$なので、左辺は右辺に等しい。
  strategy: Clear denominators and substitute sin C and cos C in terms of A and B.
  sketch:
  - 'setup: Assume the cosines are nonzero so all tangents are defined.'
  - 'derive: sin C = sin(A+B) and cos C = sin A sin B - cos A cos B.'
  - 'translate: Multiply the claim by cos A cos B cos C.'
  - 'derive: The left side becomes sin C (cos C + cos A cos B).'
  - 'conclude: That equals sin A sin B sin C.'
  openmath: (forall (a b c) (-> (and (= (+ (+ a b) c) pi) (!= (cos a) 0) (!= (cos b) 0) (!= (cos c) 0)) (= (+ (+ (tan a) (tan b)) (tan c)) (* (* (tan a) (tan b)) (tan c)))))
  hard_negative:
    statement: 実数$A,B,C$が$A+B+C=\dfrac{\pi}{2}$をみたし、余弦がいずれも$0$でないとき、$\tan A+\tan B+\tan C=\tan A\tan B\tan C$である。
    reason: $A=B=C=\pi/6$では左辺は$\sqrt{3}$、右辺は$1/(3\sqrt{3})$である。和が$\pi$であることが必要である。
  target: |
    ∀ A B C : ℝ, A + B + C = Real.pi → Real.cos A ≠ 0 → Real.cos B ≠ 0 → Real.cos C ≠ 0 → Real.tan A + Real.tan B + Real.tan C = Real.tan A * Real.tan B * Real.tan C
  proof: |
    by
      intro A B C h ha hb hc
      have hC : C = Real.pi - (A + B) := by linarith
      have hs : Real.sin C = Real.sin A * Real.cos B + Real.cos A * Real.sin B := by
        rw [hC, Real.sin_pi_sub, Real.sin_add]
      have hco : Real.cos C = Real.sin A * Real.sin B - Real.cos A * Real.cos B := by
        rw [hC, Real.cos_pi_sub, Real.cos_add]
        ring
      rw [Real.tan_eq_sin_div_cos, Real.tan_eq_sin_div_cos, Real.tan_eq_sin_div_cos]
      field_simp
      rw [hs]
      rw [hco]
      ring
