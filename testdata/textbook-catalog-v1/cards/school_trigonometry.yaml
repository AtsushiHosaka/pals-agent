    by
      intro f y
      constructor
      · constructor
        · rintro ⟨x, hx⟩
          exact ⟨Real.sin x, Real.neg_one_le_sin x, Real.sin_le_one x, hx⟩
        · rintro ⟨t, h1, h2, ht⟩
