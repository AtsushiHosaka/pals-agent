      intro n
      exact ⟨Real.sin_int_mul_pi n, Real.cos_int_mul_pi n⟩
- id: sinusoid_period
  kind: gap
  level: high
  topic: 三角関数・周期
  statement: 実数$a,\omega,b,x$について$\omega\neq0$のとき、$a\sin\left(\omega\left(x+\dfrac{2\pi}{\omega}\right)+b\right)=a\sin(\omega x+b)$である。すなわち$2\pi/\omega$は周期の一つであり、最小周期が$2\pi/|\omega|$であるという主張は含まない。
  statement_en: For real a, ω, b, x with ω ≠ 0, a sin(ω(x + 2π/ω) + b) = a sin(ωx + b). This says 2π/ω is a period; it does not claim minimality (least period 2π/|ω|).
  assumptions:
  - $a,\omega,b,x$は実数
  - $\omega\neq0$
  quantifiers:
  - $\omega\neq0$をみたす任意の実数$a,\omega,b,x$
  conclusion: $x\mapsto a\sin(\omega x+b)$は$2\pi/\omega$を周期にもつ。
  answer: |
    $a,\omega,b,x$を実数とし、$\omega\neq0$とする。$\omega(x+2\pi/\omega)+b=(\omega x+b)+2\pi$であり、$\sin$は$2\pi$を周期にもつので、$\sin(\omega(x+2\pi/\omega)+b)=\sin(\omega x+b)$である。両辺に$a$を掛ければ結論を得る。
  strategy: Distribute ω inside the argument so the shift becomes exactly 2π.
  sketch:
  - 'setup: Assume ω ≠ 0 so that 2π/ω is defined.'
  - 'derive: The argument equals (ωx + b) + 2π.'
  - 'apply_theorem: Sine has period 2π.'
  - 'conclude: Multiply both sides by a.'
  openmath: (forall (a w b x) (-> (!= w 0) (= (* a (sin (+ (* w (+ x (/ (* 2 pi) w))) b))) (* a (sin (+ (* w x) b))))))
  hard_negative:
    statement: 実数$a,\omega,b,x$について$a\sin(\omega(x+2\pi)+b)=a\sin(\omega x+b)$である。
    reason: $a=1$、$\omega=1/2$、$b=0$、$x=\pi$では左辺は$\sin(3\pi/2)=-1$、右辺は$\sin(\pi/2)=1$である。周期は$\omega$に依存する。
  target: |
    ∀ a w b x : ℝ, w ≠ 0 → a * Real.sin (w * (x + 2 * Real.pi / w) + b) = a * Real.sin (w * x + b)
  proof: |
    by
      intro a w b x hw
      have h : w * (x + 2 * Real.pi / w) + b = (w * x + b) + 2 * Real.pi := by
        field_simp
        ring
      rw [h, Real.sin_add_two_pi]
- id: sin_period_ge_two_pi
  kind: gap
  level: high
  topic: 三角関数・基本周期
  statement: 正の実数$T$が任意の実数$x$について$\sin(x+T)=\sin x$をみたすならば、$T\geq2\pi$である。
  statement_en: If T > 0 and sin(x + T) = sin x for every real x, then T ≥ 2π.
  assumptions:
  - $T$は正の実数
  - 任意の実数$x$について$\sin(x+T)=\sin x$
  quantifiers:
  - 上の条件をみたす任意の正の実数$T$
  conclusion: $T\geq2\pi$である。
  answer: |
    $T$を正の実数とし、任意の実数$x$について$\sin(x+T)=\sin x$が成り立つとする。$0<T<2\pi$と仮定して矛盾を導く。$x=\pi/2$を代入すると、$\sin(\pi/2+T)=\cos T$なので$\cos T=1$である。一方、倍角の公式より$\cos T=1-2\sin^2(T/2)$であり、$0<T/2<\pi$から$\sin(T/2)>0$なので$\cos T<1$である。これは矛盾である。よって$T\geq2\pi$である。
  strategy: Evaluate at x = π/2 to force cos T = 1, which is impossible on (0, 2π).
  sketch:
  - 'contradiction: Assume 0 < T < 2π.'
  - 'derive: Taking x = π/2 gives cos T = 1.'
  - 'apply_theorem: cos T = 1 - 2 sin²(T/2) by the double-angle formula.'
  - 'derive: 0 < T/2 < π gives sin(T/2) > 0, so cos T < 1.'
  - 'conclude: This contradicts cos T = 1.'
  openmath: (forall (T) (-> (and (> T 0) (forall (x) (= (sin (+ x T)) (sin x)))) (<= (* 2 pi) T)))
  hard_negative:
    statement: 正の実数$T$が任意の実数$x$について$|\sin(x+T)|=|\sin x|$をみたすならば、$T\geq2\pi$である。
    reason: $T=\pi$は条件をみたすが$\pi<2\pi$である。$|\sin x|$の周期は$\pi$である。
  target: |
    ∀ T : ℝ, 0 < T → (∀ x : ℝ, Real.sin (x + T) = Real.sin x) → 2 * Real.pi ≤ T
  proof: |
    by
      intro T hT h
      by_contra hlt
      have hlt' : T < 2 * Real.pi := not_le.mp hlt
      have h1 := h (Real.pi / 2)
      have h2 : Real.sin (Real.pi / 2 + T) = Real.cos T := by
        rw [add_comm, Real.sin_add_pi_div_two]
      rw [h2, Real.sin_pi_div_two] at h1
      have hneg : -(2 * Real.pi) < T := by linarith [Real.pi_pos]
      have := (Real.cos_eq_one_iff_of_lt_of_lt hneg hlt').mp h1
      linarith
- id: sin_cos_sub
  kind: textbook
  level: high
  topic: 三角関数・加法定理
  statement: 任意の実数$x,y$について$\sin(x-y)=\sin x\cos y-\cos x\sin y$かつ$\cos(x-y)=\cos x\cos y+\sin x\sin y$である。
  statement_en: For all real x, y, sin(x-y) = sin x cos y - cos x sin y and cos(x-y) = cos x cos y + sin x sin y.
  assumptions:
  - $x,y$は実数
  quantifiers:
  - 任意の実数$x,y$
  conclusion: 差の角の正弦と余弦の公式が成り立つ。
  answer: |
    $x,y$を実数とする。和の加法定理$\sin(x+z)=\sin x\cos z+\cos x\sin z$、$\cos(x+z)=\cos x\cos z-\sin x\sin z$で$z=-y$とおく。$\cos(-y)=\cos y$、$\sin(-y)=-\sin y$を代入すると結論を得る。
  strategy: Apply the sum formulas to x + (-y) and use the parity of sine and cosine.
  sketch:
  - 'apply_theorem: Use the sum formulas with second angle -y.'
  - 'derive: Substitute cos(-y) = cos y and sin(-y) = -sin y.'
  - 'conclude: The difference formulas follow.'
  openmath: (forall (x y) (and (= (sin (- x y)) (- (* (sin x) (cos y)) (* (cos x) (sin y)))) (= (cos (- x y)) (+ (* (cos x) (cos y)) (* (sin x) (sin y))))))
  hard_negative:
    statement: 任意の実数$x,y$について$\cos(x-y)=\cos x\cos y-\sin x\sin y$である。
    reason: $x=y=\pi/2$では左辺は$1$、右辺は$-1$である。差の角では符号が和の角と逆になる。
  target: |
    ∀ x y : ℝ, Real.sin (x - y) = Real.sin x * Real.cos y - Real.cos x * Real.sin y ∧ Real.cos (x - y) = Real.cos x * Real.cos y + Real.sin x * Real.sin y
  proof: |
    by
      intro x y
      exact ⟨Real.sin_sub x y, Real.cos_sub x y⟩
- id: tan_add_formula
  kind: named
  level: high
  topic: 三角関数・正接の加法定理
  statement: 実数$x,y$が$\cos x\neq0$、$\cos y\neq0$、$\cos(x+y)\neq0$をみたすとき、$\tan(x+y)=\dfrac{\tan x+\tan y}{1-\tan x\tan y}$である。
  statement_en: If x, y are real with cos x ≠ 0, cos y ≠ 0 and cos(x+y) ≠ 0, then tan(x+y) = (tan x + tan y)/(1 - tan x tan y).
  assumptions:
  - $x,y$は実数
  - $\cos x\neq0$
  - $\cos y\neq0$
  - $\cos(x+y)\neq0$
  quantifiers:
  - 上の条件をみたす任意の実数$x,y$
  conclusion: 和の角の正接の公式が成り立つ。
  answer: |
    $x,y$を$\cos x\neq0$、$\cos y\neq0$、$\cos(x+y)\neq0$をみたす実数とする。加法定理より
    $\tan(x+y)=\dfrac{\sin x\cos y+\cos x\sin y}{\cos x\cos y-\sin x\sin y}$である。ここで分母は$\cos(x+y)\neq0$である。分子と分母を$\cos x\cos y\neq0$で割ると、分子は$\tan x+\tan y$、分母は$1-\tan x\tan y$となる。分母の$1-\tan x\tan y=\cos(x+y)/(\cos x\cos y)$は$0$でない。よって結論を得る。
  strategy: Write tan(x+y) as a quotient via the addition formulas and divide by cos x cos y.
  sketch:
  - 'setup: Assume cos x, cos y and cos(x+y) are nonzero.'
  - 'apply_theorem: Expand the numerator and denominator by the addition formulas.'
  - 'derive: Divide both by cos x cos y.'
  - 'derive: The new denominator 1 - tan x tan y equals cos(x+y)/(cos x cos y), which is nonzero.'
  - 'conclude: The quotient is the claimed formula.'
  openmath: (forall (x y) (-> (and (!= (cos x) 0) (!= (cos y) 0) (!= (cos (+ x y)) 0)) (= (tan (+ x y)) (/ (+ (tan x) (tan y)) (- 1 (* (tan x) (tan y)))))))
  hard_negative:
    statement: $\cos x\neq0$、$\cos y\neq0$、$\cos(x+y)\neq0$のとき$\tan(x+y)=\dfrac{\tan x+\tan y}{1+\tan x\tan y}$である。
    reason: 分母の符号が違う。$x=y=\pi/6$では$\tan(\pi/3)=\sqrt{3}$だが、右辺は$\dfrac{2/\sqrt3}{4/3}=\dfrac{\sqrt3}{2}$である。
  target: |
    ∀ x y : ℝ, Real.cos x ≠ 0 → Real.cos y ≠ 0 → Real.cos (x + y) ≠ 0 → Real.tan (x + y) = (Real.tan x + Real.tan y) / (1 - Real.tan x * Real.tan y)
  proof: |
    by
      intro x y hx hy hxy
      have hd : Real.cos x * Real.cos y - Real.sin x * Real.sin y ≠ 0 := by rwa [← Real.cos_add]
      have h1 : 1 - Real.tan x * Real.tan y = (Real.cos x * Real.cos y - Real.sin x * Real.sin y) / (Real.cos x * Real.cos y) := by
        rw [Real.tan_eq_sin_div_cos, Real.tan_eq_sin_div_cos]
        field_simp
      have h2 : Real.tan x + Real.tan y = (Real.sin x * Real.cos y + Real.cos x * Real.sin y) / (Real.cos x * Real.cos y) := by
        rw [Real.tan_eq_sin_div_cos, Real.tan_eq_sin_div_cos]
        field_simp
      rw [h1, h2, Real.tan_eq_sin_div_cos, Real.sin_add, Real.cos_add]
      field_simp
