- id: sin_ge_iff_on_interval
  kind: gap
  level: high
  topic: 三角不等式・解の範囲
  statement: 実数$a,x$が$-\dfrac{\pi}{2}\leq a\leq\dfrac{\pi}{2}$、$-\dfrac{\pi}{2}\leq x\leq\dfrac{3\pi}{2}$をみたすとき、$\sin a\leq\sin x$と$a\leq x\leq\pi-a$は同値である。
  statement_en: If a, x are real with -π/2 ≤ a ≤ π/2 and -π/2 ≤ x ≤ 3π/2, then sin a ≤ sin x if and only if a ≤ x ≤ π - a.
  assumptions:
  - $a,x$は実数
  - $-\pi/2\leq a\leq\pi/2$
  - $-\pi/2\leq x\leq3\pi/2$
  quantifiers:
  - 上の条件をみたす任意の実数$a,x$
  conclusion: この周期の範囲で$\sin x\geq\sin a$の解は$a\leq x\leq\pi-a$である。
  answer: |
    $a,x$を$-\pi/2\leq a\leq\pi/2$、$-\pi/2\leq x\leq3\pi/2$をみたす実数とする。$\sin$は$[-\pi/2,\pi/2]$で狭義に増加する。$x\leq\pi/2$のとき、$\sin a\leq\sin x$は$a\leq x$と同値である。さらに$x\leq\pi/2\leq\pi-a$は常に成り立つので、$a\leq x\leq\pi-a$とも同値である。$x>\pi/2$のときは$\pi-x\in[-\pi/2,\pi/2)$であり$\sin x=\sin(\pi-x)$なので、$\sin a\leq\sin x$は$a\leq\pi-x$すなわち$x\leq\pi-a$と同値である。さらに$a\leq\pi/2<x$は常に成り立つので、$a\leq x\leq\pi-a$とも同値である。
  strategy: Split at x = π/2 and use strict monotonicity of sine, reflecting x by π - x on the upper part.
  sketch:
  - 'apply_theorem: Sine is strictly increasing on [-π/2, π/2].'
  - 'case_split: Split according to x ≤ π/2 or x > π/2.'
  - 'derive: For x ≤ π/2 the inequality means a ≤ x, and x ≤ π - a is automatic.'
  - 'derive: For x > π/2 use sin x = sin(π - x), so the inequality means x ≤ π - a, and a ≤ x is automatic.'
  - 'conclude: Both cases give a ≤ x ≤ π - a.'
  openmath: (forall (a x) (-> (and (<= (neg (/ pi 2)) a) (<= a (/ pi 2)) (<= (neg (/ pi 2)) x) (<= x (/ (* 3 pi) 2))) (<-> (<= (sin a) (sin x)) (and (<= a x) (<= x (- pi a))))))
  hard_negative:
    statement: 任意の実数$x$と$-\dfrac{\pi}{2}\leq a\leq\dfrac{\pi}{2}$をみたす実数$a$について、$\sin a\leq\sin x$と$a\leq x\leq\pi-a$は同値である。
