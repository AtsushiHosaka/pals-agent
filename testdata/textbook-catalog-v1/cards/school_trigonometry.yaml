  topic: 三角不等式・解の範囲
  statement: 実数$a,x$が$0\leq a\leq\pi$、$-\pi\leq x\leq\pi$をみたすとき、$\cos a\leq\cos x$と$|x|\leq a$は同値である。
  statement_en: If a, x are real with 0 ≤ a ≤ π and -π ≤ x ≤ π, then cos a ≤ cos x if and only if |x| ≤ a.
  assumptions:
  - $a,x$は実数
  - $0\leq a\leq\pi$
  - $-\pi\leq x\leq\pi$
  quantifiers:
  - 上の条件をみたす任意の実数$a,x$
  conclusion: この周期の範囲で$\cos x\geq\cos a$の解は$|x|\leq a$である。
  answer: |
    $a,x$を$0\leq a\leq\pi$、$-\pi\leq x\leq\pi$をみたす実数とする。$\cos$は偶関数なので$\cos x=\cos|x|$であり、$|x|\in[0,\pi]$である。$\cos$は$[0,\pi]$で狭義に減少するから、$\cos a\leq\cos|x|$は$|x|\leq a$と同値である。
  strategy: Replace x by |x| using evenness, then use strict monotonicity on [0, π].
  sketch:
  - 'translate: cos x = cos |x| and |x| lies in [0, π].'
  - 'apply_theorem: Cosine is strictly decreasing on [0, π].'
  - 'conclude: cos a ≤ cos |x| is equivalent to |x| ≤ a.'
  openmath: (forall (a x) (-> (and (<= 0 a) (<= a pi) (<= (neg pi) x) (<= x pi)) (<-> (<= (cos a) (cos x)) (<= (abs x) a))))
  hard_negative:
    statement: 実数$a,x$が$0\leq a\leq\pi$、$-\pi\leq x\leq\pi$をみたすとき、$\cos a\leq\cos x$と$x\leq a$は同値である。
    reason: $a=\pi/2$、$x=-\pi$では$x\leq a$だが$\cos a=0$、$\cos x=-1$である。下側の限界$-a$を落とせない。
  target: |
    ∀ a x : ℝ, 0 ≤ a → a ≤ Real.pi → -Real.pi ≤ x → x ≤ Real.pi → (Real.cos a ≤ Real.cos x ↔ |x| ≤ a)
  proof: |
    by
      intro a x ha1 ha2 hx1 hx2
      rw [← Real.cos_abs x]
      exact Real.strictAntiOn_cos.le_iff_ge ⟨ha1, ha2⟩ ⟨abs_nonneg x, abs_le.mpr ⟨hx1, hx2⟩⟩
- id: range_comp_sin_cos
