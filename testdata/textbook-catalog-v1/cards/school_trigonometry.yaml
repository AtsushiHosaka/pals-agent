  sketch:
  - 'derive: Given x, take t = sin x, which lies in [-1, 1].'
  - 'apply_theorem: Given t in [-1, 1], the intermediate value theorem gives x with sin x = t.'
  - 'derive: Then f(sin x) = f(t) = y.'
  - 'conclude: The same argument works for cosine with the values at 0 and π.'
  openmath: (forall (f y) (and (<-> (exists (x) (= (fn_value f (sin x)) y)) (exists (t) (and (<= (neg 1) t) (<= t 1) (= (fn_value f t) y)))) (<-> (exists (x) (= (fn_value f (cos x)) y)) (exists (t) (and (<= (neg 1) t) (<= t 1) (= (fn_value f t) y))))))
