- id: sin_mul_cos_product_to_sum
  kind: textbook
  level: high
  topic: 三角関数・積和の公式
  statement: 任意の実数$x,y$について$\sin x\cos y=\dfrac{\sin(x+y)+\sin(x-y)}{2}$である。
  statement_en: For all real x, y, sin x cos y = (sin(x+y) + sin(x-y))/2.
