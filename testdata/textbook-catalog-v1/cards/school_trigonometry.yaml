- id: cos_nat_mul_polynomial
  kind: gap
  level: high
  topic: 三角関数・整数倍角と多項式
  statement: 任意の$0$以上の整数$n$に対して、任意の実数$x$で$\cos nx=P(\cos x)$となる実数係数多項式$P$が存在する。
  statement_en: For every nonnegative integer n there is a real polynomial P with cos nx = P(cos x) for all real x.
  assumptions:
  - $n$は$0$以上の整数
  quantifiers:
  - 任意の$0$以上の整数$n$
  - ある実数係数多項式$P$
  - 任意の実数$x$
  conclusion: $\cos nx$は$\cos x$の多項式で表される。
  answer: |
    任意の$0$以上の整数$n$に対して、任意の実数$x$で$\cos nx=P_n(\cos x)$となる実数係数多項式$P_n$が存在することを、$n$に関する帰納法で示す。$n=0$では定数多項式$P_0=1$、$n=1$では$P_1(u)=u$とすればよい。$P_n,P_{n+1}$が得られているとする。積和の公式より$\cos(n+2)x+\cos nx=2\cos(n+1)x\cos x$であるから、$\cos(n+2)x=2\cos x\,P_{n+1}(\cos x)-P_n(\cos x)$である。よって$P_{n+2}(u)=2uP_{n+1}(u)-P_n(u)$は実数係数多項式であり、$\cos(n+2)x=P_{n+2}(\cos x)$をみたす。
  strategy: Use the three-term recurrence from the product-to-sum formula and induct in steps of two.
  sketch:
  - 'setup: Take P_0 = 1 and P_1(u) = u.'
  - 'apply_theorem: cos(n+2)x + cos nx = 2 cos(n+1)x cos x.'
  - 'construct: Define P_{n+2}(u) = 2u P_{n+1}(u) - P_n(u).'
  - 'induction: Two-step induction gives the identity for every n.'
  - 'conclude: Each P_n is a real polynomial.'
  openmath: (forall (n) (-> (in n N) (exists (p) (and (polynomial_over p R) (forall (x) (= (cos (* n x)) (polynomial_eval p (cos x))))))))
  hard_negative:
    statement: 任意の$0$以上の整数$n$に対して、任意の実数$x$で$\sin nx=P(\sin x)$となる実数係数多項式$P$が存在する。
    reason: $n=2$では、$x=\pi/4$と$x=3\pi/4$で$\sin x$が等しいのに$\sin2x$は$1$と$-1$であり、そのような$P$はない。
  target: |
    ∀ n : ℕ, ∃ P : Polynomial ℝ, ∀ x : ℝ, Real.cos (n * x) = P.eval (Real.cos x)
  proof: |
    by
      intro n
      exact ⟨Polynomial.Chebyshev.T ℝ n, fun x => (Polynomial.Chebyshev.T_real_cos x n).symm⟩
- id: sin_add_sin
  kind: textbook
  level: high
  topic: 三角関数・和積の公式
  statement: 任意の実数$x,y$について$\sin x+\sin y=2\sin\dfrac{x+y}{2}\cos\dfrac{x-y}{2}$である。
  statement_en: For all real x, y, sin x + sin y = 2 sin((x+y)/2) cos((x-y)/2).
  assumptions:
  - $x,y$は実数
  quantifiers:
  - 任意の実数$x,y$
  conclusion: 正弦の和が積で表される。
  answer: |
    $x,y$を実数とし、$u=(x+y)/2$、$v=(x-y)/2$とおくと$x=u+v$、$y=u-v$である。加法定理より$\sin x=\sin u\cos v+\cos u\sin v$、$\sin y=\sin u\cos v-\cos u\sin v$である。辺々を加えると$\sin x+\sin y=2\sin u\cos v$を得る。
  strategy: Write x and y as u + v and u - v and add the two addition formulas.
  sketch:
  - 'construct: Put u = (x+y)/2 and v = (x-y)/2.'
  - 'apply_theorem: Expand sin(u+v) and sin(u-v).'
  - 'conclude: Adding the two equations cancels the cos u sin v terms.'
  openmath: (forall (x y) (= (+ (sin x) (sin y)) (* (* 2 (sin (/ (+ x y) 2))) (cos (/ (- x y) 2)))))
  hard_negative:
    statement: 任意の実数$x,y$について$\sin x+\sin y=2\sin\dfrac{x+y}{2}\sin\dfrac{x-y}{2}$である。
    reason: $x=y=\pi/2$では左辺は$2$、右辺は$0$である。第2の因子は$\cos$である。
  target: |
    ∀ x y : ℝ, Real.sin x + Real.sin y = 2 * Real.sin ((x + y) / 2) * Real.cos ((x - y) / 2)
  proof: |
    by
      intro x y
      have h1 := Real.sin_add ((x + y) / 2) ((x - y) / 2)
      have h2 := Real.sin_sub ((x + y) / 2) ((x - y) / 2)
      rw [show (x + y) / 2 + (x - y) / 2 = x by ring] at h1
      rw [show (x + y) / 2 - (x - y) / 2 = y by ring] at h2
      rw [h1, h2]
      ring
