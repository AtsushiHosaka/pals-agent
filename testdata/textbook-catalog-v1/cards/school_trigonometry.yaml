- id: sum_cos_sin_multiples
  kind: gap
  level: high
  topic: 三角関数・積和による総和
  statement: 実数$x$が$\sin\dfrac{x}{2}\neq0$をみたし、$n$が$0$以上の整数のとき、$\displaystyle\sum_{k=1}^{n}\cos kx=\dfrac{\sin\left(n+\frac{1}{2}\right)x-\sin\frac{x}{2}}{2\sin\frac{x}{2}}$かつ$\displaystyle\sum_{k=1}^{n}\sin kx=\dfrac{\cos\frac{x}{2}-\cos\left(n+\frac{1}{2}\right)x}{2\sin\frac{x}{2}}$である。
  statement_en: If x is real with sin(x/2) ≠ 0 and n is a nonnegative integer, then the sum of cos kx for k = 1..n equals (sin((n+1/2)x) - sin(x/2))/(2 sin(x/2)), and the sum of sin kx for k = 1..n equals (cos(x/2) - cos((n+1/2)x))/(2 sin(x/2)).
  assumptions:
  - $x$は実数
  - $\sin(x/2)\neq0$
  - $n$は$0$以上の整数
  quantifiers:
  - $\sin(x/2)\neq0$をみたす任意の実数$x$と任意の$0$以上の整数$n$
  conclusion: 等差に並ぶ角の余弦と正弦の和が閉じた式で表される。
  answer: |
    $x$を$\sin(x/2)\neq0$をみたす実数、$n$を$0$以上の整数とする。積和の公式より、各$k$について
    $2\sin(x/2)\cos kx=\sin(k+1/2)x-\sin(k-1/2)x$である。$k=1,\dots,n$で辺々を加えると右辺は隣どうしが消えて$\sin(n+1/2)x-\sin(x/2)$となる。同様に$2\sin(x/2)\sin kx=\cos(k-1/2)x-\cos(k+1/2)x$を加えると$\cos(x/2)-\cos(n+1/2)x$となる。どちらも両辺を$2\sin(x/2)\neq0$で割れば結論を得る。$n=0$では両辺とも$0$である。
  strategy: Multiply by 2 sin(x/2), turn each term into a difference by the product-to-sum formulas, and telescope.
  sketch:
  - 'setup: Assume sin(x/2) ≠ 0.'
  - 'apply_theorem: 2 sin(x/2) cos kx = sin((k+1/2)x) - sin((k-1/2)x).'
  - 'apply_theorem: 2 sin(x/2) sin kx = cos((k-1/2)x) - cos((k+1/2)x).'
  - 'derive: The sums telescope.'
  - 'conclude: Divide by 2 sin(x/2).'
  openmath: (forall (x n) (-> (and (!= (sin (/ x 2)) 0) (in n N)) (and (= (sum (natural_range n) (lambda (k) (cos (* (+ k 1) x)))) (/ (- (sin (* (+ n (/ 1 2)) x)) (sin (/ x 2))) (* 2 (sin (/ x 2))))) (= (sum (natural_range n) (lambda (k) (sin (* (+ k 1) x)))) (/ (- (cos (/ x 2)) (cos (* (+ n (/ 1 2)) x))) (* 2 (sin (/ x 2))))))))
  hard_negative:
    statement: 任意の実数$x$と$0$以上の整数$n$について$\displaystyle\sum_{k=1}^{n}\cos kx=\dfrac{\sin\left(n+\frac{1}{2}\right)x-\sin\frac{x}{2}}{2\sin\frac{x}{2}}$である。
    reason: $x=2\pi$、$n=1$では左辺は$1$だが、右辺の分母は$0$である。$\sin(x/2)=0$の場合は別に扱う必要がある。
  target: |
