    reason: $f(t)=t$、$y=2$では$t=2$が解だが、$\sin x=2$となる$x$はない。置き換えた変数の範囲を$[-1,1]$に制限する必要がある。
  target: |
    ∀ (f : ℝ → ℝ) (y : ℝ), ((∃ x : ℝ, f (Real.sin x) = y) ↔ ∃ t : ℝ, -1 ≤ t ∧ t ≤ 1 ∧ f t = y) ∧ ((∃ x : ℝ, f (Real.cos x) = y) ↔ ∃ t : ℝ, -1 ≤ t ∧ t ≤ 1 ∧ f t = y)
