- id: tan_half_substitution
  kind: gap
  level: high
  topic: 三角関数・半角の正接による置き換え
  statement: 実数$x,t$が$\cos\dfrac{x}{2}\neq0$かつ$t=\tan\dfrac{x}{2}$をみたすとき、$\sin x=\dfrac{2t}{1+t^2}$かつ$\cos x=\dfrac{1-t^2}{1+t^2}$である。
  statement_en: If x and t are real with cos(x/2) ≠ 0 and t = tan(x/2), then sin x = 2t/(1+t²) and cos x = (1-t²)/(1+t²).
  assumptions:
  - $x,t$は実数
  - $\cos(x/2)\neq0$
  - $t=\tan(x/2)$
  quantifiers:
  - 上の条件をみたす任意の実数$x,t$
  conclusion: $\sin x$と$\cos x$は$t$の有理式で表される。
  answer: |
