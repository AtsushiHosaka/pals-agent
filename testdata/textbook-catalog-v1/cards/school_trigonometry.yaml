    ∀ a b : ℝ, (a ≠ 0 ∨ b ≠ 0) → ∃ α : ℝ, Real.cos α = a / Real.sqrt (a ^ 2 + b ^ 2) ∧ Real.sin α = b / Real.sqrt (a ^ 2 + b ^ 2) ∧ ∀ x : ℝ, a * Real.sin x + b * Real.cos x = Real.sqrt (a ^ 2 + b ^ 2) * Real.sin (x + α)
  proof: |
    by
      intro a b hab
      have hpos : 0 < a ^ 2 + b ^ 2 := by
        rcases hab with h | h
        · have := sq_pos_of_ne_zero h
          positivity
        · have := sq_pos_of_ne_zero h
          positivity
      have hr : 0 < Real.sqrt (a ^ 2 + b ^ 2) := Real.sqrt_pos.mpr hpos
