  quantifiers:
  - $2$ 以上の任意の整数 $n$
  conclusion: |
    余弦の和と正弦の和はともに $0$ である。
  answer: |
    $n\ge 2$ を整数とし、$\zeta=\cos\dfrac{2\pi}{n}+i\sin\dfrac{2\pi}{n}$ とおく。$\zeta^n=1$、$\zeta\neq 1$ なので、$(\zeta-1)\sum_{k=0}^{n-1}\zeta^k=\zeta^n-1=0$ より $\sum_{k=0}^{n-1}\zeta^k=0$ である。ド・モアブルの定理より $\zeta^k=\cos\dfrac{2\pi k}{n}+i\sin\dfrac{2\pi k}{n}$ である。和の実部と虚部がともに $0$ であることから、主張の2式を得る。
