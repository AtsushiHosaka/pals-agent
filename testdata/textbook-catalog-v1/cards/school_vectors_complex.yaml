  conclusion: |
    $\bar\zeta=\zeta^{-1}$ かつ $\bar\zeta=\zeta^{n-1}$ である。
  answer: |
    $n$ を正の整数、$\zeta$ を $\zeta^n=1$ を満たす複素数とする。絶対値をとると $|\zeta|^n=1$ であり、$|\zeta|\ge 0$ と $n>0$ より $|\zeta|=1$ である。よって $\bar\zeta\zeta=|\zeta|^2=1$ なので $\bar\zeta=\zeta^{-1}$ である。また $\zeta^{n-1}\zeta=\zeta^n=1$ より $\zeta^{n-1}=\zeta^{-1}$ である。
