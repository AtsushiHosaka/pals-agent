  - 'derive: z̄z = |z|² = 1 yields conj ζ = ζ⁻¹.'
  - 'conclude: ζ^(n-1) ζ = 1 yields ζ^(n-1) = ζ⁻¹.'
  openmath: (forall (z n) (-> (and (in z C) (in n N) (> n 0) (= (^ z n) 1)) (and (= (complex_conj z) (^ z (neg 1))) (= (complex_conj z) (^ z (- n 1))))))
