- id: root_of_unity_filter
  kind: gap
  level: high
  topic: 1のn乗根・係数の抽出
  statement: |
    正の整数 $n$、$1$ の原始 $n$ 乗根 $\zeta$、複素数列 $f_0,\dots,f_{m-1}$ について、$\sum_{j=0}^{n-1}\sum_{k=0}^{m-1}f_k(\zeta^j)^k=n\sum_{0\le k<m,\ n\mid k}f_k$ である。多項式 $F(x)=\sum_k f_kx^k$ で書くと、$\sum_{j=0}^{n-1}F(\zeta^j)$ は $n$ の倍数番目の係数の和の $n$ 倍である。
  statement_en: For a positive integer n, a primitive n-th root of unity ζ and complex numbers f_0, ..., f_(m-1), the sum over 0 ≤ j < n of the sum over 0 ≤ k < m of f_k (ζ^j)^k equals n times the sum of f_k over those k < m divisible by n.
  assumptions:
  - $n>0$
  - $\zeta$ は $1$ の原始 $n$ 乗根
  quantifiers:
  - 任意の正の整数 $n$、自然数 $m$、原始 $n$ 乗根 $\zeta$、複素数列 $f$
  conclusion: |
    $\sum_{j=0}^{n-1}\sum_{k=0}^{m-1}f_k(\zeta^j)^k=n\sum_{0\le k<m,\ n\mid k}f_k$ である。
  answer: |
    $n$ を正の整数、$m$ を自然数、$\zeta$ を $1$ の原始 $n$ 乗根、$f$ を複素数列とする。和の順序を交換し $(\zeta^j)^k=(\zeta^k)^j$ を用いると、左辺は $\sum_{k=0}^{m-1}f_k\sum_{j=0}^{n-1}(\zeta^k)^j$ である。内側の和は、$n\mid k$ のとき各項が $1$ なので $n$ である。$n\nmid k$ のときは $\zeta^k\neq 1$ かつ $(\zeta^k)^n=1$ であり、等比数列の和の公式から $0$ である。よって $n\mid k$ である項だけが残り、値は $n\sum_{0\le k<m,\ n\mid k}f_k$ である。
  strategy: Swap the order of summation and evaluate the inner geometric sum according to divisibility.
  sketch:
  - 'derive: Swap sums and write (ζ^j)^k = (ζ^k)^j.'
  - 'case_split: If n divides k, the inner sum is n.'
  - 'derive: Otherwise ζ^k ≠ 1 is an n-th root of unity, so the inner sum is 0.'
  - 'conclude: Only multiples of n remain.'
  openmath: (forall (z n m f) (-> (and (in z C) (in n N) (in m N) (> n 0) (primitive_root_of_unity z n)) (= (range_sum n (lambda (j) (range_sum m (lambda (k) (* (seq_value f k) (^ (^ z j) k)))))) (* n (range_sum_multiples_of n m (lambda (k) (seq_value f k)))))))
  hard_negative:
    statement: |
      $\zeta^n=1$ を満たすだけの $\zeta$ についても同じ等式が成り立つ。
    reason: |
      原始根でないと成り立たない。$\zeta=1$、$n=2$、$m=2$、$f_0=0$、$f_1=1$ なら左辺は $2$ だが、$2\nmid 1$ なので右辺は $0$ である。
  target: |
    ∀ (ζ : ℂ) (n m : ℕ) (f : ℕ → ℂ), 0 < n → IsPrimitiveRoot ζ n → ∑ j ∈ Finset.range n, ∑ k ∈ Finset.range m, f k * (ζ ^ j) ^ k = n * ∑ k ∈ (Finset.range m).filter (fun k => n ∣ k), f k
  proof: |
    by
      intro ζ n m f _ h
      have hs : ∀ k : ℕ, ∑ j ∈ Finset.range n, (ζ ^ k) ^ j = if n ∣ k then (n : ℂ) else 0 := by
        intro k
        split_ifs with hd
        · rw [(h.pow_eq_one_iff_dvd k).mpr hd]
          simp
        · have hne : ζ ^ k ≠ 1 := fun e => hd ((h.pow_eq_one_iff_dvd k).mp e)
          have hmul := geom_sum_mul (ζ ^ k) n
          rw [← pow_mul, mul_comm k n, pow_mul, h.pow_eq_one, one_pow, sub_self] at hmul
          exact (mul_eq_zero.mp hmul).resolve_right (sub_ne_zero.mpr hne)
      rw [Finset.sum_comm, Finset.sum_filter, Finset.mul_sum]
      refine Finset.sum_congr rfl fun k _ => ?_
      have e : ∀ j : ℕ, f k * (ζ ^ j) ^ k = f k * (ζ ^ k) ^ j := by
        intro j
        rw [← pow_mul, ← pow_mul, mul_comm j k]
      simp only [e]
      rw [← Finset.mul_sum, hs k]
      split_ifs <;> ring
