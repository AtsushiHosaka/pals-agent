  target: |
    ∀ (ζ : ℂ) (n : ℕ), 0 < n → ζ ^ n = 1 → (starRingEnd ℂ) ζ = ζ⁻¹ ∧ (starRingEnd ℂ) ζ = ζ ^ (n - 1)
