  sketch:
  - 'setup: Let ζ = cos(2π/n) + i sin(2π/n), a root of unity different from 1.'
  - 'derive: The geometric sum of ζ^k vanishes.'
  - 'apply_theorem: De Moivre gives ζ^k = cos(2πk/n) + i sin(2πk/n).'
  - 'conclude: Take real and imaginary parts.'
  openmath: (forall (n) (-> (and (in n N) (>= n 2)) (and (= (range_sum n (lambda (k) (cos (/ (* 2 pi k) n)))) 0) (= (range_sum n (lambda (k) (sin (/ (* 2 pi k) n)))) 0))))
  hard_negative:
    statement: |
      すべての正の整数 $n$ について $\sum_{k=0}^{n-1}\cos\dfrac{2\pi k}{n}=0$ である。
    reason: |
      $n=1$ では $\cos 0=1$ なので和は $1$ である。
  target: |
    ∀ n : ℕ, 2 ≤ n → ∑ k ∈ Finset.range n, Real.cos (2 * Real.pi * k / n) = 0 ∧ ∑ k ∈ Finset.range n, Real.sin (2 * Real.pi * k / n) = 0
  proof: |
    by
      intro n hn
      have hn0 : n ≠ 0 := by omega
      have hnC : (n : ℂ) ≠ 0 := by exact_mod_cast hn0
      have geom := (Complex.isPrimitiveRoot_exp n hn0).geom_sum_eq_zero (by omega)
      have e : ∀ k : ℕ, Complex.exp (2 * Real.pi * Complex.I / n) ^ k = Complex.exp (((2 * Real.pi * k / n : ℝ) : ℂ) * Complex.I) := by
        intro k
        rw [← Complex.exp_nat_mul]
        congr 1
        push_cast
        field_simp
      simp only [e] at geom
      constructor
      · have := congrArg Complex.re geom
        simpa only [Complex.re_sum, Complex.exp_ofReal_mul_I_re, Complex.zero_re] using this
      · have := congrArg Complex.im geom
        simpa only [Complex.im_sum, Complex.exp_ofReal_mul_I_im, Complex.zero_im] using this
- id: prod_one_sub_root_of_unity
  kind: gap
  level: high
  topic: 1のn乗根・積の公式
  statement: |
    正の整数 $n$ と $1$ の原始 $n$ 乗根 $\zeta$ に対し、$\prod_{k=1}^{n-1}(1-\zeta^k)=n$ であり、$\prod_{k=1}^{n-1}|1-\zeta^k|=n$ である。後者は、単位円に内接する正 $n$ 角形の1頂点から他の頂点までの距離の積が $n$ であることを表す。
  statement_en: For a positive integer n and a primitive n-th root of unity ζ, the product of (1-ζ^k) over 1 ≤ k < n equals n, and the product of |1-ζ^k| over the same range equals n.
  assumptions:
  - $n>0$
  - $\zeta$ は $1$ の原始 $n$ 乗根
  quantifiers:
  - 任意の正の整数 $n$ と任意の原始 $n$ 乗根 $\zeta$
  conclusion: |
    $\prod_{k=1}^{n-1}(1-\zeta^k)=n$ かつ $\prod_{k=1}^{n-1}|1-\zeta^k|=n$ である。
  answer: |
    $n$ を正の整数、$\zeta$ を $1$ の原始 $n$ 乗根とする。$1,\zeta,\dots,\zeta^{n-1}$ は $x^n-1$ の相異なる $n$ 個の根なので、$x^n-1=\prod_{k=0}^{n-1}(x-\zeta^k)$ である。$k=0$ の因子 $x-1$ で割ると、多項式の等式 $\sum_{j=0}^{n-1}x^j=\prod_{k=1}^{n-1}(x-\zeta^k)$ を得る。$x=1$ を代入すると $n=\prod_{k=1}^{n-1}(1-\zeta^k)$ である。両辺の絶対値をとると、積の絶対値は絶対値の積なので $\prod_{k=1}^{n-1}|1-\zeta^k|=n$ である。
  strategy: Factor x^n - 1 over the roots of unity, cancel x-1 and evaluate at 1.
  sketch:
  - 'apply_theorem: x^n - 1 is the product of x - ζ^k for 0 ≤ k < n.'
  - 'derive: Cancel x-1 to express the geometric sum as the remaining product.'
  - 'derive: Evaluate at x = 1 to get the value n.'
  - 'conclude: Taking absolute values gives the chord product.'
  openmath: (forall (z n) (-> (and (in z C) (in n N) (> n 0) (primitive_root_of_unity z n)) (and (= (ico_product 1 n (lambda (k) (- 1 (^ z k)))) n) (= (ico_product 1 n (lambda (k) (abs (- 1 (^ z k))))) n))))
  hard_negative:
    statement: |
      $\zeta^n=1$ を満たす任意の $\zeta$ について $\prod_{k=1}^{n-1}(1-\zeta^k)=n$ である。
    reason: |
      原始根でないと成り立たない。$\zeta=1$、$n=2$ なら左辺は $1-1=0$ である。
  target: |
    ∀ (ζ : ℂ) (n : ℕ), 0 < n → IsPrimitiveRoot ζ n → ∏ k ∈ Finset.Ico 1 n, (1 - ζ ^ k) = n ∧ ∏ k ∈ Finset.Ico 1 n, ‖1 - ζ ^ k‖ = n
  proof: |
    by
      intro ζ n hn h
      obtain ⟨m, rfl⟩ : ∃ m, n = m + 1 := ⟨n - 1, by omega⟩
      have e : ∏ k ∈ Finset.Ico 1 (m + 1), (1 - ζ ^ k) = ((m + 1 : ℕ) : ℂ) := by
        rw [Finset.prod_Ico_eq_prod_range]
        simp only [Nat.add_sub_cancel, add_comm 1]
        have := h.prod_one_sub_pow_eq_order
        push_cast
        exact this
      refine ⟨e, ?_⟩
      rw [← norm_prod, e, Complex.norm_natCast]
