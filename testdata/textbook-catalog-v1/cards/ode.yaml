    ∀ (a b r t : ℝ), r ^ 2 + a * r + b = 0 → HasDerivAt (fun s => Real.exp (r * s)) (r * Real.exp (r * t)) t ∧ HasDerivAt (fun s => r * Real.exp (r * s)) (-(a * (r * Real.exp (r * t))) - b * Real.exp (r * t)) t
  proof: |
    by
      intro a b r t hr
      have he : HasDerivAt (fun s => Real.exp (r * s)) (Real.exp (r * t) * (r * 1)) t :=
