  topic: 常微分方程式・調和振動子
  statement: y''=-ω²yの全実数上の解について、エネルギーy'²+ω²y²は時間によらず一定である。
  statement_en: "For a solution on ℝ of y'' = -ω² y, the energy y'² + ω² y² is constant in time."
  assumptions:
    - "全実数上でy'=v"
    - "全実数上でv'=-ω²y"
  quantifiers:
    - "任意の実数ωと関数y, v"
    - "任意の実数s, t"
  conclusion: v(t)²+ω²y(t)²=v(s)²+ω²y(s)²が成り立つ。
