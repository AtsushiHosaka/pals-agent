  strategy: Expand with the binomial theorem, valid because A and B commute, and rearrange the absolutely convergent double series.
  sketch:
    - "derive: Commutativity gives (A+B)^n / n! = Σ_{k+l=n} A^k B^l / (k! l!)."
    - "apply_theorem: The exponential series converge absolutely, so their Cauchy product may be rearranged."
    - "conclude: Grouping by k + l = n gives exp(A) exp(B) = exp(A+B)."
  openmath: (forall (A B) (-> (and (matrix_square R A) (matrix_square R B) (commuting_matrices A B)) (= (matrix_exp (+ A B)) (matrix_mul (matrix_exp A) (matrix_exp B)))))
  hard_negative:
    statement: 任意の実正方行列A, Bについてexp(A+B)=exp(A)exp(B)である。
    reason: 非可換なら一般に成り立たない。A=[[0,1],[0,0]], B=[[0,0],[1,0]]では両辺が異なる。
  target: |
    ∀ (m : Type*) [Fintype m] [DecidableEq m] (A B : Matrix m m ℝ), Commute A B → NormedSpace.exp (A + B) = NormedSpace.exp A * NormedSpace.exp B
  proof: |
    by
      intro m _ _ A B h
      exact Matrix.exp_add_of_commute A B h
- id: matrix_exponential_neg_inverse
  kind: gap
  level: 3
  topic: 常微分方程式・行列の指数関数
  statement: 実正方行列Aについて、exp(-A)はexp(A)の逆行列である。
  statement_en: "For a real square matrix A, exp(-A) is the inverse matrix of exp(A)."
  assumptions:
    - "Aは実正方行列"
  quantifiers:
    - "任意の実正方行列A"
  conclusion: exp(-A)=(exp A)⁻¹が成り立つ。
  answer: |
    Aと-Aは可換なので、指数法則によりexp(A)exp(-A)=exp(A-A)=exp(0)=Iである。同様にexp(-A)exp(A)=Iとなる。よってexp(A)は可逆であり、その逆行列はexp(-A)である。
  strategy: Apply the exponential law to the commuting pair A, -A.
  sketch:
    - "translate: A and -A commute."
    - "apply_theorem: The exponential law gives exp(A) exp(-A) = exp(0) = I."
    - "conclude: Hence exp(-A) is the inverse of exp(A)."
  openmath: (forall (A) (-> (matrix_square R A) (= (matrix_exp (neg A)) (matrix_inverse (matrix_exp A)))))
  hard_negative:
    statement: 実正方行列Aについてexp(-A)=(exp A)ᵀである。
    reason: A=Iならexp(I)=eIでその転置もeIだが、exp(-I)=e^{-1}Iなので一致しない。
  target: |
    ∀ (m : Type*) [Fintype m] [DecidableEq m] (A : Matrix m m ℝ), NormedSpace.exp (-A) = (NormedSpace.exp A)⁻¹
  proof: |
    by
      intro m _ _ A
      exact Matrix.exp_neg A
