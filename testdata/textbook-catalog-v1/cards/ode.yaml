- id: exp_solution_iff
  kind: textbook
  level: 1
  topic: 常微分方程式・定数係数1階線形
  statement: $a\in\mathbb{R}$と$y:\mathbb{R}\to\mathbb{R}$について、全実数上で$y'=ay$が成り立つことと、全ての$t$で$y(t)=y(0)e^{at}$となることは同値である。
  statement_en: 'For real a and y : ℝ → ℝ, y is differentiable with y'' = a y on all of ℝ if and only if y(t) = y(0) e^{at} for all t.'
  assumptions:
  - $a\in\mathbb{R}$
  - $y:\mathbb{R}\to\mathbb{R}$
  quantifiers:
  - 任意の$a\in\mathbb{R}$と$y:\mathbb{R}\to\mathbb{R}$
  conclusion: 全ての$t$で$y$の微分係数が$ay(t)$であることと、全ての$t$で$y(t)=y(0)e^{at}$であることは同値である。
  answer: |
    $a\in\mathbb{R}$、$y:\mathbb{R}\to\mathbb{R}$とする。
    全実数上で$y'=ay$であるとする。$g(t)=y(t)e^{-at}$とおくと、積の微分より$g'(t)=ay(t)e^{-at}-ay(t)e^{-at}=0$である。全実数上で導関数が$0$の関数は平均値の定理より定数なので、$g(t)=g(0)=y(0)$である。よって$y(t)=y(0)e^{at}$である。
    逆に全ての$t$で$y(t)=y(0)e^{at}$なら、$y$は微分可能で$y'(t)=ay(0)e^{at}=ay(t)$である。
  strategy: Multiply by the integrating factor e^{-at} so the product has zero derivative, then conclude it is constant.
  sketch:
  - 'setup: Assume y'' = a y and put g(t) = y(t) e^{-at}.'
  - 'derive: The product rule gives g''(t) = a y e^{-at} - a y e^{-at} = 0.'
  - 'apply_theorem: A function with zero derivative on ℝ is constant, so g(t) = g(0) = y(0).'
  - 'conclude: Multiply by e^{at} to get y(t) = y(0) e^{at}; the converse is direct differentiation.'
  openmath: (forall (a y) (<-> (forall (t) (has_deriv_at (lambda (r0) (fn_value y r0)) (* a (fn_value y t)) t)) (forall (t) (= (fn_value y t) (* (fn_value y 0) (exp (* a t)))))))
  hard_negative:
    statement: 区間の和(-∞,0)∪(0,∞)の上でy'=ayなら、y(t)=y(1)e^{a(t-1)}が定義域全体で成り立つ。
    reason: 定義域が連結でないと定数倍が成分ごとに異なってよく、t<0とt>0で別の係数を持つ解が存在する。
  target: |
    ∀ (a : ℝ) (y : ℝ → ℝ), (∀ t, HasDerivAt y (a * y t) t) ↔ ∀ t, y t = y 0 * Real.exp (a * t)
  proof: |
    by
      intro a y
      constructor
      · intro hy t
        have hg : ∀ s, HasDerivAt (fun s => y s * Real.exp (-(a * s))) 0 s := by
          intro s
          have h1 : HasDerivAt (fun s : ℝ => -(a * s)) (-(a * 1)) s :=
            ((hasDerivAt_id s).const_mul a).neg
          have h2 : HasDerivAt (fun s => y s * Real.exp (-(a * s)))
              (a * y s * Real.exp (-(a * s)) + y s * (Real.exp (-(a * s)) * (-(a * 1)))) s :=
            (hy s).mul h1.exp
          exact h2.congr_deriv (by ring)
        have hc : y t * Real.exp (-(a * t)) = y 0 * Real.exp (-(a * 0)) :=
          is_const_of_deriv_eq_zero (fun s => (hg s).differentiableAt) (fun s => (hg s).deriv) t 0
        have hone : Real.exp (-(a * t)) * Real.exp (a * t) = 1 := by
          rw [← Real.exp_add]; simp
        calc y t = y t * Real.exp (-(a * t)) * Real.exp (a * t) := by
              rw [mul_assoc, hone, mul_one]
          _ = y 0 * Real.exp (a * t) := by rw [hc]; simp
      · intro h t
        have hy : y = fun s => y 0 * Real.exp (a * s) := funext h
        have h1 : HasDerivAt (fun s : ℝ => a * s) (a * 1) t := (hasDerivAt_id t).const_mul a
        have h2 : HasDerivAt (fun s => y 0 * Real.exp (a * s))
            (y 0 * (Real.exp (a * t) * (a * 1))) t := h1.exp.const_mul (y 0)
        rw [h t, hy]
        simpa [mul_comm, mul_left_comm, mul_assoc] using h2
- id: homogeneous_linear_formula
  kind: gap
  level: 2
  topic: 常微分方程式・変数係数1階線形
  statement: $p,P,y:\mathbb{R}\to\mathbb{R}$について、全実数上で$P'=p$かつ$y'=p(t)y$ならば、任意の$s,t\in\mathbb{R}$で$y(t)=y(s)e^{P(t)-P(s)}$である。
  statement_en: If P' = p on ℝ and y' = p(t) y on ℝ, then y(t) = y(s) exp(P(t) - P(s)) for all s and t.
  assumptions:
  - 全実数上で$P'=p$
  - 全実数上で$y'(t)=p(t)y(t)$
  quantifiers:
  - 任意の$p,P,y:\mathbb{R}\to\mathbb{R}$
  - 任意の$s,t\in\mathbb{R}$
  conclusion: $y(t)=y(s)e^{P(t)-P(s)}$である。
  answer: |
    $p,P,y:\mathbb{R}\to\mathbb{R}$とし、全実数上で$P'=p$、$y'(t)=p(t)y(t)$であるとする。$s,t\in\mathbb{R}$をとる。
    $g(u)=y(u)e^{-P(u)}$とおくと、積の微分と合成関数の微分より$g'(u)=p(u)y(u)e^{-P(u)}-y(u)p(u)e^{-P(u)}=0$である。全実数上で導関数が$0$の関数は平均値の定理より定数なので、$g(t)=g(s)$、すなわち$y(t)e^{-P(t)}=y(s)e^{-P(s)}$である。両辺に$e^{P(t)}$を掛けると$y(t)=y(s)e^{P(t)-P(s)}$を得る。
  strategy: Show that y e^{-P} has zero derivative, hence is constant.
  sketch:
  - 'setup: Put g = y e^{-P}.'
  - 'derive: The product and chain rules give g'' = p y e^{-P} - p y e^{-P} = 0.'
  - 'apply_theorem: A function with zero derivative on ℝ is constant, so g(t) = g(s).'
  - 'conclude: Multiplying by e^{P(t)} gives the formula.'
  openmath: (forall (p P y) (-> (and (forall (t) (has_deriv_at (lambda (r0) (fn_value P r0)) (fn_value p t) t)) (forall (t) (has_deriv_at (lambda (r0) (fn_value y r0)) (* (fn_value p t) (fn_value y t)) t))) (forall (s t) (= (fn_value y t) (* (fn_value y s) (exp (- (fn_value P t) (fn_value P s))))))))
  hard_negative:
    statement: y'=p(t)yならばy(t)=y(s)exp(p(t)(t-s))である。
    reason: pが定数でないと指数はpの原始関数の差であり、例えばp(t)=2t, y=e^{t²}, s=0, t=1ではy(1)=eだがy(0)exp(p(1)·1)=e²である。
  target: |
    ∀ (p P y : ℝ → ℝ), (∀ t, HasDerivAt P (p t) t) → (∀ t, HasDerivAt y (p t * y t) t) → ∀ s t, y t = y s * Real.exp (P t - P s)
  proof: |
    by
      intro p P y hP hy s t
      have hg : ∀ u, HasDerivAt (fun u => y u * Real.exp (-P u)) 0 u := by
        intro u
        have h : HasDerivAt (fun u => y u * Real.exp (-P u))
            (p u * y u * Real.exp (-P u) + y u * (Real.exp (-P u) * (-(p u)))) u :=
          (hy u).mul (hP u).neg.exp
        exact h.congr_deriv (by ring)
      have hc : y t * Real.exp (-P t) = y s * Real.exp (-P s) :=
        is_const_of_deriv_eq_zero (fun u => (hg u).differentiableAt) (fun u => (hg u).deriv) t s
      have hone : Real.exp (-P t) * Real.exp (P t) = 1 := by
        rw [← Real.exp_add]; simp
      have hE : Real.exp (P t - P s) = Real.exp (-P s) * Real.exp (P t) := by
        rw [← Real.exp_add]; congr 1; ring
      calc y t = y t * Real.exp (-P t) * Real.exp (P t) := by rw [mul_assoc, hone, mul_one]
        _ = y s * Real.exp (-P s) * Real.exp (P t) := by rw [hc]
        _ = y s * Real.exp (P t - P s) := by rw [hE, mul_assoc]
- id: integrating_factor_derivative
  kind: gap
  level: 2
  topic: 常微分方程式・積分因子
  statement: $p,q,P,y:\mathbb{R}\to\mathbb{R}$、$t\in\mathbb{R}$について、点$t$で$P$の微分係数が$p(t)$、$y$の微分係数が$q(t)-p(t)y(t)$ならば、$s\mapsto e^{P(s)}y(s)$の点$t$での微分係数は$e^{P(t)}q(t)$である。
  statement_en: If P'(t) = p(t) and y'(t) = q(t) - p(t) y(t) at the point t, then the derivative of e^{P} y at t equals e^{P(t)} q(t).
  assumptions:
  - 点$t$で$P$の微分係数は$p(t)$
  - 点$t$で$y$の微分係数は$q(t)-p(t)y(t)$
  quantifiers:
  - 任意の$p,q,P,y:\mathbb{R}\to\mathbb{R}$と$t\in\mathbb{R}$
  conclusion: $s\mapsto e^{P(s)}y(s)$は点$t$で微分可能で、微分係数は$e^{P(t)}q(t)$である。
  answer: |
    $p,q,P,y:\mathbb{R}\to\mathbb{R}$、$t\in\mathbb{R}$とし、点$t$で$P$の微分係数が$p(t)$、$y$の微分係数が$q(t)-p(t)y(t)$であるとする。積の微分と合成関数の微分より、$s\mapsto e^{P(s)}y(s)$の点$t$での微分係数は
    $e^{P(t)}p(t)y(t)+e^{P(t)}(q(t)-p(t)y(t))=e^{P(t)}q(t)$
    である。
  strategy: Differentiate the product e^{P} y and cancel the p y terms using the equation.
  sketch:
  - 'apply_theorem: The chain rule gives (e^{P})''(t) = e^{P(t)} p(t).'
  - 'derive: The product rule gives (e^{P} y)''(t) = e^{P(t)} p(t) y(t) + e^{P(t)} y''(t).'
  - 'conclude: Substituting y''(t) = q(t) - p(t) y(t) cancels the p y terms.'
  openmath: (forall (p q P y t) (-> (and (has_deriv_at (lambda (s) (fn_value P s)) (fn_value p t) t) (has_deriv_at (lambda (s) (fn_value y s)) (- (fn_value q t) (* (fn_value p t) (fn_value y t))) t)) (has_deriv_at (lambda (s) (* (exp (fn_value P s)) (fn_value y s))) (* (exp (fn_value P t)) (fn_value q t)) t)))
  hard_negative:
    statement: Pがpの原始関数でy'=q-pyなら、e^{p}yの導関数はe^{p}qである。
    reason: 積分因子の指数はpの原始関数でなければならず、指数をpにするとp'yの項が残り、p'yとpyが一致しない限り打ち消されない。
  target: |
    ∀ (p q P y : ℝ → ℝ) (t : ℝ), HasDerivAt P (p t) t → HasDerivAt y (q t - p t * y t) t → HasDerivAt (fun s => Real.exp (P s) * y s) (Real.exp (P t) * q t) t
  proof: |
    by
      intro p q P y t hP hy
      have h : HasDerivAt (fun s => Real.exp (P s) * y s)
          (Real.exp (P t) * p t * y t + Real.exp (P t) * (q t - p t * y t)) t :=
        hP.exp.mul hy
      exact h.congr_deriv (by ring)
- id: linear_first_order_solution_formula
  kind: textbook
  level: 2
  topic: 常微分方程式・1階線形の解の公式
  statement: $p,q,P,y:\mathbb{R}\to\mathbb{R}$について、$q$が連続、全実数上で$P'=p$かつ$y'=q-py$ならば、任意の$a,t\in\mathbb{R}$で$y(t)=e^{-P(t)}\left(e^{P(a)}y(a)+\int_a^te^{P(s)}q(s)\,ds\right)$である。
  statement_en: If q is continuous, P' = p and y' + p y = q on ℝ, then y(t) = e^{-P(t)} (e^{P(a)} y(a) + ∫_a^t e^{P(s)} q(s) ds) for all a and t.
  assumptions:
  - $q$は連続
  - 全実数上で$P'=p$
  - 全実数上で$y'=q-py$
  quantifiers:
  - 任意の$p,q,P,y:\mathbb{R}\to\mathbb{R}$
  - 任意の$a,t\in\mathbb{R}$
  conclusion: $y(t)=e^{-P(t)}\left(e^{P(a)}y(a)+\int_a^te^{P(s)}q(s)\,ds\right)$である。
  answer: |
    $p,q,P,y:\mathbb{R}\to\mathbb{R}$、$a,t\in\mathbb{R}$とし、$q$は連続で、全実数上で$P'=p$、$y'=q-py$であるとする。
    積の微分より$(e^{P}y)'=e^{P}py+e^{P}(q-py)=e^{P}q$である。$P$は微分可能なので連続であり、$e^{P}q$は連続である。微分積分学の基本定理（連続な導関数をもつ$F$について$\int_a^tF'(s)\,ds=F(t)-F(a)$）を$F=e^{P}y$に用いると
    $e^{P(t)}y(t)-e^{P(a)}y(a)=\int_a^te^{P(s)}q(s)\,ds$
    となる。$e^{P(a)}y(a)$を移項して両辺に$e^{-P(t)}$を掛ければ結論を得る。
  strategy: Use the integrating factor e^{P}, integrate the resulting exact derivative, and solve for y.
  sketch:
  - 'derive: The product rule gives (e^{P} y)'' = e^{P} q on ℝ.'
  - 'setup: P is differentiable hence continuous, so e^{P} q is continuous and interval integrable.'
  - 'apply_theorem: The fundamental theorem of calculus gives e^{P(t)} y(t) - e^{P(a)} y(a) = ∫_a^t e^{P} q.'
  - 'conclude: Rearrange and multiply by e^{-P(t)}.'
  openmath: (forall (p q P y a t) (-> (and (continuous_map q) (forall (s) (has_deriv_at (lambda (r0) (fn_value P r0)) (fn_value p s) s)) (forall (s) (has_deriv_at (lambda (r0) (fn_value y r0)) (- (fn_value q s) (* (fn_value p s) (fn_value y s))) s))) (= (fn_value y t) (* (exp (neg (fn_value P t))) (+ (* (exp (fn_value P a)) (fn_value y a)) (interval_integral a t (lambda (s) (* (exp (fn_value P s)) (fn_value q s)))))))))
  hard_negative:
    statement: y'+py=qならy(t)=e^{-P(t)}∫_a^t e^{P(s)}q(s)dsである。
    reason: 初期値の項e^{P(a)}y(a)が欠けており、q=0でy(a)≠0の解では右辺が0になって成り立たない。
  target: |
    ∀ (p q P y : ℝ → ℝ) (a t : ℝ), Continuous q → (∀ s, HasDerivAt P (p s) s) → (∀ s, HasDerivAt y (q s - p s * y s) s) → y t = Real.exp (-P t) * (Real.exp (P a) * y a + ∫ s in a..t, Real.exp (P s) * q s)
  proof: |
    by
      intro p q P y a t hq hP hy
      have hd : ∀ s, HasDerivAt (fun s => Real.exp (P s) * y s) (Real.exp (P s) * q s) s := by
        intro s
        have h : HasDerivAt (fun s => Real.exp (P s) * y s)
            (Real.exp (P s) * p s * y s + Real.exp (P s) * (q s - p s * y s)) s :=
          (hP s).exp.mul (hy s)
        exact h.congr_deriv (by ring)
      have hPc : Continuous P := continuous_iff_continuousAt.2 fun s => (hP s).continuousAt
      have hc : Continuous fun s => Real.exp (P s) * q s := (Real.continuous_exp.comp hPc).mul hq
      have hint : (∫ s in a..t, Real.exp (P s) * q s) = Real.exp (P t) * y t - Real.exp (P a) * y a :=
        intervalIntegral.integral_eq_sub_of_hasDerivAt (fun s _ => hd s) (hc.intervalIntegrable a t)
      rw [hint, add_sub_cancel, ← mul_assoc, ← Real.exp_add]
      simp
- id: separable_first_integral
  kind: gap
  level: 2
  topic: 常微分方程式・変数分離形
  statement: $y,g,h,H,G:\mathbb{R}\to\mathbb{R}$について、全ての$t$で$y'(t)=g(t)h(y(t))$、$h(y(t))\neq0$、$H$の点$y(t)$での微分係数が$1/h(y(t))$、$G'(t)=g(t)$ならば、$H(y(t))-G(t)$は$t$によらず一定である。
  statement_en: If y' = g(t) h(y) on ℝ, h(y(t)) ≠ 0 for all t, H has derivative 1/h(y(t)) at y(t), and G' = g, then H(y(t)) - G(t) does not depend on t.
  assumptions:
  - 全ての$t$で$y'(t)=g(t)h(y(t))$
  - 全ての$t$で$h(y(t))\neq0$
  - 全ての$t$で$H$の点$y(t)$での微分係数は$1/h(y(t))$
  - 全ての$t$で$G'(t)=g(t)$
  quantifiers:
  - 任意の$y,g,h,H,G:\mathbb{R}\to\mathbb{R}$
  - 任意の$s,t\in\mathbb{R}$
  conclusion: $H(y(t))-G(t)=H(y(s))-G(s)$である。
  answer: |
    $y,g,h,H,G:\mathbb{R}\to\mathbb{R}$とし、全ての$t$で$y'(t)=g(t)h(y(t))$、$h(y(t))\neq0$、$H$の点$y(t)$での微分係数が$1/h(y(t))$、$G'(t)=g(t)$であるとする。$s,t\in\mathbb{R}$をとる。
    合成関数の微分より、$H\circ y$の点$t$での微分係数は$\dfrac{1}{h(y(t))}\cdot g(t)h(y(t))=g(t)$である。よって$H\circ y-G$の導関数は$g-g=0$である。全実数上で導関数が$0$の関数は平均値の定理より定数なので、$H(y(t))-G(t)=H(y(s))-G(s)$である。
  strategy: Differentiate H(y(t)) - G(t) by the chain rule and check that the derivative vanishes.
  sketch:
  - 'apply_theorem: The chain rule gives (H∘y)''(t) = (1/h(y(t))) g(t) h(y(t)).'
  - 'derive: Since h(y(t)) ≠ 0 this equals g(t), so (H∘y - G)'' = 0.'
  - 'apply_theorem: A function with zero derivative on ℝ is constant.'
  - 'conclude: Hence H(y(t)) - G(t) = H(y(s)) - G(s).'
  openmath: (forall (y g h H G) (-> (and (forall (t) (has_deriv_at (lambda (r0) (fn_value y r0)) (* (fn_value g t) (fn_value h (fn_value y t))) t)) (forall (t) (!= (fn_value h (fn_value y t)) 0)) (forall (t) (has_deriv_at (lambda (z) (fn_value H z)) (/ 1 (fn_value h (fn_value y t))) (fn_value y t))) (forall (t) (has_deriv_at (lambda (r0) (fn_value G r0)) (fn_value g t) t))) (forall (s t) (= (- (fn_value H (fn_value y t)) (fn_value G t)) (- (fn_value H (fn_value y s)) (fn_value G s))))))
  hard_negative:
    statement: y'=g(t)h(y)ならば、hが零点を持っていても全ての解がH(y)=G(t)+Cの形で得られる。
    reason: h(c)=0の点では定数解y≡cが存在するが、1/hが定義できないため変数分離の式からは得られない。
  target: |
    ∀ (y g h H G : ℝ → ℝ), (∀ t, HasDerivAt y (g t * h (y t)) t) → (∀ t, h (y t) ≠ 0) → (∀ t, HasDerivAt H (1 / h (y t)) (y t)) → (∀ t, HasDerivAt G (g t) t) → ∀ s t, H (y t) - G t = H (y s) - G s
  proof: |
    by
      intro y g h H G hy hne hH hG s t
      have hd : ∀ u, HasDerivAt (fun u => H (y u) - G u) 0 u := by
        intro u
        have h1 : HasDerivAt (fun u => H (y u)) (1 / h (y u) * (g u * h (y u))) u :=
          HasDerivAt.comp u (hH u) (hy u)
        have h2 : HasDerivAt (fun u => H (y u) - G u)
            (1 / h (y u) * (g u * h (y u)) - g u) u := h1.sub (hG u)
        refine h2.congr_deriv ?_
        have := hne u
        field_simp
        ring
      exact is_const_of_deriv_eq_zero (fun u => (hd u).differentiableAt) (fun u => (hd u).deriv) t s
- id: logistic_solution_check
  kind: gap
  level: 2
  topic: 常微分方程式・ロジスティック方程式
  statement: $r,C,t\in\mathbb{R}$、$1+Ce^{-rt}\neq0$とする。$y(s)=1/(1+Ce^{-rs})$は点$t$で微分可能で、$y'(t)=ry(t)(1-y(t))$を満たす。
  statement_en: At any point t with 1 + C e^{-rt} ≠ 0, the function y(s) = 1/(1 + C e^{-rs}) is differentiable and satisfies the logistic equation y'(t) = r y(t) (1 - y(t)).
  assumptions:
  - $r,C,t\in\mathbb{R}$
  - $1+Ce^{-rt}\neq0$
  quantifiers:
  - 任意の$r,C,t\in\mathbb{R}$
  conclusion: $y(s)=1/(1+Ce^{-rs})$は点$t$で微分可能で、$y'(t)=ry(t)(1-y(t))$である。
  answer: |
    $r,C,t\in\mathbb{R}$、$1+Ce^{-rt}\neq0$とする。$D(s)=1+Ce^{-rs}$、$y(s)=1/D(s)$とおく。$D$は微分可能で$D'(t)=-rCe^{-rt}$であり、$D(t)\neq0$である。商の微分より$y$は点$t$で微分可能で、$y'(t)=-D'(t)/D(t)^2=rCe^{-rt}/D(t)^2$である。
    一方、$1-y(t)=(D(t)-1)/D(t)=Ce^{-rt}/D(t)$なので、$ry(t)(1-y(t))=rCe^{-rt}/D(t)^2$である。両者は一致する。
  strategy: Differentiate the reciprocal of the denominator and compare with r y (1 - y) after clearing denominators.
  sketch:
  - 'setup: Put D(s) = 1 + C e^{-rs}, so D''(t) = -r C e^{-rt} and D(t) ≠ 0.'
  - 'apply_theorem: The quotient rule gives y''(t) = r C e^{-rt} / D(t)^2.'
  - 'derive: Since D - 1 = C e^{-rt}, we have r y (1 - y) = r C e^{-rt} / D(t)^2.'
  - 'conclude: The two expressions agree.'
  openmath: (forall (r C t) (-> (!= (+ 1 (* C (exp (neg (* r t))))) 0) (has_deriv_at (lambda (s) (/ 1 (+ 1 (* C (exp (neg (* r s))))))) (* (* r (/ 1 (+ 1 (* C (exp (neg (* r t))))))) (- 1 (/ 1 (+ 1 (* C (exp (neg (* r t)))))))) t)))
  hard_negative:
    statement: y(s)=1/(1+Ce^{-rs})は全てのC, rについて全実数上で微分可能である。
    reason: C<0かつr≠0では分母が0になる点があり、そこでyは定義されず方程式の解にならない。
  target: |
    ∀ (r C t : ℝ), 1 + C * Real.exp (-(r * t)) ≠ 0 → HasDerivAt (fun s => 1 / (1 + C * Real.exp (-(r * s)))) (r * (1 / (1 + C * Real.exp (-(r * t)))) * (1 - 1 / (1 + C * Real.exp (-(r * t))))) t
  proof: |
    by
      intro r C t hne
      have h0 : HasDerivAt (fun s : ℝ => -(r * s)) (-(r * 1)) t :=
        ((hasDerivAt_id t).const_mul r).neg
      have h1 : HasDerivAt (fun s => 1 + C * Real.exp (-(r * s)))
          (C * (Real.exp (-(r * t)) * (-(r * 1)))) t := (h0.exp.const_mul C).const_add 1
      have h2 : HasDerivAt (fun s => 1 / (1 + C * Real.exp (-(r * s))))
          ((0 * (1 + C * Real.exp (-(r * t))) - 1 * (C * (Real.exp (-(r * t)) * (-(r * 1))))) /
            (1 + C * Real.exp (-(r * t))) ^ 2) t := (hasDerivAt_const t (1 : ℝ)).div h1 hne
      refine h2.congr_deriv ?_
      field_simp
      ring
- id: comparison_exponential_upper_bound
  kind: gap
  level: 2
  topic: 常微分方程式・比較定理
  statement: $s\leq t$とする。$f:\mathbb{R}\to\mathbb{R}$が$[s,t]$で連続で、$(s,t)$の各点$u$で微分係数$f_1(u)$をもち、$f_1(u)\leq af(u)$ならば、$f(t)\leq f(s)e^{a(t-s)}$である。
  statement_en: If f is continuous on [s,t], differentiable on (s,t) and f' ≤ a f on (s,t), then f(t) ≤ f(s) e^{a(t-s)}.
  assumptions:
  - $s\leq t$
  - $f$は$[s,t]$で連続
  - $u\in(s,t)$で$f$の微分係数は$f_1(u)$
  - $u\in(s,t)$で$f_1(u)\leq af(u)$
  quantifiers:
  - 任意の$f,f_1:\mathbb{R}\to\mathbb{R}$と$a,s,t\in\mathbb{R}$
  conclusion: $f(t)\leq f(s)e^{a(t-s)}$である。
  answer: |
    $f,f_1:\mathbb{R}\to\mathbb{R}$、$a,s,t\in\mathbb{R}$、$s\leq t$とする。$f$は$[s,t]$で連続で、$u\in(s,t)$で$f$の微分係数は$f_1(u)$、$f_1(u)\leq af(u)$であるとする。$a$や$f$の符号についての仮定はない。
    $s=t$なら両辺は$f(s)$である。$s<t$とし、$g(u)=f(u)e^{-au}$とおく。$g$は$[s,t]$で連続で、$u\in(s,t)$で$g'(u)=(f_1(u)-af(u))e^{-au}\leq0$である。平均値の定理より$g(t)-g(s)=g'(c)(t-s)\leq0$となる$c\in(s,t)$がある。よって$f(t)e^{-at}\leq f(s)e^{-as}$である。両辺に正の数$e^{at}$を掛けると$f(t)\leq f(s)e^{a(t-s)}$を得る。
  strategy: Show that f e^{-au} is nonincreasing using the sign of its derivative.
  sketch:
  - 'setup: Put g(u) = f(u) e^{-au} on [s,t].'
  - 'derive: On (s,t) we have g''(u) = (f''(u) - a f(u)) e^{-au} ≤ 0.'
  - 'apply_theorem: A continuous function with nonpositive derivative on the interior is nonincreasing.'
  - 'conclude: g(t) ≤ g(s), and multiplying by e^{at} > 0 gives the bound.'
  openmath: (forall (f f1 a s t) (-> (and (<= s t) (continuous_on_set f (closed_interval s t)) (forall (u) (-> (in u (open_interval s t)) (and (has_deriv_at (lambda (r) (fn_value f r)) (fn_value f1 u) u) (<= (fn_value f1 u) (* a (fn_value f u))))))) (<= (fn_value f t) (* (fn_value f s) (exp (* a (- t s)))))))
  hard_negative:
    statement: f'≤afならば、s>tに対してもf(t)≤f(s)e^{a(t-s)}である。
    reason: 不等式の向きは時間の向きに依存する。f(u)=-uとa=0ではf'=-1≤0だが、s=1, t=0でf(0)=0≤f(1)=-1は偽である。
  target: |
    ∀ (f f₁ : ℝ → ℝ) (a s t : ℝ), s ≤ t → ContinuousOn f (Set.Icc s t) → (∀ u ∈ Set.Ioo s t, HasDerivAt f (f₁ u) u) → (∀ u ∈ Set.Ioo s t, f₁ u ≤ a * f u) → f t ≤ f s * Real.exp (a * (t - s))
  proof: |
    by
      intro f f₁ a s t hst hf hd hle
      have hcont : ContinuousOn (fun u => f u * Real.exp (-(a * u))) (Set.Icc s t) :=
        hf.mul (Real.continuous_exp.comp (continuous_const.mul continuous_id).neg).continuousOn
      have hanti : AntitoneOn (fun u => f u * Real.exp (-(a * u))) (Set.Icc s t) := by
        refine antitoneOn_of_hasDerivWithinAt_nonpos
          (f' := fun u => (f₁ u - a * f u) * Real.exp (-(a * u))) (convex_Icc s t) hcont ?_ ?_
        · rw [interior_Icc]
          intro u hu
          have h1 : HasDerivAt (fun u : ℝ => -(a * u)) (-(a * 1)) u :=
            ((hasDerivAt_id u).const_mul a).neg
          have h2 : HasDerivAt (fun u => f u * Real.exp (-(a * u)))
              (f₁ u * Real.exp (-(a * u)) + f u * (Real.exp (-(a * u)) * (-(a * 1)))) u :=
            (hd u hu).mul h1.exp
          exact (h2.congr_deriv (by ring)).hasDerivWithinAt
        · rw [interior_Icc]
          intro u hu
          exact mul_nonpos_of_nonpos_of_nonneg (sub_nonpos.2 (hle u hu)) (Real.exp_pos _).le
      have h : f t * Real.exp (-(a * t)) ≤ f s * Real.exp (-(a * s)) :=
        hanti (Set.left_mem_Icc.2 hst) (Set.right_mem_Icc.2 hst) hst
      have hE : Real.exp (a * (t - s)) = Real.exp (a * t) * Real.exp (-(a * s)) := by
        rw [← Real.exp_add]; congr 1; ring
      have hone : Real.exp (-(a * t)) * Real.exp (a * t) = 1 := by
        rw [← Real.exp_add]; simp
      calc f t = f t * Real.exp (-(a * t)) * Real.exp (a * t) := by rw [mul_assoc, hone, mul_one]
        _ ≤ f s * Real.exp (-(a * s)) * Real.exp (a * t) :=
          mul_le_mul_of_nonneg_right h (Real.exp_pos _).le
        _ = f s * Real.exp (a * (t - s)) := by rw [hE]; ring
- id: gronwall_integral_inequality
  kind: named
  level: 3
  topic: 常微分方程式・グロンウォールの不等式
  statement: （グロンウォールの不等式）$u:\mathbb{R}\to\mathbb{R}$が$[a,b]$で連続、$K\geq0$で、$[a,b]$上$u(t)\leq c+K\int_a^tu(s)\,ds$ならば、$[a,b]$上$u(t)\leq ce^{K(t-a)}$である。
  statement_en: (Grönwall's inequality) If u is continuous on [a,b], K ≥ 0 and u(t) ≤ c + K ∫_a^t u(s) ds on [a,b], then u(t) ≤ c e^{K(t-a)} on [a,b].
  assumptions:
  - $u$は$[a,b]$で連続
  - $K\geq0$
  - $t\in[a,b]$で$u(t)\leq c+K\int_a^tu(s)\,ds$
  quantifiers:
  - 任意の$u:\mathbb{R}\to\mathbb{R}$と$c,K,a,b\in\mathbb{R}$
  - 任意の$t\in[a,b]$
  conclusion: $u(t)\leq ce^{K(t-a)}$である。
  answer: |
    $u:\mathbb{R}\to\mathbb{R}$、$c,K,a,b\in\mathbb{R}$、$K\geq0$とする。$u$は$[a,b]$で連続で、$t\in[a,b]$で$u(t)\leq c+K\int_a^tu(s)\,ds$であるとする。$c$の符号についての仮定はない。
    $t\in[a,b]$をとり、$v(x)=c+K\int_a^xu(s)\,ds$とおく。$v$は$[a,b]$で連続で、$(a,b)$では微分積分学の基本定理より$v'=Ku$である。仮定$u\leq v$と$K\geq0$より$v'\leq Kv$である。
    $w(x)=v(x)e^{-K(x-a)}$とおくと、$w$は$[a,b]$で連続で、$(a,b)$で$w'=(v'-Kv)e^{-K(x-a)}\leq0$である。$t>a$なら平均値の定理より$w(t)\leq w(a)=c$であり、$t=a$でも$w(a)=c$である。したがって$v(t)\leq ce^{K(t-a)}$であり、$u(t)\leq v(t)\leq ce^{K(t-a)}$を得る。
  strategy: Pass to the integral v(t) = c + K∫_a^t u, which satisfies a differential inequality, and apply the integrating factor e^{-K(t-a)}.
  sketch:
  - 'setup: Extend u continuously from [a,b] to ℝ so that the integral is differentiable everywhere.'
  - 'translate: Put v(t) = c + K ∫_a^t u, so u ≤ v and v'' = K u on [a,b].'
  - 'derive: Since K ≥ 0, v'' = K u ≤ K v, so (v e^{-K(t-a)})'' ≤ 0.'
  - 'apply_theorem: A function with nonpositive derivative is nonincreasing, so v(t) e^{-K(t-a)} ≤ v(a) = c.'
  - 'conclude: Therefore u(t) ≤ v(t) ≤ c e^{K(t-a)}.'
  openmath: (forall (u c K a b) (-> (and (continuous_on_set u (closed_interval a b)) (<= 0 K) (forall (t) (-> (in t (closed_interval a b)) (<= (fn_value u t) (+ c (* K (interval_integral a t (lambda (s) (fn_value u s))))))))) (forall (t) (-> (in t (closed_interval a b)) (<= (fn_value u t) (* c (exp (* K (- t a)))))))))
  hard_negative:
    statement: K<0でも、u(t)≤c+K∫_a^t u(s)dsならばu(t)≤ce^{K(t-a)}である。
    reason: K=-1, a=0, b=3/5, c=0, u(t)=2t-1が反例である。[0,3/5]上でu(t)≤t-t²=-∫_0^t uが成り立つが、u(3/5)=1/5>0である。
  target: |
    ∀ (u : ℝ → ℝ) (c K a b : ℝ), ContinuousOn u (Set.Icc a b) → 0 ≤ K → (∀ t ∈ Set.Icc a b, u t ≤ c + K * ∫ s in a..t, u s) → ∀ t ∈ Set.Icc a b, u t ≤ c * Real.exp (K * (t - a))
  proof: |
    by
      intro u c K a b hu hK h t ht
      have hab : a ≤ b := ht.1.trans ht.2
      obtain ⟨w, hw, hwu⟩ : ∃ w : ℝ → ℝ, Continuous w ∧ ∀ s ∈ Set.Icc a b, w s = u s :=
        ⟨Set.IccExtend hab ((Set.Icc a b).restrict u),
          (continuousOn_iff_continuous_restrict.1 hu).Icc_extend',
          fun s hs => Set.IccExtend_of_mem hab _ hs⟩
      have hint : ∀ s ∈ Set.Icc a b, (∫ r in a..s, u r) = ∫ r in a..s, w r := by
        intro s hs
        refine intervalIntegral.integral_congr (fun r hr => ?_)
        rw [Set.uIcc_of_le hs.1] at hr
        exact (hwu r ⟨hr.1, hr.2.trans hs.2⟩).symm
      have hW : ∀ s, HasDerivAt (fun s => ∫ r in a..s, w r) (w s) s :=
        fun s => (hw.integral_hasStrictDerivAt a s).hasDerivAt
      have hd : ∀ s, HasDerivAt
          (fun s => (c + K * ∫ r in a..s, w r) * Real.exp (-(K * (s - a))))
          ((K * w s - K * (c + K * ∫ r in a..s, w r)) * Real.exp (-(K * (s - a)))) s := by
        intro s
        have h1 : HasDerivAt (fun s : ℝ => -(K * (s - a))) (-(K * 1)) s :=
          (((hasDerivAt_id s).sub_const a).const_mul K).neg
        have h2 : HasDerivAt
            (fun s => (c + K * ∫ r in a..s, w r) * Real.exp (-(K * (s - a))))
            ((K * w s) * Real.exp (-(K * (s - a))) +
              (c + K * ∫ r in a..s, w r) * (Real.exp (-(K * (s - a))) * (-(K * 1)))) s :=
          (((hW s).const_mul K).const_add c).mul h1.exp
        exact h2.congr_deriv (by ring)
      have hanti : AntitoneOn
          (fun s => (c + K * ∫ r in a..s, w r) * Real.exp (-(K * (s - a)))) (Set.Icc a b) := by
        refine antitoneOn_of_hasDerivWithinAt_nonpos
          (f' := fun s => (K * w s - K * (c + K * ∫ r in a..s, w r)) * Real.exp (-(K * (s - a))))
          (convex_Icc a b) (fun s _ => (hd s).continuousAt.continuousWithinAt)
          (fun s _ => (hd s).hasDerivWithinAt) ?_
        intro s hs
        rw [interior_Icc] at hs
        have hs' : s ∈ Set.Icc a b := ⟨hs.1.le, hs.2.le⟩
        have h3 := h s hs'
        rw [hint s hs', ← hwu s hs'] at h3
        refine mul_nonpos_of_nonpos_of_nonneg ?_ (Real.exp_pos _).le
        have h4 := mul_le_mul_of_nonneg_left h3 hK
        linarith
      have h4 : (c + K * ∫ r in a..t, w r) * Real.exp (-(K * (t - a))) ≤
          (c + K * ∫ r in a..a, w r) * Real.exp (-(K * (a - a))) :=
        hanti (Set.left_mem_Icc.2 hab) ht ht.1
      simp only [intervalIntegral.integral_same, mul_zero, add_zero, sub_self, neg_zero,
        Real.exp_zero, mul_one] at h4
      have h5 := h t ht
      rw [hint t ht] at h5
      have hone : Real.exp (-(K * (t - a))) * Real.exp (K * (t - a)) = 1 := by
        rw [← Real.exp_add]; simp
      calc u t ≤ c + K * ∫ r in a..t, w r := h5
        _ = (c + K * ∫ r in a..t, w r) * Real.exp (-(K * (t - a))) * Real.exp (K * (t - a)) := by
          rw [mul_assoc, hone, mul_one]
        _ ≤ c * Real.exp (K * (t - a)) := mul_le_mul_of_nonneg_right h4 (Real.exp_pos _).le
- id: gronwall_norm_bound
  kind: textbook
  level: 3
  topic: 常微分方程式・微分形のグロンウォール評価
  statement: $E$を実ノルム空間、$K\neq0$とする。$f:\mathbb{R}\to E$が$[a,b]$で連続で、$[a,b)$の各点$x$で右微分係数$f'(x)$をもち、$\|f(a)\|\leq\delta$、$[a,b)$上$\|f'(x)\|\leq K\|f(x)\|+\varepsilon$ならば、$[a,b]$上$\|f(x)\|\leq\delta e^{K(x-a)}+\frac{\varepsilon}{K}(e^{K(x-a)}-1)$である。
  statement_en: If f is a normed-space-valued function continuous on [a,b] with right derivative f' on [a,b), ‖f(a)‖ ≤ δ, ‖f'‖ ≤ K‖f‖ + ε on [a,b) and K ≠ 0, then ‖f(x)‖ ≤ δ e^{K(x-a)} + (ε/K)(e^{K(x-a)} - 1) on [a,b].
  assumptions:
  - $E$は実ノルム空間
  - $K\neq0$
  - $f$は$[a,b]$で連続
  - $[a,b)$の各点$x$で$f$の右微分係数は$f'(x)$
  - $\|f(a)\|\leq\delta$
  - $x\in[a,b)$で$\|f'(x)\|\leq K\|f(x)\|+\varepsilon$
  quantifiers:
  - 任意の実ノルム空間$E$、$f,f':\mathbb{R}\to E$、$\delta,K,\varepsilon,a,b\in\mathbb{R}$
  - 任意の$x\in[a,b]$
  conclusion: $\|f(x)\|\leq\delta e^{K(x-a)}+\frac{\varepsilon}{K}(e^{K(x-a)}-1)$である。
  answer: |
    $E$を実ノルム空間、$f,f':\mathbb{R}\to E$、$\delta,K,\varepsilon,a,b\in\mathbb{R}$、$K\neq0$とする。$f$は$[a,b]$で連続で、$[a,b)$の各点$x$で右微分係数$f'(x)$をもち、$\|f(a)\|\leq\delta$、$x\in[a,b)$で$\|f'(x)\|\leq K\|f(x)\|+\varepsilon$であるとする。$K,\varepsilon$の符号は問わない。$a>b$なら$[a,b]$は空なので、$a\leq b$とする。
    $\eta>0$を固定し、$\varphi(x)=(\delta+\eta)e^{K(x-a)}+\frac{\varepsilon+\eta}{K}(e^{K(x-a)}-1)$とおく。微分すると$\varphi'=K\varphi+\varepsilon+\eta$であり、$\varphi(a)=\delta+\eta$である。
    まず$[a,b]$上$\|f\|\leq\varphi$を示す。$S=\{x\in[a,b]\mid\forall y\in[a,x],\ \|f(y)\|\leq\varphi(y)\}$とおく。$\|f(a)\|\leq\delta<\varphi(a)$より$a\in S$である。$c=\sup S$とする。$y<c$なら$y\leq x$となる$x\in S$があるので$\|f(y)\|\leq\varphi(y)$であり、連続性より$y=c$でも成り立つ。よって$c\in S$である。
    $c<b$と仮定して矛盾を導く。$\|f(c)\|<\varphi(c)$なら、連続性より$\tau>0$が存在して$c+\tau\leq b$かつ$[c,c+\tau]$上$\|f\|<\varphi$である。
    $\|f(c)\|=\varphi(c)$の場合を考える。$f$の$c$での右微分と$\varphi$の$c$での微分の定義より、$\tau>0$が存在して$c+\tau\leq b$であり、$x\in(c,c+\tau]$で
    $\|f(x)-f(c)-(x-c)f'(c)\|\leq\frac{\eta}{3}(x-c)$、$\varphi(x)\geq\varphi(c)+(x-c)(\varphi'(c)-\frac{\eta}{3})$
    となる。仮定より$\|f'(c)\|\leq K\|f(c)\|+\varepsilon=K\varphi(c)+\varepsilon$なので、$x\in(c,c+\tau]$で
    $\|f(x)\|\leq\varphi(c)+(x-c)(K\varphi(c)+\varepsilon+\frac{\eta}{3})\leq\varphi(c)+(x-c)(K\varphi(c)+\varepsilon+\frac{2\eta}{3})\leq\varphi(x)$
    である。
    どちらの場合も$c+\tau\in S$となり、$c=\sup S$に反する。よって$c=b$であり、$c\in S$より$[a,b]$上$\|f\|\leq\varphi$である。
    $x\in[a,b]$を固定して$\eta\to+0$とすると、$\varphi(x)\to\delta e^{K(x-a)}+\frac{\varepsilon}{K}(e^{K(x-a)}-1)$となり、結論を得る。
  strategy: Compare the norm with the exact solution of φ' = Kφ + ε, φ(a) = δ, using a slope comparison on the right.
  sketch:
  - 'translate: The upper right slope of ‖f‖ is at most ‖f''‖, hence at most K‖f‖ + ε.'
  - 'construct: The bound φ(x) = δ e^{K(x-a)} + (ε/K)(e^{K(x-a)} - 1) satisfies φ'' = Kφ + ε and φ(a) = δ.'
  - 'contradiction: With ε slightly increased, ‖f‖ cannot cross φ, since at a first crossing the slopes would contradict.'
  - 'conclude: Letting the increase tend to 0 gives the bound for ε.'
  openmath: (forall (E f f1 d K e a b) (-> (and (normed_space_real E) (!= K 0) (continuous_on_set f (closed_interval a b)) (forall (x) (-> (in x (half_open_interval a b)) (and (has_right_deriv_at f (fn_value f1 x) x) (<= (norm (fn_value f1 x)) (+ (* K (norm (fn_value f x))) e))))) (<= (norm (fn_value f a)) d)) (forall (x) (-> (in x (closed_interval a b)) (<= (norm (fn_value f x)) (+ (* d (exp (* K (- x a)))) (* (/ e K) (- (exp (* K (- x a))) 1))))))))
  hard_negative:
    statement: 同じ仮定のもとで‖f(x)‖≤δe^{K(x-a)}が成り立つ。
    reason: ε>0の項を落としている。f(x)=εx, a=0, δ=0, K=1では右辺が0になるが、x>0で‖f(x)‖>0である。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] (f f' : ℝ → E) (δ K ε a b : ℝ), K ≠ 0 → ContinuousOn f (Set.Icc a b) → (∀ x ∈ Set.Ico a b, HasDerivWithinAt f (f' x) (Set.Ici x) x) → ‖f a‖ ≤ δ → (∀ x ∈ Set.Ico a b, ‖f' x‖ ≤ K * ‖f x‖ + ε) → ∀ x ∈ Set.Icc a b, ‖f x‖ ≤ δ * Real.exp (K * (x - a)) + ε / K * (Real.exp (K * (x - a)) - 1)
  proof: |
    by
      intro E _ _ f f' δ K ε a b hK hf hd ha hb x hx
      have h := norm_le_gronwallBound_of_norm_deriv_right_le hf hd ha hb x hx
      rw [gronwallBound_of_K_ne_0 hK] at h
      exact h
- id: ode_uniqueness_lipschitz
  kind: textbook
  level: 3
  topic: 常微分方程式・解の一意性
  statement: $E$を実ノルム空間、$K\geq0$とし、$v:\mathbb{R}\times E\to E$について全ての$t$で$v(t,\cdot)$がリプシッツ定数$K$をもつとする。$f,g:\mathbb{R}\to E$が$[a,b]$で連続で、$[a,b)$の各点$t$で右微分係数がそれぞれ$v(t,f(t))$、$v(t,g(t))$であり、$f(a)=g(a)$ならば、$[a,b]$上$f=g$である。
  statement_en: If each v(t, ·) is globally Lipschitz with a common constant K, two solutions f, g of x' = v(t, x) on [a,b] with f(a) = g(a) coincide on [a,b].
  assumptions:
  - $E$は実ノルム空間
  - 全ての$t\in\mathbb{R}$で$v(t,\cdot)$はリプシッツ定数$K\geq0$をもつ
  - $f,g$は$[a,b]$で連続
  - $t\in[a,b)$で$f,g$の右微分係数はそれぞれ$v(t,f(t))$、$v(t,g(t))$
  - $f(a)=g(a)$
  quantifiers:
  - 任意の$E$、$v:\mathbb{R}\times E\to E$、$K\geq0$、$f,g:\mathbb{R}\to E$、$a,b\in\mathbb{R}$
  - 任意の$t\in[a,b]$
  conclusion: $f(t)=g(t)$である。
  answer: |
    $E$を実ノルム空間、$K\geq0$、$a,b\in\mathbb{R}$とする。$v:\mathbb{R}\times E\to E$は全ての$t$で$\|v(t,x)-v(t,y)\|\leq K\|x-y\|$を満たすとする。$f,g:\mathbb{R}\to E$は$[a,b]$で連続で、$t\in[a,b)$での右微分係数がそれぞれ$v(t,f(t))$、$v(t,g(t))$であり、$f(a)=g(a)$であるとする。
    微分形のグロンウォール評価を用いる。すなわち、$h:\mathbb{R}\to E$が$[a,b]$で連続、$[a,b)$で右微分係数$h'$をもち、$K'\neq0$、$\|h(a)\|\leq\delta$、$[a,b)$上$\|h'(t)\|\leq K'\|h(t)\|+\varepsilon$ならば、$[a,b]$上$\|h(t)\|\leq\delta e^{K'(t-a)}+\frac{\varepsilon}{K'}(e^{K'(t-a)}-1)$である。
    $h=f-g$、$K'=K+1>0$とおく。$h$は$[a,b]$で連続で、$t\in[a,b)$での右微分係数は$h'(t)=v(t,f(t))-v(t,g(t))$である。リプシッツ条件より$\|h'(t)\|\leq K\|h(t)\|\leq K'\|h(t)\|$である。$h(a)=0$なので、$\delta=0$、$\varepsilon=0$として上の評価を適用できる。その結果$[a,b]$上$\|h(t)\|\leq0$となり、$f=g$を得る。
  strategy: Apply the Grönwall estimate to the difference of the two solutions with zero initial value.
  sketch:
  - 'setup: Put h = f - g, so h(a) = 0.'
  - 'derive: The Lipschitz condition gives ‖h''(t)‖ ≤ K‖h(t)‖ on [a,b).'
  - 'apply_theorem: Grönwall''s estimate with δ = 0 and ε = 0 gives ‖h(t)‖ ≤ 0.'
  - 'conclude: Hence f = g on [a,b].'
  openmath: (forall (E v K f g a b) (-> (and (normed_space_real E) (forall (t) (lipschitz_map (fn_value v t) K)) (continuous_on_set f (closed_interval a b)) (continuous_on_set g (closed_interval a b)) (forall (t) (-> (in t (half_open_interval a b)) (and (has_right_deriv_at f (fn_value (fn_value v t) (fn_value f t)) t) (has_right_deriv_at g (fn_value (fn_value v t) (fn_value g t)) t)))) (= (fn_value f a) (fn_value g a))) (forall (t) (-> (in t (closed_interval a b)) (= (fn_value f t) (fn_value g t))))))
  hard_negative:
    statement: vが連続でさえあれば、x'=v(t,x)の解は初期値から一意に決まる。
    reason: 連続だけでは足りない。x'=2√|x|, x(0)=0にはx≡0とx=t|t|の2つの解がある。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] (v : ℝ → E → E) (K : NNReal) (f g : ℝ → E) (a b : ℝ), (∀ t, LipschitzWith K (v t)) → ContinuousOn f (Set.Icc a b) → (∀ t ∈ Set.Ico a b, HasDerivWithinAt f (v t (f t)) (Set.Ici t) t) → ContinuousOn g (Set.Icc a b) → (∀ t ∈ Set.Ico a b, HasDerivWithinAt g (v t (g t)) (Set.Ici t) t) → f a = g a → ∀ t ∈ Set.Icc a b, f t = g t
  proof: |
    by
      intro E _ _ v K f g a b hv hf hf' hg hg' ha t ht
      exact ODE_solution_unique hv hf hf' hg hg' ha ht
- id: ode_continuous_dependence
  kind: textbook
  level: 3
  topic: 常微分方程式・初期値への連続依存性
  statement: $E$を実ノルム空間、$K\geq0$とし、$v:\mathbb{R}\times E\to E$について全ての$t$で$v(t,\cdot)$がリプシッツ定数$K$をもつとする。$f,g:\mathbb{R}\to E$が$[a,b]$で連続で、$[a,b)$の各点$t$で右微分係数がそれぞれ$v(t,f(t))$、$v(t,g(t))$ならば、$[a,b]$上$\|f(t)-g(t)\|\leq\|f(a)-g(a)\|e^{K(t-a)}$である。
  statement_en: If each v(t, ·) is globally Lipschitz with constant K, any two solutions f, g of x' = v(t, x) on [a,b] satisfy dist(f(t), g(t)) ≤ dist(f(a), g(a)) e^{K(t-a)}.
  assumptions:
  - $E$は実ノルム空間
  - 全ての$t\in\mathbb{R}$で$v(t,\cdot)$はリプシッツ定数$K\geq0$をもつ
  - $f,g$は$[a,b]$で連続
  - $t\in[a,b)$で$f,g$の右微分係数はそれぞれ$v(t,f(t))$、$v(t,g(t))$
  quantifiers:
  - 任意の$E$、$v:\mathbb{R}\times E\to E$、$K\geq0$、$f,g:\mathbb{R}\to E$、$a,b\in\mathbb{R}$
  - 任意の$t\in[a,b]$
  conclusion: $\|f(t)-g(t)\|\leq\|f(a)-g(a)\|e^{K(t-a)}$である。
  answer: |
    $E$を実ノルム空間、$K\geq0$、$a,b\in\mathbb{R}$とする。$v:\mathbb{R}\times E\to E$は全ての$t$で$\|v(t,x)-v(t,y)\|\leq K\|x-y\|$を満たすとする。$f,g:\mathbb{R}\to E$は$[a,b]$で連続で、$t\in[a,b)$での右微分係数がそれぞれ$v(t,f(t))$、$v(t,g(t))$であるとする。
    微分形のグロンウォール評価を用いる。すなわち、$h:\mathbb{R}\to E$が$[a,b]$で連続、$[a,b)$で右微分係数$h'$をもち、$K'\neq0$、$\|h(a)\|\leq\delta$、$[a,b)$上$\|h'(t)\|\leq K'\|h(t)\|+\varepsilon$ならば、$[a,b]$上$\|h(t)\|\leq\delta e^{K'(t-a)}+\frac{\varepsilon}{K'}(e^{K'(t-a)}-1)$である。
    $h=f-g$とおき、$\eta>0$に対し$K'=K+\eta>0$とする。$t\in[a,b)$での右微分係数は$h'(t)=v(t,f(t))-v(t,g(t))$であり、リプシッツ条件より$\|h'(t)\|\leq K\|h(t)\|\leq K'\|h(t)\|$である。$\delta=\|h(a)\|$、$\varepsilon=0$として上の評価を適用すると、$t\in[a,b]$で$\|h(t)\|\leq\|h(a)\|e^{(K+\eta)(t-a)}$である。$\eta\to+0$とすると$\|h(t)\|\leq\|h(a)\|e^{K(t-a)}$を得る。これが結論である。
  strategy: Apply Grönwall's estimate to the difference of the two solutions with ε = 0.
  sketch:
  - 'setup: Put h = f - g and δ = ‖h(a)‖.'
  - 'derive: The Lipschitz condition gives ‖h''(t)‖ ≤ K‖h(t)‖.'
  - 'apply_theorem: Grönwall''s estimate with ε = 0 gives ‖h(t)‖ ≤ δ e^{K(t-a)}.'
  - 'conclude: Rewrite the norms as distances.'
  openmath: (forall (E v K f g a b) (-> (and (normed_space_real E) (forall (t) (lipschitz_map (fn_value v t) K)) (continuous_on_set f (closed_interval a b)) (continuous_on_set g (closed_interval a b)) (forall (t) (-> (in t (half_open_interval a b)) (and (has_right_deriv_at f (fn_value (fn_value v t) (fn_value f t)) t) (has_right_deriv_at g (fn_value (fn_value v t) (fn_value g t)) t))))) (forall (t) (-> (in t (closed_interval a b)) (<= (dist_of (fn_value f t) (fn_value g t)) (* (dist_of (fn_value f a) (fn_value g a)) (exp (* K (- t a)))))))))
  hard_negative:
    statement: 同じ仮定のもとで、解の距離は時間とともに増えない。すなわちdist(f(t),g(t))≤dist(f(a),g(a))である。
    reason: 指数因子は省けない。x'=xの解e^{t}と2e^{t}の距離はe^{t}で増大する。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] (v : ℝ → E → E) (K : NNReal) (f g : ℝ → E) (a b : ℝ), (∀ t, LipschitzWith K (v t)) → ContinuousOn f (Set.Icc a b) → (∀ t ∈ Set.Ico a b, HasDerivWithinAt f (v t (f t)) (Set.Ici t) t) → ContinuousOn g (Set.Icc a b) → (∀ t ∈ Set.Ico a b, HasDerivWithinAt g (v t (g t)) (Set.Ici t) t) → ∀ t ∈ Set.Icc a b, dist (f t) (g t) ≤ dist (f a) (g a) * Real.exp (K * (t - a))
  proof: |
    by
      intro E _ _ v K f g a b hv hf hf' hg hg' t ht
      exact dist_le_of_trajectories_ODE hv hf hf' hg hg' le_rfl t ht
- id: picard_lindelof_existence
  kind: named
  level: 3
  topic: 常微分方程式・ピカール＝リンデレーフの定理
  statement: （ピカール＝リンデレーフの定理）$E$を実バナッハ空間、$I=[t_{\min},t_{\max}]$、$t_0\in I$、$x_0\in E$、$a,L,K\geq0$、$B=\{x\in E\mid\|x-x_0\|\leq a\}$とする。$t\in I$で$f(t,\cdot)$が$B$上リプシッツ定数$K$をもち、$x\in B$で$f(\cdot,x)$が$I$で連続、$I\times B$上$\|f(t,x)\|\leq L$、$L\max(t_{\max}-t_0,t_0-t_{\min})\leq a$ならば、$x'=f(t,x)$、$x(t_0)=x_0$の解が$I$上に存在する。導関数は$I$内で考える。
  statement_en: (Picard–Lindelöf) Let E be a real Banach space, t₀ ∈ [tmin, tmax], and suppose that on the closed ball B(x₀, a) the field f(t, x) is K-Lipschitz in x, continuous in t and bounded in norm by L, with L·max(tmax - t₀, t₀ - tmin) ≤ a. Then x' = f(t, x), x(t₀) = x₀ has a solution on [tmin, tmax].
  assumptions:
  - $E$は実バナッハ空間
  - $t_0\in I=[t_{\min},t_{\max}]$
  - $t\in I$で$f(t,\cdot)$は閉球$B=\{x\mid\|x-x_0\|\leq a\}$上リプシッツ定数$K$をもつ
  - $x\in B$で$f(\cdot,x)$は$I$で連続
  - $t\in I$、$x\in B$で$\|f(t,x)\|\leq L$
  - $L\max(t_{\max}-t_0,t_0-t_{\min})\leq a$
  quantifiers:
  - 任意の$E$、$f:\mathbb{R}\times E\to E$、$t_{\min},t_{\max},t_0\in\mathbb{R}$、$x_0\in E$、$a,L,K\geq0$
  - ある$\alpha:\mathbb{R}\to E$
  conclusion: $\alpha(t_0)=x_0$かつ、全ての$t\in I$で$\alpha$の$I$内での微分係数が$f(t,\alpha(t))$となる$\alpha:\mathbb{R}\to E$が存在する。
  answer: |
    $E$を実バナッハ空間、$f:\mathbb{R}\times E\to E$、$I=[t_{\min},t_{\max}]$、$t_0\in I$、$x_0\in E$、$a,L,K\geq0$、$B=\{x\in E\mid\|x-x_0\|\leq a\}$とする。$t\in I$で$f(t,\cdot)$は$B$上リプシッツ定数$K$をもち、$x\in B$で$f(\cdot,x)$は$I$で連続、$t\in I$、$x\in B$で$\|f(t,x)\|\leq L$であるとする。$T=\max(t_{\max}-t_0,t_0-t_{\min})$とおくと$LT\leq a$であり、$t\in I$で$|t-t_0|\leq T$である。
    関数空間の設定。$X$を、$B$に値をとる連続関数$\alpha:I\to E$全体に一様距離$d(\alpha,\beta)=\sup_{t\in I}\|\alpha(t)-\beta(t)\|$を入れた空間とする。$E$は完備で$I$はコンパクトなので$C(I,E)$は完備である。$B$は閉集合なので$X$は$C(I,E)$の閉集合であり、$X$は完備である。定数関数$x_0$が属するので$X$は空でない。
    積分作用素。$\alpha\in X$とする。$s,s_0\in I$について
    $\|f(s,\alpha(s))-f(s_0,\alpha(s_0))\|\leq K\|\alpha(s)-\alpha(s_0)\|+\|f(s,\alpha(s_0))-f(s_0,\alpha(s_0))\|$
    なので、$s\mapsto f(s,\alpha(s))$は$I$で連続である。$E$は完備なので、連続な$E$値関数のリーマン積分が定義でき、積分のノルムは被積分関数のノルムの積分以下である。$(\Phi\alpha)(t)=x_0+\int_{t_0}^tf(s,\alpha(s))\,ds$と定める。$\Phi\alpha$は連続で、$\|(\Phi\alpha)(t)-x_0\|\leq L|t-t_0|\leq LT\leq a$である。よって$\Phi:X\to X$である。
    反復の縮小性。$\alpha,\beta\in X$、$t\in I$、$n\geq0$について
    $\|(\Phi^n\alpha)(t)-(\Phi^n\beta)(t)\|\leq\frac{(K|t-t_0|)^n}{n!}d(\alpha,\beta)$
    を帰納法で示す。$n=0$は$d$の定義である。$n$で成り立つとすると、リプシッツ条件より
    $\|(\Phi^{n+1}\alpha)(t)-(\Phi^{n+1}\beta)(t)\|\leq\left|\int_{t_0}^tK\frac{(K|s-t_0|)^n}{n!}d(\alpha,\beta)\,ds\right|=\frac{(K|t-t_0|)^{n+1}}{(n+1)!}d(\alpha,\beta)$
    である。したがって$d(\Phi^n\alpha,\Phi^n\beta)\leq\frac{(KT)^n}{n!}d(\alpha,\beta)$である。$n\to\infty$で$(KT)^n/n!\to0$なので、$(KT)^n/n!<1$となる$n$をとると$\Phi^n$は縮小写像である。
    不動点。バナッハの不動点定理（空でない完備距離空間上の縮小写像は唯一の不動点をもつ）より、$\Phi^n\alpha=\alpha$となる$\alpha\in X$がただ一つ存在する。$\Phi^n(\Phi\alpha)=\Phi(\Phi^n\alpha)=\Phi\alpha$なので$\Phi\alpha$も$\Phi^n$の不動点であり、一意性より$\Phi\alpha=\alpha$である。すなわち$t\in I$で$\alpha(t)=x_0+\int_{t_0}^tf(s,\alpha(s))\,ds$であり、$\alpha(t_0)=x_0$である。
    微分。$\alpha$を$\mathbb{R}$上の関数へ任意に拡張する。$I$内での微分係数は拡張の仕方によらない。$\gamma(s)=f(s,\alpha(s))$は$I$で連続である。$t,t+h\in I$、$h\neq0$なら
    $\left\|\frac{\alpha(t+h)-\alpha(t)}{h}-\gamma(t)\right\|=\left\|\frac1h\int_t^{t+h}(\gamma(s)-\gamma(t))\,ds\right\|\leq\sup_{s}\|\gamma(s)-\gamma(t)\|$
    である。ここで上限は$t$と$t+h$の間の$s$についてとる。$\gamma$の$t$での連続性より、$h\to0$で右辺は$0$に収束する。よって$\alpha$の$t$での$I$内の微分係数は$f(t,\alpha(t))$である。$I$が$1$点のときは、この微分の条件に対象となる$h$がないので自動的に成り立つ。
  strategy: Rewrite the initial value problem as a fixed-point equation for the Picard operator and use a contraction argument for an iterate.
  sketch:
  - 'translate: A solution is the same as a fixed point of Φ(α)(t) = x₀ + ∫_{t₀}^t f(s, α(s)) ds.'
  - 'setup: Let X be the complete space of continuous curves with values in the closed ball B(x₀, a).'
  - 'derive: The bound L and the time-width condition show that Φ maps X into X.'
  - 'derive: The Lipschitz condition gives ‖Φ^n α - Φ^n β‖ ≤ (K T)^n / n! ‖α - β‖, so an iterate is a contraction.'
  - 'apply_theorem: Banach''s fixed point theorem gives a fixed point of Φ.'
  - 'conclude: Differentiating the integral equation gives the solution.'
  openmath: (forall (E f tmin tmax t0 x0 a L K) (-> (and (banach_space_real E) (in t0 (closed_interval tmin tmax)) (forall (t) (-> (in t (closed_interval tmin tmax)) (lipschitz_on_with (fn_value f t) K (closed_ball x0 a)))) (forall (x) (-> (in x (closed_ball x0 a)) (continuous_on_set_fn (lambda (t) (fn_value (fn_value f t) x)) (closed_interval tmin tmax)))) (forall (t x) (-> (and (in t (closed_interval tmin tmax)) (in x (closed_ball x0 a))) (<= (norm (fn_value (fn_value f t) x)) L))) (<= (* L (max_of (- tmax t0) (- t0 tmin))) a)) (exists (y) (and (= (fn_value y t0) x0) (forall (t) (-> (in t (closed_interval tmin tmax)) (has_deriv_within_at y (fn_value (fn_value f t) (fn_value y t)) (closed_interval tmin tmax) t)))))))
  hard_negative:
    statement: 閉球上のリプシッツ性・連続性・有界性があれば、時間幅の条件$L\max(t_{\max}-t_0,t_0-t_{\min})\leq a$がなくても、全区間$I$上の解が存在する。
    reason: 時間幅の条件は外せない。$E=\mathbb{R}$、$x_0=0$、$a=1$、$L=1$、$K=0$、$I=[0,2]$、$t_0=0$、$f(t,x)=1$（$x\leq1$）、$f(t,x)=0$（$x>1$）とする。閉球$[-1,1]$上では$f\equiv1$で全ての仮定が成り立つが、$[0,2]$上の解はない。解は$t\leq1$で$x=t$であり、$t=1$での微分係数は$f(1,1)=1$なので$t>1$で$x>1$となり、そこでは$x'=0$となって矛盾する。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] [CompleteSpace E] (f : ℝ → E → E) (tmin tmax t₀ : ℝ) (x₀ : E) (a L K : NNReal), t₀ ∈ Set.Icc tmin tmax → (∀ t ∈ Set.Icc tmin tmax, LipschitzOnWith K (f t) (Metric.closedBall x₀ a)) → (∀ x ∈ Metric.closedBall x₀ a, ContinuousOn (fun t => f t x) (Set.Icc tmin tmax)) → (∀ t ∈ Set.Icc tmin tmax, ∀ x ∈ Metric.closedBall x₀ a, ‖f t x‖ ≤ L) → (L : ℝ) * max (tmax - t₀) (t₀ - tmin) ≤ a → ∃ α : ℝ → E, α t₀ = x₀ ∧ ∀ t ∈ Set.Icc tmin tmax, HasDerivWithinAt α (f t (α t)) (Set.Icc tmin tmax) t
  proof: |
    by
      intro E _ _ _ f tmin tmax t₀ x₀ a L K ht₀ hl hc hb hm
      have hP : IsPicardLindelof f (tmin := tmin) (tmax := tmax) ⟨t₀, ht₀⟩ x₀ a 0 L K :=
        ⟨hl, hc, hb, by simpa using hm⟩
      exact hP.exists_eq_forall_mem_Icc_hasDerivWithinAt₀
- id: non_uniqueness_without_lipschitz
  kind: gap
  level: 3
  topic: 常微分方程式・一意性の反例
  statement: 方程式$y'=2\sqrt{|y|}$、$y(0)=0$には全実数上で異なる$2$つの解がある。実際に$y_1\equiv0$と$y_2(t)=t|t|$がともに解である。
  statement_en: The initial value problem y' = 2√|y|, y(0) = 0 has two different solutions on ℝ, for instance y ≡ 0 and y(t) = t|t|.
  assumptions:
  - 仮定なし（存在の主張）
  quantifiers:
  - ある$2$つの関数$y_1,y_2:\mathbb{R}\to\mathbb{R}$
  conclusion: $y_1(0)=y_2(0)=0$かつ$y_1\neq y_2$で、どちらも全実数上で$y'=2\sqrt{|y|}$を満たす。
  answer: |
    存在の主張なので関数を具体的に与える。$y_1,y_2:\mathbb{R}\to\mathbb{R}$を$y_1(t)=0$、$y_2(t)=t|t|$と定める。$y_1(0)=y_2(0)=0$である。
    $y_1$については$y_1'=0=2\sqrt{|y_1|}$である。
    $y_2$は$t>0$で$t^2$、$t<0$で$-t^2$に等しいので、$t\neq0$で$y_2'(t)=2|t|$である。$t=0$では$h\neq0$に対し$(y_2(h)-y_2(0))/h=|h|\to0$なので$y_2'(0)=0=2|0|$である。よって全ての$t$で$y_2'(t)=2|t|$である。一方$\sqrt{|y_2(t)|}=\sqrt{t^2}=|t|$なので、$y_2'=2\sqrt{|y_2|}$が成り立つ。
    $y_2(1)=1\neq0=y_1(1)$より、$2$つの解は異なる。
  strategy: Exhibit the zero function and t|t| and verify the equation for t|t| separately for t < 0, t = 0, t > 0.
  sketch:
  - 'construct: Take y₁ ≡ 0 and y₂(t) = t|t|.'
  - 'case_split: For t > 0 y₂ agrees with t² near t, for t < 0 with -t² near t.'
  - 'derive: At t = 0 both one-sided derivatives vanish, so y₂''(t) = 2|t| everywhere.'
  - 'derive: Since √|t|t|| = |t|, the equation y₂'' = 2√|y₂| holds.'
  - 'conclude: y₂(1) = 1 ≠ 0 = y₁(1), so uniqueness fails.'
  openmath: (exists (y1 y2) (and (= (fn_value y1 0) 0) (= (fn_value y2 0) 0) (exists (s) (!= (fn_value y1 s) (fn_value y2 s))) (forall (t) (has_deriv_at (lambda (r0) (fn_value y1 r0)) (* 2 (root (abs (fn_value y1 t)) 2)) t)) (forall (t) (has_deriv_at (lambda (r0) (fn_value y2 r0)) (* 2 (root (abs (fn_value y2 t)) 2)) t))))
  hard_negative:
    statement: y'=2√|y|, y(1)=1の解も初期値から全実数上で一意に決まる。
    reason: y=t|t|とy=(max(t,0))²はどちらもy(1)=1を満たす解であり、t<0で値が異なる。
  target: |
    ∃ y₁ y₂ : ℝ → ℝ, y₁ 0 = 0 ∧ y₂ 0 = 0 ∧ y₁ ≠ y₂ ∧ (∀ t, HasDerivAt y₁ (2 * Real.sqrt |y₁ t|) t) ∧ (∀ t, HasDerivAt y₂ (2 * Real.sqrt |y₂ t|) t)
  proof: |
    by
      have hd : ∀ t : ℝ, HasDerivAt (fun s : ℝ => s * |s|) (2 * |t|) t := by
        intro t
        have hsq : HasDerivAt (fun s : ℝ => s * s) (1 * t + t * 1) t :=
          (hasDerivAt_id' t).mul (hasDerivAt_id' t)
        have hneg : HasDerivAt (fun s : ℝ => -(s * s)) (-(1 * t + t * 1)) t := hsq.neg
        rcases lt_trichotomy t 0 with ht | ht | ht
