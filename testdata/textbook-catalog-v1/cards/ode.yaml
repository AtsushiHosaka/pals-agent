        refine ((h t).2.const_mul c).congr_deriv ?_
        simp only [Pi.smul_apply, smul_eq_mul]
        ring
- id: second_order_constant_coefficient_uniqueness
  kind: gap
  level: 2
  topic: 常微分方程式・定数係数2階線形
  statement: $a,b\in\mathbb{R}$とする。$y''+ay'+by=0$の全実数上の$2$つの解は、$1$点$t_0$での値と微分係数が等しければ全実数上で一致する。
  statement_en: Two solutions on ℝ of y'' + a y' + b y = 0 that agree in value and derivative at one point t₀ agree everywhere.
  assumptions:
  - 全実数上で$y_1'=v_1$、$v_1'=-av_1-by_1$
  - 全実数上で$y_2'=v_2$、$v_2'=-av_2-by_2$
  - $y_1(t_0)=y_2(t_0)$、$v_1(t_0)=v_2(t_0)$
  quantifiers:
  - 任意の$a,b,t_0\in\mathbb{R}$と$y_1,v_1,y_2,v_2:\mathbb{R}\to\mathbb{R}$
  - 任意の$t\in\mathbb{R}$
  conclusion: $y_1(t)=y_2(t)$である。
  answer: |
    $a,b,t_0\in\mathbb{R}$、$y_1,v_1,y_2,v_2:\mathbb{R}\to\mathbb{R}$とする。全実数上で$y_i'=v_i$、$v_i'=-av_i-by_i$（$i=1,2$）であり、$y_1(t_0)=y_2(t_0)$、$v_1(t_0)=v_2(t_0)$であるとする。$t\in\mathbb{R}$をとる。
    $u=y_1-y_2$、$w=v_1-v_2$とおくと、$u'=w$、$w'=-aw-bu$、$u(t_0)=w(t_0)=0$である。$E=u^2+w^2$とおくと
    $E'=2uw+2w(-aw-bu)=2(1-b)uw-2aw^2$
    である。$2|uw|\leq u^2+w^2$より、$M=|1-b|+2|a|$とおくと$|E'|\leq ME$である。
    $t\geq t_0$の場合、$(Ee^{-Ms})'=(E'-ME)e^{-Ms}\leq0$なので、$Ee^{-Ms}$は単調非増加である。よって$E(t)e^{-Mt}\leq E(t_0)e^{-Mt_0}=0$である。$t\leq t_0$の場合、$(Ee^{Ms})'=(E'+ME)e^{Ms}\geq0$なので、$Ee^{Ms}$は単調非減少である。よって$E(t)e^{Mt}\leq E(t_0)e^{Mt_0}=0$である。
    $E\geq0$なのでどちらの場合も$E(t)=0$であり、$u(t)=0$、すなわち$y_1(t)=y_2(t)$である。
  strategy: Rewrite the equation as a linear first-order system on ℝ² and apply uniqueness under a Lipschitz bound.
  sketch:
  - 'translate: Put x = (y, v), so x'' = L x with L(y, v) = (v, -a v - b y).'
  - 'derive: The linear map L on ℝ² is globally Lipschitz.'
  - 'apply_theorem: Uniqueness for Lipschitz first-order systems on ℝ applies to the two curves.'
  - 'conclude: The curves agree at t₀, so they agree everywhere; take first components.'
  openmath: (forall (a b t0 y1 v1 y2 v2) (-> (and (forall (t) (and (has_deriv_at (lambda (s) (fn_value y1 s)) (fn_value v1 t) t) (has_deriv_at (lambda (s) (fn_value v1 s)) (- (neg (* a (fn_value v1 t))) (* b (fn_value y1 t))) t) (has_deriv_at (lambda (s) (fn_value y2 s)) (fn_value v2 t) t) (has_deriv_at (lambda (s) (fn_value v2 s)) (- (neg (* a (fn_value v2 t))) (* b (fn_value y2 t))) t))) (= (fn_value y1 t0) (fn_value y2 t0)) (= (fn_value v1 t0) (fn_value v2 t0))) (forall (t) (= (fn_value y1 t) (fn_value y2 t)))))
  hard_negative:
    statement: y''+ay'+by=0の2解は、1点での値だけが等しければ全実数上で一致する。
    reason: 微分係数の一致も必要である。y''+y=0の解sin tと0はt=0で値が等しいが一致しない。
  target: |
    ∀ (a b t₀ : ℝ) (y₁ v₁ y₂ v₂ : ℝ → ℝ), (∀ t, HasDerivAt y₁ (v₁ t) t) → (∀ t, HasDerivAt v₁ (-(a * v₁ t) - b * y₁ t) t) → (∀ t, HasDerivAt y₂ (v₂ t) t) → (∀ t, HasDerivAt v₂ (-(a * v₂ t) - b * y₂ t) t) → y₁ t₀ = y₂ t₀ → v₁ t₀ = v₂ t₀ → ∀ t, y₁ t = y₂ t
  proof: |
    by
      intro a b t₀ y₁ v₁ y₂ v₂ h₁ h₁' h₂ h₂' hy hv t
      let L : ℝ × ℝ →L[ℝ] ℝ × ℝ := (ContinuousLinearMap.snd ℝ ℝ ℝ).prod
        ((-a) • ContinuousLinearMap.snd ℝ ℝ ℝ - b • ContinuousLinearMap.fst ℝ ℝ ℝ)
      have hL : ∀ x : ℝ × ℝ, L x = (x.2, -(a * x.2) - b * x.1) := by
        intro x
        simp [L]
      have hf : ∀ s, HasDerivAt (fun s => (y₁ s, v₁ s)) (L (y₁ s, v₁ s)) s := by
        intro s
        rw [hL]
        exact (h₁ s).prodMk (h₁' s)
      have hg : ∀ s, HasDerivAt (fun s => (y₂ s, v₂ s)) (L (y₂ s, v₂ s)) s := by
        intro s
        rw [hL]
        exact (h₂ s).prodMk (h₂' s)
      have heq : (fun s => (y₁ s, v₁ s)) = fun s => (y₂ s, v₂ s) :=
        ODE_solution_unique_univ (v := fun _ => L) (s := fun _ => Set.univ) (K := ‖L‖₊) (t₀ := t₀)
          (fun _ => L.lipschitz.lipschitzOnWith) (fun s => ⟨hf s, trivial⟩)
          (fun s => ⟨hg s, trivial⟩) (by simp [hy, hv])
      exact congrArg Prod.fst (congrFun heq t)
- id: distinct_real_roots_general_solution
  kind: textbook
  level: 2
  topic: 常微分方程式・定数係数2階線形
  statement: $r_1\neq r_2$のとき、$y''=(r_1+r_2)y'-r_1r_2y$の全実数上の解は、実数$c_1,c_2$を用いて$y(t)=c_1e^{r_1t}+c_2e^{r_2t}$と書ける。
  statement_en: If r₁ ≠ r₂, every solution on ℝ of y'' = (r₁ + r₂) y' - r₁r₂ y has the form y = c₁ e^{r₁t} + c₂ e^{r₂t}.
  assumptions:
  - $r_1\neq r_2$
  - 全実数上で$y'=v$
  - 全実数上で$v'=(r_1+r_2)v-r_1r_2y$
  quantifiers:
  - 任意の$r_1,r_2\in\mathbb{R}$と$y,v:\mathbb{R}\to\mathbb{R}$
  - ある$c_1,c_2\in\mathbb{R}$
  - 任意の$t\in\mathbb{R}$
  conclusion: 全ての$t$で$y(t)=c_1e^{r_1t}+c_2e^{r_2t}$となる$c_1,c_2\in\mathbb{R}$が存在する。
  answer: |
    $r_1,r_2\in\mathbb{R}$、$r_1\neq r_2$、$y,v:\mathbb{R}\to\mathbb{R}$とし、全実数上で$y'=v$、$v'=(r_1+r_2)v-r_1r_2y$であるとする。
    $u=v-r_2y$とおくと、$u'=(r_1+r_2)v-r_1r_2y-r_2v=r_1(v-r_2y)=r_1u$である。同様に$w=v-r_1y$とおくと$w'=r_2w$である。
    一般に$z'=cz$なら$(ze^{-ct})'=0$なので$ze^{-ct}$は定数であり、$z(t)=z(0)e^{ct}$である。よって$u(t)=u(0)e^{r_1t}$、$w(t)=w(0)e^{r_2t}$である。
    $u-w=(r_1-r_2)y$であり、$r_1-r_2\neq0$なので、$c_1=u(0)/(r_1-r_2)$、$c_2=-w(0)/(r_1-r_2)$とおくと$y(t)=c_1e^{r_1t}+c_2e^{r_2t}$である。
  strategy: Factor the operator into two first-order equations, solve each, and recover y from the difference.
  sketch:
  - 'construct: Put u = v - r₂y and w = v - r₁y.'
  - 'derive: The equation gives u'' = r₁u and w'' = r₂w.'
  - 'apply_theorem: The solutions of z'' = r z are z(0) e^{rt}.'
  - 'derive: The difference is u - w = (r₁ - r₂) y.'
  - 'conclude: Divide by r₁ - r₂ ≠ 0 to obtain c₁ and c₂.'
  openmath: (forall (r1 r2 y v) (-> (and (!= r1 r2) (forall (t) (and (has_deriv_at (lambda (s) (fn_value y s)) (fn_value v t) t) (has_deriv_at (lambda (s) (fn_value v s)) (- (* (+ r1 r2) (fn_value v t)) (* (* r1 r2) (fn_value y t))) t)))) (exists (c1 c2) (forall (t) (= (fn_value y t) (+ (* c1 (exp (* r1 t))) (* c2 (exp (* r2 t)))))))))
  hard_negative:
    statement: r₁=r₂=rのときも、解は全てc₁e^{rt}+c₂e^{rt}の形である。
    reason: 重根の場合はte^{rt}も解であり、これはe^{rt}の定数倍ではない。
  target: |
    ∀ (r₁ r₂ : ℝ) (y v : ℝ → ℝ), r₁ ≠ r₂ → (∀ t, HasDerivAt y (v t) t) → (∀ t, HasDerivAt v ((r₁ + r₂) * v t - r₁ * r₂ * y t) t) → ∃ c₁ c₂ : ℝ, ∀ t, y t = c₁ * Real.exp (r₁ * t) + c₂ * Real.exp (r₂ * t)
  proof: |
    by
      intro r₁ r₂ y v hr hy hv
      have key : ∀ (r : ℝ) (u : ℝ → ℝ), (∀ t, HasDerivAt u (r * u t) t) →
          ∀ t, u t = u 0 * Real.exp (r * t) := by
        intro r u hu t
        have hg : ∀ s, HasDerivAt (fun s => u s * Real.exp (-(r * s))) 0 s := by
          intro s
          have h1 : HasDerivAt (fun s : ℝ => -(r * s)) (-(r * 1)) s :=
            ((hasDerivAt_id s).const_mul r).neg
          have h2 : HasDerivAt (fun s => u s * Real.exp (-(r * s)))
              (r * u s * Real.exp (-(r * s)) + u s * (Real.exp (-(r * s)) * (-(r * 1)))) s :=
            (hu s).mul h1.exp
          exact h2.congr_deriv (by ring)
        have hc : u t * Real.exp (-(r * t)) = u 0 * Real.exp (-(r * 0)) :=
          is_const_of_deriv_eq_zero (fun s => (hg s).differentiableAt) (fun s => (hg s).deriv) t 0
        have hone : Real.exp (-(r * t)) * Real.exp (r * t) = 1 := by
          rw [← Real.exp_add]; simp
        calc u t = u t * Real.exp (-(r * t)) * Real.exp (r * t) := by
              rw [mul_assoc, hone, mul_one]
          _ = u 0 * Real.exp (r * t) := by rw [hc]; simp
      have hd : r₁ - r₂ ≠ 0 := sub_ne_zero.2 hr
      refine ⟨(v 0 - r₂ * y 0) / (r₁ - r₂), -(v 0 - r₁ * y 0) / (r₁ - r₂), fun t => ?_⟩
      have hu : v t - r₂ * y t = (v 0 - r₂ * y 0) * Real.exp (r₁ * t) :=
        key r₁ (fun t => v t - r₂ * y t) (fun s => by
          have h : HasDerivAt (fun s => v s - r₂ * y s)
              ((r₁ + r₂) * v s - r₁ * r₂ * y s - r₂ * v s) s :=
            (hv s).sub ((hy s).const_mul r₂)
          exact h.congr_deriv (by ring)) t
      have hw : v t - r₁ * y t = (v 0 - r₁ * y 0) * Real.exp (r₂ * t) :=
        key r₂ (fun t => v t - r₁ * y t) (fun s => by
          have h : HasDerivAt (fun s => v s - r₁ * y s)
              ((r₁ + r₂) * v s - r₁ * r₂ * y s - r₁ * v s) s :=
            (hv s).sub ((hy s).const_mul r₁)
          exact h.congr_deriv (by ring)) t
      field_simp
      linear_combination hu - hw
- id: abel_wronskian_identity
  kind: named
  level: 3
  topic: 常微分方程式・ロンスキアン
  statement: （アーベルの公式）$y_1,y_2$が$y''+p(t)y'+q(t)y=0$の全実数上の解で$P'=p$ならば、ロンスキアン$W=y_1y_2'-y_1'y_2$は任意の$s,t\in\mathbb{R}$で$W(t)=W(s)e^{P(s)-P(t)}$を満たす。
  statement_en: (Abel's identity) If y₁, y₂ solve y'' + p(t) y' + q(t) y = 0 on ℝ and P' = p, then the Wronskian W = y₁y₂' - y₁'y₂ satisfies W(t) = W(s) exp(P(s) - P(t)).
  assumptions:
  - 全実数上で$P'=p$
  - 全実数上で$y_1'=v_1$、$v_1'=-pv_1-qy_1$
  - 全実数上で$y_2'=v_2$、$v_2'=-pv_2-qy_2$
  quantifiers:
  - 任意の$p,q,P,y_1,v_1,y_2,v_2:\mathbb{R}\to\mathbb{R}$
  - 任意の$s,t\in\mathbb{R}$
  conclusion: $y_1(t)v_2(t)-v_1(t)y_2(t)=(y_1(s)v_2(s)-v_1(s)y_2(s))e^{P(s)-P(t)}$である。
  answer: |
    $p,q,P,y_1,v_1,y_2,v_2:\mathbb{R}\to\mathbb{R}$、$s,t\in\mathbb{R}$とし、全実数上で$P'=p$、$y_i'=v_i$、$v_i'=-pv_i-qy_i$（$i=1,2$）であるとする。$W=y_1v_2-v_1y_2$とおく。
    積の微分より
    $W'=v_1v_2+y_1(-pv_2-qy_2)-(-pv_1-qy_1)y_2-v_1v_2=-p(y_1v_2-v_1y_2)=-pW$
    である。したがって$(We^{P})'=-pWe^{P}+Wpe^{P}=0$であり、平均値の定理より$We^{P}$は定数である。よって$W(t)e^{P(t)}=W(s)e^{P(s)}$であり、$W(t)=W(s)e^{P(s)-P(t)}$を得る。
  strategy: Derive the first-order equation W' = -p W for the Wronskian and solve it with the integrating factor e^{P}.
  sketch:
  - 'derive: The product rule and the equations give W'' = -p W, the q terms and v₁v₂ terms cancelling.'
  - 'construct: Consider W e^{P}.'
  - 'derive: Its derivative is -p W e^{P} + W p e^{P} = 0.'
  - 'apply_theorem: A function with zero derivative on ℝ is constant.'
  - 'conclude: Compare the values at s and t.'
  openmath: (forall (p q P y1 v1 y2 v2) (-> (forall (t) (and (has_deriv_at (lambda (r) (fn_value P r)) (fn_value p t) t) (has_deriv_at (lambda (r) (fn_value y1 r)) (fn_value v1 t) t) (has_deriv_at (lambda (r) (fn_value v1 r)) (- (neg (* (fn_value p t) (fn_value v1 t))) (* (fn_value q t) (fn_value y1 t))) t) (has_deriv_at (lambda (r) (fn_value y2 r)) (fn_value v2 t) t) (has_deriv_at (lambda (r) (fn_value v2 r)) (- (neg (* (fn_value p t) (fn_value v2 t))) (* (fn_value q t) (fn_value y2 t))) t))) (forall (s t) (= (- (* (fn_value y1 t) (fn_value v2 t)) (* (fn_value v1 t) (fn_value y2 t))) (* (- (* (fn_value y1 s) (fn_value v2 s)) (* (fn_value v1 s) (fn_value y2 s))) (exp (- (fn_value P s) (fn_value P t))))))))
  hard_negative:
    statement: 同じ仮定のもとでW(t)=W(s)exp(P(t)-P(s))である。
    reason: 指数の符号が逆である。y''+y'=0の解y₁=1, y₂=e^{-t}, P=tではW=-e^{-t}であり、Wはtとともに減衰する。
  target: |
    ∀ (p q P y₁ v₁ y₂ v₂ : ℝ → ℝ), (∀ t, HasDerivAt P (p t) t) → (∀ t, HasDerivAt y₁ (v₁ t) t) → (∀ t, HasDerivAt v₁ (-(p t * v₁ t) - q t * y₁ t) t) → (∀ t, HasDerivAt y₂ (v₂ t) t) → (∀ t, HasDerivAt v₂ (-(p t * v₂ t) - q t * y₂ t) t) → ∀ s t, y₁ t * v₂ t - v₁ t * y₂ t = (y₁ s * v₂ s - v₁ s * y₂ s) * Real.exp (P s - P t)
  proof: |
    by
      intro p q P y₁ v₁ y₂ v₂ hP h₁ h₁' h₂ h₂' s t
      have hg : ∀ u, HasDerivAt (fun u => (y₁ u * v₂ u - v₁ u * y₂ u) * Real.exp (P u)) 0 u := by
        intro u
        have hW : HasDerivAt (fun u => y₁ u * v₂ u - v₁ u * y₂ u)
            (v₁ u * v₂ u + y₁ u * (-(p u * v₂ u) - q u * y₂ u) -
              ((-(p u * v₁ u) - q u * y₁ u) * y₂ u + v₁ u * v₂ u)) u :=
          ((h₁ u).mul (h₂' u)).sub ((h₁' u).mul (h₂ u))
        have h : HasDerivAt (fun u => (y₁ u * v₂ u - v₁ u * y₂ u) * Real.exp (P u))
            ((v₁ u * v₂ u + y₁ u * (-(p u * v₂ u) - q u * y₂ u) -
              ((-(p u * v₁ u) - q u * y₁ u) * y₂ u + v₁ u * v₂ u)) * Real.exp (P u) +
              (y₁ u * v₂ u - v₁ u * y₂ u) * (Real.exp (P u) * p u)) u :=
          hW.mul (hP u).exp
        exact h.congr_deriv (by ring)
      have hc : (y₁ t * v₂ t - v₁ t * y₂ t) * Real.exp (P t) =
          (y₁ s * v₂ s - v₁ s * y₂ s) * Real.exp (P s) :=
        is_const_of_deriv_eq_zero (fun u => (hg u).differentiableAt) (fun u => (hg u).deriv) t s
      have hone : Real.exp (P t) * Real.exp (-P t) = 1 := by
        rw [← Real.exp_add]; simp
      have hE : Real.exp (P s - P t) = Real.exp (P s) * Real.exp (-P t) := by
        rw [← Real.exp_add]; congr 1
      calc y₁ t * v₂ t - v₁ t * y₂ t
          = (y₁ t * v₂ t - v₁ t * y₂ t) * Real.exp (P t) * Real.exp (-P t) := by
            rw [mul_assoc, hone, mul_one]
        _ = (y₁ s * v₂ s - v₁ s * y₂ s) * Real.exp (P s) * Real.exp (-P t) := by rw [hc]
        _ = (y₁ s * v₂ s - v₁ s * y₂ s) * Real.exp (P s - P t) := by rw [hE, mul_assoc]
- id: wronskian_nonzero_implies_independent
  kind: gap
  level: 2
  topic: 常微分方程式・ロンスキアン
  statement: $y_1,y_2:\mathbb{R}\to\mathbb{R}$が点$t_0$で微分可能でロンスキアンが$t_0$で$0$でなければ、$y_1,y_2$は一次独立である。すなわち全ての$t$で$c_1y_1(t)+c_2y_2(t)=0$なら$c_1=c_2=0$である。
  statement_en: 'If differentiable functions y₁, y₂ have nonzero Wronskian at one point t₀, they are linearly independent: c₁y₁ + c₂y₂ ≡ 0 implies c₁ = c₂ = 0.'
  assumptions:
  - 点$t_0$で$y_1,y_2$の微分係数はそれぞれ$v_1(t_0),v_2(t_0)$
  - $y_1(t_0)v_2(t_0)-v_1(t_0)y_2(t_0)\neq0$
  - 全ての$t$で$c_1y_1(t)+c_2y_2(t)=0$
  quantifiers:
  - 任意の$y_1,v_1,y_2,v_2:\mathbb{R}\to\mathbb{R}$と$c_1,c_2,t_0\in\mathbb{R}$
  conclusion: $c_1=0$かつ$c_2=0$である。
  answer: |
    $y_1,v_1,y_2,v_2:\mathbb{R}\to\mathbb{R}$、$c_1,c_2,t_0\in\mathbb{R}$とする。点$t_0$で$y_1,y_2$の微分係数はそれぞれ$v_1(t_0),v_2(t_0)$であり、$W=y_1(t_0)v_2(t_0)-v_1(t_0)y_2(t_0)\neq0$、全ての$t$で$c_1y_1(t)+c_2y_2(t)=0$であるとする。
    以下$y_i,v_i$は$t_0$での値を表す。恒等式$c_1y_1(t)+c_2y_2(t)=0$の$t_0$での値から$c_1y_1+c_2y_2=0$である。また$t_0$で微分すると、零関数の微分係数は$0$なので$c_1v_1+c_2v_2=0$である。
    第1式に$v_2$を、第2式に$y_2$を掛けて引くと$c_1W=0$である。第2式に$y_1$を、第1式に$v_1$を掛けて引くと$c_2W=0$である。$W\neq0$より$c_1=c_2=0$である。
  strategy: Differentiate the linear relation at t₀ and solve the resulting 2×2 system, whose determinant is the Wronskian.
  sketch:
  - 'derive: Differentiating the relation at t₀ gives c₁v₁(t₀) + c₂v₂(t₀) = 0.'
  - 'translate: Together with the value at t₀ this is a homogeneous 2×2 linear system.'
  - 'derive: Elimination gives c₁W(t₀) = 0 and c₂W(t₀) = 0.'
  - 'conclude: Since W(t₀) ≠ 0, both constants vanish.'
  openmath: (forall (y1 v1 y2 v2 c1 c2 t0) (-> (and (has_deriv_at (lambda (s) (fn_value y1 s)) (fn_value v1 t0) t0) (has_deriv_at (lambda (s) (fn_value y2 s)) (fn_value v2 t0) t0) (!= (- (* (fn_value y1 t0) (fn_value v2 t0)) (* (fn_value v1 t0) (fn_value y2 t0))) 0) (forall (t) (= (+ (* c1 (fn_value y1 t)) (* c2 (fn_value y2 t))) 0))) (and (= c1 0) (= c2 0))))
  hard_negative:
    statement: 微分可能なy₁, y₂のロンスキアンが恒等的に0なら、y₁, y₂は一次従属である。
    reason: 一般の微分可能関数では逆は偽である。y₁=t², y₂=t|t|はW≡0だが全実数上で一次独立である。
  target: |
    ∀ (y₁ v₁ y₂ v₂ : ℝ → ℝ) (c₁ c₂ t₀ : ℝ), HasDerivAt y₁ (v₁ t₀) t₀ → HasDerivAt y₂ (v₂ t₀) t₀ → y₁ t₀ * v₂ t₀ - v₁ t₀ * y₂ t₀ ≠ 0 → (∀ t, c₁ * y₁ t + c₂ * y₂ t = 0) → c₁ = 0 ∧ c₂ = 0
  proof: |
    by
      intro y₁ v₁ y₂ v₂ c₁ c₂ t₀ h₁ h₂ hW h0
      have hd : HasDerivAt (fun t => c₁ * y₁ t + c₂ * y₂ t) (c₁ * v₁ t₀ + c₂ * v₂ t₀) t₀ :=
        (h₁.const_mul c₁).add (h₂.const_mul c₂)
      have hz : (fun t => c₁ * y₁ t + c₂ * y₂ t) = fun _ => 0 := funext h0
      rw [hz] at hd
      have hv : c₁ * v₁ t₀ + c₂ * v₂ t₀ = 0 := hd.unique (hasDerivAt_const t₀ 0)
      have hy := h0 t₀
      constructor
      · have h : c₁ * (y₁ t₀ * v₂ t₀ - v₁ t₀ * y₂ t₀) = 0 := by
          linear_combination v₂ t₀ * hy - y₂ t₀ * hv
        exact (mul_eq_zero.1 h).resolve_right hW
      · have h : c₂ * (y₁ t₀ * v₂ t₀ - v₁ t₀ * y₂ t₀) = 0 := by
          linear_combination y₁ t₀ * hv - v₁ t₀ * hy
        exact (mul_eq_zero.1 h).resolve_right hW
- id: harmonic_oscillator_energy_conservation
  kind: gap
  level: 2
  topic: 常微分方程式・調和振動子
  statement: $\omega\in\mathbb{R}$とする。$y''=-\omega^2y$の全実数上の解について、エネルギー$y'^2+\omega^2y^2$は時間によらず一定である。
  statement_en: For a solution on ℝ of y'' = -ω² y, the energy y'² + ω² y² is constant in time.
  assumptions:
  - 全実数上で$y'=v$
  - 全実数上で$v'=-\omega^2y$
  quantifiers:
  - 任意の$\omega\in\mathbb{R}$と$y,v:\mathbb{R}\to\mathbb{R}$
  - 任意の$s,t\in\mathbb{R}$
  conclusion: $v(t)^2+\omega^2y(t)^2=v(s)^2+\omega^2y(s)^2$である。
  answer: |
    $\omega\in\mathbb{R}$、$y,v:\mathbb{R}\to\mathbb{R}$、$s,t\in\mathbb{R}$とし、全実数上で$y'=v$、$v'=-\omega^2y$であるとする。$E=v^2+\omega^2y^2$とおくと、$E'=2vv'+2\omega^2yy'=2v(-\omega^2y)+2\omega^2yv=0$である。全実数上で導関数が$0$の関数は平均値の定理より定数なので、$E(t)=E(s)$である。
  strategy: Differentiate the energy and use the equation to see that the derivative vanishes.
  sketch:
  - 'construct: Put E = v² + ω² y².'
  - 'derive: Using y'' = v and v'' = -ω² y we get E'' = 2v(-ω² y) + 2ω² y v = 0.'
  - 'conclude: A function with zero derivative on ℝ is constant.'
  openmath: (forall (om y v) (-> (forall (t) (and (has_deriv_at (lambda (r) (fn_value y r)) (fn_value v t) t) (has_deriv_at (lambda (r) (fn_value v r)) (neg (* (^ om 2) (fn_value y t))) t))) (forall (s t) (= (+ (^ (fn_value v t) 2) (* (^ om 2) (^ (fn_value y t) 2))) (+ (^ (fn_value v s) 2) (* (^ om 2) (^ (fn_value y s) 2)))))))
  hard_negative:
    statement: y''=-ω²yの解についてy'²+y²は常に一定である。
    reason: ω²の重みが必要である。y=cos ωtではy'²+y²=ω²sin²ωt+cos²ωtであり、ω²≠1なら一定でない。
  target: |
    ∀ (ω : ℝ) (y v : ℝ → ℝ), (∀ t, HasDerivAt y (v t) t) → (∀ t, HasDerivAt v (-(ω ^ 2 * y t)) t) → ∀ s t, v t ^ 2 + ω ^ 2 * y t ^ 2 = v s ^ 2 + ω ^ 2 * y s ^ 2
  proof: |
    by
      intro ω y v hy hv s t
      have he : (fun u => v u ^ 2 + ω ^ 2 * y u ^ 2) = fun u => v u * v u + ω ^ 2 * (y u * y u) := by
        funext u
        ring
      have hE : ∀ u, HasDerivAt (fun u => v u ^ 2 + ω ^ 2 * y u ^ 2) 0 u := by
        intro u
        have h : HasDerivAt (fun u => v u * v u + ω ^ 2 * (y u * y u))
            (-(ω ^ 2 * y u) * v u + v u * -(ω ^ 2 * y u) +
              ω ^ 2 * (v u * y u + y u * v u)) u :=
          ((hv u).mul (hv u)).add (((hy u).mul (hy u)).const_mul (ω ^ 2))
        rw [he]
        exact h.congr_deriv (by ring)
      exact is_const_of_deriv_eq_zero (fun u => (hE u).differentiableAt) (fun u => (hE u).deriv) t s
- id: harmonic_oscillator_general_solution
  kind: textbook
  level: 2
  topic: 常微分方程式・調和振動子
  statement: $\omega\neq0$のとき、$y''=-\omega^2y$の全実数上の解は$y(t)=y(0)\cos\omega t+\frac{y'(0)}{\omega}\sin\omega t$に限る。
  statement_en: If ω ≠ 0, every solution on ℝ of y'' = -ω² y is y(t) = y(0) cos ωt + (y'(0)/ω) sin ωt.
  assumptions:
  - $\omega\neq0$
  - 全実数上で$y'=v$
  - 全実数上で$v'=-\omega^2y$
  quantifiers:
  - 任意の$\omega\in\mathbb{R}$と$y,v:\mathbb{R}\to\mathbb{R}$
  - 任意の$t\in\mathbb{R}$
  conclusion: $y(t)=y(0)\cos\omega t+\frac{v(0)}{\omega}\sin\omega t$である。
  answer: |
    $\omega\in\mathbb{R}$、$\omega\neq0$、$y,v:\mathbb{R}\to\mathbb{R}$、$t\in\mathbb{R}$とし、全実数上で$y'=v$、$v'=-\omega^2y$であるとする。
    $A(s)=y(s)\cos\omega s-\frac{v(s)}{\omega}\sin\omega s$、$B(s)=y(s)\sin\omega s+\frac{v(s)}{\omega}\cos\omega s$とおく。微分して$v'=-\omega^2y$を代入すると
    $A'=v\cos\omega s-\omega y\sin\omega s+\omega y\sin\omega s-v\cos\omega s=0$、
    $B'=v\sin\omega s+\omega y\cos\omega s-\omega y\cos\omega s-v\sin\omega s=0$
    である。よって$A,B$は定数で、$A\equiv A(0)=y(0)$、$B\equiv B(0)=v(0)/\omega$である。
    さらに$A(s)\cos\omega s+B(s)\sin\omega s=y(s)(\cos^2\omega s+\sin^2\omega s)=y(s)$である。$s=t$として定数値を代入すると、$y(t)=y(0)\cos\omega t+\frac{v(0)}{\omega}\sin\omega t$を得る。
  strategy: Find two conserved quantities obtained by rotating (y, v/ω), then invert the rotation.
  sketch:
  - 'construct: Put A = y cos ωt - (v/ω) sin ωt and B = y sin ωt + (v/ω) cos ωt.'
  - 'derive: The equation gives A'' = 0 and B'' = 0.'
  - 'apply_theorem: A function with zero derivative on ℝ is constant, so A = y(0) and B = v(0)/ω.'
  - 'derive: The identity cos² + sin² = 1 gives A cos ωt + B sin ωt = y.'
  - 'conclude: Substituting the constants gives the formula.'
  openmath: (forall (om y v) (-> (and (!= om 0) (forall (t) (and (has_deriv_at (lambda (r) (fn_value y r)) (fn_value v t) t) (has_deriv_at (lambda (r) (fn_value v r)) (neg (* (^ om 2) (fn_value y t))) t)))) (forall (t) (= (fn_value y t) (+ (* (fn_value y 0) (cos (* om t))) (* (/ (fn_value v 0) om) (sin (* om t))))))))
  hard_negative:
    statement: ω=0のときもv(0)/ωの項を0と読めば、y''=0の解はy(t)=y(0)に限る。
    reason: y''=0にはy(t)=tのような解があり、y(0)=0なのに定数0ではない。
  target: |
    ∀ (ω : ℝ) (y v : ℝ → ℝ), ω ≠ 0 → (∀ t, HasDerivAt y (v t) t) → (∀ t, HasDerivAt v (-(ω ^ 2 * y t)) t) → ∀ t, y t = y 0 * Real.cos (ω * t) + v 0 / ω * Real.sin (ω * t)
  proof: |
    by
      intro ω y v hω hy hv t
      have hb : ∀ u : ℝ, HasDerivAt (fun s : ℝ => ω * s) (ω * 1) u :=
        fun u => (hasDerivAt_id u).const_mul ω
      have hA : ∀ u, HasDerivAt (fun u => y u * Real.cos (ω * u) - v u / ω * Real.sin (ω * u)) 0 u := by
        intro u
        have h : HasDerivAt (fun u => y u * Real.cos (ω * u) - v u / ω * Real.sin (ω * u))
            (v u * Real.cos (ω * u) + y u * (-Real.sin (ω * u) * (ω * 1)) -
              (-(ω ^ 2 * y u) / ω * Real.sin (ω * u) +
                v u / ω * (Real.cos (ω * u) * (ω * 1)))) u :=
          ((hy u).mul (hb u).cos).sub (((hv u).div_const ω).mul (hb u).sin)
        refine h.congr_deriv ?_
        field_simp
        ring
      have hB : ∀ u, HasDerivAt (fun u => y u * Real.sin (ω * u) + v u / ω * Real.cos (ω * u)) 0 u := by
        intro u
        have h : HasDerivAt (fun u => y u * Real.sin (ω * u) + v u / ω * Real.cos (ω * u))
            (v u * Real.sin (ω * u) + y u * (Real.cos (ω * u) * (ω * 1)) +
              (-(ω ^ 2 * y u) / ω * Real.cos (ω * u) +
                v u / ω * (-Real.sin (ω * u) * (ω * 1)))) u :=
          ((hy u).mul (hb u).sin).add (((hv u).div_const ω).mul (hb u).cos)
        refine h.congr_deriv ?_
        field_simp
        ring
      have hA0 : y t * Real.cos (ω * t) - v t / ω * Real.sin (ω * t) = y 0 := by
        have h := is_const_of_deriv_eq_zero (fun u => (hA u).differentiableAt)
          (fun u => (hA u).deriv) t 0
        simpa using h
      have hB0 : y t * Real.sin (ω * t) + v t / ω * Real.cos (ω * t) = v 0 / ω := by
        have h := is_const_of_deriv_eq_zero (fun u => (hB u).differentiableAt)
          (fun u => (hB u).deriv) t 0
        simpa using h
      rw [← hA0, ← hB0]
      linear_combination (-y t) * Real.sin_sq_add_cos_sq (ω * t)
- id: damped_oscillator_energy_decreasing
  kind: gap
  level: 2
  topic: 常微分方程式・減衰振動
  statement: $\gamma\geq0$のとき、$y''+2\gamma y'+\omega^2y=0$の全実数上の解について、エネルギー$y'^2+\omega^2y^2$は時間について単調非増加である。
  statement_en: If γ ≥ 0, then for a solution on ℝ of y'' + 2γ y' + ω² y = 0 the energy y'² + ω² y² is nonincreasing in time.
  assumptions:
  - $\gamma\geq0$
  - 全実数上で$y'=v$
  - 全実数上で$v'=-2\gamma v-\omega^2y$
  - $s\leq t$
  quantifiers:
  - 任意の$\gamma,\omega\in\mathbb{R}$と$y,v:\mathbb{R}\to\mathbb{R}$
  - $s\leq t$を満たす任意の$s,t\in\mathbb{R}$
  conclusion: $v(t)^2+\omega^2y(t)^2\leq v(s)^2+\omega^2y(s)^2$である。
  answer: |
    $\gamma,\omega\in\mathbb{R}$、$\gamma\geq0$、$y,v:\mathbb{R}\to\mathbb{R}$、$s\leq t$とし、全実数上で$y'=v$、$v'=-2\gamma v-\omega^2y$であるとする。$E=v^2+\omega^2y^2$とおくと、$E'=2v(-2\gamma v-\omega^2y)+2\omega^2yv=-4\gamma v^2\leq0$である。$s=t$なら等号が成り立つ。$s<t$なら、平均値の定理より$E(t)-E(s)=E'(c)(t-s)\leq0$となる$c\in(s,t)$がある。よって$E(t)\leq E(s)$である。
  strategy: Compute the derivative of the energy, which equals -4γ v² ≤ 0, and apply the monotonicity criterion.
  sketch:
  - 'construct: Put E = v² + ω² y².'
  - 'derive: The equation gives E'' = -4γ v².'
  - 'derive: Since γ ≥ 0, E'' ≤ 0 on ℝ.'
  - 'apply_theorem: A function with nonpositive derivative is nonincreasing.'
  - 'conclude: Hence E(t) ≤ E(s) for s ≤ t.'
  openmath: (forall (ga om y v) (-> (and (<= 0 ga) (forall (t) (and (has_deriv_at (lambda (r) (fn_value y r)) (fn_value v t) t) (has_deriv_at (lambda (r) (fn_value v r)) (- (neg (* (* 2 ga) (fn_value v t))) (* (^ om 2) (fn_value y t))) t)))) (forall (s t) (-> (<= s t) (<= (+ (^ (fn_value v t) 2) (* (^ om 2) (^ (fn_value y t) 2))) (+ (^ (fn_value v s) 2) (* (^ om 2) (^ (fn_value y s) 2))))))))
  hard_negative:
    statement: γ<0でもエネルギーは単調非増加である。
    reason: γ<0ではE'=-4γv²≥0となり、v≠0の範囲でエネルギーは増加する。
  target: |
    ∀ (γ ω : ℝ) (y v : ℝ → ℝ), 0 ≤ γ → (∀ t, HasDerivAt y (v t) t) → (∀ t, HasDerivAt v (-(2 * γ * v t) - ω ^ 2 * y t) t) → ∀ s t, s ≤ t → v t ^ 2 + ω ^ 2 * y t ^ 2 ≤ v s ^ 2 + ω ^ 2 * y s ^ 2
  proof: |
    by
      intro γ ω y v hγ hy hv s t hst
      have he : (fun u => v u ^ 2 + ω ^ 2 * y u ^ 2) = fun u => v u * v u + ω ^ 2 * (y u * y u) := by
        funext u
        ring
      have hE : ∀ u, HasDerivAt (fun u => v u ^ 2 + ω ^ 2 * y u ^ 2) (-(4 * γ * v u ^ 2)) u := by
        intro u
        have h : HasDerivAt (fun u => v u * v u + ω ^ 2 * (y u * y u))
            ((-(2 * γ * v u) - ω ^ 2 * y u) * v u + v u * (-(2 * γ * v u) - ω ^ 2 * y u) +
              ω ^ 2 * (v u * y u + y u * v u)) u :=
          ((hv u).mul (hv u)).add (((hy u).mul (hy u)).const_mul (ω ^ 2))
        rw [he]
        exact h.congr_deriv (by ring)
      have hanti : Antitone (fun u => v u ^ 2 + ω ^ 2 * y u ^ 2) :=
        antitone_of_hasDerivAt_nonpos (f' := fun u => -(4 * γ * v u ^ 2)) hE (by
          intro u
          have h := mul_nonneg hγ (sq_nonneg (v u))
          show -(4 * γ * v u ^ 2) ≤ 0
          linarith)
      exact hanti hst
- id: matrix_exponential_derivative
  kind: textbook
  level: 3
  topic: 常微分方程式・行列の指数関数
  statement: 有限集合で添字づけられた実正方行列$A$について、$\exp(M)=\sum_{n\geq0}M^n/n!$とすると、$s\mapsto\exp(sA)$は全実数で微分可能で、点$t$での微分係数は$A\exp(tA)$である。
  statement_en: For a real square matrix A, the map t ↦ exp(tA) is differentiable with derivative A exp(tA).
  assumptions:
  - $A$は有限集合で添字づけられた実正方行列
  quantifiers:
  - 任意の実正方行列$A$と$t\in\mathbb{R}$
  conclusion: $s\mapsto\exp(sA)$の点$t$での微分係数は$A\exp(tA)$である。
  answer: |
    $A$を有限集合で添字づけられた実正方行列、$t\in\mathbb{R}$とし、$\exp(M)=\sum_{n\geq0}M^n/n!$とする。行列の空間に作用素ノルムなどの劣乗法的ノルム$\|\cdot\|$（$\|MN\|\leq\|M\|\|N\|$）を入れる。行列の空間は有限次元なので、収束と微分はノルムの選び方によらず、成分ごとに考えてよい。
    $u_n(s)=s^nA^n/n!$とおき、$R>|t|$をとる。$n\geq1$で$u_n'(s)=s^{n-1}A^n/(n-1)!$であり、$|s|\leq R$で$\|u_n'(s)\|\leq R^{n-1}\|A\|^n/(n-1)!$である。$\sum_{n\geq1}R^{n-1}\|A\|^n/(n-1)!=\|A\|e^{R\|A\|}<\infty$なので、ワイエルシュトラスの優級数定理より$\sum u_n'$は$[-R,R]$で一様収束する。また$\sum u_n(0)=I$は収束する。
    項別微分の定理（$C^1$級関数の級数について、導関数の級数が区間で一様収束し、元の級数が$1$点で収束するならば、元の級数は微分可能で導関数は導関数の級数に等しい）より、$\exp(sA)=\sum u_n(s)$は$(-R,R)$で微分可能である。点$t$での微分係数は
    $\sum_{n\geq1}\frac{t^{n-1}A^n}{(n-1)!}=A\sum_{k\geq0}\frac{t^kA^k}{k!}=A\exp(tA)$
    である。ここで左から$A$を掛ける写像が連続であることを用いた。
  strategy: Differentiate the exponential power series term by term, using its infinite radius of convergence.
  sketch:
  - 'setup: Fix a submultiplicative norm on the matrix algebra, which is finite-dimensional and complete.'
  - 'apply_theorem: The exponential series has infinite radius of convergence, so it may be differentiated term by term.'
  - 'derive: The termwise derivative is Σ t^{n-1} A^n / (n-1)!.'
  - 'conclude: Factoring out A gives A exp(tA).'
  openmath: (forall (A t) (-> (matrix_square R A) (has_deriv_at (lambda (s) (matrix_exp (matrix_scale s A))) (matrix_mul A (matrix_exp (matrix_scale t A))) t)))
  hard_negative:
    statement: 行列値関数$A(t)$が微分可能なら、$\exp(A(t))$の微分係数は常に$A'(t)\exp(A(t))$である。
    reason: $A(t)$と$A'(t)$が可換でなければ一般に成り立たない。$A(t)=N+tM$、$N=\begin{pmatrix}0&1\\0&0\end{pmatrix}$、$M=\begin{pmatrix}0&0\\1&0\end{pmatrix}$の$t=0$では微分係数は$\int_0^1e^{sN}Me^{(1-s)N}ds=M+\frac{NM+MN}{2}+\frac{NMN}{6}$だが、$A'(0)\exp(A(0))=M(I+N)=M+MN$で、差は$\frac{NM-MN}{2}+\frac{N}{6}\neq0$である。
  target: |
    ∀ (m : Type*) [Fintype m] [DecidableEq m] (A : Matrix m m ℝ) (t : ℝ), HasDerivAt (fun s : ℝ => NormedSpace.exp (s • A)) (A * NormedSpace.exp (t • A)) t
  proof: |
    by
      intro m _ _ A t
      letI : NormedRing (Matrix m m ℝ) := Matrix.linftyOpNormedRing
      letI : NormedAlgebra ℝ (Matrix m m ℝ) := Matrix.linftyOpNormedAlgebra
      exact hasDerivAt_exp_smul_const' (𝕂 := ℝ) A t
- id: matrix_exponential_solves_linear_system
  kind: textbook
  level: 3
  topic: 常微分方程式・定数係数線形系
  statement: 有限集合で添字づけられた実正方行列$A$と実ベクトル$x_0$について、$x(t)=\exp(tA)x_0$は線形系$x'=Ax$の解である。
  statement_en: For a real square matrix A and a vector x₀, the curve x(t) = exp(tA) x₀ solves the linear system x' = A x.
  assumptions:
  - $A$は有限集合で添字づけられた実正方行列
  - $x_0$は同じ添字集合をもつ実ベクトル
  quantifiers:
  - 任意の$A$、$x_0$と$t\in\mathbb{R}$
  conclusion: $s\mapsto\exp(sA)x_0$の点$t$での微分係数は$A(\exp(tA)x_0)$である。
  answer: |
    $A$を有限集合で添字づけられた実正方行列、$x_0$を同じ添字集合をもつ実ベクトル、$t\in\mathbb{R}$とする。$\exp(M)=\sum_{n\geq0}M^n/n!$である。
    $s\mapsto\exp(sA)$の点$t$での微分係数は$A\exp(tA)$である（行列の指数関数の微分公式）。行列$M$をベクトル$Mx_0$に対応させる写像は有限次元空間の間の線形写像なので、連続で微分可能である。合成関数の微分より、$s\mapsto\exp(sA)x_0$の点$t$での微分係数は$(A\exp(tA))x_0$である。行列積の結合法則よりこれは$A(\exp(tA)x_0)$に等しい。
  strategy: Compose the derivative of exp(tA) with the continuous linear evaluation map M ↦ M x₀.
  sketch:
  - 'apply_theorem: The derivative of exp(tA) is A exp(tA).'
  - 'construct: M ↦ M x₀ is a continuous linear map on matrices.'
  - 'derive: The chain rule gives (exp(tA) x₀)'' = (A exp(tA)) x₀.'
  - 'conclude: Associativity rewrites this as A (exp(tA) x₀).'
  openmath: (forall (A x0 t) (-> (matrix_square R A) (has_deriv_at (lambda (s) (matrix_vector_mul (matrix_exp (matrix_scale s A)) x0)) (matrix_vector_mul A (matrix_vector_mul (matrix_exp (matrix_scale t A)) x0)) t)))
  hard_negative:
    statement: 行列値関数A(t)について、exp(∫_0^t A(s)ds)x₀は常にx'=A(t)xの解である。
    reason: A(t)同士が可換でなければ成り立たない。一般には指数関数の微分の公式が使えない。
  target: |
    ∀ (m : Type*) [Fintype m] [DecidableEq m] (A : Matrix m m ℝ) (x₀ : m → ℝ) (t : ℝ), HasDerivAt (fun s : ℝ => (NormedSpace.exp (s • A)).mulVec x₀) (A.mulVec ((NormedSpace.exp (t • A)).mulVec x₀)) t
  proof: |
    by
      intro m _ _ A x₀ t
      letI : NormedRing (Matrix m m ℝ) := Matrix.linftyOpNormedRing
      letI : NormedAlgebra ℝ (Matrix m m ℝ) := Matrix.linftyOpNormedAlgebra
      have h := hasDerivAt_exp_smul_const' (𝕂 := ℝ) A t
      let L : Matrix m m ℝ →L[ℝ] (m → ℝ) :=
        { toFun := fun M => M.mulVec x₀
          map_add' := fun M N => Matrix.add_mulVec M N x₀
          map_smul' := fun c M => Matrix.smul_mulVec c M x₀
          cont := continuous_id.matrix_mulVec continuous_const }
      have h2 := L.hasFDerivAt.comp_hasDerivAt t h
      rw [Matrix.mulVec_mulVec]
      exact h2
- id: matrix_exponential_add_commuting
  kind: gap
  level: 3
  topic: 常微分方程式・行列の指数関数
  statement: 有限集合で添字づけられた実正方行列$A,B$が$AB=BA$を満たすならば、$\exp(A+B)=\exp(A)\exp(B)$である。ここで$\exp(M)=\sum_{n\geq0}M^n/n!$である。
  statement_en: If real square matrices A and B commute, then exp(A + B) = exp(A) exp(B).
  assumptions:
  - $A,B$は同じ有限集合で添字づけられた実正方行列
  - $AB=BA$
  quantifiers:
  - 任意の実正方行列$A,B$
  conclusion: $\exp(A+B)=\exp(A)\exp(B)$である。
  answer: |
    $A,B$を同じ有限集合で添字づけられた実正方行列とし、$AB=BA$とする。$\exp(M)=\sum_{n\geq0}M^n/n!$である。行列の空間に作用素ノルムなどの劣乗法的ノルム$\|\cdot\|$を入れる。
    $a_k=A^k/k!$、$b_l=B^l/l!$とおく。$\|a_k\|\leq\|A\|^k/k!$、$\|b_l\|\leq\|B\|^l/l!$より、$\sum\|a_k\|$と$\sum\|b_l\|$は収束する。その和をそれぞれ$\sigma,\tau$とする。
    級数の積を次のように並べ替える。$c_n=\sum_{k+l=n}a_kb_l$とおく。$N\geq0$について、$\left(\sum_{k\leq N}a_k\right)\left(\sum_{l\leq N}b_l\right)-\sum_{n\leq N}c_n$は、$k,l\leq N$かつ$k+l>N$を満たす項$a_kb_l$の和である。$k+l>N$なら$k>N/2$または$l>N/2$なので、この差のノルムは
    $\left(\sum_{k>N/2}\|a_k\|\right)\tau+\sigma\left(\sum_{l>N/2}\|b_l\|\right)$
    以下であり、$N\to\infty$で$0$に収束する。よって$\exp(A)\exp(B)=\sum_{n\geq0}c_n$である。
    $AB=BA$なので二項定理が使え、$(A+B)^n=\sum_{k+l=n}\frac{n!}{k!l!}A^kB^l$である。両辺を$n!$で割ると$(A+B)^n/n!=c_n$となる。したがって$\exp(A+B)=\sum_{n\geq0}c_n=\exp(A)\exp(B)$である。
  strategy: Expand with the binomial theorem, valid because A and B commute, and rearrange the absolutely convergent double series.
  sketch:
  - 'derive: Commutativity gives (A+B)^n / n! = Σ_{k+l=n} A^k B^l / (k! l!).'
  - 'apply_theorem: The exponential series converge absolutely, so their Cauchy product may be rearranged.'
  - 'conclude: Grouping by k + l = n gives exp(A) exp(B) = exp(A+B).'
  openmath: (forall (A B) (-> (and (matrix_square R A) (matrix_square R B) (commuting_matrices A B)) (= (matrix_exp (+ A B)) (matrix_mul (matrix_exp A) (matrix_exp B)))))
  hard_negative:
    statement: 任意の実正方行列A, Bについてexp(A+B)=exp(A)exp(B)である。
    reason: 非可換なら一般に成り立たない。A=[[0,1],[0,0]], B=[[0,0],[1,0]]では両辺が異なる。
  target: |
    ∀ (m : Type*) [Fintype m] [DecidableEq m] (A B : Matrix m m ℝ), Commute A B → NormedSpace.exp (A + B) = NormedSpace.exp A * NormedSpace.exp B
  proof: |
    by
      intro m _ _ A B h
      exact Matrix.exp_add_of_commute A B h
- id: matrix_exponential_neg_inverse
  kind: gap
  level: 3
  topic: 常微分方程式・行列の指数関数
  statement: 有限集合で添字づけられた実正方行列$A$について、$\exp(-A)$は$\exp(A)$の逆行列である。
  statement_en: For a real square matrix A, exp(-A) is the inverse matrix of exp(A).
  assumptions:
  - $A$は有限集合で添字づけられた実正方行列
  quantifiers:
  - 任意の実正方行列$A$
  conclusion: $\exp(-A)=(\exp A)^{-1}$である。
  answer: |
    $A$を有限集合で添字づけられた実正方行列とし、$\exp(M)=\sum_{n\geq0}M^n/n!$とする。可換な行列についての指数法則（$MN=NM$ならば$\exp(M+N)=\exp(M)\exp(N)$）を用いる。$A$と$-A$は可換なので、$\exp(A)\exp(-A)=\exp(A-A)=\exp(0)=I$である。同様に$\exp(-A)\exp(A)=I$である。よって$\exp(A)$は可逆で、その逆行列は$\exp(-A)$である。
  strategy: Apply the exponential law to the commuting pair A, -A.
  sketch:
  - 'translate: A and -A commute.'
  - 'apply_theorem: The exponential law gives exp(A) exp(-A) = exp(0) = I.'
  - 'conclude: Hence exp(-A) is the inverse of exp(A).'
  openmath: (forall (A) (-> (matrix_square R A) (= (matrix_exp (neg A)) (matrix_inverse (matrix_exp A)))))
  hard_negative:
    statement: 実正方行列Aについてexp(-A)=(exp A)ᵀである。
    reason: A=Iならexp(I)=eIでその転置もeIだが、exp(-I)=e^{-1}Iなので一致しない。
  target: '∀ (m : Type*) [Fintype m] [DecidableEq m] (A : Matrix m m ℝ), NormedSpace.exp A * NormedSpace.exp (-A) = 1 ∧ NormedSpace.exp (-A) * NormedSpace.exp A = 1'
  proof: |
    by
      intro m _ _ A
      have h1 : Commute A (-A) := (Commute.refl A).neg_right
      have h2 := Matrix.exp_add_of_commute A (-A) h1
      have h3 := Matrix.exp_add_of_commute (-A) A h1.symm
      rw [add_neg_cancel, NormedSpace.exp_zero] at h2
      rw [neg_add_cancel, NormedSpace.exp_zero] at h3
      exact ⟨h2.symm, h3.symm⟩
