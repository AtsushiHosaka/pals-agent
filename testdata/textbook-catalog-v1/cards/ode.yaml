  statement: rがr²+ar+b=0の根ならば、y(t)=e^{rt}はy''+ay'+by=0の解である。
  statement_en: "If r is a root of r² + a r + b = 0, then y(t) = e^{rt} satisfies y'' + a y' + b y = 0, with y' = r e^{rt}."
