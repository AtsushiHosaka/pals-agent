  answer: |
    $a,b,r,t\in\mathbb{R}$、$r^2+ar+b=0$とする。合成関数の微分より、$s\mapsto e^{rs}$の点$t$での微分係数は$re^{rt}$である。同様に$s\mapsto re^{rs}$の点$t$での微分係数は$r^2e^{rt}$である。$r^2=-ar-b$を代入すると、これは$-a\cdot re^{rt}-be^{rt}$に等しい。$y(t)=e^{rt}$と書けば、$y''=-ay'-by$、すなわち$y''+ay'+by=0$である。
  strategy: Differentiate the exponential twice and substitute the characteristic equation.
  sketch:
  - 'derive: The chain rule gives y'' = r e^{rt} and y'''' = r² e^{rt}.'
  - 'translate: The characteristic equation says r² = -a r - b.'
  - 'conclude: Substituting gives y'''' = -a y'' - b y.'
