- id: sine_coefficient_of_identity
  kind: gap
  level: 2
  topic: フーリエ級数・恒等関数の正弦係数
  statement: 正の整数$n$について$\int_{-\pi}^{\pi}x\sin nx\,dx=\dfrac{2\pi(-1)^{n+1}}{n}$である。
  statement_en: For a positive integer n, the integral of x sin(nx) over [-π, π] equals 2π (-1)^(n+1) / n.
  assumptions:
  - $n\geq 1$
  quantifiers:
  - 任意の正の整数$n$
  conclusion: $\int_{-\pi}^{\pi}x\sin nx\,dx=\dfrac{2\pi(-1)^{n+1}}{n}$である。
  answer: |
    $n$を正の整数とする。$F(x)=\frac{\sin nx}{n^2}-\frac{x\cos nx}{n}$とおくと$F'(x)=x\sin nx$である。実際$F'(x)=\frac{\cos nx}{n}-\frac{\cos nx}{n}+x\sin nx$である。$\sin(\pm n\pi)=0$、$\cos(\pm n\pi)=(-1)^n$なので
    $\int_{-\pi}^{\pi}x\sin nx\,dx=F(\pi)-F(-\pi)=-\frac{\pi(-1)^n}{n}-\frac{\pi(-1)^n}{n}=\frac{2\pi(-1)^{n+1}}{n}$
    である。
  strategy: Evaluate with the antiderivative sin(nx)/n² - x cos(nx)/n.
  sketch:
  - 'setup: F(x) = sin(nx)/n² - x cos(nx)/n has derivative x sin(nx).'
  - 'derive: At ±π, sin(nx) vanishes and cos(nx) equals (-1)^n.'
  - 'conclude: F(π) - F(-π) = 2π (-1)^(n+1) / n.'
  openmath: (forall (n) (-> (and (in n N) (>= n 1)) (= (interval_integral (neg pi) pi (lambda (x) (* x (sin (* n x))))) (/ (* 2 (* pi (^ (neg 1) (+ n 1)))) n))))
  hard_negative:
    statement: 正の整数$n$について$\int_{-\pi}^{\pi}x\sin nx\,dx=\dfrac{2\pi}{n}$である。
    reason: $n=2$とすると積分は$-\pi$であり、$\frac{2\pi}{2}=\pi$と符号が異なる。
  target: |
    ∀ n : ℕ, 1 ≤ n → ∫ x in (-Real.pi)..Real.pi, x * Real.sin (n * x) = 2 * Real.pi * (-1) ^ (n + 1) / n
  proof: |
    by
      intro n hn
      have hn0 : (n : ℝ) ≠ 0 := by positivity
      have hd : ∀ x ∈ Set.uIcc (-Real.pi) Real.pi, HasDerivAt (fun x : ℝ => Real.sin (n * x) / (n:ℝ) ^ 2 - x * Real.cos (n * x) / n) (x * Real.sin (n * x)) x := by
        intro x _
        have h1 : HasDerivAt (fun x : ℝ => (n : ℝ) * x) (n : ℝ) x := by simpa using (hasDerivAt_id x).const_mul (n : ℝ)
        have h2 := h1.sin
        have h3 := h1.cos
        have h4 := (h2.div_const ((n:ℝ) ^ 2)).sub (((hasDerivAt_id' x).mul h3).div_const (n:ℝ))
        refine h4.congr_deriv ?_
        field_simp
        ring
      rw [intervalIntegral.integral_eq_sub_of_hasDerivAt hd (by apply Continuous.intervalIntegrable; fun_prop)]
      have hs : Real.sin (n * Real.pi) = 0 := Real.sin_nat_mul_pi n
      have hc : Real.cos (n * Real.pi) = (-1) ^ n := Real.cos_nat_mul_pi n
      have hs' : Real.sin (n * -Real.pi) = 0 := by rw [mul_neg, Real.sin_neg, hs, neg_zero]
      have hc' : Real.cos (n * -Real.pi) = (-1) ^ n := by rw [mul_neg, Real.cos_neg, hc]
      rw [hs, hc, hs', hc', pow_succ]
      field_simp
      ring
- id: fourier_series_converges_c2_periodic
  kind: textbook
  level: 3
  topic: フーリエ級数・滑らかな周期関数の収束
  statement: $a<b$、$T=b-a$とする。$f:\mathbb{R}\to\mathbb{C}$が周期$T$をもち、$2$回微分可能で$f''$が連続ならば、$c_n(f)=\frac{1}{T}\int_a^bf(x)e^{-2\pi inx/T}\,dx$について、各実数$x$で$\sum_{n\in\mathbb{Z}}c_n(f)e^{2\pi inx/T}$は絶対収束し、和は$f(x)$である。
  statement_en: Let a < b and T = b - a. If f on ℝ has period T and is twice differentiable with continuous f'', then with c_n(f) = (1/T) ∫_a^b f(x) e^(-2πinx/T) dx, at every real x the series Σ_{n∈ℤ} c_n(f) e^(2πinx/T) converges absolutely with sum f(x).
  assumptions:
  - $a<b$
  - $f$は周期$T=b-a$をもつ
  - $f$は$2$回微分可能で$f''$は連続
  quantifiers:
  - 任意の$a<b$
  - 任意の関数$f$
  - 任意の実数$x$
  conclusion: 各実数$x$で$\sum_{n\in\mathbb{Z}}c_n(f)e^{2\pi inx/T}$は絶対収束し、和は$f(x)$である。
  answer: |
    $a<b$、$T=b-a$とし、$f$を仮定を満たす関数とする。$f'$も周期$T$をもつ。$n\neq 0$について$e(x)=e^{-2\pi inx/T}$と部分積分を$2$回行うと、周期性から境界の項が消えて$c_n(f)=\left(\frac{T}{2\pi in}\right)^2c_n(f'')$である。$M=\frac{1}{T}\int_a^b|f''|\,dx$とおくと$|c_n(f'')|\leq M$なので、$|c_n(f)|\leq\frac{T^2M}{4\pi^2n^2}$である。$\sum_{n\neq 0}\frac{1}{n^2}$は収束するので$\sum_n|c_n(f)|<\infty$である。

    ワイエルシュトラスの優級数定理により、$g(x)=\sum_nc_n(f)e^{2\pi inx/T}$は一様に絶対収束し、$g$は連続で周期$T$をもつ。項別積分より$c_n(g)=c_n(f)$である。連続周期関数はフーリエ係数で決まるので$g=f$である。
  strategy: Two integrations by parts give O(1/n²) coefficients; uniform convergence and uniqueness identify the sum.
  sketch:
  - 'setup: Since f'' is also T-periodic, two integrations by parts give c_n(f) = (T/(2πin))² c_n(f'''').'
  - 'derive: Hence |c_n(f)| ≤ T² M / (4π² n²), which is summable.'
  - 'apply_theorem: The M-test gives a uniformly convergent series with continuous sum g.'
  - 'derive: Term-by-term integration gives c_n(g) = c_n(f).'
  - 'conclude: Uniqueness for continuous periodic functions gives g = f.'
  openmath: (forall (a b f g h x) (-> (and (< a b) (forall (y) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value g y) y)) (forall (y) (has_deriv_at (lambda (t) (fn_value g t)) (fn_value h y) y)) (fn_continuous (lambda (y) (fn_value h y))) (forall (y) (= (fn_value f (+ y (- b a))) (fn_value f y)))) (has_sum_fn (lambda (n) (* (fourier_coeff_on f a b n) (exp (/ (* 2 (* pi (* complex_i (* n x)))) (- b a))))) (fn_value f x))))
  hard_negative:
    statement: $f$が周期$T$をもち連続であるだけで、各点で$\sum_{n}c_n(f)e^{2\pi inx/T}$は$f(x)$に収束する。
    reason: デュ・ボア＝レーモンの例のように、フーリエ級数がある点で発散する連続周期関数が存在する。
  target: |
    ∀ (a b : ℝ) (hab : a < b) (f f' f'' : ℝ → ℂ), (∀ x, HasDerivAt f (f' x) x) → (∀ x, HasDerivAt f' (f'' x) x) → Continuous f'' → (∀ x, f (x + (b - a)) = f x) → ∀ x : ℝ, HasSum (fun n : ℤ => fourierCoeffOn hab f n * Complex.exp (2 * Real.pi * Complex.I * n * x / ((b - a : ℝ) : ℂ))) (f x)
  proof: |
    by
      intro a b hab f f' f'' h1 h2 hc hper x
      haveI hT : Fact (0 < b - a) := ⟨sub_pos.mpr hab⟩
      have hba : 0 < b - a := sub_pos.mpr hab
      have hper' : Function.Periodic f (b - a) := hper
      have hper1 : ∀ y, f' (y + (b - a)) = f' y := by
        intro y
        have h3 := (h1 (y + (b - a))).comp_add_const y (b - a)
        have h4 : (fun z => f (z + (b - a))) = f := funext hper
        rw [h4] at h3
        exact h3.unique (h1 y)
      have hfa : f a = f b := by
        have := hper a; rw [show a + (b - a) = b by ring] at this; exact this.symm
      have hf'a : f' a = f' b := by
        have := hper1 a; rw [show a + (b - a) = b by ring] at this; exact this.symm
      have hi'' : IntervalIntegrable f'' MeasureTheory.volume a b := hc.intervalIntegrable a b
      have hc' : Continuous f' := continuous_iff_continuousAt.mpr (fun y => (h2 y).continuousAt)
      have hi' : IntervalIntegrable f' MeasureTheory.volume a b := hc'.intervalIntegrable a b
      have hfc : Continuous f := continuous_iff_continuousAt.mpr (fun y => (h1 y).continuousAt)
      let F : C(AddCircle (b - a), ℂ) := ⟨hper'.lift, continuous_coinduced_dom.mpr hfc⟩
      have hF : ∀ y : ℝ, F (y : AddCircle (b - a)) = f y := fun y => rfl
      have hcoef : ∀ n : ℤ, fourierCoeff (F : AddCircle (b - a) → ℂ) n = fourierCoeffOn hab f n := by
        intro n
        rw [fourierCoeff_eq_intervalIntegral _ n a, fourierCoeffOn_eq_integral, show a + (b - a) = b by ring]
        simp only [hF]
      set M : ℝ := (b - a)⁻¹ * ∫ y in a..b, ‖f'' y‖ with hM
      have hbound : ∀ n : ℤ, ‖fourierCoeffOn hab f'' n‖ ≤ M := by
        intro n
        rw [fourierCoeffOn_eq_integral, norm_smul]
        have h1 : ‖∫ y in a..b, fourier (-n) (y : AddCircle (b - a)) • f'' y‖ ≤ ∫ y in a..b, ‖f'' y‖ := by
          refine (intervalIntegral.norm_integral_le_integral_norm hab.le).trans (le_of_eq ?_)
          congr 1
          funext y
          rw [norm_smul, fourier_apply, Circle.norm_coe, one_mul]
        have h2 : ‖((1 / (b - a) : ℝ))‖ = (b - a)⁻¹ := by
          rw [Real.norm_eq_abs, abs_of_pos (by positivity), one_div]
        rw [h2]
        exact mul_le_mul_of_nonneg_left h1 (by positivity)
      have hdecay : ∀ n : ℤ, n ≠ 0 → ‖fourierCoeffOn hab f n‖ ≤ ((b - a) / (2 * Real.pi)) ^ 2 * M * (1 / (n : ℝ) ^ 2) := by
        intro n hn
        have e1 := fourierCoeffOn_of_hasDerivAt hab hn (fun y _ => h1 y) hi'
        have e2 := fourierCoeffOn_of_hasDerivAt hab hn (fun y _ => h2 y) hi''
        rw [← hfa, sub_self, mul_zero, zero_sub] at e1
        rw [← hf'a, sub_self, mul_zero, zero_sub] at e2
        rw [e2] at e1
        rw [e1]
        have hn' : (0:ℝ) < |(n:ℝ)| := abs_pos.mpr (by exact_mod_cast hn)
        have h4 : ‖(b : ℂ) - a‖ = b - a := by
          rw [← Complex.ofReal_sub, Complex.norm_real, Real.norm_eq_abs, abs_of_pos hba]
        have h3 : ‖(1 : ℂ) / (-2 * Real.pi * Complex.I * n)‖ = 1 / (2 * Real.pi * |(n : ℝ)|) := by
          simp [abs_of_pos Real.pi_pos]
        simp only [norm_mul, norm_neg, h3, h4]
        have hsq : (n:ℝ) ^ 2 = |(n:ℝ)| ^ 2 := (sq_abs _).symm
        rw [hsq]
        have hb := hbound n
        calc _ ≤ 1 / (2 * Real.pi * |(n : ℝ)|) * ((b - a) * (1 / (2 * Real.pi * |(n : ℝ)|) * ((b - a) * M))) := by gcongr
          _ = _ := by field_simp
      have hsum : Summable (fourierCoeff (F : AddCircle (b - a) → ℂ)) := by
        have hg : Summable (fun n : ℤ => ((b - a) / (2 * Real.pi)) ^ 2 * M * (1 / (n : ℝ) ^ 2)) :=
          (Real.summable_one_div_int_pow.mpr (by norm_num)).mul_left _
        refine Summable.of_norm_bounded_eventually hg ?_
        have hfin : ({0} : Set ℤ).Finite := Set.finite_singleton 0
        filter_upwards [hfin.compl_mem_cofinite] with n hn
        rw [hcoef]
        exact hdecay n hn
      have hp := has_pointwise_sum_fourier_series_of_summable hsum (x : AddCircle (b - a))
      rw [hF] at hp
      refine HasSum.congr_fun hp (fun n => ?_)
      rw [hcoef, fourier_coe_apply, smul_eq_mul]
- id: fourier_transform_translation
  kind: gap
  level: 3
  topic: フーリエ変換・平行移動
  statement: 可積分な$f:\mathbb{R}\to\mathbb{C}$のフーリエ変換を$\hat{f}(w)=\int_{\mathbb{R}}e^{-2\pi ivw}f(v)\,dv$とする。実数$a$について$g(v)=f(v+a)$とおくと$\hat{g}(w)=e^{2\pi iaw}\hat{f}(w)$である。
  statement_en: For integrable f on ℝ, let the Fourier transform be f^(w) = ∫ e^(-2πivw) f(v) dv. For real a and g(v) = f(v+a), one has g^(w) = e^(2πiaw) f^(w).
