    $n$で成り立つと仮定する。部分積分より
    $\int_0^1x^{m}(1-x)^{n+1}\,dx=\left[\frac{x^{m+1}}{m+1}(1-x)^{n+1}\right]_0^1+\frac{n+1}{m+1}\int_0^1x^{m+1}(1-x)^{n}\,dx$
    である。境界の項は$0$である。帰納法の仮定を$m+1$に用いると、右辺は$\frac{n+1}{m+1}\cdot\frac{(m+1)!\,n!}{(m+n+2)!}=\frac{m!\,(n+1)!}{(m+n+2)!}$である。
  strategy: Induct on n by integrating by parts, raising the exponent of x each time.
  sketch:
  - 'setup: The case n = 0 is the integral of x^m.'
  - 'induction: Integrate by parts, the boundary terms vanishing.'
  - 'derive: Apply the hypothesis with m + 1 and simplify.'
  - 'conclude: This gives m! (n+1)! / (m+n+2)!.'
