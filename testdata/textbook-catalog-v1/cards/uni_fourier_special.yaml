- id: gamma_integral_abs_convergent
  kind: gap
  level: 2
  topic: 特殊関数・ガンマ関数の積分表示
  statement: 実数$s>0$に対して広義積分$\int_0^\infty e^{-x}x^{s-1}\,dx$は絶対収束し、その値が$\Gamma(s)$である。
  statement_en: For a real number s > 0, the improper integral of e^(-x) x^(s-1) over (0, ∞) converges absolutely, and its value is Γ(s).
  assumptions:
  - $s>0$
  quantifiers:
  - 任意の実数$s$
  conclusion: $e^{-x}x^{s-1}$は$(0,\infty)$で可積分であり、$\Gamma(s)=\int_0^\infty e^{-x}x^{s-1}\,dx$である。
  answer: |
    $s>0$を実数とする。被積分関数$e^{-x}x^{s-1}$は$(0,\infty)$で正の連続関数なので、$(0,1]$と$[1,\infty)$に分けて積分の有限性を確かめる。

    $0<x\leq 1$では$e^{-x}\leq 1$より$e^{-x}x^{s-1}\leq x^{s-1}$であり、$s>0$なので$\int_0^1x^{s-1}\,dx=\frac{1}{s}$は有限である。

    $x\to\infty$で$x^{s+1}e^{-x}\to 0$なので、ある定数$M>0$があって$x\geq 1$で$x^{s+1}e^{-x}\leq M$となる。よって$x\geq 1$で$e^{-x}x^{s-1}\leq Mx^{-2}$であり、$\int_1^\infty x^{-2}\,dx=1$は有限である。

    したがって積分は絶対収束する。$\Gamma(s)$はこの積分の値として定義される関数である。
  strategy: Split the integral at 1 and compare with x^(s-1) near 0 and with x^(-2) near infinity.
  sketch:
  - 'setup: Split (0, ∞) into (0, 1] and [1, ∞).'
  - 'derive: On (0, 1] the integrand is at most x^(s-1), which is integrable because s > 0.'
  - 'derive: On [1, ∞) the integrand is at most M x^(-2), because x^(s+1) e^(-x) is bounded.'
  - 'conclude: Both pieces are finite, so the integral converges absolutely and defines Γ(s).'
  openmath: (forall (s) (-> (> s 0) (and (integrable_on_ioi (lambda (x) (* (exp (neg x)) (^ x (- s 1)))) 0) (= (gamma_fn s) (integral_ioi 0 (lambda (x) (* (exp (neg x)) (^ x (- s 1)))))))))
  hard_negative:
    statement: $s\leq 0$でも$\int_0^\infty e^{-x}x^{s-1}\,dx$は収束する。
    reason: $s\leq 0$では$0<x\leq 1$で$e^{-x}x^{s-1}\geq e^{-1}x^{s-1}\geq e^{-1}x^{-1}$であり、$\int_0^1x^{-1}\,dx$は発散する。
  target: |
    ∀ s : ℝ, 0 < s → MeasureTheory.IntegrableOn (fun x : ℝ => Real.exp (-x) * x ^ (s - 1)) (Set.Ioi 0) MeasureTheory.volume ∧ Real.Gamma s = ∫ x in Set.Ioi (0:ℝ), Real.exp (-x) * x ^ (s - 1)
  proof: |
    by
      intro s hs
      exact ⟨Real.GammaIntegral_convergent hs, Real.Gamma_eq_integral hs⟩
- id: gamma_recurrence_positive
  kind: gap
  level: 2
  topic: 特殊関数・ガンマ関数の漸化式
  statement: 実数$s>0$について$\Gamma(s+1)=s\,\Gamma(s)$である。
  statement_en: For a real number s > 0, Γ(s+1) = s Γ(s).
  assumptions:
  - $s>0$
  quantifiers:
  - 任意の実数$s$
  conclusion: $\Gamma(s+1)=s\,\Gamma(s)$である。
  answer: |
    $s>0$を実数とし、$\Gamma(s)=\int_0^\infty e^{-x}x^{s-1}\,dx$とする。$0<\varepsilon<R$に対して部分積分すると
    $\int_\varepsilon^Re^{-x}x^{s}\,dx=\left[-e^{-x}x^{s}\right]_\varepsilon^R+s\int_\varepsilon^Re^{-x}x^{s-1}\,dx$
    である。$s>0$より$\varepsilon\to 0$で$e^{-\varepsilon}\varepsilon^{s}\to 0$であり、$R\to\infty$で$e^{-R}R^{s}\to 0$である。$s$と$s+1$はどちらも正なので、両辺の積分は$\varepsilon\to 0$、$R\to\infty$で収束する。極限をとると$\Gamma(s+1)=s\,\Gamma(s)$を得る。
  strategy: Integrate by parts on [ε, R] and pass to the limit, the boundary terms vanishing.
  sketch:
  - 'setup: Write Γ(s+1) as the limit of the integral of e^(-x) x^s over [ε, R].'
  - 'derive: Integrate by parts, differentiating x^s and integrating e^(-x).'
  - 'derive: The boundary terms tend to 0 as ε → 0 and R → ∞.'
  - 'conclude: The limit gives Γ(s+1) = s Γ(s).'
  openmath: (forall (s) (-> (> s 0) (= (gamma_fn (+ s 1)) (* s (gamma_fn s)))))
  hard_negative:
    statement: すべての実数$s>0$について$\Gamma(s+1)=(s+1)\Gamma(s)$である。
    reason: $s=1$とすると$\Gamma(2)=1$であるが、右辺は$2\Gamma(1)=2$である。
  target: |
    ∀ s : ℝ, 0 < s → Real.Gamma (s + 1) = s * Real.Gamma s
  proof: |
    by
      intro s hs
      exact Real.Gamma_add_one hs.ne'
- id: gamma_at_natural_factorial
  kind: gap
  level: 2
  topic: 特殊関数・ガンマ関数と階乗
  statement: 非負整数$n$について$\Gamma(n+1)=n!$である。
  statement_en: For a nonnegative integer n, Γ(n+1) = n!.
  assumptions:
  - $n$は非負整数
  quantifiers:
  - 任意の非負整数$n$
  conclusion: $\Gamma(n+1)=n!$である。
  answer: |
    $\Gamma(s)=\int_0^\infty e^{-x}x^{s-1}\,dx$（$s>0$）とし、$n$に関する帰納法で示す。$n=0$のとき$\Gamma(1)=\int_0^\infty e^{-x}\,dx=1=0!$である。$\Gamma(n+1)=n!$を仮定する。$n+1>0$なので、漸化式$\Gamma(s+1)=s\Gamma(s)$を$s=n+1$に用いて$\Gamma(n+2)=(n+1)\Gamma(n+1)=(n+1)\cdot n!=(n+1)!$を得る。
  strategy: Induct on n using Γ(1) = 1 and the recurrence.
  sketch:
  - 'setup: Compute Γ(1) as the integral of e^(-x) over (0, ∞), which equals 1.'
  - 'induction: If Γ(n+1) = n!, the recurrence gives Γ(n+2) = (n+1) n!.'
  - 'conclude: Hence Γ(n+1) = n! for all n.'
  openmath: (forall (n) (-> (in n N) (= (gamma_fn (+ n 1)) (factorial n))))
  hard_negative:
    statement: 非負整数$n$について$\Gamma(n)=n!$である。
    reason: $n=1$では$\Gamma(1)=1=1!$と一致するが、$n=2$では$\Gamma(2)=1$、$2!=2$である。
  target: |
    ∀ n : ℕ, Real.Gamma ((n : ℝ) + 1) = (n.factorial : ℝ)
  proof: |
    by
      intro n
      exact Real.Gamma_nat_eq_factorial n
- id: gamma_shift_by_natural
  kind: gap
  level: 2
  topic: 特殊関数・ガンマ関数の漸化式の反復
  statement: 実数$s>0$と非負整数$n$について$\Gamma(s+n)=\left(\prod_{k=0}^{n-1}(s+k)\right)\Gamma(s)$である。ただし$n=0$のとき積は$1$とする。これは$s=1$で$\Gamma(n+1)=n!$を与える。
  statement_en: For a real number s > 0 and a nonnegative integer n, Γ(s+n) = (∏_{k=0}^{n-1} (s+k)) Γ(s), with the empty product equal to 1. For s = 1 this gives Γ(n+1) = n!.
  assumptions:
  - $s>0$
  - $n$は非負整数
  quantifiers:
  - 任意の実数$s$
  - 任意の非負整数$n$
  conclusion: $\Gamma(s+n)=\left(\prod_{k=0}^{n-1}(s+k)\right)\Gamma(s)$である。
  answer: |
    $s>0$を実数とし、$n$に関する帰納法で示す。$n=0$では両辺とも$\Gamma(s)$である。$\Gamma(s+n)=\left(\prod_{k=0}^{n-1}(s+k)\right)\Gamma(s)$を仮定する。$s+n>0$なので、漸化式$\Gamma(t+1)=t\Gamma(t)$を$t=s+n$に用いると
    $\Gamma(s+n+1)=(s+n)\Gamma(s+n)=\left(\prod_{k=0}^{n}(s+k)\right)\Gamma(s)$
    である。よって$n+1$でも成り立つ。
  strategy: Iterate the recurrence by induction on n.
  sketch:
  - 'setup: The case n = 0 is trivial with the empty product.'
  - 'induction: Apply Γ(t+1) = t Γ(t) at t = s + n, which is positive.'
  - 'conclude: The product gains the factor s + n, so the formula holds for n + 1.'
  openmath: (forall (s n) (-> (and (> s 0) (in n N)) (= (gamma_fn (+ s n)) (* (prod_over (finset_range n) (lambda (k) (+ s k))) (gamma_fn s)))))
  hard_negative:
    statement: 実数$s>0$と非負整数$n$について$\Gamma(s+n)=s^n\Gamma(s)$である。
    reason: $s=1$、$n=2$とすると$\Gamma(3)=2$であるが、$s^n\Gamma(s)=1$である。
  target: |
    ∀ (s : ℝ) (n : ℕ), 0 < s → Real.Gamma (s + n) = (∏ k ∈ Finset.range n, (s + k)) * Real.Gamma s
  proof: |
    by
      intro s n hs
      induction n with
      | zero => simp
      | succ n ih =>
        have h : s + (n : ℝ) ≠ 0 := by positivity
        rw [Nat.cast_succ, ← add_assoc, Real.Gamma_add_one h, ih, Finset.prod_range_succ]
        ring
- id: gamma_sign_on_negative_intervals
  kind: gap
  level: 3
  topic: 特殊関数・負の実数でのガンマ関数の符号
  statement: $\Gamma$を$s>0$では積分で定め、負の非整数$s$では$\Gamma(s)=\Gamma(s+1)/s$で順に延長する。非負整数$n$と$-(n+1)<s<-n$を満たす実数$s$について、$(-1)^{n+1}\Gamma(s)>0$である。
  statement_en: Define Γ by its integral for s > 0 and extend it to negative non-integers by Γ(s) = Γ(s+1)/s. For a nonnegative integer n and a real s with -(n+1) < s < -n, one has (-1)^(n+1) Γ(s) > 0.
  assumptions:
  - $n$は非負整数
  - $-(n+1)<s<-n$
  - $\Gamma(s)=\Gamma(s+1)/s$で負の非整数に延長する
  quantifiers:
  - 任意の非負整数$n$
  - 任意の実数$s$
  conclusion: $(-1)^{n+1}\Gamma(s)>0$である。
  answer: |
    $n$に関する帰納法で示す。$s>0$では被積分関数が正なので$\Gamma(s)>0$である。

    $n=0$とし、$-1<s<0$とする。$s+1>0$なので$\Gamma(s+1)>0$であり、$s<0$なので$\Gamma(s)=\Gamma(s+1)/s<0$である。よって$(-1)^{1}\Gamma(s)>0$である。

    $n\geq 1$とし、$n-1$で成り立つと仮定する。$-(n+1)<s<-n$とする。$-n<s+1<-(n-1)$なので、仮定から$(-1)^{n}\Gamma(s+1)>0$である。$s<0$と$\Gamma(s)=\Gamma(s+1)/s$より、$(-1)^{n+1}\Gamma(s)=(-1)^{n}\Gamma(s+1)\cdot\frac{1}{-s}>0$である。
  strategy: Induct on n, moving s to s + 1 with the functional equation and tracking one sign change.
  sketch:
  - 'setup: Γ is positive on (0, ∞).'
  - 'derive: For -1 < s < 0, Γ(s) = Γ(s+1)/s is negative.'
  - 'induction: For -(n+1) < s < -n, the point s + 1 lies in the previous interval.'
  - 'derive: Dividing by the negative number s changes the sign once.'
  - 'conclude: Hence (-1)^(n+1) Γ(s) > 0.'
  openmath: (forall (s n) (-> (and (in n N) (< (neg (+ n 1)) s) (< s (neg n))) (> (* (^ (neg 1) (+ n 1)) (gamma_fn s)) 0)))
  hard_negative:
    statement: すべての負の非整数$s$で$\Gamma(s)<0$である。
    reason: $-2<s<-1$では$s+1\in(-1,0)$より$\Gamma(s+1)<0$であり、$s<0$なので$\Gamma(s)=\Gamma(s+1)/s>0$である。
  target: |
    ∀ (s : ℝ) (n : ℕ), (-((n : ℝ) + 1)) < s → s < -(n : ℝ) → 0 < (-1 : ℝ) ^ (n + 1) * Real.Gamma s
  proof: |
    by
      intro s n
      induction n generalizing s with
      | zero =>
        intro h1 h2
        have h1' : 0 < s + 1 := by push_cast at h1 h2; linarith
        have h2' : s < 0 := by push_cast at h1 h2; linarith
        have hne : s ≠ 0 := h2'.ne
        have := Real.Gamma_add_one hne
        have hp := Real.Gamma_pos_of_pos h1'
        rw [this] at hp
        have : Real.Gamma s < 0 := by
          by_contra hc
          push Not at hc
          have := mul_nonpos_of_nonpos_of_nonneg h2'.le hc
          linarith
        simp
        linarith
      | succ n ih =>
        intro h1 h2
        push_cast at h1 h2
        have h1' : -((n:ℝ) + 1) < s + 1 := by linarith
        have h2' : s + 1 < -(n:ℝ) := by linarith
        have hs : s < 0 := by have : (0:ℝ) ≤ n := Nat.cast_nonneg n; linarith
        have hne : s ≠ 0 := hs.ne
        have key := ih (s + 1) h1' h2'
        rw [Real.Gamma_add_one hne] at key
        have : (-1 : ℝ) ^ (n + 1 + 1) * Real.Gamma s * (-s) = (-1 : ℝ) ^ (n + 1) * (s * Real.Gamma s) := by
          rw [pow_succ]; ring
        have hneg : 0 < -s := by linarith
        have h3 : 0 < (-1 : ℝ) ^ (n + 1 + 1) * Real.Gamma s * (-s) := by rw [this]; exact key
        exact (pos_iff_pos_of_mul_pos h3).mpr hneg
- id: gamma_one_half_sqrt_pi
  kind: gap
  level: 2
  topic: 特殊関数・半整数でのガンマ関数の値
  statement: $\Gamma(1/2)=\sqrt{\pi}$である。
  statement_en: Γ(1/2) = √π.
  assumptions:
  - なし
  quantifiers:
  - なし
  conclusion: $\Gamma(1/2)=\sqrt{\pi}$である。
  answer: |
    ガウス積分$\int_{-\infty}^{\infty}e^{-t^2}\,dt=\sqrt{\pi}$を用いる。被積分関数は偶関数なので$\int_0^\infty e^{-t^2}\,dt=\frac{\sqrt{\pi}}{2}$である。定義式$\Gamma(1/2)=\int_0^\infty e^{-x}x^{-1/2}\,dx$で$x=t^2$と置換すると$dx=2t\,dt$、$x^{-1/2}=t^{-1}$なので
    $\Gamma(1/2)=\int_0^\infty e^{-t^2}t^{-1}\cdot 2t\,dt=2\int_0^\infty e^{-t^2}\,dt=\sqrt{\pi}$
    である。
  strategy: Substitute x = t^2 to reduce the definition to the Gaussian integral.
  sketch:
  - 'setup: Write Γ(1/2) as the integral of e^(-x) x^(-1/2) over (0, ∞).'
  - 'translate: Substitute x = t^2, so the integral becomes twice the Gaussian integral over (0, ∞).'
  - 'apply_theorem: The Gaussian integral over the real line equals √π.'
  - 'conclude: Hence Γ(1/2) = √π.'
  openmath: (= (gamma_fn (/ 1 2)) (root pi 2))
  hard_negative:
    statement: $\Gamma(1/2)=\pi$である。
    reason: ガウス積分から値は$\sqrt{\pi}\approx 1.77$である。$\pi$は$\Gamma(1/2)^2$に等しい。
  target: |
    Real.Gamma (1 / 2) = Real.sqrt Real.pi
  proof: |
    by
      exact Real.Gamma_one_half_eq
- id: gamma_half_integer_formula
  kind: gap
  level: 2
  topic: 特殊関数・半整数でのガンマ関数の値
  statement: 非負整数$n$について$\Gamma\left(n+\frac{1}{2}\right)=\frac{(2n)!}{4^nn!}\sqrt{\pi}$である。
  statement_en: For a nonnegative integer n, Γ(n + 1/2) = (2n)! √π / (4^n n!).
  assumptions:
  - $n$は非負整数
  quantifiers:
  - 任意の非負整数$n$
  conclusion: $\Gamma\left(n+\frac{1}{2}\right)=\frac{(2n)!}{4^nn!}\sqrt{\pi}$である。
  answer: |
    $n$に関する帰納法で示す。$n=0$では$\Gamma(1/2)=\sqrt{\pi}$であり、右辺も$\sqrt{\pi}$である。$n$で成り立つと仮定する。$n+\frac{1}{2}>0$なので漸化式から
    $\Gamma\left(n+1+\frac{1}{2}\right)=\left(n+\frac{1}{2}\right)\Gamma\left(n+\frac{1}{2}\right)=\frac{2n+1}{2}\cdot\frac{(2n)!}{4^nn!}\sqrt{\pi}$
    である。分母と分子に$2n+2=2(n+1)$を掛けると、分子は$(2n+2)(2n+1)(2n)!=(2n+2)!$、分母は$2\cdot 2(n+1)\cdot 4^nn!=4^{n+1}(n+1)!$となる。よって$n+1$でも成り立つ。
  strategy: Induct on n from Γ(1/2) = √π using the recurrence.
  sketch:
  - 'setup: The case n = 0 is Γ(1/2) = √π.'
  - 'induction: Apply Γ(s+1) = s Γ(s) at s = n + 1/2.'
  - 'derive: Multiply numerator and denominator by 2n + 2 to obtain (2n+2)! and 4^(n+1) (n+1)!.'
  - 'conclude: The formula holds for n + 1.'
  openmath: (forall (n) (-> (in n N) (= (gamma_fn (+ n (/ 1 2))) (* (/ (factorial (* 2 n)) (* (^ 4 n) (factorial n))) (root pi 2)))))
  hard_negative:
    statement: 非負整数$n$について$\Gamma\left(n+\frac{1}{2}\right)=\frac{(2n)!}{2^nn!}\sqrt{\pi}$である。
    reason: $n=1$とすると$\Gamma(3/2)=\frac{1}{2}\sqrt{\pi}$であるが、この式の右辺は$\frac{2}{2}\sqrt{\pi}=\sqrt{\pi}$である。
  target: |
    ∀ n : ℕ, Real.Gamma ((n : ℝ) + 1 / 2) = ((2 * n).factorial : ℝ) / (4 ^ n * (n.factorial : ℝ)) * Real.sqrt Real.pi
  proof: |
    by
      intro n
      induction n with
      | zero =>
        simp only [Nat.cast_zero, zero_add, mul_zero, Nat.factorial, pow_zero, Nat.cast_one, mul_one, div_one, one_mul]
        exact Real.Gamma_one_half_eq
      | succ n ih =>
        have h : (n : ℝ) + 1 / 2 ≠ 0 := by positivity
        have e : ((n + 1 : ℕ) : ℝ) + 1 / 2 = (n : ℝ) + 1 / 2 + 1 := by push_cast; ring
        rw [e, Real.Gamma_add_one h, ih]
        have f1 : ((2 * (n + 1)).factorial : ℝ) = (2 * n + 2) * (2 * n + 1) * ((2 * n).factorial : ℝ) := by
          rw [show 2 * (n + 1) = 2 * n + 1 + 1 by ring, Nat.factorial_succ, Nat.factorial_succ]
          push_cast; ring
        rw [f1, Nat.factorial_succ]
        push_cast
        have hn : (n.factorial : ℝ) ≠ 0 := by positivity
        field_simp
        ring
- id: gamma_log_convex_holder
  kind: gap
  level: 3
  topic: 特殊関数・ガンマ関数の対数凸性
  statement: $s,t>0$、$a,b>0$、$a+b=1$のとき$\Gamma(as+bt)\leq\Gamma(s)^a\Gamma(t)^b$である。すなわち$\log\Gamma$は$(0,\infty)$で凸である。
  statement_en: For s, t > 0 and a, b > 0 with a + b = 1, Γ(as + bt) ≤ Γ(s)^a Γ(t)^b. Equivalently, log Γ is convex on (0, ∞).
  assumptions:
  - $s,t>0$
  - $a,b>0$
  - $a+b=1$
  quantifiers:
  - 任意の実数$s,t,a,b$
  conclusion: $\Gamma(as+bt)\leq\Gamma(s)^a\Gamma(t)^b$であり、$\log\Gamma$は$(0,\infty)$で凸である。
  answer: |
    $s,t>0$、$a,b>0$、$a+b=1$とする。$x>0$に対して
    $e^{-x}x^{as+bt-1}=\left(e^{-x}x^{s-1}\right)^a\left(e^{-x}x^{t-1}\right)^b$
    が成り立つ。これは$a+b=1$から指数を比べれば分かる。$\frac{1}{a}$と$\frac{1}{b}$は共役指数なので、ヘルダーの不等式より
    $\Gamma(as+bt)=\int_0^\infty\left(e^{-x}x^{s-1}\right)^a\left(e^{-x}x^{t-1}\right)^b\,dx\leq\left(\int_0^\infty e^{-x}x^{s-1}\,dx\right)^a\left(\int_0^\infty e^{-x}x^{t-1}\,dx\right)^b=\Gamma(s)^a\Gamma(t)^b$
    である。$\Gamma>0$なので両辺の対数をとると$\log\Gamma(as+bt)\leq a\log\Gamma(s)+b\log\Gamma(t)$となり、$\log\Gamma$は$(0,\infty)$で凸である。
  strategy: Factor the integrand and apply Hölder's inequality with exponents 1/a and 1/b.
  sketch:
  - 'setup: Write e^(-x) x^(as+bt-1) as the product of the a-th power of e^(-x) x^(s-1) and the b-th power of e^(-x) x^(t-1).'
  - 'apply_theorem: Apply Hölder''s inequality with exponents 1/a and 1/b.'
  - 'derive: This gives Γ(as+bt) ≤ Γ(s)^a Γ(t)^b.'
  - 'conclude: Taking logarithms of positive values gives the convexity of log Γ.'
  openmath: (forall (s t a b) (-> (and (> s 0) (> t 0) (> a 0) (> b 0) (= (+ a b) 1)) (and (<= (gamma_fn (+ (* a s) (* b t))) (* (^ (gamma_fn s) a) (^ (gamma_fn t) b))) (<= (ln (gamma_fn (+ (* a s) (* b t)))) (+ (* a (ln (gamma_fn s))) (* b (ln (gamma_fn t))))))))
  hard_negative:
    statement: $\log\Gamma$は$(0,\infty)$で凹である。
    reason: $s=1$、$t=3$、$a=b=\frac{1}{2}$とすると$\log\Gamma(2)=0$であり、$\frac{1}{2}(\log\Gamma(1)+\log\Gamma(3))=\frac{1}{2}\log 2>0$なので、凹関数の不等式は成り立たない。
  target: |
    (∀ (s t a b : ℝ), 0 < s → 0 < t → 0 < a → 0 < b → a + b = 1 → Real.Gamma (a * s + b * t) ≤ Real.Gamma s ^ a * Real.Gamma t ^ b) ∧ ConvexOn ℝ (Set.Ioi 0) (Real.log ∘ Real.Gamma)
  proof: |
    by
      refine ⟨?_, Real.convexOn_log_Gamma⟩
      intro s t a b hs ht ha hb hab
      exact Real.Gamma_mul_add_mul_le_rpow_Gamma_mul_rpow_Gamma hs ht ha hb hab
- id: bohr_mollerup_uniqueness
  kind: named
  level: 3
  topic: 特殊関数・ボーア＝モレルップの定理
  statement: ボーア＝モレルップの定理。$f:(0,\infty)\to\mathbb{R}$が正の値をとり、$\log f$が$(0,\infty)$で凸で、$s>0$で$f(s+1)=sf(s)$を満たし、$f(1)=1$ならば、$(0,\infty)$上で$f=\Gamma$である。
  statement_en: Bohr–Mollerup theorem. If f on (0, ∞) is positive, log f is convex on (0, ∞), f(s+1) = s f(s) for s > 0, and f(1) = 1, then f = Γ on (0, ∞).
  assumptions:
  - $f$は$(0,\infty)$で正の値をとる
  - $\log f$は$(0,\infty)$で凸
  - $s>0$で$f(s+1)=sf(s)$
  - $f(1)=1$
  quantifiers:
  - 任意の関数$f$
  conclusion: $(0,\infty)$上で$f=\Gamma$である。
  answer: |
    $f$を仮定を満たす関数とし、$\varphi=\log f$とおく。$f(1)=1$と漸化式から、正の整数$n$について$f(n+1)=n!$である。$0<x\leq 1$と正の整数$n$をとる。

    凸関数の傾きは右へ行くほど増えるので、3点$n<n+1<n+1+x$と3点$n+1<n+1+x\leq n+2$について
    $\varphi(n+1)-\varphi(n)\leq\frac{\varphi(n+1+x)-\varphi(n+1)}{x}\leq\varphi(n+2)-\varphi(n+1)$
    である。左辺は$\log n$、右辺は$\log(n+1)$である。漸化式を繰り返すと$f(n+1+x)=f(x)\prod_{j=0}^{n}(x+j)$なので、$G_n(x)=\frac{n^xn!}{\prod_{j=0}^{n}(x+j)}$とおくと
    $G_n(x)\leq f(x)\leq\left(1+\frac{1}{n}\right)^xG_n(x)$
    を得る。$n\to\infty$で$\left(1+\frac{1}{n}\right)^x\to 1$なので、$f(x)=\lim_{n\to\infty}G_n(x)$である。

    右辺は$f$によらない。$\Gamma$も仮定をすべて満たす（正値性、対数凸性、漸化式、$\Gamma(1)=1$）ので、同じ議論から$\Gamma(x)=\lim_{n\to\infty}G_n(x)$である。よって$(0,1]$で$f=\Gamma$である。

    $x>1$については、$x-m\in(0,1]$となる正の整数$m$をとる。$f$と$\Gamma$は同じ漸化式を満たすので、$f(x)=\Gamma(x)$である。
  strategy: Squeeze f(x) between expressions independent of f using the increasing slopes of the convex function log f.
  sketch:
  - 'setup: Let φ = log f; the recurrence and f(1) = 1 give f(n+1) = n!.'
  - 'derive: For 0 < x ≤ 1, the slopes of φ give x log n ≤ φ(n+1+x) - φ(n+1) ≤ x log(n+1).'
  - 'derive: Using f(n+1+x) = f(x) ∏_{j≤n}(x+j), obtain G_n(x) ≤ f(x) ≤ (1+1/n)^x G_n(x) with G_n independent of f.'
  - 'derive: Hence f(x) is the limit of G_n(x), and the same holds for Γ.'
  - 'conclude: So f = Γ on (0, 1], and the recurrence extends this to (0, ∞).'
  openmath: (forall (f) (-> (and (forall (y) (-> (> y 0) (> (fn_value f y) 0))) (forall (a b x y) (-> (and (> x 0) (> y 0) (> a 0) (> b 0) (= (+ a b) 1)) (<= (ln (fn_value f (+ (* a x) (* b y)))) (+ (* a (ln (fn_value f x))) (* b (ln (fn_value f y))))))) (forall (y) (-> (> y 0) (= (fn_value f (+ y 1)) (* y (fn_value f y))))) (= (fn_value f 1) 1)) (forall (s) (-> (> s 0) (= (fn_value f s) (gamma_fn s))))))
  hard_negative:
    statement: $f(s+1)=sf(s)$、$f(1)=1$、$f>0$を満たす$f:(0,\infty)\to\mathbb{R}$は$\Gamma$に限る。
    reason: 対数凸性を落とすと一意性は失われる。$f(s)=\Gamma(s)\left(2+\sin(2\pi s)\right)/2$は$f>0$、$f(1)=1$、$f(s+1)=sf(s)$を満たすが$\Gamma$と異なる。
  target: |
    ∀ f : ℝ → ℝ, ConvexOn ℝ (Set.Ioi 0) (Real.log ∘ f) → (∀ y : ℝ, 0 < y → f (y + 1) = y * f y) → (∀ y : ℝ, 0 < y → 0 < f y) → f 1 = 1 → Set.EqOn f Real.Gamma (Set.Ioi 0)
  proof: |
    by
      intro f h1 h2 h3 h4
      exact Real.eq_Gamma_of_log_convex h1 (fun {y} hy => h2 y hy) (fun {y} hy => h3 y hy) h4
- id: gamma_gauss_limit
  kind: named
  level: 3
  topic: 特殊関数・ガンマ関数のガウスの極限表示
  statement: ガウスの極限表示。実数$s$が$0$以下の整数でないとき、$\Gamma(s)=\lim_{n\to\infty}\frac{n^sn!}{\prod_{j=0}^{n}(s+j)}$である。ここで負の非整数での$\Gamma$は$\Gamma(s)=\Gamma(s+1)/s$で定める。
  statement_en: Gauss's limit formula. If a real s is not a nonpositive integer, then Γ(s) is the limit as n → ∞ of n^s n! / ∏_{j=0}^{n} (s+j), where Γ at negative non-integers is defined by Γ(s) = Γ(s+1)/s.
  assumptions:
  - $s$は$0$以下の整数でない
  - 負の非整数では$\Gamma(s)=\Gamma(s+1)/s$で定める
  quantifiers:
  - 任意の実数$s$
  conclusion: $\Gamma(s)=\lim_{n\to\infty}\frac{n^sn!}{\prod_{j=0}^{n}(s+j)}$である。
  answer: |
    $G_n(s)=\frac{n^sn!}{\prod_{j=0}^{n}(s+j)}$とおく（$n\geq 1$）。

    まず$0<s\leq 1$とする。$\varphi=\log\Gamma$は$(0,\infty)$で凸である。$\Gamma(m+1)=m!$なので$\varphi(n+1)-\varphi(n)=\log n$、$\varphi(n+2)-\varphi(n+1)=\log(n+1)$である。凸関数の傾きは右へ行くほど増えるので
    $\log n\leq\frac{\varphi(n+1+s)-\varphi(n+1)}{s}\leq\log(n+1)$
    である。$\Gamma(n+1+s)=\Gamma(s)\prod_{j=0}^{n}(s+j)$を代入して整理すると$G_n(s)\leq\Gamma(s)\leq\left(1+\frac{1}{n}\right)^sG_n(s)$となり、$n\to\infty$で$G_n(s)\to\Gamma(s)$である。

    次に積の添字をずらすと、$s$が$0$以下の整数でないとき
    $G_n(s)=\frac{1}{s}\cdot\frac{s+n+1}{n}\,G_n(s+1)$
    である。右辺の$\frac{s+n+1}{n}$は$1$に収束する。

    この式を$G_n(s+1)=s\cdot\frac{n}{s+n+1}G_n(s)$と書くと、$s>0$で$G_n(s)\to\Gamma(s)$ならば$G_n(s+1)\to s\Gamma(s)=\Gamma(s+1)$である。$(0,1]$から順に、すべての$s>0$で主張が従う。

    負の非整数$s$では、$s+1$で$G_n(s+1)\to\Gamma(s+1)$なら$G_n(s)\to\Gamma(s+1)/s=\Gamma(s)$である。$s+m>0$となる正の整数$m$まで順に戻れば、主張が従う。
  strategy: Prove the limit on (0, 1] by log-convexity, then transfer it to other s by the shift relation for G_n.
  sketch:
  - 'setup: Let G_n(s) = n^s n! / ∏_{j≤n}(s+j).'
  - 'derive: For 0 < s ≤ 1, log-convexity of Γ gives G_n(s) ≤ Γ(s) ≤ (1+1/n)^s G_n(s).'
  - 'derive: Reindexing gives G_n(s) = (1/s) ((s+n+1)/n) G_n(s+1).'
  - 'induction: This shift transfers the limit to all s > 0.'
  - 'conclude: The same shift reaches every negative non-integer, so G_n(s) → Γ(s).'
  openmath: (forall (s) (-> (and (in s R) (forall (m) (-> (in m N) (!= s (neg m))))) (seq_fn_tends_to (lambda (n) (/ (* (^ n s) (factorial n)) (prod_over (finset_range (+ n 1)) (lambda (j) (+ s j))))) (gamma_fn s))))
  hard_negative:
    statement: 実数$s>0$について$\Gamma(s)=\lim_{n\to\infty}\frac{n^sn!}{\prod_{j=1}^{n}(s+j)}$である。
    reason: 分母の$j=0$の因子$s$が抜けている。正しい式と比べて極限が$s$倍になり、値は$s\Gamma(s)=\Gamma(s+1)$である。$s=2$では$\Gamma(3)=2\neq 1=\Gamma(2)$である。
  target: |
    ∀ s : ℝ, (∀ m : ℕ, s ≠ -(m : ℝ)) → Filter.Tendsto (fun n : ℕ => (n : ℝ) ^ s * (n.factorial : ℝ) / ∏ j ∈ Finset.range (n + 1), (s + j)) Filter.atTop (nhds (Real.Gamma s))
  proof: |
    by
      intro s _
      exact Real.GammaSeq_tendsto_Gamma s
- id: gamma_reflection_formula
  kind: named
  level: 3
  topic: 特殊関数・ガンマ関数の相補公式
  statement: 相補公式。整数でない複素数$z$について$\Gamma(z)\Gamma(1-z)=\dfrac{\pi}{\sin\pi z}$である。ここで$\Gamma$は$\mathrm{Re}\,s>0$の積分を$0$以下の整数を除く$\mathbb{C}$へ解析接続したものである。
  statement_en: Reflection formula. For a complex number z that is not an integer, Γ(z) Γ(1-z) = π / sin(πz), where Γ is the analytic continuation of the integral on Re s > 0 to the complex plane minus the nonpositive integers.
  assumptions:
  - $z\in\mathbb{C}$は整数でない
  quantifiers:
  - 任意の複素数$z$
  conclusion: $\Gamma(z)\Gamma(1-z)=\dfrac{\pi}{\sin\pi z}$である。
  answer: |
    $z$を整数でない複素数とする。次の2つの定理を用いる。ガウスの極限表示は複素数でも成り立ち、$0$以下の整数でない$s$について$G_n(s)=\frac{n^sn!}{\prod_{j=0}^{n}(s+j)}$は$\Gamma(s)$に収束する。オイラーの正弦積により$\sin\pi z=\pi z\lim_{n\to\infty}\prod_{k=1}^{n}\left(1-\frac{z^2}{k^2}\right)$である。

    $n\geq 1$について$n^zn^{1-z}=n$であり、$\prod_{j=0}^{n}(1-z+j)=(n+1-z)\prod_{k=1}^{n}(k-z)$である。よって
    $G_n(z)G_n(1-z)=\frac{n\,(n!)^2}{z\prod_{k=1}^{n}(k+z)\cdot(n+1-z)\prod_{k=1}^{n}(k-z)}=\frac{n}{n+1-z}\cdot\frac{1}{z\prod_{k=1}^{n}\left(1-\frac{z^2}{k^2}\right)}$
    である。最後の等号では$(k+z)(k-z)=k^2\left(1-\frac{z^2}{k^2}\right)$と$\prod_{k=1}^{n}k^2=(n!)^2$を用いた。

    $z$は整数でないので、$\sin\pi z\neq 0$である。$n\to\infty$とすると$\frac{n}{n+1-z}\to 1$であり、右辺は$\frac{\pi}{\sin\pi z}$に収束する。左辺は$\Gamma(z)\Gamma(1-z)$に収束する。
  strategy: Multiply the Gauss limit expressions for z and 1 - z and compare with Euler's sine product.
  sketch:
  - 'setup: Let G_n(s) = n^s n! / ∏_{j≤n}(s+j), which converges to Γ(s).'
  - 'derive: The product G_n(z) G_n(1-z) simplifies to (n/(n+1-z)) / (z ∏_{k≤n}(1 - z²/k²)).'
  - 'apply_theorem: Euler''s sine product gives the limit of z ∏_{k≤n}(1 - z²/k²) as sin(πz)/π.'
  - 'derive: Since z is not an integer, this limit is nonzero.'
  - 'conclude: Passing to the limit gives Γ(z) Γ(1-z) = π / sin(πz).'
  openmath: (forall (z) (-> (and (in z C) (forall (k) (-> (in k Z) (!= z k)))) (= (* (complex_gamma_fn z) (complex_gamma_fn (- 1 z))) (/ pi (complex_sin (* pi z))))))
  hard_negative:
    statement: 整数でない複素数$z$について$\Gamma(z)\Gamma(1-z)=\dfrac{\pi}{\cos\pi z}$である。
    reason: $z=\frac{1}{2}$とすると左辺は$\Gamma(1/2)^2=\pi$であるが、$\cos\frac{\pi}{2}=0$なので右辺は意味をもたない。
  target: |
    ∀ z : ℂ, (∀ n : ℤ, z ≠ n) → Complex.Gamma z * Complex.Gamma (1 - z) = Real.pi / Complex.sin (Real.pi * z)
  proof: |
    by
      intro z _
      exact Complex.Gamma_mul_Gamma_one_sub z
- id: gamma_abs_sq_on_critical_line
  kind: gap
  level: 3
  topic: 特殊関数・直線上でのガンマ関数の絶対値
  statement: 実数$t$について$\left|\Gamma\left(\frac{1}{2}+it\right)\right|^2=\dfrac{\pi}{\cosh\pi t}$である。
  statement_en: For a real number t, |Γ(1/2 + it)|² = π / cosh(πt).
  assumptions:
  - $t\in\mathbb{R}$
  quantifiers:
  - 任意の実数$t$
  conclusion: $\left|\Gamma\left(\frac{1}{2}+it\right)\right|^2=\dfrac{\pi}{\cosh\pi t}$である。
  answer: |
    $t$を実数とし、$z=\frac{1}{2}+it$とおく。$z$は整数でない。$\mathrm{Re}\,s>0$では積分表示の共役をとれば$\Gamma(\overline{s})=\overline{\Gamma(s)}$が分かり、この$z$は$\mathrm{Re}\,z>0$を満たす。$1-z=\overline{z}$なので
    $\Gamma(z)\Gamma(1-z)=\Gamma(z)\overline{\Gamma(z)}=|\Gamma(z)|^2$
    である。相補公式から左辺は$\frac{\pi}{\sin\pi z}$である。$\sin\left(\frac{\pi}{2}+i\pi t\right)=\cos(i\pi t)=\cosh\pi t$なので主張が従う。
  strategy: On Re z = 1/2 one has 1 - z = conj z, so the reflection formula computes the squared modulus.
  sketch:
  - 'setup: Let z = 1/2 + it, so that 1 - z is the conjugate of z.'
  - 'derive: Conjugating the integral gives Γ(conj z) = conj Γ(z), hence Γ(z) Γ(1-z) = |Γ(z)|².'
  - 'apply_theorem: The reflection formula gives π / sin(πz).'
  - 'conclude: Since sin(π/2 + iπt) = cosh(πt), the claim follows.'
  openmath: (forall (t) (-> (in t R) (= (^ (abs (complex_gamma_fn (+ (/ 1 2) (* t complex_i)))) 2) (/ pi (real_cosh (* pi t))))))
  hard_negative:
    statement: 実数$t$について$\left|\Gamma\left(\frac{1}{2}+it\right)\right|^2=\dfrac{\pi}{\cos\pi t}$である。
    reason: $t=1$とすると右辺は$-\pi$であり負である。左辺は絶対値の$2$乗なので$0$以上である。
  target: |
    ∀ t : ℝ, Complex.normSq (Complex.Gamma (1 / 2 + t * Complex.I)) = Real.pi / Real.cosh (Real.pi * t)
  proof: |
    by
      intro t
      have h := Complex.Gamma_mul_Gamma_one_sub (1 / 2 + t * Complex.I)
      have hc : (1:ℂ) - (1 / 2 + t * Complex.I) = (starRingEnd ℂ) (1 / 2 + t * Complex.I) := by
        apply Complex.ext <;> simp <;> norm_num
      rw [hc, Complex.Gamma_conj, Complex.mul_conj] at h
      have hs : Complex.sin ((Real.pi:ℂ) * (1 / 2 + t * Complex.I)) = ((Real.cosh (Real.pi * t) : ℝ) : ℂ) := by
        rw [show (Real.pi:ℂ) * (1 / 2 + t * Complex.I) = ((Real.pi * t : ℝ) : ℂ) * Complex.I + Real.pi / 2 by push_cast; ring, Complex.sin_add_pi_div_two, Complex.cos_mul_I]
        push_cast; rfl
      rw [hs] at h
      exact_mod_cast h
- id: legendre_duplication_formula
  kind: named
  level: 3
  topic: 特殊関数・ルジャンドルの倍数公式
  statement: ルジャンドルの倍数公式。実数$s>0$について$\Gamma(s)\Gamma\left(s+\frac{1}{2}\right)=2^{1-2s}\sqrt{\pi}\,\Gamma(2s)$である。
  statement_en: Legendre duplication formula. For a real number s > 0, Γ(s) Γ(s + 1/2) = 2^(1-2s) √π Γ(2s).
  assumptions:
  - $s>0$
  quantifiers:
  - 任意の実数$s$
  conclusion: $\Gamma(s)\Gamma\left(s+\frac{1}{2}\right)=2^{1-2s}\sqrt{\pi}\,\Gamma(2s)$である。
  answer: |
    $s>0$とする。ボーア＝モレルップの定理を
    $f(x)=\frac{2^{x-1}}{\sqrt{\pi}}\Gamma\left(\frac{x}{2}\right)\Gamma\left(\frac{x+1}{2}\right)\quad(x>0)$
    に用いる。$f>0$である。$\Gamma(1/2)=\sqrt{\pi}$より$f(1)=\frac{1}{\sqrt{\pi}}\Gamma(1/2)\Gamma(1)=1$である。漸化式から
    $f(x+1)=\frac{2^{x}}{\sqrt{\pi}}\Gamma\left(\frac{x+1}{2}\right)\Gamma\left(\frac{x}{2}+1\right)=\frac{2^{x}}{\sqrt{\pi}}\Gamma\left(\frac{x+1}{2}\right)\cdot\frac{x}{2}\Gamma\left(\frac{x}{2}\right)=xf(x)$
    である。また$\log f(x)=(x-1)\log 2-\log\sqrt{\pi}+\log\Gamma\left(\frac{x}{2}\right)+\log\Gamma\left(\frac{x+1}{2}\right)$である。$\log\Gamma$は凸で、$x\mapsto\frac{x}{2}$と$x\mapsto\frac{x+1}{2}$は1次式なので、$\log f$は凸である。

    よって$(0,\infty)$で$f=\Gamma$である。$x=2s$とすると$\Gamma(2s)=\frac{2^{2s-1}}{\sqrt{\pi}}\Gamma(s)\Gamma\left(s+\frac{1}{2}\right)$であり、これを変形して主張を得る。
  strategy: Check that 2^(x-1) Γ(x/2) Γ((x+1)/2) / √π satisfies the hypotheses of the Bohr–Mollerup theorem.
  sketch:
  - 'setup: Define f(x) = 2^(x-1) Γ(x/2) Γ((x+1)/2) / √π for x > 0.'
  - 'derive: Γ(1/2) = √π gives f(1) = 1.'
  - 'derive: The recurrence for Γ gives f(x+1) = x f(x).'
  - 'derive: log f is convex as a sum of an affine function and convex functions of affine functions.'
  - 'apply_theorem: The Bohr–Mollerup theorem gives f = Γ.'
  - 'conclude: Putting x = 2s gives the formula.'
  openmath: (forall (s) (-> (> s 0) (= (* (gamma_fn s) (gamma_fn (+ s (/ 1 2)))) (* (^ 2 (- 1 (* 2 s))) (* (root pi 2) (gamma_fn (* 2 s)))))))
  hard_negative:
    statement: 実数$s>0$について$\Gamma(s)\Gamma\left(s+\frac{1}{2}\right)=\sqrt{\pi}\,\Gamma(2s)$である。
    reason: $s=1$とすると左辺は$\Gamma(3/2)=\frac{\sqrt{\pi}}{2}$であるが、右辺は$\sqrt{\pi}\,\Gamma(2)=\sqrt{\pi}$である。係数$2^{1-2s}$が必要である。
  target: |
    ∀ s : ℝ, 0 < s → Real.Gamma s * Real.Gamma (s + 1 / 2) = 2 ^ (1 - 2 * s) * Real.sqrt Real.pi * Real.Gamma (2 * s)
  proof: |
    by
      intro s _
      have h := Real.Gamma_mul_Gamma_add_half s
      rw [h]
      ring
- id: gamma_monotonicity_and_minimum
  kind: gap
  level: 3
  topic: 特殊関数・ガンマ関数の増減と最小値
  statement: $\Gamma$は$(0,1]$で狭義単調減少、$[2,\infty)$で狭義単調増加であり、$(0,\infty)$での最小値を区間$(1,2)$の点でとる。
  statement_en: Γ is strictly decreasing on (0, 1] and strictly increasing on [2, ∞), and it attains its minimum over (0, ∞) at a point of the interval (1, 2).
  assumptions:
  - なし
  quantifiers:
  - なし
  conclusion: $\Gamma$は$(0,1]$で狭義単調減少、$[2,\infty)$で狭義単調増加であり、ある$x\in(1,2)$で$(0,\infty)$上の最小値をとる。
  answer: |
    まず$\Gamma$が$(0,\infty)$で狭義凸であることを示す。$s\neq t$を正の実数、$a,b>0$、$a+b=1$とする。$x>0$、$x\neq 1$のとき、$u\mapsto x^{u}$は狭義凸なので$x^{as+bt-1}<ax^{s-1}+bx^{t-1}$である。両辺に$e^{-x}$を掛けて積分する。被積分関数は連続で、$x\neq 1$で差が正なので、$\Gamma(as+bt)<a\Gamma(s)+b\Gamma(t)$を得る。狭義凸関数は開区間で連続である。

    $\Gamma(1)=\Gamma(2)=1$である。狭義凸関数の弦の傾きは右の区間ほど大きいので、$0<s<t\leq 1$では$\frac{\Gamma(t)-\Gamma(s)}{t-s}<\frac{\Gamma(2)-\Gamma(1)}{2-1}=0$である。よって$\Gamma$は$(0,1]$で狭義単調減少である。同様に$2\leq s<t$では弦の傾きが$0$より大きいので、$\Gamma$は$[2,\infty)$で狭義単調増加である。

    $\Gamma$は$[1,2]$で連続なので最小値をとる点$x$がある。$\Gamma\left(\frac{3}{2}\right)<\frac{1}{2}\left(\Gamma(1)+\Gamma(2)\right)=1$なので$\Gamma(x)<1$であり、$x\in(1,2)$である。$s\in(0,1]$では$\Gamma(s)\geq\Gamma(1)=1>\Gamma(x)$、$s\in[2,\infty)$でも$\Gamma(s)\geq\Gamma(2)=1>\Gamma(x)$である。よって$x$は$(0,\infty)$全体での最小点である。
  strategy: Use the strict convexity of Γ together with Γ(1) = Γ(2) = 1.
  sketch:
  - 'setup: Pointwise strict convexity of u ↦ x^u for x ≠ 1 gives strict convexity of Γ after integrating.'
  - 'derive: Chord slopes increase, and the chord over [1, 2] has slope 0.'
  - 'derive: So Γ is strictly decreasing on (0, 1] and strictly increasing on [2, ∞).'
  - 'derive: Γ has a minimum on [1, 2], with value below 1 because Γ(3/2) < 1, so the minimizer lies in (1, 2).'
  - 'conclude: Outside [1, 2] the values are at least 1, so this point is the global minimizer.'
  openmath: (and (forall (s t) (-> (and (> s 0) (< s t) (<= t 1)) (> (gamma_fn s) (gamma_fn t)))) (forall (s t) (-> (and (>= s 2) (< s t)) (< (gamma_fn s) (gamma_fn t)))) (exists (x) (and (in x (open_interval 1 2)) (forall (s) (-> (> s 0) (<= (gamma_fn x) (gamma_fn s)))))))
  hard_negative:
    statement: $\Gamma$は$(0,\infty)$で狭義単調減少である。
    reason: $\Gamma(2)=1$、$\Gamma(3)=2$なので減少していない。
  target: |
    StrictAntiOn Real.Gamma (Set.Ioc 0 1) ∧ StrictMonoOn Real.Gamma (Set.Ici 2) ∧ ∃ x ∈ Set.Ioo (1:ℝ) 2, IsMinOn Real.Gamma (Set.Ioi 0) x
  proof: |
    by
      exact ⟨Real.Gamma_strictAntiOn_Ioc, Real.Gamma_strictMonoOn_Ici, Real.exists_isMinOn_Gamma_Ioi⟩
- id: gamma_scaled_exponential_integral
  kind: gap
  level: 2
  topic: 特殊関数・ガンマ関数で表す積分
  statement: 実数$a,r>0$について$\int_0^\infty t^{a-1}e^{-rt}\,dt=r^{-a}\Gamma(a)$である。
  statement_en: For real numbers a, r > 0, the integral of t^(a-1) e^(-rt) over (0, ∞) equals r^(-a) Γ(a).
  assumptions:
  - $a>0$
  - $r>0$
  quantifiers:
  - 任意の実数$a,r$
  conclusion: $\int_0^\infty t^{a-1}e^{-rt}\,dt=r^{-a}\Gamma(a)$である。
  answer: |
    $a,r>0$を実数とする。$t=\frac{u}{r}$と置換すると$dt=\frac{du}{r}$であり、$t$が$(0,\infty)$を動くとき$u$も$(0,\infty)$を動く。よって
    $\int_0^\infty t^{a-1}e^{-rt}\,dt=\int_0^\infty\left(\frac{u}{r}\right)^{a-1}e^{-u}\frac{du}{r}=r^{-a}\int_0^\infty u^{a-1}e^{-u}\,du=r^{-a}\Gamma(a)$
    である。
  strategy: Substitute t = u/r.
  sketch:
  - 'setup: Put t = u/r, so dt = du/r.'
  - 'derive: The powers of r combine to r^(-a).'
  - 'conclude: The remaining integral is Γ(a).'
  openmath: (forall (a r) (-> (and (> a 0) (> r 0)) (= (integral_ioi 0 (lambda (t) (* (^ t (- a 1)) (exp (neg (* r t)))))) (* (^ r (neg a)) (gamma_fn a)))))
  hard_negative:
    statement: 実数$a,r>0$について$\int_0^\infty t^{a-1}e^{-rt}\,dt=r^{a}\Gamma(a)$である。
    reason: $a=1$、$r=2$とすると左辺は$\frac{1}{2}$であるが、右辺は$2$である。
  target: |
    ∀ a r : ℝ, 0 < a → 0 < r → ∫ t in Set.Ioi (0:ℝ), t ^ (a - 1) * Real.exp (-(r * t)) = (1 / r) ^ a * Real.Gamma a
  proof: |
    by
      intro a r ha hr
      exact Real.integral_rpow_mul_exp_neg_mul_Ioi ha hr
- id: gamma_power_exponential_integral
  kind: gap
  level: 3
  topic: 特殊関数・ガンマ関数で表す積分
  statement: 実数$p>0$、$q>-1$、$b>0$について$\int_0^\infty x^{q}e^{-bx^{p}}\,dx=\dfrac{1}{p}\,b^{-(q+1)/p}\,\Gamma\left(\dfrac{q+1}{p}\right)$である。$p=2$のときガウス型積分の一般のモーメントを与える。
  statement_en: For real numbers p > 0, q > -1 and b > 0, the integral of x^q e^(-b x^p) over (0, ∞) equals (1/p) b^(-(q+1)/p) Γ((q+1)/p). The case p = 2 gives general moments of Gaussian integrals.
  assumptions:
  - $p>0$
  - $q>-1$
  - $b>0$
  quantifiers:
  - 任意の実数$p,q,b$
  conclusion: $\int_0^\infty x^{q}e^{-bx^{p}}\,dx=\dfrac{1}{p}\,b^{-(q+1)/p}\,\Gamma\left(\dfrac{q+1}{p}\right)$である。
  answer: |
    $p>0$、$q>-1$、$b>0$とする。$t=bx^{p}$と置換する。$x=(t/b)^{1/p}$であり、$t$は$(0,\infty)$を単調に動く。$dx=\frac{1}{p}b^{-1/p}t^{1/p-1}\,dt$、$x^{q}=b^{-q/p}t^{q/p}$なので
    $\int_0^\infty x^{q}e^{-bx^{p}}\,dx=\frac{1}{p}b^{-(q+1)/p}\int_0^\infty t^{(q+1)/p-1}e^{-t}\,dt$
    である。$q>-1$、$p>0$より$\frac{q+1}{p}>0$なので、右辺の積分は収束して$\Gamma\left(\frac{q+1}{p}\right)$に等しい。
  strategy: Substitute t = b x^p and recognize the Gamma integral.
  sketch:
  - 'setup: Put t = b x^p, a monotone change of variable on (0, ∞).'
  - 'derive: Then dx = (1/p) b^(-1/p) t^(1/p-1) dt and x^q = b^(-q/p) t^(q/p).'
  - 'derive: The integrand becomes t^((q+1)/p - 1) e^(-t) times a constant.'
  - 'conclude: Since (q+1)/p > 0, the integral equals Γ((q+1)/p).'
  openmath: (forall (p q b) (-> (and (> p 0) (> q (neg 1)) (> b 0)) (= (integral_ioi 0 (lambda (x) (* (^ x q) (exp (neg (* b (^ x p))))))) (* (^ b (/ (neg (+ q 1)) p)) (* (/ 1 p) (gamma_fn (/ (+ q 1) p)))))))
  hard_negative:
    statement: 実数$p>0$、$b>0$について、$q>-1$を仮定しなくても$\int_0^\infty x^{q}e^{-bx^{p}}\,dx$は収束する。
    reason: $q=-1$とすると$x\to 0$で被積分関数は$x^{-1}$と同程度であり、積分は発散する。
  target: |
    ∀ p q b : ℝ, 0 < p → -1 < q → 0 < b → ∫ x in Set.Ioi (0:ℝ), x ^ q * Real.exp (-b * x ^ p) = b ^ (-(q + 1) / p) * (1 / p) * Real.Gamma ((q + 1) / p)
  proof: |
    by
      intro p q b hp hq hb
      exact integral_rpow_mul_exp_neg_mul_rpow hp hq hb
- id: gamma_residue_at_zero
  kind: gap
  level: 3
  topic: 特殊関数・原点でのガンマ関数の挙動
  statement: 複素数$s\neq 0$が$0$に近づくとき、$s\,\Gamma(s)\to 1$である。
  statement_en: As a complex number s ≠ 0 tends to 0, s Γ(s) tends to 1.
  assumptions:
  - $s\in\mathbb{C}$、$s\neq 0$
  quantifiers:
  - $0$に近づく任意の複素数$s\neq 0$
  conclusion: $s\to 0$で$s\,\Gamma(s)\to 1$である。
  answer: |
    $\Gamma$は$\mathrm{Re}\,s>0$で正則なので、$s=1$で連続である。$0$の近くの$s\neq 0$について、漸化式から$s\,\Gamma(s)=\Gamma(s+1)$である。$s\to 0$で$s+1\to 1$なので、$\Gamma(s+1)\to\Gamma(1)=1$である。
  strategy: Rewrite s Γ(s) as Γ(s+1) and use continuity at 1.
  sketch:
  - 'setup: For s ≠ 0 the recurrence gives s Γ(s) = Γ(s+1).'
  - 'apply_theorem: Γ is holomorphic on Re s > 0, hence continuous at 1.'
  - 'conclude: So s Γ(s) tends to Γ(1) = 1.'
  openmath: (fn_limit_at (lambda (s) (* s (complex_gamma_fn s))) 0 1)
  hard_negative:
    statement: 複素数$s\neq 0$が$0$に近づくとき、$\Gamma(s)\to 1$である。
    reason: $s\Gamma(s)\to 1$なので$|\Gamma(s)|=\frac{|s\Gamma(s)|}{|s|}\to\infty$であり、$\Gamma(s)$は$s=0$に極をもつ。
  target: |
    Filter.Tendsto (fun z : ℂ => z * Complex.Gamma z) (nhdsWithin 0 {0}ᶜ) (nhds 1)
  proof: |
    by
      exact Complex.tendsto_self_mul_Gamma_nhds_zero
- id: gamma_nonvanishing
  kind: gap
  level: 3
  topic: 特殊関数・ガンマ関数の零点
  statement: 複素数$s$が$0$以下の整数でないとき、$\Gamma(s)\neq 0$である。
  statement_en: If a complex number s is not a nonpositive integer, then Γ(s) ≠ 0.
  assumptions:
  - $s\in\mathbb{C}$は$0$以下の整数でない
  quantifiers:
  - 任意の複素数$s$
  conclusion: $\Gamma(s)\neq 0$である。
  answer: |
    $s$を$0$以下の整数でない複素数とする。

    $s$が正の整数のとき、$\Gamma(s)=(s-1)!\neq 0$である。

    $s$が整数でないとき、$1-s$も整数でないので、$\Gamma(1-s)$は有限の値をもつ。相補公式から$\Gamma(s)\Gamma(1-s)=\frac{\pi}{\sin\pi s}$である。右辺は$0$でないので、$\Gamma(s)\neq 0$である。
  strategy: Separate positive integers from non-integers and use the reflection formula for the latter.
  sketch:
  - 'case_split: Either s is a positive integer or s is not an integer.'
  - 'derive: At a positive integer, Γ(s) = (s-1)! is nonzero.'
  - 'apply_theorem: For non-integer s, the reflection formula gives Γ(s) Γ(1-s) = π / sin(πs), which is nonzero.'
  - 'conclude: Hence Γ(s) ≠ 0.'
  openmath: (forall (s) (-> (and (in s C) (forall (m) (-> (in m N) (!= s (neg m))))) (!= (complex_gamma_fn s) 0)))
  hard_negative:
    statement: $\Gamma$は$0$以下の整数で値$0$をとる。
    reason: $0$以下の整数は$\Gamma$の極である。たとえば$s\to 0$で$s\Gamma(s)\to 1$なので$|\Gamma(s)|\to\infty$である。
  target: |
    ∀ s : ℂ, (∀ m : ℕ, s ≠ -(m : ℂ)) → Complex.Gamma s ≠ 0
  proof: |
    by
      intro s hs
      exact Complex.Gamma_ne_zero hs
- id: reciprocal_gamma_entire
  kind: gap
  level: 3
  topic: 特殊関数・ガンマ関数の逆数
  statement: $\dfrac{1}{\Gamma}$は、$0$以下の整数$-m$での値を$0$と定めると、$\mathbb{C}$全体で正則である。
  statement_en: The reciprocal 1/Γ, with value 0 at each nonpositive integer -m, is holomorphic on the whole complex plane.
  assumptions:
  - $s=-m$（$m$は非負整数）での値を$0$と定める
  quantifiers:
  - なし
  conclusion: $\dfrac{1}{\Gamma}$は$\mathbb{C}$全体で正則である。
  answer: |
    $0$以下の整数でない$s$では$h(s)=\frac{1}{\Gamma(s)}$とし、非負整数$m$について$h(-m)=0$とする。$0$以下の整数以外の点で$\Gamma$は$0$にならないので、この定義は意味をもつ。

    $\Gamma$は$\mathrm{Re}\,s>0$で正則で$0$にならないので、$h$は$\mathrm{Re}\,s>0$で正則である。

    すべての$s\in\mathbb{C}$について$h(s)=s\,h(s+1)$が成り立つ。$s$が$0$以下の整数でなければ、これは$\Gamma(s+1)=s\Gamma(s)$の逆数である。$s=0$では両辺とも$0$である。$s=-m$（$m\geq 1$）では$s+1$も$0$以下の整数なので、両辺とも$0$である。

    $h$が$\mathrm{Re}\,s>-k$で正則であると仮定する（$k$は非負整数）。$\mathrm{Re}\,s>-k-1$では$\mathrm{Re}(s+1)>-k$なので、$s\mapsto s\,h(s+1)$はそこで正則であり、これは$h$に等しい。帰納法により$h$は$\mathbb{C}$全体で正則である。
  strategy: Extend holomorphy from the right half plane to the left using h(s) = s h(s+1).
  sketch:
  - 'setup: Define h = 1/Γ away from the poles and h(-m) = 0.'
  - 'derive: h is holomorphic on Re s > 0 because Γ is holomorphic and nonvanishing there.'
  - 'derive: The recurrence gives h(s) = s h(s+1) for every complex s.'
  - 'induction: If h is holomorphic on Re s > -k, this identity makes it holomorphic on Re s > -k-1.'
  - 'conclude: Hence h is entire.'
  openmath: (holomorphic_fn_on (lambda (s) (/ 1 (complex_gamma_fn s))) C)
  hard_negative:
    statement: $\Gamma$自身も、$0$以下の整数での値を適当に定めれば$\mathbb{C}$全体で正則になる。
    reason: $s\to 0$で$s\Gamma(s)\to 1$なので$|\Gamma(s)|\to\infty$であり、値をどう定めても$s=0$で連続にならない。
  target: |
    Differentiable ℂ (fun s : ℂ => (Complex.Gamma s)⁻¹)
  proof: |
    by
      exact Complex.differentiable_one_div_Gamma
- id: gamma_derivative_at_positive_integers
  kind: gap
  level: 3
  topic: 特殊関数・ガンマ関数の整数点での導関数
  statement: 非負整数$n$について$\Gamma'(n+1)=n!\left(-\gamma+\sum_{k=1}^{n}\frac{1}{k}\right)$である。ここで$\gamma=\lim_{m\to\infty}\left(\sum_{k=1}^{m}\frac{1}{k}-\log m\right)$はオイラーの定数である。特に$\Gamma'(1)=-\gamma$である。
  statement_en: For a nonnegative integer n, Γ'(n+1) = n! (-γ + Σ_{k=1}^{n} 1/k), where γ is the limit of Σ_{k=1}^{m} 1/k - log m as m → ∞. In particular Γ'(1) = -γ.
  assumptions:
  - $n$は非負整数
  - $\gamma=\lim_{m\to\infty}\left(\sum_{k=1}^{m}\frac{1}{k}-\log m\right)$
  quantifiers:
  - 任意の非負整数$n$
  conclusion: $\Gamma$は$n+1$で微分可能で、$\Gamma'(n+1)=n!\left(-\gamma+\sum_{k=1}^{n}\frac{1}{k}\right)$である。
  answer: |
    $\Gamma$は$(0,\infty)$で微分可能で正である。$f=\log\Gamma$とおき、$H_m=\sum_{k=1}^{m}\frac{1}{k}$とする。$f$は凸である。$\Gamma(s+1)=s\Gamma(s)$の対数をとると$f(s+1)=f(s)+\log s$であり、微分して$f'(s+1)=f'(s)+\frac{1}{s}$を得る。よって$f'(m+1)=f'(1)+H_m$である。

    $m\geq 1$とする。$f$は凸なので、$m+1$での微分係数は左右の弦の傾きの間にある。$f(m+1)-f(m)=\log m$、$f(m+2)-f(m+1)=\log(m+1)$なので
    $\log m\leq f'(1)+H_m\leq\log(m+1)$
    である。これは$-(H_m-\log m)\leq f'(1)\leq-(H_m-\log m)+\log\left(1+\frac{1}{m}\right)$と書ける。$m\to\infty$とすると$f'(1)=-\gamma$である。

    したがって$f'(n+1)=-\gamma+H_n$であり、$\Gamma'(n+1)=\Gamma(n+1)f'(n+1)=n!\,(-\gamma+H_n)$である。
  strategy: Trap the derivative of log Γ at integers between chord slopes of the convex function log Γ.
  sketch:
  - 'setup: Let f = log Γ, which is convex and differentiable on (0, ∞).'
  - 'derive: Differentiating f(s+1) = f(s) + log s gives f''(m+1) = f''(1) + H_m.'
  - 'derive: Convexity gives log m ≤ f''(1) + H_m ≤ log(m+1).'
  - 'derive: Letting m → ∞ gives f''(1) = -γ.'
  - 'conclude: Then Γ''(n+1) = Γ(n+1) f''(n+1) = n! (-γ + H_n).'
  openmath: (forall (n) (-> (in n N) (has_deriv_at (lambda (s) (gamma_fn s)) (* (factorial n) (+ (neg euler_gamma_constant) (range_sum n (lambda (k) (/ 1 (+ k 1)))))) (+ n 1))))
  hard_negative:
    statement: $\Gamma'(1)=\gamma$である。
    reason: $\Gamma$は$(0,1]$で狭義単調減少なので$\Gamma'(1)\leq 0$である。$\gamma>0$なので$\Gamma'(1)=\gamma$は成り立たず、正しい値は$-\gamma$である。
  target: |
    ∀ n : ℕ, HasDerivAt Real.Gamma ((n.factorial : ℝ) * (-Real.eulerMascheroniConstant + ∑ k ∈ Finset.range n, 1 / ((k : ℝ) + 1))) ((n : ℝ) + 1)
  proof: |
    by
      intro n
      have h := Real.hasDerivAt_Gamma_nat n
      have e : ((harmonic n : ℚ) : ℝ) = ∑ k ∈ Finset.range n, 1 / ((k : ℝ) + 1) := by
        simp [harmonic]
      rw [e] at h
      exact h
- id: euclidean_ball_volume_gamma
  kind: textbook
  level: 3
  topic: 特殊関数・球の体積
  statement: $n$を正の整数、$r>0$とする。$\mathbb{R}^n$の半径$r$の開球の体積は$\dfrac{\pi^{n/2}}{\Gamma\left(\frac{n}{2}+1\right)}r^n$である。
  statement_en: Let n be a positive integer and r > 0. The volume of an open ball of radius r in ℝ^n is π^(n/2) r^n / Γ(n/2 + 1).
  assumptions:
  - $n\geq 1$
  - $r>0$
  quantifiers:
  - 任意の正の整数$n$
  - 任意の$x\in\mathbb{R}^n$
  - 任意の$r>0$
  conclusion: $\mathbb{R}^n$の中心$x$、半径$r$の開球の体積は$\dfrac{\pi^{n/2}}{\Gamma\left(\frac{n}{2}+1\right)}r^n$である。
  answer: |
    $n\geq 1$とし、$V$を$\mathbb{R}^n$の単位開球の体積とする。平行移動と相似拡大により、半径$r$の開球の体積は$Vr^n$である。

    ガウス積分を$n$個掛けると$\int_{\mathbb{R}^n}e^{-|x|^2}\,dx=\pi^{n/2}$である。一方$e^{-|x|^2}=\int_{|x|^2}^\infty e^{-t}\,dt$なので、非負関数のフビニの定理より
    $\pi^{n/2}=\int_0^\infty e^{-t}\,\mathrm{vol}\left(\{x:|x|^2<t\}\right)dt=\int_0^\infty e^{-t}\,Vt^{n/2}\,dt=V\,\Gamma\left(\frac{n}{2}+1\right)$
    である。よって$V=\frac{\pi^{n/2}}{\Gamma\left(\frac{n}{2}+1\right)}$である。
  strategy: Evaluate the n-dimensional Gaussian integral in two ways using Tonelli's theorem.
  sketch:
  - 'setup: Let V be the volume of the unit ball; scaling gives volume V r^n for radius r.'
  - 'derive: The product of Gaussian integrals gives the integral of e^(-|x|²) over ℝ^n as π^(n/2).'
  - 'derive: Writing e^(-|x|²) as the integral of e^(-t) over t > |x|² and using Tonelli gives V times the integral of t^(n/2) e^(-t).'
  - 'conclude: This equals V Γ(n/2 + 1), so V = π^(n/2) / Γ(n/2 + 1).'
  openmath: (forall (n r) (-> (and (in n N) (>= n 1) (> r 0)) (= (euclidean_ball_volume n r) (/ (* (^ (root pi 2) n) (^ r n)) (gamma_fn (+ (/ n 2) 1))))))
  hard_negative:
    statement: $\mathbb{R}^n$の半径$r$の開球の体積は$\dfrac{\pi^{n/2}}{\Gamma\left(\frac{n}{2}\right)}r^n$である。
    reason: $n=1$、$r=1$とすると開区間$(-1,1)$の長さは$2$であるが、この式の値は$\frac{\sqrt{\pi}}{\Gamma(1/2)}=1$である。
  target: |
    ∀ (ι : Type*) [Nonempty ι] [Fintype ι] (x : EuclideanSpace ℝ ι) (r : ℝ), 0 < r → MeasureTheory.volume (Metric.ball x r) = ENNReal.ofReal (r ^ Fintype.card ι * (Real.sqrt Real.pi ^ Fintype.card ι / Real.Gamma ((Fintype.card ι : ℝ) / 2 + 1)))
  proof: |
    by
      intro ι _ _ x r hr
      rw [EuclideanSpace.volume_ball ι x r, ENNReal.ofReal_mul (by positivity), ENNReal.ofReal_pow hr.le]
- id: beta_gamma_identity_real
  kind: textbook
  level: 3
  topic: 特殊関数・ベータ関数とガンマ関数
  statement: 実数$u,v>0$について、$x^{u-1}(1-x)^{v-1}$は$(0,1)$で可積分であり、$B(u,v)=\int_0^1x^{u-1}(1-x)^{v-1}\,dx=\dfrac{\Gamma(u)\Gamma(v)}{\Gamma(u+v)}$である。
  statement_en: For real numbers u, v > 0, the function x^(u-1) (1-x)^(v-1) is integrable on (0, 1), and B(u,v), its integral over (0, 1), equals Γ(u) Γ(v) / Γ(u+v).
  assumptions:
  - $u>0$
  - $v>0$
  quantifiers:
  - 任意の実数$u,v$
  conclusion: $x^{u-1}(1-x)^{v-1}$は$(0,1)$で可積分であり、その積分は$\dfrac{\Gamma(u)\Gamma(v)}{\Gamma(u+v)}$に等しい。
  answer: |
    $u,v>0$を実数とする。被積分関数はすべて非負なので、トネリの定理により次の変形は値が$+\infty$の場合も込めて正しい。
    $\Gamma(u)\Gamma(v)=\int_0^\infty\int_0^\infty e^{-(x+y)}x^{u-1}y^{v-1}\,dx\,dy$
    $(0,\infty)^2$上で変数変換$x=rt$、$y=r(1-t)$（$r>0$、$0<t<1$）を行う。これは全単射で、ヤコビアンの絶対値は$r$である。$x+y=r$なので
    $\Gamma(u)\Gamma(v)=\int_0^\infty e^{-r}r^{u+v-1}\,dr\int_0^1t^{u-1}(1-t)^{v-1}\,dt=\Gamma(u+v)\int_0^1t^{u-1}(1-t)^{v-1}\,dt$
    である。$\Gamma(u)\Gamma(v)$は有限で$\Gamma(u+v)>0$なので、最後の積分は有限である。よって被積分関数は可積分であり、$\Gamma(u+v)$で割れば等式を得る。
  strategy: Write Γ(u) Γ(v) as a double integral and change variables to x = rt, y = r(1-t).
  sketch:
  - 'setup: Express Γ(u) Γ(v) as a double integral of a nonnegative function over the quadrant.'
  - 'translate: Change variables by x = rt and y = r(1-t), with Jacobian r.'
  - 'apply_theorem: Tonelli''s theorem separates the integrals in r and t.'
  - 'derive: The factor in r equals Γ(u+v).'
  - 'conclude: Finiteness of Γ(u) Γ(v) gives integrability, and dividing gives the identity.'
  openmath: (forall (u v) (-> (and (> u 0) (> v 0)) (and (interval_integrable (lambda (x) (* (^ x (- u 1)) (^ (- 1 x) (- v 1)))) 0 1) (= (interval_integral 0 1 (lambda (x) (* (^ x (- u 1)) (^ (- 1 x) (- v 1))))) (/ (* (gamma_fn u) (gamma_fn v)) (gamma_fn (+ u v)))))))
  hard_negative:
    statement: 実数$u,v>0$について$B(u,v)=\dfrac{\Gamma(u)\Gamma(v)}{\Gamma(u+v+1)}$である。
    reason: $u=v=1$とすると$B(1,1)=\int_0^1dx=1$であるが、この式の右辺は$\frac{1}{\Gamma(3)}=\frac{1}{2}$である。
  target: |
    ∀ u v : ℝ, 0 < u → 0 < v → IntervalIntegrable (fun x : ℝ => x ^ (u - 1) * (1 - x) ^ (v - 1)) MeasureTheory.volume 0 1 ∧ ∫ x in (0:ℝ)..1, x ^ (u - 1) * (1 - x) ^ (v - 1) = Real.Gamma u * Real.Gamma v / Real.Gamma (u + v)
  proof: |
    by
      intro u v hu hv
      have hconv := Complex.betaIntegral_convergent (u := (u:ℂ)) (v := (v:ℂ)) (by simpa using hu) (by simpa using hv)
      have hcongr : ∀ x ∈ Set.uIoc (0:ℝ) 1, ((x:ℂ) ^ ((u:ℂ) - 1) * (1 - (x:ℂ)) ^ ((v:ℂ) - 1)) = (((x ^ (u - 1) * (1 - x) ^ (v - 1) : ℝ)) : ℂ) := by
        intro x hx
        rw [Set.uIoc_of_le zero_le_one] at hx
        have hx0 : 0 ≤ x := hx.1.le
        have hx1 : 0 ≤ 1 - x := by linarith [hx.2]
        push_cast
        rw [Complex.ofReal_cpow hx0, Complex.ofReal_cpow hx1]
