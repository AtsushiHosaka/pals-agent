  kind: gap
  level: 3
  topic: 離散フーリエ変換・平行移動
  statement: $N$を正の整数とし、$\Phi:\mathbb{Z}/N\mathbb{Z}\to\mathbb{C}$の離散フーリエ変換を$\hat{\Phi}(k)=\sum_{j}e^{-2\pi ijk/N}\Phi(j)$とする。$a\in\mathbb{Z}/N\mathbb{Z}$について$\Psi(j)=\Phi(j+a)$とおくと$\hat{\Psi}(k)=e^{2\pi iak/N}\hat{\Phi}(k)$である。
  statement_en: Let N be a positive integer and Φ^(k) = Σ_j e^(-2πijk/N) Φ(j) the discrete Fourier transform on ℤ/Nℤ. For a in ℤ/Nℤ and Ψ(j) = Φ(j+a), one has Ψ^(k) = e^(2πiak/N) Φ^(k).
  assumptions:
  - $N\geq 1$
  - $\Phi:\mathbb{Z}/N\mathbb{Z}\to\mathbb{C}$
  - $a\in\mathbb{Z}/N\mathbb{Z}$
  quantifiers:
  - 任意の正の整数$N$
  - 任意の$\Phi$
  - 任意の$a,k$
  conclusion: $\hat{\Psi}(k)=e^{2\pi iak/N}\hat{\Phi}(k)$である。
  answer: |
    $N\geq 1$、$\Phi:\mathbb{Z}/N\mathbb{Z}\to\mathbb{C}$、$a,k\in\mathbb{Z}/N\mathbb{Z}$とする。$j\mapsto j+a$は全単射なので、$l=j+a$と置き換えると
    $\hat{\Psi}(k)=\sum_{j}e^{-2\pi ijk/N}\Phi(j+a)=\sum_{l}e^{-2\pi i(l-a)k/N}\Phi(l)=e^{2\pi iak/N}\hat{\Phi}(k)$
    である。
  strategy: Reindex the sum by l = j + a.
  sketch:
  - 'setup: Write the transform of Ψ as a sum over j.'
  - 'translate: Substitute l = j + a, a bijection of ℤ/Nℤ.'
  - 'conclude: The factor e^(2πiak/N) comes out of the sum.'
  openmath: (forall (M f a k) (-> (and (in M N) (>= M 1) (in a (zmod_ring M)) (in k (zmod_ring M))) (= (zmod_dft_fn M (lambda (j) (fn_value f (+ j a))) k) (* (zmod_std_character M (* a k)) (zmod_dft M f k)))))
  hard_negative:
    statement: 同じ記号で$\hat{\Psi}(k)=\hat{\Phi}(k+a)$である。
    reason: 平行移動は変換側で位相因子になる。$N=2$、$\Phi$を$0$でだけ$1$をとる関数、$a=1$とすると$\hat{\Phi}\equiv 1$である。$\Psi$は$1$でだけ$1$をとるので$\hat{\Psi}(1)=-1$であり、$\hat{\Phi}(1+1)=1$である。
  target: |
    ∀ (N : ℕ) [NeZero N] (Φ : ZMod N → ℂ) (a k : ZMod N), ZMod.dft (fun j => Φ (j + a)) k = ZMod.stdAddChar (a * k) * ZMod.dft Φ k
  proof: |
    by
      intro N _ Φ a k
      simp only [ZMod.dft_apply, smul_eq_mul, Finset.mul_sum]
      rw [← Equiv.sum_comp (Equiv.addRight a) (fun j => ZMod.stdAddChar (a * k) * (ZMod.stdAddChar (-(j * k)) * Φ j))]
      refine Finset.sum_congr rfl (fun j _ => ?_)
      rw [← mul_assoc, ← AddChar.map_add_eq_mul]
      simp only [Equiv.coe_addRight]
      congr 2
      ring
- id: zmod_dft_delta_and_constant
  kind: gap
  level: 3
  topic: 離散フーリエ変換・デルタと定数
  statement: $N$を正の整数とし、$\Phi:\mathbb{Z}/N\mathbb{Z}\to\mathbb{C}$の離散フーリエ変換を$\hat{\Phi}(k)=\sum_{j}e^{-2\pi ijk/N}\Phi(j)$とする。$a$でだけ$1$をとり他で$0$の関数$\delta_a$について$\hat{\delta_a}(k)=e^{-2\pi iak/N}$であり、定数関数$1$の変換は$k=0$で$N$、$k\neq 0$で$0$である。
  statement_en: Let N be a positive integer and Φ^(k) = Σ_j e^(-2πijk/N) Φ(j) the discrete Fourier transform on ℤ/Nℤ. The function δ_a, equal to 1 at a and 0 elsewhere, has transform e^(-2πiak/N), and the constant function 1 has transform N at k = 0 and 0 at k ≠ 0.
  assumptions:
  - $N\geq 1$
  - $a,k\in\mathbb{Z}/N\mathbb{Z}$
  quantifiers:
  - 任意の正の整数$N$
  - 任意の$a,k$
  conclusion: $\hat{\delta_a}(k)=e^{-2\pi iak/N}$であり、定数関数$1$の変換は$k=0$で$N$、$k\neq 0$で$0$である。
  answer: |
    $N\geq 1$、$a,k\in\mathbb{Z}/N\mathbb{Z}$とする。$\hat{\delta_a}(k)$の和では$j=a$の項だけが残るので、値は$e^{-2\pi iak/N}$である。

    定数関数$1$の変換は$\sum_{j}e^{-2\pi ijk/N}$である。$k$の代表を整数にとる。$1$の冪根の指数和により、この和は$N\mid k$すなわち$k=0$のとき$N$であり、それ以外で$0$である。
  strategy: The delta sum has one nonzero term; the constant case is the exponential sum over roots of unity.
  sketch:
  - 'derive: In the transform of δ_a only the term j = a survives.'
  - 'apply_theorem: The sum of e^(-2πijk/N) over j is the exponential sum over roots of unity.'
  - 'conclude: It equals N for k = 0 and 0 otherwise.'
  openmath: (forall (M a k) (-> (and (in M N) (>= M 1) (in a (zmod_ring M)) (in k (zmod_ring M))) (and (= (zmod_dft_fn M (lambda (j) (kronecker_delta j a)) k) (zmod_std_character M (neg (* a k)))) (and (-> (= k 0) (= (zmod_dft_fn M (lambda (j) 1) k) M)) (-> (!= k 0) (= (zmod_dft_fn M (lambda (j) 1) k) 0))))))
  hard_negative:
    statement: 定数関数$1$の変換はすべての$k$で$N$である。
    reason: $N=2$、$k=1$とすると$\sum_{j}e^{-\pi ij}=1-1=0$である。
  target: |
    ∀ (N : ℕ) [NeZero N] (a k : ZMod N), ZMod.dft (fun j => if j = a then (1 : ℂ) else 0) k = ZMod.stdAddChar (-(a * k)) ∧ ZMod.dft (fun _ => (1 : ℂ)) k = if k = 0 then (N : ℂ) else 0
  proof: |
    by
      intro N _ a k
      constructor
      · simp [ZMod.dft_apply]
      · simp only [ZMod.dft_apply, smul_eq_mul, mul_one]
        have e : ∀ j : ZMod N, ZMod.stdAddChar (-(j * k)) = ZMod.stdAddChar (j * (-k)) := by
          intro j; congr 1; ring
        simp only [e]
        rw [AddChar.sum_mulShift (-k) (ZMod.isPrimitive_stdAddChar N)]
        simp [ZMod.card]
- id: basel_problem
  kind: named
  level: 2
  topic: 特殊関数・バーゼル問題
  statement: バーゼル問題。級数$\sum_{n=1}^{\infty}\dfrac{1}{n^2}$は収束し、その和は$\dfrac{\pi^2}{6}$である。
  statement_en: Basel problem. The series Σ_{n≥1} 1/n² converges, and its sum is π²/6.
  assumptions:
  - なし
  quantifiers:
  - なし
  conclusion: $\sum_{n=1}^{\infty}\dfrac{1}{n^2}=\dfrac{\pi^2}{6}$である。
  answer: |
    $m$を正の整数とし、$x_k=\frac{k\pi}{2m+1}$（$1\leq k\leq m$）とおく。$0<x_k<\frac{\pi}{2}$である。

    ド・モアブルの公式より$\sin(2m+1)x$は$(\cos x+i\sin x)^{2m+1}$の虚部である。$\sin(2m+1)x_k=0$であり、$\sin x_k\neq 0$なので、虚部を$\sin^{2m+1}x$で割って
    $\sum_{j=0}^{m}(-1)^j\binom{2m+1}{2j+1}\cot^{2m-2j}x_k=0$
    を得る。よって$\cot^2x_k$は$m$次多項式$P(t)=\sum_{j=0}^{m}(-1)^j\binom{2m+1}{2j+1}t^{m-j}$の根である。$\cot^2$は$\left(0,\frac{\pi}{2}\right)$で狭義単調減少なので、これらは相異なる$m$個の根であり、根はこれで全部である。根と係数の関係より
    $\sum_{k=1}^{m}\cot^2x_k=\frac{\binom{2m+1}{3}}{\binom{2m+1}{1}}=\frac{m(2m-1)}{3}$
    である。

    $0<x<\frac{\pi}{2}$では$\sin x<x<\tan x$なので$\cot^2x<\frac{1}{x^2}<1+\cot^2x$である。$x=x_k$として$k$について足すと
    $\frac{m(2m-1)}{3}<\frac{(2m+1)^2}{\pi^2}\sum_{k=1}^{m}\frac{1}{k^2}<m+\frac{m(2m-1)}{3}$
    である。$\frac{\pi^2}{(2m+1)^2}$を掛けて$m\to\infty$とすると、左端も右端も$\frac{\pi^2}{6}$に収束する。はさみうちにより部分和は$\frac{\pi^2}{6}$に収束する。正項級数なので収束は無条件である。
  strategy: Compute the sum of cot²(kπ/(2m+1)) from de Moivre's formula and squeeze with cot²x < 1/x² < 1 + cot²x.
  sketch:
  - 'setup: Put x_k = kπ/(2m+1) for 1 ≤ k ≤ m.'
  - 'derive: De Moivre''s formula shows the cot²(x_k) are the m roots of an explicit polynomial.'
  - 'derive: Vieta''s formula gives their sum m(2m-1)/3.'
  - 'derive: The bounds sin x < x < tan x give cot²x < 1/x² < 1 + cot²x.'
  - 'conclude: Summing and letting m → ∞ gives π²/6 by the squeeze theorem.'
  openmath: (series_has_sum (lambda (n) (/ 1 (^ (+ n 1) 2))) (/ (^ pi 2) 6))
  hard_negative:
    statement: $\sum_{n=1}^{\infty}\dfrac{1}{n^2}=\dfrac{\pi^2}{3}$である。
    reason: 第1項は$1$で、$n\geq 2$の和は$\sum_{n\geq 2}\frac{1}{n(n-1)}=1$以下なので、全体は$2$以下である。$\frac{\pi^2}{3}\approx 3.29$より小さい。
  target: |
    HasSum (fun n : ℕ => 1 / ((n : ℝ) + 1) ^ 2) (Real.pi ^ 2 / 6)
  proof: |
    by
      have := (hasSum_nat_add_iff' 1).mpr hasSum_zeta_two
      simpa using this
- id: zeta_even_values_bernoulli
  kind: named
  level: 3
  topic: 特殊関数・ゼータ関数の偶数点の値
  statement: 正の整数$k$について、$\sum_{n=1}^{\infty}\dfrac{1}{n^{2k}}=\dfrac{(-1)^{k+1}2^{2k-1}\pi^{2k}B_{2k}}{(2k)!}$である。ここで$B_{2k}$はベルヌーイ数である。級数は収束する。
  statement_en: For a positive integer k, Σ_{n≥1} 1/n^(2k) = (-1)^(k+1) 2^(2k-1) π^(2k) B_(2k) / (2k)!, where B_(2k) is a Bernoulli number. The series converges.
  assumptions:
  - $k\geq 1$
  quantifiers:
  - 任意の正の整数$k$
  conclusion: $\sum_{n=1}^{\infty}\dfrac{1}{n^{2k}}=\dfrac{(-1)^{k+1}2^{2k-1}\pi^{2k}B_{2k}}{(2k)!}$である。
  answer: |
    $k\geq 1$とする。差分公式$B_m(x+1)-B_m(x)=mx^{m-1}$を$m=2k\geq 2$、$x=0$で用いると、ベルヌーイ多項式$B_{2k}(x)$は$B_{2k}(1)=B_{2k}(0)=B_{2k}$を満たす。よって$[0,1)$上の$B_{2k}(x)$を周期$1$に延ばした関数$g$は連続である。

    $n\neq 0$のフーリエ係数は、ベルヌーイ多項式のフーリエ係数の公式（$B_m'=mB_{m-1}$と部分積分による$m$の帰納法で得られる）により$c_n(g)=\int_0^1e^{-2\pi inx}B_{2k}(x)\,dx=-\frac{(2k)!}{(2\pi in)^{2k}}=\frac{(-1)^{k+1}(2k)!}{(2\pi n)^{2k}}$である。また$B_{2k}=\frac{1}{2k+1}B_{2k+1}'$と$B_{2k+1}(1)=B_{2k+1}(0)$より$c_0(g)=\int_0^1B_{2k}(x)\,dx=0$である。$\sum_{n\neq 0}|c_n(g)|<\infty$なので、優級数定理によりフーリエ級数は一様収束し、和$h$は連続である。項別積分より$c_n(h)=c_n(g)$である。連続周期関数はフーリエ係数で決まるので$h=g$である。

    $x=0$での値を比べると
    $B_{2k}=g(0)=2\sum_{n=1}^{\infty}\frac{(-1)^{k+1}(2k)!}{(2\pi n)^{2k}}$
    である。これを整理すると主張を得る。
  strategy: Evaluate at 0 the Fourier series of the periodized Bernoulli polynomial of degree 2k.
  sketch:
  - 'setup: The periodization g of B_(2k)(x) is continuous because B_(2k)(0) = B_(2k)(1).'
  - 'apply_theorem: Its coefficients are c_n = -(2k)! / (2πin)^(2k) for n ≠ 0 and c_0 = 0.'
  - 'derive: These are summable, so the series converges uniformly, and uniqueness of coefficients identifies its sum with g.'
  - 'derive: At x = 0 this gives B_(2k) = 2 Σ_{n≥1} (-1)^(k+1) (2k)! / (2πn)^(2k).'
  - 'conclude: Rearranging gives the formula.'
  openmath: (forall (k) (-> (and (in k N) (>= k 1)) (series_has_sum (lambda (n) (/ 1 (^ (+ n 1) (* 2 k)))) (/ (* (^ (neg 1) (+ k 1)) (* (^ 2 (- (* 2 k) 1)) (* (^ pi (* 2 k)) (bernoulli_number (* 2 k))))) (factorial (* 2 k))))))
  hard_negative:
    statement: 正の整数$k$について$\sum_{n=1}^{\infty}\dfrac{1}{n^{2k}}=\dfrac{2^{2k-1}\pi^{2k}B_{2k}}{(2k)!}$である。
    reason: $k=2$では$B_4=-\frac{1}{30}$なので右辺は負になる。左辺は正なので符号$(-1)^{k+1}$が必要である。
  target: |
    ∀ k : ℕ, k ≠ 0 → HasSum (fun n : ℕ => 1 / ((n : ℝ) + 1) ^ (2 * k)) ((-1 : ℝ) ^ (k + 1) * (2 : ℝ) ^ (2 * k - 1) * Real.pi ^ (2 * k) * (bernoulli (2 * k) : ℝ) / ((2 * k).factorial : ℝ))
  proof: |
    by
      intro k hk
      have h := hasSum_zeta_nat hk
      have := (hasSum_nat_add_iff' 1).mpr h
      simpa [hk] using this
- id: odd_reciprocal_squares_sum
  kind: gap
  level: 2
  topic: 特殊関数・奇数の逆数の2乗の和
  statement: 級数$\sum_{n=0}^{\infty}\dfrac{1}{(2n+1)^2}$は収束し、その和は$\dfrac{\pi^2}{8}$である。
  statement_en: The series Σ_{n≥0} 1/(2n+1)² converges, and its sum is π²/8.
  assumptions:
  - なし
  quantifiers:
  - なし
  conclusion: $\sum_{n=0}^{\infty}\dfrac{1}{(2n+1)^2}=\dfrac{\pi^2}{8}$である。
  answer: |
    $\sum_{m=1}^{\infty}\frac{1}{m^2}=\frac{\pi^2}{6}$（バーゼル問題）を用いる。正項級数なので、$m$の偶奇で分けてよい。偶数$m=2k$の部分は$\sum_{k\geq 1}\frac{1}{4k^2}=\frac{1}{4}\cdot\frac{\pi^2}{6}=\frac{\pi^2}{24}$である。よって奇数の部分は収束し、和は$\frac{\pi^2}{6}-\frac{\pi^2}{24}=\frac{\pi^2}{8}$である。
  strategy: Split the Basel series into even and odd terms.
  sketch:
  - 'apply_theorem: The Basel series has sum π²/6.'
  - 'derive: The even terms contribute (1/4)(π²/6) = π²/24.'
  - 'conclude: The odd terms contribute π²/6 - π²/24 = π²/8.'
  openmath: (series_has_sum (lambda (n) (/ 1 (^ (+ (* 2 n) 1) 2))) (/ (^ pi 2) 8))
  hard_negative:
    statement: $\sum_{n=0}^{\infty}\dfrac{1}{(2n+1)^2}=\dfrac{\pi^2}{12}$である。
    reason: $\frac{\pi^2}{12}\approx 0.82$であるが、第1項だけで$1$である。$\frac{\pi^2}{12}$は交代級数$\sum_{n\geq 1}\frac{(-1)^{n+1}}{n^2}$の値である。
  target: |
    HasSum (fun n : ℕ => (1 : ℝ) / (2 * (n : ℝ) + 1) ^ 2) (Real.pi ^ 2 / 8)
  proof: |
    by
      let f : ℕ → ℝ := fun n => 1 / (n : ℝ) ^ 2
      have h0 : HasSum f (Real.pi ^ 2 / 6) := hasSum_zeta_two
      have hinj : Function.Injective (fun n : ℕ => 2 * n + 1) := fun a b h => by simpa using h
      have hodd : Summable (fun n : ℕ => f (2 * n + 1)) := h0.summable.comp_injective hinj
      have heven : HasSum (fun n : ℕ => f (2 * n)) (Real.pi ^ 2 / 24) := by
        have e1 : (fun n : ℕ => f (2 * n)) = fun n : ℕ => (1 / 4 : ℝ) * f n := by
          funext n; simp only [f]; push_cast; ring
        have e2 : Real.pi ^ 2 / 24 = (1 / 4 : ℝ) * (Real.pi ^ 2 / 6) := by ring
        rw [e1, e2]
        exact h0.mul_left _
      have htot := HasSum.even_add_odd heven hodd.hasSum
      have huniq := htot.unique h0
      have h := hodd.hasSum
      have e : ∑' n : ℕ, f (2 * n + 1) = Real.pi ^ 2 / 8 := by linarith
      rw [e] at h
      have e1 : (fun n : ℕ => (1 : ℝ) / (2 * (n : ℝ) + 1) ^ 2) = fun n : ℕ => f (2 * n + 1) := by
        funext n; simp only [f]; push_cast; ring
      rw [e1]; exact h
- id: cosine_series_of_bernoulli_polynomial
  kind: gap
  level: 3
  topic: 特殊関数・ベルヌーイ多項式の余弦級数
  statement: 正の整数$k$と$x\in[0,1]$について$\sum_{n=1}^{\infty}\dfrac{\cos 2\pi nx}{n^{2k}}=\dfrac{(-1)^{k+1}(2\pi)^{2k}}{2\,(2k)!}B_{2k}(x)$である。ここで$B_{2k}(x)$はベルヌーイ多項式である。級数は収束する。
  statement_en: For a positive integer k and x in [0, 1], Σ_{n≥1} cos(2πnx) / n^(2k) = (-1)^(k+1) (2π)^(2k) B_(2k)(x) / (2 (2k)!), where B_(2k)(x) is a Bernoulli polynomial. The series converges.
  assumptions:
  - $k\geq 1$
  - $x\in[0,1]$
  quantifiers:
  - 任意の正の整数$k$
  - 任意の$x\in[0,1]$
  conclusion: $\sum_{n=1}^{\infty}\dfrac{\cos 2\pi nx}{n^{2k}}=\dfrac{(-1)^{k+1}(2\pi)^{2k}}{2\,(2k)!}B_{2k}(x)$である。
  answer: |
    $k\geq 1$とする。差分公式$B_m(x+1)-B_m(x)=mx^{m-1}$を$m=2k\geq 2$、$x=0$で用いると$B_{2k}(1)=B_{2k}(0)$なので、$[0,1)$上の$B_{2k}$を周期$1$に延ばした関数$g$は連続である。$n\neq 0$のフーリエ係数は、ベルヌーイ多項式のフーリエ係数の公式（$B_m'=mB_{m-1}$と部分積分による$m$の帰納法で得られる）により$c_n(g)=-\frac{(2k)!}{(2\pi in)^{2k}}=\frac{(-1)^{k+1}(2k)!}{(2\pi n)^{2k}}$である。また$B_{2k}=\frac{1}{2k+1}B_{2k+1}'$と$B_{2k+1}(1)=B_{2k+1}(0)$より$c_0(g)=\int_0^1B_{2k}(x)\,dx=0$である。係数は絶対総和可能なので、優級数定理によりフーリエ級数は一様収束し、和$h$は連続である。項別積分より$c_n(h)=c_n(g)$である。連続周期関数はフーリエ係数で決まるので$h=g$である。

    $c_n(g)=c_{-n}(g)$なので、$\pm n$の項をまとめると$c_n(g)\left(e^{2\pi inx}+e^{-2\pi inx}\right)=2c_n(g)\cos 2\pi nx$である。よって$x\in[0,1]$で
    $B_{2k}(x)=\frac{2(-1)^{k+1}(2k)!}{(2\pi)^{2k}}\sum_{n=1}^{\infty}\frac{\cos 2\pi nx}{n^{2k}}$
    である。これを整理して主張を得る。
  strategy: Write the Fourier series of the periodized polynomial and combine the terms for n and -n.
  sketch:
  - 'setup: The periodization of B_(2k) is continuous.'
  - 'apply_theorem: Its Fourier coefficients are c_n = (-1)^(k+1) (2k)! / (2πn)^(2k), which are summable.'
  - 'derive: The series converges uniformly, and uniqueness of coefficients identifies its sum with the periodization.'
  - 'derive: The terms for ±n combine to 2 c_n cos(2πnx).'
  - 'conclude: Solving for the cosine series gives the formula.'
  openmath: (forall (k x) (-> (and (in k N) (>= k 1) (in x (closed_interval 0 1))) (series_has_sum (lambda (n) (* (/ 1 (^ (+ n 1) (* 2 k))) (cos (* 2 (* pi (* (+ n 1) x)))))) (* (/ (* (^ (neg 1) (+ k 1)) (^ (* 2 pi) (* 2 k))) (* 2 (factorial (* 2 k)))) (poly_eval (bernoulli_polynomial (* 2 k)) x)))))
  hard_negative:
    statement: 公式はすべての実数$x$で成り立つ。
    reason: 左辺は周期$1$であるが、右辺の多項式は周期的でない。$k=1$、$x=2$とすると左辺は$\frac{\pi^2}{6}$であり、右辺は$\pi^2B_2(2)=\pi^2\left(4-2+\frac{1}{6}\right)$である。
  target: |
    ∀ k : ℕ, k ≠ 0 → ∀ x ∈ Set.Icc (0:ℝ) 1, HasSum (fun n : ℕ => 1 / ((n : ℝ) + 1) ^ (2 * k) * Real.cos (2 * Real.pi * ((n : ℝ) + 1) * x)) ((-1 : ℝ) ^ (k + 1) * (2 * Real.pi) ^ (2 * k) / 2 / ((2 * k).factorial : ℝ) * bernoulliFun (2 * k) x)
  proof: |
    by
      intro k hk x hx
      have h := hasSum_one_div_nat_pow_mul_cos hk hx
      have := (hasSum_nat_add_iff' 1).mpr h
      simpa [hk, bernoulliFun] using this
- id: bernoulli_polynomial_fourier_coefficient
  kind: gap
  level: 3
  topic: 特殊関数・ベルヌーイ多項式のフーリエ係数
  statement: 正の整数$k$と$0$でない整数$n$について$\int_0^1e^{-2\pi inx}B_k(x)\,dx=-\dfrac{k!}{(2\pi in)^k}$である。ここで$B_k(x)$はベルヌーイ多項式である。
  statement_en: For a positive integer k and a nonzero integer n, the integral of e^(-2πinx) B_k(x) over [0, 1] equals -k! / (2πin)^k, where B_k(x) is a Bernoulli polynomial.
  assumptions:
  - $k\geq 1$
  - $n\neq 0$
  quantifiers:
  - 任意の正の整数$k$
  - $0$でない任意の整数$n$
  conclusion: $\int_0^1e^{-2\pi inx}B_k(x)\,dx=-\dfrac{k!}{(2\pi in)^k}$である。
  answer: |
    $n\neq 0$を整数とし、$A_k=\int_0^1e^{-2\pi inx}B_k(x)\,dx$とおく。$k$に関する帰納法で示す。ベルヌーイ多項式の性質$B_k'=kB_{k-1}$と、$k\neq 1$での$B_k(1)=B_k(0)$を用いる。

    $k=1$では$B_1(x)=x-\frac{1}{2}$である。$\int_0^1e^{-2\pi inx}\,dx=0$なので、部分積分より
    $A_1=\int_0^1xe^{-2\pi inx}\,dx=\left[\frac{xe^{-2\pi inx}}{-2\pi in}\right]_0^1=-\frac{1}{2\pi in}$
    である。

    $k\geq 2$とする。$e^{-2\pi in\cdot 1}=e^{0}=1$と$B_k(1)=B_k(0)$から境界の項が消えるので、部分積分より
    $A_k=\frac{1}{2\pi in}\int_0^1e^{-2\pi inx}B_k'(x)\,dx=\frac{k}{2\pi in}A_{k-1}$
    である。帰納法の仮定から$A_k=\frac{k}{2\pi in}\cdot\left(-\frac{(k-1)!}{(2\pi in)^{k-1}}\right)=-\frac{k!}{(2\pi in)^k}$である。
  strategy: Induct on k by integrating by parts with B_k' = k B_(k-1).
  sketch:
  - 'setup: Let A_k be the integral of e^(-2πinx) B_k(x) over [0, 1].'
  - 'derive: For k = 1, direct integration by parts gives -1/(2πin).'
  - 'induction: For k ≥ 2, integration by parts gives A_k = (k/(2πin)) A_(k-1), since the boundary terms cancel.'
  - 'conclude: Hence A_k = -k! / (2πin)^k.'
  openmath: (forall (k n) (-> (and (in k N) (>= k 1) (in n Z) (!= n 0)) (= (interval_integral 0 1 (lambda (x) (* (exp (* (* (neg 2) (* pi (* n x))) complex_i)) (poly_eval (bernoulli_polynomial k) x)))) (/ (neg (factorial k)) (^ (* 2 (* pi (* complex_i n))) k)))))
  hard_negative:
    statement: 同じ公式が$k=0$でも成り立つ。
    reason: $k=0$では$B_0=1$なので、積分は$n\neq 0$で$0$である。公式の右辺は$-1$である。
  target: |
    ∀ k : ℕ, k ≠ 0 → ∀ n : ℤ, n ≠ 0 → ∫ x in (0:ℝ)..1, Complex.exp (((-2 * Real.pi * n * x : ℝ) : ℂ) * Complex.I) * (bernoulliFun k x : ℂ) = -(k.factorial : ℂ) / (2 * Real.pi * Complex.I * n) ^ k
  proof: |
    by
      intro k hk n _
      have h := bernoulliFourierCoeff_eq hk n
      rw [bernoulliFourierCoeff, fourierCoeffOn_eq_integral] at h
      rw [← h]
      simp only [sub_zero, one_div, inv_one, one_smul, smul_eq_mul]
      congr 1
      funext x
      rw [fourier_coe_apply]
      congr 2
      push_cast
      ring
- id: bernoulli_numbers_recursion_generating
  kind: gap
  level: 2
  topic: 特殊関数・ベルヌーイ数の漸化式と母関数
  statement: |-
    ベルヌーイ数$B_n$（$B_1=-\frac{1}{2}$の流儀）は形式的べき級数の等式$\left(\sum_{n\geq 0}\frac{B_n}{n!}X^n\right)(e^X-1)=X$を満たす。また有理数列$(b_n)$について、すべての非負整数$n$で$\sum_{k=0}^{n-1}\binom{n}{k}b_k=\begin{cases}1&(n=1)\\0&(n\neq 1)\end{cases}$が成り立つことと、すべての$n$で$b_n=B_n$であることは同値である。
  statement_en: |-
    The Bernoulli numbers B_n, with B_1 = -1/2, satisfy the formal power series identity (Σ_{n≥0} B_n X^n / n!) (e^X - 1) = X. Moreover, a rational sequence (b_n) satisfies Σ_{k=0}^{n-1} C(n,k) b_k = 1 for n = 1 and 0 for n ≠ 1, for all nonnegative integers n, if and only if b_n = B_n for all n.
  assumptions:
  - '$B_1=-\frac{1}{2}$の流儀'
  - '$(b_n)$は有理数列'
  quantifiers:
  - '任意の有理数列$(b_n)$'
  conclusion: |-
    形式的べき級数の等式$\left(\sum_{n\geq 0}\frac{B_n}{n!}X^n\right)(e^X-1)=X$が成り立ち、漸化式を満たす有理数列はベルヌーイ数の列に限る。
  answer: |
    $B_n$を、$\sum_{n\geq 0}\frac{B_n}{n!}X^n=\frac{X}{e^X-1}$で定める。$\frac{e^X-1}{X}=\sum_{m\geq 0}\frac{X^m}{(m+1)!}$は定数項が$1$なので、形式的べき級数環で可逆であり、この定義は意味をもつ。すなわち、形式的べき級数の等式はこの定義そのものである。

    等式の$X^n$の係数を比べる。$e^X-1=\sum_{m\geq 1}\frac{X^m}{m!}$なので、左辺の$X^n$の係数は$\sum_{k=0}^{n-1}\frac{B_k}{k!}\cdot\frac{1}{(n-k)!}$である（$n=0$では空和で$0$）。右辺の係数は$n=1$で$1$、それ以外で$0$である。$n!$を掛けると$\frac{n!}{k!(n-k)!}=\binom{n}{k}$なので、$(B_n)$は漸化式を満たす。

    逆に有理数列$(b_n)$が漸化式を満たすとする。すべての$n$で$b_n=B_n$であることを$n$に関する強い帰納法で示す。$k<n$で$b_k=B_k$と仮定する。$b$と$B$の漸化式を$n+1$で書き、差をとると、$k<n$の項は消えて$\binom{n+1}{n}(b_n-B_n)=0$が残る。$\binom{n+1}{n}=n+1\neq 0$なので$b_n=B_n$である。
  strategy: |-
    Compare coefficients of X^n in the product of the two exponential series, and use the top term of the recursion for uniqueness.
  sketch:
  - 'setup: Define B_n by the expansion of X/(e^X - 1), which is meaningful because (e^X - 1)/X is invertible.'
  - 'derive: The coefficient of X^n in the product is Σ_{k<n} B_k / (k! (n-k)!).'
  - 'derive: Multiplying by n! shows that (B_n) satisfies the recursion.'
  - 'induction: If (b_n) satisfies the recursion and b_k = B_k for k < n, subtract the two recursions at n + 1.'
  - 'conclude: Only (n+1)(b_n - B_n) = 0 remains, so b_n = B_n.'
  openmath: (and (forall (b) (<-> (forall (n) (-> (in n N) (and (-> (= n 1) (= (range_sum n (lambda (k) (* (binomial n k) (seq_value b k)))) 1)) (-> (!= n 1) (= (range_sum n (lambda (k) (* (binomial n k) (seq_value b k)))) 0))))) (forall (n) (-> (in n N) (= (seq_value b n) (bernoulli_number n)))))) bernoulli_power_series_identity)
  hard_negative:
    statement: ベルヌーイ数は$\sum_{k=0}^{n}\binom{n}{k}B_k=0$をすべての$n\geq 1$で満たす。
    reason: $n=1$では$B_0+B_1=1-\frac{1}{2}=\frac{1}{2}\neq 0$である。和の上限は$n-1$である。
  target: |
    (∀ b : ℕ → ℚ, (∀ n : ℕ, ∑ k ∈ Finset.range n, (n.choose k : ℚ) * b k = if n = 1 then 1 else 0) ↔ b = bernoulli) ∧ (bernoulliPowerSeries ℚ) * (PowerSeries.exp ℚ - 1) = PowerSeries.X
  proof: |
    by
      refine ⟨fun b => ⟨fun h => ?_, fun h n => by rw [h]; exact sum_bernoulli n⟩, bernoulliPowerSeries_mul_exp_sub_one ℚ⟩
      funext n
      induction n using Nat.strong_induction_on with
      | _ n ih =>
        have h1 := h (n + 1)
        have h2 := sum_bernoulli (n + 1)
        rw [Finset.sum_range_succ] at h1 h2
        have hs : ∑ k ∈ Finset.range n, ((n + 1).choose k : ℚ) * b k = ∑ k ∈ Finset.range n, ((n + 1).choose k : ℚ) * bernoulli k :=
          Finset.sum_congr rfl (fun k hk => by rw [ih k (Finset.mem_range.mp hk)])
        rw [hs] at h1
        have hc : (((n + 1).choose n : ℕ) : ℚ) ≠ 0 := by
          rw [Nat.choose_succ_self_right]
          positivity
        exact mul_left_cancel₀ hc (add_left_cancel (h1.trans h2.symm))
- id: bernoulli_numbers_odd_vanish
  kind: gap
  level: 2
  topic: 特殊関数・奇数番目のベルヌーイ数
  statement: $n\geq 3$が奇数ならば、ベルヌーイ数について$B_n=0$である。
  statement_en: If n ≥ 3 is odd, then the Bernoulli number B_n vanishes.
  assumptions:
  - $n\geq 3$は奇数
  quantifiers:
  - 任意の奇数$n\geq 3$
  conclusion: $B_n=0$である。
  answer: |
    $n\geq 3$を奇数とする。$g(X)=\sum_{m\geq 0}\frac{B_m}{m!}X^m+\frac{X}{2}$とおく。$\sum_{m\geq 0}\frac{B_m}{m!}X^m=\frac{X}{e^X-1}$なので
    $g(X)=\frac{X}{e^X-1}+\frac{X}{2}=\frac{X}{2}\cdot\frac{e^X+1}{e^X-1}$
    である。$X$を$-X$に置き換えて分母と分子に$e^X$を掛けると
    $g(-X)=-\frac{X}{2}\cdot\frac{e^{-X}+1}{e^{-X}-1}=-\frac{X}{2}\cdot\frac{1+e^X}{1-e^X}=g(X)$
    である。よって$g$の奇数次の係数は$0$である。$n\geq 3$では$g$の$X^n$の係数は$\frac{B_n}{n!}$なので、$B_n=0$である。
  strategy: Adding X/2 to the generating function makes it even.
  sketch:
  - 'setup: Let g(X) = X/(e^X - 1) + X/2.'
  - 'derive: Simplifying gives g(X) = (X/2)(e^X + 1)/(e^X - 1).'
  - 'derive: Replacing X by -X shows g(-X) = g(X).'
  - 'conclude: The odd coefficients of g vanish, and for odd n ≥ 3 this coefficient is B_n / n!.'
  openmath: (forall (n) (-> (and (in n N) (> n 1) (exists (m) (and (in m N) (= n (+ (* 2 m) 1))))) (= (bernoulli_number n) 0)))
  hard_negative:
    statement: すべての奇数$n$について$B_n=0$である。
    reason: $n=1$では$B_1=-\frac{1}{2}\neq 0$である。
  target: |
    ∀ n : ℕ, 1 < n → Odd n → bernoulli n = 0
  proof: |
    by
      intro n h1 h2
      exact bernoulli_eq_zero_of_odd h2 h1
- id: faulhaber_power_sum
  kind: named
  level: 2
  topic: 特殊関数・ファウルハーバーの公式
  statement: ファウルハーバーの公式。非負整数$n,p$について$\sum_{k=0}^{n-1}k^p=\dfrac{1}{p+1}\sum_{i=0}^{p}\binom{p+1}{i}B_in^{p+1-i}$である。ここで$B_i$はベルヌーイ数（$B_1=-\frac{1}{2}$の流儀）であり、$0^0=1$とする。
  statement_en: Faulhaber's formula. For nonnegative integers n and p, Σ_{k=0}^{n-1} k^p = (1/(p+1)) Σ_{i=0}^{p} C(p+1,i) B_i n^(p+1-i), where B_i are the Bernoulli numbers with B_1 = -1/2 and 0^0 = 1.
  assumptions:
  - $n,p$は非負整数
  - $B_1=-\frac{1}{2}$の流儀
  - $0^0=1$
  quantifiers:
  - 任意の非負整数$n,p$
  conclusion: $\sum_{k=0}^{n-1}k^p=\dfrac{1}{p+1}\sum_{i=0}^{p}\binom{p+1}{i}B_in^{p+1-i}$である。
  answer: |
    $n$を非負整数とする。形式的べき級数で計算する。指数関数の展開から、$X^p/p!$の係数が$\sum_{k=0}^{n-1}k^p$である級数は
    $\sum_{k=0}^{n-1}e^{kX}=\frac{e^{nX}-1}{e^X-1}=\frac{X}{e^X-1}\cdot\frac{e^{nX}-1}{X}$
    である。$\frac{X}{e^X-1}=\sum_{i\geq 0}\frac{B_i}{i!}X^i$、$\frac{e^{nX}-1}{X}=\sum_{m\geq 0}\frac{n^{m+1}}{(m+1)!}X^m$なので、積の$X^p$の係数は$\sum_{i=0}^{p}\frac{B_i}{i!}\cdot\frac{n^{p-i+1}}{(p-i+1)!}$である。

    $p!$を掛けると、$\frac{p!}{i!(p+1-i)!}=\frac{1}{p+1}\binom{p+1}{i}$なので主張を得る。
  strategy: Compare coefficients in the generating function of the power sums.
  sketch:
  - 'setup: The exponential generating function of the power sums is Σ_{k<n} e^(kX).'
  - 'derive: The geometric sum equals (X/(e^X-1)) ((e^(nX)-1)/X).'
  - 'derive: Expand the two factors with the Bernoulli numbers and powers of n.'
  - 'conclude: Comparing the coefficient of X^p and multiplying by p! gives the formula.'
  openmath: (forall (n p) (-> (and (in n N) (in p N)) (= (range_sum n (lambda (k) (^ k p))) (range_sum (+ p 1) (lambda (i) (/ (* (bernoulli_number i) (* (binomial (+ p 1) i) (^ n (- (+ p 1) i)))) (+ p 1)))))))
  hard_negative:
    statement: 非負整数$n,p$について$\sum_{k=1}^{n}k^p=\dfrac{1}{p+1}\sum_{i=0}^{p}\binom{p+1}{i}B_in^{p+1-i}$である（$B_1=-\frac{1}{2}$）。
    reason: $n=1$、$p=1$とすると左辺は$1$である。右辺は$\frac{1}{2}\left(1+2\cdot\left(-\frac{1}{2}\right)\right)=0$である。この$B_1$の流儀では上限は$n-1$である。
  target: |
    ∀ n p : ℕ, ∑ k ∈ Finset.range n, (k : ℚ) ^ p = ∑ i ∈ Finset.range (p + 1), bernoulli i * ((p + 1).choose i : ℚ) * (n : ℚ) ^ (p + 1 - i) / ((p : ℚ) + 1)
  proof: |
    by
      intro n p
      exact sum_range_pow n p
- id: bernoulli_polynomial_derivative
  kind: gap
  level: 2
  topic: 特殊関数・ベルヌーイ多項式の導関数
  statement: ベルヌーイ多項式を$B_n(X)=\sum_{i=0}^{n}\binom{n}{i}B_{n-i}X^i$とする。正の整数$k$について$B_k'(X)=kB_{k-1}(X)$である。
  statement_en: Let B_n(X) = Σ_{i=0}^{n} C(n,i) B_(n-i) X^i be the Bernoulli polynomial. For a positive integer k, B_k'(X) = k B_(k-1)(X).
  assumptions:
  - $k\geq 1$
  quantifiers:
  - 任意の正の整数$k$
  conclusion: $B_k'(X)=kB_{k-1}(X)$である。
  answer: |
    $k\geq 1$とする。定義の各項を微分すると
    $B_k'(X)=\sum_{i=1}^{k}i\binom{k}{i}B_{k-i}X^{i-1}$
    である。$i\binom{k}{i}=k\binom{k-1}{i-1}$なので、$j=i-1$とおくと
    $B_k'(X)=k\sum_{j=0}^{k-1}\binom{k-1}{j}B_{(k-1)-j}X^{j}=kB_{k-1}(X)$
    である。
  strategy: Differentiate term by term and use i C(k,i) = k C(k-1,i-1).
  sketch:
  - 'setup: Differentiate the defining sum term by term.'
  - 'derive: Use the identity i C(k,i) = k C(k-1,i-1).'
  - 'conclude: Reindexing with j = i - 1 gives k B_(k-1)(X).'
  openmath: (forall (k) (-> (and (in k N) (>= k 1)) (= (poly_derivative (bernoulli_polynomial k)) (* k (bernoulli_polynomial (- k 1))))))
  hard_negative:
    statement: 正の整数$k$について$B_k'(X)=B_{k-1}(X)$である。
    reason: $k=2$では$B_2(X)=X^2-X+\frac{1}{6}$なので$B_2'(X)=2X-1$である。$B_1(X)=X-\frac{1}{2}$とは$2$倍だけ異なる。
  target: |
    ∀ k : ℕ, 1 ≤ k → Polynomial.derivative (Polynomial.bernoulli k) = (k : Polynomial ℚ) * Polynomial.bernoulli (k - 1)
  proof: |
    by
      intro k _
      exact Polynomial.derivative_bernoulli k
- id: bernoulli_polynomial_difference
  kind: gap
  level: 2
  topic: 特殊関数・ベルヌーイ多項式の差分
  statement: 正の整数$n$について、ベルヌーイ多項式は$B_n(X+1)-B_n(X)=nX^{n-1}$を満たす。
  statement_en: For a positive integer n, the Bernoulli polynomial satisfies B_n(X+1) - B_n(X) = n X^(n-1).
  assumptions:
  - $n\geq 1$
  quantifiers:
  - 任意の正の整数$n$
  conclusion: $B_n(X+1)-B_n(X)=nX^{n-1}$である。
  answer: |
    $n\geq 1$とし、$x$を実数とする。多項式$B_n(X)=\sum_{i}\binom{n}{i}B_{n-i}X^i$から、形式変数$t$について
    $\sum_{m\geq 0}\frac{B_m(x)}{m!}t^m=\left(\sum_{l\geq 0}\frac{B_l}{l!}t^l\right)\left(\sum_{i\geq 0}\frac{x^i}{i!}t^i\right)=\frac{te^{xt}}{e^t-1}$
    である（係数比較で$\frac{1}{m!}\binom{m}{i}=\frac{1}{(m-i)!\,i!}$を用いる）。$x$を$x+1$に替えて差をとると
    $\sum_{m\geq 0}\frac{B_m(x+1)-B_m(x)}{m!}t^m=\frac{te^{xt}(e^t-1)}{e^t-1}=te^{xt}=\sum_{m\geq 1}\frac{x^{m-1}}{(m-1)!}t^m$
    である。$t^n$の係数を比べて$n!$を掛けると、$B_n(x+1)-B_n(x)=nx^{n-1}$である。これはすべての実数$x$で成り立つので、多項式の等式$B_n(X+1)-B_n(X)=nX^{n-1}$を得る。
  strategy: Use the generating function t e^(xt)/(e^t - 1) of the Bernoulli polynomials.
  sketch:
  - 'setup: The definition of B_m(x) gives the generating function t e^(xt) / (e^t - 1).'
  - 'derive: Replacing x by x + 1 and subtracting cancels the denominator.'
  - 'derive: The difference equals t e^(xt) = Σ_{m≥1} x^(m-1) t^m / (m-1)!.'
  - 'conclude: Comparing coefficients of t^n gives n x^(n-1).'
  openmath: (forall (n) (-> (and (in n N) (>= n 1)) (= (poly_comp (bernoulli_polynomial n) poly_one_add_x) (+ (bernoulli_polynomial n) (* n (poly_x_pow (- n 1)))))))
  hard_negative:
    statement: 正の整数$n$について$B_n(X+1)-B_n(X)=X^{n-1}$である。
    reason: $n=2$では$B_2(X+1)-B_2(X)=(X+1)^2-(X+1)-X^2+X=2X$である。$X$とは$2$倍だけ異なる。
  target: |
    ∀ n : ℕ, 1 ≤ n → (Polynomial.bernoulli n).comp (1 + Polynomial.X) = Polynomial.bernoulli n + n • Polynomial.X ^ (n - 1)
  proof: |
    by
      intro n _
      exact Polynomial.bernoulli_comp_one_add_X n
- id: bernoulli_multiplication_theorem
  kind: gap
  level: 3
  topic: 特殊関数・ベルヌーイ多項式の乗法公式
  statement: ベルヌーイ多項式の乗法公式。非負整数$k$、正の整数$m$、実数$x$について$B_k(mx)=m^{k-1}\sum_{i=0}^{m-1}B_k\left(x+\frac{i}{m}\right)$である。
  statement_en: Multiplication theorem for Bernoulli polynomials. For a nonnegative integer k, a positive integer m and a real x, B_k(mx) = m^(k-1) Σ_{i=0}^{m-1} B_k(x + i/m).
  assumptions:
  - $k$は非負整数
  - $m\geq 1$
  - $x\in\mathbb{R}$
  quantifiers:
  - 任意の非負整数$k$
  - 任意の正の整数$m$
  - 任意の実数$x$
  conclusion: $B_k(mx)=m^{k-1}\sum_{i=0}^{m-1}B_k\left(x+\frac{i}{m}\right)$である。
  answer: |
    $m\geq 1$、$x$を実数とする。ベルヌーイ多項式の母関数$\sum_{k\geq 0}\frac{B_k(y)}{k!}t^k=\frac{te^{yt}}{e^t-1}$を用いる。等比数列の和より
    $\sum_{i=0}^{m-1}\frac{te^{(x+i/m)t}}{e^t-1}=\frac{te^{xt}}{e^t-1}\cdot\frac{e^t-1}{e^{t/m}-1}=\frac{te^{xt}}{e^{t/m}-1}$
    である。$t=mu$と置くと右辺は$\frac{mu\,e^{mxu}}{e^u-1}=m\sum_{k\geq 0}\frac{B_k(mx)}{k!}u^k$である。左辺は$\sum_{k\geq 0}\sum_{i}\frac{B_k(x+i/m)}{k!}m^ku^k$である。$u^k$の係数を比べて$k!$を掛けると$m^k\sum_iB_k\left(x+\frac{i}{m}\right)=mB_k(mx)$である。$m$で割れば主張を得る。
  strategy: Sum the generating function over the shifts by i/m with a geometric series.
  sketch:
  - 'setup: Use the generating function t e^(yt) / (e^t - 1).'
  - 'derive: Summing over y = x + i/m gives t e^(xt) / (e^(t/m) - 1).'
  - 'translate: Substituting t = mu turns this into m times the generating function at mx.'
  - 'conclude: Comparing the coefficients of u^k gives the formula.'
  openmath: (forall (k m x) (-> (and (in k N) (in m N) (>= m 1) (in x R)) (= (poly_eval (bernoulli_polynomial k) (* m x)) (* (/ (^ m k) m) (range_sum m (lambda (i) (poly_eval (bernoulli_polynomial k) (+ x (/ i m)))))))))
  hard_negative:
    statement: 同じ記号で$B_k(mx)=\sum_{i=0}^{m-1}B_k\left(x+\frac{i}{m}\right)$である。
    reason: $k=0$、$m=2$では$B_0=1$なので左辺は$1$であり、右辺は$2$である。因子$m^{k-1}$が必要である。
  target: |
    ∀ (k m : ℕ) (x : ℝ), m ≠ 0 → bernoulliFun k ((m : ℝ) * x) = (m : ℝ) ^ k / m * ∑ i ∈ Finset.range m, bernoulliFun k (x + i / m)
  proof: |
    by
      intro k m x hm
      exact bernoulliFun_mul k hm x
- id: chebyshev_trigonometric_identities
  kind: gap
  level: 2
  topic: チェビシェフ多項式・三角関数との関係
  statement: チェビシェフ多項式を$T_0=1$、$T_1=X$、$U_0=1$、$U_1=2X$、$P_{n+2}=2XP_{n+1}-P_n$（$P=T,U$）で定める。負の添字にも同じ漸化式で延ばす。整数$n$と実数$\theta$について$T_n(\cos\theta)=\cos n\theta$、$U_n(\cos\theta)\sin\theta=\sin(n+1)\theta$である。
  statement_en: Define Chebyshev polynomials by T_0 = 1, T_1 = X, U_0 = 1, U_1 = 2X and P_(n+2) = 2X P_(n+1) - P_n for P = T, U, extended to negative indices by the same recurrence. For an integer n and a real θ, T_n(cos θ) = cos(nθ) and U_n(cos θ) sin θ = sin((n+1)θ).
  assumptions:
  - $n\in\mathbb{Z}$
  - $\theta\in\mathbb{R}$
  quantifiers:
  - 任意の整数$n$
  - 任意の実数$\theta$
  conclusion: $T_n(\cos\theta)=\cos n\theta$かつ$U_n(\cos\theta)\sin\theta=\sin(n+1)\theta$である。
  answer: |
    $\theta$を実数とする。加法定理より、すべての実数$\alpha$について$\cos(\alpha+\theta)+\cos(\alpha-\theta)=2\cos\theta\cos\alpha$、$\sin(\alpha+\theta)+\sin(\alpha-\theta)=2\cos\theta\sin\alpha$である。

    したがって$a_n=\cos n\theta$は$a_{n+2}=2\cos\theta\,a_{n+1}-a_n$を満たす。$b_n=T_n(\cos\theta)$も同じ漸化式を満たし、$a_0=b_0=1$、$a_1=b_1=\cos\theta$である。この漸化式は隣り合う2項から前後の項を決めるので、すべての整数$n$で$a_n=b_n$である。

    同様に$c_n=\sin(n+1)\theta$と$d_n=U_n(\cos\theta)\sin\theta$は同じ漸化式を満たす。$c_0=d_0=\sin\theta$であり、$c_1=\sin 2\theta=2\sin\theta\cos\theta=d_1$である。よってすべての整数$n$で$c_n=d_n$である。
  strategy: Both sides satisfy the same two-sided three-term recurrence with the same initial values.
  sketch:
  - 'setup: The addition formulas give a three-term recurrence for cos(nθ) and sin((n+1)θ).'
  - 'derive: T_n(cos θ) and cos(nθ) satisfy the same recurrence with the same two initial values.'
  - 'derive: U_n(cos θ) sin θ and sin((n+1)θ) do too.'
  - 'conclude: The recurrence determines all terms from two neighbours, so the identities hold for all integers n.'
  openmath: (forall (n t) (-> (and (in n Z) (in t R)) (and (= (poly_eval (chebyshev_t R n) (cos t)) (cos (* n t))) (= (* (poly_eval (chebyshev_u R n) (cos t)) (sin t)) (sin (* (+ n 1) t))))))
  hard_negative:
    statement: 整数$n$と実数$\theta$について$U_n(\cos\theta)=\sin(n+1)\theta$である。
    reason: $n=0$、$\theta=\frac{\pi}{2}$では成り立つが、$\theta=0$とすると$U_0(1)=1$であり、$\sin 0=0$である。
  target: |
    ∀ (n : ℤ) (θ : ℝ), (Polynomial.Chebyshev.T ℝ n).eval (Real.cos θ) = Real.cos (n * θ) ∧ (Polynomial.Chebyshev.U ℝ n).eval (Real.cos θ) * Real.sin θ = Real.sin ((n + 1) * θ)
  proof: |
    by
      intro n θ
      exact ⟨Polynomial.Chebyshev.T_real_cos θ n, Polynomial.Chebyshev.U_real_cos θ n⟩
- id: chebyshev_composition
  kind: gap
  level: 2
  topic: チェビシェフ多項式・合成
  statement: 可換環$R$上のチェビシェフ多項式$T_n$について、整数$m,n$に対して$T_{mn}=T_m\circ T_n$である。ここで$T_0=1$、$T_1=X$、$T_{n+2}=2XT_{n+1}-T_n$であり、負の添字にも同じ漸化式で延ばす。
  statement_en: For Chebyshev polynomials T_n over a commutative ring R, one has T_(mn) = T_m ∘ T_n for integers m and n. Here T_0 = 1, T_1 = X, T_(n+2) = 2X T_(n+1) - T_n, extended to negative indices by the same recurrence.
  assumptions:
  - $R$は可換環
  - $m,n\in\mathbb{Z}$
  quantifiers:
  - 任意の可換環$R$
  - 任意の整数$m,n$
  conclusion: $T_{mn}=T_m\circ T_n$である。
  answer: |
    $T_n$の係数は整数の像であり、$\mathbb{Z}$から$R$への環準同型は合成を保つ。よって$R=\mathbb{Z}$の場合を示せばよい。$\mathbb{Z}[X]\subset\mathbb{R}[X]$なので、$\mathbb{R}$上で示せば十分である。

    $m,n$を整数、$\theta$を実数とする。$T_k(\cos\theta)=\cos k\theta$より
    $T_m(T_n(\cos\theta))=T_m(\cos n\theta)=\cos mn\theta=T_{mn}(\cos\theta)$
    である。$\cos\theta$は$[-1,1]$の全体を動くので、多項式$T_{mn}$と$T_m\circ T_n$は無限個の点で一致する。よって等しい。
  strategy: Reduce to real coefficients and compare the polynomials on [-1, 1] using T_k(cos θ) = cos(kθ).
  sketch:
  - 'setup: The coefficients are images of integers, so it is enough to work over ℝ.'
  - 'apply_theorem: T_k(cos θ) = cos(kθ) gives T_m(T_n(cos θ)) = cos(mnθ) = T_(mn)(cos θ).'
  - 'derive: The two polynomials agree on the infinite set [-1, 1].'
  - 'conclude: Hence they are equal.'
  openmath: (forall (A m n) (-> (and (comm_ring A) (in m Z) (in n Z)) (= (chebyshev_t A (* m n)) (poly_comp (chebyshev_t A m) (chebyshev_t A n)))))
  hard_negative:
    statement: 整数$m,n$について$T_{m+n}=T_m\circ T_n$である。
    reason: $m=n=1$とすると$T_1\circ T_1=X$であるが、$T_2=2X^2-1$である。
  target: |
    ∀ (R : Type*) [CommRing R] (m n : ℤ), Polynomial.Chebyshev.T R (m * n) = (Polynomial.Chebyshev.T R m).comp (Polynomial.Chebyshev.T R n)
  proof: |
    by
      intro R _ m n
      exact Polynomial.Chebyshev.T_mul R m n
- id: chebyshev_product_formula
  kind: gap
  level: 2
  topic: チェビシェフ多項式・積の公式
  statement: 可換環$R$上のチェビシェフ多項式$T_n$について、整数$m,k$に対して$2T_mT_k=T_{m+k}+T_{m-k}$である。ここで$T_0=1$、$T_1=X$、$T_{n+2}=2XT_{n+1}-T_n$であり、負の添字にも同じ漸化式で延ばす。
  statement_en: For Chebyshev polynomials T_n over a commutative ring R, one has 2 T_m T_k = T_(m+k) + T_(m-k) for integers m and k. Here T_0 = 1, T_1 = X, T_(n+2) = 2X T_(n+1) - T_n, extended to negative indices by the same recurrence.
  assumptions:
  - $R$は可換環
  - $m,k\in\mathbb{Z}$
  quantifiers:
  - 任意の可換環$R$
  - 任意の整数$m,k$
  conclusion: $2T_mT_k=T_{m+k}+T_{m-k}$である。
  answer: |
    $T_n$の係数は整数の像なので、$R=\mathbb{Z}$の場合を示せばよく、$\mathbb{Z}[X]\subset\mathbb{R}[X]$なので$\mathbb{R}$上で示せば十分である。

    $m,k$を整数、$\theta$を実数とする。$T_n(\cos\theta)=\cos n\theta$と積和公式より
    $2T_m(\cos\theta)T_k(\cos\theta)=2\cos m\theta\cos k\theta=\cos(m+k)\theta+\cos(m-k)\theta=T_{m+k}(\cos\theta)+T_{m-k}(\cos\theta)$
    である。両辺の多項式は$[-1,1]$の全体で一致するので等しい。
  strategy: Reduce to real coefficients and use the product-to-sum formula for cosines.
  sketch:
  - 'setup: It is enough to work over ℝ because the coefficients are images of integers.'
  - 'apply_theorem: T_n(cos θ) = cos(nθ) and the product-to-sum formula give the identity on [-1, 1].'
  - 'conclude: Polynomials agreeing on an infinite set are equal.'
  openmath: (forall (A m k) (-> (and (comm_ring A) (in m Z) (in k Z)) (= (* 2 (* (chebyshev_t A m) (chebyshev_t A k))) (+ (chebyshev_t A (+ m k)) (chebyshev_t A (- m k))))))
  hard_negative:
    statement: 整数$m,k$について$T_mT_k=T_{m+k}$である。
    reason: $m=k=1$とすると$T_1^2=X^2$であり、$T_2=2X^2-1$とは異なる。
  target: |
    ∀ (R : Type*) [CommRing R] (m k : ℤ), 2 * Polynomial.Chebyshev.T R m * Polynomial.Chebyshev.T R k = Polynomial.Chebyshev.T R (m + k) + Polynomial.Chebyshev.T R (m - k)
  proof: |
    by
      intro R _ m k
      exact Polynomial.Chebyshev.T_mul_T R m k
- id: chebyshev_degree_leading_coefficient
  kind: gap
  level: 2
  topic: チェビシェフ多項式・次数と最高次係数
  statement: $R$を$2\neq 0$である整域とする。正の整数$n$について、$R$上のチェビシェフ多項式$T_n$の次数は$n$であり、最高次係数は$2^{n-1}$である。
  statement_en: Let R be an integral domain in which 2 ≠ 0. For a positive integer n, the Chebyshev polynomial T_n over R has degree n and leading coefficient 2^(n-1).
  assumptions:
  - $R$は整域
  - $R$で$2\neq 0$
  - $n\geq 1$
  quantifiers:
  - 任意の整域$R$
  - 任意の正の整数$n$
  conclusion: $\deg T_n=n$であり、$T_n$の最高次係数は$2^{n-1}$である。
  answer: |
    $R$を$2\neq 0$である整域とする。$n$に関する帰納法で示す。$T_1=X$は次数$1$、最高次係数$1=2^0$である。$T_2=2X^2-1$は次数$2$、最高次係数$2$である。

    $n\geq 2$とし、$T_{n}$と$T_{n-1}$で成り立つと仮定する。$T_{n+1}=2XT_n-T_{n-1}$である。$R$は整域で$2\neq 0$なので、$2XT_n$は次数$n+1$、最高次係数$2\cdot 2^{n-1}=2^n$である。$T_{n-1}$の次数は$n-1$なので、最高次の項に影響しない。よって$T_{n+1}$は次数$n+1$、最高次係数$2^n$である。
  strategy: Induct on n through the recurrence T_(n+1) = 2X T_n - T_(n-1).
  sketch:
  - 'setup: Check n = 1 and n = 2 directly.'
  - 'induction: In T_(n+1) = 2X T_n - T_(n-1), the term 2X T_n has degree n + 1 and leading coefficient 2^n.'
  - 'derive: The term T_(n-1) has lower degree and does not affect the top term.'
  - 'conclude: So T_(n+1) has degree n + 1 and leading coefficient 2^n.'
  openmath: (forall (A n) (-> (and (integral_domain A) (two_ne_zero_in A) (in n N) (>= n 1)) (and (= (poly_degree (chebyshev_t A n)) n) (= (poly_leading_coeff (chebyshev_t A n)) (^ 2 (- n 1))))))
  hard_negative:
    statement: 任意の可換環$R$上で$T_n$の次数は$n$である。
    reason: $R=\mathbb{Z}/2\mathbb{Z}$では$T_2=2X^2-1=1$なので次数は$0$である。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] [NeZero (2 : R)] (n : ℕ), n ≠ 0 → (Polynomial.Chebyshev.T R n).natDegree = n ∧ (Polynomial.Chebyshev.T R n).leadingCoeff = 2 ^ (n - 1)
  proof: |
    by
      intro R _ _ _ n _
      constructor
      · simpa using Polynomial.Chebyshev.natDegree_T R (n : ℤ)
      · simpa using Polynomial.Chebyshev.leadingCoeff_T R (n : ℤ)
- id: chebyshev_roots
  kind: gap
  level: 2
  topic: チェビシェフ多項式・根
  statement: 正の整数$n$について、実係数のチェビシェフ多項式$T_n$の根は$\cos\dfrac{(2k+1)\pi}{2n}$（$k=0,\dots,n-1$）であり、これらは相異なり、重複度はすべて$1$である。
  statement_en: For a positive integer n, the roots of the real Chebyshev polynomial T_n are cos((2k+1)π/(2n)) for k = 0, ..., n-1; these are distinct, and each has multiplicity 1.
  assumptions:
  - $n\geq 1$
  quantifiers:
  - 任意の正の整数$n$
  conclusion: |-
    $\cos\dfrac{(2k+1)\pi}{2n}$（$0\leq k<n$）は相異なり、$T_n$の根の多重集合はこれらの値からなり、各根の重複度は$1$である。
  answer: |
    $n\geq 1$とする。$x_k=\cos\frac{(2k+1)\pi}{2n}$（$0\leq k<n$）とおく。$T_n(\cos\theta)=\cos n\theta$より$T_n(x_k)=\cos\frac{(2k+1)\pi}{2}=0$である。

    $0<\frac{(2k+1)\pi}{2n}<\pi$であり、$\cos$は$[0,\pi]$で狭義単調減少なので、$x_0,\dots,x_{n-1}$は相異なる。$T_n$は次数$n$の$0$でない多項式なので、根は重複度込みで高々$n$個である。よってこれらがすべての根であり、各根の重複度は$1$である。
  strategy: Exhibit n distinct roots via T_n(cos θ) = cos(nθ) and compare with the degree.
  sketch:
  - 'setup: Let x_k = cos((2k+1)π/(2n)).'
  - 'derive: T_n(x_k) = cos((2k+1)π/2) = 0.'
  - 'derive: The x_k are distinct because cos is injective on [0, π].'
  - 'conclude: Since deg T_n = n, these are all the roots, each simple.'
  openmath: (forall (n) (-> (and (in n N) (>= n 1)) (and (poly_roots_are (chebyshev_t R n) (chebyshev_node_set n)) (forall (j k) (-> (and (in j N) (in k N) (< j n) (< k n) (= (cos (/ (* (+ (* 2 j) 1) pi) (* 2 n))) (cos (/ (* (+ (* 2 k) 1) pi) (* 2 n))))) (= j k))))))
  hard_negative:
    statement: $T_n$の根は$\cos\dfrac{k\pi}{n}$（$k=0,\dots,n$）である。
    reason: これらは$|T_n|=1$となる点である。$T_n\left(\cos\frac{k\pi}{n}\right)=\cos k\pi=(-1)^k\neq 0$である。
  target: |
    ∀ n : ℕ, (Polynomial.Chebyshev.T ℝ n).roots = ((Finset.range n).image (fun k : ℕ => Real.cos ((2 * k + 1) * Real.pi / (2 * n)))).val ∧ Set.InjOn (fun k : ℕ => Real.cos ((2 * k + 1) * Real.pi / (2 * n))) (Finset.range n : Set ℕ)
  proof: |
    by
      intro n
      exact ⟨Polynomial.Chebyshev.roots_T_real n, (Finset.range n).nodup_map_iff_injOn.mp (Polynomial.Chebyshev.roots_T_real_nodup n)⟩
- id: chebyshev_weighted_orthogonality
  kind: textbook
  level: 3
  topic: チェビシェフ多項式・直交性
  statement: 非負整数$n,m$について、$T_n(x)T_m(x)\dfrac{1}{\sqrt{1-x^2}}$は$(-1,1)$で可積分であり、$\int_{-1}^{1}T_n(x)T_m(x)\dfrac{dx}{\sqrt{1-x^2}}$は、$n\neq m$なら$0$、$n=m=0$なら$\pi$、$n=m\neq 0$なら$\dfrac{\pi}{2}$である。
  statement_en: For nonnegative integers n and m, the function T_n(x) T_m(x) / √(1-x²) is integrable on (-1, 1), and its integral equals 0 if n ≠ m, π if n = m = 0, and π/2 if n = m ≠ 0.
  assumptions:
  - $n,m$は非負整数
  quantifiers:
  - 任意の非負整数$n,m$
  conclusion: 積分は$n\neq m$なら$0$、$n=m=0$なら$\pi$、$n=m\neq 0$なら$\dfrac{\pi}{2}$である。
  answer: |
    $n,m$を非負整数とする。$T_nT_m$は$[-1,1]$で有界であり、$\int_{-1}^{1}\frac{dx}{\sqrt{1-x^2}}=\pi$は有限なので、被積分関数は可積分である。

    $x=\cos\theta$（$0<\theta<\pi$）と置換すると$\frac{dx}{\sqrt{1-x^2}}$は$-d\theta$に対応する。$T_k(\cos\theta)=\cos k\theta$より
    $\int_{-1}^{1}T_n(x)T_m(x)\frac{dx}{\sqrt{1-x^2}}=\int_0^\pi\cos n\theta\cos m\theta\,d\theta=\frac{1}{2}\int_0^\pi\left(\cos(n+m)\theta+\cos(n-m)\theta\right)d\theta$
    である。整数$l\neq 0$について$\int_0^\pi\cos l\theta\,d\theta=0$であり、$l=0$では値は$\pi$である。$n\neq m$なら$n+m$も$n-m$も$0$でないので値は$0$である。$n=m\neq 0$なら値は$\frac{\pi}{2}$であり、$n=m=0$なら値は$\pi$である。
  strategy: Substitute x = cos θ to reduce to the orthogonality of cosines on [0, π].
  sketch:
  - 'setup: Integrability follows from boundedness of T_n T_m and integrability of the weight.'
  - 'translate: Substitute x = cos θ, turning the weight into dθ.'
  - 'derive: T_k(cos θ) = cos(kθ) and product-to-sum reduce the integral to integrals of cos(lθ).'
  - 'case_split: Evaluate in the cases n ≠ m, n = m ≠ 0, n = m = 0.'
  - 'conclude: The values are 0, π/2 and π.'
  openmath: (forall (n m) (-> (and (in n N) (in m N)) (and (interval_integrable (lambda (x) (* (* (poly_eval (chebyshev_t R n) x) (poly_eval (chebyshev_t R m) x)) (root (/ 1 (- 1 (^ x 2))) 2))) (neg 1) 1) (-> (!= n m) (= (interval_integral (neg 1) 1 (lambda (x) (* (* (poly_eval (chebyshev_t R n) x) (poly_eval (chebyshev_t R m) x)) (root (/ 1 (- 1 (^ x 2))) 2)))) 0)) (-> (and (= n m) (= n 0)) (= (interval_integral (neg 1) 1 (lambda (x) (* (* (poly_eval (chebyshev_t R n) x) (poly_eval (chebyshev_t R m) x)) (root (/ 1 (- 1 (^ x 2))) 2)))) pi)) (-> (and (= n m) (!= n 0)) (= (interval_integral (neg 1) 1 (lambda (x) (* (* (poly_eval (chebyshev_t R n) x) (poly_eval (chebyshev_t R m) x)) (root (/ 1 (- 1 (^ x 2))) 2)))) (/ pi 2))))))
  hard_negative:
    statement: $n\neq m$なら重みなしで$\int_{-1}^{1}T_n(x)T_m(x)\,dx=0$である。
    reason: $n=0$、$m=2$とすると$\int_{-1}^{1}(2x^2-1)\,dx=\frac{4}{3}-2=-\frac{2}{3}\neq 0$である。
  target: |
    ∀ n m : ℕ, IntervalIntegrable (fun x : ℝ => (Polynomial.Chebyshev.T ℝ n).eval x * (Polynomial.Chebyshev.T ℝ m).eval x * Real.sqrt ((1 - x ^ 2)⁻¹)) MeasureTheory.volume (-1) 1 ∧ ∫ x in (-1 : ℝ)..1, (Polynomial.Chebyshev.T ℝ n).eval x * (Polynomial.Chebyshev.T ℝ m).eval x * Real.sqrt ((1 - x ^ 2)⁻¹) = if n ≠ m then 0 else if n = 0 then Real.pi else Real.pi / 2
  proof: |
    by
      intro n m
      refine ⟨?_, ?_⟩
      · exact Polynomial.Chebyshev.intervalIntegrable_sqrt_one_sub_sq_inv.continuousOn_mul (by fun_prop)
      rw [← Polynomial.Chebyshev.integral_measureT (fun x => (Polynomial.Chebyshev.T ℝ n).eval x * (Polynomial.Chebyshev.T ℝ m).eval x)]
      split_ifs with h h0
      · exact Polynomial.Chebyshev.integral_eval_T_real_mul_eval_T_real_measureT_of_ne (by exact_mod_cast h)
      · subst h0
        push Not at h
        subst h
        simpa using Polynomial.Chebyshev.integral_eval_T_real_mul_self_measureT_zero
      · push Not at h
        subst h
        exact_mod_cast Polynomial.Chebyshev.integral_T_real_mul_self_measureT_of_ne_zero h0
- id: chebyshev_gauss_quadrature
  kind: gap
  level: 3
  topic: チェビシェフ多項式・ガウス求積
  statement: 正の整数$n$と次数$2n$未満の実係数多項式$P$について、$\dfrac{P(x)}{\sqrt{1-x^2}}$は$(-1,1)$で可積分であり、$\int_{-1}^{1}\dfrac{P(x)}{\sqrt{1-x^2}}\,dx=\dfrac{\pi}{n}\sum_{k=0}^{n-1}P\left(\cos\dfrac{(2k+1)\pi}{2n}\right)$である。
  statement_en: For a positive integer n and a real polynomial P of degree less than 2n, the function P(x)/√(1-x²) is integrable on (-1, 1) and its integral equals (π/n) Σ_{k=0}^{n-1} P(cos((2k+1)π/(2n))).
  assumptions:
  - $n\geq 1$
  - $\deg P<2n$
  quantifiers:
  - 任意の正の整数$n$
  - 任意の実係数多項式$P$
  conclusion: 被積分関数は可積分であり、$\int_{-1}^{1}\dfrac{P(x)}{\sqrt{1-x^2}}\,dx=\dfrac{\pi}{n}\sum_{k=0}^{n-1}P\left(\cos\dfrac{(2k+1)\pi}{2n}\right)$である。
  answer: |
    $n\geq 1$とする。$P$は$[-1,1]$で有界であり、$\int_{-1}^{1}\frac{dx}{\sqrt{1-x^2}}=\pi$は有限なので、被積分関数は可積分である。

    $T_0,\dots,T_{2n-1}$は次数がそれぞれ$0,\dots,2n-1$なので、次数$2n$未満の多項式の空間の基底である。両辺は$P$について線形なので、$P=T_j$（$0\leq j<2n$）の場合を示せばよい。

    $x=\cos\theta$と置換すると、左辺は$\int_0^\pi\cos j\theta\,d\theta$である。これは$j=0$で$\pi$、$0<j<2n$で$0$である。

    右辺は$\frac{\pi}{n}\sum_{k=0}^{n-1}\cos\frac{j(2k+1)\pi}{2n}$である。$j=0$では$\pi$である。$0<j<2n$では$\alpha=\frac{j\pi}{2n}$とおくと$0<\alpha<\pi$なので$\sin\alpha\neq 0$である。積和公式$2\sin\alpha\cos(2k+1)\alpha=\sin(2k+2)\alpha-\sin 2k\alpha$を$k$について足すと
    $2\sin\alpha\sum_{k=0}^{n-1}\cos(2k+1)\alpha=\sin 2n\alpha=\sin j\pi=0$
    である。よって右辺も$0$である。
  strategy: By linearity check the formula on the basis T_0, ..., T_(2n-1).
  sketch:
  - 'setup: T_0, ..., T_(2n-1) form a basis of polynomials of degree below 2n.'
  - 'derive: For P = T_j, the substitution x = cos θ gives the integral of cos(jθ) over [0, π].'
  - 'derive: The right side is (π/n) Σ_k cos((2k+1)α) with α = jπ/(2n).'
  - 'derive: Telescoping with sin α gives zero for 0 < j < 2n, and j = 0 gives π.'
  - 'conclude: The two sides agree on the basis, hence for all P.'
  openmath: (forall (n p) (-> (and (in n N) (>= n 1) (real_polynomial p) (< (poly_degree p) (* 2 n))) (and (interval_integrable (lambda (x) (* (poly_eval p x) (root (/ 1 (- 1 (^ x 2))) 2))) (neg 1) 1) (= (interval_integral (neg 1) 1 (lambda (x) (* (poly_eval p x) (root (/ 1 (- 1 (^ x 2))) 2)))) (* (/ pi n) (range_sum n (lambda (k) (poly_eval p (cos (* (/ (+ (* 2 k) 1) (* 2 n)) pi))))))))))
  hard_negative:
    statement: 次数$2n$の多項式でも同じ公式が成り立つ。
    reason: $n=1$、$P=2X^2-1=T_2$とする。左辺は$\int_0^\pi\cos 2\theta\,d\theta=0$である。節点は$\cos\frac{\pi}{2}=0$なので、右辺は$\pi P(0)=-\pi$である。
  target: |
    ∀ (n : ℕ) (P : Polynomial ℝ), n ≠ 0 → P.degree < 2 * n → IntervalIntegrable (fun x : ℝ => P.eval x * Real.sqrt ((1 - x ^ 2)⁻¹)) MeasureTheory.volume (-1) 1 ∧ ∫ x in (-1 : ℝ)..1, P.eval x * Real.sqrt ((1 - x ^ 2)⁻¹) = (Real.pi / n) * ∑ k ∈ Finset.range n, P.eval (Real.cos ((2 * k + 1) / (2 * n) * Real.pi))
  proof: |
    by
      intro n P hn hP
      refine ⟨Polynomial.Chebyshev.intervalIntegrable_sqrt_one_sub_sq_inv.continuousOn_mul (by fun_prop), ?_⟩
      rw [← Polynomial.Chebyshev.integral_measureT (fun x => P.eval x), Polynomial.Chebyshev.integral_eq_sumZeroes hn hP]
      simp [Polynomial.Chebyshev.sumZeroes]
- id: chebyshev_leading_coefficient_extremal
  kind: textbook
  level: 3
  topic: チェビシェフ多項式・最高次係数の極値性
  statement: $n$を正の整数、$P$を次数$n$以下の実係数多項式とする。$[-1,1]$で$|P|\leq 1$ならば、$P$の最高次係数は$2^{n-1}$以下である。この値は$T_n$で達成される。
  statement_en: Let n be a positive integer and P a real polynomial of degree at most n. If |P| ≤ 1 on [-1, 1], then the leading coefficient of P is at most 2^(n-1). This value is attained by T_n.
  assumptions:
  - $n\geq 1$
  - $\deg P\leq n$
  - $[-1,1]$で$|P|\leq 1$
  quantifiers:
  - 任意の正の整数$n$
  - 任意の実係数多項式$P$
  conclusion: |-
    $P$の最高次係数は$2^{n-1}$以下である。また$T_n$は$[-1,1]$で$|T_n|\leq 1$を満たし、最高次係数は$2^{n-1}$である。
  answer: |
    $n\geq 1$とし、$P$を次数$m\leq n$の実係数多項式で、$[-1,1]$で$|P|\leq 1$とする。$a$を$P$の最高次係数とする。$P=0$なら$a=0$で成り立つ。$m=0$なら$a=P\leq 1\leq 2^{n-1}$である。

    $m\geq 1$とする。$a\leq 2^{m-1}$を示せば、$2^{m-1}\leq 2^{n-1}$より主張を得る。$a>2^{m-1}$と仮定する。$\lambda=\frac{2^{m-1}}{a}$とおくと$0<\lambda<1$である。$R=T_m-\lambda P$は、$T_m$の最高次係数が$2^{m-1}$なので、次数が$m$未満である。

    $x_j=\cos\frac{j\pi}{m}$（$0\leq j\leq m$）とおくと、$x_0>x_1>\dots>x_m$であり、$T_m(x_j)=(-1)^j$である。$|\lambda P(x_j)|\leq\lambda<1$なので、$R(x_j)$の符号は$(-1)^j$である。中間値の定理により、$R$は隣り合う$x_j,x_{j+1}$の間に零点をもつので、相異なる$m$個の零点をもつ。次数が$m$未満なので$R=0$である。しかし$R(x_0)>0$なので矛盾である。

    $T_n$は$[-1,1]$で$|T_n|\leq 1$を満たし、最高次係数は$2^{n-1}$なので、この値は達成される。
  strategy: If the leading coefficient were larger, a difference with a scaled T_m would have too many sign changes.
  sketch:
  - 'case_split: Treat P = 0, degree 0 and degree m ≥ 1.'
  - 'contradiction: Assume the leading coefficient a exceeds 2^(m-1) and put λ = 2^(m-1)/a.'
  - 'derive: R = T_m - λP has degree below m.'
  - 'derive: At the points cos(jπ/m), R has the sign (-1)^j, so it has m distinct zeros.'
  - 'conclude: Thus R = 0, contradicting R(1) > 0, and T_n attains the bound.'
  openmath: (forall (n) (-> (and (in n N) (>= n 1)) (and (forall (p) (-> (and (real_polynomial p) (<= (poly_degree p) n) (forall (x) (-> (in x (closed_interval (neg 1) 1)) (<= (abs (poly_eval p x)) 1)))) (<= (poly_leading_coeff p) (^ 2 (- n 1))))) (<= (poly_degree (chebyshev_t R n)) n) (forall (x) (-> (in x (closed_interval (neg 1) 1)) (<= (abs (poly_eval (chebyshev_t R n) x)) 1))) (= (poly_leading_coeff (chebyshev_t R n)) (^ 2 (- n 1))))))
  hard_negative:
    statement: 同じ仮定で$P$の最高次係数は$1$以下である。
    reason: $P=T_2=2X^2-1$は$[-1,1]$で$|P|\leq 1$を満たすが、最高次係数は$2$である。
  target: |
    ∀ n : ℕ, 1 ≤ n → (∀ P : Polynomial ℝ, P.degree ≤ n → (∀ x ∈ Set.Icc (-1 : ℝ) 1, |P.eval x| ≤ 1) → P.leadingCoeff ≤ 2 ^ (n - 1)) ∧ (Polynomial.Chebyshev.T ℝ n).degree ≤ n ∧ (∀ x ∈ Set.Icc (-1 : ℝ) 1, |(Polynomial.Chebyshev.T ℝ n).eval x| ≤ 1) ∧ (Polynomial.Chebyshev.T ℝ n).leadingCoeff = 2 ^ (n - 1)
  proof: |
    by
      intro n hn
      refine ⟨fun P h1 h2 => Polynomial.Chebyshev.leadingCoeff_le_of_forall_abs_le_one h1 h2, ?_, ?_, ?_⟩
      · simp [Polynomial.Chebyshev.degree_T]
      · intro x hx
        exact Polynomial.Chebyshev.abs_eval_T_real_le_one (n : ℤ) (abs_le.mpr ⟨hx.1, hx.2⟩)
      · simpa using Polynomial.Chebyshev.leadingCoeff_T ℝ (n : ℤ)
