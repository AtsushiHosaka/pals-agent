- id: trig_polynomial_coefficients
  kind: gap
  level: 2
  topic: フーリエ級数・三角多項式の係数
  statement: $T>0$、$s$を整数の有限集合、$a_k\in\mathbb{C}$とする。周期$T$の三角多項式$P(x)=\sum_{k\in s}a_ke^{2\pi ikx/T}$について、$c_n(P)=\frac{1}{T}\int_0^TP(x)e^{-2\pi inx/T}\,dx$は、$n\in s$なら$a_n$であり、$n\notin s$なら$0$である。
  statement_en: Let T > 0, s a finite set of integers and a_k complex numbers. For the trigonometric polynomial P(x) = Σ_{k∈s} a_k e^(2πikx/T), the coefficient c_n(P), which is (1/T) times the integral of P(x) e^(-2πinx/T) over [0, T], equals a_n if n is in s and 0 otherwise.
  assumptions:
  - $T>0$
  - $s\subset\mathbb{Z}$は有限集合
  - $a_k\in\mathbb{C}$
  quantifiers:
  - 任意の$T>0$
  - 任意の有限集合$s$と係数$a$
  - 任意の$n\in\mathbb{Z}$
  conclusion: $n\in s$なら$c_n(P)=a_n$、$n\notin s$なら$c_n(P)=0$である。
  answer: |
    $T>0$、$s\subset\mathbb{Z}$を有限集合、$a_k\in\mathbb{C}$、$n\in\mathbb{Z}$とする。有限和なので項別に積分できて
    $c_n(P)=\sum_{k\in s}a_k\cdot\frac{1}{T}\int_0^Te^{2\pi i(k-n)x/T}\,dx$
    である。$k=n$なら被積分関数は$1$で、積分因子は$1$である。$k\neq n$なら原始関数$\frac{T}{2\pi i(k-n)}e^{2\pi i(k-n)x/T}$は$x=0$と$x=T$で同じ値をとるので、積分因子は$0$である。よって和に残るのは$k=n$の項だけであり、$n\in s$なら$a_n$、$n\notin s$なら$0$である。
  strategy: Integrate term by term and use the orthogonality of the exponentials.
  sketch:
  - 'setup: Interchange the finite sum and the integral.'
  - 'derive: For k = n the factor equals 1.'
  - 'derive: For k ≠ n the antiderivative is T-periodic, so the factor equals 0.'
  - 'conclude: Only the term k = n survives.'
  openmath: (forall (T s a n) (-> (and (> T 0) (in n Z)) (and (-> (in n s) (= (fourier_coeff_circle_fn T (lambda (x) (finset_sum s (lambda (k) (* (fn_value a k) (fourier_mode_circle T k x))))) n) (fn_value a n))) (-> (notin n s) (= (fourier_coeff_circle_fn T (lambda (x) (finset_sum s (lambda (k) (* (fn_value a k) (fourier_mode_circle T k x))))) n) 0)))))
  hard_negative:
    statement: 三角多項式$P$について、$n\notin s$でも$c_n(P)$は一般に$0$でない。
    reason: $k\neq n$の項の積分は$0$なので、$n\notin s$では$c_n(P)=0$である。たとえば$P=e_1$なら$c_2(P)=\frac{1}{T}\int_0^Te^{-2\pi ix/T}\,dx=0$である。
  target: |
    ∀ (T : ℝ) [hT : Fact (0 < T)] (s : Finset ℤ) (a : ℤ → ℂ) (n : ℤ), fourierCoeff (fun x : AddCircle T => ∑ k ∈ s, a k * fourier k x) n = if n ∈ s then a n else 0
  proof: |
    by
      intro T _ s a n
      have hint : ∀ k ∈ s, MeasureTheory.Integrable (fun x : AddCircle T => a k * fourier k x) AddCircle.haarAddCircle := by
        intro k _
        exact ((map_continuous (fourier k)).const_smul (a k)).integrable_of_hasCompactSupport (HasCompactSupport.of_compactSpace _)
      have h := congrFun (fourierCoeff.sum s (fun k (x : AddCircle T) => a k * fourier k x) hint) n
      have e : (∑ i ∈ s, fun x : AddCircle T => a i * fourier i x) = fun x : AddCircle T => ∑ k ∈ s, a k * fourier k x := by
        funext x; simp
      rw [e] at h
      rw [h, Finset.sum_apply]
      have hk : ∀ k ∈ s, fourierCoeff (fun x : AddCircle T => a k * fourier k x) n = if k = n then a n else 0 := by
        intro k _
        rw [fourierCoeff.const_mul, fourierCoeff_fourier]
        by_cases hkn : k = n
        · subst hkn; simp
        · simp [Pi.single_apply, Ne.symm hkn, hkn]
      rw [Finset.sum_congr rfl hk, Finset.sum_ite_eq' s n]
