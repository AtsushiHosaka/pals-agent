  answer: |
    $T>0$とし、$\mu$を全測度$1$の不変測度、$f$を可積分、$n\in\mathbb{Z}$とする。

    $f$が実数値のとき、$\overline{e_{-n}}=e_{n}$なので$\overline{c_n(f)}=\int\overline{e_{-n}f}\,d\mu=\int e_{n}f\,d\mu=c_{-n}(f)$である。

    $\mu$は$x\mapsto -x$で不変なので、$c_{-n}(f)=\int e_{n}(x)f(x)\,d\mu(x)=\int e_{n}(-x)f(-x)\,d\mu(x)=\int e_{-n}(x)f(-x)\,d\mu(x)$である。$f$が偶関数なら右辺は$c_n(f)$であり、奇関数なら右辺は$-c_n(f)$である。
  strategy: Conjugate the integral for real f, and substitute x ↦ -x for even or odd f.
  sketch:
  - 'case_split: Treat the real, even and odd cases separately.'
  - 'derive: For real f, conjugating the integral replaces e_(-n) by e_n.'
  - 'translate: The substitution x ↦ -x gives c_(-n)(f) as the integral of e_(-n)(x) f(-x).'
  - 'conclude: Evenness or oddness of f gives the stated relations.'
  openmath: (forall (T f) (-> (and (> T 0) (integrable_circle T f)) (and (-> (forall (x) (= (complex_conj (fn_value f x)) (fn_value f x))) (forall (n) (-> (in n Z) (= (fourier_coeff_circle T f (neg n)) (complex_conj (fourier_coeff_circle T f n)))))) (-> (forall (x) (= (fn_value f (neg x)) (fn_value f x))) (forall (n) (-> (in n Z) (= (fourier_coeff_circle T f (neg n)) (fourier_coeff_circle T f n))))) (-> (forall (x) (= (fn_value f (neg x)) (neg (fn_value f x)))) (forall (n) (-> (in n Z) (= (fourier_coeff_circle T f (neg n)) (neg (fourier_coeff_circle T f n)))))))))
