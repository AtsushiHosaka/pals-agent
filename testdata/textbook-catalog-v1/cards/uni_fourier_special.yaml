    ∀ (T : ℝ) [hT : Fact (0 < T)] (f g : AddCircle T → ℂ) (c : ℂ) (n : ℤ), MeasureTheory.Integrable f AddCircle.haarAddCircle → MeasureTheory.Integrable g AddCircle.haarAddCircle → fourierCoeff (fun x => c * f x + g x) n = c * fourierCoeff f n + fourierCoeff g n
  proof: |
    by
      intro T _ f g c n hf hg
      have h1 := congrFun (fourierCoeff.add (hf.const_mul c) hg) n
      rw [Pi.add_apply, fourierCoeff.const_mul f c n] at h1
      exact h1
