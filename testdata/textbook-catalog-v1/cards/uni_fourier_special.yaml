  statement_en: Bessel's inequality for Fourier coefficients. Let a < b, T = b - a and c_n(f) = (1/T) ∫_a^b f(x) e^(-2πinx/T) dx. If f is square integrable on (a, b], then for every finite set s of integers, Σ_{n∈s} |c_n(f)|² ≤ (1/T) ∫_a^b |f(x)|² dx.
  assumptions:
  - $a<b$
  - $f$は$(a,b]$で$2$乗可積分
  - $s\subset\mathbb{Z}$は有限集合
  quantifiers:
  - 任意の$a<b$
  - 任意の$f$
  - 任意の有限集合$s$
  conclusion: $\sum_{n\in s}|c_n(f)|^2\leq\frac{1}{T}\int_a^b|f(x)|^2\,dx$である。
  answer: |
    $a<b$、$T=b-a$とし、$f$を$(a,b]$で$2$乗可積分、$s\subset\mathbb{Z}$を有限集合とする。$e_n(x)=e^{2\pi inx/T}$、$\langle g,h\rangle=\frac{1}{T}\int_a^bg\overline{h}\,dx$とおくと、$\langle e_m,e_n\rangle$は$m=n$で$1$、$m\neq n$で$0$であり、$c_n(f)=\langle f,e_n\rangle$である。$g=f-\sum_{n\in s}c_n(f)e_n$とおき、内積を展開すると
    $0\leq\langle g,g\rangle=\langle f,f\rangle-2\sum_{n\in s}|c_n(f)|^2+\sum_{n\in s}|c_n(f)|^2=\langle f,f\rangle-\sum_{n\in s}|c_n(f)|^2$
    である。$\langle f,f\rangle=\frac{1}{T}\int_a^b|f|^2\,dx$なので主張を得る。
  strategy: Expand the nonnegative quantity ⟨g, g⟩ for f minus its finite Fourier sum.
  sketch:
  - 'setup: The exponentials are orthonormal for the normalized inner product and c_n(f) = ⟨f, e_n⟩.'
  - 'construct: Let g = f - Σ_{n∈s} c_n(f) e_n.'
  - 'derive: Expanding gives ⟨g, g⟩ = ⟨f, f⟩ - Σ_{n∈s} |c_n(f)|².'
  - 'conclude: Nonnegativity of ⟨g, g⟩ gives the inequality.'
  openmath: (forall (a b f s) (-> (and (< a b) (square_integrable_on f a b)) (<= (finset_sum s (lambda (n) (^ (abs (fourier_coeff_on f a b n)) 2))) (* (/ 1 (- b a)) (interval_integral a b (lambda (x) (^ (abs (fn_value f x)) 2)))))))
  hard_negative:
    statement: 同じ仮定で$\sum_{n\in s}|c_n(f)|^2=\frac{1}{T}\int_a^b|f(x)|^2\,dx$が任意の有限集合$s$で成り立つ。
    reason: 有限和では等号は一般に成り立たない。$a=0$、$b=1$、$f=e_0+e_1$、$s=\{0\}$とすると左辺は$1$、右辺は$2$である。
  target: |
    ∀ (a b : ℝ) (hab : a < b) (f : ℝ → ℂ) (s : Finset ℤ), MeasureTheory.MemLp f 2 (MeasureTheory.volume.restrict (Set.Ioc a b)) → ∑ n ∈ s, ‖fourierCoeffOn hab f n‖ ^ 2 ≤ (b - a)⁻¹ * ∫ x in a..b, ‖f x‖ ^ 2
  proof: |
    by
      intro a b hab f s hf
      have h := hasSum_sq_fourierCoeffOn hab hf
      exact sum_le_hasSum s (fun _ _ => by positivity) h
- id: riemann_lebesgue_interval_exponential
  kind: gap
  level: 4
  topic: フーリエ解析・区間上のリーマン＝ルベーグの補題
  statement: 区間上のリーマン＝ルベーグの補題。$a\leq b$とし、$f$を$[a,b]$上の可積分な複素数値関数とする。実数$\lambda$について$|\lambda|\to\infty$のとき$\int_a^bf(x)e^{i\lambda x}\,dx\to 0$である。
  statement_en: Riemann–Lebesgue lemma on an interval. Let a ≤ b and let f be an integrable complex function on [a, b]. As the real number λ satisfies |λ| → ∞, the integral of f(x) e^(iλx) over [a, b] tends to 0.
  assumptions:
  - $a\leq b$
  - $f$は$[a,b]$で可積分
  quantifiers:
  - 任意の$a\leq b$
  - 任意の可積分関数$f$
  conclusion: $|\lambda|\to\infty$で$\int_a^bf(x)e^{i\lambda x}\,dx\to 0$である。
  answer: |
    $a\leq b$とし、$f$を$[a,b]$で可積分とする。$\varepsilon>0$をとる。階段関数は$L^1$で稠密なので、$\int_a^b|f-g|\,dx<\varepsilon$となる階段関数$g=\sum_{j=1}^{m}\alpha_j1_{[c_j,d_j]}$がある。

    $|e^{i\lambda x}|=1$より、$\left|\int_a^b(f-g)e^{i\lambda x}\,dx\right|<\varepsilon$である。また$\lambda\neq 0$について
    $\left|\int_{c_j}^{d_j}e^{i\lambda x}\,dx\right|=\left|\frac{e^{i\lambda d_j}-e^{i\lambda c_j}}{i\lambda}\right|\leq\frac{2}{|\lambda|}$
    である。よって$\left|\int_a^bge^{i\lambda x}\,dx\right|\leq\frac{2}{|\lambda|}\sum_{j}|\alpha_j|$であり、$|\lambda|$が十分大きければこれは$\varepsilon$より小さい。

    したがって$|\lambda|$が十分大きければ$\left|\int_a^bfe^{i\lambda x}\,dx\right|<2\varepsilon$である。
  strategy: Approximate f in L¹ by step functions and integrate the exponential explicitly on intervals.
  sketch:
  - 'setup: Choose a step function g with ∫|f - g| < ε.'
  - 'derive: Since the exponential has modulus 1, replacing f by g changes the integral by less than ε.'
  - 'derive: On each interval, the integral of e^(iλx) has modulus at most 2/|λ|.'
  - 'conclude: So the integral of f e^(iλx) is below 2ε for large |λ|.'
  openmath: (forall (a b f) (-> (and (<= a b) (interval_integrable_fn f a b)) (tends_to_zero_at_infinity (lambda (l) (interval_integral a b (lambda (x) (* (exp (* (* l x) complex_i)) (fn_value f x))))))))
  hard_negative:
    statement: $f$が$[a,b]$で可積分なら、ある定数$C$があって$\left|\int_a^bf(x)e^{i\lambda x}\,dx\right|\leq C/|\lambda|$である。
    reason: 減衰の速さは一般に評価できない。$f(x)=|x|^{-1/2}1_{[-1,1]}(x)$では、積分は$|\lambda|^{-1/2}$と同程度であり、$C/|\lambda|$では抑えられない。
  target: |
    ∀ (a b : ℝ) (f : ℝ → ℂ), IntervalIntegrable f MeasureTheory.volume a b → a ≤ b → Filter.Tendsto (fun l : ℝ => ∫ x in a..b, Complex.exp (((l * x : ℝ) : ℂ) * Complex.I) * f x) (Filter.cocompact ℝ) (nhds 0)
  proof: |
    by
      intro a b f hf hab
      have h := Real.tendsto_integral_exp_smul_cocompact ((Set.Ioc a b).indicator f)
      have hm : Filter.Tendsto (fun l : ℝ => -(l / (2 * Real.pi))) (Filter.cocompact ℝ) (Filter.cocompact ℝ) := by
        have hc : (-(1 / (2 * Real.pi)) : ℝ) ≠ 0 := by
          have := Real.pi_pos
          simp [this.ne']
        have := Homeomorph.mulRight₀ (-(1 / (2 * Real.pi)) : ℝ) hc |>.isClosedEmbedding.tendsto_cocompact
        refine this.congr (fun l => ?_)
        simp
        ring
      have h2 := h.comp hm
      refine h2.congr (fun l => ?_)
      simp only [Function.comp, Circle.smul_def]
      rw [intervalIntegral.integral_of_le hab, ← MeasureTheory.integral_indicator measurableSet_Ioc]
      congr 1
      funext x
      rw [Real.fourierChar_apply, smul_eq_mul]
      by_cases hx : x ∈ Set.Ioc a b
      · simp only [Set.indicator_of_mem hx]
        congr 2
        have := Real.pi_pos
        push_cast
        field_simp
      · simp [Set.indicator_of_notMem hx]
- id: fourier_coeff_tendsto_zero_integrable
  kind: gap
  level: 4
  topic: フーリエ級数・係数の減衰
  statement: $a<b$、$T=b-a$、$c_n(f)=\frac{1}{T}\int_a^bf(x)e^{-2\pi inx/T}\,dx$とする。$f$が$[a,b]$で可積分ならば、$|n|\to\infty$で$c_n(f)\to 0$である。
  statement_en: Let a < b, T = b - a and c_n(f) = (1/T) ∫_a^b f(x) e^(-2πinx/T) dx. If f is integrable on [a, b], then c_n(f) → 0 as |n| → ∞.
  assumptions:
  - $a<b$
  - $f$は$[a,b]$で可積分
  quantifiers:
  - 任意の$a<b$
  - 任意の可積分関数$f$
  conclusion: $|n|\to\infty$で$c_n(f)\to 0$である。
  answer: |
    $a<b$、$T=b-a$とし、$f$を$[a,b]$で可積分とする。区間上のリーマン＝ルベーグの補題により、実数$\lambda$について$|\lambda|\to\infty$で$\int_a^bf(x)e^{i\lambda x}\,dx\to 0$である。$\lambda=-\frac{2\pi n}{T}$とおくと、$|n|\to\infty$で$|\lambda|\to\infty$である。よって$c_n(f)=\frac{1}{T}\int_a^bf(x)e^{i\lambda x}\,dx\to 0$である。
  strategy: Apply the Riemann–Lebesgue lemma on the interval with λ = -2πn/T.
  sketch:
  - 'apply_theorem: The Riemann–Lebesgue lemma on an interval gives decay of the integral of f e^(iλx) as |λ| → ∞.'
  - 'derive: Take λ = -2πn/T, which tends to infinity in absolute value with n.'
  - 'conclude: Hence c_n(f) → 0.'
  openmath: (forall (a b f) (-> (and (< a b) (interval_integrable_fn f a b)) (tends_to_zero_cofinite (lambda (n) (fourier_coeff_on f a b n)))))
  hard_negative:
    statement: $f$が$[a,b]$で可積分ならば、$\sum_{n\in\mathbb{Z}}|c_n(f)|$は有限である。
    reason: $f=1_{[0,1/2]}$、$a=0$、$b=1$とすると、奇数$n$で$|c_n(f)|=\frac{1}{\pi|n|}$となり、和は発散する。
  target: |
    ∀ (a b : ℝ) (hab : a < b) (f : ℝ → ℂ), IntervalIntegrable f MeasureTheory.volume a b → Filter.Tendsto (fun n : ℤ => fourierCoeffOn hab f n) Filter.cofinite (nhds 0)
  proof: |
    by
      intro a b hab f hf
      haveI : Fact (0 < b - a) := ⟨sub_pos.mpr hab⟩
      have hba : 0 < b - a := sub_pos.mpr hab
      have hbac : ((b - a : ℝ) : ℂ) ≠ 0 := by exact_mod_cast hba.ne'
      have h := Real.tendsto_integral_exp_smul_cocompact ((Set.Ioc a b).indicator f)
      have hm : Filter.Tendsto (fun n : ℤ => (n : ℝ) / (b - a)) Filter.cofinite (Filter.cocompact ℝ) := by
        have h1 : Filter.Tendsto (fun n : ℤ => (n : ℝ)) Filter.cofinite (Filter.cocompact ℝ) := Int.tendsto_coe_cofinite
        have hc : ((b - a)⁻¹ : ℝ) ≠ 0 := by positivity
        have h2 := (Homeomorph.mulRight₀ ((b - a)⁻¹ : ℝ) hc).isClosedEmbedding.tendsto_cocompact.comp h1
        refine h2.congr (fun n => ?_)
        simp [div_eq_mul_inv]
      have h3 := (h.comp hm).const_smul (((1 / (b - a) : ℝ)) : ℝ)
      simp only [smul_zero] at h3
      refine h3.congr (fun n => ?_)
      rw [fourierCoeffOn_eq_integral]
      simp only [Function.comp]
      congr 1
      rw [intervalIntegral.integral_of_le hab.le, ← MeasureTheory.integral_indicator measurableSet_Ioc]
      congr 1
      funext x
      by_cases hx : x ∈ Set.Ioc a b
      · simp only [Set.indicator_of_mem hx]
        rw [Circle.smul_def, Real.fourierChar_apply, fourier_coe_apply, smul_eq_mul, smul_eq_mul]
        congr 2
        push_cast
        push_cast at hbac
        field_simp
      · simp [Set.indicator_of_notMem hx]
- id: fourier_parseval_polarized
  kind: gap
  level: 4
  topic: フーリエ級数・パーセバルの等式の内積形
  statement: $T>0$とし、$\mathbb{R}/T\mathbb{Z}$に全測度$1$の不変測度$\mu$を入れ、$c_n(f)=\int e_{-n}f\,d\mu$、$e_n(x)=e^{2\pi inx/T}$とする。$f,g\in L^2(\mu)$について、級数$\sum_{n\in\mathbb{Z}}\overline{c_n(f)}\,c_n(g)$は無条件収束し、その和は$\int\overline{f}g\,d\mu$である。
  statement_en: Let T > 0, μ the invariant probability measure on ℝ/Tℤ, c_n(f) the integral of e_(-n) f and e_n(x) = e^(2πinx/T). For f, g in L²(μ), the series Σ_{n∈ℤ} conj(c_n(f)) c_n(g) converges unconditionally to the integral of conj(f) g.
  assumptions:
  - $T>0$
  - $f,g\in L^2(\mu)$
  quantifiers:
  - 任意の$T>0$
  - 任意の$f,g\in L^2(\mu)$
  conclusion: $\sum_{n\in\mathbb{Z}}\overline{c_n(f)}\,c_n(g)=\int\overline{f}g\,d\mu$であり、級数は無条件収束する。
  answer: |
    $T>0$とし、$\mu$を全測度$1$の不変測度とする。$L^2(\mu)$の内積を$\langle f,g\rangle=\int\overline{f}g\,d\mu$とする。$(e_n)_{n\in\mathbb{Z}}$は$L^2(\mu)$の完全正規直交系であり、$c_n(f)=\langle e_n,f\rangle$である。

    パーセバルの等式により、任意の$h\in L^2(\mu)$について$\sum_{n}|c_n(h)|^2=\|h\|^2$である。特に$(c_n(f))$と$(c_n(g))$は$2$乗総和可能であり、コーシー＝シュワルツの不等式から$\sum_n\overline{c_n(f)}c_n(g)$は絶対収束する。したがって無条件収束する。

    等式は分極恒等式から従う。$\langle\cdot,\cdot\rangle$は第2変数について線形なので、$\|f+i^kg\|^2=\|f\|^2+\|g\|^2+i^{k}\langle f,g\rangle+i^{-k}\langle g,f\rangle$である。$\sum_{k=0}^{3}i^{-k}=0$、$\sum_{k=0}^{3}i^{-2k}=0$より$\langle f,g\rangle=\frac{1}{4}\sum_{k=0}^{3}i^{-k}\|f+i^kg\|^2$である。$c_n$は線形なので、複素数$c_n(f),c_n(g)$に同じ計算をすると$\overline{c_n(f)}c_n(g)=\frac{1}{4}\sum_{k=0}^{3}i^{-k}|c_n(f+i^kg)|^2$である。各$h=f+i^kg$にパーセバルの等式を適用して足し合わせれば主張を得る。
  strategy: Polarize Parseval's identity for the orthonormal basis of exponentials.
  sketch:
  - 'setup: The exponentials form a complete orthonormal system of L²(μ) with c_n(f) = ⟨e_n, f⟩.'
  - 'derive: Parseval makes the coefficient sequences square summable, so the product series converges absolutely.'
  - 'apply_theorem: Polarization expresses ⟨f, g⟩ through the norms of f + i^k g.'
  - 'derive: The same identity holds for the coefficients.'
  - 'conclude: Applying Parseval to each f + i^k g gives the formula.'
  openmath: (forall (T f g) (-> (and (> T 0) (in f (l2_circle_space T)) (in g (l2_circle_space T))) (has_sum_fn (lambda (n) (* (complex_conj (fourier_coeff_circle T f n)) (fourier_coeff_circle T g n))) (integral_circle T (lambda (x) (* (complex_conj (fn_value f x)) (fn_value g x)))))))
  hard_negative:
    statement: $f,g\in L^2(\mu)$について$\sum_{n}c_n(f)c_n(g)=\int fg\,d\mu$である。
    reason: $f=g=e_1$とすると$\sum_nc_n(f)c_n(g)=1$であるが、$\int e_1^2\,d\mu=\int e_2\,d\mu=0$である。共役が必要である。
  target: |
    ∀ (T : ℝ) [hT : Fact (0 < T)] (f g : MeasureTheory.Lp ℂ 2 (AddCircle.haarAddCircle (T := T))), HasSum (fun n : ℤ => (starRingEnd ℂ) (fourierCoeff f n) * fourierCoeff g n) (∫ t, (starRingEnd ℂ) (f t) * g t ∂AddCircle.haarAddCircle)
  proof: |
    by
      intro T _ f g
      have e : ∫ t, (starRingEnd ℂ) (f t) * g t ∂AddCircle.haarAddCircle = inner ℂ f g := by
        rw [MeasureTheory.L2.inner_def]
        congr 1
        funext t
        rw [RCLike.inner_apply, mul_comm]
      rw [e]
      refine HasSum.congr_fun ((fourierBasis (T := T)).hasSum_inner_mul_inner f g) (fun n => ?_)
      simp only [← fourierBasis_repr, HilbertBasis.repr_apply_apply, inner_conj_symm, mul_comm (inner ℂ f _)]
- id: fourier_series_l2_convergence
  kind: textbook
  level: 4
  topic: フーリエ級数・L2収束
  statement: $T>0$とし、$\mathbb{R}/T\mathbb{Z}$に全測度$1$の不変測度$\mu$を入れ、$c_n(f)=\int e_{-n}f\,d\mu$、$e_n(x)=e^{2\pi inx/T}$とする。$f\in L^2(\mu)$のフーリエ級数$\sum_{n\in\mathbb{Z}}c_n(f)e_n$は$L^2(\mu)$のノルムで$f$に無条件収束する。各点収束は主張しない。
  statement_en: Let T > 0, μ the invariant probability measure on ℝ/Tℤ, c_n(f) the integral of e_(-n) f and e_n(x) = e^(2πinx/T). For f in L²(μ), the Fourier series Σ_{n∈ℤ} c_n(f) e_n converges unconditionally to f in the norm of L²(μ). No pointwise convergence is claimed.
  assumptions:
  - $T>0$
  - $f\in L^2(\mu)$
  quantifiers:
  - 任意の$T>0$
  - 任意の$f\in L^2(\mu)$
  conclusion: $\sum_{n\in\mathbb{Z}}c_n(f)e_n$は$L^2(\mu)$で$f$に無条件収束する。
  answer: |
    $T>0$、$f\in L^2(\mu)$とする。$(e_n)$は$L^2(\mu)$の正規直交系である。ベッセルの不等式より$\sum_n|c_n(f)|^2\leq\|f\|^2$なので、$L^2(\mu)$の完備性と直交性から$g=\sum_nc_n(f)e_n$は無条件収束する。$c_n(g)=c_n(f)$なので、$h=f-g$はすべての$e_n$と直交する。

    $(e_n)$の線形包が$L^2(\mu)$で稠密であることを示す。ストーン＝ワイエルシュトラスの定理により、三角多項式は連続関数全体の中で一様ノルムについて稠密である。一様収束は$L^2(\mu)$収束を導く。連続関数は$L^2(\mu)$で稠密である。

    $h$は三角多項式と直交するので、稠密性から$h$は$L^2(\mu)$全体と直交する。よって$h=0$であり、$f=g$である。
  strategy: Bessel's inequality gives convergence, and density of trigonometric polynomials identifies the limit with f.
  sketch:
  - 'setup: The exponentials are orthonormal, so Bessel''s inequality and completeness give convergence of the series to some g.'
  - 'derive: The difference h = f - g is orthogonal to every e_n.'
  - 'apply_theorem: Stone–Weierstrass makes trigonometric polynomials dense in continuous functions, hence in L²(μ).'
  - 'conclude: So h = 0 and the series converges to f.'
  openmath: (forall (T f) (-> (and (> T 0) (in f (l2_circle_space T))) (series_converges_l2_circle T f)))
  hard_negative:
    statement: $f\in L^2(\mu)$のフーリエ級数は、すべての点で$f$に収束する。
    reason: $L^2$の元はほとんどいたるところでしか定まらないので、すべての点での値に意味がない。連続関数に限っても、フーリエ級数が発散する点をもつ例がある（デュ・ボア＝レーモンの例）。
  target: |
    ∀ (T : ℝ) [hT : Fact (0 < T)] (f : MeasureTheory.Lp ℂ 2 (AddCircle.haarAddCircle (T := T))), HasSum (fun n : ℤ => fourierCoeff f n • fourierLp 2 n) f
  proof: |
    by
      intro T _ f
      exact hasSum_fourier_series_L2 f
- id: fourier_uniqueness_continuous
  kind: gap
  level: 3
  topic: フーリエ級数・係数による一意性
  statement: $T>0$とし、$\mathbb{R}/T\mathbb{Z}$上の連続関数$f,g$がすべての整数$n$について$c_n(f)=c_n(g)$を満たすならば、$f=g$である。ここで$c_n(f)=\int e_{-n}f\,d\mu$、$\mu$は全測度$1$の不変測度、$e_n(x)=e^{2\pi inx/T}$である。
  statement_en: Let T > 0. If continuous functions f, g on ℝ/Tℤ satisfy c_n(f) = c_n(g) for all integers n, then f = g. Here c_n(f) is the integral of e_(-n) f, μ is the invariant probability measure and e_n(x) = e^(2πinx/T).
  assumptions:
  - $T>0$
  - $f,g$は$\mathbb{R}/T\mathbb{Z}$上で連続
  - すべての整数$n$で$c_n(f)=c_n(g)$
  quantifiers:
  - 任意の$T>0$
  - 任意の連続関数$f,g$
  conclusion: $f=g$である。
  answer: |
    $T>0$とし、$f,g$を連続、すべての$n$で$c_n(f)=c_n(g)$とする。$h=f-g$とおくと、$h$は連続で$\int e_{-n}h\,d\mu=0$がすべての$n$で成り立つ。よって$h$は任意の三角多項式$P$について$\int\overline{P}h\,d\mu=0$を満たす。

    ストーン＝ワイエルシュトラスの定理により、一様ノルムで$h$に収束する三角多項式の列$P_k$がある。$h$は有界なので$\int\overline{P_k}h\,d\mu\to\int|h|^2\,d\mu$である。左辺は常に$0$なので$\int|h|^2\,d\mu=0$である。$|h|^2$は連続で非負であり、$\mu$は空でない開集合に正の測度を与えるので、$h=0$である。
  strategy: Show the difference is orthogonal to itself by uniform approximation with trigonometric polynomials.
  sketch:
  - 'setup: Let h = f - g, which is continuous and has all Fourier coefficients zero.'
  - 'derive: So h is orthogonal to all trigonometric polynomials.'
  - 'apply_theorem: Stone–Weierstrass gives trigonometric polynomials P_k converging uniformly to h.'
  - 'derive: Taking limits gives the integral of |h|² equal to 0.'
  - 'conclude: Continuity forces h = 0.'
  openmath: (forall (T f g) (-> (and (> T 0) (continuous_circle_function T f) (continuous_circle_function T g) (forall (n) (-> (in n Z) (= (fourier_coeff_circle T f n) (fourier_coeff_circle T g n))))) (= f g)))
  hard_negative:
    statement: $\mathbb{R}/T\mathbb{Z}$上の可積分関数$f,g$がすべての$n$で$c_n(f)=c_n(g)$を満たすならば、すべての点で$f=g$である。
    reason: 可積分関数では$1$点の値を変えても係数は変わらない。$f=0$と、$1$点でだけ$1$をとる$g$は係数がすべて$0$であるが、$f\neq g$である。
  target: |
    ∀ (T : ℝ) [hT : Fact (0 < T)] (f g : C(AddCircle T, ℂ)), (∀ n : ℤ, fourierCoeff f n = fourierCoeff g n) → f = g
  proof: |
    by
      intro T _ f g h
      have hint : ∀ u : C(AddCircle T, ℂ), MeasureTheory.Integrable u AddCircle.haarAddCircle := fun u => u.continuous.integrable_of_hasCompactSupport (HasCompactSupport.of_compactSpace _)
      have h0 : ∀ n : ℤ, fourierCoeff ((f - g : C(AddCircle T, ℂ)) : AddCircle T → ℂ) n = 0 := by
        intro n
        have e : ((f - g : C(AddCircle T, ℂ)) : AddCircle T → ℂ) = (f : AddCircle T → ℂ) + (fun x => (-1 : ℂ) * g x) := by
          funext x; simp; ring
        rw [e, fourierCoeff.add (hint f) ((hint g).const_mul _), Pi.add_apply, fourierCoeff.const_mul, h n]
        ring
      have hs : Summable (fourierCoeff ((f - g : C(AddCircle T, ℂ)) : AddCircle T → ℂ)) := by
        have : fourierCoeff ((f - g : C(AddCircle T, ℂ)) : AddCircle T → ℂ) = 0 := funext h0
        rw [this]; exact summable_zero
      have hsum := hasSum_fourier_series_of_summable hs
      have : (f - g : C(AddCircle T, ℂ)) = 0 := by
        refine hsum.unique ?_
        have : (fun i : ℤ => fourierCoeff ((f - g : C(AddCircle T, ℂ)) : AddCircle T → ℂ) i • (fourier i : C(AddCircle T, ℂ))) = 0 := by
          funext i; rw [h0 i, zero_smul]; rfl
        rw [this]; exact hasSum_zero
      exact sub_eq_zero.mp this
- id: trig_polynomials_uniformly_dense
  kind: textbook
  level: 3
  topic: フーリエ級数・三角多項式の稠密性
  statement: $T>0$とする。$\mathbb{R}/T\mathbb{Z}$上の連続関数$f$と$\varepsilon>0$に対して、三角多項式$P(x)=\sum_{k\in s}a_ke^{2\pi ikx/T}$（$s\subset\mathbb{Z}$は有限集合）があり、すべての$x$で$|f(x)-P(x)|<\varepsilon$である。
  statement_en: Let T > 0. For a continuous function f on ℝ/Tℤ and ε > 0, there is a trigonometric polynomial P(x) = Σ_{k∈s} a_k e^(2πikx/T), with s a finite set of integers, such that |f(x) - P(x)| < ε for all x.
  assumptions:
  - $T>0$
  - $f$は$\mathbb{R}/T\mathbb{Z}$上で連続
  - $\varepsilon>0$
  quantifiers:
  - 任意の$T>0$
  - 任意の連続関数$f$
  - 任意の$\varepsilon>0$
  conclusion: すべての$x$で$|f(x)-P(x)|<\varepsilon$となる三角多項式$P$が存在する。
  answer: |
    $T>0$とし、$X=\mathbb{R}/T\mathbb{Z}$とおく。$X$はコンパクトハウスドルフ空間である。三角多項式全体$A$は連続関数環$C(X,\mathbb{C})$の部分代数である。実際$e_me_n=e_{m+n}$である。$A$は定数関数$e_0=1$を含み、$\overline{e_n}=e_{-n}$なので複素共役で閉じる。$e_1$は$X$の相異なる2点を分離する。

    複素版のストーン＝ワイエルシュトラスの定理により、$A$は$C(X,\mathbb{C})$で一様ノルムについて稠密である。これが主張である。
  strategy: Apply the complex Stone–Weierstrass theorem to the algebra of trigonometric polynomials.
  sketch:
  - 'setup: The circle is compact Hausdorff.'
  - 'derive: Trigonometric polynomials form a subalgebra containing constants, closed under conjugation.'
  - 'derive: The mode e_1 separates points.'
  - 'apply_theorem: The complex Stone–Weierstrass theorem gives uniform density.'
  - 'conclude: Hence the required polynomial exists.'
  openmath: (forall (T f e) (-> (and (> T 0) (continuous_circle_function T f) (> e 0)) (exists (s a) (forall (x) (< (abs (- (fn_value f x) (finset_sum s (lambda (k) (* (fn_value a k) (fourier_mode_circle T k x)))))) e)))))
  hard_negative:
    statement: $\mathbb{R}/T\mathbb{Z}$上の連続関数は、そのフーリエ級数の部分和で一様に近似できる。
    reason: 連続関数のフーリエ級数の部分和は一様収束するとは限らず、発散する点をもつ例もある。稠密性で得られる三角多項式の係数は、一般にフーリエ係数と異なる。
  target: |
    ∀ (T : ℝ) [hT : Fact (0 < T)] (f : C(AddCircle T, ℂ)) (ε : ℝ), 0 < ε → ∃ (s : Finset ℤ) (a : ℤ → ℂ), ∀ x : AddCircle T, ‖f x - ∑ k ∈ s, a k * fourier k x‖ < ε
  proof: |
    by
      intro T _ f ε hε
      have hc : f ∈ (Submodule.span ℂ (Set.range (fourier (T := T)))).topologicalClosure := by
        rw [span_fourier_closure_eq_top]; trivial
      have hc' : f ∈ closure ((Submodule.span ℂ (Set.range (fourier (T := T))) : Submodule ℂ C(AddCircle T, ℂ)) : Set C(AddCircle T, ℂ)) := by
        rw [← Submodule.topologicalClosure_coe]; exact hc
      obtain ⟨g, hg, hd⟩ := Metric.mem_closure_iff.mp hc' ε hε
      obtain ⟨c, hc2⟩ := (Finsupp.mem_span_range_iff_exists_finsupp).mp hg
      refine ⟨c.support, c, fun x => ?_⟩
      have e : ∑ k ∈ c.support, c k * fourier k x = g x := by
        rw [← hc2, Finsupp.sum, ContinuousMap.coe_sum, Finset.sum_apply]
        rfl
      rw [e]
      rw [dist_eq_norm] at hd
      exact lt_of_le_of_lt ((f - g).norm_coe_le_norm x) hd
- id: dirichlet_kernel_closed_form
  kind: gap
  level: 2
  topic: フーリエ級数・ディリクレ核
  statement: 非負整数$N$と$\sin\frac{x}{2}\neq 0$を満たす実数$x$について、ディリクレ核は$1+2\sum_{k=1}^{N}\cos kx=\dfrac{\sin\left(N+\frac{1}{2}\right)x}{\sin\frac{x}{2}}$と表される。
  statement_en: For a nonnegative integer N and a real x with sin(x/2) ≠ 0, the Dirichlet kernel satisfies 1 + 2 Σ_{k=1}^{N} cos(kx) = sin((N + 1/2) x) / sin(x/2).
  assumptions:
  - $N$は非負整数
  - $\sin\frac{x}{2}\neq 0$
  quantifiers:
  - 任意の非負整数$N$
  - 任意の実数$x$
  conclusion: $1+2\sum_{k=1}^{N}\cos kx=\dfrac{\sin\left(N+\frac{1}{2}\right)x}{\sin\frac{x}{2}}$である。
  answer: |
    $x$を$\sin\frac{x}{2}\neq 0$を満たす実数とする。積和公式より、$k\geq 1$で
    $2\cos kx\,\sin\frac{x}{2}=\sin\left(k+\frac{1}{2}\right)x-\sin\left(k-\frac{1}{2}\right)x$
    である。$k=1$から$N$まで足すと、右辺は$\sin\left(N+\frac{1}{2}\right)x-\sin\frac{x}{2}$である。両辺に$\sin\frac{x}{2}$を足すと
    $\left(1+2\sum_{k=1}^{N}\cos kx\right)\sin\frac{x}{2}=\sin\left(N+\frac{1}{2}\right)x$
    である。$\sin\frac{x}{2}$で割れば主張を得る。
  strategy: Multiply by sin(x/2) and telescope with the product-to-sum formula.
  sketch:
  - 'setup: Multiply the left side by sin(x/2).'
  - 'derive: The product-to-sum formula gives 2 cos(kx) sin(x/2) = sin((k+1/2)x) - sin((k-1/2)x).'
  - 'derive: The sum telescopes to sin((N+1/2)x) - sin(x/2).'
  - 'conclude: Adding sin(x/2) and dividing gives the formula.'
  openmath: (forall (M x) (-> (and (in M N) (!= (sin (/ x 2)) 0)) (= (+ 1 (* 2 (range_sum M (lambda (k) (cos (* (+ k 1) x)))))) (/ (sin (* (+ M (/ 1 2)) x)) (sin (/ x 2))))))
  hard_negative:
    statement: $\sin\frac{x}{2}\neq 0$のとき$1+2\sum_{k=1}^{N}\cos kx=\dfrac{\sin Nx}{\sin\frac{x}{2}}$である。
    reason: $N=0$とすると左辺は$1$であるが、右辺は$0$である。
  target: |
    ∀ (N : ℕ) (x : ℝ), Real.sin (x / 2) ≠ 0 → 1 + 2 * ∑ k ∈ Finset.range N, Real.cos (((k : ℝ) + 1) * x) = Real.sin (((N : ℝ) + 1 / 2) * x) / Real.sin (x / 2)
  proof: |
    by
      intro N x hx
      rw [eq_div_iff hx]
      induction N with
      | zero => simp; ring_nf
      | succ N ih =>
        rw [Finset.sum_range_succ, mul_add, ← add_assoc, add_mul, ih]
        have h1 : Real.sin (((N + 1 : ℕ) + 1 / 2 : ℝ) * x) = Real.sin ((((N : ℝ) + 1) * x) + x / 2) := by
          push_cast; ring_nf
        have h2 : Real.sin (((N : ℝ) + 1 / 2) * x) = Real.sin ((((N : ℝ) + 1) * x) - x / 2) := by
          ring_nf
        rw [h1, h2, Real.sin_add, Real.sin_sub]
        ring
- id: dirichlet_kernel_integral
  kind: gap
  level: 2
  topic: フーリエ級数・ディリクレ核の積分
  statement: 非負整数$N$と実数$a$について$\int_a^{a+2\pi}\left(1+2\sum_{k=1}^{N}\cos kx\right)dx=2\pi$である。
  statement_en: For a nonnegative integer N and a real a, the integral of 1 + 2 Σ_{k=1}^{N} cos(kx) over [a, a + 2π] equals 2π.
  assumptions:
  - $N$は非負整数
  - $a\in\mathbb{R}$
  quantifiers:
  - 任意の非負整数$N$
  - 任意の実数$a$
  conclusion: $\int_a^{a+2\pi}\left(1+2\sum_{k=1}^{N}\cos kx\right)dx=2\pi$である。
  answer: |
    $N$を非負整数、$a$を実数とする。有限和なので項別に積分できる。定数$1$の積分は$2\pi$である。$k\geq 1$について$\int_a^{a+2\pi}\cos kx\,dx=\frac{\sin k(a+2\pi)-\sin ka}{k}=0$である。$\sin$は周期$2\pi$をもち、$k$は整数だからである。よって積分は$2\pi$である。
  strategy: Integrate term by term; each cosine term vanishes over a full period.
  sketch:
  - 'setup: Integrate the finite sum term by term.'
  - 'derive: The constant term contributes 2π.'
  - 'derive: Each cos(kx) integrates to (sin(k(a+2π)) - sin(ka))/k = 0.'
  - 'conclude: The total is 2π.'
  openmath: (forall (M a) (-> (and (in M N) (in a R)) (= (interval_integral a (+ a (* 2 pi)) (lambda (x) (+ 1 (* 2 (range_sum M (lambda (k) (cos (* (+ k 1) x)))))))) (* 2 pi))))
  hard_negative:
    statement: $\int_a^{a+2\pi}\left|1+2\sum_{k=1}^{N}\cos kx\right|dx$も$N$によらず$2\pi$である。
    reason: ディリクレ核は符号を変えるので、絶対値の積分は$2\pi$より大きい。実際、この値は$N\to\infty$で$\log N$の程度で発散する。
  target: |
    ∀ (N : ℕ) (a : ℝ), ∫ x in a..(a + 2 * Real.pi), (1 + 2 * ∑ k ∈ Finset.range N, Real.cos (((k : ℝ) + 1) * x)) = 2 * Real.pi
  proof: |
    by
      intro N a
      rw [intervalIntegral.integral_add (by simp) (by apply Continuous.intervalIntegrable; fun_prop)]
      rw [intervalIntegral.integral_const_mul, intervalIntegral.integral_finset_sum (fun i _ => by apply Continuous.intervalIntegrable; fun_prop)]
      have : ∀ k ∈ Finset.range N, ∫ x in a..(a + 2 * Real.pi), Real.cos (((k : ℝ) + 1) * x) = 0 := by
        intro k _
        have hk : ((k : ℝ) + 1) ≠ 0 := by positivity
        rw [intervalIntegral.integral_comp_mul_left _ hk, integral_cos]
        have e : ((k : ℝ) + 1) * (a + 2 * Real.pi) = ((k : ℝ) + 1) * a + ((k + 1 : ℕ) : ℝ) * (2 * Real.pi) := by push_cast; ring
        rw [e, Real.sin_add_nat_mul_two_pi]
        simp
      rw [Finset.sum_eq_zero this]
      simp
- id: fejer_kernel_closed_form
  kind: gap
  level: 2
  topic: フーリエ級数・フェイェール核
  statement: |-
    $D_n(x)=1+2\sum_{k=1}^{n}\cos kx$をディリクレ核とする。非負整数$N$と実数$x$について、$S_N(x)=\sum_{n=0}^{N-1}D_n(x)$（フェイェール核の$N$倍。空和は$0$とする）は、$\sin\frac{x}{2}\neq 0$のとき$\left(\dfrac{\sin\frac{Nx}{2}}{\sin\frac{x}{2}}\right)^2$に等しく、すべての実数$x$で$0$以上である。
  statement_en: |-
    Let D_n(x) = 1 + 2 Σ_{k=1}^{n} cos(kx) be the Dirichlet kernel. For a nonnegative integer N and real x, the sum S_N(x) = Σ_{n=0}^{N-1} D_n(x), which is N times the Fejér kernel and is 0 when empty, equals (sin(Nx/2) / sin(x/2))² whenever sin(x/2) ≠ 0, and S_N(x) ≥ 0 for every real x.
  assumptions:
  - '$N$は非負整数'
  - '$x\in\mathbb{R}$'
  quantifiers:
  - '任意の非負整数$N$'
  - '任意の実数$x$'
  conclusion: |-
    $\sin\frac{x}{2}\neq 0$のとき$S_N(x)=\left(\dfrac{\sin\frac{Nx}{2}}{\sin\frac{x}{2}}\right)^2$であり、すべての実数$x$で$S_N(x)\geq 0$である。
  answer: |
    $N$を非負整数、$x$を実数とし、$D_n(x)=1+2\sum_{k=1}^{n}\cos kx$、$S_N(x)=\sum_{n=0}^{N-1}D_n(x)$とおく。

    $\sin\frac{x}{2}\neq 0$とする。積和公式$2\cos kx\,\sin\frac{x}{2}=\sin\left(k+\frac{1}{2}\right)x-\sin\left(k-\frac{1}{2}\right)x$を$k=1$から$n$まで足すと、$D_n(x)\sin\frac{x}{2}=\sin\left(n+\frac{1}{2}\right)x$である。さらに積和公式より
    $D_n(x)\sin^2\frac{x}{2}=\sin\left(n+\frac{1}{2}\right)x\,\sin\frac{x}{2}=\frac{1}{2}\left(\cos nx-\cos(n+1)x\right)$
    である。$n=0$から$N-1$まで足すと、右辺は$\frac{1}{2}(1-\cos Nx)=\sin^2\frac{Nx}{2}$である。両辺を$\sin^2\frac{x}{2}$で割ると
    $S_N(x)=\left(\frac{\sin\frac{Nx}{2}}{\sin\frac{x}{2}}\right)^2\geq 0$
    である。

    $\sin\frac{x}{2}=0$とする。このとき$x$は$2\pi$の整数倍なので、すべての整数$k$で$\cos kx=1$である。よって$D_n(x)=2n+1>0$であり、$S_N(x)\geq 0$である。
  strategy: |-
    Multiply by sin²(x/2) and telescope to get the square, and treat the points x in 2πZ separately for nonnegativity.
  sketch:
  - 'setup: Telescoping gives D_n(x) sin(x/2) = sin((n+1/2)x) when sin(x/2) ≠ 0.'
  - 'derive: The product-to-sum formula gives D_n(x) sin²(x/2) = (cos(nx) - cos((n+1)x))/2.'
  - 'derive: The sum over n telescopes to (1 - cos(Nx))/2 = sin²(Nx/2).'
  - 'derive: Dividing by sin²(x/2) gives the square, which is nonnegative.'
  - 'case_split: If sin(x/2) = 0, then x is in 2πZ and D_n(x) = 2n + 1 > 0.'
  - 'conclude: So S_N(x) ≥ 0 for every real x.'
  openmath: (forall (M x) (-> (and (in M N) (in x R)) (and (-> (!= (sin (/ x 2)) 0) (= (range_sum M (lambda (n) (+ 1 (* 2 (range_sum n (lambda (k) (cos (* (+ k 1) x)))))))) (^ (/ (sin (/ (* M x) 2)) (sin (/ x 2))) 2))) (>= (range_sum M (lambda (n) (+ 1 (* 2 (range_sum n (lambda (k) (cos (* (+ k 1) x)))))))) 0))))
  hard_negative:
    statement: ディリクレ核$D_n$自身も、すべての$x$で非負である。
    reason: $n=1$、$x=\pi$とすると$D_1(\pi)=1+2\cos\pi=-1$である。
  target: |
    ∀ (N : ℕ) (x : ℝ), (Real.sin (x / 2) ≠ 0 → ∑ n ∈ Finset.range N, (1 + 2 * ∑ k ∈ Finset.range n, Real.cos (((k : ℝ) + 1) * x)) = (Real.sin ((N : ℝ) * x / 2) / Real.sin (x / 2)) ^ 2) ∧ 0 ≤ ∑ n ∈ Finset.range N, (1 + 2 * ∑ k ∈ Finset.range n, Real.cos (((k : ℝ) + 1) * x))
  proof: |
    by
      intro N x
      have hclosed : Real.sin (x / 2) ≠ 0 → ∑ n ∈ Finset.range N, (1 + 2 * ∑ k ∈ Finset.range n, Real.cos (((k : ℝ) + 1) * x)) = (Real.sin ((N : ℝ) * x / 2) / Real.sin (x / 2)) ^ 2 := by
        intro hx
        have hD : ∀ n : ℕ, 1 + 2 * ∑ k ∈ Finset.range n, Real.cos (((k : ℝ) + 1) * x) = Real.sin (((n : ℝ) + 1 / 2) * x) / Real.sin (x / 2) := by
          intro n
          rw [eq_div_iff hx]
          induction n with
          | zero => simp; ring_nf
          | succ n ih =>
            rw [Finset.sum_range_succ, mul_add, ← add_assoc, add_mul, ih]
            have h1 : Real.sin (((n + 1 : ℕ) + 1 / 2 : ℝ) * x) = Real.sin ((((n : ℝ) + 1) * x) + x / 2) := by
              push_cast; ring_nf
            have h2 : Real.sin (((n : ℝ) + 1 / 2) * x) = Real.sin ((((n : ℝ) + 1) * x) - x / 2) := by
              ring_nf
            rw [h1, h2, Real.sin_add, Real.sin_sub]
            ring
        simp only [hD]
        induction N with
        | zero => simp
        | succ N ih =>
          rw [Finset.sum_range_succ, ih, div_pow, div_pow]
          have h1 : Real.sin (((N + 1 : ℕ) : ℝ) * x / 2) = Real.sin ((N : ℝ) * x / 2 + x / 2) := by
            push_cast; ring_nf
          have h2 : Real.sin (((N : ℝ) + 1 / 2) * x) = Real.sin ((N : ℝ) * x / 2 + ((N : ℝ) * x / 2 + x / 2)) := by
            ring_nf
          rw [h1, h2, Real.sin_add ((N : ℝ) * x / 2) ((N : ℝ) * x / 2 + x / 2), Real.sin_add ((N : ℝ) * x / 2) (x / 2), Real.cos_add ((N : ℝ) * x / 2) (x / 2)]
          have hc := Real.sin_sq_add_cos_sq (x / 2)
          field_simp
          linear_combination (-(Real.sin ((N : ℝ) * x / 2)) ^ 2) * hc
      refine ⟨hclosed, ?_⟩
      by_cases hx : Real.sin (x / 2) = 0
      · obtain ⟨m, hm⟩ := Real.sin_eq_zero_iff.mp hx
        have hcos : ∀ k : ℕ, Real.cos (((k : ℝ) + 1) * x) = 1 := by
          intro k
          have e : ((k : ℝ) + 1) * x = (((k : ℤ) + 1) * m : ℤ) * (2 * Real.pi) := by
            have hxm : x = 2 * ((m : ℝ) * Real.pi) := by linarith
            rw [hxm]
            push_cast
            ring
          rw [e, Real.cos_int_mul_two_pi]
        refine Finset.sum_nonneg (fun n _ => ?_)
        simp only [hcos]
        positivity
      · rw [hclosed hx]
        positivity
- id: fourier_partial_sum_as_kernel_integral
  kind: gap
  level: 2
  topic: フーリエ級数・部分和の積分表示
  statement: $f$を$[-\pi,\pi]$で可積分な複素数値関数とし、$c_n=\frac{1}{2\pi}\int_{-\pi}^{\pi}e^{-int}f(t)\,dt$とする。非負整数$N$と実数$x$について$\sum_{n=-N}^{N}c_ne^{inx}=\frac{1}{2\pi}\int_{-\pi}^{\pi}f(t)\left(\sum_{n=-N}^{N}e^{in(x-t)}\right)dt$である。
  statement_en: Let f be an integrable complex function on [-π, π] and c_n = (1/(2π)) ∫ e^(-int) f(t) dt over [-π, π]. For a nonnegative integer N and a real x, Σ_{n=-N}^{N} c_n e^(inx) = (1/(2π)) ∫ f(t) (Σ_{n=-N}^{N} e^(in(x-t))) dt over [-π, π].
  assumptions:
  - $f$は$[-\pi,\pi]$で可積分
  - $N$は非負整数
  quantifiers:
  - 任意の$f$
  - 任意の非負整数$N$
  - 任意の実数$x$
  conclusion: $\sum_{n=-N}^{N}c_ne^{inx}=\frac{1}{2\pi}\int_{-\pi}^{\pi}f(t)\left(\sum_{n=-N}^{N}e^{in(x-t)}\right)dt$である。
  answer: |
    $f$を$[-\pi,\pi]$で可積分、$N$を非負整数、$x$を実数とする。$c_n$の定義を代入すると、各$n$について
    $c_ne^{inx}=\frac{1}{2\pi}\int_{-\pi}^{\pi}f(t)e^{-int}e^{inx}\,dt=\frac{1}{2\pi}\int_{-\pi}^{\pi}f(t)e^{in(x-t)}\,dt$
    である。$t\mapsto e^{in(x-t)}$は連続なので、$f(t)e^{in(x-t)}$は可積分である。$n$について$-N$から$N$まで足し、有限和と積分を交換すれば主張を得る。
  strategy: Insert the definition of c_n and interchange the finite sum with the integral.
  sketch:
  - 'setup: Substitute the definition of c_n and combine the exponentials.'
  - 'derive: Each integrand f(t) e^(in(x-t)) is integrable.'
  - 'conclude: Summing over |n| ≤ N and interchanging gives the formula.'
