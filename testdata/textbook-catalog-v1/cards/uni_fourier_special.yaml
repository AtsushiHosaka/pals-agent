  target: |
    ∀ (T : ℝ) [hT : Fact (0 < T)] (f : AddCircle T → ℂ), MeasureTheory.Integrable f AddCircle.haarAddCircle → ((∀ x, (starRingEnd ℂ) (f x) = f x) → ∀ n : ℤ, fourierCoeff f (-n) = (starRingEnd ℂ) (fourierCoeff f n)) ∧ ((∀ x, f (-x) = f x) → ∀ n : ℤ, fourierCoeff f (-n) = fourierCoeff f n) ∧ ((∀ x, f (-x) = -f x) → ∀ n : ℤ, fourierCoeff f (-n) = -fourierCoeff f n)
  proof: |
    by
      intro T _ f _
      have hrefl : ∀ (g : AddCircle T → ℂ) (n : ℤ), fourierCoeff (fun x => g (-x)) n = fourierCoeff g (-n) := by
        intro g n
        simp only [fourierCoeff, smul_eq_mul, neg_neg]
        rw [← MeasureTheory.integral_neg_eq_self (fun t => fourier n t * g t)]
        congr 1
        funext t
        congr 1
        rw [fourier_apply, fourier_apply]
        congr 2
        simp
      refine ⟨fun h n => ?_, fun h n => ?_, fun h n => ?_⟩
      · have e : fourierCoeff f n = (starRingEnd ℂ) (fourierCoeff f (-n)) := by
          simp only [fourierCoeff, smul_eq_mul, neg_neg]
          rw [← integral_conj]
          congr 1
          funext t
          rw [map_mul, h t, ← fourier_neg]
