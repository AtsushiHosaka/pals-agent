    statement: 同じ記号で$\hat{g}(w)=\dfrac{1}{c}\hat{f}\left(\dfrac{w}{c}\right)$がすべての$c\neq 0$で成り立つ。
    reason: $c=-1$、$f(v)=e^{-\pi v^2}$、$w=0$とすると$\hat{g}(0)=\hat{f}(0)=1$であるが、右辺は$-1$である。$|c|$が必要である。
  target: |
    ∀ (f : ℝ → ℂ) (c w : ℝ), MeasureTheory.Integrable f MeasureTheory.volume → c ≠ 0 → ∫ v : ℝ, Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * f (c * v) = ((|c|⁻¹ : ℝ) : ℂ) * ∫ v : ℝ, Complex.exp (((-2 * Real.pi * v * (w / c) : ℝ) : ℂ) * Complex.I) * f v
  proof: |
    by
      intro f c w _ hc
      have h := MeasureTheory.Measure.integral_comp_mul_left (fun v : ℝ => Complex.exp (((-2 * Real.pi * v * (w / c) : ℝ) : ℂ) * Complex.I) * f v) c
      have e : ∀ v : ℝ, Complex.exp (((-2 * Real.pi * (c * v) * (w / c) : ℝ) : ℂ) * Complex.I) * f (c * v) = Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * f (c * v) := by
        intro v
        congr 3
        field_simp
      simp only [e] at h
      rw [h, abs_inv, Complex.real_smul]
- id: fourier_transform_reflection_conjugation
  kind: gap
  level: 3
  topic: フーリエ変換・反転と共役
  statement: 可積分な$f:\mathbb{R}\to\mathbb{C}$のフーリエ変換を$\hat{f}(w)=\int_{\mathbb{R}}e^{-2\pi ivw}f(v)\,dv$とする。$g(v)=f(-v)$について$\hat{g}(w)=\hat{f}(-w)$であり、$h(v)=\overline{f(v)}$について$\hat{h}(w)=\overline{\hat{f}(-w)}$である。
  statement_en: For integrable f on ℝ, let f^(w) = ∫ e^(-2πivw) f(v) dv. For g(v) = f(-v), g^(w) = f^(-w), and for h(v) = conj f(v), h^(w) = conj f^(-w).
  assumptions:
  - $f$は$\mathbb{R}$上で可積分
  - $w\in\mathbb{R}$
  quantifiers:
  - 任意の可積分関数$f$
  - 任意の実数$w$
  conclusion: $\hat{g}(w)=\hat{f}(-w)$かつ$\hat{h}(w)=\overline{\hat{f}(-w)}$である。
  answer: |
    $f$を可積分、$w$を実数とする。$u=-v$と置換すると、ルベーグ測度は反転で不変なので
    $\hat{g}(w)=\int_{\mathbb{R}}e^{-2\pi ivw}f(-v)\,dv=\int_{\mathbb{R}}e^{-2\pi iu(-w)}f(u)\,du=\hat{f}(-w)$
    である。また$\overline{e^{-2\pi iv(-w)}}=e^{-2\pi ivw}$であり、積分の共役は共役の積分なので
    $\overline{\hat{f}(-w)}=\int_{\mathbb{R}}\overline{e^{-2\pi iv(-w)}f(v)}\,dv=\int_{\mathbb{R}}e^{-2\pi ivw}\overline{f(v)}\,dv=\hat{h}(w)$
    である。
  strategy: Substitute u = -v for the reflection, and move the conjugation inside the integral.
  sketch:
  - 'translate: Substitute u = -v, using invariance of Lebesgue measure under reflection.'
  - 'derive: This gives g^(w) = f^(-w).'
  - 'derive: Conjugating the integral for f^(-w) gives the integral of e^(-2πivw) conj f(v).'
  - 'conclude: Hence h^(w) = conj f^(-w).'
  openmath: (forall (f w) (-> (and (integrable_real_line (lambda (y) (fn_value f y))) (in w R)) (and (= (integral_real_line (lambda (v) (* (exp (* (* (neg 2) (* pi (* v w))) complex_i)) (fn_value f (neg v))))) (integral_real_line (lambda (v) (* (exp (* (* (neg 2) (* pi (* v (neg w)))) complex_i)) (fn_value f v))))) (= (integral_real_line (lambda (v) (* (exp (* (* (neg 2) (* pi (* v w))) complex_i)) (complex_conj (fn_value f v))))) (complex_conj (integral_real_line (lambda (v) (* (exp (* (* (neg 2) (* pi (* v (neg w)))) complex_i)) (fn_value f v)))))))))
  hard_negative:
    statement: 同じ記号で$\hat{h}(w)=\overline{\hat{f}(w)}$である。
    reason: $f(v)=e^{2\pi iv}e^{-\pi v^2}$とする。$\hat{f}(w)=e^{-\pi(w-1)^2}$である。$h(v)=e^{-2\pi iv}e^{-\pi v^2}$なので$\hat{h}(w)=e^{-\pi(w+1)^2}$である。$w=1$で$\hat{h}(1)=e^{-4\pi}$、$\overline{\hat{f}(1)}=1$である。
  target: |
    ∀ (f : ℝ → ℂ) (w : ℝ), MeasureTheory.Integrable f MeasureTheory.volume → (∫ v : ℝ, Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * f (-v) = ∫ v : ℝ, Complex.exp (((-2 * Real.pi * v * (-w) : ℝ) : ℂ) * Complex.I) * f v) ∧ (∫ v : ℝ, Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * (starRingEnd ℂ) (f v) = (starRingEnd ℂ) (∫ v : ℝ, Complex.exp (((-2 * Real.pi * v * (-w) : ℝ) : ℂ) * Complex.I) * f v))
  proof: |
    by
      intro f w _
      constructor
      · rw [← MeasureTheory.integral_neg_eq_self (fun v : ℝ => Complex.exp (((-2 * Real.pi * v * (-w) : ℝ) : ℂ) * Complex.I) * f v)]
        congr 1
        funext v
        congr 3
        ring
      · rw [← integral_conj]
        congr 1
        funext v
        rw [map_mul, ← Complex.exp_conj]
        congr 2
        simp only [map_mul, Complex.conj_ofReal, Complex.conj_I]
        push_cast
        ring
- id: fourier_transform_continuous
  kind: gap
  level: 3
  topic: フーリエ変換・連続性
  statement: $f:\mathbb{R}\to\mathbb{C}$が可積分ならば、そのフーリエ変換$\hat{f}(w)=\int_{\mathbb{R}}e^{-2\pi ivw}f(v)\,dv$は$\mathbb{R}$上で連続である。
  statement_en: If f on ℝ is integrable, then its Fourier transform f^(w) = ∫ e^(-2πivw) f(v) dv is continuous on ℝ.
  assumptions:
  - $f$は$\mathbb{R}$上で可積分
  quantifiers:
  - 任意の可積分関数$f$
  conclusion: $\hat{f}$は$\mathbb{R}$上で連続である。
  answer: |
    $f$を可積分とし、$w_k\to w$とする。各$v$で$e^{-2\pi ivw_k}f(v)\to e^{-2\pi ivw}f(v)$である。また$\left|e^{-2\pi ivw_k}f(v)\right|=|f(v)|$であり、$|f|$は可積分である。優収束定理により$\hat{f}(w_k)\to\hat{f}(w)$である。$\mathbb{R}$は距離空間なので、点列の収束から$\hat{f}$の連続性が従う。
  strategy: Apply the dominated convergence theorem with the dominating function |f|.
  sketch:
  - 'setup: Take a sequence w_k converging to w.'
  - 'derive: The integrands converge pointwise and are dominated by |f|.'
  - 'apply_theorem: The dominated convergence theorem gives f^(w_k) → f^(w).'
  - 'conclude: Sequential continuity gives continuity.'
  openmath: (forall (f) (-> (integrable_real_line (lambda (y) (fn_value f y))) (fn_continuous (lambda (w) (integral_real_line (lambda (v) (* (exp (* (* (neg 2) (* pi (* v w))) complex_i)) (fn_value f v))))))))
  hard_negative:
    statement: $f$が可積分ならば$\hat{f}$も可積分である。
    reason: $f=1_{[0,1]}$とすると$|\hat{f}(w)|=\frac{|\sin\pi w|}{\pi|w|}$であり、これは$\mathbb{R}$上で可積分でない。
  target: |
    ∀ f : ℝ → ℂ, MeasureTheory.Integrable f MeasureTheory.volume → Continuous (fun w : ℝ => ∫ v : ℝ, Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * f v)
  proof: |
    by
      intro f hf
      refine MeasureTheory.continuous_of_dominated (bound := fun v => ‖f v‖) ?_ ?_ hf.norm ?_
      · intro w
        refine MeasureTheory.AEStronglyMeasurable.mul ?_ hf.aestronglyMeasurable
        exact (by fun_prop : Continuous fun v : ℝ => Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I)).aestronglyMeasurable
      · intro w
        refine Filter.Eventually.of_forall (fun v => ?_)
        rw [norm_mul, Complex.norm_exp_ofReal_mul_I, one_mul]
      · refine Filter.Eventually.of_forall (fun v => ?_)
        fun_prop
- id: fourier_multiplication_formula
  kind: gap
  level: 3
  topic: フーリエ変換・乗法公式
  statement: 乗法公式。$f,g:\mathbb{R}\to\mathbb{C}$が可積分ならば、$\hat{f}(w)=\int_{\mathbb{R}}e^{-2\pi ivw}f(v)\,dv$について$\int_{\mathbb{R}}\hat{f}(w)g(w)\,dw=\int_{\mathbb{R}}f(v)\hat{g}(v)\,dv$である。
  statement_en: Multiplication formula. If f, g on ℝ are integrable, then with f^(w) = ∫ e^(-2πivw) f(v) dv, the integral of f^(w) g(w) equals the integral of f(v) g^(v).
  assumptions:
  - $f,g$は$\mathbb{R}$上で可積分
  quantifiers:
  - 任意の可積分関数$f,g$
  conclusion: $\int_{\mathbb{R}}\hat{f}(w)g(w)\,dw=\int_{\mathbb{R}}f(v)\hat{g}(v)\,dv$である。
  answer: |
    $f,g$を可積分とする。$F(v,w)=e^{-2\pi ivw}f(v)g(w)$は可測で$|F(v,w)|=|f(v)||g(w)|$である。トネリの定理より$\iint|f(v)||g(w)|\,dv\,dw=\|f\|_1\|g\|_1<\infty$なので、$F$は$\mathbb{R}^2$上で可積分である。フビニの定理より
    $\int_{\mathbb{R}}\hat{f}(w)g(w)\,dw=\int_{\mathbb{R}}\int_{\mathbb{R}}F(v,w)\,dv\,dw=\int_{\mathbb{R}}\int_{\mathbb{R}}F(v,w)\,dw\,dv=\int_{\mathbb{R}}f(v)\hat{g}(v)\,dv$
    である。
  strategy: Apply Fubini's theorem to e^(-2πivw) f(v) g(w).
  sketch:
  - 'setup: Let F(v,w) = e^(-2πivw) f(v) g(w).'
  - 'derive: Since |F| = |f||g|, Tonelli shows F is integrable on the plane.'
  - 'apply_theorem: Fubini''s theorem allows exchanging the order of integration.'
  - 'conclude: The two iterated integrals are the two sides.'
  openmath: (forall (f g) (-> (and (integrable_real_line (lambda (y) (fn_value f y))) (integrable_real_line (lambda (y) (fn_value g y)))) (= (integral_real_line (lambda (w) (* (integral_real_line (lambda (v) (* (exp (* (* (neg 2) (* pi (* v w))) complex_i)) (fn_value f v)))) (fn_value g w)))) (integral_real_line (lambda (v) (* (fn_value f v) (integral_real_line (lambda (w) (* (exp (* (* (neg 2) (* pi (* v w))) complex_i)) (fn_value g w))))))))))
  hard_negative:
    statement: 同じ仮定で$\int_{\mathbb{R}}\hat{f}(w)\hat{g}(w)\,dw=\int_{\mathbb{R}}f(v)g(v)\,dv$である。
    reason: 両辺の形が異なる。$f(v)=g(v)=e^{-\pi(v-1)^2}$とすると$\hat{f}(w)=e^{-2\pi iw}e^{-\pi w^2}$なので左辺は$\int e^{-4\pi iw}e^{-2\pi w^2}\,dw$であり、右辺は$\int e^{-2\pi(v-1)^2}\,dv$である。右辺は$\frac{1}{\sqrt{2}}$、左辺は$\frac{1}{\sqrt{2}}e^{-2\pi}$である。
  target: |
    ∀ f g : ℝ → ℂ, MeasureTheory.Integrable f MeasureTheory.volume → MeasureTheory.Integrable g MeasureTheory.volume → ∫ w : ℝ, (∫ v : ℝ, Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * f v) * g w = ∫ v : ℝ, f v * ∫ w : ℝ, Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * g w
  proof: |
    by
      intro f g hf hg
      have hE : Continuous fun p : ℝ × ℝ => Complex.exp (((-2 * Real.pi * p.1 * p.2 : ℝ) : ℂ) * Complex.I) := by fun_prop
      have hI : MeasureTheory.Integrable (fun p : ℝ × ℝ => Complex.exp (((-2 * Real.pi * p.1 * p.2 : ℝ) : ℂ) * Complex.I) * (f p.1 * g p.2)) (MeasureTheory.volume.prod MeasureTheory.volume) := by
        refine (hf.mul_prod hg).bdd_mul (c := 1) hE.aestronglyMeasurable ?_
        refine Filter.Eventually.of_forall (fun p => ?_)
        rw [Complex.norm_exp_ofReal_mul_I]
      calc ∫ w : ℝ, (∫ v : ℝ, Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * f v) * g w
          = ∫ w : ℝ, ∫ v : ℝ, Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * (f v * g w) := by
            congr 1; funext w
            rw [← MeasureTheory.integral_mul_const]
            congr 1; funext v; ring
        _ = ∫ v : ℝ, ∫ w : ℝ, Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * (f v * g w) := by
            exact (MeasureTheory.integral_integral_swap (f := fun w v => Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * (f v * g w)) hI.swap).symm ▸ rfl
        _ = ∫ v : ℝ, f v * ∫ w : ℝ, Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * g w := by
            congr 1; funext v
            rw [← MeasureTheory.integral_const_mul]
            congr 1; funext w; ring
- id: fourier_inversion_at_continuity_point
  kind: named
  level: 4
  topic: フーリエ変換・反転公式
  statement: フーリエの反転公式。$V$を有限次元実内積空間とし、ルベーグ測度について$\mathcal{F}f(w)=\int_Ve^{-2\pi i\langle v,w\rangle}f(v)\,dv$、$\mathcal{F}^{-1}g(v)=\int_Ve^{2\pi i\langle v,w\rangle}g(w)\,dw$とする。$f$と$\mathcal{F}f$が可積分で、$f$が点$v$で連続ならば、$\mathcal{F}^{-1}(\mathcal{F}f)(v)=f(v)$である。
  statement_en: Fourier inversion. Let V be a finite-dimensional real inner product space with Lebesgue measure, F f(w) = ∫ e^(-2πi⟨v,w⟩) f(v) dv and F⁻¹ g(v) = ∫ e^(2πi⟨v,w⟩) g(w) dw. If f and F f are integrable and f is continuous at v, then F⁻¹(F f)(v) = f(v).
  assumptions:
  - $V$は有限次元実内積空間
  - $f$は可積分
  - $\mathcal{F}f$は可積分
  - $f$は$v$で連続
  quantifiers:
  - 任意の$V$
  - 任意の$f:V\to\mathbb{C}$
  - 任意の$v\in V$
  conclusion: $\mathcal{F}^{-1}(\mathcal{F}f)(v)=f(v)$である。
  answer: |
    $V$の次元を$n$とし、$f$と$\mathcal{F}f$を可積分、$f$を$v$で連続とする。$\varepsilon>0$について
    $I_\varepsilon=\int_Ve^{-\pi\varepsilon|w|^2}e^{2\pi i\langle v,w\rangle}\mathcal{F}f(w)\,dw$
    とおく。$\mathcal{F}f$は可積分なので、優収束定理により$\varepsilon\to 0$で$I_\varepsilon\to\mathcal{F}^{-1}(\mathcal{F}f)(v)$である。

    $\mathcal{F}f$の定義を代入する。被積分関数の絶対値は$e^{-\pi\varepsilon|w|^2}|f(x)|$で可積分なので、フビニの定理が使える。ガウス関数のフーリエ変換により
    $I_\varepsilon=\int_Vf(x)G_\varepsilon(v-x)\,dx,\qquad G_\varepsilon(y)=\varepsilon^{-n/2}e^{-\pi|y|^2/\varepsilon}$
    である。$G_\varepsilon>0$、$\int_VG_\varepsilon=1$である。

    $\eta>0$をとり、$|x-v|<\delta$で$|f(x)-f(v)|<\eta$となる$\delta>0$をとる。$f(v)=\int_Vf(v)G_\varepsilon(v-x)\,dx$なので
    $|I_\varepsilon-f(v)|\leq\eta+\sup_{|y|\geq\delta}G_\varepsilon(y)\cdot\|f\|_1+|f(v)|\int_{|y|\geq\delta}G_\varepsilon(y)\,dy$
    である。$\varepsilon\to 0$で右辺の第2項と第3項は$0$に収束する。よって$I_\varepsilon\to f(v)$であり、極限の一意性から主張を得る。
  strategy: Insert a Gaussian factor, apply Fubini, and let the Gaussian kernels concentrate at the point v.
  sketch:
  - 'setup: Define I_ε by inserting e^(-πε|w|²) in the inverse transform of F f.'
  - 'apply_theorem: Dominated convergence gives I_ε → F⁻¹(F f)(v), since F f is integrable.'
  - 'apply_theorem: Fubini and the Gaussian Fourier transform give I_ε = ∫ f(x) G_ε(v-x) dx.'
  - 'derive: G_ε is a positive kernel of integral 1 that concentrates at 0 as ε → 0.'
  - 'derive: Continuity of f at v and integrability give I_ε → f(v).'
  - 'conclude: Uniqueness of limits gives the inversion formula.'
  openmath: (forall (V f v) (-> (and (fd_inner_product_space R V) (integrable_on_space V f) (integrable_on_space V (fourier_transform f)) (fn_continuous_at (lambda (y) (fn_value f y)) v)) (= (fn_value (inverse_fourier_transform (fourier_transform f)) v) (fn_value f v))))
  hard_negative:
    statement: $f$が可積分で$v$で連続ならば、$\mathcal{F}f$が可積分でなくても$\mathcal{F}^{-1}(\mathcal{F}f)(v)=f(v)$である。
    reason: $\mathcal{F}f$が可積分でなければ、$\mathcal{F}^{-1}(\mathcal{F}f)$を定める積分自体がルベーグの意味で定まらない。$V=\mathbb{R}$、$f=1_{[0,1]}$、$v=\frac{1}{2}$では$|\mathcal{F}f(w)|=\frac{|\sin\pi w|}{\pi|w|}$が可積分でない。
  target: |
    ∀ (V : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [FiniteDimensional ℝ V] [MeasurableSpace V] [BorelSpace V] (f : V → ℂ) (v : V), MeasureTheory.Integrable f MeasureTheory.volume → MeasureTheory.Integrable (FourierTransform.fourier f) MeasureTheory.volume → ContinuousAt f v → FourierTransformInv.fourierInv (FourierTransform.fourier f) v = f v
  proof: |
    by
      intro V _ _ _ _ _ f v hf hF hc
      exact hf.fourierInv_fourier_eq hF hc
- id: fourier_transform_twice_reflects
  kind: gap
  level: 4
  topic: フーリエ変換・2回の変換
  statement: $f:\mathbb{R}\to\mathbb{C}$が連続かつ可積分で、$\hat{f}(w)=\int_{\mathbb{R}}e^{-2\pi ivw}f(v)\,dv$も可積分ならば、すべての実数$x$について$\hat{\hat{f}}(x)=f(-x)$である。
  statement_en: If f on ℝ is continuous and integrable and f^(w) = ∫ e^(-2πivw) f(v) dv is also integrable, then the transform of f^ at x equals f(-x) for every real x.
  assumptions:
  - $f$は連続で可積分
  - $\hat{f}$は可積分
  quantifiers:
  - 任意の$f$
  - 任意の実数$x$
  conclusion: $\hat{\hat{f}}(x)=f(-x)$である。
  answer: |
    $f$を連続で可積分、$\hat{f}$を可積分とし、$x$を実数とする。定義から
    $\hat{\hat{f}}(x)=\int_{\mathbb{R}}e^{-2\pi iwx}\hat{f}(w)\,dw=\int_{\mathbb{R}}e^{2\pi iw(-x)}\hat{f}(w)\,dw$
    である。右辺は$\hat{f}$の逆変換の$-x$での値である。$f$は$-x$で連続なので、フーリエの反転公式により右辺は$f(-x)$である。
  strategy: Recognize the double transform at x as the inverse transform at -x.
  sketch:
  - 'setup: Write the double transform at x as an integral of e^(-2πiwx) f^(w).'
  - 'translate: This equals the inverse Fourier transform of f^ at -x.'
  - 'apply_theorem: The inversion formula applies since f is continuous and f, f^ are integrable.'
  - 'conclude: The value is f(-x).'
  openmath: (forall (f x) (-> (and (fn_continuous (lambda (y) (fn_value f y))) (integrable_real_line (lambda (y) (fn_value f y))) (integrable_real_line (lambda (y) (fn_value (fourier_transform f) y))) (in x R)) (= (fn_value (fourier_transform (fourier_transform f)) x) (fn_value f (neg x)))))
  hard_negative:
    statement: 同じ仮定で$\hat{\hat{f}}(x)=f(x)$である。
    reason: $f(v)=e^{-\pi(v-1)^2}$とすると、$f$は偶関数でないので$f(-1)\neq f(1)$である。正しい値は$\hat{\hat{f}}(1)=f(-1)=e^{-4\pi}$であり、$f(1)=1$とは異なる。
  target: |
    ∀ (f : ℝ → ℂ) (x : ℝ), MeasureTheory.Integrable f MeasureTheory.volume → MeasureTheory.Integrable (FourierTransform.fourier f) MeasureTheory.volume → Continuous f → FourierTransform.fourier (FourierTransform.fourier f) x = f (-x)
  proof: |
    by
      intro f x hf hF hc
      have h := hc.fourierInv_fourier_eq hf hF
      have h2 := congrFun h (-x)
      rw [Real.fourierInv_eq_fourier_neg, neg_neg] at h2
      exact h2
- id: gaussian_fourier_transform
  kind: textbook
  level: 3
  topic: フーリエ変換・ガウス関数
  statement: $\mathrm{Re}\,b>0$である複素数$b$について、$f(x)=e^{-\pi bx^2}$のフーリエ変換は$\hat{f}(t)=\int_{\mathbb{R}}e^{-2\pi ixt}f(x)\,dx=b^{-1/2}e^{-\pi t^2/b}$である。ここで$b^{-1/2}$は主値である。特に$b=1$のとき$e^{-\pi x^2}$は自分自身に写る。
  statement_en: For a complex number b with Re b > 0, the function f(x) = e^(-πbx²) has Fourier transform f^(t) = ∫ e^(-2πixt) f(x) dx = b^(-1/2) e^(-πt²/b), with the principal branch of b^(-1/2). In particular, for b = 1 the function e^(-πx²) is its own transform.
  assumptions:
  - $\mathrm{Re}\,b>0$
  - $b^{-1/2}$は主値
  quantifiers:
  - 任意の複素数$b$
  - 任意の実数$t$
  conclusion: $\hat{f}(t)=b^{-1/2}e^{-\pi t^2/b}$である。
  answer: |
    $\mathrm{Re}\,b>0$とし、$I(t)=\int_{\mathbb{R}}e^{-2\pi ixt}e^{-\pi bx^2}\,dx$とおく。$|e^{-\pi bx^2}|=e^{-\pi(\mathrm{Re}\,b)x^2}$なので積分は絶対収束し、積分記号下で微分できる。$xe^{-\pi bx^2}=-\frac{1}{2\pi b}\frac{d}{dx}e^{-\pi bx^2}$を用いて部分積分すると
    $I'(t)=\int_{\mathbb{R}}(-2\pi ix)e^{-2\pi ixt}e^{-\pi bx^2}\,dx=\frac{i}{b}\int_{\mathbb{R}}e^{-2\pi ixt}\frac{d}{dx}e^{-\pi bx^2}\,dx=-\frac{2\pi t}{b}I(t)$
    である。よって$I(t)=I(0)e^{-\pi t^2/b}$である。

    $I(0)=\int_{\mathbb{R}}e^{-\pi bx^2}\,dx$を求める。$b>0$が実数のときはガウス積分から$I(0)=b^{-1/2}$である。$I(0)$と$b^{-1/2}$（主値）はどちらも$\mathrm{Re}\,b>0$で正則なので、一致の定理により$\mathrm{Re}\,b>0$全体で$I(0)=b^{-1/2}$である。
  strategy: Derive a first-order differential equation in t and determine the initial value by analytic continuation in b.
  sketch:
  - 'setup: Let I(t) be the transform of e^(-πbx²), which converges absolutely.'
  - 'derive: Differentiating under the integral and integrating by parts gives I''(t) = -(2πt/b) I(t).'
  - 'derive: So I(t) = I(0) e^(-πt²/b).'
  - 'apply_theorem: For real b > 0 the Gaussian integral gives I(0) = b^(-1/2), and the identity theorem extends this to Re b > 0.'
  - 'conclude: Hence the formula.'
  openmath: (forall (b t) (-> (and (> (real_part b) 0) (in t R)) (= (integral_real_line (lambda (x) (* (exp (* (* (neg 2) (* pi (* x t))) complex_i)) (exp (neg (* pi (* b (^ x 2)))))))) (* (^ b (neg (/ 1 2))) (exp (neg (/ (* pi (^ t 2)) b)))))))
  hard_negative:
    statement: $\mathrm{Re}\,b>0$について$\int_{\mathbb{R}}e^{-2\pi ixt}e^{-\pi bx^2}\,dx=e^{-\pi t^2/b}$である。
    reason: $t=0$、$b=4$とすると左辺は$\int_{\mathbb{R}}e^{-4\pi x^2}\,dx=\frac{1}{2}$であり、右辺は$1$である。因子$b^{-1/2}$が必要である。
  target: |
    ∀ b : ℂ, 0 < b.re → FourierTransform.fourier (fun x : ℝ => Complex.exp (-Real.pi * b * (x : ℂ) ^ 2)) = fun t : ℝ => 1 / b ^ (1 / 2 : ℂ) * Complex.exp (-Real.pi / b * (t : ℂ) ^ 2)
  proof: |
    by
      intro b hb
      exact fourier_gaussian_pi hb
- id: gaussian_complex_quadratic_integral
  kind: gap
  level: 3
  topic: フーリエ変換・複素2次式のガウス積分
  statement: $\mathrm{Re}\,b<0$である複素数$b$と複素数$c,d$について$\int_{\mathbb{R}}e^{bx^2+cx+d}\,dx=\left(\dfrac{\pi}{-b}\right)^{1/2}e^{d-c^2/(4b)}$である。ここで$1/2$乗は主値である。
  statement_en: For a complex b with Re b < 0 and complex c, d, the integral of e^(bx²+cx+d) over ℝ equals (π/(-b))^(1/2) e^(d - c²/(4b)), with the principal branch of the square root.
  assumptions:
  - $\mathrm{Re}\,b<0$
  - $c,d\in\mathbb{C}$
  quantifiers:
  - 任意の複素数$b,c,d$
  conclusion: $\int_{\mathbb{R}}e^{bx^2+cx+d}\,dx=\left(\dfrac{\pi}{-b}\right)^{1/2}e^{d-c^2/(4b)}$である。
  answer: |
    $\mathrm{Re}\,b<0$、$c,d\in\mathbb{C}$とする。$e^{d}$は積分の外に出るので$d=0$の場合を示せばよい。$\beta=-\frac{b}{\pi}$とおくと$\mathrm{Re}\,\beta>0$である。

    $J(c)=\int_{\mathbb{R}}e^{bx^2+cx}\,dx$とおく。$|e^{bx^2+cx}|=e^{(\mathrm{Re}\,b)x^2+(\mathrm{Re}\,c)x}$なので、この積分は$c$について局所一様に絶対収束し、$J$は$\mathbb{C}$全体で正則である。右辺$\left(\frac{\pi}{-b}\right)^{1/2}e^{-c^2/(4b)}$も$c$について正則である。

    $c=-2\pi it$（$t$は実数）のとき、$J(c)$はガウス関数$e^{-\pi\beta x^2}$のフーリエ変換の$t$での値であり、$\beta^{-1/2}e^{-\pi t^2/\beta}$に等しい。$\beta^{-1/2}=\left(\frac{\pi}{-b}\right)^{1/2}$であり、$-\frac{\pi t^2}{\beta}=-\frac{c^2}{4b}$である。よって両辺は虚軸上で一致する。一致の定理により$\mathbb{C}$全体で一致する。
  strategy: Reduce to the Gaussian Fourier transform on the imaginary axis of c and extend by the identity theorem.
  sketch:
  - 'setup: Factor out e^d and set β = -b/π, which has positive real part.'
  - 'derive: J(c), the integral of e^(bx²+cx), is entire in c.'
  - 'apply_theorem: For c = -2πit, J(c) is the Fourier transform of a Gaussian, known explicitly.'
  - 'derive: The two sides agree on the imaginary axis.'
  - 'conclude: The identity theorem gives equality for all c.'
  openmath: (forall (b c d) (-> (< (real_part b) 0) (= (integral_real_line (lambda (x) (exp (+ (* b (^ x 2)) (+ (* c x) d))))) (* (^ (/ pi (neg b)) (/ 1 2)) (exp (- d (/ (^ c 2) (* 4 b))))))))
  hard_negative:
    statement: $\mathrm{Re}\,b\leq 0$でも同じ公式が成り立つ。
    reason: $b=0$、$c=d=0$とすると被積分関数は$1$であり、積分は発散する。
  target: |
    ∀ b c d : ℂ, b.re < 0 → ∫ x : ℝ, Complex.exp (b * (x : ℂ) ^ 2 + c * x + d) = (Real.pi / -b) ^ (1 / 2 : ℂ) * Complex.exp (d - c ^ 2 / (4 * b))
  proof: |
    by
      intro b c d hb
      exact integral_cexp_quadratic hb c d
- id: gaussian_integral_finite_dimensional
  kind: gap
  level: 3
  topic: フーリエ変換・高次元のガウス積分
  statement: $V$を有限次元実内積空間とし、$b>0$とする。$\int_Ve^{-b|v|^2}\,dv=\left(\dfrac{\pi}{b}\right)^{(\dim V)/2}$である。これは$\mathbb{R}$上と$\mathbb{R}^2$上のガウス積分の一般形である。
  statement_en: Let V be a finite-dimensional real inner product space and b > 0. The integral of e^(-b|v|²) over V equals (π/b)^((dim V)/2). This is the general form of the Gaussian integrals over ℝ and ℝ².
  assumptions:
  - $V$は有限次元実内積空間
  - $b>0$
  quantifiers:
  - 任意の$V$
  - 任意の実数$b$
  conclusion: $\int_Ve^{-b|v|^2}\,dv=\left(\dfrac{\pi}{b}\right)^{(\dim V)/2}$である。
  answer: |
    $V$の次元を$n$とし、$b>0$とする。正規直交基底をとると、$V$は測度を保って$\mathbb{R}^n$と同一視でき、$|v|^2=\sum_{j=1}^{n}x_j^2$である。よって$e^{-b|v|^2}=\prod_{j=1}^{n}e^{-bx_j^2}$である。非負関数なのでトネリの定理により積分は積に分かれ、$\mathbb{R}$上のガウス積分$\int_{\mathbb{R}}e^{-bx^2}\,dx=\sqrt{\pi/b}$から
    $\int_Ve^{-b|v|^2}\,dv=\prod_{j=1}^{n}\int_{\mathbb{R}}e^{-bx_j^2}\,dx_j=\left(\frac{\pi}{b}\right)^{n/2}$
    である。
  strategy: Factor the integrand in orthonormal coordinates and use the one-dimensional Gaussian integral.
  sketch:
  - 'setup: An orthonormal basis identifies V with ℝ^n preserving Lebesgue measure.'
  - 'derive: The integrand factors as the product of e^(-b x_j²).'
  - 'apply_theorem: Tonelli''s theorem splits the integral into n one-dimensional integrals.'
  - 'conclude: Each equals √(π/b), giving (π/b)^(n/2).'
  openmath: (forall (V b) (-> (and (fd_inner_product_space R V) (> b 0)) (= (integral_over_space V (lambda (v) (exp (neg (* b (^ (norm v) 2)))))) (^ (/ pi b) (/ (dim_of R V) 2)))))
  hard_negative:
    statement: $V$の次元によらず$\int_Ve^{-b|v|^2}\,dv=\sqrt{\pi/b}$である。
    reason: $V=\mathbb{R}^2$では値は$\frac{\pi}{b}$である。$b=\pi$のとき$\sqrt{\pi/b}=1$と一致するが、$b=1$では$\pi\neq\sqrt{\pi}$である。
  target: |
    ∀ (V : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [FiniteDimensional ℝ V] [MeasurableSpace V] [BorelSpace V] (b : ℝ), 0 < b → ∫ v : V, Real.exp (-b * ‖v‖ ^ 2) = (Real.pi / b) ^ ((Module.finrank ℝ V : ℝ) / 2)
  proof: |
    by
      intro V _ _ _ _ _ b hb
      exact GaussianFourier.integral_rexp_neg_mul_sq_norm hb
- id: fourier_convolution_theorem
  kind: textbook
  level: 3
  topic: フーリエ変換・畳み込み定理
  statement: 畳み込み定理。$V$を有限次元実内積空間とし、ルベーグ測度について$\mathcal{F}f(w)=\int_Ve^{-2\pi i\langle v,w\rangle}f(v)\,dv$、$(f*g)(x)=\int_Vf(t)g(x-t)\,dt$とする。$f,g:V\to\mathbb{C}$が可積分ならば$\mathcal{F}(f*g)(w)=\mathcal{F}f(w)\,\mathcal{F}g(w)$である。
  statement_en: Convolution theorem. Let V be a finite-dimensional real inner product space with Lebesgue measure, F f(w) = ∫ e^(-2πi⟨v,w⟩) f(v) dv and (f*g)(x) = ∫ f(t) g(x-t) dt. If f, g are integrable, then F(f*g)(w) = F f(w) F g(w).
  assumptions:
  - $V$は有限次元実内積空間
  - $f,g$は可積分
  quantifiers:
  - 任意の$V$
  - 任意の可積分関数$f,g$
  - 任意の$w\in V$
  conclusion: $\mathcal{F}(f*g)(w)=\mathcal{F}f(w)\,\mathcal{F}g(w)$である。
  answer: |
    $V$を有限次元実内積空間、$f,g$を可積分、$w\in V$とする。$(x,t)\mapsto f(t)g(x-t)$は$V\times V$上で可積分である。実際、トネリの定理と平行移動不変性から$\iint|f(t)||g(x-t)|\,dx\,dt=\|f\|_1\|g\|_1$である。したがって$f*g$はほとんどいたるところで定まり可積分である。

    フビニの定理で積分の順序を交換し、内側で$y=x-t$と置換すると
    $\mathcal{F}(f*g)(w)=\int_V\int_Ve^{-2\pi i\langle x,w\rangle}f(t)g(x-t)\,dx\,dt=\int_Vf(t)e^{-2\pi i\langle t,w\rangle}\int_Ve^{-2\pi i\langle y,w\rangle}g(y)\,dy\,dt$
    である。これは$\mathcal{F}f(w)\mathcal{F}g(w)$に等しい。
  strategy: Exchange the order of integration by Fubini and substitute y = x - t.
  sketch:
  - 'setup: Tonelli and translation invariance show f(t) g(x-t) is integrable on V × V.'
  - 'apply_theorem: Fubini''s theorem allows exchanging the order of integration.'
  - 'translate: Substitute y = x - t in the inner integral.'
  - 'conclude: The exponential splits and the integral factors as F f(w) F g(w).'
  openmath: (forall (V f g w) (-> (and (fd_inner_product_space R V) (integrable_on_space V f) (integrable_on_space V g)) (= (fn_value (fourier_transform (convolution_of f g)) w) (* (fn_value (fourier_transform f) w) (fn_value (fourier_transform g) w)))))
  hard_negative:
    statement: 可積分な$f,g$について$\mathcal{F}(fg)=\mathcal{F}f\,\mathcal{F}g$である。
    reason: $V=\mathbb{R}$、$f=g=e^{-\pi x^2}$とすると$\mathcal{F}(fg)(0)=\int e^{-2\pi x^2}\,dx=\frac{1}{\sqrt{2}}$であるが、$\mathcal{F}f(0)\mathcal{F}g(0)=1$である。
  target: |
    ∀ (V : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [FiniteDimensional ℝ V] [MeasurableSpace V] [BorelSpace V] (f g : V → ℂ) (w : V), MeasureTheory.Integrable f MeasureTheory.volume → MeasureTheory.Integrable g MeasureTheory.volume → FourierTransform.fourier (MeasureTheory.convolution f g (ContinuousLinearMap.mul ℂ ℂ) MeasureTheory.volume) w = FourierTransform.fourier f w * FourierTransform.fourier g w
  proof: |
    by
      intro V _ _ _ _ _ f g w hf hg
      exact Real.fourier_mul_convolution_eq hf hg w
- id: fourier_transform_of_derivative
  kind: gap
  level: 3
  topic: フーリエ変換・導関数の変換
  statement: $f:\mathbb{R}\to\mathbb{C}$が微分可能で、$f$と$f'$が可積分ならば、$\hat{f}(x)=\int_{\mathbb{R}}e^{-2\pi ivx}f(v)\,dv$について$\widehat{f'}(x)=2\pi ix\,\hat{f}(x)$である。
  statement_en: If f on ℝ is differentiable and both f and f' are integrable, then with f^(x) = ∫ e^(-2πivx) f(v) dv, the transform of f' at x equals 2πix f^(x).
  assumptions:
  - $f$は$\mathbb{R}$上で微分可能
  - $f$と$f'$は可積分
  quantifiers:
  - 任意の$f$
  - 任意の実数$x$
  conclusion: $\widehat{f'}(x)=2\pi ix\,\hat{f}(x)$である。
  answer: |
    $f$を微分可能、$f$と$f'$を可積分、$x$を実数とする。

    まず$v\to\pm\infty$で$f(v)\to 0$を示す。$f(R)=f(0)+\int_0^Rf'(v)\,dv$であり、$f'$は可積分なので、$R\to\infty$で$f(R)$は極限をもつ。$f$は可積分なので、その極限は$0$である。$R\to-\infty$でも同様である。

    部分積分より
    $\int_{-R}^{R}e^{-2\pi ivx}f'(v)\,dv=\left[e^{-2\pi ivx}f(v)\right]_{-R}^{R}+2\pi ix\int_{-R}^{R}e^{-2\pi ivx}f(v)\,dv$
    である。$R\to\infty$とすると、境界の項は$0$に収束し、積分は可積分性から$\widehat{f'}(x)$と$\hat{f}(x)$に収束する。よって主張を得る。
  strategy: Integrate by parts on [-R, R], using that f vanishes at infinity.
  sketch:
  - 'setup: Since f'' is integrable, f has limits at ±∞, and integrability of f forces them to be 0.'
  - 'derive: Integrate by parts on [-R, R].'
  - 'derive: The boundary terms tend to 0 as R → ∞.'
  - 'conclude: Passing to the limit gives the transform of f'' equal to 2πix f^(x).'
  openmath: (forall (f x) (-> (and (differentiable_on (lambda (y) (fn_value f y)) R) (integrable_real_line (lambda (y) (fn_value f y))) (integrable_real_line (lambda (y) (fn_value (fn_deriv f) y))) (in x R)) (= (fn_value (fourier_transform (fn_deriv f)) x) (* (* 2 (* pi (* complex_i x))) (fn_value (fourier_transform f) x)))))
  hard_negative:
    statement: 同じ仮定で$\widehat{f'}(x)=ix\,\hat{f}(x)$である。
    reason: ここでの正規化は核$e^{-2\pi ivx}$である。$f(v)=e^{-\pi v^2}$では$\hat{f}=f$であり、$f'=-2\pi vf$の変換を計算すると$2\pi ix\,e^{-\pi x^2}$になる。係数$2\pi$は省けない。
  target: |
    ∀ (f : ℝ → ℂ), MeasureTheory.Integrable f MeasureTheory.volume → Differentiable ℝ f → MeasureTheory.Integrable (deriv f) MeasureTheory.volume → ∀ x : ℝ, FourierTransform.fourier (deriv f) x = (2 * Real.pi * Complex.I * x) * FourierTransform.fourier f x
  proof: |
    by
      intro f hf hd hi x
      have := congrFun (Real.fourier_deriv hf hd hi) x
      simpa using this
- id: derivative_of_fourier_transform
  kind: gap
  level: 3
  topic: フーリエ変換・変換の導関数
  statement: $f:\mathbb{R}\to\mathbb{C}$と$xf(x)$が可積分ならば、$\hat{f}(w)=\int_{\mathbb{R}}e^{-2\pi ixw}f(x)\,dx$は微分可能で、$\hat{f}'(w)$は$g(x)=-2\pi ix\,f(x)$のフーリエ変換の$w$での値に等しい。
  statement_en: If f on ℝ and x f(x) are integrable, then f^(w) = ∫ e^(-2πixw) f(x) dx is differentiable, and its derivative at w is the Fourier transform at w of g(x) = -2πix f(x).
  assumptions:
  - $f$は可積分
  - $xf(x)$は可積分
  quantifiers:
  - 任意の$f$
  - 任意の実数$w$
  conclusion: $\hat{f}'(w)=\hat{g}(w)$、$g(x)=-2\pi ix\,f(x)$である。
  answer: |
    $f$と$xf(x)$を可積分、$w$を実数とする。$h\neq 0$について
    $\frac{\hat{f}(w+h)-\hat{f}(w)}{h}=\int_{\mathbb{R}}e^{-2\pi ixw}\,\frac{e^{-2\pi ixh}-1}{h}\,f(x)\,dx$
    である。$|e^{i\theta}-1|\leq|\theta|$より、被積分関数の絶対値は$2\pi|x||f(x)|$以下であり、これは可積分である。$h\to 0$で被積分関数は$e^{-2\pi ixw}(-2\pi ix)f(x)$に各点収束する。優収束定理により極限が存在し、$\hat{g}(w)$に等しい。
  strategy: Apply dominated convergence to the difference quotient, with dominating function 2π|x||f(x)|.
  sketch:
  - 'setup: Write the difference quotient of f^ as an integral.'
  - 'derive: The bound |e^(iθ) - 1| ≤ |θ| gives the integrable majorant 2π|x||f(x)|.'
  - 'apply_theorem: The dominated convergence theorem applies as h → 0.'
  - 'conclude: The limit is the Fourier transform of -2πix f(x).'
  openmath: (forall (f w) (-> (and (integrable_real_line (lambda (y) (fn_value f y))) (integrable_real_line (lambda (x) (* x (fn_value f x)))) (in w R)) (has_deriv_at (lambda (u) (fn_value (fourier_transform f) u)) (integral_real_line (lambda (x) (* (exp (* (* (neg 2) (* pi (* x w))) complex_i)) (* (* (neg 2) (* pi (* complex_i x))) (fn_value f x))))) w)))
  hard_negative:
    statement: $f$が可積分であるだけで$\hat{f}$は微分可能である。
    reason: $f(x)=\frac{1}{\pi(1+x^2)}$は可積分である。$\hat{f}(w)=e^{-2\pi|w|}$であり、これは$w=0$で微分可能でない。このとき$xf(x)$は可積分でない。
  target: |
    ∀ (f : ℝ → ℂ) (w : ℝ), MeasureTheory.Integrable f MeasureTheory.volume → MeasureTheory.Integrable (fun x : ℝ => (x : ℂ) * f x) MeasureTheory.volume → HasDerivAt (FourierTransform.fourier f) (FourierTransform.fourier (fun x : ℝ => (-2 * Real.pi * Complex.I * x) * f x) w) w
  proof: |
    by
      intro f w hf hx
      have hx' : MeasureTheory.Integrable (fun x : ℝ => x • f x) MeasureTheory.volume := by
        refine hx.congr (Filter.Eventually.of_forall fun x => ?_)
        simp [Complex.real_smul]
      have := Real.hasDerivAt_fourier hf hx' w
      simpa using this
- id: plancherel_l2
  kind: named
  level: 4
  topic: フーリエ変換・プランシュレルの定理
  statement: プランシュレルの定理。$V$を有限次元実内積空間とする。シュワルツ関数上のフーリエ変換$\mathcal{F}f(w)=\int_Ve^{-2\pi i\langle v,w\rangle}f(v)\,dv$の$L^2(V)$への連続拡張を$\mathcal{F}$と書く。シュワルツ関数$f$の$L^2$類の像は$\mathcal{F}f$の$L^2$類であり、すべての$f\in L^2(V)$について$\|\mathcal{F}f\|_2=\|f\|_2$である。
  statement_en: Plancherel's theorem. Let V be a finite-dimensional real inner product space, and write F also for the continuous extension to L²(V) of the Fourier transform F f(w) = ∫ e^(-2πi⟨v,w⟩) f(v) dv on Schwartz functions. For Schwartz f, the L² class of f is sent to the L² class of F f, and ‖F f‖₂ = ‖f‖₂ for all f in L²(V).
  assumptions:
  - $V$は有限次元実内積空間
  - $f\in L^2(V)$
  - $L^2(V)$上の$\mathcal{F}$はシュワルツ関数上の変換の連続拡張
  quantifiers:
  - 任意の$V$
  - 任意の$f\in L^2(V)$
  conclusion: シュワルツ関数上で$\mathcal{F}$は元の変換と一致し、$\|\mathcal{F}f\|_2=\|f\|_2$である。
  answer: |
    $V$を有限次元実内積空間とする。まず$f$がシュワルツ関数のときに示す。$\mathcal{F}f$もシュワルツ関数である。$h(v)=\overline{\mathcal{F}f(v)}$とおくと、$\mathcal{F}h(w)=\int_V\overline{e^{2\pi i\langle v,w\rangle}\mathcal{F}f(v)}\,dv=\overline{\mathcal{F}^{-1}(\mathcal{F}f)(w)}=\overline{f(w)}$である。最後に反転公式を用いた。乗法公式$\int_V(\mathcal{F}f)h=\int_Vf(\mathcal{F}h)$に代入すると
    $\int_V|\mathcal{F}f|^2=\int_Vf\,\overline{f}=\int_V|f|^2$
    である。

    シュワルツ関数の空間は$L^2(V)$で稠密である。$\mathcal{F}$はこの稠密な部分空間上で$L^2$ノルムを保つ線形写像なので、$L^2(V)$上の連続線形写像に一意に拡張され、拡張もノルムを保つ。
  strategy: Prove the isometry on Schwartz functions from the multiplication formula and inversion, then extend by density.
  sketch:
  - 'setup: For Schwartz f, let h be the conjugate of F f.'
  - 'apply_theorem: Inversion gives F h = conj f.'
  - 'apply_theorem: The multiplication formula gives the integral of |F f|² equal to the integral of |f|².'
  - 'derive: Schwartz functions are dense in L²(V).'
  - 'conclude: The isometry extends uniquely to L²(V).'
  openmath: (forall (V f) (-> (and (fd_inner_product_space R V) (in f (l2_space_on V))) (= (norm (fourier_transform f)) (norm f))))
  hard_negative:
    statement: $f$が可積分ならば$\|\mathcal{F}f\|_2=\|f\|_2$であり、両辺は有限である。
    reason: $L^1$の元は$L^2$に入るとは限らない。$V=\mathbb{R}$、$f(x)=|x|^{-1/2}1_{[-1,1]}(x)$は可積分であるが$\|f\|_2=\infty$である。
  target: |
    ∀ (V : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [FiniteDimensional ℝ V] [MeasurableSpace V] [BorelSpace V], (∀ f : SchwartzMap V ℂ, FourierTransform.fourier (f.toLp 2 (MeasureTheory.volume : MeasureTheory.Measure V)) = (FourierTransform.fourier f : SchwartzMap V ℂ).toLp 2 (MeasureTheory.volume : MeasureTheory.Measure V)) ∧ ∀ f : MeasureTheory.Lp (α := V) ℂ 2, ‖FourierTransform.fourier f‖ = ‖f‖
  proof: |
    by
      intro V _ _ _ _ _
