  sketch:
  - 'setup: Write the transform of g as an integral.'
  - 'translate: Substitute u = v + a, using translation invariance.'
  - 'conclude: The factor e^(2πiaw) comes out of the integral.'
  openmath: (forall (f a w) (-> (and (integrable_real_line (lambda (y) (fn_value f y))) (in a R) (in w R)) (= (integral_real_line (lambda (v) (* (exp (* (* (neg 2) (* pi (* v w))) complex_i)) (fn_value f (+ v a))))) (* (exp (* (* 2 (* pi (* a w))) complex_i)) (integral_real_line (lambda (v) (* (exp (* (* (neg 2) (* pi (* v w))) complex_i)) (fn_value f v))))))))
