  hard_negative:
    statement: $\mathrm{Re}\,u>0$、$\mathrm{Re}\,v>0$について$B(u,v+1)=B(u+1,v)$である。
    reason: $u=1$、$v=2$とすると$B(1,3)=\frac{1}{3}$であるが、$B(2,2)=\frac{1}{6}$である。
  target: |
    ∀ u v : ℂ, 0 < u.re → 0 < v.re → u * Complex.betaIntegral u (v + 1) = v * Complex.betaIntegral (u + 1) v
  proof: |
    by
      intro u v hu hv
      exact Complex.betaIntegral_recurrence hu hv
