  - $\mathrm{Re}\,v>0$
  quantifiers:
  - 任意の複素数$u,v$
  conclusion: $u\,B(u,v+1)=v\,B(u+1,v)$である。
  answer: |
    $u,v$を実部が正の複素数とする。$F(x)=x^{u}(1-x)^{v}$とおくと、$0<x<1$で
    $F'(x)=u\,x^{u-1}(1-x)^{v}-v\,x^{u}(1-x)^{v-1}$
    である。右辺の2項はどちらも$(0,1)$で可積分である。$|F(x)|=x^{\mathrm{Re}\,u}(1-x)^{\mathrm{Re}\,v}$なので、$x\to 0$でも$x\to 1$でも$F(x)\to 0$である。よって$\int_0^1F'(x)\,dx=0$であり、$u\,B(u,v+1)-v\,B(u+1,v)=0$を得る。
  strategy: Integrate the derivative of x^u (1-x)^v over (0, 1).
  sketch:
  - 'setup: Let F(x) = x^u (1-x)^v.'
  - 'derive: F'' equals u x^(u-1) (1-x)^v - v x^u (1-x)^(v-1).'
  - 'derive: F tends to 0 at both endpoints because the real parts of u and v are positive.'
  - 'conclude: Integrating F'' over (0, 1) gives u B(u, v+1) = v B(u+1, v).'
