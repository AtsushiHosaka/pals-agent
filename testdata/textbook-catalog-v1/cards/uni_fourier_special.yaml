    statement: 同じ記号で$\hat{g}(w)=e^{-2\pi iaw}\hat{f}(w)$である。
    reason: $f(v)=e^{-\pi v^2}$、$a=\frac{1}{4}$、$w=1$とする。$\hat{f}(1)\neq 0$で、正しい因子は$e^{\pi i/2}=i$である。$e^{-\pi i/2}=-i$とは異なる。
  target: |
