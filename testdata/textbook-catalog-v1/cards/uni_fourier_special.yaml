    $f$を可積分、$c\neq 0$、$w$を実数とする。$u=cv$と置換すると、ルベーグ測度について$dv=\frac{du}{|c|}$である（$c<0$では向きが逆転し、その符号が$|c|$に吸収される）。よって
    $\hat{g}(w)=\int_{\mathbb{R}}e^{-2\pi ivw}f(cv)\,dv=\frac{1}{|c|}\int_{\mathbb{R}}e^{-2\pi iu(w/c)}f(u)\,du=\frac{1}{|c|}\hat{f}\left(\frac{w}{c}\right)$
    である。
  strategy: Substitute u = cv with the Jacobian 1/|c|.
  sketch:
  - 'setup: Write the transform of g as an integral.'
  - 'translate: Substitute u = cv, so dv = du/|c|.'
  - 'conclude: The exponential becomes e^(-2πiu(w/c)), giving (1/|c|) f^(w/c).'
  openmath: (forall (f c w) (-> (and (integrable_real_line (lambda (y) (fn_value f y))) (!= c 0) (in w R)) (= (integral_real_line (lambda (v) (* (exp (* (* (neg 2) (* pi (* v w))) complex_i)) (fn_value f (* c v))))) (* (/ 1 (abs c)) (integral_real_line (lambda (v) (* (exp (* (* (neg 2) (* pi (* v (/ w c)))) complex_i)) (fn_value f v))))))))
