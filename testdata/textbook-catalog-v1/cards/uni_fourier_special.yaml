  answer: |
    $f:\mathbb{R}\to\mathbb{C}$を可積分、$a,w$を実数とする。$\hat{g}(w)=\int_{\mathbb{R}}e^{-2\pi ivw}f(v+a)\,dv$で$u=v+a$と置換すると、ルベーグ測度は平行移動で不変なので
    $\hat{g}(w)=\int_{\mathbb{R}}e^{-2\pi i(u-a)w}f(u)\,du=e^{2\pi iaw}\int_{\mathbb{R}}e^{-2\pi iuw}f(u)\,du=e^{2\pi iaw}\hat{f}(w)$
    である。
