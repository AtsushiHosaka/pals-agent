- id: factorial_elementary_exponential_bounds
  kind: gap
  level: 2
  topic: 特殊関数・階乗の初等的な評価
  statement: 正の整数$n$について$\left(\dfrac{n}{e}\right)^n\leq n!\leq e\,n\left(\dfrac{n}{e}\right)^n$である。
  statement_en: For a positive integer n, (n/e)^n ≤ n! ≤ e n (n/e)^n.
  assumptions:
  - $n\geq 1$
  quantifiers:
  - 任意の正の整数$n$
  conclusion: $\left(\dfrac{n}{e}\right)^n\leq n!\leq e\,n\left(\dfrac{n}{e}\right)^n$である。
  answer: |
    下からの評価を示す。$n\geq 1$とする。$e^{n}=\sum_{k=0}^{\infty}\frac{n^k}{k!}$の各項は正なので、$k=n$の項だけを残して$e^n\geq\frac{n^n}{n!}$である。よって$\left(\frac{n}{e}\right)^n\leq n!$である。

    上からの評価を$n$に関する帰納法で示す。$n=1$では両辺とも$1$である。$n\geq 1$で成り立つと仮定する。$x>0$で$\log(1+x)\geq\frac{x}{1+x}$なので、$x=\frac{1}{n}$として$\log\left(1+\frac{1}{n}\right)\geq\frac{1}{n+1}$である。よって$\left(1+\frac{1}{n}\right)^{n+1}\geq e$であり、$e\,n^{n+1}\leq(n+1)^{n+1}$である。帰納法の仮定から
    $(n+1)!\leq(n+1)\cdot e\,n\frac{n^n}{e^n}=(n+1)\frac{e\,n^{n+1}}{e^n}\leq(n+1)\frac{(n+1)^{n+1}}{e^n}=e\,(n+1)\left(\frac{n+1}{e}\right)^{n+1}$
    である。
  strategy: Keep one term of the exponential series for the lower bound, and induct with (1+1/n)^(n+1) ≥ e for the upper bound.
  sketch:
  - 'setup: Keep the term k = n of the series of e^n to get e^n ≥ n^n / n!.'
  - 'derive: Rearranging gives the lower bound.'
  - 'induction: The upper bound holds at n = 1.'
  - 'derive: From log(1+1/n) ≥ 1/(n+1), obtain e n^(n+1) ≤ (n+1)^(n+1).'
  - 'conclude: Combining with the hypothesis gives the upper bound for n + 1.'
  openmath: (forall (n) (-> (and (in n N) (>= n 1)) (and (<= (^ (/ n (exp 1)) n) (factorial n)) (<= (factorial n) (* (exp 1) (* n (^ (/ n (exp 1)) n)))))))
  hard_negative:
    statement: 正の整数$n$について$n!\leq\left(\dfrac{n}{e}\right)^n$である。
    reason: $n=1$とすると左辺は$1$であり、右辺は$\frac{1}{e}<1$である。
  target: |
    ∀ n : ℕ, 1 ≤ n → ((n : ℝ) / Real.exp 1) ^ n ≤ (n.factorial : ℝ) ∧ (n.factorial : ℝ) ≤ Real.exp 1 * n * ((n : ℝ) / Real.exp 1) ^ n
  proof: |
    by
      intro n hn
      have he := Real.exp_pos 1
      constructor
      · have h := Real.pow_div_factorial_le_exp (n : ℝ) (by positivity) n
        have hf : (0:ℝ) < n.factorial := by positivity
        rw [div_pow, div_le_iff₀ (by positivity)]
        rw [div_le_iff₀ hf] at h
        have : Real.exp n = Real.exp 1 ^ n := by rw [← Real.exp_nat_mul]; simp
        rw [this] at h
        linarith
      · induction n, hn using Nat.le_induction with
        | base => simp
        | succ n hn ih =>
          have hn0 : (0:ℝ) < n := by exact_mod_cast hn
          have hkey : Real.exp 1 * (n:ℝ) ^ (n + 1) ≤ ((n:ℝ) + 1) ^ (n + 1) := by
            have hlog : (1:ℝ) / (n + 1) ≤ Real.log (1 + 1 / n) := by
              have := Real.one_sub_inv_le_log_of_pos (x := 1 + 1 / (n:ℝ)) (by positivity)
              have e : 1 - (1 + 1 / (n:ℝ))⁻¹ = 1 / ((n:ℝ) + 1) := by field_simp; ring
              linarith
            have h2 : 1 ≤ ((n:ℝ) + 1) * Real.log (1 + 1 / n) := by
              have hp : (0:ℝ) < n + 1 := by positivity
              rw [div_le_iff₀ hp] at hlog
              linarith
            have h3 : Real.exp 1 ≤ (1 + 1 / (n:ℝ)) ^ (n + 1) := by
              rw [← Real.exp_log (show (0:ℝ) < (1 + 1 / (n:ℝ)) ^ (n + 1) by positivity), Real.log_pow]
              apply Real.exp_le_exp.mpr
              push_cast
              exact h2
            have h4 : (1 + 1 / (n:ℝ)) ^ (n + 1) * (n:ℝ) ^ (n + 1) = ((n:ℝ) + 1) ^ (n + 1) := by
              rw [← mul_pow]; congr 1; field_simp
            calc Real.exp 1 * (n:ℝ) ^ (n + 1) ≤ (1 + 1 / (n:ℝ)) ^ (n + 1) * (n:ℝ) ^ (n + 1) := by gcongr
              _ = _ := h4
          rw [Nat.factorial_succ]
          push_cast
          have hih : (n.factorial : ℝ) ≤ Real.exp 1 * n * ((n : ℝ) / Real.exp 1) ^ n := ih
          calc ((n:ℝ) + 1) * (n.factorial : ℝ) ≤ ((n:ℝ) + 1) * (Real.exp 1 * n * ((n : ℝ) / Real.exp 1) ^ n) := by gcongr
            _ = ((n:ℝ) + 1) * ((n:ℝ) ^ (n + 1) * Real.exp 1 / Real.exp 1 ^ n) := by
              rw [div_pow, pow_succ]; field_simp
            _ = ((n:ℝ) + 1) * (Real.exp 1 * (n:ℝ) ^ (n + 1)) / Real.exp 1 ^ n := by ring
            _ ≤ ((n:ℝ) + 1) * ((n:ℝ) + 1) ^ (n + 1) / Real.exp 1 ^ n := by gcongr
            _ = Real.exp 1 * ((n:ℝ) + 1) * (((n:ℝ) + 1) / Real.exp 1) ^ (n + 1) := by
              rw [div_pow, pow_succ (Real.exp 1)]; field_simp
- id: central_binomial_asymptotic
  kind: gap
  level: 3
  topic: 特殊関数・中心二項係数の漸近形
  statement: $n\to\infty$で$\dbinom{2n}{n}\dfrac{\sqrt{\pi n}}{4^n}\to 1$である。すなわち$\dbinom{2n}{n}\sim\dfrac{4^n}{\sqrt{\pi n}}$である。
  statement_en: As n → ∞, C(2n, n) √(πn) / 4^n tends to 1; that is, C(2n, n) is asymptotically equivalent to 4^n / √(πn).
  assumptions:
  - $n\to\infty$
  quantifiers:
  - 非負整数$n$
  conclusion: $\dbinom{2n}{n}\dfrac{\sqrt{\pi n}}{4^n}\to 1$である。
  answer: |
    $n\geq 1$について$a_n=\frac{n!}{\sqrt{2n}\,(n/e)^n}$とおく。スターリングの公式により$a_n\to\sqrt{\pi}$である。$\binom{2n}{n}=\frac{(2n)!}{(n!)^2}$に$(2n)!=a_{2n}\sqrt{4n}\left(\frac{2n}{e}\right)^{2n}$と$(n!)^2=a_n^2\cdot 2n\left(\frac{n}{e}\right)^{2n}$を代入すると
    $\binom{2n}{n}=\frac{a_{2n}}{a_n^2}\cdot\frac{2\sqrt{n}}{2n}\cdot 4^n=\frac{a_{2n}}{a_n^2}\cdot\frac{4^n}{\sqrt{n}}$
    である。よって$\binom{2n}{n}\frac{\sqrt{\pi n}}{4^n}=\sqrt{\pi}\,\frac{a_{2n}}{a_n^2}$であり、右辺は$\sqrt{\pi}\cdot\frac{\sqrt{\pi}}{\pi}=1$に収束する。
  strategy: Substitute the Stirling sequence into (2n)!/(n!)² and take the limit.
  sketch:
  - 'setup: Let a_n = n! / (√(2n) (n/e)^n), which tends to √π.'
  - 'derive: Substituting gives C(2n, n) = (a_(2n) / a_n²) 4^n / √n.'
  - 'derive: Hence C(2n, n) √(πn) / 4^n = √π a_(2n) / a_n².'
  - 'conclude: The right side tends to 1.'
  openmath: (seq_fn_tends_to (lambda (n) (/ (* (binomial (* 2 n) n) (root (* pi n) 2)) (^ 4 n))) 1)
  hard_negative:
    statement: $n\to\infty$で$\dbinom{2n}{n}\sim 4^n$である。
    reason: $\binom{2n}{n}/4^n$は$\frac{1}{\sqrt{\pi n}}$と同程度で$0$に収束する。
  target: |
    Filter.Tendsto (fun n : ℕ => (n.centralBinom : ℝ) * Real.sqrt (Real.pi * n) / 4 ^ n) Filter.atTop (nhds 1)
  proof: |
    by
      have hs := Stirling.tendsto_stirlingSeq_sqrt_pi
      have hp : Real.sqrt Real.pi ≠ 0 := by positivity
      have h2 : Filter.Tendsto (fun n : ℕ => 2 * n) Filter.atTop Filter.atTop := Filter.tendsto_id.const_mul_atTop' (by norm_num)
      have hq := ((hs.comp h2).div (hs.pow 2) (pow_ne_zero 2 hp)).const_mul (Real.sqrt Real.pi)
      have hv : Real.sqrt Real.pi * (Real.sqrt Real.pi / Real.sqrt Real.pi ^ 2) = 1 := by
        field_simp
      rw [hv] at hq
      refine hq.congr' ?_
      filter_upwards [Filter.eventually_ge_atTop 1] with n hn
      show Real.sqrt Real.pi * (Stirling.stirlingSeq (2 * n) / Stirling.stirlingSeq n ^ 2) = _
      have hn0 : (0:ℝ) < n := by exact_mod_cast hn
      have he := Real.exp_pos 1
      have hfact : ((2 * n).factorial : ℝ) = (n.centralBinom : ℝ) * (n.factorial : ℝ) ^ 2 := by
        have := Nat.choose_mul_factorial_mul_factorial (show n ≤ 2 * n by omega)
        rw [show 2 * n - n = n by omega] at this
        rw [Nat.centralBinom, ← this]
        push_cast
        ring
      have hA : (0:ℝ) < n.factorial := by positivity
      have hsn : Real.sqrt (2 * ((2 * n : ℕ) : ℝ)) = 2 * Real.sqrt n := by
        push_cast
        rw [show (2:ℝ) * (2 * (n:ℝ)) = 2 ^ 2 * n by ring, Real.sqrt_mul (by positivity), Real.sqrt_sq (by norm_num)]
      have hsq : Real.sqrt (2 * (n:ℝ)) ^ 2 = 2 * n := Real.sq_sqrt (by positivity)
      have hpow : (((2 * n : ℕ) : ℝ) / Real.exp 1) ^ (2 * n) = 4 ^ n * (((n:ℝ) / Real.exp 1) ^ n) ^ 2 := by
        push_cast
        rw [show (2 * (n:ℝ)) / Real.exp 1 = 2 * ((n:ℝ) / Real.exp 1) by ring, mul_pow]
        have a1 : (2:ℝ) ^ (2 * n) = 4 ^ n := by rw [pow_mul]; norm_num
        have a2 : ((n:ℝ) / Real.exp 1) ^ (2 * n) = (((n:ℝ) / Real.exp 1) ^ n) ^ 2 := by rw [← pow_mul, mul_comm]
        rw [a1, a2]
      have hpi : Real.sqrt (Real.pi * n) = Real.sqrt Real.pi * Real.sqrt n := Real.sqrt_mul Real.pi_pos.le _
      simp only [Stirling.stirlingSeq]
      rw [hfact, hsn, hpow, hpi]
      have hE : (0:ℝ) < ((n:ℝ) / Real.exp 1) ^ n := by positivity
      have hsqrt : (0:ℝ) < Real.sqrt n := Real.sqrt_pos.mpr hn0
      have hss : Real.sqrt n ^ 2 = (n:ℝ) := Real.sq_sqrt hn0.le
      generalize ((n:ℝ) / Real.exp 1) ^ n = E at *
      rw [div_pow, mul_pow, hsq]
      have h2n : 2 * (n:ℝ) = 2 * Real.sqrt n ^ 2 := by rw [hss]
      rw [h2n]
      generalize Real.sqrt (n:ℝ) = s at *
      generalize (n.factorial : ℝ) = A at *
      generalize (n.centralBinom : ℝ) = C at *
      generalize Real.sqrt Real.pi = p at *
      field_simp
- id: wallis_product
  kind: named
  level: 2
  topic: 特殊関数・ウォリスの積
  statement: ウォリスの積。$\displaystyle\lim_{n\to\infty}\prod_{k=1}^{n}\frac{2k}{2k-1}\cdot\frac{2k}{2k+1}=\frac{\pi}{2}$である。
  statement_en: Wallis's product. The limit as n → ∞ of ∏_{k=1}^{n} (2k/(2k-1)) (2k/(2k+1)) is π/2.
  assumptions:
  - $n\to\infty$
  quantifiers:
  - 正の整数$n$
  conclusion: $\displaystyle\lim_{n\to\infty}\prod_{k=1}^{n}\frac{2k}{2k-1}\cdot\frac{2k}{2k+1}=\frac{\pi}{2}$である。
  answer: |
    $I_m=\int_0^{\pi/2}\sin^{m}x\,dx$とおく。部分積分により$m\geq 2$で$I_m=\frac{m-1}{m}I_{m-2}$であり、$I_0=\frac{\pi}{2}$、$I_1=1$である。これを繰り返すと
    $I_{2n}=\frac{\pi}{2}\prod_{k=1}^{n}\frac{2k-1}{2k},\qquad I_{2n+1}=\prod_{k=1}^{n}\frac{2k}{2k+1}$
    である。したがって$W_n=\prod_{k=1}^{n}\frac{2k}{2k-1}\cdot\frac{2k}{2k+1}$について$W_n=\frac{\pi}{2}\cdot\frac{I_{2n+1}}{I_{2n}}$である。

    $0\leq\sin x\leq 1$なので$I_m$は単調減少で正である。よって$I_{2n+1}\leq I_{2n}\leq I_{2n-1}=\frac{2n+1}{2n}I_{2n+1}$であり、$\frac{2n}{2n+1}\leq\frac{I_{2n+1}}{I_{2n}}\leq 1$である。はさみうちにより$\frac{I_{2n+1}}{I_{2n}}\to 1$であり、$W_n\to\frac{\pi}{2}$である。
  strategy: Express the partial product as (π/2) I_(2n+1)/I_(2n) for the sine power integrals and squeeze the ratio.
  sketch:
  - 'setup: Let I_m be the integral of sin^m over [0, π/2].'
  - 'derive: Integration by parts gives I_m = ((m-1)/m) I_(m-2).'
  - 'derive: This yields the partial product W_n = (π/2) I_(2n+1) / I_(2n).'
  - 'derive: Monotonicity of I_m gives 2n/(2n+1) ≤ I_(2n+1)/I_(2n) ≤ 1.'
  - 'conclude: The squeeze theorem gives W_n → π/2.'
  openmath: (seq_fn_tends_to (lambda (n) (prod_over (finset_range n) (lambda (k) (* (/ (+ (* 2 k) 2) (+ (* 2 k) 1)) (/ (+ (* 2 k) 2) (+ (* 2 k) 3)))))) (/ pi 2))
  hard_negative:
    statement: $\displaystyle\lim_{n\to\infty}\prod_{k=1}^{n}\frac{2k}{2k-1}\cdot\frac{2k}{2k+1}=\pi$である。
    reason: 証明の中の等式から部分積は$\frac{\pi}{2}\cdot\frac{I_{2n+1}}{I_{2n}}\leq\frac{\pi}{2}$なので、極限は$\pi$にならない。
  target: |
    Filter.Tendsto (fun k : ℕ => ∏ i ∈ Finset.range k, ((2 : ℝ) * i + 2) / (2 * i + 1) * ((2 * i + 2) / (2 * i + 3))) Filter.atTop (nhds (Real.pi / 2))
  proof: |
    by
      exact Real.tendsto_prod_pi_div_two
- id: euler_sine_product
  kind: named
  level: 3
  topic: 特殊関数・オイラーの正弦積
  statement: オイラーの正弦積。任意の複素数$z$について$\displaystyle\sin\pi z=\pi z\lim_{n\to\infty}\prod_{k=1}^{n}\left(1-\frac{z^2}{k^2}\right)$である。
  statement_en: Euler's sine product. For every complex number z, sin(πz) = πz times the limit as n → ∞ of ∏_{k=1}^{n} (1 - z²/k²).
  assumptions:
  - $z\in\mathbb{C}$
  quantifiers:
  - 任意の複素数$z$
  conclusion: $\displaystyle\pi z\prod_{k=1}^{n}\left(1-\frac{z^2}{k^2}\right)\to\sin\pi z$である。
  answer: |
    $z=0$では両辺とも$0$なので、$z\neq 0$とする。$n\geq 0$について$J_n=\int_0^{\pi/2}\cos(2zx)\cos^{n}x\,dx$、$B_n=\int_0^{\pi/2}\cos^{n}x\,dx>0$とおく。

    $n\geq 2$とする。$\cos(2zx)$を積分する形で部分積分を2回行う。$\sin(2z\cdot 0)=0$、$\cos\frac{\pi}{2}=0$から境界の項は消え、$(\cos^{n-1}x\sin x)'=n\cos^{n}x-(n-1)\cos^{n-2}x$なので
    $J_n=\frac{n}{4z^2}\left(nJ_n-(n-1)J_{n-2}\right)$
    である。したがって$(n^2-4z^2)J_n=n(n-1)J_{n-2}$である。同様に$nB_n=(n-1)B_{n-2}$である。$n=2k$とすると、$R_k=J_{2k}/B_{2k}$について$\left(1-\frac{z^2}{k^2}\right)R_k=R_{k-1}$を得る。

    $R_0=\frac{\sin\pi z}{2z}\cdot\frac{2}{\pi}=\frac{\sin\pi z}{\pi z}$なので、$\frac{\sin\pi z}{\pi z}=\left(\prod_{k=1}^{n}\left(1-\frac{z^2}{k^2}\right)\right)R_n$である。

    $R_n\to 1$を示す。$\varepsilon>0$をとる。$x\mapsto\cos(2zx)$は連続で$x=0$で値$1$をとるので、$0<\delta<\frac{\pi}{2}$があって$0\leq x\leq\delta$で$|\cos(2zx)-1|<\varepsilon$である。$M$を$[0,\frac{\pi}{2}]$上の$|\cos(2zx)-1|$の最大値とする。すると
    $|R_n-1|\leq\varepsilon+M\frac{\int_\delta^{\pi/2}\cos^{2n}x\,dx}{B_{2n}}\leq\varepsilon+M\frac{\frac{\pi}{2}\cos^{2n}\delta}{\frac{\delta}{2}\cos^{2n}\frac{\delta}{2}}$
    である。$\frac{\cos\delta}{\cos(\delta/2)}<1$なので第2項は$n\to\infty$で$0$に収束する。よって$R_n\to 1$である。

    $\frac{\sin\pi z}{\pi z}=\left(\prod_{k=1}^{n}\left(1-\frac{z^2}{k^2}\right)\right)R_n$の両辺に$\pi z$を掛ける。$n$が十分大きければ$R_n\neq 0$なので、$\pi z\prod_{k=1}^{n}\left(1-\frac{z^2}{k^2}\right)=\frac{\sin\pi z}{R_n}\to\sin\pi z$である。
  strategy: Use a recursion for the integrals of cos(2zx) cos^n x and the concentration of cos^(2n) x near 0.
  sketch:
  - 'setup: Let J_n be the integral of cos(2zx) cos^n x over [0, π/2] and B_n the integral of cos^n x.'
  - 'derive: Two integrations by parts give (n² - 4z²) J_n = n(n-1) J_(n-2), and n B_n = (n-1) B_(n-2).'
  - 'derive: For R_k = J_(2k)/B_(2k), this gives (1 - z²/k²) R_k = R_(k-1).'
  - 'derive: Since R_0 = sin(πz)/(πz), one has sin(πz)/(πz) = R_n ∏_{k≤n} (1 - z²/k²).'
  - 'derive: The mass of cos^(2n) x concentrates near 0, so R_n → 1.'
  - 'conclude: Hence πz ∏_{k≤n} (1 - z²/k²) → sin(πz).'
  openmath: (forall (z) (-> (in z C) (seq_fn_tends_to (lambda (n) (* (* pi z) (prod_over (finset_range n) (lambda (j) (- 1 (/ (^ z 2) (^ (+ j 1) 2))))))) (complex_sin (* pi z)))))
  hard_negative:
    statement: 任意の複素数$z$について$\displaystyle\sin\pi z=\pi z\lim_{n\to\infty}\prod_{k=1}^{n}\left(1-\frac{z}{k}\right)$である。
    reason: $z=-1$とすると因子はすべて$1+\frac{1}{k}$であり、積は$n+1$となって発散する。一方$\sin(-\pi)=0$である。
  target: |
    ∀ z : ℂ, Filter.Tendsto (fun n : ℕ => (Real.pi : ℂ) * z * ∏ j ∈ Finset.range n, (1 - z ^ 2 / ((j : ℂ) + 1) ^ 2)) Filter.atTop (nhds (Complex.sin (Real.pi * z)))
  proof: |
    by
      exact Complex.tendsto_euler_sin_prod
- id: cotangent_partial_fractions
  kind: textbook
  level: 3
  topic: 特殊関数・余接の部分分数展開
  statement: 整数でない複素数$z$について、級数$\sum_{n=1}^{\infty}\left(\dfrac{1}{z-n}+\dfrac{1}{z+n}\right)$は絶対収束し、$\pi\cot\pi z=\dfrac{1}{z}+\sum_{n=1}^{\infty}\left(\dfrac{1}{z-n}+\dfrac{1}{z+n}\right)$である。
  statement_en: For a complex number z that is not an integer, the series Σ_{n≥1} (1/(z-n) + 1/(z+n)) converges absolutely, and π cot(πz) = 1/z + Σ_{n≥1} (1/(z-n) + 1/(z+n)).
  assumptions:
  - $z\in\mathbb{C}$は整数でない
  quantifiers:
  - 任意の複素数$z$
  conclusion: $\pi\cot\pi z-\dfrac{1}{z}=\sum_{n=1}^{\infty}\left(\dfrac{1}{z-n}+\dfrac{1}{z+n}\right)$であり、右辺は絶対収束する。
  answer: |
    $z$を整数でない複素数とする。$\frac{1}{z-n}+\frac{1}{z+n}=\frac{2z}{z^2-n^2}$である。$n$が大きければ$|z^2-n^2|\geq\frac{n^2}{2}$なので、この項の絶対値は$\frac{4|z|}{n^2}$以下である。よって級数は絶対収束する。

    $\mathbb{C}$の整数を含まない有界開集合$U$をとり、$z\in U$とする。オイラーの正弦積の部分積$P_n(w)=\pi w\prod_{k=1}^{n}\left(1-\frac{w^2}{k^2}\right)$を考える。$\sum_{k}\left|\frac{w^2}{k^2}\right|$は$U$上で一様収束するので、$P_n\to\sin\pi w$は$U$上で一様収束である。正則関数列が広義一様収束するとき、導関数の列も広義一様収束する。$U$上で$\sin\pi w\neq 0$なので、対数微分$\frac{P_n'}{P_n}$は$\frac{\pi\cos\pi w}{\sin\pi w}=\pi\cot\pi w$に広義一様収束する。

    積の対数微分は和になるので、
    $\frac{P_n'(w)}{P_n(w)}=\frac{1}{w}+\sum_{k=1}^{n}\frac{-2w/k^2}{1-w^2/k^2}=\frac{1}{w}+\sum_{k=1}^{n}\frac{2w}{w^2-k^2}=\frac{1}{w}+\sum_{k=1}^{n}\left(\frac{1}{w-k}+\frac{1}{w+k}\right)$
    である。$w=z$で$n\to\infty$とすると主張を得る。
  strategy: Logarithmically differentiate Euler's sine product, using locally uniform convergence.
  sketch:
  - 'setup: The general term equals 2z/(z² - n²), which is O(1/n²), so the series converges absolutely.'
  - 'apply_theorem: The partial products of Euler''s sine product converge locally uniformly away from the integers.'
  - 'derive: Locally uniform convergence passes to derivatives, so the logarithmic derivatives converge to π cot(πw).'
  - 'derive: The logarithmic derivative of the partial product is 1/w + Σ_{k≤n} (1/(w-k) + 1/(w+k)).'
  - 'conclude: Letting n → ∞ gives the partial fraction expansion.'
  openmath: (forall (z) (-> (and (in z C) (forall (k) (-> (in k Z) (!= z k)))) (series_has_sum (lambda (n) (+ (/ 1 (- z (+ n 1))) (/ 1 (+ z (+ n 1))))) (- (* pi (complex_cot (* pi z))) (/ 1 z)))))
  hard_negative:
    statement: 整数でない複素数$z$について$\pi\cot\pi z=\sum_{n=1}^{\infty}\left(\dfrac{1}{z-n}+\dfrac{1}{z+n}\right)$である。
    reason: $z=\frac{1}{2}$とする。$\cot\frac{\pi}{2}=0$である。一方、右辺に$\frac{1}{z}=2$を足したものが$0$なので、右辺そのものは$-2$である。
  target: |
    ∀ z : ℂ, (∀ n : ℤ, z ≠ n) → HasSum (fun n : ℕ => 1 / (z - ((n : ℂ) + 1)) + 1 / (z + ((n : ℂ) + 1))) (Real.pi * Complex.cot (Real.pi * z) - 1 / z)
  proof: |
    by
      intro z hz
      have hmem : z ∈ Complex.integerComplement := by
        rw [Complex.integerComplement, Set.mem_compl_iff, Set.mem_range]
        rintro ⟨n, rfl⟩
        exact hz n rfl
      rw [cot_series_rep' hmem]
      exact (summable_cotTerm hmem).hasSum
- id: fourier_coeff_linear_combination
  kind: gap
  level: 3
  topic: フーリエ級数・係数の線形性
  statement: $T>0$とし、$\mathbb{R}/T\mathbb{Z}$に全測度$1$の不変測度$\mu$を入れる。$n\in\mathbb{Z}$について$e_n(x)=e^{2\pi inx/T}$、$c_n(f)=\int e_{-n}f\,d\mu$とする。可積分な$f,g$と$c\in\mathbb{C}$について$c_n(cf+g)=c\,c_n(f)+c_n(g)$である。
  statement_en: Let T > 0, let μ be the invariant measure of total mass 1 on ℝ/Tℤ, let e_n(x) = e^(2πinx/T) and c_n(f) be the integral of e_(-n) f. For integrable f, g and a complex c, c_n(cf + g) = c c_n(f) + c_n(g).
  assumptions:
  - $T>0$
  - $f,g$は$\mu$について可積分
  - $c\in\mathbb{C}$
  quantifiers:
  - 任意の$T>0$
  - 任意の可積分関数$f,g$
  - 任意の$c\in\mathbb{C}$
  - 任意の$n\in\mathbb{Z}$
  conclusion: $c_n(cf+g)=c\,c_n(f)+c_n(g)$である。
  answer: |
    $T>0$とし、$\mu$を$\mathbb{R}/T\mathbb{Z}$上の全測度$1$の不変測度、$e_n(x)=e^{2\pi inx/T}$とする。$f,g$を可積分、$c\in\mathbb{C}$、$n\in\mathbb{Z}$とする。$|e_{-n}|=1$なので$e_{-n}f$と$e_{-n}g$は可積分である。積分の線形性より
    $c_n(cf+g)=\int e_{-n}(cf+g)\,d\mu=c\int e_{-n}f\,d\mu+\int e_{-n}g\,d\mu=c\,c_n(f)+c_n(g)$
    である。
  strategy: Use linearity of the integral, the integrands being integrable because |e_(-n)| = 1.
  sketch:
  - 'setup: Since |e_(-n)| = 1, the functions e_(-n) f and e_(-n) g are integrable.'
  - 'derive: Expand e_(-n)(cf + g) as c e_(-n) f + e_(-n) g.'
  - 'conclude: Linearity of the integral gives the formula.'
  openmath: (forall (T f g c n) (-> (and (> T 0) (integrable_circle T f) (integrable_circle T g) (in c C) (in n Z)) (= (fourier_coeff_circle_fn T (lambda (x) (+ (* c (fn_value f x)) (fn_value g x))) n) (+ (* c (fourier_coeff_circle T f n)) (fourier_coeff_circle T g n)))))
  hard_negative:
    statement: 可積分な$f,g$について$c_n(fg)=c_n(f)c_n(g)$である。
    reason: 積の係数は畳み込みで表される。$T=1$、$f=g=e_1$、$n=2$とすると$fg=e_2$なので$c_2(fg)=1$であるが、$c_2(f)c_2(g)=0$である。
