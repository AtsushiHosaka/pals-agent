- id: finite_abelian_parseval
  kind: gap
  level: 3
  topic: 有限アーベル群・パーセバルの等式
  statement: 有限アーベル群$G$と$f:G\to\mathbb{C}$について、$\hat{f}(\psi)=\sum_{y\in G}f(y)\overline{\psi(y)}$とすると$\sum_{\psi}|\hat{f}(\psi)|^2=|G|\sum_{x\in G}|f(x)|^2$である。
  statement_en: For a finite abelian group G and a complex function f on G, with f^(ψ) = Σ_{y∈G} f(y) conj ψ(y), one has Σ_ψ |f^(ψ)|² = |G| Σ_{x∈G} |f(x)|².
  assumptions:
  - $G$は有限アーベル群
  - $f:G\to\mathbb{C}$
  quantifiers:
  - 任意の$G$
  - 任意の$f$
  conclusion: $\sum_{\psi}|\hat{f}(\psi)|^2=|G|\sum_{x\in G}|f(x)|^2$である。
  answer: |
    $G$を有限アーベル群、$f:G\to\mathbb{C}$とする。$\psi$を固定すると、$\overline{\psi(y)}\psi(z)=\psi(z-y)$より
    $|\hat{f}(\psi)|^2=\hat{f}(\psi)\overline{\hat{f}(\psi)}=\sum_{y,z\in G}f(y)\overline{f(z)}\psi(z-y)$
    である。$\psi$について足して和の順序を交換すると、第2直交関係により内側の和$\sum_\psi\psi(z-y)$は$z=y$で$|G|$、それ以外で$0$である。よって$\sum_{\psi}|\hat{f}(\psi)|^2=|G|\sum_{y\in G}f(y)\overline{f(y)}=|G|\sum_{y\in G}|f(y)|^2$である。
  strategy: Expand the square modulus and apply second orthogonality.
  sketch:
  - 'setup: Expand |f^(ψ)|² as a double sum of f(y) conj f(z) ψ(z-y).'
  - 'derive: Sum over ψ and exchange the order of summation.'
  - 'apply_theorem: Second orthogonality keeps only the terms with z = y, each multiplied by |G|.'
  - 'conclude: The result is |G| Σ |f(x)|².'
  openmath: (forall (G f) (-> (finite_add_comm_group G) (= (sum_over_characters G (lambda (c) (^ (abs (sum_over_group G (lambda (y) (* (fn_value f y) (complex_conj (fn_value c y)))))) 2))) (* (group_order G) (sum_over_group G (lambda (x) (^ (abs (fn_value f x)) 2)))))))
  hard_negative:
    statement: 同じ記号で$\sum_{\psi}|\hat{f}(\psi)|^2=\sum_{x\in G}|f(x)|^2$である。
    reason: $G=\mathbb{Z}/2\mathbb{Z}$、$f\equiv 1$とすると左辺は$4$であり、右辺は$2$である。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [Fintype G] [DecidableEq G] (f : G → ℂ), ∑ ψ : AddChar G ℂ, Complex.normSq (∑ y, f y * (starRingEnd ℂ) (ψ y)) = (Fintype.card G : ℝ) * ∑ x, Complex.normSq (f x)
  proof: |
    by
      intro G _ _ _ f
      have hc : ((∑ ψ : AddChar G ℂ, Complex.normSq (∑ y, f y * (starRingEnd ℂ) (ψ y)) : ℝ) : ℂ) = (((Fintype.card G : ℝ) * ∑ x, Complex.normSq (f x) : ℝ) : ℂ) := by
        push_cast
        have e : ∀ ψ : AddChar G ℂ, ((Complex.normSq (∑ y, f y * (starRingEnd ℂ) (ψ y)) : ℝ) : ℂ) = ∑ y, ∑ z, f y * (starRingEnd ℂ) (f z) * ψ (z - y) := by
          intro ψ
          rw [← Complex.mul_conj, map_sum, Finset.sum_mul_sum]
          refine Finset.sum_congr rfl (fun y _ => Finset.sum_congr rfl (fun z _ => ?_))
          rw [map_mul, Complex.conj_conj, sub_eq_add_neg, AddChar.map_add_eq_mul, AddChar.map_neg_eq_conj]
          ring
        simp only [e]
        rw [Finset.sum_comm]
        simp only [Finset.mul_sum]
        refine Finset.sum_congr rfl (fun y _ => ?_)
        rw [Finset.sum_comm]
        have e2 : ∀ z : G, ∑ ψ : AddChar G ℂ, f y * (starRingEnd ℂ) (f z) * ψ (z - y) = f y * (starRingEnd ℂ) (f z) * (if z = y then (Fintype.card G : ℂ) else 0) := by
          intro z
          rw [← Finset.mul_sum, AddChar.sum_apply_eq_ite]
          simp [sub_eq_zero]
        simp only [e2, mul_ite, mul_zero]
        rw [Finset.sum_ite_eq' Finset.univ y]
        simp only [Finset.mem_univ, if_true]
        rw [Complex.mul_conj]
        ring
      exact_mod_cast hc
- id: finite_abelian_convolution_theorem
  kind: gap
  level: 3
  topic: 有限アーベル群・畳み込み定理
  statement: 有限アーベル群$G$上の関数$f,g$について$(f*g)(x)=\sum_{y\in G}f(y)g(x-y)$とし、指標$\psi$について$\hat{f}(\psi)=\sum_{x\in G}f(x)\overline{\psi(x)}$とする。このとき$\widehat{f*g}(\psi)=\hat{f}(\psi)\hat{g}(\psi)$である。
  statement_en: For functions f, g on a finite abelian group G, let (f*g)(x) = Σ_{y∈G} f(y) g(x-y), and for a character ψ let f^(ψ) = Σ_{x∈G} f(x) conj ψ(x). Then the transform of f*g at ψ equals f^(ψ) g^(ψ).
  assumptions:
  - $G$は有限アーベル群
  - $f,g:G\to\mathbb{C}$
  - $\psi$は$G$の指標
  quantifiers:
  - 任意の$G$
  - 任意の$f,g$
  - 任意の指標$\psi$
  conclusion: $\widehat{f*g}(\psi)=\hat{f}(\psi)\hat{g}(\psi)$である。
  answer: |
    $G$を有限アーベル群、$f,g:G\to\mathbb{C}$、$\psi$を指標とする。和の順序を交換し、$y$を固定して$x=y+z$と置くと、$\overline{\psi(y+z)}=\overline{\psi(y)}\,\overline{\psi(z)}$より
    $\widehat{f*g}(\psi)=\sum_{y\in G}\sum_{x\in G}f(y)g(x-y)\overline{\psi(x)}=\sum_{y\in G}\sum_{z\in G}f(y)\overline{\psi(y)}g(z)\overline{\psi(z)}=\hat{f}(\psi)\hat{g}(\psi)$
    である。
  strategy: Exchange the sums and substitute x = y + z.
  sketch:
  - 'setup: Expand the transform of f*g as a double sum.'
  - 'translate: Exchange the sums and substitute x = y + z, a bijection for fixed y.'
  - 'derive: The character is multiplicative, so the double sum factors.'
  - 'conclude: The result is f^(ψ) g^(ψ).'
  openmath: (forall (G f g c) (-> (and (finite_add_comm_group G) (complex_add_character_of c G)) (= (sum_over_group G (lambda (x) (* (sum_over_group G (lambda (y) (* (fn_value f y) (fn_value g (- x y))))) (complex_conj (fn_value c x))))) (* (sum_over_group G (lambda (y) (* (fn_value f y) (complex_conj (fn_value c y))))) (sum_over_group G (lambda (z) (* (fn_value g z) (complex_conj (fn_value c z)))))))))
  hard_negative:
    statement: 各点積$fg$について$\widehat{fg}=\hat{f}\hat{g}$である。
    reason: $G=\mathbb{Z}/2\mathbb{Z}$、$f=g\equiv 1$、$\psi$を自明な指標とすると$\widehat{fg}(\psi)=2$であるが、$\hat{f}(\psi)\hat{g}(\psi)=4$である。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [Fintype G] [DecidableEq G] (f g : G → ℂ) (ψ : AddChar G ℂ), ∑ x, (∑ y, f y * g (x - y)) * (starRingEnd ℂ) (ψ x) = (∑ y, f y * (starRingEnd ℂ) (ψ y)) * ∑ z, g z * (starRingEnd ℂ) (ψ z)
  proof: |
    by
      intro G _ _ _ f g ψ
      rw [Finset.sum_mul_sum]
      simp only [Finset.sum_mul]
      rw [Finset.sum_comm]
      refine Finset.sum_congr rfl (fun y _ => ?_)
      rw [← Equiv.sum_comp (Equiv.addLeft y) (fun x => f y * g (x - y) * (starRingEnd ℂ) (ψ x))]
      refine Finset.sum_congr rfl (fun z _ => ?_)
      simp only [Equiv.coe_addLeft, add_sub_cancel_left, AddChar.map_add_eq_mul, map_mul]
      ring
- id: roots_of_unity_exponential_sum
  kind: gap
  level: 2
  topic: 離散フーリエ変換・1の冪根の指数和
  statement: 正の整数$n$と整数$m$について、$\sum_{k=0}^{n-1}e^{2\pi ikm/n}$は$n\mid m$なら$n$、$n\nmid m$なら$0$である。
  statement_en: For a positive integer n and an integer m, Σ_{k=0}^{n-1} e^(2πikm/n) equals n if n divides m, and 0 otherwise.
  assumptions:
  - $n\geq 1$
  - $m\in\mathbb{Z}$
  quantifiers:
  - 任意の正の整数$n$
  - 任意の整数$m$
  conclusion: 和は$n\mid m$なら$n$、$n\nmid m$なら$0$である。
  answer: |
    $n\geq 1$、$m\in\mathbb{Z}$とし、$\zeta=e^{2\pi im/n}$とおく。各項は$\zeta^k$である。$\zeta^n=e^{2\pi im}=1$である。

    $n\mid m$なら$\frac{m}{n}$は整数なので$\zeta=1$であり、和は$n$である。

    $n\nmid m$なら$\frac{m}{n}$は整数でないので$\zeta\neq 1$である。等比数列の和より$\sum_{k=0}^{n-1}\zeta^k=\frac{\zeta^n-1}{\zeta-1}=0$である。
  strategy: Write the sum as a geometric sum with ratio e^(2πim/n).
  sketch:
  - 'setup: Put ζ = e^(2πim/n), an n-th root of unity.'
  - 'case_split: Either n divides m or not.'
  - 'derive: If n | m, then ζ = 1 and the sum is n.'
  - 'derive: Otherwise ζ ≠ 1, and the geometric sum equals (ζ^n - 1)/(ζ - 1) = 0.'
  - 'conclude: Both cases give the claim.'
  openmath: (forall (n m) (-> (and (in n N) (>= n 1) (in m Z)) (and (-> (exists (q) (and (in q Z) (= m (* n q)))) (= (range_sum n (lambda (k) (exp (/ (* 2 (* pi (* complex_i (* k m)))) n)))) n)) (-> (not (exists (q) (and (in q Z) (= m (* n q))))) (= (range_sum n (lambda (k) (exp (/ (* 2 (* pi (* complex_i (* k m)))) n)))) 0)))))
  hard_negative:
    statement: 正の整数$n$と整数$m$について$\sum_{k=0}^{n-1}e^{2\pi ikm/n}$は常に$0$である。
    reason: $m=0$とすると各項は$1$であり、和は$n$である。
  target: |
    ∀ (n : ℕ) (m : ℤ), n ≠ 0 → ∑ k ∈ Finset.range n, Complex.exp (2 * Real.pi * Complex.I * (k : ℂ) * (m : ℂ) / (n : ℂ)) = if (n : ℤ) ∣ m then (n : ℂ) else 0
  proof: |
    by
      intro n m hn
      have hp := Complex.isPrimitiveRoot_exp n hn
      set ζ₀ := Complex.exp (2 * Real.pi * Complex.I / n) with hζ₀
      have e : ∀ k : ℕ, Complex.exp (2 * Real.pi * Complex.I * (k : ℂ) * (m : ℂ) / (n : ℂ)) = (ζ₀ ^ m) ^ k := by
        intro k
        rw [hζ₀, ← Complex.exp_int_mul, ← Complex.exp_nat_mul]
        congr 1
        ring
      simp only [e]
      split_ifs with h
      · have : ζ₀ ^ m = 1 := (hp.zpow_eq_one_iff_dvd m).mpr h
        simp [this]
      · have hne : ζ₀ ^ m ≠ 1 := fun h1 => h ((hp.zpow_eq_one_iff_dvd m).mp h1)
        have hpow : (ζ₀ ^ m) ^ n = 1 := by
          rw [← zpow_natCast, ← zpow_mul, mul_comm, zpow_mul, zpow_natCast, hp.pow_eq_one, one_zpow]
        have := mul_neg_geom_sum (ζ₀ ^ m) n
        rw [hpow, sub_self] at this
        exact (mul_eq_zero.mp this).resolve_left (sub_ne_zero.mpr hne.symm)
- id: zmod_dft_inversion_and_double
  kind: gap
  level: 3
  topic: 離散フーリエ変換・反転公式
  statement: $N$を正の整数とする。$\Phi:\mathbb{Z}/N\mathbb{Z}\to\mathbb{C}$の離散フーリエ変換を$\hat{\Phi}(k)=\sum_{j}e^{-2\pi ijk/N}\Phi(j)$とする。すべての$j$について$\Phi(j)=\frac{1}{N}\sum_{k}e^{2\pi ijk/N}\hat{\Phi}(k)$であり、$\hat{\hat{\Phi}}(j)=N\Phi(-j)$である。
  statement_en: Let N be a positive integer. The discrete Fourier transform of Φ on ℤ/Nℤ is Φ^(k) = Σ_j e^(-2πijk/N) Φ(j). For all j, Φ(j) = (1/N) Σ_k e^(2πijk/N) Φ^(k), and the transform of Φ^ at j equals N Φ(-j).
  assumptions:
  - $N\geq 1$
  - $\Phi:\mathbb{Z}/N\mathbb{Z}\to\mathbb{C}$
  quantifiers:
  - 任意の正の整数$N$
  - 任意の$\Phi$
  - 任意の$j\in\mathbb{Z}/N\mathbb{Z}$
  conclusion: $\Phi(j)=\frac{1}{N}\sum_{k}e^{2\pi ijk/N}\hat{\Phi}(k)$であり、$\hat{\hat{\Phi}}(j)=N\Phi(-j)$である。
  answer: |
    $N\geq 1$、$\Phi:\mathbb{Z}/N\mathbb{Z}\to\mathbb{C}$、$j\in\mathbb{Z}/N\mathbb{Z}$とする。$\hat{\Phi}$の定義を代入して和の順序を交換すると
    $\sum_{k}e^{2\pi ijk/N}\hat{\Phi}(k)=\sum_{l}\Phi(l)\sum_{k}e^{2\pi i(j-l)k/N}$
    である。$1$の冪根の指数和により、内側の和は$l=j$で$N$、それ以外で$0$である。よって左辺は$N\Phi(j)$であり、第1式を得る。

    第2式は定義から$\hat{\hat{\Phi}}(j)=\sum_ke^{-2\pi ijk/N}\hat{\Phi}(k)=\sum_ke^{2\pi i(-j)k/N}\hat{\Phi}(k)$である。第1式を$-j$に用いると、これは$N\Phi(-j)$である。
  strategy: Exchange sums and use the orthogonality of roots of unity.
  sketch:
  - 'setup: Substitute the definition of Φ^ and exchange the sums.'
  - 'apply_theorem: The sum of e^(2πi(j-l)k/N) over k is N for l = j and 0 otherwise.'
  - 'derive: This gives the inversion formula.'
  - 'conclude: Applying it at -j gives the double transform formula.'
  openmath: (forall (M f j) (-> (and (in M N) (>= M 1) (in j (zmod_ring M))) (and (= (fn_value f j) (* (/ 1 M) (sum_over_group (zmod_ring M) (lambda (k) (* (zmod_std_character M (* j k)) (zmod_dft M f k)))))) (= (zmod_dft_fn M (lambda (k) (zmod_dft M f k)) j) (* M (fn_value f (neg j)))))))
  hard_negative:
    statement: 同じ記号で$\hat{\hat{\Phi}}(j)=N\Phi(j)$である。
    reason: $N=3$、$\Phi$を$1$でだけ$1$をとる関数とすると、$\hat{\hat{\Phi}}$は$j=-1=2$で値$3$をとり、$j=1$では$0$である。
  target: |
    ∀ (N : ℕ) [NeZero N] (Φ : ZMod N → ℂ) (j : ZMod N), Φ j = (N : ℂ)⁻¹ * ∑ k, ZMod.stdAddChar (j * k) * ZMod.dft Φ k ∧ ZMod.dft (ZMod.dft Φ) j = (N : ℂ) * Φ (-j)
  proof: |
    by
      intro N _ Φ j
      constructor
      · have h := congrFun (ZMod.dft.symm_apply_apply Φ) j
        rw [ZMod.invDFT_apply] at h
        rw [← h]
        simp [smul_eq_mul, mul_comm]
      · have := congrFun (ZMod.dft_dft Φ) j
        simpa using this
- id: zmod_dft_plancherel
  kind: gap
  level: 3
  topic: 離散フーリエ変換・プランシュレルの等式
  statement: $N$を正の整数とし、$\Phi:\mathbb{Z}/N\mathbb{Z}\to\mathbb{C}$の離散フーリエ変換を$\hat{\Phi}(k)=\sum_{j}e^{-2\pi ijk/N}\Phi(j)$とする。$\sum_{k}|\hat{\Phi}(k)|^2=N\sum_{j}|\Phi(j)|^2$である。
