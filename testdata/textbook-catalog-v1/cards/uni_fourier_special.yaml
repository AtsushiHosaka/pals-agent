  hard_negative:
    statement: 非負整数$m,n$について$\int_0^1x^{m}(1-x)^{n}\,dx=\dfrac{m!\,n!}{(m+n)!}$である。
    reason: $m=n=1$とすると左辺は$\frac{1}{6}$であるが、右辺は$\frac{1}{2}$である。
  target: |
    ∀ m n : ℕ, ∫ x in (0:ℝ)..1, x ^ m * (1 - x) ^ n = (m.factorial : ℝ) * (n.factorial : ℝ) / ((m + n + 1).factorial : ℝ)
