  statement: $\mathrm{Re}\,u>0$、$\mathrm{Re}\,v>0$である複素数$u,v$について、$u\,B(u,v+1)=v\,B(u+1,v)$である。ここで$B(u,v)=\int_0^1x^{u-1}(1-x)^{v-1}\,dx$である。
  statement_en: For complex numbers u, v with positive real parts, u B(u, v+1) = v B(u+1, v), where B(u,v) is the integral of x^(u-1) (1-x)^(v-1) over (0, 1).
