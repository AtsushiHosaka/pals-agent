  - 任意の非負整数$n$
  conclusion: $B(u,n+1)=\dfrac{n!}{\prod_{j=0}^{n}(u+j)}$である。
  answer: |
    $n$に関する帰納法で、実部が正のすべての$u$について示す。$n=0$では$B(u,1)=\int_0^1x^{u-1}\,dx=\frac{1}{u}$である。

    $n$で成り立つと仮定し、$\mathrm{Re}\,u>0$とする。漸化式$u\,B(u,v+1)=v\,B(u+1,v)$を$v=n+1$に用いる。$\mathrm{Re}(u+1)>0$なので帰納法の仮定を$u+1$に使えて
    $u\,B(u,n+2)=(n+1)B(u+1,n+1)=(n+1)\frac{n!}{\prod_{j=0}^{n}(u+1+j)}=\frac{(n+1)!}{\prod_{j=1}^{n+1}(u+j)}$
    である。$u\neq 0$なので$u$で割れば$n+1$の場合を得る。
  strategy: Induct on n for all u, using the recurrence for B.
