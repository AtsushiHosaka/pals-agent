  level: 3
  topic: フーリエ級数・実関数と偶奇の係数
  statement: $T>0$とし、$\mathbb{R}/T\mathbb{Z}$上の全測度$1$の不変測度について$c_n(f)=\int e_{-n}f\,d\mu$、$e_n(x)=e^{2\pi inx/T}$とする。可積分な$f$について、$f$が実数値なら$c_{-n}(f)=\overline{c_n(f)}$であり、$f$が偶関数なら$c_{-n}(f)=c_n(f)$であり、$f$が奇関数なら$c_{-n}(f)=-c_n(f)$である。
  statement_en: 'Let T > 0, μ the invariant probability measure on ℝ/Tℤ, c_n(f) the integral of e_(-n) f and e_n(x) = e^(2πinx/T). For integrable f: if f is real-valued then c_(-n)(f) = conj c_n(f); if f is even then c_(-n)(f) = c_n(f); if f is odd then c_(-n)(f) = -c_n(f).'
  assumptions:
  - $T>0$
  - $f$は$\mu$について可積分
