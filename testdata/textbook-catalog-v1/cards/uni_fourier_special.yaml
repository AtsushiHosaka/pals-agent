  quantifiers:
  - 任意の正の整数$N$
  - 任意の$\Phi$
  conclusion: $\sum_{k}|\hat{\Phi}(k)|^2=N\sum_{j}|\Phi(j)|^2$である。
  answer: |
    $N\geq 1$、$\Phi:\mathbb{Z}/N\mathbb{Z}\to\mathbb{C}$とする。$k$を固定すると
    $|\hat{\Phi}(k)|^2=\hat{\Phi}(k)\overline{\hat{\Phi}(k)}=\sum_{i,j}\Phi(i)\overline{\Phi(j)}e^{2\pi ik(j-i)/N}$
    である。$k$について足して和の順序を交換する。$1$の冪根の指数和により$\sum_ke^{2\pi ik(j-i)/N}$は$j=i$で$N$、それ以外で$0$である。よって$\sum_{k}|\hat{\Phi}(k)|^2=N\sum_{i}\Phi(i)\overline{\Phi(i)}=N\sum_{i}|\Phi(i)|^2$である。
  strategy: Expand the square modulus and use the orthogonality of roots of unity.
  sketch:
  - 'setup: Expand |Φ^(k)|² as a double sum.'
  - 'derive: Sum over k and exchange the order of summation.'
  - 'apply_theorem: The exponential sum over k is N when j = i and 0 otherwise.'
  - 'conclude: The result is N Σ |Φ(j)|².'
  openmath: (forall (M f) (-> (and (in M N) (>= M 1)) (= (sum_over_group (zmod_ring M) (lambda (k) (^ (abs (zmod_dft M f k)) 2))) (* M (sum_over_group (zmod_ring M) (lambda (j) (^ (abs (fn_value f j)) 2)))))))
  hard_negative:
    statement: 同じ記号で$\sum_{k}|\hat{\Phi}(k)|^2=\sum_{j}|\Phi(j)|^2$である。
    reason: $N=2$、$\Phi\equiv 1$とすると$\hat{\Phi}(0)=2$、$\hat{\Phi}(1)=0$なので左辺は$4$であり、右辺は$2$である。
  target: |
    ∀ (N : ℕ) [NeZero N] (Φ : ZMod N → ℂ), ∑ k, Complex.normSq (ZMod.dft Φ k) = (N : ℝ) * ∑ j, Complex.normSq (Φ j)
  proof: |
    by
      intro N _ Φ
      have hc : ((∑ k, Complex.normSq (ZMod.dft Φ k) : ℝ) : ℂ) = (((N : ℝ) * ∑ j, Complex.normSq (Φ j) : ℝ) : ℂ) := by
        push_cast
        have e : ∀ k : ZMod N, ((Complex.normSq (ZMod.dft Φ k) : ℝ) : ℂ) = ∑ i, ∑ j, Φ i * (starRingEnd ℂ) (Φ j) * ZMod.stdAddChar (k * (j - i)) := by
          intro k
          rw [← Complex.mul_conj, ZMod.dft_apply, map_sum, Finset.sum_mul_sum]
          refine Finset.sum_congr rfl (fun i _ => Finset.sum_congr rfl (fun j _ => ?_))
          simp only [smul_eq_mul, map_mul]
          rw [← AddChar.map_neg_eq_conj, mul_sub, sub_eq_add_neg, AddChar.map_add_eq_mul]
          have e1 : ZMod.stdAddChar (-(i * k)) = ZMod.stdAddChar (-(k * i)) := by rw [mul_comm]
          have e2 : ZMod.stdAddChar (- -(j * k)) = ZMod.stdAddChar (k * j) := by rw [neg_neg, mul_comm]
          rw [e1, e2]
          ring
        simp only [e]
        rw [Finset.sum_comm]
        simp only [Finset.mul_sum]
        refine Finset.sum_congr rfl (fun i _ => ?_)
        rw [Finset.sum_comm]
        have e2 : ∀ j : ZMod N, ∑ k : ZMod N, Φ i * (starRingEnd ℂ) (Φ j) * ZMod.stdAddChar (k * (j - i)) = Φ i * (starRingEnd ℂ) (Φ j) * (if j = i then (N : ℂ) else 0) := by
          intro j
          rw [← Finset.mul_sum, AddChar.sum_mulShift (j - i) (ZMod.isPrimitive_stdAddChar N)]
          simp [sub_eq_zero, ZMod.card]
        simp only [e2, mul_ite, mul_zero]
        rw [Finset.sum_ite_eq' Finset.univ i]
        simp only [Finset.mem_univ, if_true]
        rw [Complex.mul_conj]
        ring
      exact_mod_cast hc
