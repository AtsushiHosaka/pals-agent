- id: fourier_two_sided_exponential
  kind: gap
  level: 3
  topic: フーリエ変換・両側指数関数
  statement: $a>0$と実数$w$について$\int_{\mathbb{R}}e^{-2\pi ivw}e^{-a|v|}\,dv=\dfrac{2a}{a^2+4\pi^2w^2}$である。
  statement_en: For a > 0 and a real w, the integral of e^(-2πivw) e^(-a|v|) over ℝ equals 2a / (a² + 4π²w²).
  assumptions:
  - $a>0$
  - $w\in\mathbb{R}$
  quantifiers:
  - 任意の実数$a,w$
  conclusion: $\int_{\mathbb{R}}e^{-2\pi ivw}e^{-a|v|}\,dv=\dfrac{2a}{a^2+4\pi^2w^2}$である。
  answer: |
    $a>0$、$w$を実数とする。$b=a+2\pi iw$、$c=a-2\pi iw$とおくと$\mathrm{Re}\,b=\mathrm{Re}\,c=a>0$である。被積分関数は$v>0$で$e^{-bv}$、$v\leq 0$で$e^{cv}$に等しく、どちらも可積分である。よって
    $\int_{\mathbb{R}}e^{-2\pi ivw}e^{-a|v|}\,dv=\int_{-\infty}^{0}e^{cv}\,dv+\int_0^\infty e^{-bv}\,dv=\frac{1}{c}+\frac{1}{b}=\frac{b+c}{bc}$
    である。$b+c=2a$、$bc=a^2+4\pi^2w^2$なので主張を得る。
  strategy: Split at 0 and integrate the two complex exponentials.
  sketch:
  - 'setup: Put b = a + 2πiw and c = a - 2πiw, both with positive real part.'
  - 'derive: The integrand is e^(cv) on v ≤ 0 and e^(-bv) on v > 0.'
  - 'derive: The two integrals equal 1/c and 1/b.'
  - 'conclude: Their sum is 2a / (a² + 4π²w²).'
  openmath: (forall (a w) (-> (and (> a 0) (in w R)) (= (integral_real_line (lambda (v) (* (exp (* (* (neg 2) (* pi (* v w))) complex_i)) (exp (neg (* a (abs v))))))) (/ (* 2 a) (+ (^ a 2) (* 4 (* (^ pi 2) (^ w 2))))))))
  hard_negative:
    statement: $a>0$について$\int_{\mathbb{R}}e^{-2\pi ivw}e^{-a|v|}\,dv=\dfrac{1}{a+2\pi iw}$である。
    reason: これは$(0,\infty)$上の積分の値である。$w=0$とすると左辺は$\frac{2}{a}$であり、右辺は$\frac{1}{a}$である。
  target: |
    ∀ a w : ℝ, 0 < a → ∫ v : ℝ, Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * (Real.exp (-a * |v|) : ℂ) = ((2 * a / (a ^ 2 + 4 * Real.pi ^ 2 * w ^ 2) : ℝ) : ℂ)
  proof: |
    by
      intro a w ha
      set b : ℂ := (a : ℂ) + 2 * Real.pi * w * Complex.I with hb
      set c : ℂ := (a : ℂ) - 2 * Real.pi * w * Complex.I with hc
      have hbre : 0 < b.re := by simp [hb, ha]
      have hcre : 0 < c.re := by simp [hc, ha]
      let F : ℝ → ℂ := fun v => Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) * (Real.exp (-a * |v|) : ℂ)
      have eR : ∀ v ∈ Set.Ioi (0:ℝ), F v = Complex.exp ((-b) * v) := by
        intro v hv
        simp only [F]
        rw [abs_of_pos hv, Complex.ofReal_exp, ← Complex.exp_add]
        congr 1
        simp only [hb]
        push_cast
        ring
      have eL : ∀ v ∈ Set.Iic (0:ℝ), F v = Complex.exp (c * v) := by
        intro v hv
        simp only [F]
        rw [abs_of_nonpos hv, Complex.ofReal_exp, ← Complex.exp_add]
        congr 1
        simp only [hc]
        push_cast
        ring
      have iR : MeasureTheory.IntegrableOn F (Set.Ioi 0) := by
        refine (integrableOn_exp_mul_complex_Ioi (a := -b) (by simpa using hbre) 0).congr_fun (fun v hv => (eR v hv).symm) measurableSet_Ioi
      have iL : MeasureTheory.IntegrableOn F (Set.Iic 0) := by
        refine (integrableOn_exp_mul_complex_Iic hcre 0).congr_fun (fun v hv => (eL v hv).symm) measurableSet_Iic
      have hsplit := intervalIntegral.integral_Iic_add_Ioi iL iR
      change ∫ v : ℝ, F v = _
      rw [← hsplit, MeasureTheory.setIntegral_congr_fun measurableSet_Iic eL, MeasureTheory.setIntegral_congr_fun measurableSet_Ioi eR, integral_exp_mul_complex_Iic hcre, integral_exp_mul_complex_Ioi (by simpa using hbre)]
      simp only [Complex.ofReal_zero, mul_zero, Complex.exp_zero]
      have hbne : b ≠ 0 := fun h => by simp [h] at hbre
      have hcne : c ≠ 0 := fun h => by simp [h] at hcre
      have hprod : b * c = ((a ^ 2 + 4 * Real.pi ^ 2 * w ^ 2 : ℝ) : ℂ) := by
        simp only [hb, hc]
        push_cast
        ring_nf
        rw [Complex.I_sq]
        ring
      have hsum : b + c = 2 * (a : ℂ) := by simp only [hb, hc]; ring
      rw [Complex.ofReal_div, ← hprod]
      push_cast
      field_simp
      exact hsum
- id: fourier_transform_of_interval_indicator
  kind: gap
  level: 2
  topic: フーリエ変換・区間の指示関数
  statement: 実数$a$と$0$でない実数$w$について$\int_{-a}^{a}e^{-2\pi ivw}\,dv=\dfrac{\sin 2\pi aw}{\pi w}$である。
  statement_en: For a real a and a nonzero real w, the integral of e^(-2πivw) over [-a, a] equals sin(2πaw) / (πw).
  assumptions:
  - $a\in\mathbb{R}$
  - $w\neq 0$
  quantifiers:
  - 任意の実数$a$
  - $0$でない任意の実数$w$
  conclusion: $\int_{-a}^{a}e^{-2\pi ivw}\,dv=\dfrac{\sin 2\pi aw}{\pi w}$である。
  answer: |
    $a$を実数、$w\neq 0$を実数とする。$e^{-2\pi ivw}$の原始関数は$\frac{e^{-2\pi ivw}}{-2\pi iw}$なので
    $\int_{-a}^{a}e^{-2\pi ivw}\,dv=\frac{e^{-2\pi iaw}-e^{2\pi iaw}}{-2\pi iw}=\frac{-2i\sin 2\pi aw}{-2\pi iw}=\frac{\sin 2\pi aw}{\pi w}$
    である。
  strategy: Integrate the exponential and apply Euler's formula.
  sketch:
  - 'setup: An antiderivative of e^(-2πivw) is e^(-2πivw) / (-2πiw).'
  - 'derive: The difference of the endpoint values equals -2i sin(2πaw).'
  - 'conclude: Dividing by -2πiw gives sin(2πaw) / (πw).'
  openmath: (forall (a w) (-> (and (in a R) (!= w 0)) (= (interval_integral (neg a) a (lambda (v) (exp (* (* (neg 2) (* pi (* v w))) complex_i)))) (/ (sin (* 2 (* pi (* a w)))) (* pi w)))))
  hard_negative:
    statement: $w\neq 0$について$\int_{-a}^{a}e^{-2\pi ivw}\,dv=\dfrac{\sin 2\pi aw}{2\pi w}$である。
    reason: $w\to 0$で左辺は区間の長さ$2a$に近づく。正しい右辺の極限は$2a$であり、この式の右辺の極限は$a$である。
  target: |
    ∀ a w : ℝ, w ≠ 0 → ∫ v in (-a)..a, Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) = ((Real.sin (2 * Real.pi * a * w) / (Real.pi * w) : ℝ) : ℂ)
  proof: |
    by
      intro a w hw
      have hpi : (Real.pi : ℂ) ≠ 0 := by exact_mod_cast Real.pi_ne_zero
      have hw' : (w : ℂ) ≠ 0 := by exact_mod_cast hw
      have hc : ((-2 * Real.pi * w : ℝ) : ℂ) * Complex.I ≠ 0 := by
        push_cast
        simp [hw', hpi]
      have e : ∀ v : ℝ, Complex.exp (((-2 * Real.pi * v * w : ℝ) : ℂ) * Complex.I) = Complex.exp ((((-2 * Real.pi * w : ℝ) : ℂ) * Complex.I) * v) := by
        intro v; congr 1; push_cast; ring
      simp only [e]
      rw [integral_exp_mul_complex hc]
      have h1 : ((-2 * Real.pi * w : ℝ) : ℂ) * Complex.I * (a : ℂ) = ((-(2 * Real.pi * a * w) : ℝ) : ℂ) * Complex.I := by push_cast; ring
      have h2 : ((-2 * Real.pi * w : ℝ) : ℂ) * Complex.I * ((-a : ℝ) : ℂ) = ((2 * Real.pi * a * w : ℝ) : ℂ) * Complex.I := by push_cast; ring
      rw [h1, h2, Complex.exp_mul_I, Complex.exp_mul_I, Complex.ofReal_neg, Complex.cos_neg, Complex.sin_neg]
      rw [Complex.ofReal_div, Complex.ofReal_sin]
      have hI := Complex.I_ne_zero
      push_cast
      field_simp
      ring_nf
- id: jacobi_theta_transformation
  kind: named
  level: 4
  topic: ポアソン和・ヤコビのテータ変換公式
  statement: ヤコビのテータ変換公式。実数$a>0$について、級数$\sum_{n\in\mathbb{Z}}e^{-\pi an^2}$は絶対収束し、$\sum_{n\in\mathbb{Z}}e^{-\pi an^2}=a^{-1/2}\sum_{n\in\mathbb{Z}}e^{-\pi n^2/a}$である。
  statement_en: Jacobi's theta transformation. For a real a > 0, the series Σ_{n∈ℤ} e^(-πan²) converges absolutely and Σ_{n∈ℤ} e^(-πan²) = a^(-1/2) Σ_{n∈ℤ} e^(-πn²/a).
  assumptions:
  - $a>0$
  quantifiers:
  - 任意の実数$a$
  conclusion: 級数は絶対収束し、$\sum_{n\in\mathbb{Z}}e^{-\pi an^2}=a^{-1/2}\sum_{n\in\mathbb{Z}}e^{-\pi n^2/a}$である。
  answer: |
    $a>0$とする。$n\neq 0$では$e^{\pi an^2}\geq 1+\pi an^2\geq\pi an^2$なので$e^{-\pi an^2}\leq\frac{1}{\pi an^2}$である。$\sum_{n\neq 0}\frac{1}{n^2}$は収束するので、級数は絶対収束する。$a$を$\frac{1}{a}$に替えても同じである。

    $f(x)=e^{-\pi ax^2}$とおく。$f$は連続で、$|x|\to\infty$で$|x|^{-2}$より速く減衰する。ガウス関数のフーリエ変換により$\hat{f}(t)=a^{-1/2}e^{-\pi t^2/a}$であり、これも同様に減衰する。ポアソンの和公式を$x=0$で用いると$\sum_{n}f(n)=\sum_{n}\hat{f}(n)$である。これが主張である。
  strategy: Apply the Poisson summation formula to the Gaussian e^(-πax²).
  sketch:
  - 'setup: Comparison with 1/(πan²) gives absolute convergence.'
  - 'derive: The Gaussian f(x) = e^(-πax²) and its transform decay faster than |x|^(-2).'
  - 'apply_theorem: The Gaussian Fourier transform gives f^(t) = a^(-1/2) e^(-πt²/a).'
  - 'apply_theorem: Poisson summation at x = 0 gives Σ f(n) = Σ f^(n).'
  - 'conclude: This is the transformation formula.'
  openmath: (forall (a) (-> (> a 0) (and (series_summable_fn (lambda (n) (exp (neg (* pi (* a (^ n 2))))))) (= (series_sum_fn (lambda (n) (exp (neg (* pi (* a (^ n 2))))))) (* (^ a (neg (/ 1 2))) (series_sum_fn (lambda (n) (exp (neg (/ (* pi (^ n 2)) a))))))))))
  hard_negative:
    statement: 実数$a>0$について$\sum_{n\in\mathbb{Z}}e^{-\pi an^2}=\sum_{n\in\mathbb{Z}}e^{-\pi n^2/a}$である。
    reason: $a=4$とする。左辺は$1$に近い値$1+2e^{-4\pi}+\cdots$であり、右辺は$\sum e^{-\pi n^2/4}\approx 2$である。正しい公式では因子$a^{-1/2}=\frac{1}{2}$が付く。
  target: |
    ∀ a : ℝ, 0 < a → Summable (fun n : ℤ => Real.exp (-Real.pi * a * (n : ℝ) ^ 2)) ∧ ∑' n : ℤ, Real.exp (-Real.pi * a * (n : ℝ) ^ 2) = 1 / a ^ (1 / 2 : ℝ) * ∑' n : ℤ, Real.exp (-Real.pi / a * (n : ℝ) ^ 2)
  proof: |
    by
      intro a ha
      refine ⟨?_, Real.tsum_exp_neg_mul_int_sq ha⟩
      have hc : 0 < Real.pi * a := by positivity
      have hg : Summable (fun n : ℤ => (Real.pi * a)⁻¹ * (1 / (n : ℝ) ^ 2)) :=
        (Real.summable_one_div_int_pow.mpr (by norm_num)).mul_left _
      refine Summable.of_norm_bounded_eventually hg ?_
      have hfin : ({0} : Set ℤ).Finite := Set.finite_singleton 0
      filter_upwards [hfin.compl_mem_cofinite] with n hn
      have hn' : (n : ℝ) ≠ 0 := by exact_mod_cast hn
      have hp : 0 < Real.pi * a * (n : ℝ) ^ 2 := by positivity
      have h1 := Real.add_one_le_exp (Real.pi * a * (n : ℝ) ^ 2)
      rw [Real.norm_of_nonneg (Real.exp_pos _).le, show -Real.pi * a * (n : ℝ) ^ 2 = -(Real.pi * a * (n : ℝ) ^ 2) by ring, Real.exp_neg]
      have h2 : (Real.pi * a)⁻¹ * (1 / (n : ℝ) ^ 2) = (Real.pi * a * (n : ℝ) ^ 2)⁻¹ := by field_simp
      rw [h2]
      exact inv_anti₀ hp (by linarith)
- id: schwartz_integrable_vanishes_at_infinity
  kind: gap
  level: 4
  topic: シュワルツ空間・基本性質
  statement: $V$を有限次元実内積空間とする。$f:V\to\mathbb{C}$がシュワルツ関数（無限回微分可能で、すべての$k,n$について$|v|^k\|D^nf(v)\|$が有界）ならば、$f$はルベーグ測度について可積分であり、$|v|\to\infty$で$f(v)\to 0$である。
  statement_en: Let V be a finite-dimensional real inner product space. If f on V is a Schwartz function, meaning smooth with |v|^k ‖D^n f(v)‖ bounded for all k and n, then f is integrable with respect to Lebesgue measure and f(v) → 0 as |v| → ∞.
  assumptions:
  - $V$は有限次元実内積空間
  - $f$はシュワルツ関数
  quantifiers:
  - 任意の$V$
  - 任意のシュワルツ関数$f$
  conclusion: $f$は可積分であり、$|v|\to\infty$で$f(v)\to 0$である。
  answer: |
    $V$の次元を$d$とし、$f$をシュワルツ関数とする。定義から、$k=0$と$k=d+1$について$M_0=\sup|f|$と$M_1=\sup|v|^{d+1}|f(v)|$は有限である。

    $|v|\geq 1$では$|f(v)|\leq M_1|v|^{-(d+1)}$である。$V$上で$\int_{|v|\geq 1}|v|^{-(d+1)}\,dv$は有限である。$|v|<1$では$|f|\leq M_0$であり、単位球の体積は有限である。よって$f$は可積分である。

    また$|v|\geq 1$で$|f(v)|\leq M_1|v|^{-(d+1)}$なので、$|v|\to\infty$で$f(v)\to 0$である。
  strategy: The decay bound with k = dim V + 1 gives integrability at infinity and vanishing at infinity.
  sketch:
  - 'setup: Let d = dim V; the Schwartz bounds give M_0 = sup |f| and M_1 = sup |v|^(d+1) |f(v)|.'
  - 'derive: On the unit ball, |f| ≤ M_0 on a set of finite volume.'
  - 'derive: Outside it, |f(v)| ≤ M_1 |v|^(-(d+1)), which is integrable.'
  - 'conclude: So f is integrable, and the same bound gives f(v) → 0.'
  openmath: (forall (V f) (-> (and (fd_inner_product_space R V) (schwartz_on V f)) (and (integrable_on_space V f) (tends_to_zero_at_infinity_space V f))))
  hard_negative:
    statement: $V$上の可積分で連続な関数は、$|v|\to\infty$で$0$に収束する。
    reason: $V=\mathbb{R}$で、各整数$n\geq 1$の周りに高さ$1$、幅$2^{-n}$の連続な山を置いた関数は、連続かつ可積分であるが$0$に収束しない。
  target: |
    ∀ (V : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [FiniteDimensional ℝ V] [MeasurableSpace V] [BorelSpace V] (f : SchwartzMap V ℂ), MeasureTheory.Integrable f MeasureTheory.volume ∧ Filter.Tendsto f (Filter.cocompact V) (nhds 0)
  proof: |
    by
      intro V _ _ _ _ _ f
      exact ⟨f.integrable, f.tendsto_cocompact⟩
- id: fourier_transform_preserves_schwartz
  kind: textbook
  level: 4
  topic: シュワルツ空間・フーリエ変換
  statement: $V$を有限次元実内積空間とする。$f:V\to\mathbb{C}$がシュワルツ関数ならば、$\mathcal{F}f(w)=\int_Ve^{-2\pi i\langle v,w\rangle}f(v)\,dv$もシュワルツ関数である。
  statement_en: Let V be a finite-dimensional real inner product space. If f on V is a Schwartz function, then F f(w) = ∫ e^(-2πi⟨v,w⟩) f(v) dv is also a Schwartz function.
  assumptions:
  - $V$は有限次元実内積空間
  - $f$はシュワルツ関数
  quantifiers:
  - 任意の$V$
  - 任意のシュワルツ関数$f$
  conclusion: $\mathcal{F}f$はシュワルツ関数である。
  answer: |
    $V$を有限次元実内積空間とし、座標をとって$V=\mathbb{R}^d$とする。$f$をシュワルツ関数とする。シュワルツ関数の空間は、座標関数$x_j$を掛ける操作と偏微分$\partial_j$で閉じている。また、シュワルツ関数は可積分である。

    積分記号下の微分は、被積分関数の$w$による偏微分$-2\pi iv_je^{-2\pi i\langle v,w\rangle}f(v)$が可積分な優関数$2\pi|v_j||f(v)|$をもつので正当であり、$\partial_{w_j}\mathcal{F}f=\mathcal{F}(-2\pi ix_jf)$である。これを繰り返すと$\mathcal{F}f$は無限回微分可能である。

    また部分積分により$w_j\mathcal{F}f(w)=\frac{1}{2\pi i}\mathcal{F}(\partial_jf)(w)$である。境界の項は$f$の急減少により消える。

    これらを組み合わせると、任意の多重指数$\alpha,\beta$について、$w^\alpha\partial^\beta\mathcal{F}f$は定数倍を除いて$\mathcal{F}\left(\partial^\alpha(x^\beta f)\right)$に等しい。$\partial^\alpha(x^\beta f)$はシュワルツ関数なので可積分であり、そのフーリエ変換は有界である。よって$w^\alpha\partial^\beta\mathcal{F}f$はすべて有界であり、$\mathcal{F}f$はシュワルツ関数である。
  strategy: 'Exchange decay and differentiation through the Fourier transform: each bound comes from the integrability of a Schwartz function.'
  sketch:
  - 'setup: Schwartz functions are stable under multiplication by coordinates and partial derivatives, and they are integrable.'
  - 'derive: Differentiating under the integral gives the derivative of F f as the transform of -2πix_j f.'
  - 'derive: Integration by parts gives w_j F f as the transform of ∂_j f up to a constant.'
  - 'derive: So w^α ∂^β F f is a constant times the transform of ∂^α (x^β f).'
  - 'conclude: The transform of an integrable function is bounded, so F f is Schwartz.'
  openmath: (forall (V f) (-> (and (fd_inner_product_space R V) (schwartz_on V f)) (exists (g) (and (schwartz_on V g) (forall (w) (= (fn_value g w) (integral_over_space V (lambda (v) (* (exp (* (* (neg 2) (* pi (inner_product v w))) complex_i)) (fn_value f v))))))))))
  hard_negative:
    statement: $f$が無限回微分可能で台がコンパクトならば、$\mathcal{F}f$も台がコンパクトである。
    reason: $\mathcal{F}f$が台コンパクトでかつ$f$も台コンパクトなら$f=0$である。実際$\mathcal{F}f$は$\mathbb{C}^d$へ整関数に延びるので、開集合上で$0$なら恒等的に$0$である。$0$でない$f$では$\mathcal{F}f$の台はコンパクトでない。
  target: |
    ∀ (V : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [FiniteDimensional ℝ V] [MeasurableSpace V] [BorelSpace V] (f : SchwartzMap V ℂ), ∃ g : SchwartzMap V ℂ, ∀ w : V, g w = ∫ v : V, Complex.exp (((-2 * Real.pi * inner ℝ v w : ℝ) : ℂ) * Complex.I) * f v
  proof: |
    by
      intro V _ _ _ _ _ f
      refine ⟨FourierTransform.fourier f, fun w => ?_⟩
      rw [SchwartzMap.fourier_coe, Real.fourier_eq']
      simp
- id: schwartz_plancherel_integral_form
  kind: gap
  level: 4
  topic: シュワルツ空間・プランシュレルの等式
  statement: $V$を有限次元実内積空間とする。シュワルツ関数$f:V\to\mathbb{C}$について$\int_V|\mathcal{F}f(\xi)|^2\,d\xi=\int_V|f(x)|^2\,dx$である。ここで$\mathcal{F}f(\xi)=\int_Ve^{-2\pi i\langle x,\xi\rangle}f(x)\,dx$である。
  statement_en: Let V be a finite-dimensional real inner product space. For a Schwartz function f on V, the integral of |F f(ξ)|² equals the integral of |f(x)|², where F f(ξ) = ∫ e^(-2πi⟨x,ξ⟩) f(x) dx.
  assumptions:
  - $V$は有限次元実内積空間
  - $f$はシュワルツ関数
  quantifiers:
  - 任意の$V$
  - 任意のシュワルツ関数$f$
  conclusion: $\int_V|\mathcal{F}f(\xi)|^2\,d\xi=\int_V|f(x)|^2\,dx$である。
  answer: |
    $V$を有限次元実内積空間、$f$をシュワルツ関数とする。$\mathcal{F}f$もシュワルツ関数なので、$f$と$\mathcal{F}f$は連続で可積分であり、反転公式$\mathcal{F}^{-1}\mathcal{F}f=f$が成り立つ。$h=\overline{\mathcal{F}f}$とおく。$h$も可積分であり、
    $\mathcal{F}h(x)=\int_Ve^{-2\pi i\langle\xi,x\rangle}\overline{\mathcal{F}f(\xi)}\,d\xi=\overline{\int_Ve^{2\pi i\langle\xi,x\rangle}\mathcal{F}f(\xi)\,d\xi}=\overline{f(x)}$
    である。乗法公式$\int_V(\mathcal{F}f)h=\int_Vf(\mathcal{F}h)$に代入すると、左辺は$\int_V|\mathcal{F}f|^2$、右辺は$\int_V|f|^2$である。
  strategy: Apply the multiplication formula to f and the conjugate of F f, using inversion.
  sketch:
  - 'setup: F f is Schwartz, so inversion holds for f.'
  - 'construct: Let h be the conjugate of F f.'
  - 'derive: Inversion gives F h = conj f.'
  - 'apply_theorem: The multiplication formula gives ∫ (F f) h = ∫ f (F h).'
  - 'conclude: This says the integrals of |F f|² and |f|² agree.'
  openmath: (forall (V f) (-> (and (fd_inner_product_space R V) (schwartz_on V f)) (= (integral_over_space V (lambda (w) (^ (abs (fn_value (fourier_transform f) w)) 2))) (integral_over_space V (lambda (x) (^ (abs (fn_value f x)) 2))))))
  hard_negative:
    statement: シュワルツ関数$f$について$\int_V|\mathcal{F}f(\xi)|\,d\xi=\int_V|f(x)|\,dx$である。
    reason: $V=\mathbb{R}$、$f(x)=e^{-\pi cx^2}$とすると$\int|f|=c^{-1/2}$である。$\mathcal{F}f(\xi)=c^{-1/2}e^{-\pi\xi^2/c}$なので$\int|\mathcal{F}f|=1$である。$c\neq 1$では異なる。
  target: |
    ∀ (V : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [FiniteDimensional ℝ V] [MeasurableSpace V] [BorelSpace V] (f : SchwartzMap V ℂ), ∫ ξ, ‖FourierTransform.fourier f ξ‖ ^ 2 = ∫ x, ‖f x‖ ^ 2
  proof: |
    by
      intro V _ _ _ _ _ f
      exact SchwartzMap.integral_norm_sq_fourier f
- id: fundamental_lemma_test_functions
  kind: gap
  level: 4
  topic: 超関数・変分法の基本補題
  statement: 変分法の基本補題。$f:\mathbb{R}^n\to\mathbb{R}$が局所可積分で、無限回微分可能で台がコンパクトなすべての$g:\mathbb{R}^n\to\mathbb{R}$について$\int_{\mathbb{R}^n}g(x)f(x)\,dx=0$ならば、$f$はほとんどいたるところ$0$である。
  statement_en: Fundamental lemma of the calculus of variations. If f on ℝ^n is locally integrable and the integral of g(x) f(x) over ℝ^n is 0 for all smooth compactly supported real g, then f = 0 almost everywhere.
  assumptions:
  - $f$は$\mathbb{R}^n$上で局所可積分
  - 無限回微分可能で台がコンパクトなすべての$g$について$\int gf=0$
  quantifiers:
  - 任意の非負整数$n$
  - 任意の$f$
  conclusion: $f$はほとんどいたるところ$0$である。
  answer: |
    $f$を仮定を満たす関数とする。$\varphi\geq 0$を台が単位球に含まれる無限回微分可能な関数で$\int\varphi=1$を満たすものとし、$\varphi_\varepsilon(x)=\varepsilon^{-n}\varphi(x/\varepsilon)$とおく。

    $R>0$をとり、$h=f\,1_{\{|x|<R+1\}}$とおくと、$h$は可積分である。$0<\varepsilon<1$、$|x|<R$とする。$y\mapsto\varphi_\varepsilon(x-y)$は無限回微分可能で台がコンパクトであり、その台は$|y|<R+1$に含まれるので、仮定から
    $(h*\varphi_\varepsilon)(x)=\int h(y)\varphi_\varepsilon(x-y)\,dy=\int f(y)\varphi_\varepsilon(x-y)\,dy=0$
    である。

    $\varepsilon\to 0$で$h*\varphi_\varepsilon\to h$は$L^1(\mathbb{R}^n)$で成り立つ（軟化子の基本性質）。$|x|<R$上で左辺は$0$なので、$h=0$が$|x|<R$上でほとんどいたるところ成り立つ。$R$は任意なので$f=0$がほとんどいたるところ成り立つ。
  strategy: Mollify f on a large ball and use that the mollifications vanish.
  sketch:
  - 'setup: Choose a mollifier φ_ε and truncate f to h on the ball of radius R + 1.'
  - 'derive: For |x| < R, the function y ↦ φ_ε(x-y) is a test function supported in that ball.'
  - 'derive: The hypothesis gives (h * φ_ε)(x) = 0 for |x| < R.'
  - 'apply_theorem: Mollifications converge to h in L¹.'
  - 'conclude: So h = 0 a.e. on the ball of radius R, and R is arbitrary.'
  openmath: (forall (n f) (-> (and (in n N) (locally_integrable_euclidean n f) (forall (g) (-> (smooth_compact_support_euclidean n g) (= (integral_euclidean n (lambda (x) (* (fn_value g x) (fn_value f x)))) 0)))) (ae_zero_euclidean n f)))
  hard_negative:
    statement: 同じ仮定で$f$はすべての点で$0$である。
    reason: $1$点でだけ$1$をとり他で$0$の関数は、すべての積分が$0$であるが恒等的に$0$ではない。$f$が連続なら全点で$0$となる。
  target: |
    ∀ (n : ℕ) (f : EuclideanSpace ℝ (Fin n) → ℝ), MeasureTheory.LocallyIntegrable f MeasureTheory.volume → (∀ g : EuclideanSpace ℝ (Fin n) → ℝ, ContDiff ℝ ((⊤ : ℕ∞) : WithTop ℕ∞) g → HasCompactSupport g → ∫ x, g x * f x = 0) → ∀ᵐ x, f x = 0
  proof: |
    by
      intro n f hf h
      exact ae_eq_zero_of_integral_contDiff_smul_eq_zero hf h
- id: finite_abelian_character_count_and_separation
  kind: gap
  level: 3
  topic: 有限アーベル群・指標の個数と分離
  statement: $G$を有限アーベル群とする。$G$から$\mathbb{C}^\times$への準同型（加法的指標）の個数は$|G|$に等しい。また$a\in G$が$a\neq 0$ならば、$\psi(a)\neq 1$となる指標$\psi$が存在する。
  statement_en: Let G be a finite abelian group. The number of homomorphisms from G to the nonzero complex numbers, the additive characters, equals |G|. Moreover, if a in G is nonzero, there is a character ψ with ψ(a) ≠ 1.
  assumptions:
  - $G$は有限アーベル群
  quantifiers:
  - 任意の有限アーベル群$G$
  - 任意の$a\in G$
  conclusion: 指標の個数は$|G|$であり、$a\neq 0$なら$\psi(a)\neq 1$となる指標$\psi$がある。
  answer: |
    $G$を有限アーベル群とする。有限アーベル群の基本定理により、$G\cong\mathbb{Z}/n_1\mathbb{Z}\times\cdots\times\mathbb{Z}/n_r\mathbb{Z}$である。

    $\mathbb{Z}/n\mathbb{Z}$の指標$\psi$は$\psi(1)$で決まり、$\psi(1)^n=\psi(n)=1$なので$\psi(1)$は$1$の$n$乗根である。逆に$1$の$n$乗根$\zeta$ごとに$\psi(x)=\zeta^x$は指標である。よって$\mathbb{Z}/n\mathbb{Z}$の指標はちょうど$n$個ある。

    直積の指標は各成分の指標の積と一対一に対応する。実際、$\psi$を各成分に制限すれば成分の指標が得られ、$\psi(x_1,\dots,x_r)=\prod_j\psi(0,\dots,x_j,\dots,0)$である。よって$G$の指標の個数は$n_1\cdots n_r=|G|$である。

    $a=(a_1,\dots,a_r)\neq 0$とする。ある$j$で$a_j\neq 0$である。$\psi(x)=e^{2\pi ix_j/n_j}$は$G$の指標であり、$0<a_j<n_j$と代表をとれば$\psi(a)=e^{2\pi ia_j/n_j}\neq 1$である。
  strategy: Decompose G into cyclic groups and describe the characters componentwise.
  sketch:
  - 'setup: The structure theorem writes G as a product of cyclic groups Z/n_j.'
  - 'derive: A cyclic group Z/n has exactly n characters, one for each n-th root of unity.'
  - 'derive: Characters of a product correspond to tuples of characters of the factors, so there are |G| of them.'
  - 'construct: For a ≠ 0 with a_j ≠ 0, the character e^(2πi x_j / n_j) does not take the value 1 at a.'
  - 'conclude: Both claims follow.'
  openmath: (forall (G) (-> (finite_add_comm_group G) (and (= (character_group_size G) (group_order G)) (forall (a) (-> (and (in a G) (!= a (group_zero G))) (exists (c) (and (complex_add_character_of c G) (!= (fn_value c a) 1))))))))
  hard_negative:
    statement: 非アーベルな有限群$G$でも、$\mathbb{C}^\times$への準同型の個数は$|G|$に等しい。
    reason: 対称群$S_3$では、$\mathbb{C}^\times$への準同型は交換子群$A_3$上で自明なので、個数は$|S_3/A_3|=2$である。$|S_3|=6$とは異なる。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [Fintype G], Fintype.card (AddChar G ℂ) = Fintype.card G ∧ ∀ a : G, a ≠ 0 → ∃ ψ : AddChar G ℂ, ψ a ≠ 1
  proof: |
    by
      intro G _ _
      exact ⟨AddChar.card_eq, fun a ha => AddChar.exists_apply_ne_zero.mpr ha⟩
- id: finite_character_unit_modulus
  kind: gap
  level: 2
  topic: 有限アーベル群・指標の値
  statement: $G$を有限アーベル群、$\psi:G\to\mathbb{C}^\times$を準同型とする。すべての$x\in G$について$|\psi(x)|=1$であり、$\psi(-x)=\overline{\psi(x)}$である。
  statement_en: Let G be a finite abelian group and ψ a homomorphism from G to the nonzero complex numbers. For all x in G, |ψ(x)| = 1 and ψ(-x) = conj ψ(x).
  assumptions:
  - $G$は有限アーベル群
  - $\psi:G\to\mathbb{C}^\times$は準同型
  quantifiers:
  - 任意の$G$
  - 任意の指標$\psi$
  - 任意の$x\in G$
  conclusion: $|\psi(x)|=1$かつ$\psi(-x)=\overline{\psi(x)}$である。
  answer: |
    $G$を有限アーベル群、$\psi$を準同型、$x\in G$とし、$m=|G|$とおく。$mx=0$なので$\psi(x)^m=\psi(mx)=\psi(0)=1$である。よって$|\psi(x)|^m=1$であり、$|\psi(x)|=1$である。

    $\psi(x)\psi(-x)=\psi(0)=1$なので$\psi(-x)=\psi(x)^{-1}$である。$|\psi(x)|=1$より$\psi(x)^{-1}=\overline{\psi(x)}$である。
  strategy: Values of a character on a finite group are roots of unity.
  sketch:
  - 'setup: Let m = |G|, so that m x = 0.'
  - 'derive: Then ψ(x)^m = 1, hence |ψ(x)| = 1.'
  - 'derive: Since ψ(x) ψ(-x) = 1, ψ(-x) is the inverse of ψ(x).'
  - 'conclude: On the unit circle the inverse is the conjugate.'
  openmath: (forall (G c x) (-> (and (finite_add_comm_group G) (complex_add_character_of c G) (in x G)) (and (= (abs (fn_value c x)) 1) (= (fn_value c (neg x)) (complex_conj (fn_value c x))))))
  hard_negative:
    statement: 無限アーベル群$G$の準同型$\psi:G\to\mathbb{C}^\times$でも$|\psi(x)|=1$である。
    reason: $G=\mathbb{Z}$、$\psi(n)=2^n$は準同型であるが、$|\psi(1)|=2$である。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [Finite G] (ψ : AddChar G ℂ) (x : G), ‖ψ x‖ = 1 ∧ ψ (-x) = (starRingEnd ℂ) (ψ x)
  proof: |
    by
      intro G _ _ ψ x
      exact ⟨ψ.norm_apply x, AddChar.map_neg_eq_conj ψ x⟩
- id: character_first_orthogonality
  kind: gap
  level: 3
  topic: 有限アーベル群・指標の第1直交関係
  statement: 指標の第1直交関係。有限アーベル群$G$の加法的指標$\psi_1,\psi_2:G\to\mathbb{C}^\times$について、$\sum_{x\in G}\psi_1(x)\overline{\psi_2(x)}$は$\psi_1=\psi_2$なら$|G|$、$\psi_1\neq\psi_2$なら$0$である。
  statement_en: First orthogonality of characters. For additive characters ψ₁, ψ₂ of a finite abelian group G, Σ_{x∈G} ψ₁(x) conj ψ₂(x) equals |G| if ψ₁ = ψ₂ and 0 otherwise.
  assumptions:
  - $G$は有限アーベル群
  - $\psi_1,\psi_2$は$G$の加法的指標
  quantifiers:
  - 任意の$G$
  - 任意の指標$\psi_1,\psi_2$
  conclusion: 和は$\psi_1=\psi_2$なら$|G|$、$\psi_1\neq\psi_2$なら$0$である。
  answer: |
    $G$を有限アーベル群、$\psi_1,\psi_2$を加法的指標とする。指標の値は絶対値$1$なので$\overline{\psi_2(x)}=\psi_2(x)^{-1}$であり、$\psi(x)=\psi_1(x)\overline{\psi_2(x)}$は再び指標である。

    $\psi_1=\psi_2$なら$\psi\equiv 1$なので和は$|G|$である。

    $\psi_1\neq\psi_2$なら、$\psi(a)\neq 1$となる$a\in G$がある。$x\mapsto x+a$は$G$の全単射なので
    $\psi(a)\sum_{x\in G}\psi(x)=\sum_{x\in G}\psi(x+a)=\sum_{x\in G}\psi(x)$
    である。$\psi(a)\neq 1$より和は$0$である。
  strategy: Reduce to the sum of a single character and translate by a point where it is not 1.
  sketch:
  - 'setup: ψ = ψ₁ conj ψ₂ is a character because character values have modulus 1.'
  - 'case_split: Either ψ₁ = ψ₂ or ψ₁ ≠ ψ₂.'
  - 'derive: If equal, ψ is identically 1 and the sum is |G|.'
  - 'derive: If not, choose a with ψ(a) ≠ 1 and translate to get ψ(a) S = S.'
  - 'conclude: Hence S = 0.'
  openmath: (forall (G c d) (-> (and (finite_add_comm_group G) (complex_add_character_of c G) (complex_add_character_of d G)) (and (-> (= c d) (= (sum_over_group G (lambda (x) (* (fn_value c x) (complex_conj (fn_value d x))))) (group_order G))) (-> (!= c d) (= (sum_over_group G (lambda (x) (* (fn_value c x) (complex_conj (fn_value d x))))) 0)))))
  hard_negative:
    statement: $\psi_1\neq\psi_2$なら$\sum_{x\in G}\psi_1(x)\psi_2(x)=0$である。
    reason: $\psi_2=\overline{\psi_1}$で$\psi_1$が実数値でないとする。$G=\mathbb{Z}/3\mathbb{Z}$、$\psi_1(x)=e^{2\pi ix/3}$、$\psi_2=\overline{\psi_1}$なら$\psi_1\neq\psi_2$であるが、和は$3$である。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [Fintype G] [DecidableEq G] (ψ₁ ψ₂ : AddChar G ℂ), ∑ x, ψ₁ x * (starRingEnd ℂ) (ψ₂ x) = if ψ₁ = ψ₂ then (Fintype.card G : ℂ) else 0
  proof: |
    by
      intro G _ _ _ ψ₁ ψ₂
      have e : ∀ x, ψ₁ x * (starRingEnd ℂ) (ψ₂ x) = (ψ₁ - ψ₂) x := by
        intro x
        rw [← AddChar.map_neg_eq_conj, sub_eq_add_neg, AddChar.add_apply, AddChar.neg_apply]
      simp only [e]
      rw [AddChar.sum_eq_ite]
      simp [sub_eq_zero]
- id: character_second_orthogonality
  kind: gap
  level: 3
  topic: 有限アーベル群・指標の第2直交関係
  statement: 指標の第2直交関係。有限アーベル群$G$と$a\in G$について、$G$のすべての加法的指標$\psi$にわたる和$\sum_{\psi}\psi(a)$は、$a=0$なら$|G|$、$a\neq 0$なら$0$である。
  statement_en: Second orthogonality of characters. For a finite abelian group G and a in G, the sum of ψ(a) over all additive characters ψ of G equals |G| if a = 0 and 0 otherwise.
  assumptions:
  - $G$は有限アーベル群
  - $a\in G$
  quantifiers:
  - 任意の$G$
  - 任意の$a\in G$
  conclusion: $\sum_{\psi}\psi(a)$は$a=0$なら$|G|$、$a\neq 0$なら$0$である。
  answer: |
    $G$を有限アーベル群、$a\in G$とする。指標全体$\widehat{G}$は値の積について群をなし、その位数は$|G|$である。

    $a=0$なら各項は$1$なので和は$|G|$である。

    $a\neq 0$なら、$\psi_0(a)\neq 1$となる指標$\psi_0$がある。$\psi\mapsto\psi_0\psi$は$\widehat{G}$の全単射なので
    $\psi_0(a)\sum_{\psi}\psi(a)=\sum_{\psi}(\psi_0\psi)(a)=\sum_{\psi}\psi(a)$
    である。$\psi_0(a)\neq 1$より和は$0$である。
  strategy: Translate in the character group by a character that does not take the value 1 at a.
  sketch:
  - 'setup: The characters form a group of order |G| under multiplication of values.'
  - 'case_split: Either a = 0 or a ≠ 0.'
  - 'derive: If a = 0, the sum is |G|.'
  - 'derive: If a ≠ 0, choose ψ₀ with ψ₀(a) ≠ 1; multiplying by ψ₀ permutes the characters.'
  - 'conclude: So ψ₀(a) S = S, and S = 0.'
  openmath: (forall (G a) (-> (and (finite_add_comm_group G) (in a G)) (and (-> (= a (group_zero G)) (= (sum_over_characters G (lambda (c) (fn_value c a))) (group_order G))) (-> (!= a (group_zero G)) (= (sum_over_characters G (lambda (c) (fn_value c a))) 0)))))
  hard_negative:
    statement: $a\neq 0$なら、すべての指標$\psi$について$\psi(a)=-1$である。
    reason: $G=\mathbb{Z}/3\mathbb{Z}$、$a=1$とすると、自明な指標では$\psi(a)=1$である。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [Fintype G] [DecidableEq G] (a : G), ∑ ψ : AddChar G ℂ, ψ a = if a = 0 then (Fintype.card G : ℂ) else 0
  proof: |
    by
      intro G _ _ _ a
      exact AddChar.sum_apply_eq_ite a
- id: characters_form_basis_of_functions
  kind: gap
  level: 3
  topic: 有限アーベル群・指標による基底
  statement: 有限アーベル群$G$の加法的指標全体は、複素ベクトル空間$\mathbb{C}^G$（$G$上の複素数値関数全体）の基底をなす。
  statement_en: The additive characters of a finite abelian group G form a basis of the complex vector space of complex functions on G.
  assumptions:
  - $G$は有限アーベル群
  quantifiers:
  - 任意の$G$
  conclusion: 指標全体は$\mathbb{C}^G$で線形独立であり、$\mathbb{C}^G$を張る。
  answer: |
    $G$を有限アーベル群とする。$\mathbb{C}^G$の内積を$\langle f,g\rangle=\sum_{x\in G}f(x)\overline{g(x)}$とする。第1直交関係により、相異なる指標は直交し、指標は$0$でない。よって指標全体は線形独立である。

    指標の個数は$|G|$であり、これは$\mathbb{C}^G$の次元に等しい。次元と同じ個数の線形独立な元は基底をなす。
  strategy: Orthogonality gives independence, and the number of characters equals the dimension.
  sketch:
  - 'setup: Use the inner product Σ f(x) conj g(x) on the space of functions.'
  - 'apply_theorem: First orthogonality makes distinct characters orthogonal, hence independent.'
  - 'derive: The number of characters equals |G|, the dimension of the space.'
  - 'conclude: So the characters form a basis.'
  openmath: (forall (G) (-> (finite_add_comm_group G) (character_family_is_basis G)))
  hard_negative:
    statement: 非アーベルな有限群$G$でも、$\mathbb{C}^\times$への準同型全体は$\mathbb{C}^G$の基底をなす。
    reason: $G=S_3$では準同型は$2$個だけであり、$\mathbb{C}^G$の次元は$6$である。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [Finite G], LinearIndependent ℂ (fun ψ : AddChar G ℂ => (ψ : G → ℂ)) ∧ Submodule.span ℂ (Set.range (fun ψ : AddChar G ℂ => (ψ : G → ℂ))) = ⊤
  proof: |
    by
      intro G _ _
      have h1 := (AddChar.complexBasis G).linearIndependent
      have h2 := (AddChar.complexBasis G).span_eq
      rw [AddChar.coe_complexBasis] at h1 h2
      exact ⟨h1, h2⟩
- id: finite_abelian_fourier_inversion
  kind: named
  level: 3
  topic: 有限アーベル群・フーリエ反転公式
  statement: 有限アーベル群のフーリエ反転公式。$G$を有限アーベル群、$f:G\to\mathbb{C}$とし、指標$\psi$について$\hat{f}(\psi)=\sum_{y\in G}f(y)\overline{\psi(y)}$とする。すべての$x\in G$について$f(x)=\dfrac{1}{|G|}\sum_{\psi}\hat{f}(\psi)\psi(x)$である。
  statement_en: Fourier inversion on a finite abelian group. Let G be a finite abelian group, f a complex function on G, and f^(ψ) = Σ_{y∈G} f(y) conj ψ(y) for a character ψ. For all x in G, f(x) = (1/|G|) Σ_ψ f^(ψ) ψ(x).
  assumptions:
  - $G$は有限アーベル群
  - $f:G\to\mathbb{C}$
  quantifiers:
  - 任意の$G$
  - 任意の$f$
  - 任意の$x\in G$
  conclusion: $f(x)=\dfrac{1}{|G|}\sum_{\psi}\hat{f}(\psi)\psi(x)$である。
  answer: |
    $G$を有限アーベル群、$f:G\to\mathbb{C}$、$x\in G$とする。$\overline{\psi(y)}=\psi(-y)$なので$\overline{\psi(y)}\psi(x)=\psi(x-y)$である。和の順序を交換すると
    $\sum_{\psi}\hat{f}(\psi)\psi(x)=\sum_{y\in G}f(y)\sum_{\psi}\psi(x-y)$
    である。第2直交関係により、内側の和は$y=x$で$|G|$、それ以外で$0$である。よって右辺は$|G|f(x)$である。
  strategy: Exchange the sums and apply second orthogonality.
  sketch:
  - 'setup: Since conj ψ(y) = ψ(-y), one has conj ψ(y) ψ(x) = ψ(x-y).'
  - 'derive: Exchange the sums over ψ and y.'
