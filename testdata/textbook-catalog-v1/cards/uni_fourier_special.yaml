  - 'setup: The case n = 0 is the integral of x^(u-1), which equals 1/u.'
  - 'induction: Apply u B(u, n+2) = (n+1) B(u+1, n+1) and the hypothesis at u + 1.'
  - 'conclude: Dividing by u, which is nonzero, gives the formula for n + 1.'
  openmath: (forall (u n) (-> (and (> (real_part u) 0) (in n N)) (= (beta_integral u (+ n 1)) (/ (factorial n) (prod_over (finset_range (+ n 1)) (lambda (j) (+ u j)))))))
