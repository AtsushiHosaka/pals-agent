- id: stirling_formula
  kind: named
  level: 3
  topic: 特殊関数・スターリングの公式
  statement: スターリングの公式。$n\to\infty$で$n!\sim\sqrt{2\pi n}\left(\dfrac{n}{e}\right)^n$である。すなわち両辺の比は$1$に収束する。
  statement_en: Stirling's formula. As n → ∞, n! is asymptotically equivalent to √(2πn) (n/e)^n; that is, the ratio of the two sides tends to 1.
  assumptions:
  - $n\to\infty$
  quantifiers:
  - 正の整数$n$
  conclusion: $n!\sim\sqrt{2\pi n}\left(\dfrac{n}{e}\right)^n$である。
  answer: |
    $n\geq 1$について$a_n=\frac{n!}{\sqrt{2n}\,(n/e)^n}$とおく。$a_n\to\sqrt{\pi}$を示せばよい。

    $t=\frac{1}{2n+1}$とおくと$1+\frac{1}{n}=\frac{1+t}{1-t}$なので、$\log\frac{1+t}{1-t}$のべき級数展開と$n+\frac{1}{2}=\frac{1}{2t}$から
    $\log a_n-\log a_{n+1}=\left(n+\frac{1}{2}\right)\log\left(1+\frac{1}{n}\right)-1=\sum_{k=1}^{\infty}\frac{t^{2k}}{2k+1}$
    である。右辺は$0$以上で、$\frac{1}{3}\sum_{k\geq 1}t^{2k}=\frac{1}{12n(n+1)}$以下である。よって$a_n$は単調減少であり、$\frac{1}{12n(n+1)}$の和は有限なので$\log a_n$は下に有界である。したがって$a_n$は正の極限$a$をもつ。

    $(2n)!$と$n!$の式を代入すると$\frac{a_n^4}{a_{2n}^2}=\frac{(n!)^4\,2^{4n}}{n\,((2n)!)^2}$である。ウォリスの積の部分積$W_n=\prod_{k=1}^{n}\frac{(2k)^2}{(2k-1)(2k+1)}$は$\frac{(n!)^4\,2^{4n}}{((2n)!)^2(2n+1)}$に等しく、$\frac{\pi}{2}$に収束する。よって$\frac{a_n^4}{a_{2n}^2}=W_n\cdot\frac{2n+1}{n}\to\pi$である。左辺は$a^2$に収束するので$a=\sqrt{\pi}$である。

    ゆえに$\frac{n!}{\sqrt{2\pi n}\,(n/e)^n}=\frac{a_n}{\sqrt{\pi}}\to 1$である。
  strategy: Show that n!/(√(2n) (n/e)^n) decreases to a positive limit and identify the limit by Wallis's product.
  sketch:
  - 'setup: Let a_n = n! / (√(2n) (n/e)^n).'
  - 'derive: The series for log((1+t)/(1-t)) with t = 1/(2n+1) gives 0 ≤ log a_n - log a_(n+1) ≤ 1/(12n(n+1)).'
  - 'derive: So a_n decreases to a positive limit a.'
  - 'apply_theorem: Wallis''s product gives a_n^4 / a_(2n)^2 → π.'
  - 'derive: The left side tends to a², so a = √π.'
  - 'conclude: Hence n! / (√(2πn) (n/e)^n) tends to 1.'
  openmath: (seq_asymp_equiv (lambda (n) (factorial n)) (lambda (n) (* (root (* 2 (* pi n)) 2) (^ (/ n (exp 1)) n))))
  hard_negative:
    statement: $n\to\infty$で$n!\sim\left(\dfrac{n}{e}\right)^n$である。
    reason: スターリングの公式から比$n!/(n/e)^n$は$\sqrt{2\pi n}$と同程度であり、$\infty$に発散する。
  target: |
    Asymptotics.IsEquivalent Filter.atTop (fun n : ℕ => (n.factorial : ℝ)) (fun n : ℕ => Real.sqrt (2 * n * Real.pi) * ((n : ℝ) / Real.exp 1) ^ n)
  proof: |
    by
      exact Stirling.factorial_isEquivalent_stirling
- id: stirling_sequence_antitone
  kind: gap
  level: 2
  topic: 特殊関数・スターリング数列の単調性
  statement: $a_n=\dfrac{n!}{\sqrt{2n}\,(n/e)^n}$（$n\geq 1$）は単調減少である。
  statement_en: The sequence a_n = n! / (√(2n) (n/e)^n), n ≥ 1, is decreasing.
  assumptions:
  - $n\geq 1$
  quantifiers:
  - 任意の正の整数$n$
  conclusion: $a_{n+1}\leq a_n$である。
  answer: |
    $n\geq 1$とする。定義から
    $\log a_n-\log a_{n+1}=\left(n+\frac{1}{2}\right)\log\left(1+\frac{1}{n}\right)-1$
    である。$t=\frac{1}{2n+1}$とおくと$0<t<1$、$1+\frac{1}{n}=\frac{1+t}{1-t}$である。$\log\frac{1+t}{1-t}=2\sum_{k=0}^{\infty}\frac{t^{2k+1}}{2k+1}\geq 2t$なので
    $\left(n+\frac{1}{2}\right)\log\left(1+\frac{1}{n}\right)\geq\frac{2n+1}{2}\cdot\frac{2}{2n+1}=1$
    である。よって$\log a_n\geq\log a_{n+1}$であり、$a_{n+1}\leq a_n$である。
  strategy: Compare consecutive logarithms using the series of log((1+t)/(1-t)).
  sketch:
  - 'setup: Compute log a_n - log a_(n+1) = (n + 1/2) log(1 + 1/n) - 1.'
  - 'derive: With t = 1/(2n+1), log(1 + 1/n) = log((1+t)/(1-t)) ≥ 2t.'
  - 'derive: Hence (n + 1/2) log(1 + 1/n) ≥ 1.'
  - 'conclude: So a_(n+1) ≤ a_n.'
  openmath: (forall (n) (-> (and (in n N) (>= n 1)) (<= (/ (factorial (+ n 1)) (* (root (* 2 (+ n 1)) 2) (^ (/ (+ n 1) (exp 1)) (+ n 1)))) (/ (factorial n) (* (root (* 2 n) 2) (^ (/ n (exp 1)) n))))))
  hard_negative:
    statement: $a_n=\dfrac{n!}{\sqrt{2n}\,(n/e)^n}$は単調増加である。
    reason: $a_1=\frac{e}{\sqrt{2}}\approx 1.92$、$a_2=\frac{2}{2(2/e)^2}=\frac{e^2}{4}\approx 1.85$であり、$a_2<a_1$である。
  target: |
    ∀ n : ℕ, 1 ≤ n → ((n + 1).factorial : ℝ) / (Real.sqrt (2 * ((n + 1 : ℕ) : ℝ)) * (((n + 1 : ℕ) : ℝ) / Real.exp 1) ^ (n + 1)) ≤ (n.factorial : ℝ) / (Real.sqrt (2 * (n : ℝ)) * ((n : ℝ) / Real.exp 1) ^ n)
  proof: |
    by
      intro n hn
      obtain ⟨m, rfl⟩ : ∃ m, n = m + 1 := ⟨n - 1, by omega⟩
      have h := Stirling.stirlingSeq'_antitone (Nat.le_succ m)
      simpa [Function.comp, Stirling.stirlingSeq] using h
