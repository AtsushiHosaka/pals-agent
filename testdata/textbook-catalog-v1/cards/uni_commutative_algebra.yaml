  answer: |
    $R$を可換環、$M$を乗法的部分集合、$\varphi:R\to S=M^{-1}R$を標準写像、$I$をイデアルとする。$s\in I\cap M$なら$\varphi(s)$は$IS$に属する単元なので$IS=S$である。
