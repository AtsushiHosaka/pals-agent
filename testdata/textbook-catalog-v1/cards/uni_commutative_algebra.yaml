  statement: $R$を整閉整域、$M$を$0$を含まない乗法的部分集合、$S=M^{-1}R$を局所化とする。このとき$S$は整閉である。
  statement_en: Let R be an integrally closed domain, M a multiplicative subset not containing 0, and S the localization of R at M. Then S is integrally closed.
  assumptions:
  - $R$は整閉整域
  - $M$は$0$を含まない乗法的部分集合
  - $S=M^{-1}R$
  quantifiers:
  - 任意の整閉整域$R$と乗法的部分集合$M$
  conclusion: $S$は整閉である。
  answer: |
    $R$を整閉整域、$K$をその分数体、$M$を$0$を含まない乗法的部分集合とし、$S=M^{-1}R\subseteq K$とする。$S$の分数体も$K$である。$x\in K$が$S$上整であるとし、$x^n+\frac{a_1}{s_1}x^{n-1}+\dots+\frac{a_n}{s_n}=0$（$a_i\in R$、$s_i\in M$）とする。
    $s=s_1\cdots s_n\in M$とおき、両辺に$s^n$を掛ける。すると$(sx)^n+b_1(sx)^{n-1}+\dots+b_n=0$となる。ここで$b_i=\frac{a_i}{s_i}s^i$は$R$の元である。よって$sx$は$R$上整であり、$R$が整閉なので$sx\in R$である。したがって$x=(sx)/s\in S$である。
  strategy: Clear denominators in an integral equation to get an equation over R for a multiple of x.
  sketch:
  - 'setup: Let x in K satisfy a monic equation with coefficients a_i/s_i in S.'
  - 'construct: Let s be the product of the s_i and multiply the equation by s^n.'
  - 'derive: sx satisfies a monic equation over R.'
  - 'apply_theorem: Since R is integrally closed, sx lies in R.'
  - 'conclude: So x = (sx)/s lies in S.'
  openmath: (forall (A B T) (-> (and (integrally_closed_domain A) (submonoid_of T A) (notin 0 T) (comm_ring B) (localization_of B A T)) (integrally_closed_domain B)))
  hard_negative:
    statement: 整域$R$の局所化$M^{-1}R$が整閉なら、$R$は整閉である。
    reason: 体$k$上の$R=k[x^2,x^3]$と$M=\{x^{2n}\}$では、$x=x^3/x^2$より$M^{-1}R=k[x,x^{-1}]$となり整閉である。しかし$x$は$R$上整で$x\notin R$なので、$R$は整閉でない。
  target: |
    ∀ (R S : Type*) [CommRing R] [IsDomain R] [IsIntegrallyClosed R] [CommRing S] [Algebra R S] (M : Submonoid R), M ≤ nonZeroDivisors R → IsLocalization M S → IsIntegrallyClosed S
  proof: |
    by
      intro R S _ _ _ _ _ M hM _
      exact isIntegrallyClosed_of_isLocalization S M hM
- id: localization_radical
  kind: gap
  level: 3
  topic: 可換環論・局所化とイデアル
  statement: $R$を可換環、$M$を乗法的部分集合、$\varphi:R\to S=M^{-1}R$を標準写像、$I$をイデアルとする。$\sqrt{I}$の拡大は$I$の拡大の根基に等しい。すなわち$(\sqrt{I})S=\sqrt{IS}$である。
  statement_en: Let S be the localization of a commutative ring R at a multiplicative subset M and I an ideal of R. The extension of rad(I) to S equals the radical of the extension of I.
  assumptions:
  - $R$は可換環
  - $M$は乗法的部分集合
  - $S=M^{-1}R$
  - $I$は$R$のイデアル
  quantifiers:
  - 任意の可換環$R$、乗法的部分集合$M$、イデアル$I$
  conclusion: $(\sqrt{I})S=\sqrt{IS}$である。
  answer: |
    $R$を可換環、$M$を乗法的部分集合、$\varphi:R\to S=M^{-1}R$を標準写像、$I$をイデアルとする。$IS$の元は通分により$\varphi(b)/\varphi(t)$（$b\in I$、$t\in M$）と書ける。
    $x\in\sqrt{I}$で$x^n\in I$なら$\varphi(x)^n\in IS$なので、$\varphi(x)\in\sqrt{IS}$である。よって$(\sqrt{I})S\subseteq\sqrt{IS}$である。
    逆に$z=\varphi(a)/\varphi(s)\in\sqrt{IS}$とし、$z^n=\varphi(b)/\varphi(t)$（$n\geq 1$、$b\in I$、$t\in M$）とする。$\varphi(ta^n)=\varphi(s^nb)$なので、ある$u\in M$で$uta^n=us^nb\in I$である。すると$(uta)^n=(ut)^{n-1}\cdot uta^n\in I$なので$uta\in\sqrt{I}$である。$z=\varphi(uta)/\varphi(uts)$なので$z\in(\sqrt{I})S$である。
  strategy: Write elements with common denominators and clear the denominators in a power relation.
  sketch:
  - 'derive: Elements of IS have the form φ(b)/φ(t) with b in I.'
  - 'derive: The image of rad(I) lies in rad(IS).'
  - 'setup: Let z = φ(a)/φ(s) with z^n in IS.'
  - 'derive: Clearing denominators gives u, t in M with uta^n in I, so uta lies in rad(I).'
  - 'conclude: Since z = φ(uta)/φ(uts), z lies in the extension of rad(I).'
  openmath: (forall (A B T I) (-> (and (comm_ring A) (comm_ring B) (submonoid_of T A) (localization_of B A T) (ideal_of I A)) (= (ideal_map (algebra_map A B) (ideal_radical I)) (ideal_radical (ideal_map (algebra_map A B) I)))))
  hard_negative:
    statement: 可換環の局所化について、$IS$が根基イデアルなら$I$は根基イデアルである。
    reason: $R=\mathbb{Z}$、$M=\mathbb{Z}\setminus\{0\}$、$I=(4)$とすると、$IS=\mathbb{Q}$は根基イデアルであるが、$\sqrt{I}=(2)\neq I$である。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] (M : Submonoid R), IsLocalization M S → ∀ I : Ideal R, (I.radical).map (algebraMap R S) = (I.map (algebraMap R S)).radical
  proof: |
    by
      intro R S _ _ _ M _ I
      exact IsLocalization.map_radical M S I
- id: localization_noetherian
  kind: textbook
  level: 3
  topic: 可換環論・局所化とネーター性
  statement: $R$をネーター環、$M$を乗法的部分集合とする。局所化$M^{-1}R$はネーター環である。
  statement_en: The localization of a Noetherian commutative ring at a multiplicative subset is Noetherian.
  assumptions:
  - $R$はネーター可換環
  - $M$は乗法的部分集合
  quantifiers:
  - 任意のネーター環$R$と乗法的部分集合$M$
  conclusion: $M^{-1}R$はネーター環である。
  answer: |
    $R$をネーター可換環、$M$を乗法的部分集合、$\varphi:R\to S=M^{-1}R$を標準写像とする。$J$を$S$のイデアルとし、$A=\varphi^{-1}(J)$とおく。$J$の元$\varphi(a)/\varphi(s)$について、$\varphi(a)=\varphi(s)\cdot\frac{\varphi(a)}{\varphi(s)}\in J$なので$a\in A$である。よって$J$は$\varphi(A)$で生成される。
    $R$はネーター環なので$A=(a_1,\dots,a_r)$と有限生成である。すると$J=(\varphi(a_1),\dots,\varphi(a_r))$も有限生成である。すべてのイデアルが有限生成なので、$S$はネーター環である。
  strategy: Every ideal of the localization is generated by the image of its contraction, which is finitely generated.
  sketch:
  - 'setup: Let J be an ideal of S with contraction A.'
  - 'derive: Every element of J is a unit multiple of the image of an element of A.'
  - 'apply_theorem: A is finitely generated because R is Noetherian.'
  - 'conclude: So J is finitely generated.'
  openmath: (forall (A B T) (-> (and (comm_ring A) (noetherian_ring A) (comm_ring B) (submonoid_of T A) (localization_of B A T)) (noetherian_ring B)))
  hard_negative:
    statement: 可換環$R$のすべての素イデアル$\mathfrak{p}$で$R_{\mathfrak{p}}$がネーター環なら、$R$はネーター環である。
    reason: $\mathbb{F}_2$の可算無限個の直積$R$では、すべての元が$x^2=x$を満たすので、各$R_{\mathfrak{p}}$は$\mathbb{F}_2$でありネーター環である。しかし$R$には無限に真に増大するイデアルの列があり、$R$はネーター環でない。
  target: |
    ∀ (R S : Type*) [CommRing R] [IsNoetherianRing R] [CommRing S] [Algebra R S] (M : Submonoid R), IsLocalization M S → IsNoetherianRing S
  proof: |
    by
      intro R S _ _ _ _ M _
      exact IsLocalization.isNoetherianRing M S inferInstance
- id: localization_artinian
  kind: gap
  level: 3
  topic: 可換環論・局所化とアルティン性
  statement: $R$をアルティン環、$M$を乗法的部分集合とする。局所化$M^{-1}R$はアルティン環である。
  statement_en: The localization of an Artinian commutative ring at a multiplicative subset is Artinian.
  assumptions:
  - $R$はアルティン可換環
  - $M$は乗法的部分集合
  quantifiers:
  - 任意のアルティン環$R$と乗法的部分集合$M$
  conclusion: $M^{-1}R$はアルティン環である。
  answer: |
    $R$をアルティン可換環、$M$を乗法的部分集合、$\varphi:R\to S=M^{-1}R$を標準写像とする。$S$のイデアル$J$は$\varphi^{-1}(J)$の拡大に等しい。実際、$J$の元$\varphi(a)/\varphi(s)$について$\varphi(a)\in J$なので、$a\in\varphi^{-1}(J)$である。
    $J_1\supseteq J_2\supseteq\cdots$を$S$のイデアルの降鎖とする。$\varphi^{-1}(J_1)\supseteq\varphi^{-1}(J_2)\supseteq\cdots$は$R$のイデアルの降鎖なので、ある$n$以降で一定である。$J_m$は$\varphi^{-1}(J_m)$の拡大なので、$m\geq n$で$J_m=J_n$である。よって$S$はアルティン環である。
  strategy: Contract a descending chain to R, where it stabilizes, and extend back.
  sketch:
  - 'derive: Each ideal J of S is the extension of its contraction.'
  - 'setup: Take a descending chain of ideals of S.'
  - 'apply_theorem: The contracted chain stabilizes because R is Artinian.'
  - 'conclude: Extending back, the chain in S stabilizes.'
  openmath: (forall (A B T) (-> (and (comm_ring A) (artinian_ring A) (comm_ring B) (submonoid_of T A) (localization_of B A T)) (artinian_ring B)))
  hard_negative:
    statement: 可換環の局所化$M^{-1}R$がアルティン環なら、$R$はアルティン環である。
    reason: $R=\mathbb{Z}$、$M=\mathbb{Z}\setminus\{0\}$とすると$M^{-1}R=\mathbb{Q}$は体なのでアルティン環であるが、$\mathbb{Z}$では$(2)\supset(4)\supset\cdots$が停止しない。
  target: |
    ∀ (R S : Type*) [CommRing R] [IsArtinianRing R] [CommRing S] [Algebra R S] (M : Submonoid R), IsLocalization M S → IsArtinianRing S
  proof: |
    by
      intro R S _ _ _ _ M _
      exact IsArtinianRing.localization_artinian M S
- id: localization_is_flat
  kind: textbook
  level: 3
  topic: 可換環論・局所化と平坦性
  statement: $R$を可換環、$M$を乗法的部分集合とする。局所化$M^{-1}R$は$R$上平坦である。
  statement_en: The localization of a commutative ring R at a multiplicative subset is a flat R-module.
  assumptions:
  - $R$は可換環
  - $M$は乗法的部分集合
  quantifiers:
  - 任意の可換環$R$と乗法的部分集合$M$
  conclusion: $M^{-1}R$は$R$上平坦である。
  answer: |
    $R$を可換環、$M$を乗法的部分集合、$S=M^{-1}R$とする。$g:N'\to N$を$R$加群の単射とする。$R$加群$N$について、$a/s\otimes y\mapsto ay/s$は同型$S\otimes_RN\cong M^{-1}N$を与え、$N$について自然である。よって$\mathrm{id}_S\otimes g$は$M^{-1}g:M^{-1}N'\to M^{-1}N$と同一視される。
    $y/s\in M^{-1}N'$で$g(y)/s=0$とすると、ある$u\in M$で$ug(y)=0$である。$g(uy)=0$と$g$の単射性より$uy=0$なので$y/s=0$である。よって$M^{-1}g$は単射であり、$S$は平坦である。
  strategy: Identify tensoring with S with localization and check that localization preserves injections.
  sketch:
  - 'apply_theorem: S ⊗ N is naturally isomorphic to the localization of N.'
  - 'setup: Let g be an injection from N'' to N.'
  - 'derive: If g(y)/s = 0, then ug(y) = 0 for some u in M, so uy = 0 and y/s = 0.'
  - 'conclude: The localized map is injective, so S is flat.'
  openmath: (forall (A B T) (-> (and (comm_ring A) (comm_ring B) (submonoid_of T A) (localization_of B A T)) (flat_module A B)))
  hard_negative:
    statement: 可換環の局所化$M^{-1}R$は$R$上忠実平坦である。
    reason: $R=\mathbb{Z}$、$M=\mathbb{Z}\setminus\{0\}$とすると$\mathbb{Q}\otimes_{\mathbb{Z}}\mathbb{Z}/2\mathbb{Z}=0$である。零でない加群を$0$へ写すので、$\mathbb{Q}$は忠実平坦でない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] (M : Submonoid R), IsLocalization M S → Module.Flat R S
  proof: |
    by
      intro R S _ _ _ M _
      exact IsLocalization.flat S M
- id: localization_contraction_of_extension
  kind: gap
  level: 3
  topic: 可換環論・局所化とイデアル
  statement: $R$を可換環、$M$を乗法的部分集合、$\varphi:R\to S=M^{-1}R$を標準写像、$I$をイデアルとする。$x\in R$について、$\varphi(x)\in IS$であることと、ある$s\in M$で$sx\in I$であることは同値である。
  statement_en: Let φ from R to S be the localization of a commutative ring at a multiplicative subset M and I an ideal of R. An element x of R has φ(x) in IS if and only if sx lies in I for some s in M.
  assumptions:
  - $R$は可換環
  - $M$は乗法的部分集合
  - $\varphi:R\to S=M^{-1}R$は標準写像
  - $I$はイデアル
  - $x\in R$
  quantifiers:
  - 任意の可換環$R$、乗法的部分集合$M$、イデアル$I$、元$x$
  conclusion: $\varphi(x)\in IS\iff\exists s\in M,\ sx\in I$である。
  answer: |
    $R$を可換環、$M$を乗法的部分集合、$\varphi:R\to S=M^{-1}R$を標準写像、$I$をイデアル、$x\in R$とする。$s\in M$で$sx\in I$なら、$\varphi(s)\varphi(x)=\varphi(sx)\in IS$であり、$\varphi(s)$は単元なので$\varphi(x)\in IS$である。
    逆に$\varphi(x)\in IS$とする。$IS$の元は通分により$\varphi(b)/\varphi(t)$（$b\in I$、$t\in M$）と書けるので、$\varphi(tx)=\varphi(b)$である。すると局所化の定義より、ある$u\in M$で$utx=ub\in I$である。$s=ut\in M$とすれば$sx\in I$である。
  strategy: Use that M becomes units for one direction and the equality criterion in the localization for the other.
  sketch:
  - 'derive: If sx lies in I, then φ(s)φ(x) lies in IS, and φ(s) is a unit.'
  - 'derive: Elements of IS have the form φ(b)/φ(t) with b in I.'
  - 'derive: φ(tx) = φ(b) gives u in M with utx = ub.'
  - 'conclude: With s = ut, sx lies in I.'
  openmath: (forall (A B T I x) (-> (and (comm_ring A) (comm_ring B) (submonoid_of T A) (localization_of B A T) (ideal_of I A) (in x A)) (<-> (in (fn_value (algebra_map A B) x) (ideal_map (algebra_map A B) I)) (exists (s) (and (in s T) (in (* s x) I))))))
  hard_negative:
    statement: 局所化の標準写像$\varphi$と$x\in R$について、$\varphi(x)\in IS$ならすべての$s\in M$で$sx\in I$である。
    reason: $R=\mathbb{Z}$、$M=\{3^k\}$、$I=(3)$、$x=1$とする。$s=3$で$sx\in I$なので$\varphi(x)\in IS$であるが、$s=1$では$sx=1\notin I$である。成り立つのは「ある$s$」であって「すべての$s$」ではない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] (M : Submonoid R), IsLocalization M S → ∀ (I : Ideal R) (x : R), x ∈ (I.map (algebraMap R S)).comap (algebraMap R S) ↔ ∃ s ∈ M, s * x ∈ I
  proof: |
    by
      intro R S _ _ _ M _ I x
      rw [Ideal.mem_comap, IsLocalization.algebraMap_mem_map_algebraMap_iff M]
