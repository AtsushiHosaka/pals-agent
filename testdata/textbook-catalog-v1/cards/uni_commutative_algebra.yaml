- id: flat_checked_at_maximal_ideals
  kind: gap
  level: 4
  topic: 可換環論・局所-大域原理
  statement: $R$を可換環、$M$を$R$加群とする。すべての極大イデアル$\mathfrak{m}$で$M_{\mathfrak{m}}$が$R_{\mathfrak{m}}$上平坦なら、$M$は$R$上平坦である。
