  strategy: Test the unit element and clear denominators in the localization.
  sketch:
  - 'derive: An element of I ∩ M becomes a unit in IS.'
  - 'setup: If IS = S, write 1 = φ(b)/φ(t) with b in I and t in M.'
  - 'derive: Then ut = ub for some u in M.'
  - 'conclude: ut lies in I ∩ M.'
  openmath: (forall (A B T I) (-> (and (comm_ring A) (comm_ring B) (submonoid_of T A) (localization_of B A T) (ideal_of I A)) (<-> (= (ideal_map (algebra_map A B) I) (unit_ideal B)) (!= (inter I T) emptyset))))
