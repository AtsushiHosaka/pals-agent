  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] (M : Submonoid R), IsLocalization M S → ∀ (I : Ideal R), I.map (algebraMap R S) = ⊤ ↔ ∃ s ∈ M, s ∈ I
  proof: |
    by
      intro R S _ _ _ M _ I
      rw [Ideal.eq_top_iff_one]
