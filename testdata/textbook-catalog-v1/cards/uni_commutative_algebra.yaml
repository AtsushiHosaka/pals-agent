- id: radical_of_product_and_intersection
  kind: gap
  level: 3
  topic: 可換環論・イデアルの根基
  statement: $R$を可換環、$I,J$を$R$のイデアルとする。$\sqrt{IJ}=\sqrt{I\cap J}=\sqrt{I}\cap\sqrt{J}$である。
  statement_en: For ideals I and J of a commutative ring, the radicals of IJ and of the intersection of I and J both equal the intersection of the radicals of I and J.
  assumptions:
  - $R$は可換環
  - $I,J$は$R$のイデアル
  quantifiers:
  - 任意の可換環$R$とイデアル$I,J$
  conclusion: $\sqrt{IJ}=\sqrt{I\cap J}=\sqrt{I}\cap\sqrt{J}$である。
  answer: |
    $R$を可換環、$I,J$を$R$のイデアルとする。$IJ\subseteq I\cap J$であり、$I\cap J$は$I$にも$J$にも含まれる。根基は包含を保つので、$\sqrt{IJ}\subseteq\sqrt{I\cap J}\subseteq\sqrt{I}\cap\sqrt{J}$を得る。
    逆に$x\in\sqrt{I}\cap\sqrt{J}$とする。$x^m\in I$、$x^n\in J$となる自然数$m,n$をとると、$x^{m+n}=x^mx^n\in IJ$である。よって$x\in\sqrt{IJ}$であり、3つのイデアルは一致する。
  strategy: Use monotonicity of the radical for one inclusion and multiply powers for the other.
  sketch:
  - 'derive: Since IJ lies in the intersection and the intersection lies in I and J, the radicals are nested.'
  - 'setup: Take x with x^m in I and x^n in J.'
  - 'derive: Then x^(m+n) is a product of an element of I and an element of J, so it lies in IJ.'
  - 'conclude: All three radicals coincide.'
  openmath: (forall (A I J) (-> (and (comm_ring A) (ideal_of I A) (ideal_of J A)) (and (= (ideal_radical (ideal_product I J)) (inter (ideal_radical I) (ideal_radical J))) (= (ideal_radical (inter I J)) (inter (ideal_radical I) (ideal_radical J))))))
  hard_negative:
    statement: 可換環のイデアル$I,J$について$\sqrt{I+J}=\sqrt{I}+\sqrt{J}$である。
    reason: 体$k$上の$k[x,y]$で$I=(y)$、$J=(y-x^2)$とする。$I,J$は素イデアルなので右辺は$(y,x^2)$であり、左辺の$(x,y)$と異なる。
  target: |
    ∀ (R : Type*) [CommRing R] (I J : Ideal R), (I * J).radical = I.radical ⊓ J.radical ∧ (I ⊓ J).radical = I.radical ⊓ J.radical
  proof: |
    by
      intro R _ I J
      exact ⟨Ideal.radical_mul I J, Ideal.radical_inf I J⟩
- id: coprime_radicals_imply_coprime
  kind: gap
  level: 3
  topic: 可換環論・互いに素なイデアル
  statement: $R$を可換環、$I,J$を$R$のイデアルとする。$\sqrt{I}+\sqrt{J}=R$ならば$I+J=R$である。
  statement_en: If ideals I and J of a commutative ring R satisfy rad(I) + rad(J) = R, then I + J = R.
  assumptions:
  - $R$は可換環
  - $I,J$は$R$のイデアル
  - $\sqrt{I}+\sqrt{J}=R$
  quantifiers:
  - 任意の可換環$R$とイデアル$I,J$
  conclusion: $I+J=R$である。
  answer: |
    $R$を可換環、$I,J$を$\sqrt{I}+\sqrt{J}=R$をみたす$R$のイデアルとする。$I+J\neq R$と仮定して矛盾を導く。
    真のイデアル$I+J$を含む極大イデアル$M$がある。$M$は素イデアルなので、$x^n\in I\subseteq M$なら$x\in M$である。よって$\sqrt{I}\subseteq M$であり、同様に$\sqrt{J}\subseteq M$である。すると$R=\sqrt{I}+\sqrt{J}\subseteq M$となり、$M$が真のイデアルであることに反する。したがって$I+J=R$である。
  strategy: A proper sum would lie in a maximal ideal, which then contains both radicals.
  sketch:
  - 'setup: Suppose I + J is proper and choose a maximal ideal M containing it.'
  - 'derive: M is prime, so it contains the radicals of I and of J.'
  - 'contradiction: The sum of the radicals is R and lies in M.'
  - 'conclude: Hence I + J = R.'
  openmath: (forall (A I J) (-> (and (comm_ring A) (ideal_of I A) (ideal_of J A) (= (ideal_sum (ideal_radical I) (ideal_radical J)) (unit_ideal A))) (= (ideal_sum I J) (unit_ideal A))))
  hard_negative:
    statement: $\sqrt{I}+\sqrt{J}=R$ならば$I\cap J=0$である。
    reason: $\mathbb{Z}$で$I=(2)$、$J=(3)$とすると仮定をみたすが、$I\cap J=(6)\neq 0$である。
  target: |
    ∀ (R : Type*) [CommRing R] (I J : Ideal R), I.radical ⊔ J.radical = ⊤ → I ⊔ J = ⊤
  proof: |
    by
      intro R _ I J h
      rw [← Ideal.radical_eq_top, Ideal.radical_sup, h, Ideal.radical_top]
- id: prime_contains_finite_intersection
  kind: gap
  level: 3
  topic: 可換環論・素イデアル
  statement: $R$を可換環、$P$を$R$の素イデアル、$I_i$($i\in s$)を有限個のイデアルの族とする。空の族の共通部分を$R$と定めると、$\bigcap_{i\in s}I_i\subseteq P$であることと、ある$i\in s$で$I_i\subseteq P$であることは同値である。
  statement_en: A prime ideal P of a commutative ring contains the intersection of a finite family of ideals, the empty intersection being the whole ring, if and only if P contains one member of the family.
  assumptions:
  - $R$は可換環
  - $P$は$R$の素イデアル
  - $I_i$($i\in s$)は有限個のイデアルの族
  - 空の族の共通部分は$R$
  quantifiers:
  - 任意の可換環$R$、素イデアル$P$、有限族$I_i$
  conclusion: $\bigcap_{i\in s}I_i\subseteq P$は、ある$i\in s$で$I_i\subseteq P$となることと同値である。
  answer: |
    $R$を可換環、$P$を素イデアル、$I_i$($i\in s$)を有限個のイデアルとする。ある$i\in s$で$I_i\subseteq P$なら、$\bigcap_{j\in s}I_j\subseteq I_i\subseteq P$である。
    逆を対偶で示す。すべての$i\in s$で$I_i\not\subseteq P$とし、$x_i\in I_i\setminus P$を選ぶ。$x=\prod_{i\in s}x_i$は各$I_i$に属するので$\bigcap_{i\in s}I_i$に属する。$s$が空なら$x=1$であり、これも$R=\bigcap_{i\in s}I_i$に属する。一方、$P$は素イデアルなので、$P$の外の元の有限積$x$は$P$に属さない。よって$\bigcap_{i\in s}I_i\not\subseteq P$である。
  strategy: Take the contrapositive and multiply one witness from each ideal.
  sketch:
  - 'derive: If one member lies in P, the intersection does too.'
  - 'setup: Otherwise pick x_i in I_i outside P for each i.'
  - 'derive: The product lies in every I_i, and it equals 1 for the empty family.'
  - 'derive: Primality keeps the product outside P.'
  - 'conclude: The intersection is not contained in P.'
  openmath: (forall (A F s p) (-> (and (comm_ring A) (finite_set s) (prime_ideal p A) (forall (i) (-> (in i s) (ideal_of (family_value F i) A)))) (<-> (subset (ideal_family_inf_over F s) p) (exists (i) (and (in i s) (subset (family_value F i) p))))))
  hard_negative:
    statement: 無限個のイデアルの族でも、共通部分が素イデアル$P$に含まれるなら、ある$I_i$が$P$に含まれる。
    reason: $\mathbb{Z}$で$I_n=(3^n)$、$P=(2)$とすると、共通部分は$0$で$P$に含まれるが、どの$I_n$も$P$に含まれない。
  target: |
    ∀ (R ι : Type*) [CommRing R] (s : Finset ι) (f : ι → Ideal R) (P : Ideal R), P.IsPrime → (s.inf f ≤ P ↔ ∃ i ∈ s, f i ≤ P)
  proof: |
    by
      intro R ι _ s f P hP
      exact hP.inf_le'
- id: prime_avoidance
  kind: named
  level: 4
  topic: 可換環論・素イデアル回避
  statement: 素イデアル回避の補題。$R$を可換環、$I$を$R$のイデアル、$J_i$($i\in s$)を有限個のイデアルの族とし、高々2つの添字を除いて$J_i$は素イデアルとする。$I\subseteq\bigcup_{i\in s}J_i$ならば、ある$i\in s$で$I\subseteq J_i$である。
  statement_en: Prime avoidance. If an ideal I of a commutative ring is contained in the union of finitely many ideals J_i, all prime except for at most two indices, then I is contained in some J_i.
  assumptions:
  - $R$は可換環
  - $I$は$R$のイデアル
  - $J_i$($i\in s$)は有限個のイデアルの族で、高々2つの添字を除いて素イデアル
  - $I\subseteq\bigcup_{i\in s}J_i$
  quantifiers:
  - 任意の可換環$R$、イデアル$I$、有限族$J_i$
  conclusion: ある$i\in s$で$I\subseteq J_i$である。
  answer: |
    $R$を可換環、$I$をイデアル、$J_i$($i\in s$)を高々2つを除いて素イデアルであるイデアルの有限族とし、$I\subseteq\bigcup_{i\in s}J_i$とする。族の個数$n$についての帰納法で示す。$n=0$では和集合が空となり$0\in I$に反するので、仮定は起こらない。$n=1$では仮定が結論そのものである。
    $n\geq 2$とし、どの$i$でも$I\not\subseteq J_i$と仮定する。$J_i$を除いた族も仮定の素イデアルの条件をみたすので、帰納法の仮定から$I\not\subseteq\bigcup_{j\neq i}J_j$である。そこで$x_i\in I\setminus\bigcup_{j\neq i}J_j$を選ぶ。$I$は和集合に含まれるので$x_i\in J_i$である。
    $n=2$とする。$y=x_1+x_2\in I$は、$x_1\in J_1$かつ$x_2\notin J_1$なので$J_1$に属さず、同様に$J_2$にも属さない。これは$I\subseteq J_1\cup J_2$に反する。
    $n\geq 3$とする。素イデアルでない$J_i$は高々2つなので、番号を付け替えて$J_1$を素イデアルとする。$y=x_1+x_2x_3\cdots x_n\in I$とおく。$J_1$は素イデアルで$x_2,\ldots,x_n\notin J_1$なので、積$x_2\cdots x_n$は$J_1$に属さない。$x_1\in J_1$と合わせて$y\notin J_1$である。$j\geq 2$では$x_2\cdots x_n\in J_j$かつ$x_1\notin J_j$なので$y\notin J_j$である。これも$I\subseteq\bigcup_{i}J_i$に反する。
  strategy: Induct on the number of ideals and combine witnesses that avoid all but one ideal.
  sketch:
  - 'induction: Induct on the number n of ideals; deleting one ideal keeps the hypothesis.'
  - 'setup: If I lies in no J_i, the induction gives x_i in I avoiding every J_j with j different from i, and then x_i lies in J_i.'
  - 'case_split: For n = 2 the sum x_1 + x_2 avoids both ideals.'
  - 'case_split: For n at least 3 choose J_1 prime and form y = x_1 + x_2 ... x_n.'
  - 'derive: Primality of J_1 gives y outside J_1, and y is outside each other J_j.'
  - 'contradiction: The element y of I lies outside the union.'
  openmath: (forall (A F s a b I) (-> (and (comm_ring A) (finite_set s) (ideal_of I A) (forall (i) (-> (in i s) (ideal_of (family_value F i) A))) (forall (i) (-> (and (in i s) (!= i a) (!= i b)) (prime_ideal (family_value F i) A))) (subset I (family_union F s))) (exists (i) (and (in i s) (subset I (family_value F i))))))
  hard_negative:
    statement: 素イデアルでないものが3つあっても、イデアルが和集合に含まれるなら、どれか1つに含まれる。
    reason: $\mathbb{F}_2[x,y]/(x,y)^2$で$I=(x,y)$は$\{0,x,y,x+y\}$であり、3つのイデアル$(x),(y),(x+y)$の和集合に等しいが、どの1つにも含まれない。
  target: |
    ∀ (R ι : Type*) [CommRing R] (s : Finset ι) (f : ι → Ideal R) (a b : ι) (I : Ideal R), (∀ i ∈ s, i ≠ a → i ≠ b → (f i).IsPrime) → (I : Set R) ⊆ ⋃ i ∈ (s : Set ι), (f i : Set R) → ∃ i ∈ s, I ≤ f i
  proof: |
    by
      intro R ι _ s f a b I hp h
      exact (Ideal.subset_union_prime a b hp).mp h
- id: quotient_reduced_iff_radical_ideal
  kind: gap
  level: 3
  topic: 可換環論・被約環と根基イデアル
  statement: $R$を可換環、$I$を$R$のイデアルとする。$R/I$が被約であることと$\sqrt{I}=I$は同値である。
  statement_en: For an ideal I of a commutative ring R, the quotient R/I is reduced if and only if the radical of I equals I.
  assumptions:
  - $R$は可換環
  - $I$は$R$のイデアル
  quantifiers:
  - 任意の可換環$R$とイデアル$I$
  conclusion: $R/I$が被約であることと$\sqrt{I}=I$は同値である。
  answer: |
    $R$を可換環、$I$をイデアルとし、$x\in R$の剰余類を$\bar{x}$と書く。$\bar{x}^n=0$は$x^n\in I$と同値である。
    $R/I$が被約なら、$x\in\sqrt{I}$に対し$x^n\in I$となる$n$があり、$\bar{x}^n=0$から$\bar{x}=0$、すなわち$x\in I$を得る。$I\subseteq\sqrt{I}$はつねに成り立つので$\sqrt{I}=I$である。
    逆に$\sqrt{I}=I$とする。$\bar{x}^n=0$なら$x^n\in I$なので$x\in\sqrt{I}=I$であり、$\bar{x}=0$である。よって$R/I$は被約である。
  strategy: Translate nilpotence in the quotient into a power lying in the ideal.
  sketch:
  - 'translate: The class of x has vanishing n-th power exactly when x^n lies in I.'
  - 'derive: If R/I is reduced, every element of the radical lies in I.'
  - 'derive: If I is its own radical, every nilpotent class is zero.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (A I) (-> (and (comm_ring A) (ideal_of I A)) (<-> (reduced_ring (quotient_ring A I)) (= (ideal_radical I) I))))
  hard_negative:
    statement: 可換環$R$のイデアル$I$について、$R/I$が被約なら$I$は素イデアルである。
    reason: $\mathbb{Z}$で$I=(6)$とすると$\mathbb{Z}/6\mathbb{Z}$は被約だが、$I$は素イデアルでない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R), IsReduced (R ⧸ I) ↔ I.radical = I
  proof: |
    by
      intro R _ I
      rw [← Ideal.isRadical_iff_quotient_reduced]
      exact ⟨fun h => le_antisymm h Ideal.le_radical, fun h => h.le⟩
- id: colon_of_colon_ideal
  kind: gap
  level: 3
  topic: 可換環論・イデアル商
  statement: $R$を可換環、$I,J,K$を$R$のイデアルとする。イデアル商$(I:J)=\{r\in R\mid rJ\subseteq I\}$について、$((I:J):K)=(I:JK)$である。
  statement_en: For ideals I, J and K of a commutative ring, with (I:J) the ideal of all r such that rJ lies in I, one has ((I:J):K) = (I:JK).
  assumptions:
  - $R$は可換環
  - $I,J,K$は$R$のイデアル
  - $(I:J)=\{r\in R\mid rJ\subseteq I\}$
  quantifiers:
  - 任意の可換環$R$とイデアル$I,J,K$
  conclusion: $((I:J):K)=(I:JK)$である。
  answer: |
    $R$を可換環、$I,J,K$をイデアルとし、$(I:J)=\{r\in R\mid rJ\subseteq I\}$とする。
    $x\in((I:J):K)$とする。$y\in J$、$z\in K$に対し$xz\in(I:J)$なので$xzy\in I$である。$JK$の元は積$yz$の有限和なので、$x\cdot JK\subseteq I$であり、$x\in(I:JK)$を得る。
    逆に$x\in(I:JK)$とする。$z\in K$、$y\in J$に対し$yz\in JK$なので$(xz)y=x(yz)\in I$である。よって$xz\in(I:J)$であり、$z$は任意なので$x\in((I:J):K)$である。
  strategy: Compare both sides on products of generators, using that IJ is spanned by products.
  sketch:
  - 'setup: Take x in ((I:J):K), y in J and z in K.'
  - 'derive: Then xzy lies in I, and finite sums of products yz fill JK.'
  - 'derive: Conversely x in (I:JK) gives (xz)y in I for all y in J.'
  - 'conclude: The two ideals are equal.'
  openmath: (forall (A I J K) (-> (and (comm_ring A) (ideal_of I A) (ideal_of J A) (ideal_of K A)) (= (colon_ideal (colon_ideal I J) K) (colon_ideal I (ideal_product J K)))))
  hard_negative:
    statement: イデアル商について$(I:J+K)=(I:J)+(I:K)$である。
    reason: 正しくは共通部分である。$\mathbb{Z}$で$I=(6)$、$J=(2)$、$K=(3)$とすると、左辺は$(6)$、右辺は$(3)+(2)=\mathbb{Z}$である。
  target: |
    ∀ (R : Type*) [CommRing R] (I J K : Ideal R), (I.colon (J : Set R)).colon (K : Set R) = I.colon ((J * K : Ideal R) : Set R)
  proof: |
    by
      intro R _ I J K
      ext x
      simp only [Submodule.mem_colon, smul_eq_mul, SetLike.mem_coe]
      constructor
      · intro h y hy
        refine Submodule.mul_induction_on hy ?_ ?_
        · intro a ha b hb
          have := h b hb a ha
          convert this using 1
          ring
        · intro a b ha hb
          rw [mul_add]
          exact I.add_mem ha hb
      · intro h y hy z hz
        have := h (z * y) (Ideal.mul_mem_mul hz hy)
        convert this using 1
        ring
- id: primary_ideal_colon_element
  kind: gap
  level: 4
  topic: 可換環論・準素イデアルとイデアル商
  statement: $R$を可換環、$Q$を$R$の準素イデアル、$x\in R\setminus Q$とする。$(Q:x)=\{r\in R\mid rx\in Q\}$は準素イデアルであり、$\sqrt{(Q:x)}=\sqrt{Q}$である。
  statement_en: If Q is a primary ideal of a commutative ring R and x is an element outside Q, then the ideal (Q:x) of all r with rx in Q is primary and has the same radical as Q.
  assumptions:
  - $R$は可換環
  - $Q$は$R$の準素イデアル
  - $x\in R\setminus Q$
  - $(Q:x)=\{r\in R\mid rx\in Q\}$
  quantifiers:
  - 任意の可換環$R$、準素イデアル$Q$、$Q$に属さない元$x$
  conclusion: $(Q:x)$は準素イデアルで、$\sqrt{(Q:x)}=\sqrt{Q}$である。
  answer: |
    $R$を可換環、$Q$を準素イデアル、$x\notin Q$とする。準素イデアルとは、真のイデアルであって、$ab\in Q$なら$a\in Q$または$b\in\sqrt{Q}$となるものである。$J=(Q:x)$とおくと、$a\in J$は$ax\in Q$と同値である。
    まず$\sqrt{J}=\sqrt{Q}$を示す。$Q\subseteq J$なので$\sqrt{Q}\subseteq\sqrt{J}$である。$a\in\sqrt{J}$なら$a^nx\in Q$となる$n$がある。$x\notin Q$と準素性から$a^n\in\sqrt{Q}$であり、$a\in\sqrt{Q}$を得る。
    次に$J$が準素イデアルであることを示す。$1\in J$なら$x\in Q$となるので、$J$は真のイデアルである。$ab\in J$とすると$(ax)b=abx\in Q$である。準素性から$ax\in Q$または$b\in\sqrt{Q}$であり、前者は$a\in J$を、後者は$b\in\sqrt{J}$を意味する。
  strategy: Rewrite membership in (Q:x) as a product lying in Q and apply the primary condition.
  sketch:
  - 'translate: a lies in J = (Q:x) exactly when ax lies in Q.'
  - 'derive: If a^n x lies in Q and x is outside Q, then a^n lies in rad(Q), so rad(J) = rad(Q).'
  - 'derive: J is proper since 1 in J would put x in Q.'
  - 'derive: If ab lies in J, then (ax)b lies in Q, so ax lies in Q or b lies in rad(Q).'
  - 'conclude: J is primary with radical rad(Q).'
  openmath: (forall (A U x) (-> (and (comm_ring A) (primary_ideal U A) (in x A) (notin x U)) (and (primary_ideal (colon_ideal U (principal_ideal x)) A) (= (ideal_radical (colon_ideal U (principal_ideal x))) (ideal_radical U)))))
  hard_negative:
    statement: 準素イデアル$Q$と任意の元$x$について、$(Q:x)$は準素イデアルである。
    reason: $x\in Q$なら$(Q:x)=R$であり、真のイデアルでないので準素イデアルではない。
  target: |
    ∀ (R : Type*) [CommRing R] (Q : Ideal R) (x : R), Q.IsPrimary → x ∉ Q → (Q.colon ({x} : Set R)).IsPrimary ∧ (Q.colon ({x} : Set R)).radical = Q.radical
  proof: |
    by
      intro R _ Q x hQ hx
      obtain ⟨hne, hprim⟩ := Ideal.isPrimary_iff.mp hQ
      have hmem : ∀ a, a ∈ Q.colon ({x} : Set R) ↔ a * x ∈ Q := by
        intro a
        simp [Submodule.mem_colon_singleton]
      have hrad : (Q.colon ({x} : Set R)).radical = Q.radical := by
        apply le_antisymm
        · rintro a ⟨n, hn⟩
          have h1 : x * a ^ n ∈ Q := by rw [mul_comm]; exact (hmem _).mp hn
          rcases hprim h1 with h2 | h2
          · exact absurd h2 hx
          · exact Ideal.radical_isRadical Q ⟨n, h2⟩
        · exact Ideal.radical_mono (fun a ha => (hmem a).mpr (Q.mul_mem_right x ha))
      refine ⟨Ideal.isPrimary_iff.mpr ⟨?_, ?_⟩, hrad⟩
      · intro htop
        have : (1 : R) ∈ Q.colon ({x} : Set R) := htop ▸ Submodule.mem_top
        exact hx (by simpa using (hmem 1).mp this)
      · intro a b hab
        have h1 : (a * x) * b ∈ Q := by
          have := (hmem _).mp hab
          convert this using 1
          ring
        rcases hprim h1 with h2 | h2
        · exact Or.inl ((hmem a).mpr h2)
        · exact Or.inr (hrad ▸ h2)
- id: prime_disjoint_from_multiplicative_set
  kind: textbook
  level: 3
  topic: 可換環論・素イデアルの存在
  statement: $R$を可換環、$M$を$R$の乗法的部分モノイド、$I$を$M$と交わらないイデアルとする。$I$を含み$M$と交わらない素イデアルが存在する。
  statement_en: If an ideal I of a commutative ring is disjoint from a multiplicative submonoid M, then some prime ideal contains I and is disjoint from M.
  assumptions:
  - $R$は可換環
  - $M$は$R$の乗法的部分モノイド
  - $I$は$R$のイデアルで$I\cap M=\emptyset$
  quantifiers:
  - 任意の可換環$R$、部分モノイド$M$、イデアル$I$
  conclusion: $I\subseteq P$かつ$P\cap M=\emptyset$をみたす素イデアル$P$が存在する。
  answer: |
    $R$を可換環、$M$を乗法的部分モノイド、$I$を$I\cap M=\emptyset$をみたすイデアルとする。$I$を含み$M$と交わらないイデアル全体を$\Sigma$とする。$I\in\Sigma$であり、$\Sigma$の鎖の和集合は再び$\Sigma$に属する。ツォルンの補題により$\Sigma$は極大元$P$をもつ。
    $P$が素イデアルであることを示す。$1\in M$なので$P\neq R$である。$a,b\notin P$とする。$P+(a)$と$P+(b)$は$P$より真に大きいので、極大性からどちらも$M$と交わる。$m=p+ra\in M$、$n=q+sb\in M$($p,q\in P$、$r,s\in R$)をとると、$mn\in M$かつ$mn\in P+(ab)$である。$ab\in P$なら$mn\in P\cap M$となり矛盾するので、$ab\notin P$である。
  strategy: Apply Zorn to ideals disjoint from M and show a maximal one is prime.
  sketch:
  - 'setup: Let Sigma be the set of ideals containing I and disjoint from M.'
  - 'apply_theorem: Unions of chains stay in Sigma, so Zorn gives a maximal element P.'
  - 'derive: P is proper because 1 lies in M.'
  - 'derive: If a and b are outside P, then P + (a) and P + (b) meet M.'
  - 'derive: Multiplying the two elements of M gives an element of M in P + (ab).'
  - 'conclude: So ab is outside P and P is prime.'
  openmath: (forall (A I M) (-> (and (comm_ring A) (ideal_of I A) (submonoid_of M A) (= (inter I M) emptyset)) (exists (p) (and (prime_ideal p A) (subset I p) (= (inter p M) emptyset)))))
  hard_negative:
    statement: 可換環$R$の乗法的部分モノイド$M$と交わらないイデアル$I$に対し、$I$を含み$M$と交わらない極大イデアルが存在する。
    reason: $\mathbb{Z}$で$I=0$、$M=\mathbb{Z}\setminus\{0\}$とすると、$M$と交わらない素イデアルは$0$だけであり、極大イデアルではない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R) (M : Submonoid R), Disjoint (I : Set R) (M : Set R) → ∃ P : Ideal R, P.IsPrime ∧ I ≤ P ∧ Disjoint (P : Set R) (M : Set R)
  proof: |
    by
      intro R _ I M h
      exact Ideal.exists_le_prime_disjoint I M h
- id: minimal_prime_consists_of_zero_divisors
  kind: gap
  level: 4
  topic: 可換環論・極小素イデアル
  statement: $R$を可換環、$P$を$R$の極小素イデアル、$x\in P$とする。$xy=0$をみたす$0$でない$y\in R$が存在する。
  statement_en: Every element x of a minimal prime ideal of a commutative ring is a zero divisor, that is, xy = 0 for some nonzero y.
  assumptions:
  - $R$は可換環
  - $P$は$R$の極小素イデアル
  - $x\in P$
  quantifiers:
  - 任意の可換環$R$、極小素イデアル$P$、$x\in P$
  conclusion: $y\neq 0$かつ$xy=0$をみたす$y\in R$が存在する。
  answer: |
    $R$を可換環、$P$を極小素イデアル、$x\in P$とする。$T=\{sx^n\mid s\notin P,\ n\geq 0\}$とおく。$P$は素イデアルなので、$T$は$1$を含み積で閉じる。
    $0\notin T$と仮定する。零イデアルは$T$と交わらないので、$T$と交わらない素イデアル$Q$が存在する。これは、部分モノイドと交わらないイデアルを極大にとると素イデアルになるという標準的な事実による。$Q$は$P$の外の元を含まないので$Q\subseteq P$である。また$x\in T$より$x\notin Q$なので、$Q\neq P$である。これは$P$の極小性に反する。
    よって$0\in T$であり、$sx^n=0$となる$s\notin P$と$n\geq 0$がある。そのような$n$で最小のものをとる。$0\in P$より$s\neq 0$なので$n\geq 1$である。$y=sx^{n-1}$とおくと、$n$の最小性から$y\neq 0$であり、$xy=sx^n=0$である。
  strategy: Show 0 lies in the multiplicative set generated by x and the complement of P, then take a minimal power.
  sketch:
  - 'setup: Let T be the set of all s x^n with s outside P.'
  - 'contradiction: If 0 is not in T, a prime disjoint from T lies strictly inside P.'
  - 'derive: Hence s x^n = 0 for some s outside P and some n.'
  - 'construct: For the least such n, put y = s x^(n-1).'
  - 'conclude: Then y is nonzero and xy = 0.'
  openmath: (forall (A p x) (-> (and (comm_ring A) (minimal_prime_over p (zero_ideal A)) (in x p)) (exists (y) (and (in y A) (!= y 0) (= (* x y) 0)))))
  hard_negative:
    statement: 可換環の任意の素イデアルの元は零因子である。
    reason: $\mathbb{Z}$の素イデアル$(2)$の元$2$は零因子でない。極小性が必要である。
  target: |
    ∀ (R : Type*) [CommRing R] (P : Ideal R) (x : R), P ∈ minimalPrimes R → x ∈ P → ∃ y : R, y ≠ 0 ∧ x * y = 0
  proof: |
    by
      intro R _ P x hP hx
      by_contra hcon
      have hd := Ideal.disjoint_nonZeroDivisors_of_mem_minimalPrimes hP
      refine Set.disjoint_left.mp hd hx (mem_nonZeroDivisors_iff_right.mpr ?_)
      intro y hy
      by_contra hy0
      exact hcon ⟨y, hy0, by rw [mul_comm]; exact hy⟩
- id: chinese_remainder_finite_family
  kind: named
  level: 3
  topic: 可換環論・中国剰余定理
  statement: 中国剰余定理。$R$を可換環、$I_i$($i\in s$)を有限個のイデアルの族とし、$i\neq j$なら$I_i+I_j=R$とする。$x+\bigcap_iI_i\mapsto(x+I_i)_i$は環同型$R/\bigcap_iI_i\cong\prod_iR/I_i$を与える。
  statement_en: Chinese remainder theorem. If ideals I_i in a finite family of a commutative ring R satisfy I_i + I_j = R for i and j distinct, then x modulo the intersection maps to (x mod I_i)_i and this is a ring isomorphism onto the product of the quotients R/I_i.
  assumptions:
  - $R$は可換環
  - $I_i$($i\in s$)は有限個のイデアルの族
  - $i\neq j$なら$I_i+I_j=R$
  quantifiers:
  - 任意の可換環$R$と有限族$I_i$
  conclusion: 自然な写像$R/\bigcap_iI_i\to\prod_iR/I_i$は環同型である。
  answer: |
    $R$を可換環、$I_i$($i\in s$)を有限族とし、$i\neq j$なら$I_i+I_j=R$とする。環準同型$\varphi:R\to\prod_iR/I_i$、$\varphi(x)=(x+I_i)_i$の核は$\bigcap_iI_i$である。準同型定理より、$\varphi$の全射性を示せばよい。
    $i\in s$を固定する。$j\neq i$ごとに$a_j\in I_j$、$b_j\in I_i$を$a_j+b_j=1$となるようにとり、$e_i=\prod_{j\neq i}a_j$とおく。$a_j\equiv 1\pmod{I_i}$なので$e_i\equiv 1\pmod{I_i}$であり、$j\neq i$では$e_i\in I_j$である。
    任意の$(c_i)_i\in R^s$に対し$x=\sum_ic_ie_i$とおくと、各$i$で$x\equiv c_i\pmod{I_i}$である。よって$\varphi$は全射である。
  strategy: Build for each i an element congruent to 1 mod I_i and lying in every other I_j.
  sketch:
  - 'setup: The map from R to the product has kernel the intersection, so surjectivity suffices.'
  - 'construct: For j different from i write 1 = a_j + b_j with a_j in I_j and b_j in I_i.'
  - 'derive: The product e_i of the a_j is 1 mod I_i and lies in every other I_j.'
  - 'derive: The combination of the c_i e_i has residues c_i.'
  - 'conclude: The homomorphism theorem gives the isomorphism.'
  openmath: (forall (A F s) (-> (and (comm_ring A) (finite_set s) (forall (i) (-> (in i s) (ideal_of (family_value F i) A))) (forall (i j) (-> (and (in i s) (in j s) (!= i j)) (= (ideal_sum (family_value F i) (family_value F j)) (unit_ideal A))))) (exists (e) (and (ring_iso e (quotient_ring A (ideal_family_inf_over F s)) (product_of_quotients A F s)) (forall (x i) (-> (and (in x A) (in i s)) (= (family_value (fn_value e (residue_class (ideal_family_inf_over F s) x)) i) (residue_class (family_value F i) x))))))))
  hard_negative:
    statement: 互いに素とは限らない有限個のイデアルでも、$R/\bigcap_iI_i\cong\prod_iR/I_i$である。
    reason: $\mathbb{Z}$で$I_1=(2)$、$I_2=(4)$とすると、左辺の位数は$4$で右辺の位数は$8$である。
  target: |
    ∀ (R ι : Type*) [CommRing R] [Fintype ι] (I : ι → Ideal R), (∀ i j, i ≠ j → I i ⊔ I j = ⊤) → ∃ e : (R ⧸ ⨅ i, I i) ≃+* ∀ i, R ⧸ I i, ∀ (x : R) (i : ι), e (Ideal.Quotient.mk _ x) i = Ideal.Quotient.mk (I i) x
  proof: |
    by
      intro R ι _ _ I h
      have h' : Pairwise (fun i j => IsCoprime (I i) (I j)) := fun i j hij => Ideal.isCoprime_iff_sup_eq.mpr (h i j hij)
      exact ⟨Ideal.quotientInfRingEquivPiQuotient I h', fun x i => rfl⟩
- id: pairwise_coprime_intersection_eq_product
  kind: gap
  level: 3
  topic: 可換環論・互いに素なイデアル
  statement: $R$を可換環、$J_i$($i\in s$)を有限個のイデアルの族とし、$i\neq j$なら$J_i+J_j=R$とする。空の族の共通部分と積を$R$と定めると、$\bigcap_{i\in s}J_i=\prod_{i\in s}J_i$である。
  statement_en: For a finite family of pairwise coprime ideals of a commutative ring, the empty intersection and empty product being the whole ring, the intersection of the family equals its product.
  assumptions:
  - $R$は可換環
  - $J_i$($i\in s$)は有限個のイデアルの族
  - $i\neq j$なら$J_i+J_j=R$
  - 空の族の共通部分と積は$R$
  quantifiers:
  - 任意の可換環$R$と有限族$J_i$
  conclusion: $\bigcap_{i\in s}J_i=\prod_{i\in s}J_i$である。
  answer: |
    $R$を可換環、$J_i$($i\in s$)を$i\neq j$で$J_i+J_j=R$をみたす有限族とする。$s$の元の個数についての帰納法で示す。$s$が空なら両辺は$R$である。
    $a\notin t$として$s=t\cup\{a\}$とし、$t$では成り立つとする。$A=J_a$、$B=\prod_{i\in t}J_i$とおく。各$i\in t$で$1=u_i+v_i$($u_i\in J_a$、$v_i\in J_i$)と書ける。$1=\prod_{i\in t}(u_i+v_i)$を展開すると、$\prod_{i\in t}v_i\in B$以外の項は$J_a$に属する。よって$A+B=R$である。
    このとき$A\cap B=AB$である。実際、$AB\subseteq A\cap B$は明らかで、$1=a'+b'$($a'\in A$、$b'\in B$)と$x\in A\cap B$に対し$x=xa'+xb'\in AB$である。帰納法の仮定と合わせて、$\bigcap_{i\in s}J_i=A\cap B=AB=\prod_{i\in s}J_i$を得る。
  strategy: Induct on the family, using that an ideal coprime to each factor is coprime to the product.
  sketch:
  - 'induction: Induct on the size of s; the empty case is the whole ring on both sides.'
  - 'derive: Expanding the product of 1 = u_i + v_i shows J_a + B = R for B the product over the rest.'
  - 'derive: For coprime A and B, the identity 1 = a + b gives that the intersection equals AB.'
  - 'conclude: The induction hypothesis finishes the step.'
  openmath: (forall (A F s) (-> (and (comm_ring A) (finite_set s) (forall (i) (-> (in i s) (ideal_of (family_value F i) A))) (forall (i j) (-> (and (in i s) (in j s) (!= i j)) (= (ideal_sum (family_value F i) (family_value F j)) (unit_ideal A))))) (= (ideal_family_inf_over F s) (ideal_family_prod_over F s))))
  hard_negative:
    statement: 互いに素でなくても有限個のイデアルの共通部分は積に等しい。
    reason: $\mathbb{Z}$で$(2)$と$(4)$の共通部分は$(4)$だが、積は$(8)$である。
  target: |
    ∀ (R ι : Type*) [CommRing R] (s : Finset ι) (J : ι → Ideal R), (∀ i ∈ s, ∀ j ∈ s, i ≠ j → J i ⊔ J j = ⊤) → s.inf J = ∏ i ∈ s, J i
  proof: |
    by
      intro R ι _ s J h
      classical
      induction s using Finset.induction_on with
      | empty => simp
      | insert a s ha ih =>
        rw [Finset.inf_insert, Finset.prod_insert ha, ih (fun i hi j hj => h i (Finset.mem_insert_of_mem hi) j (Finset.mem_insert_of_mem hj))]
        have : J a ⊔ ∏ i ∈ s, J i = ⊤ := Ideal.sup_prod_eq_top fun i hi => h a (Finset.mem_insert_self a s) i (Finset.mem_insert_of_mem hi) (fun e => ha (e ▸ hi))
        exact (Ideal.mul_eq_inf_of_coprime this).symm
- id: local_iff_unit_or_one_minus_unit
  kind: gap
  level: 3
  topic: 可換環論・局所環
  statement: $R$を零環でない可換環とする。$R$が局所環であることと、すべての$x\in R$について$x$または$1-x$が単元であることは同値である。
  statement_en: A nonzero commutative ring R is local if and only if for every x in R, either x or 1 - x is a unit.
  assumptions:
  - $R$は零環でない可換環
  quantifiers:
  - 任意の零環でない可換環$R$
  conclusion: $R$が局所環であることと、すべての$x\in R$で$x$または$1-x$が単元であることは同値である。
  answer: |
    $R$を零環でない可換環とする。局所環とは、極大イデアルがただ1つである環のことである。非単元は必ずある極大イデアルに含まれる。
    $R$が局所環で、極大イデアルを$M$とする。$x$と$1-x$がともに非単元なら、どちらも$M$に属するので$1=x+(1-x)\in M$となり矛盾する。
    逆に、すべての$x$で$x$または$1-x$が単元であるとする。$R$は零環でないので極大イデアルをもつ。相異なる極大イデアル$M_1,M_2$があると、$M_1+M_2=R$より$1=a+b$($a\in M_1$、$b\in M_2$)と書ける。このとき$a$は非単元で、$1-a=b$も非単元であり、仮定に反する。よって極大イデアルはただ1つである。
  strategy: Use that nonunits lie in maximal ideals and that distinct maximal ideals are comaximal.
  sketch:
  - 'derive: In a local ring, x and 1 - x both nonunits would put 1 in the maximal ideal.'
  - 'setup: For the converse, suppose two distinct maximal ideals exist.'
  - 'derive: Comaximality gives 1 = a + b with a and b in the two ideals.'
  - 'contradiction: Then a and 1 - a are both nonunits.'
  - 'conclude: The maximal ideal is unique.'
  openmath: (forall (A) (-> (and (comm_ring A) (nontrivial_ring A)) (<-> (local_ring A) (forall (x) (-> (in x A) (or (unit_element x A) (unit_element (- 1 x) A)))))))
  hard_negative:
    statement: 可換環の非単元全体はつねにイデアルをなす。
    reason: $\mathbb{Z}$では$3$と$-2$が非単元だが、和は単元$1$である。これがイデアルになるのは局所環のときに限る。
  target: |
    ∀ (R : Type*) [CommRing R] [Nontrivial R], IsLocalRing R ↔ ∀ x : R, IsUnit x ∨ IsUnit (1 - x)
  proof: |
    by
      intro R _ _
      exact ⟨fun _ x => IsLocalRing.isUnit_or_isUnit_one_sub_self x, IsLocalRing.of_isUnit_or_isUnit_one_sub_self⟩
- id: local_of_one_plus_maximal_units
  kind: gap
  level: 3
  topic: 可換環論・局所環
  statement: $R$を可換環、$M$を$R$の極大イデアルとし、すべての$a\in M$で$1+a$が単元であるとする。$R$は局所環で、$M$は$R$の非単元全体に等しい。
  statement_en: If M is a maximal ideal of a commutative ring R and 1 + a is a unit for every a in M, then R is local and M is exactly the set of nonunits.
  assumptions:
  - $R$は可換環
  - $M$は$R$の極大イデアル
  - すべての$a\in M$で$1+a$は単元
  quantifiers:
  - 任意の可換環$R$と極大イデアル$M$
  conclusion: $R$は局所環で、$x$が非単元であることと$x\in M$は同値である。
  answer: |
    $R$を可換環、$M$を極大イデアルとし、すべての$a\in M$で$1+a$が単元であるとする。$M$は真のイデアルなので、その元は単元でない。
    $x\notin M$とする。極大性から$M+(x)=R$なので、$xy+a=1$となる$y\in R$、$a\in M$がある。$xy=1+(-a)$であり、$-a\in M$なのでこれは単元である。よって$x$は単元である。したがって非単元全体は$M$に一致する。
    $N$を極大イデアルとすると、$N$の元は非単元なので$N\subseteq M$であり、極大性から$N=M$である。よって$R$は局所環である。
  strategy: Show every element outside M is a unit by comaximality with M.
  sketch:
  - 'derive: Elements of the proper ideal M are nonunits.'
  - 'setup: For x outside M, maximality gives xy + a = 1 with a in M.'
  - 'derive: Then xy = 1 + (-a) is a unit, so x is a unit.'
  - 'derive: Every maximal ideal consists of nonunits and hence lies in M.'
  - 'conclude: M is the unique maximal ideal and equals the set of nonunits.'
  openmath: (forall (A m) (-> (and (comm_ring A) (maximal_ideal m A) (forall (a) (-> (in a m) (unit_element (+ 1 a) A)))) (and (local_ring A) (forall (x) (-> (in x A) (<-> (not (unit_element x A)) (in x m)))))))
  hard_negative:
    statement: 可換環の真のイデアル$M$の各元$a$で$1+a$が単元なら、$R$は局所環である。
    reason: $\mathbb{Z}$で$M=0$とすると条件をみたすが、$\mathbb{Z}$は局所環でない。$M$の極大性が必要である。
  target: |
    ∀ (R : Type*) [CommRing R] (M : Ideal R), M.IsMaximal → (∀ a ∈ M, IsUnit (1 + a)) → IsLocalRing R ∧ ∀ x : R, ¬ IsUnit x ↔ x ∈ M
  proof: |
    by
      intro R _ M hM h
      have key : ∀ x : R, ¬ IsUnit x ↔ x ∈ M := by
        intro x
        constructor
        · intro hx
          by_contra hxM
          obtain ⟨y, a, ha, hya⟩ := hM.exists_inv hxM
          apply hx
          have : IsUnit (x * y) := by
            have h2 := h (-a) (M.neg_mem ha)
            have : x * y = 1 + -a := by rw [← hya]; ring
            rw [this]; exact h2
          exact isUnit_of_mul_isUnit_left this
        · intro hx hu
          exact hM.ne_top (Ideal.eq_top_of_isUnit_mem _ hx hu)
      have : Nontrivial R := nontrivial_of_ne (0 : R) 1 (fun e => hM.ne_top ((Ideal.eq_top_iff_one M).mpr (e ▸ M.zero_mem)))
      refine ⟨IsLocalRing.of_nonunits_add fun a b ha hb => ?_, key⟩
      exact (key _).mpr (M.add_mem ((key a).mp ha) ((key b).mp hb))
- id: local_ring_idempotents_trivial
  kind: gap
  level: 3
  topic: 可換環論・局所環
  statement: $R$を可換局所環、$e\in R$を$e^2=e$をみたす元とする。$e=0$または$e=1$である。
  statement_en: An idempotent e of a commutative local ring is 0 or 1.
  assumptions:
  - $R$は可換局所環
  - $e\in R$で$e^2=e$
  quantifiers:
  - 任意の可換局所環$R$と冪等元$e$
  conclusion: $e=0$または$e=1$である。
  answer: |
    $R$を可換局所環、$M$をその極大イデアル、$e^2=e$とする。$e(1-e)=e-e^2=0$である。$e$と$1-e$がともに非単元なら、どちらも$M$に属し、$1=e+(1-e)\in M$となって矛盾する。よって$e$または$1-e$は単元である。
    $e$が単元なら、$e(1-e)=0$から$1-e=0$、すなわち$e=1$である。$1-e$が単元なら、同じ等式から$e=0$である。
  strategy: One of e and 1 - e is a unit, and their product vanishes.
  sketch:
  - 'derive: The product e(1 - e) is zero.'
  - 'derive: In a local ring e and 1 - e cannot both be nonunits.'
  - 'case_split: Cancel the unit factor in each case.'
  - 'conclude: So e = 1 or e = 0.'
  openmath: (forall (A e) (-> (and (comm_ring A) (local_ring A) (in e A) (= (* e e) e)) (or (= e 0) (= e 1))))
  hard_negative:
    statement: 任意の可換環の冪等元は$0$または$1$である。
    reason: $\mathbb{Z}/6\mathbb{Z}$では$3^2=3$である。この環は局所環でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsLocalRing R] (e : R), e * e = e → e = 0 ∨ e = 1
  proof: |
    by
      intro R _ _ e he
      have h0 : e * (1 - e) = 0 := by rw [mul_sub, mul_one, he, sub_self]
      rcases IsLocalRing.isUnit_or_isUnit_one_sub_self e with h | h
      · right
        have := h.mul_right_eq_zero.mp h0
        exact (sub_eq_zero.mp this).symm
      · left
        exact h.mul_left_eq_zero.mp h0
- id: localization_universal_property
  kind: textbook
  level: 3
  topic: 可換環論・局所化の普遍性
  statement: $R,S,T$を可換環、$M$を$R$の乗法的部分モノイド、$S$を$R$の$M$での局所化、$\varphi:R\to S$を標準写像とする。環準同型$g:R\to T$が$M$の元をすべて単元へ移すなら、$h\circ\varphi=g$をみたす環準同型$h:S\to T$がただ1つ存在する。
  statement_en: Let S be the localization of a commutative ring R at a submonoid M, with canonical map φ. Every ring homomorphism g from R to a commutative ring T sending M into the units of T factors uniquely as g = h ∘ φ with a ring homomorphism h from S to T.
  assumptions:
  - $R,S,T$は可換環
  - $M$は$R$の乗法的部分モノイド
  - $S$は$R$の$M$での局所化で、$\varphi:R\to S$は標準写像
  - $g:R\to T$は環準同型で、$g(M)$は$T$の単元からなる
  quantifiers:
  - 任意の$R,S,T,M,g$
  conclusion: $h\circ\varphi=g$をみたす環準同型$h:S\to T$がただ1つ存在する。
  answer: |
    $R,S,T$を可換環、$M$を$R$の乗法的部分モノイド、$S$を$R$の$M$での局所化、$\varphi:R\to S$を標準写像、$g:R\to T$を$g(M)$が単元からなる環準同型とする。局所化の性質として、$\varphi(M)$は単元からなり、$S$の元は$\varphi(a)\varphi(s)^{-1}$($a\in R$、$s\in M$)と書け、$\varphi(x)=\varphi(y)$は$ux=uy$となる$u\in M$の存在と同値である。
    $h(\varphi(a)\varphi(s)^{-1})=g(a)g(s)^{-1}$と定める。$\varphi(a)\varphi(s)^{-1}=\varphi(b)\varphi(t)^{-1}$なら$\varphi(ta)=\varphi(sb)$なので、$uta=usb$となる$u\in M$がある。$g(u)$は単元なので$g(t)g(a)=g(s)g(b)$であり、$g(a)g(s)^{-1}=g(b)g(t)^{-1}$である。よって$h$は定義できる。和は$\varphi(a)\varphi(s)^{-1}+\varphi(b)\varphi(t)^{-1}=\varphi(ta+sb)\varphi(st)^{-1}$なので、$h$の値は$g(ta+sb)g(st)^{-1}=g(a)g(s)^{-1}+g(b)g(t)^{-1}$である。積も同様に保たれ、$h(1)=1$なので$h$は環準同型である。$s=1$ととれば$h\circ\varphi=g$である。
    $h'$も条件をみたすとする。$h'(\varphi(s))=g(s)$なので$h'(\varphi(s)^{-1})=g(s)^{-1}$であり、$h'(\varphi(a)\varphi(s)^{-1})=g(a)g(s)^{-1}$となる。よって$h'=h$である。
  strategy: Define the map on fractions, use a common multiplier in M for well-definedness, and read off uniqueness from inverses.
  sketch:
  - 'construct: Set h of a/s to be g(a) g(s)^(-1).'
  - 'derive: If a/s = b/t then uta = usb for some u in M, and g(u) is a unit, so the values agree.'
  - 'derive: Sums and products are checked over common denominators.'
  - 'derive: Any h with h ∘ φ = g sends φ(s)^(-1) to g(s)^(-1).'
  - 'conclude: So h exists and is unique.'
  openmath: (forall (A B T M g) (-> (and (comm_ring A) (comm_ring B) (comm_ring T) (submonoid_of M A) (localization_of B A M) (ring_hom g A T) (forall (y) (-> (in y M) (unit_element (fn_value g y) T)))) (exists (h) (and (ring_hom h B T) (forall (x) (-> (in x A) (= (fn_value h (fn_value (algebra_map A B) x)) (fn_value g x)))) (forall (k) (-> (and (ring_hom k B T) (forall (x) (-> (in x A) (= (fn_value k (fn_value (algebra_map A B) x)) (fn_value g x))))) (= k h)))))))
  hard_negative:
    statement: 任意の環準同型$g:R\to T$は局所化$S$を経由する。
    reason: $g(M)$が単元からなる必要がある。$\mathbb{Z}$の恒等写像は$\mathbb{Q}=(\mathbb{Z}\setminus\{0\})^{-1}\mathbb{Z}$を経由しない。
  target: |
    ∀ (R S T : Type*) [CommRing R] [CommRing S] [CommRing T] [Algebra R S] (M : Submonoid R) [IsLocalization M S] (g : R →+* T), (∀ y : M, IsUnit (g y)) → ∃! h : S →+* T, ∀ x, h (algebraMap R S x) = g x
  proof: |
    by
      intro R S T _ _ _ _ M _ g hg
      refine ⟨IsLocalization.lift hg, IsLocalization.lift_eq hg, fun h' hh' => ?_⟩
      exact (IsLocalization.lift_unique hg hh').symm
- id: localization_map_injective_iff
  kind: gap
  level: 3
  topic: 可換環論・局所化
  statement: $R,S$を可換環、$M$を$R$の乗法的部分モノイド、$S$を$R$の$M$での局所化、$\varphi:R\to S$を標準写像とする。$\varphi$が単射であることと、すべての$m\in M$、$y\in R$について$my=0$なら$y=0$であることは同値である。
  statement_en: The canonical map from a commutative ring R to its localization at a submonoid M is injective if and only if no element of M kills a nonzero element of R.
  assumptions:
  - $R,S$は可換環
  - $M$は$R$の乗法的部分モノイド
  - $S$は$R$の$M$での局所化で、$\varphi:R\to S$は標準写像
  quantifiers:
  - 任意の$R,S,M$
  conclusion: $\varphi$が単射であることと、すべての$m\in M$、$y\in R$で$my=0$なら$y=0$であることは同値である。
  answer: |
    $R,S$を可換環、$M$を$R$の乗法的部分モノイド、$S$を$R$の$M$での局所化、$\varphi:R\to S$を標準写像とする。$\varphi(M)$は単元からなり、$\varphi(y)=0$は$uy=0$となる$u\in M$の存在と同値である。
    $\varphi$が単射で、$m\in M$、$my=0$とする。$\varphi(m)\varphi(y)=0$で$\varphi(m)$は単元なので$\varphi(y)=0$であり、単射性から$y=0$である。
    逆に、$M$の元がどれも零でない元を消さないとする。$\varphi(y)=0$なら$uy=0$となる$u\in M$があるので、$y=0$である。よって$\varphi$は単射である。
  strategy: Use the description of the kernel of the localization map through annihilation by M.
  sketch:
  - 'translate: φ(y) = 0 holds exactly when uy = 0 for some u in M.'
  - 'derive: If φ is injective and my = 0, then φ(y) = 0 because φ(m) is a unit, so y = 0.'
  - 'derive: Conversely, the kernel description gives y = 0 from φ(y) = 0.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (A B M) (-> (and (comm_ring A) (comm_ring B) (submonoid_of M A) (localization_of B A M)) (<-> (ring_hom_injective (algebra_map A B)) (forall (m y) (-> (and (in m M) (in y A) (= (* m y) 0)) (= y 0))))))
  hard_negative:
    statement: 局所化の標準写像はつねに単射である。
    reason: $\mathbb{Z}/6\mathbb{Z}$を$M=\{1,2,4\}$で局所化すると、$2\cdot 3=0$より$3$の像は$0$である。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] (M : Submonoid R) [IsLocalization M S], Function.Injective (algebraMap R S) ↔ ∀ m ∈ M, ∀ y : R, m * y = 0 → y = 0
  proof: |
    by
      intro R S _ _ _ M _
      constructor
      · intro hinj m hm y hy
        have hu : IsUnit (algebraMap R S m) := IsLocalization.map_units S (⟨m, hm⟩ : M)
        apply hinj
        rw [map_zero]
        have : algebraMap R S m * algebraMap R S y = 0 := by rw [← map_mul, hy, map_zero]
        exact hu.mul_right_eq_zero.mp this
      · intro h
        refine IsLocalization.injective S (M := M) fun m hm => mem_nonZeroDivisors_iff_right.mpr ?_
        intro y hy
        exact h m hm y (by rw [mul_comm]; exact hy)
- id: localization_ideals_are_extended
  kind: gap
  level: 3
  topic: 可換環論・局所化のイデアル
  statement: $R,S$を可換環、$M$を$R$の乗法的部分モノイド、$S$を$R$の$M$での局所化、$\varphi:R\to S$を標準写像、$J$を$S$のイデアルとする。$\varphi^{-1}(J)$の$\varphi$による像で生成される$S$のイデアルは$J$に等しい。
  statement_en: Every ideal J of a localization S of R is extended from R, that is, the ideal generated by the image of the contraction of J equals J.
  assumptions:
  - $R,S$は可換環
  - $M$は$R$の乗法的部分モノイド
  - $S$は$R$の$M$での局所化で、$\varphi:R\to S$は標準写像
  - $J$は$S$のイデアル
  quantifiers:
  - 任意の$R,S,M,J$
  conclusion: $\varphi(\varphi^{-1}(J))$で生成されるイデアルは$J$である。
  answer: |
    $R,S$を可換環、$M$を$R$の乗法的部分モノイド、$S$を局所化、$\varphi:R\to S$を標準写像、$J$を$S$のイデアルとする。$J'$を$\varphi(\varphi^{-1}(J))$で生成されるイデアルとする。$\varphi(\varphi^{-1}(J))\subseteq J$なので$J'\subseteq J$である。
    逆に$y\in J$とする。$y=\varphi(a)\varphi(s)^{-1}$($a\in R$、$s\in M$)と書ける。$\varphi(a)=\varphi(s)y\in J$なので$a\in\varphi^{-1}(J)$である。よって$y=\varphi(s)^{-1}\varphi(a)\in J'$であり、$J=J'$を得る。
  strategy: Clear the denominator of an element of J to find a numerator in the contraction.
  sketch:
  - 'derive: The image of the contraction lies in J, which gives one inclusion.'
  - 'setup: Write y in J as φ(a) φ(s)^(-1).'
  - 'derive: Then φ(a) = φ(s) y lies in J, so a lies in the contraction.'
  - 'conclude: Hence y lies in the extended ideal.'
  openmath: (forall (A B M J) (-> (and (comm_ring A) (comm_ring B) (submonoid_of M A) (localization_of B A M) (ideal_of J B)) (= (ideal_map (algebra_map A B) (ideal_comap (algebra_map A B) J)) J)))
  hard_negative:
    statement: $R$のイデアル$I$について、$IS$の$\varphi$による逆像はつねに$I$である。
    reason: $\mathbb{Z}$を$M=\{2^n\}$で局所化し$I=(2)$とすると、$IS=S$で逆像は$\mathbb{Z}$である。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] (M : Submonoid R) [IsLocalization M S] (J : Ideal S), (J.comap (algebraMap R S)).map (algebraMap R S) = J
  proof: |
    by
      intro R S _ _ _ M _ J
      exact IsLocalization.map_under M S J
- id: localization_extends_disjoint_prime
  kind: gap
  level: 4
  topic: 可換環論・局所化の素イデアル
  statement: $R,S$を可換環、$M$を$R$の乗法的部分モノイド、$S$を$R$の$M$での局所化、$\varphi:R\to S$を標準写像、$P$を$M$と交わらない$R$の素イデアルとする。$PS$は$S$の素イデアルであり、$\varphi^{-1}(PS)=P$である。
  statement_en: If P is a prime ideal of R disjoint from a submonoid M and S is the localization of R at M with canonical map φ, then the extension PS is prime and its contraction along φ is P.
  assumptions:
  - $R,S$は可換環
  - $M$は$R$の乗法的部分モノイド
  - $S$は$R$の$M$での局所化で、$\varphi:R\to S$は標準写像
  - $P$は$R$の素イデアルで$P\cap M=\emptyset$
  - $PS$は$\varphi(P)$で生成される$S$のイデアル
  quantifiers:
  - 任意の$R,S,M,P$
  conclusion: $PS$は素イデアルで、$\varphi^{-1}(PS)=P$である。
  answer: |
    $R,S$を可換環、$M$を乗法的部分モノイド、$S$を局所化、$\varphi:R\to S$を標準写像、$P$を$P\cap M=\emptyset$をみたす素イデアルとする。$PS$の元は$\varphi(P)$の元の$S$係数の有限和なので、通分すると$\varphi(a)\varphi(s)^{-1}$($a\in P$、$s\in M$)と書ける。
    $\varphi(x)\in PS$とする。$\varphi(x)=\varphi(a)\varphi(s)^{-1}$と書くと$\varphi(sx)=\varphi(a)$なので、$usx=ua\in P$となる$u\in M$がある。$us\in M$は$P$に属さないので$x\in P$である。$P\subseteq\varphi^{-1}(PS)$は明らかなので、$\varphi^{-1}(PS)=P$である。
    $1\in PS$なら$1\in\varphi^{-1}(PS)=P$となるので、$PS$は真のイデアルである。$\varphi(a)\varphi(s)^{-1}\cdot\varphi(b)\varphi(t)^{-1}\in PS$とする。$\varphi(s)\varphi(t)$をかけると$\varphi(ab)\in PS$なので$ab\in P$であり、$a\in P$または$b\in P$である。よって2つの因子のどちらかが$PS$に属し、$PS$は素イデアルである。
  strategy: Compute the contraction by clearing denominators with M, then transfer primality.
  sketch:
  - 'setup: Elements of PS have the form φ(a) φ(s)^(-1) with a in P.'
  - 'derive: If φ(x) lies in PS, then usx lies in P for some u in M, so x lies in P.'
  - 'derive: Hence the contraction equals P, and PS is proper.'
  - 'derive: A product of two fractions in PS has numerator product in P.'
  - 'conclude: Primality of P gives primality of PS.'
  openmath: (forall (A B M p) (-> (and (comm_ring A) (comm_ring B) (submonoid_of M A) (localization_of B A M) (prime_ideal p A) (= (inter p M) emptyset)) (and (prime_ideal (ideal_map (algebra_map A B) p) B) (= (ideal_comap (algebra_map A B) (ideal_map (algebra_map A B) p)) p))))
  hard_negative:
    statement: $R$の任意の素イデアル$P$について$PS$は素イデアルである。
    reason: $\mathbb{Z}$を$M=\{2^n\}$で局所化し$P=(2)$とすると、$PS=S$となり素イデアルでない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] (M : Submonoid R) [IsLocalization M S] (P : Ideal R), P.IsPrime → (∀ m ∈ M, m ∉ P) → (P.map (algebraMap R S)).IsPrime ∧ (P.map (algebraMap R S)).comap (algebraMap R S) = P
  proof: |
    by
      intro R S _ _ _ M _ P hP hd
      have hd' : Disjoint (M : Set R) (P : Set R) := Set.disjoint_left.mpr fun m hm hmP => hd m hm hmP
      refine ⟨IsLocalization.isPrime_of_isPrime_disjoint M S P hP hd', le_antisymm ?_ Ideal.le_comap_map⟩
      intro x hx
      obtain ⟨m, hm, hmx⟩ := (IsLocalization.algebraMap_mem_map_algebraMap_iff M S P x).mp hx
      exact (hP.mem_or_mem hmx).resolve_left (hd m hm)
- id: primes_of_localization_at_prime
  kind: gap
  level: 4
  topic: 可換環論・素イデアルでの局所化
  statement: $R,S$を可換環、$P,Q$を$R$の素イデアル、$S$を$R$の$P$での局所化、$\varphi:R\to S$を標準写像とする。$Q\subseteq P$であることと、$\varphi^{-1}(J)=Q$となる$S$の素イデアル$J$が存在することは同値である。
  statement_en: Let S be the localization of a commutative ring R at a prime ideal P, with canonical map φ. A prime ideal Q of R is contained in P if and only if Q is the contraction of some prime ideal of S.
  assumptions:
  - $R,S$は可換環
  - $P,Q$は$R$の素イデアル
  - $S$は$R$の$P$での局所化で、$\varphi:R\to S$は標準写像
  quantifiers:
  - 任意の$R,S,P,Q$
  conclusion: $Q\subseteq P$であることと、$\varphi^{-1}(J)=Q$となる素イデアル$J\subseteq S$の存在は同値である。
  answer: |
    $R,S$を可換環、$P,Q$を$R$の素イデアル、$S$を$R$の$P$での局所化、$\varphi:R\to S$を標準写像とする。$M=R\setminus P$とおくと、$\varphi(M)$は単元からなり、$S$の元は$\varphi(a)\varphi(s)^{-1}$($s\in M$)と書ける。
    $Q\subseteq P$とし、$J$を$\varphi(Q)$で生成されるイデアルとする。$J$の元は$\varphi(Q)$の元の$S$係数の有限和なので、通分すると$\varphi(a)\varphi(s)^{-1}$($a\in Q$、$s\in M$)と書ける。$\varphi(x)=\varphi(a)\varphi(s)^{-1}$なら$\varphi(sx)=\varphi(a)$なので、$usx=ua\in Q$となる$u\in M$がある。$us\notin P$なので$us\notin Q$であり、$x\in Q$である。$Q\subseteq\varphi^{-1}(J)$は明らかなので、$\varphi^{-1}(J)=Q$である。$1\notin Q$なので$J$は真のイデアルである。$\varphi(a)\varphi(s)^{-1}\cdot\varphi(b)\varphi(t)^{-1}\in J$なら$\varphi(ab)\in J$なので$ab\in Q$となり、$a\in Q$または$b\in Q$である。よって2つの因子のどちらかが$J$に属し、$J$は素イデアルである。
    逆に$J$を$S$の素イデアルとし、$Q=\varphi^{-1}(J)$とする。$x\in Q$かつ$x\notin P$なら、$\varphi(x)$は$J$に属する単元となり、$J$が真のイデアルであることに反する。よって$Q\subseteq P$である。
  strategy: Extend Q to S when it avoids the complement of P, and use units for the converse.
  sketch:
  - 'setup: Put M = R \ P, so φ(M) consists of units.'
  - 'construct: For Q inside P let J be the extension of Q to S.'
  - 'derive: Clearing denominators shows the contraction of J is Q and that J is prime.'
  - 'derive: Conversely an element of the contraction outside P would make J contain a unit.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (A B p q) (-> (and (comm_ring A) (comm_ring B) (prime_ideal p A) (localization_at_prime B A p) (prime_ideal q A)) (<-> (subset q p) (exists (J) (and (prime_ideal J B) (= (ideal_comap (algebra_map A B) J) q))))))
  hard_negative:
    statement: $R$の任意の素イデアル$Q$は、$R$の$P$での局所化の素イデアルの逆像である。
    reason: $\mathbb{Z}$で$P=(2)$、$Q=(3)$とすると、$3$は局所化で単元になるので、逆像が$(3)$となる素イデアルはない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] (P Q : Ideal R) [P.IsPrime] [IsLocalization.AtPrime S P], Q.IsPrime → (Q ≤ P ↔ ∃ J : Ideal S, J.IsPrime ∧ J.comap (algebraMap R S) = Q)
  proof: |
    by
      intro R S _ _ _ P Q _ _ hQ
      constructor
      · intro hle
        have hd : Disjoint (P.primeCompl : Set R) (Q : Set R) := Set.disjoint_left.mpr fun m hm hmQ => hm (hle hmQ)
        refine ⟨Q.map (algebraMap R S), IsLocalization.isPrime_of_isPrime_disjoint P.primeCompl S Q hQ hd, le_antisymm ?_ Ideal.le_comap_map⟩
        intro x hx
        obtain ⟨m, hm, hmx⟩ := (IsLocalization.algebraMap_mem_map_algebraMap_iff P.primeCompl S Q x).mp hx
        exact (hQ.mem_or_mem hmx).resolve_left fun h => hm (hle h)
      · rintro ⟨J, hJ, rfl⟩ x hx
        by_contra hxP
        have hu : IsUnit (algebraMap R S x) := IsLocalization.map_units S (⟨x, hxP⟩ : P.primeCompl)
        exact hJ.ne_top (Ideal.eq_top_of_isUnit_mem _ hx hu)
- id: ideal_inclusion_checked_at_maximal_ideals
  kind: gap
  level: 4
  topic: 可換環論・局所的性質
  statement: $R$を可換環、$I,J$を$R$のイデアルとする。$I\subseteq J$であることと、$R$のすべての極大イデアル$P$について局所化$R_P$で$IR_P\subseteq JR_P$であることは同値である。
  statement_en: For ideals I and J of a commutative ring R, one has I ⊆ J if and only if IR_P ⊆ JR_P in the localization R_P for every maximal ideal P of R.
  assumptions:
  - $R$は可換環
  - $I,J$は$R$のイデアル
  - $P$は$R$の極大イデアルを動く
  quantifiers:
  - 任意の可換環$R$とイデアル$I,J$
  conclusion: $I\subseteq J$は、すべての極大イデアル$P$で$IR_P\subseteq JR_P$であることと同値である。
  answer: |
    $R$を可換環、$I,J$をイデアルとする。$I\subseteq J$なら、生成元の包含からすべての$P$で$IR_P\subseteq JR_P$である。
    逆に、すべての極大イデアル$P$で$IR_P\subseteq JR_P$とする。$x\in I$をとり、$D=\{r\in R\mid rx\in J\}$とおく。$D$はイデアルである。$D\neq R$と仮定すると、$D$を含む極大イデアル$P$がある。$\varphi:R\to R_P$を標準写像とする。$\varphi(x)\in IR_P\subseteq JR_P$なので、通分すると$\varphi(x)=\varphi(b)\varphi(s)^{-1}$($b\in J$、$s\notin P$)と書ける。$\varphi(sx)=\varphi(b)$より、$usx=ub$となる$u\notin P$がある。$ub\in J$なので$us\in D\subseteq P$である。ところが$P$は素イデアルで$u,s\notin P$なので、$us\notin P$である。これは矛盾である。よって$1\in D$であり、$x\in J$である。
  strategy: Study the ideal of multipliers taking x into J and show no maximal ideal contains it.
  sketch:
  - 'derive: The forward direction follows by extending generators.'
  - 'setup: For x in I let D be the ideal of r with rx in J.'
  - 'contradiction: If D lies in a maximal ideal P, the inclusion in R_P gives usx = ub with u and s outside P.'
  - 'derive: Then us lies in D but outside P.'
  - 'conclude: So 1 lies in D and x lies in J.'
  openmath: (forall (A I J) (-> (and (comm_ring A) (ideal_of I A) (ideal_of J A)) (<-> (subset I J) (forall (p B) (-> (and (maximal_ideal p A) (comm_ring B) (localization_at_prime B A p)) (subset (ideal_map (algebra_map A B) I) (ideal_map (algebra_map A B) J)))))))
  hard_negative:
    statement: ある1つの極大イデアル$P$で$IR_P\subseteq JR_P$なら$I\subseteq J$である。
    reason: $\mathbb{Z}$で$I=(2)$、$J=(3)$、$P=(5)$とすると、$2,3$は$R_P$で単元なので両辺は$R_P$だが、$I\not\subseteq J$である。
  target: |
    ∀ (R : Type*) [CommRing R] (I J : Ideal R), I ≤ J ↔ ∀ (P : Ideal R) (_ : P.IsMaximal), I.map (algebraMap R (Localization.AtPrime P)) ≤ J.map (algebraMap R (Localization.AtPrime P))
  proof: |
    by
      intro R _ I J
      exact ⟨fun h P _ => Ideal.map_mono h, Ideal.le_of_localization_maximal⟩
- id: domain_is_intersection_of_maximal_localizations
  kind: gap
  level: 4
  topic: 可換環論・整域の局所化
  statement: $R$を整域、$K$をその分数体、$\varphi:R\to K$を標準写像、$x\in K$とする。$R$のすべての極大イデアル$P$について、$\varphi(s)x=\varphi(a)$をみたす$a\in R$と$s\in R\setminus P$があるなら、$x\in\varphi(R)$である。
  statement_en: Let R be an integral domain with fraction field K and canonical map φ. If x in K can be written with φ(s) x = φ(a), a in R and s outside P, for every maximal ideal P of R, then x lies in φ(R).
  assumptions:
  - $R$は整域で、$K$はその分数体
  - $\varphi:R\to K$は標準写像
  - $x\in K$
  - すべての極大イデアル$P$で、$\varphi(s)x=\varphi(a)$となる$a\in R$、$s\notin P$がある
  quantifiers:
  - 任意の整域$R$、分数体$K$、$x\in K$
  conclusion: $x=\varphi(r)$となる$r\in R$が存在する。
  answer: |
    $R$を整域、$K$を分数体、$\varphi:R\to K$を標準写像、$x\in K$とし、すべての極大イデアル$P$について$\varphi(s)x=\varphi(a)$となる$a\in R$、$s\notin P$があるとする。$D=\{s\in R\mid\varphi(s)x\in\varphi(R)\}$とおく。$D$は$R$のイデアルである。
    $D\neq R$と仮定すると、$D$を含む極大イデアル$P$がある。仮定から$\varphi(s)x=\varphi(a)$となる$s\notin P$があるが、$s\in D\subseteq P$となって矛盾する。よって$1\in D$であり、$x=\varphi(1)x\in\varphi(R)$である。
  strategy: Consider the ideal of denominators of x and show it is not contained in any maximal ideal.
  sketch:
  - 'setup: Let D be the ideal of all s with φ(s) x in φ(R).'
  - 'contradiction: If D were proper it would lie in a maximal ideal P, against the denominator s outside P.'
  - 'derive: Therefore 1 lies in D.'
  - 'conclude: So x lies in φ(R).'
  openmath: (forall (A K x) (-> (and (integral_domain A) (fraction_field_of K A) (in x K) (forall (p) (-> (maximal_ideal p A) (exists (a s) (and (in a A) (in s A) (notin s p) (= (* (fn_value (fraction_embedding A K) s) x) (fn_value (fraction_embedding A K) a))))))) (exists (r) (and (in r A) (= (fn_value (fraction_embedding A K) r) x)))))
  hard_negative:
    statement: 1つの極大イデアル$P$で$\varphi(s)x=\varphi(a)$($s\notin P$)と書けるなら$x\in\varphi(R)$である。
    reason: $\mathbb{Z}$で$x=1/3$、$P=(2)$とすると、$s=3$で条件をみたすが、$x$は整数でない。
  target: |
    ∀ (R K : Type*) [CommRing R] [IsDomain R] [Field K] [Algebra R K] [IsFractionRing R K] (x : K), (∀ (P : Ideal R) (_ : P.IsMaximal), ∃ a s : R, s ∉ P ∧ algebraMap R K s * x = algebraMap R K a) → ∃ r : R, algebraMap R K r = x
  proof: |
    by
      intro R K _ _ _ _ _ x h
      let D : Ideal R := (LinearMap.range (Algebra.linearMap R K)).colon ({x} : Set K)
      have hmem : ∀ s : R, s ∈ D ↔ ∃ a : R, algebraMap R K a = algebraMap R K s * x := by
        intro s
        simp [D, Submodule.mem_colon_singleton, Algebra.smul_def]
      have hD : D = ⊤ := by
        by_contra hne
        obtain ⟨P, hP, hle⟩ := Ideal.exists_le_maximal D hne
        obtain ⟨a, s, hs, hsa⟩ := h P hP
        exact hs (hle ((hmem s).mpr ⟨a, hsa.symm⟩))
      obtain ⟨a, ha⟩ := (hmem 1).mp (hD ▸ Submodule.mem_top)
      exact ⟨a, by simpa using ha⟩
- id: spectrum_zero_locus_eq_iff_radical_eq
  kind: gap
  level: 3
  topic: 可換環論・素スペクトラム
  statement: $R$を可換環、$I,J$を$R$のイデアルとする。素スペクトラム上の閉集合について、$V(I)=V(J)$であることと$\sqrt{I}=\sqrt{J}$であることは同値である。
  statement_en: For ideals I and J of a commutative ring, the closed subsets V(I) and V(J) of the prime spectrum coincide if and only if the radicals of I and J coincide.
  assumptions:
  - $R$は可換環
  - $I,J$は$R$のイデアル
  - $V(I)$は$I$を含む素イデアル全体
  quantifiers:
  - 任意の可換環$R$とイデアル$I,J$
  conclusion: $V(I)=V(J)$と$\sqrt{I}=\sqrt{J}$は同値である。
  answer: |
    $R$を可換環、$I,J$をイデアルとし、$V(I)$を$I$を含む素イデアル全体とする。素イデアル$P$について、$I\subseteq P$と$\sqrt{I}\subseteq P$は同値である。実際、$x^n\in I\subseteq P$なら$x\in P$である。よって$V(I)=V(\sqrt{I})$であり、$\sqrt{I}=\sqrt{J}$なら$V(I)=V(J)$である。
    イデアルの根基は、それを含む素イデアル全体の共通部分に等しい。これは標準的な事実である。すなわち$\sqrt{I}=\bigcap_{P\in V(I)}P$である。したがって$V(I)=V(J)$なら$\sqrt{I}=\sqrt{J}$である。
  strategy: Use that a prime contains an ideal exactly when it contains its radical, and that the radical is the intersection of the primes containing the ideal.
  sketch:
  - 'derive: A prime contains I if and only if it contains rad(I), so V(I) = V(rad(I)).'
  - 'apply_theorem: The radical of I is the intersection of all primes in V(I).'
  - 'conclude: Hence V(I) and rad(I) determine each other.'
  openmath: (forall (A I J) (-> (and (comm_ring A) (ideal_of I A) (ideal_of J A)) (<-> (= (spectrum_zero_locus I) (spectrum_zero_locus J)) (= (ideal_radical I) (ideal_radical J)))))
  hard_negative:
    statement: $V(I)=V(J)$なら$I=J$である。
    reason: $\mathbb{Z}$で$(2)$と$(4)$はどちらも$V=\{(2)\}$だが、イデアルとして異なる。
  target: |
    ∀ (R : Type*) [CommRing R] (I J : Ideal R), PrimeSpectrum.zeroLocus (I : Set R) = PrimeSpectrum.zeroLocus (J : Set R) ↔ I.radical = J.radical
  proof: |
    by
      intro R _ I J
      exact PrimeSpectrum.zeroLocus_eq_iff
- id: basic_open_empty_iff_nilpotent
  kind: gap
  level: 3
  topic: 可換環論・素スペクトラム
  statement: $R$を可換環、$f\in R$とする。$f$を含まない素イデアル全体を$D(f)$と書くと、$D(f)=\emptyset$であることと$f$が冪零であることは同値である。
  statement_en: For an element f of a commutative ring, the basic open set D(f) of primes not containing f is empty if and only if f is nilpotent.
  assumptions:
  - $R$は可換環
  - $f\in R$
  - $D(f)$は$f$を含まない素イデアル全体
  quantifiers:
  - 任意の可換環$R$と$f\in R$
  conclusion: $D(f)=\emptyset$と、$f$が冪零であることは同値である。
  answer: |
    $R$を可換環、$f\in R$とし、$D(f)$を$f$を含まない素イデアル全体とする。$D(f)=\emptyset$は、$f$がすべての素イデアルに属することと同値である。
    $f^n=0$なら、任意の素イデアル$P$で$f^n\in P$なので$f\in P$である。逆に、$f$が冪零でないとする。$T=\{f^n\mid n\geq 0\}$は$1$を含み積で閉じ、$0$を含まない。零イデアルは$T$と交わらないので、$T$と交わらない素イデアル$P$が存在する。これは、部分モノイドと交わらないイデアルを極大にとると素イデアルになるという標準的な事実による。$f\notin P$なので$P\in D(f)$である。
  strategy: Empty D(f) means f lies in every prime; separate a non-nilpotent f from a prime using its powers.
  sketch:
  - 'translate: D(f) is empty exactly when f lies in every prime ideal.'
  - 'derive: A nilpotent element lies in every prime.'
  - 'setup: If f is not nilpotent, its powers form a submonoid not containing 0.'
  - 'apply_theorem: Some prime is disjoint from that submonoid.'
  - 'conclude: That prime lies in D(f).'
  openmath: (forall (A f) (-> (and (comm_ring A) (in f A)) (<-> (= (basic_open f) emptyset) (nilpotent_element f A))))
  hard_negative:
    statement: $D(f)=\emptyset$なら$f=0$である。
    reason: $\mathbb{Z}/4\mathbb{Z}$で$f=2$とすると、唯一の素イデアル$(2)$が$f$を含むので$D(f)=\emptyset$だが、$f\neq 0$である。
  target: |
    ∀ (R : Type*) [CommRing R] (f : R), PrimeSpectrum.basicOpen f = ⊥ ↔ IsNilpotent f
  proof: |
    by
      intro R _ f
      exact PrimeSpectrum.basicOpen_eq_bot_iff f
- id: basic_open_subset_iff_mem_radical
  kind: gap
  level: 3
  topic: 可換環論・素スペクトラム
  statement: $R$を可換環、$f,g\in R$とする。$f$を含まない素イデアル全体を$D(f)$と書くと、$D(f)\subseteq D(g)$であることと$f\in\sqrt{(g)}$は同値である。
  statement_en: For elements f and g of a commutative ring, D(f) ⊆ D(g) holds in the prime spectrum if and only if f lies in the radical of the principal ideal (g).
  assumptions:
  - $R$は可換環
  - $f,g\in R$
  - $D(f)$は$f$を含まない素イデアル全体
  quantifiers:
  - 任意の可換環$R$と$f,g\in R$
  conclusion: $D(f)\subseteq D(g)$と$f\in\sqrt{(g)}$は同値である。
  answer: |
    $R$を可換環、$f,g\in R$とし、$D(f)$を$f$を含まない素イデアル全体とする。対偶をとると、$D(f)\subseteq D(g)$は、$g$を含むすべての素イデアルが$f$を含むことと同値である。
    イデアルの根基は、それを含む素イデアル全体の共通部分に等しい。よって、$(g)$を含むすべての素イデアルが$f$を含むことは$f\in\sqrt{(g)}$と同値である。
  strategy: Rewrite the inclusion of complements and apply the description of the radical by primes.
  sketch:
  - 'translate: D(f) ⊆ D(g) says every prime containing g contains f.'
  - 'apply_theorem: The radical of (g) is the intersection of the primes containing g.'
  - 'conclude: This is the statement that f lies in that radical.'
  openmath: (forall (A f g) (-> (and (comm_ring A) (in f A) (in g A)) (<-> (subset (basic_open f) (basic_open g)) (in f (ideal_radical (principal_ideal g))))))
  hard_negative:
    statement: $D(f)\subseteq D(g)$なら$g$は$f$を割る。
    reason: $\mathbb{Z}$で$f=2$、$g=4$とすると$D(2)=D(4)$だが、$4$は$2$を割らない。
  target: |
    ∀ (R : Type*) [CommRing R] (f g : R), PrimeSpectrum.basicOpen f ≤ PrimeSpectrum.basicOpen g ↔ f ∈ (Ideal.span ({g} : Set R)).radical
  proof: |
    by
      intro R _ f g
      exact PrimeSpectrum.basicOpen_le_basicOpen_iff f g
- id: zero_locus_irreducible_iff_radical_prime
  kind: gap
  level: 4
  topic: 可換環論・素スペクトラムの既約性
  statement: $R$を可換環、$I$を$R$のイデアルとする。素スペクトラムの閉集合$V(I)$が既約であることと、$\sqrt{I}$が素イデアルであることは同値である。
  statement_en: For an ideal I of a commutative ring, the closed subset V(I) of the prime spectrum is irreducible if and only if the radical of I is a prime ideal.
  assumptions:
  - $R$は可換環
  - $I$は$R$のイデアル
  - $V(I)$は$I$を含む素イデアル全体
  quantifiers:
  - 任意の可換環$R$とイデアル$I$
  conclusion: $V(I)$が既約であることと$\sqrt{I}$が素イデアルであることは同値である。
  answer: |
    $R$を可換環、$I$をイデアルとする。部分集合が既約であるとは、空でなく、2つの閉集合の和に含まれるならその一方に含まれることである。閉集合は$V(E)$($E\subseteq R$)の形であり、$\sqrt{I}$は$V(I)$の元の共通部分に等しい。
    $\sqrt{I}$が素イデアルであるとする。$P=\sqrt{I}$は$V(I)$に属するので、$V(I)$は空でない。$V(I)\subseteq V(E)\cup V(E')$とする。$P$は$V(E)$または$V(E')$に属し、たとえば$E\subseteq P$である。$V(I)$の元はすべて$P$を含むので$E$を含み、$V(I)\subseteq V(E)$となる。
    逆に$V(I)$が既約であるとする。空でないので、$\sqrt{I}$は真のイデアルである。$xy\in\sqrt{I}$とすると、$V(I)$の各元は$xy$を含むので$x$または$y$を含み、$V(I)\subseteq V(\{x\})\cup V(\{y\})$である。既約性からたとえば$V(I)\subseteq V(\{x\})$であり、$x$は$V(I)$の元すべてに属するので$x\in\sqrt{I}$である。よって$\sqrt{I}$は素イデアルである。
  strategy: The radical is the generic point when prime, and primality follows from covering V(I) by V(x) and V(y).
  sketch:
  - 'setup: Irreducible means nonempty and not covered by two closed sets without lying in one of them.'
  - 'derive: If rad(I) is prime it is a point of V(I), and any closed set containing it contains V(I).'
  - 'derive: If V(I) is irreducible, then rad(I) is proper.'
  - 'derive: From xy in rad(I), V(I) lies in V(x) ∪ V(y), hence in one of them.'
  - 'conclude: So rad(I) is prime.'
  openmath: (forall (A I) (-> (and (comm_ring A) (ideal_of I A)) (<-> (irreducible_subset (spectrum_zero_locus I)) (prime_ideal (ideal_radical I) A))))
  hard_negative:
    statement: $V(I)$が連結なら$\sqrt{I}$は素イデアルである。
    reason: 体$k$上の$k[x,y]$で$I=(xy)$とすると、$V(I)$は連結だが、$\sqrt{I}=(xy)$は素イデアルでない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R), IsIrreducible (PrimeSpectrum.zeroLocus (I : Set R)) ↔ I.radical.IsPrime
  proof: |
    by
      intro R _ I
      exact PrimeSpectrum.isIrreducible_zeroLocus_iff I
- id: spectrum_point_closure_iff_le
  kind: gap
  level: 3
  topic: 可換環論・素スペクトラムの位相
  statement: $R$を可換環、$x,y$を$\operatorname{Spec}R$の点とし、対応する素イデアルを$P_x,P_y$とする。$y\in\overline{\{x\}}$であることと$P_x\subseteq P_y$は同値である。
  statement_en: For points x and y of Spec R with corresponding prime ideals P_x and P_y, the point y lies in the closure of {x} if and only if P_x ⊆ P_y.
  assumptions:
  - $R$は可換環
  - $x,y$は$\operatorname{Spec}R$の点で、$P_x,P_y$は対応する素イデアル
  quantifiers:
  - 任意の可換環$R$と点$x,y$
  conclusion: $y\in\overline{\{x\}}$と$P_x\subseteq P_y$は同値である。
  answer: |
    $R$を可換環、$x,y$を$\operatorname{Spec}R$の点、$P_x,P_y$を対応する素イデアルとする。閉集合は$V(E)=\{P\mid E\subseteq P\}$($E\subseteq R$)の形である。$x\in V(E)$は$E\subseteq P_x$と同値である。
    $\overline{\{x\}}$は$x$を含む閉集合すべての共通部分である。$E\subseteq P_x$なら$V(P_x)\subseteq V(E)$であり、$V(P_x)$自身も$x$を含む閉集合である。よって$\overline{\{x\}}=V(P_x)$である。したがって$y\in\overline{\{x\}}$は$P_x\subseteq P_y$と同値である。
  strategy: Identify the closure of a point with the zero locus of its prime ideal.
  sketch:
  - 'translate: A closed set V(E) contains x exactly when E lies in P_x.'
  - 'derive: Every such V(E) contains V(P_x), and V(P_x) is itself closed and contains x.'
  - 'derive: So the closure of {x} is V(P_x).'
  - 'conclude: Membership of y means P_x lies in P_y.'
  openmath: (forall (A x y) (-> (and (comm_ring A) (in x (prime_spectrum A)) (in y (prime_spectrum A))) (<-> (in y (set_closure (singleton_set x))) (subset (spectrum_point_ideal x) (spectrum_point_ideal y)))))
  hard_negative:
    statement: $\operatorname{Spec}R$の1点集合はつねに閉集合である。
    reason: $\operatorname{Spec}\mathbb{Z}$で$(0)$の閉包は全体であり、$\{(0)\}$は閉集合でない。
  target: |
    ∀ (R : Type*) [CommRing R] (x y : PrimeSpectrum R), y ∈ closure ({x} : Set (PrimeSpectrum R)) ↔ x.asIdeal ≤ y.asIdeal
  proof: |
    by
      intro R _ x y
      rw [PrimeSpectrum.closure_singleton, PrimeSpectrum.mem_zeroLocus]
      rfl
- id: integral_iff_adjoin_finite
  kind: textbook
  level: 3
  topic: 可換環論・整元
  statement: $R$を可換環、$A$を可換$R$代数、$x\in A$とする。$x$が$R$上整であることと、$R[x]$が有限生成$R$加群であることは同値である。
  statement_en: An element x of a commutative R-algebra A is integral over R if and only if the subalgebra R[x] is a finitely generated R-module.
  assumptions:
  - $R$は可換環
  - $A$は可換$R$代数
  - $x\in A$
  quantifiers:
  - 任意の可換環$R$、可換$R$代数$A$、$x\in A$
  conclusion: $x$が$R$上整であることと、$R[x]$が有限生成$R$加群であることは同値である。
  answer: |
    $R$を可換環、$A$を可換$R$代数、$x\in A$とする。
    $x$が$R$上整なら、$R$係数のモニック多項式で$x^n+a_{n-1}x^{n-1}+\cdots+a_0=0$と書ける。$x^n$は$1,x,\ldots,x^{n-1}$の$R$係数の線形結合である。この式に$x$をかけることを繰り返すと、$m\geq n$の$x^m$も同じ元の線形結合となる。よって$R[x]$は$1,x,\ldots,x^{n-1}$で生成される。
    逆に$R[x]$が$y_1,\ldots,y_k$で$R$加群として生成されるとする。$xy_i\in R[x]$なので、$a_{ij}\in R$により$xy_i=\sum_ja_{ij}y_j$と書ける。$A$上の行列$B=xE-(a_{ij})$は縦ベクトル$(y_j)_j$を$0$に移す。$B$の余因子行列を左からかけると、すべての$j$で$(\det B)y_j=0$となる。$1\in R[x]$は$y_j$の線形結合なので、$\det B=(\det B)\cdot 1=0$である。$\det B$を展開すると、$x$の$R$係数の次数$k$のモニック多項式の値である。よって$x$は$R$上整である。
  strategy: Reduce high powers with the monic relation, and use the determinant trick for the converse.
  sketch:
  - 'derive: A monic relation of degree n expresses all powers of x through 1, x, ..., x^(n-1).'
  - 'setup: If y_1, ..., y_k generate R[x], write x y_i as a combination of the y_j.'
  - 'construct: Form the matrix B = xE - (a_ij), which kills the vector (y_j).'
  - 'derive: Multiplying by the adjugate gives det(B) y_j = 0 for all j.'
  - 'derive: Since 1 lies in R[x], det(B) = 0.'
  - 'conclude: det(B) is a monic polynomial in x with coefficients from R.'
  openmath: (forall (A B x) (-> (and (comm_ring A) (comm_ring B) (algebra_over B A) (in x B)) (<-> (integral_element x A) (finitely_generated_module A (algebra_adjoin_element A x)))))
  hard_negative:
    statement: $x$がある$R$係数の$0$でない多項式の根なら、$R[x]$は有限生成$R$加群である。
    reason: $\mathbb{Z}$上の$x=1/2$は$2X-1$の根だが、$\mathbb{Z}[1/2]$は有限生成$\mathbb{Z}$加群でない。モニック性が必要である。
  target: |
    ∀ (R A : Type*) [CommRing R] [CommRing A] [Algebra R A] (x : A), IsIntegral R x ↔ Module.Finite R (Algebra.adjoin R ({x} : Set A))
  proof: |
    by
      intro R A _ _ _ x
      constructor
      · exact Algebra.finite_adjoin_simple_of_isIntegral
      · intro h
        exact IsIntegral.of_mem_of_fg _ ((Submodule.fg_top _).mp h.fg_top) x (Algebra.self_mem_adjoin_singleton R x)
- id: finite_type_algebra_finite_iff_integral
  kind: textbook
  level: 3
  topic: 可換環論・整拡大と有限性
  statement: $R$を可換環、$S$を$R$代数として有限生成な可換環とする。$S$が有限生成$R$加群であることと、$S$が$R$上整であることは同値である。
  statement_en: A commutative algebra S of finite type over a commutative ring R is a finitely generated R-module if and only if S is integral over R.
  assumptions:
  - $R$は可換環
  - $S$は$R$代数として有限生成な可換環
  quantifiers:
  - 任意の可換環$R$と有限生成$R$代数$S$
  conclusion: $S$が有限生成$R$加群であることと、$S$が$R$上整であることは同値である。
  answer: |
    $R$を可換環、$S$を有限生成$R$代数とする。
    $S$が$R$加群として$y_1,\ldots,y_k$で生成されるとする。$x\in S$に対し$xy_i=\sum_ja_{ij}y_j$($a_{ij}\in R$)と書く。$B=xE-(a_{ij})$は縦ベクトル$(y_j)_j$を$0$に移すので、余因子行列をかけるとすべての$j$で$(\det B)y_j=0$となる。$1$は$y_j$の線形結合なので$\det B=0$である。$\det B$は$x$の$R$係数のモニック多項式の値なので、$x$は$R$上整である。
    逆に$S$が$R$上整であるとし、$S=R[x_1,\ldots,x_n]$とする。各$x_i$は次数$d_i$のモニック多項式の根であり、$x_i^{d_i}$は$x_i$のより低い冪の$R$係数の線形結合である。これを繰り返し用いると、$S$は有限個の単項式$x_1^{e_1}\cdots x_n^{e_n}$($0\leq e_i<d_i$)で$R$加群として生成される。
  strategy: Use the determinant trick on module generators, and bound exponents with the monic relations.
  sketch:
  - 'setup: Suppose y_1, ..., y_k generate S as an R-module and take x in S.'
  - 'derive: The matrix xE - (a_ij) kills (y_j), so its determinant kills S and vanishes.'
  - 'derive: That determinant is a monic relation for x.'
  - 'setup: Conversely write S = R[x_1, ..., x_n] with monic relations of degrees d_i.'
  - 'conclude: Monomials with exponents below d_i generate S as an R-module.'
  openmath: (forall (A B) (-> (and (comm_ring A) (comm_ring B) (algebra_over B A) (finite_type_algebra B A)) (<-> (finitely_generated_module A B) (integral_extension B A))))
  hard_negative:
    statement: $R$上整な可換$R$代数はつねに有限生成$R$加群である。
    reason: $\mathbb{Q}$の代数閉包内の代数的整数全体は$\mathbb{Z}$上整だが、有限生成$\mathbb{Z}$加群でない。代数としての有限生成性が必要である。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] [Algebra.FiniteType R S], Module.Finite R S ↔ Algebra.IsIntegral R S
  proof: |
    by
      intro R S _ _ _ _
      exact ⟨fun _ => inferInstance, fun _ => Algebra.IsIntegral.finite⟩
- id: unit_descends_along_integral_extension
  kind: gap
  level: 4
  topic: 可換環論・整拡大
  statement: $R,S$を可換環、$\varphi:R\to S$を単射な環準同型とし、$S$は$\varphi$により$R$上整とする。$r\in R$について$\varphi(r)$が$S$の単元なら、$r$は$R$の単元である。
  statement_en: If φ from R to S is an injective ring homomorphism of commutative rings making S integral over R, and φ(r) is a unit of S, then r is a unit of R.
  assumptions:
  - $R,S$は可換環
  - $\varphi:R\to S$は単射な環準同型
  - $S$は$\varphi$により$R$上整
  - $r\in R$で$\varphi(r)$は$S$の単元
  quantifiers:
  - 任意の$R,S,\varphi,r$
  conclusion: $r$は$R$の単元である。
  answer: |
    $R,S$を可換環、$\varphi:R\to S$を単射な環準同型とし、$S$は$R$上整、$r\in R$で$\varphi(r)$は単元とする。$y=\varphi(r)^{-1}$とおく。$y$は$R$上整なので、$a_i\in R$により$y^n+\varphi(a_{n-1})y^{n-1}+\cdots+\varphi(a_0)=0$と書ける。$n=0$なら$S$は零環で、単射性から$R$も零環なので、$r$は単元である。
    $n\geq 1$とする。式に$\varphi(r)^{n-1}$をかけると、$y\varphi(r)=1$より$y+\varphi(a_{n-1})+\varphi(a_{n-2}r)+\cdots+\varphi(a_0r^{n-1})=0$である。よって$y=\varphi(t)$となる$t\in R$がある。$\varphi(rt)=\varphi(r)y=1=\varphi(1)$であり、単射性から$rt=1$である。
  strategy: Multiply the integral equation of the inverse by a power of φ(r) to place the inverse in φ(R).
  sketch:
  - 'setup: Let y be the inverse of φ(r) and take a monic relation of degree n for y.'
  - 'case_split: For n = 0 both rings are zero and the claim is trivial.'
  - 'derive: Multiplying by φ(r)^(n-1) expresses y as φ(t) with t in R.'
  - 'derive: Then φ(rt) = 1.'
  - 'conclude: Injectivity gives rt = 1.'
  openmath: (forall (A B r) (-> (and (comm_ring A) (comm_ring B) (algebra_over B A) (integral_extension B A) (ring_hom_injective (algebra_map A B)) (in r A) (unit_element (fn_value (algebra_map A B) r) B)) (unit_element r A)))
  hard_negative:
    statement: 単射な環準同型$\varphi:R\to S$で$\varphi(r)$が単元なら$r$は単元である。
    reason: $\mathbb{Z}\subset\mathbb{Q}$で$r=2$とすると$2$は$\mathbb{Q}$の単元だが、$\mathbb{Z}$の単元でない。整性が必要である。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] [Algebra.IsIntegral R S] (r : R), Function.Injective (algebraMap R S) → IsUnit (algebraMap R S r) → IsUnit r
  proof: |
    by
      intro R S _ _ _ _ r hinj hu
      by_contra hr
      obtain ⟨P, hP, hle⟩ := Ideal.exists_le_maximal (Ideal.span ({r} : Set R)) (Ideal.span_singleton_ne_top hr)
      have hker : RingHom.ker (algebraMap R S) ≤ P := by
        rw [(RingHom.injective_iff_ker_eq_bot _).mp hinj]
        exact bot_le
      obtain ⟨Q, hQ, hcomap⟩ := Ideal.exists_ideal_over_maximal_of_isIntegral P hker
      have hrP : r ∈ P := hle (Ideal.mem_span_singleton_self r)
      rw [← hcomap] at hrP
      exact hQ.ne_top (Ideal.eq_top_of_isUnit_mem _ hrP hu)
- id: integral_prime_maximal_iff_contraction_maximal
  kind: textbook
  level: 4
  topic: 可換環論・整拡大の素イデアル
  statement: $R,S$を可換環、$\varphi:R\to S$を環準同型とし、$S$は$\varphi$により$R$上整とする。$S$の素イデアル$Q$について、$Q$が極大イデアルであることと$\varphi^{-1}(Q)$が極大イデアルであることは同値である。
  statement_en: If a ring homomorphism φ from R to S makes S integral over R, then a prime ideal Q of S is maximal if and only if its contraction φ^(-1)(Q) is maximal.
  assumptions:
  - $R,S$は可換環
  - $\varphi:R\to S$は環準同型で、$S$は$R$上整
  - $Q$は$S$の素イデアル
  quantifiers:
  - 任意の$R,S,\varphi,Q$
  conclusion: $Q$が極大であることと$\varphi^{-1}(Q)$が極大であることは同値である。
  answer: |
    $R,S$を可換環、$\varphi:R\to S$を環準同型で$S$は$R$上整、$Q$を$S$の素イデアル、$P=\varphi^{-1}(Q)$とする。$\varphi$は単射$A=R/P\to B=S/Q$を誘導する。$A,B$は整域であり、$S$の元の満たすモニック多項式を還元すると$B$は$A$上整である。$A$を$B$の部分環とみなす。$A$が体であることと$B$が体であることの同値を示せばよい。
    $A$が体とする。$b\in B$、$b\neq 0$をとり、$b$の$A$係数のモニック多項式の関係式$b^n+a_{n-1}b^{n-1}+\cdots+a_0=0$で$n$が最小のものをとる。$B$は整域なので$a_0\neq 0$である。実際、$a_0=0$なら$b$で割って次数を下げられる。$b(b^{n-1}+\cdots+a_1)=-a_0$であり、$-a_0$は$A$の単元なので、$b$は$B$の単元である。
    $B$が体とする。$a\in A$、$a\neq 0$をとると、$y=a^{-1}\in B$は$A$上整である。$y^n+a_{n-1}y^{n-1}+\cdots+a_0=0$と書くと、$B$は零環でないので$n\geq 1$である。この式に$a^{n-1}$をかけると、$y=-(a_{n-1}+a_{n-2}a+\cdots+a_0a^{n-1})\in A$である。よって$a$は$A$の単元である。
  strategy: Pass to the integral extension of domains R/P inside S/Q and compare the field property on both sides.
  sketch:
  - 'translate: Maximality of Q and of P means S/Q and R/P are fields.'
  - 'derive: R/P embeds in S/Q and the extension of domains is integral.'
  - 'derive: If the base is a field, a minimal monic relation has nonzero constant term, so nonzero elements invert.'
  - 'derive: If the top is a field, the inverse of a nonzero a in the base lies in the base by multiplying with a^(n-1).'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (A B q) (-> (and (comm_ring A) (comm_ring B) (algebra_over B A) (integral_extension B A) (prime_ideal q B)) (<-> (maximal_ideal q B) (maximal_ideal (ideal_comap (algebra_map A B) q) A))))
  hard_negative:
    statement: 環準同型$\varphi:R\to S$と素イデアル$Q$について、$\varphi^{-1}(Q)$が極大なら$Q$は極大である。
    reason: $R=\mathbb{Z}_{(2)}$、$S=R[X]$、$Q=(2)$とすると、逆像は極大イデアル$(2)$だが、$Q$は極大でない。整性が必要である。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] [Algebra.IsIntegral R S] (Q : Ideal S), Q.IsPrime → (Q.IsMaximal ↔ (Q.comap (algebraMap R S)).IsMaximal)
  proof: |
    by
      intro R S _ _ _ _ Q hQ
      exact ⟨fun _ => Ideal.isMaximal_comap_of_isIntegral_of_isMaximal Q, fun h => Ideal.isMaximal_of_isIntegral_of_isMaximal_comap Q h⟩
- id: noetherian_iff_maximal_condition
  kind: textbook
  level: 3
  topic: 可換環論・ネーター環
  statement: 可換環$R$がネーター環であることと、$R$のイデアルからなる空でない任意の集合が包含に関する極大元をもつことは同値である。
  statement_en: A commutative ring is Noetherian if and only if every nonempty set of its ideals has a maximal element with respect to inclusion.
  assumptions:
  - $R$は可換環
  quantifiers:
  - 任意の可換環$R$
  conclusion: $R$がネーター環であることと、イデアルの空でない任意の集合が極大元をもつことは同値である。
  answer: |
    $R$を可換環とする。$R$がネーター環であるとは、すべてのイデアルが有限生成であることをいう。
    $R$がネーター環で、イデアルの空でない集合$\Sigma$に極大元がないとする。$\Sigma$の元を順に選んで、狭義増大列$I_1\subsetneq I_2\subsetneq\cdots$を作れる。和集合$I$はイデアルなので有限生成であり、有限個の生成元はある$I_n$に含まれる。すると$I=I_n$となり、列が狭義増大であることに反する。
    逆に、イデアルの空でない集合がつねに極大元をもつとする。イデアル$I$に含まれる有限生成イデアル全体は$0$を含むので空でなく、極大元$J$をもつ。$x\in I\setminus J$があると、$J+(x)$は$I$に含まれる有限生成イデアルで$J$より真に大きく、矛盾する。よって$I=J$は有限生成である。
  strategy: Convert a set without maximal element into a strictly ascending chain, and maximize among finitely generated subideals.
  sketch:
  - 'setup: If a nonempty set has no maximal element, choose a strictly ascending chain in it.'
  - 'contradiction: Finite generators of the union lie in one term of the chain.'
  - 'setup: Conversely take a maximal finitely generated subideal J of I.'
  - 'contradiction: An element of I outside J would enlarge J.'
  - 'conclude: Hence I is finitely generated.'
  openmath: (forall (A) (-> (comm_ring A) (<-> (noetherian_ring A) (forall (a) (-> (and (subset a (all_ideals A)) (!= a emptyset)) (exists (I) (and (in I a) (forall (J) (-> (in J a) (not (prsubset I J)))))))))))
  hard_negative:
    statement: ネーター環ではイデアルの空でない任意の集合が極小元をもつ。
    reason: $\mathbb{Z}$はネーター環だが、$\{(2^n)\mid n\geq 0\}$は極小元をもたない。これはアルティン環の条件である。
  target: |
    ∀ (R : Type*) [CommRing R], IsNoetherianRing R ↔ ∀ a : Set (Ideal R), a.Nonempty → ∃ I ∈ a, ∀ J ∈ a, ¬ I < J
  proof: |
    by
      intro R _
      exact (set_has_maximal_iff_noetherian (R := R) (M := R)).symm
- id: noetherian_surjective_endomorphism_injective
  kind: gap
  level: 4
  topic: 可換環論・ネーター環
  statement: $R$を可換ネーター環、$f:R\to R$を全射な環準同型とする。$f$は単射である。
  statement_en: Every surjective ring endomorphism of a commutative Noetherian ring is injective.
  assumptions:
  - $R$は可換ネーター環
  - $f:R\to R$は全射な環準同型
  quantifiers:
  - 任意の可換ネーター環$R$と全射な環準同型$f$
  conclusion: $f$は単射である。
  answer: |
    $R$を可換ネーター環、$f:R\to R$を全射な環準同型とする。$f^n$の核は$\ker f^1\subseteq\ker f^2\subseteq\cdots$と増大する。$R$はネーター環なので、この列は止まり、$\ker f^n=\ker f^{n+1}$となる$n$がある。
    $x\in\ker f$とする。$f^n$は全射なので$x=f^n(y)$と書ける。$f^{n+1}(y)=f(x)=0$より$y\in\ker f^{n+1}=\ker f^n$である。よって$x=f^n(y)=0$であり、$f$は単射である。
  strategy: Stabilize the chain of kernels of the powers of f and pull an element of ker f back through f^n.
  sketch:
  - 'setup: The kernels of the powers of f form an ascending chain of ideals.'
  - 'derive: Noetherianity gives n with ker f^n = ker f^(n+1).'
  - 'derive: For x in ker f write x = f^n(y) by surjectivity.'
  - 'derive: Then y lies in ker f^(n+1) = ker f^n.'
  - 'conclude: So x = 0.'
  openmath: (forall (A f) (-> (and (comm_ring A) (noetherian_ring A) (ring_hom f A A) (surjective f)) (ring_hom_injective f)))
  hard_negative:
    statement: 任意の可換環の全射な環準同型$f:R\to R$は単射である。
    reason: 体$k$上の無限個の変数$x_1,x_2,\ldots$をもつ多項式環で$x_1\mapsto 0$、$x_{i+1}\mapsto x_i$と定めると、全射だが単射でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] (f : R →+* R), Function.Surjective f → Function.Injective f
  proof: |
    by
      intro R _ _ f hf
      let k : ℕ →o Ideal R := ⟨fun n => RingHom.ker (f ^ n), by
        refine monotone_nat_of_le_succ fun n x hx => ?_
        simp only [RingHom.mem_ker] at hx ⊢
        rw [pow_succ', RingHom.mul_def, RingHom.comp_apply, hx, map_zero]⟩
      obtain ⟨n, hn⟩ := monotone_stabilizes_iff_noetherian.mpr (inferInstance : IsNoetherian R R) k
      refine (injective_iff_map_eq_zero f).mpr fun x hx => ?_
      have hfn : Function.Surjective (f ^ n) := by
        rw [RingHom.coe_pow]
        exact hf.iterate n
      obtain ⟨y, rfl⟩ := hfn x
      have hy : y ∈ k (n + 1) := by
        simp only [k]
        show (f ^ (n + 1)) y = 0
        rw [pow_succ', RingHom.mul_def, RingHom.comp_apply, hx]
      rw [← hn (n + 1) (Nat.le_succ n)] at hy
      exact hy
- id: noetherian_ideal_contains_power_of_radical
  kind: gap
  level: 3
  topic: 可換環論・ネーター環と根基
  statement: $R$を可換ネーター環、$I$を$R$のイデアルとする。$(\sqrt{I})^n\subseteq I$となる自然数$n$が存在する。
  statement_en: Every ideal I of a commutative Noetherian ring contains some power of its radical.
  assumptions:
  - $R$は可換ネーター環
  - $I$は$R$のイデアル
  quantifiers:
  - 任意の可換ネーター環$R$とイデアル$I$
  conclusion: $(\sqrt{I})^n\subseteq I$となる自然数$n$が存在する。
  answer: |
    $R$を可換ネーター環、$I$をイデアルとする。$\sqrt{I}$は有限生成なので、$\sqrt{I}=(x_1,\ldots,x_k)$($k\geq 1$)と書ける。各$i$で$x_i^{d_i}\in I$となる$d_i\geq 1$をとり、$n=d_1+\cdots+d_k$とおく。
    $(\sqrt{I})^n$は単項式$x_1^{e_1}\cdots x_k^{e_k}$($e_1+\cdots+e_k=n$)で生成される。すべての$i$で$e_i<d_i$なら$e_1+\cdots+e_k<n$となるので、ある$i$で$e_i\geq d_i$である。その単項式は$x_i^{d_i}$を因子にもつので$I$に属する。よって$(\sqrt{I})^n\subseteq I$である。
  strategy: Take a finite generating set of the radical and apply the pigeonhole principle to exponents.
  sketch:
  - 'setup: The radical is finitely generated by x_1, ..., x_k with x_i^(d_i) in I.'
  - 'construct: Put n = d_1 + ... + d_k.'
  - 'derive: Every monomial of total degree n has some exponent e_i at least d_i.'
  - 'conclude: So all generators of the n-th power of the radical lie in I.'
  openmath: (forall (A I) (-> (and (comm_ring A) (noetherian_ring A) (ideal_of I A)) (exists (n) (and (in n N) (subset (ideal_power (ideal_radical I) n) I)))))
  hard_negative:
    statement: 任意の可換環のイデアル$I$について、$(\sqrt{I})^n\subseteq I$となる$n$が存在する。
    reason: 体$k$上の変数$x_1,x_2,\ldots$の多項式環を$(x_m^m\mid m\geq 1)$で割った環で$I=0$とすると、$\sqrt{I}$は$x_m$で生成され、どの$n$でも$x_{n+1}^n\neq 0$である。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] (I : Ideal R), ∃ n : ℕ, I.radical ^ n ≤ I
  proof: |
    by
      intro R _ _ I
      exact Ideal.exists_radical_pow_le_of_fg I (IsNoetherian.noetherian I.radical)
- id: cohen_prime_ideals_finitely_generated
  kind: named
  level: 4
  topic: 可換環論・コーエンの定理
  statement: コーエンの定理。可換環$R$のすべての素イデアルが有限生成なら、$R$はネーター環である。
  statement_en: Cohen's theorem. If every prime ideal of a commutative ring is finitely generated, then the ring is Noetherian.
  assumptions:
  - $R$は可換環
  - $R$のすべての素イデアルは有限生成
  quantifiers:
  - 任意の可換環$R$
  conclusion: $R$はネーター環である。
  answer: |
    $R$を可換環とし、すべての素イデアルが有限生成であるとする。$R$がネーター環でないと仮定し、有限生成でないイデアル全体を$\Sigma$とする。$\Sigma$は空でない。$\Sigma$の鎖の和集合が有限生成なら、生成元は鎖のある元に含まれてその元が有限生成になるので、和集合は$\Sigma$に属する。ツォルンの補題により極大元$P$がある。$R=(1)$は有限生成なので$P\neq R$である。$P$が素イデアルであることを示せば、仮定に反する。
    $a,b\notin P$、$ab\in P$と仮定する。$P+(a)$は$P$より真に大きいので有限生成であり、$p_i\in P$、$r_i\in R$により$P+(a)=(p_1+r_1a,\ldots,p_n+r_na)$と書ける。$D=\{r\in R\mid ra\in P\}$は$P+(b)$を含むので$P$より真に大きく、有限生成である。
    $P=(p_1,\ldots,p_n)+aD$を示す。右辺が$P$に含まれるのは明らかである。$x\in P$とすると、$x=\sum_ic_i(p_i+r_ia)=\sum_ic_ip_i+a\sum_ic_ir_i$と書ける。$t=\sum_ic_ir_i$について$ta=x-\sum_ic_ip_i\in P$なので$t\in D$である。よって等号が成り立つ。$D$は有限生成なので$P$も有限生成となり、$P\in\Sigma$に反する。したがって$ab\notin P$であり、$P$は素イデアルである。
  strategy: A maximal non-finitely-generated ideal is prime, by writing it through P + (a) and the colon ideal (P:a).
  sketch:
  - 'setup: If R is not Noetherian, Zorn gives an ideal P maximal among those not finitely generated.'
  - 'contradiction: Suppose a and b lie outside P with ab in P.'
  - 'derive: P + (a) has generators p_i + r_i a with p_i in P.'
  - 'derive: The colon D = (P:a) strictly contains P, so it is finitely generated.'
  - 'derive: Every x in P lies in (p_1, ..., p_n) + aD, so P is finitely generated.'
  - 'conclude: Thus P is prime and not finitely generated, against the hypothesis.'
  openmath: (forall (A) (-> (and (comm_ring A) (forall (p) (-> (prime_ideal p A) (finitely_generated_ideal p)))) (noetherian_ring A)))
  hard_negative:
    statement: 可換環のすべての極大イデアルが有限生成なら、その環はネーター環である。
    reason: $\mathbb{Q}[[x]]$のうち定数項が$\mathbb{Z}_{(2)}$に属するものからなる環は、極大イデアルが$(2)$で単項だが、素イデアル$x\mathbb{Q}[[x]]$が有限生成でない。
  target: |
    ∀ (R : Type*) [CommRing R], (∀ P : Ideal R, P.IsPrime → P.FG) → IsNoetherianRing R
  proof: |
    by
      intro R _ h
      exact IsNoetherianRing.of_prime h
- id: krull_principal_ideal_theorem
  kind: named
  level: 4
  topic: 可換環論・クルルの単項イデアル定理
  statement: クルルの単項イデアル定理。$R$を可換ネーター環、$x\in R$、$P$を$(x)$を含む極小の素イデアルとする。$P$の高さは$1$以下である。
  statement_en: Krull's principal ideal theorem. If R is a commutative Noetherian ring, x an element of R and P a prime ideal minimal over (x), then the height of P is at most 1.
  assumptions:
  - $R$は可換ネーター環
  - $x\in R$
  - $P$は$(x)$を含む素イデアルのうち極小のもの
  quantifiers:
  - 任意の可換ネーター環$R$、$x\in R$、$P$
  conclusion: $P$の高さは$1$以下である。
  answer: |
    $R$を可換ネーター環、$x\in R$、$P$を$(x)$上の極小素イデアルとする。高さが$2$以上なら、素イデアルの列$P\supsetneq Q\supsetneq Q'$がある。$R$を$R_P/Q'R_P$に置き換える。素イデアルの対応から、$R$はネーター局所整域で、極大イデアルは$P$であり、$x$を含む素イデアルは$P$だけで、$0\neq Q\subsetneq P$となる素イデアル$Q$がある。特に$x\notin Q$である。
    $R/(x)$はネーター環で素イデアルがただ1つなので、すべての素イデアルが極大である。すべての素イデアルが極大なネーター環はアルティン環であるという定理より、$R/(x)$はアルティン環である。$\varphi:R\to R_Q$を標準写像とし、$n\geq 1$について$Q^{(n)}=\varphi^{-1}(Q^nR_Q)$とおく。降下列$Q^{(n)}+(x)$は止まるので、ある$n$で$Q^{(n)}+(x)=Q^{(n+1)}+(x)$である。
    $y\in Q^{(n)}$を$y=z+ax$($z\in Q^{(n+1)}$、$a\in R$)と書く。$ax=y-z\in Q^{(n)}$であり、$\varphi(x)$は$R_Q$の単元なので$a\in Q^{(n)}$である。よって$Q^{(n)}=Q^{(n+1)}+xQ^{(n)}$である。$x\in P$で$Q^{(n)}$は有限生成なので、局所環$R$での中山の補題より$Q^{(n)}=Q^{(n+1)}$を得る。
    これを$R_Q$へ広げる。局所化のイデアルは逆像の拡大に等しいので、$Q^nR_Q=Q^{n+1}R_Q=(QR_Q)(Q^nR_Q)$である。局所環$R_Q$での中山の補題より$Q^nR_Q=0$となる。$R_Q$は整域なので$QR_Q=0$であり、$R$から$R_Q$への写像は単射なので$Q=0$となる。これは$Q\neq 0$に反する。
  strategy: Reduce to a local domain, stabilize symbolic powers modulo x using Artinianity, and apply Nakayama twice.
  sketch:
  - 'setup: From a chain P ⊋ Q ⊋ Q'' pass to the local domain R_P/Q''R_P, where P is the only prime containing x.'
  - 'derive: R/(x) is Noetherian with a single prime, so it is Artinian.'
  - 'derive: The chain Q^(n) + (x) of symbolic powers stabilizes at some n.'
  - 'derive: Since x is outside Q, this yields Q^(n) = Q^(n+1) + x Q^(n).'
  - 'apply_theorem: Nakayama over R gives Q^(n) = Q^(n+1).'
  - 'apply_theorem: Extending to R_Q and using Nakayama again gives Q^n R_Q = 0.'
  - 'contradiction: In a domain this forces Q = 0.'
  openmath: (forall (A x p) (-> (and (comm_ring A) (noetherian_ring A) (in x A) (minimal_prime_over p (principal_ideal x))) (<= (ideal_height p) 1)))
  hard_negative:
    statement: 可換ネーター環の$2$元で生成されるイデアル上の極小素イデアルの高さは$1$以下である。
    reason: 体$k$上の$k[x,y]$で$(x,y)$は素イデアルで、列$0\subsetneq(x)\subsetneq(x,y)$より高さは$2$である。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] (x : R) (P : Ideal R), P ∈ (Ideal.span ({x} : Set R)).minimalPrimes → P.height ≤ 1
  proof: |
    by
      intro R _ _ x P hP
      exact Ideal.height_le_one_of_isPrincipal_of_mem_minimalPrimes (Ideal.span ({x} : Set R)) P hP
- id: artinian_non_zero_divisor_is_unit
  kind: gap
  level: 3
  topic: 可換環論・アルティン環
  statement: $R$を可換アルティン環、$x\in R$とし、$xy=0$なら$y=0$であるとする。$x$は単元である。
  statement_en: In a commutative Artinian ring, an element x such that xy = 0 implies y = 0 is a unit.
  assumptions:
  - $R$は可換アルティン環
  - $x\in R$で、$xy=0$なら$y=0$
  quantifiers:
  - 任意の可換アルティン環$R$と$x\in R$
  conclusion: $x$は単元である。
  answer: |
    $R$を可換アルティン環、$x\in R$とし、$xy=0$なら$y=0$であるとする。降下列$(x)\supseteq(x^2)\supseteq\cdots$は止まるので、$(x^n)=(x^{n+1})$となる$n$がある。よって$x^n=x^{n+1}y$となる$y\in R$がある。
    $x^n(1-xy)=0$である。$x$を消せるという仮定を$n$回使うと、$1-xy=0$である。したがって$x$は単元である。
  strategy: Stabilize the descending chain of powers of x and cancel x.
  sketch:
  - 'derive: The chain of principal ideals (x^n) stabilizes, so x^n = x^(n+1) y.'
  - 'derive: Then x^n (1 - xy) = 0.'
  - 'derive: Cancelling x repeatedly gives 1 - xy = 0.'
  - 'conclude: So x is a unit.'
  openmath: (forall (A x) (-> (and (comm_ring A) (artinian_ring A) (in x A) (forall (y) (-> (and (in y A) (= (* x y) 0)) (= y 0)))) (unit_element x A)))
  hard_negative:
    statement: ネーター環で零因子でない元は単元である。
    reason: $\mathbb{Z}$はネーター環で$2$は零因子でないが、単元でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsArtinianRing R] (x : R), (∀ y : R, x * y = 0 → y = 0) → IsUnit x
  proof: |
    by
      intro R _ _ x h
      refine IsArtinianRing.isUnit_of_mem_nonZeroDivisors (mem_nonZeroDivisors_iff_right.mpr ?_)
      intro y hy
      exact h y (by rw [mul_comm]; exact hy)
- id: artinian_local_unit_or_nilpotent
  kind: gap
  level: 3
  topic: 可換環論・アルティン局所環
  statement: $R$を可換アルティン局所環とする。$R$の各元は単元または冪零元である。
  statement_en: Every element of a commutative Artinian local ring is a unit or nilpotent.
  assumptions:
  - $R$は可換アルティン局所環
  quantifiers:
  - 任意の可換アルティン局所環$R$と$x\in R$
  conclusion: $x$は単元または冪零元である。
  answer: |
    $R$を可換アルティン局所環、$M$を極大イデアルとし、$x\in R$を非単元とする。$x\in M$である。降下列$(x)\supseteq(x^2)\supseteq\cdots$は止まるので、$x^n=x^{n+1}y$となる$n$と$y\in R$がある。すると$x^n(1-xy)=0$である。
    $xy\in M$なので$1-xy\notin M$であり、$R$は局所環なので$1-xy$は単元である。よって$x^n=0$である。
  strategy: Stabilize powers of x and note that 1 - xy is a unit in a local ring.
  sketch:
  - 'setup: Take a nonunit x, which lies in the maximal ideal M.'
  - 'derive: The chain (x^n) stabilizes, so x^n (1 - xy) = 0.'
  - 'derive: Since xy lies in M, 1 - xy is a unit.'
  - 'conclude: So x^n = 0.'
  openmath: (forall (A x) (-> (and (comm_ring A) (artinian_ring A) (local_ring A) (in x A)) (or (unit_element x A) (nilpotent_element x A))))
  hard_negative:
    statement: 可換局所環の各元は単元または冪零元である。
    reason: $\mathbb{Z}_{(2)}$は局所環だが、$2$は単元でも冪零元でもない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsArtinianRing R] [IsLocalRing R] (x : R), IsUnit x ∨ IsNilpotent x
  proof: |
    by
      intro R _ _ _ x
      by_cases hx : IsUnit x
      · exact Or.inl hx
      · right
        have hm : x ∈ IsLocalRing.maximalIdeal R := hx
        rw [← IsLocalRing.jacobson_eq_maximalIdeal ⊥ bot_ne_top] at hm
        obtain ⟨n, hn⟩ := IsArtinianRing.isNilpotent_jacobson_bot (R := R)
        refine ⟨n, ?_⟩
        have := Ideal.pow_mem_pow hm n
        rw [hn] at this
        simpa using this
- id: artinian_reduced_is_product_of_fields
  kind: textbook
  level: 4
  topic: 可換環論・アルティン環の構造
  statement: $R$を被約な可換アルティン環とする。$R$の極大イデアルは有限個であり、$x\mapsto(x+M)_M$は環同型$R\cong\prod_MR/M$を与える。ここで$M$は$R$の極大イデアル全体を動く。
  statement_en: A reduced commutative Artinian ring has finitely many maximal ideals, and the natural map to the product of the fields R/M over all maximal ideals M is a ring isomorphism.
  assumptions:
  - $R$は被約な可換アルティン環
  - $M$は$R$の極大イデアルを動く
  quantifiers:
  - 任意の被約な可換アルティン環$R$
  conclusion: 極大イデアルは有限個で、$R\to\prod_MR/M$は環同型である。
  answer: |
    $R$を被約な可換アルティン環とする。有限個の極大イデアルの共通部分全体(0個のときは$R$)の中で極小なものを$J=M_1\cap\cdots\cap M_k$とする。任意の極大イデアル$M$について、$M\cap J=J$なので$M_1\cap\cdots\cap M_k\subseteq M$である。$M$は素イデアルなので、ある$i$で$M_i\subseteq M$であり、$M=M_i$である。よって極大イデアルは$M_1,\ldots,M_k$だけであり、$J$はそれらの共通部分である。重複を除いて、$M_1,\ldots,M_k$は相異なるとする。
    $J=0$を示す。降下列$J\supseteq J^2\supseteq\cdots$は止まるので、$n\geq 1$で$A=J^n=J^{n+1}$となる。$A^2=A$である。$A\neq 0$と仮定する。$AB\neq 0$となるイデアル$B$の全体は$R$を含むので、極小元$B$がある。$Ax\neq 0$となる$x\in B$をとると、極小性から$B=(x)$である。$A(Ax)=Ax\neq 0$かつ$Ax\subseteq(x)$なので、極小性から$Ax=(x)$である。よって$x=ax$となる$a\in A\subseteq J$がある。$a$はすべての極大イデアルに属するので$1-a$は単元であり、$(1-a)x=0$から$x=0$となって矛盾する。したがって$J^n=0$である。$x\in J$なら$x^n=0$なので、$R$が被約であることから$x=0$である。よって$J=0$である。
    相異なる極大イデアルについて$M_i+M_j=R$である。中国剰余定理より、$R=R/\bigcap_iM_i\to\prod_iR/M_i$は環同型である。
  strategy: Use the descending chain condition to get finitely many maximal ideals and a nilpotent Jacobson radical, then apply the Chinese remainder theorem.
  sketch:
  - 'derive: A minimal finite intersection of maximal ideals forces finitely many maximal ideals.'
  - 'setup: Let J be their intersection and A a stable power of J, so A^2 = A.'
  - 'contradiction: If A is nonzero, a minimal ideal B with AB nonzero is principal and gives x = ax with a in J.'
  - 'derive: Since 1 - a is a unit, x = 0, so J is nilpotent.'
  - 'derive: Reducedness gives J = 0.'
  - 'apply_theorem: The Chinese remainder theorem gives the isomorphism.'
  openmath: (forall (A) (-> (and (comm_ring A) (artinian_ring A) (reduced_ring A)) (and (finite_set (maximal_ideals_of A)) (exists (e) (and (ring_iso e A (product_of_residue_fields A)) (forall (x m) (-> (and (in x A) (maximal_ideal m A)) (= (family_value (fn_value e x) m) (residue_class m x)))))))))
  hard_negative:
    statement: 任意の可換アルティン環は有限個の体の直積である。
    reason: $\mathbb{Z}/4\mathbb{Z}$はアルティン環だが被約でないので、体の直積ではない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsArtinianRing R] [IsReduced R], Finite (MaximalSpectrum R) ∧ ∃ e : R ≃+* ∀ m : MaximalSpectrum R, R ⧸ m.asIdeal, ∀ (x : R) (m : MaximalSpectrum R), e x m = Ideal.Quotient.mk m.asIdeal x
  proof: |
    by
      intro R _ _ _
      exact ⟨inferInstance, (IsArtinianRing.equivPi R).toRingEquiv, fun x m => rfl⟩
- id: nakayama_multiplier_congruent_to_one
  kind: gap
  level: 4
  topic: 可換環論・中山の補題
  statement: $R$を可換環、$V$を$R$加群、$I$を$R$のイデアル、$U$を$V$の有限生成部分加群とし、$U\subseteq IU$とする。$r-1\in I$かつ$rU=0$をみたす$r\in R$が存在する。
  statement_en: If U is a finitely generated submodule of an R-module and U ⊆ IU for an ideal I of the commutative ring R, then there is r in R with r - 1 in I and rU = 0.
  assumptions:
  - $R$は可換環
  - $V$は$R$加群、$U$は$V$の有限生成部分加群
  - $I$は$R$のイデアル
  - $U\subseteq IU$
  quantifiers:
  - 任意の$R,V,I,U$
  conclusion: $r-1\in I$かつ$rU=0$となる$r\in R$が存在する。
  answer: |
    $R$を可換環、$V$を$R$加群、$I$をイデアル、$U=Ru_1+\cdots+Ru_k$を$U\subseteq IU$をみたす有限生成部分加群とする。$IU$の元は$I$の元を係数とする$u_j$の線形結合なので、$u_i=\sum_ja_{ij}u_j$($a_{ij}\in I$)と書ける。
    $B=E-(a_{ij})$は縦ベクトル$(u_j)_j$を$0$に移す。$B$の余因子行列を左からかけると、すべての$j$で$(\det B)u_j=0$である。$r=\det B$とおくと$rU=0$である。$a_{ij}\in I$なので、行列式を$I$を法として計算すると$r\equiv\det E=1$であり、$r-1\in I$である。
  strategy: Apply the determinant trick to the matrix E - (a_ij) with entries a_ij in I.
  sketch:
  - 'setup: Write u_i as a combination of the generators u_j with coefficients in I.'
  - 'construct: The matrix B = E - (a_ij) kills the vector (u_j).'
  - 'derive: Multiplying by the adjugate gives det(B) u_j = 0 for all j.'
  - 'derive: Modulo I the determinant equals 1.'
  - 'conclude: Take r = det(B).'
  openmath: (forall (A V I U) (-> (and (comm_ring A) (module_over V A) (ideal_of I A) (submodule_of U V) (finitely_generated_submodule U) (subset U (ideal_smul_submodule I U))) (exists (r) (and (in r A) (in (- r 1) I) (forall (u) (-> (in u U) (= (smul r u) 0)))))))
  hard_negative:
    statement: 有限生成でない部分加群$U$でも、$U\subseteq IU$なら$r-1\in I$、$rU=0$となる$r$がある。
    reason: $R=\mathbb{Z}_{(2)}$、$I=(2)$、$U=\mathbb{Q}$とすると$U=IU$だが、$r-1\in I$なら$r\neq 0$なので$r\mathbb{Q}\neq 0$である。
  target: |
    ∀ (R M : Type*) [CommRing R] [AddCommGroup M] [Module R M] (I : Ideal R) (N : Submodule R M), N.FG → N ≤ I • N → ∃ r : R, r - 1 ∈ I ∧ ∀ n ∈ N, r • n = 0
  proof: |
    by
      intro R M _ _ _ I N hN h
      exact Submodule.exists_sub_one_mem_and_smul_eq_zero_of_fg_of_le_smul I N hN h
- id: fg_idempotent_ideal_generated_by_idempotent
  kind: gap
  level: 4
  topic: 可換環論・冪等イデアル
  statement: $R$を可換環、$I$を$R$の有限生成イデアルとする。$I^2=I$であることと、$e^2=e$をみたす$e\in R$により$I=(e)$と書けることは同値である。
  statement_en: A finitely generated ideal I of a commutative ring satisfies I^2 = I if and only if I = (e) for some element e with e^2 = e.
  assumptions:
  - $R$は可換環
  - $I$は$R$の有限生成イデアル
  quantifiers:
  - 任意の可換環$R$と有限生成イデアル$I$
  conclusion: $I^2=I$は、$e^2=e$をみたす$e$により$I=(e)$と書けることと同値である。
  answer: |
    $R$を可換環、$I$を有限生成イデアルとする。$I=(e)$、$e^2=e$なら、$I^2=(e^2)=(e)=I$である。
    逆に$I^2=I$とする。$I$を$u_1,\ldots,u_k$で生成すると、$I=I\cdot I$より$u_i=\sum_ja_{ij}u_j$($a_{ij}\in I$)と書ける。行列$E-(a_{ij})$の行列式を$r$とおくと、余因子行列をかけてすべての$j$で$ru_j=0$となり、$r\equiv 1\pmod I$である。
    $e=1-r\in I$とおく。$y\in I$なら$ry=0$なので$ey=y$である。よって$I\subseteq(e)$であり、$e\in I$と合わせて$I=(e)$である。$y=e$とすると$e^2=e$である。
  strategy: Use the determinant trick on I = I · I to obtain an element acting as the identity on I.
  sketch:
  - 'derive: If I = (e) with e idempotent, then I^2 = I.'
  - 'setup: Conversely write the generators of I as combinations with coefficients in I.'
  - 'derive: The determinant trick gives r congruent to 1 mod I with rI = 0.'
  - 'construct: Put e = 1 - r, which lies in I and acts as the identity on I.'
  - 'conclude: Thus I = (e) and e^2 = e.'
  openmath: (forall (A I) (-> (and (comm_ring A) (ideal_of I A) (finitely_generated_ideal I)) (<-> (= (ideal_product I I) I) (exists (e) (and (in e A) (= (* e e) e) (= I (principal_ideal e)))))))
  hard_negative:
    statement: 有限生成でないイデアル$I$でも、$I^2=I$なら冪等元で生成される。
    reason: 体$k$上の整域$k[x^{1/2^n}\mid n\geq 0]$で$I=(x^{1/2^n}\mid n\geq 0)$は$I^2=I$をみたすが、整域の冪等元は$0,1$だけで、$I$は$0$でも全体でもない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R), I.FG → (I * I = I ↔ ∃ e : R, e * e = e ∧ I = Ideal.span ({e} : Set R))
  proof: |
    by
      intro R _ I hI
      exact Ideal.isIdempotentElem_iff_of_fg I hI
- id: radical_sum_of_radicals
  kind: gap
  level: 3
  topic: 可換環論・イデアルの根基
  statement: $R$を可換環、$I,J$を$R$のイデアルとする。$\sqrt{I+J}=\sqrt{\sqrt{I}+\sqrt{J}}$である。
  statement_en: For ideals I and J of a commutative ring, the radical of I + J equals the radical of rad(I) + rad(J).
  assumptions:
  - $R$は可換環
  - $I,J$は$R$のイデアル
  quantifiers:
  - 任意の可換環$R$とイデアル$I,J$
  conclusion: $\sqrt{I+J}=\sqrt{\sqrt{I}+\sqrt{J}}$である。
  answer: |
    $R$を可換環、$I,J$を$R$のイデアルとする。$I\subseteq\sqrt{I}$、$J\subseteq\sqrt{J}$より$I+J\subseteq\sqrt{I}+\sqrt{J}$であり、根基は包含を保つので$\sqrt{I+J}\subseteq\sqrt{\sqrt{I}+\sqrt{J}}$を得る。
    逆に、$I\subseteq I+J$より$\sqrt{I}\subseteq\sqrt{I+J}$、同様に$\sqrt{J}\subseteq\sqrt{I+J}$である。よって$\sqrt{I}+\sqrt{J}\subseteq\sqrt{I+J}$であり、両辺の根基をとると$\sqrt{\sqrt{I}+\sqrt{J}}\subseteq\sqrt{\sqrt{I+J}}$となる。
    最後に、任意のイデアル$A$で$\sqrt{\sqrt{A}}=\sqrt{A}$である。実際、$x^n\in\sqrt{A}$なら$x^{nm}=(x^n)^m\in A$となる$m$があり、$x\in\sqrt{A}$である。したがって2つのイデアルは一致する。
  strategy: Use monotonicity of the radical in both directions together with idempotence of the radical.
  sketch:
  - 'derive: I + J lies in rad(I) + rad(J), so its radical lies in the radical of rad(I) + rad(J).'
  - 'derive: rad(I) and rad(J) lie in rad(I + J), hence so does their sum.'
  - 'derive: The radical is idempotent, since a power of a power is a power.'
  - 'conclude: Both inclusions give the equality.'
  openmath: (forall (A I J) (-> (and (comm_ring A) (ideal_of I A) (ideal_of J A)) (= (ideal_radical (ideal_sum I J)) (ideal_radical (ideal_sum (ideal_radical I) (ideal_radical J))))))
  hard_negative:
    statement: 可換環のイデアル$I,J$について$\sqrt{I+J}=\sqrt{I\cap J}$である。
    reason: $\mathbb{Z}$で$I=(2)$、$J=(3)$とすると、$I+J=\mathbb{Z}$なので左辺は$\mathbb{Z}$であるが、$I\cap J=(6)$なので右辺は$(6)$である。
  target: |
    ∀ (R : Type*) [CommRing R] (I J : Ideal R), (I ⊔ J).radical = (I.radical ⊔ J.radical).radical
  proof: |
    by
      intro R _ I J
      exact Ideal.radical_sup I J
- id: radical_eq_unit_ideal_iff
  kind: gap
  level: 3
  topic: 可換環論・イデアルの根基
  statement: $R$を可換環、$I$を$R$のイデアルとする。$\sqrt{I}=R$であることと$I=R$であることは同値である。
  statement_en: For an ideal I of a commutative ring R, rad(I) = R if and only if I = R.
  assumptions:
  - $R$は可換環
  - $I$は$R$のイデアル
  quantifiers:
  - 任意の可換環$R$とイデアル$I$
  conclusion: $\sqrt{I}=R\iff I=R$である。
  answer: |
    $R$を可換環、$I$を$R$のイデアルとする。$I=R$なら$R\subseteq\sqrt{I}$なので$\sqrt{I}=R$である。
    逆に$\sqrt{I}=R$とする。$1\in\sqrt{I}$なので、ある自然数$n$で$1^n\in I$である。$1^n=1$だから$1\in I$となり、$I=R$である。
  strategy: 'Test the unit element: a power of 1 is 1.'
  sketch:
  - 'derive: If I = R then rad(I) contains I and is R.'
  - 'setup: If rad(I) = R then 1 lies in rad(I).'
  - 'conclude: So 1 = 1^n lies in I and I = R.'
  openmath: (forall (A I) (-> (and (comm_ring A) (ideal_of I A)) (<-> (= (ideal_radical I) (unit_ideal A)) (= I (unit_ideal A)))))
  hard_negative:
    statement: 可換環のイデアル$I,J$について$\sqrt{I}=\sqrt{J}$なら$I=J$である。
    reason: $\mathbb{Z}$で$I=(4)$、$J=(2)$とすると、どちらの根基も$(2)$であるが$I\neq J$である。単位イデアルでは等式が成り立つが、一般のイデアルでは成り立たない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R), I.radical = ⊤ ↔ I = ⊤
  proof: |
    by
      intro R _ I
      exact Ideal.radical_eq_top
- id: radical_of_ideal_power
  kind: gap
  level: 3
  topic: 可換環論・イデアルの根基
  statement: $R$を可換環、$I$を$R$のイデアル、$n\geq 1$を整数とする。$\sqrt{I^n}=\sqrt{I}$である。
  statement_en: For an ideal I of a commutative ring and an integer n ≥ 1, the radical of I^n equals the radical of I.
  assumptions:
  - $R$は可換環
  - $I$は$R$のイデアル
  - $n\geq 1$
  quantifiers:
  - 任意の可換環$R$、イデアル$I$、整数$n\geq 1$
  conclusion: $\sqrt{I^n}=\sqrt{I}$である。
  answer: |
    $R$を可換環、$I$を$R$のイデアル、$n\geq 1$を整数とする。$n\geq 1$より$I^n\subseteq I$なので、$\sqrt{I^n}\subseteq\sqrt{I}$である。
    逆に$x\in\sqrt{I}$とし、$x^m\in I$となる自然数$m$をとる。すると$x^{mn}=(x^m)^n\in I^n$なので$x\in\sqrt{I^n}$である。よって両者は一致する。
  strategy: Use I^n ⊆ I for one inclusion and raise a power in I to the n-th power for the other.
  sketch:
  - 'derive: Since n ≥ 1, I^n lies in I, so rad(I^n) lies in rad(I).'
  - 'setup: Take x with x^m in I.'
  - 'derive: Then x^(mn) = (x^m)^n lies in I^n.'
  - 'conclude: Hence rad(I) lies in rad(I^n).'
  openmath: (forall (A I n) (-> (and (comm_ring A) (ideal_of I A) (in n N) (>= n 1)) (= (ideal_radical (ideal_power I n)) (ideal_radical I))))
  hard_negative:
    statement: 可換環のイデアル$I$と任意の自然数$n$について$\sqrt{I^n}=\sqrt{I}$である（$n=0$を含む）。
    reason: $n=0$では$I^0=R$なので左辺は$R$である。$I=(2)\subset\mathbb{Z}$なら右辺は$(2)$であり、等式は成り立たない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R) (n : ℕ), n ≠ 0 → (I ^ n).radical = I.radical
  proof: |
    by
      intro R _ I n hn
      exact Ideal.radical_pow I hn
- id: radical_finite_intersection
  kind: gap
  level: 3
  topic: 可換環論・イデアルの根基
  statement: $R$を可換環、$(F_i)_{i\in s}$を$R$のイデアルの有限族とする。$\sqrt{\bigcap_{i\in s}F_i}=\bigcap_{i\in s}\sqrt{F_i}$である。ただし空な族の共通部分は$R$とする。これは2イデアルの等式$\sqrt{I\cap J}=\sqrt{I}\cap\sqrt{J}$を有限族へ一般化した形である。
  statement_en: For a finite family of ideals F_i of a commutative ring R, the radical of the intersection equals the intersection of the radicals, the empty intersection being R. This generalizes the two-ideal identity to finite families.
  assumptions:
  - $R$は可換環
  - $s$は有限な添字集合
  - 各$F_i$は$R$のイデアル
  - 空な族の共通部分は$R$
  quantifiers:
  - 任意の可換環$R$とイデアルの有限族$(F_i)_{i\in s}$
  conclusion: $\sqrt{\bigcap_{i\in s}F_i}=\bigcap_{i\in s}\sqrt{F_i}$である。
  answer: |
    $R$を可換環、$(F_i)_{i\in s}$を$R$のイデアルの有限族とする。各$i$で$\bigcap_{j}F_j\subseteq F_i$なので、左辺は右辺に含まれる（$s$が空なら両辺とも$R$である）。
    逆に$x\in\bigcap_{i\in s}\sqrt{F_i}$とする。$s$は空でないとしてよい。各$i\in s$で$x^{m_i}\in F_i$となる$m_i$をとり、$m=\max_{i\in s}m_i$とおく。$m\geq m_i$なので$x^m=x^{m-m_i}x^{m_i}\in F_i$がすべての$i\in s$で成り立つ。よって$x^m\in\bigcap_{i\in s}F_i$であり、$x$は左辺に属する。
  strategy: Take a common exponent, which exists because the family is finite.
  sketch:
  - 'derive: The intersection lies in each F_i, so the left side lies in the right side.'
  - 'setup: Take x with x^(m_i) in F_i for each i.'
  - 'derive: With m the maximum of the m_i, x^m lies in every F_i.'
  - 'conclude: So x lies in the radical of the intersection.'
  openmath: (forall (A F s) (-> (and (comm_ring A) (finite_set s) (forall (i) (-> (in i s) (ideal_of (family_value F i) A)))) (forall (x) (<-> (in x (ideal_radical (ideal_family_inf_over F s))) (forall (i) (-> (in i s) (in x (ideal_radical (family_value F i)))))))))
  hard_negative:
    statement: 可換環のイデアルの無限族$(F_i)$についても$\sqrt{\bigcap_iF_i}=\bigcap_i\sqrt{F_i}$である。
    reason: $\mathbb{Z}$で$F_k=(2^k)$（$k\geq 1$）とすると、各$\sqrt{F_k}=(2)$なので右辺は$(2)$である。一方$\bigcap_kF_k=0$なので左辺は$0$である。共通の指数がとれないことが原因である。
  target: |
    ∀ (R ι : Type*) [CommRing R] (s : Finset ι) (F : ι → Ideal R), (s.inf F).radical = s.inf (fun i => (F i).radical)
  proof: |
    by
      intro R ι _ s F
      classical
      induction s using Finset.induction_on with
      | empty => simp
      | insert a s _ ih => rw [Finset.inf_insert, Finset.inf_insert, Ideal.radical_inf, ih]
- id: radical_preimage
  kind: gap
  level: 3
  topic: 可換環論・イデアルの根基
  statement: $f:R\to S$を単位元を保つ可換環の準同型、$K$を$S$のイデアルとする。$f^{-1}(\sqrt{K})=\sqrt{f^{-1}(K)}$である。
  statement_en: For a unital homomorphism f from R to S of commutative rings and an ideal K of S, the preimage of rad(K) is the radical of the preimage of K.
  assumptions:
  - $R,S$は可換環
  - $f:R\to S$は単位元を保つ環準同型
  - $K$は$S$のイデアル
  quantifiers:
  - 任意の環準同型$f$と$S$のイデアル$K$
  conclusion: $f^{-1}(\sqrt{K})=\sqrt{f^{-1}(K)}$である。
  answer: |
    $f:R\to S$を単位元を保つ可換環の準同型、$K$を$S$のイデアルとする。$x\in R$について次の同値が成り立つ。$x\in f^{-1}(\sqrt{K})$であることは、ある$n$で$f(x)^n\in K$であることと同じである。$f(x)^n=f(x^n)$なので、これはある$n$で$x^n\in f^{-1}(K)$であること、すなわち$x\in\sqrt{f^{-1}(K)}$であることと同じである。
  strategy: Unfold both memberships and use that f preserves powers.
  sketch:
  - 'setup: Take x in R.'
  - 'translate: x lies in the preimage of rad(K) iff f(x)^n lies in K for some n.'
  - 'derive: f(x)^n = f(x^n), so this says x^n lies in the preimage of K.'
  - 'conclude: The two ideals have the same elements.'
  openmath: (forall (A B f K) (-> (and (comm_ring A) (comm_ring B) (ring_hom f A B) (ideal_of K B)) (= (ideal_comap f (ideal_radical K)) (ideal_radical (ideal_comap f K)))))
  hard_negative:
    statement: 環準同型$f:R\to S$と$R$のイデアル$I$について、$\sqrt{I}$の拡大は$I$の拡大の根基に等しい。
    reason: $\mathbb{Z}\to\mathbb{Z}[i]$で$I=(2)$とする。$\sqrt{I}=(2)$の拡大は$2\mathbb{Z}[i]$である。一方$2=-i(1+i)^2$より$1+i$は$2\mathbb{Z}[i]$の根基に入るが、$1+i\notin 2\mathbb{Z}[i]$である。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] (f : R →+* S) (K : Ideal S), (K.radical).comap f = (K.comap f).radical
  proof: |
    by
      intro R S _ _ f K
      exact Ideal.comap_radical f K
- id: prime_contains_finite_product
  kind: gap
  level: 3
  topic: 可換環論・素イデアル
  statement: $R$を可換環、$P$を素イデアル、$(F_i)_{i\in s}$を$R$のイデアルの有限族とする。$\prod_{i\in s}F_i\subseteq P$であることと、ある$i\in s$で$F_i\subseteq P$であることは同値である。ただし空な積は$R$とする。これは2個の積についての補題を有限族へ一般化した形である。
  statement_en: Let P be a prime ideal of a commutative ring R and F_i a finite family of ideals, the empty product being R. The product of the F_i lies in P if and only if some F_i lies in P. This generalizes the two-factor lemma.
  assumptions:
  - $R$は可換環
  - $P$は素イデアル
  - $s$は有限な添字集合
  - 各$F_i$はイデアル
  - 空な積は$R$
  quantifiers:
  - 任意の可換環$R$、素イデアル$P$、イデアルの有限族$(F_i)_{i\in s}$
  conclusion: $\prod_{i\in s}F_i\subseteq P\iff\exists i\in s,\ F_i\subseteq P$である。
  answer: |
    $R$を可換環、$P$を素イデアル、$(F_i)_{i\in s}$をイデアルの有限族とする。ある$i\in s$で$F_i\subseteq P$なら、$\prod_{j\in s}F_j\subseteq F_i\subseteq P$である。
    逆を対偶で示す。すべての$i\in s$で$F_i\not\subseteq P$とし、$x_i\in F_i\setminus P$を選ぶ。$P$は素イデアルで$1\notin P$なので、有限個の$P$の外の元の積$x=\prod_{i\in s}x_i$は$P$に属さない（$s$が空なら$x=1$である）。一方$x\in\prod_{i\in s}F_i$なので、$\prod_{i\in s}F_i\not\subseteq P$である。
  strategy: Choose elements outside P in each factor and multiply them.
  sketch:
  - 'derive: If F_i lies in P, the product, which lies in F_i, lies in P.'
  - 'setup: Otherwise pick x_i in F_i outside P for each i.'
  - 'derive: Their product is outside P because P is prime and proper.'
  - 'conclude: That product lies in the product ideal, so the product ideal is not in P.'
  openmath: (forall (A F s p) (-> (and (comm_ring A) (finite_set s) (prime_ideal p A) (forall (i) (-> (in i s) (ideal_of (family_value F i) A)))) (<-> (subset (ideal_family_prod_over F s) p) (exists (i) (and (in i s) (subset (family_value F i) p))))))
  hard_negative:
    statement: 可換環のイデアル$P$が$F_1F_2\subseteq P$を満たせば、$P$が素でなくても$F_1\subseteq P$または$F_2\subseteq P$である。
    reason: $\mathbb{Z}$で$P=(6)$、$F_1=(2)$、$F_2=(3)$とすると$F_1F_2=P$であるが、$F_1,F_2$はどちらも$P$に含まれない。
  target: |
    ∀ (R ι : Type*) [CommRing R] (s : Finset ι) (F : ι → Ideal R) (P : Ideal R), P.IsPrime → (s.prod F ≤ P ↔ ∃ i ∈ s, F i ≤ P)
  proof: |
    by
      intro R ι _ s F P hP
      exact hP.prod_le
- id: power_of_fg_ideal_in_radical
  kind: gap
  level: 3
  topic: 可換環論・根基と冪
  statement: $R$を可換環、$I,J$をイデアルとし、$I$は有限生成で$I\subseteq\sqrt{J}$とする。このときある自然数$n$で$I^n\subseteq J$である。これはネーター環の$\sqrt{I}$の冪についての補題を、有限生成性だけを仮定する形へ一般化したものである。
  statement_en: If I is a finitely generated ideal of a commutative ring and I lies in the radical of an ideal J, then I^n lies in J for some n. This generalizes the corresponding Noetherian statement about a power of the radical.
  assumptions:
  - $R$は可換環
  - $I,J$はイデアル
  - $I$は有限生成
  - $I\subseteq\sqrt{J}$
  quantifiers:
  - 任意の可換環$R$とイデアル$I,J$
  conclusion: ある自然数$n$で$I^n\subseteq J$である。
  answer: |
    $R$を可換環、$I=(a_1,\dots,a_r)$を有限生成イデアル、$J$をイデアルとし、$I\subseteq\sqrt{J}$とする。各$k$で$a_k^{m_k}\in J$となる$m_k\geq 1$をとり、$n=\sum_{k=1}^{r}m_k$とおく（$r=0$なら$I=0$なので$n=1$をとればよい）。
    $I^n$の元は、$a_1^{e_1}\cdots a_r^{e_r}$（$e_1+\dots+e_r=n$）の$R$係数の和である。もしすべての$k$で$e_k<m_k$なら$\sum_ke_k<n$となって矛盾するので、ある$k$で$e_k\geq m_k$である。このとき$a_k^{e_k}\in J$なので、その単項式は$J$に属する。よって$I^n\subseteq J$である。
  strategy: Take exponents for the generators and apply the pigeonhole principle to monomials of degree n.
  sketch:
  - 'setup: Write I = (a_1, ..., a_r) and choose m_k with a_k^(m_k) in J.'
  - 'construct: Let n be the sum of the m_k.'
  - 'derive: I^n is spanned by monomials of total degree n in the a_k.'
  - 'derive: By pigeonhole each monomial has e_k ≥ m_k for some k, so it lies in J.'
  - 'conclude: Hence I^n lies in J.'
  openmath: (forall (A I J) (-> (and (comm_ring A) (ideal_of I A) (ideal_of J A) (finitely_generated_ideal I) (subset I (ideal_radical J))) (exists (n) (and (in n N) (subset (ideal_power I n) J)))))
  hard_negative:
    statement: 可換環のイデアル$I,J$が$I\subseteq\sqrt{J}$を満たせば、$I$が有限生成でなくてもある$n$で$I^n\subseteq J$である。
    reason: 体$k$上の$R=k[x_1,x_2,\dots]/(x_i^i:i\geq 1)$で$I=(x_1,x_2,\dots)$、$J=0$とする。各$x_i$は冪零なので$I\subseteq\sqrt{0}$である。しかし任意の$n$で$x_{n+1}^n\neq 0$なので$I^n\neq 0$である。
  target: |
    ∀ (R : Type*) [CommRing R] (I J : Ideal R), I.FG → I ≤ J.radical → ∃ n : ℕ, I ^ n ≤ J
  proof: |
    by
      intro R _ I J hI h
      exact Ideal.exists_pow_le_of_le_radical_of_fg h hI
- id: extension_contraction_stable
  kind: gap
  level: 3
  topic: 可換環論・イデアルの拡大と縮約
  statement: $f:R\to S$を単位元を保つ可換環の準同型とする。$R$のイデアル$I$の拡大を$I^e=f(I)S$、$S$のイデアル$K$の縮約を$K^c=f^{-1}(K)$と書く。このとき$I\subseteq I^{ec}$、$K^{ce}\subseteq K$、$I^{ece}=I^e$、$K^{cec}=K^c$である。
  statement_en: For a unital homomorphism f from R to S of commutative rings, with I^e the ideal generated by f(I) and K^c the preimage of K, one has I ⊆ I^ec, K^ce ⊆ K, I^ece = I^e and K^cec = K^c.
  assumptions:
  - $R,S$は可換環
  - $f:R\to S$は単位元を保つ環準同型
  - $I$は$R$のイデアル
  - $K$は$S$のイデアル
  quantifiers:
  - 任意の環準同型$f$、$R$のイデアル$I$、$S$のイデアル$K$
  conclusion: $I\subseteq I^{ec}$、$K^{ce}\subseteq K$、$I^{ece}=I^e$、$K^{cec}=K^c$である。
  answer: |
    $f:R\to S$を単位元を保つ可換環の準同型、$I$を$R$のイデアル、$K$を$S$のイデアルとする。$x\in I$なら$f(x)\in I^e$なので$x\in I^{ec}$であり、$I\subseteq I^{ec}$である。$K^{ce}$は$f(f^{-1}(K))\subseteq K$で生成されるので$K^{ce}\subseteq K$である。
    拡大と縮約はどちらも包含を保つ。$I\subseteq I^{ec}$の拡大をとると$I^e\subseteq I^{ece}$である。$K^{ce}\subseteq K$で$K=I^e$とすると$I^{ece}\subseteq I^e$である。よって$I^{ece}=I^e$である。
    同様に、$I\subseteq I^{ec}$で$I=K^c$とすると$K^c\subseteq K^{cec}$であり、$K^{ce}\subseteq K$の縮約をとると$K^{cec}\subseteq K^c$である。よって$K^{cec}=K^c$である。
  strategy: Prove the two inclusions directly and derive the two equalities from them by monotonicity.
  sketch:
  - 'derive: x in I has f(x) in I^e, so I lies in I^ec.'
  - 'derive: K^ce is generated by a subset of K, so it lies in K.'
  - 'derive: Extending the first inclusion and specializing the second gives I^ece = I^e.'
  - 'derive: Specializing the first and contracting the second gives K^cec = K^c.'
  - 'conclude: All four claims hold.'
  openmath: (forall (A B f I K) (-> (and (comm_ring A) (comm_ring B) (ring_hom f A B) (ideal_of I A) (ideal_of K B)) (and (subset I (ideal_comap f (ideal_map f I))) (subset (ideal_map f (ideal_comap f K)) K) (= (ideal_map f (ideal_comap f (ideal_map f I))) (ideal_map f I)) (= (ideal_comap f (ideal_map f (ideal_comap f K))) (ideal_comap f K)))))
  hard_negative:
    statement: 環準同型$f$と$R$のイデアル$I$について$I^{ec}=I$である。
    reason: $\mathbb{Z}\subset\mathbb{Q}$で$I=(2)$とすると、$I^e=\mathbb{Q}$なので$I^{ec}=\mathbb{Z}\neq I$である。包含$I\subseteq I^{ec}$は等号とは限らない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] (f : R →+* S) (I : Ideal R) (K : Ideal S), I ≤ (I.map f).comap f ∧ (K.comap f).map f ≤ K ∧ ((I.map f).comap f).map f = I.map f ∧ ((K.comap f).map f).comap f = K.comap f
  proof: |
    by
      intro R S _ _ f I K
      exact ⟨Ideal.le_comap_map, Ideal.map_comap_le, Ideal.map_comap_map f I, Ideal.comap_map_comap f K⟩
- id: local_iff_nonunits_closed_under_add
  kind: gap
  level: 3
  topic: 可換環論・局所環
  statement: $R$を単位元をもつ零環でない可換環とする。$R$の極大イデアルがただ1つであることと、$R$の非単元の和がつねに非単元であることは同値である。
  statement_en: A nonzero commutative ring R has exactly one maximal ideal if and only if a sum of two nonunits of R is always a nonunit.
  assumptions:
  - $R$は零環でない可換環
  quantifiers:
  - 任意の零環でない可換環$R$
  conclusion: 極大イデアルがただ1つであることと、非単元の和が非単元であることは同値である。
  answer: |
    $R$を零環でない可換環とする。極大イデアルがただ1つであるとし、それを$\mathfrak{m}$とおく。非単元$a$は真のイデアル$(a)$を生成するので、$(a)$を含む極大イデアルがある。それは$\mathfrak{m}$であるから$a\in\mathfrak{m}$である。また$\mathfrak{m}$の元は単元でない。よって非単元全体は$\mathfrak{m}$に一致し、和で閉じている。
    逆に非単元の和が非単元であるとし、非単元全体を$\mathfrak{n}$とおく。$R$は零環でないので$0\in\mathfrak{n}$である。$a\in\mathfrak{n}$、$r\in R$について、$ra$が単元なら$a$も単元となるので$ra\in\mathfrak{n}$である。仮定と合わせて$\mathfrak{n}$はイデアルであり、$1\notin\mathfrak{n}$より真のイデアルである。真のイデアルの元はすべて非単元なので、すべての真のイデアルは$\mathfrak{n}$に含まれる。よって$\mathfrak{n}$はただ1つの極大イデアルである。
  strategy: Show that the nonunits form the unique maximal ideal in each direction.
  sketch:
  - 'derive: A nonunit generates a proper ideal, which lies in a maximal ideal.'
  - 'conclude: If m is the only maximal ideal, the nonunits are exactly m, so they are closed under addition.'
  - 'setup: Conversely let n be the set of nonunits.'
  - 'derive: n contains 0, is closed under addition by hypothesis and under multiplication by R.'
  - 'derive: Every proper ideal consists of nonunits, so it lies in n.'
  - 'conclude: Hence n is the unique maximal ideal.'
  openmath: (forall (A) (-> (and (comm_ring A) (nontrivial_ring A)) (<-> (local_ring A) (forall (a b) (-> (and (in a A) (in b A) (not (unit_element a A)) (not (unit_element b A))) (not (unit_element (+ a b) A)))))))
  hard_negative:
    statement: 零環でない可換環で、非単元の積がつねに非単元なら局所環である。
    reason: 可換環では$ab$が単元なら$a,b$も単元なので、非単元の積はつねに非単元である。しかし$\mathbb{Z}$は$(2)$と$(3)$という2つの極大イデアルをもち、局所環でない。
  target: |
    ∀ (R : Type*) [CommRing R] [Nontrivial R], (∃! m : Ideal R, m.IsMaximal) ↔ ∀ a b : R, a ∈ nonunits R → b ∈ nonunits R → a + b ∈ nonunits R
  proof: |
    by
      intro R _ _
      constructor
      · intro h
        have : IsLocalRing R := IsLocalRing.of_unique_max_ideal h
        exact fun a b ha hb => IsLocalRing.nonunits_add ha hb
      · intro h
        have : IsLocalRing R := IsLocalRing.of_nonunits_add h
        exact ⟨IsLocalRing.maximalIdeal R, IsLocalRing.maximalIdeal.isMaximal R, fun m hm => IsLocalRing.eq_maximalIdeal hm⟩
- id: prime_contains_minimal_prime
  kind: textbook
  level: 3
  topic: 可換環論・極小素イデアル
  statement: $R$を可換環、$I$をイデアル、$P$を$I$を含む素イデアルとする。このとき$I$上の極小素イデアル$Q$で$Q\subseteq P$となるものが存在する。ここで$I$上の極小素イデアルとは、$I$を含む素イデアルのうち包含について極小なものをいう。
  statement_en: Let I be an ideal of a commutative ring and P a prime ideal containing I. Then P contains a prime ideal minimal among the primes containing I.
  assumptions:
  - $R$は可換環
  - $I$はイデアル
  - $P$は素イデアル
  - $I\subseteq P$
  quantifiers:
  - 任意の可換環$R$、イデアル$I$、$I$を含む素イデアル$P$
  conclusion: $I$上の極小素イデアル$Q$で$Q\subseteq P$となるものがある。
  answer: |
    $R$を可換環、$I$をイデアル、$P$を$I$を含む素イデアルとする。$I\subseteq Q\subseteq P$を満たす素イデアル$Q$全体を$\Sigma$とし、逆向きの包含で順序を入れる。$P\in\Sigma$なので$\Sigma$は空でない。
    $\Sigma$の空でない全順序部分集合$(Q_\alpha)$をとり、$Q_\infty=\bigcap_\alpha Q_\alpha$とおく。$I\subseteq Q_\infty\subseteq P$であり、$1\notin Q_\infty$である。$ab\in Q_\infty$かつ$a\notin Q_\infty$とし、$a\notin Q_\beta$となる$\beta$をとる。$Q_\alpha\subseteq Q_\beta$なら$a\notin Q_\alpha$なので$b\in Q_\alpha$である。$Q_\beta\subseteq Q_\alpha$なら$b\in Q_\beta\subseteq Q_\alpha$である。全順序なので$b\in Q_\infty$となり、$Q_\infty$は素イデアルで$\Sigma$に属する。
    ツォルンの補題より$\Sigma$は包含について極小な元$Q$をもつ。$I\subseteq Q'\subseteq Q$を満たす素イデアル$Q'$は$\Sigma$に属するので$Q'=Q$である。よって$Q$は$I$上の極小素イデアルで$Q\subseteq P$である。
  strategy: Apply Zorn's lemma to the primes between I and P ordered by reverse inclusion.
  sketch:
  - 'setup: Let Σ be the set of primes Q with I ⊆ Q ⊆ P, ordered by reverse inclusion.'
  - 'derive: The intersection of a chain of primes in Σ is prime and contains I.'
  - 'apply_theorem: Zorn''s lemma gives a minimal element Q of Σ.'
  - 'derive: A prime between I and Q lies in Σ, so it equals Q.'
  - 'conclude: Q is minimal over I and lies in P.'
  openmath: (forall (A I p) (-> (and (comm_ring A) (ideal_of I A) (prime_ideal p A) (subset I p)) (exists (q) (and (minimal_prime_over q I) (subset q p)))))
  hard_negative:
    statement: 可換環のイデアル$I$と$I$を含む素イデアル$P$について、$P$に含まれる$I$上の極小素イデアルはただ1つである。
    reason: 体$k$上の$R=k[x,y]/(xy)$で$I=0$、$P=(x,y)$とすると、$(x)$と$(y)$はどちらも$P$に含まれる極小素イデアルであり、互いに異なる。
  target: |
    ∀ (R : Type*) [CommRing R] (I P : Ideal R), P.IsPrime → I ≤ P → ∃ Q ∈ I.minimalPrimes, Q ≤ P
  proof: |
    by
      intro R _ I P hP h
      exact Ideal.exists_minimalPrimes_le h
- id: radical_eq_inter_minimal_primes
  kind: gap
  level: 3
  topic: 可換環論・極小素イデアル
  statement: $R$を可換環、$I$をイデアルとする。$\sqrt{I}$は$I$上の極小素イデアル全体の共通部分に等しい。ただし$I=R$のときは極小素イデアルがなく、空な共通部分を$R$とする。
  statement_en: For an ideal I of a commutative ring R, rad(I) is the intersection of the primes minimal over I, the empty intersection being R when I = R.
  assumptions:
  - $R$は可換環
  - $I$はイデアル
  - 空な共通部分は$R$
  quantifiers:
  - 任意の可換環$R$とイデアル$I$
  conclusion: $\sqrt{I}$は$I$上の極小素イデアル全体の共通部分に等しい。
  answer: |
    $R$を可換環、$I$をイデアルとする。$\sqrt{I}$は$I$を含む素イデアル全体の共通部分に等しい（$I=R$なら空な共通部分で$R$である）。$I$上の極小素イデアルは$I$を含む素イデアルなので、$\sqrt{I}$は極小素イデアル全体の共通部分に含まれる。
    逆に、$x$がすべての$I$上の極小素イデアルに属するとする。$P$を$I$を含む素イデアルとすると、ツォルンの補題により$Q\subseteq P$となる$I$上の極小素イデアル$Q$がある。$x\in Q\subseteq P$であるから、$x$は$I$を含むすべての素イデアルに属し、$x\in\sqrt{I}$である。
  strategy: Compare with the description of the radical as the intersection of all primes containing I.
  sketch:
  - 'apply_theorem: rad(I) is the intersection of all primes containing I.'
  - 'derive: Minimal primes over I are among them, which gives one inclusion.'
  - 'apply_theorem: Each prime containing I contains a minimal prime over I.'
  - 'conclude: So intersecting over minimal primes gives the same ideal.'
  openmath: (forall (A I) (-> (and (comm_ring A) (ideal_of I A)) (forall (x) (-> (in x A) (<-> (in x (ideal_radical I)) (forall (q) (-> (minimal_prime_over q I) (in x q))))))))
  hard_negative:
    statement: 可換環のイデアル$I$は、$I$上の極小素イデアル全体の共通部分に等しい。
    reason: $\mathbb{Z}$で$I=(4)$とすると、$I$上の極小素イデアルは$(2)$だけであり、共通部分は$(2)\neq(4)$である。等しいのは$I$の根基である。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R), sInf I.minimalPrimes = I.radical
  proof: |
    by
      intro R _ I
      exact Ideal.sInf_minimalPrimes
- id: zero_locus_sum_product
  kind: gap
  level: 3
  topic: 可換環論・素スペクトラム
  statement: $R$を可換環、$I,J$をイデアルとする。$\operatorname{Spec}R$の閉集合について$V(I+J)=V(I)\cap V(J)$、$V(IJ)=V(I\cap J)=V(I)\cup V(J)$である。
  statement_en: For ideals I and J of a commutative ring, V(I + J) = V(I) ∩ V(J) and V(IJ) = V(I ∩ J) = V(I) ∪ V(J) in the prime spectrum.
  assumptions:
  - $R$は可換環
  - $I,J$はイデアル
  - $V(A)$は$A$を含む素イデアル全体
  quantifiers:
  - 任意の可換環$R$とイデアル$I,J$
  conclusion: $V(I+J)=V(I)\cap V(J)$、$V(IJ)=V(I\cap J)=V(I)\cup V(J)$である。
  answer: |
    $R$を可換環、$I,J$をイデアルとし、$\mathfrak{p}$を素イデアルとする。$I+J\subseteq\mathfrak{p}$であることは$I\subseteq\mathfrak{p}$かつ$J\subseteq\mathfrak{p}$であることと同じなので、$V(I+J)=V(I)\cap V(J)$である。
    $IJ\subseteq I\cap J\subseteq I$（$J$についても同様）より$V(I)\cup V(J)\subseteq V(I\cap J)\subseteq V(IJ)$である。$\mathfrak{p}\in V(IJ)$なら、$\mathfrak{p}$は素イデアルなので$I\subseteq\mathfrak{p}$または$J\subseteq\mathfrak{p}$である。よって$V(IJ)\subseteq V(I)\cup V(J)$であり、3つの集合は一致する。
  strategy: Translate each containment for a prime ideal, using primality for products.
  sketch:
  - 'derive: A prime contains I + J iff it contains both I and J.'
  - 'derive: IJ ⊆ I ∩ J ⊆ I, J gives V(I) ∪ V(J) ⊆ V(I ∩ J) ⊆ V(IJ).'
  - 'derive: A prime containing IJ contains I or J.'
  - 'conclude: The three sets agree.'
  openmath: (forall (A I J) (-> (and (comm_ring A) (ideal_of I A) (ideal_of J A)) (and (= (spectrum_zero_locus (ideal_sum I J)) (inter (spectrum_zero_locus I) (spectrum_zero_locus J))) (= (spectrum_zero_locus (ideal_product I J)) (union (spectrum_zero_locus I) (spectrum_zero_locus J))) (= (spectrum_zero_locus (inter I J)) (union (spectrum_zero_locus I) (spectrum_zero_locus J))))))
  hard_negative:
    statement: 可換環のイデアル$I,J$について$V(I+J)=V(I)\cup V(J)$である。
    reason: $\mathbb{Z}$で$I=(2)$、$J=(3)$とすると、$I+J=\mathbb{Z}$なので$V(I+J)=\emptyset$である。一方$V(I)\cup V(J)=\{(2),(3)\}$である。
  target: |
    ∀ (R : Type*) [CommRing R] (I J : Ideal R), PrimeSpectrum.zeroLocus ((I ⊔ J : Ideal R) : Set R) = PrimeSpectrum.zeroLocus (I : Set R) ∩ PrimeSpectrum.zeroLocus (J : Set R) ∧ PrimeSpectrum.zeroLocus ((I * J : Ideal R) : Set R) = PrimeSpectrum.zeroLocus (I : Set R) ∪ PrimeSpectrum.zeroLocus (J : Set R) ∧ PrimeSpectrum.zeroLocus ((I ⊓ J : Ideal R) : Set R) = PrimeSpectrum.zeroLocus (I : Set R) ∪ PrimeSpectrum.zeroLocus (J : Set R)
  proof: |
    by
      intro R _ I J
      exact ⟨PrimeSpectrum.zeroLocus_sup I J, PrimeSpectrum.zeroLocus_mul I J, PrimeSpectrum.zeroLocus_inf I J⟩
- id: zero_locus_empty_iff_unit_ideal
  kind: gap
  level: 3
  topic: 可換環論・素スペクトラム
  statement: $R$を可換環、$I$をイデアルとする。$\operatorname{Spec}R$で$V(I)=\emptyset$であることと$I=R$であることは同値である。
  statement_en: For an ideal I of a commutative ring R, the closed set V(I) of the prime spectrum is empty if and only if I = R.
  assumptions:
  - $R$は可換環
  - $I$はイデアル
  quantifiers:
  - 任意の可換環$R$とイデアル$I$
  conclusion: $V(I)=\emptyset\iff I=R$である。
  answer: |
    $R$を可換環、$I$をイデアルとする。$I=R$なら、素イデアルは$1$を含まないので$I$を含む素イデアルはなく、$V(I)=\emptyset$である。
    $I\neq R$なら、$I$を含む極大イデアルがツォルンの補題により存在する。極大イデアルは素イデアルなので$V(I)\neq\emptyset$である。
  strategy: A proper ideal lies in a maximal ideal, which is prime.
  sketch:
  - 'derive: If I = R, no prime contains 1, so V(I) is empty.'
  - 'apply_theorem: If I is proper, it lies in a maximal ideal.'
  - 'conclude: That maximal ideal is a point of V(I).'
  openmath: (forall (A I) (-> (and (comm_ring A) (ideal_of I A)) (<-> (= (spectrum_zero_locus I) emptyset) (= I (unit_ideal A)))))
  hard_negative:
    statement: 可換環のイデアル$I$について、$V(I)=\operatorname{Spec}R$なら$I=0$である。
    reason: 体$k$上の$R=k[x]/(x^2)$で$I=(x)$とすると、$R$の素イデアルは$(x)$だけなので$V(I)=\operatorname{Spec}R$であるが、$I\neq 0$である。正しくは$I$が冪零根基に含まれることと同値である。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R), PrimeSpectrum.zeroLocus (I : Set R) = ∅ ↔ I = ⊤
  proof: |
    by
      intro R _ I
      exact PrimeSpectrum.zeroLocus_empty_iff_eq_top
- id: spec_vanishing_ideal_of_zero_locus
  kind: gap
  level: 3
  topic: 可換環論・素スペクトラム
  statement: $R$を可換環、$I$をイデアルとする。$\operatorname{Spec}R$の部分集合$Z$に対して$I(Z)=\bigcap_{\mathfrak{p}\in Z}\mathfrak{p}$とおくと、$I(V(I))=\sqrt{I}$である。
  statement_en: For an ideal I of a commutative ring R, the intersection of all points of V(I), that is the vanishing ideal of V(I), equals rad(I).
  assumptions:
  - $R$は可換環
  - $I$はイデアル
  - $I(Z)$は$Z$の点である素イデアルの共通部分
  quantifiers:
  - 任意の可換環$R$とイデアル$I$
  conclusion: $I(V(I))=\sqrt{I}$である。
  answer: |
    $R$を可換環、$I$をイデアルとする。$I(V(I))$は$I$を含む素イデアル全体の共通部分である（$I=R$なら空な共通部分で$R$である）。
    $x\in\sqrt{I}$なら$x^n\in I\subseteq\mathfrak{p}$（$\mathfrak{p}\in V(I)$）なので$x\in\mathfrak{p}$であり、$\sqrt{I}\subseteq I(V(I))$である。逆に$x\notin\sqrt{I}$とすると、$\{x^n\}$は$I$と交わらない乗法的集合である。$I$を含みこの集合と交わらないイデアルのうち極大なものは素イデアルであり、$x$を含まない。よって$x\notin I(V(I))$である。
  strategy: This is the description of the radical as the intersection of the primes containing the ideal.
  sketch:
  - 'derive: If x^n lies in I, then x lies in every prime containing I.'
  - 'setup: If x is outside rad(I), the powers of x form a multiplicative set disjoint from I.'
  - 'apply_theorem: An ideal maximal among those containing I and disjoint from it is prime.'
  - 'conclude: This prime contains I but not x.'
  openmath: (forall (A I x) (-> (and (comm_ring A) (ideal_of I A) (in x A)) (<-> (in x (ideal_radical I)) (forall (y) (-> (in y (spectrum_zero_locus I)) (in x (spectrum_point_ideal y)))))))
  hard_negative:
    statement: $\operatorname{Spec}R$の任意の部分集合$Z$について$V(I(Z))=Z$である。
    reason: $\operatorname{Spec}\mathbb{Z}$で$Z$を素数$p$に対する$(p)$全体とすると、$I(Z)=0$なので$V(I(Z))=\operatorname{Spec}\mathbb{Z}$は$(0)$を含むが、$(0)\notin Z$である。$V(I(Z))$は$Z$の閉包である。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R), PrimeSpectrum.vanishingIdeal (PrimeSpectrum.zeroLocus (I : Set R)) = I.radical
  proof: |
    by
      intro R _ I
      exact PrimeSpectrum.vanishingIdeal_zeroLocus_eq_radical I
- id: spec_basic_opens_form_basis
  kind: gap
  level: 3
  topic: 可換環論・素スペクトラム
  statement: $R$を可換環とする。基本開集合$D(f)=\{\mathfrak{p}\in\operatorname{Spec}R:f\notin\mathfrak{p}\}$（$f\in R$）全体は、$\operatorname{Spec}R$の位相の基底である。
  statement_en: The basic open sets D(f), for f in a commutative ring R, form a basis of the Zariski topology on Spec R.
  assumptions:
  - $R$は可換環
  quantifiers:
  - 任意の可換環$R$
  conclusion: $D(f)$（$f\in R$）全体は$\operatorname{Spec}R$の位相の基底である。
  answer: |
    $R$を可換環とする。$D(f)$は閉集合$V(\{f\})$の補集合なので開集合である。$U$を開集合、$\mathfrak{p}\in U$とする。閉集合は部分集合$s\subseteq R$により$V(s)$と書けるので、$U$の補集合を$V(s)$とする。$\mathfrak{p}\notin V(s)$より$s\not\subseteq\mathfrak{p}$なので、$f\in s\setminus\mathfrak{p}$をとれる。すると$\mathfrak{p}\in D(f)$である。$\mathfrak{q}\in D(f)$なら$s\not\subseteq\mathfrak{q}$なので$\mathfrak{q}\notin V(s)$であり、$D(f)\subseteq U$である。よって$D(f)$全体は基底である。
  strategy: Write an open set as the complement of V(s) and pick an element of s outside the given prime.
  sketch:
  - 'derive: D(f) is the complement of V({f}), so it is open.'
  - 'setup: Let U be open with complement V(s), and p a point of U.'
  - 'construct: Since p is not in V(s), choose f in s outside p.'
  - 'conclude: Then p lies in D(f), and D(f) lies in U.'
  openmath: (forall (A) (-> (comm_ring A) (topological_basis (basic_open_family A) (prime_spectrum A))))
  hard_negative:
    statement: $\operatorname{Spec}R$の開集合はすべて、ある$f\in R$により$D(f)$と書ける。
    reason: 体$k$上の$R=k[x,y]$で$U=\operatorname{Spec}R\setminus V(x,y)$とする。$U=D(f)$なら$V(f)=V(x,y)$であり、$f$は単元でなく$\sqrt{(f)}=(x,y)$である。すると$f$は$x^n$と$y^m$の両方を割るので単元となり、矛盾する。
  target: |
    ∀ (R : Type*) [CommRing R], TopologicalSpace.IsTopologicalBasis (Set.range fun r : R => (PrimeSpectrum.basicOpen r : Set (PrimeSpectrum R)))
  proof: |
    by
      intro R _
      exact PrimeSpectrum.isTopologicalBasis_basic_opens
- id: basic_open_is_quasi_compact
  kind: gap
  level: 4
  topic: 可換環論・素スペクトラム
  statement: $R$を可換環、$f\in R$とする。$\operatorname{Spec}R$の基本開集合$D(f)$は準コンパクトである。これは$\operatorname{Spec}R=D(1)$の準コンパクト性を一般化した形である。
  statement_en: For an element f of a commutative ring R, the basic open set D(f) is quasi-compact. This generalizes quasi-compactness of Spec R = D(1).
  assumptions:
  - $R$は可換環
  - $f\in R$
  quantifiers:
  - 任意の可換環$R$と元$f$
  conclusion: $D(f)$は準コンパクトである。
  answer: |
    $R$を可換環、$f\in R$とする。基本開集合は位相の基底なので、$D(f)$を基本開集合の族$(D(g_i))_{i\in\Lambda}$で覆う場合に、有限部分被覆の存在を示せばよい。
    $J=(g_i:i\in\Lambda)$とおく。$\mathfrak{p}\in V(J)$ならすべての$i$で$g_i\in\mathfrak{p}$なので、$\mathfrak{p}$は$\bigcup_iD(g_i)$に属さず、よって$D(f)$にも属さない。すなわち$f\in\mathfrak{p}$である。したがって$f$は$J$を含むすべての素イデアルに属し、$f\in\sqrt{J}$である。そこで$f^n=\sum_{i\in\Lambda_0}a_ig_i$となる$n$と有限集合$\Lambda_0\subseteq\Lambda$、$a_i\in R$をとる。
    $\mathfrak{p}\in D(f)$なら$f^n\notin\mathfrak{p}$なので、ある$i\in\Lambda_0$で$g_i\notin\mathfrak{p}$である。よって$D(f)\subseteq\bigcup_{i\in\Lambda_0}D(g_i)$である。
  strategy: Reduce to covers by basic opens and translate covering into f lying in the radical of the generated ideal.
  sketch:
  - 'setup: Since basic opens form a basis, take a cover of D(f) by D(g_i).'
  - 'derive: Every prime containing all g_i contains f, so f lies in the radical of (g_i).'
  - 'construct: Write f^n as a finite combination of the g_i.'
  - 'conclude: The finitely many g_i appearing already cover D(f).'
  openmath: (forall (A f) (-> (and (comm_ring A) (in f A)) (compact_in (basic_open f) (prime_spectrum A))))
  hard_negative:
    statement: $\operatorname{Spec}R$の開集合はすべて準コンパクトである。
    reason: 体$k$上の$R=k[x_1,x_2,\dots]$で$U=\bigcup_iD(x_i)$とする。素イデアル$(x_1,\dots,x_n)$は$x_{n+1}$を含まないので$U$に属するが、$D(x_1)\cup\dots\cup D(x_n)$には属さない。よって$U$の被覆$(D(x_i))$は有限部分被覆をもたない。
  target: |
    ∀ (R : Type*) [CommRing R] (f : R), IsCompact (PrimeSpectrum.basicOpen f : Set (PrimeSpectrum R))
  proof: |
    by
      intro R _ f
      exact PrimeSpectrum.isCompact_basicOpen f
- id: basic_open_of_product_and_power
  kind: gap
  level: 3
  topic: 可換環論・素スペクトラム
  statement: $R$を可換環、$f,g\in R$、$n\geq 1$とする。$\operatorname{Spec}R$の基本開集合について$D(fg)=D(f)\cap D(g)$、$D(f^n)=D(f)$である。
  statement_en: For elements f and g of a commutative ring and n ≥ 1, the basic open sets satisfy D(fg) = D(f) ∩ D(g) and D(f^n) = D(f).
  assumptions:
  - $R$は可換環
  - $f,g\in R$
  - $n\geq 1$
  quantifiers:
  - 任意の可換環$R$、元$f,g$、整数$n\geq 1$
  conclusion: $D(fg)=D(f)\cap D(g)$、$D(f^n)=D(f)$である。
  answer: |
    $R$を可換環、$f,g\in R$、$n\geq 1$とし、$\mathfrak{p}$を素イデアルとする。$\mathfrak{p}$は素イデアルなので、$fg\in\mathfrak{p}$であることは$f\in\mathfrak{p}$または$g\in\mathfrak{p}$であることと同じである。補集合をとると$D(fg)=D(f)\cap D(g)$である。
    $n\geq 1$のとき、$f\in\mathfrak{p}$なら$f^n\in\mathfrak{p}$であり、逆に$f^n\in\mathfrak{p}$なら素イデアルの性質より$f\in\mathfrak{p}$である。よって$D(f^n)=D(f)$である。
  strategy: Use the defining property of a prime ideal for products and powers.
  sketch:
  - 'setup: Fix a prime p.'
  - 'derive: fg lies in p iff f or g lies in p, which gives D(fg) = D(f) ∩ D(g).'
  - 'derive: For n ≥ 1, f^n lies in p iff f lies in p.'
  - 'conclude: Hence D(f^n) = D(f).'
  openmath: (forall (A f g n) (-> (and (comm_ring A) (in f A) (in g A) (in n N) (>= n 1)) (and (= (basic_open (* f g)) (inter (basic_open f) (basic_open g))) (= (basic_open (^ f n)) (basic_open f)))))
  hard_negative:
    statement: 可換環の元$f,g$について$D(f+g)=D(f)\cup D(g)$である。
    reason: 零環でない可換環で$f=1$、$g=-1$とすると、$D(f+g)=D(0)=\emptyset$であるが、$D(f)\cup D(g)=\operatorname{Spec}R\neq\emptyset$である。包含$D(f+g)\subseteq D(f)\cup D(g)$だけが成り立つ。
  target: |
    ∀ (R : Type*) [CommRing R] (f g : R) (n : ℕ), 0 < n → PrimeSpectrum.basicOpen (f * g) = PrimeSpectrum.basicOpen f ⊓ PrimeSpectrum.basicOpen g ∧ PrimeSpectrum.basicOpen (f ^ n) = PrimeSpectrum.basicOpen f
  proof: |
    by
      intro R _ f g n hn
      exact ⟨PrimeSpectrum.basicOpen_mul f g, PrimeSpectrum.basicOpen_pow f n hn⟩
- id: basic_opens_cover_iff_generate_unit
  kind: gap
  level: 3
  topic: 可換環論・素スペクトラム
  statement: $R$を可換環、$(f_i)_{i\in\Lambda}$を$R$の元の族とする。$\operatorname{Spec}R=\bigcup_iD(f_i)$であることと、$f_i$たちが単位イデアルを生成することは同値である。
  statement_en: For a family of elements f_i of a commutative ring R, the basic open sets D(f_i) cover Spec R if and only if the f_i generate the unit ideal.
  assumptions:
  - $R$は可換環
  - $(f_i)$は$R$の元の族
  quantifiers:
  - 任意の可換環$R$と元の族$(f_i)$
  conclusion: $\bigcup_iD(f_i)=\operatorname{Spec}R$と$(f_i:i\in\Lambda)=R$は同値である。
  answer: |
    $R$を可換環、$(f_i)_{i\in\Lambda}$を$R$の元の族とし、$J=(f_i:i\in\Lambda)$とおく。素イデアル$\mathfrak{p}$が$\bigcup_iD(f_i)$に属さないことは、すべての$i$で$f_i\in\mathfrak{p}$であること、すなわち$J\subseteq\mathfrak{p}$であることと同じである。よって$\operatorname{Spec}R\setminus\bigcup_iD(f_i)=V(J)$である。
    したがって$\bigcup_iD(f_i)=\operatorname{Spec}R$であることは$V(J)=\emptyset$であることと同じである。真のイデアルは極大イデアルに含まれ、単位イデアルを含む素イデアルはないので、$V(J)=\emptyset$は$J=R$と同値である。
  strategy: The complement of the union is V(J), and V(J) is empty exactly when J is the unit ideal.
  sketch:
  - 'setup: Let J be the ideal generated by the f_i.'
  - 'derive: The complement of the union of the D(f_i) is V(J).'
  - 'apply_theorem: V(J) is empty iff J = R, since a proper ideal lies in a maximal ideal.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (A f) (-> (and (comm_ring A) (forall (i) (in (family_value f i) A))) (<-> (forall (y) (-> (in y (prime_spectrum A)) (exists (i) (in y (basic_open (family_value f i)))))) (= (ideal_generated_by (range_of f)) (unit_ideal A)))))
  hard_negative:
    statement: 可換環の元の族について、$\bigcup_iD(f_i)$が$\operatorname{Spec}R$で稠密なら、$f_i$たちは単位イデアルを生成する。
    reason: $R=\mathbb{Z}$で$f=2$の1元の族を考える。$D(2)$は$(2)$以外の素イデアル全体であり、$(0)$を含むので稠密である。しかし$(2)\neq\mathbb{Z}$である。
  target: |
    ∀ (R ι : Type*) [CommRing R] (f : ι → R), (⋃ i, (PrimeSpectrum.basicOpen (f i) : Set (PrimeSpectrum R))) = Set.univ ↔ Ideal.span (Set.range f) = ⊤
  proof: |
    by
      intro R ι _ f
      rw [← PrimeSpectrum.iSup_basicOpen_eq_top_iff]
      constructor
      · intro h
        apply TopologicalSpace.Opens.ext
        simpa using h
      · intro h
        have := congrArg (fun U : TopologicalSpace.Opens (PrimeSpectrum R) => (U : Set (PrimeSpectrum R))) h
        simpa using this
- id: spec_is_t0
  kind: gap
  level: 3
  topic: 可換環論・素スペクトラムの位相
  statement: 可換環$R$の素スペクトラム$\operatorname{Spec}R$は$T_0$空間である。
  statement_en: The prime spectrum of a commutative ring is a T0 space.
  assumptions:
  - $R$は可換環
  quantifiers:
  - 任意の可換環$R$
  conclusion: $\operatorname{Spec}R$は$T_0$空間である。
  answer: |
    $R$を可換環、$\mathfrak{p}\neq\mathfrak{q}$を素イデアルとする。必要なら入れ替えて$\mathfrak{p}\not\subseteq\mathfrak{q}$としてよい。$f\in\mathfrak{p}\setminus\mathfrak{q}$をとると、開集合$D(f)$は$\mathfrak{q}$を含み$\mathfrak{p}$を含まない。よって異なる2点は開集合で区別でき、$\operatorname{Spec}R$は$T_0$空間である。
  strategy: Separate two distinct primes by a basic open set defined by an element in one but not the other.
  sketch:
  - 'setup: Take distinct primes p and q with p not contained in q.'
  - 'construct: Choose f in p outside q.'
  - 'conclude: D(f) contains q but not p.'
  openmath: (forall (A x y) (-> (and (comm_ring A) (in x (prime_spectrum A)) (in y (prime_spectrum A)) (!= x y)) (exists (f) (and (in f A) (or (and (in x (basic_open f)) (notin y (basic_open f))) (and (in y (basic_open f)) (notin x (basic_open f))))))))
  hard_negative:
    statement: 可換環の素スペクトラムは$T_1$空間である。
    reason: $\operatorname{Spec}\mathbb{Z}$で$(0)$の閉包は全体であり、$\{(0)\}$は閉集合でない。よって$T_1$空間ではない。
  target: |
    ∀ (R : Type*) [CommRing R], T0Space (PrimeSpectrum R)
  proof: |
    by
      intro R _
      infer_instance
- id: irreducible_closed_unique_generic_point
  kind: gap
  level: 4
  topic: 可換環論・素スペクトラムの位相
  statement: $R$を可換環、$Z$を$\operatorname{Spec}R$の既約な閉部分集合とする。$\overline{\{x\}}=Z$となる点$x\in\operatorname{Spec}R$がただ1つ存在する。
  statement_en: Every irreducible closed subset Z of the prime spectrum of a commutative ring has exactly one generic point, that is, a point x whose closure is Z.
  assumptions:
  - $R$は可換環
  - $Z$は$\operatorname{Spec}R$の閉部分集合
  - $Z$は既約（空でなく、2つの閉集合の和に含まれるならその一方に含まれる）
  quantifiers:
  - 任意の可換環$R$と既約閉部分集合$Z$
  conclusion: $\overline{\{x\}}=Z$となる点$x$がただ1つ存在する。
  answer: |
    $R$を可換環、$Z$を$\operatorname{Spec}R$の既約な閉部分集合とする。$\mathfrak{p}=\bigcap_{\mathfrak{q}\in Z}\mathfrak{q}$とおく。$Z$は空でないので$\mathfrak{p}$は真のイデアルである。$ab\in\mathfrak{p}$とすると、$Z\subseteq V(a)\cup V(b)$であるから、既約性より$Z\subseteq V(a)$または$Z\subseteq V(b)$であり、$a\in\mathfrak{p}$または$b\in\mathfrak{p}$である。よって$\mathfrak{p}$は素イデアルである。
    $Z$は閉なので$Z=V(J)$と書ける。$J$は$Z$のすべての点に含まれるので$J\subseteq\mathfrak{p}$であり、$\mathfrak{p}\in V(J)=Z$である。素イデアル$\mathfrak{p}$の閉包は$V(\mathfrak{p})$である。$Z$の点はすべて$\mathfrak{p}$を含むので$Z\subseteq V(\mathfrak{p})$であり、$\mathfrak{p}\in Z$と$Z$が閉であることから$V(\mathfrak{p})\subseteq Z$である。よって$\overline{\{\mathfrak{p}\}}=Z$である。
    一意性を示す。$\overline{\{\mathfrak{p}'\}}=V(\mathfrak{p}')=V(\mathfrak{p})$なら、$\mathfrak{p}\in V(\mathfrak{p}')$かつ$\mathfrak{p}'\in V(\mathfrak{p})$なので、$\mathfrak{p}'\subseteq\mathfrak{p}\subseteq\mathfrak{p}'$となり$\mathfrak{p}'=\mathfrak{p}$である。
  strategy: Take the intersection of the points of Z as the generic point and use closures of points.
  sketch:
  - 'setup: Let p be the intersection of all points of Z.'
  - 'derive: Irreducibility of Z makes p a prime ideal.'
  - 'derive: Since Z = V(J) is closed, J lies in p, so p is a point of Z.'
  - 'derive: The closure of p is V(p), and it equals Z.'
  - 'conclude: Two primes with the same closure contain each other, so the point is unique.'
  openmath: (forall (A Y) (-> (and (comm_ring A) (closed_in Y (prime_spectrum A)) (irreducible_subset Y)) (exists (x) (and (in x (prime_spectrum A)) (= (set_closure (singleton_set x)) Y) (forall (y) (-> (and (in y (prime_spectrum A)) (= (set_closure (singleton_set y)) Y)) (= y x)))))))
  hard_negative:
    statement: $\operatorname{Spec}R$の空でない閉部分集合はすべて、1点の閉包として書ける。
    reason: 体$k$上の$R=k[x,y]/(xy)$で$\operatorname{Spec}R=V(x)\cup V(y)$は既約でない。1点の閉包は既約なので、$\operatorname{Spec}R$全体は1点の閉包にならない。
  target: |
    ∀ (R : Type*) [CommRing R] (Z : Set (PrimeSpectrum R)), IsClosed Z → IsIrreducible Z → ∃! x : PrimeSpectrum R, closure {x} = Z
  proof: |
    by
      intro R _ Z hc hi
      refine ⟨hi.genericPoint, ?_, ?_⟩
      · simpa [hc.closure_eq] using (hi.isGenericPoint_genericPoint_closure).def
      · intro y hy
        have h1 : IsGenericPoint y Z := hy
        have h2 : IsGenericPoint hi.genericPoint Z := by
          simpa [hc.closure_eq] using hi.isGenericPoint_genericPoint_closure
        exact h1.eq h2
- id: irreducible_components_are_minimal_primes
  kind: textbook
  level: 4
  topic: 可換環論・素スペクトラムの既約成分
  statement: $R$を可換環とする。$\operatorname{Spec}R$の既約成分は、$R$の極小素イデアル$\mathfrak{p}$により$V(\mathfrak{p})$と書ける集合とちょうど一致する。
  statement_en: The irreducible components of the prime spectrum of a commutative ring R are exactly the sets V(p) with p a minimal prime ideal of R.
  assumptions:
  - $R$は可換環
  - 既約成分とは包含について極大な既約部分集合
  quantifiers:
  - 任意の可換環$R$
  conclusion: 既約成分は極小素イデアル$\mathfrak{p}$による$V(\mathfrak{p})$と一致する。
  answer: |
    $R$を可換環とする。既約部分集合の閉包は既約なので、既約成分は閉集合であり、既約な閉集合のうち包含について極大なものである。
    素イデアル$\mathfrak{p}$について、$V(\mathfrak{p})$は点$\mathfrak{p}$の閉包なので既約である。逆に、既約な閉集合$Z$は1点の閉包である。実際、$\mathfrak{p}=\bigcap_{\mathfrak{q}\in Z}\mathfrak{q}$は既約性から素イデアルであり、$Z$が閉であることから$\mathfrak{p}\in Z$かつ$Z=V(\mathfrak{p})$である。
    よって$\mathfrak{p}\mapsto V(\mathfrak{p})$は素イデアル全体から既約閉集合全体への全射である。$V(\mathfrak{p})\subseteq V(\mathfrak{q})$は$\mathfrak{q}\subseteq\mathfrak{p}$と同値なので、この対応は順序を逆にする単射でもある。したがって包含について極大な既約閉集合は、包含について極小な素イデアル$\mathfrak{p}$の$V(\mathfrak{p})$にちょうど対応する。
  strategy: Irreducible closed subsets correspond to primes with reversed order, so maximal ones correspond to minimal primes.
  sketch:
  - 'derive: Irreducible components are closed because the closure of an irreducible set is irreducible.'
  - 'derive: V(p) is the closure of a point, hence irreducible.'
  - 'derive: Every irreducible closed set has the form V(p) with p prime.'
  - 'derive: V(p) ⊆ V(q) iff q ⊆ p, so the correspondence reverses order.'
  - 'conclude: Maximal irreducible closed sets correspond to minimal primes.'
  openmath: (forall (A Y) (-> (comm_ring A) (<-> (irreducible_component Y (prime_spectrum A)) (exists (p) (and (minimal_prime_over p (zero_ideal A)) (= Y (spectrum_zero_locus p)))))))
  hard_negative:
    statement: 可換環の素スペクトラムの既約成分は有限個である。
    reason: 体$\mathbb{F}_2$の可算無限個の直積$R$では、すべての素イデアルが極大かつ極小である。各成分への射影の核はそれぞれ異なる素イデアルなので、既約成分は無限個ある。有限性にはネーター性などの仮定が要る。
  target: |
    ∀ (R : Type*) [CommRing R] (Z : Set (PrimeSpectrum R)), Z ∈ irreducibleComponents (PrimeSpectrum R) ↔ ∃ P ∈ minimalPrimes R, Z = PrimeSpectrum.zeroLocus (P : Set R)
  proof: |
    by
      intro R _ Z
      rw [← PrimeSpectrum.zeroLocus_minimalPrimes]
      constructor
      · rintro ⟨P, hP, rfl⟩
        exact ⟨P, hP, rfl⟩
      · rintro ⟨P, hP, rfl⟩
        exact ⟨P, hP, rfl⟩
- id: spec_noetherian_space
  kind: textbook
  level: 4
  topic: 可換環論・ネーター空間
  statement: $R$をネーター環とする。$\operatorname{Spec}R$はネーター位相空間である。すなわち閉集合の降鎖はすべて有限で停止する。
  statement_en: If R is a Noetherian commutative ring, then Spec R is a Noetherian topological space, that is, every descending chain of closed subsets stabilizes.
  assumptions:
  - $R$はネーター可換環
  quantifiers:
  - 任意のネーター環$R$
  conclusion: $\operatorname{Spec}R$はネーター位相空間である。
  answer: |
    $R$をネーター可換環とし、$Z_1\supseteq Z_2\supseteq\cdots$を$\operatorname{Spec}R$の閉集合の降鎖とする。部分集合$Z$に対して$I(Z)=\bigcap_{\mathfrak{p}\in Z}\mathfrak{p}$とおくと、$I(Z_1)\subseteq I(Z_2)\subseteq\cdots$はイデアルの昇鎖である（空集合には$R$を対応させる）。
    $R$はネーター環なので、ある$n$以降で$I(Z_m)=I(Z_n)$となる。閉集合$Z=V(J)$については$V(I(Z))=Z$である。実際、$J\subseteq I(Z)$より$V(I(Z))\subseteq Z$であり、$Z$の点はすべて$I(Z)$を含むので逆の包含も成り立つ。よって$m\geq n$で$Z_m=V(I(Z_m))=V(I(Z_n))=Z_n$である。
  strategy: Pass to the ascending chain of vanishing ideals and use V(I(Z)) = Z for closed Z.
  sketch:
  - 'setup: Take a descending chain of closed sets Z_i.'
  - 'derive: The ideals I(Z_i) form an ascending chain.'
  - 'apply_theorem: This chain stabilizes because R is Noetherian.'
  - 'derive: For closed Z one has V(I(Z)) = Z.'
  - 'conclude: So the chain of closed sets stabilizes.'
  openmath: (forall (A) (-> (and (comm_ring A) (noetherian_ring A)) (noetherian_space (prime_spectrum A))))
  hard_negative:
    statement: $\operatorname{Spec}R$がネーター位相空間なら$R$はネーター環である。
    reason: 体$k$上の$R=k[x_1,x_2,\dots]/(x_ix_j:i,j\geq 1)$の素イデアルは$(x_1,x_2,\dots)$だけなので、$\operatorname{Spec}R$は1点でありネーター空間である。しかしこの極大イデアルは有限生成でないので、$R$はネーター環でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R], TopologicalSpace.NoetherianSpace (PrimeSpectrum R)
  proof: |
    by
      intro R _ _
      infer_instance
- id: spec_map_preimages
  kind: gap
  level: 3
  topic: 可換環論・素スペクトラムの射
  statement: $f:R\to S$を単位元を保つ可換環の準同型とし、$f^*:\operatorname{Spec}S\to\operatorname{Spec}R$を$\mathfrak{q}\mapsto f^{-1}(\mathfrak{q})$で定める。部分集合$s\subseteq R$と$x\in R$について$(f^*)^{-1}(V(s))=V(f(s))$、$(f^*)^{-1}(D(x))=D(f(x))$である。とくに$f^*$は連続である。
  statement_en: For a unital homomorphism f from R to S of commutative rings, with induced map f* from Spec S to Spec R, the preimage of V(s) is V(f(s)) and the preimage of D(x) is D(f(x)); in particular f* is continuous.
  assumptions:
  - $R,S$は可換環
  - $f:R\to S$は単位元を保つ環準同型
  - $s\subseteq R$
  - $x\in R$
  quantifiers:
  - 任意の環準同型$f$、部分集合$s$、元$x$
  conclusion: $(f^*)^{-1}(V(s))=V(f(s))$、$(f^*)^{-1}(D(x))=D(f(x))$である。
  answer: |
    $f:R\to S$を単位元を保つ可換環の準同型、$s\subseteq R$、$x\in R$とし、$\mathfrak{q}$を$S$の素イデアルとする。$f^*(\mathfrak{q})=f^{-1}(\mathfrak{q})$は素イデアルである。$f^*(\mathfrak{q})\in V(s)$であることは$s\subseteq f^{-1}(\mathfrak{q})$、すなわち$f(s)\subseteq\mathfrak{q}$であることと同じである。よって$(f^*)^{-1}(V(s))=V(f(s))$である。
    また$f^*(\mathfrak{q})\in D(x)$であることは$x\notin f^{-1}(\mathfrak{q})$、すなわち$f(x)\notin\mathfrak{q}$であることと同じなので、$(f^*)^{-1}(D(x))=D(f(x))$である。閉集合の逆像が閉集合なので$f^*$は連続である。
  strategy: Unfold membership of the contraction of a prime ideal.
  sketch:
  - 'setup: Fix a prime q of S.'
  - 'translate: The contraction of q contains s iff q contains f(s).'
  - 'translate: The contraction of q omits x iff q omits f(x).'
  - 'conclude: The preimage formulas hold, and closed sets pull back to closed sets.'
  openmath: (forall (A B f s x) (-> (and (comm_ring A) (comm_ring B) (ring_hom f A B) (subset s A) (in x A)) (and (= (preimage (spec_map f) (spectrum_zero_locus s)) (spectrum_zero_locus (image_of f s))) (= (preimage (spec_map f) (basic_open x)) (basic_open (fn_value f x))))))
  hard_negative:
    statement: 環準同型$f$の誘導する$f^*:\operatorname{Spec}S\to\operatorname{Spec}R$は閉集合を閉集合へ写す。
    reason: $f:\mathbb{Z}\to\mathbb{Q}$で$\operatorname{Spec}\mathbb{Q}$は1点の閉集合であり、その像は$\{(0)\}$である。これは$\operatorname{Spec}\mathbb{Z}$で閉でない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] (f : R →+* S) (s : Set R) (x : R), PrimeSpectrum.comap f ⁻¹' PrimeSpectrum.zeroLocus s = PrimeSpectrum.zeroLocus (f '' s) ∧ PrimeSpectrum.comap f ⁻¹' (PrimeSpectrum.basicOpen x : Set (PrimeSpectrum R)) = (PrimeSpectrum.basicOpen (f x) : Set (PrimeSpectrum S))
  proof: |
    by
      intro R S _ _ f s x
      exact ⟨PrimeSpectrum.preimage_comap_zeroLocus f s, rfl⟩
- id: spec_map_surjective_closed_embedding
  kind: textbook
  level: 4
  topic: 可換環論・素スペクトラムの射
  statement: $f:R\to S$を単位元を保つ可換環の全射準同型とする。$f^*:\operatorname{Spec}S\to\operatorname{Spec}R$は閉埋め込みであり、その像は$V(\ker f)$である。
  statement_en: If f from R to S is a surjective unital homomorphism of commutative rings, then f* from Spec S to Spec R is a closed embedding with image V(ker f).
  assumptions:
  - $R,S$は可換環
  - $f:R\to S$は全射環準同型
  quantifiers:
  - 任意の全射環準同型$f$
  conclusion: $f^*$は閉埋め込みで、像は$V(\ker f)$である。
  answer: |
    $f:R\to S$を単位元を保つ可換環の全射準同型とする。$f$は全射なので、$S$の素イデアルと、$\ker f$を含む$R$の素イデアルは、$\mathfrak{q}\mapsto f^{-1}(\mathfrak{q})$により1対1に対応する。逆の対応は$\mathfrak{p}\mapsto f(\mathfrak{p})$である。よって$f^*$は単射で、像は$V(\ker f)$である。
    $S$のイデアル$J$について、$f^{-1}(J)\supseteq\ker f$であり、$\mathfrak{q}\supseteq J$と$f^{-1}(\mathfrak{q})\supseteq f^{-1}(J)$は同値である。これは$f^*(V(J))=V(f^{-1}(J))$を意味する。$\operatorname{Spec}S$の閉集合は$V(J)$の形なので、$f^*$は閉集合を閉集合へ写す。単射かつ連続な閉写像なので、$f^*$は閉埋め込みである。
  strategy: Use the correspondence between ideals of S and ideals of R containing the kernel.
  sketch:
  - 'apply_theorem: Primes of S correspond to primes of R containing ker f.'
  - 'derive: So f* is injective with image V(ker f).'
  - 'derive: The image of V(J) is V(f^(-1)(J)), so f* is a closed map.'
  - 'conclude: An injective continuous closed map is a closed embedding.'
  openmath: (forall (A B f) (-> (and (comm_ring A) (comm_ring B) (ring_hom f A B) (surjective f)) (and (closed_embedding (spec_map f)) (= (range_of (spec_map f)) (spectrum_zero_locus (ring_kernel f))))))
  hard_negative:
    statement: $f$が単射な環準同型なら、$f^*$は全射である。
    reason: 包含$\mathbb{Z}\to\mathbb{Q}$は単射であるが、$\operatorname{Spec}\mathbb{Q}$は1点なので、$f^*$の像は$\{(0)\}$だけである。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] (f : R →+* S), Function.Surjective f → Topology.IsClosedEmbedding (PrimeSpectrum.comap f) ∧ Set.range (PrimeSpectrum.comap f) = PrimeSpectrum.zeroLocus (RingHom.ker f : Set R)
  proof: |
    by
      intro R S _ _ f hf
      exact ⟨PrimeSpectrum.isClosedEmbedding_comap_of_surjective S f hf, range_comap_of_surjective S f hf⟩
- id: spec_localization_away_open_embedding
  kind: textbook
  level: 4
  topic: 可換環論・素スペクトラムの射
  statement: $R$を可換環、$r\in R$とし、$S=R_r$を$\{r^n\}$での局所化とする。$\operatorname{Spec}S\to\operatorname{Spec}R$は開埋め込みであり、その像は$D(r)$である。
  statement_en: For an element r of a commutative ring R and S the localization of R at the powers of r, the map Spec S to Spec R is an open embedding with image D(r).
  assumptions:
  - $R$は可換環
  - $r\in R$
  - $S$は$R$の$\{r^n\}$での局所化
  quantifiers:
  - 任意の可換環$R$、元$r$、局所化$S$
  conclusion: $\operatorname{Spec}S\to\operatorname{Spec}R$は開埋め込みで、像は$D(r)$である。
  answer: |
    $R$を可換環、$r\in R$とし、$\varphi:R\to S=R_r$を標準写像とする。局所化の素イデアルの対応により、$\mathfrak{q}\mapsto\varphi^{-1}(\mathfrak{q})$は$S$の素イデアルと$\{r^n\}$に交わらない$R$の素イデアルの全単射を与える。素イデアルが$\{r^n\}$と交わらないことは$r$を含まないことと同じなので、像は$D(r)$である。
    この写像$\varphi^*$は連続で単射である。開写像であることを示す。$D(a/r^n)$（$a\in R$）は$\operatorname{Spec}S$の位相の基底であり、$r$は$S$で単元なので$a/r^n$と$\varphi(a)$は単元倍の違いしかなく、$D(a/r^n)=D(\varphi(a))$である。$\mathfrak{q}\in D(\varphi(a))$は$a\notin\varphi^{-1}(\mathfrak{q})$と同値なので、$\varphi^*(D(\varphi(a)))=D(a)\cap D(r)=D(ar)$である。よって$\varphi^*$は開写像であり、開埋め込みである。
  strategy: Use the prime correspondence for localization and compute the image of basic opens.
  sketch:
  - 'apply_theorem: Primes of S correspond to primes of R not meeting the powers of r.'
  - 'derive: These are the primes not containing r, so the image is D(r).'
  - 'derive: Every element of S is a unit multiple of the image of some a in R.'
  - 'derive: The image of D(φ(a)) is D(ar), which is open.'
  - 'conclude: An injective continuous open map is an open embedding.'
  openmath: (forall (A B r) (-> (and (comm_ring A) (comm_ring B) (in r A) (localization_away B A r)) (and (open_embedding (spec_map (algebra_map A B))) (= (range_of (spec_map (algebra_map A B))) (basic_open r)))))
  hard_negative:
    statement: 可換環の任意の乗法的部分集合$M$について、$\operatorname{Spec}M^{-1}R\to\operatorname{Spec}R$の像は開集合である。
    reason: $R=\mathbb{Z}$、$M=\mathbb{Z}\setminus(2)$とすると、像は$\{(0),(2)\}$である。$\operatorname{Spec}\mathbb{Z}$の空でない開集合は有限個の素数を除いたものを含むので、この集合は開でない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] (r : R) [IsLocalization.Away r S], Topology.IsOpenEmbedding (PrimeSpectrum.comap (algebraMap R S)) ∧ Set.range (PrimeSpectrum.comap (algebraMap R S)) = PrimeSpectrum.basicOpen r
  proof: |
    by
      intro R S _ _ _ r _
      exact ⟨PrimeSpectrum.localization_away_isOpenEmbedding S r, PrimeSpectrum.localization_away_comap_range S r⟩
- id: spec_map_dense_iff_kernel_nilpotent
  kind: gap
  level: 4
  topic: 可換環論・素スペクトラムの射
  statement: $f:R\to S$を単位元を保つ可換環の準同型とする。$f^*:\operatorname{Spec}S\to\operatorname{Spec}R$の像が稠密であることと、$\ker f$が$R$の冪零根基に含まれることは同値である。
  statement_en: For a unital homomorphism f from R to S of commutative rings, the image of f* is dense in Spec R if and only if ker f lies in the nilradical of R.
  assumptions:
  - $R,S$は可換環
  - $f:R\to S$は単位元を保つ環準同型
  quantifiers:
  - 任意の環準同型$f$
  conclusion: $f^*$の像が稠密であることと$\ker f\subseteq\sqrt{0}$は同値である。
  answer: |
    $f:R\to S$を単位元を保つ可換環の準同型とする。$T$を$f^*$の像とし、$A=\bigcap_{\mathfrak{p}\in T}\mathfrak{p}$とおく。部分集合の閉包は、その点の共通部分$A$を用いて$V(A)$と書ける。実際、$T$を含む閉集合$V(J)$では$J\subseteq A$なので$V(A)\subseteq V(J)$であり、$T\subseteq V(A)$である。
    $A=\bigcap_{\mathfrak{q}}f^{-1}(\mathfrak{q})=f^{-1}(\bigcap_{\mathfrak{q}}\mathfrak{q})$であり、$\bigcap_{\mathfrak{q}}\mathfrak{q}$は$S$の冪零根基である。よって$x\in A$は$f(x)$が冪零であることと同値である。$T$が稠密であることは$V(A)=\operatorname{Spec}R$、すなわち$A$が$R$の冪零根基に含まれることと同値である。
    $A\subseteq\sqrt{0}$なら$\ker f\subseteq A\subseteq\sqrt{0}$である。逆に$\ker f\subseteq\sqrt{0}$とし、$x\in A$とすると、$f(x)^n=0$となる$n$があり、$x^n\in\ker f\subseteq\sqrt{0}$なので$x$は冪零である。よって$A\subseteq\sqrt{0}$であり、同値が示された。
  strategy: Compute the closure of the image as V of the preimage of the nilradical of S.
  sketch:
  - 'setup: Let A be the intersection of the primes in the image of f*.'
  - 'derive: The closure of the image is V(A).'
  - 'derive: A is the preimage of the nilradical of S.'
  - 'derive: Density means A lies in the nilradical of R.'
  - 'conclude: This is equivalent to ker f lying in the nilradical, since f(x) nilpotent means some x^n lies in ker f.'
  openmath: (forall (A B f) (-> (and (comm_ring A) (comm_ring B) (ring_hom f A B)) (<-> (= (set_closure (range_of (spec_map f))) (prime_spectrum A)) (subset (ring_kernel f) (nilradical_of A)))))
  hard_negative:
    statement: $f^*$の像が稠密なら$f^*$は全射である。
    reason: 包含$\mathbb{Z}\to\mathbb{Q}$では$\ker f=0$なので像$\{(0)\}$は稠密である。しかし$(2)$は像に入らないので全射でない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] (f : R →+* S), DenseRange (PrimeSpectrum.comap f) ↔ RingHom.ker f ≤ nilradical R
  proof: |
    by
      intro R S _ _ f
      exact PrimeSpectrum.denseRange_comap_iff_ker_le_nilRadical f
- id: spec_map_integral_is_closed
  kind: textbook
  level: 4
  topic: 可換環論・素スペクトラムの射
  statement: $f:R\to S$を単位元を保つ可換環の準同型とし、$S$の各元が$f(R)$上整であるとする。$f^*:\operatorname{Spec}S\to\operatorname{Spec}R$は閉写像である。
  statement_en: If f from R to S is a unital homomorphism of commutative rings making S integral over f(R), then f* from Spec S to Spec R is a closed map.
  assumptions:
  - $R,S$は可換環
  - $f:R\to S$は環準同型
  - $S$の各元は$f(R)$上整
  quantifiers:
  - 任意の整な環準同型$f$
  conclusion: $f^*$は閉写像である。
  answer: |
    $f:R\to S$を単位元を保つ可換環の準同型とし、$S$の各元が$f(R)$上整であるとする。$\operatorname{Spec}S$の閉集合は$V(J)$（$J$は$S$のイデアル）と書ける。$f^*(V(J))=V(f^{-1}(J))$を示す。
    $\mathfrak{q}\supseteq J$なら$f^{-1}(\mathfrak{q})\supseteq f^{-1}(J)$なので、左辺は右辺に含まれる。逆に$\mathfrak{p}$を$f^{-1}(J)$を含む$R$の素イデアルとする。$\bar f:R/f^{-1}(J)\to S/J$は単射で、$S/J$は$R/f^{-1}(J)$上整である。整拡大の横たわり定理より、$\mathfrak{p}/f^{-1}(J)$の上にある$S/J$の素イデアルがある。これを$S$へ引き戻すと、$J$を含み$f^*$で$\mathfrak{p}$へ写る素イデアルが得られる。よって右辺は左辺に含まれる。
    以上より像は閉集合$V(f^{-1}(J))$である。
  strategy: Reduce to the injective integral map modulo J and apply lying over.
  sketch:
  - 'setup: Take a closed set V(J) of Spec S.'
  - 'derive: Its image lies in V(f^(-1)(J)).'
  - 'derive: The induced map from R/f^(-1)(J) to S/J is injective and integral.'
  - 'apply_theorem: Lying over gives a prime of S/J above any given prime.'
  - 'conclude: So the image equals V(f^(-1)(J)), which is closed.'
  openmath: (forall (A B f) (-> (and (comm_ring A) (comm_ring B) (ring_hom f A B) (integral_ring_hom f)) (closed_map (spec_map f))))
  hard_negative:
    statement: 任意の環準同型$f$について、$f^*$は閉写像である。
    reason: 体$k$上の$k[x]\to k[x,y]/(xy-1)$の像は$D(x)$である。$\operatorname{Spec}$全体は閉集合であるが、$D(x)$は$\operatorname{Spec}k[x]$で閉でない。この環準同型は整でない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] (f : R →+* S), f.IsIntegral → IsClosedMap (PrimeSpectrum.comap f)
  proof: |
    by
      intro R S _ _ f hf
      exact PrimeSpectrum.isClosedMap_comap_of_isIntegral f hf
- id: spec_clopen_iff_idempotent
  kind: textbook
  level: 4
  topic: 可換環論・素スペクトラムと冪等元
  statement: $R$を可換環とする。$\operatorname{Spec}R$の部分集合$s$が開かつ閉であることと、ある冪等元$e\in R$により$s=D(e)$と書けることは同値である。
  statement_en: A subset s of the prime spectrum of a commutative ring R is both open and closed if and only if s = D(e) for some idempotent e of R.
  assumptions:
  - $R$は可換環
  - $s\subseteq\operatorname{Spec}R$
  quantifiers:
  - 任意の可換環$R$と部分集合$s$
  conclusion: $s$が開かつ閉であることと、冪等元$e$で$s=D(e)$と書けることは同値である。
  answer: |
    $R$を可換環とする。$e$を冪等元とする。$e(1-e)=0$なので、どの素イデアルも$e$か$1-e$を含む。$e+(1-e)=1$なので両方は含まない。よって$\operatorname{Spec}R$は$D(e)$と$D(1-e)$の交わらない和であり、$D(e)$は開かつ閉である。
    逆に$s$を開かつ閉とする。$\operatorname{Spec}R$は準コンパクトなので、その閉集合$s$と$s^c$も準コンパクトである。基本開集合は基底なので、$s=\bigcup_{i}D(f_i)$、$s^c=\bigcup_{j}D(g_j)$と有限和で書ける。$I=(f_i)$、$J=(g_j)$とおくと、$V(I)=s^c$、$V(J)=s$である。
    $V(I+J)=V(I)\cap V(J)=\emptyset$より$I+J=R$である。$V(IJ)=V(I)\cup V(J)=\operatorname{Spec}R$より$IJ$の元はすべて冪零である。$IJ$は有限生成なので、ある$n\geq 1$で$(IJ)^n=0$である。$V(I^n+J^n)=V(I)\cap V(J)=\emptyset$より$I^n+J^n=R$なので、$e+g=1$（$e\in I^n$、$g\in J^n$）と書ける。$eg\in I^nJ^n=0$なので$e=e(e+g)=e^2$であり、$e$は冪等元である。
    $e\in I^n$より$V(I)\subseteq V(e)$なので$D(e)\subseteq s$である。同様に$D(g)\subseteq s^c$である。$e+g=1$より$D(e)\cup D(g)=\operatorname{Spec}R$なので、$D(e)=s$である。
  strategy: Write s and its complement as finite unions of basic opens, then split 1 using coprime powers.
  sketch:
  - 'derive: For idempotent e, Spec R is the disjoint union of D(e) and D(1-e).'
  - 'setup: For clopen s, quasi-compactness gives finite covers of s and its complement, with ideals I and J.'
  - 'derive: I + J = R and IJ is nilpotent.'
  - 'construct: Choose n with (IJ)^n = 0 and write 1 = e + g with e in I^n and g in J^n.'
  - 'derive: Then eg = 0, so e is idempotent.'
  - 'conclude: D(e) lies in s and D(g) lies in its complement, so D(e) = s.'
  openmath: (forall (A s) (-> (and (comm_ring A) (subset s (prime_spectrum A))) (<-> (and (open_in s (prime_spectrum A)) (closed_in s (prime_spectrum A))) (exists (e) (and (in e A) (= (* e e) e) (= s (basic_open e)))))))
  hard_negative:
    statement: $\operatorname{Spec}R$の開集合はすべて冪等元$e$により$D(e)$と書ける。
    reason: $\mathbb{Z}$の冪等元は$0,1$だけなので、$D(e)$は$\emptyset$か全体である。しかし$D(2)$は空でも全体でもない開集合である。
  target: |
    ∀ (R : Type*) [CommRing R] (s : Set (PrimeSpectrum R)), IsClopen s ↔ ∃ e : R, IsIdempotentElem e ∧ s = PrimeSpectrum.basicOpen e
  proof: |
    by
      intro R _ s
      exact PrimeSpectrum.isClopen_iff
- id: spec_connected_iff_trivial_idempotents
  kind: gap
  level: 4
  topic: 可換環論・素スペクトラムと冪等元
  statement: $R$を零環でない可換環とする。$\operatorname{Spec}R$が連結であることと、$R$の冪等元が$0,1$だけであることは同値である。
  statement_en: For a nonzero commutative ring R, Spec R is connected if and only if the only idempotents of R are 0 and 1.
  assumptions:
  - $R$は零環でない可換環
  quantifiers:
  - 任意の零環でない可換環$R$
  conclusion: $\operatorname{Spec}R$が連結であることと、冪等元が$0,1$だけであることは同値である。
  answer: |
    $R$を零環でない可換環とする。$\operatorname{Spec}R$は空でない。冪等元$e$について$D(e)$は開かつ閉であり、開かつ閉な集合はすべて冪等元$e$により$D(e)$と書ける。
    $\operatorname{Spec}R$が連結とし、$e$を冪等元とする。$D(e)$は$\emptyset$か全体である。$D(e)=\emptyset$なら$e$はすべての素イデアルに属するので冪零であり、$e=e^n=0$である。$D(e)=\operatorname{Spec}R$なら$e$はどの極大イデアルにも属さないので単元であり、$e^2=e$の両辺を$e$で割って$e=1$である。
    逆に冪等元が$0,1$だけとする。開かつ閉な集合は$D(0)=\emptyset$か$D(1)=\operatorname{Spec}R$なので、$\operatorname{Spec}R$は連結である。
  strategy: Combine the correspondence between clopen subsets and idempotents with the extreme cases D(e) = ∅ and D(e) = Spec R.
  sketch:
  - 'apply_theorem: Clopen subsets of Spec R are exactly the D(e) for idempotent e.'
  - 'derive: If D(e) is empty, e is nilpotent, and an idempotent nilpotent is 0.'
  - 'derive: If D(e) is everything, e is a unit, and an idempotent unit is 1.'
  - 'conclude: So connectedness is equivalent to having only the trivial idempotents.'
  openmath: (forall (A) (-> (and (comm_ring A) (nontrivial_ring A)) (<-> (connected_space (prime_spectrum A)) (forall (e) (-> (and (in e A) (= (* e e) e)) (or (= e 0) (= e 1)))))))
  hard_negative:
    statement: $\operatorname{Spec}R$が連結なら$R$は整域である。
    reason: 体$k$上の$R=k[x,y]/(xy)$の冪等元は$0,1$だけなので$\operatorname{Spec}R$は連結であるが、$xy=0$なので$R$は整域でない。また$k[x]/(x^2)$も連結で整域でない。
  target: |
    ∀ (R : Type*) [CommRing R] [Nontrivial R], ConnectedSpace (PrimeSpectrum R) ↔ ∀ e : R, IsIdempotentElem e → e = 0 ∨ e = 1
  proof: |
    by
      intro R _ _
      constructor
      · intro h e he
        have hc : IsClopen ((PrimeSpectrum.basicOpen e : Set (PrimeSpectrum R))) := PrimeSpectrum.isClopen_iff.2 ⟨e, he, rfl⟩
        rcases isClopen_iff.1 hc with h0 | h1
        · left
          have hn : IsNilpotent e := (PrimeSpectrum.basicOpen_eq_bot_iff e).1 (SetLike.coe_injective h0)
          obtain ⟨n, hn⟩ := hn
          have : ∀ k : ℕ, e ^ (k + 1) = e := fun k => by
            induction k with
            | zero => simp
            | succ k ih => rw [pow_succ, ih, he.eq]
          cases n with
          | zero => simp at hn
          | succ n => rwa [this n] at hn
        · right
          have hu : IsUnit e := by
            by_contra hne
            obtain ⟨m, hm, hem⟩ := exists_max_ideal_of_mem_nonunits hne
            have hx : (⟨m, hm.isPrime⟩ : PrimeSpectrum R) ∈ (PrimeSpectrum.basicOpen e : Set (PrimeSpectrum R)) := by
              rw [h1]; trivial
            exact hx hem
          exact hu.mul_left_cancel (by rw [he.eq, mul_one])
      · intro h
        have hp : PreconnectedSpace (PrimeSpectrum R) := by
          refine (preconnectedSpace_iff_clopen).2 fun s hs => ?_
          obtain ⟨e, he, rfl⟩ := PrimeSpectrum.isClopen_iff.1 hs
          rcases h e he with rfl | rfl
          · left; simp
          · right; simp
        exact { toPreconnectedSpace := hp, toNonempty := inferInstance }
- id: spec_quotient_nilradical_homeomorphism
  kind: gap
  level: 4
  topic: 可換環論・素スペクトラムの射
  statement: $R$を可換環、$\mathfrak{n}$を冪零根基とする。商写像$R\to R/\mathfrak{n}$の誘導する$\operatorname{Spec}(R/\mathfrak{n})\to\operatorname{Spec}R$は同相写像である。
  statement_en: For a commutative ring R with nilradical n, the map Spec(R/n) to Spec R induced by the quotient map is a homeomorphism.
  assumptions:
  - $R$は可換環
  - $\mathfrak{n}$は$R$の冪零根基
  quantifiers:
  - 任意の可換環$R$
  conclusion: $\operatorname{Spec}(R/\mathfrak{n})\to\operatorname{Spec}R$は同相写像である。
  answer: |
    $R$を可換環、$\mathfrak{n}$を冪零根基とし、$\pi:R\to R/\mathfrak{n}$を商写像とする。$\pi$は全射なので、$\pi^*$は閉埋め込みであり、その像は$V(\ker\pi)=V(\mathfrak{n})$である。
    冪零根基はすべての素イデアルに含まれる。冪零元$x$について$x^n=0\in\mathfrak{p}$から$x\in\mathfrak{p}$となるからである。よって$V(\mathfrak{n})=\operatorname{Spec}R$であり、$\pi^*$は全射である。全射な閉埋め込みは同相写像である。
  strategy: Apply the closed embedding of a surjection and note that the nilradical lies in every prime.
  sketch:
  - 'apply_theorem: For the surjection π, the map π* is a closed embedding with image V(ker π).'
  - 'derive: The kernel is the nilradical, which lies in every prime.'
  - 'derive: So V(ker π) is all of Spec R.'
  - 'conclude: A surjective closed embedding is a homeomorphism.'
  openmath: (forall (A) (-> (comm_ring A) (homeomorphism (spec_map (ring_quotient_map (nilradical_of A))) (prime_spectrum (quotient_ring A (nilradical_of A))) (prime_spectrum A))))
  hard_negative:
    statement: 商写像$R\to R/I$の誘導する$\operatorname{Spec}(R/I)\to\operatorname{Spec}R$が同相写像なら$I=0$である。
    reason: 体$k$上の$R=k[x]/(x^2)$で$I=(x)$とする。$R$の素イデアルは$(x)$だけで、$R/I=k$の素イデアルは$0$だけなので、誘導写像は1点から1点への同相写像である。しかし$I\neq 0$である。正しくは$I$が冪零根基に含まれることと同値である。
  target: |
    ∀ (R : Type*) [CommRing R], IsHomeomorph (PrimeSpectrum.comap (Ideal.Quotient.mk (nilradical R)))
  proof: |
    by
      intro R _
      have hf : Function.Surjective (Ideal.Quotient.mk (nilradical R)) := Ideal.Quotient.mk_surjective
      have hc := PrimeSpectrum.isClosedEmbedding_comap_of_surjective _ _ hf
      refine (isHomeomorph_iff_isEmbedding_surjective).2 ⟨hc.isEmbedding, ?_⟩
      rw [← Set.range_eq_univ, range_comap_of_surjective _ _ hf, Ideal.mk_ker, PrimeSpectrum.zeroLocus_eq_univ_iff]
- id: module_zero_checked_at_maximal_ideals
  kind: gap
