  strategy: The annihilator of a nonzero element lies in a maximal ideal, where the element cannot vanish after localizing.
  sketch:
  - 'setup: Suppose x in M is nonzero.'
  - 'derive: Its annihilator is a proper ideal, so it lies in a maximal ideal m.'
  - 'derive: x/1 = 0 in M_m gives s outside m with sx = 0.'
  - 'contradiction: Then s lies in the annihilator, which lies in m.'
  - 'conclude: So M = 0.'
  openmath: (forall (A V) (-> (and (comm_ring A) (module_over V A) (forall (m) (-> (maximal_ideal m A) (zero_module_of (localized_module V m))))) (zero_module_of V)))
  hard_negative:
    statement: $R$加群$M$について、ある1つの極大イデアル$\mathfrak{m}$で$M_{\mathfrak{m}}=0$なら$M=0$である。
    reason: $R=\mathbb{Z}$、$M=\mathbb{Z}/3\mathbb{Z}$、$\mathfrak{m}=(2)$とすると、$3\notin\mathfrak{m}$は$M$を消すので$M_{\mathfrak{m}}=0$であるが、$M\neq 0$である。
  target: |
    ∀ (R M : Type*) [CommRing R] [AddCommGroup M] [Module R M], (∀ (P : Ideal R) [P.IsMaximal], Subsingleton (LocalizedModule P.primeCompl M)) → Subsingleton M
  proof: |
    by
      intro R M _ _ _ h
      exact Module.subsingleton_of_localization_maximal _ (fun P _ => LocalizedModule.mkLinearMap P.primeCompl M) (fun P _ => h P)
