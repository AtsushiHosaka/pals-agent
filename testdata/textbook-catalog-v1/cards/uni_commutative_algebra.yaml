  assumptions:
  - $R$は可換環
  - $M$は$R$加群
  - すべての極大イデアル$\mathfrak{m}$で$M_{\mathfrak{m}}$は$R_{\mathfrak{m}}$上平坦
  quantifiers:
  - 任意の可換環$R$と$R$加群$M$
  conclusion: $M$は$R$上平坦である。
  answer: |
    $R$を可換環、$M$を$R$加群とし、すべての極大イデアルで$M_{\mathfrak{m}}$が$R_{\mathfrak{m}}$上平坦とする。$g:N'\to N$を$R$加群の単射とし、$\mathrm{id}_M\otimes g:M\otimes_RN'\to M\otimes_RN$が単射であることを示す。
    極大イデアル$\mathfrak{m}$をとる。局所化は完全なので$g_{\mathfrak{m}}:N'_{\mathfrak{m}}\to N_{\mathfrak{m}}$は単射である。テンソル積と局所化の標準同型$(M\otimes_RN)_{\mathfrak{m}}\cong M_{\mathfrak{m}}\otimes_{R_{\mathfrak{m}}}N_{\mathfrak{m}}$のもとで、$(\mathrm{id}_M\otimes g)_{\mathfrak{m}}$は$\mathrm{id}\otimes g_{\mathfrak{m}}$と一致する。$M_{\mathfrak{m}}$は平坦なのでこれは単射である。
    線形写像の単射性は極大イデアルでの局所化で判定できるので、$\mathrm{id}_M\otimes g$は単射である。よって$M$は平坦である。
