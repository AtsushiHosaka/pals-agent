  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] (M : Submonoid R), IsLocalization M S → ∀ (I J : Ideal R), (I ⊓ J).map (algebraMap R S) = I.map (algebraMap R S) ⊓ J.map (algebraMap R S)
  proof: |
    by
      intro R S _ _ _ M _ I J
      exact IsLocalization.map_inf M S I J
- id: localization_at_prime_maximal_is_extension
  kind: gap
  level: 3
  topic: 可換環論・素イデアルでの局所化
  statement: $R$を可換環、$\mathfrak{p}$を素イデアルとする。局所環$R_{\mathfrak{p}}$の極大イデアルは$\mathfrak{p}$の拡大$\mathfrak{p}R_{\mathfrak{p}}$である。
  statement_en: For a prime ideal p of a commutative ring R, the maximal ideal of the local ring R_p is the extension pR_p of p.
  assumptions:
  - $R$は可換環
  - $\mathfrak{p}$は素イデアル
  quantifiers:
  - 任意の可換環$R$と素イデアル$\mathfrak{p}$
  conclusion: $R_{\mathfrak{p}}$の極大イデアルは$\mathfrak{p}R_{\mathfrak{p}}$である。
  answer: |
    $R$を可換環、$\mathfrak{p}$を素イデアルとする。$R_{\mathfrak{p}}$の元を$a/s$（$s\notin\mathfrak{p}$）と書く。$a\notin\mathfrak{p}$なら$s/a$が逆元なので$a/s$は単元である。よって単元でない元はすべて$a\in\mathfrak{p}$の形であり、$\mathfrak{p}R_{\mathfrak{p}}$に属する。
    また$\mathfrak{p}$は$R\setminus\mathfrak{p}$と交わらないので、$\mathfrak{p}R_{\mathfrak{p}}$は真のイデアルであり、単元を含まない。したがって$\mathfrak{p}R_{\mathfrak{p}}$は$R_{\mathfrak{p}}$の非単元全体に一致し、これが極大イデアルである。
  strategy: Show that the nonunits of R_p are exactly the elements of pR_p.
  sketch:
  - 'derive: a/s with a outside p has inverse s/a.'
  - 'derive: So every nonunit lies in pR_p.'
  - 'derive: pR_p is proper because p does not meet the complement of p.'
  - 'conclude: pR_p is the set of nonunits, which is the maximal ideal.'
  openmath: (forall (A B p) (-> (and (comm_ring A) (comm_ring B) (prime_ideal p A) (localization_at_prime B A p)) (= (ideal_map (algebra_map A B) p) (unique_maximal_ideal B))))
  hard_negative:
    statement: 可換環の素イデアル$\mathfrak{p}$について、$R_{\mathfrak{p}}$の真のイデアルは$\mathfrak{p}R_{\mathfrak{p}}$だけである。
    reason: $R=\mathbb{Z}$、$\mathfrak{p}=(2)$とすると、$R_{\mathfrak{p}}$の$(0)$や$(4)$も真のイデアルであり、$\mathfrak{p}R_{\mathfrak{p}}=(2)$と異なる。$\mathfrak{p}R_{\mathfrak{p}}$はすべての真のイデアルを含む最大のものである。
  target: |
    ∀ (R : Type*) [CommRing R] (P : Ideal R) [P.IsPrime], P.map (algebraMap R (Localization.AtPrime P)) = IsLocalRing.maximalIdeal (Localization.AtPrime P)
  proof: |
    by
      intro R _ P _
      exact Localization.AtPrime.map_eq_maximalIdeal
- id: localization_zero_ring_iff
  kind: gap
  level: 3
  topic: 可換環論・局所化
  statement: $R$を可換環、$M$を乗法的部分集合とする。局所化$M^{-1}R$が零環であることと$0\in M$であることは同値である。
  statement_en: The localization of a commutative ring at a multiplicative subset M is the zero ring if and only if 0 lies in M.
  assumptions:
  - $R$は可換環
  - $M$は乗法的部分集合
  quantifiers:
  - 任意の可換環$R$と乗法的部分集合$M$
  conclusion: $M^{-1}R=0\iff 0\in M$である。
  answer: |
    $R$を可換環、$M$を乗法的部分集合、$\varphi:R\to S=M^{-1}R$を標準写像とする。$0\in M$なら$\varphi(0)=0$は$S$の単元なので、$S$は零環である。
    逆に$S$が零環とする。$\varphi(1)=\varphi(0)$なので、局所化の定義よりある$u\in M$で$u\cdot 1=u\cdot 0$、すなわち$u=0$である。よって$0\in M$である。
  strategy: Zero being a unit forces the zero ring, and φ(1) = φ(0) gives an element of M equal to 0.
  sketch:
  - 'derive: If 0 lies in M, then φ(0) = 0 is a unit, so S = 0.'
  - 'setup: If S = 0 then φ(1) = φ(0).'
  - 'derive: There is u in M with u = 0.'
  - 'conclude: So 0 lies in M.'
  openmath: (forall (A B T) (-> (and (comm_ring A) (comm_ring B) (submonoid_of T A) (localization_of B A T)) (<-> (not (nontrivial_ring B)) (in 0 T))))
  hard_negative:
    statement: 可換環の乗法的部分集合$M$が零因子を含むなら、$M^{-1}R$は零環である。
    reason: $R=\mathbb{Z}/6\mathbb{Z}$、$M=\{1,2,4\}$とすると、$2$は零因子である。しかし$0\notin M$であり、$M^{-1}R\cong\mathbb{Z}/3\mathbb{Z}$は零環でない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] (M : Submonoid R), IsLocalization M S → (Subsingleton S ↔ (0 : R) ∈ M)
  proof: |
    by
      intro R S _ _ _ M _
      constructor
      · intro h
        by_contra h0
        have := (IsLocalization.toLocalizationMap M S).nontrivial h0
        exact not_subsingleton S h
      · intro h
        have hu : IsUnit (algebraMap R S 0) := IsLocalization.map_units S (⟨0, h⟩ : M)
        rw [map_zero] at hu
        exact isUnit_zero_iff.1 hu |> subsingleton_of_zero_eq_one
- id: localization_of_domain_is_domain
  kind: gap
  level: 3
  topic: 可換環論・局所化
  statement: $R$を整域、$M$を$0$を含まない乗法的部分集合とする。局所化$M^{-1}R$は整域である。
  statement_en: The localization of an integral domain at a multiplicative subset not containing 0 is an integral domain.
  assumptions:
  - $R$は整域
  - $M$は$0$を含まない乗法的部分集合
  quantifiers:
  - 任意の整域$R$と乗法的部分集合$M$
  conclusion: $M^{-1}R$は整域である。
  answer: |
    $R$を整域、$M$を$0$を含まない乗法的部分集合、$S=M^{-1}R$とする。$0\notin M$より$S$は零環でない。実際、$S$で$1=0$なら、ある$u\in M$で$u=0$となって矛盾する。
    $\frac{a}{s}\cdot\frac{b}{t}=0$とすると、ある$u\in M$で$uab=0$である。$u\neq 0$で$R$は整域なので、$a=0$または$b=0$である。よって$a/s=0$または$b/t=0$であり、$S$は整域である。
  strategy: Clear the denominators and use that elements of M are nonzero.
  sketch:
  - 'derive: S is nonzero because 0 is not in M.'
  - 'setup: Let (a/s)(b/t) = 0.'
  - 'derive: There is u in M with uab = 0, and u is nonzero.'
  - 'conclude: So a = 0 or b = 0.'
  openmath: (forall (A B T) (-> (and (integral_domain A) (comm_ring B) (submonoid_of T A) (notin 0 T) (localization_of B A T)) (integral_domain B)))
  hard_negative:
    statement: 可換環の局所化$M^{-1}R$が整域なら、$R$は整域である。
    reason: $R=\mathbb{Z}/6\mathbb{Z}$、$M=\{1,2,4\}$とすると、$M^{-1}R\cong\mathbb{Z}/3\mathbb{Z}$は整域であるが、$R$は整域でない。
  target: |
    ∀ (R S : Type*) [CommRing R] [IsDomain R] [CommRing S] [Algebra R S] (M : Submonoid R), (0 : R) ∉ M → IsLocalization M S → IsDomain S
  proof: |
    by
      intro R S _ _ _ _ M h0 _
      exact IsLocalization.isDomain_of_le_nonZeroDivisors S (M := M) (fun x hx => mem_nonZeroDivisors_of_ne_zero fun h => h0 (h ▸ hx))
- id: minimal_prime_elements_are_zero_divisors_mod_ideal
  kind: gap
  level: 4
  topic: 可換環論・極小素イデアル
  statement: $R$を可換環、$I$をイデアル、$\mathfrak{p}$を$I$上の極小素イデアルとする。任意の$x\in\mathfrak{p}$について、$y\notin I$かつ$xy\in I$となる$y$が存在する。すなわち$\mathfrak{p}$の元は$R/I$の零因子を与える。これは$I=0$の場合の補題を一般のイデアルへ拡張した形である。
  statement_en: Let p be a prime minimal over an ideal I of a commutative ring. For every x in p there is y outside I with xy in I. This generalizes the case I = 0.
  assumptions:
  - $R$は可換環
  - $I$はイデアル
  - $\mathfrak{p}$は$I$上の極小素イデアル
  - $x\in\mathfrak{p}$
  quantifiers:
  - 任意の可換環$R$、イデアル$I$、$I$上の極小素イデアル$\mathfrak{p}$、元$x\in\mathfrak{p}$
  conclusion: $y\notin I$かつ$xy\in I$となる$y$が存在する。
  answer: |
    $R$を可換環、$I$をイデアル、$\mathfrak{p}$を$I$上の極小素イデアル、$x\in\mathfrak{p}$とする。$T=\{x^ny:n\geq 0,\ y\notin\mathfrak{p}\}$は乗法的部分集合である。
    $T\cap I=\emptyset$と仮定する。すると$I$を含み$T$と交わらない素イデアル$\mathfrak{q}$がある。$R\setminus\mathfrak{p}\subseteq T$なので$\mathfrak{q}\subseteq\mathfrak{p}$である。$x=x\cdot 1\in T$なので$x\notin\mathfrak{q}$であり、$\mathfrak{q}\subsetneq\mathfrak{p}$となる。これは$\mathfrak{p}$の極小性に反する。
    よってある$n\geq 0$と$y_0\notin\mathfrak{p}$で$x^ny_0\in I$である。$I\subseteq\mathfrak{p}$より$y_0\notin I$なので、$x^my_0\in I$となる最小の$m$は$1$以上である。$y=x^{m-1}y_0$とおくと$y\notin I$かつ$xy\in I$である。
  strategy: Consider the multiplicative set generated by x and the complement of p, then take a least exponent.
  sketch:
  - 'setup: Let T be the set of products x^n y with y outside p.'
  - 'contradiction: If T misses I, a prime containing I and missing T lies strictly inside p.'
  - 'derive: So x^n y_0 lies in I for some y_0 outside p.'
  - 'construct: Take the least m with x^m y_0 in I, which is at least 1, and put y = x^(m-1) y_0.'
  - 'conclude: Then y is outside I and xy lies in I.'
  openmath: (forall (A I p x) (-> (and (comm_ring A) (ideal_of I A) (minimal_prime_over p I) (in x p)) (exists (y) (and (in y A) (notin y I) (in (* x y) I)))))
  hard_negative:
    statement: $\mathfrak{p}$が$I$上の極小素イデアルなら、$\mathfrak{p}$の元はある冪で$I$に入る。
    reason: 体$k$上の$R=k[x,y]/(xy)$で$I=0$、$\mathfrak{p}=(x)$とする。$\mathfrak{p}$は極小素イデアルで$x\in\mathfrak{p}$であるが、$x$は冪零でない。$xy=0$となる$y\neq 0$はある。
  target: |
    ∀ (R : Type*) [CommRing R] (I P : Ideal R), P ∈ I.minimalPrimes → ∀ x ∈ P, ∃ y, y ∉ I ∧ x * y ∈ I
  proof: |
    by
      intro R _ I P hP x hx
      obtain ⟨y, hy, h⟩ := Ideal.exists_mul_mem_of_mem_minimalPrimes hP hx
      exact ⟨y, hy, h⟩
- id: localization_reduced_minimal_prime_is_field
  kind: gap
  level: 4
  topic: 可換環論・極小素イデアル
  statement: $R$を被約な可換環、$\mathfrak{p}$を$R$の極小素イデアルとする。局所化$R_{\mathfrak{p}}$は体である。
  statement_en: If R is a reduced commutative ring and p is a minimal prime ideal of R, then the localization R_p is a field.
  assumptions:
  - $R$は被約な可換環
  - $\mathfrak{p}$は極小素イデアル
  quantifiers:
  - 任意の被約な可換環$R$と極小素イデアル$\mathfrak{p}$
  conclusion: $R_{\mathfrak{p}}$は体である。
  answer: |
    $R$を被約な可換環、$\mathfrak{p}$を極小素イデアルとする。$R_{\mathfrak{p}}$の素イデアルは$\mathfrak{p}$に含まれる$R$の素イデアルに対応する。$\mathfrak{p}$は極小なので、$R_{\mathfrak{p}}$の素イデアルは極大イデアル$\mathfrak{p}R_{\mathfrak{p}}$だけである。冪零根基は素イデアルの共通部分なので、$\mathfrak{p}R_{\mathfrak{p}}$は$R_{\mathfrak{p}}$の冪零根基に等しい。
    一方$R_{\mathfrak{p}}$は被約である。$(a/s)^n=0$なら、ある$u\notin\mathfrak{p}$で$ua^n=0$であり、$(ua)^n=0$と$R$の被約性から$ua=0$となって$a/s=0$となるからである。よって冪零根基は$0$であり、$\mathfrak{p}R_{\mathfrak{p}}=0$である。極大イデアルが$0$の局所環は体である。
  strategy: The localization has a unique prime, equal to its nilradical, which vanishes by reducedness.
  sketch:
  - 'derive: Primes of R_p correspond to primes inside p, so p R_p is the only prime.'
  - 'derive: Hence the maximal ideal equals the nilradical of R_p.'
  - 'derive: R_p is reduced because R is reduced.'
  - 'conclude: The maximal ideal is zero, so R_p is a field.'
  openmath: (forall (A B p) (-> (and (comm_ring A) (reduced_ring A) (minimal_prime_over p (zero_ideal A)) (comm_ring B) (localization_at_prime B A p)) (is_field B)))
  hard_negative:
    statement: 可換環$R$の極小素イデアル$\mathfrak{p}$について、$R$が被約でなくても$R_{\mathfrak{p}}$は体である。
    reason: 体$k$上の$R=k[x]/(x^2)$で$\mathfrak{p}=(x)$は極小素イデアルであり、$R$は局所環なので$R_{\mathfrak{p}}=R$である。$x\neq 0$は単元でないので、$R_{\mathfrak{p}}$は体でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsReduced R] (P : Ideal R) [P.IsPrime], P ∈ minimalPrimes R → IsField (Localization.AtPrime P)
  proof: |
    by
      intro R _ _ P _ hP
      have hred : IsReduced (Localization.AtPrime P) := isReduced_localizationPreserves P.primeCompl _ inferInstance
      have h := IsLocalization.AtPrime.radical_map_of_mem_minimalPrimes (A := Localization.AtPrime P) P ⊥ hP
      rw [IsLocalRing.isField_iff_maximalIdeal_eq, ← Localization.AtPrime.map_eq_maximalIdeal, ← h, Ideal.map_bot, eq_bot_iff]
      intro x hx
      obtain ⟨n, hn⟩ := hx
      exact Ideal.mem_bot.2 (IsNilpotent.eq_zero ⟨n, Ideal.mem_bot.1 hn⟩)
- id: determinant_trick
  kind: gap
  level: 3
  topic: 可換環論・行列式の技法
  statement: $R$を可換環、$M$を有限生成$R$加群、$I$をイデアル、$\phi$を$M$の$R$線形自己準同型とし、$\phi(M)\subseteq IM$とする。このときモニック多項式$p\in R[X]$で、$p(\phi)=0$かつ、$d=\deg p$として各$k$で$X^k$の係数が$I^{d-k}$に属するものが存在する（$k>d$の係数は$0$である）。
  statement_en: Let M be a finitely generated module over a commutative ring R, I an ideal and φ an endomorphism of M with φ(M) ⊆ IM. Then there is a monic polynomial p in R[X] with p(φ) = 0 whose coefficient of X^k lies in I^(d-k), where d is the degree of p.
  assumptions:
  - $R$は可換環
  - $M$は有限生成$R$加群
  - $I$はイデアル
  - $\phi$は$R$線形自己準同型
  - $\phi(M)\subseteq IM$
  quantifiers:
  - 任意の可換環$R$、有限生成加群$M$、イデアル$I$、自己準同型$\phi$
  conclusion: 係数が$I$の冪に入るモニック多項式$p$で$p(\phi)=0$となるものがある。
  answer: |
    $R$を可換環、$M$を$x_1,\dots,x_n$で生成される$R$加群、$I$をイデアル、$\phi$を$\phi(M)\subseteq IM$を満たす自己準同型とする。$\phi(x_i)\in IM$なので、$\phi(x_i)=\sum_ja_{ij}x_j$（$a_{ij}\in I$）と書ける。$X$が$\phi$として作用するとして$M$を$R[X]$加群とみなす。$n$次行列$A=(a_{ij})$について、列ベクトル$x=(x_1,\dots,x_n)^{T}$は$(XE-A)x=0$を満たす。
    左から$XE-A$の余因子行列を掛けると、$\det(XE-A)\cdot x_i=0$がすべての$i$で成り立つ。$x_i$は$M$を生成するので、$p=\det(XE-A)$について$p(\phi)=0$である。
    $p$は$n$次モニックである。$X^{n-j}$の係数は、$A$の$j$次主小行列式の和の$\pm 1$倍である。$j$次小行列式は$a_{ij}$の$j$次式なので$I^j$に属する。よって$X^k$の係数は$I^{n-k}$に属する。$k>n$の係数は$0$である。
  strategy: Write φ as a matrix with entries in I and apply the adjugate to the characteristic matrix.
  sketch:
  - 'setup: Take generators x_i and write φ(x_i) as a combination with coefficients a_ij in I.'
  - 'translate: Regard M as an R[X]-module with X acting as φ, so (XE - A)x = 0.'
  - 'derive: Multiplying by the adjugate gives det(XE - A) x_i = 0 for each i.'
  - 'derive: So p = det(XE - A) satisfies p(φ) = 0.'
  - 'derive: The coefficient of X^(n-j) is a sum of j-by-j principal minors of A up to sign, which lies in I^j.'
  - 'conclude: p has the required form.'
  openmath: (forall (A V I f) (-> (and (comm_ring A) (module_over V A) (finitely_generated_module A V) (ideal_of I A) (module_hom f A V V) (subset (range_of f) (ideal_smul_submodule I (whole_submodule V)))) (exists (p) (and (polynomial_over p A) (monic_polynomial p) (forall (k) (-> (and (in k N) (<= k (poly_degree p))) (in (poly_coeff p k) (ideal_power I (- (poly_degree p) k))))) (= (poly_eval p f) 0)))))
  hard_negative:
    statement: 有限生成とは限らない$R$加群$M$と$\phi(M)\subseteq IM$を満たす$\phi$についても、$p(\phi)=0$となるモニック多項式$p$が存在する。
    reason: 体$k$上の無限次元ベクトル空間を$M=k[t]$とし、$R=k$、$I=k$、$\phi$を$t$倍とする。$\phi(M)\subseteq IM=M$であるが、$p\neq 0$なら$p(\phi)1=p(t)\neq 0$なので、$p(\phi)=0$となる多項式はない。
  target: |
    ∀ (R M : Type*) [CommRing R] [AddCommGroup M] [Module R M] [Module.Finite R M] (f : Module.End R M) (I : Ideal R), LinearMap.range f ≤ I • ⊤ → ∃ p : Polynomial R, p.Monic ∧ (∀ k, p.coeff k ∈ I ^ (p.natDegree - k)) ∧ Polynomial.aeval f p = 0
  proof: |
    by
      intro R M _ _ _ _ f I h
      obtain ⟨p, h1, -, h3, h4⟩ := LinearMap.exists_monic_and_natDegree_eq_and_coeff_mem_pow_and_aeval_eq_zero R f I h
      exact ⟨p, h1, h3, h4⟩
- id: fg_module_surjective_endomorphism_injective
  kind: textbook
  level: 4
  topic: 可換環論・有限生成加群の自己準同型
  statement: $R$を可換環、$M$を有限生成$R$加群とする。$M$の全射な$R$線形自己準同型は単射である。
  statement_en: Every surjective linear endomorphism of a finitely generated module over a commutative ring is injective.
  assumptions:
  - $R$は可換環
  - $M$は有限生成$R$加群
  - $f:M\to M$は全射$R$線形写像
  quantifiers:
  - 任意の可換環$R$、有限生成加群$M$、全射線形写像$f$
  conclusion: $f$は単射である。
  answer: |
    $R$を可換環、$M$を有限生成$R$加群、$f:M\to M$を全射$R$線形写像とする。$X$が$f$として作用するとして$M$を$R[X]$加群とみなす。$M$は$R[X]$上でも有限生成である。$J=(X)\subseteq R[X]$とおくと、$f$の全射性より$JM=M$である。
    中山の補題の形として、有限生成加群$M$とイデアル$J$が$JM=M$を満たせば、ある$a\in J$で$(1-a)M=0$である。これを適用すると、$a=Xq(X)$となる$q\in R[X]$があり、$M$上で$1-f\circ q(f)=0$である。
    $y\in M$で$f(y)=0$とする。$q(f)$と$f$は可換なので、$y=f(q(f)(y))=q(f)(f(y))=0$である。よって$f$は単射である。
  strategy: View M as an R[X]-module and apply Nakayama's lemma to the ideal (X).
  sketch:
  - 'translate: Make M a finitely generated R[X]-module with X acting as f.'
  - 'derive: Surjectivity of f says (X)M = M.'
  - 'apply_theorem: Nakayama''s lemma gives a = Xq(X) with (1 - a)M = 0.'
  - 'derive: So the identity equals f composed with q(f).'
  - 'conclude: If f(y) = 0, then y = q(f)(f(y)) = 0.'
  openmath: (forall (A V f) (-> (and (comm_ring A) (module_over V A) (finitely_generated_module A V) (module_hom f A V V) (surjective f)) (injective f)))
  hard_negative:
    statement: 有限生成$R$加群の単射な$R$線形自己準同型は全射である。
    reason: $R=\mathbb{Z}$、$M=\mathbb{Z}$、$f$を$2$倍とすると、$f$は単射であるが全射でない。単射から全射を導くにはアルティン性などの仮定が要る。
  target: |
    ∀ (R M : Type*) [CommRing R] [AddCommGroup M] [Module R M] [Module.Finite R M] (f : M →ₗ[R] M), Function.Surjective f → Function.Injective f
  proof: |
    by
      intro R M _ _ _ _ f hf
      exact OrzechProperty.injective_of_surjective_endomorphism f hf
- id: fg_flat_over_local_is_free
  kind: textbook
  level: 4
  topic: 可換環論・局所環上の平坦加群
  statement: $R$を局所環、$M$を有限生成$R$加群とする。$M$が平坦なら$M$は自由である。
  statement_en: A finitely generated flat module over a local ring is free.
  assumptions:
  - $R$は局所環
  - $M$は有限生成$R$加群
  - $M$は$R$上平坦
  quantifiers:
  - 任意の局所環$R$と有限生成平坦加群$M$
  conclusion: $M$は自由加群である。
  answer: |
    $R$を局所環、$\mathfrak{m}$を極大イデアル、$M$を有限生成平坦$R$加群とする。平坦性の方程式的判定を用いる。これは、$\sum_ia_ix_i=0$（$a_i\in R$、$x_i\in M$）なら、$x_i=\sum_jb_{ij}y_j$（$b_{ij}\in R$、$y_j\in M$）で、各$j$で$\sum_ia_ib_{ij}=0$となるものがあるという事実である。
    まず、$x_1,\dots,x_n\in M$の$M/\mathfrak{m}M$での像が一次独立なら、$x_i$は$R$上一次独立であることを$n$の帰納法で示す。$\sum_ia_ix_i=0$とし、上の$b_{ij},y_j$をとる。$x_n\notin\mathfrak{m}M$なので、ある$j$で$b_{nj}\notin\mathfrak{m}$であり、$b_{nj}$は単元である。$\sum_ia_ib_{ij}=0$より$a_n=-\sum_{i<n}a_ic_i$（$c_i=b_{ij}/b_{nj}$）である。これを代入すると$\sum_{i<n}a_i(x_i-c_ix_n)=0$となる。$x_i-c_ix_n$（$i<n$）の像は一次独立である。$n=1$なら$a_1=0$である。$n>1$なら帰納法の仮定より$a_i=0$（$i<n$）であり、$a_n=0$である。
    $M/\mathfrak{m}M$は有限次元ベクトル空間なので、基底の持ち上げ$x_1,\dots,x_n\in M$をとる。中山の補題より$x_i$は$M$を生成し、上で示したことより一次独立である。よって$M$は自由である。
  strategy: Use the equational criterion of flatness to lift a basis of M/mM to a basis of M.
  sketch:
  - 'apply_theorem: The equational criterion expresses any relation among elements of a flat module through a common family.'
  - 'setup: Suppose the images of x_1, ..., x_n in M/mM are independent and Σ a_i x_i = 0.'
  - 'derive: Some b_nj is a unit, which expresses a_n through the other a_i.'
  - 'induction: Substituting yields a relation among n - 1 elements with independent images, so all a_i vanish.'
  - 'apply_theorem: Lifting a basis of M/mM gives generators by Nakayama''s lemma.'
  - 'conclude: These generators are independent, so M is free.'
  openmath: (forall (A V) (-> (and (comm_ring A) (local_ring A) (module_over V A) (finitely_generated_module A V) (flat_module A V)) (free_module A V)))
  hard_negative:
    statement: 局所環上の平坦加群は有限生成でなくても自由である。
    reason: 局所環$\mathbb{Z}_{(2)}$上で$\mathbb{Q}$はねじれのない加群であり、PID上なので平坦である。しかし$\mathbb{Q}$は$2$で割り切れる元ばかりなので、自由加群にならない。自由加群なら$\bigcap_n2^nM=0$となるからである。
  target: |
    ∀ (R M : Type*) [CommRing R] [IsLocalRing R] [AddCommGroup M] [Module R M] [Module.Finite R M] [Module.Flat R M], Module.Free R M
  proof: |
    by
      intro R M _ _ _ _ _ _
      exact Module.free_of_flat_of_isLocalRing
- id: primary_iff_quotient_zero_divisors_nilpotent
  kind: gap
  level: 4
  topic: 可換環論・準素イデアル
  statement: $R$を可換環、$I$をイデアルとする。$I$が準素イデアルであることと、$I\neq R$かつ$R/I$で$ab=0$なら$a=0$または$b$が冪零であることは同値である。
  statement_en: An ideal I of a commutative ring R is primary if and only if I ≠ R and, in R/I, ab = 0 implies a = 0 or b nilpotent.
  assumptions:
  - $R$は可換環
  - $I$はイデアル
  - $I$が準素とは$I\neq R$かつ$xy\in I$なら$x\in I$または$y\in\sqrt{I}$であること
  quantifiers:
  - 任意の可換環$R$とイデアル$I$
  conclusion: $I$が準素であることと、$R/I$の零因子がすべて冪零であること（$I\neq R$）は同値である。
  answer: |
    $R$を可換環、$I$をイデアルとし、$I\neq R$とする。$a,b\in R/I$を$x,y\in R$の剰余類とする。$ab=0$は$xy\in I$と同値であり、$a=0$は$x\in I$と同値である。$b$が冪零であることは、ある$n$で$y^n\in I$であること、すなわち$y\in\sqrt{I}$であることと同値である。
    よって「$xy\in I$なら$x\in I$または$y\in\sqrt{I}$」と「$ab=0$なら$a=0$または$b$が冪零」は同じ条件である。どちらの条件も$I\neq R$を含むので、主張が従う。
  strategy: Translate each condition through residue classes modulo I.
  sketch:
  - 'setup: Let a and b be classes of x and y modulo I.'
  - 'translate: ab = 0 means xy lies in I, and a = 0 means x lies in I.'
  - 'translate: b is nilpotent iff y lies in rad(I).'
  - 'conclude: The two conditions coincide.'
  openmath: (forall (A I) (-> (and (comm_ring A) (ideal_of I A)) (<-> (primary_ideal I A) (and (!= I (unit_ideal A)) (forall (a b) (-> (and (in a (quotient_ring A I)) (in b (quotient_ring A I)) (= (* a b) 0)) (or (= a 0) (nilpotent_element b (quotient_ring A I)))))))))
  hard_negative:
    statement: $\sqrt{I}$が素イデアルなら$I$は準素イデアルである。
    reason: 体$k$上の$k[x,y]$で$I=(x^2,xy)$とすると、$\sqrt{I}=(x)$は素イデアルである。しかし$xy\in I$、$x\notin I$であり、$y\notin\sqrt{I}$なので、$I$は準素でない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R), I.IsPrimary ↔ I ≠ ⊤ ∧ ∀ a b : R ⧸ I, a * b = 0 → a = 0 ∨ IsNilpotent b
  proof: |
    by
      intro R _ I
      rw [Ideal.isPrimary_iff]
      refine and_congr_right fun _ => ?_
      constructor
      · intro h a b hab
        obtain ⟨x, rfl⟩ := Ideal.Quotient.mk_surjective a
        obtain ⟨y, rfl⟩ := Ideal.Quotient.mk_surjective b
        rw [← map_mul, Ideal.Quotient.eq_zero_iff_mem] at hab
        rcases h hab with hx | ⟨n, hn⟩
        · exact Or.inl (Ideal.Quotient.eq_zero_iff_mem.2 hx)
        · exact Or.inr ⟨n, by rw [← map_pow, Ideal.Quotient.eq_zero_iff_mem]; exact hn⟩
      · intro h x y hxy
        rcases h (Ideal.Quotient.mk I x) (Ideal.Quotient.mk I y) (by rw [← map_mul, Ideal.Quotient.eq_zero_iff_mem]; exact hxy) with hx | ⟨n, hn⟩
        · exact Or.inl (Ideal.Quotient.eq_zero_iff_mem.1 hx)
        · exact Or.inr ⟨n, by rw [← map_pow, Ideal.Quotient.eq_zero_iff_mem] at hn; exact hn⟩
- id: primary_finite_intersection_same_radical
  kind: gap
  level: 4
  topic: 可換環論・準素イデアル
  statement: $R$を可換環、$P$をイデアル、$(F_i)_{i\in s}$を準素イデアルの空でない有限族とし、すべての$i\in s$で$\sqrt{F_i}=P$とする。このとき$\bigcap_{i\in s}F_i$は準素イデアルで、その根基は$P$である。
  statement_en: A finite nonempty intersection of primary ideals of a commutative ring with the same radical P is primary with radical P.
  assumptions:
  - $R$は可換環
  - $s$は空でない有限集合
  - 各$F_i$は準素イデアル
  - 各$i$で$\sqrt{F_i}=P$
  quantifiers:
  - 任意の可換環$R$と準素イデアルの有限族$(F_i)_{i\in s}$
  conclusion: $\bigcap_{i\in s}F_i$は準素で、根基は$P$である。
  answer: |
    $R$を可換環、$(F_i)_{i\in s}$を準素イデアルの空でない有限族とし、すべての$i\in s$で$\sqrt{F_i}=P$とする。$F=\bigcap_{i\in s}F_i$とおく。根基は有限個の共通部分と可換なので、$\sqrt{F}=\bigcap_{i\in s}\sqrt{F_i}=P$である。$s$は空でなく$F\subseteq F_i\neq R$なので、$F\neq R$である。
    $xy\in F$、$x\notin F$とする。ある$j\in s$で$x\notin F_j$である。$xy\in F_j$で$F_j$は準素なので、$y\in\sqrt{F_j}=P=\sqrt{F}$である。よって$F$は準素イデアルである。
  strategy: Compute the radical of the intersection and test primariness in a component that omits x.
  sketch:
  - 'apply_theorem: The radical of a finite intersection is the intersection of the radicals, which is P.'
  - 'derive: F is proper because s is nonempty.'
  - 'setup: Let xy lie in F with x outside F.'
  - 'derive: x is outside some F_j, and primariness of F_j gives y in P.'
  - 'conclude: F is primary with radical P.'
  openmath: (forall (A F s y) (-> (and (comm_ring A) (finite_set s) (in y s) (forall (i) (-> (in i s) (primary_ideal (family_value F i) A))) (forall (i) (-> (in i s) (= (ideal_radical (family_value F i)) (ideal_radical (family_value F y)))))) (and (primary_ideal (ideal_family_inf_over F s) A) (= (ideal_radical (ideal_family_inf_over F s)) (ideal_radical (family_value F y))))))
  hard_negative:
    statement: 準素イデアルの有限個の共通部分はつねに準素である。
    reason: $\mathbb{Z}$で$(2)$と$(3)$は準素であるが、$(2)\cap(3)=(6)$は準素でない。$2\cdot 3\in(6)$、$2\notin(6)$であり、$3$の冪は$(6)$に入らない。根基が等しいという仮定が要る。
  target: |
    ∀ (R ι : Type*) [CommRing R] (s : Finset ι) (F : ι → Ideal R) (P : Ideal R), s.Nonempty → (∀ i ∈ s, (F i).IsPrimary) → (∀ i ∈ s, (F i).radical = P) → (s.inf F).IsPrimary ∧ (s.inf F).radical = P
  proof: |
    by
      intro R ι _ s F P hs h1 h2
      classical
      obtain ⟨i, hi⟩ := hs
      refine ⟨Ideal.isPrimary_finsetInf hi h1 (fun y hy => by rw [h2 y hy, h2 i hi]), ?_⟩
      have key : ∀ t : Finset ι, t.Nonempty → (∀ i ∈ t, (F i).radical = P) → (t.inf F).radical = P := by
        intro t ht
        induction ht using Finset.Nonempty.cons_induction with
        | singleton a => intro h; simpa using h a (by simp)
        | cons a t ha ht ih =>
          intro h
          rw [Finset.cons_eq_insert, Finset.inf_insert, Ideal.radical_inf, h a (by simp), ih (fun j hj => h j (by simp [hj]))]
          simp
      exact key s ⟨i, hi⟩ h2
- id: maximal_ideal_power_is_primary
  kind: gap
  level: 4
  topic: 可換環論・準素イデアル
  statement: $R$を可換環、$\mathfrak{m}$を極大イデアル、$n\geq 1$とする。$\mathfrak{m}^n$は準素イデアルである。
  statement_en: A positive power of a maximal ideal of a commutative ring is a primary ideal.
  assumptions:
  - $R$は可換環
  - $\mathfrak{m}$は極大イデアル
  - $n\geq 1$
  quantifiers:
  - 任意の可換環$R$、極大イデアル$\mathfrak{m}$、整数$n\geq 1$
  conclusion: $\mathfrak{m}^n$は準素イデアルである。
  answer: |
    $R$を可換環、$\mathfrak{m}$を極大イデアル、$n\geq 1$とする。$\sqrt{\mathfrak{m}^n}=\mathfrak{m}$であり、$\mathfrak{m}^n\neq R$である。$xy\in\mathfrak{m}^n$、$y\notin\mathfrak{m}$とし、$x\in\mathfrak{m}^n$を示せばよい。
    $\mathfrak{m}$は極大で$y\notin\mathfrak{m}$なので、$uy+v=1$となる$u\in R$、$v\in\mathfrak{m}$がある。両辺を$n$乗して展開すると、$v^n$以外の項は$y$を因数にもつので、$u'y+v^n=1$となる$u'\in R$がある。よって$x=u'xy+v^nx\in\mathfrak{m}^n$である。
  strategy: An element outside m is invertible modulo m^n, which allows one to cancel y.
  sketch:
  - 'derive: The radical of m^n is m and m^n is proper.'
  - 'setup: Let xy lie in m^n with y outside m.'
  - 'construct: Write uy + v = 1 with v in m, and raise it to the n-th power to get u''y + v^n = 1.'
  - 'conclude: Then x = u''xy + v^n x lies in m^n.'
  openmath: (forall (A m n) (-> (and (comm_ring A) (maximal_ideal m A) (in n N) (>= n 1)) (primary_ideal (ideal_power m n) A)))
  hard_negative:
    statement: 可換環の素イデアル$\mathfrak{p}$の冪$\mathfrak{p}^n$は準素イデアルである。
    reason: 体$k$上の$R=k[x,y,z]/(xy-z^2)$で$\mathfrak{p}=(x,z)$は素イデアルである。$xy=z^2\in\mathfrak{p}^2$であるが、$x\notin\mathfrak{p}^2$であり、$y\notin\mathfrak{p}=\sqrt{\mathfrak{p}^2}$なので、$\mathfrak{p}^2$は準素でない。
  target: |
    ∀ (R : Type*) [CommRing R] (m : Ideal R) (n : ℕ), m.IsMaximal → n ≠ 0 → (m ^ n).IsPrimary
  proof: |
    by
      intro R _ m n hm hn
      apply Ideal.isPrimary_of_isMaximal_radical
      rw [Ideal.radical_pow m hn, hm.isPrime.radical]
      exact hm
- id: minimal_primary_decomposition_exists
  kind: named
  level: 4
  topic: 可換環論・準素分解
  statement: （ラスカー・ネーターの定理の極小分解の形）$R$をネーター環、$I$をイデアルとする。準素イデアルの有限集合$t$で次を満たすものが存在する。$\bigcap_{J\in t}J=I$であり、$J\in t$の根基は互いに異なり、どの$J\in t$も共通部分から除けない。さらに$\{\sqrt{J}:J\in t\}$は$\{\mathfrak{p}:\mathfrak{p}\text{は素イデアルで}\ \exists x,\ \mathfrak{p}=\sqrt{(I:x)}\}$に等しい。ただし$I=R$のとき$t$は空である。ラスカー・ネーターの定理の存在の主張に、極小性と根基の特徴づけを加えた形である。
  statement_en: 'Lasker-Noether, minimal form. Every ideal I of a Noetherian ring is a finite intersection of primary ideals with pairwise distinct radicals in which no component can be omitted, the unit ideal being the empty intersection; moreover the radicals of the components are exactly the prime ideals of the form rad(I : x). This strengthens the existence statement of primary decomposition.'
  assumptions:
  - $R$はネーター可換環
  - $I$はイデアル
  - $(I:x)=\{r\in R:rx\in I\}$
  quantifiers:
  - 任意のネーター環$R$とイデアル$I$
  conclusion: 極小準素分解が存在し、成分の根基全体は素イデアルとなる$\sqrt{(I:x)}$全体に等しい。
  answer: |
    $R$をネーター可換環、$I$をイデアルとする。ネーター環では、すべてのイデアルが有限個の既約イデアルの共通部分である。そうでないイデアルの集合が空でないとして極大元$I_0$をとると、$I_0$は既約でなく、より大きい2つのイデアルの共通部分となり、矛盾するからである（$R$は空な共通部分である）。ネーター環の既約イデアルは準素なので、$I$は準素イデアルの有限個の共通部分である。
    同じ根基をもつ成分は、その共通部分が同じ根基の準素イデアルであるのでまとめる。さらに、他の成分の共通部分を含む成分を順に除く。こうして根基が互いに異なり、どの成分も除けない有限集合$t$を得る。
    次に根基を特徴づける。$x\in R$について$(I:x)=\bigcap_{J\in t}(J:x)$である。$x\in J$なら$(J:x)=R$であり、$x\notin J$なら$(J:x)$は$\sqrt{J}$を根基にもつ準素イデアルである。よって$\sqrt{(I:x)}=\bigcap_{J\in t,\,x\notin J}\sqrt{J}$である。
    $\sqrt{(I:x)}$が素イデアルなら、素イデアルが有限個の共通部分を含むことから、ある$J$で$\sqrt{J}\subseteq\sqrt{(I:x)}$である。上の式より逆の包含もあるので$\sqrt{(I:x)}=\sqrt{J}$である。逆に$J\in t$をとる。$J$は除けないので、$x\in\bigcap_{K\neq J}K$で$x\notin J$となるものがある。このとき$\sqrt{(I:x)}=\sqrt{J}$は素イデアルである。
  strategy: 'Decompose into irreducibles by Noetherian induction, merge and prune components, then compute rad(I : x) from the decomposition.'
  sketch:
  - 'apply_theorem: Noetherian induction writes I as a finite intersection of irreducible ideals.'
  - 'apply_theorem: Irreducible ideals of a Noetherian ring are primary.'
  - 'derive: Merging components with equal radical and removing redundant ones gives the minimal form.'
  - 'derive: For each x, rad(I : x) is the intersection of rad(J) over J not containing x.'
  - 'derive: If this is prime, it equals some rad(J).'
  - 'construct: For J in t, choose x in the other components but not in J.'
  - 'conclude: Then rad(I : x) = rad(J), so the two sets agree.'
  openmath: (forall (A I) (-> (and (comm_ring A) (noetherian_ring A) (ideal_of I A)) (exists (t) (and (finite_set t) (= (finite_ideal_family_inf t) I) (forall (J) (-> (in J t) (primary_ideal J A))) (forall (J K) (-> (and (in J t) (in K t) (!= J K)) (!= (ideal_radical J) (ideal_radical K)))) (forall (J) (-> (in J t) (not (subset (finite_ideal_family_inf (setdiff t (singleton_set J))) J)))) (forall (p) (<-> (exists (J) (and (in J t) (= p (ideal_radical J)))) (and (prime_ideal p A) (exists (x) (and (in x A) (= p (ideal_radical (colon_ideal I (principal_ideal x)))))))))))))
  hard_negative:
    statement: 極小準素分解の成分そのものは$I$から一意に定まる。
    reason: 体$k$上の$k[x,y]$で$I=(x^2,xy)$とすると、$I=(x)\cap(x,y)^2$と$I=(x)\cap(x^2,y)$はどちらも極小準素分解であり、成分が異なる。一意に定まるのは根基の集合である。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] (I : Ideal R), ∃ t : Finset (Ideal R), t.inf id = I ∧ (∀ J ∈ t, J.IsPrimary) ∧ (t : Set (Ideal R)).Pairwise (fun J K => J.radical ≠ K.radical) ∧ (∀ J ∈ t, ¬ (t.erase J).inf id ≤ J) ∧ Ideal.radical '' (t : Set (Ideal R)) = {P : Ideal R | P.IsPrime ∧ ∃ x : R, P = (Submodule.colon I {x}).radical}
  proof: |
    by
      intro R _ _ I
      obtain ⟨t, ht⟩ := Submodule.IsLasker.exists_isMinimalPrimaryDecomposition (Submodule.isLasker R R) I
      refine ⟨t, ht.inf_eq, ht.primary, ?_, ht.minimal, ?_⟩
      · intro J hJ K hK hne
        have := ht.distinct hJ hK hne
        simpa only [Function.onFun, Submodule.colon_univ] using this
      · have h := ht.image_radical_eq_associated_primes
        simp only [Submodule.colon_univ] at h
        have h' : Submodule.associatedPrimes I = {P : Ideal R | P.IsPrime ∧ ∃ x : R, P = (Submodule.colon I {x}).radical} := by
          ext P
          exact Submodule.isAssociatedPrime_def
        exact h.trans h'
- id: minimal_primes_appear_in_primary_decomposition
  kind: gap
  level: 4
  topic: 可換環論・準素分解
  statement: $R$を可換環、$I$をイデアル、$t$を準素イデアルの有限集合で$\bigcap_{J\in t}J=I$を満たすものとする。$I$上の極小素イデアルは、すべてある$J\in t$の根基$\sqrt{J}$である。
  statement_en: If an ideal I of a commutative ring is a finite intersection of primary ideals J, then every prime minimal over I is the radical of some J.
  assumptions:
  - $R$は可換環
  - $t$は準素イデアルの有限集合
  - $\bigcap_{J\in t}J=I$
  quantifiers:
  - 任意の可換環$R$、イデアル$I$、準素分解$t$
  conclusion: $I$上の極小素イデアルはある$J\in t$の根基である。
  answer: |
    $R$を可換環、$I$をイデアル、$t$を準素イデアルの有限集合で$\bigcap_{J\in t}J=I$とし、$\mathfrak{p}$を$I$上の極小素イデアルとする。$\bigcap_{J\in t}J\subseteq\mathfrak{p}$で$\mathfrak{p}$は素イデアルなので、ある$J\in t$で$J\subseteq\mathfrak{p}$である（$t$が空なら$I=R$であり、極小素イデアルはない）。根基をとると$\sqrt{J}\subseteq\mathfrak{p}$である。
    $\sqrt{J}$は準素イデアルの根基なので素イデアルであり、$I\subseteq J\subseteq\sqrt{J}$である。$\mathfrak{p}$の極小性より$\sqrt{J}=\mathfrak{p}$である。
  strategy: A prime containing a finite intersection contains a component, and minimality forces equality with its radical.
  sketch:
  - 'setup: Let p be minimal over I.'
  - 'apply_theorem: p contains a finite intersection, so it contains some J in t.'
  - 'derive: Taking radicals, rad(J) lies in p, and rad(J) is a prime containing I.'
  - 'conclude: Minimality gives rad(J) = p.'
  openmath: (forall (A I t) (-> (and (comm_ring A) (ideal_of I A) (finite_set t) (= (finite_ideal_family_inf t) I) (forall (J) (-> (in J t) (primary_ideal J A)))) (forall (p) (-> (minimal_prime_over p I) (exists (J) (and (in J t) (= p (ideal_radical J))))))))
  hard_negative:
    statement: 準素分解の成分の根基は、すべて$I$上の極小素イデアルである。
    reason: 体$k$上の$k[x,y]$で$I=(x^2,xy)=(x)\cap(x,y)^2$とすると、成分の根基は$(x)$と$(x,y)$である。$(x,y)$は$(x)$を真に含むので、$I$上の極小素イデアルでない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R) (t : Finset (Ideal R)), t.inf id = I → (∀ J ∈ t, J.IsPrimary) → I.minimalPrimes ⊆ Ideal.radical '' (t : Set (Ideal R))
  proof: |
    by
      intro R _ I t h1 h2 P hP
      have hPp := hP.1.1
      have h : t.inf id ≤ P := h1 ▸ hP.1.2
      obtain ⟨J, hJ, hle⟩ := (Ideal.IsPrime.inf_le' hPp).1 h
      have hJp : J.radical.IsPrime := Ideal.isPrime_radical (h2 J hJ)
      have hIJ : I ≤ J.radical := by
        rw [← h1]
        exact (Finset.inf_le (f := id) hJ).trans Ideal.le_radical
      exact ⟨J, hJ, le_antisymm (hPp.radical_le_iff.2 hle) (hP.2 ⟨hJp, hIJ⟩ ((hPp.radical_le_iff.2 hle)))⟩
- id: irreducible_ideal_is_primary
  kind: textbook
  level: 4
  topic: 可換環論・準素分解
  statement: $R$をネーター環、$I$を既約イデアルとする。すなわち$I\neq R$で、$I=A\cap B$（$A,B$はイデアル）なら$I=A$または$I=B$である。このとき$I$は準素イデアルである。
  statement_en: An irreducible ideal of a Noetherian ring, meaning a proper ideal that is not an intersection of two strictly larger ideals, is primary.
  assumptions:
  - $R$はネーター可換環
  - $I$は既約イデアル
  quantifiers:
  - 任意のネーター環$R$と既約イデアル$I$
  conclusion: $I$は準素イデアルである。
  answer: |
    $R$をネーター可換環、$I$を既約イデアルとする。$R/I$で考える。$\bar R=R/I$はネーター環で、零イデアルは既約である。$\bar R$で$xy=0$、$y\neq 0$とし、$x$が冪零であることを示す。これは$I$が準素であることを意味する。
    $\mathrm{Ann}(x)\subseteq\mathrm{Ann}(x^2)\subseteq\cdots$はイデアルの昇鎖なので、ある$n$で$\mathrm{Ann}(x^n)=\mathrm{Ann}(x^{n+1})$である。$(x^n)\cap(y)=0$を示す。$a$をこの共通部分の元とする。$a\in(y)$と$xy=0$より$ax=0$である。$a=bx^n$と書くと$bx^{n+1}=0$なので、$b\in\mathrm{Ann}(x^{n+1})=\mathrm{Ann}(x^n)$であり、$a=bx^n=0$である。
    零イデアルは既約で$(y)\neq 0$なので、$(x^n)=0$である。よって$x$は冪零である。
  strategy: In the quotient, stabilize the annihilators of powers of x and intersect (x^n) with (y).
  sketch:
  - 'setup: Pass to R/I, where the zero ideal is irreducible, and let xy = 0 with y nonzero.'
  - 'apply_theorem: The chain Ann(x^k) stabilizes at some n.'
  - 'derive: (x^n) ∩ (y) = 0 by comparing annihilators.'
  - 'derive: Irreducibility of zero and (y) ≠ 0 give (x^n) = 0.'
  - 'conclude: So x is nilpotent, and I is primary.'
  openmath: (forall (A I) (-> (and (comm_ring A) (noetherian_ring A) (ideal_of I A) (!= I (unit_ideal A)) (forall (B D) (-> (and (ideal_of B A) (ideal_of D A) (= I (inter B D))) (or (= I B) (= I D))))) (primary_ideal I A)))
  hard_negative:
    statement: ネーター環の準素イデアルはすべて既約である。
    reason: 体$k$上の$k[x,y]$で$I=(x,y)^2=(x^2,xy,y^2)$は根基が極大なので準素である。しかし$I=(x^2,y)\cap(x,y^2)$であり、どちらも$I$を真に含むので既約でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] (I : Ideal R), InfIrred I → I.IsPrimary
  proof: |
    by
      intro R _ _ I h
      exact h.isPrimary
- id: associated_primes_nonempty
  kind: gap
  level: 4
  topic: 可換環論・随伴素イデアル
  statement: $R$をネーター環、$M$を$0$でない$R$加群とする。$M$の随伴素イデアル、すなわち$\mathfrak{p}=\mathrm{Ann}(x)$（$x\in M$）となる素イデアル$\mathfrak{p}$が存在する。
  statement_en: A nonzero module M over a Noetherian ring has an associated prime, that is, a prime ideal of the form Ann(x) with x in M.
  assumptions:
  - $R$はネーター可換環
  - $M$は$0$でない$R$加群
  quantifiers:
  - 任意のネーター環$R$と$0$でない加群$M$
  conclusion: $M$の随伴素イデアルが存在する。
  answer: |
    $R$をネーター可換環、$M$を$0$でない$R$加群とする。$\{\mathrm{Ann}(x):x\in M,\ x\neq 0\}$は空でないイデアルの集合なので、ネーター性より極大元$\mathrm{Ann}(x_0)$をもつ。$x_0\neq 0$より$\mathrm{Ann}(x_0)\neq R$である。
    これが素イデアルであることを示す。$ab\in\mathrm{Ann}(x_0)$、$b\notin\mathrm{Ann}(x_0)$とする。$bx_0\neq 0$であり、$\mathrm{Ann}(bx_0)\supseteq\mathrm{Ann}(x_0)$なので、極大性より$\mathrm{Ann}(bx_0)=\mathrm{Ann}(x_0)$である。$a(bx_0)=0$より$a\in\mathrm{Ann}(bx_0)=\mathrm{Ann}(x_0)$である。
  strategy: A maximal annihilator of a nonzero element is prime.
  sketch:
  - 'apply_theorem: The nonempty set of annihilators of nonzero elements has a maximal element Ann(x_0).'
  - 'setup: Let ab lie in Ann(x_0) with b outside it.'
  - 'derive: Ann(b x_0) contains Ann(x_0), hence equals it by maximality.'
  - 'conclude: a lies in Ann(b x_0) = Ann(x_0), so Ann(x_0) is prime.'
  openmath: (forall (A V) (-> (and (comm_ring A) (noetherian_ring A) (module_over V A) (not (zero_module_of V))) (!= (associated_primes A V) emptyset)))
  hard_negative:
    statement: 零環でない任意の可換環$R$について、$R$加群$R$は随伴素イデアルをもつ。
    reason: 体$k$上の$A=k[t^q:q\in\mathbb{Q}_{\geq 0}]/(t)$を考える。$0$でない元は$t^e$（$0\leq e<1$）の単元倍なので、その零化イデアルは$(t^{1-e})$である。これは$t^{(1-e)/2}$の平方を含み、$t^{(1-e)/2}$自身を含まないので素イデアルでない。ネーター性が要る。
  target: |
    ∀ (R M : Type*) [CommRing R] [IsNoetherianRing R] [AddCommGroup M] [Module R M] [Nontrivial M], (associatedPrimes R M).Nonempty
  proof: |
    by
      intro R M _ _ _ _ _
      exact associatedPrimes.nonempty R M
- id: annihilator_of_element_in_associated_prime
  kind: gap
  level: 4
  topic: 可換環論・随伴素イデアル
  statement: $R$をネーター環、$M$を$R$加群、$x\in M$を$0$でない元とする。$\mathrm{Ann}(x)$を含む$M$の随伴素イデアルが存在する。
  statement_en: Let x be a nonzero element of a module M over a Noetherian ring. Then Ann(x) is contained in an associated prime of M.
  assumptions:
  - $R$はネーター可換環
  - $M$は$R$加群
  - $x\in M$、$x\neq 0$
  quantifiers:
  - 任意のネーター環$R$、加群$M$、$0$でない元$x$
  conclusion: $\mathrm{Ann}(x)\subseteq\mathfrak{p}$となる$\mathfrak{p}\in\mathrm{Ass}(M)$がある。
  answer: |
    $R$をネーター可換環、$M$を$R$加群、$x\in M$を$0$でない元とする。$\{\mathrm{Ann}(y):y\neq 0,\ \mathrm{Ann}(x)\subseteq\mathrm{Ann}(y)\}$は$\mathrm{Ann}(x)$を含むので空でない。ネーター性より極大元$\mathrm{Ann}(y_0)$をもつ。$\mathrm{Ann}(y_0)\neq R$である。
    $ab\in\mathrm{Ann}(y_0)$、$b\notin\mathrm{Ann}(y_0)$とする。$by_0\neq 0$であり、$\mathrm{Ann}(by_0)\supseteq\mathrm{Ann}(y_0)\supseteq\mathrm{Ann}(x)$なので、$\mathrm{Ann}(by_0)$はこの集合に属する。極大性より$\mathrm{Ann}(by_0)=\mathrm{Ann}(y_0)$であり、$a\in\mathrm{Ann}(by_0)=\mathrm{Ann}(y_0)$である。よって$\mathrm{Ann}(y_0)$は素イデアルで、$\mathrm{Ann}(x)$を含む随伴素イデアルである。
  strategy: Choose an annihilator maximal among those containing Ann(x); such an annihilator is prime.
  sketch:
  - 'setup: Consider annihilators of nonzero y containing Ann(x).'
  - 'apply_theorem: Noetherianity gives a maximal element Ann(y_0).'
  - 'derive: If ab lies in Ann(y_0) and b does not, then Ann(b y_0) = Ann(y_0) contains a.'
  - 'conclude: So Ann(y_0) is an associated prime containing Ann(x).'
  openmath: (forall (A V x) (-> (and (comm_ring A) (noetherian_ring A) (module_over V A) (in x V) (!= x 0)) (exists (p) (and (in p (associated_primes A V)) (forall (r) (-> (and (in r A) (= (smul r x) 0)) (in r p)))))))
  hard_negative:
    statement: ネーター環上の加群の$0$でない元$x$について、$\mathrm{Ann}(x)$自身が随伴素イデアルである。
    reason: $R=\mathbb{Z}$、$M=\mathbb{Z}/4\mathbb{Z}$、$x=1$とすると、$\mathrm{Ann}(x)=(4)$は素イデアルでない。これを含む随伴素イデアルは$(2)$である。
  target: |
    ∀ (R M : Type*) [CommRing R] [IsNoetherianRing R] [AddCommGroup M] [Module R M] (x : M), x ≠ 0 → ∃ P ∈ associatedPrimes R M, ∀ r : R, r • x = 0 → r ∈ P
  proof: |
    by
      intro R M _ _ _ _ x hx
      obtain ⟨P, hP, hle⟩ := exists_le_isAssociatedPrime_of_isNoetherianRing R x hx
      refine ⟨P, hP, fun r hr => hle ?_⟩
      simpa [Submodule.mem_colon_singleton] using hr
- id: associated_primes_of_primary_quotient
  kind: gap
  level: 4
  topic: 可換環論・随伴素イデアル
  statement: $R$をネーター環、$Q$を準素イデアルとする。$R/Q$の随伴素イデアルは$\sqrt{Q}$だけである。すなわち$\mathrm{Ass}(R/Q)=\{\sqrt{Q}\}$である。
  statement_en: If Q is a primary ideal of a Noetherian ring R, the only associated prime of R/Q is rad(Q).
  assumptions:
  - $R$はネーター可換環
  - $Q$は準素イデアル
  quantifiers:
  - 任意のネーター環$R$と準素イデアル$Q$
  conclusion: $\mathrm{Ass}(R/Q)=\{\sqrt{Q}\}$である。
  answer: |
    $R$をネーター可換環、$Q$を準素イデアル、$P=\sqrt{Q}$とする。$P$は素イデアルである。$Q\neq R$より$R/Q\neq 0$なので、$\mathrm{Ass}(R/Q)$は空でない。
    $\mathfrak{p}\in\mathrm{Ass}(R/Q)$とし、$\mathfrak{p}=\mathrm{Ann}(\bar x)$（$x\notin Q$）とする。$\mathrm{Ann}(\bar x)=(Q:x)$である。$r\in(Q:x)$なら$rx\in Q$と$x\notin Q$より$r\in\sqrt{Q}$なので、$(Q:x)\subseteq P$である。また$Q\subseteq(Q:x)$である。$\mathfrak{p}=(Q:x)$は素イデアルなので、$Q\subseteq\mathfrak{p}$から$P\subseteq\mathfrak{p}$である。よって$\mathfrak{p}=P$である。
  strategy: Sandwich the annihilator of a nonzero class between Q and rad(Q).
  sketch:
  - 'derive: R/Q is nonzero, so it has an associated prime.'
  - 'setup: Let p = Ann(x̄) = (Q : x) with x outside Q.'
  - 'derive: Primariness gives (Q : x) inside rad(Q), and Q lies in (Q : x).'
  - 'derive: Since p is prime and contains Q, it contains rad(Q).'
  - 'conclude: So p = rad(Q).'
  openmath: (forall (A U) (-> (and (comm_ring A) (noetherian_ring A) (primary_ideal U A)) (= (associated_primes A (quotient_ring A U)) (singleton_set (ideal_radical U)))))
  hard_negative:
    statement: ネーター環の準素イデアル$Q$は、ある素イデアル$\mathfrak{p}$の冪$\mathfrak{p}^n$である。
    reason: 体$k$上の$k[x,y]$で$Q=(x^2,y)$は根基が極大イデアル$(x,y)$なので準素である。$(x,y)^2\subsetneq Q\subsetneq(x,y)$であり、$Q$は$(x,y)$の冪でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] (I : Ideal R), I.IsPrimary → associatedPrimes R (R ⧸ I) = {I.radical}
  proof: |
    by
      intro R _ _ I hI
      exact associatedPrimes.eq_singleton_of_isPrimary hI
- id: associated_primes_exact_sequence
  kind: gap
  level: 4
  topic: 可換環論・随伴素イデアル
  statement: $R$をネーター環、$0\to L\xrightarrow{f}M\xrightarrow{g}N$を$R$加群の完全列とする。$\mathrm{Ass}(L)\subseteq\mathrm{Ass}(M)\subseteq\mathrm{Ass}(L)\cup\mathrm{Ass}(N)$である。
  statement_en: For an exact sequence 0 → L → M → N of modules over a Noetherian ring, Ass(L) ⊆ Ass(M) ⊆ Ass(L) ∪ Ass(N).
  assumptions:
  - $R$はネーター可換環
  - $f:L\to M$は単射$R$線形写像
  - $g:M\to N$は$R$線形写像
  - $\ker g=\mathrm{im}\,f$
  quantifiers:
  - 任意のネーター環$R$と完全列$0\to L\to M\to N$
  conclusion: $\mathrm{Ass}(L)\subseteq\mathrm{Ass}(M)\subseteq\mathrm{Ass}(L)\cup\mathrm{Ass}(N)$である。
  answer: |
    $R$をネーター可換環、$0\to L\xrightarrow{f}M\xrightarrow{g}N$を完全列とする。$\mathfrak{p}=\mathrm{Ann}(y)$（$y\in L$）なら、$f$は単射なので$\mathrm{Ann}(f(y))=\mathfrak{p}$である。よって$\mathrm{Ass}(L)\subseteq\mathrm{Ass}(M)$である。
    $\mathfrak{p}\in\mathrm{Ass}(M)$とし、$\mathfrak{p}=\mathrm{Ann}(x)$（$x\in M$）とする。$r\mapsto rx$は$R/\mathfrak{p}\cong Rx$を与える。$R/\mathfrak{p}$は整域なので、$Rx$の$0$でない元の零化イデアルはすべて$\mathfrak{p}$である。
    $Rx\cap f(L)\neq 0$なら、その$0$でない元$f(y)$について$\mathrm{Ann}(y)=\mathrm{Ann}(f(y))=\mathfrak{p}$であり、$\mathfrak{p}\in\mathrm{Ass}(L)$である。$Rx\cap f(L)=0$なら、$\ker g=f(L)$より$g$は$Rx$上で単射である。よって$\mathrm{Ann}(g(x))=\mathrm{Ann}(x)=\mathfrak{p}$であり、$\mathfrak{p}\in\mathrm{Ass}(N)$である。
  strategy: Identify Rx with R/p, a domain, and split according to whether Rx meets the image of L.
  sketch:
  - 'derive: Injectivity of f preserves annihilators, so Ass(L) lies in Ass(M).'
  - 'setup: Let p = Ann(x) with x in M, so Rx is isomorphic to R/p.'
  - 'derive: Every nonzero element of Rx has annihilator p.'
  - 'case_split: If Rx meets f(L) nontrivially, p lies in Ass(L).'
  - 'case_split: Otherwise g is injective on Rx, so p lies in Ass(N).'
  - 'conclude: Hence Ass(M) lies in the union.'
  openmath: (forall (A L V W f g) (-> (and (comm_ring A) (noetherian_ring A) (module_over L A) (module_over V A) (module_over W A) (module_hom f A L V) (module_hom g A V W) (injective f) (exact_pair f g)) (and (subset (associated_primes A L) (associated_primes A V)) (subset (associated_primes A V) (union (associated_primes A L) (associated_primes A W))))))
  hard_negative:
    statement: 完全列$0\to L\to M\to N\to 0$について$\mathrm{Ass}(M)=\mathrm{Ass}(L)\cup\mathrm{Ass}(N)$である。
    reason: $R=\mathbb{Z}$で$0\to\mathbb{Z}\xrightarrow{2}\mathbb{Z}\to\mathbb{Z}/2\mathbb{Z}\to 0$とする。$\mathrm{Ass}(\mathbb{Z})=\{(0)\}$、$\mathrm{Ass}(\mathbb{Z}/2\mathbb{Z})=\{(2)\}$なので、$(2)$は右辺に属するが$\mathrm{Ass}(M)$には属さない。
  target: |
    ∀ (R L M N : Type*) [CommRing R] [IsNoetherianRing R] [AddCommGroup L] [Module R L] [AddCommGroup M] [Module R M] [AddCommGroup N] [Module R N] (f : L →ₗ[R] M) (g : M →ₗ[R] N), Function.Injective f → Function.Exact f g → associatedPrimes R L ⊆ associatedPrimes R M ∧ associatedPrimes R M ⊆ associatedPrimes R L ∪ associatedPrimes R N
  proof: |
    by
      intro R L M N _ _ _ _ _ _ _ _ f g hf hfg
      exact ⟨associatedPrimes.subset_of_injective hf, associatedPrimes.subset_union_of_exact hf hfg⟩
- id: minimal_prime_over_annihilator_is_associated
  kind: gap
  level: 4
  topic: 可換環論・随伴素イデアル
  statement: $R$をネーター環、$M$を有限生成$R$加群とする。$\mathrm{Ann}(M)$上の極小素イデアルは$M$の随伴素イデアルである。
  statement_en: For a finitely generated module M over a Noetherian ring, every prime minimal over Ann(M) is an associated prime of M.
  assumptions:
  - $R$はネーター可換環
  - $M$は有限生成$R$加群
  quantifiers:
  - 任意のネーター環$R$と有限生成加群$M$
  conclusion: $\mathrm{Ann}(M)$上の極小素イデアルは$\mathrm{Ass}(M)$に属する。
  answer: |
    $R$をネーター可換環、$M$を$x_1,\dots,x_n$で生成される$R$加群、$\mathfrak{p}$を$\mathrm{Ann}(M)$上の極小素イデアルとする。$M_{\mathfrak{p}}=0$なら、各$k$で$s_kx_k=0$となる$s_k\notin\mathfrak{p}$があり、$s_1\cdots s_n\in\mathrm{Ann}(M)\setminus\mathfrak{p}$となって矛盾する。よって$M_{\mathfrak{p}}\neq 0$である。
    $R_{\mathfrak{p}}$はネーター環なので、$M_{\mathfrak{p}}$の随伴素イデアル$\mathfrak{Q}$がある。$\mathfrak{Q}$は$\mathrm{Ann}(M)R_{\mathfrak{p}}$を含むので、$\mathfrak{Q}$に対応する$R$の素イデアルは$\mathrm{Ann}(M)$を含み$\mathfrak{p}$に含まれる。極小性よりそれは$\mathfrak{p}$である。すなわち$\mathfrak{p}R_{\mathfrak{p}}=\mathrm{Ann}(x/s)$となる$x\in M$、$s\notin\mathfrak{p}$がある。$s$は$R_{\mathfrak{p}}$で単元なので、$\mathfrak{p}R_{\mathfrak{p}}=\mathrm{Ann}(x/1)$である。
    $\mathfrak{p}=(a_1,\dots,a_r)$と書く。$a_k\cdot x/1=0$より$t_ka_kx=0$となる$t_k\notin\mathfrak{p}$がある。$t=t_1\cdots t_r\notin\mathfrak{p}$とおくと$\mathfrak{p}\subseteq\mathrm{Ann}(tx)$である。逆に$b(tx)=0$なら、$bt$は$\mathrm{Ann}(x/1)=\mathfrak{p}R_{\mathfrak{p}}$に属し、$bt\in\mathfrak{p}$と$t\notin\mathfrak{p}$から$b\in\mathfrak{p}$である。よって$\mathfrak{p}=\mathrm{Ann}(tx)$である。
  strategy: Localize at p, find p R_p as an annihilator, and clear denominators using finite generation of p.
  sketch:
  - 'derive: M_p is nonzero because M is finitely generated and p contains Ann(M).'
  - 'apply_theorem: M_p has an associated prime over the Noetherian ring R_p.'
  - 'derive: By minimality of p this associated prime is p R_p, so p R_p = Ann(x/1).'
  - 'construct: Since p is finitely generated, choose t outside p with p x t = 0.'
  - 'conclude: Then p = Ann(tx).'
  openmath: (forall (A V p) (-> (and (comm_ring A) (noetherian_ring A) (module_over V A) (finitely_generated_module A V) (minimal_prime_over p (module_annihilator A V))) (in p (associated_primes A V))))
  hard_negative:
    statement: 有限生成加群の随伴素イデアルは、すべて$\mathrm{Ann}(M)$上の極小素イデアルである。
    reason: 体$k$上の$R=k[x,y]$、$M=R/(x^2,xy)$とすると、$\mathrm{Ann}(M)=(x^2,xy)$である。$\bar x$の零化イデアルは$(x,y)$なので$(x,y)\in\mathrm{Ass}(M)$であるが、$(x,y)$は$(x)$を真に含み極小でない。
  target: |
    ∀ (R M : Type*) [CommRing R] [IsNoetherianRing R] [AddCommGroup M] [Module R M] [Module.Finite R M], (Module.annihilator R M).minimalPrimes ⊆ associatedPrimes R M
  proof: |
    by
      intro R M _ _ _ _ _
      exact Module.associatedPrimes.minimalPrimes_annihilator_subset_associatedPrimes R M
- id: minimal_primes_finite_noetherian
  kind: textbook
  level: 3
  topic: 可換環論・極小素イデアル
  statement: $R$をネーター環、$I$をイデアルとする。$I$上の極小素イデアルは有限個である。
  statement_en: An ideal of a Noetherian commutative ring has only finitely many minimal prime ideals over it.
  assumptions:
  - $R$はネーター可換環
  - $I$はイデアル
  quantifiers:
  - 任意のネーター環$R$とイデアル$I$
  conclusion: $I$上の極小素イデアルは有限個である。
  answer: |
    $R$をネーター可換環とする。結論が成り立たないイデアル全体が空でないと仮定し、ネーター性によりその極大元$I$をとる。$I=R$なら極小素イデアルはなく、$I$が素イデアルなら極小素イデアルは$I$だけである。よって$I$は素イデアルでも単位イデアルでもない。したがって$a,b\notin I$で$ab\in I$となるものがある。
    $\mathfrak{p}$を$I$上の極小素イデアルとする。$ab\in\mathfrak{p}$より$a\in\mathfrak{p}$または$b\in\mathfrak{p}$である。$a\in\mathfrak{p}$なら、$\mathfrak{p}$は$I+(a)$上の極小素イデアルである。実際、$I+(a)\subseteq\mathfrak{q}\subseteq\mathfrak{p}$なる素イデアル$\mathfrak{q}$は$I$を含むので$\mathfrak{q}=\mathfrak{p}$である。$b\in\mathfrak{p}$の場合も同様である。
    $I+(a)$と$I+(b)$は$I$を真に含むので、極大性よりそれぞれ有限個の極小素イデアルしかもたない。よって$I$上の極小素イデアルも有限個となり、矛盾する。
  strategy: Use Noetherian induction on ideals with infinitely many minimal primes.
  sketch:
  - 'setup: Take an ideal I maximal among those with infinitely many minimal primes.'
  - 'derive: I is neither prime nor the unit ideal, so ab lies in I with a, b outside I.'
  - 'derive: A minimal prime over I contains a or b, and is then minimal over I + (a) or I + (b).'
  - 'derive: Both larger ideals have finitely many minimal primes.'
  - 'contradiction: So I has finitely many minimal primes.'
  openmath: (forall (A I) (-> (and (comm_ring A) (noetherian_ring A) (ideal_of I A)) (finite_set (minimal_primes_of I))))
  hard_negative:
    statement: 任意の可換環のイデアル上の極小素イデアルは有限個である。
    reason: $\mathbb{F}_2$の可算無限個の直積環では、各成分への射影の核が互いに異なる素イデアルである。すべての元が$x^2=x$を満たすので素イデアルはすべて極大であり、極小でもある。よって$0$上の極小素イデアルは無限個ある。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] (I : Ideal R), I.minimalPrimes.Finite
  proof: |
    by
      intro R _ _ I
      exact Ideal.finite_minimalPrimes_of_isNoetherianRing R I
- id: noetherian_ideal_contains_product_of_primes
  kind: textbook
  level: 3
  topic: 可換環論・ネーター環
  statement: $R$をネーター環、$I$をイデアルとする。素イデアルの有限個の積で$I$に含まれるものが存在する。ただし空な積は$R$とする。
  statement_en: Every ideal of a Noetherian commutative ring contains a finite product of prime ideals, the empty product being the unit ideal.
  assumptions:
  - $R$はネーター可換環
  - $I$はイデアル
  - 空な積は$R$
  quantifiers:
  - 任意のネーター環$R$とイデアル$I$
  conclusion: 素イデアルの有限積で$I$に含まれるものがある。
  answer: |
    $R$をネーター可換環とする。結論が成り立たないイデアル全体が空でないと仮定し、ネーター性によりその極大元$I$をとる。$I=R$なら空な積が$I$に含まれ、$I$が素イデアルなら$I$自身が1個の積である。よって$I$は素イデアルでも単位イデアルでもなく、$a,b\notin I$で$ab\in I$となるものがある。
    $I+(a)$と$I+(b)$は$I$を真に含むので、極大性よりそれぞれ素イデアルの有限積$A$、$B$を含む。$AB\subseteq(I+(a))(I+(b))\subseteq I$である。$AB$も素イデアルの有限積なので矛盾である。
  strategy: Use Noetherian induction, splitting an ideal that is not prime with a pair a, b.
  sketch:
  - 'setup: Take an ideal I maximal among those containing no finite product of primes.'
  - 'derive: I is neither prime nor the unit ideal, so ab lies in I with a, b outside I.'
  - 'derive: I + (a) and I + (b) contain products of primes A and B.'
  - 'derive: AB lies in (I + (a))(I + (b)), which lies in I.'
  - 'contradiction: So I contains a finite product of primes.'
  openmath: (forall (A I) (-> (and (comm_ring A) (noetherian_ring A) (ideal_of I A)) (exists (Y) (and (forall (p) (-> (multiset_mem p Y) (prime_ideal p A))) (subset (multiset_prod Y) I)))))
  hard_negative:
    statement: 任意の可換環のイデアルは素イデアルの有限積を含む。
    reason: 体$k$上の$A=k[t^q:q\in\mathbb{Q}_{\geq 0}]/(t)$の素イデアルは$\mathfrak{m}=(t^q:q>0)$だけで、$\mathfrak{m}^2=\mathfrak{m}\neq 0$である。空な積は$A$なので、零イデアルは素イデアルの有限積を含まない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] (I : Ideal R), ∃ Z : Multiset (Ideal R), (∀ P ∈ Z, P.IsPrime) ∧ Z.prod ≤ I
  proof: |
    by
      intro R _ _ I
      obtain ⟨Z, hZ⟩ := PrimeSpectrum.exists_primeSpectrum_prod_le R I
      refine ⟨Z.map PrimeSpectrum.asIdeal, ?_, hZ⟩
      intro P hP
      obtain ⟨x, -, rfl⟩ := Multiset.mem_map.1 hP
      exact x.2
- id: integral_transitive
  kind: gap
  level: 3
  topic: 可換環論・整拡大の推移律
  statement: $R$を可換環、$A$を可換$R$代数、$B$を可換$A$代数とする（$R\to A\to B$の合成が$B$の$R$代数の構造を与える）。$A$が$R$上整で$B$が$A$上整なら、$B$は$R$上整である。これは整閉包についての特殊形を一般の推移律にした形である。
  statement_en: Let A be a commutative R-algebra and B a commutative A-algebra with compatible R-algebra structure. If A is integral over R and B is integral over A, then B is integral over R. This is the general transitivity behind the special case of the integral closure.
  assumptions:
  - $R,A,B$は可換環
  - $R\to A\to B$の合成が$B$の$R$代数の構造
  - $A$は$R$上整
  - $B$は$A$上整
  quantifiers:
  - 任意の可換環$R,A,B$
  conclusion: $B$は$R$上整である。
  answer: |
    $R,A,B$を可換環とし、$R\to A\to B$の合成で$B$を$R$代数とみなす。$A$は$R$上整、$B$は$A$上整とする。$x\in B$をとると、$x^n+a_1x^{n-1}+\dots+a_n=0$（$a_i\in A$）と書ける。
    $R$の$B$での像と$a_i$の像で生成される$B$の部分環を$A'$とする。各$a_i$は$R$上整なので、$A'$は$R$加群として有限生成である。$x$は$A'$上整なので、$A'[x]$は$A'$加群として有限生成である。よって$A'[x]$は$R$加群として有限生成である。
    $A'[x]$は$x$を含み、$x$倍で閉じ、$1$を含む有限生成$R$部分加群である。行列式の技法により$x$は$R$上整である。
  strategy: Adjoin the finitely many coefficients of an integral equation, so that x lies in a finitely generated R-module.
  sketch:
  - 'setup: Let x in B satisfy a monic equation with coefficients a_i in A.'
  - 'derive: The subring A'' generated by the images of the a_i is a finite R-module.'
  - 'derive: A''[x] is a finite A''-module, hence a finite R-module.'
  - 'apply_theorem: An element acting on a finite R-module containing 1 is integral over R.'
  - 'conclude: So x is integral over R.'
  openmath: (forall (A D B) (-> (and (comm_ring A) (comm_ring D) (comm_ring B) (algebra_over D A) (algebra_over B D) (algebra_over B A) (integral_extension D A) (integral_extension B D)) (integral_extension B A)))
  hard_negative:
    statement: $B$が$A$上整なら、$A$が$R$上整でなくても$B$は$R$上整である。
    reason: $R=\mathbb{Z}$、$A=B=\mathbb{Q}$とすると、$B$は$A$上整であるが、$1/2\in B$は$\mathbb{Z}$上整でない。両方の整性が要る。
  target: |
    ∀ (R A B : Type*) [CommRing R] [CommRing A] [CommRing B] [Algebra R A] [Algebra A B] [Algebra R B] [IsScalarTower R A B], Algebra.IsIntegral R A → Algebra.IsIntegral A B → Algebra.IsIntegral R B
  proof: |
    by
      intro R A B _ _ _ _ _ _ _ h1 h2
      exact Algebra.IsIntegral.trans A
- id: integral_of_stable_fg_submodule
  kind: gap
  level: 3
  topic: 可換環論・整元の判定
  statement: $R$を可換環、$A$を可換$R$代数、$N\subseteq A$を有限生成$R$部分加群とし、$1\in N$とする。$x\in A$が$xN\subseteq N$を満たせば、$x$は$R$上整である。
  statement_en: Let A be a commutative R-algebra and N a finitely generated R-submodule of A containing 1. If x in A satisfies xN ⊆ N, then x is integral over R.
  assumptions:
  - $R$は可換環
  - $A$は可換$R$代数
  - $N\subseteq A$は有限生成$R$部分加群
  - $1\in N$
  - $xN\subseteq N$
  quantifiers:
  - 任意の$R$代数$A$、部分加群$N$、元$x$
  conclusion: $x$は$R$上整である。
  answer: |
    $R$を可換環、$A$を可換$R$代数、$N=Ry_1+\dots+Ry_n\subseteq A$を$1$を含む$R$部分加群とし、$x\in A$が$xN\subseteq N$を満たすとする。$xy_i=\sum_ja_{ij}y_j$（$a_{ij}\in R$）と書く。$n$次行列$E$を単位行列、$C=(a_{ij})$とすると、ベクトル$y=(y_1,\dots,y_n)^{T}$は$(xE-C)y=0$を満たす。
    左から余因子行列を掛けると、すべての$i$で$\det(xE-C)y_i=0$である。$p(X)=\det(XE-C)\in R[X]$はモニックであり、$p(x)N=0$である。$1\in N$より$p(x)=p(x)\cdot 1=0$である。よって$x$は$R$上整である。
  strategy: Apply the determinant trick to multiplication by x on N and evaluate at 1.
  sketch:
  - 'setup: Write xy_i as a combination of generators y_j of N with coefficients in R.'
  - 'derive: Multiplying (xE - C)y = 0 by the adjugate gives det(xE - C)y_i = 0.'
  - 'construct: p(X) = det(XE - C) is monic and p(x)N = 0.'
  - 'conclude: Since 1 lies in N, p(x) = 0.'
  openmath: (forall (A D V x) (-> (and (comm_ring A) (comm_ring D) (algebra_over D A) (submodule_of V D) (finitely_generated_submodule V) (in 1 V) (in x D) (forall (y) (-> (in y V) (in (* x y) V)))) (integral_element x A)))
  hard_negative:
    statement: $A$の$R$部分加群$N$が$1$を含み$xN\subseteq N$を満たせば、有限生成でなくても$x$は$R$上整である。
    reason: $R=\mathbb{Z}$、$A=\mathbb{Q}$、$N=\mathbb{Z}[1/2]$、$x=1/2$とすると、$1\in N$かつ$xN\subseteq N$であるが、$1/2$は$\mathbb{Z}$上整でない。有限生成性が要る。
  target: |
    ∀ (R A : Type*) [CommRing R] [CommRing A] [Algebra R A] (N : Submodule R A) (x : A), N.FG → (1 : A) ∈ N → (∀ n ∈ N, x * n ∈ N) → IsIntegral R x
  proof: |
    by
      intro R A _ _ _ N x hN h1 hx
      have : Module.Finite R N := Module.Finite.iff_fg.2 hN
      let φ : Module.End R N := LinearMap.restrict (LinearMap.mulLeft R x) hx
      obtain ⟨p, hp, h0⟩ := LinearMap.exists_monic_and_aeval_eq_zero R φ
      refine ⟨p, hp, ?_⟩
      have hpow : ∀ (k : ℕ) (n : N), (((φ ^ k) n : N) : A) = x ^ k * n := by
        intro k
        induction k with
        | zero => intro n; simp
        | succ k ih =>
          intro n
          rw [pow_succ', Module.End.mul_apply, pow_succ', mul_assoc, ← ih n]
          rfl
      have key : ∀ (q : Polynomial R) (n : N), ((Polynomial.aeval φ q n : N) : A) = Polynomial.aeval x q * n := by
        intro q n
        induction q using Polynomial.induction_on' with
        | add a b ha hb => simp [ha, hb, add_mul]
        | monomial k r =>
          simp only [Polynomial.aeval_monomial, Module.End.mul_apply]
          rw [mul_assoc, ← hpow k n]
          simp [Module.algebraMap_end_apply, Algebra.smul_def]
      have := key p ⟨1, h1⟩
      rw [h0] at this
      have h2 : (Polynomial.aeval x) p = 0 := by simpa using this.symm
      simpa [Polynomial.aeval_def] using h2
- id: integral_multiple_of_algebraic
  kind: gap
  level: 3
  topic: 可換環論・整元と代数的元
  statement: $R$を整域、$A$を可換$R$代数、$z\in A$を$R$上代数的な元とする。すなわち$0$でない$p\in R[X]$で$p(z)=0$となるものがある。このとき$0$でない$y\in R$で$yz$が$R$上整となるものがある。
  statement_en: Let R be an integral domain, A a commutative R-algebra and z in A algebraic over R. Then yz is integral over R for some nonzero y in R.
  assumptions:
  - $R$は整域
  - $A$は可換$R$代数
  - $z\in A$は$R$上代数的
  quantifiers:
  - 任意の整域$R$、$R$代数$A$、代数的元$z$
  conclusion: $0$でない$y\in R$で$yz$が$R$上整となるものがある。
  answer: |
    $R$を整域、$A$を可換$R$代数、$z\in A$とし、$p=a_nX^n+\dots+a_0\in R[X]$を$a_n\neq 0$で$p(z)=0$を満たす多項式とする。
    $n=0$なら$a_0\cdot 1=0$なので$y=a_0$について$yz=0$であり、$0$は整である。$n\geq 1$とする。$p(z)=0$の両辺に$a_n^{n-1}$を掛けると、$(a_nz)^n+a_{n-1}(a_nz)^{n-1}+a_{n-2}a_n(a_nz)^{n-2}+\dots+a_0a_n^{n-1}=0$となる。これは$a_nz$についての$R$係数のモニックな方程式である。よって$y=a_n$が条件を満たす。
  strategy: Multiply the equation by a power of the leading coefficient to make it monic in a_n z.
  sketch:
  - 'setup: Take p of degree n with leading coefficient a_n and p(z) = 0.'
  - 'case_split: If n = 0, then a_0 z = 0, which is integral.'
  - 'derive: For n ≥ 1, multiplying by a_n^(n-1) gives a monic equation for a_n z.'
  - 'conclude: So y = a_n works.'
  openmath: (forall (A D z) (-> (and (integral_domain A) (comm_ring D) (algebra_over D A) (in z D) (algebraic_over z A)) (exists (y) (and (in y A) (!= y 0) (integral_element (smul y z) A)))))
  hard_negative:
    statement: 整域$R$上の代数的元$z$はそれ自身$R$上整である。
    reason: $R=\mathbb{Z}$、$z=1/2\in\mathbb{Q}$は$2X-1$の根なので代数的であるが、$\mathbb{Z}$上整でない。$y=2$を掛けると$yz=1$は整である。
  target: |
    ∀ (R A : Type*) [CommRing R] [IsDomain R] [CommRing A] [Algebra R A] (z : A), IsAlgebraic R z → ∃ y : R, y ≠ 0 ∧ IsIntegral R (y • z)
  proof: |
    by
      intro R A _ _ _ _ z hz
      obtain ⟨y, hy, h⟩ := hz.exists_integral_multiple
      exact ⟨y, hy, h⟩
- id: going_down_integrally_closed
  kind: named
  level: 4
  topic: 可換環論・下降定理
  statement: （下降定理）$R$を整閉整域、$S$を整域とし、単射$R\to S$により$S$は$R$上整であるとする。$\mathfrak{p}\subseteq\mathfrak{q}$を$R$の素イデアル、$\mathfrak{Q}$を$\mathfrak{Q}\cap R=\mathfrak{q}$を満たす$S$の素イデアルとする。このとき$\mathfrak{P}\subseteq\mathfrak{Q}$かつ$\mathfrak{P}\cap R=\mathfrak{p}$を満たす$S$の素イデアル$\mathfrak{P}$が存在する。
  statement_en: Going down. Let R be an integrally closed domain and S an integral domain, integral over R via an injective map. If p ⊆ q are primes of R and Q is a prime of S over q, then there is a prime P ⊆ Q of S lying over p.
  assumptions:
  - $R$は整閉整域
  - $S$は整域
  - $R\to S$は単射で$S$は$R$上整
  - $\mathfrak{p}\subseteq\mathfrak{q}$は$R$の素イデアル
  - $\mathfrak{Q}$は$S$の素イデアルで$\mathfrak{Q}\cap R=\mathfrak{q}$
  quantifiers:
  - 任意の$R,S$と素イデアル$\mathfrak{p},\mathfrak{q},\mathfrak{Q}$
  conclusion: $\mathfrak{P}\subseteq\mathfrak{Q}$、$\mathfrak{P}\cap R=\mathfrak{p}$となる$S$の素イデアル$\mathfrak{P}$が存在する。
  answer: |
    $R$を整閉整域、$S$を$R$上整な整域とし（単射により$R\subseteq S$とみなす）、$K$を$R$の分数体とする。$\mathfrak{p}\subseteq\mathfrak{q}$を$R$の素イデアル、$\mathfrak{Q}$を$\mathfrak{Q}\cap R=\mathfrak{q}$を満たす$S$の素イデアルとする。$\mathfrak{p}$が$S_{\mathfrak{Q}}$の素イデアルの縮約であることを示せばよい。そのような素イデアルを$S$へ引き戻したものが$\mathfrak{P}$である。素イデアル$\mathfrak{p}$が縮約であることは、$\mathfrak{p}S_{\mathfrak{Q}}\cap R=\mathfrak{p}$と同値である。よって$\mathfrak{p}S_{\mathfrak{Q}}\cap R\subseteq\mathfrak{p}$を示す。
    まず補題を示す。$y\in\mathfrak{p}S$とすると、$y$の$K$上の最小多項式$T^r+u_1T^{r-1}+\dots+u_r$の係数は$\mathfrak{p}$に属する。実際、$y=\sum_ip_is_i$（$p_i\in\mathfrak{p}$、$s_i\in S$）とすると、$R[s_i]$は有限生成$R$加群で$yR[s_i]\subseteq\mathfrak{p}R[s_i]$である。行列式の技法により$y$は係数が$\mathfrak{p}$に入るモニック多項式の根である。$y$の共役はすべて同じ方程式を満たすので、$R$上整で、その冪は$\mathfrak{p}R'$に入る。ここで$R'$は$R$に共役を添加した整拡大である。$u_i$は共役の正の次数の斉次式なので、$u_i\in\sqrt{\mathfrak{p}R'}\cap K$である。$u_i$は$R$上整で$R$は整閉なので$u_i\in R$である。横たわり定理より$\mathfrak{p}$の上に$R'$の素イデアルがあるので、$u_i\in\mathfrak{p}$である。
    $x\in\mathfrak{p}S_{\mathfrak{Q}}\cap R$をとり、$x\notin\mathfrak{p}$と仮定する。$x\neq 0$であり、$x=y/s$（$y\in\mathfrak{p}S$、$s\in S\setminus\mathfrak{Q}$）と書ける。$y$の最小多項式を上の形とすると、$s=y/x$の$K$上の最小多項式は$T^r+v_1T^{r-1}+\dots+v_r$（$v_i=u_i/x^i$）である。$s$は$R$上整なので、同じ理由で$v_i\in R$である。$x^iv_i=u_i\in\mathfrak{p}$と$x\notin\mathfrak{p}$より$v_i\in\mathfrak{p}$である。よって$s^r=-\sum_iv_is^{r-i}\in\mathfrak{p}S\subseteq\mathfrak{q}S\subseteq\mathfrak{Q}$となり、$s\in\mathfrak{Q}$である。これは$s\notin\mathfrak{Q}$に反する。
  strategy: Show that p is contracted from the localization S_Q, using minimal polynomials over the fraction field of R.
  sketch:
  - 'translate: It suffices that p S_Q ∩ R lies in p.'
  - 'apply_theorem: The minimal polynomial over K of an element of pS has coefficients in p, by the determinant trick, integral closedness and lying over.'
  - 'setup: Take x in R outside p with x = y/s, y in pS and s outside Q.'
  - 'derive: The minimal polynomial of s = y/x has coefficients v_i = u_i/x^i in R.'
  - 'derive: From x^i v_i in p and x outside p, each v_i lies in p.'
  - 'contradiction: Then s^r lies in pS ⊆ Q, so s lies in Q.'
  - 'conclude: Hence p is a contraction from S_Q, and pulling back to S gives P.'
  openmath: (forall (A B p q Y) (-> (and (integrally_closed_domain A) (integral_domain B) (algebra_over B A) (ring_hom_injective (algebra_map A B)) (integral_extension B A) (prime_ideal p A) (prime_ideal q A) (prime_ideal Y B) (subset p q) (= (ideal_comap (algebra_map A B) Y) q)) (exists (X) (and (prime_ideal X B) (subset X Y) (= (ideal_comap (algebra_map A B) X) p)))))
  hard_negative:
    statement: $R$が整閉でなくても、整域の整拡大$R\subseteq S$について下降定理が成り立つ。
    reason: 体$k$上の$S=k[x,y]$と$R=\{f\in S:f(0,y)=f(1,y)\}$を考える。$x^2-x\in R$なので$S$は$R$上整である。$\mathfrak{Q}=(x-1,y)$とし、$\mathfrak{p}=(y-x)\cap R$とする。$\mathfrak{p}$の元は$(0,0)$で消えるので$(1,0)$でも消え、$\mathfrak{p}\subseteq\mathfrak{Q}\cap R$である。$x^2-x\notin\mathfrak{p}$であり、$R[1/(x^2-x)]=S[1/(x^2-x)]$なので、$\mathfrak{p}$の上の素イデアルは$(y-x)$だけである。しかし$y-x\notin\mathfrak{Q}$である。
  target: |
    ∀ (R S : Type*) [CommRing R] [IsDomain R] [IsIntegrallyClosed R] [CommRing S] [IsDomain S] [Algebra R S] [Algebra.IsIntegral R S], Function.Injective (algebraMap R S) → ∀ (p q : Ideal R) (Q : Ideal S), p.IsPrime → q.IsPrime → Q.IsPrime → p ≤ q → Q.comap (algebraMap R S) = q → ∃ P : Ideal S, P ≤ Q ∧ P.IsPrime ∧ P.comap (algebraMap R S) = p
  proof: |
    by
      intro R S _ _ _ _ _ _ _ hinj p q Q hp hq hQ hle hQq
      have : FaithfulSMul R S := (faithfulSMul_iff_algebraMap_injective R S).2 hinj
      have : Q.LiesOver q := ⟨hQq.symm⟩
      obtain ⟨P, h1, h2, h3⟩ := Ideal.exists_ideal_le_liesOver_of_le (p := p) (q := q) Q hle
      exact ⟨P, h1, h2, h3.1.symm⟩
- id: going_down_flat
  kind: textbook
  level: 4
  topic: 可換環論・下降定理
  statement: $R\to S$を可換環の準同型とし、$S$は$R$上平坦とする。$\mathfrak{p}\subseteq\mathfrak{q}$を$R$の素イデアル、$\mathfrak{Q}$を$\mathfrak{q}$の上にある$S$の素イデアルとする。このとき$\mathfrak{P}\subseteq\mathfrak{Q}$で$\mathfrak{p}$の上にある$S$の素イデアル$\mathfrak{P}$が存在する。
  statement_en: Going down for flat algebras. If S is a flat R-algebra, p ⊆ q are primes of R and Q is a prime of S over q, then there is a prime P ⊆ Q of S over p.
  assumptions:
  - $R,S$は可換環
  - $S$は$R$上平坦
  - $\mathfrak{p}\subseteq\mathfrak{q}$は$R$の素イデアル
  - $\mathfrak{Q}$は$\mathfrak{q}$の上の$S$の素イデアル
  quantifiers:
  - 任意の平坦$R$代数$S$と素イデアル$\mathfrak{p},\mathfrak{q},\mathfrak{Q}$
  conclusion: $\mathfrak{P}\subseteq\mathfrak{Q}$で$\mathfrak{p}$の上にある素イデアル$\mathfrak{P}$が存在する。
  answer: |
    $R\to S$を可換環の準同型で$S$は$R$上平坦とし、$\mathfrak{p}\subseteq\mathfrak{q}$を$R$の素イデアル、$\mathfrak{Q}$を$\mathfrak{q}$の上にある$S$の素イデアルとする。$\mathfrak{Q}\cap R=\mathfrak{q}$より、$R\setminus\mathfrak{q}$の元は$S_{\mathfrak{Q}}$で単元である。よって局所環の準同型$R_{\mathfrak{q}}\to S_{\mathfrak{Q}}$が得られ、極大イデアルを極大イデアルへ写す。
    $S_{\mathfrak{Q}}$は$S$上平坦で$S$は$R$上平坦なので、$S_{\mathfrak{Q}}$は$R$上平坦である。$R_{\mathfrak{q}}$加群$N$について$S_{\mathfrak{Q}}\otimes_{R_{\mathfrak{q}}}N=S_{\mathfrak{Q}}\otimes_RN$なので、$S_{\mathfrak{Q}}$は$R_{\mathfrak{q}}$上平坦である。平坦な局所準同型は忠実平坦なので、$R_{\mathfrak{q}}$の素イデアル$\mathfrak{p}R_{\mathfrak{q}}$の上に$S_{\mathfrak{Q}}$の素イデアルがある。
    それを$S$へ引き戻したものを$\mathfrak{P}$とする。$S_{\mathfrak{Q}}$の素イデアルの引き戻しなので$\mathfrak{P}\subseteq\mathfrak{Q}$であり、$\mathfrak{P}\cap R=\mathfrak{p}R_{\mathfrak{q}}\cap R=\mathfrak{p}$である。
  strategy: Pass to the flat local homomorphism R_q → S_Q, which is faithfully flat, and lift the prime.
  sketch:
  - 'derive: R_q → S_Q is a local homomorphism.'
  - 'derive: S_Q is flat over R_q because localization and composition preserve flatness.'
  - 'apply_theorem: A flat local homomorphism is faithfully flat, so primes of R_q have primes of S_Q above them.'
  - 'construct: Take a prime of S_Q above p R_q and pull it back to S.'
  - 'conclude: The pullback P lies in Q and lies over p.'
  openmath: (forall (A B p q Y) (-> (and (comm_ring A) (comm_ring B) (algebra_over B A) (flat_module A B) (prime_ideal p A) (prime_ideal q A) (prime_ideal Y B) (subset p q) (= (ideal_comap (algebra_map A B) Y) q)) (exists (X) (and (prime_ideal X B) (subset X Y) (= (ideal_comap (algebra_map A B) X) p)))))
  hard_negative:
    statement: 平坦でない$R$代数$S$についても、下降定理が成り立つ。
    reason: 体$k$について$R=k[x]$、$S=k[x]/(x)=k$とする。$\mathfrak{Q}=0$は$\mathfrak{q}=(x)$の上にあり、$\mathfrak{p}=0\subset\mathfrak{q}$である。$S$の素イデアルは$\mathfrak{Q}$だけなので、$\mathfrak{p}$の上の素イデアルはない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] [Module.Flat R S] (p q : Ideal R) (Q : Ideal S), p.IsPrime → q.IsPrime → Q.IsPrime → p ≤ q → Q.comap (algebraMap R S) = q → ∃ P : Ideal S, P ≤ Q ∧ P.IsPrime ∧ P.comap (algebraMap R S) = p
  proof: |
    by
      intro R S _ _ _ _ p q Q hp hq hQ hle hQq
      have : Q.LiesOver q := ⟨hQq.symm⟩
      obtain ⟨P, h1, h2, h3⟩ := Ideal.exists_ideal_le_liesOver_of_le (p := p) (q := q) Q hle
      exact ⟨P, h1, h2, h3.1.symm⟩
- id: integral_extension_dim_eq
  kind: textbook
  level: 4
  topic: 可換環論・整拡大と次元
  statement: $R\to S$を単射な可換環の準同型とし、$S$は$R$上整とする。このとき$\dim S=\dim R$である（クルル次元）。
  statement_en: If R → S is an injective homomorphism of commutative rings and S is integral over R, then S and R have the same Krull dimension.
  assumptions:
  - $R,S$は可換環
  - $R\to S$は単射
  - $S$は$R$上整
  quantifiers:
  - 任意の整拡大$R\to S$
  conclusion: $\dim S=\dim R$である。
  answer: |
    $R\to S$を単射な可換環の準同型で$S$は$R$上整とし、$R\subseteq S$とみなす。$\mathfrak{Q}_0\subsetneq\dots\subsetneq\mathfrak{Q}_n$を$S$の素イデアルの鎖とする。整拡大の非比較性より、$\mathfrak{Q}\subsetneq\mathfrak{Q}'$なら$\mathfrak{Q}\cap R\subsetneq\mathfrak{Q}'\cap R$である。よって縮約は同じ長さの鎖を与え、$\dim S\leq\dim R$である。
    逆に$\mathfrak{p}_0\subsetneq\dots\subsetneq\mathfrak{p}_n$を$R$の素イデアルの鎖とする。$R\to S$は単射で整なので、横たわり定理により$\mathfrak{p}_0$の上に$S$の素イデアル$\mathfrak{Q}_0$がある。上昇定理を繰り返すと、$\mathfrak{Q}_0\subseteq\dots\subseteq\mathfrak{Q}_n$で$\mathfrak{Q}_i\cap R=\mathfrak{p}_i$となる素イデアルが得られる。$\mathfrak{p}_i$が異なるので$\mathfrak{Q}_i$も異なる。よって$\dim R\leq\dim S$である。
  strategy: Contract chains using incomparability and lift chains using lying over and going up.
  sketch:
  - 'apply_theorem: Incomparability makes contraction strictly increasing on chains of primes of S.'
  - 'derive: So dim S ≤ dim R.'
  - 'apply_theorem: Lying over gives a prime over the bottom of a chain in R.'
  - 'apply_theorem: Going up lifts the rest of the chain.'
  - 'conclude: So dim R ≤ dim S.'
  openmath: (forall (A B) (-> (and (comm_ring A) (comm_ring B) (algebra_over B A) (ring_hom_injective (algebra_map A B)) (integral_extension B A)) (= (ring_krull_dim B) (ring_krull_dim A))))
  hard_negative:
    statement: $S$が$R$上整なら、$R\to S$が単射でなくても$\dim S=\dim R$である。
    reason: 体$k$について$k[x]\to k$（$x\mapsto 0$）は全射なので整であるが、$\dim k[x]=1$、$\dim k=0$である。単射でない場合は$\dim S\leq\dim R$だけが成り立つ。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] [Algebra.IsIntegral R S], Function.Injective (algebraMap R S) → ringKrullDim S = ringKrullDim R
  proof: |
    by
      intro R S _ _ _ _ hinj
      apply le_antisymm
      · refine Order.krullDim_le_of_strictMono (fun Q : PrimeSpectrum S => (⟨Q.asIdeal.comap (algebraMap R S), inferInstance⟩ : PrimeSpectrum R)) ?_
        intro Q Q' h
        have hlt : Q.asIdeal < Q'.asIdeal := h
        obtain ⟨x, hx1, hx2⟩ := SetLike.exists_of_lt hlt
        exact Ideal.comap_lt_comap_of_integral_mem_sdiff (R := R) (I := Q.asIdeal) (J := Q'.asIdeal) hlt.le ⟨hx1, hx2⟩ (Algebra.IsIntegral.isIntegral x)
      · have key : ∀ (n : ℕ) (p : PrimeSpectrum R) (Q : PrimeSpectrum S), Q.asIdeal.comap (algebraMap R S) = p.asIdeal → (n : ℕ∞) ≤ Order.coheight p → (n : ℕ∞) ≤ Order.coheight Q := by
          intro n
          induction n with
          | zero => intros; simp
          | succ n ih =>
            intro p Q hQ hn
            obtain ⟨s, hhead, hlen⟩ := Order.exists_series_of_le_coheight p hn
            let i : Fin (s.length + 1) := ⟨1, by omega⟩
            have hlt : p < s i := by
              have : s.head < s i := s.strictMono (by simp [Fin.lt_def, i])
              rwa [hhead] at this
            have hle : (n : ℕ∞) ≤ Order.coheight (s i) := by
              refine le_trans ?_ (Order.rev_index_le_coheight s i)
              have : ((i.rev : Fin _) : ℕ) = n := by simp [Fin.rev, i]; omega
              rw [this]
            have hlt' : p.asIdeal < (s i).asIdeal := hlt
            have hIQ : Q.asIdeal.comap (algebraMap R S) ≤ (s i).asIdeal := by rw [hQ]; exact hlt'.le
            obtain ⟨Q', hQ1, hQ2, hQ3⟩ := Ideal.exists_ideal_over_prime_of_isIntegral_of_isPrime (R := R) (s i).asIdeal Q.asIdeal hIQ
            let Q'' : PrimeSpectrum S := ⟨Q', hQ2⟩
            have hQlt : Q < Q'' := by
              refine lt_of_le_of_ne hQ1 ?_
              intro h
              have : Q.asIdeal = Q' := congrArg PrimeSpectrum.asIdeal h
              rw [← this, hQ] at hQ3
              exact hlt'.ne hQ3
            have := ih (s i) Q'' hQ3 hle
            calc ((n + 1 : ℕ) : ℕ∞) = (n : ℕ∞) + 1 := by push_cast; rfl
              _ ≤ Order.coheight Q'' + 1 := by gcongr
              _ ≤ Order.coheight Q := Order.coheight_add_one_le hQlt
        show Order.krullDim (PrimeSpectrum R) ≤ Order.krullDim (PrimeSpectrum S)
        rw [Order.krullDim_eq_iSup_coheight, Order.krullDim_eq_iSup_coheight]
        refine iSup_le fun p => ?_
        have hker : Ideal.comap (algebraMap R S) ⊥ ≤ p.asIdeal := by
          intro x hx
          have : algebraMap R S x = 0 := by simpa using hx
          have : x = 0 := hinj (by simpa using this)
          rw [this]; exact Ideal.zero_mem _
        obtain ⟨Q, -, hQp, hQ⟩ := Ideal.exists_ideal_over_prime_of_isIntegral (R := R) p.asIdeal (⊥ : Ideal S) hker
        refine le_trans ?_ (le_iSup _ (⟨Q, hQp⟩ : PrimeSpectrum S))
        refine WithBot.coe_le_coe.2 ?_
        exact ENat.forall_natCast_le_iff_le.1 fun n hn => key n p ⟨Q, hQp⟩ hQ hn
- id: zariski_lemma
  kind: named
  level: 4
  topic: 可換環論・ザリスキの補題
  statement: （ザリスキの補題）$K$を体、$L$を体で、$K$代数として有限生成であるものとする。このとき$L$は$K$上有限次元である。
  statement_en: Zariski's lemma. If a field L is finitely generated as an algebra over a field K, then L is a finite-dimensional K-vector space.
  assumptions:
  - $K,L$は体
  - $L$は$K$代数として有限生成
  quantifiers:
  - 任意の体$K,L$
  conclusion: $L$は$K$上有限次元である。
  answer: |
    $K,L$を体とし、$L$は$K$代数として有限生成とする。ネーターの正規化定理より、整数$s\geq 0$と単射な$K$代数準同型$K[x_1,\dots,x_s]\to L$で、$L$が$K[x_1,\dots,x_s]$上の有限生成加群となるものがある。とくに$L$は$K[x_1,\dots,x_s]$上整である。
    整拡大$A\subseteq B$で$B$が整域のとき、$A$が体であることと$B$が体であることは同値である。$L$は体なので$K[x_1,\dots,x_s]$は体である。$s\geq 1$なら$x_1$は単元でないので、$s=0$である。よって$L$は$K$上有限生成加群、すなわち有限次元である。
  strategy: Apply Noether normalization and use that a domain integral over a polynomial ring cannot be a field unless there are no variables.
  sketch:
  - 'apply_theorem: Noether normalization gives a finite injective map from K[x_1, ..., x_s] to L.'
  - 'apply_theorem: Since L is a field and integral over K[x_1, ..., x_s], that polynomial ring is a field.'
  - 'derive: x_1 is not a unit, so s = 0.'
  - 'conclude: L is finite over K.'
  openmath: (forall (K D) (-> (and (is_field K) (is_field D) (algebra_over D K) (finite_type_algebra D K)) (finitely_generated_module K D)))
  hard_negative:
    statement: 体$L$が体$K$上の体として有限生成なら、$L$は$K$上有限次元である。
    reason: $L=K(t)$は体として$t$で生成されるが、$K$上無限次元である。補題の仮定は$K$代数として有限生成であることであり、$K(t)$は$K$代数として有限生成でない。
  target: |
    ∀ (K L : Type*) [Field K] [Field L] [Algebra K L] [Algebra.FiniteType K L], Module.Finite K L
  proof: |
    by
      intro K L _ _ _ _
      exact finite_of_finite_type_of_isJacobsonRing K L
- id: finite_type_algebra_radical_eq_jacobson
  kind: gap
  level: 4
  topic: 可換環論・有限生成代数の根基
  statement: $K$を体、$A$を有限生成$K$代数、$I$を$A$のイデアルとする。$\sqrt{I}$は$I$を含む極大イデアル全体の共通部分に等しい。ただし$I=A$のときは空な共通部分を$A$とする。
  statement_en: For a finitely generated algebra A over a field and an ideal I of A, rad(I) equals the intersection of the maximal ideals containing I, the empty intersection being A.
  assumptions:
  - $K$は体
  - $A$は有限生成$K$代数
  - $I$はイデアル
  - 空な共通部分は$A$
  quantifiers:
  - 任意の体$K$、有限生成$K$代数$A$、イデアル$I$
  conclusion: $\sqrt{I}$は$I$を含む極大イデアルの共通部分である。
  answer: |
    $K$を体、$A$を有限生成$K$代数、$I$をイデアルとする。極大イデアルは素イデアルなので、$\sqrt{I}$は$I$を含む極大イデアルの共通部分に含まれる。
    逆を示す。$f\notin\sqrt{I}$とし、$f$を含まず$I$を含む極大イデアルを構成する。$B=A/I$とおき、$\bar f$を$f$の像とすると、$\bar f$は冪零でない。よって局所化$B_{\bar f}$は零環でなく、$B_{\bar f}=B[T]/(T\bar f-1)$は有限生成$K$代数である。$\mathfrak{n}$を$B_{\bar f}$の極大イデアルとする。$L=B_{\bar f}/\mathfrak{n}$は$K$代数として有限生成な体なので、ザリスキの補題より$K$上有限次元である。
    $\mathfrak{m}$を$\mathfrak{n}$の$A$への引き戻しとする。$A/\mathfrak{m}$は$L$の部分環であり、$K$上有限次元の整域なので体である。よって$\mathfrak{m}$は$I$を含む極大イデアルである。$\bar f$は$B_{\bar f}$で単元なので$\bar f\notin\mathfrak{n}$であり、$f\notin\mathfrak{m}$である。
  strategy: For f outside the radical, take a maximal ideal of the localization at f and use Zariski's lemma to see that its contraction is maximal.
  sketch:
  - 'derive: The radical lies in every maximal ideal containing I.'
  - 'setup: Let f be outside rad(I), and let B = A/I.'
  - 'derive: B_f is a nonzero finitely generated K-algebra; take a maximal ideal n.'
  - 'apply_theorem: By Zariski''s lemma, B_f/n is finite over K.'
  - 'derive: The contraction m to A has A/m a finite-dimensional domain over K, hence a field.'
  - 'conclude: m is a maximal ideal containing I and omitting f.'
  openmath: (forall (K D I x) (-> (and (is_field K) (comm_ring D) (algebra_over D K) (finite_type_algebra D K) (ideal_of I D) (in x D)) (<-> (in x (ideal_radical I)) (forall (m) (-> (and (maximal_ideal m D) (subset I m)) (in x m))))))
  hard_negative:
    statement: 任意の可換環のイデアル$I$について、$\sqrt{I}$は$I$を含む極大イデアルの共通部分である。
    reason: $R=\mathbb{Z}_{(2)}$で$I=0$とすると、$\sqrt{I}=0$である。$R$の極大イデアルは$(2)$だけなので、右辺は$(2)\neq 0$である。
  target: |
    ∀ (K A : Type*) [Field K] [CommRing A] [Algebra K A] [Algebra.FiniteType K A] (I : Ideal A), I.radical = sInf {m : Ideal A | I ≤ m ∧ m.IsMaximal}
  proof: |
    by
      intro K A _ _ _ _ I
      have : IsJacobsonRing A := isJacobsonRing_of_finiteType (A := K)
      exact (Ideal.radical_eq_jacobson I)
- id: weak_nullstellensatz
  kind: textbook
  level: 4
  topic: 可換環論・零点定理
  statement: （弱零点定理）$K$を代数閉体、$\sigma$を有限集合、$I$を多項式環$K[x_i:i\in\sigma]$の真のイデアルとする。このとき$I$のすべての多項式の共通零点$x\in K^\sigma$が存在する。
  statement_en: Weak Nullstellensatz. If K is an algebraically closed field and I is a proper ideal of the polynomial ring over K in finitely many variables, then the polynomials in I have a common zero in K^σ.
  assumptions:
  - $K$は代数閉体
  - $\sigma$は有限集合
  - $I$は$K[x_i:i\in\sigma]$の真のイデアル
  quantifiers:
  - 任意の代数閉体$K$、有限集合$\sigma$、真のイデアル$I$
  conclusion: $I$の共通零点が存在する。
  answer: |
    $K$を代数閉体、$\sigma$を有限集合、$I$を$A=K[x_i:i\in\sigma]$の真のイデアルとする。$I$を含む極大イデアル$\mathfrak{m}$をとる。$L=A/\mathfrak{m}$は$K$代数として有限生成な体なので、ザリスキの補題より$K$上有限次元である。$L$の元は$K$上代数的で$K$は代数閉体なので、標準写像$K\to L$は同型である。
    各$i\in\sigma$について、$x_i$の$L$での像に対応する$K$の元を$a_i$とおき、$a=(a_i)_{i\in\sigma}\in K^\sigma$とする。$x_i-a_i\in\mathfrak{m}$である。$p\in A$について、$x_i$を$a_i+(x_i-a_i)$と書いて展開すると、$p-p(a)$は$x_i-a_i$たちで生成されるイデアルに属するので、$p-p(a)\in\mathfrak{m}$である。
    $p\in I$なら$p\in\mathfrak{m}$なので、定数$p(a)$は$\mathfrak{m}$に属する。$\mathfrak{m}$は真のイデアルなので$p(a)=0$である。よって$a$は$I$の共通零点である。
  strategy: Enlarge I to a maximal ideal and use Zariski's lemma to read off a point from the residue field.
  sketch:
  - 'apply_theorem: A proper ideal lies in a maximal ideal m.'
  - 'apply_theorem: By Zariski''s lemma, A/m is finite over K, so K → A/m is an isomorphism because K is algebraically closed.'
  - 'construct: Let a_i in K correspond to the image of x_i, so x_i - a_i lies in m.'
  - 'derive: For every polynomial p, p - p(a) lies in m.'
  - 'conclude: If p lies in I, the constant p(a) lies in the proper ideal m, so p(a) = 0.'
  openmath: (forall (K s I) (-> (and (is_field K) (algebraically_closed K) (finite_set s) (ideal_of I (mv_polynomial_ring s K)) (!= I (unit_ideal (mv_polynomial_ring s K)))) (exists (x) (and (in x (point_space s K)) (forall (p) (-> (in p I) (= (mv_eval x p) 0)))))))
  hard_negative:
    statement: 体$K$上の多項式環の真のイデアルは、$K$が代数閉でなくても$K^\sigma$に共通零点をもつ。
    reason: $K=\mathbb{R}$、$I=(x^2+1)\subset\mathbb{R}[x]$は真のイデアルであるが、$x^2+1$は実数の零点をもたない。
  target: |
    ∀ (K σ : Type*) [Field K] [IsAlgClosed K] [Finite σ] (I : Ideal (MvPolynomial σ K)), I ≠ ⊤ → ∃ x : σ → K, ∀ p ∈ I, MvPolynomial.eval x p = 0
  proof: |
    by
      intro K σ _ _ _ I hI
      obtain ⟨m, hm, hle⟩ := Ideal.exists_le_maximal I hI
      obtain ⟨x, rfl⟩ := MvPolynomial.isMaximal_iff_eq_vanishingIdeal_singleton.1 hm
      refine ⟨x, fun p hp => ?_⟩
      have := hle hp
      simpa [MvPolynomial.mem_vanishingIdeal_iff] using this
- id: valuation_ring_integrally_closed
  kind: gap
  level: 4
  topic: 可換環論・付値環
  statement: 付値環は整閉である。すなわち$R$を整域、$K$をその分数体とし、任意の$x\in K\setminus\{0\}$について$x\in R$または$x^{-1}\in R$とする。このとき$R$上整な$K$の元は$R$に属する。
  statement_en: 'A valuation ring is integrally closed: if R is a domain with fraction field K such that x or its inverse lies in R for every nonzero x in K, then every element of K integral over R lies in R.'
  assumptions:
  - $R$は整域
  - $K$は分数体
  - 任意の$x\in K\setminus\{0\}$で$x\in R$または$x^{-1}\in R$
  quantifiers:
  - 任意の付値環$R$
  conclusion: $R$は整閉である。
  answer: |
    $R$を付値環、$K$をその分数体とし、$x\in K$が$R$上整であるとする。$x^n+a_1x^{n-1}+\dots+a_n=0$（$n\geq 1$、$a_i\in R$）とする。$x\in R$なら終わりなので、$x\notin R$とする。$x\neq 0$であり、$x^{-1}\in R$である。
    方程式の両辺に$x^{-(n-1)}$を掛けると、$x=-(a_1+a_2x^{-1}+\dots+a_nx^{-(n-1)})$となる。右辺は$R$の元なので$x\in R$であり、矛盾する。よって$x\in R$である。
  strategy: Divide the integral equation by a power of x, using that the inverse of x lies in R.
  sketch:
  - 'setup: Let x in K satisfy a monic equation over R and suppose x is not in R.'
  - 'derive: Then the inverse of x lies in R.'
  - 'derive: Dividing by x^(n-1) writes x as an element of R.'
  - 'contradiction: So x lies in R.'
  openmath: (forall (A) (-> (and (integral_domain A) (valuation_ring A)) (integrally_closed_domain A)))
  hard_negative:
    statement: 整閉整域は付値環である。
    reason: $\mathbb{Z}$は整閉であるが、$2/3$も$3/2$も$\mathbb{Z}$に属さないので付値環でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] [ValuationRing R], IsIntegrallyClosed R
  proof: |
    by
      intro R _ _ _
      infer_instance
- id: artinian_finitely_many_maximal_ideals
  kind: gap
  level: 3
  topic: 可換環論・アルティン環
  statement: アルティン環の極大イデアルは有限個である。
  statement_en: A commutative Artinian ring has only finitely many maximal ideals.
  assumptions:
  - $R$はアルティン可換環
  quantifiers:
  - 任意のアルティン環$R$
  conclusion: $R$の極大イデアルは有限個である。
  answer: |
    $R$をアルティン可換環とする。有限個の極大イデアルの共通部分全体は（$R$が零環でなければ）空でないイデアルの集合なので、アルティン性より極小元$\mathfrak{m}_1\cap\dots\cap\mathfrak{m}_n$をもつ。零環には極大イデアルがない。
    $\mathfrak{m}$を任意の極大イデアルとする。極小性より$\mathfrak{m}\cap\mathfrak{m}_1\cap\dots\cap\mathfrak{m}_n=\mathfrak{m}_1\cap\dots\cap\mathfrak{m}_n$なので、$\mathfrak{m}_1\cap\dots\cap\mathfrak{m}_n\subseteq\mathfrak{m}$である。素イデアルは有限個の共通部分を含むならそのどれかを含むので、ある$i$で$\mathfrak{m}_i\subseteq\mathfrak{m}$であり、$\mathfrak{m}_i$は極大なので$\mathfrak{m}=\mathfrak{m}_i$である。よって極大イデアルは$\mathfrak{m}_1,\dots,\mathfrak{m}_n$だけである。
  strategy: Take a minimal finite intersection of maximal ideals and compare any maximal ideal with it.
  sketch:
  - 'apply_theorem: The set of finite intersections of maximal ideals has a minimal element.'
  - 'setup: Let m be a maximal ideal.'
  - 'derive: By minimality, m contains the minimal intersection.'
  - 'derive: A prime containing a finite intersection contains a member, so m = m_i.'
  - 'conclude: There are finitely many maximal ideals.'
  openmath: (forall (A) (-> (and (comm_ring A) (artinian_ring A)) (finite_set (maximal_ideals_of A))))
  hard_negative:
    statement: ネーター環の極大イデアルは有限個である。
    reason: $\mathbb{Z}$はネーター環であるが、素数$p$ごとに極大イデアル$(p)$があり、無限個ある。
  target: |
    ∀ (R : Type*) [CommRing R] [IsArtinianRing R], {m : Ideal R | m.IsMaximal}.Finite
  proof: |
    by
      intro R _ _
      exact IsArtinianRing.setOf_isMaximal_finite R
- id: noetherian_local_artinian_iff_maximal_nilpotent
  kind: textbook
  level: 4
  topic: 可換環論・アルティン局所環
  statement: $R$をネーター局所環、$\mathfrak{m}$を極大イデアルとする。$R$がアルティン環であることと、ある$n$で$\mathfrak{m}^n=0$であることは同値である。
  statement_en: A Noetherian local ring R with maximal ideal m is Artinian if and only if m^n = 0 for some n.
  assumptions:
  - $R$はネーター局所環
  - $\mathfrak{m}$は極大イデアル
  quantifiers:
  - 任意のネーター局所環$R$
  conclusion: $R$がアルティンであることと$\mathfrak{m}$が冪零であることは同値である。
  answer: |
    $R$をネーター局所環、$\mathfrak{m}$を極大イデアルとする。可換環がアルティンであることは、ネーターかつすべての素イデアルが極大であることと同値である。
    $R$がアルティンとする。素イデアルは$\mathfrak{m}$だけなので、$\mathfrak{m}$は冪零根基に等しい。$\mathfrak{m}$は有限生成で各元が冪零なので、ある$n$で$\mathfrak{m}^n=0$である。
    逆に$\mathfrak{m}^n=0$とする。素イデアル$\mathfrak{p}$は$\mathfrak{m}^n=0$を含むので$\mathfrak{m}\subseteq\mathfrak{p}$であり、$\mathfrak{p}=\mathfrak{m}$である。よってすべての素イデアルが極大である。$R$はネーターなのでアルティンである。
  strategy: Compare with the characterization of Artinian rings as Noetherian rings in which primes are maximal.
  sketch:
  - 'apply_theorem: Artinian is equivalent to Noetherian with all primes maximal.'
  - 'derive: If R is Artinian, m is the only prime, so it is the nilradical.'
  - 'derive: A finitely generated nil ideal is nilpotent.'
  - 'derive: Conversely, m^n = 0 forces every prime to contain m.'
  - 'conclude: So all primes equal m and R is Artinian.'
  openmath: (forall (A) (-> (and (comm_ring A) (noetherian_ring A) (local_ring A)) (<-> (artinian_ring A) (exists (n) (and (in n N) (= (ideal_power (unique_maximal_ideal A) n) (zero_ideal A)))))))
  hard_negative:
    statement: 局所環の極大イデアルの各元が冪零なら、極大イデアル自身が冪零である。
    reason: 体$k$上の$A=k[t^q:q\in\mathbb{Q}_{\geq 0}]/(t)$の極大イデアル$\mathfrak{m}=(t^q:q>0)$の元はすべて冪零である。しかし$\mathfrak{m}^2=\mathfrak{m}\neq 0$であり、$\mathfrak{m}$は冪零でない。ネーター性が要る。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] [IsLocalRing R], IsArtinianRing R ↔ ∃ n : ℕ, (IsLocalRing.maximalIdeal R) ^ n = ⊥
  proof: |
    by
      intro R _ _ _
      exact isArtinianRing_iff_isNilpotent_maximalIdeal R
- id: artinian_product_of_local_rings
  kind: textbook
  level: 4
  topic: 可換環論・アルティン環の構造
  statement: $R$をアルティン環とする。$R$の素イデアルは有限個であり、標準写像$R\to\prod_{\mathfrak{p}}R_{\mathfrak{p}}$は全単射である。各$R_{\mathfrak{p}}$はアルティン局所環である。すなわち$R$はアルティン局所環の有限直積と同型である。
  statement_en: A commutative Artinian ring R has finitely many prime ideals, the canonical map from R to the product of its localizations at primes is bijective, and each of these localizations is an Artinian local ring.
  assumptions:
  - $R$はアルティン可換環
  quantifiers:
  - 任意のアルティン環$R$
  conclusion: 素イデアルは有限個で、$R\to\prod_{\mathfrak{p}}R_{\mathfrak{p}}$は全単射で、各$R_{\mathfrak{p}}$はアルティン局所環である。
  answer: |
    $R$をアルティン可換環とする。素イデアルはすべて極大なので有限個であり、$\mathfrak{m}_1,\dots,\mathfrak{m}_n$と書く。ジャコブソン根基$J=\bigcap_i\mathfrak{m}_i$は冪零なので、ある$k$で$J^k=0$である。$\mathfrak{m}_i$たちは対ごとに互いに素なので、$\mathfrak{m}_i^k$たちも対ごとに互いに素である。よって$\bigcap_i\mathfrak{m}_i^k=\prod_i\mathfrak{m}_i^k=(\prod_i\mathfrak{m}_i)^k=J^k=0$であり、中国剰余定理により$R\to\prod_iR/\mathfrak{m}_i^k$は同型である。
    $R/\mathfrak{m}_i^k$は素イデアルが$\mathfrak{m}_i/\mathfrak{m}_i^k$だけの局所環である。$i$成分だけ$1$の冪等元$e_i$は$\mathfrak{m}_i$に属さず、他の成分を消すので、$R_{\mathfrak{m}_i}$は$(R/\mathfrak{m}_i^k)_{\mathfrak{m}_i}$に等しい。局所環で極大イデアルの外の元はすでに単元なので、これは$R/\mathfrak{m}_i^k$である。よって$R\to\prod_iR_{\mathfrak{m}_i}$は上の同型と一致し、全単射である。
    局所化はアルティン性を保つので、各$R_{\mathfrak{m}_i}$はアルティン局所環である。
  strategy: Combine nilpotence of the Jacobson radical with the Chinese remainder theorem, and identify the local factors with localizations.
  sketch:
  - 'derive: Primes are maximal, so there are finitely many: m_1, ..., m_n.'
  - 'apply_theorem: The Jacobson radical is nilpotent, so J^k = 0.'
  - 'apply_theorem: The Chinese remainder theorem gives R isomorphic to the product of R/m_i^k.'
  - 'derive: Each factor is local with unique prime m_i/m_i^k, and equals R localized at m_i.'
  - 'conclude: The canonical map to the product of localizations is bijective with Artinian local factors.'
  openmath: (forall (A) (-> (and (comm_ring A) (artinian_ring A)) (and (finite_set (prime_spectrum A)) (bijective_map (localization_product_map A)) (forall (p B) (-> (and (prime_ideal p A) (comm_ring B) (localization_at_prime B A p)) (and (local_ring B) (artinian_ring B)))))))
  hard_negative:
    statement: ネーター環は有限個の局所環の直積と同型である。
    reason: $\mathbb{Z}$はネーター環であるが、冪等元が$0,1$だけなので自明でない直積に分解しない。また$\mathbb{Z}$は局所環でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsArtinianRing R], Finite (PrimeSpectrum R) ∧ Function.Bijective (PrimeSpectrum.toPiLocalization R) ∧ ∀ p : PrimeSpectrum R, IsLocalRing (Localization.AtPrime p.asIdeal) ∧ IsArtinianRing (Localization.AtPrime p.asIdeal)
  proof: |
    by
      intro R _ _
      refine ⟨inferInstance, PrimeSpectrum.toPiLocalization_bijective, fun p => ⟨inferInstance, ?_⟩⟩
      exact IsArtinianRing.localization_artinian p.asIdeal.primeCompl _
- id: artinian_local_principal_maximal_ideal
  kind: gap
  level: 4
  topic: 可換環論・アルティン局所環
  statement: $R$をアルティン局所環とし、極大イデアルが$\mathfrak{m}=(t)$と単項であるとする。このとき$R$のすべてのイデアルは単項である。
  statement_en: If R is an Artinian local ring whose maximal ideal is principal, generated by t, then every ideal of R is principal.
  assumptions:
  - $R$はアルティン局所環
  - 極大イデアルは$\mathfrak{m}=(t)$
  quantifiers:
  - 任意のアルティン局所環$R$と生成元$t$
  conclusion: $R$のすべてのイデアルは単項である。
  answer: |
    $R$をアルティン局所環、$\mathfrak{m}=(t)$を極大イデアルとする。ジャコブソン根基$\mathfrak{m}$は冪零なので、$t^n=0$となる$n$がある。
    まず$0$でない元はすべて$ut^a$（$u$は単元）と書けることを示す。$x\in(t^{n-i})$についての$i$の帰納法で、$x=0$または$x=ut^a$であることを示す。$i=0$なら$x\in(t^n)=0$である。$1\leq i\leq n$のとき$x=t^{n-i}y$とする。$y$が単元なら終わりである。$y$が単元でないなら$y\in\mathfrak{m}$なので$y=tz$であり、$x\in(t^{n-i+1})$となって帰納法の仮定が使える。$i=n$とすると、$R$のすべての元についてこの形が得られる。
    $I$をイデアルとする。$t^n=0\in I$なので、$t^k\in I$となる最小の$k$がある。$(t^k)\subseteq I$である。$x\in I$を$0$でないとし、$x=ut^a$と書く。$u$は単元なので$t^a\in I$であり、$a\geq k$である。よって$x\in(t^k)$であり、$I=(t^k)$である。
  strategy: Show every element is a unit times a power of t, then generate an ideal by the smallest power of t it contains.
  sketch:
  - 'derive: t is nilpotent because the maximal ideal is the Jacobson radical.'
  - 'induction: Downward induction shows each element is zero or a unit times a power of t.'
  - 'setup: For an ideal I, take the least k with t^k in I.'
  - 'derive: Any nonzero x = ut^a in I has t^a in I, so a ≥ k.'
  - 'conclude: Hence I = (t^k).'
  openmath: (forall (A t) (-> (and (comm_ring A) (artinian_ring A) (local_ring A) (= (unique_maximal_ideal A) (principal_ideal t))) (forall (I) (-> (ideal_of I A) (exists (x) (and (in x A) (= I (principal_ideal x))))))))
  hard_negative:
    statement: アルティン局所環のイデアルはすべて単項である。
    reason: 体$k$上の$R=k[x,y]/(x,y)^2$はアルティン局所環であるが、極大イデアル$(x,y)$は単項でない。$\mathfrak{m}/\mathfrak{m}^2$が$2$次元だからである。
  target: |
    ∀ (R : Type*) [CommRing R] [IsArtinianRing R] [IsLocalRing R] (t : R), IsLocalRing.maximalIdeal R = Ideal.span {t} → ∀ I : Ideal R, I.IsPrincipal
  proof: |
    by
      intro R _ _ _ t hm I
      classical
      obtain ⟨n, hn⟩ : ∃ n : ℕ, t ^ n = 0 := by
        obtain ⟨n, hn⟩ := IsArtinianRing.isNilpotent_jacobson_bot (R := R)
        refine ⟨n, ?_⟩
        have ht : t ∈ IsLocalRing.maximalIdeal R := hm ▸ Ideal.mem_span_singleton_self t
        have hj : t ∈ Ideal.jacobson (⊥ : Ideal R) := by
          rw [IsLocalRing.jacobson_eq_maximalIdeal ⊥ bot_ne_top]; exact ht
        have := Ideal.pow_mem_pow hj n
        rw [hn] at this
        exact Ideal.mem_bot.1 this
      have hform : ∀ i : ℕ, ∀ x : R, x ∈ Ideal.span {t ^ (n - i)} → x = 0 ∨ ∃ (u : R) (a : ℕ), IsUnit u ∧ x = u * t ^ a := by
        intro i
        induction i with
        | zero =>
          intro x hx
          left
          simpa [hn] using hx
        | succ i ih =>
          intro x hx
          obtain ⟨y, rfl⟩ := Ideal.mem_span_singleton'.1 hx
          by_cases hy : IsUnit y
          · exact Or.inr ⟨y, _, hy, rfl⟩
          · have hym : y ∈ Ideal.span {t} := hm ▸ (IsLocalRing.mem_maximalIdeal y).2 hy
            obtain ⟨z, rfl⟩ := Ideal.mem_span_singleton'.1 hym
            by_cases hi : i < n
            · apply ih
              refine Ideal.mem_span_singleton'.2 ⟨z, ?_⟩
              have : n - i = (n - (i + 1)) + 1 := by omega
              rw [this, pow_succ]; ring
            · have : n - i = 0 := by omega
              apply ih
              simp [this]
      by_cases hI : I = ⊥
      · exact hI ▸ ⟨⟨0, by simp⟩⟩
      have hex : ∃ k, t ^ k ∈ I := ⟨n, by rw [hn]; exact I.zero_mem⟩
      refine ⟨⟨t ^ Nat.find hex, le_antisymm ?_ ?_⟩⟩
      · intro x hx
        rcases hform n x (by simp) with rfl | ⟨u, a, hu, rfl⟩
        · exact Submodule.zero_mem _
        · have hta : t ^ a ∈ I := (Ideal.unit_mul_mem_iff_mem I hu).1 hx
          have hle := Nat.find_min' hex hta
          obtain ⟨c, rfl⟩ := Nat.exists_eq_add_of_le hle
          exact Ideal.mem_span_singleton'.2 ⟨u * t ^ c, by rw [pow_add]; ring⟩
      · exact (Ideal.span_singleton_le_iff_mem I).2 (Nat.find_spec hex)
- id: dvr_iff_maximal_ideal_principal
  kind: textbook
  level: 4
  topic: 可換環論・離散付値環
  statement: $R$をネーター局所整域で体でないものとする。$R$が離散付値環（単項イデアル整域である局所環で体でないもの）であることと、極大イデアルが単項であることは同値である。
  statement_en: A Noetherian local domain R that is not a field is a discrete valuation ring, that is, a local principal ideal domain that is not a field, if and only if its maximal ideal is principal.
  assumptions:
  - $R$はネーター局所整域
  - $R$は体でない
  quantifiers:
  - 任意のネーター局所整域$R$
  conclusion: $R$が離散付値環であることと極大イデアルが単項であることは同値である。
  answer: |
    $R$をネーター局所整域で体でないものとし、$\mathfrak{m}$を極大イデアルとする。$R$が単項イデアル整域なら$\mathfrak{m}$は単項である。
    逆に$\mathfrak{m}=(t)$とする。$R$は体でないので$t\neq 0$である。クルルの交叉定理より$\bigcap_n\mathfrak{m}^n=0$である。$x\neq 0$をとると、$x\in\mathfrak{m}^a=(t^a)$となる最大の$a$がある。$x=ut^a$と書くと、$u\notin\mathfrak{m}$なので$u$は単元である。
    $I$を$0$でないイデアルとし、$I$の$0$でない元$ut^a$の指数$a$の最小値を$k$とする。$u$は単元なので$t^k\in I$であり、$I$の$0$でない元はすべて$t^k$で割り切れる。よって$I=(t^k)$であり、$R$は単項イデアル整域である。
  strategy: Use Krull's intersection theorem to write every nonzero element as a unit times a power of the generator.
  sketch:
  - 'derive: A principal ideal domain has principal maximal ideal.'
  - 'setup: Suppose m = (t) with t nonzero.'
  - 'apply_theorem: Krull''s intersection theorem gives a largest a with x in (t^a).'
  - 'derive: So x = ut^a with u a unit.'
  - 'conclude: Every nonzero ideal is (t^k), so R is a principal ideal domain.'
  openmath: (forall (A) (-> (and (integral_domain A) (noetherian_ring A) (local_ring A) (not (is_field A))) (<-> (discrete_valuation_ring A) (exists (t) (and (in t A) (= (unique_maximal_ideal A) (principal_ideal t)))))))
  hard_negative:
    statement: 体でない局所整域は、極大イデアルが単項なら離散付値環である。
    reason: 値群が辞書式順序の$\mathbb{Z}\times\mathbb{Z}$である付値環では、$(0,1)$の値をもつ元が極大イデアルを生成する。しかし第1成分が正の元からなる素イデアルは有限生成でなく、この環はネーター環でない。よって離散付値環でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] [IsLocalRing R] [IsDomain R], ¬ IsField R → (IsDiscreteValuationRing R ↔ (IsLocalRing.maximalIdeal R).IsPrincipal)
  proof: |
    by
      intro R _ _ _ _ h
      exact (IsDiscreteValuationRing.TFAE R h).out 0 4
- id: dvr_iff_integrally_closed_unique_nonzero_prime
  kind: textbook
  level: 4
  topic: 可換環論・離散付値環
  statement: $R$をネーター局所整域で体でないものとする。$R$が離散付値環であることと、$R$が整閉で$0$でない素イデアルがただ1つであることは同値である。
  statement_en: A Noetherian local domain R that is not a field is a discrete valuation ring if and only if R is integrally closed and has exactly one nonzero prime ideal.
  assumptions:
  - $R$はネーター局所整域
  - $R$は体でない
  quantifiers:
  - 任意のネーター局所整域$R$
  conclusion: $R$が離散付値環であることと、整閉で$0$でない素イデアルがただ1つであることは同値である。
  answer: |
    $R$をネーター局所整域で体でないものとし、$\mathfrak{m}$を極大イデアル、$K$を分数体とする。$R$が離散付値環なら、$R$は単項イデアル整域なので一意分解整域であり、整閉である。$0$でない素イデアルは$\mathfrak{m}$だけである。
    逆に$R$が整閉で、$0$でない素イデアルが$\mathfrak{m}$だけとする。$0$でない$a\in\mathfrak{m}$をとると、$\sqrt{(a)}=\mathfrak{m}$である。$\mathfrak{m}$は有限生成なので$\mathfrak{m}^n\subseteq(a)$となる$n$がある。そのような最小の$n$をとり、$b\in\mathfrak{m}^{n-1}\setminus(a)$を選ぶ（$n\geq 1$であり、$\mathfrak{m}^0=R$とする）。$y=b/a\in K$とおく。$b\notin(a)$より$y\notin R$であり、$y\mathfrak{m}\subseteq R$である。
    $y\mathfrak{m}\subseteq\mathfrak{m}$なら、$\mathfrak{m}$は$0$でない有限生成$R$加群で$y$倍で閉じるので、行列式の技法により$y$は$R$上整となる（$R$は体でないので$\mathfrak{m}\neq 0$であり、$K$の中で$p(y)\mathfrak{m}=0$から$p(y)=0$を得る）。$R$は整閉なので$y\in R$となり、矛盾する。よって$y\mathfrak{m}=R$である。すなわち$yt=1$となる$t\in\mathfrak{m}$があり、$\mathfrak{m}=t\,y\mathfrak{m}=(t)$である。
    極大イデアルが単項なネーター局所整域で体でないものは離散付値環なので、$R$は離散付値環である。
  strategy: Build y = b/a outside R with ym in R; integral closedness forces ym = R, which makes m principal.
  sketch:
  - 'derive: A DVR is a UFD, hence integrally closed, and m is its only nonzero prime.'
  - 'setup: Take a nonzero a in m, so rad(a) = m and m^n ⊆ (a) for a least n.'
  - 'construct: Choose b in m^(n-1) outside (a) and let y = b/a.'
  - 'derive: y is outside R and ym lies in R.'
  - 'derive: If ym ⊆ m, the determinant trick makes y integral, so y lies in R, a contradiction.'
  - 'derive: So ym = R, which makes m principal.'
  - 'conclude: A principal maximal ideal gives a DVR.'
  openmath: (forall (A) (-> (and (integral_domain A) (noetherian_ring A) (local_ring A) (not (is_field A))) (<-> (discrete_valuation_ring A) (and (integrally_closed_domain A) (exists (p) (and (prime_ideal p A) (!= p (zero_ideal A)) (forall (q) (-> (and (prime_ideal q A) (!= q (zero_ideal A))) (= q p)))))))))
  hard_negative:
    statement: ネーター局所整域で$0$でない素イデアルがただ1つなら、離散付値環である。
    reason: 体$k$上の$R=k[x^2,x^3]_{(x^2,x^3)}$は1次元のネーター局所整域で、$0$でない素イデアルは極大イデアルだけである。しかし$x$は$R$上整で$x\notin R$なので整閉でなく、離散付値環でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] [IsLocalRing R] [IsDomain R], ¬ IsField R → (IsDiscreteValuationRing R ↔ IsIntegrallyClosed R ∧ ∃! P : Ideal R, P ≠ ⊥ ∧ P.IsPrime)
  proof: |
    by
      intro R _ _ _ _ h
      exact (IsDiscreteValuationRing.TFAE R h).out 0 3
- id: dvr_fraction_field_element_form
  kind: gap
  level: 4
  topic: 可換環論・離散付値環
  statement: $R$を離散付値環、$K$をその分数体、$t$を$R$の既約元とする。$K$の$0$でない元$x$は、$R$の単元$u$と整数$n$により$x=ut^n$と書ける。
  statement_en: Let R be a discrete valuation ring with fraction field K and t an irreducible element of R. Every nonzero x in K has the form x = u t^n with u a unit of R and n an integer.
  assumptions:
  - $R$は離散付値環
  - $K$は分数体
  - $t$は既約元
  - $x\in K\setminus\{0\}$
  quantifiers:
  - 任意の離散付値環$R$、分数体$K$、既約元$t$、元$x$
  conclusion: $x=ut^n$（$u$は$R$の単元、$n\in\mathbb{Z}$）と書ける。
  answer: |
    $R$を離散付値環、$K$を分数体、$t$を既約元、$x\in K$を$0$でない元とする。$x=a/b$（$a,b\in R$、$a,b\neq 0$）と書く。離散付値環は単項イデアル整域であり、既約元$t$は同伴を除いてただ1つの素元である。一意分解により$a=ut^m$、$b=vt^k$（$u,v$は単元、$m,k\geq 0$）と書ける。
    よって$x=(uv^{-1})t^{m-k}$である。$uv^{-1}$は$R$の単元で、$m-k$は整数である。
  strategy: Factor numerator and denominator in R, where the only prime up to units is t.
  sketch:
  - 'setup: Write x = a/b with a, b nonzero in R.'
  - 'apply_theorem: In a DVR, every nonzero element is a unit times a power of t.'
  - 'derive: So a = ut^m and b = vt^k.'
  - 'conclude: Then x = (u/v) t^(m-k).'
  openmath: (forall (A K t x) (-> (and (integral_domain A) (discrete_valuation_ring A) (fraction_field_of K A) (irreducible_element t A) (in x K) (!= x 0)) (exists (u n) (and (unit_element u A) (in n Z) (= x (* (fn_value (fraction_embedding A K) u) (^ (fn_value (fraction_embedding A K) t) n)))))))
  hard_negative:
    statement: 離散付値環$R$の分数体の$0$でない元は、$R$の単元と$t$の自然数冪の積で書ける。
    reason: $R=\mathbb{Z}_{(2)}$、$t=2$、$x=1/2$とすると、$x=2^{-1}$である。単元と$2^n$（$n\geq 0$）の積は$R$の元であるが、$1/2\notin R$である。負の指数が要る。
  target: |
    ∀ (R K : Type*) [CommRing R] [IsDomain R] [IsDiscreteValuationRing R] [Field K] [Algebra R K] [IsFractionRing R K] (t : R), Irreducible t → ∀ x : K, x ≠ 0 → ∃ (u : Rˣ) (n : ℤ), x = algebraMap R K u * (algebraMap R K t) ^ n
  proof: |
    by
      intro R K _ _ _ _ _ _ t ht x hx
      obtain ⟨a, b, hb, rfl⟩ := IsFractionRing.div_surjective (A := R) x
      have hb0 : b ≠ 0 := nonZeroDivisors.ne_zero hb
      have ha0 : a ≠ 0 := by
        rintro rfl
        simp at hx
      obtain ⟨m, u, rfl⟩ := IsDiscreteValuationRing.eq_unit_mul_pow_irreducible ha0 ht
      obtain ⟨k, v, rfl⟩ := IsDiscreteValuationRing.eq_unit_mul_pow_irreducible hb0 ht
      have inj : Function.Injective (algebraMap R K) := IsFractionRing.injective R K
      have ht0 : algebraMap R K t ≠ 0 := fun h => ht.ne_zero (inj (by simpa using h))
      have hv0 : algebraMap R K (v : R) ≠ 0 := fun h => v.ne_zero (inj (by simpa using h))
      refine ⟨u * v⁻¹, (m : ℤ) - k, ?_⟩
      have hvinv : algebraMap R K ((v⁻¹ : Rˣ) : R) = (algebraMap R K (v : R))⁻¹ := by
        apply eq_inv_of_mul_eq_one_left
        rw [← map_mul, Units.inv_mul, map_one]
      rw [Units.val_mul, map_mul, map_mul, map_mul, map_pow, map_pow, hvinv, zpow_sub₀ ht0, zpow_natCast, zpow_natCast]
      field_simp
- id: dedekind_of_local_dvr
  kind: textbook
  level: 4
  topic: 可換環論・デデキント整域
  statement: $R$をネーター整域とし、$0$でないすべての素イデアル$\mathfrak{p}$で$R_{\mathfrak{p}}$が離散付値環であるとする。このとき$R$はデデキント整域である。ここでデデキント整域とは、ネーター整閉整域で$0$でない素イデアルがすべて極大であるものをいい、体も含める。
  statement_en: A Noetherian integral domain whose localization at every nonzero prime is a discrete valuation ring is a Dedekind domain, where a Dedekind domain means a Noetherian integrally closed domain in which every nonzero prime is maximal, fields included.
  assumptions:
  - $R$はネーター整域
  - $0$でない素イデアル$\mathfrak{p}$で$R_{\mathfrak{p}}$は離散付値環
  - デデキント整域には体も含める
  quantifiers:
  - 任意のネーター整域$R$
  conclusion: $R$はデデキント整域である。
  answer: |
    $R$をネーター整域とし、$0$でない素イデアル$\mathfrak{p}$で$R_{\mathfrak{p}}$が離散付値環であるとする。
    $0$でない素イデアルが極大であることを示す。$\mathfrak{p}\neq 0$が極大でないとし、$\mathfrak{p}\subsetneq\mathfrak{m}$となる極大イデアル$\mathfrak{m}$をとる。$R_{\mathfrak{m}}$には$0\subsetneq\mathfrak{p}R_{\mathfrak{m}}\subsetneq\mathfrak{m}R_{\mathfrak{m}}$という素イデアルの鎖がある。これは$0$でない素イデアルがただ1つである離散付値環に反する。
    $R$が整閉であることを示す。$R$の極大イデアル$\mathfrak{m}$について、$\mathfrak{m}=0$なら$R$は体で整閉である。$\mathfrak{m}\neq 0$なら$R_{\mathfrak{m}}$は離散付値環なので整閉である。整閉性は極大イデアルでの局所化で判定できるので、$R$は整閉である。
  strategy: Rule out chains of primes by localizing and check integral closedness at maximal ideals.
  sketch:
  - 'setup: Suppose there is a chain of nonzero primes q ⊊ p.'
  - 'derive: Localizing at a maximal ideal containing p gives a chain of length 2 in a DVR.'
  - 'contradiction: A DVR has only one nonzero prime, so nonzero primes are maximal.'
  - 'derive: Each R_m is a DVR or R is a field, so each R_m is integrally closed.'
  - 'apply_theorem: Integral closedness is checked at maximal ideals.'
  - 'conclude: R is a Dedekind domain.'
  openmath: (forall (A) (-> (and (integral_domain A) (noetherian_ring A) (forall (p B) (-> (and (prime_ideal p A) (!= p (zero_ideal A)) (comm_ring B) (localization_at_prime B A p)) (discrete_valuation_ring B)))) (dedekind_domain A)))
  hard_negative:
    statement: ネーター整域$R$のある1つの$0$でない素イデアル$\mathfrak{p}$で$R_{\mathfrak{p}}$が離散付値環なら、$R$はデデキント整域である。
    reason: 体$k$上の$R=k[x^2,x^3]$で$\mathfrak{p}=(x^2-1,x^3-1)$とすると、$R_{\mathfrak{p}}=k[x]_{(x-1)}$は離散付値環である。しかし$R$は整閉でないのでデデキント整域でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] [IsNoetherianRing R], (∀ P : Ideal R, P ≠ ⊥ → ∀ _ : P.IsPrime, IsDiscreteValuationRing (Localization.AtPrime P)) → IsDedekindDomain R
  proof: |
    by
      intro R _ _ _ h
      have : IsDedekindDomainDvr R := { is_dvr_at_nonzero_prime := h, __ := (inferInstance : IsNoetherianRing R) }
      infer_instance
- id: dedekind_ideal_two_generated
  kind: gap
  level: 4
  topic: 可換環論・デデキント整域
  statement: $R$をデデキント整域、$I$をイデアル、$x\in I$を$0$でない元とする。ある$y\in R$で$I=(x,y)$である。とくにデデキント整域のイデアルは高々2個の元で生成される。
  statement_en: Let I be an ideal of a Dedekind domain and x a nonzero element of I. Then I = (x, y) for some y. In particular, every ideal of a Dedekind domain is generated by at most two elements.
  assumptions:
  - $R$はデデキント整域
  - $I$はイデアル
  - $x\in I$、$x\neq 0$
  quantifiers:
  - 任意のデデキント整域$R$、イデアル$I$、$0$でない元$x\in I$
  conclusion: ある$y$で$I=(x,y)$である。
  answer: |
    $R$をデデキント整域、$I$をイデアル、$x\in I$を$0$でない元とする。$(x)\subseteq I$なので$I$は$(x)$を割り切る。$(x)$の素因子を$\mathfrak{p}_1,\dots,\mathfrak{p}_r$（$r=0$なら$x$は単元で$I=R$であり、$y=0$でよい）とする。$I=\prod_i\mathfrak{p}_i^{e_i}$、$(x)=\prod_i\mathfrak{p}_i^{f_i}$と書くと$e_i\leq f_i$である。
    素イデアル分解の一意性より$\mathfrak{p}_i^{e_i}\neq\mathfrak{p}_i^{e_i+1}$なので、$y_i\in\mathfrak{p}_i^{e_i}\setminus\mathfrak{p}_i^{e_i+1}$を選ぶ。$\mathfrak{p}_i^{e_i+1}$たちは対ごとに互いに素なので、中国剰余定理より、すべての$i$で$y\equiv y_i\pmod{\mathfrak{p}_i^{e_i+1}}$となる$y$がある。すると$y\in\mathfrak{p}_i^{e_i}$かつ$y\notin\mathfrak{p}_i^{e_i+1}$である。
    $y\in\bigcap_i\mathfrak{p}_i^{e_i}=I$なので$(x,y)\subseteq I$である。素イデアル$\mathfrak{p}$の$(x,y)$での指数は、$(x)$と$(y)$の指数の小さい方である。$\mathfrak{p}=\mathfrak{p}_i$なら$\min(f_i,e_i)=e_i$であり、それ以外の$\mathfrak{p}$なら$(x)$の指数が$0$なので$0$である。よって$(x,y)=\prod_i\mathfrak{p}_i^{e_i}=I$である。
  strategy: Use unique factorization and the Chinese remainder theorem to choose y with the exact exponents of I at the primes dividing x.
  sketch:
  - 'setup: Factor I and (x) over the primes p_i dividing x, with exponents e_i ≤ f_i.'
  - 'construct: Choose y_i in p_i^(e_i) outside p_i^(e_i+1).'
  - 'apply_theorem: The Chinese remainder theorem gives y with y ≡ y_i modulo p_i^(e_i+1).'
  - 'derive: y lies in I and has exponent exactly e_i at p_i.'
  - 'conclude: The exponents of (x, y) agree with those of I, so (x, y) = I.'
  openmath: (forall (A I x) (-> (and (dedekind_domain A) (ideal_of I A) (in x I) (!= x 0)) (exists (y) (and (in y A) (= I (ideal_sum (principal_ideal x) (principal_ideal y)))))))
  hard_negative:
    statement: ネーター整域のイデアルはすべて高々2個の元で生成される。
    reason: 体$k$上の$k[x,y,z]$はネーター整域であるが、極大イデアル$(x,y,z)$を$\mathfrak{m}/\mathfrak{m}^2$で見ると3次元なので、3個未満の元では生成されない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDedekindDomain R] (I : Ideal R) (x : R), x ∈ I → x ≠ 0 → ∃ y : R, I = Ideal.span {x, y}
  proof: |
    by
      intro R _ _ I x hx h0
      exact IsDedekindDomain.exists_eq_span_pair hx h0
- id: dedekind_flat_iff_torsion_free
  kind: textbook
  level: 4
  topic: 可換環論・デデキント整域上の平坦加群
  statement: $R$をデデキント整域、$M$を$R$加群とする。$M$が平坦であることと、$M$がねじれをもたないこと（$a\neq 0$、$x\neq 0$なら$ax\neq 0$）は同値である。
  statement_en: A module M over a Dedekind domain is flat if and only if it is torsion free.
  assumptions:
  - $R$はデデキント整域
  - $M$は$R$加群
  quantifiers:
  - 任意のデデキント整域$R$と加群$M$
  conclusion: $M$が平坦であることとねじれをもたないことは同値である。
  answer: |
    $R$をデデキント整域、$M$を$R$加群とする。$M$が平坦とし、$a\neq 0$を$R$の元とする。$R$は整域なので$a$倍$R\to R$は単射である。平坦性より$M\to M$の$a$倍も単射である。よって$M$はねじれをもたない。
    逆に$M$がねじれをもたないとする。$\mathfrak{m}$を極大イデアルとする。$R_{\mathfrak{m}}$は体または離散付値環なので、単項イデアル整域である。$M_{\mathfrak{m}}$もねじれをもたない。単項イデアル整域上で、ねじれのない有限生成加群は自由である。$M_{\mathfrak{m}}$はそのような部分加群の和集合で、有向に合併される。テンソル積の元は有限個の元で書けるので、有向合併で平坦性は保たれる。よって$M_{\mathfrak{m}}$は$R_{\mathfrak{m}}$上平坦である。平坦性は極大イデアルでの局所化で判定できるので、$M$は平坦である。
  strategy: Flat implies torsion free by multiplication maps; the converse is checked locally over principal ideal domains.
  sketch:
  - 'derive: Tensoring the injection given by multiplication by a shows M has no torsion.'
  - 'setup: Conversely let M be torsion free and m maximal.'
  - 'derive: R_m is a principal ideal domain and M_m is torsion free.'
  - 'apply_theorem: Finitely generated torsion free modules over a PID are free, so M_m is a directed union of free modules, hence flat.'
  - 'apply_theorem: Flatness is checked at maximal ideals.'
  - 'conclude: M is flat.'
  openmath: (forall (A V) (-> (and (dedekind_domain A) (module_over V A)) (<-> (flat_module A V) (= (torsion_submodule A V) (zero_submodule V)))))
  hard_negative:
    statement: 整域上のねじれのない加群はすべて平坦である。
    reason: 体$k$上の$R=k[x,y]$で$I=(x,y)$はねじれのない加群である。$I$が平坦なら、$R_{(x,y)}$上の有限生成平坦加群$I_{(x,y)}$は自由で階数$1$となり、単項である。しかし$I_{(x,y)}$は単項でない。
  target: |
    ∀ (R M : Type*) [CommRing R] [IsDedekindDomain R] [AddCommGroup M] [Module R M], Module.Flat R M ↔ Submodule.torsion R M = ⊥
  proof: |
    by
      intro R M _ _ _ _
      exact IsDedekindDomain.flat_iff_torsion_eq_bot
- id: artin_rees_lemma
  kind: named
  level: 4
  topic: 可換環論・アルティン・リースの補題
  statement: （アルティン・リースの補題）$R$をネーター環、$I$をイデアル、$M$を有限生成$R$加群、$N$を部分加群とする。ある自然数$k$が存在して、すべての$n\geq k$で$I^nM\cap N=I^{n-k}(I^kM\cap N)$である。
  statement_en: Artin-Rees lemma. Let R be a Noetherian ring, I an ideal, M a finitely generated R-module and N a submodule. There is k such that I^n M ∩ N = I^(n-k)(I^k M ∩ N) for all n ≥ k.
  assumptions:
  - $R$はネーター可換環
  - $I$はイデアル
  - $M$は有限生成$R$加群
  - $N$は部分加群
  quantifiers:
  - 任意のネーター環$R$、イデアル$I$、有限生成加群$M$、部分加群$N$
  conclusion: ある$k$で、すべての$n\geq k$について$I^nM\cap N=I^{n-k}(I^kM\cap N)$である。
  answer: |
    $R$をネーター環、$I=(a_1,\dots,a_r)$をイデアル、$M$を有限生成$R$加群、$N$を部分加群とする。$R^*=\bigoplus_{n\geq 0}I^nT^n\subseteq R[T]$とおく。$R^*$は$R$上$a_iT$で生成されるので、ヒルベルトの基底定理によりネーター環である。
    $M^*=\bigoplus_nI^nM$は次数付き$R^*$加群で、$M$の生成元（次数$0$）で生成されるので有限生成である。$R^*$はネーター環なので、$M^*$の部分$R^*$加群$N^*=\bigoplus_n(I^nM\cap N)$も有限生成である。$N^*$の斉次な生成元の次数の最大値を$k$とする。
    $n\geq k$とする。$N^*$の次数$n$の部分は、次数$m_j\leq k$の生成元$g_j$と$R^*$の次数$n-m_j$の元の積の和である。$R^*$の次数$n-m_j$の部分は$I^{n-k}\cdot I^{k-m_j}T^{n-m_j}$であり、$I^{k-m_j}g_j\subseteq I^kM\cap N$である。よって$I^nM\cap N\subseteq I^{n-k}(I^kM\cap N)$である。逆の包含は$I^{n-k}I^kM\subseteq I^nM$と$I^{n-k}N\subseteq N$から従う。
  strategy: Pass to the Rees algebra, which is Noetherian, and take the top degree of generators of N*.
  sketch:
  - 'setup: Let R* be the Rees algebra of I and M* the direct sum of the I^n M.'
  - 'apply_theorem: R* is Noetherian by the Hilbert basis theorem, and M* is finitely generated.'
  - 'derive: N*, the direct sum of the I^n M ∩ N, is a finitely generated submodule.'
  - 'construct: Let k be the largest degree of homogeneous generators of N*.'
  - 'derive: For n ≥ k, the degree n part of N* lies in I^(n-k)(I^k M ∩ N).'
  - 'conclude: The reverse inclusion is immediate.'
  openmath: (forall (A V I W) (-> (and (comm_ring A) (noetherian_ring A) (module_over V A) (finitely_generated_module A V) (ideal_of I A) (submodule_of W V)) (exists (k) (and (in k N) (forall (n) (-> (and (in n N) (>= n k)) (= (inter (ideal_smul_submodule (ideal_power I n) (whole_submodule V)) W) (ideal_smul_submodule (ideal_power I (- n k)) (inter (ideal_smul_submodule (ideal_power I k) (whole_submodule V)) W)))))))))
  hard_negative:
    statement: アルティン・リースの補題は$k=0$で成り立つ。すなわち$I^nM\cap N=I^nN$である。
    reason: $R=M=\mathbb{Z}$、$I=(2)$、$N=(2)$、$n=1$とすると、左辺は$(2)$、右辺は$(4)$である。この例では$k=1$が必要である。
  target: |
    ∀ (R M : Type*) [CommRing R] [IsNoetherianRing R] [AddCommGroup M] [Module R M] [Module.Finite R M] (I : Ideal R) (N : Submodule R M), ∃ k : ℕ, ∀ n ≥ k, I ^ n • (⊤ : Submodule R M) ⊓ N = I ^ (n - k) • (I ^ k • (⊤ : Submodule R M) ⊓ N)
  proof: |
    by
      intro R M _ _ _ _ _ I N
      exact Ideal.exists_pow_inf_eq_pow_smul I N
- id: krull_intersection_general
  kind: named
  level: 4
  topic: 可換環論・クルルの交叉定理
  statement: （クルルの交叉定理の一般形）$R$をネーター環、$I$をイデアル、$M$を有限生成$R$加群、$x\in M$とする。すべての$n$で$x\in I^nM$であることと、ある$r\in I$で$rx=x$であることは同値である。局所環の形の交叉定理はこの系である。
  statement_en: Krull's intersection theorem, general form. For a Noetherian ring R, an ideal I, a finitely generated module M and x in M, x lies in I^n M for all n if and only if rx = x for some r in I. The local form is a corollary.
  assumptions:
  - $R$はネーター可換環
  - $I$はイデアル
  - $M$は有限生成$R$加群
  - $x\in M$
  quantifiers:
  - 任意のネーター環$R$、イデアル$I$、有限生成加群$M$、元$x$
  conclusion: $x\in\bigcap_nI^nM$と、ある$r\in I$で$rx=x$は同値である。
  answer: |
    $R$をネーター環、$I$をイデアル、$M$を有限生成$R$加群、$x\in M$とする。$r\in I$で$rx=x$なら、帰納的に$x=r^nx\in I^nM$である。
    逆を示す。$N=\bigcap_nI^nM$とおく。アルティン・リースの補題より、ある$k$で$I^{k+1}M\cap N=I(I^kM\cap N)$である。$N\subseteq I^{k+1}M$と$N\subseteq I^kM$より、これは$N=IN$を意味する。$M$はネーター加群なので$N$は有限生成である。中山の補題の形より、ある$r\in I$で$(1-r)N=0$である。よって$x\in N$について$rx=x$である。
  strategy: Apply Artin-Rees to the intersection N to get N = IN, then use Nakayama's lemma.
  sketch:
  - 'derive: If rx = x, then x = r^n x lies in I^n M for every n.'
  - 'setup: Let N be the intersection of the I^n M.'
  - 'apply_theorem: Artin-Rees with n = k + 1 gives N = IN.'
  - 'apply_theorem: N is finitely generated, so Nakayama''s lemma gives r in I with (1 - r)N = 0.'
  - 'conclude: Hence rx = x for x in N.'
  openmath: (forall (A V I x) (-> (and (comm_ring A) (noetherian_ring A) (module_over V A) (finitely_generated_module A V) (ideal_of I A) (in x V)) (<-> (forall (n) (-> (in n N) (in x (ideal_smul_submodule (ideal_power I n) (whole_submodule V))))) (exists (r) (and (in r I) (= (smul r x) x))))))
  hard_negative:
    statement: ネーター環のイデアル$I$と有限生成加群$M$について、$\bigcap_nI^nM=0$である。
    reason: $R=\mathbb{Z}$、$I=(2)$、$M=\mathbb{Z}/3\mathbb{Z}$とすると、$2$倍は全単射なのですべての$n$で$I^nM=M$であり、共通部分は$M\neq 0$である。$r=4\in I$について$rx=x$が成り立つ。
  target: |
    ∀ (R M : Type*) [CommRing R] [IsNoetherianRing R] [AddCommGroup M] [Module R M] [Module.Finite R M] (I : Ideal R) (x : M), (∀ n : ℕ, x ∈ I ^ n • (⊤ : Submodule R M)) ↔ ∃ r ∈ I, r • x = x
  proof: |
    by
      intro R M _ _ _ _ _ I x
      have h := Ideal.mem_iInf_smul_pow_eq_bot_iff I x
      rw [Submodule.mem_iInf] at h
      rw [h]
      constructor
      · rintro ⟨r, hr⟩; exact ⟨r, r.2, hr⟩
      · rintro ⟨r, hr, h⟩; exact ⟨⟨r, hr⟩, h⟩
- id: krull_intersection_jacobson_module
  kind: gap
  level: 4
  topic: 可換環論・クルルの交叉定理
  statement: $R$をネーター環、$I$をジャコブソン根基に含まれるイデアル、$M$を有限生成$R$加群とする。$\bigcap_nI^nM=0$である。とくにネーター局所環の真のイデアルで成り立つ。
  statement_en: If R is a Noetherian ring, I an ideal contained in the Jacobson radical and M a finitely generated R-module, then the intersection of the I^n M is zero. In particular this holds for proper ideals of a Noetherian local ring.
  assumptions:
  - $R$はネーター可換環
  - $I$はジャコブソン根基に含まれるイデアル
  - $M$は有限生成$R$加群
  quantifiers:
  - 任意のネーター環$R$、イデアル$I$、有限生成加群$M$
  conclusion: $\bigcap_nI^nM=0$である。
  answer: |
    $R$をネーター環、$I$をジャコブソン根基に含まれるイデアル、$M$を有限生成$R$加群とする。$x\in\bigcap_nI^nM$とする。クルルの交叉定理の一般形より、ある$r\in I$で$rx=x$である。$r$はジャコブソン根基に属するので$1-r$は単元であり、$(1-r)x=0$から$x=0$である。
  strategy: Apply the general intersection theorem and use that 1 - r is a unit.
  sketch:
  - 'setup: Let x lie in the intersection.'
  - 'apply_theorem: The general intersection theorem gives r in I with rx = x.'
  - 'derive: r lies in the Jacobson radical, so 1 - r is a unit.'
  - 'conclude: From (1 - r)x = 0, x = 0.'
  openmath: (forall (A V I) (-> (and (comm_ring A) (noetherian_ring A) (module_over V A) (finitely_generated_module A V) (ideal_of I A) (subset I (jacobson_radical A))) (forall (x) (-> (forall (n) (-> (in n N) (in x (ideal_smul_submodule (ideal_power I n) (whole_submodule V))))) (= x 0)))))
  hard_negative:
    statement: ジャコブソン根基に含まれるイデアル$I$について、有限生成でない加群$M$でも$\bigcap_nI^nM=0$である。
    reason: $R=\mathbb{Z}_{(2)}$、$I=(2)$、$M=\mathbb{Q}$とすると、$I$はジャコブソン根基に等しく、すべての$n$で$I^nM=\mathbb{Q}$である。共通部分は$\mathbb{Q}\neq 0$である。
  target: |
    ∀ (R M : Type*) [CommRing R] [IsNoetherianRing R] [AddCommGroup M] [Module R M] [Module.Finite R M] (I : Ideal R), I ≤ Ideal.jacobson ⊥ → (⨅ n : ℕ, I ^ n • (⊤ : Submodule R M)) = ⊥
  proof: |
    by
      intro R M _ _ _ _ _ I h
      exact Ideal.iInf_pow_smul_eq_bot_of_le_jacobson I h
- id: krull_intersection_domain
  kind: gap
  level: 4
  topic: 可換環論・クルルの交叉定理
  statement: $R$をネーター整域、$I$を真のイデアルとする。$\bigcap_nI^n=0$である。
  statement_en: If I is a proper ideal of a Noetherian integral domain, then the intersection of the powers of I is zero.
  assumptions:
  - $R$はネーター整域
  - $I$は真のイデアル
  quantifiers:
  - 任意のネーター整域$R$と真のイデアル$I$
  conclusion: $\bigcap_nI^n=0$である。
  answer: |
    $R$をネーター整域、$I$を真のイデアルとする。$x\in\bigcap_nI^n$とする。クルルの交叉定理の一般形を$M=R$に適用すると、ある$r\in I$で$rx=x$である。すなわち$(1-r)x=0$である。$I$は真のイデアルなので$1-r\neq 0$である（$1-r=0$なら$1=r\in I$となる）。$R$は整域なので$x=0$である。
  strategy: Apply the general intersection theorem with M = R and cancel 1 - r in the domain.
  sketch:
  - 'setup: Let x lie in the intersection of the powers of I.'
  - 'apply_theorem: The general intersection theorem gives r in I with rx = x.'
  - 'derive: 1 - r is nonzero because I is proper.'
  - 'conclude: Since R is a domain, x = 0.'
  openmath: (forall (A I) (-> (and (integral_domain A) (noetherian_ring A) (ideal_of I A) (!= I (unit_ideal A))) (= (ideal_family_inter (lambda (n) (ideal_power I n))) (zero_ideal A))))
  hard_negative:
    statement: ネーター環の真のイデアル$I$について、$\bigcap_nI^n=0$である。
    reason: $R=\mathbb{Z}/6\mathbb{Z}$、$I=(2)$とすると、$2^2=4$であり$(4)=(2)$なので、すべての$n\geq 1$で$I^n=(2)$である。共通部分は$(2)\neq 0$である。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] [IsDomain R] (I : Ideal R), I ≠ ⊤ → (⨅ n : ℕ, I ^ n) = ⊥
  proof: |
    by
      intro R _ _ _ I h
      exact Ideal.iInf_pow_eq_bot_of_isDomain I h
- id: adic_completion_exact
  kind: textbook
  level: 4
  topic: 可換環論・完備化の完全性
  statement: $R$をネーター環、$I$をイデアル、$0\to L\xrightarrow{f}M\xrightarrow{g}N\to 0$を有限生成$R$加群の完全列とする。$I$進完備化$0\to\hat L\to\hat M\to\hat N\to 0$は完全である。
  statement_en: Over a Noetherian ring R with ideal I, the I-adic completion of a short exact sequence of finitely generated R-modules is exact.
  assumptions:
  - $R$はネーター可換環
  - $I$はイデアル
  - $0\to L\to M\to N\to 0$は有限生成$R$加群の完全列
  quantifiers:
  - 任意のネーター環$R$、イデアル$I$、有限生成加群の完全列
  conclusion: $0\to\hat L\to\hat M\to\hat N\to 0$は完全である。
  answer: |
    $R$をネーター環、$I$をイデアル、$0\to L\xrightarrow{f}M\xrightarrow{g}N\to 0$を有限生成加群の完全列とし、$L\subseteq M$とみなす。$L_n=L\cap I^nM$とおく。$g$は全射なので$g(I^nM)=I^nN$であり、$0\to L/L_n\to M/I^nM\to N/I^nN\to 0$は完全である。
    逆極限をとる。$(y_n)\in\varprojlim N/I^nN$を持ち上げる。$y_n$の持ち上げ$x_n$があるとき、$y_{n+1}$の持ち上げ$x'$をとると、$x'-x_n$の$M/I^nM$での像は$L/L_n$から来る。$L/L_{n+1}\to L/L_n$は全射なので、$x'$を修正して$x_n$と両立させられる。よって全射性が成り立つ。$\varprojlim L/L_n\to\varprojlim M/I^nM$の単射性と中央の完全性は、各段の完全性からすぐに従う。したがって$0\to\varprojlim L/L_n\to\hat M\to\hat N\to 0$は完全である。
    最後に$\varprojlim L/L_n=\hat L$を示す。$I^nL\subseteq L_n$である。アルティン・リースの補題より、ある$k$で$n\geq k$なら$L_n=I^{n-k}L_k\subseteq I^{n-k}L$である。よって$(L_n)$と$(I^nL)$は互いに相手を含むので、同じ逆極限を与える。
  strategy: Take inverse limits of the exact sequences modulo I^n, and use Artin-Rees to compare the induced and I-adic filtrations on L.
  sketch:
  - 'setup: Let L_n = L ∩ I^n M, so 0 → L/L_n → M/I^n M → N/I^n N → 0 is exact.'
  - 'derive: Surjectivity of L/L_(n+1) → L/L_n allows inductive lifting of compatible sequences.'
  - 'derive: The inverse limit sequence is exact.'
  - 'apply_theorem: Artin-Rees gives L_n ⊆ I^(n-k) L for n ≥ k.'
  - 'derive: The filtrations (L_n) and (I^n L) define the same limit.'
  - 'conclude: So the completed sequence is exact.'
  openmath: (forall (A L V W I f g) (-> (and (comm_ring A) (noetherian_ring A) (module_over L A) (module_over V A) (module_over W A) (finitely_generated_module A L) (finitely_generated_module A V) (finitely_generated_module A W) (ideal_of I A) (module_hom f A L V) (module_hom g A V W) (injective f) (exact_pair f g) (surjective g)) (and (injective (adic_completion_map I f)) (exact_pair (adic_completion_map I f) (adic_completion_map I g)) (surjective (adic_completion_map I g)))))
  hard_negative:
    statement: ネーター環上の加群の完全列なら、有限生成でなくても$I$進完備化は完全である。
    reason: $p$を素数、$R=\mathbb{Z}$、$I=(p)$とし、$L=M=\bigoplus_{n\geq 1}\mathbb{Z}$、$f$を第$n$成分の$p^n$倍、$N=\bigoplus_n\mathbb{Z}/p^n\mathbb{Z}$とする。$\hat M$の元$(p^n)_n$の$\hat N$での像は$0$である。その唯一の持ち上げ候補$(1,1,\dots)$は$p$進的に$0$へ収束しないので$\hat L$に属さない。よって中央で完全でない。
  target: |
    ∀ (R L M N : Type) [CommRing R] [IsNoetherianRing R] [AddCommGroup L] [Module R L] [Module.Finite R L] [AddCommGroup M] [Module R M] [Module.Finite R M] [AddCommGroup N] [Module R N] [Module.Finite R N] (I : Ideal R) (f : L →ₗ[R] M) (g : M →ₗ[R] N), Function.Injective f → Function.Exact f g → Function.Surjective g → Function.Injective (AdicCompletion.map I f) ∧ Function.Exact (AdicCompletion.map I f) (AdicCompletion.map I g) ∧ Function.Surjective (AdicCompletion.map I g)
  proof: |
    by
      intro R L M N _ _ _ _ _ _ _ _ _ _ _ I f g hf hfg hg
      exact ⟨AdicCompletion.map_injective I hf, AdicCompletion.map_exact hf hfg hg, AdicCompletion.map_surjective I hg⟩
- id: adic_complete_is_henselian
  kind: named
  level: 4
  topic: 可換環論・ヘンゼルの補題
  statement: （ヘンゼルの補題）$R$を$I$進完備かつ分離な可換環、$f\in R[X]$をモニック多項式、$a\in R$とし、$f(a)\in I$かつ$f'(a)$が$R/I$で単元であるとする。このとき$f(b)=0$かつ$b-a\in I$となる$b\in R$が存在する。
  statement_en: Hensel's lemma. Let R be complete and separated for the I-adic topology, f a monic polynomial over R and a in R with f(a) in I and f'(a) a unit modulo I. Then there is a root b of f with b - a in I.
  assumptions:
  - $R$は$I$進完備かつ分離な可換環
  - $f\in R[X]$はモニック
  - $f(a)\in I$
  - $f'(a)$は$R/I$で単元
  quantifiers:
  - 任意の$R,I,f,a$
  conclusion: $f(b)=0$、$b-a\in I$となる$b$が存在する。
  answer: |
    $R$を$I$進完備かつ分離な可換環、$f\in R[X]$をモニック多項式、$a\in R$とし、$f(a)\in I$、$f'(a)$は$R/I$で単元とする。完備性より$I$はジャコブソン根基に含まれる（$r\in I$なら級数$\sum_{n\geq 0}r^n$が収束して$1-r$の逆元となるからである）。$c\equiv a\pmod I$なら$f'(c)\equiv f'(a)\pmod I$は$R/I$で単元であり、$I$がジャコブソン根基に含まれるので$f'(c)$は$R$の単元である。
    $c_0=a$、$c_{n+1}=c_n-f(c_n)f'(c_n)^{-1}$と定める。$c_n\equiv a\pmod I$かつ$f(c_n)\in I^{2^n}$を帰納法で示す。$n=0$は仮定である。テイラー展開より$f(x+h)=f(x)+f'(x)h+h^2g(x,h)$（$g\in R[x,h]$）と書ける。$h=-f(c_n)f'(c_n)^{-1}\in I^{2^n}$とすると、$c_{n+1}=c_n+h\equiv a$であり、$f(c_{n+1})=h^2g(c_n,h)\in I^{2^{n+1}}$である。
    $c_{n+1}-c_n\in I^{2^n}$なので$(c_n)$はコーシー列であり、完備性より極限$b$がある。$b\equiv c_n\pmod{I^{2^n}}$である。$b-a\in I$であり、$f(b)\equiv f(c_n)\equiv 0\pmod{I^{2^n}}$がすべての$n$で成り立つ。分離性より$f(b)=0$である。
  strategy: Run Newton's iteration and use completeness to take the limit.
  sketch:
  - 'derive: I lies in the Jacobson radical, so f''(c) is a unit whenever c ≡ a modulo I.'
  - 'construct: Define c_(n+1) = c_n - f(c_n)/f''(c_n).'
  - 'induction: The Taylor expansion gives f(c_n) in I^(2^n) and c_n ≡ a modulo I.'
  - 'apply_theorem: The Cauchy sequence c_n has a limit b by completeness.'
  - 'conclude: f(b) lies in every power of I, so f(b) = 0 by separatedness, and b - a lies in I.'
  openmath: (forall (A I f a) (-> (and (comm_ring A) (ideal_of I A) (adic_complete I A) (polynomial_over f A) (monic_polynomial f) (in a A) (in (poly_eval f a) I) (unit_element (residue_class (poly_eval (poly_derivative f) a) I) (quotient_ring A I))) (exists (b) (and (in b A) (= (poly_eval f b) 0) (in (- b a) I)))))
  hard_negative:
    statement: 完備でない可換環$R$でも、$f(a)\in I$かつ$f'(a)$が$R/I$で単元なら、$f$は$a$の近くに根をもつ。
    reason: $R=\mathbb{Z}$、$I=(7)$、$f=X^2-2$、$a=3$とすると、$f(3)=7\in I$、$f'(3)=6$は$\mathbb{Z}/7\mathbb{Z}$で単元である。しかし$f$は$\mathbb{Z}$に根をもたない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R) [IsAdicComplete I R] (f : Polynomial R) (a : R), f.Monic → f.eval a ∈ I → IsUnit (Ideal.Quotient.mk I (f.derivative.eval a)) → ∃ b : R, f.IsRoot b ∧ b - a ∈ I
  proof: |
    by
      intro R _ I _ f a hf h1 h2
      exact HenselianRing.is_henselian f hf a h1 h2
- id: krull_height_theorem
  kind: named
  level: 4
  topic: 可換環論・クルルの標高定理
  statement: （クルルの標高定理）$R$をネーター環、$s\subseteq R$を有限集合、$\mathfrak{p}$を$(s)$上の極小素イデアルとする。このとき$\mathfrak{p}$の高さは$s$の元の個数以下である。$s$が1元の場合はクルルの単項イデアル定理である。
  statement_en: Krull's height theorem. If R is a Noetherian ring, s a finite subset and p a prime minimal over the ideal (s), then the height of p is at most the number of elements of s. The case of one element is Krull's principal ideal theorem.
  assumptions:
  - $R$はネーター可換環
  - $s\subseteq R$は有限集合
  - $\mathfrak{p}$は$(s)$上の極小素イデアル
  quantifiers:
  - 任意のネーター環$R$、有限集合$s$、極小素イデアル$\mathfrak{p}$
  conclusion: $\operatorname{ht}\mathfrak{p}\leq|s|$である。
  answer: |
    $R$をネーター環、$s\subseteq R$を有限集合、$\mathfrak{p}$を$(s)$上の極小素イデアルとする。$s$の元の個数$n$についての帰納法で示す。$n=0$なら$\mathfrak{p}$は$0$上の極小素イデアルなので高さ$0$である。$n=1$は単項イデアル定理である。$n\geq 2$とし、$s=\{x_1,\dots,x_n\}$とする。$R_{\mathfrak{p}}$に移って、$R$は$\mathfrak{p}$を極大イデアルとする局所環としてよい。
    $\mathfrak{q}\subsetneq\mathfrak{p}$を素イデアルで、間に素イデアルがないものとする。ネーター性より、$\mathfrak{p}$に真に含まれる任意の素イデアルはそのような$\mathfrak{q}$に含まれる。$\operatorname{ht}\mathfrak{q}\leq n-1$を示せば、$\operatorname{ht}\mathfrak{p}\leq n$である。
    $\mathfrak{p}$は$(s)$上極小なので、$s\not\subseteq\mathfrak{q}$である。番号を付け替えて$x_n\notin\mathfrak{q}$とする。$\mathfrak{p}$は$\mathfrak{q}+(x_n)$上極小なので、$\mathfrak{p}$は$\mathfrak{q}+(x_n)$の根基である。よって$i<n$について$x_i^m=y_i+a_ix_n$（$y_i\in\mathfrak{q}$、$a_i\in R$）と書ける。
    $J=(y_1,\dots,y_{n-1})\subseteq\mathfrak{q}$とおく。$x_i$は$J+(x_n)$の根基に属するので、$\mathfrak{p}$は$J+(x_n)$上極小である。$R/J$で単項イデアル定理を使うと、$\mathfrak{p}/J$の高さは$1$以下である。$\mathfrak{q}/J\subsetneq\mathfrak{p}/J$より$\mathfrak{q}/J$の高さは$0$であり、$\mathfrak{q}$は$J$上極小である。帰納法の仮定より$\operatorname{ht}\mathfrak{q}\leq n-1$である。
  strategy: Induct on the number of generators, replacing generators by elements of a prime just below p and applying the principal ideal theorem in a quotient.
  sketch:
  - 'setup: Induct on n and localize so that p is the maximal ideal.'
  - 'setup: Take a prime q just below p; it suffices to bound ht q by n - 1.'
  - 'derive: Some x_n is outside q, so p is the radical of q + (x_n).'
  - 'construct: Write x_i^m = y_i + a_i x_n with y_i in q, and let J = (y_1, ..., y_(n-1)).'
  - 'apply_theorem: p/J is minimal over a principal ideal, so its height is at most 1.'
  - 'derive: Thus q is minimal over J.'
  - 'conclude: The induction hypothesis gives ht q ≤ n - 1, so ht p ≤ n.'
  openmath: (forall (A s p) (-> (and (comm_ring A) (noetherian_ring A) (finite_set s) (subset s A) (minimal_prime_over p (ideal_generated_by s))) (<= (ideal_height p) (size s))))
  hard_negative:
    statement: ネーター環の素イデアル$\mathfrak{p}$が$n$個の元で生成されるなら、$\operatorname{ht}\mathfrak{p}=n$である。
    reason: 体$k$上の$k[x]$で$\mathfrak{p}=(x)$は$\{x,x^2+x\}$でも生成されるが、高さは$1$である。成り立つのは不等式である。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] (s : Finset R) (P : Ideal R), P ∈ (Ideal.span (s : Set R)).minimalPrimes → P.height ≤ s.card
  proof: |
    by
      intro R _ _ s P h
      exact Ideal.height_le_card_of_mem_minimalPrimes_span_finset h
- id: height_realized_by_minimal_over_generators
  kind: textbook
  level: 4
  topic: 可換環論・高さと生成元
  statement: $R$をネーター環、$\mathfrak{p}$を素イデアルとする。有限集合$s\subseteq R$で、$\mathfrak{p}$が$(s)$上極小で、$s$の元の個数が$\operatorname{ht}\mathfrak{p}$に等しいものが存在する。これはクルルの標高定理の逆である。
  statement_en: For a prime p of a Noetherian ring there is a finite subset s such that p is minimal over (s) and the number of elements of s equals the height of p. This is the converse of Krull's height theorem.
  assumptions:
  - $R$はネーター可換環
  - $\mathfrak{p}$は素イデアル
  quantifiers:
  - 任意のネーター環$R$と素イデアル$\mathfrak{p}$
  conclusion: $\mathfrak{p}$が$(s)$上極小で$|s|=\operatorname{ht}\mathfrak{p}$となる$s$が存在する。
  answer: |
    $R$をネーター環、$\mathfrak{p}$を素イデアル、$h=\operatorname{ht}\mathfrak{p}$とする。$h$はクルルの標高定理より有限である。互いに異なる$a_1,\dots,a_i\in\mathfrak{p}$（$0\leq i\leq h$）を、$(a_1,\dots,a_i)$上の極小素イデアルの高さがすべて$i$以上となるように帰納的に選ぶ。$i=0$では高さは$0$以上なので成り立つ。
    $i<h$とし、$a_1,\dots,a_i$が選べたとする。$(a_1,\dots,a_i)\subseteq\mathfrak{p}$は真のイデアルなので、その上の極小素イデアルは存在し、有限個である。クルルの標高定理より、それらの高さはちょうど$i$である。それらを$\mathfrak{q}_1,\dots,\mathfrak{q}_t$（$t\geq 1$）とする。$\operatorname{ht}\mathfrak{q}_j=i<h$なので$\mathfrak{p}\not\subseteq\mathfrak{q}_j$である。素イデアル回避より、$a_{i+1}\in\mathfrak{p}\setminus\bigcup_j\mathfrak{q}_j$をとれる。$\mathfrak{r}$を$(a_1,\dots,a_{i+1})$上の極小素イデアルとする。$\mathfrak{r}$は$(a_1,\dots,a_i)$上の極小素イデアル$\mathfrak{q}_j$を含む。$a_{i+1}\notin\mathfrak{q}_j$なので$\mathfrak{q}_j\subsetneq\mathfrak{r}$であり、$\operatorname{ht}\mathfrak{r}\geq i+1$である。また$a_{i+1}\notin\mathfrak{q}_1$と$a_1,\dots,a_i\in\mathfrak{q}_1$より、$a_{i+1}$は$a_1,\dots,a_i$と異なる。
    $s=\{a_1,\dots,a_h\}$とする。$\mathfrak{p}$は$(s)$を含むので、$(s)$上の極小素イデアル$\mathfrak{r}\subseteq\mathfrak{p}$がある。$\operatorname{ht}\mathfrak{r}\geq h=\operatorname{ht}\mathfrak{p}$と$\mathfrak{r}\subseteq\mathfrak{p}$より$\mathfrak{r}=\mathfrak{p}$である。
  strategy: Choose elements of p inductively by prime avoidance so that minimal primes over the partial ideals have growing height.
  sketch:
  - 'setup: Let h be the height of p, finite by Krull''s height theorem.'
  - 'induction: Assume a_1, ..., a_i chosen so that minimal primes over them have height at least i.'
  - 'apply_theorem: Prime avoidance gives a_(i+1) in p outside the minimal primes of height exactly i.'
  - 'derive: Minimal primes over (a_1, ..., a_(i+1)) then have height at least i + 1.'
  - 'derive: For s = {a_1, ..., a_h}, a minimal prime over (s) inside p has height at least h.'
  - 'conclude: It equals p, so p is minimal over (s).'
  openmath: (forall (A p) (-> (and (comm_ring A) (noetherian_ring A) (prime_ideal p A)) (exists (s) (and (finite_set s) (subset s A) (minimal_prime_over p (ideal_generated_by s)) (= (size s) (ideal_height p))))))
  hard_negative:
    statement: ネーター環の素イデアル$\mathfrak{p}$は、$\operatorname{ht}\mathfrak{p}$個の元で生成される。
    reason: $R=\mathbb{Z}[\sqrt{-5}]$の素イデアル$\mathfrak{p}=(2,1+\sqrt{-5})$は高さ$1$であるが単項でない。$\mathfrak{p}$が極小となるイデアルは$\operatorname{ht}\mathfrak{p}$個の元で生成できるが、$\mathfrak{p}$自身をその個数で生成できるとは限らない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] (P : Ideal R) [P.IsPrime], ∃ s : Finset R, P ∈ (Ideal.span (s : Set R)).minimalPrimes ∧ (s.card : ℕ∞) = P.height
  proof: |
    by
      intro R _ _ P _
      exact Ideal.exists_finset_card_eq_height_of_isNoetherianRing P
- id: local_dim_eq_height_maximal
  kind: gap
  level: 4
  topic: 可換環論・高さと次元
  statement: $R$を局所環、$\mathfrak{m}$を極大イデアルとする。$\dim R=\operatorname{ht}\mathfrak{m}$である。
  statement_en: For a local ring R with maximal ideal m, the Krull dimension of R equals the height of m.
  assumptions:
  - $R$は局所環
  - $\mathfrak{m}$は極大イデアル
  quantifiers:
  - 任意の局所環$R$
  conclusion: $\dim R=\operatorname{ht}\mathfrak{m}$である。
  answer: |
    $R$を局所環、$\mathfrak{m}$を極大イデアルとする。$\mathfrak{p}_0\subsetneq\dots\subsetneq\mathfrak{p}_n$を素イデアルの鎖とする。$\mathfrak{p}_n$は真のイデアルなので$\mathfrak{p}_n\subseteq\mathfrak{m}$である。$\mathfrak{p}_n\neq\mathfrak{m}$なら$\mathfrak{m}$を付け加えて長さを伸ばせる。よって鎖の長さの上限は、$\mathfrak{m}$で終わる鎖の長さの上限に等しい。前者は$\dim R$、後者は$\operatorname{ht}\mathfrak{m}$である。
  strategy: Every chain of primes can be extended to end at the maximal ideal.
  sketch:
  - 'setup: Take a chain of primes in R.'
  - 'derive: Its top lies in m, so the chain can be extended to end at m.'
  - 'conclude: So the supremum of lengths of chains equals the supremum for chains ending at m.'
  openmath: (forall (A) (-> (and (comm_ring A) (local_ring A)) (= (ideal_height (unique_maximal_ideal A)) (ring_krull_dim A))))
  hard_negative:
    statement: 可換環$R$のすべての極大イデアル$\mathfrak{m}$で$\operatorname{ht}\mathfrak{m}=\dim R$である。
    reason: 体$k$について$R=k\times k[x]$とする。$\mathfrak{m}=0\times k[x]$は極大イデアルで、これに真に含まれる素イデアルはないので高さ$0$である。一方$\dim R=1$である。
  target: |
    ∀ (R : Type*) [CommRing R] [IsLocalRing R], ((IsLocalRing.maximalIdeal R).height : WithBot ℕ∞) = ringKrullDim R
  proof: |
    by
      intro R _ _
      exact IsLocalRing.maximalIdeal_height_eq_ringKrullDim
- id: localization_dim_eq_height
  kind: gap
  level: 4
  topic: 可換環論・高さと次元
  statement: $R$を可換環、$\mathfrak{p}$を素イデアル、$A=R_{\mathfrak{p}}$を局所化とする。$\dim A=\operatorname{ht}\mathfrak{p}$である。
  statement_en: For a prime ideal p of a commutative ring R, the Krull dimension of the localization R_p equals the height of p.
  assumptions:
  - $R$は可換環
  - $\mathfrak{p}$は素イデアル
  - $A=R_{\mathfrak{p}}$
  quantifiers:
  - 任意の可換環$R$と素イデアル$\mathfrak{p}$
  conclusion: $\dim R_{\mathfrak{p}}=\operatorname{ht}\mathfrak{p}$である。
  answer: |
    $R$を可換環、$\mathfrak{p}$を素イデアルとする。$R_{\mathfrak{p}}$の素イデアルは、縮約により$\mathfrak{p}$に含まれる$R$の素イデアルと1対1に対応し、この対応は包含を保つ。よって$R_{\mathfrak{p}}$の素イデアルの鎖は、$\mathfrak{p}$に含まれる$R$の素イデアルの鎖と同じ長さで対応する。後者の長さの上限は$\operatorname{ht}\mathfrak{p}$である。
  strategy: Use the order-preserving correspondence between primes of R_p and primes contained in p.
  sketch:
  - 'apply_theorem: Primes of R_p correspond to primes of R contained in p, preserving inclusions.'
  - 'derive: Chains correspond with the same length.'
  - 'conclude: dim R_p is the supremum of lengths of chains ending inside p, which is ht p.'
  openmath: (forall (A B p) (-> (and (comm_ring A) (comm_ring B) (prime_ideal p A) (localization_at_prime B A p)) (= (ring_krull_dim B) (ideal_height p))))
  hard_negative:
    statement: 可換環の素イデアル$\mathfrak{p}$について、$\dim R_{\mathfrak{p}}=\dim R$である。
    reason: $R=\mathbb{Z}$、$\mathfrak{p}=(0)$とすると、$R_{\mathfrak{p}}=\mathbb{Q}$の次元は$0$であるが、$\dim\mathbb{Z}=1$である。
  target: |
    ∀ (R A : Type*) [CommRing R] (P : Ideal R) [P.IsPrime] [CommRing A] [Algebra R A] [IsLocalization.AtPrime A P], ringKrullDim A = P.height
  proof: |
    by
      intro R A _ P _ _ _ _
      exact IsLocalization.AtPrime.ringKrullDim_eq_height P A
- id: height_plus_dim_quotient_le_dim
  kind: gap
  level: 4
  topic: 可換環論・高さと次元
  statement: $R$を可換環、$\mathfrak{p}$を素イデアルとする。$\operatorname{ht}\mathfrak{p}+\dim R/\mathfrak{p}\leq\dim R$である。
  statement_en: For a prime ideal p of a commutative ring R, the height of p plus the dimension of R/p is at most the dimension of R.
  assumptions:
  - $R$は可換環
  - $\mathfrak{p}$は素イデアル
  quantifiers:
  - 任意の可換環$R$と素イデアル$\mathfrak{p}$
  conclusion: $\operatorname{ht}\mathfrak{p}+\dim R/\mathfrak{p}\leq\dim R$である。
  answer: |
    $R$を可換環、$\mathfrak{p}$を素イデアルとする。$\mathfrak{q}_0\subsetneq\dots\subsetneq\mathfrak{q}_h=\mathfrak{p}$を素イデアルの鎖とし、$R/\mathfrak{p}$の素イデアルの鎖$\mathfrak{r}_0\subsetneq\dots\subsetneq\mathfrak{r}_d$をとる。$R/\mathfrak{p}$の素イデアルは$\mathfrak{p}$を含む$R$の素イデアルに対応する。$R/\mathfrak{p}$は整域なので$0$は素イデアルであり、$\mathfrak{r}_0\neq 0$なら$0$を付け足すと鎖は長くなる。よって$\mathfrak{r}_0=0$としてよい。$\mathfrak{r}_i$に対応する$R$の素イデアルを$\mathfrak{s}_i$とおくと、$\mathfrak{s}_0=\mathfrak{p}$である。
    よって$\mathfrak{q}_0\subsetneq\dots\subsetneq\mathfrak{q}_h=\mathfrak{p}=\mathfrak{s}_0\subsetneq\dots\subsetneq\mathfrak{s}_d$は長さ$h+d$の鎖である。したがって$h+d\leq\dim R$である。上限をとって主張を得る。
  strategy: Concatenate a chain ending at p with a chain starting at p.
  sketch:
  - 'setup: Take a chain of primes ending at p of length h and a chain of primes of R/p of length d.'
  - 'derive: Primes of R/p correspond to primes of R containing p, and the chain can be taken to start at p.'
  - 'derive: Concatenating gives a chain of length h + d in R.'
  - 'conclude: Taking suprema gives the inequality.'
  openmath: (forall (A p) (-> (and (comm_ring A) (prime_ideal p A)) (<= (+ (ideal_height p) (ring_krull_dim (quotient_ring A p))) (ring_krull_dim A))))
  hard_negative:
    statement: ネーター環の素イデアル$\mathfrak{p}$について、$\operatorname{ht}\mathfrak{p}+\dim R/\mathfrak{p}=\dim R$である。
    reason: 体$k$上の$R=k[x,y,z]/(xz,yz)$は平面$V(z)$と直線$V(x,y)$の和で、$\dim R=2$である。直線上の点に対応する$\mathfrak{p}=(x,y,z-1)$は高さ$1$で$\dim R/\mathfrak{p}=0$なので、和は$1$である。
  target: |
    ∀ (R : Type*) [CommRing R] (P : Ideal R) [P.IsPrime], (P.height : WithBot ℕ∞) + ringKrullDim (R ⧸ P) ≤ ringKrullDim R
  proof: |
    by
      intro R _ P _
      let x : PrimeSpectrum R := ⟨P, inferInstance⟩
      have hne : Nonempty (PrimeSpectrum R) := ⟨x⟩
      have hq : ringKrullDim (R ⧸ P) = (Order.coheight x : WithBot ℕ∞) := by
        rw [ringKrullDim_quotient, Order.coheight_eq_krullDim_Ici]
        rfl
      have hh : P.height = Order.height x := PrimeSpectrum.height_eq_orderHeight x
      have hk : ringKrullDim R = ((⨆ a : PrimeSpectrum R, Order.height a + Order.coheight a : ℕ∞) : WithBot ℕ∞) :=
        Order.krullDim_eq_iSup_height_add_coheight_of_nonempty
      rw [hq, hh, hk, ← WithBot.coe_add]
      exact WithBot.coe_le_coe.2 (le_iSup (fun a : PrimeSpectrum R => Order.height a + Order.coheight a) x)
- id: local_dim_le_number_of_generators
  kind: gap
  level: 4
  topic: 可換環論・高さと次元
  statement: $R$をネーター局所環、$\mathfrak{m}$を極大イデアルとし、有限集合$s$で$\mathfrak{m}=(s)$とする。$\dim R\leq|s|$である。とくにネーター局所環の次元は有限である。
  statement_en: If R is a Noetherian local ring whose maximal ideal is generated by a finite set s, then dim R is at most the number of elements of s. In particular a Noetherian local ring has finite dimension.
  assumptions:
  - $R$はネーター局所環
  - $\mathfrak{m}=(s)$、$s$は有限集合
  quantifiers:
  - 任意のネーター局所環$R$と生成系$s$
  conclusion: $\dim R\leq|s|$である。
  answer: |
    $R$をネーター局所環、$\mathfrak{m}=(s)$を極大イデアルとする。局所環の次元は$\operatorname{ht}\mathfrak{m}$に等しい。$\mathfrak{m}$は素イデアルで$\mathfrak{m}=(s)$なので、$(s)$上の極小素イデアルである。クルルの標高定理より$\operatorname{ht}\mathfrak{m}\leq|s|$である。よって$\dim R\leq|s|$である。$R$はネーター環なので$\mathfrak{m}$は有限生成であり、次元は有限である。
  strategy: The dimension is the height of m, which Krull's height theorem bounds by the number of generators.
  sketch:
  - 'apply_theorem: In a local ring, dim R = ht m.'
  - 'derive: m is trivially minimal over (s) = m.'
  - 'apply_theorem: Krull''s height theorem gives ht m ≤ |s|.'
  - 'conclude: So dim R ≤ |s|.'
  openmath: (forall (A s) (-> (and (comm_ring A) (noetherian_ring A) (local_ring A) (finite_set s) (subset s A) (= (ideal_generated_by s) (unique_maximal_ideal A))) (<= (ring_krull_dim A) (size s))))
  hard_negative:
    statement: ネーター局所環の次元は、極大イデアルの生成元の最小個数に等しい。
    reason: 体$k$上の$R=k[x]/(x^2)$では、極大イデアルは$(x)$で1個の元が必要であるが、$\dim R=0$である。等号が成り立つのは正則局所環である。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] [IsLocalRing R] (s : Finset R), Ideal.span (s : Set R) = IsLocalRing.maximalIdeal R → ringKrullDim R ≤ s.card
  proof: |
    by
      intro R _ _ _ s hs
      rw [← IsLocalRing.maximalIdeal_height_eq_ringKrullDim]
      have h : IsLocalRing.maximalIdeal R ∈ (Ideal.span (s : Set R)).minimalPrimes := by
        rw [hs, Ideal.minimalPrimes_eq_subsingleton_self]
        rfl
      exact_mod_cast Ideal.height_le_card_of_mem_minimalPrimes_span_finset h
- id: height_principal_nonzerodivisor_eq_one
  kind: gap
  level: 4
  topic: 可換環論・高さと次元
  statement: $R$をネーター環、$x\in R$を単元でない非零因子とする。イデアル$(x)$の高さ（$(x)$上の極小素イデアルの高さの最小値）は$1$である。
  statement_en: If x is a nonunit nonzerodivisor of a Noetherian ring, then the height of the ideal (x), the least height of a prime minimal over (x), equals 1.
  assumptions:
  - $R$はネーター可換環
  - $x$は非零因子
  - $x$は単元でない
  quantifiers:
  - 任意のネーター環$R$と元$x$
  conclusion: $\operatorname{ht}(x)=1$である。
  answer: |
    $R$をネーター環、$x$を単元でない非零因子とする。$x$は単元でないので、$(x)$上の極小素イデアルが存在する。クルルの単項イデアル定理より、その高さはすべて$1$以下である。よって$\operatorname{ht}(x)\leq 1$である。
    $\mathfrak{p}$を$(x)$上の極小素イデアルとする。$\operatorname{ht}\mathfrak{p}=0$なら$\mathfrak{p}$は$R$の極小素イデアルであり、極小素イデアルの元は零因子である。これは$x\in\mathfrak{p}$が非零因子であることに反する。よって$\operatorname{ht}\mathfrak{p}\geq 1$であり、$\operatorname{ht}(x)=1$である。
  strategy: The principal ideal theorem gives the upper bound and a nonzerodivisor avoids minimal primes.
  sketch:
  - 'apply_theorem: Primes minimal over (x) exist and have height at most 1.'
  - 'setup: Suppose such a prime p has height 0.'
  - 'derive: Then p is a minimal prime of R, whose elements are zero divisors.'
  - 'contradiction: x is a nonzerodivisor in p.'
  - 'conclude: So every such prime has height exactly 1.'
  openmath: (forall (A x) (-> (and (comm_ring A) (noetherian_ring A) (in x A) (not (unit_element x A)) (forall (y) (-> (and (in y A) (= (* x y) 0)) (= y 0)))) (= (ideal_height (principal_ideal x)) 1)))
  hard_negative:
    statement: ネーター環の単元でない元$x$について、$\operatorname{ht}(x)=1$である。
    reason: 体$k$上の$R=k[x,y]/(xy)$で元$x$を考える。$(x)$は極小素イデアルなので、その高さは$0$である。$xy=0$で$y\neq 0$なので$x$は零因子である。非零因子の仮定が要る。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] (x : R), x ∈ nonZeroDivisors R → ¬ IsUnit x → (Ideal.span {x}).height = 1
  proof: |
    by
      intro R _ _ x h1 h2
      exact Ideal.height_span_singleton_eq_one_of_mem_nonZeroDivisors h1 h2
- id: dim_polynomial_ring_noetherian
  kind: textbook
  level: 4
  topic: 可換環論・多項式環の次元
  statement: $R$をネーター環とする。$\dim R[X]=\dim R+1$である。ただし零環の次元は$-\infty$とする。
  statement_en: For a Noetherian commutative ring R, the Krull dimension of R[X] equals dim R + 1, the zero ring having dimension minus infinity.
  assumptions:
  - $R$はネーター可換環
  - 零環の次元は$-\infty$
  quantifiers:
  - 任意のネーター環$R$
  conclusion: $\dim R[X]=\dim R+1$である。
  answer: |
    $R$をネーター環とする。零環なら両辺とも$-\infty$なので、零環でないとする。$\mathfrak{p}_0\subsetneq\dots\subsetneq\mathfrak{p}_d$を$R$の素イデアルの鎖とすると、$\mathfrak{p}_0R[X]\subsetneq\dots\subsetneq\mathfrak{p}_dR[X]\subsetneq\mathfrak{p}_dR[X]+(X)$は$R[X]$の素イデアルの鎖である。よって$\dim R[X]\geq\dim R+1$である。
    逆を示す。$\mathfrak{P}$を$R[X]$の素イデアル、$\mathfrak{p}=\mathfrak{P}\cap R$、$h=\operatorname{ht}\mathfrak{p}$とする。$\operatorname{ht}\mathfrak{P}\leq h+1$を示せば十分である。標高定理の逆より、$\mathfrak{p}$が$(x_1,\dots,x_h)$上極小となる$x_i\in\mathfrak{p}$がある。$R_{\mathfrak{p}}$では$(x_1,\dots,x_h)$の根基は$\mathfrak{p}R_{\mathfrak{p}}$である。$k=R_{\mathfrak{p}}/\mathfrak{p}R_{\mathfrak{p}}$とおくと、$\mathfrak{P}$の$R_{\mathfrak{p}}[X]$での像を$k[X]$へ送ったものは$0$または$(\bar f)$（$f\in\mathfrak{P}$）である。$k[X]$は単項イデアル整域だからである。
    よって$R_{\mathfrak{p}}[X]$で$\mathfrak{P}$は$(x_1,\dots,x_h)$または$(x_1,\dots,x_h,f)$上の極小素イデアルである。$R_{\mathfrak{p}}[X]$はヒルベルトの基底定理によりネーター環で、$\mathfrak{P}$の高さは局所化で変わらない。クルルの標高定理より$\operatorname{ht}\mathfrak{P}\leq h+1\leq\dim R+1$である。
  strategy: Lift chains for the lower bound; for the upper bound, express a prime of R[X] as minimal over h + 1 elements after localizing at its contraction.
  sketch:
  - 'construct: A chain in R of length d gives a chain in R[X] of length d + 1.'
  - 'setup: Let P be a prime of R[X] with contraction p of height h.'
  - 'apply_theorem: p is minimal over h elements x_1, ..., x_h.'
  - 'derive: Modulo p the prime P becomes 0 or a principal ideal (f̄) in the PID k[X].'
  - 'apply_theorem: So P is minimal over at most h + 1 elements of the Noetherian ring R_p[X], and Krull''s height theorem applies.'
  - 'conclude: ht P ≤ h + 1 ≤ dim R + 1.'
  openmath: (forall (A) (-> (and (comm_ring A) (noetherian_ring A)) (= (ring_krull_dim (polynomial_ring A)) (+ (ring_krull_dim A) 1))))
  hard_negative:
    statement: 任意の可換環$R$について$\dim R[X]=\dim R+1$である。
    reason: 体$k$上の$V=k(t)[[x]]$、$\mathfrak{M}=xV$、$R=k+\mathfrak{M}$とする。$R$は$\mathfrak{M}$を極大イデアルとする局所環である。$0$でない$f\in\mathfrak{M}$と$m\in\mathfrak{M}$について、$m$の十分大きな冪は$fR$に入るので、素イデアルは$0,\mathfrak{M}$だけであり、$\dim R=1$である。$R[X]\subseteq V[X]$で$Q=(X-t)V[X]\cap R[X]$とおく。$Q$は素イデアルで、$x(X-t)\in Q$なので$0$でない。$g\in Q$の係数を$c_i+m_i$（$c_i\in k$、$m_i\in\mathfrak{M}$）と書くと、$g(t)=0$を$x=0$で見て$\sum_ic_it^i=0$となり、$t$は$k$上超越的なのですべての$c_i$は$0$である。よって$Q\subseteq\mathfrak{M}[X]$であり、$x\notin Q$より包含は真である。$0\subsetneq Q\subsetneq\mathfrak{M}[X]\subsetneq\mathfrak{M}[X]+(X)$は長さ$3$の鎖なので、$\dim R[X]\geq 3>\dim R+1$である。ネーター性が要る。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R], ringKrullDim (Polynomial R) = ringKrullDim R + 1
  proof: |
    by
      intro R _ _
      exact Polynomial.ringKrullDim_of_isNoetherianRing
- id: dim_mv_polynomial_over_field
  kind: gap
  level: 4
  topic: 可換環論・多項式環の次元
  statement: $k$を体、$n$を自然数とする。多項式環$k[x_1,\dots,x_n]$のクルル次元は$n$である。
  statement_en: The Krull dimension of the polynomial ring in n variables over a field is n.
  assumptions:
  - $k$は体
  - $n$は自然数
  quantifiers:
  - 任意の体$k$と自然数$n$
  conclusion: $\dim k[x_1,\dots,x_n]=n$である。
  answer: |
    $k$を体とする。$n$についての帰納法で示す。$n=0$なら$k$の素イデアルは$0$だけなので次元は$0$である。$n\geq 1$とすると、$k[x_1,\dots,x_{n-1}]$はヒルベルトの基底定理によりネーター環であり、$k[x_1,\dots,x_n]=k[x_1,\dots,x_{n-1}][x_n]$である。ネーター環$R$について$\dim R[X]=\dim R+1$なので、帰納法の仮定より$\dim k[x_1,\dots,x_n]=(n-1)+1=n$である。
  strategy: Induct on n using the dimension formula for polynomial rings over Noetherian rings.
  sketch:
  - 'derive: For n = 0, a field has dimension 0.'
  - 'apply_theorem: k[x_1, ..., x_(n-1)] is Noetherian by Hilbert''s basis theorem.'
  - 'apply_theorem: The dimension formula adds 1 for each new variable.'
  - 'conclude: So the dimension is n.'
  openmath: (forall (k n) (-> (and (is_field k) (in n N)) (= (ring_krull_dim (mv_polynomial_ring (variable_family n) k)) n)))
  hard_negative:
    statement: 任意の整域$R$について$\dim R[x_1,\dots,x_n]=n$である。
    reason: $R=\mathbb{Z}$、$n=1$とすると、$(0)\subset(2)\subset(2,x)$は長さ$2$の素イデアルの鎖なので、$\dim\mathbb{Z}[x]\geq 2$である。正しくはネーター環で$\dim R+n$である。
  target: |
    ∀ (k : Type*) [Field k] (n : ℕ), ringKrullDim (MvPolynomial (Fin n) k) = n
  proof: |
    by
      intro k _ n
      rw [MvPolynomial.ringKrullDim_of_isNoetherianRing, ringKrullDim_eq_zero_of_field]
      simp
- id: dim_drop_by_regular_element
  kind: gap
  level: 4
  topic: 可換環論・次元と正則元
  statement: $R$をネーター局所環、$\mathfrak{m}$を極大イデアル、$x\in\mathfrak{m}$を非零因子とする。$\dim R/(x)+1=\dim R$である。
  statement_en: If x is a nonzerodivisor in the maximal ideal of a Noetherian local ring R, then dim R/(x) + 1 = dim R.
  assumptions:
  - $R$はネーター局所環
  - $x\in\mathfrak{m}$
  - $x$は非零因子
  quantifiers:
  - 任意のネーター局所環$R$と元$x$
  conclusion: $\dim R/(x)+1=\dim R$である。
  answer: |
    $R$をネーター局所環、$x\in\mathfrak{m}$を非零因子とし、$d=\dim R/(x)$とする。$\mathfrak{p}_0\subsetneq\dots\subsetneq\mathfrak{p}_d$を$R/(x)$の素イデアルの鎖に対応する$R$の素イデアルの鎖とする。$x\in\mathfrak{p}_0$である。$R$の極小素イデアルの元は零因子なので、$\mathfrak{p}_0$は極小でなく、$\mathfrak{q}\subsetneq\mathfrak{p}_0$となる素イデアルがある。長さ$d+1$の鎖が得られるので$d+1\leq\dim R$である。
    逆に、$R/(x)$の極大イデアル$\mathfrak{m}/(x)$の高さは$d$である。標高定理の逆より、$y_1,\dots,y_d\in\mathfrak{m}$で、$\mathfrak{m}/(x)$が$(\bar y_1,\dots,\bar y_d)$上極小となるものがある。すると$\mathfrak{m}$は$(x,y_1,\dots,y_d)$上極小である。クルルの標高定理より$\operatorname{ht}\mathfrak{m}\leq d+1$であり、$\dim R=\operatorname{ht}\mathfrak{m}\leq d+1$である。
  strategy: Extend chains below using that minimal primes consist of zero divisors, and bound the height of m by generators using Krull's height theorem.
  sketch:
  - 'setup: Let d = dim R/(x), with a chain of primes of R containing x.'
  - 'derive: The bottom prime contains the nonzerodivisor x, so it is not minimal, and the chain extends by one.'
  - 'derive: So d + 1 ≤ dim R.'
  - 'apply_theorem: m/(x) is minimal over d elements, so m is minimal over d + 1 elements.'
  - 'apply_theorem: Krull''s height theorem gives dim R = ht m ≤ d + 1.'
  - 'conclude: Equality holds.'
  openmath: (forall (A x) (-> (and (comm_ring A) (noetherian_ring A) (local_ring A) (in x (unique_maximal_ideal A)) (forall (y) (-> (and (in y A) (= (* x y) 0)) (= y 0)))) (= (+ (ring_krull_dim (quotient_ring A (principal_ideal x))) 1) (ring_krull_dim A))))
  hard_negative:
    statement: ネーター局所環の極大イデアルの任意の元$x$について、$\dim R/(x)+1=\dim R$である。
    reason: 体$k$上の$R=k[x,y]_{(x,y)}/(xy)$で元$x$をとると、$R/(x)=k[y]_{(y)}$の次元は$1$であり、$\dim R=1$である。よって$1+1\neq 1$である。$x$は零因子である。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] [IsLocalRing R] (x : R), IsSMulRegular R x → x ∈ IsLocalRing.maximalIdeal R → ringKrullDim (R ⧸ Ideal.span {x}) + 1 = ringKrullDim R
  proof: |
    by
      intro R _ _ _ x h1 h2
      exact ringKrullDim_quotient_span_singleton_succ_eq_ringKrullDim h1 h2
- id: dim_quotient_regular_sequence
  kind: gap
  level: 4
  topic: 可換環論・正則列と次元
  statement: $R$をネーター局所環、$r_1,\dots,r_k$を$R$正則列とする。すなわち各$r_i$は$R/(r_1,\dots,r_{i-1})$の非零因子で、$(r_1,\dots,r_k)\neq R$である。このとき$\dim R/(r_1,\dots,r_k)+k=\dim R$である。
  statement_en: If r_1, ..., r_k is a regular sequence on a Noetherian local ring R, meaning each r_i is a nonzerodivisor on R/(r_1, ..., r_(i-1)) and (r_1, ..., r_k) ≠ R, then dim R/(r_1, ..., r_k) + k = dim R.
  assumptions:
  - $R$はネーター局所環
  - $r_1,\dots,r_k$は$R$正則列
  quantifiers:
  - 任意のネーター局所環$R$と正則列$r_1,\dots,r_k$
  conclusion: $\dim R/(r_1,\dots,r_k)+k=\dim R$である。
  answer: |
    $R$をネーター局所環、$r_1,\dots,r_k$を$R$正則列とする。$k$の帰納法で示す。$k=0$では両辺が$\dim R$である。$k\geq 1$とする。$(r_1,\dots,r_k)\neq R$なので、すべての$r_i$は極大イデアルに属する。$r_1$は非零因子で極大イデアルに属するので、$\dim R/(r_1)+1=\dim R$である。
    $R'=R/(r_1)$はネーター局所環で、$r_2,\dots,r_k$の像は$R'$正則列である。$R'/(r_2,\dots,r_k)=R/(r_1,\dots,r_k)$なので、帰納法の仮定より$\dim R/(r_1,\dots,r_k)+(k-1)=\dim R'$である。合わせると$\dim R/(r_1,\dots,r_k)+k=\dim R'+1=\dim R$である。
  strategy: Induct on k, dividing by r_1 and using the drop of dimension by a regular element.
  sketch:
  - 'derive: All r_i lie in the maximal ideal because the ideal they generate is proper.'
  - 'apply_theorem: dim R/(r_1) + 1 = dim R since r_1 is a nonzerodivisor in m.'
  - 'derive: The images of r_2, ..., r_k form a regular sequence on R/(r_1).'
  - 'induction: The hypothesis applied to R/(r_1) gives dim R/(r_1, ..., r_k) + k - 1 = dim R/(r_1).'
  - 'conclude: Combining the two equalities gives the claim.'
  openmath: (forall (A rs) (-> (and (comm_ring A) (noetherian_ring A) (local_ring A) (regular_sequence_on rs A)) (= (+ (ring_krull_dim (quotient_ring A (ideal_generated_by rs))) (size rs)) (ring_krull_dim A))))
  hard_negative:
    statement: ネーター局所環の極大イデアルの元の任意の列$r_1,\dots,r_k$について、$\dim R/(r_1,\dots,r_k)+k=\dim R$である。
    reason: 体$F$上の$R=F[x]_{(x)}$で長さ$2$の列$x,x$を考えると、$R/(x,x)=F$の次元は$0$なので和は$2$である。$\dim R=1$である。$x$は$R/(x)$で$0$なので正則列でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] [IsLocalRing R] (rs : List R), RingTheory.Sequence.IsRegular R rs → ringKrullDim (R ⧸ Ideal.ofList rs) + rs.length = ringKrullDim R
  proof: |
    by
      intro R _ _ _ rs h
      exact ringKrullDim_add_length_eq_ringKrullDim_of_isRegular rs h
- id: regular_sequence_permutation_local
  kind: textbook
  level: 4
  topic: 可換環論・正則列
  statement: $R$をネーター局所環、$M$を有限生成$R$加群、$r_1,\dots,r_k$を$M$正則列とする。すなわち各$r_i$は$M/(r_1,\dots,r_{i-1})M$上の非零因子で、$(r_1,\dots,r_k)M\neq M$である。このとき$r_1,\dots,r_k$の任意の並べ替えも$M$正則列である。
  statement_en: Over a Noetherian local ring, any permutation of a regular sequence on a finitely generated module is again a regular sequence.
  assumptions:
  - $R$はネーター局所環
  - $M$は有限生成$R$加群
  - $r_1,\dots,r_k$は$M$正則列
  quantifiers:
  - 任意のネーター局所環$R$、有限生成加群$M$、正則列
  conclusion: 並べ替えも$M$正則列である。
  answer: |
    $R$をネーター局所環、$\mathfrak{m}$を極大イデアル、$M$を有限生成$R$加群、$r_1,\dots,r_k$を$M$正則列とする。$(r_1,\dots,r_k)M\neq M$と中山の補題より、$M\neq 0$であり、各$r_i$は$\mathfrak{m}$に属する（単元があれば$(r_1,\dots,r_k)M=M$となる）。並べ替えは隣接互換の合成なので、隣接する2つの入れ替えを調べればよい。前の項までで割った$M'=M/(r_1,\dots,r_{i-1})M$を考え、$a=r_i$、$b=r_{i+1}$とおく。$a$は$M'$上の非零因子で、$b$は$M'/aM'$上の非零因子である。
    $b$が$M'$上の非零因子であることを示す。$K=\{z\in M':bz=0\}$とおく。$z\in K$なら$b\bar z=0$が$M'/aM'$で成り立つので、$z=ay$と書ける。$a(by)=0$より$by=0$なので$y\in K$である。よって$K=aK$である。$K$は有限生成で$a\in\mathfrak{m}$なので、中山の補題より$K=0$である。
    $a$が$M'/bM'$上の非零因子であることを示す。$az=by$とする。$M'/aM'$で$b\bar y=0$なので$y=ay'$と書ける。$a(z-by')=0$より$z=by'$である。よって$\bar z=0$である。
    $(a,b)M'$は順序によらないので、後の項についての条件と$(r_1,\dots,r_k)M\neq M$は変わらない。
  strategy: Reduce to swapping two adjacent elements, and use Nakayama's lemma for the kernel of multiplication by b.
  sketch:
  - 'derive: All r_i lie in m, by Nakayama''s lemma and properness.'
  - 'setup: Reduce to swapping a and b on M'' = M/(r_1, ..., r_(i-1))M.'
  - 'derive: The kernel K of b on M'' satisfies K = aK.'
  - 'apply_theorem: Nakayama''s lemma gives K = 0, so b is a nonzerodivisor on M''.'
  - 'derive: If az = by on M'', then y = ay'' and z = by'', so a is a nonzerodivisor on M''/bM''.'
  - 'conclude: Later quotients do not change, so the swapped sequence is regular.'
  openmath: (forall (A V rs ts) (-> (and (comm_ring A) (noetherian_ring A) (local_ring A) (module_over V A) (finitely_generated_module A V) (regular_sequence_on rs V) (list_permutation rs ts)) (regular_sequence_on ts V)))
  hard_negative:
    statement: 任意のネーター環で、正則列の並べ替えは正則列である。
    reason: 体$k$上の$R=k[x,y,z]$で$x,\ y(1-x),\ z(1-x)$は正則列である。並べ替えた$y(1-x),\ z(1-x),\ x$では、$z(1-x)\cdot y=z\cdot y(1-x)$は$y(1-x)$で割り切れ、$y\notin(y(1-x))$である。よって$z(1-x)$は$R/(y(1-x))$の零因子である。
  target: |
    ∀ (R M : Type*) [CommRing R] [IsLocalRing R] [IsNoetherianRing R] [AddCommGroup M] [Module R M] [Module.Finite R M] (rs rs' : List R), RingTheory.Sequence.IsRegular M rs → List.Perm rs rs' → RingTheory.Sequence.IsRegular M rs'
  proof: |
    by
      intro R M _ _ _ _ _ _ rs rs' h1 h2
      exact IsLocalRing.isRegular_of_perm h1 h2
- id: faithfully_flat_contraction_of_extension
  kind: textbook
  level: 4
  topic: 可換環論・忠実平坦
  statement: $A\to B$を可換環の準同型とし、$B$は$A$上忠実平坦とする。すなわち$B$は平坦で、$A$加群$N$について$B\otimes_AN=0$なら$N=0$である。このとき$A$のイデアル$I$について$(IB)\cap A=I$である。ここで$(IB)\cap A$は$IB$の$A$への逆像である。
  statement_en: Let B be a faithfully flat A-algebra, meaning flat with B ⊗ N = 0 only for N = 0. For every ideal I of A, the preimage in A of the extension IB equals I.
  assumptions:
  - $A,B$は可換環
  - $B$は$A$上忠実平坦
  - $I$は$A$のイデアル
  quantifiers:
  - 任意の忠実平坦$A$代数$B$とイデアル$I$
  conclusion: $IB$の$A$への逆像は$I$である。
  answer: |
    $A\to B$を可換環の準同型で$B$は$A$上忠実平坦とし、$I$を$A$のイデアルとする。$A$加群$N$について、$\iota:N\to B\otimes_AN$（$y\mapsto 1\otimes y$）が単射であることを示す。$K=\ker\iota$とおく。$B$は平坦なので、$\mathrm{id}_B\otimes\iota:B\otimes N\to B\otimes B\otimes N$の核は$B\otimes K$である。一方、始めの2因子の積$B\otimes B\otimes N\to B\otimes N$は$\mathrm{id}_B\otimes\iota$の左逆写像なので、$\mathrm{id}_B\otimes\iota$は単射である。よって$B\otimes K=0$であり、忠実平坦性より$K=0$である。
    $N=A/I$とすると、$B\otimes_AA/I=B/IB$であり、$\iota$は$A/I\to B/IB$である。これが単射なので、$a\in A$の像が$IB$に入れば$a\in I$である。すなわち$IB$の$A$への逆像は$I$に含まれる。逆に$a\in I$の像は$IB$に属するので、$I$は逆像に含まれる。
  strategy: Show N → B ⊗ N is injective for every N, using faithful flatness, and apply it to N = A/I.
  sketch:
  - 'setup: Let K be the kernel of N → B ⊗ N.'
  - 'derive: Flatness identifies B ⊗ K with the kernel of id ⊗ ι.'
  - 'derive: id ⊗ ι has a left inverse given by multiplication, so B ⊗ K = 0.'
  - 'apply_theorem: Faithful flatness gives K = 0.'
  - 'conclude: For N = A/I, the map A/I → B/IB is injective, so the contraction of IB is I.'
  openmath: (forall (A B I) (-> (and (comm_ring A) (comm_ring B) (algebra_over B A) (faithfully_flat A B) (ideal_of I A)) (= (ideal_comap (algebra_map A B) (ideal_map (algebra_map A B) I)) I)))
  hard_negative:
    statement: 平坦な$A$代数$B$について、$A$のイデアル$I$は$(IB)\cap A=I$を満たす。
    reason: $\mathbb{Z}\to\mathbb{Q}$は平坦であるが、$I=(2)$について$I\mathbb{Q}=\mathbb{Q}$の逆像は$\mathbb{Z}\neq I$である。忠実平坦性が要る。
  target: |
    ∀ (A B : Type*) [CommRing A] [CommRing B] [Algebra A B] [Module.FaithfullyFlat A B] (I : Ideal A), (I.map (algebraMap A B)).comap (algebraMap A B) = I
  proof: |
    by
      intro A B _ _ _ _ I
      exact Ideal.comap_map_eq_self_of_faithfullyFlat I
- id: faithfully_flat_prime_lying_over
  kind: gap
  level: 4
  topic: 可換環論・忠実平坦
  statement: $B$を忠実平坦な$A$代数、$\mathfrak{p}$を$A$の素イデアルとする。$\mathfrak{p}$の上にある$B$の素イデアルが存在する。すなわち$\operatorname{Spec}B\to\operatorname{Spec}A$は全射である。
  statement_en: If B is a faithfully flat A-algebra and p is a prime ideal of A, then there is a prime ideal of B lying over p; that is, Spec B → Spec A is surjective.
  assumptions:
  - $A,B$は可換環
  - $B$は$A$上忠実平坦
  - $\mathfrak{p}$は$A$の素イデアル
  quantifiers:
  - 任意の忠実平坦$A$代数$B$と素イデアル$\mathfrak{p}$
  conclusion: $\mathfrak{p}$の上にある$B$の素イデアルが存在する。
  answer: |
    $B$を忠実平坦な$A$代数、$\varphi:A\to B$を構造射、$\mathfrak{p}$を$A$の素イデアルとする。$T=\varphi(A\setminus\mathfrak{p})$は$B$の乗法的部分集合である。$\mathfrak{p}B$の$A$への逆像は$\mathfrak{p}$なので、$\mathfrak{p}B\cap T=\emptyset$である。
    よって$\mathfrak{p}B$を含み$T$と交わらない素イデアル$\mathfrak{P}$がある。$\mathfrak{P}$の逆像は$\mathfrak{p}$を含み、$A\setminus\mathfrak{p}$と交わらないので、$\mathfrak{p}$に等しい。
  strategy: The contraction of pB is p, so pB misses the image of the complement of p, and a prime separates them.
  sketch:
  - 'derive: The contraction of pB is p by faithful flatness.'
  - 'derive: So pB does not meet the image T of the complement of p.'
  - 'apply_theorem: There is a prime P containing pB and disjoint from T.'
  - 'conclude: The contraction of P is p.'
  openmath: (forall (A B p) (-> (and (comm_ring A) (comm_ring B) (algebra_over B A) (faithfully_flat A B) (prime_ideal p A)) (exists (Y) (and (prime_ideal Y B) (= (ideal_comap (algebra_map A B) Y) p)))))
  hard_negative:
    statement: 平坦な$A$代数$B$について、$A$の素イデアルの上には$B$の素イデアルがある。
    reason: $\mathbb{Z}\to\mathbb{Q}$は平坦であるが、$\mathbb{Q}$の素イデアルは$0$だけなので、$(2)$の上の素イデアルはない。
  target: |
    ∀ (A B : Type*) [CommRing A] [CommRing B] [Algebra A B] [Module.FaithfullyFlat A B] (p : Ideal A) [p.IsPrime], ∃ P : Ideal B, P.IsPrime ∧ P.comap (algebraMap A B) = p
  proof: |
    by
      intro A B _ _ _ _ p _
      obtain ⟨P, h1, h2⟩ := Ideal.exists_isPrime_liesOver_of_faithfullyFlat (B := B) p
      exact ⟨P, h1, h2.1.symm⟩
- id: faithfully_flat_fg_descent
  kind: gap
  level: 4
  topic: 可換環論・忠実平坦
  statement: $S$を忠実平坦な$R$代数、$I$を$R$のイデアルとする。$IS$が有限生成なら$I$は有限生成である。
  statement_en: If S is a faithfully flat R-algebra and I is an ideal of R whose extension IS is finitely generated, then I is finitely generated.
  assumptions:
  - $R,S$は可換環
  - $S$は$R$上忠実平坦
  - $I$は$R$のイデアル
  - $IS$は有限生成
  quantifiers:
  - 任意の忠実平坦$R$代数$S$とイデアル$I$
  conclusion: $I$は有限生成である。
  answer: |
    $S$を忠実平坦な$R$代数、$I$を$R$のイデアルとし、$IS$が有限生成とする。$IS$の有限個の生成元はそれぞれ$\sum_ka_ks_k$（$a_k\in I$、$s_k\in S$）の形である。現れる$a_k$は有限個なので、それらで生成される有限生成イデアル$J\subseteq I$について$JS=IS$である。
    忠実平坦性より、イデアル$A$について$AS$の$R$への逆像は$A$である。よって$I$は$IS$の逆像に含まれ、それは$JS$の逆像$J$に等しい。したがって$I\subseteq J\subseteq I$であり、$I=J$は有限生成である。
  strategy: Find a finitely generated J inside I with JS = IS, then contract using faithful flatness.
  sketch:
  - 'setup: Each of finitely many generators of IS involves finitely many elements of I.'
  - 'construct: Let J be the finitely generated ideal generated by those elements, so JS = IS.'
  - 'apply_theorem: Faithful flatness gives that the contraction of JS is J.'
  - 'conclude: So I lies in J, hence I = J is finitely generated.'
  openmath: (forall (A B I) (-> (and (comm_ring A) (comm_ring B) (algebra_over B A) (faithfully_flat A B) (ideal_of I A) (finitely_generated_ideal (ideal_map (algebra_map A B) I))) (finitely_generated_ideal I)))
  hard_negative:
    statement: 平坦な$R$代数$S$について、$IS$が有限生成なら$I$は有限生成である。
    reason: 体$k$上の$R=k[x_1,x_2,\dots]$、$S=R[1/x_1]$、$I=(x_1,x_2,\dots)$とする。$S$は局所化なので平坦で、$IS=S$は有限生成である。しかし$I$は有限生成でない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] [Algebra R S] [Module.FaithfullyFlat R S] (I : Ideal R), (I.map (algebraMap R S)).FG → I.FG
  proof: |
    by
      intro R S _ _ _ _ I h
      exact Ideal.FG.of_FG_map_of_faithfullyFlat h
- id: flat_local_hom_is_faithfully_flat
  kind: textbook
  level: 4
  topic: 可換環論・忠実平坦
  statement: $A,B$を局所環、$A\to B$を局所準同型（非単元を非単元へ写す準同型）とし、$B$は$A$上平坦とする。このとき$B$は$A$上忠実平坦である。
  statement_en: A flat local homomorphism of local rings, sending nonunits to nonunits, makes the target faithfully flat over the source.
  assumptions:
  - $A,B$は局所環
  - $A\to B$は局所準同型
  - $B$は$A$上平坦
  quantifiers:
  - 任意の局所環$A,B$と局所準同型
  conclusion: $B$は$A$上忠実平坦である。
  answer: |
    $A,B$を局所環、$\mathfrak{m},\mathfrak{n}$をそれぞれの極大イデアル、$A\to B$を局所準同型とし、$B$は$A$上平坦とする。局所準同型なので$\mathfrak{m}B\subseteq\mathfrak{n}$である。$N$を$0$でない$A$加群とし、$B\otimes_AN\neq 0$を示す。
    $x\in N$を$0$でない元とし、$\mathfrak{a}=\mathrm{Ann}(x)$とおく。$\mathfrak{a}\neq A$なので$\mathfrak{a}\subseteq\mathfrak{m}$であり、$Ax\cong A/\mathfrak{a}$である。$B\otimes_AAx\cong B/\mathfrak{a}B$であり、$\mathfrak{a}B\subseteq\mathfrak{m}B\subseteq\mathfrak{n}$なので$B/\mathfrak{a}B\neq 0$である。$B$は平坦なので$B\otimes_AAx\to B\otimes_AN$は単射であり、$B\otimes_AN\neq 0$である。
  strategy: Test on a cyclic submodule Ax, using that aB is proper because the homomorphism is local.
  sketch:
  - 'derive: The local condition gives mB ⊆ n.'
  - 'setup: For nonzero x in N, let a = Ann(x), so Ax is A/a with a in m.'
  - 'derive: B ⊗ Ax is B/aB, which is nonzero.'
  - 'apply_theorem: Flatness makes B ⊗ Ax inject into B ⊗ N.'
  - 'conclude: So B ⊗ N is nonzero.'
  openmath: (forall (A B) (-> (and (comm_ring A) (comm_ring B) (local_ring A) (local_ring B) (algebra_over B A) (flat_module A B) (forall (x) (-> (and (in x A) (not (unit_element x A))) (not (unit_element (fn_value (algebra_map A B) x) B))))) (faithfully_flat A B)))
  hard_negative:
    statement: 局所環の間の平坦な準同型は、局所準同型でなくても忠実平坦である。
    reason: $\mathbb{Z}_{(2)}\to\mathbb{Q}$は平坦であるが、$2$を単元へ写すので局所準同型でない。$\mathbb{Q}\otimes\mathbb{Z}/2\mathbb{Z}=0$なので忠実平坦でない。
  target: |
    ∀ (A B : Type*) [CommRing A] [CommRing B] [Algebra A B] [IsLocalRing A] [IsLocalRing B] [Module.Flat A B] [IsLocalHom (algebraMap A B)], Module.FaithfullyFlat A B
  proof: |
    by
      intro A B _ _ _ _ _ _ _
      exact Module.FaithfullyFlat.of_flat_of_isLocalHom
