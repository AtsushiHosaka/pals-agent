  answer: $f$を$c$で有理型な関数とする。$A(z)=(z-c)^mf(z)$が$c$で解析的となる$m$を取る。解析的であることの定義から、$c$を中心とする円板$D$の全ての点で$A$は解析的である。$z\in D$、$z\neq c$なら$z$の近傍で$(w-c)^{-m}$は解析的なので、$f(w)=(w-c)^{-m}A(w)$は$z$で解析的である。
