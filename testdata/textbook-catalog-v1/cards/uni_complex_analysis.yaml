  conclusion: $|f|\to\infty$と$\operatorname{ord}_cf<0$は同値である。
  answer: |-
    $f$を$c$で有理型な関数、穴あき近傍で恒等的に$0$の関数の位数を$\infty$とする。

    $\operatorname{ord}_cf=n<0$とする。穴あき近傍で$f=(z-c)^ng$、$g(c)\neq 0$である。$g$は連続なので$c$の近くで$|g|\geq|g(c)|/2$であり、$|f(z)|\geq|z-c|^{n}|g(c)|/2\to\infty$である。

    逆に$|f|\to\infty$とする。$c$の穴あき近傍で$f\neq 0$なので位数$n$は有限である。$n\geq 0$なら$f=(z-c)^ng$は$z\to c$で有限の値$g(c)$または$0$に収束し、$|f|\to\infty$に反する。よって$n<0$である。
  strategy: Read the limit behaviour from the factorization f = (z-c)^n g.
  sketch:
  - 'derive: If n < 0, |f| ≥ |z-c|^n |g(c)|/2 tends to infinity.'
  - 'contradiction: If n ≥ 0, f has a finite limit at c.'
