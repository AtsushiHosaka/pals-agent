  - $f,g$は$U$で正則
  - $U$上で$fg=0$
  quantifiers:
  - 任意の$f,g,U$
  conclusion: $U$上で$f=0$または$U$上で$g=0$である。
  answer: $U$を連結開集合、$f,g$を$U$で正則で$U$上$fg=0$を満たす関数とする。$f$が$U$上で恒等的に$0$でないとする。$f(a)\neq 0$なる$a\in U$を取る。$f$は連続なので、$a$の近傍$V\subset U$で$f\neq 0$である。$V$上で$fg=0$から$g=0$である。$V$は開集合で空でないので$V$の点は$U$内の集積点である。一致の定理により$U$上で$g=0$である。
  strategy: Where f ≠ 0, g vanishes on an open set; the identity theorem spreads this.
  sketch:
  - 'setup: Suppose f(a) ≠ 0 for some a in U.'
  - 'derive: On a neighbourhood of a, f ≠ 0 forces g = 0.'
  - 'apply_theorem: The identity theorem gives g = 0 on U.'
  openmath: (forall (f g U) (-> (and (open_set U) (connected_set U) (holomorphic_on f U) (holomorphic_on g U) (forall (z) (-> (in z U) (= (* (fn_value f z) (fn_value g z)) 0)))) (or (forall (z) (-> (in z U) (= (fn_value f z) 0))) (forall (z) (-> (in z U) (= (fn_value g z) 0))))))
  hard_negative:
    statement: $U$が連結でなくても同じ結論が成り立つ。
    reason: $U$を互いに素な二つの円板の和とし、$f$を一方で$1$、他方で$0$、$g=1-f$とすると$fg=0$だがどちらも恒等的に$0$でない。
  target: |
    ∀ (f g : ℂ → ℂ) (U : Set ℂ), IsOpen U → IsPreconnected U → DifferentiableOn ℂ f U → DifferentiableOn ℂ g U → (∀ z ∈ U, f z * g z = 0) → (∀ z ∈ U, f z = 0) ∨ (∀ z ∈ U, g z = 0)
  proof: |
    by
      intro f g U hU hc hf hg h
      exact AnalyticOnNhd.eq_zero_or_eq_zero_of_mul_eq_zero (hf.analyticOnNhd hU) (hg.analyticOnNhd hU) h hc
- id: zeros_finite_on_compact
  kind: gap
  level: 3
  topic: 一致の定理の系・コンパクト集合上の零点
  statement: $U$を連結開集合、$f$を$U$で正則で恒等的には$0$でない($f(c)\neq 0$なる$c\in U$がある)とする。$K\subset U$がコンパクトなら、$K$内の$f$の零点は有限個である。
  statement_en: If f is holomorphic on a connected open set U with f(c) ≠ 0 for some c in U and K is a compact subset of U, then f has finitely many zeros in K.
  assumptions:
  - $U$は連結開集合
  - $f$は$U$で正則で$c\in U$、$f(c)\neq 0$
  - $K\subset U$はコンパクト
  quantifiers:
  - 任意の$f,U,K,c$
  conclusion: $\{z\in K\mid f(z)=0\}$は有限集合である。
  answer: $U$を連結開集合、$f$を$U$で正則な関数、$c\in U$で$f(c)\neq 0$、$K\subset U$をコンパクト集合とする。零点が$K$内に無限個あるとする。$K$はコンパクトなので、互いに異なる零点の列は$K$内の点$x$に集積する。$x\in U$なので、$f$と定数関数$0$は$U$内の集積点を持つ集合で一致する。一致の定理により$U$上で$f=0$となり、$f(c)\neq 0$に矛盾する。
  strategy: Infinitely many zeros in a compact set accumulate, contradicting the identity theorem.
  sketch:
  - 'contradiction: Assume infinitely many zeros in K.'
  - 'apply_theorem: Compactness gives an accumulation point in U.'
  - 'apply_theorem: The identity theorem gives f = 0 on U.'
  openmath: (forall (f U K c) (-> (and (open_set U) (connected_set U) (holomorphic_on f U) (in c U) (!= (fn_value f c) 0) (compact_set K) (subset K U)) (finite_set (zero_set_in f K))))
  hard_negative:
    statement: $U$内の零点は常に有限個である。
    reason: $f(z)=\sin z$は$U=\mathbb{C}$で恒等的に$0$でないが零点は無限個ある。$K$のコンパクト性が必要である。
  target: |
    ∀ (f : ℂ → ℂ) (U K : Set ℂ) (c : ℂ), IsOpen U → IsPreconnected U → DifferentiableOn ℂ f U → c ∈ U → f c ≠ 0 → IsCompact K → K ⊆ U → {z ∈ K | f z = 0}.Finite
  proof: |
    by
      intro f U K c hU hp hf hc h0 hK hKU
      by_contra hinf
      have hinf' : {z ∈ K | f z = 0}.Infinite := hinf
      obtain ⟨x, hxK, hx⟩ := hinf'.exists_accPt_of_subset_isCompact hK (fun z hz => hz.1)
      have hfr : ∃ᶠ z in nhdsWithin x {x}ᶜ, f z = 0 := by
        rw [accPt_iff_frequently_nhdsNE] at hx
        exact hx.mono (fun z hz => hz.2)
      have := (hf.analyticOnNhd hU).eqOn_zero_of_preconnected_of_frequently_eq_zero hp (hKU hxK) hfr
      exact h0 (this hc)
- id: entire_functions_equal_on_real_axis
  kind: gap
  level: 3
  topic: 一致の定理の系・実軸上の一致
  statement: 整関数$f,g$が全ての実数$x$で$f(x)=g(x)$を満たすならば、$f=g$である。
  statement_en: Entire functions that agree at every real number are equal.
  assumptions:
  - $f,g$は整関数
  - 全ての実数$x$で$f(x)=g(x)$
  quantifiers:
  - 任意の$f,g$
  conclusion: $f=g$である。
  answer: $f,g$を全ての実数$x$で$f(x)=g(x)$を満たす整関数とする。点$1/(n+1)$($n\in\mathbb{N}$)は$0$と異なり$0$に収束し、これらの点で$f=g$である。よって$0$は$\{f=g\}$の集積点である。$\mathbb{C}$は連結なので、一致の定理により$f=g$である。
  strategy: The real points 1/(n+1) accumulate at 0, so the identity theorem applies.
  sketch:
  - 'derive: The points 1/(n+1) are real and accumulate at 0.'
  - 'apply_theorem: The identity theorem on the plane.'
  openmath: (forall (f g) (-> (and (entire_function f) (entire_function g) (forall (x) (-> (in x R) (= (fn_value f x) (fn_value g x))))) (forall (z) (= (fn_value f z) (fn_value g z)))))
  hard_negative:
    statement: 実数上で一致する$C^\infty$級の関数$\mathbb{C}\to\mathbb{C}$は等しい。
    reason: $f(z)=\operatorname{Im}z$と$g=0$は実軸上で一致するが等しくない。正則性が必要である。
  target: |
    ∀ (f g : ℂ → ℂ), Differentiable ℂ f → Differentiable ℂ g → (∀ x : ℝ, f x = g x) → f = g
  proof: |
    by
      intro f g hf hg h
      have hfa : AnalyticOnNhd ℂ f Set.univ := (Complex.analyticOnNhd_univ_iff_differentiable).mpr hf
      have hga : AnalyticOnNhd ℂ g Set.univ := (Complex.analyticOnNhd_univ_iff_differentiable).mpr hg
      have ht : Filter.Tendsto (fun n : ℕ => (((n : ℝ) + 1)⁻¹ : ℂ)) Filter.atTop (nhdsWithin 0 {0}ᶜ) := by
        refine tendsto_nhdsWithin_iff.mpr ⟨?_, Filter.Eventually.of_forall (fun n => ?_)⟩
        · have := tendsto_one_div_add_atTop_nhds_zero_nat (𝕜 := ℝ)
          have h2 := (Complex.continuous_ofReal.tendsto 0).comp this
          simpa [Function.comp_def] using h2
        · simp only [Set.mem_compl_iff, Set.mem_singleton_iff, inv_eq_zero]
          exact_mod_cast (Nat.cast_add_one_ne_zero n : ((n : ℝ) + 1) ≠ 0)
      have hfr : ∃ᶠ z in nhdsWithin (0 : ℂ) {0}ᶜ, f z = g z := by
        refine ht.frequently (Filter.Frequently.of_forall (fun n => ?_))
        have := h (((n : ℝ) + 1)⁻¹)
        simpa using this
      exact AnalyticOnNhd.eq_of_frequently_eq hfa hga hfr
