    直接の計算で$\psi'(0)=1-|w|^2$、$\phi'(b)=1/(1-|b|^2)$である。合成の微分より$F'(0)=f'(w)(1-|w|^2)/(1-|b|^2)$である。$|F'(0)|\leq 1$を書き直すと結論を得る。
