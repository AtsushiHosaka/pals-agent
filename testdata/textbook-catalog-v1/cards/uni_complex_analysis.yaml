  - 各$F_n$は円周上で連続
  - 円周上で$F_n\to f$は一様収束
  quantifiers:
  - 任意の$F_n,f,c,R$
  conclusion: $\oint_{|z-c|=R}F_n\,dz\to\oint_{|z-c|=R}f\,dz$である。
  answer: |-
    $R\geq 0$、$F_n$を円周$|z-c|=R$上で連続な関数列、$f$を円周上の$F_n$の一様収束極限とする。一様収束極限なので$f$は円周上で連続である。$\varepsilon>0$を取る。十分大きな$n$で円周上$|F_n-f|\leq\varepsilon$である。長さと最大値による評価から
    $\left|\oint F_n\,dz-\oint f\,dz\right|=\left|\oint(F_n-f)\,dz\right|\leq 2\pi R\varepsilon$
    である。$\varepsilon$は任意なので収束が従う。
  strategy: Apply the length times maximum bound to F_n - f.
  sketch:
  - 'derive: The limit f is continuous on the circle.'
  - 'apply_theorem: The ML bound gives |∮(F_n - f)| ≤ 2πR sup|F_n - f|.'
  - 'conclude: The right side tends to 0.'
  openmath: (forall (F0 f c r) (-> (and (>= r 0) (forall (n) (continuous_on_set (seq_value F0 n) (circle_set c r))) (uniform_tends_on F0 f (circle_set c r))) (seq_fn_tends_to (lambda (n) (circle_integral (lambda (z) (fn_value (seq_value F0 n) z)) c r)) (circle_integral (lambda (z) (fn_value f z)) c r))))
  hard_negative:
    statement: 連続な$F_n$が円周上で各点収束するだけで$\oint F_n\,dz\to\oint f\,dz$である。
    reason: $c=0$、$R=1$とする。$n\geq 1$と$0\leq t<2\pi$について、$\phi_n(t)=n^2t$($0\leq t\leq 1/n$)、$\phi_n(t)=n^2(2/n-t)$($1/n\leq t\leq 2/n$)、それ以外で$\phi_n(t)=0$とし、$F_n(e^{it})=\phi_n(t)e^{-it}$とおく。$2/n<2\pi$なので$F_n$は円周上で連続で、各点で$0$に収束する。一方$\oint F_n\,dz=\int_0^{2\pi}\phi_n(t)e^{-it}\cdot ie^{it}\,dt=i\int_0^{2\pi}\phi_n(t)\,dt=i$であり、$\oint 0\,dz=0$と異なる。
