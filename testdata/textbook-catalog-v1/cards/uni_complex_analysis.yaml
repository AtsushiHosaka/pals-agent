- id: circle_integration_by_parts
  kind: gap
  level: 2
  topic: 周回積分・部分積分
  statement: $R\geq 0$とし、$f,g$が円周$|z-c|=R$の各点で複素微分可能で、導関数$f',g'$が円周上で連続ならば、$\oint fg'\,dz=-\oint f'g\,dz$である。
  statement_en: If R ≥ 0 and f, g have complex derivatives f', g' at each point of the circle |z-c| = R with f', g' continuous on it, then the integral of f g' over the circle equals minus the integral of f' g.
  assumptions:
  - $R\geq 0$
  - $f,g$は円周の各点で複素微分可能で導関数は$f',g'$
  - $f',g'$は円周上で連続
  quantifiers:
  - 任意の$f,g,f',g',c,R$
  conclusion: $\oint fg'\,dz=-\oint f'g\,dz$である。
  answer: $R\geq 0$、$f,g$を円周$|z-c|=R$の各点で複素微分可能な関数、$f',g'$をその導関数で円周上で連続なものとする。$f,g$は円周の各点で連続である。積の微分より、円周の各点で$(fg)'=f'g+fg'$であり、右辺は円周上で連続である。原始関数$fg$を持つ連続関数の周回積分は$0$なので、$\oint(f'g+fg')\,dz=0$である。$f'g$と$fg'$は円周上で連続で積分可能なので、積分を分けて$\oint f'g\,dz+\oint fg'\,dz=0$を得る。
  strategy: Integrate the derivative of the product f g over the closed circle.
  sketch:
  - 'derive: (fg)'' = f''g + fg'' on the circle.'
  - 'apply_theorem: The integral of a derivative over a closed curve vanishes.'
  - 'conclude: Split the integral and rearrange.'
  openmath: (forall (f g f1 g1 c r) (-> (and (>= r 0) (continuous_on_set f1 (circle_set c r)) (continuous_on_set g1 (circle_set c r)) (forall (z) (-> (in z (circle_set c r)) (and (has_complex_deriv_at f (fn_value f1 z) z) (has_complex_deriv_at g (fn_value g1 z) z))))) (= (circle_integral (lambda (z) (* (fn_value f z) (fn_value g1 z))) c r) (neg (circle_integral (lambda (z) (* (fn_value f1 z) (fn_value g z))) c r)))))
