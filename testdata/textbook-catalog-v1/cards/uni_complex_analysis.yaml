- id: locally_nth_power_of_order
  kind: gap
  level: 3
  topic: 零点の位数・局所的な冪の形
  statement: $f$が$c$で解析的で$c$の零点の位数が$n\geq 1$ならば、$c$で解析的な$h$があり、$h(c)=0$、$h'(c)\neq 0$で、$c$の近傍で$f=h^n$である。
  statement_en: If f is analytic at c with a zero of order n ≥ 1 at c, then there is h analytic at c with h(c) = 0, h'(c) ≠ 0 and f = h^n near c.
  assumptions:
  - $f$は$c$で解析的
  - $c$での零点の位数は$n\geq 1$
  quantifiers:
  - 任意の$f,c,n$
  conclusion: $h(c)=0$、$h'(c)\neq 0$で近傍で$f=h^n$なる$h$がある。
  answer: |-
    $f$を$c$で解析的な関数で、$c$が位数$n\geq 1$の零点であるものとする。$c$の近傍で$f(z)=(z-c)^ng(z)$、$g$は解析的で$g(c)\neq 0$である。$a^n=g(c)$なる$a$を取る(複素数は$n$乗根を持つ)。$a\neq 0$である。

    $q=g/g(c)$は$q(c)=1$なので、$c$の近傍で値は$1$の近くにあり、主値の対数$\log q$が解析的に定まる。$\phi(z)=a\exp(\log q(z)/n)$とおくと、$\phi$は解析的で$\phi(c)=a$、$\phi^n=a^nq=g$である。

    $h(z)=(z-c)\phi(z)$とおく。$h(c)=0$、$h'(c)=\phi(c)=a\neq 0$であり、近傍で$h^n=(z-c)^ng=f$である。
  strategy: Take an analytic n-th root of the nonvanishing factor g via the logarithm.
  sketch:
  - 'setup: Write f = (z-c)^n g with g(c) ≠ 0.'
  - 'construct: An analytic n-th root φ of g near c, using the principal logarithm of g/g(c).'
  - 'construct: h = (z-c) φ.'
  - 'conclude: h(c) = 0, h''(c) = φ(c) ≠ 0 and h^n = f.'
  openmath: (forall (f c n) (-> (and (analytic_at f c) (in n N) (> n 0) (= (analytic_order f c) n)) (exists (h) (and (analytic_at h c) (= (fn_value h c) 0) (!= (complex_deriv h c) 0) (eq_near (lambda (z) (fn_value f z)) (lambda (z) (^ (fn_value h z) n)) c)))))
  hard_negative:
    statement: $h(z)=(z-c)$と取れる(すなわち$f=(z-c)^n$である)。
    reason: $f(z)=z(1+z)$、$c=0$、$n=1$では$f\neq z$である。一般に因子$\phi$が必要である。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ) (n : ℕ), n ≠ 0 → AnalyticAt ℂ f c → analyticOrderAt f c = n → ∃ h : ℂ → ℂ, AnalyticAt ℂ h c ∧ h c = 0 ∧ deriv h c ≠ 0 ∧ ∀ᶠ z in nhds c, f z = h z ^ n
  proof: |
    by
      intro f c n hn hf ho
      obtain ⟨g, hg, hg0, hfg⟩ := hf.analyticOrderAt_eq_natCast.mp ho
      obtain ⟨a, ha⟩ := IsAlgClosed.exists_pow_nat_eq (g c) (Nat.pos_of_ne_zero hn)
      have ha0 : a ≠ 0 := by
        rintro rfl
        rw [zero_pow hn] at ha
        exact hg0 ha.symm
      set q : ℂ → ℂ := fun z => g z / g c with hq
      have hqa : AnalyticAt ℂ q c := hg.div analyticAt_const hg0
      have hq1 : q c = 1 := div_self hg0
      have hslit : ∀ᶠ z in nhds c, q z ∈ Complex.slitPlane := by
        apply hqa.continuousAt.eventually_mem
        rw [hq1]
        exact Complex.isOpen_slitPlane.mem_nhds Complex.one_mem_slitPlane
      have hlog : AnalyticAt ℂ (fun z => Complex.log (q z)) c := hqa.clog (by rw [hq1]; exact Complex.one_mem_slitPlane)
      set φ : ℂ → ℂ := fun z => a * Complex.exp (Complex.log (q z) / n) with hφ
      have hφa : AnalyticAt ℂ φ c := analyticAt_const.mul ((hlog.div analyticAt_const (by exact_mod_cast hn)).cexp)
      have hφc : φ c = a := by simp [hφ, hq1]
      have hn' : (n : ℂ) ≠ 0 := by exact_mod_cast hn
      have hh : AnalyticAt ℂ (fun z => (z - c) * φ z) c := (analyticAt_id.sub analyticAt_const).mul hφa
      refine ⟨fun z => (z - c) * φ z, hh, by simp, ?_, ?_⟩
      · have h1 : HasDerivAt (fun z => (z - c) * φ z) (1 * φ c + (c - c) * deriv φ c) c :=
          ((hasDerivAt_id c).sub_const c).mul hφa.differentiableAt.hasDerivAt
        rw [h1.deriv]
        simp [hφc, ha0]
      · filter_upwards [hfg, hslit] with z hz hs
        rw [hz, mul_pow, smul_eq_mul]
        congr 1
        simp only [hφ, mul_pow]
        rw [← Complex.exp_nat_mul, mul_div_cancel₀ _ hn', Complex.exp_log (Complex.slitPlane_ne_zero hs), ha]
        simp only [hq]
        field_simp
- id: removable_singularity_little_o
  kind: textbook
  level: 3
  topic: 除去可能特異点・増大条件による判定
  statement: $s$を$c$の近傍とし、$f$は$s\setminus\{c\}$で正則で、$z\to c$($z\neq c$)で$(z-c)f(z)\to 0$とする。このとき$s$で正則な$g$があり$s\setminus\{c\}$上で$g=f$である。これは有界な場合の一般形である。
  statement_en: As a generalization of the bounded case, if s is a neighbourhood of c, f is holomorphic on s minus {c}, and (z-c) f(z) tends to 0 as z tends to c, then there is g holomorphic on s with g = f on s minus {c}.
  assumptions:
  - $s$は$c$の近傍
  - $f$は$s\setminus\{c\}$で正則
  - $z\to c$($z\neq c$)で$(z-c)f(z)\to 0$
  quantifiers:
  - 任意の$f,s,c$
  conclusion: $s$で正則な$g$があり$s\setminus\{c\}$上で$g=f$である。
  answer: |-
    $s$を$c$の近傍、$f$を$s\setminus\{c\}$で正則で$z\to c$($z\neq c$)のとき$(z-c)f(z)\to 0$を満たす関数とする。$h(z)=(z-c)^2f(z)$($z\neq c$)、$h(c)=0$とおく。$s\setminus\{c\}$で$h$は正則である。$c$では$\frac{h(z)-h(c)}{z-c}=(z-c)f(z)\to 0$なので、$h$は$c$でも複素微分可能で$h'(c)=0$である。よって$h$は$s$の内部で正則である。

    $h(c)=h'(c)=0$なので、$c$の近傍で$h(z)=(z-c)^2g(z)$と書ける($g$は$c$の近傍で解析的)。$z\neq c$で$g(z)=f(z)$である。$c$の外では$g=f$と定めて、$s$で正則な$g$を得る。
  strategy: Apply the removable singularity idea to h = (z-c)^2 f, which is complex differentiable at c.
  sketch:
  - 'construct: h(z) = (z-c)^2 f(z), h(c) = 0.'
  - 'derive: The limit hypothesis makes h differentiable at c with h''(c) = 0.'
  - 'derive: h has a zero of order at least 2 at c, so h = (z-c)^2 g.'
  - 'conclude: g extends f.'
  openmath: (forall (f s c) (-> (and (neighbourhood_of s c) (holomorphic_on f (setdiff s (singleton_set c))) (fn_limit_at (lambda (z) (* (- z c) (fn_value f z))) c 0)) (exists (g) (and (holomorphic_on g s) (forall (z) (-> (and (in z s) (!= z c)) (= (fn_value g z) (fn_value f z))))))))
  hard_negative:
    statement: $z\to c$で$(z-c)f(z)$が有界なら、$c$は除去可能である。
    reason: $f(z)=1/(z-c)$では$(z-c)f(z)=1$は有界だが、$c$は極であり除去できない。
  target: |
    ∀ (f : ℂ → ℂ) (s : Set ℂ) (c : ℂ), s ∈ nhds c → DifferentiableOn ℂ f (s \ {c}) → Filter.Tendsto (fun z => (z - c) * f z) (nhdsWithin c {c}ᶜ) (nhds 0) → ∃ g : ℂ → ℂ, DifferentiableOn ℂ g s ∧ ∀ z ∈ s \ {c}, g z = f z
  proof: |
    by
      intro f s c hs hd hlim
      have ho : (fun z => f z - f c) =o[nhdsWithin c {c}ᶜ] fun z => (z - c)⁻¹ := by
        rw [Asymptotics.isLittleO_iff_tendsto']
        · have h1 : Filter.Tendsto (fun z => (z - c) * f c) (nhdsWithin c {c}ᶜ) (nhds 0) := by
            have : Filter.Tendsto (fun z => (z - c) * f c) (nhds c) (nhds ((c - c) * f c)) := by
              apply Continuous.tendsto
              fun_prop
            simpa using this.mono_left nhdsWithin_le_nhds
          have h2 := hlim.sub h1
          simp only [sub_zero] at h2
          refine h2.congr' ?_
          filter_upwards [self_mem_nhdsWithin] with z hz
          have : z - c ≠ 0 := sub_ne_zero.mpr hz
          change (z - c) * f z - (z - c) * f c = (f z - f c) / (z - c)⁻¹
          field_simp
        · filter_upwards [self_mem_nhdsWithin] with z hz h
          have : z - c ≠ 0 := sub_ne_zero.mpr hz
          exact absurd h (inv_ne_zero this)
      refine ⟨_, Complex.differentiableOn_update_limUnder_of_isLittleO hs hd ho, fun z hz => ?_⟩
      exact Function.update_of_ne hz.2 _ _
- id: casorati_weierstrass
  kind: named
  level: 3
  topic: 真性特異点・カゾラーティ・ワイエルシュトラスの定理
  statement: カゾラーティ・ワイエルシュトラスの定理。$r>0$とし、$f$は穴あき円板$0<|z-c|<r$で正則で$c$で有理型でない(除去可能でも極でもない)とする。このとき$f$の穴あき円板の像は$\mathbb{C}$で稠密である。
  statement_en: The Casorati-Weierstrass theorem. If r > 0, f is holomorphic on the punctured disc 0 < |z-c| < r and f is not meromorphic at c, then the image of the punctured disc under f is dense in the complex plane.
  assumptions:
  - $r>0$
  - $f$は穴あき円板で正則
  - $f$は$c$で有理型でない
  quantifiers:
  - 任意の$f,c,r$
  conclusion: 穴あき円板の像は$\mathbb{C}$で稠密である。
  answer: |-
    $r>0$、$f$を穴あき円板$0<|z-c|<r$で正則で$c$で有理型でない関数とし、像が稠密でないとする。$a\in\mathbb{C}$、$\varepsilon>0$があり、穴あき円板上で$|f-a|\geq\varepsilon$である。$h=1/(f-a)$は穴あき円板で正則で$|h|\leq 1/\varepsilon$である。リーマンの除去可能特異点定理により、$h$は円板で正則な$G$に拡張される。

    穴あき円板上で$G=h\neq 0$なので$G$は恒等的に$0$でなく、$f=a+1/G$である。正則関数の逆数は有理型なので、$f$は$c$で有理型である。これは仮定に反する。
  strategy: If the image misses a disc about a, then 1/(f-a) is bounded and extends, so f is meromorphic.
  sketch:
  - 'contradiction: Assume the image misses a disc about a.'
  - 'construct: h = 1/(f-a) is bounded on the punctured disc.'
  - 'apply_theorem: Riemann''s theorem extends h to G.'
  - 'conclude: f = a + 1/G is meromorphic at c.'
  openmath: (forall (f c r) (-> (and (> r 0) (holomorphic_on f (setdiff (open_disc c r) (singleton_set c))) (not (meromorphic_at f c))) (dense_in (image_of f (setdiff (open_disc c r) (singleton_set c))) C)))
  hard_negative:
    statement: $c$が極でも像は稠密である。
    reason: $f(z)=1/z$の穴あき単位円板の像は$|w|>1$であり、$0$の近くの値を取らない。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ) (r : ℝ), 0 < r → DifferentiableOn ℂ f (Metric.ball c r \ {c}) → ¬ MeromorphicAt f c → Dense (f '' (Metric.ball c r \ {c}))
  proof: |
    by
      intro f c r hr hd hm
      by_contra hnd
      rw [dense_iff_closure_eq] at hnd
      obtain ⟨a, ha⟩ : ∃ a, a ∉ closure (f '' (Metric.ball c r \ {c})) := by
        by_contra h
        push_neg at h
        exact hnd (Set.eq_univ_of_forall h)
      rw [Metric.mem_closure_iff] at ha
      push_neg at ha
      obtain ⟨ε, hε, hfar⟩ := ha
      have hfar' : ∀ z ∈ Metric.ball c r \ {c}, ε ≤ ‖f z - a‖ := fun z hz => by
        have := hfar (f z) ⟨z, hz, rfl⟩
        rwa [dist_comm, dist_eq_norm] at this
      have hne : ∀ z ∈ Metric.ball c r \ {c}, f z - a ≠ 0 := fun z hz h => by
        have := hfar' z hz
        rw [h, norm_zero] at this
        linarith
      have hg : DifferentiableOn ℂ (fun z => (f z - a)⁻¹) (Metric.ball c r \ {c}) := (hd.sub_const a).inv hne
      have hb : BddAbove (norm ∘ (fun z => (f z - a)⁻¹) '' (Metric.ball c r \ {c})) := by
        refine ⟨ε⁻¹, ?_⟩
        rintro _ ⟨z, hz, rfl⟩
        simp only [Function.comp_apply, norm_inv]
        exact inv_anti₀ hε (hfar' z hz)
      have hs : Metric.ball c r ∈ nhds c := Metric.ball_mem_nhds c hr
      have hG := Complex.differentiableOn_update_limUnder_of_bddAbove hs hg hb
      obtain ⟨G, hGd, hGe⟩ : ∃ G : ℂ → ℂ, DifferentiableOn ℂ G (Metric.ball c r) ∧ ∀ z, z ≠ c → G z = (f z - a)⁻¹ :=
        ⟨_, hG, fun z hz => Function.update_of_ne hz _ _⟩
      have hGa : AnalyticAt ℂ G c := hGd.analyticAt hs
      apply hm
      have h1 : MeromorphicAt (fun z => a + (G z)⁻¹) c := (MeromorphicAt.const a c).add hGa.meromorphicAt.inv
      refine h1.congr ?_
      have hev : ∀ᶠ z in nhdsWithin c {c}ᶜ, z ∈ Metric.ball c r \ {c} := by
        filter_upwards [nhdsWithin_le_nhds hs, self_mem_nhdsWithin] with z h1 h2
        exact ⟨h1, h2⟩
      filter_upwards [hev] with z hz
      have : G z = (f z - a)⁻¹ := hGe z hz.2
      simp [this]
- id: holomorphic_local_inverse
  kind: textbook
  level: 3
  topic: 局所単射・正則な逆関数
  statement: $f$が$c$で解析的で$f'(c)\neq 0$ならば、$f(c)$で解析的な$g$があり、$g(f(c))=c$、$g'(f(c))=1/f'(c)$で、$c$の近傍で$g(f(z))=z$、$f(c)$の近傍で$f(g(w))=w$である。
  statement_en: If f is analytic at c with f'(c) ≠ 0, then there is g analytic at f(c) with g(f(c)) = c, g'(f(c)) = 1/f'(c), g(f(z)) = z near c and f(g(w)) = w near f(c).
  assumptions:
  - $f$は$c$で解析的
  - $f'(c)\neq 0$
  quantifiers:
  - 任意の$f,c$
  conclusion: 局所的な解析的逆関数$g$が存在する。
  answer: |-
    $f$を$c$で解析的で$f'(c)\neq 0$を満たす関数とする。$f$を実2変数の写像と見ると$C^1$級で、$c$での実全微分は$f'(c)$倍写像であり、ヤコビ行列式は$|f'(c)|^2\neq 0$である。実の逆関数定理により、$c$の開近傍$V$と$f(c)$の開近傍$W$があり、$f:V\to W$は$C^1$級の逆写像$g$を持つ。

    $w_0\in W$、$z_0=g(w_0)$とする。$f'$は連続なので$V$を小さく取れば$V$上$f'\neq 0$である。$w\to w_0$で$z=g(w)\to z_0$であり、
    $\frac{g(w)-g(w_0)}{w-w_0}=\frac{z-z_0}{f(z)-f(z_0)}\to\frac{1}{f'(z_0)}$
    である。よって$g$は$W$で正則であり、解析的である。$g(f(c))=c$、$g'(f(c))=1/f'(c)$、および二つの恒等式は構成から従う。
  strategy: Apply the real inverse function theorem and check complex differentiability of the inverse by difference quotients.
  sketch:
  - 'apply_theorem: The real inverse function theorem gives a C^1 local inverse g.'
  - 'derive: The difference quotient of g is the reciprocal of that of f.'
  - 'conclude: g is holomorphic with g'' = 1/f''∘g.'
  openmath: (forall (f c) (-> (and (analytic_at f c) (!= (complex_deriv f c) 0)) (exists (g) (and (analytic_at g (fn_value f c)) (= (fn_value g (fn_value f c)) c) (= (complex_deriv g (fn_value f c)) (/ 1 (complex_deriv f c))) (eq_near (lambda (z) (fn_value g (fn_value f z))) (lambda (z) z) c) (eq_near (lambda (w) (fn_value f (fn_value g w))) (lambda (w) w) (fn_value f c))))))
  hard_negative:
    statement: $f'$が領域$U$上で$0$にならなければ、$f$は$U$全体で単射である。
    reason: $f(z)=e^z$は$f'\neq 0$だが$f(0)=f(2\pi i)$である。結論は局所的である。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ), AnalyticAt ℂ f c → deriv f c ≠ 0 → ∃ g : ℂ → ℂ, AnalyticAt ℂ g (f c) ∧ g (f c) = c ∧ deriv g (f c) = (deriv f c)⁻¹ ∧ (∀ᶠ z in nhds c, g (f z) = z) ∧ ∀ᶠ w in nhds (f c), f (g w) = w
  proof: |
    by
      intro f c hf h0
      have hs := hf.hasStrictDerivAt
      refine ⟨hs.localInverse _ _ _ h0, hf.analyticAt_localInverse h0, ?_, ?_, ?_, ?_⟩
      · exact (hs.hasStrictFDerivAt_equiv h0).localInverse_apply_image
      · exact (hs.to_localInverse h0).hasDerivAt.deriv
      · exact (hs.hasStrictFDerivAt_equiv h0).eventually_left_inverse
      · exact (hs.hasStrictFDerivAt_equiv h0).eventually_right_inverse
- id: injective_holomorphic_deriv_ne_zero
  kind: textbook
  level: 3
  topic: 局所単射・単射な正則関数の導関数
  statement: $U$を開集合、$f$を$U$で正則で単射とする。このとき$U$の全ての点で$f'\neq 0$である。
  statement_en: A holomorphic injective function on an open set has nowhere vanishing derivative.
  assumptions:
  - $U$は開集合
  - $f$は$U$で正則
  - $f$は$U$上で単射
  quantifiers:
  - 任意の$f,U$と任意の$c\in U$
  conclusion: $f'(c)\neq 0$である。
  answer: |-
    $U$を開集合、$f$を$U$で正則で単射な関数とし、$c\in U$で$f'(c)=0$とする。$G=f-f(c)$とおく。$G$が$c$の近傍で恒等的に$0$なら$f$は単射でない。よって$G$の$c$での位数$n$は有限で、$\operatorname{ord}_cf'+1=n$と$f'(c)=0$から$n\geq 2$である。

    位数$n$の零点の局所形により、$c$の近傍で$G=h^n$、$h(c)=0$、$h'(c)\neq 0$である。逆関数定理により$h$は$c$の近傍を$0$の近傍へ写す。$\zeta\neq 1$を$1$の$n$乗根とする。$0$に十分近い$w\neq 0$を取ると、$w$と$\zeta w$はともに$h$の値であり、$h(z_1)=w$、$h(z_2)=\zeta w$、$z_1,z_2\in U$である。$w\neq\zeta w$なので$z_1\neq z_2$であるが、$f(z_1)-f(c)=w^n=(\zeta w)^n=f(z_2)-f(c)$となり、単射性に矛盾する。
  strategy: A vanishing derivative makes f - f(c) an n-th power with n ≥ 2, and n-th roots of unity give two preimages.
  sketch:
  - 'contradiction: Assume f''(c) = 0.'
  - 'derive: f - f(c) has finite order n ≥ 2 at c.'
  - 'derive: Locally f - f(c) = h^n with h a local coordinate.'
  - 'conclude: w and ζw give distinct points with the same value of f.'
  openmath: (forall (f U c) (-> (and (open_set U) (holomorphic_on f U) (injective_on f U) (in c U)) (!= (complex_deriv f c) 0)))
  hard_negative:
    statement: 実関数でも同じことが成り立つ。実軸上で単射な微分可能関数の導関数は消えない。
    reason: $f(x)=x^3$は実数上で単射だが$f'(0)=0$である。
  target: |
    ∀ (f : ℂ → ℂ) (U : Set ℂ) (c : ℂ), IsOpen U → DifferentiableOn ℂ f U → Set.InjOn f U → c ∈ U → deriv f c ≠ 0
  proof: |
    by
      intro f U c hU hd hi hc h0
      have hcn := hU.mem_nhds hc
      have hfa : AnalyticAt ℂ f c := hd.analyticAt hcn
      set G : ℂ → ℂ := fun z => f z - f c with hG
      have hGa : AnalyticAt ℂ G c := hfa.sub analyticAt_const
      have htop : analyticOrderAt G c ≠ ⊤ := by
        intro ht
        rw [analyticOrderAt_eq_top] at ht
        obtain ⟨ε, hε, hb⟩ := Metric.eventually_nhds_iff_ball.mp (ht.and hcn)
        have hx : c + (ε / 2 : ℝ) ∈ Metric.ball c ε := by
          rw [mem_ball_iff_norm]
          simp [abs_of_pos hε]
          linarith
        have h1 := hb _ hx
        have h2 : f (c + (ε / 2 : ℝ)) = f c := sub_eq_zero.mp h1.1
        have h3 := hi h1.2 hc h2
        have : ((ε / 2 : ℝ) : ℂ) = 0 := by simpa using h3
        have h4 : ε / 2 = 0 := by exact_mod_cast this
        linarith
      obtain ⟨n, hn⟩ := ENat.ne_top_iff_exists.mp htop
      have hderiv : analyticOrderAt (deriv f) c + 1 = analyticOrderAt G c := hfa.analyticOrderAt_deriv_add_one
      have hdne : analyticOrderAt (deriv f) c ≠ 0 := by
        rw [analyticOrderAt_ne_zero]
        exact ⟨hfa.deriv, h0⟩
      have hn2 : 2 ≤ n := by
        rw [← hn] at hderiv
        by_contra hlt
        have hle : n = 0 ∨ n = 1 := by omega
        obtain ⟨m, hm⟩ : ∃ m : ℕ, analyticOrderAt (deriv f) c = m := by
          cases h : analyticOrderAt (deriv f) c with
          | top => rw [h] at hderiv; simp at hderiv
          | coe m => exact ⟨m, rfl⟩
        rw [hm] at hderiv hdne
        have hm0 : m ≠ 0 := by
          intro h
          apply hdne
          simp [h]
        have : m + 1 = n := by exact_mod_cast hderiv
        omega
      have hn0 : n ≠ 0 := by omega
      obtain ⟨g, hg, hg0, hfg⟩ := hGa.analyticOrderAt_eq_natCast.mp hn.symm
      obtain ⟨a, ha⟩ := IsAlgClosed.exists_pow_nat_eq (g c) (Nat.pos_of_ne_zero hn0)
      have ha0 : a ≠ 0 := by
        rintro rfl
        rw [zero_pow hn0] at ha
        exact hg0 ha.symm
      set q : ℂ → ℂ := fun z => g z / g c with hq
      have hqa : AnalyticAt ℂ q c := hg.div analyticAt_const hg0
      have hq1 : q c = 1 := div_self hg0
      have hslit : ∀ᶠ z in nhds c, q z ∈ Complex.slitPlane := by
        apply hqa.continuousAt.eventually_mem
        rw [hq1]
        exact Complex.isOpen_slitPlane.mem_nhds Complex.one_mem_slitPlane
      have hlog : AnalyticAt ℂ (fun z => Complex.log (q z)) c := hqa.clog (by rw [hq1]; exact Complex.one_mem_slitPlane)
      set φ : ℂ → ℂ := fun z => a * Complex.exp (Complex.log (q z) / n) with hφ
      have hφa : AnalyticAt ℂ φ c := analyticAt_const.mul ((hlog.div analyticAt_const (by exact_mod_cast hn0)).cexp)
      have hφc : φ c = a := by simp [hφ, hq1]
      have hn' : (n : ℂ) ≠ 0 := by exact_mod_cast hn0
      set h : ℂ → ℂ := fun z => (z - c) * φ z with hh
      have hha : AnalyticAt ℂ h c := (analyticAt_id.sub analyticAt_const).mul hφa
      have hhc : h c = 0 := by simp [hh]
      have hhd : HasDerivAt h a c := by
        have h1 : HasDerivAt h (1 * φ c + (c - c) * deriv φ c) c :=
          ((hasDerivAt_id c).sub_const c).mul hφa.differentiableAt.hasDerivAt
        simpa [hφc] using h1
      have hpow : ∀ᶠ z in nhds c, f z = h z ^ n + f c := by
        filter_upwards [hfg, hslit] with z hz hs
        have e1 : f z = G z + f c := by simp [hG]
        rw [e1, hz, smul_eq_mul]
        congr 1
        simp only [hh, mul_pow]
        congr 1
        simp only [hφ, mul_pow]
        rw [← Complex.exp_nat_mul, mul_div_cancel₀ _ hn', Complex.exp_log (Complex.slitPlane_ne_zero hs), ha]
        simp only [hq]
        field_simp
      have hmap : Filter.map h (nhds c) = nhds (h c) := (hha.hasStrictDerivAt.congr_deriv hhd.deriv).map_nhds_eq ha0
      rw [hhc] at hmap
      have hgood : ∀ᶠ z in nhds c, z ∈ U ∧ f z = h z ^ n + f c := Filter.Eventually.and hcn hpow
      have hS : {w | ∃ z, z ∈ U ∧ f z = h z ^ n + f c ∧ h z = w} ∈ nhds (0 : ℂ) := by
        rw [← hmap, Filter.mem_map]
        filter_upwards [hgood] with z hz
        exact ⟨z, hz.1, hz.2, rfl⟩
      have hprim := Complex.isPrimitiveRoot_exp n hn0
      set ζ := Complex.exp (2 * Real.pi * Complex.I / n) with hζ
      have hζ1 : ζ ≠ 1 := hprim.ne_one (by omega)
      have hζn : ζ ^ n = 1 := hprim.pow_eq_one
      have hS2 : ∀ᶠ w in nhds (0 : ℂ), ζ * w ∈ {w | ∃ z, z ∈ U ∧ f z = h z ^ n + f c ∧ h z = w} := by
        have ht : Filter.Tendsto (fun w : ℂ => ζ * w) (nhds 0) (nhds 0) := by
          have : Continuous (fun w : ℂ => ζ * w) := by fun_prop
          simpa using this.tendsto 0
        exact ht.eventually hS
      have hS3 : ∀ᶠ w in nhdsWithin (0 : ℂ) {0}ᶜ, w ≠ 0 ∧ w ∈ {w | ∃ z, z ∈ U ∧ f z = h z ^ n + f c ∧ h z = w} ∧ ζ * w ∈ {w | ∃ z, z ∈ U ∧ f z = h z ^ n + f c ∧ h z = w} := by
        filter_upwards [self_mem_nhdsWithin, nhdsWithin_le_nhds hS, nhdsWithin_le_nhds hS2] with w h1 h2 h3
        exact ⟨h1, h2, h3⟩
      obtain ⟨w, hw0, ⟨z₁, hz₁U, hz₁f, hz₁h⟩, ⟨z₂, hz₂U, hz₂f, hz₂h⟩⟩ := hS3.exists
      have hsame : f z₁ = f z₂ := by
        rw [hz₁f, hz₂f, hz₁h, hz₂h, mul_pow, hζn, one_mul]
      have heq := hi hz₁U hz₂U hsame
      rw [heq, hz₂h] at hz₁h
      have : (ζ - 1) * w = 0 := by linear_combination hz₁h
      rcases mul_eq_zero.mp this with h' | h'
      · exact hζ1 (sub_eq_zero.mp h')
      · exact hw0 h'
- id: injective_holomorphic_inverse_holomorphic
  kind: gap
  level: 3
  topic: 局所単射・単射な正則関数の逆関数
  statement: $U$を開集合、$f$を$U$で正則で単射とする。このとき$f(U)$は開集合であり、$f(U)$で正則な$g$があって$U$上で$g(f(z))=z$である。
  statement_en: If f is holomorphic and injective on an open set U, then f(U) is open and there is g holomorphic on f(U) with g(f(z)) = z on U.
  assumptions:
  - $U$は開集合
  - $f$は$U$で正則で単射
  quantifiers:
  - 任意の$f,U$
  conclusion: $f(U)$は開集合で、正則な逆関数$g$が存在する。
  answer: |-
    $U$を開集合、$f$を$U$で正則で単射な関数とする。単射な正則関数なので$U$上で$f'\neq 0$である。$z_0\in U$とする。局所的な逆関数の定理により、$z_0$の近傍$V\subset U$と$f(z_0)$の近傍$W$と解析的な$\phi:W\to V$があり、$f\circ\phi=\mathrm{id}_W$、$\phi\circ f=\mathrm{id}_V$である。$W\subset f(U)$なので$f(U)$は開集合である。

    $g$を$f(U)$上の$f$の逆写像とする($f$は単射なので定まる)。$w\in W$なら$\phi(w)\in U$、$f(\phi(w))=w$なので、単射性により$g(w)=\phi(w)$である。よって$g$は$W$で正則である。$z_0$は任意なので、$g$は$f(U)$で正則である。
  strategy: Use the nonvanishing derivative and the local inverse theorem; injectivity identifies the local inverses with the global one.
  sketch:
  - 'apply_theorem: f'' ≠ 0 on U by injectivity.'
  - 'apply_theorem: The local inverse theorem at each point shows f(U) is open.'
  - 'derive: The global inverse agrees with each local inverse.'
  - 'conclude: The inverse is holomorphic on f(U).'
  openmath: (forall (f U) (-> (and (open_set U) (holomorphic_on f U) (injective_on f U)) (and (open_set (image_of f U)) (exists (g) (and (holomorphic_on g (image_of f U)) (forall (z) (-> (in z U) (= (fn_value g (fn_value f z)) z))))))))
  hard_negative:
    statement: 正則でなく連続で単射でも逆関数は正則である。
    reason: $f(z)=\bar z$は連続で単射、逆関数も$\bar z$で正則でない。
  target: |
    ∀ (f : ℂ → ℂ) (U : Set ℂ), IsOpen U → DifferentiableOn ℂ f U → Set.InjOn f U → IsOpen (f '' U) ∧ ∃ g : ℂ → ℂ, DifferentiableOn ℂ g (f '' U) ∧ ∀ z ∈ U, g (f z) = z
  proof: |
    by
      intro f U hU hd hi
      have hne : ∀ c ∈ U, deriv f c ≠ 0 := by
        intro c hc h0
        have hcn := hU.mem_nhds hc
        have hfa : AnalyticAt ℂ f c := hd.analyticAt hcn
        set G : ℂ → ℂ := fun z => f z - f c with hG
        have hGa : AnalyticAt ℂ G c := hfa.sub analyticAt_const
        have htop : analyticOrderAt G c ≠ ⊤ := by
          intro ht
          rw [analyticOrderAt_eq_top] at ht
          obtain ⟨ε, hε, hb⟩ := Metric.eventually_nhds_iff_ball.mp (ht.and hcn)
          have hx : c + (ε / 2 : ℝ) ∈ Metric.ball c ε := by
            rw [mem_ball_iff_norm]
            simp [abs_of_pos hε]
            linarith
          have h1 := hb _ hx
          have h2 : f (c + (ε / 2 : ℝ)) = f c := sub_eq_zero.mp h1.1
          have h3 := hi h1.2 hc h2
          have : ((ε / 2 : ℝ) : ℂ) = 0 := by simpa using h3
          have h4 : ε / 2 = 0 := by exact_mod_cast this
          linarith
        obtain ⟨n, hn⟩ := ENat.ne_top_iff_exists.mp htop
        have hderiv : analyticOrderAt (deriv f) c + 1 = analyticOrderAt G c := hfa.analyticOrderAt_deriv_add_one
        have hdne : analyticOrderAt (deriv f) c ≠ 0 := by
          rw [analyticOrderAt_ne_zero]
          exact ⟨hfa.deriv, h0⟩
        have hn2 : 2 ≤ n := by
          rw [← hn] at hderiv
          by_contra hlt
          have hle : n = 0 ∨ n = 1 := by omega
          obtain ⟨m, hm⟩ : ∃ m : ℕ, analyticOrderAt (deriv f) c = m := by
            cases h : analyticOrderAt (deriv f) c with
            | top => rw [h] at hderiv; simp at hderiv
            | coe m => exact ⟨m, rfl⟩
          rw [hm] at hderiv hdne
          have hm0 : m ≠ 0 := by
            intro h
            apply hdne
            simp [h]
          have : m + 1 = n := by exact_mod_cast hderiv
          omega
        have hn0 : n ≠ 0 := by omega
        obtain ⟨g, hg, hg0, hfg⟩ := hGa.analyticOrderAt_eq_natCast.mp hn.symm
        obtain ⟨a, ha⟩ := IsAlgClosed.exists_pow_nat_eq (g c) (Nat.pos_of_ne_zero hn0)
        have ha0 : a ≠ 0 := by
          rintro rfl
          rw [zero_pow hn0] at ha
          exact hg0 ha.symm
        set q : ℂ → ℂ := fun z => g z / g c with hq
        have hqa : AnalyticAt ℂ q c := hg.div analyticAt_const hg0
        have hq1 : q c = 1 := div_self hg0
        have hslit : ∀ᶠ z in nhds c, q z ∈ Complex.slitPlane := by
          apply hqa.continuousAt.eventually_mem
          rw [hq1]
          exact Complex.isOpen_slitPlane.mem_nhds Complex.one_mem_slitPlane
        have hlog : AnalyticAt ℂ (fun z => Complex.log (q z)) c := hqa.clog (by rw [hq1]; exact Complex.one_mem_slitPlane)
        set φ : ℂ → ℂ := fun z => a * Complex.exp (Complex.log (q z) / n) with hφ
        have hφa : AnalyticAt ℂ φ c := analyticAt_const.mul ((hlog.div analyticAt_const (by exact_mod_cast hn0)).cexp)
        have hφc : φ c = a := by simp [hφ, hq1]
        have hn' : (n : ℂ) ≠ 0 := by exact_mod_cast hn0
        set h : ℂ → ℂ := fun z => (z - c) * φ z with hh
        have hha : AnalyticAt ℂ h c := (analyticAt_id.sub analyticAt_const).mul hφa
        have hhc : h c = 0 := by simp [hh]
        have hhd : HasDerivAt h a c := by
          have h1 : HasDerivAt h (1 * φ c + (c - c) * deriv φ c) c :=
            ((hasDerivAt_id c).sub_const c).mul hφa.differentiableAt.hasDerivAt
          simpa [hφc] using h1
        have hpow : ∀ᶠ z in nhds c, f z = h z ^ n + f c := by
          filter_upwards [hfg, hslit] with z hz hs
          have e1 : f z = G z + f c := by simp [hG]
          rw [e1, hz, smul_eq_mul]
          congr 1
          simp only [hh, mul_pow]
          congr 1
          simp only [hφ, mul_pow]
          rw [← Complex.exp_nat_mul, mul_div_cancel₀ _ hn', Complex.exp_log (Complex.slitPlane_ne_zero hs), ha]
          simp only [hq]
          field_simp
        have hmap : Filter.map h (nhds c) = nhds (h c) := (hha.hasStrictDerivAt.congr_deriv hhd.deriv).map_nhds_eq ha0
        rw [hhc] at hmap
        have hgood : ∀ᶠ z in nhds c, z ∈ U ∧ f z = h z ^ n + f c := Filter.Eventually.and hcn hpow
        have hS : {w | ∃ z, z ∈ U ∧ f z = h z ^ n + f c ∧ h z = w} ∈ nhds (0 : ℂ) := by
          rw [← hmap, Filter.mem_map]
          filter_upwards [hgood] with z hz
          exact ⟨z, hz.1, hz.2, rfl⟩
        have hprim := Complex.isPrimitiveRoot_exp n hn0
        set ζ := Complex.exp (2 * Real.pi * Complex.I / n) with hζ
        have hζ1 : ζ ≠ 1 := hprim.ne_one (by omega)
        have hζn : ζ ^ n = 1 := hprim.pow_eq_one
        have hS2 : ∀ᶠ w in nhds (0 : ℂ), ζ * w ∈ {w | ∃ z, z ∈ U ∧ f z = h z ^ n + f c ∧ h z = w} := by
          have ht : Filter.Tendsto (fun w : ℂ => ζ * w) (nhds 0) (nhds 0) := by
            have : Continuous (fun w : ℂ => ζ * w) := by fun_prop
            simpa using this.tendsto 0
          exact ht.eventually hS
        have hS3 : ∀ᶠ w in nhdsWithin (0 : ℂ) {0}ᶜ, w ≠ 0 ∧ w ∈ {w | ∃ z, z ∈ U ∧ f z = h z ^ n + f c ∧ h z = w} ∧ ζ * w ∈ {w | ∃ z, z ∈ U ∧ f z = h z ^ n + f c ∧ h z = w} := by
          filter_upwards [self_mem_nhdsWithin, nhdsWithin_le_nhds hS, nhdsWithin_le_nhds hS2] with w h1 h2 h3
          exact ⟨h1, h2, h3⟩
        obtain ⟨w, hw0, ⟨z₁, hz₁U, hz₁f, hz₁h⟩, ⟨z₂, hz₂U, hz₂f, hz₂h⟩⟩ := hS3.exists
        have hsame : f z₁ = f z₂ := by
          rw [hz₁f, hz₂f, hz₁h, hz₂h, mul_pow, hζn, one_mul]
        have heq := hi hz₁U hz₂U hsame
        rw [heq, hz₂h] at hz₁h
        have : (ζ - 1) * w = 0 := by linear_combination hz₁h
        rcases mul_eq_zero.mp this with h' | h'
        · exact hζ1 (sub_eq_zero.mp h')
        · exact hw0 h'
      have hmapn : ∀ z ∈ U, f '' U ∈ nhds (f z) := by
        intro z hz
        have hzn := hU.mem_nhds hz
        have ha := hd.analyticAt hzn
        have hs := ha.hasStrictDerivAt
        rw [← hs.map_nhds_eq (hne z hz)]
        exact Filter.image_mem_map hzn
      have hopen : IsOpen (f '' U) := by
        rw [isOpen_iff_mem_nhds]
        rintro _ ⟨z, hz, rfl⟩
        exact hmapn z hz
      refine ⟨hopen, Function.invFunOn f U, ?_, fun z hz => hi (Function.invFunOn_mem ⟨z, hz, rfl⟩) hz (Function.invFunOn_eq ⟨z, hz, rfl⟩)⟩
      rintro _ ⟨z, hz, rfl⟩
      have hzn := hU.mem_nhds hz
      have ha := hd.analyticAt hzn
      have hs := ha.hasStrictDerivAt
      have hL := hs.hasStrictFDerivAt_equiv (hne z hz)
      have hloc : AnalyticAt ℂ (hs.localInverse _ _ _ (hne z hz)) (f z) := ha.analyticAt_localInverse (hne z hz)
      have hr : ∀ᶠ w in nhds (f z), f (hs.localInverse _ _ _ (hne z hz) w) = w := hL.eventually_right_inverse
      have hmem : ∀ᶠ w in nhds (f z), hs.localInverse _ _ _ (hne z hz) w ∈ U := by
        have hc := hloc.continuousAt
        have h0 : hs.localInverse _ _ _ (hne z hz) (f z) = z := hL.localInverse_apply_image
        apply hc.eventually_mem
        rw [h0]
        exact hzn
      have heq : Function.invFunOn f U =ᶠ[nhds (f z)] hs.localInverse _ _ _ (hne z hz) := by
        filter_upwards [hr, hmem] with w h1 h2
        have hw : w ∈ f '' U := ⟨_, h2, h1⟩
        apply hi (Function.invFunOn_mem hw) h2
        rw [Function.invFunOn_eq hw, h1]
      exact (hloc.differentiableAt.congr_of_eventuallyEq heq).differentiableWithinAt
- id: local_min_modulus_constant_or_zero
  kind: gap
  level: 3
  topic: 最小値原理・局所形
  statement: $f$が$c$の近傍で正則で、$|f|$が$c$で局所最小ならば、$f$は$c$の近傍で定数であるか$f(c)=0$である。
  statement_en: If f is holomorphic near c and |f| has a local minimum at c, then f is constant near c or f(c) = 0.
  assumptions:
  - $f$は$c$の近傍で正則
  - $c$の近傍で$|f(c)|\leq|f(z)|$
  quantifiers:
  - 任意の$f,c$
  conclusion: $c$の近傍で$f=f(c)$であるか、$f(c)=0$である。
  answer: $f$を$c$の近傍で正則で$c$の近傍で$|f(c)|\leq|f(z)|$を満たす関数とし、$f(c)\neq 0$とする。$c$の近傍で$|f|\geq|f(c)|>0$なので$g=1/f$は正則であり、$|g(z)|\leq|g(c)|$である。$c$を中心とする円板$D$をこの近傍の中に取る。連結開集合$D$上で正則な$g$の絶対値が内部の点$c$で最大値を取るので、最大値原理により$g$は$D$で定数である。よって$f$も$D$で定数で、$f=f(c)$である。
  strategy: Apply the maximum modulus principle to 1/f.
  sketch:
  - 'case_split: Assume f(c) ≠ 0.'
  - 'construct: 1/f is holomorphic near c with a local maximum of modulus at c.'
  - 'apply_theorem: The maximum modulus principle on a small disc.'
  - 'conclude: f is constant near c.'
  openmath: (forall (f c) (-> (and (analytic_at f c) (exists (s) (and (> s 0) (forall (z) (-> (in z (open_disc c s)) (<= (abs (fn_value f c)) (abs (fn_value f z))))))))  (or (eq_near (lambda (z) (fn_value f z)) (lambda (z) (fn_value f c)) c) (= (fn_value f c) 0))))
  hard_negative:
    statement: $|f|$が$c$で局所最小なら$f$は$c$の近傍で定数である。
    reason: $f(z)=z$、$c=0$では$|f|$は$0$で最小だが定数でない。$f(c)=0$の場合を除く必要がある。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ), (∀ᶠ z in nhds c, DifferentiableAt ℂ f z) → (∀ᶠ z in nhds c, ‖f c‖ ≤ ‖f z‖) → (∀ᶠ z in nhds c, f z = f c) ∨ f c = 0
  proof: |
    by
      intro f c hd hm
      exact Complex.eventually_eq_or_eq_zero_of_isLocalMin_norm hd hm
- id: min_modulus_bounded_by_boundary
  kind: gap
  level: 3
  topic: 最小値原理・有界集合
  statement: $U$を有界集合、$f$を$U$で正則で$\overline{U}$で連続とし、$\overline{U}$上で$f\neq 0$とする。$\partial U$上で$m\leq|f|$なら$\overline{U}$上で$m\leq|f|$である。
  statement_en: If U is bounded, f is holomorphic on U and continuous on its closure without zeros there, and m ≤ |f| on the boundary of U, then m ≤ |f| on the closure of U.
  assumptions:
  - $U$は有界
  - $f$は$U$で正則で$\overline{U}$で連続
  - $\overline{U}$上で$f\neq 0$
  - $\partial U$上で$m\leq|f|$
  quantifiers:
  - 任意の$f,U,m$
  conclusion: $\overline{U}$上で$m\leq|f|$である。
  answer: $U$を有界集合、$f$を$U$で正則で$\overline{U}$で連続かつ$\overline{U}$上で零点を持たない関数、$m$を$\partial U$上で$m\leq|f|$を満たす実数とする。$m\leq 0$なら自明である。$m>0$とする。$g=1/f$は$U$で正則で$\overline{U}$で連続であり、$\partial U$上で$|g|\leq 1/m$である。有界集合に対する最大値原理により$\overline{U}$上で$|g|\leq 1/m$である。逆数を取ると$\overline{U}$上で$|f|\geq m$である。
  strategy: Apply the boundary maximum principle to 1/f.
  sketch:
  - 'case_split: The case m ≤ 0 is trivial.'
  - 'construct: g = 1/f satisfies |g| ≤ 1/m on the boundary.'
  - 'apply_theorem: The maximum principle gives |g| ≤ 1/m on the closure.'
  openmath: (forall (f U b) (-> (and (bounded_set U) (holomorphic_on f U) (continuous_on_set f (set_closure U)) (forall (z) (-> (in z (set_closure U)) (!= (fn_value f z) 0))) (forall (z) (-> (in z (set_frontier U)) (<= b (abs (fn_value f z)))))) (forall (z) (-> (in z (set_closure U)) (<= b (abs (fn_value f z)))))))
  hard_negative:
    statement: $\overline{U}$内に零点があっても同じ結論が成り立つ。
    reason: $U$を単位円板、$f(z)=z$、$m=1$とすると$\partial U$上で$|f|=1$だが、$z=0$で$|f|=0<1$である。
  target: |
    ∀ (f : ℂ → ℂ) (U : Set ℂ) (m : ℝ), Bornology.IsBounded U → DiffContOnCl ℂ f U → (∀ z ∈ closure U, f z ≠ 0) → (∀ z ∈ frontier U, m ≤ ‖f z‖) → ∀ z ∈ closure U, m ≤ ‖f z‖
  proof: |
    by
      intro f U m hU hf h0 hm z hz
      by_cases hm0 : m ≤ 0
      · exact hm0.trans (norm_nonneg _)
      have hm1 : 0 < m := not_le.mp hm0
      have hinv : DiffContOnCl ℂ (fun z => (f z)⁻¹) U := by
        refine ⟨hf.differentiableOn.inv (fun x hx => h0 x (subset_closure hx)), hf.continuousOn.inv₀ h0⟩
      have h1 := Complex.norm_le_of_forall_mem_frontier_norm_le hU hinv (C := m⁻¹) (fun x hx => by
        rw [norm_inv]
        exact inv_anti₀ hm1 (hm x hx)) hz
      rw [norm_inv] at h1
      have hp : 0 < ‖f z‖ := norm_pos_iff.mpr (h0 z hz)
      exact (inv_le_inv₀ hp hm1).mp h1
- id: quantitative_open_mapping
  kind: gap
  level: 3
  topic: 開写像定理・定量形
  statement: $r>0$とし、$f$は$|z-c|<r$で正則で閉円板で連続、円周$|z-c|=r$上で$\varepsilon\leq|f(z)-f(c)|$とする。このとき$f$の閉円板の像は円板$|w-f(c)|<\varepsilon/2$を含む。
  statement_en: If r > 0, f is holomorphic on |z-c| < r and continuous on the closed disc and ε ≤ |f(z) - f(c)| on the circle, then the image of the closed disc contains the disc |w - f(c)| < ε/2.
  assumptions:
  - $r>0$
  - $f$は開円板で正則で閉円板で連続
  - 円周上で$\varepsilon\leq|f(z)-f(c)|$
  quantifiers:
  - 任意の$f,c,r,\varepsilon$
  conclusion: 円板$|w-f(c)|<\varepsilon/2$は$f$の閉円板の像に含まれる。
  answer: |-
    $r>0$、$f$を開円板$|z-c|<r$で正則で閉円板で連続な関数で、円周$|z-c|=r$上で$\varepsilon\leq|f(z)-f(c)|$を満たすものとし、$|v-f(c)|<\varepsilon/2$とする。$f(z)=v$なる$z$が閉円板にないとして矛盾を導く。$g=1/(f-v)$は開円板で正則で閉円板で連続である。円周上で
    $|f(z)-v|\geq|f(z)-f(c)|-|f(c)-v|>\varepsilon/2$
    なので$|g|\leq 2/\varepsilon$である。最大値原理により$|g(c)|\leq 2/\varepsilon$、すなわち$|f(c)-v|\geq\varepsilon/2$である。これは$v$の取り方に反する。
  strategy: If v is missed, the maximum principle applied to 1/(f-v) forces |f(c)-v| ≥ ε/2.
  sketch:
  - 'contradiction: Suppose f - v has no zero on the closed disc.'
  - 'derive: On the circle |f - v| > ε/2.'
  - 'apply_theorem: The maximum principle for 1/(f-v) at the centre.'
  - 'conclude: |f(c) - v| ≥ ε/2, a contradiction.'
  openmath: (forall (f c r e) (-> (and (> r 0) (holomorphic_on f (open_disc c r)) (continuous_on_set f (closed_disc c r)) (forall (z) (-> (in z (circle_set c r)) (<= e (abs (- (fn_value f z) (fn_value f c))))))) (subset (open_disc (fn_value f c) (/ e 2)) (image_of f (closed_disc c r)))))
  hard_negative:
    statement: $|f(z)-f(c)|$が円周上で$\varepsilon$以上なら、$f$は閉円板で単射である。
    reason: $f(z)=z^2$、$c=0$、$r=1$では円周上で$|f|=1$だが、$f(1/2)=f(-1/2)$である。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ) (r ε : ℝ), 0 < r → DiffContOnCl ℂ f (Metric.ball c r) → (∀ z ∈ Metric.sphere c r, ε ≤ ‖f z - f c‖) → Metric.ball (f c) (ε / 2) ⊆ f '' Metric.closedBall c r
  proof: |
    by
      intro f c r ε hr hf hs v hv
      by_contra hno
      have hcl : closure (Metric.ball c r) = Metric.closedBall c r := closure_ball c hr.ne'
      have hne : ∀ z ∈ Metric.closedBall c r, f z - v ≠ 0 := by
        intro z hz h
        exact hno ⟨z, hz, sub_eq_zero.mp h⟩
      have hinv : DiffContOnCl ℂ (fun z => (f z - v)⁻¹) (Metric.ball c r) := by
        refine ⟨(hf.differentiableOn.sub_const v).inv (fun z hz => hne z (Metric.ball_subset_closedBall hz)), ?_⟩
        rw [hcl]
        have hc : ContinuousOn f (Metric.closedBall c r) := by
          rw [← hcl]; exact hf.continuousOn
        exact (hc.sub continuousOn_const).inv₀ hne
      have hdist : ‖f c - v‖ < ε / 2 := by
        have := Metric.mem_ball.mp hv
        rwa [dist_comm, dist_eq_norm] at this
      have hε : 0 < ε / 2 := lt_of_le_of_lt (norm_nonneg _) hdist
      have hbd := Complex.norm_le_of_forall_mem_frontier_norm_le (U := Metric.ball c r) (z := c) Metric.isBounded_ball hinv (C := (ε / 2)⁻¹) (by
        intro z hz
        rw [frontier_ball c hr.ne'] at hz
        simp only [norm_inv]
        apply inv_anti₀ hε
        have h1 := hs z hz
        have h2 : ‖f z - f c‖ ≤ ‖f z - v‖ + ‖f c - v‖ := by
          have e : f z - f c = (f z - v) - (f c - v) := by ring
          rw [e]
          exact norm_sub_le _ _
        linarith) (subset_closure (Metric.mem_ball_self hr))
      rw [norm_inv] at hbd
      have hp : 0 < ‖f c - v‖ := norm_pos_iff.mpr (hne c (Metric.mem_closedBall_self hr.le))
      have := (inv_le_inv₀ hp hε).mp hbd
      linarith
- id: real_part_maximum_principle
  kind: gap
  level: 3
  topic: 最大値原理・実部
  statement: $U$を連結開集合、$f$を$U$で正則とする。$\operatorname{Re}f$が$U$の点$c$で最大値を取るならば、$f$は$U$で定数である。
  statement_en: If f is holomorphic on a connected open set U and Re f attains its maximum over U at c in U, then f is constant on U.
  assumptions:
  - $U$は連結開集合で$c\in U$
  - $f$は$U$で正則
  - 全ての$z\in U$で$\operatorname{Re}f(z)\leq\operatorname{Re}f(c)$
  quantifiers:
  - 任意の$f,U,c$と任意の$z\in U$
  conclusion: $f(z)=f(c)$である。
  answer: $U$を連結開集合、$f$を$U$で正則な関数で、$\operatorname{Re}f$が$c\in U$で最大値を取るものとする。$g=e^f$は$U$で正則で$|g|=e^{\operatorname{Re}f}$なので、$|g|$は$c$で最大値を取る。最大値原理により$g$は$U$で定数である。$0=g'=f'g$で$g\neq 0$なので$U$上で$f'=0$である。$U$は連結なので$f$は定数である。
  strategy: Pass to exp f and apply the maximum modulus principle.
  sketch:
  - 'construct: g = exp f has |g| = exp(Re f).'
  - 'apply_theorem: The maximum modulus principle makes g constant.'
  - 'derive: g'' = f'' g = 0 gives f'' = 0.'
  - 'conclude: f is constant.'
  openmath: (forall (f U c) (-> (and (open_set U) (connected_set U) (in c U) (holomorphic_on f U) (forall (z) (-> (in z U) (<= (real_part (fn_value f z)) (real_part (fn_value f c)))))) (forall (z) (-> (in z U) (= (fn_value f z) (fn_value f c))))))
  hard_negative:
    statement: $\operatorname{Re}f$が$U$上で下に有界なら$f$は定数である。
    reason: $U$を右半平面、$f(z)=z$とすると$\operatorname{Re}f>0$だが定数でない。
  target: |
    ∀ (f : ℂ → ℂ) (U : Set ℂ) (c : ℂ), IsOpen U → IsPreconnected U → c ∈ U → DifferentiableOn ℂ f U → (∀ z ∈ U, (f z).re ≤ (f c).re) → ∀ z ∈ U, f z = f c
  proof: |
    by
      intro f U c hU hp hc hf hm
      have hg : DifferentiableOn ℂ (fun z => Complex.exp (f z)) U := hf.cexp
      have hmax : IsMaxOn (norm ∘ fun z => Complex.exp (f z)) U c := by
        intro z hz
        simp only [Set.mem_setOf_eq, Function.comp_apply, Complex.norm_exp]
        exact Real.exp_le_exp.mpr (hm z hz)
      have he := Complex.eqOn_of_isPreconnected_of_isMaxOn_norm hp hU hg hc hmax
      have hd : Set.EqOn (deriv f) 0 U := by
        intro x hx
        have hxn := hU.mem_nhds hx
        have h1 : HasDerivAt (fun z => Complex.exp (f z)) (Complex.exp (f x) * deriv f x) x := (hf.differentiableAt hxn).hasDerivAt.cexp
        have h2 : HasDerivAt (fun z => Complex.exp (f z)) 0 x := by
          have : (fun z => Complex.exp (f z)) =ᶠ[nhds x] fun _ => Complex.exp (f c) := by
            filter_upwards [hxn] with y hy using he hy
          exact (hasDerivAt_const x _).congr_of_eventuallyEq this
        have h3 := h1.unique h2
        exact (mul_eq_zero.mp h3).resolve_left (Complex.exp_ne_zero _)
      intro z hz
      exact hU.is_const_of_deriv_eq_zero hp hf hd hz hc
- id: hadamard_three_circles
  kind: named
  level: 4
  topic: アダマールの三円定理
  statement: アダマールの三円定理。$0<r_1<r_2$とし、$f$は開円環$r_1<|z|<r_2$で正則で閉円環で連続、$|z|=r_1$で$|f|\leq a$、$|z|=r_2$で$|f|\leq b$とする。閉円環の点$z$について、$t=\log(|z|/r_1)/\log(r_2/r_1)$とおくと$|f(z)|\leq a^{1-t}b^t$である(ただし$0^0=1$とする)。
  statement_en: Hadamard's three circles theorem. If 0 < r_1 < r_2, f is holomorphic on the open annulus and continuous on the closed annulus, |f| ≤ a on |z| = r_1 and |f| ≤ b on |z| = r_2, then for z in the closed annulus and t = log(|z|/r_1)/log(r_2/r_1), |f(z)| ≤ a^(1-t) b^t.
  assumptions:
  - $0<r_1<r_2$
  - $f$は開円環で正則で閉円環で連続
  - $|z|=r_1$で$|f|\leq a$、$|z|=r_2$で$|f|\leq b$
  - $r_1\leq|z|\leq r_2$
  quantifiers:
  - 任意の$f,r_1,r_2,a,b,z$
  conclusion: $|f(z)|\leq a^{1-t}b^t$である。
  answer: |-
    $0<r_1<r_2$、$f$を開円環$r_1<|z|<r_2$で正則で閉円環で連続な関数で、$|z|=r_1$で$|f|\leq a$、$|z|=r_2$で$|f|\leq b$を満たすもの、$z$を閉円環の点、$t=\log(|z|/r_1)/\log(r_2/r_1)$とする。$l=\log r_1$、$u=\log r_2$とし、$g(w)=f(e^w)$を帯$l\leq\operatorname{Re}w\leq u$で考える。$|e^w|=e^{\operatorname{Re}w}$なので、$e^w$は開帯を開円環へ、閉帯を閉円環へ写す。よって$g$は開帯で正則で閉帯で連続である。閉円環はコンパクトなので$|f|$は有界で、$g$も閉帯で有界である。$\operatorname{Re}w=l$で$|g|\leq a$、$\operatorname{Re}w=u$で$|g|\leq b$である。

    アダマールの三線定理により、閉帯の点$w$で$|g(w)|\leq a^{1-s}b^s$、$s=(\operatorname{Re}w-l)/(u-l)$である。$z\neq 0$なので$w=\log z$(主値)を取ると$e^w=z$、$\operatorname{Re}w=\log|z|$であり、$s=t$である。これが結論である。
  strategy: Pull back to a vertical strip by the exponential and apply the three lines theorem.
  sketch:
  - 'construct: g(w) = f(e^w) on the strip log r_1 ≤ Re w ≤ log r_2.'
  - 'derive: g is bounded on the closed strip by compactness of the annulus.'
  - 'apply_theorem: Hadamard''s three lines theorem.'
  - 'conclude: Substitute w = log z.'
  openmath: (forall (f s t a b z) (-> (and (< 0 s) (< s t) (holomorphic_on f (annulus_about 0 s t)) (continuous_on_set f (closed_annulus_about 0 s t)) (forall (w) (-> (= (abs w) s) (<= (abs (fn_value f w)) a))) (forall (w) (-> (= (abs w) t) (<= (abs (fn_value f w)) b))) (<= s (abs z)) (<= (abs z) t)) (<= (abs (fn_value f z)) (* (^ a (- 1 (/ (ln (/ (abs z) s)) (ln (/ t s))))) (^ b (/ (ln (/ (abs z) s)) (ln (/ t s))))))))
  hard_negative:
    statement: $t=(|z|-r_1)/(r_2-r_1)$と線形の補間で同じ評価が成り立つ。
    reason: $f(z)=z$、$r_1=1$、$r_2=e^2$、$a=1$、$b=e^2$、$|z|=e$では、線形の補間の$t=(e-1)/(e^2-1)\approx 0.27$で$a^{1-t}b^t=e^{2t}\approx 1.71$だが、$|f(z)|=e\approx 2.72$である。
  target: |
    ∀ (f : ℂ → ℂ) (r₁ r₂ a b : ℝ) (z : ℂ), 0 < r₁ → r₁ < r₂ → DifferentiableOn ℂ f {w : ℂ | r₁ < ‖w‖ ∧ ‖w‖ < r₂} → ContinuousOn f {w : ℂ | r₁ ≤ ‖w‖ ∧ ‖w‖ ≤ r₂} → (∀ w : ℂ, ‖w‖ = r₁ → ‖f w‖ ≤ a) → (∀ w : ℂ, ‖w‖ = r₂ → ‖f w‖ ≤ b) → r₁ ≤ ‖z‖ → ‖z‖ ≤ r₂ → ‖f z‖ ≤ a ^ (1 - Real.log (‖z‖ / r₁) / Real.log (r₂ / r₁)) * b ^ (Real.log (‖z‖ / r₁) / Real.log (r₂ / r₁))
  proof: |
    by
      intro f r₁ r₂ a b z h1 h12 hd hc ha hb hz1 hz2
      have h2 : 0 < r₂ := h1.trans h12
      have hl : Real.log r₁ < Real.log r₂ := Real.log_lt_log h1 h12
      have hz0 : z ≠ 0 := by
        intro h
        rw [h, norm_zero] at hz1
        linarith
      have hzpos : 0 < ‖z‖ := norm_pos_iff.mpr hz0
      set g : ℂ → ℂ := fun w => f (Complex.exp w) with hg
      have hmaps : ∀ w : ℂ, w ∈ Complex.re ⁻¹' Set.Icc (Real.log r₁) (Real.log r₂) → r₁ ≤ ‖Complex.exp w‖ ∧ ‖Complex.exp w‖ ≤ r₂ := by
        rintro w ⟨hw1, hw2⟩
        rw [Complex.norm_exp]
        exact ⟨by
          calc r₁ = Real.exp (Real.log r₁) := (Real.exp_log h1).symm
            _ ≤ Real.exp w.re := Real.exp_le_exp.mpr hw1, by
          calc Real.exp w.re ≤ Real.exp (Real.log r₂) := Real.exp_le_exp.mpr hw2
            _ = r₂ := Real.exp_log h2⟩
      have hmapso : ∀ w : ℂ, w ∈ Complex.re ⁻¹' Set.Ioo (Real.log r₁) (Real.log r₂) → r₁ < ‖Complex.exp w‖ ∧ ‖Complex.exp w‖ < r₂ := by
        rintro w ⟨hw1, hw2⟩
        rw [Complex.norm_exp]
        constructor
        · calc r₁ = Real.exp (Real.log r₁) := (Real.exp_log h1).symm
            _ < Real.exp w.re := Real.exp_lt_exp.mpr hw1
        · calc Real.exp w.re < Real.exp (Real.log r₂) := Real.exp_lt_exp.mpr hw2
            _ = r₂ := Real.exp_log h2
      have hcl : closure (Complex.re ⁻¹' Set.Ioo (Real.log r₁) (Real.log r₂)) = Complex.re ⁻¹' Set.Icc (Real.log r₁) (Real.log r₂) := by
        rw [Complex.closure_preimage_re, closure_Ioo hl.ne]
      have hgd : DiffContOnCl ℂ g (Complex.re ⁻¹' Set.Ioo (Real.log r₁) (Real.log r₂)) := by
        refine ⟨?_, ?_⟩
        · intro w hw
          have hw' := hmapso w hw
          have hopen : IsOpen {w : ℂ | r₁ < ‖w‖ ∧ ‖w‖ < r₂} :=
            (isOpen_lt continuous_const continuous_norm).inter (isOpen_lt continuous_norm continuous_const)
          have hfd := hd.differentiableAt (hopen.mem_nhds hw')
          exact (hfd.comp w Complex.differentiableAt_exp).differentiableWithinAt
        · rw [hcl]
          exact hc.comp Complex.continuous_exp.continuousOn hmaps
      have hcompact : IsCompact {w : ℂ | r₁ ≤ ‖w‖ ∧ ‖w‖ ≤ r₂} := by
        apply Metric.isCompact_of_isClosed_isBounded
        · exact (isClosed_le continuous_const continuous_norm).inter (isClosed_le continuous_norm continuous_const)
        · exact (Metric.isBounded_closedBall (x := (0 : ℂ)) (r := r₂)).subset (fun w hw => by simpa using hw.2)
      obtain ⟨K, hK⟩ := hcompact.exists_bound_of_continuousOn hc
      have hB : BddAbove ((norm ∘ g) '' (Complex.re ⁻¹' Set.Icc (Real.log r₁) (Real.log r₂))) := by
        refine ⟨K, ?_⟩
        rintro _ ⟨w, hw, rfl⟩
        exact hK _ (hmaps w hw)
      set w := Complex.log z with hw
      have hexp : Complex.exp w = z := Complex.exp_log hz0
      have hre : w.re = Real.log ‖z‖ := Complex.log_re z
      have hedge1 : ∀ x : ℂ, x.re = Real.log r₁ → ‖g x‖ ≤ a := by
        intro x hx
        apply ha
        rw [Complex.norm_exp, hx, Real.exp_log h1]
      have hedge2 : ∀ x : ℂ, x.re = Real.log r₂ → ‖g x‖ ≤ b := by
        intro x hx
        apply hb
        rw [Complex.norm_exp, hx, Real.exp_log h2]
      have hmem : w ∈ Complex.re ⁻¹' Set.Icc (Real.log r₁) (Real.log r₂) := by
        constructor
        · change Real.log r₁ ≤ w.re
          rw [hre]; exact Real.log_le_log h1 hz1
        · change w.re ≤ Real.log r₂
          rw [hre]; exact Real.log_le_log hzpos hz2
      have key := Complex.HadamardThreeLines.norm_le_interp_of_mem_verticalClosedStrip' hl hmem hgd hB (fun x hx => hedge1 x hx) (fun x hx => hedge2 x hx)
      have ht : (w.re - Real.log r₁) / (Real.log r₂ - Real.log r₁) = Real.log (‖z‖ / r₁) / Real.log (r₂ / r₁) := by
        rw [hre, Real.log_div hzpos.ne' h1.ne', Real.log_div h2.ne' h1.ne']
      rw [ht] at key
      simpa [hg, hexp] using key
- id: schwarz_lemma_radii_form
  kind: gap
  level: 3
  topic: シュワルツの補題・半径つきの形
  statement: $f$が円板$|z-c|<R_1$で正則で、その像が閉円板$|w-f(c)|\leq R_2$に含まれるならば、$|z-c|<R_1$で$|f(z)-f(c)|\leq\frac{R_2}{R_1}|z-c|$である。単位円板で$f(0)=0$の場合の一般形である。
  statement_en: General form of the Schwarz lemma with centre and radii. If f is holomorphic on |z-c| < R_1 with values in |w-f(c)| ≤ R_2, then |f(z)-f(c)| ≤ (R_2/R_1)|z-c| on the disc.
  assumptions:
  - $f$は$|z-c|<R_1$で正則
  - 円板の像は$|w-f(c)|\leq R_2$に含まれる
  - $|z-c|<R_1$
  quantifiers:
  - 任意の$f,c,z,R_1,R_2$
  conclusion: $|f(z)-f(c)|\leq\frac{R_2}{R_1}|z-c|$である。
  answer: $f$を円板$|z-c|<R_1$で正則で値が閉円板$|w-f(c)|\leq R_2$に含まれる関数、$z$を$|z-c|<R_1$なる点とする。$z=c$なら自明である。$g(w)=(f(w)-f(c))/(w-c)$($w\neq c$)、$g(c)=f'(c)$は円板で正則である。$|z-c|<r<R_1$なる$r$を取る。円周$|w-c|=r$上で$|g(w)|\leq R_2/r$である。最大値原理により$|g(z)|\leq R_2/r$である。$r\uparrow R_1$として$|g(z)|\leq R_2/R_1$を得る。すなわち$|f(z)-f(c)|\leq\frac{R_2}{R_1}|z-c|$である。
  strategy: Apply the maximum principle to the difference quotient on circles of radius r and let r tend to R_1.
  sketch:
  - 'construct: The difference quotient g extends holomorphically to the disc.'
  - 'derive: On |w-c| = r, |g| ≤ R_2/r.'
  - 'apply_theorem: The maximum principle gives |g(z)| ≤ R_2/r.'
  - 'conclude: Let r tend to R_1.'
  openmath: (forall (f c z s t) (-> (and (holomorphic_on f (open_disc c s)) (forall (w) (-> (in w (open_disc c s)) (in (fn_value f w) (closed_disc (fn_value f c) t)))) (in z (open_disc c s))) (<= (abs (- (fn_value f z) (fn_value f c))) (* (/ t s) (abs (- z c))))))
  hard_negative:
    statement: 比の定数は$R_1/R_2$である。
    reason: $f(z)=2z$、$c=0$、$R_1=1$、$R_2=2$では$|f(z)|=2|z|$であり、$R_1/R_2=1/2$倍では成り立たない。
  target: |
    ∀ (f : ℂ → ℂ) (c z : ℂ) (R₁ R₂ : ℝ), DifferentiableOn ℂ f (Metric.ball c R₁) → Set.MapsTo f (Metric.ball c R₁) (Metric.closedBall (f c) R₂) → z ∈ Metric.ball c R₁ → dist (f z) (f c) ≤ R₂ / R₁ * dist z c
  proof: |
    by
      intro f c z R₁ R₂ hd hm hz
      exact Complex.dist_le_div_mul_dist_of_mapsTo_ball hd hm hz
- id: schwarz_lemma_higher_order_zero
  kind: gap
  level: 3
  topic: シュワルツの補題・高位の零点
  statement: $f$は$|z|<R_1$で正則で$|f|\leq R_2$とし、$k<n$で$f^{(k)}(0)=0$とする。このとき$|z|<R_1$で$|f(z)|\leq R_2(|z|/R_1)^n$である。
  statement_en: If f is holomorphic on |z| < R_1 with |f| ≤ R_2 and f^(k)(0) = 0 for k < n, then |f(z)| ≤ R_2 (|z|/R_1)^n on the disc.
  assumptions:
  - $f$は$|z|<R_1$で正則
  - 円板で$|f|\leq R_2$
  - $k<n$で$f^{(k)}(0)=0$
  - $|z|<R_1$
  quantifiers:
  - 任意の$f,n,R_1,R_2,z$
  conclusion: $|f(z)|\leq R_2(|z|/R_1)^n$である。
  answer: $f$を$|z|<R_1$で正則で$|f|\leq R_2$を満たし$k<n$で$f^{(k)}(0)=0$となる関数、$z$を$|z|<R_1$なる点とする。$n=0$なら仮定そのものである。$n\geq 1$とする。テイラー展開$f(w)=\sum_{k\geq n}a_kw^k$より、$g(w)=\sum_{k\geq n}a_kw^{k-n}$は円板で正則で$f(w)=w^ng(w)$である。$|z|<r<R_1$なる$r$を取る。$|w|=r$で$|g(w)|=|f(w)|/r^n\leq R_2/r^n$である。最大値原理により$|g(z)|\leq R_2/r^n$である。$r\uparrow R_1$として$|g(z)|\leq R_2/R_1^n$であり、$|f(z)|=|z|^n|g(z)|\leq R_2(|z|/R_1)^n$である。
  strategy: Divide by z^n and apply the maximum principle on circles.
  sketch:
  - 'derive: f(w) = w^n g(w) with g holomorphic.'
  - 'apply_theorem: The maximum principle on |w| = r bounds |g(z)| by R_2/r^n.'
  - 'conclude: Let r tend to R_1 and multiply by |z|^n.'
  openmath: (forall (f n s t z) (-> (and (in n N) (holomorphic_on f (open_disc 0 s)) (forall (w) (-> (in w (open_disc 0 s)) (<= (abs (fn_value f w)) t))) (forall (k) (-> (and (in k N) (< k n)) (= (iterated_complex_deriv k f 0) 0))) (< (abs z) s)) (<= (abs (fn_value f z)) (* t (^ (/ (abs z) s) n)))))
  hard_negative:
    statement: $f(0)=0$だけで$|f(z)|\leq R_2(|z|/R_1)^2$である。
    reason: $f(z)=z$、$R_1=R_2=1$では$|f(z)|=|z|>|z|^2$($0<|z|<1$)である。
  target: |
    ∀ (f : ℂ → ℂ) (n : ℕ) (R₁ R₂ : ℝ) (z : ℂ), DifferentiableOn ℂ f (Metric.ball 0 R₁) → Set.MapsTo f (Metric.ball 0 R₁) (Metric.closedBall 0 R₂) → (∀ k < n, iteratedDeriv k f 0 = 0) → ‖z‖ < R₁ → ‖f z‖ ≤ R₂ * (‖z‖ / R₁) ^ n
  proof: |
    by
      intro f n R₁ R₂ z hd hm hv hz
      have hzb : z ∈ Metric.ball (0 : ℂ) R₁ := by simpa using hz
      cases n with
      | zero => simpa using hm hzb
      | succ m =>
        have hR : 0 < R₁ := lt_of_le_of_lt (norm_nonneg _) hz
        have h0mem : (0 : ℂ) ∈ Metric.ball (0 : ℂ) R₁ := Metric.mem_ball_self hR
        have hf0 : f 0 = 0 := by
          have := hv 0 (Nat.succ_pos m)
          simpa using this
        have ha : AnalyticAt ℂ f 0 := hd.analyticAt (Metric.isOpen_ball.mem_nhds h0mem)
        have hord : ((m + 1 : ℕ) : ℕ∞) ≤ analyticOrderAt f 0 := (natCast_le_analyticOrderAt_iff_iteratedDeriv_eq_zero ha).mpr hv
        obtain ⟨g, hg, he⟩ := (natCast_le_analyticOrderAt ha).mp hord
        have ho : (fun w => f w - f 0) =o[nhds 0] fun w => ‖w - 0‖ ^ m := by
          have h1 : (fun w : ℂ => w * g w) =o[nhds 0] fun _ => (1 : ℝ) := by
            rw [Asymptotics.isLittleO_one_iff]
            have : Filter.Tendsto (fun w : ℂ => w * g w) (nhds 0) (nhds (0 * g 0)) := (continuousAt_id.mul hg.continuousAt)
            simpa using this
          have h2 : (fun w : ℂ => w ^ m) =O[nhds 0] fun w => ‖w‖ ^ m := by
            refine Asymptotics.IsBigO.of_bound 1 (Filter.Eventually.of_forall (fun w => ?_))
            simp
          have h3 := h2.mul_isLittleO h1
          simp only [mul_one] at h3
          have e : (fun w => f w - f 0) =ᶠ[nhds 0] fun x => x ^ m * (x * g x) := by
            filter_upwards [he] with w hw
            rw [hf0, sub_zero, hw, sub_zero, pow_succ, smul_eq_mul]
            ring
          have h4 := h3.congr' e.symm (Filter.EventuallyEq.refl _ _)
          simpa using h4
        have hm' : Set.MapsTo f (Metric.ball 0 R₁) (Metric.closedBall (f 0) R₂) := by rwa [hf0]
        have := Complex.dist_le_mul_div_pow_of_mapsTo_ball_of_isLittleO hd hm' ho hzb
        simpa [hf0, dist_zero_right] using this
- id: moebius_disc_preserves_disc_and_circle
  kind: gap
  level: 2
  topic: メビウス変換・単位円板の自己写像
  statement: $|a|<1$とし、$\phi_a(z)=(z-a)/(1-\bar az)$とする。$|z|<1$なら$|\phi_a(z)|<1$であり、$|z|=1$なら$|\phi_a(z)|=1$である。
  statement_en: For |a| < 1 and φ_a(z) = (z-a)/(1-conj(a) z), |z| < 1 implies |φ_a(z)| < 1 and |z| = 1 implies |φ_a(z)| = 1.
  assumptions:
  - $|a|<1$
  quantifiers:
  - 任意の$a$と任意の$z$
  conclusion: $\phi_a$は開単位円板を開単位円板へ、単位円周を単位円周へ写す。
  answer: |-
    $|a|<1$とする。$|z|\leq 1$なら$|\bar az|<1$なので$1-\bar az\neq 0$である。展開すると
    $|1-\bar az|^2-|z-a|^2=(1-|a|^2)(1-|z|^2)$
    である。実際、両辺とも$1+|a|^2|z|^2-|z|^2-|a|^2$に等しい($2\operatorname{Re}(\bar az)$の項は打ち消し合う)。

    $|z|<1$なら右辺は正なので$|z-a|<|1-\bar az|$であり、$|\phi_a(z)|<1$である。$|z|=1$なら右辺は$0$なので$|z-a|=|1-\bar az|$であり、$|\phi_a(z)|=1$である。
  strategy: Use the identity |1 - conj(a) z|^2 - |z-a|^2 = (1-|a|^2)(1-|z|^2).
  sketch:
  - 'derive: The denominator does not vanish for |z| ≤ 1.'
  - 'derive: Expand |1 - conj(a) z|^2 - |z-a|^2.'
  - 'case_split: Read off the sign for |z| < 1 and |z| = 1.'
  openmath: (forall (a) (-> (< (abs a) 1) (and (forall (z) (-> (< (abs z) 1) (< (abs (/ (- z a) (- 1 (* (complex_conj a) z)))) 1))) (forall (z) (-> (= (abs z) 1) (= (abs (/ (- z a) (- 1 (* (complex_conj a) z)))) 1))))))
  hard_negative:
    statement: 分母の共役を除いた$(z-a)/(1-az)$でも同じ性質が成り立つ。
    reason: $a=i/2$、$z=i$では$(z-a)/(1-az)=(i/2)/(3/2)=i/3$で絶対値は$1/3\neq 1$である。
  target: |
    ∀ (a : ℂ), ‖a‖ < 1 → (∀ z : ℂ, ‖z‖ < 1 → ‖(z - a) / (1 - (starRingEnd ℂ) a * z)‖ < 1) ∧ (∀ z : ℂ, ‖z‖ = 1 → ‖(z - a) / (1 - (starRingEnd ℂ) a * z)‖ = 1)
  proof: |
    by
      intro a ha
      have hne : ∀ z : ℂ, ‖z‖ ≤ 1 → 1 - (starRingEnd ℂ) a * z ≠ 0 := by
        intro z hz h
        have h1 : (starRingEnd ℂ) a * z = 1 := (sub_eq_zero.mp h).symm
        have h2 : ‖a‖ * ‖z‖ = 1 := by
          have := congrArg norm h1
          simpa using this
        nlinarith [norm_nonneg a, norm_nonneg z]
      have id : ∀ z : ℂ, ‖1 - (starRingEnd ℂ) a * z‖ ^ 2 - ‖z - a‖ ^ 2 = (1 - ‖a‖ ^ 2) * (1 - ‖z‖ ^ 2) := by
        intro z
        simp only [Complex.sq_norm, Complex.normSq_apply]
        simp
        ring
      have ha2 : 0 < 1 - ‖a‖ ^ 2 := by nlinarith [norm_nonneg a]
      constructor
      · intro z hz
        have hn := hne z hz.le
        have hp : 0 < ‖1 - (starRingEnd ℂ) a * z‖ := norm_pos_iff.mpr hn
        rw [norm_div, div_lt_one hp]
        have hz2 : 0 < 1 - ‖z‖ ^ 2 := by nlinarith [norm_nonneg z]
        have := id z
        have h3 : 0 < (1 - ‖a‖ ^ 2) * (1 - ‖z‖ ^ 2) := mul_pos ha2 hz2
        have h4 : ‖z - a‖ ^ 2 < ‖1 - (starRingEnd ℂ) a * z‖ ^ 2 := by linarith
        exact lt_of_pow_lt_pow_left₀ 2 hp.le h4
      · intro z hz
        have hn := hne z hz.le
        have hp : 0 < ‖1 - (starRingEnd ℂ) a * z‖ := norm_pos_iff.mpr hn
        rw [norm_div, div_eq_one_iff_eq hp.ne']
        have := id z
        rw [hz] at this
        have h4 : ‖1 - (starRingEnd ℂ) a * z‖ ^ 2 = ‖z - a‖ ^ 2 := by nlinarith
        exact ((pow_left_inj₀ (norm_nonneg _) (norm_nonneg _) two_ne_zero).mp h4).symm
- id: moebius_disc_inverse_map
  kind: gap
  level: 2
  topic: メビウス変換・単位円板の自己写像の逆
  statement: $|a|<1$、$|z|\leq 1$とし、$w=(z-a)/(1-\bar az)$とする。このとき$(w+a)/(1+\bar aw)=z$である。
  statement_en: For |a| < 1, |z| ≤ 1 and w = (z-a)/(1-conj(a) z), one has (w+a)/(1+conj(a) w) = z.
  assumptions:
  - $|a|<1$、$|z|\leq 1$
  - $w=(z-a)/(1-\bar az)$
  quantifiers:
  - 任意の$a,z$
  conclusion: $(w+a)/(1+\bar aw)=z$である。
  answer: |-
    $|a|<1$、$|z|\leq 1$とする。$D=1-\bar az$とおくと$|\bar az|<1$より$D\neq 0$であり、$E=1-|a|^2\neq 0$である。計算すると
    $w+a=\frac{z-a+a(1-\bar az)}{D}=\frac{zE}{D},\quad 1+\bar aw=\frac{1-\bar az+\bar a(z-a)}{D}=\frac{E}{D}$
    である。比を取ると$z$である。
  strategy: Compute numerator and denominator over the common denominator 1 - conj(a) z.
  sketch:
  - 'derive: w + a = z(1-|a|^2)/(1-conj(a) z).'
  - 'derive: 1 + conj(a) w = (1-|a|^2)/(1-conj(a) z).'
  - 'conclude: The ratio is z.'
  openmath: (forall (a z) (-> (and (< (abs a) 1) (<= (abs z) 1)) (= (/ (+ (/ (- z a) (- 1 (* (complex_conj a) z))) a) (+ 1 (* (complex_conj a) (/ (- z a) (- 1 (* (complex_conj a) z)))))) z)))
  hard_negative:
    statement: $\phi_a$の逆写像は$\phi_a$自身である。
    reason: $a=1/2$、$z=0$では$\phi_a(0)=-1/2$、$\phi_a(-1/2)=(-1)/(5/4)=-4/5\neq 0$である。逆写像は$\phi_{-a}$である。
  target: |
    ∀ (a z : ℂ), ‖a‖ < 1 → ‖z‖ ≤ 1 → ((z - a) / (1 - (starRingEnd ℂ) a * z) + a) / (1 + (starRingEnd ℂ) a * ((z - a) / (1 - (starRingEnd ℂ) a * z))) = z
  proof: |
    by
      intro a z ha hz
      have hne : 1 - (starRingEnd ℂ) a * z ≠ 0 := by
        intro h
        have h1 : (starRingEnd ℂ) a * z = 1 := (sub_eq_zero.mp h).symm
        have h2 : ‖a‖ * ‖z‖ = 1 := by
          have := congrArg norm h1
          simpa using this
        nlinarith [norm_nonneg a, norm_nonneg z]
      have h3 : (1 : ℂ) - (starRingEnd ℂ) a * a ≠ 0 := by
        intro h
        have h1 : (starRingEnd ℂ) a * a = 1 := (sub_eq_zero.mp h).symm
        have h2 : ‖a‖ * ‖a‖ = 1 := by
          have := congrArg norm h1
          simpa using this
        nlinarith [norm_nonneg a]
      have e1 : (z - a) / (1 - (starRingEnd ℂ) a * z) + a = z * (1 - (starRingEnd ℂ) a * a) / (1 - (starRingEnd ℂ) a * z) := by
        rw [div_add' _ _ _ hne]
        congr 1
        ring
      have e2 : 1 + (starRingEnd ℂ) a * ((z - a) / (1 - (starRingEnd ℂ) a * z)) = (1 - (starRingEnd ℂ) a * a) / (1 - (starRingEnd ℂ) a * z) := by
        rw [mul_div_assoc', add_div' _ _ _ hne]
        congr 1
        ring
      rw [e1, e2, div_div_div_cancel_right₀ hne, mul_div_cancel_right₀ z h3]
- id: schwarz_pick_two_point
  kind: named
  level: 3
  topic: シュワルツ・ピックの補題
  statement: |-
    シュワルツ・ピックの補題。$f$が開単位円板で正則で$|f|<1$ならば、円板の点$z,w$について
    $\left|\frac{f(z)-f(w)}{1-\overline{f(w)}f(z)}\right|\leq\left|\frac{z-w}{1-\bar wz}\right|$
    である。
  statement_en: The Schwarz-Pick lemma. If f is holomorphic on the open unit disc with |f| < 1, then for z, w in the disc, |(f(z)-f(w))/(1-conj(f(w)) f(z))| ≤ |(z-w)/(1-conj(w) z)|.
  assumptions:
  - $f$は開単位円板で正則で$|f|<1$
  - $|z|<1$、$|w|<1$
  quantifiers:
  - 任意の$f,z,w$
  conclusion: 上の不等式が成り立つ。
  answer: |-
    $f$を開単位円板で正則で$|f|<1$を満たす関数、$z,w$を開単位円板の点とする。$|a|<1$に対し$\phi_a(\zeta)=(\zeta-a)/(1-\bar a\zeta)$は開単位円板を自身へ写す正則関数で、$\phi_{-a}$が逆写像である。$b=f(w)$、$F=\phi_b\circ f\circ\phi_{-w}$とおく。$F$は単位円板で正則で$|F|<1$である。$\phi_{-w}(0)=w$なので$F(0)=\phi_b(b)=0$である。

    シュワルツの補題より$|F(\zeta)|\leq|\zeta|$である。$\zeta=\phi_w(z)$とおくと$\phi_{-w}(\zeta)=z$なので、$|\phi_b(f(z))|\leq|\phi_w(z)|$である。これが求める不等式である。
  strategy: Conjugate f by disc automorphisms to fix 0 and apply the Schwarz lemma.
  sketch:
  - 'construct: F = φ_b ∘ f ∘ φ_(-w) with b = f(w).'
  - 'derive: F maps the disc to itself and F(0) = 0.'
  - 'apply_theorem: The Schwarz lemma gives |F(ζ)| ≤ |ζ|.'
  - 'conclude: Substitute ζ = φ_w(z).'
  openmath: (forall (f z w) (-> (and (holomorphic_on f (open_disc 0 1)) (forall (x) (-> (in x (open_disc 0 1)) (< (abs (fn_value f x)) 1))) (< (abs z) 1) (< (abs w) 1)) (<= (abs (/ (- (fn_value f z) (fn_value f w)) (- 1 (* (complex_conj (fn_value f w)) (fn_value f z))))) (abs (/ (- z w) (- 1 (* (complex_conj w) z)))))))
  hard_negative:
    statement: 分母を落とした$|f(z)-f(w)|\leq|z-w|$が全ての$z,w$で成り立つ。
    reason: $f=\phi_{1/2}$は単位円板の自己写像で$f'(1/2)=4/3>1$なので、$1/2$の近くの$z,w$で成り立たない。
  target: |
    ∀ (f : ℂ → ℂ) (z w : ℂ), DifferentiableOn ℂ f (Metric.ball 0 1) → (∀ x ∈ Metric.ball (0 : ℂ) 1, ‖f x‖ < 1) → ‖z‖ < 1 → ‖w‖ < 1 → ‖(f z - f w) / (1 - (starRingEnd ℂ) (f w) * f z)‖ ≤ ‖(z - w) / (1 - (starRingEnd ℂ) w * z)‖
  proof: |
    by
      intro f z w hd hb hz hw
      have hne : ∀ a x : ℂ, ‖a‖ < 1 → ‖x‖ < 1 → 1 - (starRingEnd ℂ) a * x ≠ 0 := by
        intro a x ha hx h
        have h1 : (starRingEnd ℂ) a * x = 1 := (sub_eq_zero.mp h).symm
        have h2 : ‖a‖ * ‖x‖ = 1 := by
          have := congrArg norm h1
          simpa using this
        nlinarith [norm_nonneg a, norm_nonneg x]
      have hlt : ∀ a x : ℂ, ‖a‖ < 1 → ‖x‖ < 1 → ‖(x - a) / (1 - (starRingEnd ℂ) a * x)‖ < 1 := by
        intro a x ha hx
        have hp : 0 < ‖1 - (starRingEnd ℂ) a * x‖ := norm_pos_iff.mpr (hne a x ha hx)
        rw [norm_div, div_lt_one hp]
        have id : ‖1 - (starRingEnd ℂ) a * x‖ ^ 2 - ‖x - a‖ ^ 2 = (1 - ‖a‖ ^ 2) * (1 - ‖x‖ ^ 2) := by
          simp only [Complex.sq_norm, Complex.normSq_apply]
          simp
          ring
        have h3 : 0 < (1 - ‖a‖ ^ 2) * (1 - ‖x‖ ^ 2) := mul_pos (by nlinarith [norm_nonneg a]) (by nlinarith [norm_nonneg x])
        exact lt_of_pow_lt_pow_left₀ 2 hp.le (by linarith)
      set b := f w with hb'
      have hbn : ‖b‖ < 1 := hb w (by simpa using hw)
      set ψ : ℂ → ℂ := fun x => (x + w) / (1 + (starRingEnd ℂ) w * x) with hψ
      have hψb : ∀ x : ℂ, ‖x‖ < 1 → ‖ψ x‖ < 1 := by
        intro x hx
        have := hlt (-w) x (by simpa using hw) hx
        simpa [hψ, sub_neg_eq_add, map_neg] using this
      have hψne : ∀ x : ℂ, ‖x‖ < 1 → 1 + (starRingEnd ℂ) w * x ≠ 0 := by
        intro x hx
        have := hne (-w) x (by simpa using hw) hx
        simpa [map_neg] using this
      set F : ℂ → ℂ := fun x => (f (ψ x) - b) / (1 - (starRingEnd ℂ) b * f (ψ x)) with hF
      have hψd : DifferentiableOn ℂ ψ (Metric.ball 0 1) := by
        intro x hx
        have hx' : ‖x‖ < 1 := by simpa using hx
        apply DifferentiableAt.differentiableWithinAt
        exact DifferentiableAt.div (by fun_prop) (by fun_prop) (hψne x hx')
      have hψm : Set.MapsTo ψ (Metric.ball 0 1) (Metric.ball 0 1) := fun x hx => by
        simpa using hψb x (by simpa using hx)
      have hfψ : DifferentiableOn ℂ (fun x => f (ψ x)) (Metric.ball 0 1) := hd.comp hψd hψm
      have hFd : DifferentiableOn ℂ F (Metric.ball 0 1) := by
        refine DifferentiableOn.div (hfψ.sub_const b) ((differentiableOn_const 1).sub (hfψ.const_mul _)) ?_
        intro x hx
        exact hne b _ hbn (hb _ (hψm hx))
      have hF0 : F 0 = 0 := by simp [hF, hψ, hb']
      have hFm : Set.MapsTo F (Metric.ball 0 1) (Metric.closedBall 0 1) := by
        intro x hx
        have := hlt b (f (ψ x)) hbn (hb _ (hψm hx))
        simpa [hF] using this.le
      set ζ := (z - w) / (1 - (starRingEnd ℂ) w * z) with hζ
      have hζn : ‖ζ‖ < 1 := hlt w z hw hz
      have hS := Complex.norm_le_norm_of_mapsTo_ball hFd hFm hF0 hζn
      have hψζ : ψ ζ = z := by
        have h1 := hne w z hw hz
        have h3 : (1 : ℂ) - (starRingEnd ℂ) w * w ≠ 0 := by
          have := hne w w hw hw
          exact this
        have e1 : ζ + w = z * (1 - (starRingEnd ℂ) w * w) / (1 - (starRingEnd ℂ) w * z) := by
          rw [hζ, div_add' _ _ _ h1]
          congr 1
          ring
        have e2 : 1 + (starRingEnd ℂ) w * ζ = (1 - (starRingEnd ℂ) w * w) / (1 - (starRingEnd ℂ) w * z) := by
          rw [hζ, mul_div_assoc', add_div' _ _ _ h1]
          congr 1
          ring
        simp only [hψ]
        rw [e1, e2, div_div_div_cancel_right₀ h1, mul_div_cancel_right₀ z h3]
      simpa [hF, hψζ] using hS
- id: schwarz_pick_derivative
  kind: gap
  level: 3
  topic: シュワルツ・ピックの補題・微分形
  statement: $f$が開単位円板で正則で$|f|<1$ならば、$|w|<1$で$|f'(w)|(1-|w|^2)\leq 1-|f(w)|^2$である。
  statement_en: If f is holomorphic on the open unit disc with |f| < 1, then |f'(w)|(1-|w|^2) ≤ 1-|f(w)|^2 for |w| < 1.
  assumptions:
  - $f$は開単位円板で正則で$|f|<1$
  - $|w|<1$
  quantifiers:
