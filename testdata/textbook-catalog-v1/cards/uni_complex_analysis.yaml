      exact eq_neg_of_add_eq_zero_right h0
- id: circle_integral_annulus_deformation
  kind: textbook
  level: 3
  topic: コーシーの定理・円環での変形
  statement: $0<r\leq R$とする。$f$が閉円環$r\leq|z-c|\leq R$で連続で開円環$r<|z-c|<R$で正則ならば、$\oint_{|z-c|=R}f\,dz=\oint_{|z-c|=r}f\,dz$である。
  statement_en: If 0 < r ≤ R and f is continuous on the closed annulus r ≤ |z-c| ≤ R and holomorphic on the open annulus, then the integrals of f over the two boundary circles are equal.
  assumptions:
  - $0<r\leq R$
  - $f$は閉円環で連続
  - $f$は開円環で正則
  quantifiers:
  - 任意の$f,c,r,R$
  conclusion: 二つの円周上の積分は等しい。
  answer: |-
    $0<r\leq R$、$f$を閉円環$r\leq|z-c|\leq R$で連続で開円環$r<|z-c|<R$で正則な関数とし、$r<R$としてよい。$c=0$として一般性を失わない。$\zeta=\log z$の座標を使う。長方形$Q=[\log r,\log R]\times[0,2\pi]$上で$g(\zeta)=f(e^\zeta)e^\zeta$とおくと、$g$は$Q$で連続、内部で正則である。

    長方形に対するコーシーの定理により、$g$の$\partial Q$上の積分は$0$である。$g$は虚部方向に$2\pi$周期なので、水平な二辺の積分は打ち消し合う。残る縦の二辺は
    $i\int_0^{2\pi}g(\log R+it)\,dt=\oint_{|z|=R}f\,dz,\quad i\int_0^{2\pi}g(\log r+it)\,dt=\oint_{|z|=r}f\,dz$
    であり、向きが逆なので二つの差が$0$である。よって積分は等しい。
  strategy: Pull back by the exponential to a rectangle and apply Cauchy's theorem there.
  sketch:
  - 'construct: Put g(ζ) = f(e^ζ) e^ζ on the rectangle [log r, log R] × [0, 2π].'
  - 'apply_theorem: Cauchy''s theorem on the rectangle.'
  - 'derive: Horizontal sides cancel by periodicity.'
  - 'conclude: The vertical sides are the two circle integrals.'
  openmath: (forall (f c s t) (-> (and (< 0 s) (<= s t) (continuous_on_set f (closed_annulus_about c s t)) (holomorphic_on f (annulus_about c s t))) (= (circle_integral (lambda (z) (fn_value f z)) c t) (circle_integral (lambda (z) (fn_value f z)) c s))))
  hard_negative:
    statement: $f$の積分は半径によらず常に$0$である。
    reason: $f(z)=1/(z-c)$は円環で正則だが、どの円周上でも積分は$2\pi i$である。等しいのは二つの積分であり、値は$0$とは限らない。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ) (r R : ℝ), 0 < r → r ≤ R → ContinuousOn f (Metric.closedBall c R \ Metric.ball c r) → (∀ z ∈ Metric.ball c R \ Metric.closedBall c r, DifferentiableAt ℂ f z) → (∮ z in C(c, R), f z) = ∮ z in C(c, r), f z
  proof: |
    by
      intro f c r R hr hrR hc hd
      exact Complex.circleIntegral_eq_of_differentiable_on_annulus_off_countable hr hrR Set.countable_empty hc (fun z hz => hd z (by simpa using hz))
- id: circle_integral_conj_eq_area
  kind: gap
  level: 2
  topic: 周回積分・共役の積分
  statement: $R>0$なら$\oint_{|z-c|=R}\bar z\,dz=2\pi iR^2$である。
  statement_en: For R > 0, the integral of conj z over the positively oriented circle |z-c| = R equals 2πi R^2.
  assumptions:
  - $R>0$
  - 円周の向きは正の向き
  quantifiers:
  - 任意の$c\in\mathbb{C}$と$R>0$
  conclusion: 積分の値は$2\pi iR^2$である。
  answer: $c\in\mathbb{C}$、$R>0$とする。円周上では$\overline{(z-c)}(z-c)=R^2$なので、$\bar z=\bar c+R^2/(z-c)$である。定数関数は原始関数を持つので$\oint\bar c\,dz=0$である。また$\oint(z-c)^{-1}\,dz=2\pi i$である。よって$\oint\bar z\,dz=R^2\cdot 2\pi i$である。
  strategy: On the circle, conj z = conj c + R^2/(z-c).
  sketch:
  - 'derive: On the circle, conj z = conj c + R^2/(z-c).'
  - 'apply_theorem: The constant term integrates to 0 and 1/(z-c) to 2πi.'
  - 'conclude: The integral equals 2πi R^2.'
  openmath: (forall (c r) (-> (> r 0) (= (circle_integral (lambda (z) (complex_conj z)) c r) (* (* 2 (* pi complex_imaginary_unit)) (^ r 2)))))
  hard_negative:
    statement: コーシーの定理より$\oint\bar z\,dz=0$である。
    reason: $\bar z$は正則でないのでコーシーの定理は使えない。$c=0$、$R=1$で積分は$2\pi i$である。
  target: |
    ∀ (c : ℂ) (R : ℝ), 0 < R → (∮ z in C(c, R), (starRingEnd ℂ) z) = 2 * Real.pi * Complex.I * (R : ℂ) ^ 2
  proof: |
    by
      intro c R hR
      have e : Set.EqOn (fun z : ℂ => (starRingEnd ℂ) z) (fun z => (starRingEnd ℂ) c + (R : ℂ) ^ 2 * (z - c)⁻¹) (Metric.sphere c R) := by
        intro z hz
        have hn : ‖z - c‖ = R := mem_sphere_iff_norm.mp hz
        have hne : z - c ≠ 0 := by
          rw [← norm_pos_iff, hn]; exact hR
        have h1 : (starRingEnd ℂ) (z - c) * (z - c) = (R : ℂ) ^ 2 := by
          rw [Complex.conj_mul', hn]
        simp only
        field_simp
        rw [map_sub] at h1
        linear_combination h1
      rw [circleIntegral.integral_congr hR.le e]
      have i1 : CircleIntegrable (fun _ : ℂ => (starRingEnd ℂ) c) c R := circleIntegrable_const _ _ _
      have i2 : CircleIntegrable (fun z : ℂ => (R : ℂ) ^ 2 * (z - c)⁻¹) c R := by
        have := (circleIntegrable_sub_inv_iff (c := c) (w := c) (R := R)).mpr (Or.inr (by simp [abs_of_pos hR, hR.ne]))
        exact this.const_fun_smul (a := (R : ℂ) ^ 2)
      rw [circleIntegral.integral_add i1 i2, circleIntegral.integral_const_mul, circleIntegral.integral_sub_center_inv c hR.ne']
      have : (∮ _ in C(c, R), (starRingEnd ℂ) c) = 0 := by
        apply circleIntegral.integral_eq_zero_of_hasDerivWithinAt' (f := fun z => (starRingEnd ℂ) c * z)
        intro z _
        simpa using ((hasDerivAt_id z).const_mul ((starRingEnd ℂ) c)).hasDerivWithinAt
      rw [this]; ring
- id: cauchy_higher_derivative_formula_center
  kind: textbook
  level: 3
  topic: コーシーの積分公式・高階導関数
  statement: |-
    $R>0$とし、$f$は$|z-c|<R$で正則で閉円板で連続とする。全ての$n\geq 0$について
    $f^{(n)}(c)=\frac{n!}{2\pi i}\oint_{|z-c|=R}\frac{f(z)}{(z-c)^{n+1}}\,dz$
    である。これは一階導関数の公式の全ての階数への一般化である(評価点は円の中心)。
  statement_en: Generalizing the first-derivative formula to all orders at the centre, if f is holomorphic on |z-c| < R and continuous on the closed disc, then f^(n)(c) = (n!/(2πi)) times the integral of f(z)/(z-c)^(n+1) over the circle.
  assumptions:
  - $R>0$
  - $f$は開円板で正則で閉円板で連続
  quantifiers:
  - 任意の$f,c,R$と自然数$n$
  conclusion: $f^{(n)}(c)$は上の積分で表される。
  answer: |-
    $R>0$、$f$を開円板$|z-c|<R$で正則で閉円板で連続な関数、$n$を自然数とする。コーシーの積分公式により$|w-c|<R$で
    $f(w)=\frac{1}{2\pi i}\oint\frac{f(z)}{z-w}\,dz$
    である。$|z-c|=R$、$|w-c|<R$なら$\frac{1}{z-w}=\sum_k\frac{(w-c)^k}{(z-c)^{k+1}}$であり、固定した$w$について円周上で一様収束する。$f$は円周上で有界なので項別に積分でき、
    $f(w)=\sum_k\left(\frac{1}{2\pi i}\oint\frac{f(z)}{(z-c)^{k+1}}\,dz\right)(w-c)^k$
    である。べき級数の係数と導関数の関係$a_n=f^{(n)}(c)/n!$から公式を得る。
  strategy: Expand the Cauchy kernel in powers of w - c and compare coefficients.
  sketch:
  - 'apply_theorem: Start with the Cauchy integral formula on the disc.'
  - 'derive: Expand 1/(z-w) as a geometric series uniformly convergent on the circle.'
  - 'derive: Integrate term by term to obtain a power series in w-c.'
  - 'conclude: Coefficients of a power series are f^(n)(c)/n!.'
  openmath: (forall (f c r n) (-> (and (> r 0) (holomorphic_on f (open_disc c r)) (continuous_on_set f (closed_disc c r)) (in n N)) (= (iterated_complex_deriv n f c) (* (/ (factorial n) (* 2 (* pi complex_imaginary_unit))) (circle_integral (lambda (z) (/ (fn_value f z) (^ (- z c) (+ n 1)))) c r)))))
  hard_negative:
    statement: 公式の分子の$n!$は不要である。
    reason: $f(z)=z^2$、$c=0$、$R=1$、$n=2$では$f''(0)=2$で、積分は$2\pi i$であり、$\frac{1}{2\pi i}\oint z^2/z^3\,dz=1$である。$n!=2$の因子が必要である。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ) (R : ℝ) (n : ℕ), 0 < R → DiffContOnCl ℂ f (Metric.ball c R) → iteratedDeriv n f c = ((n.factorial : ℂ) / (2 * Real.pi * Complex.I)) * ∮ z in C(c, R), f z / (z - c) ^ (n + 1)
  proof: |
    by
      intro f c R n hR hf
      have h := hf.circleIntegral_one_div_sub_center_pow_smul hR n
      have e : (∮ z in C(c, R), f z / (z - c) ^ (n + 1)) = ∮ z in C(c, R), (1 / (z - c) ^ (n + 1)) • f z := by
        congr 1; funext z; simp [div_eq_mul_inv, mul_comm]
      rw [e, h]
      have h2 : (2 * (Real.pi : ℂ) * Complex.I) ≠ 0 := Complex.two_pi_I_ne_zero
      have hn : (n.factorial : ℂ) ≠ 0 := by exact_mod_cast n.factorial_ne_zero
      simp only [smul_eq_mul]
      field_simp
- id: circle_integral_two_poles_inside
  kind: gap
  level: 3
  topic: コーシーの積分公式・二点の極
  statement: |-
    $g$は$|z-c|<R$で正則で閉円板で連続とする。$a\neq b$が開円板の点なら
    $\oint_{|z-c|=R}\frac{g(z)}{(z-a)(z-b)}\,dz=2\pi i\,\frac{g(a)-g(b)}{a-b}$
    である。
  statement_en: If g is holomorphic on |z-c| < R and continuous on the closed disc, and a ≠ b lie in the open disc, then the integral of g(z)/((z-a)(z-b)) over the circle equals 2πi (g(a)-g(b))/(a-b).
  assumptions:
  - $g$は開円板で正則で閉円板で連続
  - $a,b$は開円板の点で$a\neq b$
  quantifiers:
  - 任意の$g,c,a,b,R$
  conclusion: 積分の値は$2\pi i(g(a)-g(b))/(a-b)$である。
  answer: |-
    $g$を開円板$|z-c|<R$で正則で閉円板で連続な関数、$a\neq b$を開円板の点とする。部分分数分解により、円周上で
    $\frac{g(z)}{(z-a)(z-b)}=\frac{1}{a-b}\left(\frac{g(z)}{z-a}-\frac{g(z)}{z-b}\right)$
    である。右辺の二つの関数は円周上で連続である。コーシーの積分公式より$\oint\frac{g(z)}{z-a}\,dz=2\pi ig(a)$、$\oint\frac{g(z)}{z-b}\,dz=2\pi ig(b)$である。代入して結論を得る。
  strategy: Decompose into partial fractions and apply Cauchy's integral formula twice.
  sketch:
  - 'derive: Partial fractions split the integrand into two Cauchy kernels.'
  - 'apply_theorem: Cauchy''s integral formula at a and at b.'
  - 'conclude: Subtract and divide by a-b.'
  openmath: (forall (g c a b r) (-> (and (holomorphic_on g (open_disc c r)) (continuous_on_set g (closed_disc c r)) (in a (open_disc c r)) (in b (open_disc c r)) (!= a b)) (= (circle_integral (lambda (z) (/ (fn_value g z) (* (- z a) (- z b)))) c r) (* (* 2 (* pi complex_imaginary_unit)) (/ (- (fn_value g a) (fn_value g b)) (- a b))))))
  hard_negative:
    statement: $b$が閉円板の外にあっても同じ公式が成り立つ。
    reason: $g=1$、$c=0$、$R=1$、$a=0$、$b=2$では公式の右辺は$0$だが、$\oint\frac{dz}{z(z-2)}=2\pi i\cdot(-1/2)=-\pi i$である。
  target: |
    ∀ (g : ℂ → ℂ) (c a b : ℂ) (R : ℝ), DiffContOnCl ℂ g (Metric.ball c R) → a ∈ Metric.ball c R → b ∈ Metric.ball c R → a ≠ b → (∮ z in C(c, R), g z / ((z - a) * (z - b))) = 2 * Real.pi * Complex.I * ((g a - g b) / (a - b))
  proof: |
    by
      intro g c a b R hg ha hb hab
      have hR : 0 < R := Metric.pos_of_mem_ball ha
      have hab' : a - b ≠ 0 := sub_ne_zero.mpr hab
      have hne : ∀ w ∈ Metric.ball c R, ∀ z ∈ Metric.sphere c R, z - w ≠ 0 := by
        intro w hw z hz h
        have : z = w := sub_eq_zero.mp h
        subst this
        have h1 := mem_ball_iff_norm.mp hw
        have h2 := mem_sphere_iff_norm.mp hz
        linarith
      have hcont : ContinuousOn g (Metric.sphere c R) := hg.continuousOn.mono (by rw [closure_ball c hR.ne']; exact Metric.sphere_subset_closedBall)
      have hI : ∀ w ∈ Metric.ball c R, CircleIntegrable (fun z => (z - w)⁻¹ • g z) c R := by
        intro w hw
        apply ContinuousOn.circleIntegrable hR.le
        exact ContinuousOn.smul (ContinuousOn.inv₀ (by fun_prop) (hne w hw)) hcont
      have e : Set.EqOn (fun z => g z / ((z - a) * (z - b))) (fun z => (a - b)⁻¹ * ((z - a)⁻¹ • g z - (z - b)⁻¹ • g z)) (Metric.sphere c R) := by
        intro z hz
        have h1 := hne a ha z hz
        have h2 := hne b hb z hz
        simp only [smul_eq_mul]
        field_simp
        ring
      rw [circleIntegral.integral_congr hR.le e, circleIntegral.integral_const_mul, circleIntegral.integral_sub (hI a ha) (hI b hb), hg.circleIntegral_sub_inv_smul ha, hg.circleIntegral_sub_inv_smul hb]
      simp only [smul_eq_mul]
      field_simp
- id: circle_integral_principal_part_residue
  kind: gap
  level: 3
  topic: 周回積分・主要部の積分
  statement: |-
    $h$は$|z-c|<R$で正則で閉円板で連続、$a$は開円板の点とする。このとき
    $\oint_{|z-c|=R}\left(\sum_{k=0}^{m}\frac{A_k}{(z-a)^{k+1}}+h(z)\right)dz=2\pi iA_0$
    である。
  statement_en: If h is holomorphic on |z-c| < R and continuous on the closed disc and a lies in the open disc, then the integral over the circle of the sum for k from 0 to m of A_k/(z-a)^(k+1) plus h(z) equals 2πi A_0.
  assumptions:
  - $h$は開円板で正則で閉円板で連続
  - $a$は開円板の点
  quantifiers:
  - 任意の複素数列$(A_k)$、自然数$m$、$h,c,a,R$
  conclusion: 積分の値は$2\pi iA_0$である。
  answer: |-
    $(A_k)$を複素数列、$m$を自然数、$h$を開円板$|z-c|<R$で正則で閉円板で連続な関数、$a$を開円板の点とする。$a$は円周上にないので、被積分関数の各項は円周上で連続であり、項ごとに積分できる。

    コーシーの定理より$\oint h\,dz=0$である。$k\geq 1$なら$(z-a)^{-k-1}$は$a$の外で原始関数$-\frac{1}{k}(z-a)^{-k}$を持つので、積分は$0$である。$k=0$の項は、$a$が開円板にあるので$\oint(z-a)^{-1}\,dz=2\pi i$である。よって積分は$2\pi iA_0$である。
  strategy: Integrate term by term; only the simple pole term survives.
  sketch:
  - 'apply_theorem: Cauchy''s theorem kills h.'
  - 'derive: For k ≥ 1 the term has a primitive near the circle.'
  - 'derive: The k = 0 term contributes 2πi A_0.'
  openmath: (forall (A h m c a r) (-> (and (in m N) (holomorphic_on h (open_disc c r)) (continuous_on_set h (closed_disc c r)) (in a (open_disc c r))) (= (circle_integral (lambda (z) (+ (range_sum (+ m 1) (lambda (k) (/ (seq_value A k) (^ (- z a) (+ k 1))))) (fn_value h z))) c r) (* (* 2 (* pi complex_imaginary_unit)) (seq_value A 0)))))
  hard_negative:
    statement: 積分の値は$2\pi i\sum_kA_k$である。
    reason: $A_0=0$、$A_1=1$、$h=0$、$a=c=0$、$R=1$では$\oint z^{-2}\,dz=0$であり、$2\pi i$ではない。
  target: |
    ∀ (A : ℕ → ℂ) (h : ℂ → ℂ) (m : ℕ) (c a : ℂ) (R : ℝ), DiffContOnCl ℂ h (Metric.ball c R) → a ∈ Metric.ball c R → (∮ z in C(c, R), ((∑ k ∈ Finset.range (m + 1), A k / (z - a) ^ (k + 1)) + h z)) = 2 * Real.pi * Complex.I * A 0
  proof: |
    by
      intro A h m c a R hh ha
      have hR : 0 < R := Metric.pos_of_mem_ball ha
      have hne : ∀ z ∈ Metric.sphere c R, z - a ≠ 0 := by
        intro z hz h
        have : z = a := sub_eq_zero.mp h
        subst this
        have h1 := mem_ball_iff_norm.mp ha
        have h2 := mem_sphere_iff_norm.mp hz
        linarith
      have hk : ∀ k : ℕ, ContinuousOn (fun z => A k / (z - a) ^ (k + 1)) (Metric.sphere c R) := fun k =>
        ContinuousOn.div continuousOn_const (by fun_prop) (fun z hz => pow_ne_zero _ (hne z hz))
      have hcont : ContinuousOn h (Metric.sphere c R) := hh.continuousOn.mono (by rw [closure_ball c hR.ne']; exact Metric.sphere_subset_closedBall)
      have i1 : CircleIntegrable (fun z => ∑ k ∈ Finset.range (m + 1), A k / (z - a) ^ (k + 1)) c R :=
        ContinuousOn.circleIntegrable hR.le (continuousOn_finset_sum _ (fun k _ => hk k))
      rw [circleIntegral.integral_add i1 (hcont.circleIntegrable hR.le), hh.circleIntegral_eq_zero hR.le, add_zero]
      rw [circleIntegral.integral_fun_sum (fun k _ => (hk k).circleIntegrable hR.le), Finset.sum_range_succ']
      have h0 : ∀ k ∈ Finset.range m, (∮ z in C(c, R), A (k + 1) / (z - a) ^ (k + 1 + 1)) = 0 := by
        intro k _
        have e : (fun z => A (k + 1) / (z - a) ^ (k + 1 + 1)) = fun z => A (k + 1) * (z - a) ^ (-(k : ℤ) - 2) := by
          funext z
          have : (-(k : ℤ) - 2) = -((k + 2 : ℕ) : ℤ) := by push_cast; ring
          rw [this, zpow_neg, zpow_natCast, div_eq_mul_inv]
        rw [e, circleIntegral.integral_const_mul, circleIntegral.integral_sub_zpow_of_ne (by omega), mul_zero]
      rw [Finset.sum_eq_zero h0, zero_add]
      have e : (fun z => A 0 / (z - a) ^ (0 + 1)) = fun z => A 0 * (z - a)⁻¹ := by
        funext z; simp [div_eq_mul_inv]
      rw [e, circleIntegral.integral_const_mul, circleIntegral.integral_sub_inv_of_mem_ball ha]
      ring
- id: circle_integral_log_derivative_counts_zero
  kind: gap
  level: 3
  topic: 周回積分・対数微分と零点の位数
  statement: $U$を開集合で閉円板$|z-c|\leq R$を含むとし、$g$は$U$で正則で閉円板上で$g\neq 0$とする。$a$が開円板の点で$f(z)=(z-a)^ng(z)$($n\in\mathbb{N}$)なら、$\oint_{|z-c|=R}f'(z)/f(z)\,dz=2\pi in$である。
  statement_en: If U is an open set containing the closed disc |z-c| ≤ R, g is holomorphic on U without zeros on the closed disc, a lies in the open disc and f(z) = (z-a)^n g(z), then the integral of f'/f over the circle equals 2πi n.
  assumptions:
  - $U$は開集合で閉円板を含む
  - $g$は$U$で正則で閉円板上で$g\neq 0$
  - $a$は開円板の点
  - $f(z)=(z-a)^ng(z)$
  quantifiers:
  - 任意の$g,U,c,a,R$と自然数$n$
  conclusion: $\oint f'/f\,dz=2\pi in$である。
  answer: |-
    $U$を閉円板$|z-c|\leq R$を含む開集合、$g$を$U$で正則で閉円板上で零点を持たない関数、$a$を開円板$|z-c|<R$の点、$n$を自然数、$f(z)=(z-a)^ng(z)$とする。円周上で$z\neq a$、$g(z)\neq 0$であり、積の微分より
    $\frac{f'(z)}{f(z)}=\frac{n}{z-a}+\frac{g'(z)}{g(z)}$
    である($n=0$のときは第一項がない)。

    $g'/g$は閉円板の近傍で正則なので、コーシーの定理より円周上の積分は$0$である。$\oint(z-a)^{-1}\,dz=2\pi i$なので、全体の積分は$2\pi in$である。
  strategy: Split the logarithmic derivative into the pole part and a holomorphic part.
  sketch:
  - 'derive: f''/f = n/(z-a) + g''/g on the circle.'
  - 'apply_theorem: Cauchy''s theorem applies to g''/g.'
  - 'conclude: The pole term contributes 2πi n.'
  openmath: (forall (g U c a r n) (-> (and (open_set U) (subset (closed_disc c r) U) (holomorphic_on g U) (forall (z) (-> (in z (closed_disc c r)) (!= (fn_value g z) 0))) (in a (open_disc c r)) (in n N)) (= (circle_integral (lambda (z) (/ (complex_deriv_fn (lambda (w) (* (^ (- w a) n) (fn_value g w))) z) (* (^ (- z a) n) (fn_value g z)))) c r) (* (* 2 (* pi complex_imaginary_unit)) n))))
  hard_negative:
    statement: $g$が閉円板内に零点を持っても積分は$2\pi in$である。
    reason: $g(z)=z-b$($b$は開円板の点、$b\neq a$)なら$f'/f=n/(z-a)+1/(z-b)$であり、積分は$2\pi i(n+1)$である。
  target: |
    ∀ (g : ℂ → ℂ) (U : Set ℂ) (c a : ℂ) (R : ℝ) (n : ℕ), IsOpen U → Metric.closedBall c R ⊆ U → DifferentiableOn ℂ g U → (∀ z ∈ Metric.closedBall c R, g z ≠ 0) → a ∈ Metric.ball c R → (∮ z in C(c, R), deriv (fun w => (w - a) ^ n * g w) z / ((z - a) ^ n * g z)) = 2 * Real.pi * Complex.I * n
  proof: |
    by
      intro g U c a R n hU hsub hg hg0 ha
      have hR : 0 < R := Metric.pos_of_mem_ball ha
      have hne : ∀ z ∈ Metric.sphere c R, z - a ≠ 0 := by
        intro z hz h
        have : z = a := sub_eq_zero.mp h
        subst this
        have h1 := mem_ball_iff_norm.mp ha
        have h2 := mem_sphere_iff_norm.mp hz
        linarith
      have hgd : ∀ z ∈ Metric.closedBall c R, DifferentiableAt ℂ g z := fun z hz => hg.differentiableAt (hU.mem_nhds (hsub hz))
      have hgd' : DifferentiableOn ℂ (deriv g) U := hg.deriv hU
      have hq : DiffContOnCl ℂ (fun z => deriv g z / g z) (Metric.ball c R) := by
        apply DifferentiableOn.diffContOnCl
        rw [closure_ball c hR.ne']
        exact (hgd'.mono hsub).div (hg.mono hsub) hg0
      have e : Set.EqOn (fun z => deriv (fun w => (w - a) ^ n * g w) z / ((z - a) ^ n * g z)) (fun z => (n : ℂ) * (z - a)⁻¹ + deriv g z / g z) (Metric.sphere c R) := by
        intro z hz
        have hzb : z ∈ Metric.closedBall c R := Metric.sphere_subset_closedBall hz
        have h1 := hne z hz
        have h2 := hg0 z hzb
        have hp : HasDerivAt (fun w : ℂ => (w - a) ^ n) ((n : ℂ) * (z - a) ^ (n - 1) * 1) z := ((hasDerivAt_id z).sub_const a).fun_pow n
        have hm := hp.mul (hgd z hzb).hasDerivAt
        simp only
        have hm' : HasDerivAt (fun w => (w - a) ^ n * g w) ((n : ℂ) * (z - a) ^ (n - 1) * 1 * g z + (z - a) ^ n * deriv g z) z := hm
        rw [hm'.deriv]
        rcases Nat.eq_zero_or_pos n with rfl | hn
        · simp
        · obtain ⟨k, rfl⟩ : ∃ k, n = k + 1 := ⟨n - 1, by omega⟩
          simp only [Nat.add_sub_cancel, pow_succ]
          field_simp
      rw [circleIntegral.integral_congr hR.le e]
      have i1 : CircleIntegrable (fun z => (n : ℂ) * (z - a)⁻¹) c R := by
        apply ContinuousOn.circleIntegrable hR.le
        exact continuousOn_const.mul (ContinuousOn.inv₀ (by fun_prop) hne)
      have i2 : CircleIntegrable (fun z => deriv g z / g z) c R :=
        (hq.continuousOn.mono (by rw [closure_ball c hR.ne']; exact Metric.sphere_subset_closedBall)).circleIntegrable hR.le
      rw [circleIntegral.integral_add i1 i2, hq.circleIntegral_eq_zero hR.le, circleIntegral.integral_const_mul, circleIntegral.integral_sub_inv_of_mem_ball ha]
      ring
- id: morera_theorem
  kind: named
  level: 3
  topic: モレラの定理
  statement: モレラの定理。$U$を開集合、$f$を$U$で連続とする。軸に平行で$U$に含まれる全ての閉長方形について、その周上の$f$の積分が$0$ならば、$f$は$U$で正則である。
  statement_en: Morera's theorem. If f is continuous on an open set U and its integral over the boundary of every closed axis-parallel rectangle contained in U vanishes, then f is holomorphic on U.
  assumptions:
  - $U$は開集合
  - $f$は$U$で連続
  - $U$に含まれる軸に平行な閉長方形の周上で$f$の積分は$0$
  quantifiers:
  - 任意の$f,U$
  conclusion: $f$は$U$で正則である。
  answer: |-
    $U$を開集合、$f$を$U$で連続な関数で、$U$に含まれる軸に平行な閉長方形の周上の積分が全て$0$であるものとする。正則性は局所的な性質なので、$c\in U$を中心とする円板$D\subset U$の上で示せばよい。

    $w\in D$に対し、$c$から$w$へ軸に平行な折れ線(まず水平、次に垂直)に沿う$f$の積分を$F(w)$とする。$c,w$を対角とする長方形は$D$に含まれる。仮定より、水平から垂直へ進む折れ線と垂直から水平へ進む折れ線の積分は等しい。同じ理由で$h$が十分小さいとき、$F(w+h)-F(w)$は$w$から$w+h$への同様の折れ線$\gamma$に沿う積分に等しい。よって
    $\frac{F(w+h)-F(w)}{h}-f(w)=\frac1h\int_\gamma(f(\zeta)-f(w))\,d\zeta$
    である。$\gamma$の長さは$2|h|$以下であり、$f$は連続なので、右辺は$h\to 0$で$0$に収束する。したがって$F$は$D$で正則で$F'=f$である。正則関数の導関数は正則なので、$f$は$D$で正則である。
  strategy: Build a primitive by integrating along axis-parallel paths, then use that derivatives of holomorphic functions are holomorphic.
  sketch:
  - 'setup: Work on a disc D in U around a given point.'
  - 'construct: Define F(w) by integrating along an axis-parallel path from the centre.'
  - 'derive: The rectangle condition makes the path choice irrelevant.'
  - 'derive: Continuity of f gives F'' = f.'
  - 'apply_theorem: The derivative of a holomorphic function is holomorphic.'
  openmath: (forall (f U) (-> (and (open_set U) (continuous_on_set f U) (forall (z w) (-> (subset (rectangle_set z w) U) (= (rectangle_boundary_integral f z w) 0)))) (holomorphic_on f U)))
  hard_negative:
    statement: $f$が連続でなくても長方形の周上の積分が全て$0$なら$f$は正則である。
    reason: $f$を一点$a$でだけ$1$、それ以外で$0$とすると、積分は全て$0$だが$f$は$a$で連続でなく正則でない。
  target: |
    ∀ (f : ℂ → ℂ) (U : Set ℂ), IsOpen U → ContinuousOn f U → (∀ z w : ℂ, Set.uIcc z.re w.re ×ℂ Set.uIcc z.im w.im ⊆ U → (∫ x : ℝ in z.re..w.re, f (x + z.im * Complex.I)) - (∫ x : ℝ in z.re..w.re, f (x + w.im * Complex.I)) + Complex.I • (∫ y : ℝ in z.im..w.im, f (w.re + y * Complex.I)) - Complex.I • (∫ y : ℝ in z.im..w.im, f (z.re + y * Complex.I)) = 0) → DifferentiableOn ℂ f U
  proof: |
    by
      intro f U hU hc hrect
      refine (Complex.isConservativeOn_and_continuousOn_iff_isDifferentiableOn hU).mp ⟨?_, hc⟩
      intro z w hzw
      have h := hrect z w hzw
      rw [← Complex.wedgeIntegral_add_wedgeIntegral_eq] at h
      exact eq_neg_of_add_eq_zero_left h
- id: entire_polynomial_growth_is_polynomial
  kind: textbook
  level: 3
  topic: リウヴィルの定理の系・多項式増大
  statement: 整関数$f$が全ての$z$で$|f(z)|\leq C(1+|z|)^k$($k\in\mathbb{N}$)を満たすならば、$f$は次数$k$以下の多項式である。
  statement_en: An entire function f with |f(z)| ≤ C (1+|z|)^k for all z, k a natural number, is a polynomial of degree at most k.
  assumptions:
  - $f$は整関数
  - 全ての$z$で$|f(z)|\leq C(1+|z|)^k$
  quantifiers:
  - 任意の$f$、$C\in\mathbb{R}$、自然数$k$
  conclusion: 次数$k$以下の多項式$p$があり$f=p$である。
  answer: |-
    $f$を整関数、$C\in\mathbb{R}$、$k$を自然数とし、全ての$z$で$|f(z)|\leq C(1+|z|)^k$とする。$z=0$より$C\geq 0$である。$n>k$、$R\geq 1$とする。円周$|z|=R$上で$|f(z)|\leq C(1+R)^k\leq C(2R)^k$である。コーシーの評価より
    $|f^{(n)}(0)|\leq\frac{n!C2^kR^k}{R^n}\leq\frac{n!C2^k}{R}$
    である。$R\to\infty$として$f^{(n)}(0)=0$を得る。

    整関数は原点でのテイラー級数に等しいので、$f(z)=\sum_{n\leq k}\frac{f^{(n)}(0)}{n!}z^n$である。これは次数$k$以下の多項式である。
  strategy: Use Cauchy's estimate on large circles to kill all Taylor coefficients of degree above k.
  sketch:
  - 'apply_theorem: Cauchy''s estimate on |z| = R bounds f^(n)(0).'
  - 'derive: For n > k the bound tends to 0 as R tends to infinity.'
  - 'conclude: The Taylor series is a polynomial of degree at most k.'
  openmath: (forall (f B k) (-> (and (entire_function f) (in k N) (forall (z) (<= (abs (fn_value f z)) (* B (^ (+ 1 (abs z)) k))))) (exists (p) (and (complex_polynomial p) (<= (poly_degree p) k) (forall (z) (= (fn_value f z) (poly_eval p z)))))))
  hard_negative:
    statement: $|f(z)|\leq C(1+|z|)^k$なら$f$は次数ちょうど$k$の多項式である。
    reason: $f=1$は$k=2$、$C=1$で不等式を満たすが次数$0$である。
  target: |
    ∀ (f : ℂ → ℂ) (C : ℝ) (k : ℕ), Differentiable ℂ f → (∀ z, ‖f z‖ ≤ C * (1 + ‖z‖) ^ k) → ∃ p : Polynomial ℂ, p.natDegree ≤ k ∧ ∀ z, f z = p.eval z
  proof: |
    by
      intro f C k hf hb
      have hC : 0 ≤ C := by
        have := (norm_nonneg _).trans (hb 0)
        simpa using this
      have hv : ∀ n, k < n → iteratedDeriv n f 0 = 0 := by
        intro n hn
        by_contra hne
        have hpos : 0 < ‖iteratedDeriv n f 0‖ := norm_pos_iff.mpr hne
        have key : ∀ R : ℝ, 1 ≤ R → ‖iteratedDeriv n f 0‖ ≤ n.factorial * (C * 2 ^ k) / R := by
          intro R hR
          have hR0 : 0 < R := by linarith
          have hs : ∀ z ∈ Metric.sphere (0 : ℂ) R, ‖f z‖ ≤ C * (2 * R) ^ k := by
            intro z hz
            have hz' : ‖z‖ = R := by simpa using hz
            refine (hb z).trans ?_
            rw [hz']
            gcongr
            linarith
          have h1 := Complex.norm_iteratedDeriv_le_of_forall_mem_sphere_norm_le n hR0 (hf.diffContOnCl (s := Metric.ball 0 R)) hs
          refine h1.trans ?_
          obtain ⟨d, rfl⟩ : ∃ d, n = k + 1 + d := ⟨n - (k + 1), by omega⟩
          have hRd : 1 ≤ R ^ d := one_le_pow₀ hR
          rw [mul_pow, pow_add, pow_add, div_le_div_iff₀ (by positivity) hR0]
          have hA : 0 ≤ ((k + 1 + d).factorial : ℝ) * (C * (2 ^ k)) := by positivity
          have : ((k + 1 + d).factorial : ℝ) * (C * (2 ^ k * R ^ k)) * R = ((k + 1 + d).factorial : ℝ) * (C * 2 ^ k) * (R ^ k * R) := by ring
          rw [this]
          have h3 : R ^ k * R ^ 1 ≤ R ^ k * R ^ 1 * R ^ d := le_mul_of_one_le_right (by positivity) hRd
          simpa [pow_one] using mul_le_mul_of_nonneg_left h3 hA
        have hlim := tendsto_const_nhds.div_atTop (Filter.tendsto_id (α := ℝ) (x := Filter.atTop)) (a := (n.factorial : ℝ) * (C * 2 ^ k))
        have : ‖iteratedDeriv n f 0‖ ≤ 0 := by
          refine ge_of_tendsto hlim ?_
          filter_upwards [Filter.eventually_ge_atTop (1 : ℝ)] with R hR using key R hR
        exact absurd hpos (not_lt.mpr this)
      refine ⟨∑ n ∈ Finset.range (k + 1), Polynomial.C (iteratedDeriv n f 0 / n.factorial) * Polynomial.X ^ n, ?_, ?_⟩
      · refine Polynomial.natDegree_sum_le_of_forall_le _ _ (fun n hn => ?_)
        have : n ≤ k := Nat.lt_succ_iff.mp (Finset.mem_range.mp hn)
        exact (Polynomial.natDegree_C_mul_X_pow_le _ _).trans this
      · intro z
        have hs := Complex.hasSum_taylorSeries_of_entire hf 0 z
        have hfin := hs.unique (hasSum_sum_of_ne_finset_zero (s := Finset.range (k + 1)) (fun n hn => by
          have : k < n := by
            have := Finset.mem_range.not.mp hn
            omega
          simp [hv n this]))
        rw [hfin, Polynomial.eval_finset_sum]
        refine Finset.sum_congr rfl (fun n _ => ?_)
        simp
        ring
- id: entire_sublinear_growth_is_constant
  kind: gap
  level: 3
  topic: リウヴィルの定理の系・劣線形増大
  statement: 整関数$f$が$|z|\to\infty$で$f(z)/z\to 0$を満たすならば、$f$は定数である。
  statement_en: An entire function f with f(z)/z tending to 0 as |z| tends to infinity is constant.
  assumptions:
  - $f$は整関数
  - $|z|\to\infty$で$f(z)/z\to 0$
  quantifiers:
  - 任意の$f$と任意の$z,w$
  conclusion: $f(z)=f(w)$である。
  answer: |-
    $f$を整関数で$|z|\to\infty$のとき$f(z)/z\to 0$を満たすものとする。$c\in\mathbb{C}$と$\varepsilon>0$を取る。仮定より$T>0$があり、$|z|>T$で$|f(z)|\leq\varepsilon|z|$である。$R>T+|c|$かつ$R\geq|c|$とする。円周$|z-c|=R$上で$|z|\geq R-|c|>T$、$|z|\leq R+|c|\leq 2R$なので$|f(z)|\leq 2\varepsilon R$である。コーシーの評価より$|f'(c)|\leq 2\varepsilon R/R=2\varepsilon$である。

    $\varepsilon$は任意なので$f'(c)=0$である。$c$も任意なので$f'=0$であり、平面は連結なので$f$は定数である。
  strategy: Apply the Cauchy estimate for f' on a large circle centred at an arbitrary point.
  sketch:
  - 'setup: Fix c and ε; choose T with |f(z)| ≤ ε|z| for |z| > T.'
  - 'derive: On a large circle about c, |f| ≤ 2εR.'
  - 'apply_theorem: The Cauchy estimate gives |f''(c)| ≤ 2ε.'
  - 'conclude: f'' = 0, so f is constant.'
  openmath: (forall (f) (-> (and (entire_function f) (limit_at_infinity_fn (lambda (z) (/ (fn_value f z) z)) 0)) (forall (z w) (= (fn_value f z) (fn_value f w)))))
  hard_negative:
    statement: $f(z)/z$が有界なら$f$は定数である。
    reason: $f(z)=z$では$f(z)/z=1$は有界だが$f$は定数でない。
  target: |
    ∀ (f : ℂ → ℂ), Differentiable ℂ f → Filter.Tendsto (fun z => f z / z) (Bornology.cobounded ℂ) (nhds 0) → ∀ z w, f z = f w
  proof: |
    by
      intro f hf hlim
      have hd : ∀ c, deriv f c = 0 := by
        intro c
        by_contra hne
        have hpos : 0 < ‖deriv f c‖ := norm_pos_iff.mpr hne
        set ε := ‖deriv f c‖ / 4 with hε
        have hε0 : 0 < ε := by positivity
        have hev : ∀ᶠ z in Bornology.cobounded ℂ, ‖f z / z‖ < ε := by
          have := (tendsto_zero_iff_norm_tendsto_zero.mp hlim).eventually (gt_mem_nhds hε0)
          exact this
        have hbd : Bornology.IsBounded {z | ‖f z / z‖ < ε}ᶜ := Bornology.isBounded_compl_iff.mpr hev
        obtain ⟨T, hT⟩ := (Metric.isBounded_iff_subset_closedBall 0).mp hbd
        have hbound : ∀ z : ℂ, T < ‖z‖ → ‖f z / z‖ < ε := by
          intro z hz
          by_contra h
          have := hT (show z ∈ {z | ‖f z / z‖ < ε}ᶜ from h)
          rw [mem_closedBall_zero_iff] at this
          linarith
        set R := |T| + ‖c‖ + 1 with hRdef
        have hR : 0 < R := by positivity
        have hs : ∀ z ∈ Metric.sphere c R, ‖f z‖ ≤ 2 * ε * R := by
          intro z hz
          have hz' : ‖z - c‖ = R := mem_sphere_iff_norm.mp hz
          have h1 : R - ‖c‖ ≤ ‖z‖ := by
            have := norm_sub_le z c
            linarith
          have h2 : ‖z‖ ≤ R + ‖c‖ := by
            have := norm_add_le (z - c) c
            simp only [sub_add_cancel] at this
            linarith
          have h3 : T < ‖z‖ := by
            have := le_abs_self T
            linarith
          have h4 : 0 < ‖z‖ := by
            have := abs_nonneg T
            linarith
          have h5 := hbound z h3
          rw [norm_div, div_lt_iff₀ h4] at h5
          have h6 : ‖z‖ ≤ 2 * R := by
            have : ‖c‖ ≤ R := by
              have := abs_nonneg T
              linarith
            linarith
          calc ‖f z‖ ≤ ε * ‖z‖ := h5.le
            _ ≤ ε * (2 * R) := by gcongr
            _ = 2 * ε * R := by ring
        have h7 := Complex.norm_deriv_le_of_forall_mem_sphere_norm_le hR (hf.diffContOnCl (s := Metric.ball c R)) hs
        have h8 : 2 * ε * R / R = 2 * ε := by field_simp
        rw [h8, hε] at h7
        linarith
      exact fun z w => is_const_of_deriv_eq_zero hf hd z w
- id: entire_real_part_bounded_above_constant
  kind: gap
  level: 3
  topic: リウヴィルの定理の系・実部の上界
  statement: 整関数$f$が全ての$z$で$\operatorname{Re}f(z)\leq M$を満たすならば、$f$は定数である。
  statement_en: An entire function whose real part is bounded above by a constant M is constant.
  assumptions:
  - $f$は整関数
  - 全ての$z$で$\operatorname{Re}f(z)\leq M$
  quantifiers:
  - 任意の$f,M$と任意の$z,w$
  conclusion: $f(z)=f(w)$である。
  answer: $f$を整関数で全ての$z$で$\operatorname{Re}f(z)\leq M$を満たすものとする。$g=e^f$は整関数であり、$|g|=e^{\operatorname{Re}f}\leq e^M$なので有界である。リウヴィルの定理より$g$は定数である。$0=g'=f'e^f$で$e^f\neq 0$なので$f'=0$である。平面は連結なので$f$は定数である。
  strategy: Apply Liouville's theorem to exp f.
  sketch:
  - 'construct: Let g = exp f, an entire function with |g| ≤ e^M.'
  - 'apply_theorem: Liouville''s theorem makes g constant.'
  - 'derive: g'' = f'' g = 0 and g ≠ 0 give f'' = 0.'
  - 'conclude: f is constant.'
  openmath: (forall (f B) (-> (and (entire_function f) (forall (z) (<= (real_part (fn_value f z)) B))) (forall (z w) (= (fn_value f z) (fn_value f w)))))
  hard_negative:
    statement: 実軸上でだけ$\operatorname{Re}f\leq M$なら、整関数$f$は定数である。
    reason: $f(z)=iz$は実軸上で実部が$0$だが定数でない。平面全体での上界が必要である。
  target: |
    ∀ (f : ℂ → ℂ) (M : ℝ), Differentiable ℂ f → (∀ z, (f z).re ≤ M) → ∀ z w, f z = f w
  proof: |
    by
      intro f M hf hM
      have hg : Differentiable ℂ (fun z => Complex.exp (f z)) := hf.cexp
      have hb : Bornology.IsBounded (Set.range fun z => Complex.exp (f z)) := by
        refine (Metric.isBounded_iff_subset_closedBall 0).mpr ⟨Real.exp M, ?_⟩
        rintro _ ⟨z, rfl⟩
        simp only [mem_closedBall_zero_iff, Complex.norm_exp]
        exact Real.exp_le_exp.mpr (hM z)
      have hc : ∀ z w, Complex.exp (f z) = Complex.exp (f w) := fun z w => hg.apply_eq_apply_of_bounded hb z w
      have hd : ∀ c, deriv f c = 0 := by
        intro c
        have h1 : HasDerivAt (fun z => Complex.exp (f z)) (Complex.exp (f c) * deriv f c) c := (hf c).hasDerivAt.cexp
        have h2 : HasDerivAt (fun z => Complex.exp (f z)) 0 c := by
          have : (fun z => Complex.exp (f z)) = fun _ => Complex.exp (f c) := funext fun z => hc z c
          rw [this]; exact hasDerivAt_const _ _
        have h3 := h1.unique h2
        exact (mul_eq_zero.mp h3).resolve_left (Complex.exp_ne_zero _)
      exact fun z w => is_const_of_deriv_eq_zero hf hd z w
- id: entire_image_dense_or_constant
  kind: gap
  level: 3
  topic: リウヴィルの定理の系・像の稠密性
  statement: 整関数$f$は定数であるか、その像が$\mathbb{C}$で稠密である。これは下に有界な絶対値の場合を、任意の点からの距離へ一般化したものである。
  statement_en: Generalizing the bounded-below modulus case to distance from any point, an entire function is either constant or has dense image in the complex plane.
  assumptions:
  - $f$は整関数
  quantifiers:
  - 任意の$f$
  conclusion: $f$は定数であるか、$f(\mathbb{C})$は$\mathbb{C}$で稠密である。
  answer: $f$を整関数とし、像が稠密でないとする。$a\in\mathbb{C}$と$\varepsilon>0$があり、全ての$z$で$|f(z)-a|\geq\varepsilon$である。このとき$g=1/(f-a)$は整関数で$|g|\leq 1/\varepsilon$である。リウヴィルの定理より$g$は定数である。$g\neq 0$なので$f=a+1/g$も定数である。
  strategy: If the image misses a disc, apply Liouville's theorem to 1/(f-a).
  sketch:
  - 'setup: Assume the image misses a disc about a of radius ε.'
  - 'construct: g = 1/(f-a) is entire and bounded by 1/ε.'
  - 'apply_theorem: Liouville''s theorem makes g constant.'
  - 'conclude: f = a + 1/g is constant.'
  openmath: (forall (f) (-> (entire_function f) (or (forall (z w) (= (fn_value f z) (fn_value f w))) (dense_in (image_of f C) C))))
  hard_negative:
    statement: 非定数の整関数は全射である。
    reason: $f(z)=e^z$は非定数だが$0$を値に取らない。
  target: |
    ∀ (f : ℂ → ℂ), Differentiable ℂ f → (∀ z w, f z = f w) ∨ Dense (Set.range f)
  proof: |
    by
      intro f hf
      by_cases hd : Dense (Set.range f)
      · exact Or.inr hd
      left
      rw [dense_iff_closure_eq] at hd
      obtain ⟨a, ha⟩ : ∃ a, a ∉ closure (Set.range f) := by
        by_contra h
        push_neg at h
        exact hd (Set.eq_univ_of_forall h)
      rw [Metric.mem_closure_iff] at ha
      push_neg at ha
      obtain ⟨ε, hε, hfar⟩ := ha
      have hfar' : ∀ z, ε ≤ ‖f z - a‖ := fun z => by
        have := hfar (f z) ⟨z, rfl⟩
        rwa [dist_comm, dist_eq_norm] at this
      have hne : ∀ z, f z - a ≠ 0 := fun z h => by
        have := hfar' z
        rw [h, norm_zero] at this
        linarith
      have hg : Differentiable ℂ (fun z => (f z - a)⁻¹) := (hf.sub_const a).inv hne
      have hb : Bornology.IsBounded (Set.range fun z => (f z - a)⁻¹) := by
        refine (Metric.isBounded_iff_subset_closedBall 0).mpr ⟨ε⁻¹, ?_⟩
        rintro _ ⟨z, rfl⟩
        simp only [mem_closedBall_zero_iff, norm_inv]
        exact inv_anti₀ hε (hfar' z)
      intro z w
      have := hg.apply_eq_apply_of_bounded hb z w
      have h2 := inv_injective this
      exact sub_left_injective h2
- id: entire_doubly_periodic_constant
  kind: gap
  level: 3
  topic: リウヴィルの定理の系・二重周期
  statement: 整関数$f$が周期$\omega_1\neq 0,\omega_2$を持ち、$\operatorname{Im}(\omega_2/\omega_1)\neq 0$(二つの周期が実数上一次独立)ならば、$f$は定数である。
  statement_en: An entire function with periods ω_1 ≠ 0 and ω_2 such that Im(ω_2/ω_1) ≠ 0, so the periods are linearly independent over the reals, is constant.
  assumptions:
  - $f$は整関数
  - $\omega_1\neq 0$、$\operatorname{Im}(\omega_2/\omega_1)\neq 0$
  - 全ての$z$で$f(z+\omega_1)=f(z)$、$f(z+\omega_2)=f(z)$
  quantifiers:
  - 任意の$f,\omega_1,\omega_2$と任意の$z,w$
  conclusion: $f(z)=f(w)$である。
  answer: |-
    $f$を整関数、$\omega_1\neq 0,\omega_2$を$\operatorname{Im}(\omega_2/\omega_1)\neq 0$なる$f$の周期とする。$\tau=\omega_2/\omega_1$は実数でないので、任意の$z$は実数$s,t$により$z=s\omega_1+t\omega_2$と書ける。実際$z/\omega_1=s+t\tau$を虚部と実部で解けばよい。

    $P=\{s\omega_1+t\omega_2\mid 0\leq s,t\leq 1\}$はコンパクトなので、連続な$|f|$は$P$上で上界$M$を持つ。$z=s\omega_1+t\omega_2$に対し$\{s\}=s-\lfloor s\rfloor$、$\{t\}=t-\lfloor t\rfloor$とおくと、周期性から$f(z)=f(\{s\}\omega_1+\{t\}\omega_2)$であり、$|f(z)|\leq M$である。リウヴィルの定理より$f$は定数である。
  strategy: Every value of f is attained on the compact fundamental parallelogram, so f is bounded.
  sketch:
  - 'translate: Non-real τ gives real coordinates z = sω_1 + tω_2.'
  - 'derive: f is bounded on the compact parallelogram.'
  - 'derive: Periodicity moves any point into the parallelogram.'
  - 'apply_theorem: Liouville''s theorem.'
  openmath: (forall (f a b) (-> (and (entire_function f) (!= a 0) (!= (imag_part (/ b a)) 0) (forall (z) (= (fn_value f (+ z a)) (fn_value f z))) (forall (z) (= (fn_value f (+ z b)) (fn_value f z)))) (forall (z w) (= (fn_value f z) (fn_value f w)))))
  hard_negative:
    statement: 周期を一つ持つ整関数は定数である。
    reason: $f(z)=e^{z}$は周期$2\pi i$を持つが定数でない。
  target: |
    ∀ (f : ℂ → ℂ) (ω₁ ω₂ : ℂ), Differentiable ℂ f → ω₁ ≠ 0 → (ω₂ / ω₁).im ≠ 0 → (∀ z, f (z + ω₁) = f z) → (∀ z, f (z + ω₂) = f z) → ∀ z w, f z = f w
  proof: |
    by
      intro f ω₁ ω₂ hf h1 him p1 p2
      have hP1 : Function.Periodic f ω₁ := p1
      have hP2 : Function.Periodic f ω₂ := p2
      set g : ℝ × ℝ → ℂ := fun x => f ((x.1 : ℂ) * ω₁ + (x.2 : ℂ) * ω₂) with hg
      have hgc : Continuous g := by
        apply hf.continuous.comp
        fun_prop
      have hK : IsCompact (Set.Icc (0 : ℝ) 1 ×ˢ Set.Icc (0 : ℝ) 1) := isCompact_Icc.prod isCompact_Icc
      obtain ⟨M, hM⟩ := hK.exists_bound_of_continuousOn hgc.continuousOn
      have hb : Bornology.IsBounded (Set.range f) := by
        refine (Metric.isBounded_iff_subset_closedBall 0).mpr ⟨M, ?_⟩
        rintro _ ⟨z, rfl⟩
        simp only [mem_closedBall_zero_iff]
        set τ := ω₂ / ω₁ with hτ
        set t : ℝ := (z / ω₁).im / τ.im with ht
        set s : ℝ := (z / ω₁).re - t * τ.re with hs
        have hz : z = (s : ℂ) * ω₁ + (t : ℂ) * ω₂ := by
          have h2 : ω₂ = τ * ω₁ := by rw [hτ]; field_simp
          have h3 : z / ω₁ = (s : ℂ) + (t : ℂ) * τ := by
            apply Complex.ext
            · simp [hs]
            · simp [ht]; field_simp
          calc z = (z / ω₁) * ω₁ := by field_simp
            _ = _ := by rw [h3, h2]; ring
        have hfz : f z = g (Int.fract s, Int.fract t) := by
          simp only [hg]
          have e : z = ((Int.fract s : ℝ) : ℂ) * ω₁ + ((Int.fract t : ℝ) : ℂ) * ω₂ + (⌊s⌋ • ω₁ + ⌊t⌋ • ω₂) := by
            rw [hz]
            have es : (s : ℂ) = ((Int.fract s : ℝ) : ℂ) + (⌊s⌋ : ℂ) := by
              have := Int.fract_add_floor s
              exact_mod_cast this.symm
            have et : (t : ℂ) = ((Int.fract t : ℝ) : ℂ) + (⌊t⌋ : ℂ) := by
              have := Int.fract_add_floor t
              exact_mod_cast this.symm
            simp only [zsmul_eq_mul]
            nth_rw 1 [es]
            nth_rw 1 [et]
            ring
          rw [e]
          rw [← add_assoc, hP2.zsmul]
          rw [hP1.zsmul]
        rw [hfz]
        exact hM _ ⟨⟨Int.fract_nonneg s, (Int.fract_lt_one s).le⟩, ⟨Int.fract_nonneg t, (Int.fract_lt_one t).le⟩⟩
      exact fun z w => hf.apply_eq_apply_of_bounded hb z w
- id: polynomial_norm_tends_to_infinity
  kind: gap
  level: 2
  topic: 多項式・無限遠での増大
  statement: 次数が正の複素多項式$p$について、$|z|\to\infty$で$|p(z)|\to\infty$である。
  statement_en: For a complex polynomial p of positive degree, |p(z)| tends to infinity as |z| tends to infinity.
  assumptions:
  - $p$は次数が正の複素多項式
  quantifiers:
  - 任意の$p$
  conclusion: $|z|\to\infty$で$|p(z)|\to\infty$である。
  answer: |-
    $p(z)=a_nz^n+\dots+a_0$、$n\geq 1$、$a_n\neq 0$とする。$z\neq 0$で
    $|p(z)|=|z|^n\left|a_n+\sum_{k<n}a_kz^{k-n}\right|$
    である。$|z|\to\infty$で和の部分は$0$に収束するので、十分大きな$|z|$で括弧内の絶対値は$|a_n|/2$以上である。よって$|p(z)|\geq|a_n||z|^n/2\to\infty$である。
  strategy: Factor out the leading term.
  sketch:
  - 'derive: Factor z^n out of p(z).'
  - 'derive: The remaining factor tends to a_n ≠ 0.'
  - 'conclude: |p(z)| ≥ |a_n||z|^n/2 for large |z|.'
  openmath: (forall (p) (-> (and (complex_polynomial p) (> (poly_degree p) 0)) (limit_norm_infinity_fn (lambda (z) (poly_eval p z)))))
  hard_negative:
    statement: 次数が$0$の多項式でも$|p(z)|\to\infty$である。
    reason: $p=1$は次数$0$で$|p|=1$である。次数が正であることが必要である。
  target: |
    ∀ (p : Polynomial ℂ), 0 < p.degree → Filter.Tendsto (fun z => ‖p.eval z‖) (Bornology.cobounded ℂ) Filter.atTop
  proof: |
    by
      intro p hp
      exact p.tendsto_norm_atTop hp tendsto_norm_cobounded_atTop
- id: nonconstant_polynomial_surjective
  kind: gap
  level: 3
  topic: 代数学の基本定理・全射性
  statement: 次数が正の複素多項式$p$は$\mathbb{C}$から$\mathbb{C}$への全射である。これは代数学の基本定理の値$0$を任意の値に一般化したものである。
  statement_en: Generalizing the fundamental theorem of algebra from the value 0 to any value, a complex polynomial of positive degree is surjective onto the complex plane.
  assumptions:
  - $p$は次数が正の複素多項式
  quantifiers:
  - 任意の$p$と任意の$w\in\mathbb{C}$
  conclusion: $p(z)=w$なる$z$がある。
  answer: $p$を次数が正の複素多項式、$w\in\mathbb{C}$とする。$q=p-w$は$p$と同じ次数を持つ。代数学の基本定理より$q$は根$z$を持つ。このとき$p(z)=w$である。
  strategy: Apply the fundamental theorem of algebra to p - w.
  sketch:
  - 'construct: q = p - w has the same positive degree.'
  - 'apply_theorem: q has a root by the fundamental theorem of algebra.'
  - 'conclude: That root solves p(z) = w.'
  openmath: (forall (p w) (-> (and (complex_polynomial p) (> (poly_degree p) 0)) (exists (z) (= (poly_eval p z) w))))
  hard_negative:
    statement: 次数が正の実係数多項式は実数全体への全射である。
    reason: $p(x)=x^2$の値は負にならない。
  target: |
    ∀ (p : Polynomial ℂ) (w : ℂ), 0 < p.degree → ∃ z, p.eval z = w
  proof: |
    by
      intro p w hp
      have hd : (p - Polynomial.C w).degree = p.degree := Polynomial.degree_sub_C hp
      obtain ⟨z, hz⟩ := Complex.exists_root (f := p - Polynomial.C w) (by rwa [hd])
      refine ⟨z, ?_⟩
      simpa [Polynomial.IsRoot, sub_eq_zero] using hz
- id: gauss_lucas_theorem
  kind: named
  level: 3
  topic: 代数学の基本定理の周辺・ガウス・リュカの定理
  statement: ガウス・リュカの定理。次数が正の複素多項式$P$について、導関数$P'$の根は全て$P$の根の凸包に含まれる。
  statement_en: The Gauss-Lucas theorem. For a complex polynomial P of positive degree, every root of P' lies in the convex hull of the roots of P.
  assumptions:
  - $P$は次数が正の複素多項式
  quantifiers:
  - 任意の$P$
  conclusion: $P'$の根は$P$の根の凸包に含まれる。
  answer: |-
    $P$を次数が正の複素多項式とし、$P(z)=a\prod_{j=1}^n(z-r_j)$と分解する。$z$を$P'(z)=0$なる点とする。$z$が$P$の根なら凸包に含まれる。

    $z$が根でないとする。対数微分により$0=P'(z)/P(z)=\sum_j1/(z-r_j)$である。共役を取り$1/\overline{w}=w/|w|^2$を使うと
    $0=\sum_j\frac{z-r_j}{|z-r_j|^2}$
    である。$\lambda_j=|z-r_j|^{-2}>0$とおくと$z\sum_j\lambda_j=\sum_j\lambda_jr_j$である。よって$z$は$r_j$の正の重みによる凸結合であり、凸包に含まれる。
  strategy: Take the logarithmic derivative at a root of P' and rewrite it as a convex combination of the roots.
  sketch:
  - 'case_split: A root of P'' that is also a root of P lies in the hull.'
  - 'derive: Otherwise the logarithmic derivative gives Σ 1/(z-r_j) = 0.'
  - 'derive: Conjugating gives Σ (z-r_j)/|z-r_j|^2 = 0.'
  - 'conclude: z is a convex combination of the r_j.'
  openmath: (forall (p) (-> (and (complex_polynomial p) (> (poly_degree p) 0)) (subset (polynomial_root_set (poly_derivative p)) (convex_hull (polynomial_root_set p)))))
  hard_negative:
    statement: $P$の根は全て$P'$の根の凸包に含まれる。
    reason: $P(z)=z^2-1$では$P'$の根は$0$だけで、凸包は$\{0\}$であり、$P$の根$\pm 1$を含まない。
  target: |
    ∀ (P : Polynomial ℂ), 0 < P.degree → P.derivative.rootSet ℂ ⊆ convexHull ℝ (P.rootSet ℂ)
  proof: |
    by
      intro P hP
      exact Polynomial.rootSet_derivative_subset_convexHull_rootSet hP
- id: zero_order_derivatives_iff_factorization
  kind: gap
  level: 3
  topic: 零点の位数・導関数と因数分解
  statement: $f$が$c$で解析的、$n\in\mathbb{N}$とする。「$k<n$で$f^{(k)}(c)=0$かつ$f^{(n)}(c)\neq 0$」と「$c$の近傍で$f(z)=(z-c)^ng(z)$となる$c$で解析的な$g$があり$g(c)\neq 0$」は同値である。
  statement_en: For f analytic at c and n natural, the conditions f^(k)(c) = 0 for k < n with f^(n)(c) ≠ 0 and f(z) = (z-c)^n g(z) near c with g analytic at c and g(c) ≠ 0 are equivalent.
  assumptions:
  - $f$は$c$で解析的
  quantifiers:
  - 任意の$f,c$と自然数$n$
  conclusion: 二つの条件は同値である。
  answer: |-
    $f$を$c$で解析的、$n\in\mathbb{N}$とする。$c$の近傍で$f(z)=\sum_ka_k(z-c)^k$、$a_k=f^{(k)}(c)/k!$である。

    前者を仮定すると$a_k=0$($k<n$)、$a_n\neq 0$である。$g(z)=\sum_{k\geq n}a_k(z-c)^{k-n}$は同じ円板で収束するので解析的で、$g(c)=a_n\neq 0$、$f(z)=(z-c)^ng(z)$である。

    後者を仮定する。$g(z)=\sum_jb_j(z-c)^j$、$b_0=g(c)\neq 0$と展開すると$f(z)=\sum_jb_j(z-c)^{j+n}$である。べき級数の係数の一意性から$a_k=0$($k<n$)、$a_n=b_0\neq 0$である。よって前者が成り立つ。
  strategy: Compare Taylor coefficients of f with those of (z-c)^n g.
  sketch:
  - 'derive: Forward, divide the power series of f by (z-c)^n.'
  - 'derive: Backward, multiply the power series of g by (z-c)^n.'
  - 'apply_theorem: Uniqueness of power series coefficients concludes.'
  openmath: (forall (f c n) (-> (and (analytic_at f c) (in n N)) (<-> (and (forall (k) (-> (and (in k N) (< k n)) (= (iterated_complex_deriv k f c) 0))) (!= (iterated_complex_deriv n f c) 0)) (exists (g) (and (analytic_at g c) (!= (fn_value g c) 0) (eq_near (lambda (z) (fn_value f z)) (lambda (z) (* (^ (- z c) n) (fn_value g z))) c))))))
  hard_negative:
    statement: $f(c)=0$なら$c$の近傍で$f(z)=(z-c)g(z)$、$g(c)\neq 0$と書ける。
    reason: $f(z)=(z-c)^2$では$g(z)=z-c$となり$g(c)=0$である。零点の位数が$1$のときだけ成り立つ。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ) (n : ℕ), AnalyticAt ℂ f c → (((∀ k < n, iteratedDeriv k f c = 0) ∧ iteratedDeriv n f c ≠ 0) ↔ ∃ g : ℂ → ℂ, AnalyticAt ℂ g c ∧ g c ≠ 0 ∧ ∀ᶠ z in nhds c, f z = (z - c) ^ n * g z)
  proof: |
    by
      intro f c n hf
      rw [← analyticOrderAt_eq_nat_iff_iteratedDeriv_eq_zero hf, hf.analyticOrderAt_eq_natCast]
      simp only [smul_eq_mul]
- id: analytic_order_deriv_add_one
  kind: gap
  level: 3
  topic: 零点の位数・導関数
  statement: $f$が$c$で解析的なら、$f'$の$c$での零点の位数を$\operatorname{ord}_c f'$とすると、$\operatorname{ord}_cf'+1=\operatorname{ord}_c(f-f(c))$である(恒等的に$0$となる場合の位数は$\infty$とする)。
  statement_en: If f is analytic at c, then the order at c of f' plus 1 equals the order at c of f - f(c), the order of a function vanishing near c being infinite.
  assumptions:
  - $f$は$c$で解析的
  - 近傍で恒等的に$0$の関数の位数は$\infty$
  quantifiers:
  - 任意の$f,c$
  conclusion: $\operatorname{ord}_cf'+1=\operatorname{ord}_c(f-f(c))$である。
  answer: |-
    $f$を$c$で解析的とし、$c$の近傍で$f(z)-f(c)=\sum_{k\geq 1}a_k(z-c)^k$と展開する。項別微分で$f'(z)=\sum_{k\geq 1}ka_k(z-c)^{k-1}$である。

    全ての$k\geq 1$で$a_k=0$なら、$f-f(c)$も$f'$も近傍で$0$であり、両辺は$\infty$である。

    そうでなければ$a_m\neq 0$なる最小の$m\geq 1$を取る。$f-f(c)$の位数は$m$である。$f'$の展開で$k<m$の係数は$0$で、$k=m$の係数は$ma_m\neq 0$なので、$f'$の位数は$m-1$である。よって等式が成り立つ。
  strategy: Compare the power series of f - f(c) and its term-by-term derivative.
  sketch:
  - 'setup: Expand f - f(c) about c.'
  - 'case_split: Either all coefficients vanish, or take the first nonzero a_m.'
  - 'derive: The first nonzero coefficient of f'' is m a_m at degree m-1.'
  openmath: (forall (f c) (-> (analytic_at f c) (= (+ (analytic_order_fn (lambda (z) (complex_deriv f z)) c) 1) (analytic_order_fn (lambda (z) (- (fn_value f z) (fn_value f c))) c))))
  hard_negative:
    statement: $\operatorname{ord}_cf'+1=\operatorname{ord}_cf$である。
    reason: $f(z)=1+z$、$c=0$では$\operatorname{ord}_0f'=0$で左辺は$1$、$\operatorname{ord}_0f=0$である。$f(c)$を引く必要がある。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ), AnalyticAt ℂ f c → analyticOrderAt (deriv f) c + 1 = analyticOrderAt (fun z => f z - f c) c
  proof: |
    by
      intro f c hf
      exact hf.analyticOrderAt_deriv_add_one
- id: holomorphic_product_zero_implies_factor_zero
  kind: gap
  level: 3
  topic: 一致の定理の系・零因子がないこと
  statement: $U$を連結開集合、$f,g$を$U$で正則とする。$U$上で$fg=0$なら、$U$上で$f=0$であるか$U$上で$g=0$である。
  statement_en: If f and g are holomorphic on a connected open set U and fg = 0 on U, then f = 0 on U or g = 0 on U.
  assumptions:
