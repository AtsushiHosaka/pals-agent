          have hsmall : ∀ᶠ w in nhds z, ‖f w - f z‖ < Real.pi := by
            have : Filter.Tendsto (fun w => ‖f w - f z‖) (nhds z) (nhds ‖f z - f z‖) := (hfc.sub continuousAt_const).norm
            simp only [sub_self, norm_zero] at this
            exact this.eventually (gt_mem_nhds Real.pi_pos)
          filter_upwards [hsmall, hzn] with w hw hwU
          have e : g w / g z = Complex.exp (f w - f z) := by
            rw [Complex.exp_sub]
            have a1 : Complex.exp (f w) = g w := h2 hwU
            have a2 : Complex.exp (f z) = g z := h2 hz
            rw [a1, a2]
          have him : |(f w - f z).im| < Real.pi := lt_of_le_of_lt (Complex.abs_im_le_norm _) hw
          rw [e, Complex.log_exp (by linarith [(abs_lt.mp him).1]) (by linarith [(abs_lt.mp him).2])]
          ring
        exact ((differentiableAt_const _).add hq).congr_of_eventuallyEq hev |>.differentiableWithinAt
      have hn' : (n : ℂ) ≠ 0 := by exact_mod_cast hn
      refine ⟨fun z => Complex.exp (f z / n), (hfd.div_const _).cexp, fun z hz => ?_⟩
      simp only
      rw [← Complex.exp_nat_mul, mul_div_cancel₀ _ hn']
      exact h2 hz
- id: continuous_logs_differ_by_constant
  kind: gap
  level: 3
  topic: 対数の分枝・分枝の差
  statement: $U$を連結集合とする。$g,h$が$U$で連続で$U$上で$e^g=e^h$ならば、整数$k$があり$U$上で$g-h=2\pi ik$である。
  statement_en: If U is connected, g, h are continuous on U and e^g = e^h on U, then g - h = 2πik on U for a single integer k.
  assumptions:
  - $U$は連結で$c\in U$
  - $g,h$は$U$で連続
  - $U$上で$e^g=f=e^h$
  quantifiers:
  - 任意の$f,g,h,U,c$
  conclusion: 整数$k$があり$U$上で$g-h=2\pi ik$である。
  answer: $U$を連結集合、$c\in U$、$g,h$を$U$で連続な関数で、$U$上で$e^g=f=e^h$を満たすものとする。$z\in U$で$e^{g(z)-h(z)}=1$なので、$\phi(z)=(g(z)-h(z))/(2\pi i)$は整数である。$\phi$は$U$で連続である。連結集合の連続像は連結であり、整数の集合の連結部分集合は一点である。よって$\phi$は定数で、その値を$k$とすればよい。
  strategy: The continuous function (g-h)/(2πi) takes integer values, so it is constant on a connected set.
  sketch:
  - 'derive: e^(g-h) = 1 makes φ = (g-h)/(2πi) integer valued.'
  - 'apply_theorem: A continuous integer-valued function on a connected set is constant.'
  openmath: (forall (f g h U c) (-> (and (connected_set U) (in c U) (continuous_on_set g U) (continuous_on_set h U) (forall (z) (-> (in z U) (and (= (exp (fn_value g z)) (fn_value f z)) (= (exp (fn_value h z)) (fn_value f z)))))) (exists (k) (and (in k Z) (forall (z) (-> (in z U) (= (- (fn_value g z) (fn_value h z)) (* k (* 2 (* pi complex_imaginary_unit))))))))))
  hard_negative:
    statement: $U$が連結でなくても整数$k$は一つに定まる。
    reason: $U=\{0,1\}$、$g(0)=0$、$g(1)=2\pi i$、$h=0$では$e^g=e^h$だが差は$0$と$2\pi i$である。
  target: |
    ∀ (f g h : ℂ → ℂ) (U : Set ℂ) (c : ℂ), IsPreconnected U → c ∈ U → ContinuousOn g U → ContinuousOn h U → (∀ z ∈ U, Complex.exp (g z) = f z) → (∀ z ∈ U, Complex.exp (h z) = f z) → ∃ k : ℤ, ∀ z ∈ U, g z - h z = k * (2 * Real.pi * Complex.I)
  proof: |
    by
      intro f g h U c hU hc hg hh eg eh
      have hint : ∀ z ∈ U, ∃ n : ℤ, (g z - h z) / (2 * Real.pi * Complex.I) = n := by
        intro z hz
        have h1 : Complex.exp (g z) = Complex.exp (h z) := (eg z hz).trans (eh z hz).symm
        obtain ⟨n, hn⟩ := Complex.exp_eq_exp_iff_exists_int.mp h1
        refine ⟨n, ?_⟩
        rw [hn]
        have := Complex.two_pi_I_ne_zero
        field_simp
        ring
      set φ : ℂ → ℂ := fun z => (g z - h z) / (2 * Real.pi * Complex.I) with hφ
      have hφc : ContinuousOn φ U := (hg.sub hh).div_const _
      have hdisc : DiscreteTopology (Set.range ((↑) : ℤ → ℂ)) := by
        refine DiscreteTopology.of_forall_le_dist (r := 1) one_pos ?_
        rintro ⟨_, m, rfl⟩ ⟨_, n, rfl⟩ hne
        have hmn : m ≠ n := fun e => hne (by simp [e])
        have : (1 : ℝ) ≤ |(m : ℝ) - n| := by
          have h1 : (1 : ℤ) ≤ |m - n| := Int.one_le_abs (sub_ne_zero.mpr hmn)
          exact_mod_cast h1
        simpa [Subtype.dist_eq, Complex.dist_eq, ← Complex.ofReal_intCast, ← Complex.ofReal_sub, Complex.norm_real] using this
      have hmaps : Set.MapsTo φ U (Set.range ((↑) : ℤ → ℂ)) := by
        intro z hz
        obtain ⟨n, hn⟩ := hint z hz
        exact ⟨n, hn.symm⟩
      obtain ⟨k, hk⟩ := hint c hc
      refine ⟨k, fun z hz => ?_⟩
      have heq : φ z = φ c := hU.constant_of_mapsTo (isDiscrete_iff_discreteTopology.mpr hdisc) hφc hmaps hz hc
      have h2 := Complex.two_pi_I_ne_zero
      have : (g z - h z) / (2 * Real.pi * Complex.I) = k := heq.trans hk
      rw [div_eq_iff h2] at this
      exact this
- id: path_lift_exp_winding_integer
  kind: textbook
  level: 3
  topic: 指数関数・道の持ち上げと回転数
  statement: $\gamma:[0,1]\to\mathbb{C}\setminus\{0\}$を連続な道、$e^w=\gamma(0)$とする。連続な$\Gamma:[0,1]\to\mathbb{C}$があり、$\Gamma(0)=w$、$e^{\Gamma}=\gamma$である。さらに$\gamma(1)=\gamma(0)$なら、整数$k$があり$\Gamma(1)-\Gamma(0)=2\pi ik$である。
  statement_en: If γ is a continuous path in the punctured plane and e^w = γ(0), then there is a continuous Γ with Γ(0) = w and e^Γ = γ; if moreover γ(1) = γ(0), then Γ(1) - Γ(0) = 2πik for an integer k.
  assumptions:
  - $\gamma$は$[0,1]$上の連続な道で$0$を通らない
  - $e^w=\gamma(0)$
  quantifiers:
  - 任意の$\gamma,w$
  conclusion: 持ち上げ$\Gamma$が存在し、閉じた道なら$\Gamma(1)-\Gamma(0)\in 2\pi i\mathbb{Z}$である。
  answer: |-
    $\gamma:[0,1]\to\mathbb{C}\setminus\{0\}$を連続な道、$w$を$e^w=\gamma(0)$なる複素数とする。$\delta=\min_t|\gamma(t)|>0$とする。$\gamma$は一様連続なので、分割$0=t_0<\dots<t_m=1$があり、$t\in[t_j,t_{j+1}]$で$|\gamma(t)-\gamma(t_j)|<\delta$である。このとき$|\gamma(t)/\gamma(t_j)-1|<1$なので、$\gamma(t)/\gamma(t_j)$は右半平面にあり主値$\operatorname{Log}$が連続に定まる。

    $\Gamma(0)=w$とし、$t\in[t_j,t_{j+1}]$で$\Gamma(t)=\Gamma(t_j)+\operatorname{Log}(\gamma(t)/\gamma(t_j))$と順に定める。$\Gamma$は連続で、帰納的に$e^{\Gamma(t)}=e^{\Gamma(t_j)}\gamma(t)/\gamma(t_j)=\gamma(t)$である。

    $\gamma(1)=\gamma(0)$なら$e^{\Gamma(1)}=e^{\Gamma(0)}$なので、$\Gamma(1)-\Gamma(0)\in 2\pi i\mathbb{Z}$である。
  strategy: Subdivide the path so each piece stays in a right half-plane after dividing, and glue principal logarithms.
  sketch:
  - 'setup: Choose a partition with |γ(t) - γ(t_j)| < min |γ| on each piece.'
  - 'construct: Define Γ inductively using the principal logarithm of γ(t)/γ(t_j).'
  - 'derive: e^Γ = γ by induction.'
  - 'conclude: For a closed path, e^(Γ(1)) = e^(Γ(0)) gives an integer multiple of 2πi.'
  openmath: (forall (g w) (-> (and (continuous_path g) (forall (t) (-> (in t (closed_interval 0 1)) (!= (fn_value g t) 0))) (= (exp w) (fn_value g 0))) (exists (h) (and (continuous_path h) (= (fn_value h 0) w) (forall (t) (-> (in t (closed_interval 0 1)) (= (exp (fn_value h t)) (fn_value g t)))) (-> (= (fn_value g 1) (fn_value g 0)) (exists (k) (and (in k Z) (= (- (fn_value h 1) (fn_value h 0)) (* k (* 2 (* pi complex_imaginary_unit)))))))))))
  hard_negative:
    statement: 閉じた道の持ち上げも閉じている。
    reason: $\gamma(t)=e^{2\pi it}$の持ち上げは$\Gamma(t)=2\pi it$で、$\Gamma(1)-\Gamma(0)=2\pi i\neq 0$である。
  target: |
    ∀ (γ : C(unitInterval, ℂ)) (w : ℂ), (∀ t, γ t ≠ 0) → Complex.exp w = γ 0 → ∃ Γ : C(unitInterval, ℂ), Γ 0 = w ∧ (∀ t, Complex.exp (Γ t) = γ t) ∧ (γ 1 = γ 0 → ∃ k : ℤ, Γ 1 - Γ 0 = k * (2 * Real.pi * Complex.I))
  proof: |
    by
      intro γ w hγ hw
      let γ' : C(unitInterval, {z : ℂ // z ≠ 0}) := ⟨fun t => ⟨γ t, hγ t⟩, by
        exact Continuous.subtype_mk γ.continuous _⟩
      obtain ⟨Γ, h1, h2⟩ := Complex.isCoveringMap_exp.exists_path_lifts γ' w (by
        apply Subtype.ext
        exact hw.symm)
      have hl : ∀ t, Complex.exp (Γ t) = γ t := fun t => by
        have := congrFun h1 t
        exact congrArg Subtype.val this
      refine ⟨Γ, h2, hl, fun hc => ?_⟩
      have he : Complex.exp (Γ 1) = Complex.exp (Γ 0) := by rw [hl, hl, hc]
      obtain ⟨n, hn⟩ := Complex.exp_eq_exp_iff_exists_int.mp he
      exact ⟨n, by rw [hn]; ring⟩
- id: simply_connected_embeds_into_disc
  kind: textbook
  level: 4
  topic: リーマンの写像定理の第一段階
  statement: $U\neq\mathbb{C}$を単連結な開集合とする。$U$で正則で単射で導関数が消えない$f$があり、$f(U)$は開単位円板に含まれる。これはリーマンの写像定理の第一段階である(全射性はこの命題に含まない)。
  statement_en: The first step of the Riemann mapping theorem, surjectivity not included. If U ≠ ℂ is a simply connected open set, there is f holomorphic and injective on U with nonvanishing derivative and f(U) contained in the open unit disc.
  assumptions:
  - $U$は単連結な開集合で$U\neq\mathbb{C}$
  quantifiers:
  - 任意の$U$
  conclusion: $U$から開単位円板への単射な正則関数で導関数が消えないものがある。
  answer: |-
    $U\neq\mathbb{C}$を単連結な開集合とし、$a\notin U$を取る。$z-a$は$U$で正則で零点を持たないので、単連結領域での正則な平方根$s$があり、$s^2=z-a$である。$s$は単射である。$2ss'=1$より$s'\neq 0$であり、$s\neq 0$である。

    $z_0\in U$を取る。$s'(z_0)\neq 0$なので局所的な逆関数の定理により、$\varepsilon>0$があって円板$|w-s(z_0)|<\varepsilon$は$s(U)$に含まれる。$z\in U$で$|s(z)+s(z_0)|<\varepsilon$とすると、$-s(z)$がこの円板にあるので$-s(z)=s(y)$なる$y\in U$がある。$s(y)^2=s(z)^2$より$y=z$であり、$s(z)=0$となって矛盾する。よって$U$上で$|s(z)+s(z_0)|\geq\varepsilon$である。

    $f(z)=\frac{\varepsilon/2}{s(z)+s(z_0)}$とおく。$|f|\leq 1/2<1$である。$f$は正則で、$s$が単射なので単射である。$f'=-\frac{\varepsilon}{2}s'/(s+s(z_0))^2\neq 0$である。
  strategy: Take a square root of z - a, whose image misses a disc, and invert around that disc.
  sketch:
  - 'construct: A holomorphic square root s of z - a on U, with a outside U.'
  - 'derive: s is injective and s'' ≠ 0.'
  - 'derive: The image of s contains a disc, whose reflection the image misses.'
  - 'construct: f = (ε/2)/(s + s(z_0)) maps U into the unit disc.'
  openmath: (forall (U) (-> (and (open_set U) (simply_connected_space U) (!= U C)) (exists (f) (and (holomorphic_on f U) (fn_maps_to f U (open_disc 0 1)) (injective_on f U) (forall (z) (-> (in z U) (!= (complex_deriv f z) 0)))))))
  hard_negative:
    statement: $U=\mathbb{C}$でも単位円板への単射な正則関数がある。
    reason: 単位円板に値を取る整関数はリウヴィルの定理により定数であり、単射でない。
  target: |
    ∀ (U : Set ℂ), IsOpen U → IsSimplyConnected U → U ≠ Set.univ → ∃ f : ℂ → ℂ, DifferentiableOn ℂ f U ∧ Set.MapsTo f U (Metric.ball 0 1) ∧ Set.InjOn f U ∧ ∀ z ∈ U, deriv f z ≠ 0
  proof: |
    by
      intro U hU hs hne
      obtain ⟨a, ha⟩ : ∃ a, a ∉ U := by
        by_contra h
        push_neg at h
        exact hne (Set.eq_univ_of_forall h)
      have hg : DifferentiableOn ℂ (fun z : ℂ => z - a) U := differentiableOn_id.sub_const a
      have h0 : ∀ z ∈ U, z - a ≠ 0 := fun z hz h => ha (by rwa [← sub_eq_zero.mp h])
      obtain ⟨l, hl1, hl2⟩ := Complex.exists_continuousOn_eqOn_exp_comp hs hU hg.continuousOn (by
        rintro ⟨z, hz, hz0⟩
        exact h0 z hz hz0)
      have hld : DifferentiableOn ℂ l U := by
        intro z hz
        have hzn := hU.mem_nhds hz
        have hfc : ContinuousAt l z := hl1.continuousAt hzn
        have hgz := hg.differentiableAt hzn
        have hq : DifferentiableAt ℂ (fun w => Complex.log ((w - a) / (z - a))) z := by
          apply DifferentiableAt.clog (hgz.div_const _)
          simp [div_self (h0 z hz)]
        have hev : l =ᶠ[nhds z] fun w => l z + Complex.log ((w - a) / (z - a)) := by
          have hsmall : ∀ᶠ w in nhds z, ‖l w - l z‖ < Real.pi := by
            have : Filter.Tendsto (fun w => ‖l w - l z‖) (nhds z) (nhds ‖l z - l z‖) := (hfc.sub continuousAt_const).norm
            simp only [sub_self, norm_zero] at this
            exact this.eventually (gt_mem_nhds Real.pi_pos)
          filter_upwards [hsmall, hzn] with w hw hwU
          have e : (w - a) / (z - a) = Complex.exp (l w - l z) := by
            rw [Complex.exp_sub]
            have a1 : Complex.exp (l w) = w - a := hl2 hwU
            have a2 : Complex.exp (l z) = z - a := hl2 hz
            rw [a1, a2]
          have him : |(l w - l z).im| < Real.pi := lt_of_le_of_lt (Complex.abs_im_le_norm _) hw
          rw [e, Complex.log_exp (by linarith [(abs_lt.mp him).1]) (by linarith [(abs_lt.mp him).2])]
          ring
        exact ((differentiableAt_const _).add hq).congr_of_eventuallyEq hev |>.differentiableWithinAt
      set s : ℂ → ℂ := fun z => Complex.exp (l z / 2) with hsdef
      have hsd : DifferentiableOn ℂ s U := (hld.div_const _).cexp
      have hsq : ∀ z ∈ U, s z ^ 2 = z - a := by
        intro z hz
        simp only [hsdef]
        rw [← Complex.exp_nat_mul]
        have : ((2 : ℕ) : ℂ) * (l z / 2) = l z := by push_cast; ring
        rw [this]
        exact hl2 hz
      have hs0 : ∀ z, s z ≠ 0 := fun z => Complex.exp_ne_zero _
      have hsinj : Set.InjOn s U := by
        intro x hx y hy h
        have := hsq x hx
        rw [h, hsq y hy] at this
        exact (sub_left_injective this).symm
      have hsderiv : ∀ z ∈ U, deriv s z ≠ 0 := by
        intro z hz h
        have hzn := hU.mem_nhds hz
        have h1 : HasDerivAt s (deriv s z) z := (hsd.differentiableAt hzn).hasDerivAt
        have h2 : HasDerivAt (fun w => s w ^ 2) ((2 : ℕ) * s z ^ (2 - 1) * deriv s z) z := h1.fun_pow 2
        have h3 : HasDerivAt (fun w => s w ^ 2) 1 z := by
          have e : (fun w => s w ^ 2) =ᶠ[nhds z] fun w => w - a := by
            filter_upwards [hzn] with w hw using hsq w hw
          exact ((hasDerivAt_id z).sub_const a).congr_of_eventuallyEq e
        have := h2.unique h3
        rw [h] at this
        simp at this
      obtain ⟨z₀, hz₀⟩ := hs.nonempty
      have hz₀n := hU.mem_nhds hz₀
      have hmap : s '' U ∈ nhds (s z₀) := by
        have ha' := hsd.analyticAt hz₀n
        rw [← ha'.hasStrictDerivAt.map_nhds_eq (hsderiv z₀ hz₀)]
        exact Filter.image_mem_map hz₀n
      obtain ⟨ε, hε, hball⟩ := Metric.mem_nhds_iff.mp hmap
      have hfar : ∀ z ∈ U, ε ≤ ‖s z + s z₀‖ := by
        intro z hz
        by_contra hlt
        push_neg at hlt
        have hm : -s z ∈ Metric.ball (s z₀) ε := by
          rw [mem_ball_iff_norm]
          have : -s z - s z₀ = -(s z + s z₀) := by ring
          rw [this, norm_neg]
          exact hlt
        obtain ⟨y, hy, hye⟩ := hball hm
        have h1 : s y ^ 2 = s z ^ 2 := by rw [hye]; ring
        rw [hsq y hy, hsq z hz] at h1
        have h2 : y = z := sub_left_injective h1
        rw [h2] at hye
        have h3 : s z = 0 := by
          have : (2 : ℂ) * s z = 0 := by linear_combination hye
          simpa using this
        exact hs0 z h3
      have hne2 : ∀ z ∈ U, s z + s z₀ ≠ 0 := fun z hz h => by
        have := hfar z hz
        rw [h, norm_zero] at this
        linarith
      have hsadd : DifferentiableOn ℂ (fun z => s z + s z₀) U := hsd.add_const _
      set c₀ : ℂ := ((ε / 2 : ℝ) : ℂ) with hc₀
      have hc₀ne : c₀ ≠ 0 := by
        rw [hc₀]
        exact_mod_cast (by positivity : ε / 2 ≠ 0)
      refine ⟨fun z => c₀ / (s z + s z₀), DifferentiableOn.div (differentiableOn_const _) hsadd hne2, ?_, ?_, ?_⟩
      · intro z hz
        rw [mem_ball_zero_iff, norm_div]
        have hp : 0 < ‖s z + s z₀‖ := norm_pos_iff.mpr (hne2 z hz)
        rw [div_lt_one hp, hc₀, Complex.norm_real, Real.norm_of_nonneg (by positivity)]
        have := hfar z hz
        linarith
      · intro x hx y hy h
        simp only at h
        have h1 := hne2 x hx
        have h2 := hne2 y hy
        rw [div_eq_div_iff h1 h2] at h
        have h3 := mul_left_cancel₀ hc₀ne h
        exact hsinj hx hy (add_right_cancel h3.symm)
      · intro z hz h
        have hzn := hU.mem_nhds hz
        have h1 : HasDerivAt (fun w => s w + s z₀) (deriv s z) z := (hsd.differentiableAt hzn).hasDerivAt.add_const _
        have h2 := (hasDerivAt_const z c₀).div h1 (hne2 z hz)
        have h3 := HasDerivAt.deriv h2
        have h4 : deriv (fun z => c₀ / (s z + s z₀)) z = (0 * (s z + s z₀) - c₀ * deriv s z) / (s z + s z₀) ^ 2 := h3
        rw [h4] at h
        have h5 := pow_ne_zero 2 (hne2 z hz)
        rw [div_eq_zero_iff] at h
        rcases h with h | h
        · simp only [zero_mul, zero_sub, neg_eq_zero, mul_eq_zero] at h
          rcases h with h | h
          · exact hc₀ne h
          · exact hsderiv z hz h
        · exact h5 h
- id: real_part_of_holomorphic_is_harmonic
  kind: gap
  level: 2
  topic: 調和関数・正則関数の実部と虚部
  statement: $f$が$z$で解析的ならば、$\operatorname{Re}f$と$\operatorname{Im}f$は$z$で調和である(平面の二変数関数として、$z$の近傍で$C^2$級でラプラシアンが$0$である)。
  statement_en: If f is analytic at z, then Re f and Im f are harmonic at z, that is, C^2 near z with vanishing Laplacian near z as functions of two real variables.
  assumptions:
  - $f$は$z$で解析的
  quantifiers:
  - 任意の$f,z$
  conclusion: $\operatorname{Re}f$と$\operatorname{Im}f$は$z$で調和である。
  answer: $f$を$z$で解析的とする。$z$の近傍$D$で$f$は正則で何回でも微分できるので、$f=u+iv$の$u,v$は$D$で$C^2$級である。コーシー・リーマン方程式$u_x=v_y$、$u_y=-v_x$をそれぞれ$x,y$で微分すると$u_{xx}=v_{yx}$、$u_{yy}=-v_{xy}$である。$C^2$級なので混合偏導関数は等しく、$u_{xx}+u_{yy}=0$である。同様に$v_{xx}+v_{yy}=0$である。
  strategy: Differentiate the Cauchy-Riemann equations once more.
  sketch:
  - 'derive: u and v are C^2 near z since f is infinitely differentiable.'
  - 'derive: Differentiating Cauchy-Riemann gives u_xx + u_yy = 0.'
  - 'conclude: The same computation holds for v.'
  openmath: (forall (f z) (-> (analytic_at f z) (and (harmonic_fn_at (lambda (w) (real_part (fn_value f w))) z) (harmonic_fn_at (lambda (w) (imag_part (fn_value f w))) z))))
  hard_negative:
    statement: $|f|$も調和である。
    reason: $f(z)=z$では$|f|=\sqrt{x^2+y^2}$のラプラシアンは$1/|z|\neq 0$である。
  target: |
    ∀ (f : ℂ → ℂ) (z : ℂ), AnalyticAt ℂ f z → InnerProductSpace.HarmonicAt (fun w => (f w).re) z ∧ InnerProductSpace.HarmonicAt (fun w => (f w).im) z
  proof: |
    by
      intro f z hf
      exact ⟨hf.harmonicAt_re, hf.harmonicAt_im⟩
- id: log_norm_of_nonvanishing_is_harmonic
  kind: gap
  level: 3
  topic: 調和関数・絶対値の対数
  statement: $f$が$z$で解析的で$f(z)\neq 0$ならば、$\log|f|$は$z$で調和である。
  statement_en: If f is analytic at z and f(z) ≠ 0, then log|f| is harmonic at z.
  assumptions:
  - $f$は$z$で解析的
  - $f(z)\neq 0$
  quantifiers:
  - 任意の$f,z$
  conclusion: $\log|f|$は$z$で調和である。
  answer: $f$を$z$で解析的で$f(z)\neq 0$を満たす関数とする。$f$は連続なので、$z$を中心とする円板$D$で$f$は正則で$f\neq 0$である。円板上の正則な対数の存在により、$D$で正則な$l$があり$e^l=f$である。$|f|=e^{\operatorname{Re}l}$なので$\log|f|=\operatorname{Re}l$である。正則関数の実部は調和なので、$\log|f|$は$z$で調和である。
  strategy: Locally log|f| is the real part of a holomorphic logarithm.
  sketch:
  - 'apply_theorem: On a small disc f has a holomorphic logarithm l.'
  - 'derive: log|f| = Re l.'
  - 'apply_theorem: Real parts of holomorphic functions are harmonic.'
  openmath: (forall (f z) (-> (and (analytic_at f z) (!= (fn_value f z) 0)) (harmonic_fn_at (lambda (w) (ln (abs (fn_value f w)))) z)))
  hard_negative:
    statement: $f(z)=0$でも$\log|f|$は$z$で調和である。
    reason: $f(z)=z$、$z=0$では$\log|z|$は$0$の近傍で定義されず($-\infty$に発散)、調和でない。
  target: |
    ∀ (f : ℂ → ℂ) (z : ℂ), AnalyticAt ℂ f z → f z ≠ 0 → InnerProductSpace.HarmonicAt (fun w => Real.log ‖f w‖) z
  proof: |
    by
      intro f z hf h
      exact hf.harmonicAt_log_norm h
- id: harmonic_conjugate_on_disc
  kind: textbook
  level: 3
  topic: 調和関数・共役調和関数
  statement: 円板$|z-c|<R$で調和な実数値関数$u$について、円板で解析的な$F$があり$\operatorname{Re}F=u$である。
  statement_en: A real-valued harmonic function u on a disc |z-c| < R is the real part of a function F analytic on the disc.
  assumptions:
  - $u$は円板$|z-c|<R$で調和な実数値関数
  quantifiers:
  - 任意の$u,c,R$
  conclusion: 円板で解析的な$F$があり$\operatorname{Re}F=u$である。
  answer: |-
    $u$を円板$|z-c|<R$で調和な実数値関数とする。円板が空なら自明である。$g=u_x-iu_y$とおく。$g$の実部$a=u_x$と虚部$b=-u_y$は$C^1$級である。$a_x=u_{xx}=-u_{yy}=b_y$、$a_y=u_{xy}=-b_x$なので、コーシー・リーマン方程式が成り立ち、$g$は円板で正則である。

    円板上の正則関数は原始関数を持つので、$G'=g$なる正則な$G$がある。$G=A+iB$とすると、$G'=A_x-iA_y$である。よって$A_x=u_x$、$A_y=u_y$であり、$A-u$は定数$k$である。$F=G-k$とおくと$F$は解析的で$\operatorname{Re}F=u$である。
  strategy: The function u_x - i u_y is holomorphic; a primitive of it has real part u up to a constant.
  sketch:
  - 'construct: g = u_x - i u_y.'
  - 'derive: Harmonicity gives the Cauchy-Riemann equations for g.'
  - 'apply_theorem: g has a primitive G on the disc.'
  - 'conclude: Re G and u have the same gradient, so they differ by a constant.'
  openmath: (forall (u c r) (-> (harmonic_on u (open_disc c r)) (exists (f) (and (analytic_on f (open_disc c r)) (forall (z) (-> (in z (open_disc c r)) (= (real_part (fn_value f z)) (fn_value u z))))))))
  hard_negative:
    statement: 任意の領域で調和関数は正則関数の実部である。
    reason: $\mathbb{C}\setminus\{0\}$の調和関数$\log|z|$は正則関数の実部でない。そうなら$F'=1/z$となり、$1/z$が原始関数を持つことになる。
  target: |
    ∀ (u : ℂ → ℝ) (c : ℂ) (R : ℝ), InnerProductSpace.HarmonicOnNhd u (Metric.ball c R) → ∃ F : ℂ → ℂ, AnalyticOnNhd ℂ F (Metric.ball c R) ∧ ∀ z ∈ Metric.ball c R, (F z).re = u z
  proof: |
    by
      intro u c R hu
      obtain ⟨F, h1, h2⟩ := hu.exists_analyticOnNhd_ball_re_eq
      exact ⟨F, h1, fun z hz => h2 hz⟩
- id: harmonic_mean_value_property
  kind: gap
  level: 3
  topic: 調和関数・平均値の性質
  statement: $R>0$とし、$u$は$|z-c|<R$で調和で閉円板で連続な実数値関数とする。このとき円周$|z-c|=R$上の$u$の平均は$u(c)$に等しい。
  statement_en: If R > 0 and u is real-valued, harmonic on |z-c| < R and continuous on the closed disc, then the mean of u over the circle |z-c| = R equals u(c).
  assumptions:
  - $R>0$
  - $u$は開円板で調和で閉円板で連続
  quantifiers:
  - 任意の$u,c,R$
  conclusion: $\frac{1}{2\pi}\int_0^{2\pi}u(c+Re^{it})\,dt=u(c)$である。
  answer: |-
    $R>0$、$u$を開円板$|z-c|<R$で調和で閉円板で連続な実数値関数とする。共役調和関数の存在により、円板で解析的な$F$があり$\operatorname{Re}F=u$である。$0<r<R$とする。正則関数の平均値の性質(コーシーの積分公式)から$F(c)=\frac{1}{2\pi}\int_0^{2\pi}F(c+re^{it})\,dt$である。実部を取ると$u(c)=\frac{1}{2\pi}\int_0^{2\pi}u(c+re^{it})\,dt$である。

    $u$は閉円板で一様連続なので、$r\uparrow R$で$u(c+re^{it})\to u(c+Re^{it})$は$t$について一様である。積分の極限を取って結論を得る。
  strategy: Take real parts of the mean value property of a holomorphic function with real part u, then let the radius grow.
  sketch:
  - 'apply_theorem: u = Re F on the open disc.'
  - 'derive: The mean value property on radius r < R gives the formula for u.'
  - 'derive: Uniform continuity on the closed disc lets r tend to R.'
  openmath: (forall (u c r) (-> (and (> r 0) (harmonic_on u (open_disc c r)) (continuous_on_set u (closed_disc c r))) (= (circle_mean_fn (lambda (z) (fn_value u z)) c r) (fn_value u c))))
  hard_negative:
    statement: 任意の連続関数が平均値の性質を持つ。
    reason: $u(z)=|z|^2$、$c=0$、$R=1$では円周上の平均は$1$で$u(0)=0$と異なる。
  target: |
    ∀ (u : ℂ → ℝ) (c : ℂ) (R : ℝ), 0 < R → InnerProductSpace.HarmonicOnNhd u (Metric.ball c R) → ContinuousOn u (Metric.closedBall c R) → Real.circleAverage u c R = u c
  proof: |
    by
      intro u c R hR hu hc
      have h : InnerProductSpace.HarmonicContOnCl u (Metric.ball c |R|) := by
        rw [abs_of_pos hR]
        exact ⟨hu, by rwa [closure_ball c hR.ne']⟩
      exact HarmonicContOnCl.circleAverage_eq h
- id: poisson_formula_harmonic
  kind: textbook
  level: 4
  topic: 調和関数・ポアソンの積分公式
  statement: |-
    $u$は$|z-c|<R$で調和で閉円板で連続な実数値関数とする。$|w-c|<R$なら
    $u(w)=\frac{1}{2\pi}\int_0^{2\pi}\frac{R^2-|w-c|^2}{|z-w|^2}u(z)\,dt,\quad z=c+Re^{it}$
    である。
  statement_en: If u is real-valued, harmonic on |z-c| < R and continuous on the closed disc, then for |w-c| < R, u(w) is the mean over the circle of ((R^2-|w-c|^2)/|z-w|^2) u(z).
  assumptions:
  - $u$は開円板で調和で閉円板で連続
  - $|w-c|<R$
  quantifiers:
  - 任意の$u,c,w,R$
  conclusion: 上のポアソンの積分公式が成り立つ。
  answer: |-
    $u$を開円板$|z-c|<R$で調和で閉円板で連続な実数値関数、$w$を開円板の点とする。$c=0$としてよい。まず$F$を閉円板の近傍で正則な関数とし、半径$R$で公式を示す。$h(\zeta)=F(\zeta)/(1-\bar w\zeta/R^2)$は閉円板の近傍で正則である($|\bar w\zeta/R^2|<1$)。コーシーの積分公式より
    $\frac{F(w)}{1-|w|^2/R^2}=\frac{1}{2\pi i}\oint\frac{F(z)}{(1-\bar wz/R^2)(z-w)}\,dz$
    である。$z=Re^{it}$、$dz=iz\,dt$とし、$|z|=R$で$1-\bar wz/R^2=(\bar z-\bar w)z/R^2$なので、右辺は$\frac{1}{2\pi}\int F(z)\frac{R^2}{|z-w|^2}\,dt$である。整理すると$F$に対する公式を得る。核は実数なので、実部を取ると$\operatorname{Re}F$に対する公式を得る。

    $u$については、$|w|<r<R$とする。共役調和関数の存在により$u=\operatorname{Re}F$($F$は開円板で解析的)である。半径$r$で公式が成り立つ。$r\uparrow R$とすると、$u$の一様連続性により被積分関数は一様に収束し、半径$R$の公式を得る。
  strategy: Apply Cauchy's formula to F(ζ)/(1 - conj(w) ζ/R^2), simplify the kernel on the circle, take real parts and let the radius grow.
  sketch:
  - 'construct: h(ζ) = F(ζ)/(1 - conj(w) ζ/R^2).'
  - 'apply_theorem: Cauchy''s formula for h at w.'
  - 'derive: On the circle the kernel simplifies to R^2/|z-w|^2.'
  - 'derive: Take real parts for u = Re F on smaller radii.'
  - 'conclude: Uniform continuity gives the formula at radius R.'
  openmath: (forall (u c w r) (-> (and (harmonic_on u (open_disc c r)) (continuous_on_set u (closed_disc c r)) (in w (open_disc c r))) (= (circle_mean_fn (lambda (z) (* (/ (- (^ (abs (- z c)) 2) (^ (abs (- w c)) 2)) (^ (abs (- z w)) 2)) (fn_value u z))) c r) (fn_value u w))))
  hard_negative:
    statement: 核は$(R^2-|w-c|^2)/|z-w|$である(分母は二乗でない)。
    reason: $u=1$、$c=w=0$、$R=2$では核の平均は$R^2/R=2$となり、$u(w)=1$と異なる。正しい核では$R^2/R^2=1$である。
  target: |
    ∀ (u : ℂ → ℝ) (c w : ℂ) (R : ℝ), InnerProductSpace.HarmonicOnNhd u (Metric.ball c R) → ContinuousOn u (Metric.closedBall c R) → w ∈ Metric.ball c R → Real.circleAverage (fun z => ((‖z - c‖ ^ 2 - ‖w - c‖ ^ 2) / ‖z - w‖ ^ 2) * u z) c R = u w
  proof: |
    by
      intro u c w R hu hc hw
      have hR : 0 < R := Metric.pos_of_mem_ball hw
      have h : InnerProductSpace.HarmonicContOnCl u (Metric.ball c R) := ⟨hu, by rwa [closure_ball c hR.ne']⟩
      have := h.circleAverage_poissonKernel_smul hw
      rw [← this]
      congr 1
      funext z
      simp [poissonKernel_def, Pi.smul_def, smul_eq_mul]
- id: harmonic_maximum_principle
  kind: textbook
  level: 3
  topic: 調和関数・最大値原理
  statement: $U$を連結開集合、$u$を$U$で調和な実数値関数とする。$u$が$U$の点$c$で最大値を取るならば、$u$は$U$で定数である。
  statement_en: A real-valued harmonic function on a connected open set U attaining its maximum at a point c of U is constant on U.
  assumptions:
  - $U$は連結開集合で$c\in U$
  - $u$は$U$で調和
  - 全ての$z\in U$で$u(z)\leq u(c)$
  quantifiers:
  - 任意の$u,U,c$と任意の$z\in U$
  conclusion: $u(z)=u(c)$である。
  answer: |-
    $U$を連結開集合、$u$を$U$で調和な実数値関数で$c\in U$で最大値を取るものとする。$V=\{z\in U\mid u(z)=u(c)\}$とおく。$c\in V$である。$V$は$U$の中で閉である。

    $V$が開であることを示す。$x\in V$とし、円板$D\subset U$を$x$を中心に取る。$D$上で$u=\operatorname{Re}F$($F$は解析的)である。$|e^F|=e^u$は$x$で$D$上の最大値を取る。最大値原理により$e^F$は$D$で定数であり、$e^u$も定数である。よって$D$上で$u=u(x)=u(c)$であり、$D\subset V$である。

    $U$は連結なので$V=U$である。
  strategy: The maximum set is open by the maximum modulus principle for exp F and closed by continuity.
  sketch:
  - 'setup: Let V be the set where u equals its maximum.'
  - 'derive: On a disc about x in V, u = Re F and |e^F| = e^u has a maximum at x.'
  - 'apply_theorem: The maximum modulus principle makes u constant on the disc.'
  - 'conclude: V is open and closed in U, so V = U.'
  openmath: (forall (u U c) (-> (and (open_set U) (connected_set U) (in c U) (harmonic_on u U) (forall (z) (-> (in z U) (<= (fn_value u z) (fn_value u c))))) (forall (z) (-> (in z U) (= (fn_value u z) (fn_value u c))))))
  hard_negative:
    statement: $U$で調和な関数は$U$の内部で最大値を取らない(定数の場合を含む)。
    reason: 定数関数は調和で、全ての点で最大値を取る。定数の場合を除く必要がある。
  target: |
    ∀ (u : ℂ → ℝ) (U : Set ℂ) (c : ℂ), IsOpen U → IsPreconnected U → c ∈ U → InnerProductSpace.HarmonicOnNhd u U → (∀ z ∈ U, u z ≤ u c) → ∀ z ∈ U, u z = u c
  proof: |
    by
      intro u U c hU hp hc hu hmax
      set V := {z | z ∈ U ∧ u z = u c} with hV
      have hlocal : ∀ x ∈ V, ∃ ε > 0, Metric.ball x ε ⊆ V := by
        rintro x ⟨hxU, hxc⟩
        obtain ⟨ε, hε, hsub⟩ := Metric.isOpen_iff.mp hU x hxU
        refine ⟨ε, hε, ?_⟩
        have hh : InnerProductSpace.HarmonicOnNhd u (Metric.ball x ε) := hu.mono hsub
        obtain ⟨F, hF, hre⟩ := hh.exists_analyticOnNhd_ball_re_eq
        have hFd : DifferentiableOn ℂ F (Metric.ball x ε) := hF.differentiableOn
        have hG : DifferentiableOn ℂ (fun z => Complex.exp (F z)) (Metric.ball x ε) := hFd.cexp
        have hxm : x ∈ Metric.ball x ε := Metric.mem_ball_self hε
        have hm : IsMaxOn (norm ∘ fun z => Complex.exp (F z)) (Metric.ball x ε) x := by
          intro z hz
          simp only [Set.mem_setOf_eq, Function.comp_apply, Complex.norm_exp]
          apply Real.exp_le_exp.mpr
          have e1 : (F z).re = u z := hre hz
          have e2 : (F x).re = u x := hre hxm
          rw [e1, e2, hxc]
          exact hmax z (hsub hz)
        have he := Complex.eqOn_of_isPreconnected_of_isMaxOn_norm (convex_ball x ε).isPreconnected Metric.isOpen_ball hG hxm hm
        intro z hz
        refine ⟨hsub hz, ?_⟩
        have h1 := congrArg norm (he hz)
        simp only [Function.const_apply, Complex.norm_exp] at h1
        have h2 := Real.exp_injective h1
        have e1 : (F z).re = u z := hre hz
        have e2 : (F x).re = u x := hre hxm
        rw [← e1, h2, e2, hxc]
      have hVo : IsOpen V := Metric.isOpen_iff.mpr hlocal
      have hsub := hp.subset_of_closure_inter_subset hVo ⟨c, hc, hc, rfl⟩ (by
        rintro z ⟨hzcl, hzU⟩
        have hcont : ContinuousAt u z := (hu z hzU).1.continuousAt
        refine ⟨hzU, ?_⟩
        by_contra hne
        have hev : ∀ᶠ y in nhds z, u y ≠ u c := hcont.eventually_ne hne
        obtain ⟨y, hy1, hy2⟩ := mem_closure_iff_nhds.mp hzcl _ hev
        exact hy1 hy2.2)
      exact fun z hz => (hsub hz).2
- id: harmonic_composed_with_holomorphic
  kind: gap
  level: 3
  topic: 調和関数・正則関数との合成
  statement: $g$が$z$で解析的で、$u$が$g(z)$で調和ならば、$u\circ g$は$z$で調和である。
  statement_en: If g is analytic at z and u is harmonic at g(z), then u∘g is harmonic at z.
  assumptions:
  - $g$は$z$で解析的
  - $u$は$g(z)$で調和
  quantifiers:
  - 任意の$u,g,z$
  conclusion: $u\circ g$は$z$で調和である。
  answer: $g$を$z$で解析的な関数、$u$を$g(z)$で調和な実数値関数とする。$u$は$g(z)$の近傍の円板$D$で調和である。共役調和関数の存在により、$D$で解析的な$F$があり$\operatorname{Re}F=u$である。$g$は連続なので、$z$の近傍で$g$の値は$D$に入り、そこで$u\circ g=\operatorname{Re}(F\circ g)$である。$F\circ g$は$z$で解析的なので、その実部は$z$で調和である。
  strategy: Write u locally as Re F, so u∘g = Re(F∘g) near z.
  sketch:
  - 'apply_theorem: u = Re F on a disc about g(z).'
  - 'derive: u∘g = Re(F∘g) near z.'
  - 'apply_theorem: Real parts of analytic functions are harmonic.'
  openmath: (forall (u g z) (-> (and (harmonic_at u (fn_value g z)) (analytic_at g z)) (harmonic_fn_at (lambda (w) (fn_value u (fn_value g w))) z)))
  hard_negative:
    statement: $g$が実全微分可能なだけでも$u\circ g$は調和である。
    reason: $g(x+iy)=x+2iy$、$u=\operatorname{Re}(z^2)=x^2-y^2$では$u\circ g=x^2-4y^2$でラプラシアンは$-6\neq 0$である。
  target: |
    ∀ (u : ℂ → ℝ) (g : ℂ → ℂ) (z : ℂ), InnerProductSpace.HarmonicAt u (g z) → AnalyticAt ℂ g z → InnerProductSpace.HarmonicAt (fun w => u (g w)) z
  proof: |
    by
      intro u g z hu hg
      have hev := hu.eventually
      obtain ⟨ε, hε, hball⟩ := Metric.eventually_nhds_iff_ball.mp hev
      have hh : InnerProductSpace.HarmonicOnNhd u (Metric.ball (g z) ε) := fun x hx => hball x hx
      obtain ⟨F, hF, hre⟩ := hh.exists_analyticOnNhd_ball_re_eq
      have hmem : g z ∈ Metric.ball (g z) ε := Metric.mem_ball_self hε
      have hFg : AnalyticAt ℂ (fun w => F (g w)) z := (hF (g z) hmem).comp hg
      have h1 := hFg.harmonicAt_re
      have hev2 : (fun w => (F (g w)).re) =ᶠ[nhds z] fun w => u (g w) := by
        have : ∀ᶠ w in nhds z, g w ∈ Metric.ball (g z) ε := hg.continuousAt.eventually_mem (Metric.isOpen_ball.mem_nhds hmem)
        filter_upwards [this] with w hw using hre hw
      exact (InnerProductSpace.harmonicAt_congr_nhds hev2).mp h1
- id: harnack_inequality_disc
  kind: named
  level: 4
  topic: 調和関数・ハルナックの不等式
  statement: |-
    ハルナックの不等式。$u$は$|z-c|<R$で調和で閉円板で連続、閉円板上で$u\geq 0$とする。$|w-c|<R$、$\rho=|w-c|$なら
    $\frac{R-\rho}{R+\rho}u(c)\leq u(w)\leq\frac{R+\rho}{R-\rho}u(c)$
    である。
  statement_en: Harnack's inequality. If u is harmonic on |z-c| < R, continuous on the closed disc and nonnegative there, then for |w-c| = ρ < R, ((R-ρ)/(R+ρ)) u(c) ≤ u(w) ≤ ((R+ρ)/(R-ρ)) u(c).
  assumptions:
  - $u$は開円板で調和で閉円板で連続
  - 閉円板上で$u\geq 0$
  - $|w-c|=\rho<R$
  quantifiers:
  - 任意の$u,c,w,R$
  conclusion: 上の二つの不等式が成り立つ。
  answer: |-
    $u$を開円板$|z-c|<R$で調和で閉円板で連続かつ閉円板上で$u\geq 0$を満たす関数、$w$を$|w-c|=\rho<R$なる点とする。ポアソンの積分公式により$u(w)$は円周上の$P(z)u(z)$の平均である。ここで$P(z)=(R^2-\rho^2)/|z-w|^2$である。$|z-c|=R$なら$R-\rho\leq|z-w|\leq R+\rho$なので
    $\frac{R-\rho}{R+\rho}\leq P(z)\leq\frac{R+\rho}{R-\rho}$
    である。$u\geq 0$なので各点で$P$の上下の評価を$u$に掛けられる。平均を取り、平均値の性質$\frac{1}{2\pi}\int u=u(c)$を使うと結論を得る。
  strategy: Bound the Poisson kernel on the circle and integrate against the nonnegative u.
  sketch:
  - 'apply_theorem: Write u(w) with the Poisson formula.'
  - 'derive: On the circle the kernel lies between (R-ρ)/(R+ρ) and (R+ρ)/(R-ρ).'
  - 'apply_theorem: The mean value property gives the mean of u as u(c).'
  openmath: (forall (u c w r) (-> (and (harmonic_on u (open_disc c r)) (continuous_on_set u (closed_disc c r)) (forall (z) (-> (in z (closed_disc c r)) (<= 0 (fn_value u z)))) (in w (open_disc c r))) (and (<= (* (/ (- r (abs (- w c))) (+ r (abs (- w c)))) (fn_value u c)) (fn_value u w)) (<= (fn_value u w) (* (/ (+ r (abs (- w c))) (- r (abs (- w c)))) (fn_value u c))))))
  hard_negative:
    statement: 符号の仮定$u\geq 0$は不要である。
    reason: $u(z)=\operatorname{Re}z$、$c=0$、$R=1$では$u(0)=0$なので評価は$u(w)=0$を意味するが、$w=1/2$で$u(w)=1/2$である。
  target: |
    ∀ (u : ℂ → ℝ) (c w : ℂ) (R : ℝ), InnerProductSpace.HarmonicOnNhd u (Metric.ball c R) → ContinuousOn u (Metric.closedBall c R) → (∀ z ∈ Metric.closedBall c R, 0 ≤ u z) → w ∈ Metric.ball c R → (R - ‖w - c‖) / (R + ‖w - c‖) * u c ≤ u w ∧ u w ≤ (R + ‖w - c‖) / (R - ‖w - c‖) * u c
  proof: |
    by
      intro u c w R hu huc h0 hw
      have hR : 0 < R := Metric.pos_of_mem_ball hw
      have hwn : ‖w - c‖ < R := mem_ball_iff_norm.mp hw
      have hA : 0 < R + ‖w - c‖ := by positivity
      have hB : 0 < R - ‖w - c‖ := by linarith
      have h : InnerProductSpace.HarmonicContOnCl u (Metric.ball c R) := ⟨hu, by rwa [closure_ball c hR.ne']⟩
      have hP := h.circleAverage_poissonKernel_smul hw
      have hmean : Real.circleAverage u c R = u c := by
        have h' : InnerProductSpace.HarmonicContOnCl u (Metric.ball c |R|) := by rwa [abs_of_pos hR]
        exact HarmonicContOnCl.circleAverage_eq h'
      have hsph : Metric.sphere c |R| = Metric.sphere c R := by rw [abs_of_pos hR]
      have huS : ContinuousOn u (Metric.sphere c R) := huc.mono Metric.sphere_subset_closedBall
      have hwne : ∀ z ∈ Metric.sphere c R, (z - c) - (w - c) ≠ 0 := by
        intro z hz he
        have h1 : z = w := by
          have : z - w = 0 := by rw [← he]; ring
          exact sub_eq_zero.mp this
        subst h1
        have := mem_sphere_iff_norm.mp hz
        linarith
      have hPc : ContinuousOn (poissonKernel c w) (Metric.sphere c R) := by
        unfold poissonKernel
        refine ContinuousOn.div (by fun_prop) (by fun_prop) ?_
        intro z hz
        exact pow_ne_zero 2 (norm_ne_zero_iff.mpr (hwne z hz))
      have hiP : CircleIntegrable (poissonKernel c w • u) c R := ContinuousOn.circleIntegrable hR.le (hPc.smul huS)
      have hiU : CircleIntegrable u c R := huS.circleIntegrable hR.le
      have hbounds : ∀ z ∈ Metric.sphere c R, (R - ‖w - c‖) / (R + ‖w - c‖) ≤ poissonKernel c w z ∧ poissonKernel c w z ≤ (R + ‖w - c‖) / (R - ‖w - c‖) := by
        intro z hz
        rw [poissonKernel_eq_re_herglotzRieszKernel]
        simp only [Function.comp_apply, herglotzRieszKernel_def]
        exact ⟨le_re_herglotzRieszKernel hz hw, re_herglotzRieszKernel_le hz hw⟩
      constructor
      · rw [← hP, ← hmean]
        have e : ((R - ‖w - c‖) / (R + ‖w - c‖)) * Real.circleAverage u c R = Real.circleAverage (fun z => ((R - ‖w - c‖) / (R + ‖w - c‖)) • u z) c R := by
          rw [Real.circleAverage_fun_smul]; rfl
        rw [e]
        apply Real.circleAverage_mono (hiU.const_fun_smul) hiP
        intro x hx
        rw [hsph] at hx
        simp only [Pi.smul_apply', smul_eq_mul]
        exact mul_le_mul_of_nonneg_right (hbounds x hx).1 (h0 x (Metric.sphere_subset_closedBall hx))
      · rw [← hP, ← hmean]
        have e : ((R + ‖w - c‖) / (R - ‖w - c‖)) * Real.circleAverage u c R = Real.circleAverage (fun z => ((R + ‖w - c‖) / (R - ‖w - c‖)) • u z) c R := by
          rw [Real.circleAverage_fun_smul]; rfl
        rw [e]
        apply Real.circleAverage_mono hiP (hiU.const_fun_smul)
        intro x hx
        rw [hsph] at hx
        simp only [Pi.smul_apply', smul_eq_mul]
        exact mul_le_mul_of_nonneg_right (hbounds x hx).2 (h0 x (Metric.sphere_subset_closedBall hx))
- id: meromorphic_order_well_defined
  kind: gap
  level: 3
  topic: 有理型関数・位数の存在と一意性
  statement: $f$が$c$で有理型($(z-c)^mf(z)$が$c$で解析的となる自然数$m$がある)で、$c$の任意の穴あき近傍に$f\neq 0$の点があるとする。このとき整数$n$がただ一つあり、$c$で解析的で$g(c)\neq 0$なる$g$により、$c$の穴あき近傍で$f(z)=(z-c)^ng(z)$と書ける。この$n$が$f$の$c$での位数である。
  statement_en: If f is meromorphic at c, meaning (z-c)^m f(z) is analytic at c for some natural m, and f is nonzero somewhere in every punctured neighbourhood of c, then there is a unique integer n with f(z) = (z-c)^n g(z) on a punctured neighbourhood of c for some g analytic at c with g(c) ≠ 0.
  assumptions:
  - $f$は$c$で有理型
  - $c$の任意の穴あき近傍に$f\neq 0$の点がある
  quantifiers:
  - 任意の$f,c$
  conclusion: 上の形の表示を与える整数$n$がただ一つ存在する。
  answer: |-
    $f$を$c$で有理型($(z-c)^mf(z)$が$c$で解析的となる自然数$m$がある)の関数で、$c$の任意の穴あき近傍に$f\neq 0$の点があるものとする。$A(z)=(z-c)^mf(z)$が$c$で解析的となる$m$を取る。仮定より$A$は$c$の近傍で恒等的に$0$ではない。よって$A$の$c$での零点の位数$k$は有限で、$A(z)=(z-c)^kg(z)$、$g$は$c$で解析的で$g(c)\neq 0$である。穴あき近傍で$f(z)=(z-c)^{k-m}g(z)$なので、$n=k-m$が存在する。

    一意性を示す。$f=(z-c)^{n_1}g_1=(z-c)^{n_2}g_2$が穴あき近傍で成り立ち、$n_1<n_2$とする。$g_1=(z-c)^{n_2-n_1}g_2$が穴あき近傍で成り立つ。$z\to c$とすると、連続性から$g_1(c)=0$となり矛盾する。よって$n_1=n_2$である。
  strategy: Factor the analytic function (z-c)^m f for existence and compare limits at c for uniqueness.
  sketch:
  - 'setup: Choose m with A = (z-c)^m f analytic at c.'
  - 'derive: A is not locally zero, so A = (z-c)^k g with g(c) ≠ 0.'
  - 'construct: Put n = k - m.'
  - 'contradiction: Two different exponents would force g_1(c) = 0.'
  openmath: (forall (f c) (-> (and (meromorphic_at f c) (frequently_nonzero_punctured f c)) (exists (n) (and (in n Z) (exists (g) (and (analytic_at g c) (!= (fn_value g c) 0) (eq_punctured_near (lambda (z) (fn_value f z)) (lambda (z) (* (^ (- z c) n) (fn_value g z))) c))) (forall (k) (-> (and (in k Z) (exists (h) (and (analytic_at h c) (!= (fn_value h c) 0) (eq_punctured_near (lambda (z) (fn_value f z)) (lambda (z) (* (^ (- z c) k) (fn_value h z))) c)))) (= k n)))))))
  hard_negative:
    statement: $f$が$c$の穴あき近傍で恒等的に$0$でも、同じ表示を与える整数$n$がある。
    reason: $f=0$なら$(z-c)^ng(z)=0$となり$g$は$c$の穴あき近傍で$0$である。連続性から$g(c)=0$となり、$g(c)\neq 0$に反する。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ), MeromorphicAt f c → (∃ᶠ z in nhdsWithin c {c}ᶜ, f z ≠ 0) → ∃! n : ℤ, ∃ g : ℂ → ℂ, AnalyticAt ℂ g c ∧ g c ≠ 0 ∧ ∀ᶠ z in nhdsWithin c {c}ᶜ, f z = (z - c) ^ n * g z
  proof: |
    by
      intro f c hf hfr
      have hne : meromorphicOrderAt f c ≠ ⊤ := by
        intro h
        rw [meromorphicOrderAt_eq_top_iff] at h
        exact hfr (h.mono (fun z hz => not_not.mpr hz))
      obtain ⟨n, hn⟩ := WithTop.ne_top_iff_exists.mp hne
      refine ⟨n, ?_, ?_⟩
      · simpa [smul_eq_mul] using (meromorphicOrderAt_eq_int_iff hf).mp hn.symm
      · rintro m ⟨g, hg, hg0, he⟩
        have : meromorphicOrderAt f c = m := (meromorphicOrderAt_eq_int_iff hf).mpr ⟨g, hg, hg0, by simpa [smul_eq_mul] using he⟩
        rw [← hn] at this
        exact_mod_cast this.symm
- id: meromorphic_order_mul_inv
  kind: gap
  level: 3
  topic: 有理型関数・積と逆数の位数
  statement: $f,g$が$c$で有理型なら、$\operatorname{ord}_c(fg)=\operatorname{ord}_cf+\operatorname{ord}_cg$、$\operatorname{ord}_c(1/f)=-\operatorname{ord}_cf$である。穴あき近傍で恒等的に$0$の関数の位数は$\infty$とし、$\infty+k=\infty$、$-\infty=\infty$と約束する($1/0=0$と定める)。
  statement_en: If f and g are meromorphic at c, then ord_c(fg) = ord_c f + ord_c g and ord_c(1/f) = -ord_c f, the order of a function vanishing on a punctured neighbourhood being ∞, with ∞ + k = ∞, -∞ = ∞ and 1/0 = 0.
  assumptions:
  - $f,g$は$c$で有理型
  - 穴あき近傍で恒等的に$0$の関数の位数は$\infty$、$\infty+k=\infty$、$-\infty=\infty$、$1/0=0$
  quantifiers:
  - 任意の$f,g,c$
  conclusion: 上の二つの等式が成り立つ。
  answer: |-
    $f,g$を$c$で有理型な関数、穴あき近傍で恒等的に$0$の関数の位数を$\infty$、$\infty+k=\infty$、$-\infty=\infty$、$1/0=0$とする。$f$か$g$が穴あき近傍で恒等的に$0$なら$fg$も同様であり、積の式の両辺は$\infty$である。$f$がそうなら$1/f$も$0$なので、逆数の式の両辺も$\infty$である。

    そうでないとき、$\operatorname{ord}_cf=m$、$\operatorname{ord}_cg=n$とし、穴あき近傍で$f=(z-c)^mF$、$g=(z-c)^nG$、$F,G$は$c$で解析的で$F(c),G(c)\neq 0$とする。$fg=(z-c)^{m+n}FG$で、$FG$は解析的で$F(c)G(c)\neq 0$である。位数の一意性より$\operatorname{ord}_c(fg)=m+n$である。また$1/F$は$c$で解析的で値は$0$でないので、$1/f=(z-c)^{-m}(1/F)$より$\operatorname{ord}_c(1/f)=-m$である。
  strategy: Multiply and invert the local factorizations.
  sketch:
  - 'case_split: Treat functions vanishing near c separately.'
  - 'derive: fg = (z-c)^(m+n) F G with F(c)G(c) ≠ 0.'
  - 'derive: 1/f = (z-c)^(-m) (1/F).'
  - 'apply_theorem: Uniqueness of the order concludes.'
  openmath: (forall (f g c) (-> (and (meromorphic_at f c) (meromorphic_at g c)) (and (= (meromorphic_order_fn (lambda (z) (* (fn_value f z) (fn_value g z))) c) (+ (meromorphic_order f c) (meromorphic_order g c))) (= (meromorphic_order_fn (lambda (z) (/ 1 (fn_value f z))) c) (neg (meromorphic_order f c))))))
  hard_negative:
    statement: $\operatorname{ord}_c(fg)=\operatorname{ord}_cf\cdot\operatorname{ord}_cg$である。
    reason: $f=g=z$、$c=0$では$\operatorname{ord}_0(z^2)=2$で、積は$1$である。
  target: |
    ∀ (f g : ℂ → ℂ) (c : ℂ), MeromorphicAt f c → MeromorphicAt g c → meromorphicOrderAt (fun z => f z * g z) c = meromorphicOrderAt f c + meromorphicOrderAt g c ∧ meromorphicOrderAt (fun z => (f z)⁻¹) c = -meromorphicOrderAt f c
  proof: |
    by
      intro f g c hf hg
      exact ⟨meromorphicOrderAt_mul hf hg, meromorphicOrderAt_inv⟩
- id: meromorphic_order_add_min
  kind: gap
  level: 3
  topic: 有理型関数・和の位数
  statement: $f,g$が$c$で有理型なら、$\operatorname{ord}_c(f+g)\geq\min(\operatorname{ord}_cf,\operatorname{ord}_cg)$であり、$\operatorname{ord}_cf\neq\operatorname{ord}_cg$なら等号が成り立つ(位数は$\infty$を含む)。
  statement_en: If f and g are meromorphic at c, then ord_c(f+g) ≥ min(ord_c f, ord_c g), with equality when the two orders differ, orders being allowed to be ∞.
  assumptions:
  - $f,g$は$c$で有理型
  - 穴あき近傍で恒等的に$0$の関数の位数は$\infty$
  quantifiers:
  - 任意の$f,g,c$
  conclusion: 不等式が成り立ち、位数が異なれば等号が成り立つ。
  answer: |-
    $f,g$を$c$で有理型な関数、穴あき近傍で恒等的に$0$の関数の位数を$\infty$とする。$g$の位数が$\infty$なら、穴あき近傍で$f+g=f$なので、不等式も等号も成り立つ。$f$についても同様である。

    両方の位数が有限で$m=\operatorname{ord}_cf\leq n=\operatorname{ord}_cg$とする。穴あき近傍で$f=(z-c)^mF$、$g=(z-c)^nG$、$F(c),G(c)\neq 0$とする。$f+g=(z-c)^m(F+(z-c)^{n-m}G)$であり、$H=F+(z-c)^{n-m}G$は$c$で解析的である。$H$が$c$の近傍で$0$なら位数は$\infty$であり、そうでなければ$H$の零点の位数を$k\geq 0$として位数は$m+k$である。どちらも$m$以上である。

    $m<n$なら$H(c)=F(c)\neq 0$なので、$\operatorname{ord}_c(f+g)=m$である。$m>n$の場合は$f,g$を入れ替えればよい。
  strategy: Factor out the lower power of z-c.
  sketch:
  - 'case_split: An infinite order summand does not change the sum near c.'
  - 'derive: With m ≤ n, f+g = (z-c)^m H with H analytic at c.'
  - 'derive: So the order of f+g is at least m.'
  - 'derive: If m < n then H(c) = F(c) ≠ 0, so equality holds.'
  openmath: (forall (f g c) (-> (and (meromorphic_at f c) (meromorphic_at g c)) (and (<= (extended_min (meromorphic_order f c) (meromorphic_order g c)) (meromorphic_order_fn (lambda (z) (+ (fn_value f z) (fn_value g z))) c)) (-> (!= (meromorphic_order f c) (meromorphic_order g c)) (= (meromorphic_order_fn (lambda (z) (+ (fn_value f z) (fn_value g z))) c) (extended_min (meromorphic_order f c) (meromorphic_order g c)))))))
  hard_negative:
    statement: 位数が等しいときも$\operatorname{ord}_c(f+g)=\min(\operatorname{ord}_cf,\operatorname{ord}_cg)$である。
    reason: $f=1/z$、$g=-1/z+1$、$c=0$では両方の位数は$-1$だが、$f+g=1$の位数は$0$である。
  target: |
    ∀ (f g : ℂ → ℂ) (c : ℂ), MeromorphicAt f c → MeromorphicAt g c → min (meromorphicOrderAt f c) (meromorphicOrderAt g c) ≤ meromorphicOrderAt (fun z => f z + g z) c ∧ (meromorphicOrderAt f c ≠ meromorphicOrderAt g c → meromorphicOrderAt (fun z => f z + g z) c = min (meromorphicOrderAt f c) (meromorphicOrderAt g c))
  proof: |
    by
      intro f g c hf hg
      exact ⟨meromorphicOrderAt_add hf hg, fun h => meromorphicOrderAt_add_of_ne hf hg h⟩
- id: pole_iff_tends_to_infinity
  kind: textbook
  level: 3
  topic: 有理型関数・極の特徴づけ
  statement: $f$が$c$で有理型なら、$z\to c$($z\neq c$)で$|f(z)|\to\infty$となることと、$\operatorname{ord}_cf<0$は同値である。
  statement_en: If f is meromorphic at c, then |f(z)| tends to infinity as z tends to c with z ≠ c if and only if ord_c f < 0.
  assumptions:
