  hard_negative:
    statement: $|f'(w)|\leq 1$が円板の全ての点で成り立つ。
    reason: $f=\phi_{1/2}$では$f'(1/2)=4/3$である。$f'$の評価には係数$(1-|f|^2)/(1-|w|^2)$が必要である。
  target: |
    ∀ (f : ℂ → ℂ) (w : ℂ), DifferentiableOn ℂ f (Metric.ball 0 1) → (∀ x ∈ Metric.ball (0 : ℂ) 1, ‖f x‖ < 1) → ‖w‖ < 1 → ‖deriv f w‖ * (1 - ‖w‖ ^ 2) ≤ 1 - ‖f w‖ ^ 2
  proof: |
