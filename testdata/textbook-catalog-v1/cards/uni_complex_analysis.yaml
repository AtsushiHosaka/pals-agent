  - 'construct: F = φ ∘ f ∘ ψ with F(0) = 0.'
  - 'apply_theorem: The Schwarz lemma gives |F''(0)| ≤ 1.'
  - 'derive: The chain rule gives F''(0) = f''(w)(1-|w|^2)/(1-|f(w)|^2).'
