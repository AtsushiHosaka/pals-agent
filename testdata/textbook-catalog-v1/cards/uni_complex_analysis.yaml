    reason: $f(z)=z$、$g(z)=1/z$、$c=0$、$R=1$では$\oint fg'\,dz=\oint(-1/z)\,dz=-2\pi i$、$\oint f'g\,dz=\oint(1/z)\,dz=2\pi i$である。
  target: |
    ∀ (f g f' g' : ℂ → ℂ) (c : ℂ) (R : ℝ), 0 ≤ R → ContinuousOn f' (Metric.sphere c R) → ContinuousOn g' (Metric.sphere c R) → (∀ z ∈ Metric.sphere c R, HasDerivAt f (f' z) z) → (∀ z ∈ Metric.sphere c R, HasDerivAt g (g' z) z) → (∮ z in C(c, R), f z * g' z) = -∮ z in C(c, R), f' z * g z
  proof: |
    by
      intro f g f' g' c R hR hf' hg' hf hg
      have hfc : ContinuousOn f (Metric.sphere c R) := fun z hz => (hf z hz).continuousAt.continuousWithinAt
      have hgc : ContinuousOn g (Metric.sphere c R) := fun z hz => (hg z hz).continuousAt.continuousWithinAt
