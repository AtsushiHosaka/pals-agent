  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ), MeromorphicAt f c → ((∃ L, Filter.Tendsto f (nhdsWithin c {c}ᶜ) (nhds L)) ↔ 0 ≤ meromorphicOrderAt f c) ∧ ((∃ L, L ≠ 0 ∧ Filter.Tendsto f (nhdsWithin c {c}ᶜ) (nhds L)) ↔ meromorphicOrderAt f c = 0) ∧ (Filter.Tendsto f (nhdsWithin c {c}ᶜ) (nhds 0) ↔ 0 < meromorphicOrderAt f c)
