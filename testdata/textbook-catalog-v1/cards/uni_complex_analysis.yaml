      intro f w hd hb hw
      have hne : ∀ a x : ℂ, ‖a‖ < 1 → ‖x‖ < 1 → 1 - (starRingEnd ℂ) a * x ≠ 0 := by
        intro a x ha hx h
        have h1 : (starRingEnd ℂ) a * x = 1 := (sub_eq_zero.mp h).symm
        have h2 : ‖a‖ * ‖x‖ = 1 := by
          have := congrArg norm h1
          simpa using this
        nlinarith [norm_nonneg a, norm_nonneg x]
      have hlt : ∀ a x : ℂ, ‖a‖ < 1 → ‖x‖ < 1 → ‖(x - a) / (1 - (starRingEnd ℂ) a * x)‖ < 1 := by
        intro a x ha hx
        have hp : 0 < ‖1 - (starRingEnd ℂ) a * x‖ := norm_pos_iff.mpr (hne a x ha hx)
        rw [norm_div, div_lt_one hp]
        have id : ‖1 - (starRingEnd ℂ) a * x‖ ^ 2 - ‖x - a‖ ^ 2 = (1 - ‖a‖ ^ 2) * (1 - ‖x‖ ^ 2) := by
          simp only [Complex.sq_norm, Complex.normSq_apply]
          simp
          ring
        have h3 : 0 < (1 - ‖a‖ ^ 2) * (1 - ‖x‖ ^ 2) := mul_pos (by nlinarith [norm_nonneg a]) (by nlinarith [norm_nonneg x])
        exact lt_of_pow_lt_pow_left₀ 2 hp.le (by linarith)
      have hmemw : w ∈ Metric.ball (0 : ℂ) 1 := by simpa using hw
      set b := f w with hb'
      have hbn : ‖b‖ < 1 := hb w hmemw
      set ψ : ℂ → ℂ := fun x => (x + w) / (1 + (starRingEnd ℂ) w * x) with hψ
      have hψb : ∀ x : ℂ, ‖x‖ < 1 → ‖ψ x‖ < 1 := by
        intro x hx
        have := hlt (-w) x (by simpa using hw) hx
        simpa [hψ, sub_neg_eq_add, map_neg] using this
      have hψne : ∀ x : ℂ, ‖x‖ < 1 → 1 + (starRingEnd ℂ) w * x ≠ 0 := by
        intro x hx
        have := hne (-w) x (by simpa using hw) hx
        simpa [map_neg] using this
      set F : ℂ → ℂ := fun x => (f (ψ x) - b) / (1 - (starRingEnd ℂ) b * f (ψ x)) with hF
      have hψd : DifferentiableOn ℂ ψ (Metric.ball 0 1) := by
        intro x hx
        have hx' : ‖x‖ < 1 := by simpa using hx
        apply DifferentiableAt.differentiableWithinAt
        exact DifferentiableAt.div (by fun_prop) (by fun_prop) (hψne x hx')
      have hψm : Set.MapsTo ψ (Metric.ball 0 1) (Metric.ball 0 1) := fun x hx => by
        simpa using hψb x (by simpa using hx)
      have hfψ : DifferentiableOn ℂ (fun x => f (ψ x)) (Metric.ball 0 1) := hd.comp hψd hψm
      have hFd : DifferentiableOn ℂ F (Metric.ball 0 1) := by
        refine DifferentiableOn.div (hfψ.sub_const b) ((differentiableOn_const 1).sub (hfψ.const_mul _)) ?_
        intro x hx
        exact hne b _ hbn (hb _ (hψm hx))
      have hψ0 : ψ 0 = w := by simp [hψ]
      have hF0 : F 0 = 0 := by simp [hF, hψ0, hb']
      have hFm : Set.MapsTo F (Metric.ball 0 1) (Metric.closedBall (F 0) 1) := by
        intro x hx
        have := hlt b (f (ψ x)) hbn (hb _ (hψm hx))
        rw [hF0]
        simpa [hF] using this.le
      have hS := Complex.norm_deriv_le_one_of_mapsTo_ball hFd hFm one_pos
      have hψ' : HasDerivAt ψ (1 - ‖w‖ ^ 2) 0 := by
        have h1 : HasDerivAt (fun x : ℂ => x + w) 1 0 := (hasDerivAt_id (0 : ℂ)).add_const w
        have h2 : HasDerivAt (fun x : ℂ => 1 + (starRingEnd ℂ) w * x) ((starRingEnd ℂ) w) 0 := by
          simpa using ((hasDerivAt_id (0 : ℂ)).const_mul ((starRingEnd ℂ) w)).const_add 1
        have h3 := h1.div h2 (by simp)
        have e : (1 - (‖w‖ : ℂ) ^ 2) = (1 * (1 + (starRingEnd ℂ) w * 0) - (0 + w) * (starRingEnd ℂ) w) / (1 + (starRingEnd ℂ) w * 0) ^ 2 := by
          rw [← Complex.conj_mul']
          simp
          ring
        rw [e]
        exact h3
      have hfw : HasDerivAt f (deriv f w) (ψ 0) := by
        rw [hψ0]
        exact (hd.differentiableAt (Metric.isOpen_ball.mem_nhds hmemw)).hasDerivAt
      have hfψ' : HasDerivAt (fun x => f (ψ x)) (deriv f w * (1 - ‖w‖ ^ 2)) 0 := hfw.comp 0 hψ'
      have hden : (1 : ℂ) - (starRingEnd ℂ) b * b ≠ 0 := hne b b hbn hbn
      have hf0 : f (ψ 0) = b := by rw [hψ0]
      have hF' : HasDerivAt F (deriv f w * (1 - ‖w‖ ^ 2) / (1 - (starRingEnd ℂ) b * b)) 0 := by
        have h1 : HasDerivAt (fun x => f (ψ x) - b) (deriv f w * (1 - ‖w‖ ^ 2)) 0 := hfψ'.sub_const b
        have h2 : HasDerivAt (fun x => 1 - (starRingEnd ℂ) b * f (ψ x)) (-((starRingEnd ℂ) b * (deriv f w * (1 - ‖w‖ ^ 2)))) 0 := (hfψ'.const_mul _).const_sub 1
        have h3 := h1.div h2 (by rw [hf0]; exact hden)
        have e : deriv f w * (1 - (‖w‖ : ℂ) ^ 2) / (1 - (starRingEnd ℂ) b * b) = ((deriv f w * (1 - ‖w‖ ^ 2)) * (1 - (starRingEnd ℂ) b * f (ψ 0)) - (f (ψ 0) - b) * (-((starRingEnd ℂ) b * (deriv f w * (1 - ‖w‖ ^ 2))))) / (1 - (starRingEnd ℂ) b * f (ψ 0)) ^ 2 := by
          rw [hf0, sub_self, zero_mul, sub_zero, sq (1 - (starRingEnd ℂ) b * b), mul_div_mul_right _ _ hden]
        rw [e]
        exact h3
      rw [hF'.deriv] at hS
      have hnd : ‖(1 : ℂ) - (starRingEnd ℂ) b * b‖ = 1 - ‖b‖ ^ 2 := by
        rw [Complex.conj_mul']
        have : (1 : ℂ) - (‖b‖ : ℂ) ^ 2 = ((1 - ‖b‖ ^ 2 : ℝ) : ℂ) := by push_cast; ring
        rw [this, Complex.norm_real, Real.norm_of_nonneg (by nlinarith [norm_nonneg b])]
      have hnw : ‖(1 : ℂ) - (‖w‖ : ℂ) ^ 2‖ = 1 - ‖w‖ ^ 2 := by
        have : (1 : ℂ) - (‖w‖ : ℂ) ^ 2 = ((1 - ‖w‖ ^ 2 : ℝ) : ℂ) := by push_cast; ring
        rw [this, Complex.norm_real, Real.norm_of_nonneg (by nlinarith [norm_nonneg w])]
      rw [norm_div, norm_mul, hnd, hnw, div_le_one (by nlinarith [norm_nonneg b])] at hS
      exact hS
- id: disc_automorphism_fixing_zero_is_rotation
  kind: gap
  level: 3
  topic: シュワルツの補題・原点を固定する自己同型
  statement: 開単位円板$\mathbb{D}$の正則な自己写像$f,g$が$\mathbb{D}$上で$g\circ f=\mathrm{id}$、$f\circ g=\mathrm{id}$を満たし、$f(0)=0$ならば、$|u|=1$なる$u$があり$\mathbb{D}$上で$f(z)=uz$である。
  statement_en: If f and g are holomorphic self-maps of the open unit disc that are inverse to each other and f(0) = 0, then f(z) = u z on the disc for some u with |u| = 1.
  assumptions:
  - $f,g$は$\mathbb{D}$で正則で$\mathbb{D}$を自身へ写す
  - $\mathbb{D}$上で$g\circ f=\mathrm{id}$、$f\circ g=\mathrm{id}$
  - $f(0)=0$
  quantifiers:
  - 任意の$f,g$
  conclusion: $|u|=1$なる$u$があり$\mathbb{D}$上で$f(z)=uz$である。
  answer: $\mathbb{D}$を開単位円板、$f,g$を$\mathbb{D}$で正則で$\mathbb{D}$を自身へ写す関数で、$\mathbb{D}$上で$g\circ f=\mathrm{id}$、$f\circ g=\mathrm{id}$、$f(0)=0$を満たすものとする。$g(0)=g(f(0))=0$である。シュワルツの補題を$f$と$g$に適用すると、$z\in\mathbb{D}$で$|f(z)|\leq|z|$、かつ$|z|=|g(f(z))|\leq|f(z)|$である。よって$|f(z)|=|z|$である。シュワルツの補題の等号の場合により、$|u|=1$なる$u$があり$\mathbb{D}$上で$f(z)=uz$である。
  strategy: Apply the Schwarz lemma in both directions to get equality.
  sketch:
  - 'derive: g(0) = 0.'
  - 'apply_theorem: The Schwarz lemma for f and for g gives |f(z)| = |z|.'
  - 'apply_theorem: The equality case gives a rotation.'
  openmath: (forall (f g) (-> (and (holomorphic_on f (open_disc 0 1)) (holomorphic_on g (open_disc 0 1)) (fn_maps_to f (open_disc 0 1) (open_disc 0 1)) (fn_maps_to g (open_disc 0 1) (open_disc 0 1)) (forall (z) (-> (in z (open_disc 0 1)) (and (= (fn_value g (fn_value f z)) z) (= (fn_value f (fn_value g z)) z)))) (= (fn_value f 0) 0)) (exists (u) (and (= (abs u) 1) (forall (z) (-> (in z (open_disc 0 1)) (= (fn_value f z) (* u z))))))))
  hard_negative:
    statement: 原点を固定する$\mathbb{D}$の自己写像は回転である。
    reason: $f(z)=z^2$は原点を固定する$\mathbb{D}$の自己写像だが回転でない。逆写像の存在が必要である。
  target: |
    ∀ (f g : ℂ → ℂ), DifferentiableOn ℂ f (Metric.ball 0 1) → DifferentiableOn ℂ g (Metric.ball 0 1) → Set.MapsTo f (Metric.ball 0 1) (Metric.ball 0 1) → Set.MapsTo g (Metric.ball 0 1) (Metric.ball 0 1) → (∀ z ∈ Metric.ball (0 : ℂ) 1, g (f z) = z) → (∀ z ∈ Metric.ball (0 : ℂ) 1, f (g z) = z) → f 0 = 0 → ∃ u : ℂ, ‖u‖ = 1 ∧ ∀ z ∈ Metric.ball (0 : ℂ) 1, f z = u * z
  proof: |
    by
      intro f g hf hg mf mg gf fg h0
      have hg0 : g 0 = 0 := by
        have := gf 0 (by simp)
        rwa [h0] at this
      have cl : ∀ {h : ℂ → ℂ}, Set.MapsTo h (Metric.ball 0 1) (Metric.ball 0 1) → Set.MapsTo h (Metric.ball 0 1) (Metric.closedBall 0 1) := fun hm x hx => Metric.ball_subset_closedBall (hm hx)
      by_cases hex : ∃ a ∈ Metric.ball (0 : ℂ) 1, a ≠ 0
      · obtain ⟨a, ha, hne⟩ := hex
        have ha' : ‖a‖ < 1 := by simpa using ha
        have h1 : ‖f a‖ ≤ ‖a‖ := Complex.norm_le_norm_of_mapsTo_ball hf (cl mf) h0 ha'
        have h2 : ‖g (f a)‖ ≤ ‖f a‖ := Complex.norm_le_norm_of_mapsTo_ball hg (cl mg) hg0 (by simpa using mf ha)
        rw [gf a ha] at h2
        have hn : ‖f a‖ = ‖a‖ := le_antisymm h1 h2
        have hm : Set.MapsTo f (Metric.ball 0 1) (Metric.closedBall (f 0) (1 : ℝ)) := by
          rw [h0]; exact cl mf
        have hs : ‖dslope f 0 a‖ = (1 : ℝ) / 1 := by
          rw [dslope_of_ne f hne, slope_def_module, h0]
          simp only [sub_zero, norm_smul, norm_inv, hn]
          field_simp [norm_ne_zero_iff.mpr hne]
        obtain ⟨C, hC, hEq⟩ := Complex.affine_of_mapsTo_ball_of_exists_norm_dslope_eq_div' hf hm ⟨a, ha, hs⟩
        refine ⟨C, by simpa using hC, fun z hz => ?_⟩
        have := hEq hz
        simpa [h0, smul_eq_mul, mul_comm] using this
      · exfalso
        exact hex ⟨1 / 2, by simp; norm_num, by norm_num⟩
- id: disc_automorphism_classification
  kind: textbook
  level: 3
  topic: メビウス変換・単位円板の自己同型の決定
  statement: 開単位円板$\mathbb{D}$の正則な自己写像$f,g$が互いに逆ならば、$|u|=1$、$|a|<1$なる$u,a$があり、$\mathbb{D}$上で$f(z)=u\frac{z-a}{1-\bar az}$である。
  statement_en: If f and g are mutually inverse holomorphic self-maps of the open unit disc, then f(z) = u (z-a)/(1-conj(a) z) on the disc for some |u| = 1 and |a| < 1.
  assumptions:
  - $f,g$は$\mathbb{D}$で正則で$\mathbb{D}$を自身へ写す
  - $\mathbb{D}$上で$g\circ f=\mathrm{id}$、$f\circ g=\mathrm{id}$
  quantifiers:
  - 任意の$f,g$
  conclusion: $f(z)=u\frac{z-a}{1-\bar az}$と表される。
  answer: |-
    $\mathbb{D}$を開単位円板、$f,g$を$\mathbb{D}$で正則で$\mathbb{D}$を自身へ写す関数で、$\mathbb{D}$上で$g\circ f=\mathrm{id}$、$f\circ g=\mathrm{id}$を満たすものとする。$a=g(0)$とおくと$|a|<1$で$f(a)=0$である。$\phi(z)=(z-a)/(1-\bar az)$、$\psi(z)=(z+a)/(1+\bar az)$は$\mathbb{D}$の互いに逆な正則自己写像で、$\psi(0)=a$である。

    $h=f\circ\psi$、$k=\phi\circ g$とおくと、$h,k$は$\mathbb{D}$の互いに逆な正則自己写像で、$h(0)=f(a)=0$である。原点を固定する自己同型は回転なので、$|u|=1$なる$u$があり$h(\zeta)=u\zeta$である。$z\in\mathbb{D}$に対し$\zeta=\phi(z)$を代入すると$\psi(\zeta)=z$なので、$f(z)=u\phi(z)$である。
  strategy: Compose with the automorphism sending g(0) to 0 and reduce to the rotation case.
  sketch:
  - 'setup: Put a = g(0), so f(a) = 0.'
  - 'construct: h = f ∘ ψ fixes 0 and has inverse φ ∘ g.'
  - 'apply_theorem: h is a rotation.'
  - 'conclude: f = u φ.'
  openmath: (forall (f g) (-> (and (holomorphic_on f (open_disc 0 1)) (holomorphic_on g (open_disc 0 1)) (fn_maps_to f (open_disc 0 1) (open_disc 0 1)) (fn_maps_to g (open_disc 0 1) (open_disc 0 1)) (forall (z) (-> (in z (open_disc 0 1)) (and (= (fn_value g (fn_value f z)) z) (= (fn_value f (fn_value g z)) z))))) (exists (u a) (and (= (abs u) 1) (< (abs a) 1) (forall (z) (-> (in z (open_disc 0 1)) (= (fn_value f z) (* u (/ (- z a) (- 1 (* (complex_conj a) z)))))))))))
  hard_negative:
    statement: $\mathbb{D}$の自己同型は全て回転である。
    reason: $\phi_{1/2}$は自己同型だが$\phi_{1/2}(0)=-1/2\neq 0$なので回転でない。
  target: |
    ∀ (f g : ℂ → ℂ), DifferentiableOn ℂ f (Metric.ball 0 1) → DifferentiableOn ℂ g (Metric.ball 0 1) → Set.MapsTo f (Metric.ball 0 1) (Metric.ball 0 1) → Set.MapsTo g (Metric.ball 0 1) (Metric.ball 0 1) → (∀ z ∈ Metric.ball (0 : ℂ) 1, g (f z) = z) → (∀ z ∈ Metric.ball (0 : ℂ) 1, f (g z) = z) → ∃ u a : ℂ, ‖u‖ = 1 ∧ ‖a‖ < 1 ∧ ∀ z ∈ Metric.ball (0 : ℂ) 1, f z = u * ((z - a) / (1 - (starRingEnd ℂ) a * z))
  proof: |
    by
      intro f g hf hg mf mg gf fg
      have hne : ∀ a x : ℂ, ‖a‖ < 1 → ‖x‖ < 1 → 1 - (starRingEnd ℂ) a * x ≠ 0 := by
        intro a x ha hx h
        have h1 : (starRingEnd ℂ) a * x = 1 := (sub_eq_zero.mp h).symm
        have h2 : ‖a‖ * ‖x‖ = 1 := by
          have := congrArg norm h1
          simpa using this
        nlinarith [norm_nonneg a, norm_nonneg x]
      have hlt : ∀ a x : ℂ, ‖a‖ < 1 → ‖x‖ < 1 → ‖(x - a) / (1 - (starRingEnd ℂ) a * x)‖ < 1 := by
        intro a x ha hx
        have hp : 0 < ‖1 - (starRingEnd ℂ) a * x‖ := norm_pos_iff.mpr (hne a x ha hx)
        rw [norm_div, div_lt_one hp]
        have id : ‖1 - (starRingEnd ℂ) a * x‖ ^ 2 - ‖x - a‖ ^ 2 = (1 - ‖a‖ ^ 2) * (1 - ‖x‖ ^ 2) := by
          simp only [Complex.sq_norm, Complex.normSq_apply]
          simp
          ring
        have h3 : 0 < (1 - ‖a‖ ^ 2) * (1 - ‖x‖ ^ 2) := mul_pos (by nlinarith [norm_nonneg a]) (by nlinarith [norm_nonneg x])
        exact lt_of_pow_lt_pow_left₀ 2 hp.le (by linarith)
      have hinv : ∀ a x : ℂ, ‖a‖ < 1 → ‖x‖ < 1 → ((x - a) / (1 - (starRingEnd ℂ) a * x) + a) / (1 - (starRingEnd ℂ) (-a) * ((x - a) / (1 - (starRingEnd ℂ) a * x))) = x := by
        intro a x ha hx
        have h1 := hne a x ha hx
        have h3 := hne a a ha ha
        have e1 : (x - a) / (1 - (starRingEnd ℂ) a * x) + a = x * (1 - (starRingEnd ℂ) a * a) / (1 - (starRingEnd ℂ) a * x) := by
          rw [div_add' _ _ _ h1]
          congr 1
          ring
        have e2 : 1 - (starRingEnd ℂ) (-a) * ((x - a) / (1 - (starRingEnd ℂ) a * x)) = (1 - (starRingEnd ℂ) a * a) / (1 - (starRingEnd ℂ) a * x) := by
          rw [map_neg, neg_mul, sub_neg_eq_add, mul_div_assoc', add_div' _ _ _ h1]
          congr 1
          ring
        rw [e1, e2, div_div_div_cancel_right₀ h1, mul_div_cancel_right₀ x h3]
      have h0mem : (0 : ℂ) ∈ Metric.ball (0 : ℂ) 1 := by simp
      set a := g 0 with ha
      have han : ‖a‖ < 1 := by simpa using mg h0mem
      have hna : ‖-a‖ < 1 := by simpa using han
      set φ : ℂ → ℂ := fun x => (x - a) / (1 - (starRingEnd ℂ) a * x) with hφ
      set ψ : ℂ → ℂ := fun x => (x - (-a)) / (1 - (starRingEnd ℂ) (-a) * x) with hψ
      have hφm : Set.MapsTo φ (Metric.ball 0 1) (Metric.ball 0 1) := fun x hx =>
        mem_ball_zero_iff.mpr (hlt a x han (by simpa using hx))
      have hψm : Set.MapsTo ψ (Metric.ball 0 1) (Metric.ball 0 1) := fun x hx =>
        mem_ball_zero_iff.mpr (hlt (-a) x hna (by simpa using hx))
      have hφd : DifferentiableOn ℂ φ (Metric.ball 0 1) := by
        intro x hx
        apply DifferentiableAt.differentiableWithinAt
        exact DifferentiableAt.div (by fun_prop) (by fun_prop) (hne a x han (by simpa using hx))
      have hψd : DifferentiableOn ℂ ψ (Metric.ball 0 1) := by
        intro x hx
        apply DifferentiableAt.differentiableWithinAt
        exact DifferentiableAt.div (by fun_prop) (by fun_prop) (hne (-a) x hna (by simpa using hx))
      have hψφ : ∀ x ∈ Metric.ball (0 : ℂ) 1, ψ (φ x) = x := fun x hx => by
        have := hinv a x han (by simpa using hx)
        simp only [hψ, hφ, sub_neg_eq_add]
        exact this
      have hφψ : ∀ x ∈ Metric.ball (0 : ℂ) 1, φ (ψ x) = x := fun x hx => by
        have := hinv (-a) x hna (by simpa using hx)
        change ((x - -a) / (1 - (starRingEnd ℂ) (-a) * x) - a) / (1 - (starRingEnd ℂ) a * ((x - -a) / (1 - (starRingEnd ℂ) (-a) * x))) = x
        simpa only [neg_neg, ← sub_eq_add_neg] using this
      have hψ0 : ψ 0 = a := by simp [hψ]
      set h : ℂ → ℂ := fun x => f (ψ x) with hh
      set k : ℂ → ℂ := fun x => φ (g x) with hk
      have hhd : DifferentiableOn ℂ h (Metric.ball 0 1) := hf.comp hψd hψm
      have hkd : DifferentiableOn ℂ k (Metric.ball 0 1) := hφd.comp hg mg
      have hhm : Set.MapsTo h (Metric.ball 0 1) (Metric.ball 0 1) := mf.comp hψm
      have hkm : Set.MapsTo k (Metric.ball 0 1) (Metric.ball 0 1) := hφm.comp mg
      have kh : ∀ z ∈ Metric.ball (0 : ℂ) 1, k (h z) = z := fun z hz => by
        simp only [hk, hh]
        rw [gf _ (hψm hz), hφψ z hz]
      have hk' : ∀ z ∈ Metric.ball (0 : ℂ) 1, h (k z) = z := fun z hz => by
        simp only [hk, hh]
        rw [hψφ _ (mg hz), fg z hz]
      have h00 : h 0 = 0 := by
        simp only [hh]
        rw [hψ0, ha, fg 0 h0mem]
      have hk0 : k 0 = 0 := by
        have := kh 0 h0mem
        rwa [h00] at this
      have cl : ∀ {p : ℂ → ℂ}, Set.MapsTo p (Metric.ball 0 1) (Metric.ball 0 1) → Set.MapsTo p (Metric.ball 0 1) (Metric.closedBall 0 1) := fun hm x hx => Metric.ball_subset_closedBall (hm hx)
      have hpt : (1 / 2 : ℂ) ∈ Metric.ball (0 : ℂ) 1 := by simp; norm_num
      have hpt' : ‖(1 / 2 : ℂ)‖ < 1 := by simpa using hpt
      have hptne : (1 / 2 : ℂ) ≠ 0 := by norm_num
      have h1 : ‖h (1 / 2)‖ ≤ ‖(1 / 2 : ℂ)‖ := Complex.norm_le_norm_of_mapsTo_ball hhd (cl hhm) h00 hpt'
      have h2 : ‖k (h (1 / 2))‖ ≤ ‖h (1 / 2)‖ := Complex.norm_le_norm_of_mapsTo_ball hkd (cl hkm) hk0 (by simpa using hhm hpt)
      rw [kh _ hpt] at h2
      have hn : ‖h (1 / 2)‖ = ‖(1 / 2 : ℂ)‖ := le_antisymm h1 h2
      have hm : Set.MapsTo h (Metric.ball 0 1) (Metric.closedBall (h 0) (1 : ℝ)) := by
        rw [h00]; exact cl hhm
      have hs : ‖dslope h 0 (1 / 2)‖ = (1 : ℝ) / 1 := by
        rw [dslope_of_ne h hptne, slope_def_module, h00]
        simp only [sub_zero, norm_smul, norm_inv, hn]
        field_simp [norm_ne_zero_iff.mpr hptne]
      obtain ⟨C, hC, hEq⟩ := Complex.affine_of_mapsTo_ball_of_exists_norm_dslope_eq_div' hhd hm ⟨1 / 2, hpt, hs⟩
      refine ⟨C, a, by simpa using hC, han, fun z hz => ?_⟩
      have h3 := hEq (hφm hz)
      have h5 : h (φ z) = f z := by
        simp only [hh]
        rw [hψφ z hz]
      change f z = C * φ z
      simpa [h00, h5, smul_eq_mul, mul_comm] using h3
- id: cayley_transform_half_plane_to_disc
  kind: gap
  level: 2
  topic: メビウス変換・ケーリー変換
  statement: $C(z)=(z-i)/(z+i)$は上半平面を開単位円板へ全単射に写す。すなわち$\operatorname{Im}z>0$なら$|C(z)|<1$であり、$|w|<1$なら$\operatorname{Im}z>0$かつ$C(z)=w$なる$z$がただ一つある。
  statement_en: The Cayley map C(z) = (z-i)/(z+i) maps the upper half-plane bijectively onto the open unit disc, that is, Im z > 0 implies |C(z)| < 1 and for |w| < 1 there is a unique z with Im z > 0 and C(z) = w.
  assumptions:
  - $C(z)=(z-i)/(z+i)$
  quantifiers:
  - 任意の$z$と任意の$|w|<1$
  conclusion: $C$は上半平面から開単位円板への全単射である。
  answer: |-
    $\operatorname{Im}z>0$なら$z+i\neq 0$である。$|z+i|^2-|z-i|^2=4\operatorname{Im}z>0$なので$|C(z)|<1$である。

    $|w|<1$とする。$w\neq 1$である。$C(z)=w$は$z-i=w(z+i)$と同値であり、これは$z(1-w)=i(1+w)$、すなわち$z=z_0=i(1+w)/(1-w)$と同値である。よって解は高々一つである。分母を実数化すると
    $\operatorname{Im}z_0=\operatorname{Re}\frac{(1+w)(1-\bar w)}{|1-w|^2}=\frac{1-|w|^2}{|1-w|^2}>0$
    である。したがって$z_0$は上半平面にあり、$z_0+i\neq 0$なので$C(z_0)=w$である。
  strategy: Compare |z+i| and |z-i| for the first claim and solve the linear equation for the second.
  sketch:
  - 'derive: |z+i|^2 - |z-i|^2 = 4 Im z.'
  - 'derive: C(z) = w has the unique solution z = i(1+w)/(1-w).'
  - 'derive: Im z = (1-|w|^2)/|1-w|^2 > 0.'
  openmath: (and (forall (z) (-> (> (imag_part z) 0) (< (abs (/ (- z complex_imaginary_unit) (+ z complex_imaginary_unit))) 1))) (forall (w) (-> (< (abs w) 1) (exists (z) (and (> (imag_part z) 0) (= (/ (- z complex_imaginary_unit) (+ z complex_imaginary_unit)) w) (forall (y) (-> (and (> (imag_part y) 0) (= (/ (- y complex_imaginary_unit) (+ y complex_imaginary_unit)) w)) (= y z))))))))
  hard_negative:
    statement: $C$は実軸を単位円周全体へ全射に写す。
    reason: $C(x)=1$となる実数$x$はない($C(x)=1$は$-i=i$を意味する)。$1$は$\infty$の像である。
  target: |
    (∀ z : ℂ, 0 < z.im → ‖(z - Complex.I) / (z + Complex.I)‖ < 1) ∧ ∀ w : ℂ, ‖w‖ < 1 → ∃! z : ℂ, 0 < z.im ∧ (z - Complex.I) / (z + Complex.I) = w
  proof: |
    by
      have hne : ∀ z : ℂ, 0 < z.im → z + Complex.I ≠ 0 := by
        intro z hz h
        have := congrArg Complex.im h
        simp at this
        linarith
      constructor
      · intro z hz
        have hp : 0 < ‖z + Complex.I‖ := norm_pos_iff.mpr (hne z hz)
        rw [norm_div, div_lt_one hp]
        have id : ‖z + Complex.I‖ ^ 2 - ‖z - Complex.I‖ ^ 2 = 4 * z.im := by
          simp only [Complex.sq_norm, Complex.normSq_apply]
          simp
          ring
        exact lt_of_pow_lt_pow_left₀ 2 hp.le (by linarith)
      · intro w hw
        have h1 : (1 : ℂ) - w ≠ 0 := by
          intro h
          have : w = 1 := (sub_eq_zero.mp h).symm
          rw [this] at hw
          simp at hw
        set z0 : ℂ := Complex.I * (1 + w) / (1 - w) with hz0
        have him : 0 < z0.im := by
          have e : z0 = Complex.I * ((1 + w) * (starRingEnd ℂ) (1 - w)) / ((Complex.normSq (1 - w) : ℝ) : ℂ) := by
            rw [hz0, Complex.normSq_eq_conj_mul_self]
            have h2 : (starRingEnd ℂ) (1 - w) ≠ 0 := (map_ne_zero _).mpr h1
            field_simp
          have hpos : 0 < Complex.normSq (1 - w) := Complex.normSq_pos.mpr h1
          rw [e, Complex.div_ofReal_im]
          apply div_pos _ hpos
          have hsq : w.re * w.re + w.im * w.im < 1 := by
            have := (Complex.sq_norm w ▸ (pow_lt_one₀ (norm_nonneg w) hw two_ne_zero))
            rw [Complex.normSq_apply] at this
            exact this
          simp
          nlinarith
        refine ⟨z0, ⟨him, ?_⟩, ?_⟩
        · have h2 := hne z0 him
          have h3 : z0 + Complex.I = 2 * Complex.I / (1 - w) := by
            rw [hz0]; field_simp; ring
          have h4 : z0 - Complex.I = 2 * Complex.I * w / (1 - w) := by
            rw [hz0]; field_simp; ring
          rw [h3, h4]
          have h5 : (2 * Complex.I) ≠ 0 := by simp
          field_simp
        · rintro y ⟨hy, hye⟩
          have h2 := hne y hy
          rw [div_eq_iff h2] at hye
          rw [hz0, eq_div_iff h1]
          linear_combination hye
- id: moebius_real_coefficients_im_formula
  kind: gap
  level: 2
  topic: メビウス変換・実係数と虚部
  statement: 実数$a,b,c,d$と$cz+d\neq 0$なる$z$について、$\operatorname{Im}\frac{az+b}{cz+d}=\frac{(ad-bc)\operatorname{Im}z}{|cz+d|^2}$である。
  statement_en: For real a, b, c, d and z with cz+d ≠ 0, Im((az+b)/(cz+d)) = (ad-bc) Im z / |cz+d|^2.
  assumptions:
  - $a,b,c,d\in\mathbb{R}$
  - $cz+d\neq 0$
  quantifiers:
  - 任意の$a,b,c,d,z$
  conclusion: 上の等式が成り立つ。
  answer: $a,b,c,d\in\mathbb{R}$、$cz+d\neq 0$とする。$\frac{az+b}{cz+d}=\frac{(az+b)(c\bar z+d)}{|cz+d|^2}$である。分子は$ac|z|^2+adz+bc\bar z+bd$であり、$a,b,c,d$は実数なので、その虚部は$ad\operatorname{Im}z-bc\operatorname{Im}z$である。よって等式を得る。
  strategy: Multiply numerator and denominator by the conjugate of cz+d.
  sketch:
  - 'derive: Rationalize the denominator with conj(cz+d).'
  - 'derive: The imaginary part of the numerator is (ad-bc) Im z.'
  openmath: (forall (a b c d z) (-> (and (in a R) (in b R) (in c R) (in d R) (!= (+ (* c z) d) 0)) (= (imag_part (/ (+ (* a z) b) (+ (* c z) d))) (/ (* (- (* a d) (* b c)) (imag_part z)) (^ (abs (+ (* c z) d)) 2)))))
  hard_negative:
    statement: 複素係数$a,b,c,d$でも同じ公式が成り立つ。
    reason: $a=i$、$b=0$、$c=0$、$d=1$、$z=1$では左辺は$1$、右辺は$i\cdot 0/1=0$である。
  target: |
    ∀ (a b c d : ℝ) (z : ℂ), (c : ℂ) * z + d ≠ 0 → (((a : ℂ) * z + b) / ((c : ℂ) * z + d)).im = (a * d - b * c) * z.im / ‖(c : ℂ) * z + d‖ ^ 2
  proof: |
    by
      intro a b c d z hne
      rw [Complex.div_im, Complex.sq_norm]
      have hN : Complex.normSq ((c : ℂ) * z + d) ≠ 0 := (Complex.normSq_pos.mpr hne).ne'
      simp only [Complex.add_re, Complex.add_im, Complex.mul_re, Complex.mul_im, Complex.ofReal_re, Complex.ofReal_im]
      field_simp
      ring
- id: moebius_difference_and_cross_ratio
  kind: textbook
  level: 2
  topic: メビウス変換・複比の不変性
  statement: |-
    $T(w)=(aw+b)/(cw+d)$、$ad-bc\neq 0$とし、$z_1,\dots,z_4$で$cz_j+d\neq 0$、$z_1\neq z_4$、$z_2\neq z_3$とする。このとき複比は保たれる。すなわち
    $\frac{(Tz_1-Tz_3)(Tz_2-Tz_4)}{(Tz_1-Tz_4)(Tz_2-Tz_3)}=\frac{(z_1-z_3)(z_2-z_4)}{(z_1-z_4)(z_2-z_3)}$
    である。
  statement_en: A Möbius map T with ad-bc ≠ 0 preserves the cross ratio (z_1-z_3)(z_2-z_4)/((z_1-z_4)(z_2-z_3)) of points where T is finite, assuming z_1 ≠ z_4 and z_2 ≠ z_3.
  assumptions:
  - $ad-bc\neq 0$
  - $cz_j+d\neq 0$
  - $z_1\neq z_4$、$z_2\neq z_3$
  quantifiers:
  - 任意の複素数$a,b,c,d,z_1,\dots,z_4$
  conclusion: 複比は$T$で不変である。
  answer: |-
    $a,b,c,d$を$ad-bc\neq 0$なる複素数、$T(w)=(aw+b)/(cw+d)$、$z_1,\dots,z_4$を$cz_j+d\neq 0$、$z_1\neq z_4$、$z_2\neq z_3$を満たす複素数とする。$cx+d\neq 0$、$cy+d\neq 0$なら通分により
    $Tx-Ty=\frac{(ax+b)(cy+d)-(ay+b)(cx+d)}{(cx+d)(cy+d)}=\frac{(ad-bc)(x-y)}{(cx+d)(cy+d)}$
    である。これを複比の四つの差に代入する。$ad-bc$の因子と、各$cz_j+d$の因子は分子と分母に同じ回数ずつ現れて約分される。残るのは右辺である。
  strategy: Use the difference formula for T and cancel common factors.
  sketch:
  - 'derive: Tx - Ty = (ad-bc)(x-y)/((cx+d)(cy+d)).'
  - 'derive: Substitute into the cross ratio.'
  - 'conclude: All extra factors cancel.'
  openmath: (forall (a b c d p q r s) (-> (and (!= (- (* a d) (* b c)) 0) (!= (+ (* c p) d) 0) (!= (+ (* c q) d) 0) (!= (+ (* c r) d) 0) (!= (+ (* c s) d) 0) (!= p s) (!= q r)) (= (/ (* (- (/ (+ (* a p) b) (+ (* c p) d)) (/ (+ (* a r) b) (+ (* c r) d))) (- (/ (+ (* a q) b) (+ (* c q) d)) (/ (+ (* a s) b) (+ (* c s) d)))) (* (- (/ (+ (* a p) b) (+ (* c p) d)) (/ (+ (* a s) b) (+ (* c s) d))) (- (/ (+ (* a q) b) (+ (* c q) d)) (/ (+ (* a r) b) (+ (* c r) d))))) (/ (* (- p r) (- q s)) (* (- p s) (- q r))))))
  hard_negative:
    statement: 二点の差の比$(Tz_1-Tz_2)/(z_1-z_2)$は$z_1,z_2$によらず一定である。
    reason: $T(w)=1/w$では差の比は$-1/(z_1z_2)$であり、点による。不変なのは四点の複比である。
  target: |
    ∀ (a b c d z₁ z₂ z₃ z₄ : ℂ), a * d - b * c ≠ 0 → c * z₁ + d ≠ 0 → c * z₂ + d ≠ 0 → c * z₃ + d ≠ 0 → c * z₄ + d ≠ 0 → z₁ ≠ z₄ → z₂ ≠ z₃ → (let T : ℂ → ℂ := fun w => (a * w + b) / (c * w + d); ((T z₁ - T z₃) * (T z₂ - T z₄)) / ((T z₁ - T z₄) * (T z₂ - T z₃)) = ((z₁ - z₃) * (z₂ - z₄)) / ((z₁ - z₄) * (z₂ - z₃)))
  proof: |
    by
      intro a b c d z₁ z₂ z₃ z₄ hdet d1 d2 d3 d4 h14 h23
      intro T
      have hdiff : ∀ x y : ℂ, c * x + d ≠ 0 → c * y + d ≠ 0 → T x - T y = (a * d - b * c) * (x - y) / ((c * x + d) * (c * y + d)) := by
        intro x y hx hy
        simp only [T]
        rw [div_sub_div _ _ hx hy]
        congr 1
        ring
      rw [hdiff z₁ z₃ d1 d3, hdiff z₂ z₄ d2 d4, hdiff z₁ z₄ d1 d4, hdiff z₂ z₃ d2 d3]
      have s14 : z₁ - z₄ ≠ 0 := sub_ne_zero.mpr h14
      have s23 : z₂ - z₃ ≠ 0 := sub_ne_zero.mpr h23
      generalize c * z₁ + d = A₁ at d1 ⊢
      generalize c * z₂ + d = A₂ at d2 ⊢
      generalize c * z₃ + d = A₃ at d3 ⊢
      generalize c * z₄ + d = A₄ at d4 ⊢
      generalize a * d - b * c = E at hdet ⊢
      generalize z₁ - z₄ = u at s14 ⊢
      generalize z₂ - z₃ = v at s23 ⊢
      field_simp
- id: inversion_maps_generalized_circle
  kind: gap
  level: 2
  topic: メビウス変換・反転と一般化された円
  statement: 実数$A,D$と$\beta\in\mathbb{C}$、$z\neq 0$について、$A|z|^2+2\operatorname{Re}(\bar\beta z)+D=0$と$D|z^{-1}|^2+2\operatorname{Re}(\beta z^{-1})+A=0$は同値である。すなわち反転$z\mapsto 1/z$は円または直線の方程式を同じ形の方程式へ写す。
  statement_en: For real A, D, complex β and z ≠ 0, A|z|^2 + 2Re(conj(β) z) + D = 0 is equivalent to D|1/z|^2 + 2Re(β/z) + A = 0, so inversion sends circle-or-line equations to equations of the same form.
  assumptions:
  - $A,D\in\mathbb{R}$
  - $z\neq 0$
  quantifiers:
  - 任意の$A,D,\beta,z$
  conclusion: 二つの方程式は同値である。
  answer: |-
    $A,D\in\mathbb{R}$、$\beta\in\mathbb{C}$、$z\neq 0$とする。$N=|z|^2>0$とおく。$|z^{-1}|^2=1/N$であり、$z^{-1}=\bar z/N$なので
    $\operatorname{Re}(\beta z^{-1})=\frac{\operatorname{Re}(\beta\bar z)}{N}=\frac{\operatorname{Re}(\bar\beta z)}{N}$
    である(共役は実部を変えない)。よって第二の式の左辺は$\frac1N\bigl(D+2\operatorname{Re}(\bar\beta z)+AN\bigr)$であり、第一の式の左辺の$1/N$倍である。$N\neq 0$なので二つの方程式は同値である。
  strategy: Multiply the second equation by |z|^2 and compare with the first.
  sketch:
  - 'derive: |1/z|^2 = 1/N and Re(β/z) = Re(conj(β) z)/N with N = |z|^2.'
  - 'conclude: The second expression is 1/N times the first.'
  openmath: (forall (a d b z) (-> (and (in a R) (in d R) (!= z 0)) (<-> (= (+ (+ (* a (^ (abs z) 2)) (* 2 (real_part (* (complex_conj b) z)))) d) 0) (= (+ (+ (* d (^ (abs (/ 1 z)) 2)) (* 2 (real_part (* b (/ 1 z))))) a) 0))))
  hard_negative:
    statement: 反転は直線を常に直線へ写す。
    reason: 直線$\operatorname{Re}z=1$($A=0,D=-2,\beta=1$)は、方程式$-2|w|^2+2\operatorname{Re}w=0$の円へ写る。
  target: |
    ∀ (A D : ℝ) (β z : ℂ), z ≠ 0 → (A * ‖z‖ ^ 2 + 2 * ((starRingEnd ℂ) β * z).re + D = 0 ↔ D * ‖z⁻¹‖ ^ 2 + 2 * (β * z⁻¹).re + A = 0)
  proof: |
    by
      intro A D β z hz
      have hn : Complex.normSq z ≠ 0 := (Complex.normSq_pos.mpr hz).ne'
      have e1 : ‖z⁻¹‖ ^ 2 = (Complex.normSq z)⁻¹ := by
        rw [Complex.sq_norm, Complex.normSq_inv]
      have e2 : (β * z⁻¹).re = ((starRingEnd ℂ) β * z).re / Complex.normSq z := by
        rw [Complex.inv_def]
        simp [Complex.mul_re, Complex.mul_im]
        field_simp
      rw [e1, e2, Complex.sq_norm]
      constructor
      · intro h
        field_simp
        linarith
      · intro h
        field_simp at h
        linarith
- id: iterated_derivatives_converge_locally_uniformly
  kind: gap
  level: 3
  topic: 広義一様収束・高階導関数
  statement: $U$を開集合とする。$U$で正則な関数列$F_n$が$f$に$U$で広義一様収束するならば、各$k$で$F_n^{(k)}$は$f^{(k)}$に$U$で広義一様収束する。これは$k=1$の場合の全ての階数への一般化である。
  statement_en: Generalizing the case k = 1, if holomorphic F_n converge locally uniformly to f on an open set U, then for each k the k-th derivatives converge locally uniformly to f^(k) on U.
  assumptions:
  - $U$は開集合
  - 各$F_n$は$U$で正則
  - $F_n\to f$は$U$で広義一様収束
  quantifiers:
  - 任意の$F_n,f,U$と自然数$k$
  conclusion: $F_n^{(k)}\to f^{(k)}$は$U$で広義一様収束である。
  answer: |-
    $U$を開集合、$F_n$を$U$で正則な関数列で$U$上$f$に広義一様収束するものとする。$k$についての帰納法で示す。$k=0$は仮定である。

    $k$で成り立つとする。正則関数の導関数は正則なので、各$F_n^{(k)}$は$U$で正則である。正則関数列の広義一様極限については、極限が正則で、導関数も広義一様収束する(ワイエルシュトラスの定理)。これを$F_n^{(k)}\to f^{(k)}$に適用すると、$F_n^{(k+1)}\to f^{(k+1)}$は広義一様収束である。
  strategy: Induct on k using the Weierstrass theorem for the first derivative.
  sketch:
  - 'induction: The case k = 0 is the hypothesis.'
  - 'apply_theorem: Each k-th derivative is holomorphic, so Weierstrass applies to the sequence of k-th derivatives.'
  - 'conclude: The (k+1)-st derivatives converge locally uniformly.'
  openmath: (forall (F0 f U k) (-> (and (open_set U) (in k N) (forall (n) (holomorphic_on (seq_value F0 n) U)) (locally_uniform_limit F0 f U)) (locally_uniform_limit (iterated_deriv_sequence k F0) (iterated_deriv_function k f) U)))
  hard_negative:
    statement: 実解析関数列についても、一様収束すれば導関数が収束する。
    reason: 実数上で$F_n(x)=\sin(nx)/n$は$0$に一様収束するが、$F_n'(x)=\cos(nx)$は収束しない。
  target: |
    ∀ (F : ℕ → ℂ → ℂ) (f : ℂ → ℂ) (U : Set ℂ) (k : ℕ), IsOpen U → (∀ n, DifferentiableOn ℂ (F n) U) → TendstoLocallyUniformlyOn F f Filter.atTop U → TendstoLocallyUniformlyOn (fun n => iteratedDeriv k (F n)) (iteratedDeriv k f) Filter.atTop U
  proof: |
    by
      intro F f U k hU hd hl
      induction k with
      | zero => simpa [iteratedDeriv_zero] using hl
      | succ k ih =>
        have hdk : ∀ j n, DifferentiableOn ℂ (iteratedDeriv j (F n)) U := by
          intro j n
          induction j with
          | zero => simpa [iteratedDeriv_zero] using hd n
          | succ j ihj =>
            rw [iteratedDeriv_succ]
            exact ihj.deriv hU
        have := ih.deriv (Filter.Eventually.of_forall (fun n => hdk k n)) hU
        simpa only [iteratedDeriv_succ, Function.comp_def] using this
- id: hurwitz_nonvanishing_limit
  kind: named
  level: 3
  topic: フルヴィッツの定理・零点を持たない関数列の極限
  statement: フルヴィッツの定理の、零点を持たない関数列に対する形。$U$を連結開集合とする。$U$で正則で零点を持たない関数列$F_n$が$f$に$U$で広義一様収束するならば、$f$は$U$で恒等的に$0$であるか、$U$に零点を持たない。
  statement_en: Hurwitz's theorem in the form for zero-free sequences. If holomorphic functions F_n without zeros on a connected open set U converge locally uniformly to f on U, then f vanishes identically on U or has no zeros on U.
  assumptions:
  - $U$は連結開集合
  - 各$F_n$は$U$で正則で零点を持たない
  - $F_n\to f$は$U$で広義一様収束
  quantifiers:
  - 任意の$F_n,f,U$
  conclusion: $U$上で$f=0$であるか、$U$上で$f\neq 0$である。
  answer: |-
    $U$を連結開集合、$F_n$を$U$で正則で零点を持たない関数列で$U$上$f$に広義一様収束するものとする。ワイエルシュトラスの定理により$f$は$U$で正則である。$f(c)=0$なる$c\in U$があり、$f$が恒等的に$0$でないとして矛盾を導く。一致の定理により零点は孤立するので、$r>0$があり閉円板$|z-c|\leq r$は$U$に含まれ、$c$以外に$f$の零点を含まない。$m=\min_{|z-c|=r}|f|>0$とする。

    閉円板はコンパクトなので一様収束する。$n$を十分大きく取ると、閉円板上で$|F_n-f|<m/2$である。よって円周上で$|F_n|>m/2$、$c$で$|F_n(c)|<m/2$である。$1/F_n$は閉円板の近傍で正則なので、最大値原理により$1/|F_n(c)|\leq 2/m$である。すなわち$|F_n(c)|\geq m/2$であり、矛盾する。
  strategy: Use the maximum principle for 1/F_n on a small circle around a zero of f.
  sketch:
  - 'contradiction: Assume f(c) = 0 with f not identically zero.'
  - 'setup: Choose a closed disc about c with no other zero; let m be the minimum of |f| on its circle.'
  - 'derive: For large n, |F_n| > m/2 on the circle and |F_n(c)| < m/2.'
  - 'apply_theorem: The maximum principle for 1/F_n gives |F_n(c)| ≥ m/2.'
  openmath: (forall (F0 f U) (-> (and (open_set U) (connected_set U) (forall (n) (holomorphic_on (seq_value F0 n) U)) (locally_uniform_limit F0 f U) (forall (n z) (-> (in z U) (!= (fn_value (seq_value F0 n) z) 0)))) (or (forall (z) (-> (in z U) (= (fn_value f z) 0))) (forall (z) (-> (in z U) (!= (fn_value f z) 0))))))
  hard_negative:
    statement: 零点を持たない関数列の極限は零点を持たない。
    reason: $F_n=1/n$は零点を持たず$0$に一様収束する。極限は恒等的に$0$である。
  target: |
    ∀ (F : ℕ → ℂ → ℂ) (f : ℂ → ℂ) (U : Set ℂ), IsOpen U → IsPreconnected U → (∀ n, DifferentiableOn ℂ (F n) U) → TendstoLocallyUniformlyOn F f Filter.atTop U → (∀ n, ∀ z ∈ U, F n z ≠ 0) → (∀ z ∈ U, f z = 0) ∨ (∀ z ∈ U, f z ≠ 0)
  proof: |
    by
      intro F f U hU hp hd hl h0
      by_contra hcon
      push_neg at hcon
      obtain ⟨⟨a, haU, ha⟩, ⟨c, hcU, hc⟩⟩ := hcon
      have hfd : DifferentiableOn ℂ f U := hl.differentiableOn (Filter.Eventually.of_forall hd) hU
      have hfa : AnalyticOnNhd ℂ f U := hfd.analyticOnNhd hU
      rcases (hfa c hcU).eventually_eq_zero_or_eventually_ne_zero with hz | hne
      · have := hfa.eqOn_zero_of_preconnected_of_eventuallyEq_zero hp hcU hz
        exact ha (this haU)
      have hev : ∀ᶠ z in nhds c, z ∈ U ∧ (z ≠ c → f z ≠ 0) :=
        Filter.Eventually.and (hU.mem_nhds hcU) (eventually_nhdsWithin_iff.mp hne)
      obtain ⟨ε, hε, hball⟩ := Metric.eventually_nhds_iff_ball.mp hev
      set r := ε / 2 with hr
      have hr0 : 0 < r := by positivity
      have hcb : Metric.closedBall c r ⊆ Metric.ball c ε := Metric.closedBall_subset_ball (by rw [hr]; linarith)
      have hcU' : Metric.closedBall c r ⊆ U := fun z hz => (hball z (hcb hz)).1
      have hsne : (Metric.sphere c r).Nonempty := NormedSpace.sphere_nonempty.mpr hr0.le
      obtain ⟨x, hx, hmin⟩ := (isCompact_sphere c r).exists_isMinOn hsne ((hfd.continuousOn.mono (fun z hz => hcU' (Metric.sphere_subset_closedBall hz))).norm)
      have hxne : x ≠ c := by
        intro h
        rw [h, mem_sphere_iff_norm, sub_self, norm_zero] at hx
        exact hr0.ne hx
      have hm : 0 < ‖f x‖ := norm_pos_iff.mpr ((hball x (hcb (Metric.sphere_subset_closedBall hx))).2 hxne)
      have hu := (tendstoLocallyUniformlyOn_iff_forall_isCompact hU).mp hl _ hcU' (isCompact_closedBall c r)
      rw [Metric.tendstoUniformlyOn_iff] at hu
      obtain ⟨n, hn⟩ := (hu (‖f x‖ / 2) (by positivity)).exists
      have hsph : ∀ z ∈ Metric.sphere c r, ‖f x‖ / 2 ≤ ‖F n z‖ := by
        intro z hz
        have h1 := hn z (Metric.sphere_subset_closedBall hz)
        have h2 : ‖f x‖ ≤ ‖f z‖ := hmin hz
        rw [dist_eq_norm] at h1
        have h3 := norm_sub_norm_le (f z) (F n z)
        linarith
      have hcen : ‖F n c‖ < ‖f x‖ / 2 := by
        have h1 := hn c (Metric.mem_closedBall_self hr0.le)
        rw [dist_eq_norm, hc, zero_sub, norm_neg] at h1
        exact h1
      have hinv : DiffContOnCl ℂ (fun z => (F n z)⁻¹) (Metric.ball c r) := by
        apply DifferentiableOn.diffContOnCl
        rw [closure_ball c hr0.ne']
        exact ((hd n).mono hcU').inv (fun z hz => h0 n z (hcU' hz))
      have hbd := Complex.norm_le_of_forall_mem_frontier_norm_le (U := Metric.ball c r) (z := c) Metric.isBounded_ball hinv (C := (‖f x‖ / 2)⁻¹) (by
        intro z hz
        rw [frontier_ball c hr0.ne'] at hz
        simp only [norm_inv]
        exact inv_anti₀ (by positivity) (hsph z hz)) (subset_closure (Metric.mem_ball_self hr0))
      rw [norm_inv] at hbd
      have hp2 : 0 < ‖F n c‖ := norm_pos_iff.mpr (h0 n c hcU)
      have := (inv_le_inv₀ hp2 (by positivity)).mp hbd
      linarith
- id: hurwitz_injective_limit
  kind: textbook
  level: 3
  topic: フルヴィッツの定理・単射な関数列の極限
  statement: $U$を連結開集合とする。$U$で正則で単射な関数列$F_n$が$f$に$U$で広義一様収束するならば、$f$は$U$で単射であるか定数である。
  statement_en: If holomorphic injective functions F_n on a connected open set U converge locally uniformly to f on U, then f is injective on U or constant on U.
  assumptions:
  - $U$は連結開集合
  - 各$F_n$は$U$で正則で単射
  - $F_n\to f$は$U$で広義一様収束
  quantifiers:
  - 任意の$F_n,f,U$
  conclusion: $f$は$U$で単射であるか定数である。
  answer: |-
    $U$を連結開集合、$F_n$を$U$で正則で単射な関数列で$U$上$f$に広義一様収束するものとし、$f$が単射でないとする。$a\neq b$、$a,b\in U$、$f(a)=f(b)$を取る。$r>0$を、円板$D=\{|z-a|<r\}$が$U$に含まれ$b\notin D$となるように取る。

    $G_n=F_n-F_n(b)$は$D$で正則である。$F_n$は単射で$b\notin D$なので、$G_n$は$D$に零点を持たない。$G_n$は$D$で$f-f(b)$に広義一様収束する。$D$は連結なので、フルヴィッツの定理により$f-f(b)$は$D$で恒等的に$0$であるか零点を持たない。$a$が零点なので恒等的に$0$である。一致の定理により$U$上で$f=f(b)$であり、$f$は定数である。
  strategy: Apply Hurwitz's theorem to F_n - F_n(b) on a disc around a that avoids b.
  sketch:
  - 'setup: Assume f(a) = f(b) with a ≠ b; choose a disc D about a avoiding b.'
  - 'derive: G_n = F_n - F_n(b) has no zero on D and converges to f - f(b).'
  - 'apply_theorem: Hurwitz''s theorem forces f - f(b) = 0 on D.'
  - 'apply_theorem: The identity theorem gives f constant on U.'
  openmath: (forall (F0 f U) (-> (and (open_set U) (connected_set U) (forall (n) (and (holomorphic_on (seq_value F0 n) U) (injective_on (seq_value F0 n) U))) (locally_uniform_limit F0 f U)) (or (injective_on f U) (forall (z w) (-> (and (in z U) (in w U)) (= (fn_value f z) (fn_value f w)))))))
  hard_negative:
    statement: 単射な正則関数列の広義一様極限は単射である。
    reason: $F_n(z)=z/n$は単射で$0$に広義一様収束する。極限は定数である。
  target: |
    ∀ (F : ℕ → ℂ → ℂ) (f : ℂ → ℂ) (U : Set ℂ), IsOpen U → IsPreconnected U → (∀ n, DifferentiableOn ℂ (F n) U) → TendstoLocallyUniformlyOn F f Filter.atTop U → (∀ n, Set.InjOn (F n) U) → Set.InjOn f U ∨ ∀ z ∈ U, ∀ w ∈ U, f z = f w
  proof: |
    by
      intro F₀ f₀ U₀ hU₀ hp₀ hd₀ hl₀ hi₀
      have hurwitz : ∀ (F : ℕ → ℂ → ℂ) (f : ℂ → ℂ) (U : Set ℂ), IsOpen U → IsPreconnected U → (∀ n, DifferentiableOn ℂ (F n) U) → TendstoLocallyUniformlyOn F f Filter.atTop U → (∀ n, ∀ z ∈ U, F n z ≠ 0) → (∀ z ∈ U, f z = 0) ∨ (∀ z ∈ U, f z ≠ 0) := by
        intro F f U hU hp hd hl h0
        by_contra hcon
        push_neg at hcon
        obtain ⟨⟨a, haU, ha⟩, ⟨c, hcU, hc⟩⟩ := hcon
        have hfd : DifferentiableOn ℂ f U := hl.differentiableOn (Filter.Eventually.of_forall hd) hU
        have hfa : AnalyticOnNhd ℂ f U := hfd.analyticOnNhd hU
        rcases (hfa c hcU).eventually_eq_zero_or_eventually_ne_zero with hz | hne
        · have := hfa.eqOn_zero_of_preconnected_of_eventuallyEq_zero hp hcU hz
          exact ha (this haU)
        have hev : ∀ᶠ z in nhds c, z ∈ U ∧ (z ≠ c → f z ≠ 0) :=
          Filter.Eventually.and (hU.mem_nhds hcU) (eventually_nhdsWithin_iff.mp hne)
        obtain ⟨ε, hε, hball⟩ := Metric.eventually_nhds_iff_ball.mp hev
        set r := ε / 2 with hr
        have hr0 : 0 < r := by positivity
        have hcb : Metric.closedBall c r ⊆ Metric.ball c ε := Metric.closedBall_subset_ball (by rw [hr]; linarith)
        have hcU' : Metric.closedBall c r ⊆ U := fun z hz => (hball z (hcb hz)).1
        have hsne : (Metric.sphere c r).Nonempty := NormedSpace.sphere_nonempty.mpr hr0.le
        obtain ⟨x, hx, hmin⟩ := (isCompact_sphere c r).exists_isMinOn hsne ((hfd.continuousOn.mono (fun z hz => hcU' (Metric.sphere_subset_closedBall hz))).norm)
        have hxne : x ≠ c := by
          intro h
          rw [h, mem_sphere_iff_norm, sub_self, norm_zero] at hx
          exact hr0.ne hx
        have hm : 0 < ‖f x‖ := norm_pos_iff.mpr ((hball x (hcb (Metric.sphere_subset_closedBall hx))).2 hxne)
        have hu := (tendstoLocallyUniformlyOn_iff_forall_isCompact hU).mp hl _ hcU' (isCompact_closedBall c r)
        rw [Metric.tendstoUniformlyOn_iff] at hu
        obtain ⟨n, hn⟩ := (hu (‖f x‖ / 2) (by positivity)).exists
        have hsph : ∀ z ∈ Metric.sphere c r, ‖f x‖ / 2 ≤ ‖F n z‖ := by
          intro z hz
          have h1 := hn z (Metric.sphere_subset_closedBall hz)
          have h2 : ‖f x‖ ≤ ‖f z‖ := hmin hz
          rw [dist_eq_norm] at h1
          have h3 := norm_sub_norm_le (f z) (F n z)
          linarith
        have hcen : ‖F n c‖ < ‖f x‖ / 2 := by
          have h1 := hn c (Metric.mem_closedBall_self hr0.le)
          rw [dist_eq_norm, hc, zero_sub, norm_neg] at h1
          exact h1
        have hinv : DiffContOnCl ℂ (fun z => (F n z)⁻¹) (Metric.ball c r) := by
          apply DifferentiableOn.diffContOnCl
          rw [closure_ball c hr0.ne']
          exact ((hd n).mono hcU').inv (fun z hz => h0 n z (hcU' hz))
        have hbd := Complex.norm_le_of_forall_mem_frontier_norm_le (U := Metric.ball c r) (z := c) Metric.isBounded_ball hinv (C := (‖f x‖ / 2)⁻¹) (by
          intro z hz
          rw [frontier_ball c hr0.ne'] at hz
          simp only [norm_inv]
          exact inv_anti₀ (by positivity) (hsph z hz)) (subset_closure (Metric.mem_ball_self hr0))
        rw [norm_inv] at hbd
        have hp2 : 0 < ‖F n c‖ := norm_pos_iff.mpr (h0 n c hcU)
        have := (inv_le_inv₀ hp2 (by positivity)).mp hbd
        linarith
      by_cases hinj : Set.InjOn f₀ U₀
      · exact Or.inl hinj
      right
      rw [Set.InjOn] at hinj
      push_neg at hinj
      obtain ⟨a, haU, b, hbU, hab, hne⟩ := hinj
      have hfd : DifferentiableOn ℂ f₀ U₀ := hl₀.differentiableOn (Filter.Eventually.of_forall hd₀) hU₀
      have hfa : AnalyticOnNhd ℂ (fun z => f₀ z - f₀ b) U₀ := (hfd.sub_const _).analyticOnNhd hU₀
      obtain ⟨ε, hε, hεU⟩ := Metric.isOpen_iff.mp hU₀ a haU
      set r := min ε (dist a b) with hr
      have hdab : 0 < dist a b := dist_pos.mpr hne
      have hr0 : 0 < r := lt_min hε hdab
      have hsub : Metric.ball a r ⊆ U₀ := (Metric.ball_subset_ball (min_le_left _ _)).trans hεU
      have hbout : b ∉ Metric.ball a r := by
        intro h
        have h1 : dist b a < r := h
        have h2 : r ≤ dist a b := min_le_right _ _
        rw [dist_comm] at h1
        linarith
      have hb₀ := hl₀.tendsto_at hbU
      have hG : TendstoLocallyUniformlyOn (fun n z => F₀ n z - F₀ n b) (fun z => f₀ z - f₀ b) Filter.atTop (Metric.ball a r) := by
        rw [Metric.tendstoLocallyUniformlyOn_iff] at hl₀ ⊢
        intro δ hδ x hx
        obtain ⟨t, ht, hev⟩ := hl₀ (δ / 2) (by positivity) x (hsub hx)
        refine ⟨t ∩ Metric.ball a r, ?_, ?_⟩
        · have h1 : t ∈ nhds x := by
            rwa [hU₀.nhdsWithin_eq (hsub hx)] at ht
          rw [Metric.isOpen_ball.nhdsWithin_eq hx]
          exact Filter.inter_mem h1 (Metric.isOpen_ball.mem_nhds hx)
        · have hb1 := (Metric.tendsto_nhds.mp hb₀) (δ / 2) (by positivity)
          filter_upwards [hev, hb1] with n h1 h2 y hy
          have h3 := h1 y hy.1
          rw [dist_eq_norm] at h2 h3 ⊢
          have e : f₀ y - f₀ b - (F₀ n y - F₀ n b) = (f₀ y - F₀ n y) + (F₀ n b - f₀ b) := by ring
          rw [e]
          refine lt_of_le_of_lt (norm_add_le _ _) ?_
          linarith
      have hH := hurwitz (fun n z => F₀ n z - F₀ n b) (fun z => f₀ z - f₀ b) (Metric.ball a r) Metric.isOpen_ball (convex_ball a r).isPreconnected (fun n => ((hd₀ n).mono hsub).sub_const _) hG (by
        intro n z hz h
        apply hbout
        have : z = b := hi₀ n (hsub hz) hbU (sub_eq_zero.mp h)
        rwa [← this])
      have hmem : a ∈ Metric.ball a r := Metric.mem_ball_self hr0
      rcases hH with hall | hnz
      · have hev : (fun z => f₀ z - f₀ b) =ᶠ[nhds a] 0 := by
          filter_upwards [Metric.isOpen_ball.mem_nhds hmem] with z hz using hall z hz
        have hzero := hfa.eqOn_zero_of_preconnected_of_eventuallyEq_zero hp₀ haU hev
        intro z hz w hw
        have h1 : f₀ z - f₀ b = 0 := hzero hz
        have h2 : f₀ w - f₀ b = 0 := hzero hw
        rw [sub_eq_zero] at h1 h2
        rw [h1, h2]
      · exact absurd (sub_eq_zero.mpr hab) (hnz a hmem)
- id: bounded_holomorphic_family_lipschitz
  kind: gap
  level: 3
  topic: モンテルの定理の準備・リプシッツ評価
  statement: $r<R$とし、$f$は$|z-c|<R$で正則で$|f|\leq M$とする。閉円板$|z-c|\leq r$の点$z,w$について$|f(z)-f(w)|\leq\frac{2M}{R-r}|z-w|$である。定数は$f$によらない。
  statement_en: If r < R and f is holomorphic on |z-c| < R with |f| ≤ M, then |f(z)-f(w)| ≤ (2M/(R-r))|z-w| for z, w in the closed disc |z-c| ≤ r; the constant does not depend on f.
  assumptions:
  - $r<R$
  - $f$は$|z-c|<R$で正則で$|f|\leq M$
  - $z,w$は閉円板$|z-c|\leq r$の点
  quantifiers:
  - 任意の$f,c,r,R,M,z,w$
  conclusion: $|f(z)-f(w)|\leq\frac{2M}{R-r}|z-w|$である。
  answer: |-
    $r<R$、$f$を$|z-c|<R$で正則で$|f|\leq M$を満たす関数、$z,w$を閉円板$|z-c|\leq r$の点とする。$\rho=(R-r)/2>0$とおく。$x$が閉円板$|x-c|\leq r$の点なら、閉円板$|y-x|\leq\rho$は$|y-c|<R$に含まれる。円周$|y-x|=\rho$上で$|f|\leq M$なので、コーシーの評価より$|f'(x)|\leq M/\rho=2M/(R-r)$である。

    閉円板$|x-c|\leq r$は凸なので、線分$[w,z]$はその中にある。線分に沿って積分すると$f(z)-f(w)=(z-w)\int_0^1f'(w+t(z-w))\,dt$であり、$|f(z)-f(w)|\leq\frac{2M}{R-r}|z-w|$である。
  strategy: Bound the derivative by Cauchy's estimate and integrate along a segment.
  sketch:
  - 'apply_theorem: Cauchy''s estimate on circles of radius (R-r)/2 bounds f'' on the smaller disc.'
  - 'derive: The closed disc is convex, so the segment stays inside.'
  - 'conclude: Integrating f'' along the segment gives the Lipschitz bound.'
  openmath: (forall (f c r s B z w) (-> (and (< r s) (holomorphic_on f (open_disc c s)) (forall (x) (-> (in x (open_disc c s)) (<= (abs (fn_value f x)) B))) (in z (closed_disc c r)) (in w (closed_disc c r))) (<= (abs (- (fn_value f z) (fn_value f w))) (* (/ (* 2 B) (- s r)) (abs (- z w))))))
  hard_negative:
    statement: $r=R$でも同じ形の評価が定数を変えずに成り立つ。
    reason: 分母が$0$になり意味を持たない。実際$F_n(z)=z^n$は単位円板で$|F_n|\leq 1$だが、$z=1-1/n$の近くで導関数は$n/e$程度に大きくなる。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ) (r R M : ℝ) (z w : ℂ), r < R → DifferentiableOn ℂ f (Metric.ball c R) → (∀ x ∈ Metric.ball c R, ‖f x‖ ≤ M) → z ∈ Metric.closedBall c r → w ∈ Metric.closedBall c r → ‖f z - f w‖ ≤ 2 * M / (R - r) * ‖z - w‖
  proof: |
    by
      intro f c r R M z w hrR hf hb hz hw
      have hρ : 0 < (R - r) / 2 := by linarith
      have hsub : ∀ x ∈ Metric.closedBall c r, Metric.closedBall x ((R - r) / 2) ⊆ Metric.ball c R := by
        intro x hx y hy
        have h1 := mem_closedBall_iff_norm.mp hx
        have h2 := mem_closedBall_iff_norm.mp hy
        rw [mem_ball_iff_norm]
        have h3 : ‖y - c‖ ≤ ‖y - x‖ + ‖x - c‖ := by
          have := norm_add_le (y - x) (x - c)
          simpa using this
        linarith
      have hball : ∀ x ∈ Metric.closedBall c r, x ∈ Metric.ball c R := fun x hx => hsub x hx (Metric.mem_closedBall_self hρ.le)
      have hderiv : ∀ x ∈ Metric.closedBall c r, ‖deriv f x‖ ≤ 2 * M / (R - r) := by
        intro x hx
        have hdc : DiffContOnCl ℂ f (Metric.ball x ((R - r) / 2)) := by
          apply DifferentiableOn.diffContOnCl
          rw [closure_ball x hρ.ne']
          exact hf.mono (hsub x hx)
        have := Complex.norm_deriv_le_of_forall_mem_sphere_norm_le hρ hdc (C := M) (fun y hy => hb y (hsub x hx (Metric.sphere_subset_closedBall hy)))
        refine this.trans (le_of_eq ?_)
        have hne : R - r ≠ 0 := by linarith
        field_simp
      have hdiff : ∀ x ∈ Metric.closedBall c r, DifferentiableAt ℂ f x := fun x hx => hf.differentiableAt (Metric.isOpen_ball.mem_nhds (hball x hx))
      exact Convex.norm_image_sub_le_of_norm_deriv_le hdiff hderiv (convex_closedBall c r) hw hz
- id: montel_on_closed_subdisc
  kind: textbook
  level: 4
  topic: モンテルの定理・閉部分円板での形
  statement: モンテルの定理の閉部分円板での形。$r<R$とし、$F_n$は$|z-c|<R$で正則で一様に$|F_n|\leq M$とする。このとき部分列$F_{\varphi(n)}$と関数$g$があり、$F_{\varphi(n)}\to g$は閉円板$|z-c|\leq r$で一様収束する。アルツェラ・アスコリの定理を既習とする。
  statement_en: Montel's theorem on a closed subdisc, assuming the Arzelà-Ascoli theorem. If r < R and F_n are holomorphic on |z-c| < R with |F_n| ≤ M uniformly, then a subsequence converges uniformly on the closed disc |z-c| ≤ r.
  assumptions:
  - $r<R$
  - 各$F_n$は$|z-c|<R$で正則
  - 全ての$n$で$|F_n|\leq M$
  - アルツェラ・アスコリの定理を既習とする
  quantifiers:
  - 任意の$F_n,c,r,R,M$
  conclusion: 閉円板$|z-c|\leq r$で一様収束する部分列がある。
  answer: |-
    $r<R$、$F_n$を$|z-c|<R$で正則で全ての$n$で$|F_n|\leq M$を満たす関数列とする。$K$を閉円板$|z-c|\leq r$とする。$K$が空なら自明なので空でないとする。このとき$r\geq 0$、$R>0$であり、$M\geq 0$である。コーシーの評価と線分上の積分により、$z,w\in K$で$|F_n(z)-F_n(w)|\leq\frac{2M}{R-r}|z-w|$である。定数は$n$によらないので、$(F_n|_K)$は同程度連続である。また値は全て閉円板$|\zeta|\leq M$に含まれる。

    $K$はコンパクトなので、アルツェラ・アスコリの定理により$(F_n|_K)$は$C(K)$の中で相対コンパクトである。よって一様収束する部分列が存在する。極限を$g$とし、$K$の外では$g=0$と定める。
  strategy: The Cauchy estimate gives a uniform Lipschitz bound, and the Arzelà-Ascoli theorem produces a convergent subsequence.
  sketch:
  - 'apply_theorem: Cauchy''s estimate gives a Lipschitz bound independent of n on K.'
  - 'derive: The restricted family is equicontinuous and uniformly bounded.'
  - 'apply_theorem: The Arzelà-Ascoli theorem gives a uniformly convergent subsequence.'
  openmath: (forall (F0 c r s B) (-> (and (< r s) (forall (n) (holomorphic_on (seq_value F0 n) (open_disc c s))) (forall (n x) (-> (in x (open_disc c s)) (<= (abs (fn_value (seq_value F0 n) x)) B)))) (exists (phi g) (and (strict_mono_index phi) (uniform_tends_on (fn_subseq F0 phi) g (closed_disc c r))))))
  hard_negative:
    statement: 部分列は開円板$|z-c|<R$全体で一様収束する。
    reason: $F_n(z)=z^n$、$c=0$、$R=1$では、どの部分列も$|z|<1$で$0$に各点収束するが、$\sup_{|z|<1}|z^n|=1$なので一様収束しない。
  target: |
    ∀ (F : ℕ → ℂ → ℂ) (c : ℂ) (r R M : ℝ), r < R → (∀ n, DifferentiableOn ℂ (F n) (Metric.ball c R)) → (∀ n, ∀ x ∈ Metric.ball c R, ‖F n x‖ ≤ M) → ∃ (φ : ℕ → ℕ) (g : ℂ → ℂ), StrictMono φ ∧ TendstoUniformlyOn (fun n => F (φ n)) g Filter.atTop (Metric.closedBall c r)
  proof: |
    by
      intro F c r R M hrR hd hb
      have hρ : 0 < (R - r) / 2 := by linarith
      have hsub : ∀ x ∈ Metric.closedBall c r, Metric.closedBall x ((R - r) / 2) ⊆ Metric.ball c R := by
        intro x hx y hy
        have h1 := mem_closedBall_iff_norm.mp hx
        have h2 := mem_closedBall_iff_norm.mp hy
        rw [mem_ball_iff_norm]
        have h3 : ‖y - c‖ ≤ ‖y - x‖ + ‖x - c‖ := by
          have := norm_add_le (y - x) (x - c)
          simpa using this
        linarith
      have hball : ∀ x ∈ Metric.closedBall c r, x ∈ Metric.ball c R := fun x hx => hsub x hx (Metric.mem_closedBall_self hρ.le)
      have hlip : ∀ n, ∀ x ∈ Metric.closedBall c r, ∀ y ∈ Metric.closedBall c r, ‖F n x - F n y‖ ≤ 2 * |M| / (R - r) * ‖x - y‖ := by
        intro n x hx y hy
        have hderiv : ∀ x ∈ Metric.closedBall c r, ‖deriv (F n) x‖ ≤ 2 * |M| / (R - r) := by
          intro x hx
          have hdc : DiffContOnCl ℂ (F n) (Metric.ball x ((R - r) / 2)) := by
            apply DifferentiableOn.diffContOnCl
            rw [closure_ball x hρ.ne']
            exact (hd n).mono (hsub x hx)
          have := Complex.norm_deriv_le_of_forall_mem_sphere_norm_le hρ hdc (C := |M|) (fun y hy => (hb n y (hsub x hx (Metric.sphere_subset_closedBall hy))).trans (le_abs_self M))
          refine this.trans (le_of_eq ?_)
          have hne : R - r ≠ 0 := by linarith
          field_simp
        have hdiff : ∀ x ∈ Metric.closedBall c r, DifferentiableAt ℂ (F n) x := fun x hx => (hd n).differentiableAt (Metric.isOpen_ball.mem_nhds (hball x hx))
        exact Convex.norm_image_sub_le_of_norm_deriv_le hdiff hderiv (convex_closedBall c r) hy hx
      have hLn : 0 ≤ 2 * |M| / (R - r) := by
        apply div_nonneg (by positivity); linarith
      let α := Metric.closedBall c r
      haveI : CompactSpace α := isCompact_iff_compactSpace.mp (isCompact_closedBall c r)
      let B : ℕ → BoundedContinuousFunction α ℂ := fun n =>
        BoundedContinuousFunction.mkOfCompact ⟨fun x => F n x.1, ((hd n).continuousOn.mono (fun x hx => hball x hx)).restrict⟩
      have hBapp : ∀ n x, B n x = F n x.1 := fun n x => rfl
      have hin : ∀ (f : BoundedContinuousFunction α ℂ) (x : α), f ∈ Set.range B → f x ∈ Metric.closedBall (0 : ℂ) M := by
        rintro _ x ⟨n, rfl⟩
        rw [hBapp, mem_closedBall_zero_iff]
        exact hb n x.1 (hball x.1 x.2)
      have hEq : Equicontinuous ((↑) : Set.range B → α → ℂ) := by
        have : ∀ i : Set.range B, LipschitzWith (Real.toNNReal (2 * |M| / (R - r))) (i : α → ℂ) := by
          rintro ⟨_, n, rfl⟩
          refine LipschitzWith.of_dist_le_mul (fun x y => ?_)
          rw [Real.coe_toNNReal _ hLn, dist_eq_norm, Subtype.dist_eq, dist_eq_norm]
          exact hlip n x.1 x.2 y.1 y.2
        exact (LipschitzWith.uniformEquicontinuous _ _ this).equicontinuous
      have hcomp := BoundedContinuousFunction.arzela_ascoli (Metric.closedBall (0 : ℂ) M) (isCompact_closedBall 0 M) (Set.range B) hin hEq
      obtain ⟨a, _, φ, hφ, hlim⟩ := hcomp.tendsto_subseq (x := B) (fun n => subset_closure ⟨n, rfl⟩)
      classical
      refine ⟨φ, fun z => if h : z ∈ Metric.closedBall c r then a ⟨z, h⟩ else 0, hφ, ?_⟩
      rw [Metric.tendstoUniformlyOn_iff]
      intro ε hε
      have h1 := (Metric.tendsto_nhds.mp hlim) ε hε
      filter_upwards [h1] with n hn x hx
      have h2 := lt_of_le_of_lt (BoundedContinuousFunction.dist_coe_le_dist (f := (B ∘ φ) n) (g := a) ⟨x, hx⟩) hn
      rw [dist_comm]
      simpa [hx, hBapp] using h2
- id: exp_is_covering_of_punctured_plane
  kind: textbook
  level: 3
  topic: 指数関数・被覆写像
  statement: 指数関数$\exp:\mathbb{C}\to\mathbb{C}\setminus\{0\}$は被覆写像である。すなわち各$w_0\neq 0$は開近傍$V$を持ち、$\exp^{-1}(V)$は互いに素な開集合の和で、その各々は$\exp$により$V$と同相である。
  statement_en: The exponential map from the complex plane to the punctured plane is a covering map, that is, each w_0 ≠ 0 has an open neighbourhood V whose preimage is a disjoint union of open sets each mapped homeomorphically onto V.
  assumptions:
  - 被覆写像の定義は上の通り
  quantifiers:
  - 任意の$w_0\neq 0$
  conclusion: $\exp$は$\mathbb{C}\setminus\{0\}$上の被覆写像である。
  answer: |-
    $w_0\neq 0$とし、$V=\{w\mid|w-w_0|<|w_0|\}$とおく。$V$は$0$を含まない開円板である。$w\in V$なら$|w/w_0-1|<1$なので、$w/w_0$は右半平面にある。$e^\ell=w_0$なる$\ell$を取り、$L(w)=\ell+\operatorname{Log}(w/w_0)$と定める。$\operatorname{Log}$は主値である。$L$は$V$で連続で$\exp\circ L=\mathrm{id}$である。

    $G_k=L(V)+2\pi ik$($k\in\mathbb{Z}$)とおく。$\exp(\zeta)\in V$なら$\exp(\zeta-L(\exp\zeta))=1$なので$\zeta-L(\exp\zeta)\in 2\pi i\mathbb{Z}$であり、$\zeta$はいずれかの$G_k$に属する。逆に$G_k$の点は$\exp$で$V$に写る。$L(V)$の虚部は$\operatorname{Im}\ell$から$\pi/2$未満の範囲にあるので、$G_k$は互いに素である。$G_k=\{\zeta\mid\exp\zeta\in V,|\operatorname{Im}(\zeta-\ell)-2\pi k|<\pi/2\}$と書けるので開集合である。$\exp:G_k\to V$は連続な逆写像$w\mapsto L(w)+2\pi ik$を持つので同相である。
  strategy: On a disc V avoiding 0, a branch of the logarithm gives the sheets of the preimage.
  sketch:
  - 'construct: V is the disc about w_0 of radius |w_0|, with branch L = ℓ + Log(w/w_0).'
  - 'derive: The preimage of V is the union of L(V) + 2πik.'
  - 'derive: These sheets are open and disjoint by the bound on imaginary parts.'
  - 'conclude: exp restricts to a homeomorphism with inverse L + 2πik on each.'
  openmath: (covering_map_on exp_function (setdiff C (singleton_set 0)))
  hard_negative:
    statement: $\exp$は$\mathbb{C}$から$\mathbb{C}$への被覆写像である。
    reason: $0$は$\exp$の値にならないので、$0$の上のファイバーは空であり、近くの点のファイバーは無限集合である。
  target: |
    IsCoveringMapOn Complex.exp {0}ᶜ
  proof: |
    by
      exact Complex.isCoveringMapOn_exp
- id: holomorphic_log_on_disc
  kind: gap
  level: 3
  topic: 対数の分枝・円板上の対数
  statement: $R>0$とし、$g$は円板$|z-c|<R$で正則で零点を持たないとする。このとき円板で正則な$f$があり、$e^f=g$である。
  statement_en: If R > 0 and g is holomorphic without zeros on the disc |z-c| < R, then there is f holomorphic on the disc with e^f = g.
  assumptions:
  - $R>0$
  - $g$は円板で正則で零点を持たない
  quantifiers:
  - 任意の$g,c,R$
  conclusion: 円板で正則な$f$があり$e^f=g$である。
  answer: |-
    $R>0$、$g$を円板$|z-c|<R$で正則で零点を持たない関数とする。$g'/g$は円板で正則なので、円板で原始関数$F$を持つ。$e^{\ell}=g(c)$なる$\ell$を取り、定数を調整して$F(c)=\ell$とする。

    $h=ge^{-F}$とおくと$h'=g'e^{-F}-gF'e^{-F}=0$である。円板は連結なので$h$は定数で、$h=h(c)=g(c)e^{-\ell}=1$である。よって$e^F=g$である。
  strategy: Integrate g'/g and check that g e^(-F) is constant.
  sketch:
  - 'construct: F is a primitive of g''/g with e^(F(c)) = g(c).'
  - 'derive: (g e^(-F))'' = 0.'
  - 'conclude: g e^(-F) = 1 on the disc.'
  openmath: (forall (g c r) (-> (and (> r 0) (holomorphic_on g (open_disc c r)) (forall (z) (-> (in z (open_disc c r)) (!= (fn_value g z) 0)))) (exists (f) (and (holomorphic_on f (open_disc c r)) (forall (z) (-> (in z (open_disc c r)) (= (exp (fn_value f z)) (fn_value g z))))))))
  hard_negative:
    statement: $\mathbb{C}\setminus\{0\}$で零点を持たない正則関数は全て正則な対数を持つ。
    reason: $g(z)=z$の対数$f$があれば$f'=1/z$であり、$\oint_{|z|=1}dz/z=2\pi i\neq 0$に矛盾する。
  target: |
    ∀ (g : ℂ → ℂ) (c : ℂ) (R : ℝ), 0 < R → DifferentiableOn ℂ g (Metric.ball c R) → (∀ z ∈ Metric.ball c R, g z ≠ 0) → ∃ f : ℂ → ℂ, DifferentiableOn ℂ f (Metric.ball c R) ∧ ∀ z ∈ Metric.ball c R, Complex.exp (f z) = g z
  proof: |
    by
      intro g c R hR hg h0
      have hc : c ∈ Metric.ball c R := Metric.mem_ball_self hR
      have hq : DifferentiableOn ℂ (fun z => deriv g z / g z) (Metric.ball c R) := (hg.deriv Metric.isOpen_ball).div hg h0
      obtain ⟨F, hF0, hF⟩ := (DifferentiableOn.isExactOn_ball hq).with_val_at c (Complex.log (g c))
      refine ⟨F, fun z hz => (hF z hz).differentiableAt.differentiableWithinAt, ?_⟩
      have hk : DifferentiableOn ℂ (fun z => g z * Complex.exp (-F z)) (Metric.ball c R) := by
        refine hg.mul (DifferentiableOn.cexp (DifferentiableOn.neg ?_))
        exact fun z hz => (hF z hz).differentiableAt.differentiableWithinAt
      have hd : Set.EqOn (deriv fun z => g z * Complex.exp (-F z)) 0 (Metric.ball c R) := by
        intro z hz
        have hgz : HasDerivAt g (deriv g z) z := (hg.differentiableAt (Metric.isOpen_ball.mem_nhds hz)).hasDerivAt
        have h1 := hgz.mul ((hF z hz).neg.cexp)
        have h2 : HasDerivAt (fun z => g z * Complex.exp (-F z)) (deriv g z * Complex.exp (-F z) + g z * (Complex.exp (-F z) * -(deriv g z / g z))) z := h1
        rw [h2.deriv]
        have := h0 z hz
        simp only [Pi.zero_apply]
        field_simp
        ring
      intro z hz
      have h3 := Metric.isOpen_ball.is_const_of_deriv_eq_zero (convex_ball c R).isPreconnected hk hd hz hc
      simp only [hF0, Complex.exp_neg, Complex.exp_log (h0 c hc)] at h3
      have hgc := h0 c hc
      rw [mul_inv_cancel₀ hgc] at h3
      have h4 : g z = Complex.exp (F z) := by
        have he := Complex.exp_ne_zero (F z)
        field_simp at h3
        exact h3
      exact h4.symm
- id: continuous_log_on_simply_connected
  kind: textbook
  level: 4
  topic: 対数の分枝・単連結領域での連続な対数
  statement: $U$を単連結な開集合とする。$g$が$U$で連続で零点を持たなければ、$U$で連続な$f$があり$e^f=g$である。被覆写像の持ち上げ定理を既習とする。
  statement_en: If U is a simply connected open set and g is continuous without zeros on U, then there is f continuous on U with e^f = g, assuming the lifting theorem for covering maps.
  assumptions:
  - $U$は単連結な開集合
  - $g$は$U$で連続で零点を持たない
  - 被覆写像の持ち上げ定理を既習とする
  quantifiers:
  - 任意の$g,U$
  conclusion: $U$で連続な$f$があり$e^f=g$である。
  answer: $U$を単連結な開集合、$g$を$U$で連続で零点を持たない関数とする。$U$は開集合なので局所弧状連結であり、単連結である。$g$は$U$から$\mathbb{C}\setminus\{0\}$への連続写像である。$\exp:\mathbb{C}\to\mathbb{C}\setminus\{0\}$は被覆写像である。持ち上げ定理により、単連結で局所弧状連結な空間からの連続写像は被覆へ持ち上がる。すなわち連続な$f:U\to\mathbb{C}$があり$\exp\circ f=g$である。
  strategy: Lift g through the covering map exp.
  sketch:
  - 'translate: g is a continuous map from U to the punctured plane.'
  - 'apply_theorem: exp is a covering map.'
  - 'apply_theorem: The lifting theorem for simply connected, locally path connected spaces.'
  openmath: (forall (g U) (-> (and (open_set U) (simply_connected_space U) (continuous_on_set g U) (forall (z) (-> (in z U) (!= (fn_value g z) 0)))) (exists (f) (and (continuous_on_set f U) (forall (z) (-> (in z U) (= (exp (fn_value f z)) (fn_value g z))))))))
  hard_negative:
    statement: $U$が連結なら単連結でなくても連続な対数がある。
    reason: $U=\mathbb{C}\setminus\{0\}$、$g(z)=z$では連続な対数はない。単位円周を一周すると偏角が$2\pi$増える。
  target: |
    ∀ (g : ℂ → ℂ) (U : Set ℂ), IsOpen U → IsSimplyConnected U → ContinuousOn g U → (∀ z ∈ U, g z ≠ 0) → ∃ f : ℂ → ℂ, ContinuousOn f U ∧ ∀ z ∈ U, Complex.exp (f z) = g z
  proof: |
    by
      intro g U hU hs hg h0
      obtain ⟨f, h1, h2⟩ := Complex.exists_continuousOn_eqOn_exp_comp hs hU hg (by
        rintro ⟨z, hz, hz0⟩
        exact h0 z hz hz0)
      exact ⟨f, h1, fun z hz => h2 hz⟩
- id: holomorphic_log_on_simply_connected
  kind: gap
  level: 4
  topic: 対数の分枝・単連結領域での正則な対数
  statement: $U$を単連結な開集合とする。$g$が$U$で正則で零点を持たなければ、$U$で正則な$f$があり$e^f=g$である。
  statement_en: If U is a simply connected open set and g is holomorphic without zeros on U, then there is f holomorphic on U with e^f = g.
  assumptions:
  - $U$は単連結な開集合
  - $g$は$U$で正則で零点を持たない
  quantifiers:
  - 任意の$g,U$
  conclusion: $U$で正則な$f$があり$e^f=g$である。
  answer: $U$を単連結な開集合、$g$を$U$で正則で零点を持たない関数とする。単連結領域での連続な対数の存在により、$U$で連続な$f$があり$e^f=g$である。$f$が正則であることを示す。$z_0\in U$を取る。$f$は連続なので、$z_0$の近傍で$|f(z)-f(z_0)|<\pi$である。$e^{f(z)-f(z_0)}=g(z)/g(z_0)$で、虚部が$(-\pi,\pi)$にあるので、主値の対数により$f(z)-f(z_0)=\operatorname{Log}(g(z)/g(z_0))$である。$z=z_0$で$g(z)/g(z_0)=1$なので、右辺は$z_0$の近傍で正則である。よって$f$は$z_0$で正則である。
  strategy: A continuous logarithm of a holomorphic function is locally a branch of Log composed with g.
  sketch:
  - 'apply_theorem: A continuous logarithm f exists on U.'
  - 'derive: Near z_0, |f - f(z_0)| < π.'
  - 'derive: So f - f(z_0) = Log(g/g(z_0)), holomorphic near z_0.'
  openmath: (forall (g U) (-> (and (open_set U) (simply_connected_space U) (holomorphic_on g U) (forall (z) (-> (in z U) (!= (fn_value g z) 0)))) (exists (f) (and (holomorphic_on f U) (forall (z) (-> (in z U) (= (exp (fn_value f z)) (fn_value g z))))))))
  hard_negative:
    statement: $g$が$U$に零点を持っても、正則な対数がある。
    reason: $g(z)=z$、$U$を単位円板とする。$e^f=g$なら$g(0)=e^{f(0)}\neq 0$に矛盾する。
  target: |
    ∀ (g : ℂ → ℂ) (U : Set ℂ), IsOpen U → IsSimplyConnected U → DifferentiableOn ℂ g U → (∀ z ∈ U, g z ≠ 0) → ∃ f : ℂ → ℂ, DifferentiableOn ℂ f U ∧ ∀ z ∈ U, Complex.exp (f z) = g z
  proof: |
    by
      intro g U hU hs hg h0
      obtain ⟨f, h1, h2⟩ := Complex.exists_continuousOn_eqOn_exp_comp hs hU hg.continuousOn (by
        rintro ⟨z, hz, hz0⟩
        exact h0 z hz hz0)
      refine ⟨f, fun z hz => ?_, fun z hz => h2 hz⟩
      have hzn := hU.mem_nhds hz
      have hfc : ContinuousAt f z := h1.continuousAt hzn
      have hgz := hg.differentiableAt hzn
      have hq : DifferentiableAt ℂ (fun w => Complex.log (g w / g z)) z := by
        apply DifferentiableAt.clog (hgz.div_const _)
        simp [div_self (h0 z hz)]
      have hev : f =ᶠ[nhds z] fun w => f z + Complex.log (g w / g z) := by
        have hsmall : ∀ᶠ w in nhds z, ‖f w - f z‖ < Real.pi := by
          have : Filter.Tendsto (fun w => ‖f w - f z‖) (nhds z) (nhds ‖f z - f z‖) := (hfc.sub continuousAt_const).norm
          simp only [sub_self, norm_zero] at this
          exact this.eventually (gt_mem_nhds Real.pi_pos)
        filter_upwards [hsmall, hzn] with w hw hwU
        have e : g w / g z = Complex.exp (f w - f z) := by
          rw [Complex.exp_sub]
          have a1 : Complex.exp (f w) = g w := h2 hwU
          have a2 : Complex.exp (f z) = g z := h2 hz
          rw [a1, a2]
        have him : |(f w - f z).im| < Real.pi := lt_of_le_of_lt (Complex.abs_im_le_norm _) hw
        rw [e, Complex.log_exp (by linarith [(abs_lt.mp him).1]) (by linarith [(abs_lt.mp him).2])]
        ring
      exact ((differentiableAt_const _).add hq).congr_of_eventuallyEq hev |>.differentiableWithinAt
