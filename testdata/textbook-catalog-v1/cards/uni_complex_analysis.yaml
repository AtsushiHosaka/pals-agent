  openmath: (forall (f c) (-> (meromorphic_at f c) (and (<-> (exists (a) (fn_limit_at (lambda (z) (fn_value f z)) c a)) (<= 0 (meromorphic_order f c))) (<-> (exists (a) (and (!= a 0) (fn_limit_at (lambda (z) (fn_value f z)) c a))) (= (meromorphic_order f c) 0)) (<-> (fn_limit_at (lambda (z) (fn_value f z)) c 0) (< 0 (meromorphic_order f c))))))
