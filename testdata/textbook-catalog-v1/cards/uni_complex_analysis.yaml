- id: meromorphic_order_of_derivative
  kind: gap
  level: 3
  topic: 有理型関数・導関数の位数
  statement: $f$が$c$で有理型で$\operatorname{ord}_cf=n$、$n$は$0$でない整数とする。このとき$\operatorname{ord}_cf'=n-1$である。
  statement_en: If f is meromorphic at c with ord_c f = n a nonzero integer, then ord_c f' = n - 1.
  assumptions:
  - $f$は$c$で有理型
  - $\operatorname{ord}_cf=n$、$n\neq 0$は整数
  quantifiers:
  - 任意の$f,c,n$
  conclusion: $\operatorname{ord}_cf'=n-1$である。
  answer: |-
    $f$を$c$で有理型で$\operatorname{ord}_cf=n$を満たす関数、$n\neq 0$を整数とする。穴あき近傍で$f=(z-c)^ng$、$g$は$c$で解析的で$g(c)\neq 0$である。穴あき近傍の開集合上でこの等式を微分すると
    $f'(z)=(z-c)^{n-1}\bigl(ng(z)+(z-c)g'(z)\bigr)$
    である。$H=ng+(z-c)g'$は$c$で解析的で、$H(c)=ng(c)\neq 0$である。$f'$は$c$で有理型であり、位数の一意性から$\operatorname{ord}_cf'=n-1$である。
  strategy: Differentiate the factorization and factor out (z-c)^(n-1).
  sketch:
  - 'setup: f = (z-c)^n g on a punctured neighbourhood.'
  - 'derive: f'' = (z-c)^(n-1) (n g + (z-c) g'').'
  - 'derive: The second factor is analytic with value n g(c) ≠ 0 at c.'
  - 'apply_theorem: Uniqueness of the order concludes.'
  openmath: (forall (f c n) (-> (and (meromorphic_at f c) (in n Z) (!= n 0) (= (meromorphic_order f c) n)) (= (meromorphic_order (derivative_function f) c) (- n 1))))
  hard_negative:
    statement: $n=0$でも$\operatorname{ord}_cf'=-1$である。
    reason: $f(z)=1+z$、$c=0$では$\operatorname{ord}_0f=0$だが、$f'=1$の位数は$0$である。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ) (n : ℤ), MeromorphicAt f c → n ≠ 0 → meromorphicOrderAt f c = n → meromorphicOrderAt (deriv f) c = ((n - 1 : ℤ) : WithTop ℤ)
  proof: |
    by
      intro f c n hf hn ho
      obtain ⟨g, hg, hg0, he⟩ := (meromorphicOrderAt_eq_int_iff hf).mp ho
      rw [meromorphicOrderAt_eq_int_iff hf.deriv]
      refine ⟨fun z => (n : ℂ) * g z + (z - c) * deriv g z, ?_, ?_, ?_⟩
      · exact (analyticAt_const.mul hg).add ((analyticAt_id.sub analyticAt_const).mul hg.deriv)
      · simp [hg0, hn]
      · have h1 : ∀ᶠ z in nhdsWithin c {c}ᶜ, ∀ᶠ y in nhdsWithin z {c}ᶜ, f y = (y - c) ^ n • g y := eventually_eventually_nhdsWithin.mpr he
        have h2 : ∀ᶠ z in nhdsWithin c {c}ᶜ, AnalyticAt ℂ g z := nhdsWithin_le_nhds hg.eventually_analyticAt
        filter_upwards [h1, h2, self_mem_nhdsWithin] with z hz1 hz2 hz3
        have hz0 : z - c ≠ 0 := sub_ne_zero.mpr hz3
        rw [isOpen_compl_singleton.nhdsWithin_eq hz3] at hz1
        have hp : HasDerivAt (fun y : ℂ => (y - c) ^ n) ((n : ℂ) * (z - c) ^ (n - 1)) z :=
          (hasDerivAt_zpow n (z - c) (Or.inl hz0)).comp_sub_const z c
        have hm : HasDerivAt (fun y : ℂ => (y - c) ^ n * g y) ((n : ℂ) * (z - c) ^ (n - 1) * g z + (z - c) ^ n * deriv g z) z :=
          hp.mul hz2.differentiableAt.hasDerivAt
        have hc : deriv f z = deriv (fun y : ℂ => (y - c) ^ n * g y) z := Filter.EventuallyEq.deriv_eq (hz1.mono (fun y hy => by simpa [smul_eq_mul] using hy))
        rw [hc, hm.deriv, smul_eq_mul]
        have : (z - c) ^ n = (z - c) ^ (n - 1) * (z - c) := by
          rw [zpow_sub_one₀ hz0]; field_simp
        rw [this]
        ring
- id: meromorphic_order_of_quotient
  kind: gap
  level: 3
  topic: 有理型関数・商の位数
  statement: $f,g$が$c$で解析的で、零点の位数がそれぞれ有限の$m,n$なら、$f/g$の$c$での位数は$m-n$である。
  statement_en: If f and g are analytic at c with finite orders of vanishing m and n, then f/g has order m - n at c.
  assumptions:
  - $f,g$は$c$で解析的
  - $\operatorname{ord}_cf=m$、$\operatorname{ord}_cg=n$は有限
  quantifiers:
  - 任意の$f,g,c$と自然数$m,n$
  conclusion: $\operatorname{ord}_c(f/g)=m-n$である。
  answer: $f,g$を$c$で解析的な関数で、零点の位数がそれぞれ有限の$m,n$であるものとする。$c$の近傍で$f=(z-c)^mF$、$g=(z-c)^nG$、$F,G$は$c$で解析的で$F(c),G(c)\neq 0$である。$G$は連続なので$c$の近傍で$G\neq 0$であり、$F/G$は$c$で解析的で値は$0$でない。穴あき近傍で$g\neq 0$であり、$f/g=(z-c)^{m-n}F/G$である。位数の一意性より$\operatorname{ord}_c(f/g)=m-n$である。
  strategy: Divide the two local factorizations.
  sketch:
  - 'setup: Factor f and g at c.'
  - 'derive: f/g = (z-c)^(m-n) F/G with F/G analytic and nonzero at c.'
  - 'apply_theorem: Uniqueness of the order.'
  openmath: (forall (f g c m n) (-> (and (analytic_at f c) (analytic_at g c) (in m N) (in n N) (= (analytic_order f c) m) (= (analytic_order g c) n)) (= (meromorphic_order_fn (lambda (z) (/ (fn_value f z) (fn_value g z))) c) (- m n))))
  hard_negative:
    statement: $g$の位数が$\infty$(近傍で$g=0$)でも$\operatorname{ord}_c(f/g)$は$m-n$の形の整数である。
    reason: $g=0$では$f/g$は定義されず、$1/0=0$の約束のもとで近傍で$0$となり位数は$\infty$である。
  target: |
    ∀ (f g : ℂ → ℂ) (c : ℂ) (m n : ℕ), AnalyticAt ℂ f c → AnalyticAt ℂ g c → analyticOrderAt f c = m → analyticOrderAt g c = n → meromorphicOrderAt (fun z => f z / g z) c = (((m : ℤ) - (n : ℤ) : ℤ) : WithTop ℤ)
  proof: |
    by
      intro f g c m n hf hg hm hn
      have e1 : meromorphicOrderAt f c = ((m : ℤ) : WithTop ℤ) := by
        rw [hf.meromorphicOrderAt_eq, hm]; rfl
      have e2 : meromorphicOrderAt g c = ((n : ℤ) : WithTop ℤ) := by
        rw [hg.meromorphicOrderAt_eq, hn]; rfl
      have e3 : (fun z => f z / g z) = fun z => f z * (g z)⁻¹ := by
        funext z; rw [div_eq_mul_inv]
      have e4 : meromorphicOrderAt (fun z => f z * (g z)⁻¹) c = meromorphicOrderAt f c + meromorphicOrderAt (fun z => (g z)⁻¹) c := meromorphicOrderAt_mul hf.meromorphicAt hg.meromorphicAt.inv
      have e5 : meromorphicOrderAt (fun z => (g z)⁻¹) c = -meromorphicOrderAt g c := meromorphicOrderAt_inv
      rw [e3, e4, e5, e1, e2, sub_eq_add_neg]
      rfl
- id: meromorphic_zeros_poles_finite_on_compact
  kind: gap
  level: 3
  topic: 有理型関数・コンパクト集合上の零点と極
  statement: $K$をコンパクト集合とし、$f$は$K$の各点で有理型で位数が有限とする。このとき$\operatorname{ord}_zf\neq 0$となる$z\in K$は有限個である。
  statement_en: If K is compact and f is meromorphic with finite order at each point of K, then only finitely many points of K have nonzero order.
  assumptions:
  - $K$はコンパクト
  - $f$は$K$の各点で有理型で位数は有限
  quantifiers:
  - 任意の$f,K$
  conclusion: $\{z\in K\mid\operatorname{ord}_zf\neq 0\}$は有限集合である。
  answer: |-
    $K$をコンパクト集合、$f$を$K$の各点で有理型で位数が有限な関数とする。$x\in K$とする。位数は有限なので、$x$の穴あき近傍で$f=(z-x)^ng$、$g(x)\neq 0$である。$g$は解析的で$g(x)\neq 0$なので、$x$を中心とする円板$D_x$を、$D_x$で$g$が解析的で$g\neq 0$となり、$D_x\setminus\{x\}$で上の等式が成り立つように取れる。$y\in D_x$、$y\neq x$なら、$y$の近傍で$f$は$0$でない解析関数$(z-x)^ng$に等しいので$\operatorname{ord}_yf=0$である。よって$D_x$の中で位数が$0$でない点は$x$だけに限られる。

    $K$はコンパクトなので有限個の$D_x$で覆える。したがって位数が$0$でない点は有限個である。
  strategy: Each point has a disc containing no other point of nonzero order; compactness finishes.
  sketch:
  - 'derive: Near x, f = (z-x)^n g with g nonzero on a disc D_x.'
  - 'derive: Points of D_x other than x have order 0.'
  - 'apply_theorem: Finitely many D_x cover K.'
  openmath: (forall (f K) (-> (and (compact_set K) (meromorphic_on f K) (forall (z) (-> (in z K) (!= (meromorphic_order f z) infinite_order)))) (finite_set (nonzero_order_set_in f K))))
  hard_negative:
    statement: $K$がコンパクトでなくても同じ結論が成り立つ。
    reason: $K=\mathbb{C}$、$f(z)=\sin z$では、零点$k\pi$は全て位数$1$で無限個ある。
  target: |
    ∀ (f : ℂ → ℂ) (K : Set ℂ), IsCompact K → MeromorphicOn f K → (∀ z ∈ K, meromorphicOrderAt f z ≠ ⊤) → {z ∈ K | meromorphicOrderAt f z ≠ 0}.Finite
  proof: |
    by
      intro f K hK hf ht
      refine ((MeromorphicOn.divisor f K).finiteSupport hK).subset ?_
      rintro z ⟨hz, h0⟩
      rw [Function.mem_support, MeromorphicOn.divisor_apply hf hz]
      intro h
      rcases (WithTop.untop₀_eq_zero).mp h with h1 | h1
      · exact h0 h1
      · exact ht z hz h1
- id: divisor_mul_inv
  kind: gap
  level: 3
  topic: 有理型関数・因子
  statement: $f$の$U$上の因子$\operatorname{div}_Uf$を、$z\in U$で$\operatorname{ord}_zf$の値を取る関数とする。$f,g$が$U$で有理型で、$U$の各点で位数が有限なら、$\operatorname{div}_U(fg)=\operatorname{div}_Uf+\operatorname{div}_Ug$、$\operatorname{div}_U(1/f)=-\operatorname{div}_Uf$である。
  statement_en: With the divisor of f on U taking the value ord_z f at z in U, if f and g are meromorphic on U with finite orders at each point of U, then div(fg) = div f + div g and div(1/f) = -div f on U.
  assumptions:
  - $f,g$は$U$で有理型
  - $U$の各点で$f,g$の位数は有限
  quantifiers:
  - 任意の$f,g,U$
  conclusion: $\operatorname{div}_U(fg)=\operatorname{div}_Uf+\operatorname{div}_Ug$、$\operatorname{div}_U(1/f)=-\operatorname{div}_Uf$である。
  answer: $f,g$を$U$で有理型で$U$の各点で位数が有限な関数、$\operatorname{div}_Uf$を$z\in U$で$\operatorname{ord}_zf$の値を取り$U$の外で$0$の関数とする。積と逆数も$U$で有理型である。$z\notin U$では因子の値はどれも$0$である。$z\in U$では、有理型関数の積と逆数の位数の公式により$\operatorname{ord}_z(fg)=\operatorname{ord}_zf+\operatorname{ord}_zg$、$\operatorname{ord}_z(1/f)=-\operatorname{ord}_zf$である。位数は有限の整数なので、これらは因子の値の等式である。
  strategy: Evaluate pointwise with the order formulas for products and inverses.
  sketch:
  - 'case_split: Outside U all values are 0.'
  - 'apply_theorem: On U use the order formulas for fg and 1/f.'
  openmath: (forall (f g U) (-> (and (meromorphic_on f U) (meromorphic_on g U) (forall (z) (-> (in z U) (and (!= (meromorphic_order f z) infinite_order) (!= (meromorphic_order g z) infinite_order))))) (and (= (divisor_on (lambda (z) (* (fn_value f z) (fn_value g z))) U) (+ (divisor_on (lambda (z) (fn_value f z)) U) (divisor_on (lambda (z) (fn_value g z)) U))) (= (divisor_on (lambda (z) (/ 1 (fn_value f z))) U) (neg (divisor_on (lambda (z) (fn_value f z)) U))))))
  hard_negative:
