  proof: |
    by
      intro f g U hf hg hft hgt
      exact ⟨MeromorphicOn.divisor_mul hf hg hft hgt, MeromorphicOn.divisor_inv⟩
- id: meromorphic_extract_zeros_poles
  kind: textbook
  level: 4
  topic: 有理型関数・零点と極の分離
  statement: $f$が$U$で有理型で、$U$の各点で位数が有限、因子$D=\operatorname{div}_Uf$の台が有限とする。このとき$U$の各点で解析的で$U$上で零点を持たない$g$があり、$U$内に集積点を持たない$U$の部分集合を除いて$U$上で$f(z)=\prod_u(z-u)^{D(u)}g(z)$である。
  statement_en: If f is meromorphic on U with finite orders and its divisor D on U has finite support, then there is g analytic at each point of U without zeros on U such that f(z) = Π_u (z-u)^D(u) g(z) on U outside a subset with no accumulation point in U.
  assumptions:
  - $f$は$U$で有理型で各点の位数は有限
  - $D=\operatorname{div}_Uf$の台は有限
  quantifiers:
  - 任意の$f,U$
  conclusion: 上の$g$と表示が存在する。
  answer: |-
    $f$を$U$で有理型で$U$の各点で位数が有限な関数、$D=\operatorname{div}_Uf$の台を有限とする。$R(z)=\prod_u(z-u)^{D(u)}$は有限積で、$h=f/R$とおく。$u\in U$で$\operatorname{ord}_uR=D(u)=\operatorname{ord}_uf$なので、$\operatorname{ord}_uh=0$である。よって各$u\in U$に、$u$で解析的で$g_u(u)\neq 0$なる$g_u$があり、$u$の穴あき近傍で$h=g_u$である。

    $g(z)$を、$\zeta\to z$($\zeta\neq z$)での$h(\zeta)$の極限が存在するときその値とし、それ以外で$0$と定める。$u\in U$とする。$g_u$が解析的である円板内で$h=g_u$が穴あき近傍で成り立つ範囲の点$z$では、極限は$g_u(z)$である。よって$u$の近傍で$g=g_u$であり、$g$は$u$で解析的で$g(u)\neq 0$である。

    有理型関数は穴あき近傍で解析的なので、$f$が解析的でない$U$の点と$D$の台の和$E$は、$U$内に集積点を持たない。$z\in U\setminus E$なら$R(z)\neq 0$で$h$は$z$で連続なので$g(z)=h(z)$であり、$f(z)=R(z)g(z)$である。
  strategy: Divide by the finite product built from the divisor; the quotient has order 0 everywhere and extends to a nonvanishing analytic function.
  sketch:
  - 'construct: R = Π (z-u)^D(u) and h = f/R.'
  - 'derive: h has order 0 at each point of U.'
  - 'construct: g is the punctured limit of h, analytic and nonzero on U.'
  - 'derive: f = R g outside the discrete set of non-analytic points and the support of D.'
  openmath: (forall (f U) (-> (and (meromorphic_on f U) (forall (u) (-> (in u U) (!= (meromorphic_order f u) infinite_order))) (finite_support_divisor (divisor_on (lambda (z) (fn_value f z)) U))) (exists (g) (and (analytic_on g U) (forall (u) (-> (in u U) (!= (fn_value g u) 0))) (eq_off_discrete (lambda (z) (fn_value f z)) (lambda (z) (* (divisor_factor_product (divisor_on (lambda (w) (fn_value f w)) U) z) (fn_value g z))) U)))))
  hard_negative:
    statement: 等式$f=\prod_u(z-u)^{D(u)}g$は除外集合なしに$U$の全ての点で成り立つ。
    reason: $f(z)=1$($z\neq 0$)、$f(0)=5$、$U=\mathbb{C}$では$D=0$で、解析的な$g$は$g=1$に限られるので$z=0$で等式が成り立たない。
  target: |
    ∀ (f : ℂ → ℂ) (U : Set ℂ), MeromorphicOn f U → (∀ u ∈ U, meromorphicOrderAt f u ≠ ⊤) → (MeromorphicOn.divisor f U).support.Finite → ∃ g : ℂ → ℂ, AnalyticOnNhd ℂ g U ∧ (∀ u ∈ U, g u ≠ 0) ∧ f =ᶠ[Filter.codiscreteWithin U] (∏ᶠ u, (fun z => z - u) ^ (MeromorphicOn.divisor f U u)) • g
  proof: |
    by
      intro f U hf ht hs
      obtain ⟨g, h1, h2, h3⟩ := hf.extract_zeros_poles (fun u => ht u u.2) hs
      exact ⟨g, h1, fun u hu => h2 ⟨u, hu⟩, h3⟩
- id: principal_part_decomposition
  kind: gap
  level: 3
  topic: 有理型関数・主要部への分解
  statement: $f$が$c$で有理型で$\operatorname{ord}_cf=-m$($m\in\mathbb{N}$)とする。複素数列$(A_k)$と$c$で解析的な$h$があり、$c$の穴あき近傍で$f(z)=\sum_{k<m}A_k/(z-c)^{k+1}+h(z)$である。$m\geq 1$なら$A_{m-1}\neq 0$である。
  statement_en: If f is meromorphic at c with ord_c f = -m, m natural, then f(z) = Σ_(k<m) A_k/(z-c)^(k+1) + h(z) on a punctured neighbourhood of c with h analytic at c, and A_(m-1) ≠ 0 when m ≥ 1.
  assumptions:
  - $f$は$c$で有理型
  - $\operatorname{ord}_cf=-m$
  quantifiers:
  - 任意の$f,c$と自然数$m$
  conclusion: 上の分解が存在する。
  answer: |-
    $f$を$c$で有理型で$\operatorname{ord}_cf=-m$を満たす関数、$m$を自然数とする。穴あき近傍で$f=(z-c)^{-m}g$、$g$は$c$で解析的で$g(c)\neq 0$である。$g$のテイラー展開を$m$次で切ると
    $g(z)=\sum_{i<m}b_i(z-c)^i+(z-c)^mh(z)$
    であり、$b_i=g^{(i)}(c)/i!$、$h$は$c$で解析的である。$(z-c)^{-m}$を掛けると
    $f(z)=\sum_{i<m}\frac{b_i}{(z-c)^{m-i}}+h(z)$
    である。$k=m-1-i$と置き換え、$A_k=b_{m-1-k}$とすると求める形になる。$m\geq 1$なら$A_{m-1}=b_0=g(c)\neq 0$である。
  strategy: Truncate the Taylor expansion of g at degree m and divide by (z-c)^m.
  sketch:
  - 'setup: f = (z-c)^(-m) g with g(c) ≠ 0.'
  - 'derive: g = Σ_(i<m) b_i (z-c)^i + (z-c)^m h with h analytic.'
  - 'derive: Divide by (z-c)^m and reindex.'
  - 'conclude: A_(m-1) = g(c) ≠ 0.'
  openmath: (forall (f c m) (-> (and (meromorphic_at f c) (in m N) (= (meromorphic_order f c) (neg m))) (exists (A h) (and (analytic_at h c) (-> (!= m 0) (!= (seq_value A (- m 1)) 0)) (eq_punctured_near (lambda (z) (fn_value f z)) (lambda (z) (+ (range_sum m (lambda (k) (/ (seq_value A k) (^ (- z c) (+ k 1))))) (fn_value h z))) c)))))
  hard_negative:
    statement: 真性特異点でも有限個の項の主要部に分解できる。
    reason: $f(z)=e^{1/z}$が$\sum_{k<m}A_k/z^{k+1}+h$なら、$z^{m}f$は$0$で有界となるが、$z=1/n$($n\to\infty$)で$n^{-m}e^n\to\infty$である。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ) (m : ℕ), MeromorphicAt f c → meromorphicOrderAt f c = ((-(m : ℤ) : ℤ) : WithTop ℤ) → ∃ (A : ℕ → ℂ) (h : ℂ → ℂ), AnalyticAt ℂ h c ∧ (m ≠ 0 → A (m - 1) ≠ 0) ∧ ∀ᶠ z in nhdsWithin c {c}ᶜ, f z = (∑ k ∈ Finset.range m, A k / (z - c) ^ (k + 1)) + h z
  proof: |
    by
      intro f c m hf ho
      obtain ⟨g, hg, hg0, he⟩ := (meromorphicOrderAt_eq_int_iff hf).mp ho
      set g' : ℂ → ℂ := fun w => g (c + w) with hg'
      have hg'a : AnalyticAt ℂ g' 0 := by
        have h1 : AnalyticAt ℂ g (c + 0) := by simpa using hg
        have h2 : AnalyticAt ℂ (fun w : ℂ => c + w) 0 := analyticAt_const.add analyticAt_id
        exact AnalyticAt.comp' h1 h2
      obtain ⟨F, hF, hFe⟩ := hg'a.exists_eq_sum_add_pow_mul m
      set b : ℕ → ℂ := fun i => iteratedDeriv i g' 0 / (i.factorial : ℂ) with hb
      have hFc : AnalyticAt ℂ (fun z : ℂ => F (z - c)) c := by
        have h1 : AnalyticAt ℂ F (c - c) := by simpa using hF
        have h2 : AnalyticAt ℂ (fun z : ℂ => z - c) c := analyticAt_id.sub analyticAt_const
        exact AnalyticAt.comp' h1 h2
      refine ⟨fun k => b (m - 1 - k), fun z => F (z - c), hFc, ?_, ?_⟩
      · intro hm
        have : m - 1 - (m - 1) = 0 := by omega
        simp only [this, hb]
        simpa [hg'] using hg0
      · filter_upwards [he, self_mem_nhdsWithin] with z hz hzc
        have hw : z - c ≠ 0 := sub_ne_zero.mpr hzc
        have h1 := hFe (z - c)
        have h2 : g z = g' (z - c) := by simp [hg']
        rw [hz, h2, h1, smul_eq_mul, zpow_neg, zpow_natCast, smul_eq_mul, mul_add]
        congr 1
        · rw [Finset.mul_sum, ← Finset.sum_range_reflect (fun k => b (m - 1 - k) / (z - c) ^ (k + 1)) m]
          refine Finset.sum_congr rfl (fun i hi => ?_)
          have hi' : i < m := Finset.mem_range.mp hi
          have e1 : m - 1 - (m - 1 - i) = i := by omega
          have e2 : m - 1 - i + 1 + i = m := by omega
          simp only [e1, hb, smul_eq_mul]
          have e3 : (z - c) ^ m = (z - c) ^ (m - 1 - i + 1) * (z - c) ^ i := by
            rw [← pow_add, e2]
          rw [e3]
          have hp1 : (z - c) ^ (m - 1 - i + 1) ≠ 0 := pow_ne_zero _ hw
          have hp2 : (z - c) ^ i ≠ 0 := pow_ne_zero _ hw
          have hp3 : (i.factorial : ℂ) ≠ 0 := by exact_mod_cast i.factorial_ne_zero
          generalize (z - c) ^ (m - 1 - i + 1) = X at hp1 ⊢
          generalize (z - c) ^ i = Y at hp2 ⊢
          generalize (i.factorial : ℂ) = W at hp3 ⊢
          field_simp
        · have hp : (z - c) ^ m ≠ 0 := pow_ne_zero _ hw
          rw [← mul_assoc, inv_mul_cancel₀ hp, one_mul]
- id: phragmen_lindelof_vertical_strip
  kind: named
  level: 4
  topic: フラグメン・リンデレーフの原理・帯領域
  statement: フラグメン・リンデレーフの原理(縦の帯)。$f$は開帯$a<\operatorname{Re}z<b$で正則で閉包で連続、$d<\pi/(b-a)$で、開帯上$|f(w)|\leq A\exp(B\exp(d|\operatorname{Im}w|))$とする。二つの辺で$|f|\leq C$なら、閉帯上で$|f|\leq C$である。
  statement_en: The Phragmén-Lindelöf principle on a vertical strip. If f is holomorphic on a < Re z < b, continuous on the closure, d < π/(b-a), |f(w)| ≤ A exp(B exp(d|Im w|)) on the open strip and |f| ≤ C on both edges, then |f| ≤ C on the closed strip.
  assumptions:
  - $f$は開帯で正則で閉包で連続
  - $d<\pi/(b-a)$
  - 開帯上で$|f(w)|\leq A\exp(B\exp(d|\operatorname{Im}w|))$
  - $\operatorname{Re}w=a$と$\operatorname{Re}w=b$で$|f(w)|\leq C$
  - $a\leq\operatorname{Re}z\leq b$
  quantifiers:
  - 任意の$f,a,b,d,A,B,C,z$
  conclusion: $|f(z)|\leq C$である。
  answer: |-
    $f$を開帯$a<\operatorname{Re}z<b$で正則で閉包で連続な関数、$d<\pi/(b-a)$とし、開帯上で$|f(w)|\leq A\exp(B\exp(d|\operatorname{Im}w|))$、二つの辺で$|f|\leq C$、$a\leq\operatorname{Re}z\leq b$とする。$z$が辺の上にあれば仮定そのものである。よって$a<\operatorname{Re}z<b$とする。平行移動して$a=-h$、$b=h$、$h>0$としてよい。$C\geq 0$である。$\max(d,0)<d'<\pi/(2h)$なる$d'$を取り、$\delta=\cos(d'h)>0$とする。

    $\varepsilon>0$に対し$g_\varepsilon(w)=f(w)\exp(-\varepsilon\cos(d'w))$とおく。$w=x+iy$、$|x|\leq h$なら$\operatorname{Re}\cos(d'w)=\cos(d'x)\cosh(d'y)\geq\delta e^{d'|y|}/2$である。よって辺の上で$|g_\varepsilon|\leq|f|\leq C$である。開帯上で
    $|g_\varepsilon(w)|\leq A\exp\bigl(|B|e^{\max(d,0)|y|}-\varepsilon\delta e^{d'|y|}/2\bigr)$
    であり、$d'>\max(d,0)$なので$|y|\to\infty$で右辺は$0$に収束する。

    $C'>C$を取る。$T>|\operatorname{Im}z|$を十分大きく取ると、$|y|=T$で$|g_\varepsilon|\leq C'$である。長方形$|x|\leq h$、$|y|\leq T$に最大値原理を適用して$|g_\varepsilon(z)|\leq C'$を得る。$C'\downarrow C$、続いて$\varepsilon\downarrow 0$として$|f(z)|\leq C$である。
  strategy: Multiply by exp(-ε cos(d'w)), which beats the allowed growth, and apply the maximum principle on tall rectangles.
  sketch:
  - 'setup: Normalize the strip to |Re w| < h and choose d'' with max(d,0) < d'' < π/(2h).'
  - 'construct: g_ε = f exp(-ε cos(d''w)) with Re cos(d''w) ≥ δ e^(d''|y|)/2.'
  - 'derive: g_ε is at most C on the edges and tends to 0 as |y| tends to infinity.'
  - 'apply_theorem: The maximum principle on tall rectangles.'
  - 'conclude: Let ε tend to 0.'
  openmath: (forall (f a b d p q k z) (-> (and (holomorphic_on f (open_vertical_strip a b)) (continuous_on_set f (set_closure (open_vertical_strip a b))) (< d (/ pi (- b a))) (forall (w) (-> (in w (open_vertical_strip a b)) (<= (abs (fn_value f w)) (* p (exp (* q (exp (* d (abs (imag_part w)))))))))) (forall (w) (-> (or (= (real_part w) a) (= (real_part w) b)) (<= (abs (fn_value f w)) k))) (<= a (real_part z)) (<= (real_part z) b)) (<= (abs (fn_value f z)) k)))
  hard_negative:
    statement: 増大の条件なしで、二つの辺で$|f|\leq C$なら帯全体で$|f|\leq C$である。
    reason: $f(z)=\exp(\exp(iz))$、$a=-\pi/2$、$b=\pi/2$とすると、$\operatorname{Re}e^{iz}=e^{-y}\cos x$で辺の上では$|f|=1$だが、$x=0$、$y\to-\infty$で$|f|\to\infty$である。この例は$d=\pi/(b-a)=1$で臨界である。
  target: |
    ∀ (f : ℂ → ℂ) (a b d A B C : ℝ) (z : ℂ), DiffContOnCl ℂ f (Complex.re ⁻¹' Set.Ioo a b) → d < Real.pi / (b - a) → (∀ w ∈ Complex.re ⁻¹' Set.Ioo a b, ‖f w‖ ≤ A * Real.exp (B * Real.exp (d * |w.im|))) → (∀ w : ℂ, w.re = a → ‖f w‖ ≤ C) → (∀ w : ℂ, w.re = b → ‖f w‖ ≤ C) → a ≤ z.re → z.re ≤ b → ‖f z‖ ≤ C
  proof: |
    by
      intro f a b d A B C z hf hd hg ha hb hza hzb
      refine PhragmenLindelof.vertical_strip hf ⟨d, hd, B, ?_⟩ ha hb hza hzb
      refine Asymptotics.IsBigO.of_bound A ?_
      refine Filter.eventually_inf_principal.mpr (Filter.Eventually.of_forall (fun w hw => ?_))
      rw [Real.norm_of_nonneg (Real.exp_pos _).le]
      exact hg w hw
- id: phragmen_lindelof_first_quadrant
  kind: textbook
  level: 4
  topic: フラグメン・リンデレーフの原理・第一象限
  statement: $f$は開第一象限で正則で閉包で連続、$d<2$で、開第一象限上$|f(w)|\leq A\exp(B|w|^d)$とする。正の実軸と正の虚軸(原点を含む)で$|f|\leq C$なら、閉第一象限で$|f|\leq C$である。
  statement_en: If f is holomorphic on the open first quadrant, continuous on the closure, d < 2, |f(w)| ≤ A exp(B|w|^d) on the open quadrant and |f| ≤ C on both boundary rays including the origin, then |f| ≤ C on the closed first quadrant.
  assumptions:
  - $f$は開第一象限で正則で閉包で連続
  - $d<2$
  - 開第一象限で$|f(w)|\leq A\exp(B|w|^d)$
  - $x\geq 0$で$|f(x)|\leq C$、$|f(ix)|\leq C$
  - $\operatorname{Re}z\geq 0$、$\operatorname{Im}z\geq 0$
  quantifiers:
  - 任意の$f,d,A,B,C,z$
  conclusion: $|f(z)|\leq C$である。
  answer: |-
    $f$を開第一象限で正則で閉包で連続な関数、$d<2$とし、開第一象限で$|f(w)|\leq A\exp(B|w|^d)$、$x\geq 0$で$|f(x)|\leq C$、$|f(ix)|\leq C$、$\operatorname{Re}z\geq 0$、$\operatorname{Im}z\geq 0$とする。$z$が境界の上にあれば仮定そのものである。$z$を開第一象限の点とする。$C\geq 0$である。$\max(d,0)<\beta<2$なる$\beta$を取る。$w=re^{i\theta}$、$0\leq\theta\leq\pi/2$について$w^\beta=r^\beta e^{i\beta\theta}$と定める。これは開第一象限で正則で閉包で連続である。

    $\delta=\cos(\beta\pi/4)>0$とする。$\varepsilon>0$に対し$g_\varepsilon(w)=f(w)\exp(-\varepsilon e^{-i\beta\pi/4}w^\beta)$とおく。$|\beta(\theta-\pi/4)|\leq\beta\pi/4<\pi/2$なので、$\operatorname{Re}(e^{-i\beta\pi/4}w^\beta)=r^\beta\cos(\beta(\theta-\pi/4))\geq\delta r^\beta$である。よって境界の二つの半直線で$|g_\varepsilon|\leq C$であり、開第一象限の$r\geq 1$の点で$|g_\varepsilon(w)|\leq A\exp(|B|\max(1,r^{\max(d,0)})-\varepsilon\delta r^\beta)$である。右辺は$r\to\infty$で$0$に収束する。

    $C'>C$を取る。$r_0>|z|$を十分大きく取ると、$|w|=r_0$で$|g_\varepsilon|\leq C'$である。四分円に最大値原理を適用して$|g_\varepsilon(z)|\leq C'$を得る。$C'\downarrow C$、続いて$\varepsilon\downarrow 0$として$|f(z)|\leq C$である。
  strategy: Multiply by exp(-ε e^(-iβπ/4) w^β) with d < β < 2 and apply the maximum principle on quarter discs.
  sketch:
  - 'setup: Choose β with max(d,0) < β < 2.'
  - 'construct: g_ε = f exp(-ε e^(-iβπ/4) w^β), whose exponent has real part at least δ r^β.'
  - 'derive: g_ε is at most C on the rays and tends to 0 at infinity.'
  - 'apply_theorem: The maximum principle on a large quarter disc.'
  - 'conclude: Let ε tend to 0.'
  openmath: (forall (f d p q k z) (-> (and (holomorphic_on f open_first_quadrant) (continuous_on_set f (set_closure open_first_quadrant)) (< d 2) (forall (w) (-> (in w open_first_quadrant) (<= (abs (fn_value f w)) (* p (exp (* q (^ (abs w) d))))))) (forall (x) (-> (and (in x R) (<= 0 x)) (and (<= (abs (fn_value f x)) k) (<= (abs (fn_value f (* x complex_imaginary_unit))) k)))) (<= 0 (real_part z)) (<= 0 (imag_part z))) (<= (abs (fn_value f z)) k)))
  hard_negative:
    statement: 指数$d=2$でも同じ結論が成り立つ。
    reason: $f(z)=\exp(-iz^2)$は$z=x$と$z=ix$で$|f|=1$だが、$z=re^{i\pi/4}$では$-iz^2=r^2$で$|f|=e^{r^2}$である。
  target: |
    ∀ (f : ℂ → ℂ) (d A B C : ℝ) (z : ℂ), DiffContOnCl ℂ f (Set.Ioi 0 ×ℂ Set.Ioi 0) → d < 2 → (∀ w ∈ (Set.Ioi 0 ×ℂ Set.Ioi 0 : Set ℂ), ‖f w‖ ≤ A * Real.exp (B * ‖w‖ ^ d)) → (∀ x : ℝ, 0 ≤ x → ‖f x‖ ≤ C) → (∀ x : ℝ, 0 ≤ x → ‖f (x * Complex.I)‖ ≤ C) → 0 ≤ z.re → 0 ≤ z.im → ‖f z‖ ≤ C
  proof: |
    by
      intro f d A B C z hf hd hg hre him hz1 hz2
      refine PhragmenLindelof.quadrant_I hf ⟨d, hd, B, ?_⟩ hre him hz1 hz2
      refine Asymptotics.IsBigO.of_bound A ?_
      refine Filter.eventually_inf_principal.mpr (Filter.Eventually.of_forall (fun w hw => ?_))
      rw [Real.norm_of_nonneg (Real.exp_pos _).le]
      exact hg w hw
- id: hadamard_three_lines
  kind: named
  level: 4
  topic: アダマールの三線定理
  statement: アダマールの三線定理。$l<u$とし、$f$は開帯$l<\operatorname{Re}z<u$で正則で閉包で連続、閉帯で有界とする。$\operatorname{Re}w=l$で$|f|\leq a$、$\operatorname{Re}w=u$で$|f|\leq b$なら、閉帯の点$z$について$t=(\operatorname{Re}z-l)/(u-l)$とおくと$|f(z)|\leq a^{1-t}b^t$である(ただし$0^0=1$とする)。
  statement_en: Hadamard's three lines theorem. If l < u, f is holomorphic on l < Re z < u, continuous on the closure and bounded on the closed strip, with |f| ≤ a on Re w = l and |f| ≤ b on Re w = u, then |f(z)| ≤ a^(1-t) b^t with t = (Re z - l)/(u - l).
  assumptions:
  - $l<u$
  - $f$は開帯で正則で閉包で連続、閉帯で有界
  - $\operatorname{Re}w=l$で$|f|\leq a$、$\operatorname{Re}w=u$で$|f|\leq b$
  - $l\leq\operatorname{Re}z\leq u$
  quantifiers:
  - 任意の$f,l,u,a,b,z$
  conclusion: $|f(z)|\leq a^{1-t}b^t$である。
  answer: |-
    $l<u$、$f$を開帯$l<\operatorname{Re}z<u$で正則で閉包で連続かつ閉帯で有界な関数とし、$\operatorname{Re}w=l$で$|f|\leq a$、$\operatorname{Re}w=u$で$|f|\leq b$、$l\leq\operatorname{Re}z\leq u$、$t=(\operatorname{Re}z-l)/(u-l)$とする。$a,b\geq 0$である。$t=0$または$t=1$なら$z$は辺の上にあり、仮定そのものである。$0<t<1$とする。

    まず$a,b>0$とする。$s(w)=(w-l)/(u-l)$とし、$h(w)=a^{s(w)-1}b^{-s(w)}f(w)$とおく。ここで$a^\zeta=e^{\zeta\log a}$である。$a^{s-1}b^{-s}$は整関数で、その絶対値は$a^{\operatorname{Re}s-1}b^{-\operatorname{Re}s}$である。$\operatorname{Re}s\in[0,1]$で有界なので、$h$は閉帯で有界である。辺の上では$|h|\leq 1$である。

    フラグメン・リンデレーフの原理を帯に適用する。$h$は有界なので増大の条件を$d=0$で満たす。よって閉帯で$|h|\leq 1$である。$w=z$で$|f(z)|\leq a^{1-t}b^t$である。

    $a$または$b$が$0$のときは、$\eta>0$に対し$a+\eta,b+\eta$で評価を得て、$\eta\downarrow 0$とする。$0<t<1$なので$a^{1-t}b^t$は連続に変化する。
  strategy: Divide by the exponential interpolant to normalize the edges to 1 and apply the Phragmén-Lindelöf principle.
  sketch:
  - 'case_split: Points on the edges are immediate.'
  - 'construct: h = a^(s-1) b^(-s) f with s = (w-l)/(u-l).'
  - 'apply_theorem: The Phragmén-Lindelöf principle gives |h| ≤ 1.'
  - 'derive: Handle a or b equal to 0 by a limit.'
  openmath: (forall (f s t a b z) (-> (and (< s t) (holomorphic_on f (open_vertical_strip s t)) (continuous_on_set f (set_closure (open_vertical_strip s t))) (exists (k) (forall (w) (-> (and (<= s (real_part w)) (<= (real_part w) t)) (<= (abs (fn_value f w)) k)))) (forall (w) (-> (= (real_part w) s) (<= (abs (fn_value f w)) a))) (forall (w) (-> (= (real_part w) t) (<= (abs (fn_value f w)) b))) (<= s (real_part z)) (<= (real_part z) t)) (<= (abs (fn_value f z)) (* (^ a (- 1 (/ (- (real_part z) s) (- t s)))) (^ b (/ (- (real_part z) s) (- t s)))))))
  hard_negative:
    statement: 有界性の仮定なしで同じ結論が成り立つ。
    reason: $f(z)=\exp(\exp(iz))$、$l=-\pi/2$、$u=\pi/2$、$a=b=1$では辺の上で$|f|=1$だが、帯の中で$|f|$は$1$を超える。
  target: |
    ∀ (f : ℂ → ℂ) (l u a b : ℝ) (z : ℂ), l < u → DiffContOnCl ℂ f (Complex.re ⁻¹' Set.Ioo l u) → BddAbove ((norm ∘ f) '' (Complex.re ⁻¹' Set.Icc l u)) → (∀ w : ℂ, w.re = l → ‖f w‖ ≤ a) → (∀ w : ℂ, w.re = u → ‖f w‖ ≤ b) → l ≤ z.re → z.re ≤ u → ‖f z‖ ≤ a ^ (1 - (z.re - l) / (u - l)) * b ^ ((z.re - l) / (u - l))
  proof: |
    by
      intro f l u a b z hlu hf hB ha hb hz1 hz2
      exact Complex.HadamardThreeLines.norm_le_interp_of_mem_verticalClosedStrip' hlu ⟨hz1, hz2⟩ hf hB (fun w hw => ha w hw) (fun w hw => hb w hw)
- id: borel_caratheodory
  kind: named
  level: 4
  topic: ボレル・カラテオドリの定理
  statement: |-
    ボレル・カラテオドリの定理。$M>0$、$R>0$とし、$f$は$|w|<R$で正則で$\operatorname{Re}f\leq M$とする。$|z|<R$なら
    $|f(z)|\leq\frac{2M|z|}{R-|z|}+|f(0)|\frac{R+|z|}{R-|z|}$
    である。
  statement_en: The Borel-Carathéodory theorem. If M, R > 0 and f is holomorphic on |w| < R with Re f ≤ M, then |f(z)| ≤ 2M|z|/(R-|z|) + |f(0)|(R+|z|)/(R-|z|) for |z| < R.
  assumptions:
  - $M>0$、$R>0$
  - $f$は$|w|<R$で正則で$\operatorname{Re}f\leq M$
  - $|z|<R$
  quantifiers:
  - 任意の$f,M,R,z$
  conclusion: 上の評価が成り立つ。
  answer: |-
    $M>0$、$R>0$、$f$を$|w|<R$で正則で$\operatorname{Re}f\leq M$を満たす関数、$z$を$|z|<R$なる点とする。$A=M+|f(0)|>0$、$g=f-f(0)$とおく。$g(0)=0$、$\operatorname{Re}g\leq A$である。$\operatorname{Re}(2A-g)\geq A>0$なので$2A-g\neq 0$であり、$\omega=g/(2A-g)$は$|w|<R$で正則である。$\operatorname{Re}g\leq A$は$|g|\leq|2A-g|$と同値なので$|\omega|\leq 1$である。$\omega(0)=0$なので、シュワルツの補題より$|\omega(z)|\leq|z|/R$である。

    $g=2A\omega/(1+\omega)$なので
    $|g(z)|\leq\frac{2A|\omega(z)|}{1-|\omega(z)|}\leq\frac{2A|z|}{R-|z|}$
    である。よって
    $|f(z)|\leq|g(z)|+|f(0)|\leq\frac{2M|z|}{R-|z|}+|f(0)|\frac{2|z|+R-|z|}{R-|z|}$
    であり、これが結論である。
  strategy: Map the half-plane Re g ≤ A into the unit disc and apply the Schwarz lemma.
  sketch:
  - 'setup: Put g = f - f(0) and A = M + |f(0)|.'
  - 'construct: ω = g/(2A-g) maps the disc into the closed unit disc with ω(0) = 0.'
  - 'apply_theorem: The Schwarz lemma gives |ω(z)| ≤ |z|/R.'
  - 'derive: Invert to bound |g(z)| and add |f(0)|.'
  openmath: (forall (f p r z) (-> (and (> p 0) (> r 0) (holomorphic_on f (open_disc 0 r)) (forall (w) (-> (in w (open_disc 0 r)) (<= (real_part (fn_value f w)) p))) (< (abs z) r)) (<= (abs (fn_value f z)) (+ (/ (* 2 (* p (abs z))) (- r (abs z))) (/ (* (abs (fn_value f 0)) (+ r (abs z))) (- r (abs z)))))))
  hard_negative:
    statement: $|f|$の評価に$\operatorname{Re}f$の上界は不要である。
    reason: $f_n(z)=nz$は$|z|<1$で正則で$f_n(0)=0$だが、$|f_n(1/2)|=n/2$は有界でない。上界$M$により評価が定まる。
  target: |
    ∀ (f : ℂ → ℂ) (M R : ℝ) (z : ℂ), 0 < M → 0 < R → DifferentiableOn ℂ f (Metric.ball 0 R) → (∀ w ∈ Metric.ball (0 : ℂ) R, (f w).re ≤ M) → ‖z‖ < R → ‖f z‖ ≤ 2 * M * ‖z‖ / (R - ‖z‖) + ‖f 0‖ * (R + ‖z‖) / (R - ‖z‖)
  proof: |
    by
      intro f M R z hM hR hf hb hz
      exact Complex.borelCaratheodory hM hf hb hR (by simpa using hz)
- id: circle_average_log_distance
  kind: gap
  level: 4
  topic: イェンセンの公式の準備・距離の対数の平均
  statement: $R>0$とし、$a$は閉円板$|z-c|\leq R$の点とする。円周$|z-c|=R$上の$\log|z-a|$の平均は$\log R$である。$\int_0^\pi\log\sin s\,ds=-\pi\log 2$を既知とする。
  statement_en: If R > 0 and a lies in the closed disc |z-c| ≤ R, then the mean of log|z-a| over the circle |z-c| = R equals log R, using the known value of the integral of log sin s over [0, π].
  assumptions:
  - $R>0$
  - $|a-c|\leq R$
  - $\int_0^\pi\log\sin s\,ds=-\pi\log 2$を既知とする
  quantifiers:
  - 任意の$a,c,R$
  conclusion: $\frac{1}{2\pi}\int_0^{2\pi}\log|c+Re^{it}-a|\,dt=\log R$である。
  answer: |-
    $R>0$、$a$を閉円板$|z-c|\leq R$の点とし、$b=(a-c)/R$とおく。$|b|\leq 1$であり、$\log|c+Re^{it}-a|=\log R+\log|e^{it}-b|$である。$I(b)=\frac{1}{2\pi}\int_0^{2\pi}\log|e^{it}-b|\,dt=0$を示す。$|e^{it}-b|=|1-\bar be^{it}|$である。

    $|b|<1$なら、$1-\bar b\zeta$は閉単位円板の近傍で零点を持たない正則関数なので、$\log|1-\bar b\zeta|$はそこで調和である。平均値の性質により$I(b)=\log|1|=0$である。

    $|b|=1$なら、$t$をずらして$b=1$としてよい。$|1-e^{it}|=2\sin(t/2)$なので、$s=t/2$と置換して
    $I(1)=\log 2+\frac{1}{\pi}\int_0^\pi\log\sin s\,ds=\log 2-\log 2=0$
    である。
  strategy: Normalize to the unit circle; use harmonicity inside and the classical log-sine integral on the boundary.
  sketch:
  - 'translate: Reduce to the mean of log|1 - conj(b) e^(it)| with |b| ≤ 1.'
  - 'case_split: |b| < 1 or |b| = 1.'
  - 'apply_theorem: For |b| < 1 use the mean value property of a harmonic function.'
  - 'derive: For |b| = 1 use the integral of log sin.'
  openmath: (forall (a c r) (-> (and (> r 0) (in a (closed_disc c r))) (= (circle_mean_fn (lambda (z) (ln (abs (- z a)))) c r) (ln r))))
  hard_negative:
    statement: $|a-c|>R$でも平均は$\log R$である。
    reason: $a$が閉円板の外なら$\log|z-a|$は閉円板の近傍で調和で、平均は$\log|c-a|>\log R$である。
  target: |
    ∀ (a c : ℂ) (R : ℝ), 0 < R → a ∈ Metric.closedBall c R → Real.circleAverage (fun z => Real.log ‖z - a‖) c R = Real.log R
  proof: |
    by
      intro a c R hR ha
      apply circleAverage_log_norm_sub_const_of_mem_closedBall
      rwa [abs_of_pos hR]
- id: log_norm_mean_value_nonvanishing
  kind: gap
  level: 3
  topic: イェンセンの公式・零点がない場合
  statement: $R>0$とし、$g$は閉円板$|z-c|\leq R$の各点で解析的で零点を持たないとする。円周$|z-c|=R$上の$\log|g|$の平均は$\log|g(c)|$である。
  statement_en: If R > 0 and g is analytic at each point of the closed disc |z-c| ≤ R without zeros there, then the mean of log|g| over the circle equals log|g(c)|.
  assumptions:
  - $R>0$
  - $g$は閉円板の各点で解析的で零点を持たない
  quantifiers:
  - 任意の$g,c,R$
  conclusion: 円周上の$\log|g|$の平均は$\log|g(c)|$である。
  answer: $R>0$、$g$を閉円板$|z-c|\leq R$の各点で解析的で零点を持たない関数とする。解析的で$0$でない関数の絶対値の対数は調和なので、$\log|g|$は閉円板の各点で調和である。特に開円板で調和で閉円板で連続である。調和関数の平均値の性質により、円周上の平均は中心の値$\log|g(c)|$である。
  strategy: log|g| is harmonic near the closed disc, so the mean value property applies.
  sketch:
  - 'apply_theorem: log|g| is harmonic at each point of the closed disc.'
  - 'apply_theorem: The mean value property for harmonic functions.'
  openmath: (forall (g c r) (-> (and (> r 0) (analytic_on g (closed_disc c r)) (forall (z) (-> (in z (closed_disc c r)) (!= (fn_value g z) 0)))) (= (circle_mean_fn (lambda (z) (ln (abs (fn_value g z)))) c r) (ln (abs (fn_value g c))))))
  hard_negative:
    statement: $g$が開円板内に零点を持っても同じ等式が成り立つ。
    reason: $g(z)=z-a$、$c=0$、$R=1$、$0<|a|<1$では平均は$0$で、$\log|g(0)|=\log|a|<0$である。
  target: |
    ∀ (g : ℂ → ℂ) (c : ℂ) (R : ℝ), 0 < R → AnalyticOnNhd ℂ g (Metric.closedBall c R) → (∀ z ∈ Metric.closedBall c R, g z ≠ 0) → Real.circleAverage (fun z => Real.log ‖g z‖) c R = Real.log ‖g c‖
  proof: |
    by
      intro g c R hR hg h0
      apply AnalyticOnNhd.circleAverage_log_norm_of_ne_zero
      · rwa [abs_of_pos hR]
      · rw [abs_of_pos hR]
        intro u hu
        exact h0 u hu
- id: jensen_formula
  kind: named
  level: 4
  topic: イェンセンの公式
  statement: |-
    イェンセンの公式。$R>0$とし、$f$は閉円板$|z-c|\leq R$の各点で解析的で$f(c)\neq 0$とする。$m(u)$を閉円板の点$u$での$f$の零点の位数とすると
    $\frac{1}{2\pi}\int_0^{2\pi}\log|f(c+Re^{it})|\,dt=\sum_um(u)\log\frac{R}{|c-u|}+\log|f(c)|$
    である。和は閉円板内の有限個の零点にわたる。
  statement_en: Jensen's formula. If R > 0, f is analytic at each point of the closed disc |z-c| ≤ R and f(c) ≠ 0, then the mean of log|f| over the circle equals the sum over zeros u in the closed disc, with multiplicity m(u), of m(u) log(R/|c-u|), plus log|f(c)|.
  assumptions:
  - $R>0$
  - $f$は閉円板の各点で解析的
  - $f(c)\neq 0$
  quantifiers:
  - 任意の$f,c,R$
  conclusion: 上の等式が成り立つ。
  answer: |-
    $R>0$、$f$を閉円板$|z-c|\leq R$の各点で解析的で$f(c)\neq 0$を満たす関数、$m(u)$を閉円板の点$u$での$f$の零点の位数とする。閉円板は連結で$f(c)\neq 0$なので、$f$は恒等的に$0$でない。閉円板はコンパクトなので零点は有限個である。零点を位数の分だけ括り出すと
    $f(z)=\prod_u(z-u)^{m(u)}g(z)$
    であり、$g$は閉円板の各点で解析的で零点を持たない。

    円周上の有限個の点を除いて$\log|f|=\sum_um(u)\log|z-u|+\log|g|$である。各$u$は閉円板の点なので、$\log|z-u|$の円周上の平均は$\log R$である。$\log|g|$の平均は$\log|g(c)|$である。よって左辺は$\sum_um(u)\log R+\log|g(c)|$である。

    一方$\log|f(c)|=\sum_um(u)\log|c-u|+\log|g(c)|$である。これを代入して$\log|g(c)|$を消去すると等式を得る。
  strategy: Factor out the finitely many zeros and average log|z-u| and log|g| separately.
  sketch:
  - 'derive: f has finitely many zeros in the closed disc.'
  - 'construct: f = Π (z-u)^m(u) g with g nonvanishing.'
  - 'apply_theorem: The mean of log|z-u| is log R and the mean of log|g| is log|g(c)|.'
  - 'conclude: Eliminate log|g(c)| using the value at c.'
  openmath: (forall (f c r) (-> (and (> r 0) (analytic_on f (closed_disc c r)) (!= (fn_value f c) 0)) (= (circle_mean_fn (lambda (z) (ln (abs (fn_value f z)))) c r) (+ (divisor_log_sum (divisor_on (lambda (z) (fn_value f z)) (closed_disc c r)) c r) (ln (abs (fn_value f c)))))))
  hard_negative:
    statement: 零点の位数を数えず、相異なる零点の$\log(R/|c-u|)$の和でよい。
    reason: $f(z)=(z-1/2)^2$、$c=0$、$R=1$では平均は$0$で、$\log|f(0)|=-2\log 2$である。正しい項は$2\log 2$であり、位数なしでは$\log 2$となって等式が成り立たない。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ) (R : ℝ), 0 < R → AnalyticOnNhd ℂ f (Metric.closedBall c R) → f c ≠ 0 → Real.circleAverage (fun z => Real.log ‖f z‖) c R = ∑ᶠ u, (MeromorphicOn.divisor f (Metric.closedBall c R) u : ℝ) * Real.log (R * ‖c - u‖⁻¹) + Real.log ‖f c‖
  proof: |
    by
      intro f c R hR hf h0
      have h := AnalyticOnNhd.circleAverage_log_norm (c := c) (R := R) hR.ne' (by rwa [abs_of_pos hR]) h0
      rwa [abs_of_pos hR] at h
- id: jensen_zero_count_bound
  kind: gap
  level: 4
  topic: イェンセンの公式・零点の個数の評価
  statement: $0<r<R$、$M\geq 1$とし、$f$は閉円板$|z-c|\leq R$の各点で解析的で$f(c)\neq 0$、円周$|z-c|=R$上で$|f|\leq M$とする。閉円板$|z-c|\leq r$内の零点の個数を位数を込めて$N$とすると、$N\leq\log(M/|f(c)|)/\log(R/r)$である。
  statement_en: If 0 < r < R, M ≥ 1, f is analytic at each point of |z-c| ≤ R, f(c) ≠ 0 and |f| ≤ M on |z-c| = R, then the number N of zeros in |z-c| ≤ r, counted with multiplicity, satisfies N ≤ log(M/|f(c)|)/log(R/r).
  assumptions:
  - $0<r<R$、$M\geq 1$
  - $f$は閉円板$|z-c|\leq R$の各点で解析的で$f(c)\neq 0$
  - 円周$|z-c|=R$上で$|f|\leq M$
  quantifiers:
  - 任意の$f,c,r,R,M$
  conclusion: $N\leq\log(M/|f(c)|)/\log(R/r)$である。
  answer: |-
    $0<r<R$、$M\geq 1$、$f$を閉円板$|z-c|\leq R$の各点で解析的で$f(c)\neq 0$、円周$|z-c|=R$上で$|f|\leq M$を満たす関数、$m(u)$を点$u$での$f$の零点の位数、$N$を閉円板$|z-c|\leq r$内の零点の位数込みの個数とする。イェンセンの公式により、円周$|z-c|=R$上の$\log|f|$の平均は$\sum_um(u)\log(R/|c-u|)+\log|f(c)|$である。左辺は$\log M$以下である。

    和の各項は$|c-u|\leq R$より$0$以上である。$|c-u|\leq r$の零点では$\log(R/|c-u|)\geq\log(R/r)$である。よって和は$N\log(R/r)$以上である。

    したがって$N\log(R/r)+\log|f(c)|\leq\log M$であり、$\log(R/r)>0$で割ると結論を得る。
  strategy: Bound the terms of Jensen's formula from below by those with zeros in the smaller disc.
  sketch:
  - 'apply_theorem: Jensen''s formula on radius R.'
  - 'derive: The mean of log|f| is at most log M.'
  - 'derive: Zeros in |z-c| ≤ r contribute at least log(R/r) each and other terms are nonnegative.'
  - 'conclude: Divide by log(R/r).'
  openmath: (forall (f c r s B) (-> (and (< 0 r) (< r s) (<= 1 B) (analytic_on f (closed_disc c s)) (!= (fn_value f c) 0) (forall (z) (-> (in z (circle_set c s)) (<= (abs (fn_value f z)) B)))) (<= (divisor_total (divisor_on (lambda (z) (fn_value f z)) (closed_disc c r))) (/ (ln (/ B (abs (fn_value f c)))) (ln (/ s r))))))
  hard_negative:
    statement: $f(c)=0$でも同じ評価が成り立つ。
    reason: $f(c)=0$では右辺の$\log(M/|f(c)|)$が意味を持たず、$f(z)=z^k$、$c=0$では$r$によらず零点の個数$k$はいくらでも大きくできる。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ) (r R M : ℝ), 0 < r → r < R → 1 ≤ M → AnalyticOnNhd ℂ f (Metric.closedBall c R) → f c ≠ 0 → (∀ z ∈ Metric.sphere c R, ‖f z‖ ≤ M) → ((∑ᶠ u, MeromorphicOn.divisor f (Metric.closedBall c r) u : ℤ) : ℝ) ≤ Real.log (M / ‖f c‖) / Real.log (R / r)
  proof: |
    by
      intro f c r R M hr hrR hM hf h0 hb
      have hR : 0 < R := hr.trans hrR
      have := AnalyticOnNhd.sum_divisor_le (c := c) (r := r) (R := R) (M := M) (by rwa [abs_of_pos hr]) (by rwa [abs_of_pos hr, abs_of_pos hR]) hM (by rwa [abs_of_pos hR]) h0 (by rwa [abs_of_pos hR])
      rwa [abs_of_pos hr] at this
- id: log_norm_sub_mean_inequality
  kind: gap
  level: 4
  topic: イェンセンの公式・劣平均性
  statement: $R>0$とし、$f$は閉円板$|z-c|\leq R$の各点で解析的で$f(c)\neq 0$とする。このとき$\log|f(c)|$は円周$|z-c|=R$上の$\log|f|$の平均以下である。
  statement_en: If R > 0, f is analytic at each point of the closed disc |z-c| ≤ R and f(c) ≠ 0, then log|f(c)| is at most the mean of log|f| over the circle.
  assumptions:
  - $R>0$
  - $f$は閉円板の各点で解析的
  - $f(c)\neq 0$
  quantifiers:
  - 任意の$f,c,R$
  conclusion: $\log|f(c)|\leq\frac{1}{2\pi}\int_0^{2\pi}\log|f(c+Re^{it})|\,dt$である。
  answer: $R>0$、$f$を閉円板$|z-c|\leq R$の各点で解析的で$f(c)\neq 0$を満たす関数、$m(u)$を閉円板の点$u$での$f$の零点の位数とする。イェンセンの公式により、平均は$\sum_um(u)\log(R/|c-u|)+\log|f(c)|$である。各零点$u$は閉円板の点で$u\neq c$なので$R/|c-u|\geq 1$であり、$m(u)\geq 0$である。よって和は$0$以上であり、結論を得る。
  strategy: The sum over zeros in Jensen's formula is nonnegative.
  sketch:
  - 'apply_theorem: Jensen''s formula.'
  - 'derive: Every term m(u) log(R/|c-u|) is nonnegative.'
  openmath: (forall (f c r) (-> (and (> r 0) (analytic_on f (closed_disc c r)) (!= (fn_value f c) 0)) (<= (ln (abs (fn_value f c))) (circle_mean_fn (lambda (z) (ln (abs (fn_value f z)))) c r))))
  hard_negative:
    statement: 常に等号が成り立つ。
    reason: $f(z)=z-1/2$、$c=0$、$R=1$では平均は$0$で、$\log|f(0)|=-\log 2<0$である。
  target: |
    ∀ (f : ℂ → ℂ) (c : ℂ) (R : ℝ), 0 < R → AnalyticOnNhd ℂ f (Metric.closedBall c R) → f c ≠ 0 → Real.log ‖f c‖ ≤ Real.circleAverage (fun z => Real.log ‖f z‖) c R
  proof: |
    by
      intro f c R hR hf h0
      have h := AnalyticOnNhd.circleAverage_log_norm (c := c) (R := R) hR.ne' (by rwa [abs_of_pos hR]) h0
      rw [abs_of_pos hR] at h
      rw [h]
      have hnn : 0 ≤ ∑ᶠ u, (MeromorphicOn.divisor f (Metric.closedBall c R) u : ℝ) * Real.log (R * ‖c - u‖⁻¹) := by
        apply finsum_nonneg
        intro u
        by_cases hu : u ∈ Metric.closedBall c R
        · have hd : 0 ≤ MeromorphicOn.divisor f (Metric.closedBall c R) u := MeromorphicOn.AnalyticOnNhd.divisor_nonneg hf u
          apply mul_nonneg (by exact_mod_cast hd)
          by_cases hcu : c = u
          · simp [hcu]
          · have hpos : 0 < ‖c - u‖ := norm_pos_iff.mpr (sub_ne_zero.mpr hcu)
            apply Real.log_nonneg
            have hle : ‖c - u‖ ≤ R := by
              have := mem_closedBall_iff_norm.mp hu
              rwa [norm_sub_rev] at this
            rw [← div_eq_mul_inv]
            exact (one_le_div hpos).mpr hle
        · have : MeromorphicOn.divisor f (Metric.closedBall c R) u = 0 := Function.locallyFinsuppWithin.apply_eq_zero_of_notMem _ hu
          simp [this]
      linarith
- id: product_one_add_converges_of_summable
  kind: textbook
  level: 3
  topic: 無限積・絶対収束
  statement: $\sum_n|a_n|<\infty$なら、無限積$\prod_n(1+a_n)$は無条件に収束する。その値を$P$とすると、全ての$n$で$1+a_n\neq 0$なら$P\neq 0$である。
  statement_en: If the series of |a_n| converges, then the product of 1 + a_n converges unconditionally to some P, and P ≠ 0 if every factor is nonzero.
  assumptions:
  - $\sum_n|a_n|<\infty$
  quantifiers:
  - 任意の複素数列$(a_n)$
  conclusion: 無限積は値$P$に収束し、全ての因子が$0$でなければ$P\neq 0$である。
  answer: |-
    $(a_n)$を$\sum_n|a_n|<\infty$なる複素数列とし、$S=\sum_n|a_n|$とする。有限集合$F$について$P_F=\prod_{n\in F}(1+a_n)$とおく。$|P_F-1|\leq\prod_{n\in F}(1+|a_n|)-1\leq e^{\sum_F|a_n|}-1$であり、特に$|P_F|\leq e^S$である。

    $\varepsilon>0$に対し有限集合$F_0$を、その外の$|a_n|$の和が十分小さくなるように取る。$F\supset F_0$なら
    $|P_F-P_{F_0}|=|P_{F_0}|\left|\prod_{n\in F\setminus F_0}(1+a_n)-1\right|\leq e^S\left(e^{\sum_{F\setminus F_0}|a_n|}-1\right)<\varepsilon$
    である。よって$(P_F)$は有限集合の包含に関するコーシーの条件を満たし、値$P$に収束する。

    全ての因子が$0$でないとする。$F_0$を、外の和が$1/2$以下となるように取る。$F\supset F_0$なら$\left|\prod_{F\setminus F_0}(1+a_n)\right|\geq 1-(e^{1/2}-1)=2-e^{1/2}>0$である。よって$|P_F|\geq|P_{F_0}|(2-e^{1/2})$であり、極限を取って$|P|\geq|P_{F_0}|(2-e^{1/2})>0$である。
  strategy: Use |P_F - 1| ≤ exp(Σ|a_n|) - 1 for a Cauchy criterion and a lower bound away from zero.
  sketch:
  - 'derive: Finite products satisfy |P_F - 1| ≤ exp(Σ_F |a_n|) - 1.'
  - 'derive: The net of finite products is Cauchy.'
  - 'derive: With a small tail, the tail products stay away from 0.'
  - 'conclude: The limit is nonzero when every factor is.'
  openmath: (forall (a) (-> (series_summable_fn (lambda (n) (abs (seq_value a n)))) (exists (p) (and (has_prod_fn (lambda (n) (+ 1 (seq_value a n))) p) (-> (forall (n) (!= (+ 1 (seq_value a n)) 0)) (!= p 0))))))
  hard_negative:
    statement: 因子に$0$があっても$P\neq 0$である。
    reason: $a_0=-1$、$n\geq 1$で$a_n=0$なら$\sum_n|a_n|=1$だが$P=0$である。
  target: |
    ∀ (a : ℕ → ℂ), Summable (fun n => ‖a n‖) → ∃ P : ℂ, HasProd (fun n => 1 + a n) P ∧ ((∀ n, 1 + a n ≠ 0) → P ≠ 0)
  proof: |
    by
      intro a ha
      have hm := multipliable_one_add_of_summable ha
      exact ⟨_, hm.hasProd, fun h => tprod_one_add_ne_zero_of_summable h ha⟩
- id: real_product_converges_iff_sum_converges
  kind: gap
  level: 2
  topic: 無限積・非負の実数列
  statement: 全ての$n$で$a_n\geq 0$なる実数列について、無限積$\prod_n(1+a_n)$が無条件に収束することと$\sum_na_n$が無条件に収束することは同値である。
  statement_en: For a real sequence with a_n ≥ 0, the product of 1 + a_n converges unconditionally if and only if the series of a_n converges unconditionally.
  assumptions:
  - 全ての$n$で$a_n\geq 0$
  quantifiers:
  - 任意の実数列$(a_n)$
  conclusion: 無限積の収束と級数の収束は同値である。
  answer: |-
    $(a_n)$を全ての$n$で$a_n\geq 0$なる実数列とする。全ての項が非負なので、無条件収束は部分和と部分積の有界性で判定できる。$n$についての帰納法により
    $1+\sum_{k<n}a_k\leq\prod_{k<n}(1+a_k)\leq\exp\left(\sum_{k<n}a_k\right)$
    である。左の不等式は積を展開すると非負の項が残ること、右の不等式は$1+x\leq e^x$から従う。

    無限積が収束すれば、部分積は単調増加で極限で上から抑えられる。左の不等式より部分和は有界であり、$\sum_na_n$は収束する。

    級数が収束すれば、右の不等式より部分積は有界で単調増加である。因子は$1$以上なので、任意の有限集合上の積もこの上限以下であり、無限積は上限に無条件に収束する。
  strategy: Compare partial products and partial sums by 1 + Σ a_k ≤ Π(1 + a_k) ≤ exp(Σ a_k).
  sketch:
  - 'derive: 1 + Σ a_k ≤ Π (1 + a_k) ≤ exp(Σ a_k) by induction.'
  - 'derive: Convergence of the product bounds the partial sums.'
  - 'derive: Convergence of the series bounds the increasing partial products.'
  openmath: (forall (a) (-> (forall (n) (<= 0 (seq_value a n))) (<-> (multipliable_fn (lambda (n) (+ 1 (seq_value a n)))) (series_summable_fn (lambda (n) (seq_value a n))))))
  hard_negative:
    statement: 符号の条件なしで$\prod_n(1+a_n)$の収束は$\sum_na_n$の収束と同値である。
    reason: $a_0=-1$、$n\geq 1$で$a_n=1$とすると、$0$番目の因子が$0$なので無限積は$0$に無条件に収束するが、$\sum_na_n$は発散する。
  target: |
    ∀ (a : ℕ → ℝ), (∀ n, 0 ≤ a n) → (Multipliable (fun n => 1 + a n) ↔ Summable a)
  proof: |
    by
      intro a h0
      constructor
      · intro hm
        have hs := hm.hasProd.tendsto_prod_nat
        have hmono : Monotone (fun n => ∏ i ∈ Finset.range n, (1 + a i)) := by
          refine monotone_nat_of_le_succ (fun n => ?_)
          rw [Finset.prod_range_succ]
          have : 0 ≤ ∏ i ∈ Finset.range n, (1 + a i) := Finset.prod_nonneg (fun i _ => by linarith [h0 i])
          nlinarith [h0 n]
        have hle : ∀ n, ∑ i ∈ Finset.range n, a i ≤ ∏' n, (1 + a n) := by
          intro n
          have h1 : ∑ i ∈ Finset.range n, a i ≤ ∏ i ∈ Finset.range n, (1 + a i) := by
            induction n with
            | zero => simp
            | succ k ih =>
              rw [Finset.sum_range_succ, Finset.prod_range_succ]
              have hp : 1 ≤ ∏ i ∈ Finset.range k, (1 + a i) := by
                have := Finset.prod_le_prod (s := Finset.range k) (f := fun _ => (1 : ℝ)) (g := fun i => 1 + a i) (fun _ _ => zero_le_one) (fun i _ => by linarith [h0 i])
                simpa using this
              nlinarith [h0 k]
          exact h1.trans (hmono.ge_of_tendsto hs n)
        exact summable_of_sum_range_le h0 hle
      · intro hs
        exact Real.multipliable_one_add_of_summable hs
- id: finite_product_minus_one_exp_bound
  kind: gap
  level: 2
  topic: 無限積・有限積の評価
  statement: 有限集合$t$で添字付けられた複素数$a_i$について、$\left|\prod_{i\in t}(1+a_i)-1\right|\leq\exp\left(\sum_{i\in t}|a_i|\right)-1$である。
  statement_en: For complex numbers a_i indexed by a finite set t, |Π_(i in t)(1 + a_i) - 1| ≤ exp(Σ_(i in t)|a_i|) - 1.
  assumptions:
  - $t$は有限集合
  quantifiers:
  - 任意の有限集合$t$と複素数$a_i$
  conclusion: 上の不等式が成り立つ。
  answer: |-
    $t$を有限集合、$a_i$($i\in t$)を複素数とする。積を展開すると$\prod_{i\in t}(1+a_i)-1$は、$t$の空でない部分集合$s$にわたる$\prod_{i\in s}a_i$の和である。三角不等式より
    $\left|\prod_{i\in t}(1+a_i)-1\right|\leq\sum_{s\neq\emptyset}\prod_{i\in s}|a_i|=\prod_{i\in t}(1+|a_i|)-1$
    である。$1+x\leq e^x$より$\prod_{i\in t}(1+|a_i|)\leq\exp\left(\sum_{i\in t}|a_i|\right)$である。
  strategy: Expand the product, use the triangle inequality, then 1 + x ≤ e^x.
  sketch:
  - 'derive: Expand the product over subsets of t.'
  - 'derive: The triangle inequality gives Π(1 + |a_i|) - 1.'
  - 'apply_theorem: 1 + x ≤ e^x finishes.'
  openmath: (forall (t a) (<= (abs (- (prod_over t (lambda (i) (+ 1 (seq_value a i)))) 1)) (- (exp (finset_sum t (lambda (i) (abs (seq_value a i))))) 1)))
  hard_negative:
    statement: $\left|\prod_{i\in t}(1+a_i)-1\right|\leq\sum_{i\in t}|a_i|$である。
    reason: $t$が二元集合で$a_1=a_2=1$なら左辺は$3$で、右辺は$2$である。
  target: |
    ∀ (ι : Type) (t : Finset ι) (a : ι → ℂ), ‖∏ i ∈ t, (1 + a i) - 1‖ ≤ Real.exp (∑ i ∈ t, ‖a i‖) - 1
  proof: |
    by
      intro ι t a
      exact Finset.norm_prod_one_add_sub_one_le t a
- id: infinite_product_holomorphic
  kind: textbook
  level: 3
  topic: 無限積・正則関数の無限積
  statement: $U$を開集合、$\sum_nu_n<\infty$とし、各$F_n$は$U$で正則で$U$上$|F_n|\leq u_n$とする。このとき各$z\in U$で$\prod_n(1+F_n(z))$は無条件に収束し、その値は$z$について$U$で正則である。
  statement_en: If U is open, the series of u_n converges and each F_n is holomorphic on U with |F_n| ≤ u_n, then the product of 1 + F_n(z) converges unconditionally at each z in U and its value is holomorphic on U.
  assumptions:
  - $U$は開集合
  - $\sum_nu_n$は収束する
  - 各$F_n$は$U$で正則で$U$上$|F_n|\leq u_n$
  quantifiers:
  - 任意の$F_n,u_n,U$
  conclusion: 無限積は各点で収束し、値は$U$で正則である。
  answer: |-
    $U$を開集合、$(u_n)$を$\sum_nu_n$が収束する実数列、$F_n$を$U$で正則で$U$上$|F_n|\leq u_n$を満たす関数とする。$u_n\geq|F_n(z)|\geq 0$($U$が空なら自明)なので$\sum_n|F_n(z)|\leq\sum_nu_n=S$である。絶対収束する級数に対する無限積の収束により、各$z\in U$で$\prod_n(1+F_n(z))$は無条件に収束する。

    $Q_N=\prod_{n<N}(1+F_n)$は$U$で正則である。$N<N'$なら、有限積の評価より$U$上で
    $|Q_{N'}-Q_N|=|Q_N|\left|\prod_{N\leq n<N'}(1+F_n)-1\right|\leq e^S\left(e^{\sum_{n\geq N}u_n}-1\right)$
    である。右辺は$z$によらず$N\to\infty$で$0$に収束するので、$Q_N$は無限積の値に$U$で一様収束する。ワイエルシュトラスの定理により極限は$U$で正則である。
  strategy: The partial products converge uniformly by the finite product bound, so the Weierstrass theorem applies.
  sketch:
  - 'apply_theorem: Pointwise convergence follows from Σ|F_n(z)| ≤ Σ u_n.'
  - 'derive: The finite product bound gives uniform convergence of partial products.'
  - 'apply_theorem: The Weierstrass theorem gives holomorphy of the limit.'
  openmath: (forall (F0 u U) (-> (and (open_set U) (series_summable_fn (lambda (n) (seq_value u n))) (forall (n) (holomorphic_on (seq_value F0 n) U)) (forall (n z) (-> (in z U) (<= (abs (fn_value (seq_value F0 n) z)) (seq_value u n))))) (and (forall (z) (-> (in z U) (has_prod_fn (lambda (n) (+ 1 (fn_value (seq_value F0 n) z))) (tprod_fn (lambda (n) (+ 1 (fn_value (seq_value F0 n) z))))))) (holomorphic_fn_on (lambda (z) (tprod_fn (lambda (n) (+ 1 (fn_value (seq_value F0 n) z))))) U))))
  hard_negative:
    statement: $\sum_nu_n$が発散しても、各$F_n$が有界なら無限積は正則である。
    reason: $F_n=1$、$u_n=1$では部分積は$2^N$で発散し、無限積は収束しない。
  target: |
    ∀ (F : ℕ → ℂ → ℂ) (u : ℕ → ℝ) (U : Set ℂ), IsOpen U → Summable u → (∀ n, DifferentiableOn ℂ (F n) U) → (∀ n, ∀ z ∈ U, ‖F n z‖ ≤ u n) → (∀ z ∈ U, HasProd (fun n => 1 + F n z) (∏' n, (1 + F n z))) ∧ DifferentiableOn ℂ (fun z => ∏' n, (1 + F n z)) U
  proof: |
    by
      intro F u U hU hu hd hb
      have hlu := Summable.hasProdLocallyUniformlyOn_nat_one_add hU hu (Filter.Eventually.of_forall hb) (fun n => (hd n).continuousOn)
      refine ⟨fun z hz => hlu.hasProd hz, ?_⟩
      have ht := hlu.tendstoLocallyUniformlyOn_finsetRange
      refine ht.differentiableOn (Filter.Eventually.of_forall (fun n => ?_)) hU
      exact DifferentiableOn.fun_finset_prod (fun i _ => (differentiableOn_const 1).add (hd i))
