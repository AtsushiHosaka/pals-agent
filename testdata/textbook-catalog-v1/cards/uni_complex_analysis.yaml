- id: cauchy_riemann_polar_form
  kind: gap
  level: 2
  topic: コーシー・リーマン方程式・極座標形
  statement: $f$が点$z=re^{i\theta}$($r,\theta\in\mathbb{R}$)で複素微分可能で$f'(z)=a$とする。このとき$s\mapsto f(se^{i\theta})$は$s=r$で微分係数$ae^{i\theta}$を持ち、$t\mapsto f(re^{it})$は$t=\theta$で微分係数$ir\cdot ae^{i\theta}$を持つ。すなわち角度方向の微分は半径方向の微分の$ir$倍である。
  statement_en: If f has complex derivative a at z = r e^(iθ), then s ↦ f(s e^(iθ)) has derivative a e^(iθ) at s = r and t ↦ f(r e^(it)) has derivative i r a e^(iθ) at t = θ, so the angular derivative is i r times the radial one.
  assumptions:
  - $r,\theta\in\mathbb{R}$
  - $f$は$z=re^{i\theta}$で複素微分可能で$f'(z)=a$
  quantifiers:
  - 任意の関数$f:\mathbb{C}\to\mathbb{C}$
  - 任意の$r,\theta\in\mathbb{R}$と$a\in\mathbb{C}$
  conclusion: 半径方向の微分係数は$ae^{i\theta}$、角度方向の微分係数は$ir\cdot ae^{i\theta}$である。
  answer: |-
    $r,\theta\in\mathbb{R}$とし、$f$は$z=re^{i\theta}$で複素微分可能で$f'(z)=a$とする。

    実数を動く変数の曲線$\gamma$が$t_0$で微分可能で$\gamma(t_0)=z$なら、$f(\gamma(t))-f(z)=a(\gamma(t)-z)+o(|\gamma(t)-z|)$より$f\circ\gamma$は$t_0$で微分係数$a\gamma'(t_0)$を持つ。

    $\gamma_1(s)=se^{i\theta}$とすると$\gamma_1(r)=z$、$\gamma_1'(r)=e^{i\theta}$なので、$s\mapsto f(se^{i\theta})$の$s=r$での微分係数は$ae^{i\theta}$である。

    $\gamma_2(t)=re^{it}$とすると$\gamma_2(\theta)=z$、$\gamma_2'(\theta)=ire^{i\theta}$なので、$t\mapsto f(re^{it})$の$t=\theta$での微分係数は$a\cdot ire^{i\theta}=ir\cdot ae^{i\theta}$である。
  strategy: Apply the chain rule for a complex differentiable function along the radial and angular curves.
  sketch:
  - 'derive: A complex differentiable f composed with a real curve γ has derivative f''(γ(t))γ''(t).'
  - 'apply_theorem: For γ(s) = s e^(iθ) the velocity at r is e^(iθ).'
  - 'apply_theorem: For γ(t) = r e^(it) the velocity at θ is i r e^(iθ).'
  - 'conclude: Multiplying by a gives both formulas.'
  openmath: (forall (f r t a) (-> (and (in r R) (in t R) (has_complex_deriv_at f a (* r (exp (* t complex_imaginary_unit))))) (and (has_deriv_at (lambda (s) (fn_value f (* s (exp (* t complex_imaginary_unit))))) (* a (exp (* t complex_imaginary_unit))) r) (has_deriv_at (lambda (s) (fn_value f (* r (exp (* s complex_imaginary_unit))))) (* (* complex_imaginary_unit r) (* a (exp (* t complex_imaginary_unit)))) t))))
  hard_negative:
    statement: 角度方向の微分は半径方向の微分の$r$倍である($i$の因子はない)。
    reason: $f(z)=z$、$\theta=0$、$r=1$では半径方向の微分は$1$、角度方向の微分は$i$であり、$r$倍の$1$とは異なる。
  target: |
    ∀ (f : ℂ → ℂ) (r θ : ℝ) (a : ℂ), HasDerivAt f a ((r : ℂ) * Complex.exp ((θ : ℂ) * Complex.I)) → HasDerivAt (fun s : ℝ => f ((s : ℂ) * Complex.exp ((θ : ℂ) * Complex.I))) (a * Complex.exp ((θ : ℂ) * Complex.I)) r ∧ HasDerivAt (fun t : ℝ => f ((r : ℂ) * Complex.exp ((t : ℂ) * Complex.I))) (Complex.I * (r : ℂ) * (a * Complex.exp ((θ : ℂ) * Complex.I))) θ
  proof: |
    by
      intro f r θ a hf
      constructor
      · have h1 : HasDerivAt (fun s : ℝ => (s : ℂ) * Complex.exp ((θ : ℂ) * Complex.I)) (Complex.exp ((θ : ℂ) * Complex.I)) r := by
          simpa using (Complex.ofRealCLM.hasDerivAt (x := r)).mul_const (Complex.exp ((θ : ℂ) * Complex.I))
        have h := HasDerivAt.scomp r hf h1
        simpa [Function.comp_def, mul_comm] using h
      · have h0 : HasDerivAt (fun t : ℝ => (t : ℂ) * Complex.I) Complex.I θ := by
          simpa using (Complex.ofRealCLM.hasDerivAt (x := θ)).mul_const Complex.I
        have h1 : HasDerivAt (fun t : ℝ => (r : ℂ) * Complex.exp ((t : ℂ) * Complex.I)) ((r : ℂ) * (Complex.exp ((θ : ℂ) * Complex.I) * Complex.I)) θ := by
          exact (HasDerivAt.cexp h0).const_mul (r : ℂ)
        have h := HasDerivAt.scomp θ hf h1
        have e : Complex.I * (r : ℂ) * (a * Complex.exp ((θ : ℂ) * Complex.I)) = ((r : ℂ) * (Complex.exp ((θ : ℂ) * Complex.I) * Complex.I)) • a := by
          rw [smul_eq_mul]; ring
        rw [e]
        exact h
- id: conformal_angle_preserved
  kind: gap
  level: 2
  topic: 正則関数・等角性
  statement: $f$が$z$で複素微分可能で$f'(z)\neq 0$ならば、$f$の$z$での実全微分$Df(z)$は任意の平面ベクトル$u,v$の間の角を保つ。すなわち$u,v$のなす無向角と$Df(z)u,Df(z)v$のなす無向角は等しい(零ベクトルとのなす角は$\pi/2$と約束する)。
  statement_en: If f has complex derivative a ≠ 0 at z, then its real differential at z preserves the unoriented angle between any two plane vectors, the angle with the zero vector being π/2 by convention.
  assumptions:
  - $f$は$z$で複素微分可能で$f'(z)=a\neq 0$
  quantifiers:
  - 任意の$u,v\in\mathbb{C}$
  conclusion: $Df(z)u$と$Df(z)v$のなす角は$u$と$v$のなす角に等しい。
  answer: |-
    $f$は$z$で複素微分可能で$f'(z)=a\neq 0$とし、$u,v\in\mathbb{C}$とする。複素微分可能なら実全微分可能で、$Df(z)w=aw$が全ての$w\in\mathbb{C}$で成り立つ。

    平面の内積は$\langle w_1,w_2\rangle=\operatorname{Re}(\overline{w_1}w_2)$である。よって$\langle au,av\rangle=\operatorname{Re}(\bar a a\bar u v)=|a|^2\langle u,v\rangle$であり、$|au|=|a||u|$、$|av|=|a||v|$である。

    無向角は$\arccos\bigl(\langle u,v\rangle/(|u||v|)\bigr)$で与えられる。$|a|^2\neq 0$なので
    $\frac{\langle au,av\rangle}{|au||av|}=\frac{|a|^2\langle u,v\rangle}{|a|^2|u||v|}=\frac{\langle u,v\rangle}{|u||v|}$
    である。$u=0$または$v=0$のときは分母が$0$になるので、零ベクトルとのなす角は$\pi/2$と約束する。このとき$au=0$または$av=0$でもあるので、両辺の角はともに$\pi/2$である。したがって角は等しい。
  strategy: The real differential is multiplication by a, which scales the inner product by |a|^2 and each norm by |a|.
  sketch:
  - 'translate: The real differential at z is w ↦ a w.'
  - 'derive: ⟨au, av⟩ = |a|^2 ⟨u, v⟩ and |au| = |a||u|.'
  - 'conclude: The cosine of the angle is unchanged, so the angle is unchanged.'
  openmath: (forall (f z a u v) (-> (and (has_complex_deriv_at f a z) (!= a 0)) (= (vector_angle (real_differential f z u) (real_differential f z v)) (vector_angle u v))))
  hard_negative:
    statement: $f$が$z$で複素微分可能なら、$f'(z)=0$でも$Df(z)$は角を保つ。
    reason: $f(z)=z^2$、$z=0$では$Df(0)=0$である。$u=v=1$のなす角は$0$だが、像はともに零ベクトルで、その角は定まらない($\pi/2$と約束しても$0$と異なる)。
  target: |
    ∀ (f : ℂ → ℂ) (z a u v : ℂ), HasDerivAt f a z → a ≠ 0 → InnerProductGeometry.angle (fderiv ℝ f z u) (fderiv ℝ f z v) = InnerProductGeometry.angle u v
  proof: |
    by
      intro f z a u v hf ha
      have h := hf.complexToReal_fderiv.fderiv
      have hu : fderiv ℝ f z u = a * u := by rw [h]; simp
      have hv : fderiv ℝ f z v = a * v := by rw [h]; simp
      have hi : inner ℝ (a * u) (a * v) = ‖a‖ ^ 2 * inner ℝ u v := by
        simp only [Complex.inner, map_mul, Complex.sq_norm]
        have : a * v * ((starRingEnd ℂ) a * (starRingEnd ℂ) u) = ((Complex.normSq a : ℝ) : ℂ) * (v * (starRingEnd ℂ) u) := by
          rw [Complex.normSq_eq_conj_mul_self]; ring
        rw [this, Complex.re_ofReal_mul]
      have ha' : ‖a‖ ≠ 0 := norm_ne_zero_iff.mpr ha
      unfold InnerProductGeometry.angle
      rw [hu, hv, hi, norm_mul, norm_mul]
      congr 1
      have : ‖a‖ ^ 2 * inner ℝ u v / (‖a‖ * ‖u‖ * (‖a‖ * ‖v‖)) = (‖a‖ ^ 2 * inner ℝ u v) / (‖a‖ ^ 2 * (‖u‖ * ‖v‖)) := by
        congr 1; ring
      rw [this, mul_div_mul_left _ _ (pow_ne_zero 2 ha')]
- id: reflection_conj_conj_holomorphic
  kind: gap
  level: 2
  topic: 正則関数・共役による鏡映
  statement: $f$が$z$で複素微分可能で$f'(z)=a$ならば、$g(w)=\overline{f(\bar w)}$は$\bar z$で複素微分可能で$g'(\bar z)=\bar a$である。
  statement_en: If f has complex derivative a at z, then g(w) = conj(f(conj w)) has complex derivative conj(a) at conj z.
  assumptions:
  - $f$は$z$で複素微分可能で$f'(z)=a$
  quantifiers:
  - 任意の関数$f:\mathbb{C}\to\mathbb{C}$と$z,a\in\mathbb{C}$
  conclusion: $g(w)=\overline{f(\bar w)}$は$\bar z$で複素微分可能で$g'(\bar z)=\bar a$である。
  answer: |-
    $f$は$z$で複素微分可能で$f'(z)=a$とし、$g(w)=\overline{f(\bar w)}$とおく。$w\neq\bar z$に対し
    $\frac{g(w)-g(\bar z)}{w-\bar z}=\overline{\left(\frac{f(\bar w)-f(z)}{\bar w-z}\right)}$
    である。$w\to\bar z$のとき$\bar w\to z$であり、$\bar w\neq z$である。括弧内は$a$に収束する。複素共役は連続なので、左辺は$\bar a$に収束する。よって$g'(\bar z)=\bar a$である。
  strategy: Write the difference quotient of g as the conjugate of a difference quotient of f.
  sketch:
  - 'derive: The difference quotient of g at conj z is the conjugate of that of f at z.'
  - 'apply_theorem: Conjugation is continuous, so the limit exists.'
  - 'conclude: The derivative is conj a.'
  openmath: (forall (f z a) (-> (has_complex_deriv_at f a z) (has_complex_deriv_fn_at (lambda (w) (complex_conj (fn_value f (complex_conj w)))) (complex_conj a) (complex_conj z))))
  hard_negative:
    statement: $f$が正則なら$w\mapsto\overline{f(w)}$も正則である。
    reason: $f(w)=w$では$\bar w$となり、どの点でも複素微分可能でない。内側の共役も必要である。
  target: |
    ∀ (f : ℂ → ℂ) (z a : ℂ), HasDerivAt f a z → HasDerivAt (fun w => (starRingEnd ℂ) (f ((starRingEnd ℂ) w))) ((starRingEnd ℂ) a) ((starRingEnd ℂ) z)
  proof: |
    by
      intro f z a hf
      have h : HasDerivAt f a ((starRingEnd ℂ) ((starRingEnd ℂ) z)) := by simpa using hf
      simpa [Function.comp_def] using h.conj_conj
- id: holomorphic_with_holomorphic_conj_constant
  kind: gap
  level: 2
  topic: コーシー・リーマン方程式・定数関数の判定
  statement: $U$を連結開集合とする。$f$と$\bar f$がともに$U$で正則ならば、$f$は$U$で定数である。
  statement_en: If U is a connected open set and both f and its conjugate are holomorphic on U, then f is constant on U.
  assumptions:
  - $U$は連結開集合で$c\in U$
  - $f$は$U$で正則
  - $z\mapsto\overline{f(z)}$は$U$で正則
  quantifiers:
  - 任意の関数$f:\mathbb{C}\to\mathbb{C}$
  - 任意の$z\in U$
  conclusion: 全ての$z\in U$で$f(z)=f(c)$である。
  answer: |-
    $U$を連結開集合、$c\in U$とし、$f$と$\bar f$は$U$で正則とする。$f=u+iv$と実部と虚部に分ける。$f$のコーシー・リーマン方程式は$u_x=v_y$、$u_y=-v_x$である。$\bar f=u-iv$のコーシー・リーマン方程式は$u_x=-v_y$、$u_y=v_x$である。

    二組を合わせると$u_x=v_y=0$、$u_y=v_x=0$となる。$f'=u_x+iv_x$なので$U$上で$f'=0$である。連結開集合上で導関数が恒等的に$0$の正則関数は定数である。よって全ての$z\in U$で$f(z)=f(c)$である。
  strategy: Combine the Cauchy-Riemann equations of f and of its conjugate to force f' = 0.
  sketch:
  - 'setup: Write f = u + iv.'
  - 'translate: The Cauchy-Riemann equations for f and for conj f hold together.'
  - 'derive: All first partial derivatives of u and v vanish, so f'' = 0.'
  - 'apply_theorem: A holomorphic function with zero derivative on a connected open set is constant.'
  openmath: (forall (f U c) (-> (and (open_set U) (connected_set U) (in c U) (holomorphic_on f U) (holomorphic_fn_on (lambda (z) (complex_conj (fn_value f z))) U)) (forall (z) (-> (in z U) (= (fn_value f z) (fn_value f c))))))
  hard_negative:
    statement: $U$が連結でなくても、$f,\bar f$が$U$で正則なら$f$は$U$で定数である。
    reason: $U=\{|z|<1\}\cup\{|z-3|<1\}$で$f$を第一成分で$0$、第二成分で$1$とすると、$f,\bar f$は正則だが定数でない。
  target: |
    ∀ (f : ℂ → ℂ) (U : Set ℂ) (c : ℂ), IsOpen U → IsPreconnected U → c ∈ U → DifferentiableOn ℂ f U → DifferentiableOn ℂ (fun z => (starRingEnd ℂ) (f z)) U → ∀ z ∈ U, f z = f c
  proof: |
    by
      intro f U c hU hc hcU hf hg z hz
      have hconn : IsConnected U := ⟨⟨c, hcU⟩, hc⟩
      have h1 : AnalyticOnNhd ℂ (fun z => f z + (starRingEnd ℂ) (f z)) U := (hf.add hg).analyticOnNhd hU
      have h2 : AnalyticOnNhd ℂ (fun z => f z - (starRingEnd ℂ) (f z)) U := (hf.sub hg).analyticOnNhd hU
      obtain ⟨A, hA⟩ := AnalyticOnNhd.eq_const_of_im_eq_const (c₀ := 0) h1 (fun x _ => by simp) hU hconn
      obtain ⟨B, hB⟩ := AnalyticOnNhd.eq_const_of_re_eq_const (c₀ := 0) h2 (fun x _ => by simp) hU hconn
      have e : ∀ x ∈ U, f x = (A + B) / 2 := by
        intro x hx
        have a1 := hA x hx
        have a2 := hB x hx
        rw [← a1, ← a2]; ring
      rw [e z hz, e c hcU]
- id: constant_modulus_implies_constant
  kind: gap
  level: 2
  topic: 正則関数・絶対値一定
  statement: $U$を連結開集合とする。$f$が$U$で正則で$|f|$が$U$上で一定ならば、$f$は$U$で定数である。
  statement_en: If U is a connected open set and f is holomorphic on U with |f| constant on U, then f is constant on U.
  assumptions:
  - $U$は連結開集合で$c\in U$
  - $f$は$U$で正則
  - 全ての$z\in U$で$|f(z)|=|f(c)|$
  quantifiers:
  - 任意の関数$f:\mathbb{C}\to\mathbb{C}$
  - 任意の$z\in U$
  conclusion: 全ての$z\in U$で$f(z)=f(c)$である。
  answer: |-
    $U$を連結開集合、$c\in U$とし、$f$は$U$で正則で全ての$z\in U$で$|f(z)|=|f(c)|$とする。$k=|f(c)|$とおく。

    $k=0$なら$U$上で$f=0$であり、$f(z)=f(c)$である。

    $k>0$とする。$U$上で$f\neq 0$であり、$\overline{f}=k^2/f$である。右辺は$U$で正則なので、$f$と$\bar f$はともに$U$で正則である。このとき$f=u+iv$のコーシー・リーマン方程式を$f$と$\bar f$の両方に適用すると、$u,v$の一階偏導関数は全て$0$となる。よって$f'=0$であり、連結開集合上で$f$は定数である。
  strategy: Write conj f = k^2/f to see that conj f is holomorphic, then apply the Cauchy-Riemann equations to both.
  sketch:
  - 'case_split: If the common modulus is 0, f vanishes on U.'
  - 'derive: Otherwise conj f = k^2/f is holomorphic on U.'
  - 'derive: The Cauchy-Riemann equations for f and conj f force f'' = 0.'
  - 'conclude: f is constant on the connected set U.'
  openmath: (forall (f U c) (-> (and (open_set U) (connected_set U) (in c U) (holomorphic_on f U) (forall (z) (-> (in z U) (= (abs (fn_value f z)) (abs (fn_value f c)))))) (forall (z) (-> (in z U) (= (fn_value f z) (fn_value f c))))))
  hard_negative:
    statement: $f$が$U$で実全微分可能で$|f|$が一定なら、$f$は定数である。
    reason: $f(x+iy)=e^{ix}$は平面で実全微分可能で$|f|=1$だが定数でない。正則性が必要である。
  target: |
    ∀ (f : ℂ → ℂ) (U : Set ℂ) (c : ℂ), IsOpen U → IsPreconnected U → c ∈ U → DifferentiableOn ℂ f U → (∀ z ∈ U, ‖f z‖ = ‖f c‖) → ∀ z ∈ U, f z = f c
  proof: |
    by
      intro f U c hU hc hcU hf hn z hz
      have hm : IsMaxOn (norm ∘ f) U c := fun x hx => by simp [hn x hx]
      exact Complex.eqOn_of_isPreconnected_of_isMaxOn_norm hc hU hf hcU hm hz
- id: image_on_real_line_implies_constant
  kind: gap
  level: 2
  topic: 正則関数・像が直線に含まれる場合
  statement: $U$を連結開集合、$f$を$U$で正則とする。実数$p,q,d$が$(p,q)\neq(0,0)$を満たし、$U$上で$p\operatorname{Re}f+q\operatorname{Im}f=d$ならば、$f$は$U$で定数である。これは実部が一定の場合を、像が任意の直線に含まれる場合へ一般化したものである。
  statement_en: Generalizing the constant real part case to an arbitrary line, if f is holomorphic on a connected open set U and p Re f + q Im f = d on U with (p,q) ≠ (0,0) real, then f is constant on U.
  assumptions:
  - $U$は連結開集合で$c\in U$
  - $f$は$U$で正則
  - $p,q,d\in\mathbb{R}$、$(p,q)\neq(0,0)$
  - $U$上で$p\operatorname{Re}f+q\operatorname{Im}f=d$
  quantifiers:
  - 任意の$f$と任意の$p,q,d$
  - 任意の$z\in U$
  conclusion: 全ての$z\in U$で$f(z)=f(c)$である。
  answer: |-
    $U$を連結開集合、$c\in U$、$f$を$U$で正則とし、$p,q,d\in\mathbb{R}$は$(p,q)\neq(0,0)$かつ$U$上で$p\operatorname{Re}f+q\operatorname{Im}f=d$を満たすとする。$w=p-iq$とおくと$w\neq 0$である。$\operatorname{Re}(wf)=p\operatorname{Re}f+q\operatorname{Im}f=d$なので、正則関数$g=wf$の実部は$U$上で一定である。

    $g=u+iv$とすると$u_x=u_y=0$であり、コーシー・リーマン方程式から$v_x=v_y=0$である。よって$g'=0$であり、$U$の連結性から$g$は定数である。$w\neq 0$で割れば$f$も定数なので、全ての$z\in U$で$f(z)=f(c)$である。
  strategy: Multiply f by p - iq so that the line condition becomes constancy of the real part.
  sketch:
  - 'construct: Put w = p - iq, which is nonzero.'
  - 'translate: Re(w f) = p Re f + q Im f = d.'
  - 'apply_theorem: The Cauchy-Riemann equations give (wf)'' = 0, so wf is constant.'
  - 'conclude: Dividing by w, f is constant.'
  openmath: (forall (f U c p q d) (-> (and (open_set U) (connected_set U) (in c U) (holomorphic_on f U) (in p R) (in q R) (in d R) (or (!= p 0) (!= q 0)) (forall (z) (-> (in z U) (= (+ (* p (real_part (fn_value f z))) (* q (imag_part (fn_value f z)))) d)))) (forall (z) (-> (in z U) (= (fn_value f z) (fn_value f c))))))
  hard_negative:
    statement: $f$が$U$で実全微分可能で$\operatorname{Re}f=0$なら、$f$は$U$で定数である。
    reason: $f(x+iy)=ix$は平面で実全微分可能で$\operatorname{Re}f=0$だが定数でない。正則性が必要である。
  target: |
    ∀ (f : ℂ → ℂ) (U : Set ℂ) (c : ℂ) (p q d : ℝ), IsOpen U → IsPreconnected U → c ∈ U → DifferentiableOn ℂ f U → (p ≠ 0 ∨ q ≠ 0) → (∀ z ∈ U, p * (f z).re + q * (f z).im = d) → ∀ z ∈ U, f z = f c
  proof: |
    by
      intro f U c p q d hU hc hcU hf hpq hl z hz
      have hconn : IsConnected U := ⟨⟨c, hcU⟩, hc⟩
      set w : ℂ := ⟨p, -q⟩ with hw
      have hw0 : w ≠ 0 := by
        intro h
        have h1 := congrArg Complex.re h
        have h2 := congrArg Complex.im h
        simp [hw] at h1 h2
        rcases hpq with h' | h'
        · exact h' h1
        · exact h' h2
      have h1 : AnalyticOnNhd ℂ (fun z => w * f z) U := (hf.const_mul w).analyticOnNhd hU
      obtain ⟨A, hA⟩ := AnalyticOnNhd.eq_const_of_re_eq_const (c₀ := d) h1 (fun x hx => by
        have := hl x hx
        simp [hw, Complex.mul_re]
        linarith) hU hconn
      have := (hA z hz).trans (hA c hcU).symm
      exact mul_left_cancel₀ hw0 this
- id: holomorphic_same_derivative_differ_by_constant
  kind: gap
  level: 2
  topic: 正則関数・原始関数の一意性
  statement: $U$を連結開集合とする。$f,g$が$U$で正則で$U$上で$f'=g'$ならば、$f-g$は$U$で定数である。
  statement_en: If f and g are holomorphic on a connected open set U and f' = g' on U, then f - g is constant on U.
  assumptions:
  - $U$は連結開集合で$c\in U$
  - $f,g$は$U$で正則
  - $U$上で$f'=g'$
  quantifiers:
  - 任意の$f,g$と任意の$z\in U$
  conclusion: 全ての$z\in U$で$f(z)-g(z)=f(c)-g(c)$である。
  answer: |-
    $U$を連結開集合、$c\in U$とし、$f,g$は$U$で正則で$U$上で$f'=g'$とする。$h=f-g$は$U$で正則で$h'=0$である。

    集合$S=\{z\in U\mid h(z)=h(c)\}$を考える。$S$は$U$の中で閉である。$a\in S$なら、$a$を中心とする円板$D\subset U$を取る。$z\in D$に対し$\phi(t)=h(a+t(z-a))$は$[0,1]$上で$\phi'(t)=(z-a)h'(a+t(z-a))=0$を満たすので、$h(z)=h(a)=h(c)$である。よって$D\subset S$であり、$S$は開である。$c\in S$で$U$は連結なので$S=U$である。すなわち全ての$z\in U$で$f(z)-g(z)=f(c)-g(c)$である。
  strategy: Show the level set of h = f - g through c is open and closed in U.
  sketch:
  - 'setup: Let h = f - g, so h'' = 0 on U.'
  - 'derive: On a disc in U, integrating along a segment shows h is constant.'
  - 'derive: The set where h = h(c) is open and closed in U.'
  - 'conclude: By connectedness it is all of U.'
  openmath: (forall (f g U c) (-> (and (open_set U) (connected_set U) (in c U) (holomorphic_on f U) (holomorphic_on g U) (forall (z) (-> (in z U) (= (complex_deriv f z) (complex_deriv g z))))) (forall (z) (-> (in z U) (= (- (fn_value f z) (fn_value g z)) (- (fn_value f c) (fn_value g c)))))))
  hard_negative:
    statement: 開集合$U$上で$f'=g'$なら、連結でなくても$f-g$は$U$で定数である。
    reason: $U$が二つの互いに素な円板の和で、$f$が一方で$0$、他方で$1$、$g=0$なら$f'=g'$だが$f-g$は定数でない。
  target: |
    ∀ (f g : ℂ → ℂ) (U : Set ℂ) (c : ℂ), IsOpen U → IsPreconnected U → c ∈ U → DifferentiableOn ℂ f U → DifferentiableOn ℂ g U → (∀ z ∈ U, deriv f z = deriv g z) → ∀ z ∈ U, f z - g z = f c - g c
  proof: |
    by
      intro f g U c hU hc hcU hf hg hd z hz
      have hd' : DifferentiableOn ℂ (fun z => f z - g z) U := hf.sub hg
      have h0 : Set.EqOn (deriv (fun z => f z - g z)) 0 U := by
        intro x hx
        have hfx := hf.differentiableAt (hU.mem_nhds hx)
        have hgx := hg.differentiableAt (hU.mem_nhds hx)
        rw [deriv_fun_sub hfx hgx, hd x hx]; simp
      exact hU.is_const_of_deriv_eq_zero hc hd' h0 hz hcU
- id: abel_lemma_power_series
  kind: gap
  level: 2
  topic: べき級数・アーベルの補題
  statement: 複素数列$(a_n)$と点$c,w$について、$|a_n(w-c)^n|\leq M$が全ての$n$で成り立つとする。このとき$|z-c|<|w-c|$なる$z$で$\sum_n a_n(z-c)^n$は絶対収束する。
  statement_en: If |a_n (w-c)^n| ≤ M for all n, then the series of a_n (z-c)^n converges absolutely whenever |z-c| < |w-c|.
  assumptions:
  - $(a_n)$は複素数列、$c,w\in\mathbb{C}$
  - 全ての$n$で$|a_n(w-c)^n|\leq M$
  - $|z-c|<|w-c|$
  quantifiers:
  - 任意の$(a_n)$、$c,w,z$、$M$
  conclusion: $\sum_n|a_n(z-c)^n|$は収束する。
  answer: |-
    $(a_n)$を複素数列、$c,w,z\in\mathbb{C}$、$M\in\mathbb{R}$とし、全ての$n$で$|a_n(w-c)^n|\leq M$、かつ$|z-c|<|w-c|$とする。$|w-c|>0$なので$\rho=|z-c|/|w-c|$は$0\leq\rho<1$を満たす。また$M\geq|a_0|\geq 0$である。

    各$n$で
    $|a_n(z-c)^n|=|a_n||w-c|^n\rho^n\leq M\rho^n$
    である。等比級数$\sum_n M\rho^n$は収束するので、比較判定法により$\sum_n|a_n(z-c)^n|$は収束する。
  strategy: Compare with the geometric series of ratio |z-c|/|w-c|.
  sketch:
  - 'setup: Put ρ = |z-c|/|w-c| < 1.'
  - 'derive: Each term is at most M ρ^n.'
  - 'apply_theorem: The comparison test with the geometric series gives absolute convergence.'
  openmath: (forall (a c w z B) (-> (and (forall (n) (-> (in n N) (<= (abs (* (seq_value a n) (^ (- w c) n))) B))) (< (abs (- z c)) (abs (- w c)))) (series_summable_fn (lambda (n) (abs (* (seq_value a n) (^ (- z c) n)))))))
  hard_negative:
    statement: $a_n(w-c)^n$が有界なら、$|z-c|=|w-c|$でも$\sum_n a_n(z-c)^n$は収束する。
    reason: $a_n=1$、$c=0$、$w=z=1$では項は有界だが$\sum_n 1$は発散する。
  target: |
    ∀ (a : ℕ → ℂ) (c w z : ℂ) (M : ℝ), (∀ n, ‖a n * (w - c) ^ n‖ ≤ M) → ‖z - c‖ < ‖w - c‖ → Summable (fun n => ‖a n * (z - c) ^ n‖)
  proof: |
    by
      intro a c w z M hM hz
      have hw : 0 < ‖w - c‖ := lt_of_le_of_lt (norm_nonneg _) hz
      set ρ := ‖z - c‖ / ‖w - c‖ with hρ
      have h0 : 0 ≤ ρ := by positivity
      have h1 : ρ < 1 := (div_lt_one hw).mpr hz
      have hM0 : 0 ≤ M := le_trans (norm_nonneg _) (hM 0)
      refine Summable.of_nonneg_of_le (fun n => norm_nonneg _) (fun n => ?_) ((summable_geometric_of_lt_one h0 h1).mul_left M)
      have e : ‖z - c‖ ^ n = ρ ^ n * ‖w - c‖ ^ n := by
        rw [hρ, div_pow, div_mul_cancel₀ _ (pow_ne_zero n hw.ne')]
      calc ‖a n * (z - c) ^ n‖ = ‖a n‖ * ‖z - c‖ ^ n := by rw [norm_mul, norm_pow]
        _ = (‖a n‖ * ‖w - c‖ ^ n) * ρ ^ n := by rw [e]; ring
        _ = ‖a n * (w - c) ^ n‖ * ρ ^ n := by rw [norm_mul, norm_pow]
        _ ≤ M * ρ ^ n := by gcongr; exact hM n
- id: power_series_termwise_derivative
  kind: textbook
  level: 2
  topic: べき級数・項別微分
  statement: $|w-c|<R$なる全ての$w$で$\sum_n a_n(w-c)^n$が収束するとする。このとき$|z-c|<R$なる$z$で$\sum_n na_n(z-c)^{n-1}$は収束し、$f(w)=\sum_n a_n(w-c)^n$は$z$で複素微分可能で$f'(z)$はその和に等しい。
  statement_en: If the series of a_n (w-c)^n converges whenever |w-c| < R, then for |z-c| < R the series of n a_n (z-c)^(n-1) converges and its sum is the complex derivative at z of f(w) = Σ a_n (w-c)^n.
  assumptions:
  - $|w-c|<R$なる全ての$w$で$\sum_n a_n(w-c)^n$は収束する
  - $|z-c|<R$
  quantifiers:
  - 任意の複素数列$(a_n)$、$c,z\in\mathbb{C}$、$R\in\mathbb{R}$
  conclusion: $\sum_n na_n(z-c)^{n-1}$は収束し、その和が$f'(z)$である。
  answer: |-
    $(a_n)$を複素数列、$c,z\in\mathbb{C}$とし、$|w-c|<R$で$\sum_n a_n(w-c)^n$が収束し、$|z-c|<R$とする。$|z-c|<r<s<R$なる$r,s$を取る。$w=c+s$で収束するので項は有界で、$|a_n|s^n\leq M$である。$\rho=r/s<1$とおく。

    $|w-c|\leq r$で$|na_n(w-c)^{n-1}|\leq n|a_n|r^{n-1}\leq (M/r)n\rho^n$である。$\sum_n n\rho^n$は収束するので、$\sum_n na_n(w-c)^{n-1}$は$|w-c|\leq r$で一様絶対収束する。その和を$g(w)$とする。

    $S_N(w)=\sum_{n\leq N}a_n(w-c)^n$とおく。$S_N$は多項式で、$|w-c|<r$で$S_N\to f$、$S_N'\to g$(後者は一様)である。$w$を$|w-c|<r$の点として線分$[z,w]$に沿って積分すると
    $S_N(w)-S_N(z)=(w-z)\int_0^1S_N'(z+t(w-z))\,dt$
    である。$N\to\infty$として$f(w)-f(z)=(w-z)\int_0^1g(z+t(w-z))\,dt$を得る。$g$は一様収束極限なので連続であり、$w\to z$のとき積分は$g(z)$に収束する。よって$f'(z)=g(z)$である。
  strategy: Dominate the derivative series on a smaller disc by a convergent series and pass to the limit in the integral form of the increment.
  sketch:
  - 'setup: Choose |z-c| < r < s < R; the terms at radius s are bounded.'
  - 'derive: The differentiated series converges uniformly on |w-c| ≤ r.'
  - 'derive: Partial sums satisfy S_N(w) - S_N(z) = (w-z) ∫ S_N'' along the segment.'
  - 'derive: Passing to the limit gives the same identity for f and the sum g.'
  - 'conclude: Continuity of g gives f''(z) = g(z).'
  openmath: (forall (a c z r) (-> (and (forall (w) (-> (< (abs (- w c)) r) (series_summable_fn (lambda (n) (* (seq_value a n) (^ (- w c) n)))))) (< (abs (- z c)) r)) (exists (s) (and (series_has_sum (lambda (n) (* n (* (seq_value a n) (^ (- z c) (- n 1))))) s) (has_complex_deriv_fn_at (lambda (w) (series_sum_fn (lambda (n) (* (seq_value a n) (^ (- w c) n))))) s z)))))
  hard_negative:
    statement: $\sum_n a_n(z-c)^n$が点$z$で収束すれば、同じ点$z$で$\sum_n na_n(z-c)^{n-1}$も収束する。
    reason: $a_n=1/n^2$($n\geq 1$)、$c=0$、$z=1$では元の級数は収束するが、微分した級数$\sum_n 1/n$は発散する。開円板の内部の点であることが必要である。
  target: |
    ∀ (a : ℕ → ℂ) (c z : ℂ) (R : ℝ), (∀ w : ℂ, ‖w - c‖ < R → Summable (fun n => a n * (w - c) ^ n)) → ‖z - c‖ < R → ∃ S : ℂ, HasSum (fun n : ℕ => (n : ℂ) * a n * (z - c) ^ (n - 1)) S ∧ HasDerivAt (fun w => ∑' n, a n * (w - c) ^ n) S z
  proof: |
    by
      intro a c z R hs hz
      obtain ⟨r, hzr, hrR⟩ := exists_between hz
      have hr0 : 0 < r := lt_of_le_of_lt (norm_nonneg _) hzr
      have hsum : Summable (fun n => ‖a n‖ * r ^ n) := by
        have h := hs (c + (r : ℂ)) (by simpa [abs_of_pos hr0] using hrR)
        have h' := h.norm
        refine h'.congr (fun n => ?_)
        simp [norm_mul, norm_pow, abs_of_pos hr0]
      set F : ℕ → ℂ → ℂ := fun n w => a n * (w - c) ^ n with hF
      have hd : ∀ n, DifferentiableOn ℂ (F n) (Metric.ball c r) := fun n => by
        apply Differentiable.differentiableOn
        simp only [hF]
        fun_prop
      have hle : ∀ n w, w ∈ Metric.ball c r → ‖F n w‖ ≤ ‖a n‖ * r ^ n := by
        intro n w hw
        simp only [hF, norm_mul, norm_pow]
        have : ‖w - c‖ ≤ r := (mem_ball_iff_norm.mp hw).le
        gcongr
      have hzb : z ∈ Metric.ball c r := mem_ball_iff_norm.mpr hzr
      have hsumd := Complex.hasSum_deriv_of_summable_norm hsum hd Metric.isOpen_ball hle hzb
      have hdiff := Complex.differentiableOn_tsum_of_summable_norm hsum hd Metric.isOpen_ball hle
      have e : ∀ n, deriv (F n) z = (n : ℂ) * a n * (z - c) ^ (n - 1) := by
        intro n
        have h1 : HasDerivAt (fun w : ℂ => (w - c) ^ n) ((n : ℂ) * (z - c) ^ (n - 1) * 1) z := ((hasDerivAt_id z).sub_const c).fun_pow n
        have h2 := h1.const_mul (a n)
        rw [hF]
        simp only
        rw [h2.deriv]
        ring
      simp_rw [e] at hsumd
      exact ⟨_, hsumd, (hdiff.differentiableAt (Metric.isOpen_ball.mem_nhds hzb)).hasDerivAt⟩
- id: power_series_radius_dichotomy
  kind: textbook
  level: 2
  topic: べき級数・収束半径
  statement: $\rho\in[0,\infty]$を$\sum_n a_nz^n$の収束半径($|a_n|r^n$が有界となる$r\geq 0$の上限)とする。$|z|<\rho$なら$\sum_n a_nz^n$は絶対収束し、$|z|>\rho$なら$\sum_n a_nz^n$は収束しない。
  statement_en: With ρ in [0, ∞] the radius of convergence (the supremum of r ≥ 0 with |a_n| r^n bounded), the series of a_n z^n converges absolutely for |z| < ρ and does not converge for |z| > ρ.
  assumptions:
  - $\rho$は$|a_n|r^n$が有界となる$r\geq 0$の上限
  quantifiers:
  - 任意の複素数列$(a_n)$と$z\in\mathbb{C}$
  conclusion: $|z|<\rho$で絶対収束し、$|z|>\rho$で収束しない。
  answer: |-
    $(a_n)$を複素数列、$z\in\mathbb{C}$とし、$\rho$を$|a_n|r^n$が有界となる$r\geq 0$の上限とする。

    $|z|<\rho$とする。上限の定義から$|z|<r$で$|a_n|r^n\leq M$となる$r$がある。$\theta=|z|/r<1$とすると$|a_nz^n|\leq M\theta^n$なので、等比級数との比較により$\sum_n|a_nz^n|$は収束する。

    $|z|>\rho$とする。$\sum_n a_nz^n$が収束すれば項は$0$に収束するので有界である。すると$r=|z|$で$|a_n|r^n$が有界となり、上限の定義から$|z|\leq\rho$となって矛盾する。
  strategy: Compare with a geometric series inside the radius; outside, convergence would make the terms bounded.
  sketch:
  - 'case_split: Consider |z| < ρ and |z| > ρ.'
  - 'apply_theorem: Inside, compare with a geometric series.'
  - 'contradiction: Outside, convergence forces bounded terms, so |z| ≤ ρ.'
  openmath: (forall (a z) (and (-> (< (abs z) (power_series_radius a)) (series_summable_fn (lambda (n) (abs (* (seq_value a n) (^ z n)))))) (-> (< (power_series_radius a) (abs z)) (not (series_summable_fn (lambda (n) (* (seq_value a n) (^ z n))))))))
  hard_negative:
    statement: $|z|=\rho$でも$\sum_n a_nz^n$は必ず収束する。
    reason: $a_n=1$では$\rho=1$であり、$z=1$で級数は発散する。
  target: |
    ∀ (a : ℕ → ℂ) (z : ℂ), (((‖z‖₊ : NNReal) : ENNReal) < (FormalMultilinearSeries.ofScalars ℂ a).radius → Summable (fun n => ‖a n * z ^ n‖)) ∧ ((FormalMultilinearSeries.ofScalars ℂ a).radius < ((‖z‖₊ : NNReal) : ENNReal) → ¬ Summable (fun n => a n * z ^ n))
  proof: |
    by
      intro a z
      have e : ∀ n, (FormalMultilinearSeries.ofScalars ℂ a n) (fun _ => z) = a n * z ^ n := fun n => by
        simpa using FormalMultilinearSeries.ofScalars_apply_eq (E := ℂ) a z n
      constructor
      · intro h
        have h' : z ∈ Metric.eball (0 : ℂ) (FormalMultilinearSeries.ofScalars ℂ a).radius := by
          simpa [Metric.mem_eball, edist_zero_right, enorm_eq_nnnorm] using h
        have := (FormalMultilinearSeries.ofScalars ℂ a).summable_norm_apply h'
        simpa [e] using this
      · intro h hs
        have := (FormalMultilinearSeries.ofScalars ℂ a).not_summable_norm_of_radius_lt_nnnorm h
        apply this
        have := hs.norm
        simpa [e] using this
- id: cauchy_hadamard_formula
  kind: named
  level: 2
  topic: べき級数・コーシー・アダマールの公式
  statement: コーシー・アダマールの公式。$\sum_n a_nz^n$の収束半径$\rho\in[0,\infty]$は$1/\rho=\limsup_{n\to\infty}|a_n|^{1/n}$を満たす。ただし$1/0=\infty$、$1/\infty=0$と約束する。
  statement_en: The Cauchy-Hadamard formula. The radius of convergence ρ in [0, ∞] of the series of a_n z^n satisfies 1/ρ = limsup |a_n|^(1/n), with 1/0 = ∞ and 1/∞ = 0.
  assumptions:
  - $\rho$は$\sum_n a_nz^n$の収束半径
  - $1/0=\infty$、$1/\infty=0$と約束する
  quantifiers:
  - 任意の複素数列$(a_n)$
  conclusion: $1/\rho=\limsup_{n\to\infty}|a_n|^{1/n}$である。
  answer: |-
    $(a_n)$を複素数列とし、$\rho$を$|a_n|r^n$が有界となる$r\geq 0$の上限、$L=\limsup_n|a_n|^{1/n}\in[0,\infty]$とする。$1/\rho=L$を示す。

    $0<r$で$|a_n|r^n\leq M$なら$|a_n|^{1/n}\leq M^{1/n}/r$であり、$M^{1/n}\to 1$なので$L\leq 1/r$である($M=0$なら$L=0$)。よって$r<\rho$なる全ての$r>0$で$L\leq 1/r$となり、$L\leq 1/\rho$を得る($\rho=0$なら自明である)。

    逆に$L<\infty$とし、$L<s$なる$s>0$を取る。十分大きな$n$で$|a_n|^{1/n}<s$なので$|a_n|(1/s)^n<1$である。有限個の項を除いて有界なので$|a_n|(1/s)^n$は有界であり、$1/s\leq\rho$である。すなわち$1/\rho\leq s$である。$s\downarrow L$として$1/\rho\leq L$を得る($L=\infty$なら自明である)。
  strategy: Translate boundedness of |a_n| r^n into a bound on |a_n|^(1/n) in both directions.
  sketch:
  - 'derive: If |a_n| r^n is bounded, then limsup |a_n|^(1/n) ≤ 1/r.'
  - 'derive: If limsup < s, then |a_n| (1/s)^n is eventually below 1, so 1/s ≤ ρ.'
  - 'conclude: Both inequalities give 1/ρ = limsup.'
  openmath: (forall (a) (= (inverse_extended (power_series_radius a)) (limsup_nth_root_norm a)))
  hard_negative:
    statement: 収束半径は常に$\lim_n|a_n/a_{n+1}|$で与えられる。
    reason: $a_{2n}=1$、$a_{2n+1}=2$では比の極限は存在しないが、収束半径は$1$である。
  target: |
    ∀ (a : ℕ → ℂ), ((FormalMultilinearSeries.ofScalars ℂ a).radius)⁻¹ = Filter.limsup (fun n : ℕ => (((‖a n‖₊ ^ (1 / (n : ℝ)) : NNReal)) : ENNReal)) Filter.atTop
  proof: |
    by
      intro a
      rw [FormalMultilinearSeries.radius_inv_eq_limsup]
      have : ∀ n, ‖(FormalMultilinearSeries.ofScalars ℂ a) n‖₊ = ‖a n‖₊ := fun n => by
        ext
        simp [FormalMultilinearSeries.ofScalars_norm]
      simp_rw [this]
- id: power_series_coefficient_is_taylor
  kind: gap
  level: 2
  topic: べき級数・係数とテイラー係数
  statement: $R>0$とし、$|w-c|<R$で$\sum_n a_n(w-c)^n$が収束するとする。その和を$f$とすると、全ての$n$で$a_n=f^{(n)}(c)/n!$である。
  statement_en: If R > 0 and the series of a_n (w-c)^n converges for |w-c| < R with sum f, then a_n = f^(n)(c)/n! for every n.
  assumptions:
  - $R>0$
  - $|w-c|<R$で$\sum_n a_n(w-c)^n$は収束し、その和が$f(w)$
  quantifiers:
  - 任意の複素数列$(a_n)$、$c$、$R$
  - 任意の自然数$n$
  conclusion: $a_n=f^{(n)}(c)/n!$である。
  answer: |-
    $(a_n)$を複素数列、$c\in\mathbb{C}$、$R>0$とし、$|w-c|<R$で$f(w)=\sum_n a_n(w-c)^n$とする。項別微分の定理により、$f$は$|w-c|<R$で複素微分可能で$f'(w)=\sum_{n\geq 1}na_n(w-c)^{n-1}$である。この右辺も同じ円板で収束するべき級数なので、繰り返し項別微分できる。$k$回微分すると
    $f^{(k)}(w)=\sum_{n\geq k}n(n-1)\cdots(n-k+1)a_n(w-c)^{n-k}$
    である。$w=c$とおくと$n=k$の項だけが残り、$f^{(k)}(c)=k!\,a_k$である。よって$a_k=f^{(k)}(c)/k!$である。
  strategy: Differentiate term by term k times and evaluate at the centre.
  sketch:
  - 'apply_theorem: Term-by-term differentiation applies repeatedly on the disc.'
  - 'derive: The k-th derivative series has constant term k! a_k.'
  - 'conclude: Evaluate at w = c.'
  openmath: (forall (a c r f) (-> (and (> r 0) (forall (w) (-> (< (abs (- w c)) r) (series_has_sum (lambda (n) (* (seq_value a n) (^ (- w c) n))) (fn_value f w))))) (forall (n) (-> (in n N) (= (seq_value a n) (/ (iterated_complex_deriv n f c) (factorial n)))))))
  hard_negative:
    statement: $R$の値によらず$a_n=f^{(n)}(0)/n!$である($c\neq 0$でも中心を$0$としてよい)。
    reason: $f(w)=(w-1)$は$c=1$で$a_1=1,a_0=0$だが、$f(0)=-1\neq a_0$である。微分は中心$c$で取る。
  target: |
    ∀ (a : ℕ → ℂ) (c : ℂ) (R : ℝ), 0 < R → (∀ w : ℂ, ‖w - c‖ < R → Summable (fun n => a n * (w - c) ^ n)) → ∀ n, a n = iteratedDeriv n (fun w => ∑' k, a k * (w - c) ^ k) c / (n.factorial : ℂ)
  proof: |
    by
      intro a c R hR hs n
      set p := FormalMultilinearSeries.ofScalars ℂ a with hp
      have hrad : 0 < p.radius := by
        obtain ⟨r, hr0, hrR⟩ := exists_between hR
        have hsum : Summable (fun n => ‖p n‖ * r ^ n) := by
          have h := (hs (c + (r : ℂ)) (by simpa [abs_of_pos hr0] using hrR)).norm
          refine h.congr (fun n => ?_)
          simp [hp, FormalMultilinearSeries.ofScalars_norm, abs_of_pos hr0]
        have := p.le_radius_of_summable (r := r.toNNReal) (by rw [Real.coe_toNNReal _ hr0.le]; exact hsum)
        refine lt_of_lt_of_le ?_ this
        exact ENNReal.coe_pos.mpr (Real.toNNReal_pos.mpr hr0)
      have h1 := (p.hasFPowerSeriesOnBall hrad).comp_sub c
      simp only [zero_add] at h1
      have e : (fun z => p.sum (z - c)) = fun w => ∑' k, a k * (w - c) ^ k := by
        funext w
        simp only [FormalMultilinearSeries.sum]
        congr 1
        funext k
        simpa [hp] using FormalMultilinearSeries.ofScalars_apply_eq (E := ℂ) a (w - c) k
      rw [e] at h1
      have h2 := h1.hasFPowerSeriesAt
      have h3 := h2.analyticAt.hasFPowerSeriesAt
      have h4 := h2.eq_formalMultilinearSeries h3
      have h5 := FormalMultilinearSeries.ofScalars_series_injective ℂ ℂ h4
      exact congrFun h5 n
- id: power_series_coefficients_unique_on_accumulating_sequence
  kind: textbook
  level: 2
  topic: べき級数・係数の一意性
  statement: $R>0$とし、$\sum_n a_n(w-c)^n$と$\sum_n b_n(w-c)^n$が$|w-c|<R$で収束するとする。$c$に収束する点列$(s_k)$($s_k\neq c$)上で二つの和が一致すれば、全ての$n$で$a_n=b_n$である。
  statement_en: If two power series about c converge on |w-c| < R with R > 0 and their sums agree on a sequence s_k ≠ c converging to c, then their coefficients coincide.
  assumptions:
  - $R>0$
  - $\sum_n a_n(w-c)^n$と$\sum_n b_n(w-c)^n$は$|w-c|<R$で収束する
  - $s_k\neq c$、$s_k\to c$
  - 全ての$k$で二つの和は$s_k$で一致する
  quantifiers:
  - 任意の複素数列$(a_n),(b_n),(s_k)$と$c,R$
  conclusion: 全ての$n$で$a_n=b_n$である。
  answer: |-
    $(a_n),(b_n)$を複素数列、$c\in\mathbb{C}$、$R>0$とし、$\sum_na_n(w-c)^n$と$\sum_nb_n(w-c)^n$は$|w-c|<R$で収束するとする。$(s_k)$は$s_k\neq c$、$s_k\to c$を満たし、全ての$k$で二つの和は$s_k$で一致するとする。$d_n=a_n-b_n$とおくと$h(w)=\sum_n d_n(w-c)^n$は$|w-c|<R$で収束し、$h(s_k)=0$である。$d_n$の中に$0$でないものがあるとして矛盾を導く。

    $d_n\neq 0$なる最小の$n$を$m$とする。$|w-c|<R$で
    $h(w)=(w-c)^mg(w),\quad g(w)=\sum_{n\geq m}d_n(w-c)^{n-m}$
    である。$g$は$|w-c|<R$で収束するべき級数の和なので連続で、$g(c)=d_m\neq 0$である。よって$c$の近くで$g\neq 0$である。十分大きな$k$で$s_k$はその近くにあり$s_k\neq c$なので、$h(s_k)=(s_k-c)^mg(s_k)\neq 0$となって矛盾する。したがって全ての$n$で$a_n=b_n$である。
  strategy: Factor out the lowest nonzero term of the difference series and use continuity at the centre.
  sketch:
  - 'setup: Let h be the difference series with coefficients d_n.'
  - 'contradiction: Assume some d_n is nonzero and let m be the least such index.'
  - 'derive: h(w) = (w-c)^m g(w) with g continuous and g(c) ≠ 0.'
  - 'conclude: Then h(s_k) ≠ 0 for large k, a contradiction.'
  openmath: (forall (a b c r s) (-> (and (> r 0) (forall (w) (-> (< (abs (- w c)) r) (and (series_summable_fn (lambda (n) (* (seq_value a n) (^ (- w c) n)))) (series_summable_fn (lambda (n) (* (seq_value b n) (^ (- w c) n))))))) (forall (k) (!= (seq_value s k) c)) (seq_tends_to s c) (forall (k) (= (series_sum_fn (lambda (n) (* (seq_value a n) (^ (- (seq_value s k) c) n)))) (series_sum_fn (lambda (n) (* (seq_value b n) (^ (- (seq_value s k) c) n))))))) (forall (n) (= (seq_value a n) (seq_value b n)))))
  hard_negative:
    statement: 点列$(s_k)$が円板内の点に集積しなくても、無限個の点で和が一致すれば係数は一致する。
    reason: $h(w)=\sin(1/(1-w))$は$|w|<1$で正則で、点列$s_k=1-1/(k\pi)$で$0$だが恒等的に$0$ではない。集積点は$1$で円板内にない。
  target: |
    ∀ (a b : ℕ → ℂ) (c : ℂ) (R : ℝ) (s : ℕ → ℂ), 0 < R → (∀ w : ℂ, ‖w - c‖ < R → Summable (fun n => a n * (w - c) ^ n)) → (∀ w : ℂ, ‖w - c‖ < R → Summable (fun n => b n * (w - c) ^ n)) → (∀ k, s k ≠ c) → Filter.Tendsto s Filter.atTop (nhds c) → (∀ k, ∑' n, a n * (s k - c) ^ n = ∑' n, b n * (s k - c) ^ n) → a = b
  proof: |
    by
      intro a b c R s hR ha hb hne hs hk
      set p := FormalMultilinearSeries.ofScalars ℂ a with hp
      have hrad : 0 < p.radius := by
        obtain ⟨r, hr0, hrR⟩ := exists_between hR
        have hsum : Summable (fun n => ‖p n‖ * r ^ n) := by
          have h := (ha (c + (r : ℂ)) (by simpa [abs_of_pos hr0] using hrR)).norm
          refine h.congr (fun n => ?_)
          simp [hp, FormalMultilinearSeries.ofScalars_norm, abs_of_pos hr0]
        have := p.le_radius_of_summable (r := r.toNNReal) (by rw [Real.coe_toNNReal _ hr0.le]; exact hsum)
        refine lt_of_lt_of_le ?_ this
        exact ENNReal.coe_pos.mpr (Real.toNNReal_pos.mpr hr0)
      have h1 := (p.hasFPowerSeriesOnBall hrad).comp_sub c
      simp only [zero_add] at h1
      have e : (fun z => p.sum (z - c)) = fun w => ∑' k, a k * (w - c) ^ k := by
        funext w
        simp only [FormalMultilinearSeries.sum]
        congr 1
        funext k
        simpa [hp] using FormalMultilinearSeries.ofScalars_apply_eq (E := ℂ) a (w - c) k
      rw [e] at h1
      set q := FormalMultilinearSeries.ofScalars ℂ b with hq
      have hrad2 : 0 < q.radius := by
        obtain ⟨r, hr0, hrR⟩ := exists_between hR
        have hsum2 : Summable (fun n => ‖q n‖ * r ^ n) := by
          have h := (hb (c + (r : ℂ)) (by simpa [abs_of_pos hr0] using hrR)).norm
          refine h.congr (fun n => ?_)
          simp [hq, FormalMultilinearSeries.ofScalars_norm, abs_of_pos hr0]
        have := q.le_radius_of_summable (r := r.toNNReal) (by rw [Real.coe_toNNReal _ hr0.le]; exact hsum2)
        refine lt_of_lt_of_le ?_ this
        exact ENNReal.coe_pos.mpr (Real.toNNReal_pos.mpr hr0)
      have h2 := (q.hasFPowerSeriesOnBall hrad2).comp_sub c
      simp only [zero_add] at h2
      have e2 : (fun z => q.sum (z - c)) = fun w => ∑' k, b k * (w - c) ^ k := by
        funext w
        simp only [FormalMultilinearSeries.sum]
        congr 1
        funext k
        simpa [hq] using FormalMultilinearSeries.ofScalars_apply_eq (E := ℂ) b (w - c) k
      rw [e2] at h2
      have hev : ∀ᶠ z in nhds c, (∑' k, a k * (z - c) ^ k) = ∑' k, b k * (z - c) ^ k := by
        have hs' : Filter.Tendsto s Filter.atTop (nhdsWithin c {c}ᶜ) :=
          tendsto_nhdsWithin_iff.mpr ⟨hs, Filter.Eventually.of_forall hne⟩
        have hf : ∃ᶠ z in nhdsWithin c {c}ᶜ, (∑' k, a k * (z - c) ^ k) = ∑' k, b k * (z - c) ^ k :=
          hs'.frequently (Filter.Frequently.of_forall hk)
        exact (h1.hasFPowerSeriesAt.analyticAt.frequently_eq_iff_eventually_eq h2.hasFPowerSeriesAt.analyticAt).mp hf
      have h5 := h1.hasFPowerSeriesAt.eq_formalMultilinearSeries_of_eventually h2.hasFPowerSeriesAt hev
      exact FormalMultilinearSeries.ofScalars_series_injective ℂ ℂ h5
- id: power_series_cauchy_coefficient_integral
  kind: gap
  level: 2
  topic: べき級数・係数の積分表示
  statement: |-
    $|w-c|<R$で$\sum_n a_n(w-c)^n$が収束するとし、その和を$f$とする。$0<\rho<R$なら、正の向きの円周$|z-c|=\rho$について
    $\oint_{|z-c|=\rho}\frac{f(z)}{(z-c)^{n+1}}\,dz=2\pi i\,a_n$
    である。
  statement_en: If the series of a_k (w-c)^k converges on |w-c| < R with sum f and 0 < ρ < R, then the integral of f(z)/(z-c)^(n+1) over the positively oriented circle |z-c| = ρ equals 2πi a_n.
  assumptions:
  - $|w-c|<R$で$\sum_k a_k(w-c)^k$は収束し、その和が$f$
  - $0<\rho<R$
  - 円周の向きは正の向き
  quantifiers:
  - 任意の複素数列$(a_k)$、$c$、$R,\rho$、自然数$n$
  conclusion: 積分の値は$2\pi i\,a_n$である。
  answer: |-
    $(a_k)$を複素数列、$c\in\mathbb{C}$、$0<\rho<R$、$n$を自然数とし、$|w-c|<R$で$\sum_ka_k(w-c)^k$は収束してその和が$f(w)$であるとする。$\rho<s<R$なる$s$を取る。級数は$w=c+s$で収束するので項は有界で、$|a_k|s^k\leq M$である。$|z-c|=\rho$上で$|a_k(z-c)^k|\leq M(\rho/s)^k$なので、$\sum_k a_k(z-c)^k$は円周上で一様収束する。したがって$(z-c)^{-n-1}$を掛けても一様収束し、項別に積分できる。
    $\oint\frac{f(z)}{(z-c)^{n+1}}\,dz=\sum_ka_k\oint(z-c)^{k-n-1}\,dz$
    である。整数$m$について、$m\neq-1$なら$(z-c)^m$は原始関数を持つので$\oint(z-c)^m\,dz=0$であり、$m=-1$なら$\oint(z-c)^{-1}\,dz=2\pi i$である。よって$k=n$の項だけが残り、積分は$2\pi i\,a_n$である。
  strategy: Integrate the uniformly convergent series term by term over the circle.
  sketch:
  - 'derive: The series converges uniformly on the circle of radius ρ.'
  - 'apply_theorem: Integrate term by term.'
  - 'derive: Only the power (z-c)^(-1) has a nonzero integral.'
  - 'conclude: The integral equals 2πi a_n.'
  openmath: (forall (a c r t n) (-> (and (forall (w) (-> (< (abs (- w c)) r) (series_summable_fn (lambda (k) (* (seq_value a k) (^ (- w c) k)))))) (< 0 t) (< t r) (in n N)) (= (circle_integral (lambda (z) (* (/ 1 (^ (- z c) (+ n 1))) (series_sum_fn (lambda (k) (* (seq_value a k) (^ (- z c) k)))))) c t) (* (* 2 (* pi complex_imaginary_unit)) (seq_value a n)))))
  hard_negative:
    statement: $\rho\geq R$でも同じ公式が成り立つ。
    reason: $a_k=1$、$c=0$、$R=1$では和$1/(1-z)$は$|z|<1$の外で級数の和を表さない。$|z|=2$で級数は発散し、積分の式が意味を失う。
  target: |
    ∀ (a : ℕ → ℂ) (c : ℂ) (R ρ : ℝ) (n : ℕ), 0 < ρ → ρ < R → (∀ w : ℂ, ‖w - c‖ < R → Summable (fun k => a k * (w - c) ^ k)) → (∮ z in C(c, ρ), (1 / (z - c) ^ (n + 1)) * ∑' k, a k * (z - c) ^ k) = 2 * Real.pi * Complex.I * a n
  proof: |
    by
      intro a c R ρ n hρ hρR hs
      have hR : 0 < R := hρ.trans hρR
      have hcoef : a n = iteratedDeriv n (fun w => ∑' k, a k * (w - c) ^ k) c / (n.factorial : ℂ) := by
        set p := FormalMultilinearSeries.ofScalars ℂ a with hp
        have hrad : 0 < p.radius := by
          obtain ⟨r, hr0, hrR⟩ := exists_between hR
          have hsum : Summable (fun n => ‖p n‖ * r ^ n) := by
            have h := (hs (c + (r : ℂ)) (by simpa [abs_of_pos hr0] using hrR)).norm
            refine h.congr (fun n => ?_)
            simp [hp, FormalMultilinearSeries.ofScalars_norm, abs_of_pos hr0]
          have := p.le_radius_of_summable (r := r.toNNReal) (by rw [Real.coe_toNNReal _ hr0.le]; exact hsum)
          refine lt_of_lt_of_le ?_ this
          exact ENNReal.coe_pos.mpr (Real.toNNReal_pos.mpr hr0)
        have h1 := (p.hasFPowerSeriesOnBall hrad).comp_sub c
        simp only [zero_add] at h1
        have e : (fun z => p.sum (z - c)) = fun w => ∑' k, a k * (w - c) ^ k := by
          funext w
          simp only [FormalMultilinearSeries.sum]
          congr 1
          funext k
          simpa [hp] using FormalMultilinearSeries.ofScalars_apply_eq (E := ℂ) a (w - c) k
        rw [e] at h1
        have h2 := h1.hasFPowerSeriesAt
        have h3 := h2.analyticAt.hasFPowerSeriesAt
        have h4 := h2.eq_formalMultilinearSeries h3
        have h5 := FormalMultilinearSeries.ofScalars_series_injective ℂ ℂ h4
        exact congrFun h5 n
      obtain ⟨r, hρr, hrR⟩ := exists_between hρR
      have hr0 : 0 < r := hρ.trans hρr
      have hsum : Summable (fun n => ‖a n‖ * r ^ n) := by
        have h := (hs (c + (r : ℂ)) (by simpa [abs_of_pos hr0] using hrR)).norm
        refine h.congr (fun n => ?_)
        simp [norm_mul, norm_pow, abs_of_pos hr0]
      have hd : ∀ n, DifferentiableOn ℂ (fun w : ℂ => a n * (w - c) ^ n) (Metric.ball c r) := fun n => by
        apply Differentiable.differentiableOn
        fun_prop
      have hle : ∀ n w, w ∈ Metric.ball c r → ‖a n * (w - c) ^ n‖ ≤ ‖a n‖ * r ^ n := by
        intro n w hw
        simp only [norm_mul, norm_pow]
        have : ‖w - c‖ ≤ r := (mem_ball_iff_norm.mp hw).le
        gcongr
      have hdiff := Complex.differentiableOn_tsum_of_summable_norm hsum hd Metric.isOpen_ball hle
      have hdc := hdiff.mono (Metric.closedBall_subset_ball hρr)
      have hI := hdc.circleIntegral_one_div_sub_center_pow_smul hρ n
      simp only [smul_eq_mul] at hI
      rw [hI]
      have hn : (n.factorial : ℂ) ≠ 0 := by exact_mod_cast n.factorial_ne_zero
      rw [hcoef]
      field_simp
- id: taylor_remainder_geometric_bound
  kind: gap
  level: 3
  topic: テイラー展開・剰余の評価
  statement: |-
    $R>0$とし、$f$は開円板$|w-c|<R$で正則で閉円板で連続、円周$|w-c|=R$上で$|f|\leq M$とする。$|z-c|<R$なら、$q=|z-c|/R$について
    $\left|f(z)-\sum_{k<n}\frac{f^{(k)}(c)}{k!}(z-c)^k\right|\leq\frac{Mq^n}{1-q}$
    である。
  statement_en: If f is holomorphic on |w-c| < R, continuous on the closed disc and |f| ≤ M on the circle, then for |z-c| < R and q = |z-c|/R, the n-th Taylor remainder at c is at most M q^n/(1-q).
  assumptions:
  - $R>0$
  - $f$は$|w-c|<R$で正則で$|w-c|\leq R$で連続
  - $|w-c|=R$上で$|f|\leq M$
  - $|z-c|<R$
  quantifiers:
  - 任意の$f,c,z,R,M$と自然数$n$
  conclusion: 剰余の絶対値は$Mq^n/(1-q)$以下である。
  answer: |-
    $R>0$、$f$を$|w-c|<R$で正則で$|w-c|\leq R$で連続な関数で$|w-c|=R$上$|f|\leq M$を満たすもの、$|z-c|<R$、$n$を自然数とし、$q=|z-c|/R<1$とする。コーシーの評価により、全ての$k$で$|f^{(k)}(c)|\leq k!M/R^k$である。テイラー展開により$f(z)=\sum_k\frac{f^{(k)}(c)}{k!}(z-c)^k$であり、$k$番目の項の絶対値は$M(|z-c|/R)^k=Mq^k$以下である。

    したがって、剰余は$k\geq n$の項の和であり、
    $\left|\sum_{k\geq n}\frac{f^{(k)}(c)}{k!}(z-c)^k\right|\leq\sum_{k\geq n}Mq^k=\frac{Mq^n}{1-q}$
    である。
  strategy: Bound each Taylor term by the Cauchy estimate and sum the geometric tail.
  sketch:
  - 'apply_theorem: The Cauchy estimate gives |f^(k)(c)| ≤ k! M / R^k.'
  - 'derive: The k-th Taylor term has modulus at most M q^k.'
  - 'conclude: Summing the tail for k ≥ n gives M q^n/(1-q).'
  openmath: (forall (f c z r B n) (-> (and (> r 0) (holomorphic_on f (open_disc c r)) (continuous_on_set f (closed_disc c r)) (forall (w) (-> (in w (circle_set c r)) (<= (abs (fn_value f w)) B))) (< (abs (- z c)) r) (in n N)) (<= (abs (- (fn_value f z) (range_sum n (lambda (k) (* (/ (iterated_complex_deriv k f c) (factorial k)) (^ (- z c) k)))))) (/ (* B (^ (/ (abs (- z c)) r) n)) (- 1 (/ (abs (- z c)) r))))))
  hard_negative:
    statement: 剰余は$Mq^n$以下である(分母$1-q$は不要である)。
    reason: $f(w)=(w+1/4)/(1+w/4)$、$c=0$、$R=1$、$M=1$、$n=1$、$z=-1/2$では、$q=1/2$で$|f(z)-f(0)|=|-2/7-1/4|=15/28$であり、$Mq=14/28$を超える。
  target: |
    ∀ (f : ℂ → ℂ) (c z : ℂ) (R M : ℝ) (n : ℕ), 0 < R → DiffContOnCl ℂ f (Metric.ball c R) → (∀ w ∈ Metric.sphere c R, ‖f w‖ ≤ M) → ‖z - c‖ < R → ‖f z - ∑ k ∈ Finset.range n, ((k.factorial : ℂ))⁻¹ * (z - c) ^ k * iteratedDeriv k f c‖ ≤ M * (‖z - c‖ / R) ^ n / (1 - ‖z - c‖ / R)
  proof: |
    by
      intro f c z R M n hR hf hM hz
      have hdf : DifferentiableOn ℂ f (Metric.ball c R) := hf.differentiableOn
      have hs := Complex.hasSum_taylorSeries_on_ball hdf (mem_ball_iff_norm.mpr hz)
      have hρ : ‖z - c‖ / R < 1 := (div_lt_one hR).mpr hz
      have hb : ∀ k : ℕ, ‖((k.factorial : ℂ))⁻¹ • (z - c) ^ k • iteratedDeriv k f c‖ ≤ M * (‖z - c‖ / R) ^ k := by
        intro k
        have hc := Complex.norm_iteratedDeriv_le_of_forall_mem_sphere_norm_le k hR hf hM
        have hk : (0 : ℝ) < k.factorial := by positivity
        simp only [norm_smul, norm_inv, norm_pow, Complex.norm_natCast]
        calc (k.factorial : ℝ)⁻¹ * (‖z - c‖ ^ k * ‖iteratedDeriv k f c‖) ≤ (k.factorial : ℝ)⁻¹ * (‖z - c‖ ^ k * (k.factorial * M / R ^ k)) := by gcongr
          _ = M * (‖z - c‖ / R) ^ k := by rw [div_pow]; field_simp
      have := norm_sub_le_of_geometric_bound_of_hasSum hρ hb hs n
      rw [norm_sub_rev]
      simpa [smul_eq_mul, mul_assoc] using this
- id: circle_integral_of_derivative_vanishes
  kind: gap
  level: 2
  topic: 周回積分・原始関数を持つ関数
  statement: $R\in\mathbb{R}$とし、$\oint_{|z-c|=R}$を$\gamma(t)=c+Re^{it}$($0\leq t\leq 2\pi$)に沿う積分とする。$f$が円周$|z-c|=|R|$上で連続で、円周上の各点$z$で$F'(z)=f(z)$ならば、$\oint_{|z-c|=R}f(z)\,dz=0$である。
  statement_en: If f is continuous on the circle |z-c| = |R| and F'(z) = f(z) at each point of the circle, then the circle integral of f vanishes.
  assumptions:
  - $f$は円周上で連続
  - 円周上の各点で$F$は複素微分可能で$F'=f$
  quantifiers:
  - 任意の$F,f,c,R$
  conclusion: $\oint_{|z-c|=R}f(z)\,dz=0$である。
  answer: |-
    $R\in\mathbb{R}$、$f$を円周$|z-c|=|R|$上で連続な関数、$F$を円周上の各点$z$で$F'(z)=f(z)$を満たす関数とする。$\gamma(t)=c+Re^{it}$($0\leq t\leq 2\pi$)とおく。定義により
    $\oint f(z)\,dz=\int_0^{2\pi}f(\gamma(t))\gamma'(t)\,dt$
    である。合成関数の微分より$(F\circ\gamma)'(t)=F'(\gamma(t))\gamma'(t)=f(\gamma(t))\gamma'(t)$であり、右辺は$t$について連続である。微分積分学の基本定理により積分は$F(\gamma(2\pi))-F(\gamma(0))$に等しい。$\gamma(2\pi)=\gamma(0)$なのでこれは$0$である。
  strategy: Parametrize the circle and apply the fundamental theorem of calculus to F along it.
  sketch:
  - 'translate: Write the integral over t in [0, 2π].'
  - 'derive: The integrand is the derivative of F∘γ.'
  - 'conclude: The integral equals F(γ(2π)) - F(γ(0)) = 0.'
  openmath: (forall (F0 f c r) (-> (and (continuous_on_set f (circle_set c (abs r))) (forall (z) (-> (in z (circle_set c (abs r))) (has_complex_deriv_at F0 (fn_value f z) z)))) (= (circle_integral (lambda (z) (fn_value f z)) c r) 0)))
  hard_negative:
    statement: $U=\mathbb{C}\setminus\{0\}$で正則な$f$は全て$U$の円周上で積分$0$である。
    reason: $f(z)=1/z$は$U$で正則だが、$|z|=1$上の積分は$2\pi i$である。$U$上に原始関数がない。
  target: |
    ∀ (F f : ℂ → ℂ) (c : ℂ) (R : ℝ), ContinuousOn f (Metric.sphere c |R|) → (∀ z ∈ Metric.sphere c |R|, HasDerivAt F (f z) z) → (∮ z in C(c, R), f z) = 0
  proof: |
    by
      intro F f c R hc hd
      exact circleIntegral.integral_eq_zero_of_hasDerivWithinAt' (f := F) (f' := f) (fun z hz => (hd z hz).hasDerivWithinAt) |> fun h => h
- id: circle_integral_uniform_limit
  kind: gap
  level: 2
  topic: 周回積分・一様収束と極限の交換
  statement: $R\geq 0$とする。円周$|z-c|=R$上で連続な関数列$F_n$が$f$に一様収束するならば、$\oint F_n\,dz\to\oint f\,dz$である。
