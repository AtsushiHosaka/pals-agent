      exact tendsto_cobounded_iff_meromorphicOrderAt_neg hf
- id: meromorphic_order_sign_and_limit
  kind: gap
  level: 3
  topic: 有理型関数・位数の符号と極限
  statement: $f$が$c$で有理型とする。$z\to c$($z\neq c$)で考えると、(1)$f$が有限の極限を持つことと$\operatorname{ord}_cf\geq 0$は同値であり、(2)$f$が$0$でない有限の極限を持つことと$\operatorname{ord}_cf=0$は同値であり、(3)$f\to 0$と$\operatorname{ord}_cf>0$は同値である($\infty>0$とする)。
