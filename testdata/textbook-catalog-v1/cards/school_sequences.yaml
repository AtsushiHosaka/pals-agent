  assumptions:
  - $(a_n),(b_k)$は実数列で、すべての$k\geq 1$について$b_k=a_{k+1}-a_k$をみたす
  - $n\geq 2$
  quantifiers:
  - 任意の実数列$(a_n),(b_k)$
  - 任意の自然数$n\geq 2$
  conclusion: $a_n=a_1+\sum_{k=1}^{n-1}b_k$が成り立つ。
  answer: |
    $(a_n)_{n\geq 1},(b_k)_{k\geq 1}$をすべての$k\geq 1$で$b_k=a_{k+1}-a_k$をみたす実数列とし、$n\geq 2$とする。
    $\sum_{k=1}^{n-1}b_k=\sum_{k=1}^{n-1}(a_{k+1}-a_k)$において、隣り合う項は$a_2$から$a_{n-1}$まで打ち消し合う。残るのは$a_n-a_1$である。よって$a_n=a_1+\sum_{k=1}^{n-1}b_k$である。
  strategy: Telescope the sum of differences up to n - 1.
  sketch:
  - 'translate: Replace b_k by a_{k+1} - a_k in the sum.'
  - 'derive: Adjacent terms cancel, leaving a_n - a_1.'
  - 'conclude: Move a_1 to the other side.'
  openmath: (forall (a b) (-> (forall (k) (-> (and (in k N) (>= k 1)) (= (seq_value b k) (- (seq_value a (+ k 1)) (seq_value a k))))) (forall (n) (-> (and (in n N) (>= n 2)) (= (seq_value a n) (+ (seq_value a 1) (sum (oriented_interval 1 (- n 1)) (lambda (k) (seq_value b k)))))))))
  hard_negative:
    statement: 階差数列$b_k$について$a_n=a_1+\sum_{k=1}^{n}b_k$である。
    reason: 和の上端が一つ多い。この右辺は$a_{n+1}$に等しく、$a_n=n,\ n=2$なら右辺は$3$、左辺は$2$である。
