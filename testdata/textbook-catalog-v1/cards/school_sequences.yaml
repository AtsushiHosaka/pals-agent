    ∀ (a : ℕ → ℝ) (p q : ℤ), (∃ z : ℤ, a 1 = z) → (∃ z : ℤ, a 2 = z) → (∀ n : ℕ, 1 ≤ n → a (n + 2) = (p : ℝ) * a (n + 1) + (q : ℝ) * a n) → ∀ n : ℕ, 1 ≤ n → ∃ z : ℤ, a n = z
  proof: |
    by
      intro a p q h1 h2 h
      have key : ∀ m : ℕ, (∃ z : ℤ, a (m + 1) = z) ∧ (∃ z : ℤ, a (m + 2) = z) := by
        intro m
        induction m with
        | zero => exact ⟨h1, h2⟩
        | succ m ih =>
          refine ⟨ih.2, ?_⟩
          obtain ⟨x, hx⟩ := ih.1
          obtain ⟨y, hy⟩ := ih.2
          refine ⟨p * y + q * x, ?_⟩
