  target: |
    ∀ (a b : ℤ) (n : ℕ), ∃ c : ℤ, a ^ n - b ^ n = (a - b) * c
  proof: |
    by
      intro a b n
      induction n with
      | zero => exact ⟨0, by simp⟩
      | succ n ih =>
        obtain ⟨c, hc⟩ := ih
        refine ⟨a * c + b ^ n, ?_⟩
