  assumptions:
  - $(a_n),(b_n)$は実数列
  - $F$は自然数と二つの実数から実数への関数で、すべての$n\geq 1$について$a_{n+2}=F(n,a_{n+1},a_n)$、$b_{n+2}=F(n,b_{n+1},b_n)$
  - $a_1=b_1$かつ$a_2=b_2$
  quantifiers:
  - 任意の実数列$(a_n),(b_n)$と関数$F$
  - 任意の自然数$n\geq 1$
  conclusion: $a_n=b_n$が成り立つ。
  answer: |
    $F$を自然数と二つの実数に実数を対応させる関数とする。$(a_n)_{n\geq 1},(b_n)_{n\geq 1}$をすべての$n\geq 1$で$a_{n+2}=F(n,a_{n+1},a_n)$、$b_{n+2}=F(n,b_{n+1},b_n)$をみたし、$a_1=b_1$、$a_2=b_2$である実数列とする。
    「$a_n=b_n$かつ$a_{n+1}=b_{n+1}$」を$n$についての帰納法で示す。$n=1$では仮定そのものである。$n$で成り立つとすると、$a_{n+2}=F(n,a_{n+1},a_n)=F(n,b_{n+1},b_n)=b_{n+2}$なので$n+1$でも成り立つ。
  strategy: Prove equality at two consecutive indices together by induction.
  sketch:
  - 'setup: Induct on the statement that a and b agree at n and n + 1.'
  - 'induction: The base case is the pair of initial conditions.'
  - 'derive: Equal inputs to F give a_{n+2} = b_{n+2}.'
  - 'conclude: The sequences agree at all n ≥ 1.'
  openmath: (forall (a b F) (-> (and (= (seq_value a 1) (seq_value b 1)) (= (seq_value a 2) (seq_value b 2)) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n 2)) (fn_value (fn_value (fn_value F n) (seq_value a (+ n 1))) (seq_value a n))))) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value b (+ n 2)) (fn_value (fn_value (fn_value F n) (seq_value b (+ n 1))) (seq_value b n)))))) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a n) (seq_value b n))))))
  hard_negative:
    statement: 三項間漸化式では初項だけが等しければ二つの数列は一致する。
    reason: $a_{n+2}=a_{n+1}$では$a_1=1,\ a_2=1$と$b_1=1,\ b_2=2$は初項が等しいが、$a_3=1,\ b_3=2$で異なる。第$2$項も必要である。
  target: |
    ∀ (a b : ℕ → ℝ) (F : ℕ → ℝ → ℝ → ℝ), a 1 = b 1 → a 2 = b 2 → (∀ n : ℕ, 1 ≤ n → a (n + 2) = F n (a (n + 1)) (a n)) → (∀ n : ℕ, 1 ≤ n → b (n + 2) = F n (b (n + 1)) (b n)) → ∀ n : ℕ, 1 ≤ n → a n = b n
  proof: |
    by
      intro a b F h1 h2 ha hb
      have key : ∀ m : ℕ, a (m + 1) = b (m + 1) ∧ a (m + 2) = b (m + 2) := by
        intro m
        induction m with
        | zero => exact ⟨h1, h2⟩
        | succ m ih =>
          refine ⟨ih.2, ?_⟩
          rw [ha (m + 1) (by omega), hb (m + 1) (by omega), show a (m + 1 + 1) = b (m + 1 + 1) from ih.2, ih.1]
      intro n hn
      obtain ⟨m, rfl⟩ : ∃ m, n = m + 1 := ⟨n - 1, by omega⟩
      exact (key m).1
