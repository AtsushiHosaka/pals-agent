- id: three_term_uniqueness
  kind: gap
  level: high
  topic: 隣接三項間漸化式・初項と第2項による決定
  statement: 同じ関数$F$について$a_{n+2}=F(n,a_{n+1},a_n)$、$b_{n+2}=F(n,b_{n+1},b_n)$をみたす数列が$a_1=b_1$、$a_2=b_2$をみたせば、すべての$n\geq 1$で$a_n=b_n$である。
