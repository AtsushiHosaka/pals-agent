- id: group_unique_block
  kind: gap
  level: high
  topic: 群数列・第N項の属する群（一般形）
  statement: 第$i$群の項数を$c_i\geq 1$とする群数列で、全体の第$N$項（$N\geq 1$）の属する群はただ一つ定まる。すなわち$\sum_{i=1}^{m-1}c_i<N\leq\sum_{i=1}^{m}c_i$をみたす$m\geq 1$がただ一つ存在する。
  statement_en: If c_i ≥ 1 for all i ≥ 1 and N ≥ 1, then there is exactly one m ≥ 1 such that the sum of c_i for 1 ≤ i ≤ m - 1 is less than N and N is at most the sum of c_i for 1 ≤ i ≤ m.
  assumptions:
  - $(c_i)$は自然数列で、すべての$i\geq 1$について$c_i\geq 1$
  - $N\geq 1$は自然数
  quantifiers:
  - 任意の自然数列$(c_i)$
  - 任意の自然数$N\geq 1$
  - ただ一つの自然数$m\geq 1$
  conclusion: $\sum_{i=1}^{m-1}c_i<N\leq\sum_{i=1}^{m}c_i$をみたす$m\geq 1$がただ一つ存在する。
  answer: |
    $(c_i)_{i\geq 1}$をすべての$i\geq 1$で$c_i\geq 1$をみたす自然数列とし、$N\geq 1$を自然数とする。$T_m=\sum_{i=1}^{m}c_i$とおく。$T_0=0$であり、$T_{m+1}\geq T_m+1$なので、$(T_m)$は狭義単調増加で$T_m\geq m$である。
