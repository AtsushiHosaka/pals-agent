  sketch:
  - 'induction: For n = 0 both sides vanish.'
  - 'derive: Adding the next difference cancels b_{n+1}.'
  - 'conclude: Only b_{n+2} - b_1 remains.'
  openmath: (forall (b n) (-> (in n N) (= (sum (oriented_interval 1 n) (lambda (k) (- (seq_value b (+ k 1)) (seq_value b k)))) (- (seq_value b (+ n 1)) (seq_value b 1)))))
  hard_negative:
    statement: $\sum_{k=1}^{n}(b_{k+2}-b_k)=b_{n+2}-b_1$である。
    reason: 差の間隔が$2$なら残る項は四つになる。正しくは$b_{n+2}+b_{n+1}-b_2-b_1$である。
