          push_cast
          ring
      intro n hn
      obtain ⟨m, rfl⟩ : ∃ m, n = m + 1 := ⟨n - 1, by omega⟩
      exact (key m).1
- id: two_step_induction
  kind: textbook
  level: high
  topic: 数学的帰納法・二つ前までを仮定する形
  statement: 述語$P$について、$P(1)$と$P(2)$が成り立ち、すべての$n\geq 1$で「$P(n)$かつ$P(n+1)$ならば$P(n+2)$」が成り立つならば、すべての$n\geq 1$で$P(n)$が成り立つ。
  statement_en: For a predicate P on the natural numbers, if P(1) and P(2) hold and P(n) and P(n+1) together imply P(n+2) for all n ≥ 1, then P(n) holds for all n ≥ 1.
  assumptions:
  - $P$は自然数上の述語
  - $P(1)$と$P(2)$が成り立つ
  - すべての$n\geq 1$で、$P(n)$かつ$P(n+1)$ならば$P(n+2)$
  quantifiers:
  - 任意の述語$P$
  - 任意の自然数$n\geq 1$
  conclusion: $P(n)$が成り立つ。
  answer: |
    $P$を自然数上の述語とし、$P(1)$と$P(2)$が成り立ち、すべての$n\geq 1$で「$P(n)$かつ$P(n+1)$ならば$P(n+2)$」が成り立つとする。$Q(n)$を「$P(n)$かつ$P(n+1)$」と定める。$Q(1)$は仮定から成り立つ。$Q(n)$が成り立つとすると、$P(n+1)$が成り立ち、仮定から$P(n+2)$も成り立つので、$Q(n+1)$が成り立つ。通常の帰納法によりすべての$n\geq 1$で$Q(n)$が成り立ち、特に$P(n)$が成り立つ。
  strategy: Apply ordinary induction to the conjunction of P(n) and P(n+1).
  sketch:
  - 'translate: Define Q(n) as P(n) and P(n+1).'
  - 'induction: Q(1) is the pair of base cases.'
  - 'derive: Q(n) implies Q(n+1) by the assumption.'
  - 'conclude: Q(n) holds for all n ≥ 1, so P(n) does.'
  openmath: (forall (S) (-> (and (in 1 S) (in 2 S) (forall (n) (-> (and (in n N) (>= n 1) (in n S) (in (+ n 1) S)) (in (+ n 2) S)))) (forall (n) (-> (and (in n N) (>= n 1)) (in n S)))))
  hard_negative:
    statement: $P(1)$が成り立ち、「$P(n)$かつ$P(n+1)$ならば$P(n+2)$」が成り立てば、$P(2)$を確かめなくてもすべての$n\geq 1$で$P(n)$が成り立つ。
    reason: $P(n)$を「$n=1$」とすると、$P(n)$かつ$P(n+1)$となる$n$がないので後半は成り立つが、$P(2)$は偽である。基底は二つ必要である。
  target: |
    ∀ P : ℕ → Prop, P 1 → P 2 → (∀ n : ℕ, 1 ≤ n → P n → P (n + 1) → P (n + 2)) → ∀ n : ℕ, 1 ≤ n → P n
  proof: |
    by
      intro P h1 h2 h
      have key : ∀ m : ℕ, P (m + 1) ∧ P (m + 2) := by
        intro m
        induction m with
        | zero => exact ⟨h1, h2⟩
        | succ m ih => exact ⟨ih.2, h (m + 1) (by omega) ih.1 ih.2⟩
      intro n hn
      obtain ⟨m, rfl⟩ : ∃ m, n = m + 1 := ⟨n - 1, by omega⟩
      exact (key m).1
- id: recur_invariant_interval
  kind: gap
  level: high
  topic: 数学的帰納法・漸化式の項の範囲
  statement: 関数$F$が区間$[l,u]$を自分自身の中へ写し、$a_1\in[l,u]$かつ$a_{n+1}=F(a_n)$ならば、すべての$n\geq 1$で$l\leq a_n\leq u$である。
  statement_en: If a function F satisfies l ≤ F(x) ≤ u whenever l ≤ x ≤ u, and l ≤ a_1 ≤ u and a_{n+1} = F(a_n) for all n ≥ 1, then l ≤ a_n ≤ u for all n ≥ 1.
  assumptions:
  - $F$は実数から実数への関数で、$l\leq x\leq u$ならば$l\leq F(x)\leq u$
  - $(a_n)$は実数列で$l\leq a_1\leq u$、すべての$n\geq 1$について$a_{n+1}=F(a_n)$
  quantifiers:
  - 任意の実数列$(a_n)$、関数$F$、実数$l,u$
  - 任意の自然数$n\geq 1$
  conclusion: $l\leq a_n\leq u$が成り立つ。
  answer: |
    $l,u$を実数、$F$を$l\leq x\leq u$なら$l\leq F(x)\leq u$となる関数とする。$(a_n)_{n\geq 1}$を$l\leq a_1\leq u$、すべての$n\geq 1$で$a_{n+1}=F(a_n)$をみたす実数列とする。$n$についての帰納法で示す。$n=1$は仮定である。$l\leq a_n\leq u$とすると、$F$の性質から$l\leq F(a_n)=a_{n+1}\leq u$である。
  strategy: Induct on n using the invariance of the interval under F.
  sketch:
  - 'induction: The base case is the assumption on a_1.'
  - 'derive: Applying F to a_n stays inside the interval.'
  - 'conclude: All terms lie in the interval.'
  openmath: (forall (a F l u) (-> (and (in l R) (in u R) (forall (x) (-> (and (in x R) (<= l x) (<= x u)) (and (<= l (fn_value F x)) (<= (fn_value F x) u)))) (<= l (seq_value a 1)) (<= (seq_value a 1) u) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n 1)) (fn_value F (seq_value a n)))))) (forall (n) (-> (and (in n N) (>= n 1)) (and (<= l (seq_value a n)) (<= (seq_value a n) u))))))
  hard_negative:
    statement: $a_1$が区間内にあり$F(a_1)$も区間内にあれば、すべての項は区間内にある。
    reason: $F(x)=2x$、区間$[0,1]$、$a_1=\dfrac{1}{2}$では$a_2=1$は区間内だが$a_3=2$は外に出る。区間全体が自分自身に写ることが必要である。
  target: |
    ∀ (a : ℕ → ℝ) (F : ℝ → ℝ) (l u : ℝ), (∀ x : ℝ, l ≤ x → x ≤ u → l ≤ F x ∧ F x ≤ u) → l ≤ a 1 → a 1 ≤ u → (∀ n : ℕ, 1 ≤ n → a (n + 1) = F (a n)) → ∀ n : ℕ, 1 ≤ n → l ≤ a n ∧ a n ≤ u
  proof: |
    by
      intro a F l u hF h1 h2 h n hn
      induction n, hn using Nat.le_induction with
      | base => exact ⟨h1, h2⟩
      | succ n hn ih =>
        rw [h n hn]
        exact hF (a n) ih.1 ih.2
- id: recur_inequality_geometric_bound
  kind: gap
  level: high
  topic: 数学的帰納法・漸化不等式
  statement: $r\geq 0$とし、すべての$n\geq 1$で$e_{n+1}\leq re_n$をみたす実数列について、$e_n\leq e_1r^{n-1}$が成り立つ。
  statement_en: If r ≥ 0 and a real sequence satisfies e_{n+1} ≤ r·e_n for all n ≥ 1, then e_n ≤ e_1·r^(n-1) for all n ≥ 1.
  assumptions:
  - $r$は実数で$r\geq 0$
  - $(e_n)$は実数列で、すべての$n\geq 1$について$e_{n+1}\leq re_n$をみたす
  quantifiers:
  - 任意の実数列$(e_n)$と実数$r\geq 0$
  - 任意の自然数$n\geq 1$
  conclusion: $e_n\leq e_1r^{n-1}$が成り立つ。
  answer: |
    $r\geq 0$を実数、$(e_n)_{n\geq 1}$をすべての$n\geq 1$で$e_{n+1}\leq re_n$をみたす実数列とする。$n$についての帰納法で示す。$n=1$のとき両辺は$e_1$である。$e_n\leq e_1r^{n-1}$と仮定する。$r\geq 0$なので両辺に$r$を掛けても向きは変わらず、$e_{n+1}\leq re_n\leq e_1r^{n}$である。
  strategy: Induct on n, multiplying the bound by the nonnegative r.
  sketch:
  - 'induction: For n = 1 both sides equal e_1.'
  - 'derive: Multiply the bound by r, using r ≥ 0.'
  - 'conclude: Combine with e_{n+1} ≤ r·e_n.'
  openmath: (forall (e r) (-> (and (in r R) (>= r 0) (forall (n) (-> (and (in n N) (>= n 1)) (<= (seq_value e (+ n 1)) (* r (seq_value e n)))))) (forall (n) (-> (and (in n N) (>= n 1)) (<= (seq_value e n) (* (seq_value e 1) (^ r (- n 1))))))))
  hard_negative:
    statement: $r<0$でも$e_{n+1}\leq re_n$から$e_n\leq e_1r^{n-1}$が導ける。
    reason: 負の数を掛けると不等号の向きが変わる。$r=-1,\ e_1=-1,\ e_2=-5,\ e_3=5$は$e_2\leq 1$、$e_3\leq 5$をみたすが、$e_3\leq e_1r^2=-1$は成り立たない。
  target: |
    ∀ (e : ℕ → ℝ) (r : ℝ), 0 ≤ r → (∀ n : ℕ, 1 ≤ n → e (n + 1) ≤ r * e n) → ∀ n : ℕ, 1 ≤ n → e n ≤ e 1 * r ^ (n - 1)
  proof: |
    by
      intro e r hr h
      have key : ∀ m : ℕ, e (m + 1) ≤ e 1 * r ^ m := by
        intro m
        induction m with
        | zero => simp
        | succ m ih =>
          calc e (m + 1 + 1) ≤ r * e (m + 1) := h (m + 1) (by omega)
            _ ≤ r * (e 1 * r ^ m) := mul_le_mul_of_nonneg_left ih hr
            _ = e 1 * r ^ (m + 1) := by ring
      intro n hn
      obtain ⟨m, rfl⟩ : ∃ m, n = m + 1 := ⟨n - 1, by omega⟩
      simpa using key m
- id: int_sub_dvd_pow_sub_pow
  kind: gap
  level: high
  topic: 数学的帰納法・整除の定型
  statement: 整数$a,b$と$0$以上の整数$n$について、$a-b$は$a^n-b^n$を割り切る。
  statement_en: For integers a, b and natural n, a - b divides a^n - b^n.
  assumptions:
  - $a,b$は整数
  - $n$は$0$以上の整数
  quantifiers:
  - 任意の整数$a,b$
  - 任意の$0$以上の整数$n$
  conclusion: ある整数$c$で$a^n-b^n=(a-b)c$となる。
  answer: |
    $a,b$を整数、$n$を$0$以上の整数とする。$n$についての帰納法で示す。$n=0$のとき$a^0-b^0=0$であり、$a-b$で割り切れる。$a^n-b^n=(a-b)c$となる整数$c$があるとすると、
    $a^{n+1}-b^{n+1}=a(a^n-b^n)+(a-b)b^n=(a-b)(ac+b^n)$
    であり、$n+1$でも割り切れる。
  strategy: Induct on n, splitting a^(n+1) - b^(n+1) into a(a^n - b^n) + (a - b)b^n.
  sketch:
  - 'induction: For n = 0 the difference is 0.'
  - 'derive: Write a^(n+1) - b^(n+1) as a(a^n - b^n) + (a - b)b^n.'
  - 'conclude: Both terms are divisible by a - b.'
  openmath: (forall (a b n) (-> (and (in a Z) (in b Z) (in n N)) (exists (c) (and (in c Z) (= (- (^ a n) (^ b n)) (* (- a b) c))))))
  hard_negative:
