  openmath: (forall (a p s t c e) (-> (and (in p R) (in s R) (in t R) (in c R) (in e R) (= c (+ (* p c) s)) (= (+ c e) (+ (* p e) t)) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n 1)) (+ (* p (seq_value a n)) (+ (* s n) t)))))) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a n) (+ (* (^ p (- n 1)) (- (- (seq_value a 1) c) e)) (+ (* c n) e)))))))
