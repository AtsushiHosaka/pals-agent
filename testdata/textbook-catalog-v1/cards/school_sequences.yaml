  - 'construct: Set B = (a_2 - α·a_1)/α^2 and A = a_1/α - B.'
  - 'derive: The formula holds for n = 1 and n = 2.'
  - 'induction: Assume the formula for n and n + 1.'
  - 'derive: Substitute into the recurrence and collect terms.'
  - 'conclude: The formula holds for all n ≥ 1.'
  openmath: (forall (a alpha) (-> (and (in alpha R) (!= alpha 0) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n 2)) (- (* (* 2 alpha) (seq_value a (+ n 1))) (* (^ alpha 2) (seq_value a n))))))) (exists (A B) (and (in A R) (in B R) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a n) (* (+ A (* B n)) (^ alpha n)))))))))
