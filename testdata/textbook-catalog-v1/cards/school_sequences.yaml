    statement: $a_1$だけが整数なら、整数係数の三項間漸化式の項はすべて整数である。
    reason: $a_{n+2}=a_{n+1}$で$a_1=1,\ a_2=\dfrac{1}{2}$とすると$a_3=\dfrac{1}{2}$である。初項だけでは足りず、$a_2$の仮定も必要である。
