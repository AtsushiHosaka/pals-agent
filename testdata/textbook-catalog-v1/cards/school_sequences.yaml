    ∀ (a b : ℕ → ℝ), (∀ k : ℕ, 1 ≤ k → b k = a (k + 1) - a k) → ∀ n : ℕ, 2 ≤ n → a n = a 1 + ∑ k ∈ Finset.Icc 1 (n - 1), b k
