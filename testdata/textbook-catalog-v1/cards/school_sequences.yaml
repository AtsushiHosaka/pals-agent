      simpa using key m
- id: partial_fraction_consecutive
  kind: gap
  level: high
  topic: 部分分数・隣接整数の積の逆数和（特殊形）
  statement: 隣り合う自然数の積の逆数という特殊形について、$\sum_{k=1}^{n}\dfrac{1}{k(k+1)}=\dfrac{n}{n+1}$が成り立つ。
  statement_en: 'Special form for consecutive integers: for natural n, the sum of 1/(k(k+1)) for 1 ≤ k ≤ n equals n/(n+1).'
  assumptions:
  - $n$は自然数
  quantifiers:
  - 任意の自然数$n$
  conclusion: $\sum_{k=1}^{n}\dfrac{1}{k(k+1)}=\dfrac{n}{n+1}$が成り立つ。
  answer: |
    $n$を自然数とする。$k\geq 1$について$\dfrac{1}{k(k+1)}=\dfrac{1}{k}-\dfrac{1}{k+1}$である。これを$k=1$から$n$まで加えると、隣り合う項が打ち消し合い、$1-\dfrac{1}{n+1}=\dfrac{n}{n+1}$が残る。
  strategy: Decompose into partial fractions and telescope.
  sketch:
  - 'derive: Write 1/(k(k+1)) as 1/k - 1/(k+1).'
  - 'derive: Summing from 1 to n cancels the middle terms.'
  - 'conclude: The sum is 1 - 1/(n+1) = n/(n+1).'
  openmath: (forall (n) (-> (in n N) (= (sum (oriented_interval 1 n) (lambda (k) (/ 1 (* k (+ k 1))))) (/ n (+ n 1)))))
  hard_negative:
    statement: 隣り合う奇数の積でも、この特殊形と同じく$\dfrac{1}{(2k-1)(2k+1)}=\dfrac{1}{2k-1}-\dfrac{1}{2k+1}$と分解できる。
    reason: 右辺は$\dfrac{2}{(2k-1)(2k+1)}$に等しいので、係数$\dfrac{1}{2}$が必要である。係数なしの分解は差が$1$の場合に限る。
  target: |
    ∀ n : ℕ, ∑ k ∈ Finset.Icc 1 n, 1 / ((k : ℝ) * ((k : ℝ) + 1)) = (n : ℝ) / ((n : ℝ) + 1)
  proof: |
    by
      intro n
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_Icc_succ_top (by omega), ih]
        have h1 : (n : ℝ) + 1 ≠ 0 := by positivity
        have h2 : (n : ℝ) + 1 + 1 ≠ 0 := by positivity
        push_cast
        field_simp
        ring
- id: partial_fraction_arith
  kind: gap
  level: high
  topic: 部分分数・等差数列の隣接項の積の逆数和（一般形）
  statement: 公差$d\neq 0$の等差数列$(c_k)_{k\geq 1}$の項がすべて$0$でないとき、$\sum_{k=1}^{n}\dfrac{1}{c_kc_{k+1}}=\dfrac{1}{d}\left(\dfrac{1}{c_1}-\dfrac{1}{c_{n+1}}\right)$が成り立つ。
  statement_en: If c_{k+1} = c_k + d with d ≠ 0 and c_k ≠ 0 for all k ≥ 1, then the sum of 1/(c_k c_{k+1}) for 1 ≤ k ≤ n equals (1/d)(1/c_1 - 1/c_{n+1}).
  assumptions:
  - $(c_k)$は実数列で、すべての$k\geq 1$について$c_{k+1}=c_k+d$かつ$c_k\neq 0$をみたす
  - $d\neq 0$
  - $n$は自然数
  quantifiers:
  - 任意の実数列$(c_k)$と実数$d\neq 0$
  - 任意の自然数$n$
  conclusion: $\sum_{k=1}^{n}\dfrac{1}{c_kc_{k+1}}=\dfrac{1}{d}\left(\dfrac{1}{c_1}-\dfrac{1}{c_{n+1}}\right)$が成り立つ。
  answer: |
    $d\neq 0$を実数、$(c_k)_{k\geq 1}$をすべての$k\geq 1$で$c_{k+1}=c_k+d$かつ$c_k\neq 0$をみたす実数列とし、$n$を自然数とする。各$k\geq 1$について、
    $\dfrac{1}{c_k}-\dfrac{1}{c_{k+1}}=\dfrac{c_{k+1}-c_k}{c_kc_{k+1}}=\dfrac{d}{c_kc_{k+1}}$
    であるから、$\dfrac{1}{c_kc_{k+1}}=\dfrac{1}{d}\left(\dfrac{1}{c_k}-\dfrac{1}{c_{k+1}}\right)$である。これを$k=1$から$n$まで加えると、隣り合う項が打ち消し合い、$\dfrac{1}{d}\left(\dfrac{1}{c_1}-\dfrac{1}{c_{n+1}}\right)$が残る。
  strategy: Write each term as a difference of reciprocals scaled by 1/d and telescope.
  sketch:
  - 'derive: Compute 1/c_k - 1/c_{k+1} = d/(c_k c_{k+1}).'
  - 'derive: Divide by d, which is nonzero.'
  - 'derive: Sum from 1 to n so that adjacent terms cancel.'
  - 'conclude: Only the first and last reciprocals remain.'
  openmath: (forall (c d) (-> (and (in d R) (!= d 0) (forall (k) (-> (and (in k N) (>= k 1)) (and (= (seq_value c (+ k 1)) (+ (seq_value c k) d)) (!= (seq_value c k) 0))))) (forall (n) (-> (in n N) (= (sum (oriented_interval 1 n) (lambda (k) (/ 1 (* (seq_value c k) (seq_value c (+ k 1)))))) (* (/ 1 d) (- (/ 1 (seq_value c 1)) (/ 1 (seq_value c (+ n 1))))))))))
  hard_negative:
    statement: 公差$d$によらず$\dfrac{1}{c_kc_{k+1}}=\dfrac{1}{c_k}-\dfrac{1}{c_{k+1}}$と分解できる。
    reason: 右辺は$\dfrac{d}{c_kc_{k+1}}$に等しいので、$d=1$のときしか成り立たない。一般には係数$\dfrac{1}{d}$が必要である。
  target: |
    ∀ (c : ℕ → ℝ) (d : ℝ), d ≠ 0 → (∀ k : ℕ, 1 ≤ k → c (k + 1) = c k + d) → (∀ k : ℕ, 1 ≤ k → c k ≠ 0) → ∀ n : ℕ, ∑ k ∈ Finset.Icc 1 n, 1 / (c k * c (k + 1)) = (1 / d) * (1 / c 1 - 1 / c (n + 1))
  proof: |
    by
      intro c d hd h hc n
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_Icc_succ_top (by omega), ih]
        have h0 := hc 1 (by omega)
        have h1 := hc (n + 1) (by omega)
        have h2 := hc (n + 1 + 1) (by omega)
        have e : c (n + 1 + 1) - c (n + 1) = d := by
          rw [h (n + 1) (by omega)]
          ring
        have t : 1 / (c (n + 1) * c (n + 1 + 1)) = (1 / d) * (1 / c (n + 1) - 1 / c (n + 1 + 1)) := by
          field_simp
          linarith
        rw [t]
        ring
- id: telescoping_sqrt_rationalize
  kind: gap
  level: high
  topic: 数列の和・分母の有理化
  statement: 自然数$n$について、$\sum_{k=1}^{n}\dfrac{1}{\sqrt{k}+\sqrt{k+1}}=\sqrt{n+1}-1$が成り立つ。これは公差$1$の等差数列$c_k=k$についての特殊形である。
  statement_en: For natural n, the sum of 1/(√k + √(k+1)) for 1 ≤ k ≤ n equals √(n+1) - 1.
  assumptions:
  - $n$は自然数
  quantifiers:
  - 任意の自然数$n$
  conclusion: $\sum_{k=1}^{n}\dfrac{1}{\sqrt{k}+\sqrt{k+1}}=\sqrt{n+1}-1$が成り立つ。
  answer: |
    $n$を自然数とする。$k\geq 1$について、$(\sqrt{k+1}-\sqrt{k})(\sqrt{k+1}+\sqrt{k})=(k+1)-k=1$であり、$\sqrt{k+1}+\sqrt{k}>0$なので、$\dfrac{1}{\sqrt{k}+\sqrt{k+1}}=\sqrt{k+1}-\sqrt{k}$である。これを$k=1$から$n$まで加えると、隣り合う項が打ち消し合い、$\sqrt{n+1}-\sqrt{1}=\sqrt{n+1}-1$が残る。
  strategy: Rationalize each denominator and telescope.
  sketch:
  - 'derive: Multiply √(k+1) - √k by √(k+1) + √k to get 1.'
  - 'derive: Hence each term equals √(k+1) - √k.'
  - 'conclude: The sum telescopes to √(n+1) - 1.'
  openmath: (forall (n) (-> (in n N) (= (sum (oriented_interval 1 n) (lambda (k) (/ 1 (+ (root k 2) (root (+ k 1) 2))))) (- (root (+ n 1) 2) 1))))
  hard_negative:
    statement: $\sum_{k=1}^{n}\dfrac{1}{\sqrt{k}+\sqrt{k+2}}=\sqrt{n+2}-1$である。
    reason: $\sqrt{k+2}$と$\sqrt{k}$の平方の差は$2$なので係数$\dfrac{1}{2}$が付き、残る項も四つになる。$n=1$では左辺は$\dfrac{1}{1+\sqrt{3}}$、右辺は$\sqrt{3}-1$で一致しない。
  target: |
    ∀ n : ℕ, ∑ k ∈ Finset.Icc 1 n, 1 / (Real.sqrt (k : ℝ) + Real.sqrt ((k : ℝ) + 1)) = Real.sqrt ((n : ℝ) + 1) - 1
  proof: |
    by
      intro n
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_Icc_succ_top (by omega), ih]
        push_cast
        have hx : (0 : ℝ) ≤ (n : ℝ) + 1 := by positivity
        have hy : (0 : ℝ) ≤ (n : ℝ) + 1 + 1 := by positivity
        have sx := Real.sq_sqrt hx
        have sy := Real.sq_sqrt hy
        have px : 0 < Real.sqrt ((n : ℝ) + 1) := Real.sqrt_pos.mpr (by positivity)
        have py : 0 < Real.sqrt ((n : ℝ) + 1 + 1) := Real.sqrt_pos.mpr (by positivity)
        have ne : Real.sqrt ((n : ℝ) + 1) + Real.sqrt ((n : ℝ) + 1 + 1) ≠ 0 := by positivity
        have t : 1 / (Real.sqrt ((n : ℝ) + 1) + Real.sqrt ((n : ℝ) + 1 + 1)) = Real.sqrt ((n : ℝ) + 1 + 1) - Real.sqrt ((n : ℝ) + 1) := by
          field_simp
          nlinarith
        rw [t]
        ring
- id: term_from_partial_sum
  kind: textbook
  level: high
  topic: 和と一般項・差をとる
  statement: 数列$(a_n)_{n\geq 1}$の初項から第$n$項までの和を$S_n$とすると、$a_1=S_1$であり、$n\geq 2$のとき$a_n=S_n-S_{n-1}$である。
  statement_en: If S_n is the sum of a_k for 1 ≤ k ≤ n for all n ≥ 1, then S_1 = a_1 and a_n = S_n - S_{n-1} for all n ≥ 2.
  assumptions:
  - $(a_n),(S_n)$は実数列で、すべての$n\geq 1$について$S_n=\sum_{k=1}^{n}a_k$をみたす
  quantifiers:
  - 任意の実数列$(a_n),(S_n)$
  - 任意の自然数$n\geq 2$
  conclusion: $S_1=a_1$であり、$n\geq 2$で$a_n=S_n-S_{n-1}$が成り立つ。
  answer: |
    $(a_n)_{n\geq 1},(S_n)_{n\geq 1}$をすべての$n\geq 1$で$S_n=\sum_{k=1}^{n}a_k$をみたす実数列とする。$n=1$とすれば$S_1=a_1$である。$n\geq 2$のとき$n-1\geq 1$なので$S_{n-1}=\sum_{k=1}^{n-1}a_k$である。$S_n$はこれに$a_n$を加えたものなので、$S_n-S_{n-1}=a_n$である。
  strategy: The sum up to n differs from the sum up to n - 1 by the last term.
  sketch:
  - 'derive: Taking n = 1 gives S_1 = a_1.'
  - 'derive: For n ≥ 2, S_n = S_{n-1} + a_n.'
  - 'conclude: Subtract S_{n-1}.'
  openmath: (forall (a S) (-> (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value S n) (sum (oriented_interval 1 n) (lambda (k) (seq_value a k)))))) (and (= (seq_value S 1) (seq_value a 1)) (forall (n) (-> (and (in n N) (>= n 2)) (= (seq_value a n) (- (seq_value S n) (seq_value S (- n 1)))))))))
  hard_negative:
    statement: $S_n$の式から$n\geq 2$で求めた$a_n$の式は、$n=1$でもそのまま成り立つ。
    reason: $S_n=n^2+1$では$n\geq 2$で$a_n=2n-1$だが、$a_1=S_1=2$であり、$2n-1$の$n=1$での値$1$と一致しない。$n=1$は別に確かめる必要がある。
  target: |
    ∀ (a S : ℕ → ℝ), (∀ n : ℕ, 1 ≤ n → S n = ∑ k ∈ Finset.Icc 1 n, a k) → S 1 = a 1 ∧ ∀ n : ℕ, 2 ≤ n → a n = S n - S (n - 1)
  proof: |
    by
      intro a S h
      constructor
      · rw [h 1 le_rfl]
        simp
      · intro n hn
        obtain ⟨m, rfl⟩ : ∃ m, n = m + 1 := ⟨n - 1, by omega⟩
        rw [Nat.add_sub_cancel, h (m + 1) (by omega), h m (by omega), Finset.sum_Icc_succ_top (by omega)]
        ring
- id: quadratic_sum_arith_iff
  kind: gap
  level: high
  topic: 和と一般項・定数項と等差数列
  statement: 初項から第$n$項までの和が$\sum_{k=1}^{n}a_k=pn^2+qn+r$で与えられる数列$(a_n)_{n\geq 1}$が等差数列であるための必要十分条件は$r=0$である。
  statement_en: If the sum of a_k for 1 ≤ k ≤ n equals p·n^2 + q·n + r for all n ≥ 1, then the sequence a is arithmetic, meaning a_{n+1} = a_n + d for all n ≥ 1 for some real d, if and only if r = 0.
  assumptions:
  - $(a_n)$は実数列
  - $p,q,r$は実数で、すべての$n\geq 1$について$\sum_{k=1}^{n}a_k=pn^2+qn+r$をみたす
  quantifiers:
  - 任意の実数列$(a_n)$と実数$p,q,r$
  conclusion: ある$d$ですべての$n\geq 1$について$a_{n+1}=a_n+d$となることと$r=0$は同値である。
  answer: |
    $p,q,r$を実数とし、$(a_n)_{n\geq 1}$をすべての$n\geq 1$で$\sum_{k=1}^{n}a_k=pn^2+qn+r$をみたす実数列とする。$n=1$とすれば$a_1=p+q+r$である。$m\geq 1$について、$m+1$と$m$の場合の差をとると、$a_{m+1}=p\{(m+1)^2-m^2\}+q=p(2m+1)+q$である。
    数列が公差$d$の等差数列であるとする。$a_2=3p+q,\ a_3=5p+q$より$d=a_3-a_2=2p$である。さらに$d=a_2-a_1=2p-r$であるから$r=0$となる。
    逆に$r=0$とする。$a_1=p+q$であり、これは$a_{m+1}=p(2m+1)+q$で$m=0$とした値に等しい。よって$a_2-a_1=2p$であり、$m\geq 1$についても$a_{m+2}-a_{m+1}=2p$である。したがって公差$2p$の等差数列である。
  strategy: Compute the terms by subtracting consecutive sums and compare a_2 - a_1 with a_3 - a_2.
  sketch:
  - 'derive: a_1 = p + q + r.'
  - 'derive: For m ≥ 1, subtraction gives a_{m+1} = p(2m+1) + q.'
  - 'derive: If the sequence is arithmetic then a_3 - a_2 = a_2 - a_1, which forces r = 0.'
  - 'derive: If r = 0 then every consecutive difference equals 2p.'
  - 'conclude: The sequence is arithmetic exactly when r = 0.'
  openmath: (forall (a p q r) (-> (and (in p R) (in q R) (in r R) (forall (n) (-> (and (in n N) (>= n 1)) (= (sum (oriented_interval 1 n) (lambda (k) (seq_value a k))) (+ (* p (^ n 2)) (+ (* q n) r)))))) (<-> (exists (d) (and (in d R) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n 1)) (+ (seq_value a n) d)))))) (= r 0))))
  hard_negative:
    statement: 和が$n$の二次式で表されれば、定数項によらず数列は初項から等差数列である。
    reason: $\sum_{k=1}^{n}a_k=n^2+1$では$a_1=2,\ a_2=3,\ a_3=5$であり、差は$1,2$と一定でない。等差になるのは第$2$項以降だけである。
  target: |
    ∀ (a : ℕ → ℝ) (p q r : ℝ), (∀ n : ℕ, 1 ≤ n → ∑ k ∈ Finset.Icc 1 n, a k = p * (n : ℝ) ^ 2 + q * (n : ℝ) + r) → ((∃ d : ℝ, ∀ n : ℕ, 1 ≤ n → a (n + 1) = a n + d) ↔ r = 0)
  proof: |
    by
      intro a p q r h
      have h1 : a 1 = p + q + r := by
        have e := h 1 le_rfl
        rw [Finset.Icc_self, Finset.sum_singleton] at e
        rw [e]
        push_cast
        ring
      have key : ∀ m : ℕ, 1 ≤ m → a (m + 1) = p * (2 * (m : ℝ) + 1) + q := by
        intro m hm
        have e1 := h (m + 1) (by omega)
        rw [Finset.sum_Icc_succ_top (by omega), h m hm] at e1
        push_cast at e1
        linear_combination e1
      constructor
      · rintro ⟨d, hd⟩
        have e1 := hd 1 le_rfl
        have e2 := hd 2 (by norm_num)
        have k1 := key 1 le_rfl
        have k2 := key 2 (by norm_num)
        norm_num at e1 e2 k1 k2
        linarith
      · intro hr
        refine ⟨2 * p, ?_⟩
        intro n hn
        obtain ⟨m, rfl⟩ : ∃ m, n = m + 1 := ⟨n - 1, by omega⟩
        rcases Nat.eq_zero_or_pos m with rfl | hm
        · have k1 := key 1 le_rfl
          norm_num at k1 ⊢
          rw [k1, h1, hr]
          ring
        · rw [key (m + 1) (by omega), key m hm]
          push_cast
          ring
- id: sum_linear_in_term_ratio
  kind: gap
  level: high
  topic: 和と一般項・和が項の一次式の場合
  statement: $p\neq 1$とし、数列$(a_n)_{n\geq 1}$の和がすべての$n\geq 1$で$\sum_{k=1}^{n}a_k=pa_n+q$をみたすならば、$a_1=\dfrac{q}{1-p}$であり、$a_{n+1}=\dfrac{p}{p-1}a_n$である。
  statement_en: If p ≠ 1 and the sum of a_k for 1 ≤ k ≤ n equals p·a_n + q for all n ≥ 1, then a_1 = q/(1-p) and a_{n+1} = (p/(p-1))·a_n for all n ≥ 1.
  assumptions:
