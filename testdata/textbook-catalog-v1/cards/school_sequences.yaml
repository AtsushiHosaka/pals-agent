- id: arith_general_term
  kind: textbook
  level: high
  topic: 等差数列・一般項
  statement: 初項$a_1$、公差$d$の等差数列$(a_n)_{n\geq 1}$の一般項は$a_n=a_1+(n-1)d$である。
  statement_en: If a real sequence satisfies a_{n+1} = a_n + d for all n ≥ 1, then a_n = a_1 + (n-1)d for all n ≥ 1.
  assumptions:
  - $(a_n)$は実数列で、すべての$n\geq 1$について$a_{n+1}=a_n+d$をみたす
  quantifiers:
  - 任意の実数列$(a_n)$と実数$d$
  - 任意の自然数$n\geq 1$
  conclusion: $a_n=a_1+(n-1)d$が成り立つ。
  answer: |
    $d$を実数とし、$(a_n)_{n\geq 1}$をすべての$n\geq 1$で$a_{n+1}=a_n+d$をみたす実数列とする。$n$についての帰納法で$a_n=a_1+(n-1)d$を示す。
    $n=1$のとき右辺は$a_1$なので成り立つ。ある$n\geq 1$で成り立つと仮定すると、$a_{n+1}=a_n+d=a_1+(n-1)d+d=a_1+nd$となり、$n+1$でも成り立つ。
  strategy: Induct on n starting from n = 1 and add d at each step.
  sketch:
  - 'induction: Check n = 1, where the formula reads a_1 = a_1.'
  - 'derive: Assume the formula for n and add d using the recurrence.'
  - 'conclude: The formula holds for all n ≥ 1.'
  openmath: (forall (a d) (-> (and (in d R) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n 1)) (+ (seq_value a n) d))))) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a n) (+ (seq_value a 1) (* (- n 1) d)))))))
  hard_negative:
    statement: 公差$d$の等差数列では$a_n=a_1+nd$である。
    reason: $n=1$とすると$a_1=a_1+d$となり、$d\neq 0$のとき成り立たない。初項からの増分は$n-1$回分である。
  target: |
    ∀ (a : ℕ → ℝ) (d : ℝ), (∀ n : ℕ, 1 ≤ n → a (n + 1) = a n + d) → ∀ n : ℕ, 1 ≤ n → a n = a 1 + ((n : ℝ) - 1) * d
  proof: |
    by
      intro a d h n hn
      induction n, hn using Nat.le_induction with
      | base => simp
      | succ n hn ih =>
        rw [h n hn, ih]
        push_cast
        ring
- id: arith_sum_first_last
  kind: textbook
  level: high
  topic: 等差数列・和（初項と末項）
  statement: 等差数列$(a_n)_{n\geq 1}$の初項から第$n$項までの和は、初項と末項を用いて$\dfrac{n(a_1+a_n)}{2}$と表される。
  statement_en: If a real sequence satisfies a_{n+1} = a_n + d for all n ≥ 1, then the sum of a_k for 1 ≤ k ≤ n equals n(a_1 + a_n)/2 for all n ≥ 1.
  assumptions:
  - $(a_n)$は実数列で、すべての$n\geq 1$について$a_{n+1}=a_n+d$をみたす
  quantifiers:
  - 任意の実数列$(a_n)$と実数$d$
  - 任意の自然数$n\geq 1$
  conclusion: $\sum_{k=1}^{n}a_k=\dfrac{n(a_1+a_n)}{2}$が成り立つ。
  answer: |
    $d$を実数とし、$(a_n)_{n\geq 1}$をすべての$n\geq 1$で$a_{n+1}=a_n+d$をみたす実数列とする。まず帰納法により、すべての$m\geq 1$で$a_m=a_1+(m-1)d$である。
    和の公式を$n$についての帰納法で示す。$n=1$のとき両辺は$a_1$である。ある$n\geq 1$で成り立つと仮定すると、
    $\sum_{k=1}^{n+1}a_k=\dfrac{n(a_1+a_n)}{2}+a_{n+1}=\dfrac{n(2a_1+(n-1)d)}{2}+a_1+nd=\dfrac{(n+1)(2a_1+nd)}{2}=\dfrac{(n+1)(a_1+a_{n+1})}{2}$
    となり、$n+1$でも成り立つ。
  strategy: Use the general term and induct on n.
  sketch:
  - 'derive: Obtain a_m = a_1 + (m-1)d for all m ≥ 1 by induction.'
  - 'induction: Check n = 1, where both sides equal a_1.'
  - 'derive: Add a_{n+1} to the formula for n and rewrite with the general term.'
  - 'conclude: Simplify to (n+1)(a_1 + a_{n+1})/2.'
  openmath: (forall (a d) (-> (and (in d R) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n 1)) (+ (seq_value a n) d))))) (forall (n) (-> (and (in n N) (>= n 1)) (= (sum (oriented_interval 1 n) (lambda (k) (seq_value a k))) (/ (* n (+ (seq_value a 1) (seq_value a n))) 2))))))
  hard_negative:
    statement: 任意の実数列について、$\sum_{k=1}^{n}a_k=\dfrac{n(a_1+a_n)}{2}$が成り立つ。
    reason: 等差数列でなければ成り立たない。$a_1=0,\ a_2=1,\ a_3=0$では$n=3$の左辺は$1$、右辺は$0$である。
  target: |
    ∀ (a : ℕ → ℝ) (d : ℝ), (∀ n : ℕ, 1 ≤ n → a (n + 1) = a n + d) → ∀ n : ℕ, 1 ≤ n → ∑ k ∈ Finset.Icc 1 n, a k = (n : ℝ) * (a 1 + a n) / 2
  proof: |
    by
      intro a d h n hn
      have key : ∀ m : ℕ, 1 ≤ m → a m = a 1 + ((m : ℝ) - 1) * d := by
        intro m hm
        induction m, hm using Nat.le_induction with
        | base => simp
        | succ m hm ih =>
          rw [h m hm, ih]
          push_cast
          ring
      induction n, hn using Nat.le_induction with
      | base =>
        rw [Finset.Icc_self, Finset.sum_singleton]
        push_cast
        ring
      | succ n hn ih =>
        rw [Finset.sum_Icc_succ_top (by omega), ih, key n hn, key (n + 1) (by omega)]
        push_cast
        ring
- id: arith_sum_first_diff
  kind: textbook
  level: high
  topic: 等差数列・和（初項と公差）
  statement: 初項$a$、公差$d$の等差数列の初項から第$n$項までの和は$\dfrac{n\{2a+(n-1)d\}}{2}$である。
  statement_en: For real a, d and natural n, the sum of a + (k-1)d for 1 ≤ k ≤ n equals n(2a + (n-1)d)/2.
  assumptions:
  - $a,d$は実数
  - $n$は$0$以上の整数
  quantifiers:
  - 任意の実数$a,d$
  - 任意の$0$以上の整数$n$
  conclusion: $\sum_{k=1}^{n}\{a+(k-1)d\}=\dfrac{n\{2a+(n-1)d\}}{2}$が成り立つ。
  answer: |
    $a,d$を実数とし、$n$を$0$以上の整数とする。$n$についての帰納法で示す。$n=0$のとき両辺は$0$である。ある$n$で成り立つと仮定すると、
    $\sum_{k=1}^{n+1}\{a+(k-1)d\}=\dfrac{n\{2a+(n-1)d\}}{2}+a+nd=\dfrac{(n+1)(2a+nd)}{2}$
    である。最後の等号は両辺を展開すれば確かめられる。よって$n+1$でも成り立つ。
  strategy: Induct on n and add the next term a + nd.
  sketch:
  - 'induction: For n = 0 both sides vanish.'
  - 'derive: Add a + nd to the formula for n.'
  - 'conclude: Expand both sides to obtain the formula for n + 1.'
  openmath: (forall (a d n) (-> (and (in a R) (in d R) (in n N)) (= (sum (oriented_interval 1 n) (lambda (k) (+ a (* (- k 1) d)))) (/ (* n (+ (* 2 a) (* (- n 1) d))) 2))))
  hard_negative:
    statement: 初項$a$、公差$d$の等差数列の和は$\dfrac{n(2a+nd)}{2}$である。
    reason: $n=1$のとき左辺は$a$、右辺は$a+\dfrac{d}{2}$であり、$d\neq 0$なら一致しない。正しくは$nd$ではなく$(n-1)d$である。
  target: |
    ∀ (a d : ℝ) (n : ℕ), ∑ k ∈ Finset.Icc 1 n, (a + ((k : ℝ) - 1) * d) = (n : ℝ) * (2 * a + ((n : ℝ) - 1) * d) / 2
  proof: |
    by
      intro a d n
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_Icc_succ_top (by omega), ih]
        push_cast
        ring
- id: arith_mean_iff
  kind: gap
  level: high
  topic: 等差数列・等差中項
  statement: 実数$a,b,c$がこの順に等差数列をなすことと、$2b=a+c$が成り立つことは同値である。
  statement_en: Real numbers a, b, c form an arithmetic progression in this order, that is, b = a + d and c = b + d for some real d, if and only if 2b = a + c.
  assumptions:
  - $a,b,c$は実数
  quantifiers:
  - 任意の実数$a,b,c$
  conclusion: ある実数$d$で$b=a+d,\ c=b+d$となることと$2b=a+c$は同値である。
  answer: |
    $a,b,c$を実数とする。ある実数$d$で$b=a+d$、$c=b+d$が成り立つとする。このとき$a+c=(b-d)+(b+d)=2b$である。
    逆に$2b=a+c$とし、$d=b-a$とおく。$b=a+d$は定義から成り立ち、$b+d=2b-a=c$である。
  strategy: Eliminate d in one direction and take d = b - a in the other.
  sketch:
  - 'derive: From b = a + d and c = b + d obtain a + c = 2b.'
  - 'construct: Conversely set d = b - a.'
  - 'conclude: Check c = b + d from 2b = a + c.'
  openmath: (forall (a b c) (-> (and (in a R) (in b R) (in c R)) (<-> (exists (d) (and (in d R) (= b (+ a d)) (= c (+ b d)))) (= (* 2 b) (+ a c)))))
  hard_negative:
    statement: $2b=a+c$ならば、$a,c,b$もこの順に等差数列をなす。
    reason: $a=0,\ b=1,\ c=2$は$2b=a+c$をみたすが、$0,2,1$は等差数列でない。条件は並ぶ順序に依存する。
  target: |
    ∀ (a b c : ℝ), (∃ d : ℝ, b = a + d ∧ c = b + d) ↔ 2 * b = a + c
  proof: |
    by
      intro a b c
      constructor
      · rintro ⟨d, h1, h2⟩
        linarith
      · intro h
        exact ⟨b - a, by ring, by linarith⟩
- id: arith_iff_linear_term
  kind: gap
  level: high
  topic: 等差数列・一次式による特徴付け
  statement: 数列$(a_n)_{n\geq 1}$が等差数列であることと、一般項が$n$の高々一次式$a_n=pn+q$で表されることは同値である。
  statement_en: A real sequence satisfies a_{n+1} = a_n + d for all n ≥ 1 for some real d if and only if a_n = p·n + q for all n ≥ 1 for some real p and q.
  assumptions:
  - $(a_n)$は実数列
  quantifiers:
  - 任意の実数列$(a_n)$
  conclusion: ある$d$ですべての$n\geq 1$について$a_{n+1}=a_n+d$となることと、ある$p,q$ですべての$n\geq 1$について$a_n=pn+q$となることは同値である。
  answer: |
    $(a_n)_{n\geq 1}$を実数列とする。すべての$n\geq 1$で$a_{n+1}=a_n+d$とする。$p=d,\ q=a_1-d$とおき、$a_n=pn+q$を帰納法で示す。$n=1$では$p+q=a_1$である。$a_n=pn+q$なら$a_{n+1}=pn+q+d=p(n+1)+q$である。
    逆にすべての$n\geq 1$で$a_n=pn+q$とする。$d=p$とおくと$a_{n+1}-a_n=p(n+1)+q-(pn+q)=d$である。
  strategy: Choose p = d and q = a_1 - d for one direction, and subtract consecutive values for the other.
  sketch:
  - 'construct: Given d, set p = d and q = a_1 - d.'
  - 'induction: Prove a_n = p·n + q from n = 1.'
  - 'derive: Given p and q, compute a_{n+1} - a_n = p.'
  - 'conclude: The two descriptions are equivalent.'
  openmath: (forall (a) (<-> (exists (d) (and (in d R) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n 1)) (+ (seq_value a n) d)))))) (exists (p q) (and (in p R) (in q R) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a n) (+ (* p n) q))))))))
  hard_negative:
    statement: 一般項が$n$の二次式$a_n=pn^2+qn+r$である数列も等差数列である。
    reason: $a_n=n^2$では$a_2-a_1=3,\ a_3-a_2=5$であり、隣り合う項の差が一定でない。二次式になるのは等差数列の和のほうである。
  target: |
    ∀ (a : ℕ → ℝ), (∃ d : ℝ, ∀ n : ℕ, 1 ≤ n → a (n + 1) = a n + d) ↔ ∃ p q : ℝ, ∀ n : ℕ, 1 ≤ n → a n = p * (n : ℝ) + q
  proof: |
    by
      intro a
      constructor
      · rintro ⟨d, h⟩
        refine ⟨d, a 1 - d, ?_⟩
        intro n hn
        induction n, hn using Nat.le_induction with
        | base =>
          push_cast
          ring
        | succ n hn ih =>
          rw [h n hn, ih]
          push_cast
          ring
      · rintro ⟨p, q, h⟩
        refine ⟨p, ?_⟩
        intro n hn
        rw [h (n + 1) (by omega), h n hn]
        push_cast
        ring
- id: arith_sum_max_at_sign_change
  kind: gap
  level: high
  topic: 等差数列・和の最大
  statement: 公差が負の等差数列$(a_n)_{n\geq 1}$で$a_k\geq 0$かつ$a_{k+1}\leq 0$となる$k\geq 1$があれば、初項からの和$S_n$は$n=k$で最大となる。
  statement_en: If a real sequence satisfies a_{n+1} = a_n + d for all n ≥ 1 with d < 0, and a_k ≥ 0 and a_{k+1} ≤ 0 for some k ≥ 1, then the partial sum S_n of a_1, ..., a_n satisfies S_n ≤ S_k for all n ≥ 1.
  assumptions:
  - $(a_n)$は実数列で、すべての$n\geq 1$について$a_{n+1}=a_n+d$をみたす
  - $d<0$
  - $k\geq 1$で$a_k\geq 0$かつ$a_{k+1}\leq 0$
  quantifiers:
  - 任意の実数列$(a_n)$、実数$d$、自然数$k$
  - 任意の自然数$n\geq 1$
  conclusion: $\sum_{i=1}^{n}a_i\leq\sum_{i=1}^{k}a_i$が成り立つ。
  answer: |
    $d<0$とし、$(a_n)_{n\geq 1}$をすべての$n\geq 1$で$a_{n+1}=a_n+d$をみたす実数列とする。$k\geq 1$で$a_k\geq 0$、$a_{k+1}\leq 0$とし、$S_n=\sum_{i=1}^{n}a_i$とおく。
    $d<0$より数列は減少するので、$1\leq i\leq k$なら$a_i\geq a_k\geq 0$であり、$i\geq k+1$なら$a_i\leq a_{k+1}\leq 0$である。
    $n\leq k$のとき、$S_k-S_n=\sum_{i=n+1}^{k}a_i\geq 0$である。$n\geq k$のとき、$S_n-S_k=\sum_{i=k+1}^{n}a_i\leq 0$である。どちらの場合も$S_n\leq S_k$である。
  strategy: Use monotonicity to fix the sign of each term on both sides of k and compare the partial sums.
  sketch:
  - 'derive: Since d < 0, a_i ≥ a_k ≥ 0 for 1 ≤ i ≤ k.'
  - 'derive: Likewise a_i ≤ a_{k+1} ≤ 0 for i ≥ k + 1.'
  - 'case_split: For n ≤ k the difference S_k - S_n is a sum of nonnegative terms.'
  - 'case_split: For n ≥ k the difference S_n - S_k is a sum of nonpositive terms.'
  - 'conclude: In both cases S_n ≤ S_k.'
  openmath: (forall (a d k) (-> (and (in d R) (< d 0) (in k N) (>= k 1) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n 1)) (+ (seq_value a n) d)))) (>= (seq_value a k) 0) (<= (seq_value a (+ k 1)) 0)) (forall (n) (-> (and (in n N) (>= n 1)) (<= (sum (oriented_interval 1 n) (lambda (i) (seq_value a i))) (sum (oriented_interval 1 k) (lambda (i) (seq_value a i))))))))
  hard_negative:
    statement: 公差が正の等差数列でも、$a_k\leq 0$かつ$a_{k+1}\geq 0$となる$k$で和$S_n$は最大となる。
    reason: 公差が正なら$a_i>0$の項を加え続けて和は増えるので、最大は存在しない。このとき$n=k$は和の最小を与える。
  target: |
    ∀ (a : ℕ → ℝ) (d : ℝ) (k : ℕ), d < 0 → (∀ n : ℕ, 1 ≤ n → a (n + 1) = a n + d) → 1 ≤ k → 0 ≤ a k → a (k + 1) ≤ 0 → ∀ n : ℕ, 1 ≤ n → ∑ i ∈ Finset.Icc 1 n, a i ≤ ∑ i ∈ Finset.Icc 1 k, a i
  proof: |
    by
      intro a d k hd h hk hak hak1 n hn
      have nonneg : ∀ j i : ℕ, 1 ≤ i → i + j = k → 0 ≤ a i := by
        intro j
        induction j with
        | zero =>
          intro i _ hi
          have e : i = k := by omega
          rw [e]
          exact hak
        | succ j ih =>
          intro i hi hij
          have h1 := ih (i + 1) (by omega) (by omega)
          rw [h i hi] at h1
          linarith
      have nonpos : ∀ m : ℕ, k ≤ m → a (m + 1) ≤ 0 := by
        intro m hm
        induction m, hm using Nat.le_induction with
        | base => exact hak1
        | succ m hm ih =>
          rw [h (m + 1) (by omega)]
          linarith
      rcases le_total n k with hnk | hkn
      · apply Finset.sum_le_sum_of_subset_of_nonneg
        · exact Finset.Icc_subset_Icc_right hnk
        · intro i hi _
          rw [Finset.mem_Icc] at hi
          exact nonneg (k - i) i hi.1 (by omega)
      · clear hn
        induction n, hkn using Nat.le_induction with
        | base => exact le_rfl
        | succ m hm ih =>
          rw [Finset.sum_Icc_succ_top (by omega)]
          have h1 := nonpos m hm
          linarith
- id: arith_symmetric_pair
  kind: gap
  level: high
  topic: 等差数列・両端から等距離の項の和
  statement: 等差数列$(a_n)_{n\geq 1}$と$1\leq k\leq n$について、$a_k+a_{n+1-k}=a_1+a_n$が成り立つ。
  statement_en: If a real sequence satisfies a_{n+1} = a_n + d for all n ≥ 1, then a_k + a_{n+1-k} = a_1 + a_n whenever 1 ≤ k ≤ n.
  assumptions:
  - $(a_n)$は実数列で、すべての$n\geq 1$について$a_{n+1}=a_n+d$をみたす
  - $1\leq k\leq n$
  quantifiers:
  - 任意の実数列$(a_n)$と実数$d$
  - $1\leq k\leq n$をみたす任意の自然数$k,n$
  conclusion: $a_k+a_{n+1-k}=a_1+a_n$が成り立つ。
  answer: |
    $d$を実数とし、$(a_n)_{n\geq 1}$をすべての$n\geq 1$で$a_{n+1}=a_n+d$をみたす実数列とする。$k,n$を$1\leq k\leq n$をみたす自然数とする。帰納法により、すべての$m\geq 1$で$a_m=a_1+(m-1)d$である。
    $k\leq n$より$n+1-k\geq 1$なので、この式を$m=k,\ n+1-k,\ n$に使えて、
    $a_k+a_{n+1-k}=2a_1+\{(k-1)+(n-k)\}d=2a_1+(n-1)d=a_1+a_n$
    となる。
  strategy: Substitute the general term into both sides.
  sketch:
  - 'derive: Obtain a_m = a_1 + (m-1)d for all m ≥ 1.'
  - 'translate: Note that n + 1 - k ≥ 1 because k ≤ n.'
  - 'conclude: Substitute and collect the multiples of d.'
  openmath: (forall (a d) (-> (and (in d R) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n 1)) (+ (seq_value a n) d))))) (forall (k n) (-> (and (in k N) (in n N) (>= k 1) (<= k n)) (= (+ (seq_value a k) (seq_value a (- (+ n 1) k))) (+ (seq_value a 1) (seq_value a n)))))))
  hard_negative:
    statement: 等差数列で$a_k+a_{n-k}=a_1+a_n$が成り立つ。
    reason: 添字の和が$n$となり$1+n$と一致しないので、差は$d$だけずれる。$a_n=n$で$k=1,\ n=3$なら左辺は$3$、右辺は$4$である。
  target: |
    ∀ (a : ℕ → ℝ) (d : ℝ), (∀ n : ℕ, 1 ≤ n → a (n + 1) = a n + d) → ∀ k n : ℕ, 1 ≤ k → k ≤ n → a k + a (n + 1 - k) = a 1 + a n
  proof: |
    by
      intro a d h k n hk hkn
      have key : ∀ m : ℕ, 1 ≤ m → a m = a 1 + ((m : ℝ) - 1) * d := by
        intro m hm
        induction m, hm using Nat.le_induction with
        | base => simp
        | succ m hm ih =>
          rw [h m hm, ih]
          push_cast
          ring
      have e : ((n + 1 - k : ℕ) : ℝ) = (n : ℝ) + 1 - (k : ℝ) := by
        rw [Nat.cast_sub (by omega)]
        push_cast
        ring
      rw [key k hk, key (n + 1 - k) (by omega), key n (by omega), e]
      ring
- id: arith_every_other_step
  kind: gap
  level: high
  topic: 等差数列・一つおきの項
  statement: すべての$n\geq 1$で$a_{n+2}=a_n+d$をみたす数列$(a_n)_{n\geq 1}$では、奇数番目と偶数番目がそれぞれ公差$d$の等差数列をなし、$a_{2m-1}=a_1+(m-1)d$、$a_{2m}=a_2+(m-1)d$である。
  statement_en: If a real sequence satisfies a_{n+2} = a_n + d for all n ≥ 1, then a_{2m-1} = a_1 + (m-1)d and a_{2m} = a_2 + (m-1)d for all m ≥ 1.
  assumptions:
  - $(a_n)$は実数列で、すべての$n\geq 1$について$a_{n+2}=a_n+d$をみたす
  quantifiers:
  - 任意の実数列$(a_n)$と実数$d$
  - 任意の自然数$m\geq 1$
  conclusion: $a_{2m-1}=a_1+(m-1)d$かつ$a_{2m}=a_2+(m-1)d$が成り立つ。
  answer: |
    $d$を実数とし、$(a_n)_{n\geq 1}$をすべての$n\geq 1$で$a_{n+2}=a_n+d$をみたす実数列とする。$m$についての帰納法で示す。
    $m=1$のとき、二つの式は$a_1=a_1$、$a_2=a_2$である。ある$m\geq 1$で成り立つと仮定する。漸化式を$n=2m-1$と$n=2m$に使うと、
    $a_{2m+1}=a_{2m-1}+d=a_1+md$、$a_{2m+2}=a_{2m}+d=a_2+md$
    となり、$m+1$でも成り立つ。
  strategy: Induct on m, proving the odd and even formulas together.
  sketch:
  - 'induction: For m = 1 both formulas are trivial.'
  - 'derive: Apply the recurrence at n = 2m - 1 and at n = 2m.'
  - 'conclude: Both formulas pass to m + 1.'
  openmath: (forall (a d) (-> (and (in d R) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n 2)) (+ (seq_value a n) d))))) (forall (m) (-> (and (in m N) (>= m 1)) (and (= (seq_value a (- (* 2 m) 1)) (+ (seq_value a 1) (* (- m 1) d))) (= (seq_value a (* 2 m)) (+ (seq_value a 2) (* (- m 1) d))))))))
  hard_negative:
    statement: $a_{n+2}=a_n+d$をみたす数列は全体として公差$\dfrac{d}{2}$の等差数列である。
    reason: $a_1,a_2$は独立に選べる。$a_1=0,\ a_2=5,\ d=2$なら$a_3=2$であり、隣り合う差は$5,-3$と一定でない。
  target: |
    ∀ (a : ℕ → ℝ) (d : ℝ), (∀ n : ℕ, 1 ≤ n → a (n + 2) = a n + d) → ∀ m : ℕ, 1 ≤ m → a (2 * m - 1) = a 1 + ((m : ℝ) - 1) * d ∧ a (2 * m) = a 2 + ((m : ℝ) - 1) * d
  proof: |
    by
      intro a d h
      have key : ∀ j : ℕ, a (2 * j + 1) = a 1 + (j : ℝ) * d ∧ a (2 * j + 2) = a 2 + (j : ℝ) * d := by
        intro j
        induction j with
        | zero => simp
        | succ j ih =>
          have h1 := h (2 * j + 1) (by omega)
          have h2 := h (2 * j + 2) (by omega)
          have e1 : 2 * (j + 1) + 1 = 2 * j + 1 + 2 := by ring
          have e2 : 2 * (j + 1) + 2 = 2 * j + 2 + 2 := by ring
          rw [e1, e2, h1, h2, ih.1, ih.2]
          push_cast
          constructor <;> ring
      intro m hm
      obtain ⟨j, rfl⟩ : ∃ j, m = j + 1 := ⟨m - 1, by omega⟩
      have e1 : 2 * (j + 1) - 1 = 2 * j + 1 := by omega
      have e2 : 2 * (j + 1) = 2 * j + 2 := by ring
      rw [e1, e2, (key j).1, (key j).2]
      push_cast
      constructor <;> ring
- id: arith_common_terms_lcm
  kind: gap
  level: high
  topic: 整数全体を添字とする等差数列・共通項
  statement: 正の整数$d,e$と整数$p,q$について、$x$が$p+di$と$q+ej$（$i,j$は負も含む任意の整数）の両方の形に表されるとき、同じく両方の形に表される整数$y$は、$y-x$が$d,e$の最小公倍数で割り切れる整数全体である。添字を正に限った数列の共通項では、添字の下限の条件が別に必要である。
  statement_en: Let d, e be positive integers and p, q integers. If x = p + d·i and x = q + e·j for some integers i and j, then an integer y has both forms p + d·i and q + e·j, with integer indices, if and only if lcm(d, e) divides y - x.
  assumptions:
  - $d,e$は正の整数、$p,q,x$は整数
  - $x$はある整数$i,j$で$x=p+di$かつ$x=q+ej$と表される
  quantifiers:
  - 任意の整数$p,q,d,e,x$
  - 任意の整数$y$
  conclusion: $y$が$p+di$と$q+ej$の両方の形に表されることと、$\mathrm{lcm}(d,e)$が$y-x$を割り切ることは同値である。
  answer: |
    $d,e$を正の整数、$p,q,x$を整数とし、$x=p+di_0=q+ej_0$となる整数$i_0,j_0$があるとする。$y$を整数とする。
    $y=p+di=q+ej$となる整数$i,j$があるとする。$y-x=d(i-i_0)=e(j-j_0)$なので、$y-x$は$d$と$e$の公倍数である。公倍数は最小公倍数で割り切れるので、$\mathrm{lcm}(d,e)$は$y-x$を割り切る。
    逆に$\mathrm{lcm}(d,e)$が$y-x$を割り切るとする。$d,e$はそれぞれ$\mathrm{lcm}(d,e)$を割り切るので、ある整数$s,t$で$y-x=ds=et$である。よって$y=p+d(i_0+s)=q+e(j_0+t)$と表される。
  strategy: Express y - x through each progression and use that common multiples are exactly the multiples of the least common multiple.
  sketch:
  - 'setup: Fix one common value x with indices i_0 and j_0.'
  - 'derive: A common value y gives y - x as a multiple of both d and e.'
  - 'apply_theorem: Common multiples are divisible by the lcm.'
  - 'construct: Conversely write y - x as d·s and e·t and shift the indices.'
  - 'conclude: The common values are exactly x plus multiples of the lcm.'
  openmath: (forall (p q d e x) (-> (and (in p Z) (in q Z) (in d Z) (in e Z) (in x Z) (> d 0) (> e 0) (exists (i) (and (in i Z) (= x (+ p (* d i))))) (exists (j) (and (in j Z) (= x (+ q (* e j)))))) (forall (y) (-> (in y Z) (<-> (and (exists (i) (and (in i Z) (= y (+ p (* d i))))) (exists (j) (and (in j Z) (= y (+ q (* e j)))))) (exists (c) (and (in c Z) (= (- y x) (* (lcm d e) c)))))))))
  hard_negative:
    statement: 二つの等差数列の共通項は、公差の積$de$ごとに現れる。
    reason: 共通項の間隔は積ではなく最小公倍数である。$d=4,\ e=6,\ p=q=0$では共通項は$12$ごとに現れ、$24$ごとではない。
  target: |
    ∀ (p q d e x : ℤ), 0 < d → 0 < e → (∃ i : ℤ, x = p + d * i) → (∃ j : ℤ, x = q + e * j) → ∀ y : ℤ, ((∃ i : ℤ, y = p + d * i) ∧ (∃ j : ℤ, y = q + e * j)) ↔ ((Int.lcm d e : ℤ) ∣ y - x)
  proof: |
    by
      intro p q d e x _ _ hx1 hx2 y
      obtain ⟨i0, hi0⟩ := hx1
      obtain ⟨j0, hj0⟩ := hx2
      constructor
      · rintro ⟨⟨i, hi⟩, ⟨j, hj⟩⟩
        rw [Int.coe_lcm]
        apply lcm_dvd
        · exact ⟨i - i0, by rw [hi, hi0]; ring⟩
        · exact ⟨j - j0, by rw [hj, hj0]; ring⟩
      · intro h
        obtain ⟨s, hs⟩ := (Int.dvd_lcm_left d e).trans h
        obtain ⟨t, ht⟩ := (Int.dvd_lcm_right d e).trans h
        exact ⟨⟨i0 + s, by linarith [mul_add d i0 s]⟩, ⟨j0 + t, by linarith [mul_add e j0 t]⟩⟩
- id: geom_general_term
  kind: textbook
  level: high
  topic: 等比数列・一般項
  statement: 初項$a_1$、公比$r$の等比数列$(a_n)_{n\geq 1}$の一般項は$a_n=a_1r^{n-1}$である。
  statement_en: If a real sequence satisfies a_{n+1} = r·a_n for all n ≥ 1, then a_n = a_1·r^(n-1) for all n ≥ 1.
  assumptions:
  - $(a_n)$は実数列で、すべての$n\geq 1$について$a_{n+1}=ra_n$をみたす
  quantifiers:
  - 任意の実数列$(a_n)$と実数$r$
  - 任意の自然数$n\geq 1$
  conclusion: $a_n=a_1r^{n-1}$が成り立つ。
  answer: |
    $r$を実数とし、$(a_n)_{n\geq 1}$をすべての$n\geq 1$で$a_{n+1}=ra_n$をみたす実数列とする。$n$についての帰納法で示す。
    $n=1$のとき、$r^0=1$なので右辺は$a_1$である。ある$n\geq 1$で$a_n=a_1r^{n-1}$と仮定すると、$a_{n+1}=ra_n=a_1r^{n}$となり、$n+1$でも成り立つ。
  strategy: Induct on n and multiply by r at each step.
  sketch:
  - 'induction: Check n = 1 using r^0 = 1.'
  - 'derive: Multiply the formula for n by r.'
  - 'conclude: The formula holds for all n ≥ 1.'
  openmath: (forall (a r) (-> (and (in r R) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n 1)) (* r (seq_value a n)))))) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a n) (* (seq_value a 1) (^ r (- n 1))))))))
  hard_negative:
    statement: 公比$r$の等比数列では$a_n=a_1r^{n}$である。
    reason: $n=1$とすると$a_1=a_1r$となり、$a_1\neq 0,\ r\neq 1$のとき成り立たない。指数は$n-1$である。
  target: |
    ∀ (a : ℕ → ℝ) (r : ℝ), (∀ n : ℕ, 1 ≤ n → a (n + 1) = r * a n) → ∀ n : ℕ, 1 ≤ n → a n = a 1 * r ^ (n - 1)
  proof: |
    by
      intro a r h
      have key : ∀ m : ℕ, a (m + 1) = a 1 * r ^ m := by
        intro m
        induction m with
        | zero => simp
        | succ m ih =>
          rw [h (m + 1) (by omega), ih, pow_succ]
          ring
      intro n hn
      obtain ⟨m, rfl⟩ : ∃ m, n = m + 1 := ⟨n - 1, by omega⟩
      simpa using key m
- id: geom_sum_ne_one
  kind: textbook
  level: high
  topic: 等比数列・和（公比が1でない場合）
  statement: 公比$r\neq 1$の等比数列の初項$a$から第$n$項までの和は$\dfrac{a(r^n-1)}{r-1}$である。
  statement_en: For real a and r with r ≠ 1 and natural n, the sum of a·r^(k-1) for 1 ≤ k ≤ n equals a(r^n - 1)/(r - 1).
  assumptions:
  - $a,r$は実数で$r\neq 1$
  - $n$は自然数
  quantifiers:
  - $r\neq 1$をみたす任意の実数$a,r$
  - 任意の自然数$n$
  conclusion: $\sum_{k=1}^{n}ar^{k-1}=\dfrac{a(r^n-1)}{r-1}$が成り立つ。
  answer: |
    $a,r$を実数とし$r\neq 1$、$n$を自然数とする。$S=\sum_{k=1}^{n}ar^{k-1}$とおく。$rS=\sum_{k=1}^{n}ar^{k}$であるから、両者の差をとると途中の項が消えて、$rS-S=ar^n-a$となる。$r-1\neq 0$で割れば$S=\dfrac{a(r^n-1)}{r-1}$である。
  strategy: Subtract S from r·S so that the middle terms cancel, then divide by r - 1.
  sketch:
  - 'setup: Let S be the sum and compute r·S.'
  - 'derive: The difference r·S - S telescopes to a·r^n - a.'
  - 'conclude: Divide by r - 1, which is nonzero.'
  openmath: (forall (a r n) (-> (and (in a R) (in r R) (!= r 1) (in n N)) (= (sum (oriented_interval 1 n) (lambda (k) (* a (^ r (- k 1))))) (/ (* a (- (^ r n) 1)) (- r 1)))))
  hard_negative:
    statement: 公比$r=1$のときも和は$\dfrac{a(r^n-1)}{r-1}$で与えられる。
    reason: $r=1$では分母が$0$となり式が意味をもたない。このときの和は$na$である。
  target: |
    ∀ (a r : ℝ) (n : ℕ), r ≠ 1 → ∑ k ∈ Finset.Icc 1 n, a * r ^ (k - 1) = a * (r ^ n - 1) / (r - 1)
  proof: |
    by
      intro a r n hr
      have hr1 : r - 1 ≠ 0 := sub_ne_zero.mpr hr
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_Icc_succ_top (by omega), ih, Nat.add_sub_cancel]
        field_simp
        ring
- id: geom_mean_iff
  kind: gap
  level: high
  topic: 等比数列・等比中項
  statement: 実数$a\neq 0$と$b,c$について、$a,b,c$がこの順に等比数列をなすことと$b^2=ac$は同値である。
  statement_en: For real a ≠ 0 and real b, c, there is a real r with b = a·r and c = b·r if and only if b^2 = a·c.
  assumptions:
  - $a,b,c$は実数
  - $a\neq 0$
  quantifiers:
  - $a\neq 0$をみたす任意の実数$a,b,c$
  conclusion: ある実数$r$で$b=ar,\ c=br$となることと$b^2=ac$は同値である。
  answer: |
    $a,b,c$を実数とし$a\neq 0$とする。ある実数$r$で$b=ar$、$c=br$とする。このとき$ac=a\cdot ar\cdot r=(ar)^2=b^2$である。
    逆に$b^2=ac$とし、$r=\dfrac{b}{a}$とおく。$a\neq 0$より$ar=b$である。また$br=\dfrac{b^2}{a}=\dfrac{ac}{a}=c$である。
  strategy: Substitute directly in one direction and take r = b/a in the other.
  sketch:
  - 'derive: From b = a·r and c = b·r obtain a·c = b^2.'
  - 'construct: Conversely set r = b/a, which is defined since a ≠ 0.'
  - 'conclude: Use b^2 = a·c to check c = b·r.'
  openmath: (forall (a b c) (-> (and (in a R) (in b R) (in c R) (!= a 0)) (<-> (exists (r) (and (in r R) (= b (* a r)) (= c (* b r)))) (= (^ b 2) (* a c)))))
  hard_negative:
    statement: $a=0$の場合も、$b^2=ac$ならば$a,b,c$はこの順に等比数列をなす。
    reason: $a=b=0,\ c=1$は$b^2=ac$をみたすが、$c=br$となる$r$は存在しない。
  target: |
    ∀ (a b c : ℝ), a ≠ 0 → ((∃ r : ℝ, b = a * r ∧ c = b * r) ↔ b ^ 2 = a * c)
  proof: |
    by
      intro a b c ha
      constructor
      · rintro ⟨r, h1, h2⟩
        rw [h2, h1]
        ring
      · intro h
        refine ⟨b / a, by field_simp, ?_⟩
        apply mul_left_cancel₀ ha
        rw [← h]
        field_simp
- id: arith_geom_sum
  kind: gap
  level: high
  topic: 数列の和・（等差）×（等比）
  statement: 実数$r\neq 1$について、$\sum_{k=1}^{n}kr^{k-1}=\dfrac{1-(n+1)r^n+nr^{n+1}}{(1-r)^2}$が成り立つ。
  statement_en: For real r ≠ 1 and natural n, the sum of k·r^(k-1) for 1 ≤ k ≤ n equals (1 - (n+1)r^n + n·r^(n+1))/(1 - r)^2.
  assumptions:
  - $r$は実数で$r\neq 1$
  - $n$は自然数
  quantifiers:
  - $r\neq 1$をみたす任意の実数$r$
  - 任意の自然数$n$
  conclusion: $\sum_{k=1}^{n}kr^{k-1}=\dfrac{1-(n+1)r^n+nr^{n+1}}{(1-r)^2}$が成り立つ。
  answer: |
    $r$を$r\neq 1$をみたす実数、$n$を自然数とし、$S=\sum_{k=1}^{n}kr^{k-1}$とおく。$rS=\sum_{k=1}^{n}kr^{k}$との差をとり、同じ指数の項をまとめると、
    $(1-r)S=\sum_{k=1}^{n}r^{k-1}-nr^n=\dfrac{1-r^n}{1-r}-nr^n$
    となる。ここで和の計算に公比$r\neq 1$の等比数列の和の公式を使った。両辺を$1-r\neq 0$で割って整理すると、
    $S=\dfrac{1-r^n-nr^n(1-r)}{(1-r)^2}=\dfrac{1-(n+1)r^n+nr^{n+1}}{(1-r)^2}$
    である。
  strategy: Subtract r·S from S to reduce to a geometric sum, then divide by 1 - r.
  sketch:
  - 'setup: Let S be the sum and write out r·S.'
  - 'derive: Terms with equal exponents combine, giving (1 - r)S = sum of r^(k-1) - n·r^n.'
  - 'apply_theorem: Evaluate the geometric sum using r ≠ 1.'
  - 'conclude: Divide by 1 - r and simplify.'
  openmath: (forall (r n) (-> (and (in r R) (!= r 1) (in n N)) (= (sum (oriented_interval 1 n) (lambda (k) (* k (^ r (- k 1))))) (/ (+ (- 1 (* (+ n 1) (^ r n))) (* n (^ r (+ n 1)))) (^ (- 1 r) 2)))))
  hard_negative:
    statement: $r=1$でも同じ公式で$\sum_{k=1}^{n}k$が求められる。
    reason: $r=1$では分母が$0$となり公式は使えない。このときの和は$\dfrac{n(n+1)}{2}$である。
  target: |
    ∀ (r : ℝ) (n : ℕ), r ≠ 1 → ∑ k ∈ Finset.Icc 1 n, (k : ℝ) * r ^ (k - 1) = (1 - ((n : ℝ) + 1) * r ^ n + (n : ℝ) * r ^ (n + 1)) / (1 - r) ^ 2
  proof: |
    by
      intro r n hr
      have hr1 : 1 - r ≠ 0 := sub_ne_zero.mpr (Ne.symm hr)
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_Icc_succ_top (by omega), ih, Nat.add_sub_cancel]
        push_cast
        field_simp
        ring
- id: sum_natural_numbers
  kind: named
  level: high
  topic: Σの公式・自然数の和
  statement: $1$から$n$までの自然数の和は$\sum_{k=1}^{n}k=\dfrac{n(n+1)}{2}$である（ガウスの和）。
  statement_en: For natural n, the sum of k for 1 ≤ k ≤ n equals n(n+1)/2.
  assumptions:
  - $n$は$0$以上の整数
  quantifiers:
  - 任意の$0$以上の整数$n$
  conclusion: $\sum_{k=1}^{n}k=\dfrac{n(n+1)}{2}$が成り立つ。
  answer: |
    $n$を$0$以上の整数とする。$n$についての帰納法で示す。$n=0$のとき両辺は$0$である。ある$n$で成り立つと仮定すると、
    $\sum_{k=1}^{n+1}k=\dfrac{n(n+1)}{2}+(n+1)=\dfrac{(n+1)(n+2)}{2}$
    となり、$n+1$でも成り立つ。
  strategy: Induct on n and add the next term n + 1.
  sketch:
  - 'induction: For n = 0 both sides vanish.'
  - 'derive: Add n + 1 to the formula for n and factor out n + 1.'
  - 'conclude: The formula holds for n + 1.'
  openmath: (forall (n) (-> (in n N) (= (sum (oriented_interval 1 n) (lambda (k) k)) (/ (* n (+ n 1)) 2))))
  hard_negative:
    statement: $\sum_{k=1}^{n}k=\dfrac{n(n-1)}{2}$である。
    reason: $n=1$のとき左辺は$1$、右辺は$0$である。この式は$\sum_{k=1}^{n-1}k$の値を与える。
  target: |
    ∀ n : ℕ, ∑ k ∈ Finset.Icc 1 n, (k : ℝ) = (n : ℝ) * ((n : ℝ) + 1) / 2
  proof: |
    by
      intro n
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_Icc_succ_top (by omega), ih]
        push_cast
        ring
- id: sum_squares_formula
  kind: textbook
  level: high
  topic: Σの公式・平方の和
  statement: $0$以上の整数$n$について、$\sum_{k=1}^{n}k^2=\dfrac{n(n+1)(2n+1)}{6}$である。
  statement_en: For natural n, the sum of k^2 for 1 ≤ k ≤ n equals n(n+1)(2n+1)/6.
  assumptions:
  - $n$は$0$以上の整数
  quantifiers:
  - 任意の$0$以上の整数$n$
  conclusion: $\sum_{k=1}^{n}k^2=\dfrac{n(n+1)(2n+1)}{6}$が成り立つ。
  answer: |
    $n$を$0$以上の整数とする。$n$についての帰納法で示す。$n=0$のとき両辺は$0$である。ある$n$で成り立つと仮定すると、
    $\sum_{k=1}^{n+1}k^2=\dfrac{n(n+1)(2n+1)}{6}+(n+1)^2=\dfrac{(n+1)\{n(2n+1)+6(n+1)\}}{6}=\dfrac{(n+1)(n+2)(2n+3)}{6}$
    である。最後の等号は$2n^2+7n+6=(n+2)(2n+3)$による。よって$n+1$でも成り立つ。
  strategy: Induct on n, adding (n+1)^2 and factoring.
  sketch:
  - 'induction: For n = 0 both sides vanish.'
  - 'derive: Add (n+1)^2 and factor out n + 1.'
  - 'derive: Factor 2n^2 + 7n + 6 as (n+2)(2n+3).'
  - 'conclude: The formula holds for n + 1.'
  openmath: (forall (n) (-> (in n N) (= (sum (oriented_interval 1 n) (lambda (k) (^ k 2))) (/ (* n (* (+ n 1) (+ (* 2 n) 1))) 6))))
  hard_negative:
    statement: $\sum_{k=1}^{n}k^2=\left(\sum_{k=1}^{n}k\right)^2$である。
    reason: $n=2$のとき左辺は$5$、右辺は$9$である。この形の等式が成り立つのは立方の和と自然数の和の関係である。
  target: |
    ∀ n : ℕ, ∑ k ∈ Finset.Icc 1 n, (k : ℝ) ^ 2 = (n : ℝ) * ((n : ℝ) + 1) * (2 * (n : ℝ) + 1) / 6
  proof: |
    by
      intro n
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_Icc_succ_top (by omega), ih]
        push_cast
        ring
- id: sum_cubes_nicomachus
  kind: named
  level: high
  topic: Σの公式・立方の和
  statement: $0$以上の整数$n$について、$\sum_{k=1}^{n}k^3=\left\{\dfrac{n(n+1)}{2}\right\}^2$である（ニコマコスの定理）。
  statement_en: For natural n, the sum of k^3 for 1 ≤ k ≤ n equals (n(n+1)/2)^2.
  assumptions:
  - $n$は$0$以上の整数
  quantifiers:
  - 任意の$0$以上の整数$n$
  conclusion: $\sum_{k=1}^{n}k^3=\left\{\dfrac{n(n+1)}{2}\right\}^2$が成り立つ。
  answer: |
    $n$を$0$以上の整数とする。$n$についての帰納法で示す。$n=0$のとき両辺は$0$である。ある$n$で成り立つと仮定すると、
    $\sum_{k=1}^{n+1}k^3=\dfrac{n^2(n+1)^2}{4}+(n+1)^3=\dfrac{(n+1)^2\{n^2+4(n+1)\}}{4}=\dfrac{(n+1)^2(n+2)^2}{4}$
    となり、$n+1$でも成り立つ。
  strategy: Induct on n, adding (n+1)^3 and factoring out (n+1)^2.
  sketch:
  - 'induction: For n = 0 both sides vanish.'
  - 'derive: Add (n+1)^3 and factor out (n+1)^2.'
  - 'derive: Recognize n^2 + 4n + 4 as (n+2)^2.'
  - 'conclude: The formula holds for n + 1.'
  openmath: (forall (n) (-> (in n N) (= (sum (oriented_interval 1 n) (lambda (k) (^ k 3))) (^ (/ (* n (+ n 1)) 2) 2))))
  hard_negative:
    statement: $\sum_{k=1}^{n}k^3=\dfrac{n^2(n+1)^2}{2}$である。
    reason: $n=1$のとき左辺は$1$、右辺は$2$である。二乗するので分母は$4$になる。
  target: |
    ∀ n : ℕ, ∑ k ∈ Finset.Icc 1 n, (k : ℝ) ^ 3 = ((n : ℝ) * ((n : ℝ) + 1) / 2) ^ 2
  proof: |
    by
      intro n
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_Icc_succ_top (by omega), ih]
        push_cast
        ring
- id: sum_linearity_with_constant
  kind: gap
  level: high
  topic: Σの性質・線形性
  statement: 数列$(a_k),(b_k)$と定数$p,q,c$について、$\sum_{k=1}^{n}(pa_k+qb_k+c)=p\sum_{k=1}^{n}a_k+q\sum_{k=1}^{n}b_k+nc$が成り立つ。
  statement_en: For real sequences a, b, real constants p, q, c and natural n, the sum of p·a_k + q·b_k + c for 1 ≤ k ≤ n equals p times the sum of a_k plus q times the sum of b_k plus n·c.
  assumptions:
  - $(a_k),(b_k)$は実数列
  - $p,q,c$は$k$によらない実数
  - $n$は自然数
  quantifiers:
  - 任意の実数列$(a_k),(b_k)$と実数$p,q,c$
  - 任意の自然数$n$
  conclusion: $\sum_{k=1}^{n}(pa_k+qb_k+c)=p\sum_{k=1}^{n}a_k+q\sum_{k=1}^{n}b_k+nc$が成り立つ。
  answer: |
    $(a_k),(b_k)$を実数列、$p,q,c$を実数、$n$を自然数とする。左辺を項ごとに並べ替えて、$pa_k$の和、$qb_k$の和、$c$の和に分ける。有限和なので並べ替えてよい。$pa_k$の和からは共通因数$p$を、$qb_k$の和からは$q$をくくり出せる。$c$は$k=1,\dots,n$の$n$回現れるので、その和は$nc$である。これらを合わせると右辺になる。
  strategy: Split the finite sum term by term and factor out the constants.
  sketch:
  - 'derive: Rearrange the finite sum into three separate sums.'
  - 'derive: Factor p and q out of the first two sums.'
  - 'derive: The constant c is added n times.'
  - 'conclude: Combine the three results.'
  openmath: (forall (a b p q c n) (-> (and (in p R) (in q R) (in c R) (in n N)) (= (sum (oriented_interval 1 n) (lambda (k) (+ (* p (seq_value a k)) (+ (* q (seq_value b k)) c)))) (+ (* p (sum (oriented_interval 1 n) (lambda (k) (seq_value a k)))) (+ (* q (sum (oriented_interval 1 n) (lambda (k) (seq_value b k)))) (* n c))))))
  hard_negative:
    statement: 積についても$\sum_{k=1}^{n}a_kb_k=\left(\sum_{k=1}^{n}a_k\right)\left(\sum_{k=1}^{n}b_k\right)$が成り立つ。
    reason: $a_k=b_k=1,\ n=2$なら左辺は$2$、右辺は$4$である。Σが分配するのは和と定数倍だけである。
  target: |
    ∀ (a b : ℕ → ℝ) (p q c : ℝ) (n : ℕ), ∑ k ∈ Finset.Icc 1 n, (p * a k + q * b k + c) = p * ∑ k ∈ Finset.Icc 1 n, a k + q * ∑ k ∈ Finset.Icc 1 n, b k + (n : ℝ) * c
  proof: |
    by
      intro a b p q c n
      rw [Finset.sum_add_distrib, Finset.sum_add_distrib, ← Finset.mul_sum, ← Finset.mul_sum, Finset.sum_const]
      simp [nsmul_eq_mul]
- id: sum_consecutive_product
  kind: gap
  level: high
  topic: 数列の和・連続する整数の積
  statement: $0$以上の整数$m,n$について、連続する$m$個の整数の積の和は$\sum_{k=1}^{n}k(k+1)\cdots(k+m-1)=\dfrac{n(n+1)\cdots(n+m)}{m+1}$である。
  statement_en: For natural m and n, the sum over 1 ≤ k ≤ n of the product of k + i for 0 ≤ i < m equals the product of n + i for 0 ≤ i ≤ m divided by m + 1.
  assumptions:
  - $m,n$は$0$以上の整数
  quantifiers:
  - 任意の$0$以上の整数$m,n$
  conclusion: $\sum_{k=1}^{n}\prod_{i=0}^{m-1}(k+i)=\dfrac{1}{m+1}\prod_{i=0}^{m}(n+i)$が成り立つ。
  answer: |
    $m,n$を$0$以上の整数とする。$n$についての帰納法で示す。$n=0$のとき左辺は空和で$0$であり、右辺の積は$i=0$の因数$0$を含むので$0$である。
    ある$n$で成り立つと仮定する。$Q=\prod_{i=0}^{m-1}(n+1+i)$とおく。$\prod_{i=0}^{m}(n+i)=nQ$であり、$\prod_{i=0}^{m}(n+1+i)=Q(n+1+m)$である。よって
    $\sum_{k=1}^{n+1}\prod_{i=0}^{m-1}(k+i)=\dfrac{nQ}{m+1}+Q=\dfrac{Q(n+m+1)}{m+1}=\dfrac{1}{m+1}\prod_{i=0}^{m}(n+1+i)$
    となり、$n+1$でも成り立つ。
  strategy: Induct on n, factoring the common product Q out of the old sum and the new term.
  sketch:
  - 'induction: For n = 0 the sum is empty and the right side has the factor 0.'
  - 'setup: Let Q be the product of n + 1 + i for 0 ≤ i < m.'
  - 'derive: The product up to n + m equals n·Q and the product up to n + 1 + m equals Q(n + m + 1).'
  - 'derive: Add the new term Q to n·Q/(m + 1).'
  - 'conclude: The result is Q(n + m + 1)/(m + 1).'
  openmath: (forall (m n) (-> (and (in m N) (in n N)) (= (sum (oriented_interval 1 n) (lambda (k) (product (natural_range m) (lambda (i) (+ k i))))) (/ (product (natural_range (+ m 1)) (lambda (i) (+ n i))) (+ m 1)))))
  hard_negative:
    statement: $\sum_{k=1}^{n}k(k+1)=\dfrac{n(n+1)}{2}$である。
    reason: $n=2$のとき左辺は$8$、右辺は$3$である。和をとると因数が一つ増えて$\dfrac{n(n+1)(n+2)}{3}$となり、分母は増えた後の因数の個数である。
  target: |
    ∀ m n : ℕ, ∑ k ∈ Finset.Icc 1 n, ∏ i ∈ Finset.range m, ((k : ℝ) + (i : ℝ)) = (∏ i ∈ Finset.range (m + 1), ((n : ℝ) + (i : ℝ))) / ((m : ℝ) + 1)
  proof: |
    by
      intro m n
      have hm : (m : ℝ) + 1 ≠ 0 := by positivity
      induction n with
      | zero =>
        rw [Finset.prod_range_succ']
        simp
      | succ n ih =>
        rw [Finset.sum_Icc_succ_top (by omega), ih]
        have e1 : ∏ i ∈ Finset.range (m + 1), ((n : ℝ) + (i : ℝ)) = (∏ i ∈ Finset.range m, (((n + 1 : ℕ) : ℝ) + (i : ℝ))) * (n : ℝ) := by
          rw [Finset.prod_range_succ']
          congr 1
          · apply Finset.prod_congr rfl
            intro i _
            push_cast
            ring
          · simp
        rw [e1, Finset.prod_range_succ]
        generalize (∏ i ∈ Finset.range m, (((n + 1 : ℕ) : ℝ) + (i : ℝ))) = Q
        push_cast
        field_simp
        ring
- id: sum_index_shift
  kind: gap
  level: high
  topic: Σの性質・添字のずらし
  statement: 数列$(a_k)$と自然数$m,n$について、$\sum_{k=1}^{n}a_{k+m}=\sum_{k=m+1}^{m+n}a_k$が成り立つ。
  statement_en: For a real sequence a and natural m, n, the sum of a_{k+m} for 1 ≤ k ≤ n equals the sum of a_k for m + 1 ≤ k ≤ m + n.
  assumptions:
  - $(a_k)$は実数列
  - $m,n$は自然数
  quantifiers:
  - 任意の実数列$(a_k)$
  - 任意の自然数$m,n$
  conclusion: $\sum_{k=1}^{n}a_{k+m}=\sum_{k=m+1}^{m+n}a_k$が成り立つ。
  answer: |
    $(a_k)$を実数列、$m,n$を自然数とする。$k$が$1$から$n$まで動くとき、$j=k+m$は$m+1$から$m+n$まで一度ずつ動く。したがって左辺の項$a_{k+m}$と右辺の項$a_j$は一対一に対応し、両辺の和は等しい。
  strategy: Substitute j = k + m, which is a bijection between the two index ranges.
  sketch:
  - 'translate: Set j = k + m.'
  - 'derive: As k runs over 1 to n, j runs once over m + 1 to m + n.'
  - 'conclude: The two sums have the same terms.'
  openmath: (forall (a m n) (-> (and (in m N) (in n N)) (= (sum (oriented_interval 1 n) (lambda (k) (seq_value a (+ k m)))) (sum (oriented_interval (+ m 1) (+ m n)) (lambda (k) (seq_value a k))))))
  hard_negative:
    statement: $\sum_{k=1}^{n}a_{k+m}=\sum_{k=m+1}^{n}a_k$である。
    reason: 添字をずらすと上端も$m$だけずれる。$a_k=1,\ m=1,\ n=2$なら左辺は$2$、右辺は$1$である。
  target: |
    ∀ (a : ℕ → ℝ) (m n : ℕ), ∑ k ∈ Finset.Icc 1 n, a (k + m) = ∑ k ∈ Finset.Icc (m + 1) (m + n), a k
  proof: |
    by
      intro a m n
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_Icc_succ_top (by omega), ih, ← add_assoc m n 1, Finset.sum_Icc_succ_top (by omega)]
        rw [show n + 1 + m = m + n + 1 by ring]
- id: sum_range_difference
  kind: gap
  level: high
  topic: Σの性質・途中からの和
  statement: 数列$(a_k)$と$m\leq n$をみたす自然数$m,n$について、$\sum_{k=m+1}^{n}a_k=\sum_{k=1}^{n}a_k-\sum_{k=1}^{m}a_k$が成り立つ。
  statement_en: For a real sequence a and natural numbers m ≤ n, the sum of a_k for m + 1 ≤ k ≤ n equals the sum of a_k for 1 ≤ k ≤ n minus the sum of a_k for 1 ≤ k ≤ m.
  assumptions:
  - $(a_k)$は実数列
  - $m,n$は自然数で$m\leq n$
  quantifiers:
  - 任意の実数列$(a_k)$
  - $m\leq n$をみたす任意の自然数$m,n$
  conclusion: $\sum_{k=m+1}^{n}a_k=\sum_{k=1}^{n}a_k-\sum_{k=1}^{m}a_k$が成り立つ。
  answer: |
    $(a_k)$を実数列、$m,n$を$m\leq n$をみたす自然数とする。添字の集合$\{1,\dots,n\}$は$\{1,\dots,m\}$と$\{m+1,\dots,n\}$に重なりなく分かれるので、$\sum_{k=1}^{n}a_k=\sum_{k=1}^{m}a_k+\sum_{k=m+1}^{n}a_k$である。$\sum_{k=1}^{m}a_k$を移項すれば結論を得る。
  strategy: Split the index set at m and move one sum to the other side.
  sketch:
  - 'derive: Split 1, ..., n into 1, ..., m and m + 1, ..., n.'
  - 'conclude: Subtract the sum up to m.'
  openmath: (forall (a m n) (-> (and (in m N) (in n N) (<= m n)) (= (sum (oriented_interval (+ m 1) n) (lambda (k) (seq_value a k))) (- (sum (oriented_interval 1 n) (lambda (k) (seq_value a k))) (sum (oriented_interval 1 m) (lambda (k) (seq_value a k)))))))
  hard_negative:
    statement: $\sum_{k=m}^{n}a_k=\sum_{k=1}^{n}a_k-\sum_{k=1}^{m}a_k$である。
    reason: $a_m$は右辺で打ち消され左辺に残る。$m\geq 1$では$a_m\neq 0$のとき一致しない。引くのは$m-1$までの和である。
  target: |
    ∀ (a : ℕ → ℝ) (m n : ℕ), m ≤ n → ∑ k ∈ Finset.Icc (m + 1) n, a k = ∑ k ∈ Finset.Icc 1 n, a k - ∑ k ∈ Finset.Icc 1 m, a k
  proof: |
    by
      intro a m n hmn
      induction n, hmn using Nat.le_induction with
      | base => simp
      | succ n hn ih =>
        rw [Finset.sum_Icc_succ_top (by omega), Finset.sum_Icc_succ_top (by omega), ih]
        ring
- id: sum_reverse_order
  kind: gap
  level: high
  topic: Σの性質・逆順の和
  statement: 数列$(a_k)$と自然数$n$について、項を逆順に並べても和は変わらず、$\sum_{k=1}^{n}a_{n+1-k}=\sum_{k=1}^{n}a_k$が成り立つ。
  statement_en: For a real sequence a and natural n, the sum of a_{n+1-k} for 1 ≤ k ≤ n equals the sum of a_k for 1 ≤ k ≤ n.
  assumptions:
  - $(a_k)$は実数列
  - $n$は自然数
  quantifiers:
  - 任意の実数列$(a_k)$
  - 任意の自然数$n$
  conclusion: $\sum_{k=1}^{n}a_{n+1-k}=\sum_{k=1}^{n}a_k$が成り立つ。
  answer: |
    $(a_k)$を実数列、$n$を自然数とする。$1\leq k\leq n$に対し$j=n+1-k$とおくと$1\leq j\leq n$であり、$k=n+1-j$と戻せる。よって$k\mapsto j$は$\{1,\dots,n\}$からそれ自身への全単射である。左辺は右辺の項を並べ替えただけなので、両辺は等しい。
  strategy: The map k to n + 1 - k is a bijection of the index set onto itself.
  sketch:
  - 'translate: Set j = n + 1 - k.'
  - 'derive: The map is its own inverse on 1, ..., n.'
  - 'conclude: The sum is unchanged by this reordering.'
  openmath: (forall (a n) (-> (in n N) (= (sum (oriented_interval 1 n) (lambda (k) (seq_value a (- (+ n 1) k)))) (sum (oriented_interval 1 n) (lambda (k) (seq_value a k))))))
  hard_negative:
    statement: $\sum_{k=1}^{n}a_{n-k}=\sum_{k=1}^{n}a_k$である。
    reason: 左辺の添字は$0$から$n-1$まで動くので範囲が異なる。$a_0=0,\ a_1=1,\ n=1$なら左辺は$0$、右辺は$1$である。
  target: |
    ∀ (a : ℕ → ℝ) (n : ℕ), ∑ k ∈ Finset.Icc 1 n, a (n + 1 - k) = ∑ k ∈ Finset.Icc 1 n, a k
  proof: |
    by
      intro a n
      refine Finset.sum_nbij' (fun k => n + 1 - k) (fun k => n + 1 - k) ?_ ?_ ?_ ?_ ?_
      · intro k hk
        rw [Finset.mem_Icc] at hk ⊢
        omega
      · intro k hk
        rw [Finset.mem_Icc] at hk ⊢
        omega
      · intro k hk
        rw [Finset.mem_Icc] at hk
        show n + 1 - (n + 1 - k) = k
        omega
      · intro k hk
        rw [Finset.mem_Icc] at hk
        show n + 1 - (n + 1 - k) = k
        omega
      · intro k _
        rfl
- id: periodic_sequence_sum
  kind: gap
  level: high
  topic: 数列の和・周期数列
  statement: 周期$p\geq 1$の数列$(a_n)_{n\geq 1}$、すなわちすべての$n\geq 1$で$a_{n+p}=a_n$をみたす数列について、$\sum_{k=1}^{pm}a_k=m\sum_{k=1}^{p}a_k$が成り立つ。
  statement_en: If p ≥ 1 and a real sequence satisfies a_{n+p} = a_n for all n ≥ 1, then the sum of a_k for 1 ≤ k ≤ p·m equals m times the sum of a_k for 1 ≤ k ≤ p for every natural m.
  assumptions:
  - $p\geq 1$は自然数
  - $(a_n)$は実数列で、すべての$n\geq 1$について$a_{n+p}=a_n$をみたす
  quantifiers:
  - 任意の自然数$p\geq 1$と実数列$(a_n)$
  - 任意の$0$以上の整数$m$
  conclusion: $\sum_{k=1}^{pm}a_k=m\sum_{k=1}^{p}a_k$が成り立つ。
  answer: |
    $p\geq 1$を自然数、$(a_n)_{n\geq 1}$をすべての$n\geq 1$で$a_{n+p}=a_n$をみたす実数列とする。$T=\sum_{k=1}^{p}a_k$とおく。
    まず、すべての$0$以上の整数$N$で$\sum_{k=1}^{N+p}a_k=T+\sum_{k=1}^{N}a_k$であることを$N$についての帰納法で示す。$N=0$では両辺とも$T$である。$N$で成り立つとき、$a_{N+1+p}=a_{N+1}$より
    $\sum_{k=1}^{N+1+p}a_k=T+\sum_{k=1}^{N}a_k+a_{N+1}=T+\sum_{k=1}^{N+1}a_k$
    となる。
    次に$m$についての帰納法で結論を示す。$m=0$では両辺とも$0$である。$m$で成り立つとき、上の式で$N=pm$とすれば$\sum_{k=1}^{p(m+1)}a_k=T+mT=(m+1)T$となる。
  strategy: Show that adding one period to the upper limit adds T, then induct on the number of periods.
  sketch:
  - 'setup: Let T be the sum over the first period.'
  - 'induction: Prove that the sum up to N + p equals T plus the sum up to N.'
  - 'induction: Induct on m using N = p·m.'
  - 'conclude: The sum over m periods equals m·T.'
  openmath: (forall (a p) (-> (and (in p N) (>= p 1) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n p)) (seq_value a n))))) (forall (m) (-> (in m N) (= (sum (oriented_interval 1 (* p m)) (lambda (k) (seq_value a k))) (* m (sum (oriented_interval 1 p) (lambda (k) (seq_value a k)))))))))
  hard_negative:
    statement: 周期$p$の数列では、任意の$N$について$\sum_{k=1}^{N}a_k=\dfrac{N}{p}\sum_{k=1}^{p}a_k$である。
    reason: $N$が$p$の倍数でなければ端数の項が残る。$p=2,\ a_1=1,\ a_2=0,\ N=1$なら左辺は$1$、右辺は$\dfrac{1}{2}$である。
  target: |
    ∀ (a : ℕ → ℝ) (p : ℕ), 1 ≤ p → (∀ n : ℕ, 1 ≤ n → a (n + p) = a n) → ∀ m : ℕ, ∑ k ∈ Finset.Icc 1 (p * m), a k = (m : ℝ) * ∑ k ∈ Finset.Icc 1 p, a k
  proof: |
    by
      intro a p _ h m
      have key : ∀ N : ℕ, ∑ k ∈ Finset.Icc 1 (N + p), a k = ∑ k ∈ Finset.Icc 1 p, a k + ∑ k ∈ Finset.Icc 1 N, a k := by
        intro N
        induction N with
        | zero => simp
        | succ N ih =>
          rw [show N + 1 + p = N + p + 1 by ring, Finset.sum_Icc_succ_top (by omega), ih, Finset.sum_Icc_succ_top (by omega), show N + p + 1 = N + 1 + p by ring, h (N + 1) (by omega)]
          ring
      induction m with
      | zero => simp
      | succ m ih =>
        rw [show p * (m + 1) = p * m + p by ring, key, ih]
        push_cast
        ring
- id: telescoping_sum
  kind: textbook
  level: high
  topic: 数列の和・差の形の和
  statement: 数列$(b_k)$と$0$以上の整数$n$について、$\sum_{k=1}^{n}(b_{k+1}-b_k)=b_{n+1}-b_1$が成り立つ。
  statement_en: For a real sequence b and natural n, the sum of b_{k+1} - b_k for 1 ≤ k ≤ n equals b_{n+1} - b_1.
  assumptions:
  - $(b_k)$は実数列
  - $n$は$0$以上の整数
  quantifiers:
  - 任意の実数列$(b_k)$
  - 任意の$0$以上の整数$n$
  conclusion: $\sum_{k=1}^{n}(b_{k+1}-b_k)=b_{n+1}-b_1$が成り立つ。
  answer: |
    $(b_k)$を実数列、$n$を$0$以上の整数とする。$n$についての帰納法で示す。$n=0$のとき両辺は$0$である。ある$n$で成り立つと仮定すると、
    $\sum_{k=1}^{n+1}(b_{k+1}-b_k)=b_{n+1}-b_1+b_{n+2}-b_{n+1}=b_{n+2}-b_1$
    となり、$n+1$でも成り立つ。
