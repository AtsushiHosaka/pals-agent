    一意性を示す。$y\geq 1$も$T_{y-1}<N\leq T_y$をみたすとする。$y<m$なら$y\leq m-1$より$T_y\leq T_{m-1}<N$となり矛盾する。$y>m$なら$m\leq y-1$より$T_m\leq T_{y-1}<N$となり矛盾する。よって$y=m$である。
  strategy: Take the least m with N ≤ T_m for existence and use monotonicity of T for uniqueness.
  sketch:
  - 'setup: Let T_m be the partial sums of the group sizes.'
  - 'derive: T is strictly increasing, T_0 = 0 and T_m ≥ m.'
  - 'construct: Take the least m with N ≤ T_m.'
  - 'derive: Minimality gives T_{m-1} < N and m ≥ 1.'
  - 'contradiction: Any other index y contradicts monotonicity.'
  - 'conclude: Such m exists and is unique.'
  openmath: (forall (c N1) (-> (and (forall (i) (-> (and (in i N) (>= i 1)) (and (in (seq_value c i) N) (>= (seq_value c i) 1)))) (in N1 N) (>= N1 1)) (exists (m) (and (in m N) (>= m 1) (< (sum (oriented_interval 1 (- m 1)) (lambda (i) (seq_value c i))) N1) (<= N1 (sum (oriented_interval 1 m) (lambda (i) (seq_value c i)))) (forall (y) (-> (and (in y N) (>= y 1) (< (sum (oriented_interval 1 (- y 1)) (lambda (i) (seq_value c i))) N1) (<= N1 (sum (oriented_interval 1 y) (lambda (i) (seq_value c i))))) (= y m)))))))
