    ∀ (b : ℕ → ℝ) (n : ℕ), ∑ k ∈ Finset.Icc 1 n, (b (k + 1) - b k) = b (n + 1) - b 1
  proof: |
    by
      intro b n
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_Icc_succ_top (by omega), ih]
        ring
- id: difference_sequence_general_term
  kind: textbook
  level: high
  topic: 階差数列・一般項
  statement: 数列$(a_n)_{n\geq 1}$の階差数列を$b_k=a_{k+1}-a_k$とすると、$n\geq 2$のとき$a_n=a_1+\sum_{k=1}^{n-1}b_k$である。
