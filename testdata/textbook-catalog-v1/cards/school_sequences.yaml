    $p,q$を整数とし、$(a_n)_{n\geq 1}$をすべての$n\geq 1$で$a_{n+2}=pa_{n+1}+qa_n$をみたし、$a_1,a_2$が整数である実数列とする。
    「$a_n$と$a_{n+1}$がともに整数である」を$n$についての帰納法で示す。$n=1$は仮定である。$n$で成り立つとすると、整数の和と積は整数なので$a_{n+2}=pa_{n+1}+qa_n$は整数であり、$n+1$でも成り立つ。
  strategy: Prove integrality of two consecutive terms together by induction.
  sketch:
  - 'setup: Induct on the statement that a_n and a_{n+1} are integers.'
  - 'induction: The base case is the assumption on a_1 and a_2.'
  - 'derive: The recurrence expresses a_{n+2} as an integer combination.'
  - 'conclude: Every term is an integer.'
  openmath: (forall (a p q) (-> (and (in p Z) (in q Z) (in (seq_value a 1) Z) (in (seq_value a 2) Z) (forall (n) (-> (and (in n N) (>= n 1)) (= (seq_value a (+ n 2)) (+ (* p (seq_value a (+ n 1))) (* q (seq_value a n))))))) (forall (n) (-> (and (in n N) (>= n 1)) (in (seq_value a n) Z)))))
