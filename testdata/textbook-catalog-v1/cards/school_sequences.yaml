- id: group_triangular_location
  kind: gap
  level: high
  topic: 群数列・第m群がm項の場合（特殊形）
  statement: 第$m$群が$m$項からなるという特殊な群数列では、全体の第$N$項（$N\geq 1$）の属する群は、$\dfrac{m(m-1)}{2}<N\leq\dfrac{m(m+1)}{2}$をみたすただ一つの$m\geq 1$である。
  statement_en: 'Special form for groups of size m: for every natural N ≥ 1 there is exactly one m ≥ 1 with m(m-1)/2 < N ≤ m(m+1)/2, stated as m(m-1) < 2N ≤ m(m+1).'
  assumptions:
  - $N\geq 1$は自然数
  quantifiers:
  - 任意の自然数$N\geq 1$
  - ただ一つの自然数$m\geq 1$
  conclusion: $m(m-1)<2N\leq m(m+1)$をみたす$m\geq 1$がただ一つ存在する。
  answer: |
    $N\geq 1$を自然数とする。第$m$群までの項数は$\dfrac{m(m+1)}{2}$であるから、示すべき不等式は$m(m-1)<2N\leq m(m+1)$と同じである。$m=2N$とすれば$2N\leq m(m+1)$となるので、これをみたす$m$が存在する。そのような最小の$m$を考える。$m=0$では右辺が$0$となるので$m\geq 1$であり、最小性から$(m-1)m<2N$である。これで存在が示された。
    一意性を示す。$f(y)=y(y+1)$は単調増加である。$y\geq 1$が$y(y-1)<2N\leq y(y+1)$をみたすとする。$y<m$なら$y\leq m-1$より$f(y)\leq f(m-1)=(m-1)m<2N$となり矛盾する。$y>m$なら$m\leq y-1$より$f(m)\leq f(y-1)=(y-1)y<2N$となり矛盾する。よって$y=m$である。
  strategy: Take the least m with 2N ≤ m(m+1) for existence and use monotonicity of y(y+1) for uniqueness.
  sketch:
  - 'translate: The first m groups contain m(m+1)/2 terms.'
  - 'construct: Take the least m with 2N ≤ m(m+1).'
  - 'derive: Minimality gives m(m-1) < 2N and m ≥ 1.'
  - 'contradiction: Any other index contradicts monotonicity of y(y+1).'
  - 'conclude: Such m exists and is unique.'
  openmath: (forall (N1) (-> (and (in N1 N) (>= N1 1)) (exists (m) (and (in m N) (>= m 1) (< (* m (- m 1)) (* 2 N1)) (<= (* 2 N1) (* m (+ m 1))) (forall (y) (-> (and (in y N) (>= y 1) (< (* y (- y 1)) (* 2 N1)) (<= (* 2 N1) (* y (+ y 1)))) (= y m)))))))
  hard_negative:
    statement: 第$m$群の項数によらず、第$N$項の属する群は$\dfrac{m(m-1)}{2}<N\leq\dfrac{m(m+1)}{2}$で決まる。
    reason: 第$m$群が$2^{m-1}$項の場合、第$7$項は第$3$群に属するが、この不等式は$m=4$を与える。この式は第$m$群が$m$項の場合に限る。
  target: |
    ∀ N : ℕ, 1 ≤ N → ∃! m : ℕ, 1 ≤ m ∧ m * (m - 1) < 2 * N ∧ 2 * N ≤ m * (m + 1)
  proof: |
    by
      intro N hN
      have hex : ∃ m : ℕ, 2 * N ≤ m * (m + 1) := ⟨2 * N, by nlinarith⟩
      obtain ⟨j, hj1, hj2⟩ : ∃ j : ℕ, j * (j + 1) < 2 * N ∧ 2 * N ≤ (j + 1) * (j + 1 + 1) := by
        classical
        have spec := Nat.find_spec hex
        have hne : Nat.find hex ≠ 0 := by
          intro h0
          rw [h0] at spec
          omega
        obtain ⟨j, hj⟩ := Nat.exists_eq_succ_of_ne_zero hne
        have hmin : ¬ 2 * N ≤ j * (j + 1) := Nat.find_min hex (by omega)
        rw [hj] at spec
        exact ⟨j, by omega, spec⟩
      refine ⟨j + 1, ⟨by omega, ?_, hj2⟩, ?_⟩
      · rw [Nat.add_sub_cancel, mul_comm]
        exact hj1
      · rintro y ⟨hy, h3, h4⟩
        obtain ⟨z, rfl⟩ : ∃ z, y = z + 1 := ⟨y - 1, by omega⟩
        rw [Nat.add_sub_cancel, mul_comm] at h3
        rcases lt_trichotomy z j with hlt | heq | hgt
        · have h5 : (z + 1) * (z + 1 + 1) ≤ j * (j + 1) := Nat.mul_le_mul (by omega) (by omega)
          omega
        · rw [heq]
        · have h5 : (j + 1) * (j + 1 + 1) ≤ z * (z + 1) := Nat.mul_le_mul (by omega) (by omega)
          omega
- id: group_sum_natural_numbers
  kind: gap
  level: high
  topic: 群数列・第m群の和
  statement: 自然数の列$1,2,3,\dots$を第$m$群が$m$項となるように区切るという特殊な群数列では、第$m$群は$\dfrac{m(m-1)}{2}+j$（$1\leq j\leq m$）からなり、その和は$\dfrac{m(m^2+1)}{2}$である。
  statement_en: For natural m, the sum of m(m-1)/2 + j for 1 ≤ j ≤ m, which is the m-th group when 1, 2, 3, ... is split into groups of sizes 1, 2, 3, ..., equals m(m^2+1)/2.
  assumptions:
  - $m$は自然数
  quantifiers:
  - 任意の自然数$m$
  conclusion: $\sum_{j=1}^{m}\left\{\dfrac{m(m-1)}{2}+j\right\}=\dfrac{m(m^2+1)}{2}$が成り立つ。
  answer: |
    $m$を自然数とする。第$m-1$群までの項数は$\dfrac{m(m-1)}{2}$なので、第$m$群の第$j$項は$\dfrac{m(m-1)}{2}+j$である。定数の和と$\sum_{j=1}^{m}j=\dfrac{m(m+1)}{2}$を使うと、
    $\sum_{j=1}^{m}\left\{\dfrac{m(m-1)}{2}+j\right\}=\dfrac{m^2(m-1)}{2}+\dfrac{m(m+1)}{2}=\dfrac{m(m^2-m+m+1)}{2}=\dfrac{m(m^2+1)}{2}$
    である。
  strategy: Split the sum into a constant part and the sum of j.
  sketch:
  - 'translate: The first m - 1 groups contain m(m-1)/2 terms.'
  - 'derive: Split the group sum into m copies of m(m-1)/2 and the sum of j.'
  - 'apply_theorem: Use the formula for the sum of 1 through m.'
  - 'conclude: Simplify to m(m^2+1)/2.'
  openmath: (forall (m) (-> (in m N) (= (sum (oriented_interval 1 m) (lambda (j) (+ (/ (* m (- m 1)) 2) j))) (/ (* m (+ (^ m 2) 1)) 2))))
  hard_negative:
    statement: 第$m$群の和は$\dfrac{m(m+1)}{2}$である。
    reason: これは第$m$群までの項数であり、和ではない。$m=2$では第$2$群は$2,3$で和は$5$だが、この式の値は$3$である。
  target: |
    ∀ m : ℕ, ∑ j ∈ Finset.Icc 1 m, ((m : ℝ) * ((m : ℝ) - 1) / 2 + (j : ℝ)) = (m : ℝ) * ((m : ℝ) ^ 2 + 1) / 2
  proof: |
    by
      intro m
      have g : ∀ n : ℕ, ∑ j ∈ Finset.Icc 1 n, (j : ℝ) = (n : ℝ) * ((n : ℝ) + 1) / 2 := by
        intro n
        induction n with
        | zero => simp
        | succ n ih =>
          rw [Finset.sum_Icc_succ_top (by omega), ih]
          push_cast
          ring
      rw [Finset.sum_add_distrib, g, Finset.sum_const, Nat.card_Icc, nsmul_eq_mul, Nat.add_sub_cancel]
      ring
