  - 'derive: Expanding gives (x-h)^2=4fY=Y/a.'
  - 'conclude: Since a≠0, this is Y=a(x-h)^2.'
  openmath: (forall (a h k x y) (-> (!= a 0) (<-> (= (- y k) (* a (^ (- x h) 2))) (= (root (+ (^ (- x h) 2) (^ (- (- y k) (/ 1 (* 4 a))) 2)) 2) (abs (+ (- y k) (/ 1 (* 4 a))))))))
  hard_negative:
