        rw [hw', ← hc]; ring
      constructor
      · rintro ⟨x₁, y₁, x₂, y₂, hne, hl₁, hc₁, hl₂, hc₂⟩
        have h₁ := hle x₁ y₁ hl₁ hc₁
        have h₂ := hle x₂ y₂ hl₂ hc₂
        by_contra hge
        push Not at hge
        have hle0 : r ^ 2 * (a ^ 2 + b ^ 2) - w ^ 2 ≤ 0 := by linarith
        have he₁ : b * (x₁ - p) - a * (y₁ - q) = 0 :=
          pow_eq_zero_iff two_ne_zero |>.mp (le_antisymm (h₁.trans_le hle0) (sq_nonneg _))
        have he₂ : b * (x₂ - p) - a * (y₂ - q) = 0 :=
          pow_eq_zero_iff two_ne_zero |>.mp (le_antisymm (h₂.trans_le hle0) (sq_nonneg _))
        have ha₁ : a * (x₁ - x₂) + b * (y₁ - y₂) = 0 := by linarith
        have hb₁ : b * (x₁ - x₂) - a * (y₁ - y₂) = 0 := by linarith
        apply hne
        have g₁ : (a ^ 2 + b ^ 2) * (x₁ - x₂) = 0 := by linear_combination a * ha₁ + b * hb₁
        have g₂ : (a ^ 2 + b ^ 2) * (y₁ - y₂) = 0 := by linear_combination b * ha₁ - a * hb₁
        constructor
        · have := (mul_eq_zero.mp g₁).resolve_left hN.ne'
          linarith
        · have := (mul_eq_zero.mp g₂).resolve_left hN.ne'
          linarith
      · intro h
        have hE : 0 < r ^ 2 * (a ^ 2 + b ^ 2) - w ^ 2 := by linarith
        obtain ⟨K, hK⟩ : ∃ K : ℝ, K ^ 2 = r ^ 2 * (a ^ 2 + b ^ 2) - w ^ 2 := ⟨_, Real.sq_sqrt hE.le⟩
        have hKne : K ≠ 0 := by
          rintro rfl; rw [← hK] at hE; simp at hE
        obtain ⟨h₁, h₂⟩ := hpt K hK
        obtain ⟨h₃, h₄⟩ := hpt (-K) (by rw [neg_sq]; exact hK)
        refine ⟨_, _, _, _, ?_, h₁, h₂, h₃, h₄⟩
        rintro ⟨e₁, e₂⟩
        have g₁ : b * K = 0 := by
          have e : (a * w + b * K) / (a ^ 2 + b ^ 2) = (a * w + b * (-K)) / (a ^ 2 + b ^ 2) := by linarith
          rw [div_left_inj' hN.ne'] at e
          linarith
        have g₂ : a * K = 0 := by
          have e : (b * w - a * K) / (a ^ 2 + b ^ 2) = (b * w - a * (-K)) / (a ^ 2 + b ^ 2) := by linarith
          rw [div_left_inj' hN.ne'] at e
          linarith
        exact hab ⟨(mul_eq_zero.mp g₂).resolve_right hKne, (mul_eq_zero.mp g₁).resolve_right hKne⟩
- id: circle_tangent_at_point
  kind: textbook
  level: high
  topic: 図形と方程式・円の接線の方程式
  statement: $r>0$とし、点$(x_0,y_0)$は円$(x-a)^2+(y-b)^2=r^2$の上にあるとする。直線$(x_0-a)(x-a)+(y_0-b)(y-b)=r^2$とこの円の共有点は$(x_0,y_0)$だけである。
  statement_en: For r>0 and (x0,y0) on the circle (x-a)^2+(y-b)^2=r^2, the only common point of the circle and the line (x0-a)(x-a)+(y0-b)(y-b)=r^2 is (x0,y0).
  assumptions:
  - $r>0$
  - $(x_0-a)^2+(y_0-b)^2=r^2$
  quantifiers:
  - 任意の実数$a,b,r,x_0,y_0,x,y$
  conclusion: $(x,y)$が円と直線の両方の上にあることは、$(x,y)=(x_0,y_0)$と同値である。
  answer: |
    $a,b,r,x_0,y_0,x,y$を実数とし、$r>0$、$(x_0-a)^2+(y_0-b)^2=r^2$とする。

    $(x,y)$が円と直線の上にあるとする。$(x-x_0)^2+(y-y_0)^2=\{(x-a)^2+(y-b)^2\}+\{(x_0-a)^2+(y_0-b)^2\}-2\{(x_0-a)(x-a)+(y_0-b)(y-b)\}=r^2+r^2-2r^2=0$である。よって$x=x_0$、$y=y_0$である。

    逆に$(x,y)=(x_0,y_0)$なら、円の方程式は仮定そのものであり、直線の方程式の左辺も$(x_0-a)^2+(y_0-b)^2=r^2$である。
  strategy: Expand the squared distance to (x0,y0) using the circle and line equations.
  sketch:
  - 'derive: For a common point, (x-x0)^2+(y-y0)^2 expands in terms of the two circle equations and the line equation.'
  - 'derive: This value is r^2+r^2-2r^2=0.'
  - 'conclude: Hence (x,y)=(x0,y0), and the converse is direct substitution.'
  openmath: (forall (a b r x0 y0 x y) (-> (and (> r 0) (= (+ (^ (- x0 a) 2) (^ (- y0 b) 2)) (^ r 2))) (<-> (and (= (+ (^ (- x a) 2) (^ (- y b) 2)) (^ r 2)) (= (+ (* (- x0 a) (- x a)) (* (- y0 b) (- y b))) (^ r 2))) (and (= x x0) (= y y0)))))
  hard_negative:
    statement: 中心が$(a,b)$の円でも接線は$x_0x+y_0y=r^2$である。
    reason: これは中心が原点の場合だけの式である。$(x-1)^2+y^2=1$の点$(2,0)$では、この式は$x=\frac12$を与えるが、接線は$x=2$である。
  target: |
    ∀ (a b r x₀ y₀ x y : ℝ), 0 < r → (x₀ - a) ^ 2 + (y₀ - b) ^ 2 = r ^ 2 → (((x - a) ^ 2 + (y - b) ^ 2 = r ^ 2 ∧ (x₀ - a) * (x - a) + (y₀ - b) * (y - b) = r ^ 2) ↔ (x = x₀ ∧ y = y₀))
  proof: |
    by
      intro a b r x₀ y₀ x y hr h₀
      constructor
      · rintro ⟨h₁, h₂⟩
        have hs : (x - x₀) ^ 2 + (y - y₀) ^ 2 = 0 := by linear_combination h₁ + h₀ - 2 * h₂
        obtain ⟨h₃, h₄⟩ := (add_eq_zero_iff_of_nonneg (sq_nonneg _) (sq_nonneg _)).mp hs
        have h₅ := pow_eq_zero_iff two_ne_zero |>.mp h₃
        have h₆ := pow_eq_zero_iff two_ne_zero |>.mp h₄
        constructor <;> linarith
      · rintro ⟨rfl, rfl⟩
        exact ⟨h₀, by linear_combination h₀⟩
- id: tangent_direction_iff_perpendicular_to_radius
  kind: gap
  level: high
  topic: 図形と方程式・接線と半径
  statement: 点$(x_0,y_0)$が円$(x-a)^2+(y-b)^2=r^2$の上にあり、$(u,v)\ne(0,0)$とする。$(x_0,y_0)$を通り方向$(u,v)$の直線$(x_0+tu,y_0+tv)$が円と$t=0$でしか交わらないことは、$u(x_0-a)+v(y_0-b)=0$と同値である。
  statement_en: For (x0,y0) on the circle (x-a)^2+(y-b)^2=r^2 and (u,v)≠(0,0), the line (x0+tu,y0+tv) meets the circle only at t=0 if and only if u(x0-a)+v(y0-b)=0.
  assumptions:
  - $(x_0-a)^2+(y_0-b)^2=r^2$
  - $(u,v)\ne(0,0)$
  quantifiers:
  - 任意の実数$a,b,r,x_0,y_0,u,v$
  conclusion: 接することと、方向ベクトルが半径に直交することは同値である。
  answer: |
    $a,b,r,x_0,y_0,u,v$を実数とし、$(x_0-a)^2+(y_0-b)^2=r^2$、$(u,v)\ne(0,0)$とする。$N=u^2+v^2>0$、$S=u(x_0-a)+v(y_0-b)$とおく。展開して仮定を使うと、すべての実数$t$について
    $(x_0+tu-a)^2+(y_0+tv-b)^2-r^2=t(tN+2S)$
    である。

    円と$t=0$でしか交わらないとする。$t=-\frac{2S}{N}$では右辺が$0$なので、この$t$は$0$でなければならず、$S=0$である。

    逆に$S=0$とする。円と交わる$t$では$t^2N=0$であり、$N>0$より$t=0$である。
  strategy: Reduce the intersection condition to the quadratic t(tN+2S)=0 in t.
  sketch:
  - 'setup: Put N=u^2+v^2>0 and S=u(x0-a)+v(y0-b).'
  - 'derive: The circle equation along the line becomes t(tN+2S)=0.'
  - 'derive: The second root t=-2S/N must equal 0 if the line meets the circle only at t=0, so S=0.'
  - 'conclude: Conversely S=0 leaves t^2 N=0, so t=0.'
  openmath: (forall (a b r x0 y0 u v) (-> (and (= (+ (^ (- x0 a) 2) (^ (- y0 b) 2)) (^ r 2)) (not (and (= u 0) (= v 0)))) (<-> (forall (t) (-> (= (+ (^ (- (+ x0 (* t u)) a) 2) (^ (- (+ y0 (* t v)) b) 2)) (^ r 2)) (= t 0))) (= (+ (* u (- x0 a)) (* v (- y0 b))) 0))))
  hard_negative:
    statement: $(u,v)=(0,0)$でも接線の条件と$u(x_0-a)+v(y_0-b)=0$は同値である。
    reason: $(u,v)=(0,0)$では$(x_0+tu,y_0+tv)$は1点のままで、すべての$t$が円の方程式を満たし、$t=0$でしか交わらないという条件は成り立たない。一方、内積は$0$である。
  target: |
    ∀ (a b r x₀ y₀ u v : ℝ), (x₀ - a) ^ 2 + (y₀ - b) ^ 2 = r ^ 2 → ¬(u = 0 ∧ v = 0) → ((∀ t : ℝ, (x₀ + t * u - a) ^ 2 + (y₀ + t * v - b) ^ 2 = r ^ 2 → t = 0) ↔ u * (x₀ - a) + v * (y₀ - b) = 0)
  proof: |
    by
      intro a b r x₀ y₀ u v h₀ huv
      have hN : u ^ 2 + v ^ 2 ≠ 0 := by
        apply ne_of_gt
        by_cases ha₀ : u = 0
        · have hb₀ : v ≠ 0 := fun hb₀ => huv ⟨ha₀, hb₀⟩
          positivity
        · positivity
      have key : ∀ t : ℝ, (x₀ + t * u - a) ^ 2 + (y₀ + t * v - b) ^ 2 - r ^ 2 = t * (t * (u ^ 2 + v ^ 2) + 2 * (u * (x₀ - a) + v * (y₀ - b))) := by
        intro t; linear_combination h₀
      constructor
      · intro h
        have ht := h (-(2 * (u * (x₀ - a) + v * (y₀ - b))) / (u ^ 2 + v ^ 2)) (by
          have := key (-(2 * (u * (x₀ - a) + v * (y₀ - b))) / (u ^ 2 + v ^ 2))
          have hz : -(2 * (u * (x₀ - a) + v * (y₀ - b))) / (u ^ 2 + v ^ 2) * (u ^ 2 + v ^ 2) + 2 * (u * (x₀ - a) + v * (y₀ - b)) = 0 := by
            field_simp; ring
          rw [hz, mul_zero] at this
          linarith)
        rcases div_eq_zero_iff.mp ht with h' | h'
        · linarith
        · exact absurd h' hN
      · intro hS t ht
        have := key t
        rw [hS, ht, sub_self] at this
        have h2 : t ^ 2 * (u ^ 2 + v ^ 2) = 0 := by linear_combination -this
        have := (mul_eq_zero.mp h2).resolve_right hN
        exact pow_eq_zero_iff two_ne_zero |>.mp this
- id: tangent_length_sq_eq_power
