  openmath: (forall (a b c p q r) (-> (and (not (and (= a 0) (= b 0))) (> r 0)) (<-> (exists (x1 y1 x2 y2) (and (not (and (= x1 x2) (= y1 y2))) (= (+ (+ (* a x1) (* b y1)) c) 0) (= (+ (^ (- x1 p) 2) (^ (- y1 q) 2)) (^ r 2)) (= (+ (+ (* a x2) (* b y2)) c) 0) (= (+ (^ (- x2 p) 2) (^ (- y2 q) 2)) (^ r 2)))) (< (/ (abs (+ (+ (* a p) (* b q)) c)) (root (+ (^ a 2) (^ b 2)) 2)) r))))
