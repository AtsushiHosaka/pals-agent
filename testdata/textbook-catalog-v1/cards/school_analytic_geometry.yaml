  assumptions:
  - $(x_0-a)^2+(y_0-b)^2=r^2$
  - $(x_0-a)(p-x_0)+(y_0-b)(q-y_0)=0$
  quantifiers:
  - 任意の実数$a,b,r,x_0,y_0,p,q$
  conclusion: $(p-x_0)^2+(q-y_0)^2=(p-a)^2+(q-b)^2-r^2$である。
  answer: |
    $a,b,r,x_0,y_0,p,q$を実数とし、2つの仮定が成り立つとする。$p-a=(p-x_0)+(x_0-a)$、$q-b=(q-y_0)+(y_0-b)$を展開すると
    $(p-a)^2+(q-b)^2=(p-x_0)^2+(q-y_0)^2+2\{(x_0-a)(p-x_0)+(y_0-b)(q-y_0)\}+(x_0-a)^2+(y_0-b)^2$
    である。波かっこの中は$0$で、最後の2項の和は$r^2$である。移項して結論を得る。
  strategy: Split the vector from the center to P at the contact point and use orthogonality.
  sketch:
  - 'derive: Write p-a=(p-x0)+(x0-a) and q-b=(q-y0)+(y0-b) and expand.'
  - 'derive: The cross term vanishes by the orthogonality assumption.'
  - 'conclude: The remaining square of the radius is r^2, so moving it gives the formula.'
  openmath: (forall (a b r x0 y0 p q) (-> (and (= (+ (^ (- x0 a) 2) (^ (- y0 b) 2)) (^ r 2)) (= (+ (* (- x0 a) (- p x0)) (* (- y0 b) (- q y0))) 0)) (= (+ (^ (- p x0) 2) (^ (- q y0) 2)) (- (+ (^ (- p a) 2) (^ (- q b) 2)) (^ r 2)))))
  hard_negative:
