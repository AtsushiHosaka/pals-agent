    reason: 焦点と頂点の距離は$\frac{1}{4|a|}$である。$y=x^2$の頂点$(0,0)$はグラフ上にあり、点$\left(0,\frac14\right)$と直線$y=-\frac14$からの距離はともに$\frac14$である。一方、$(0,1)$までの距離は$1$であり、直線$y=-\frac14$までの距離$\frac14$と異なる。
  target: |
    ∀ (a h k x y : ℝ), a ≠ 0 → (y - k = a * (x - h) ^ 2 ↔ Real.sqrt ((x - h) ^ 2 + (y - k - 1 / (4 * a)) ^ 2) = |y - k + 1 / (4 * a)|)
  proof: |
    by
      intro a h k x y ha
      rw [← Real.sqrt_sq_eq_abs (y - k + 1 / (4 * a)), Real.sqrt_inj (by positivity) (by positivity)]
      have key : (x - h) ^ 2 + (y - k - 1 / (4 * a)) ^ 2 - (y - k + 1 / (4 * a)) ^ 2 = (a * (x - h) ^ 2 - (y - k)) / a := by
        field_simp
        ring
      constructor
      · intro e
        have hz : a * (x - h) ^ 2 - (y - k) = 0 := by linarith
        rw [hz, zero_div] at key
        linarith
      · intro e
        rw [e, sub_self] at key
        have := (div_eq_zero_iff.mp key.symm).resolve_right ha
        linarith
