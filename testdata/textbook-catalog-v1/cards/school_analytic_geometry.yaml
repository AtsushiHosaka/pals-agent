  level: high
  topic: 図形と方程式・接線の長さ
  statement: 点$(x_0,y_0)$が円$(x-a)^2+(y-b)^2=r^2$の上にあり、$(x_0-a)(p-x_0)+(y_0-b)(q-y_0)=0$とする（$(p,q)$が接線の上にある）。このとき接線の長さの平方は$(p-x_0)^2+(q-y_0)^2=(p-a)^2+(q-b)^2-r^2$である。
