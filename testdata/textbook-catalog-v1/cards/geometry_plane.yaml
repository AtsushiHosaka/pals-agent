- id: area_equal_same_base_parallel
  kind: gap
  level: middle
  topic: 面積・等積変形
  statement: 平面$\mathbb{R}^2$で$A\neq A'$、$B\neq C$、直線$AA'$と直線$BC$が平行なら、底辺$BC$を共有する三角形$ABC$と$A'BC$の面積は等しい。
  statement_en: In the Euclidean plane, if A ≠ A', B ≠ C and line AA' is parallel to line BC, then the convex hulls of {A, B, C} and {A', B, C} have equal area.
  assumptions:
  - 三角形の面積は3点の凸包のルベーグ測度とする
  - $A\neq A'$、$B\neq C$
  - 直線$AA'$と直線$BC$は平行である
  quantifiers:
  - 平面$\mathbb{R}^2$の任意の点$A,A',B,C$
  conclusion: 三角形$ABC$と$A'BC$の面積は等しい。
  answer: |
    $A,A',B,C$を平面$\mathbb{R}^2$の点とし、$A\neq A'$、$B\neq C$、直線$AA'$と直線$BC$は平行とする。

    標準三角形$\{(x,y)\mid x,y\geq0,\ x+y\leq1\}$の面積は$\frac{1}{2}$であり、写像$(x,y)\mapsto X+x\overrightarrow{XY}+y\overrightarrow{XZ}$はこれを$X,Y,Z$の凸包に写す。したがって凸包の面積は$\frac{1}{2}|\det(\overrightarrow{XY},\overrightarrow{XZ})|$である。

    平行であるから、実数$r$により$\overrightarrow{AA'}=r\overrightarrow{BC}$と書ける。$b=\overrightarrow{AB}$、$w=\overrightarrow{AC}$とおくと$\overrightarrow{BC}=w-b$であり、$\overrightarrow{A'B}=b-r(w-b)$、$\overrightarrow{A'C}=w-r(w-b)$である。行列式を展開すると$\det(\overrightarrow{A'B},\overrightarrow{A'C})=\det((1+r)b-rw,\ (1-r)w+rb)=\bigl((1+r)(1-r)+r^2\bigr)\det(b,w)=\det(b,w)$である。

    よって2つの面積は等しい。
  strategy: Write A' = A + r BC and expand the determinant formula for the area.
  sketch:
  - 'derive: The area of a triangle equals half an absolute determinant.'
  - 'translate: Parallelism gives AA'' = r BC.'
  - 'derive: Expanding gives det(A''B, A''C) = det(AB, AC).'
  - 'conclude: Hence the two areas agree.'
  openmath: (forall (a e b c) (-> (and (!= a e) (!= b c) (parallel_lines a e b c)) (= (triangle_area a b c) (triangle_area e b c))))
  hard_negative:
    statement: 直線$AA'$が直線$BC$と平行でなくても、底辺$BC$が共通なら面積は等しい。
    reason: $A=(0,1)$、$A'=(0,2)$、$B=(0,0)$、$C=(1,0)$では面積は$\frac{1}{2}$と$1$である。
  target: |
    ∀ (A A' B C : EuclideanSpace ℝ (Fin 2)), A ≠ A' → B ≠ C → (line[ℝ, A, A']).Parallel line[ℝ, B, C] → (MeasureTheory.volume (convexHull ℝ ({A, B, C} : Set (EuclideanSpace ℝ (Fin 2))))).toReal = (MeasureTheory.volume (convexHull ℝ ({A', B, C} : Set (EuclideanSpace ℝ (Fin 2))))).toReal
  proof: |
    by
      intro A A' B C hA hBC hpar
      let S : Set (ℝ × ℝ) := {p | 0 ≤ p.1 ∧ 0 ≤ p.2 ∧ p.1 + p.2 ≤ 1}
      have hSm : MeasurableSet S := by
        apply IsClosed.measurableSet
        exact (isClosed_le continuous_const continuous_fst).inter
          ((isClosed_le continuous_const continuous_snd).inter
            (isClosed_le (continuous_fst.add continuous_snd) continuous_const))
      have hSv : MeasureTheory.volume S = ENNReal.ofReal (1 / 2) := by
        rw [MeasureTheory.Measure.volume_eq_prod, MeasureTheory.Measure.prod_apply hSm]
        have hslice : ∀ x : ℝ, MeasureTheory.volume (Prod.mk x ⁻¹' S) =
            (Set.Icc (0 : ℝ) 1).indicator (fun x => ENNReal.ofReal (1 - x)) x := by
          intro x
          by_cases hx : x ∈ Set.Icc (0 : ℝ) 1
          · rw [Set.indicator_of_mem hx]
            have : Prod.mk x ⁻¹' S = Set.Icc 0 (1 - x) := by
              ext y
              simp only [S, Set.mem_preimage, Set.mem_setOf_eq, Set.mem_Icc]
              constructor
              · rintro ⟨_, h2, h3⟩; exact ⟨h2, by linarith⟩
              · rintro ⟨h2, h3⟩; exact ⟨hx.1, h2, by linarith⟩
            rw [this, Real.volume_Icc, sub_zero]
          · rw [Set.indicator_of_notMem hx]
            have : Prod.mk x ⁻¹' S = ∅ := by
              ext y
              simp only [S, Set.mem_preimage, Set.mem_setOf_eq, Set.mem_empty_iff_false, iff_false]
              rintro ⟨h1, h2, h3⟩
              exact hx ⟨h1, by linarith⟩
            rw [this, MeasureTheory.measure_empty]
