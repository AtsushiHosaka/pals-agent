  topic: 面積比・相似比の2乗
  statement: 平面$\mathbb{R}^2$の三角形$ABC$と$DEF$が$k>0$について$DE=k\,AB$、$DF=k\,AC$、$EF=k\,BC$をみたす（相似比$k$）なら、三角形$DEF$の面積は三角形$ABC$の面積の$k^2$倍である。
  statement_en: In the Euclidean plane, if k > 0, |DE| = k|AB|, |DF| = k|AC| and |EF| = k|BC|, then the area of the convex hull of {D, E, F} is k² times that of {A, B, C}.
  assumptions:
  - 三角形の面積は3点の凸包のルベーグ測度とする
  - $k>0$
  - $DE=k\,AB$、$DF=k\,AC$、$EF=k\,BC$
  quantifiers:
  - 平面$\mathbb{R}^2$の任意の点$A,B,C,D,E,F$と実数$k$
  conclusion: 三角形$DEF$の面積は三角形$ABC$の面積の$k^2$倍である。
  answer: |
    $A,B,C,D,E,F$を平面$\mathbb{R}^2$の点、$k>0$とし、$DE=k\,AB$、$DF=k\,AC$、$EF=k\,BC$とする。

    三角形の面積は3辺の長さだけで書ける。実際、標準三角形を線形写像と平行移動で写すことで面積は$\frac{1}{2}|\det|$となり、これは2辺とその間の角で$\frac{1}{2}bc\sin\theta$と表せる。余弦定理で$\theta$を消去すると、周の半分$s$を用いて面積は$\sqrt{s(s-a)(s-b)(s-c)}$である。

    三角形$DEF$の3辺は三角形$ABC$の3辺の$k$倍だから、周の半分も、$s-a$などの各因子も$k$倍になる。よって根号の中は$k^4$倍であり、$k>0$より$\sqrt{k^4}=k^2$である。したがって三角形$DEF$の面積は$k^2$倍である。
