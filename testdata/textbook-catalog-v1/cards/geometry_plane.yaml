  - 'derive: Scaling the sides by k scales each of the four factors by k.'
  - 'conclude: The radicand scales by k⁴, so the area scales by k².'
  openmath: (forall (a b c d e f k) (-> (and (> k 0) (= (dist_of d e) (* k (dist_of a b))) (= (dist_of d f) (* k (dist_of a c))) (= (dist_of e f) (* k (dist_of b c)))) (= (triangle_area d e f) (* (^ k 2) (triangle_area a b c)))))
