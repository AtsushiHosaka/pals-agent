  level: middle
  topic: 面積・底辺と高さ
  statement: 平面$\mathbb{R}^2$の点について、$B\neq C$で、$H$が直線$BC$上にあり$\overrightarrow{HA}\perp\overrightarrow{BC}$（$H$は$A$から直線$BC$への垂線の足）なら、三角形$ABC$の面積は$\frac{1}{2}BC\cdot AH$である。
  statement_en: In the Euclidean plane, if B ≠ C, H lies on line BC and HA is orthogonal to BC, then the area of the convex hull of {A, B, C} equals (1/2)|BC||AH|.
  assumptions:
  - 三角形の面積は3点の凸包のルベーグ測度とする
  - $B\neq C$
  - $H$は直線$BC$上にある
  - $\overrightarrow{HA}\cdot\overrightarrow{BC}=0$
  quantifiers:
  - 平面$\mathbb{R}^2$の任意の点$A,B,C,H$
  conclusion: 面積は$\frac{1}{2}BC\cdot AH$である。
  answer: |
    $A,B,C,H$を平面$\mathbb{R}^2$の点とし、$B\neq C$、$H$は直線$BC$上にあり、$\overrightarrow{HA}\cdot\overrightarrow{BC}=0$とする。

    標準三角形$\{(x,y)\mid x,y\geq0,\ x+y\leq1\}$の面積は$\frac{1}{2}$であり、写像$(x,y)\mapsto A+x\overrightarrow{AB}+y\overrightarrow{AC}$はこれを$A,B,C$の凸包に写す。線形写像は面積を行列式の絶対値倍するので、面積は$\frac{1}{2}|\det(\overrightarrow{AB},\overrightarrow{AC})|$である。

    $c=\overrightarrow{BC}$、$h=\overrightarrow{HA}$とおき、$H=B+tc$と書く。$\overrightarrow{AB}=-(h+tc)$、$\overrightarrow{AC}=c-h-tc$である。行列式の双線形性と交代性から$\det(\overrightarrow{AB},\overrightarrow{AC})=-\det(h,c)$である。

    また$\det(h,c)^2=|h|^2|c|^2-(h\cdot c)^2=|h|^2|c|^2$であるから、$|\det(h,c)|=|h||c|=AH\cdot BC$である。したがって面積は$\frac{1}{2}BC\cdot AH$である。
  strategy: Express the area by the determinant of AB and AC, reduce it to det(HA, BC) using H on line BC, and evaluate it by orthogonality.
  sketch:
  - 'derive: The area equals half the absolute determinant of AB and AC.'
  - 'setup: Write H = B + t BC and set c = BC, h = HA.'
  - 'derive: Bilinearity gives det(AB, AC) = -det(h, c).'
  - 'conclude: Orthogonality gives |det(h, c)| = |h||c|, so the area is (1/2)|BC||AH|.'
  openmath: (forall (a b c h) (-> (and (!= b c) (on_line h b c) (perpendicular_lines h a b c)) (= (triangle_area a b c) (* (/ 1 2) (dist_of b c) (dist_of a h)))))
  hard_negative:
    statement: $H$が直線$BC$上の点でさえあれば、垂線の足でなくても面積は$\frac{1}{2}BC\cdot AH$である。
    reason: $A=(0,1)$、$B=(0,0)$、$C=(1,0)$、$H=C$では面積は$\frac{1}{2}$だが、$\frac{1}{2}BC\cdot AH=\frac{\sqrt{2}}{2}$である。
  target: |
    ∀ (A B C H : EuclideanSpace ℝ (Fin 2)), B ≠ C → H ∈ line[ℝ, B, C] → inner ℝ (A -ᵥ H) (C -ᵥ B) = 0 → (MeasureTheory.volume (convexHull ℝ ({A, B, C} : Set (EuclideanSpace ℝ (Fin 2))))).toReal = 1 / 2 * dist B C * dist A H
  proof: |
    by
      intro A B C H _ hH hi
      let S : Set (ℝ × ℝ) := {p | 0 ≤ p.1 ∧ 0 ≤ p.2 ∧ p.1 + p.2 ≤ 1}
      have hSm : MeasurableSet S := by
        apply IsClosed.measurableSet
        exact (isClosed_le continuous_const continuous_fst).inter
          ((isClosed_le continuous_const continuous_snd).inter
            (isClosed_le (continuous_fst.add continuous_snd) continuous_const))
      have hSv : MeasureTheory.volume S = ENNReal.ofReal (1 / 2) := by
        rw [MeasureTheory.Measure.volume_eq_prod, MeasureTheory.Measure.prod_apply hSm]
        have hslice : ∀ x : ℝ, MeasureTheory.volume (Prod.mk x ⁻¹' S) =
            (Set.Icc (0 : ℝ) 1).indicator (fun x => ENNReal.ofReal (1 - x)) x := by
          intro x
          by_cases hx : x ∈ Set.Icc (0 : ℝ) 1
          · rw [Set.indicator_of_mem hx]
            have : Prod.mk x ⁻¹' S = Set.Icc 0 (1 - x) := by
              ext y
              simp only [S, Set.mem_preimage, Set.mem_setOf_eq, Set.mem_Icc]
              constructor
              · rintro ⟨_, h2, h3⟩; exact ⟨h2, by linarith⟩
              · rintro ⟨h2, h3⟩; exact ⟨hx.1, h2, by linarith⟩
            rw [this, Real.volume_Icc, sub_zero]
          · rw [Set.indicator_of_notMem hx]
            have : Prod.mk x ⁻¹' S = ∅ := by
              ext y
              simp only [S, Set.mem_preimage, Set.mem_setOf_eq, Set.mem_empty_iff_false, iff_false]
              rintro ⟨h1, h2, h3⟩
              exact hx ⟨h1, by linarith⟩
            rw [this, MeasureTheory.measure_empty]
        simp_rw [hslice]
        rw [MeasureTheory.lintegral_indicator measurableSet_Icc]
        rw [← MeasureTheory.ofReal_integral_eq_lintegral_ofReal]
        · congr 1
          rw [MeasureTheory.integral_Icc_eq_integral_Ioc, ← intervalIntegral.integral_of_le zero_le_one,
            intervalIntegral.integral_sub intervalIntegrable_const (continuous_id'.intervalIntegrable _ _), integral_id]
          norm_num
        · exact (continuous_const.sub continuous_id).integrableOn_Icc
        · filter_upwards [MeasureTheory.ae_restrict_mem measurableSet_Icc] with x hx
          simpa using hx.2
      let T : Set (EuclideanSpace ℝ (Fin 2)) := {x | 0 ≤ x 0 ∧ 0 ≤ x 1 ∧ x 0 + x 1 ≤ 1}
      have hTv : MeasureTheory.volume T = ENNReal.ofReal (1 / 2) := by
        have mp := (MeasureTheory.volume_preserving_finTwoArrow ℝ).comp (PiLp.volume_preserving_ofLp (Fin 2))
        have := mp.measure_preimage hSm.nullMeasurableSet
        rw [hSv] at this
        exact this
      have hTc : Convex ℝ T := by
        intro x hx y hy a b ha hb hab
        simp only [T, Set.mem_setOf_eq, PiLp.add_apply, PiLp.smul_apply, smul_eq_mul] at hx hy ⊢
        obtain ⟨h1, h2, h3⟩ := hx
        obtain ⟨h4, h5, h6⟩ := hy
        refine ⟨by positivity, by positivity, ?_⟩
        nlinarith
      have key : ∀ A B C : EuclideanSpace ℝ (Fin 2), (MeasureTheory.volume (convexHull ℝ ({A, B, C} : Set (EuclideanSpace ℝ (Fin 2))))).toReal =
          1 / 2 * |(B - A) 0 * (C - A) 1 - (B - A) 1 * (C - A) 0| := by
        intro A B C
        set u := B - A with hu
        set w := C - A with hw
        let L : EuclideanSpace ℝ (Fin 2) →ₗ[ℝ] EuclideanSpace ℝ (Fin 2) :=
          { toFun := fun x => x 0 • u + x 1 • w
            map_add' := by
              intro x y
              simp only [PiLp.add_apply, add_smul]
              abel
            map_smul' := by
              intro c x
              simp only [PiLp.smul_apply, smul_eq_mul, mul_smul, smul_add, RingHom.id_apply] }
        have hL : ∀ x, L x = x 0 • u + x 1 • w := fun _ => rfl
        have hdet : LinearMap.det L = u 0 * w 1 - u 1 * w 0 := by
          rw [← LinearMap.det_toMatrix (EuclideanSpace.basisFun (Fin 2) ℝ).toBasis L, Matrix.det_fin_two]
          simp [LinearMap.toMatrix_apply, hL]
          ring
        have hhull : convexHull ℝ ({A, B, C} : Set (EuclideanSpace ℝ (Fin 2))) = (fun y => y + A) '' (L '' T) := by
          apply Set.Subset.antisymm
          · apply convexHull_min
            · intro p hp
              simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hp
              rcases hp with rfl | rfl | rfl
              · exact ⟨0, ⟨0, by simp [T], by simp⟩, by simp⟩
              · refine ⟨u, ⟨EuclideanSpace.single 0 1, by simp [T], by simp [hL]⟩, by simp [hu]⟩
              · refine ⟨w, ⟨EuclideanSpace.single 1 1, by simp [T], by simp [hL]⟩, by simp [hw]⟩
            · have := (hTc.linear_image L).translate A
              convert this using 1
              ext y
              simp [add_comm]
          · rintro _ ⟨_, ⟨x, ⟨h1, h2, h3⟩, rfl⟩, rfl⟩
            have hc := convex_convexHull ℝ ({A, B, C} : Set (EuclideanSpace ℝ (Fin 2)))
            have := hc.sum_mem (t := Finset.univ) (w := ![1 - x 0 - x 1, x 0, x 1]) (z := ![A, B, C])
              (by intro i _; fin_cases i <;> simp <;> linarith) (by simp [Fin.sum_univ_three]; ring)
              (by
                intro i _
                apply subset_convexHull
                fin_cases i <;> simp)
            rw [Fin.sum_univ_three] at this
            convert this using 1
            simp [hL, hu, hw]
            module
        rw [hhull, Set.image_add_right, MeasureTheory.measure_preimage_add_right,
          MeasureTheory.Measure.addHaar_image_linearMap, hTv, hdet, ENNReal.toReal_mul, ENNReal.toReal_ofReal (abs_nonneg _),
          ENNReal.toReal_ofReal (by norm_num)]
        ring
      have inn : ∀ U W : EuclideanSpace ℝ (Fin 2), inner ℝ U W = U 0 * W 0 + U 1 * W 1 := by
        intro U W
        simp [PiLp.inner_apply, Fin.sum_univ_two]
        ring
      have lm : ∀ (X Y : EuclideanSpace ℝ (Fin 2)) (r : ℝ) (i : Fin 2), (AffineMap.lineMap X Y r : EuclideanSpace ℝ (Fin 2)) i = X i + r * (Y i - X i) := by
        intro X Y r i
        simp [AffineMap.lineMap_apply]
        ring
      obtain ⟨t, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hH
      rw [key A B C, dist_comm B C, dist_eq_norm_vsub (EuclideanSpace ℝ (Fin 2)) C B, dist_eq_norm_vsub (EuclideanSpace ℝ (Fin 2)) A]
      rw [vsub_eq_sub, vsub_eq_sub, inn] at hi
      simp only [vsub_eq_sub, PiLp.sub_apply, lm] at hi ⊢
      have : |(B - A) 0 * (C - A) 1 - (B - A) 1 * (C - A) 0| = ‖C - B‖ * ‖A - AffineMap.lineMap B C t‖ := by
        apply (sq_eq_sq₀ (abs_nonneg _) (by positivity)).mp
        rw [sq_abs, mul_pow, ← real_inner_self_eq_norm_sq, ← real_inner_self_eq_norm_sq, inn, inn]
        simp only [PiLp.sub_apply, lm]
        linear_combination -((A 0 - (B 0 + t * (C 0 - B 0))) * (C 0 - B 0) + (A 1 - (B 1 + t * (C 1 - B 1))) * (C 1 - B 1)) * hi
      simp only [PiLp.sub_apply] at this
      rw [this]
      ring
- id: area_ratio_common_vertex_base_line
  kind: gap
  level: middle
  topic: 面積比・高さが等しい三角形
  statement: 平面$\mathbb{R}^2$で$B\neq C$、$D$が直線$BC$上にあるとき、頂点$A$を共有し高さが等しい三角形$ABD$と$ADC$の面積について、$S(ABD)\cdot DC=S(ADC)\cdot BD$である。
  statement_en: In the Euclidean plane, if B ≠ C and D lies on line BC, the areas of triangles ABD and ADC, defined as areas of convex hulls, satisfy S(ABD)|DC| = S(ADC)|BD|.
  assumptions:
  - 三角形の面積$S$は3点の凸包のルベーグ測度とする
  - $B\neq C$
  - $D$は直線$BC$上にある
  quantifiers:
  - 平面$\mathbb{R}^2$の任意の点$A,B,C,D$
  conclusion: $S(ABD)\cdot DC=S(ADC)\cdot BD$である。
  answer: |
    $A,B,C,D$を平面$\mathbb{R}^2$の点とし、$B\neq C$、$D$は直線$BC$上にあるとする。3点の凸包の面積を$S$と書く。

    標準三角形$\{(x,y)\mid x,y\geq0,\ x+y\leq1\}$の面積は$\frac{1}{2}$であり、写像$(x,y)\mapsto X+x\overrightarrow{XY}+y\overrightarrow{XZ}$はこれを$X,Y,Z$の凸包に写すから、$S(XYZ)=\frac{1}{2}|\det(\overrightarrow{XY},\overrightarrow{XZ})|$である。

    $D=B+t\overrightarrow{BC}$と書き、$\Delta=\det(\overrightarrow{AB},\overrightarrow{AC})$とおく。$\overrightarrow{AD}=(1-t)\overrightarrow{AB}+t\overrightarrow{AC}$なので、$\det(\overrightarrow{AB},\overrightarrow{AD})=t\Delta$、$\det(\overrightarrow{AD},\overrightarrow{AC})=(1-t)\Delta$である。よって$S(ABD)=\frac{1}{2}|t||\Delta|$、$S(ADC)=\frac{1}{2}|1-t||\Delta|$である。

    また$BD=|t|BC$、$DC=|1-t|BC$である。したがって両辺とも$\frac{1}{2}|t||1-t||\Delta|BC$に等しい。
  strategy: Write both areas through the determinant of AB and AC with the parameter of D on line BC, and compare with the lengths.
  sketch:
  - 'derive: The area of a triangle equals half an absolute determinant.'
  - 'setup: Write D = B + t BC and Δ = det(AB, AC).'
  - 'derive: The two determinants are tΔ and (1-t)Δ.'
  - 'derive: The lengths are |BD| = |t||BC| and |DC| = |1-t||BC|.'
  - 'conclude: Both products equal (1/2)|t||1-t||Δ||BC|.'
  openmath: (forall (a b c d) (-> (and (!= b c) (on_line d b c)) (= (* (triangle_area a b d) (dist_of d c)) (* (triangle_area a d c) (dist_of b d)))))
  hard_negative:
    statement: 頂点が異なる三角形$ABD$と$A'DC$でも、$S(ABD)\cdot DC=S(A'DC)\cdot BD$である。
    reason: 高さが共通でないと成り立たない。$B=(0,0)$、$D=(1,0)$、$C=(2,0)$、$A=(0,1)$、$A'=(0,2)$では$S(ABD)=\frac{1}{2}$、$S(A'DC)=1$、$BD=DC=1$である。
  target: |
    ∀ (A B C D : EuclideanSpace ℝ (Fin 2)), B ≠ C → D ∈ line[ℝ, B, C] → (MeasureTheory.volume (convexHull ℝ ({A, B, D} : Set (EuclideanSpace ℝ (Fin 2))))).toReal * dist D C = (MeasureTheory.volume (convexHull ℝ ({A, D, C} : Set (EuclideanSpace ℝ (Fin 2))))).toReal * dist B D
  proof: |
