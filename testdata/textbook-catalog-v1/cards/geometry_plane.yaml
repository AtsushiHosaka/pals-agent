      have e2 : (AffineMap.lineMap B C t - A : EuclideanSpace ℝ (Fin 2)) 0 * (C - A : EuclideanSpace ℝ (Fin 2)) 1 - (AffineMap.lineMap B C t - A : EuclideanSpace ℝ (Fin 2)) 1 * (C - A : EuclideanSpace ℝ (Fin 2)) 0 =
