- id: alternate_angles_of_parallel
  kind: textbook
  level: middle
  topic: 平行線・錯角
  statement: ユークリッド空間の点$A,B,C,D$について、$A\neq C$で、$B$と$D$が直線$AC$に関して真に反対側にあり、直線$AB$と直線$DC$が平行なら、錯角は等しく$\angle BAC=\angle DCA$である。
  statement_en: If A ≠ C, B and D lie strictly on opposite sides of line AC, and line AB is parallel to line DC, then the alternate angles agree, ∠BAC = ∠DCA.
  assumptions:
  - $A\neq C$
  - $B$と$D$は直線$AC$に関して真に反対側にある
  - 直線$AB$と直線$DC$は平行である
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $\angle BAC=\angle DCA$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$A\neq C$、$B$と$D$は直線$AC$に関して真に反対側にあり、直線$AB$と直線$DC$は平行とする。$B,D$は直線$AC$上にないので$B\neq A$、$D\neq C$である。平行であるから、ある実数$k$により$\overrightarrow{DC}=k\overrightarrow{AB}$と書ける。

    $k>0$を示す。$k=0$なら$D=C$となり、$D$が直線$AC$上にないことに反する。$k<0$なら$D=C+(-k)\overrightarrow{AB}$である。直線$AC$上の点に$\overrightarrow{AB}$の正の倍を足した点は$B$と同じ側にあるので、$B$と$D$は同じ側にあることになり、仮定に反する。よって$k>0$である。

    $\angle DCA$は$\overrightarrow{CD}=-k\overrightarrow{AB}$と$\overrightarrow{CA}=-\overrightarrow{AC}$のなす角である。2つのベクトルをともに反転してもなす角は変わらず、一方を正の数で割ってもなす角は変わらない。したがって$\angle DCA$は$\overrightarrow{AB}$と$\overrightarrow{AC}$のなす角、つまり$\angle BAC$に等しい。
  strategy: Write DC as a positive multiple of AB, using the opposite-side hypothesis to fix the sign, then compare the two angles as angles between vectors.
  sketch:
  - 'setup: Parallelism gives a real k with DC = k AB.'
  - 'contradiction: k = 0 puts D on line AC, and k < 0 puts D on the same side as B.'
  - 'translate: The angle DCA is the angle between -k AB and -AC.'
  - 'conclude: Negating both vectors and dividing by k > 0 leaves the angle between AB and AC, which is ∠BAC.'
  openmath: (forall (a b c d) (-> (and (!= a c) (opposite_side_of_line b d a c) (parallel_lines a b d c)) (= (euclid_angle b a c) (euclid_angle d c a))))
  hard_negative:
    statement: 直線$AB$と直線$DC$が平行なら、$B,D$が直線$AC$の同じ側にあっても$\angle BAC=\angle DCA$である。
    reason: $A=(0,0)$、$C=(1,0)$、$B=(1,1)$、$D=(2,1)$では、$\angle BAC=\pi/4$だが$\angle DCA=3\pi/4$である。同じ側のとき2角は和が$\pi$になる。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), A ≠ C → (line[ℝ, A, C]).SOppSide B D → (line[ℝ, A, B]).Parallel line[ℝ, D, C] → EuclideanGeometry.angle B A C = EuclideanGeometry.angle D C A
  proof: |
    by
      intro V P _ _ _ _ A B C D _ hs hpar
      rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev] at hpar
      have m1 : C -ᵥ D ∈ Submodule.span ℝ {B -ᵥ A} := by rw [hpar]; exact Submodule.mem_span_singleton_self _
      obtain ⟨k, hk⟩ := Submodule.mem_span_singleton.mp m1
      have hkpos : 0 < k := by
        by_contra hk0
        rcases (not_lt.mp hk0).lt_or_eq with hneg | hz
        · have hD : D = (-k) • (B -ᵥ A) +ᵥ C := by
            rw [neg_smul, hk, neg_vsub_eq_vsub_rev, vsub_vadd]
          have h3 := AffineSubspace.sSameSide_smul_vsub_vadd_left (s := line[ℝ, A, C]) hs.2.1
            (left_mem_affineSpan_pair ℝ A C) (right_mem_affineSpan_pair ℝ A C) (neg_pos.mpr hneg)
          rw [← hD] at h3
          exact h3.symm.not_sOppSide hs
        · rw [hz, zero_smul] at hk
          exact hs.2.2 (vsub_eq_zero_iff_eq.mp hk.symm ▸ right_mem_affineSpan_pair ℝ A C)
      unfold EuclideanGeometry.angle
      rw [← neg_vsub_eq_vsub_rev C D, ← hk, ← neg_vsub_eq_vsub_rev C A, InnerProductGeometry.angle_neg_neg,
        InnerProductGeometry.angle_smul_left_of_pos _ _ hkpos]
- id: parallel_of_alternate_angles
  kind: textbook
  level: middle
  topic: 平行線・錯角の逆
  statement: ユークリッド平面の点$A,B,C,D$について、$A\neq C$で、$B$と$D$が直線$AC$に関して真に反対側にあり、$\angle BAC=\angle DCA$なら、直線$AB$と直線$DC$は平行である。
  statement_en: In a Euclidean plane, if A ≠ C, B and D lie strictly on opposite sides of line AC and ∠BAC = ∠DCA, then line AB is parallel to line DC.
  assumptions:
  - 2次元のユークリッド平面で考える
  - $A\neq C$
  - $B$と$D$は直線$AC$に関して真に反対側にある
  - $\angle BAC=\angle DCA$
  quantifiers:
  - ユークリッド平面の任意の点$A,B,C,D$
  conclusion: 直線$AB$と直線$DC$は平行である。
  answer: |
    $A,B,C,D$をユークリッド平面の点とし、$A\neq C$、$B$と$D$は直線$AC$に関して真に反対側にあり、$\angle BAC=\angle DCA$とする。$B,D$は直線$AC$上にないので$B\neq A$、$D\neq C$である。平面に向きを1つ固定し、有向角で考える。

    3点の有向角の符号は、3点を順にたどる向きで決まる。$B,D$が反対側にあるので、$A,B,C$と$A,D,C$をたどる向きは逆である。$B,A,C$は$A,B,C$の順序を入れ替えたものだから向きが逆であり、$D,C,A$は$A,D,C$の巡回だから向きが同じである。よって有向角$BAC$と有向角$DCA$の符号は等しい。符号が等しく無向角も等しいので、2つの有向角は等しい。

    有向角$DCA$は$\overrightarrow{CD}$から$\overrightarrow{CA}$への角で、両方を反転しても変わらないから、$\overrightarrow{DC}$から$\overrightarrow{AC}$への角に等しい。したがって、$\overrightarrow{AB}$から$\overrightarrow{AC}$への有向角と、$\overrightarrow{DC}$から$\overrightarrow{AC}$への有向角は等しい。角の加法により、$\overrightarrow{AB}$から$\overrightarrow{DC}$への有向角は$0$である。ゆえに$\overrightarrow{DC}$は$\overrightarrow{AB}$の正の倍であり、2直線は平行である。
  strategy: Upgrade the equality of unoriented angles to oriented angles using the opposite-side sign rule, then subtract to get a zero oriented angle between AB and DC.
  sketch:
  - 'setup: Fix an orientation of the plane and note B ≠ A and D ≠ C.'
  - 'derive: Opposite sides of AC give equal signs for the oriented angles BAC and DCA.'
  - 'derive: Equal unoriented angles with equal signs give equal oriented angles.'
  - 'translate: Negating both vectors rewrites the angle DCA as the angle from DC to AC.'
  - 'conclude: The oriented angle from AB to DC is 0, so DC is a positive multiple of AB and the lines are parallel.'
  openmath: (forall (a b c d) (-> (and (!= a c) (opposite_side_of_line b d a c) (= (euclid_angle b a c) (euclid_angle d c a))) (parallel_lines a b d c)))
  hard_negative:
    statement: $B,D$が直線$AC$の同じ側にあっても、$\angle BAC=\angle DCA$なら直線$AB$と直線$DC$は平行である。
    reason: $A=(0,0)$、$C=(2,0)$、$B=D=(1,1)$では2角はともに$\pi/4$だが、直線$AB$と直線$DC$は点$(1,1)$で交わり平行でない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (A B C D : P), A ≠ C → (line[ℝ, A, C]).SOppSide B D → EuclideanGeometry.angle B A C = EuclideanGeometry.angle D C A → (line[ℝ, A, B]).Parallel line[ℝ, D, C]
  proof: |
    by
      intro V P _ _ _ _ _ A B C D hAC hs hang
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have hBA : B ≠ A := fun h => hs.2.1 (h ▸ left_mem_affineSpan_pair ℝ A C)
      have hDC : D ≠ C := fun h => hs.2.2 (h ▸ right_mem_affineSpan_pair ℝ A C)
      have hsgn : (EuclideanGeometry.oangle B A C).sign = (EuclideanGeometry.oangle D C A).sign := by
        have h1 := AffineSubspace.SOppSide.oangle_sign_eq_neg (left_mem_affineSpan_pair ℝ A C) (right_mem_affineSpan_pair ℝ A C) hs
        rw [EuclideanGeometry.oangle_rotate_sign A D C, h1, EuclideanGeometry.oangle_rev C A B, Real.Angle.sign_neg,
          EuclideanGeometry.oangle_rotate_sign B C A, EuclideanGeometry.oangle_rotate_sign A B C]
      have hoa := EuclideanGeometry.oangle_eq_of_angle_eq_of_sign_eq hang hsgn
      have hu : B -ᵥ A ≠ 0 := vsub_ne_zero.mpr hBA
      have hv : C -ᵥ D ≠ 0 := vsub_ne_zero.mpr hDC.symm
      have hw : C -ᵥ A ≠ 0 := vsub_ne_zero.mpr hAC.symm
      unfold EuclideanGeometry.oangle at hoa
      rw [← neg_vsub_eq_vsub_rev C D, ← neg_vsub_eq_vsub_rev C A, Orientation.oangle_neg_neg] at hoa
      have hz := Orientation.oangle_add (Module.Oriented.positiveOrientation (R := ℝ) (M := V) (ι := Fin 2)) hu hv hw
      rw [hoa] at hz
      have hray := (Orientation.oangle_eq_zero_iff_sameRay _).mp (add_eq_right.mp hz)
      obtain ⟨r, hr, hrv⟩ := hray.exists_pos_left hu hv
      rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev, ← hrv]
      exact (Submodule.span_singleton_smul_eq (IsUnit.mk0 _ hr.ne') _).symm
- id: corresponding_angles_of_parallel
  kind: textbook
  level: middle
  topic: 平行線・同位角
  statement: ユークリッド空間の点$A,B,C,D,E$について、$A$が$E$と$C$の真に間にあり、$B$と$D$が直線$AC$の真に同じ側にあり、直線$AB$と直線$CD$が平行なら、同位角は等しく$\angle EAB=\angle ACD$である。
  statement_en: If A lies strictly between E and C, B and D lie strictly on the same side of line AC, and line AB is parallel to line CD, then the corresponding angles agree, ∠EAB = ∠ACD.
  assumptions:
  - $A$は$E$と$C$の真に間にある
  - $B$と$D$は直線$AC$の真に同じ側にある
  - 直線$AB$と直線$CD$は平行である
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D,E$
  conclusion: $\angle EAB=\angle ACD$である。
  answer: |
    $A,B,C,D,E$をユークリッド空間の点とし、$A$は$E$と$C$の真に間にあり、$B$と$D$は直線$AC$の真に同じ側にあり、直線$AB$と直線$CD$は平行とする。$B,D$は直線$AC$上にないので$B\neq A$、$D\neq C$であり、平行であるから、ある実数$k$により$\overrightarrow{CD}=k\overrightarrow{AB}$と書ける。

    $k>0$を示す。$k=0$なら$D=C$となり、$D$が直線$AC$上にないことに反する。$k<0$なら、$D=C+k\overrightarrow{AB}$は直線$AC$上の点に$\overrightarrow{AB}$の負の倍を足した点だから、$B$と反対側にあり、仮定に反する。よって$k>0$である。

    $A$が$E$と$C$の真に間にあるので、ある正の数$r$により$\overrightarrow{CA}=r\overrightarrow{AE}$である。したがって$\angle ACD$は$r\overrightarrow{AE}$と$k\overrightarrow{AB}$のなす角である。ベクトルを正の数倍してもなす角は変わらないから、これは$\overrightarrow{AE}$と$\overrightarrow{AB}$のなす角、つまり$\angle EAB$に等しい。
  strategy: Show CD is a positive multiple of AB and CA is a positive multiple of AE, then use that positive scaling keeps angles.
  sketch:
  - 'setup: Parallelism gives a real k with CD = k AB.'
  - 'contradiction: k = 0 puts D on line AC, and k < 0 puts D on the opposite side from B.'
  - 'derive: Since A is strictly between E and C, CA = r AE for some r > 0.'
  - 'conclude: Hence ∠ACD is the angle between r AE and k AB, which equals ∠EAB.'
  openmath: (forall (a b c d e) (-> (and (strictly_between e a c) (same_side_of_line b d a c) (parallel_lines a b c d)) (= (euclid_angle e a b) (euclid_angle a c d))))
  hard_negative:
    statement: $B,D$が直線$AC$に関して反対側にあっても、直線$AB$と直線$CD$が平行なら$\angle EAB=\angle ACD$である。
    reason: $E=(-1,0)$、$A=(0,0)$、$C=(1,0)$、$B=(1,1)$、$D=(0,-1)$では2直線は平行だが、$\angle EAB=3\pi/4$、$\angle ACD=\pi/4$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D E : P), Sbtw ℝ E A C → (line[ℝ, A, C]).SSameSide B D → (line[ℝ, A, B]).Parallel line[ℝ, C, D] → EuclideanGeometry.angle E A B = EuclideanGeometry.angle A C D
  proof: |
    by
      intro V P _ _ _ _ A B C D E hE hs hpar
      rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev] at hpar
      have m1 : D -ᵥ C ∈ Submodule.span ℝ {B -ᵥ A} := by rw [hpar]; exact Submodule.mem_span_singleton_self _
      obtain ⟨k, hk⟩ := Submodule.mem_span_singleton.mp m1
      have hkpos : 0 < k := by
        by_contra hk0
        rcases (not_lt.mp hk0).lt_or_eq with hneg | hz
        · have hD : D = k • (B -ᵥ A) +ᵥ C := by rw [hk, vsub_vadd]
          have h3 := AffineSubspace.sOppSide_smul_vsub_vadd_left (s := line[ℝ, A, C]) hs.2.1
            (left_mem_affineSpan_pair ℝ A C) (right_mem_affineSpan_pair ℝ A C) hneg
          rw [← hD] at h3
          exact hs.symm.not_sOppSide h3
        · rw [hz, zero_smul] at hk
          exact hs.2.2 (vsub_eq_zero_iff_eq.mp hk.symm ▸ right_mem_affineSpan_pair ℝ A C)
      have hpi := hE.angle₁₂₃_eq_pi
      unfold EuclideanGeometry.angle at hpi ⊢
      obtain ⟨-, r, hr, hrw⟩ := InnerProductGeometry.angle_eq_pi_iff.mp hpi
      have hAC : A -ᵥ C = (-r) • (E -ᵥ A) := by
        rw [neg_smul, ← hrw, neg_vsub_eq_vsub_rev]
      rw [hAC, ← hk, InnerProductGeometry.angle_smul_left_of_pos _ _ (neg_pos.mpr hr),
        InnerProductGeometry.angle_smul_right_of_pos _ _ hkpos]
- id: parallel_of_corresponding_angles
  kind: textbook
  level: middle
  topic: 平行線・同位角の逆
  statement: ユークリッド平面の点$A,B,C,D,E$について、$A$が$E$と$C$の真に間にあり、$B$と$D$が直線$AC$の真に同じ側にあり、$\angle EAB=\angle ACD$なら、直線$AB$と直線$CD$は平行である。
  statement_en: In a Euclidean plane, if A lies strictly between E and C, B and D lie strictly on the same side of line AC and ∠EAB = ∠ACD, then line AB is parallel to line CD.
  assumptions:
  - 2次元のユークリッド平面で考える
  - $A$は$E$と$C$の真に間にある
  - $B$と$D$は直線$AC$の真に同じ側にある
  - $\angle EAB=\angle ACD$
  quantifiers:
  - ユークリッド平面の任意の点$A,B,C,D,E$
  conclusion: 直線$AB$と直線$CD$は平行である。
  answer: |
    $A,B,C,D,E$をユークリッド平面の点とし、$A$は$E$と$C$の真に間にあり、$B$と$D$は直線$AC$の真に同じ側にあり、$\angle EAB=\angle ACD$とする。$B\neq A$、$D\neq C$、$C\neq A$である。

    $A$は$E$と$C$の真に間にあるので$\angle EAB+\angle BAC=\pi$である。また$\overrightarrow{CA}=-\overrightarrow{AC}$より、$\angle ACD=\pi-(\overrightarrow{CD}\text{と}\overrightarrow{AC}\text{のなす角})$である。仮定とあわせると、$\overrightarrow{AB}$と$\overrightarrow{AC}$のなす角は、$\overrightarrow{CD}$と$\overrightarrow{AC}$のなす角に等しい。

    平面に向きを固定する。$\overrightarrow{AB}$から$\overrightarrow{AC}$への有向角の符号は、3点$B,A,C$をたどる向きで決まる。$\overrightarrow{CD}$から$\overrightarrow{AC}$への有向角の符号は、$\overrightarrow{AC}=-\overrightarrow{CA}$より有向角$DCA$の符号の反対である。$B,D$が同じ側にあるので$A,B,C$と$A,D,C$をたどる向きは同じであり、$B,A,C$は$A,B,C$の向きの反対であり、$D,C,A$は$A,D,C$の巡回であるから、有向角$BAC$の符号は有向角$DCA$の符号の反対である。よって2つの符号は等しい。

    符号もなす角も等しいので、2つの有向角は等しい。角の加法により$\overrightarrow{AB}$から$\overrightarrow{CD}$への有向角は$0$である。ゆえに$\overrightarrow{CD}$は$\overrightarrow{AB}$の正の倍であり、2直線は平行である。
  strategy: Use the linear pair at A to turn the hypothesis into equal angles against AC, then use the same-side sign rule to upgrade to oriented angles.
  sketch:
  - 'derive: The linear pair at A gives ∠EAB + ∠BAC = π.'
  - 'derive: Hence AB and CD make the same angle with AC.'
  - 'derive: The same-side hypothesis makes the two oriented angles against AC have equal sign.'
  - 'derive: Equal angle and equal sign give equal oriented angles.'
  - 'conclude: The oriented angle from AB to CD is 0, so the lines are parallel.'
  openmath: (forall (a b c d e) (-> (and (strictly_between e a c) (same_side_of_line b d a c) (= (euclid_angle e a b) (euclid_angle a c d))) (parallel_lines a b c d)))
  hard_negative:
    statement: $B,D$が直線$AC$に関して反対側にあっても、$\angle EAB=\angle ACD$なら直線$AB$と直線$CD$は平行である。
    reason: $E=(-1,0)$、$A=(0,0)$、$C=(1,0)$、$B=(-1,1)$、$D=(0,-1)$では2角はともに$\pi/4$だが、直線$AB$の方向$(-1,1)$と直線$CD$の方向$(-1,-1)$は平行でない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (A B C D E : P), Sbtw ℝ E A C → (line[ℝ, A, C]).SSameSide B D → EuclideanGeometry.angle E A B = EuclideanGeometry.angle A C D → (line[ℝ, A, B]).Parallel line[ℝ, C, D]
  proof: |
    by
      intro V P _ _ _ _ _ A B C D E hE hs hang
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      haveI : Module.Oriented ℝ V (Fin 2) := ⟨Module.Basis.orientation (Module.finBasisOfFinrankEq ℝ V Fact.out)⟩
      have hBA : B ≠ A := fun h => hs.2.1 (h ▸ left_mem_affineSpan_pair ℝ A C)
      have hDC : D ≠ C := fun h => hs.2.2 (h ▸ right_mem_affineSpan_pair ℝ A C)
      have hCA : C ≠ A := hE.right_ne
      have hu : B -ᵥ A ≠ 0 := vsub_ne_zero.mpr hBA
      have hv : D -ᵥ C ≠ 0 := vsub_ne_zero.mpr hDC
      have hw : C -ᵥ A ≠ 0 := vsub_ne_zero.mpr hCA
      have hsum := EuclideanGeometry.angle_add_angle_eq_pi_of_angle_eq_pi B hE.angle₁₂₃_eq_pi
      have h1 : InnerProductGeometry.angle (B -ᵥ A) (C -ᵥ A) = InnerProductGeometry.angle (D -ᵥ C) (C -ᵥ A) := by
        have h2 : EuclideanGeometry.angle A C D = Real.pi - InnerProductGeometry.angle (D -ᵥ C) (C -ᵥ A) := by
          unfold EuclideanGeometry.angle
          rw [← neg_vsub_eq_vsub_rev C A, InnerProductGeometry.angle_neg_left, InnerProductGeometry.angle_comm]
        have h3 : EuclideanGeometry.angle B A C = InnerProductGeometry.angle (B -ᵥ A) (C -ᵥ A) := rfl
        have h4 : EuclideanGeometry.angle E A B = EuclideanGeometry.angle B A E := EuclideanGeometry.angle_comm _ _ _
        linarith
      have hsgn : ((Module.Oriented.positiveOrientation (R := ℝ) (M := V) (ι := Fin 2)).oangle (B -ᵥ A) (C -ᵥ A)).sign =
          ((Module.Oriented.positiveOrientation (R := ℝ) (M := V) (ι := Fin 2)).oangle (D -ᵥ C) (C -ᵥ A)).sign := by
        have h5 := AffineSubspace.SSameSide.oangle_sign_eq (left_mem_affineSpan_pair ℝ A C) (right_mem_affineSpan_pair ℝ A C) hs
        have h6 : ((Module.Oriented.positiveOrientation (R := ℝ) (M := V) (ι := Fin 2)).oangle (B -ᵥ A) (C -ᵥ A)).sign =
            (EuclideanGeometry.oangle B A C).sign := rfl
        have h7 : ((Module.Oriented.positiveOrientation (R := ℝ) (M := V) (ι := Fin 2)).oangle (D -ᵥ C) (C -ᵥ A)).sign =
            -(EuclideanGeometry.oangle D C A).sign := by
          unfold EuclideanGeometry.oangle
          rw [← neg_vsub_eq_vsub_rev C A, Orientation.oangle_sign_neg_right, neg_neg]
        rw [h6, h7, EuclideanGeometry.oangle_rotate_sign A D C, h5, EuclideanGeometry.oangle_rev C A B, Real.Angle.sign_neg,
          EuclideanGeometry.oangle_rotate_sign B C A, EuclideanGeometry.oangle_rotate_sign A B C]
      have hoa := Orientation.oangle_eq_of_angle_eq_of_sign_eq _ h1 hsgn
      have hz := Orientation.oangle_add (Module.Oriented.positiveOrientation (R := ℝ) (M := V) (ι := Fin 2)) hu hv hw
      rw [hoa] at hz
      have hray := (Orientation.oangle_eq_zero_iff_sameRay _).mp (add_eq_right.mp hz)
      obtain ⟨r, hr, hrv⟩ := hray.exists_pos_left hu hv
      rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev, ← hrv]
      exact (Submodule.span_singleton_smul_eq (IsUnit.mk0 _ hr.ne') _).symm
- id: parallel_of_common_perpendicular
  kind: gap
  level: middle
  topic: 平行線・共通の垂線
  statement: ユークリッド平面で、直線$AB$と直線$CD$がともに直線$EF$に垂直なら、直線$AB$と直線$CD$は平行である（一致する場合を含む）。ただし$A\neq B$、$C\neq D$、$E\neq F$とする。
  statement_en: In a Euclidean plane, if A ≠ B, C ≠ D, E ≠ F and lines AB and CD are both perpendicular to line EF, then line AB is parallel to line CD, coincidence allowed.
  assumptions:
  - 2次元のユークリッド平面で考える
  - $A\neq B$、$C\neq D$、$E\neq F$
  - $\overrightarrow{AB}\cdot\overrightarrow{EF}=0$
  - $\overrightarrow{CD}\cdot\overrightarrow{EF}=0$
  quantifiers:
  - ユークリッド平面の任意の点$A,B,C,D,E,F$
  conclusion: 直線$AB$と直線$CD$は平行である（一致を含む）。
  answer: |
    $A,B,C,D,E,F$をユークリッド平面の点とし、$A\neq B$、$C\neq D$、$E\neq F$、$\overrightarrow{AB}\cdot\overrightarrow{EF}=0$、$\overrightarrow{CD}\cdot\overrightarrow{EF}=0$とする。$\overrightarrow{EF}\neq\vec{0}$であり、平面の次元は$2$だから、$\overrightarrow{EF}$に直交するベクトル全体は$1$次元の部分空間である。$\overrightarrow{AB}$と$\overrightarrow{CD}$はともにこの部分空間に属し、$\overrightarrow{AB}\neq\vec{0}$である。したがって、ある実数$c$により$\overrightarrow{CD}=c\overrightarrow{AB}$と書ける。$\overrightarrow{CD}\neq\vec{0}$より$c\neq0$である。よって2直線の方向は一致し、平行である。
  strategy: The orthogonal complement of a nonzero vector in a plane is one-dimensional, so both direction vectors are multiples of each other.
  sketch:
  - 'setup: The vector EF is nonzero and the plane has dimension 2.'
  - 'derive: The orthogonal complement of EF has dimension 1 and contains AB and CD.'
  - 'derive: Since AB ≠ 0, CD = c AB, and c ≠ 0 because CD ≠ 0.'
  - 'conclude: The lines have the same direction, so they are parallel.'
  openmath: (forall (a b c d e f) (-> (and (!= a b) (!= c d) (!= e f) (perpendicular_lines a b e f) (perpendicular_lines c d e f)) (parallel_lines a b c d)))
  hard_negative:
    statement: 3次元空間でも、同じ直線に垂直な2直線は平行である。
    reason: $z$軸に対して$x$軸と$y$軸はともに垂直だが、$x$軸と$y$軸は平行でない。平面という仮定が要る。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] (A B C D E F : P), A ≠ B → C ≠ D → E ≠ F → inner ℝ (B -ᵥ A) (F -ᵥ E) = 0 → inner ℝ (D -ᵥ C) (F -ᵥ E) = 0 → (line[ℝ, A, B]).Parallel line[ℝ, C, D]
  proof: |
    by
      intro V P _ _ _ _ _ A B C D E F hAB hCD hEF h1 h2
      haveI : FiniteDimensional ℝ V := FiniteDimensional.of_fact_finrank_eq_two
      have hn : F -ᵥ E ≠ 0 := vsub_ne_zero.mpr hEF.symm
      haveI : Fact (Module.finrank ℝ V = 1 + 1) := ⟨Fact.out⟩
      have hfr : Module.finrank ℝ (Submodule.span ℝ {F -ᵥ E})ᗮ = 1 := Submodule.finrank_orthogonal_span_singleton hn
      have hu : B -ᵥ A ∈ (Submodule.span ℝ {F -ᵥ E})ᗮ := by
        rw [Submodule.mem_orthogonal_singleton_iff_inner_left]; exact h1
      have hv : D -ᵥ C ∈ (Submodule.span ℝ {F -ᵥ E})ᗮ := by
        rw [Submodule.mem_orthogonal_singleton_iff_inner_left]; exact h2
      have hu0 : (⟨B -ᵥ A, hu⟩ : (Submodule.span ℝ {F -ᵥ E})ᗮ) ≠ 0 := by
        intro h; exact hAB (vsub_eq_zero_iff_eq.mp (congrArg Subtype.val h)).symm
      obtain ⟨c, hc⟩ := (finrank_eq_one_iff_of_nonzero' _ hu0).mp hfr ⟨D -ᵥ C, hv⟩
      have hc' : c • (B -ᵥ A) = D -ᵥ C := congrArg Subtype.val hc
      have hc0 : c ≠ 0 := by
        rintro rfl
        rw [zero_smul] at hc'
        exact hCD (vsub_eq_zero_iff_eq.mp hc'.symm).symm
      rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev, ← hc']
      exact (Submodule.span_singleton_smul_eq (IsUnit.mk0 _ hc0) _).symm
- id: parallelogram_properties
  kind: textbook
  level: middle
  topic: 平行四辺形・性質
  statement: ユークリッド空間の点$A,B,C,D$が$A\neq B$、$A\neq D$、$\overrightarrow{AB}=\overrightarrow{DC}$をみたす（平行四辺形$ABCD$）なら、$AB=DC$、$AD=BC$であり、対角線$AC$と$BD$の中点は一致し、$\angle ABC=\angle CDA$、$\angle BCD=\angle DAB$である。
  statement_en: If A ≠ B, A ≠ D and AB = DC as vectors, then |AB| = |DC|, |AD| = |BC|, the diagonals AC and BD have the same midpoint, ∠ABC = ∠CDA and ∠BCD = ∠DAB.
  assumptions:
  - $A\neq B$、$A\neq D$
  - $\overrightarrow{AB}=\overrightarrow{DC}$
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: 対辺は等しく、対角線は中点を共有し、対角は等しい。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$A\neq B$、$A\neq D$、$\overrightarrow{AB}=\overrightarrow{DC}$とする。この式から$\overrightarrow{AD}=\overrightarrow{AB}+\overrightarrow{BD}=\overrightarrow{DC}+\overrightarrow{BD}=\overrightarrow{BC}$も得られる。したがって$C\neq D$、$B\neq C$でもあり、4つの角はすべて定まる。

    ベクトルの長さを比べると$AB=DC$、$AD=BC$である。

    $\overrightarrow{AB}=\overrightarrow{DC}$は$\overrightarrow{BA}=\overrightarrow{CD}$と同じであり、これは$A-B=D-C$すなわち$A+C=B+D$を意味する。よって$AC$の中点と$BD$の中点は一致する。

    $\angle ABC$は$\overrightarrow{BA}$と$\overrightarrow{BC}$のなす角である。$\overrightarrow{BA}=-\overrightarrow{DC}$、$\overrightarrow{BC}=\overrightarrow{AD}=-\overrightarrow{DA}$であり、2つのベクトルをともに反転してもなす角は変わらないから、これは$\overrightarrow{DC}$と$\overrightarrow{DA}$のなす角$\angle CDA$に等しい。同様に、$\overrightarrow{CB}=-\overrightarrow{AD}$、$\overrightarrow{CD}=-\overrightarrow{AB}$より$\angle BCD=\angle DAB$である。
  strategy: Derive AD = BC from the defining vector equation, then read off lengths, midpoints and angles from vector identities.
  sketch:
  - 'derive: AB = DC implies AD = BC as vectors.'
  - 'derive: Equal vectors have equal lengths, so opposite sides agree.'
  - 'derive: The vector equation is equivalent to A + C = B + D, so the midpoints coincide.'
  - 'conclude: Opposite angles are angles between pairs of negated vectors, so they agree.'
  openmath: (forall (a b c d) (-> (and (!= a b) (!= a d) (parallelogram a b c d)) (and (= (dist_of a b) (dist_of d c)) (= (dist_of a d) (dist_of b c)) (= (midpoint_of a c) (midpoint_of b d)) (= (euclid_angle a b c) (euclid_angle c d a)) (= (euclid_angle b c d) (euclid_angle d a b)))))
  hard_negative:
    statement: 平行四辺形の対角線の長さは等しい。
    reason: $A=(0,0)$、$B=(2,0)$、$C=(3,1)$、$D=(1,1)$では$AC=\sqrt{10}$、$BD=\sqrt{2}$である。等しくなるのは長方形のときである。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), A ≠ B → A ≠ D → B -ᵥ A = C -ᵥ D → dist A B = dist D C ∧ dist A D = dist B C ∧ midpoint ℝ A C = midpoint ℝ B D ∧ EuclideanGeometry.angle A B C = EuclideanGeometry.angle C D A ∧ EuclideanGeometry.angle B C D = EuclideanGeometry.angle D A B
  proof: |
    by
      intro V P _ _ _ _ A B C D _ _ h
      have h2 : D -ᵥ A = C -ᵥ B := by
        have := vsub_sub_vsub_comm B A C D
        rw [h, sub_self] at this
        have h3 := sub_eq_zero.mp this.symm
        rw [← neg_vsub_eq_vsub_rev A D, ← neg_vsub_eq_vsub_rev B C, ← h3]
      refine ⟨?_, ?_, ?_, ?_, ?_⟩
      · rw [dist_comm A B, dist_comm D C, dist_eq_norm_vsub V B A, dist_eq_norm_vsub V C D, h]
      · rw [dist_comm A D, dist_comm B C, dist_eq_norm_vsub V D A, dist_eq_norm_vsub V C B, h2]
      · rw [midpoint_eq_midpoint_iff_vsub_eq_vsub, ← neg_vsub_eq_vsub_rev B A, h, neg_vsub_eq_vsub_rev]
      · unfold EuclideanGeometry.angle
        rw [← neg_vsub_eq_vsub_rev B A, h, ← h2, ← neg_vsub_eq_vsub_rev A D, InnerProductGeometry.angle_neg_neg]
      · unfold EuclideanGeometry.angle
        rw [← neg_vsub_eq_vsub_rev C B, ← h2, ← neg_vsub_eq_vsub_rev C D, ← h, InnerProductGeometry.angle_neg_neg]
- id: parallelogram_of_diagonals_bisect
  kind: gap
  level: middle
  topic: 平行四辺形・判定（対角線）
  statement: ユークリッド空間の点$A,B,C,D$について、線分$AC$と線分$BD$の中点が一致するなら$\overrightarrow{AB}=\overrightarrow{DC}$である。
  statement_en: If segments AC and BD have the same midpoint, then AB = DC as vectors.
  assumptions:
  - 線分$AC$の中点と線分$BD$の中点は一致する
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $\overrightarrow{AB}=\overrightarrow{DC}$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、線分$AC$と線分$BD$の中点が一致するとする。任意の基準点$O$からの位置ベクトルで書くと、中点が一致することは$\overrightarrow{OA}+\overrightarrow{OC}=\overrightarrow{OB}+\overrightarrow{OD}$を意味する。移項すると$\overrightarrow{OB}-\overrightarrow{OA}=\overrightarrow{OC}-\overrightarrow{OD}$であり、これは$\overrightarrow{AB}=\overrightarrow{DC}$である。
  strategy: Write the midpoint equality with position vectors and rearrange.
  sketch:
  - 'translate: Equal midpoints mean A + C = B + D in position vectors.'
  - 'conclude: Rearranging gives B - A = C - D, that is AB = DC.'
  openmath: (forall (a b c d) (-> (= (midpoint_of a c) (midpoint_of b d)) (parallelogram a b c d)))
  hard_negative:
    statement: 対角線$AC$と$BD$が直交して交わるなら$\overrightarrow{AB}=\overrightarrow{DC}$である。
    reason: $A=(0,0)$、$C=(3,0)$、$B=(1,1)$、$D=(1,-1)$では対角線は直交するが、$\overrightarrow{AB}=(1,1)$、$\overrightarrow{DC}=(2,1)$である。判定に要るのは中点の一致である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), midpoint ℝ A C = midpoint ℝ B D → B -ᵥ A = C -ᵥ D
  proof: |
    by
      intro V P _ _ _ _ A B C D h
      rw [midpoint_eq_midpoint_iff_vsub_eq_vsub] at h
      rw [← neg_vsub_eq_vsub_rev A B, h, neg_vsub_eq_vsub_rev]
- id: parallelogram_of_two_pairs_parallel
  kind: gap
  level: middle
  topic: 平行四辺形・判定（2組の対辺が平行）
  statement: ユークリッド空間の点$A,B,C,D$について、$A,B,D$が同一直線上になく、直線$AB$と直線$DC$が平行で、直線$AD$と直線$BC$も平行なら、$\overrightarrow{AB}=\overrightarrow{DC}$である。
  statement_en: If A, B, D are not collinear, line AB is parallel to line DC and line AD is parallel to line BC, then AB = DC as vectors.
  assumptions:
  - $A,B,D$は同一直線上にない
  - 直線$AB$と直線$DC$は平行である
  - 直線$AD$と直線$BC$は平行である
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $\overrightarrow{AB}=\overrightarrow{DC}$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$A,B,D$は同一直線上になく、直線$AB$と直線$DC$、直線$AD$と直線$BC$はそれぞれ平行とする。$u=\overrightarrow{AB}$、$v=\overrightarrow{AD}$とおく。$A,B,D$が同一直線上にないので、$u,v$は線形独立である。

    平行であるから、実数$a,b$により$\overrightarrow{DC}=au$、$\overrightarrow{BC}=bv$と書ける。$\overrightarrow{AC}$を2通りに表すと、$\overrightarrow{AC}=v+au$、$\overrightarrow{AC}=u+bv$である。よって$(a-1)u+(1-b)v=\vec{0}$であり、線形独立性から$a=1$である。ゆえに$\overrightarrow{DC}=u=\overrightarrow{AB}$である。
  strategy: Express AC in two ways using the two parallel pairs and compare coefficients in the independent vectors AB and AD.
  sketch:
  - 'setup: Non-collinearity makes u = AB and v = AD linearly independent.'
  - 'translate: Parallelism gives DC = a u and BC = b v.'
  - 'derive: AC = v + a u = u + b v, so (a-1)u + (1-b)v = 0.'
  - 'conclude: Independence gives a = 1, so DC = AB.'
  openmath: (forall (a b c d) (-> (and (not (collinear_points a b d)) (parallel_lines a b d c) (parallel_lines a d b c)) (parallelogram a b c d)))
  hard_negative:
    statement: $A,B,D$が同一直線上にあっても、2組の直線が平行なら$\overrightarrow{AB}=\overrightarrow{DC}$である。
    reason: 数直線上の$A=0$、$B=1$、$D=2$、$C=5$では、どの直線も同じ直線なので平行だが、$\overrightarrow{AB}=1$、$\overrightarrow{DC}=3$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), ¬Collinear ℝ ({A, B, D} : Set P) → (line[ℝ, A, B]).Parallel line[ℝ, D, C] → (line[ℝ, A, D]).Parallel line[ℝ, B, C] → B -ᵥ A = C -ᵥ D
  proof: |
    by
      intro V P _ _ _ _ A B C D hABD h1 h2
      have hli : ∀ a b : ℝ, a • (B -ᵥ A) + b • (D -ᵥ A) = (0 : V) → a = 0 ∧ b = 0 := by
        intro a b h
        by_contra hab
        apply hABD
        rcases not_and_or.mp hab with ha | hb
        · have hB : B -ᵥ A = (-b / a) • (D -ᵥ A) := by
            have h2 : a • (B -ᵥ A) = (-b) • (D -ᵥ A) := by
              rw [neg_smul]; exact eq_neg_of_add_eq_zero_left h
            rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ ha, one_smul]
          have h3 := AffineMap.lineMap_mem_affineSpan_pair (-b / a) A D
          rw [AffineMap.lineMap_apply, ← hB, vsub_vadd] at h3
          have h4 := collinear_insert_of_mem_affineSpan_pair h3
          rwa [Set.insert_comm] at h4
        · have hC : D -ᵥ A = (-a / b) • (B -ᵥ A) := by
            have h2 : b • (D -ᵥ A) = (-a) • (B -ᵥ A) := by
              rw [neg_smul]; exact eq_neg_of_add_eq_zero_right h
            rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ hb, one_smul]
          have h3 := AffineMap.lineMap_mem_affineSpan_pair (-a / b) A B
          rw [AffineMap.lineMap_apply, ← hC, vsub_vadd] at h3
          have h4 := collinear_insert_of_mem_affineSpan_pair h3
          rwa [Set.insert_comm, Set.pair_comm] at h4
      rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev] at h1 h2
      have m1 : C -ᵥ D ∈ Submodule.span ℝ {B -ᵥ A} := by rw [h1]; exact Submodule.mem_span_singleton_self _
      have m2 : C -ᵥ B ∈ Submodule.span ℝ {D -ᵥ A} := by rw [h2]; exact Submodule.mem_span_singleton_self _
      obtain ⟨a, ha⟩ := Submodule.mem_span_singleton.mp m1
      obtain ⟨b, hb⟩ := Submodule.mem_span_singleton.mp m2
      have e1 : C -ᵥ D = (C -ᵥ A) - (D -ᵥ A) := (vsub_sub_vsub_cancel_right C D A).symm
      have e2 : C -ᵥ B = (C -ᵥ A) - (B -ᵥ A) := (vsub_sub_vsub_cancel_right C B A).symm
      have h0 : (a - 1) • (B -ᵥ A) + (1 - b) • (D -ᵥ A) = (0 : V) := by
        have h3 : (C -ᵥ A) = a • (B -ᵥ A) + (D -ᵥ A) := by rw [ha, e1]; abel
        have h4 : (C -ᵥ A) = b • (D -ᵥ A) + (B -ᵥ A) := by rw [hb, e2]; abel
        have : (a • (B -ᵥ A) + (D -ᵥ A)) - (b • (D -ᵥ A) + (B -ᵥ A)) = (0 : V) := by rw [← h3, ← h4, sub_self]
        rw [← this]; module
      obtain ⟨h5, -⟩ := hli _ _ h0
      have h6 : a = 1 := by linarith
      rw [← ha, h6, one_smul]
- id: parallelogram_of_one_pair_parallel_equal
  kind: gap
  level: middle
  topic: 平行四辺形・判定（1組の対辺が平行で等しい）
  statement: ユークリッド空間の点$A,B,C,D$について、$B$と$D$が直線$AC$に関して真に反対側にあり、直線$AB$と直線$DC$が平行で$AB=DC$なら、$\overrightarrow{AB}=\overrightarrow{DC}$である。
  statement_en: If B and D lie strictly on opposite sides of line AC, line AB is parallel to line DC and |AB| = |DC|, then AB = DC as vectors.
  assumptions:
  - $B$と$D$は直線$AC$に関して真に反対側にある
  - 直線$AB$と直線$DC$は平行である
  - $AB=DC$
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $\overrightarrow{AB}=\overrightarrow{DC}$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$B$と$D$は直線$AC$に関して真に反対側にあり、直線$AB$と直線$DC$は平行で、$AB=DC$とする。$B$は直線$AC$上にないので$B\neq A$である。平行であるから、実数$k$により$\overrightarrow{DC}=k\overrightarrow{AB}$と書ける。長さが等しく$AB\neq0$なので$|k|=1$である。

    $k=-1$と仮定して矛盾を導く。このとき$\overrightarrow{DC}=-\overrightarrow{AB}$だから、$\overrightarrow{BD}=\overrightarrow{BA}+\overrightarrow{AC}+\overrightarrow{CD}=\overrightarrow{BA}+\overrightarrow{AC}+\overrightarrow{AB}=\overrightarrow{AC}$である。$B,D$が反対側にあるので、線分$BD$上に直線$AC$の点$Q$があり、$\overrightarrow{BQ}=x\overrightarrow{BD}=x\overrightarrow{AC}$と書ける。$Q$は直線$AC$上にあり、$\overrightarrow{QB}$は$\overrightarrow{AC}$の実数倍だから、$B$も直線$AC$上にある。これは仮定に反する。

    よって$k=1$であり、$\overrightarrow{AB}=\overrightarrow{DC}$である。
  strategy: Parallelism and equal lengths leave only k = 1 or k = -1, and k = -1 would make BD parallel to AC, which contradicts the opposite-side hypothesis.
  sketch:
  - 'setup: Write DC = k AB; AB ≠ 0 since B is off line AC.'
  - 'derive: Equal lengths force |k| = 1.'
  - 'contradiction: If k = -1 then BD = AC, and a point of AC on segment BD forces B onto line AC.'
  - 'conclude: Therefore k = 1 and AB = DC.'
  openmath: (forall (a b c d) (-> (and (opposite_side_of_line b d a c) (parallel_lines a b d c) (= (dist_of a b) (dist_of d c))) (parallelogram a b c d)))
  hard_negative:
    statement: $B,D$が直線$AC$の同じ側にあっても、$AB\parallel DC$かつ$AB=DC$なら$\overrightarrow{AB}=\overrightarrow{DC}$である。
    reason: $A=(0,0)$、$B=(1,0)$、$D=(3,1)$、$C=(2,1)$では$B,D$は直線$AC$の同じ側にあり、平行で長さも等しいが、$\overrightarrow{AB}=(1,0)$、$\overrightarrow{DC}=(-1,0)$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), (line[ℝ, A, C]).SOppSide B D → (line[ℝ, A, B]).Parallel line[ℝ, D, C] → dist A B = dist D C → B -ᵥ A = C -ᵥ D
  proof: |
    by
      intro V P _ _ _ _ A B C D hs hpar hd
      have hBA : B ≠ A := fun h => hs.2.1 (h ▸ left_mem_affineSpan_pair ℝ A C)
      rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev] at hpar
      have m1 : C -ᵥ D ∈ Submodule.span ℝ {B -ᵥ A} := by rw [hpar]; exact Submodule.mem_span_singleton_self _
      obtain ⟨k, hk⟩ := Submodule.mem_span_singleton.mp m1
      have hn : ‖B -ᵥ A‖ ≠ 0 := norm_ne_zero_iff.mpr (vsub_ne_zero.mpr hBA)
      have hk1 : |k| = 1 := by
        rw [dist_comm A B, dist_comm D C, dist_eq_norm_vsub V B A, dist_eq_norm_vsub V C D, ← hk, norm_smul,
          Real.norm_eq_abs] at hd
        apply mul_right_cancel₀ hn
        rw [one_mul]; exact hd.symm
      rcases (abs_eq (by norm_num : (0 : ℝ) ≤ 1)).mp hk1 with h | h
      · rw [← hk, h, one_smul]
      · exfalso
        rw [h, neg_one_smul] at hk
        obtain ⟨p, hp, hw⟩ := AffineSubspace.wOppSide_iff_exists_wbtw.mp hs.1
        obtain ⟨x, -, rfl⟩ := hw
        obtain ⟨y, hy⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hp
        apply hs.2.1
        have e : D -ᵥ B = C -ᵥ A := by
          have e1 : D -ᵥ B = (D -ᵥ C) + (C -ᵥ A) + (A -ᵥ B) := by
            rw [vsub_add_vsub_cancel, vsub_add_vsub_cancel]
          rw [e1, ← neg_vsub_eq_vsub_rev C D, ← hk, neg_neg, ← neg_vsub_eq_vsub_rev B A]
          abel
        refine mem_affineSpan_pair_iff_exists_lineMap_eq.mpr ⟨y - x, ?_⟩
        have h2 := congrArg (· -ᵥ A) hy
        simp only [AffineMap.lineMap_apply, vadd_vsub, vadd_vsub_assoc, e] at h2
        apply vsub_left_cancel (p := A)
        rw [AffineMap.lineMap_apply, vadd_vsub, sub_smul, h2]
        abel
- id: parallelogram_of_two_pairs_equal
  kind: gap
  level: middle
  topic: 平行四辺形・判定（2組の対辺が等しい）
  statement: ユークリッド空間の点$A,B,C,D$について、$A\neq C$で、$B$と$D$が直線$AC$に関して真に反対側にあり、$AB=CD$、$BC=DA$なら、$\overrightarrow{AB}=\overrightarrow{DC}$である。
  statement_en: If A ≠ C, B and D lie strictly on opposite sides of line AC, |AB| = |CD| and |BC| = |DA|, then AB = DC as vectors.
  assumptions:
  - $A\neq C$
  - $B$と$D$は直線$AC$に関して真に反対側にある
  - $AB=CD$、$BC=DA$
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $\overrightarrow{AB}=\overrightarrow{DC}$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$A\neq C$、$B$と$D$は直線$AC$に関して真に反対側にあり、$AB=CD$、$BC=DA$とする。$u=\overrightarrow{AB}$、$w=\overrightarrow{AC}$、$v=\overrightarrow{AD}$とおく。

    反対側の条件より、線分$BD$の内部の点で、$B$から$D$へ割合$x$（$0<x<1$）の位置にある点が直線$AC$上にある。よって実数$y$により$(1-x)u+xv=yw$である。$\alpha=-(1-x)/x$、$\beta=y/x$とおくと$v=\alpha u+\beta w$であり、$\alpha<0$である。

    $s=|u|^2$、$t=|w|^2$、$m=u\cdot w$とおく。$t>0$である。また$B$が直線$AC$上にないので$u,w$は線形独立であり、コーシー・シュワルツの不等式の等号不成立から$st-m^2>0$である。

    $|v|^2=|u-w|^2$（条件$DA=BC$）より$\alpha^2s+2\alpha\beta m+\beta^2t=s-2m+t$であり、$|v-w|^2=|u|^2$（条件$CD=AB$）より$\alpha^2s+2\alpha(\beta-1)m+(\beta-1)^2t=s$である。第1式から第2式を引いて2で割ると、$(\alpha+1)m+(\beta-1)t=0$を得る。

    第2式に$t$を掛け、この関係で$(\beta-1)t$を消去して整理すると$(\alpha+1)(\alpha-1)(st-m^2)=0$となる。$st-m^2>0$、$\alpha-1<0$より$\alpha=-1$である。これを関係式に戻すと$(\beta-1)t=0$となり$\beta=1$である。

    ゆえに$v=-u+w$、つまり$\overrightarrow{DC}=w-v=u=\overrightarrow{AB}$である。
  strategy: Express AD in the independent vectors AB and AC, turn the two length equalities into polynomial equations, and use the sign from the opposite-side hypothesis to select the root.
  sketch:
  - 'setup: Set u = AB, w = AC, v = AD and use the crossing point of BD with AC to write v = α u + β w with α < 0.'
  - 'translate: The two length conditions become two equations in s = |u|², t = |w|², m = u·w.'
  - 'derive: Their difference gives (α+1)m + (β-1)t = 0.'
  - 'derive: Eliminating gives (α+1)(α-1)(st-m²) = 0.'
  - 'derive: st - m² > 0 since u, w are independent, and α < 0, so α = -1 and then β = 1.'
  - 'conclude: Hence v = w - u, that is DC = AB.'
  openmath: (forall (a b c d) (-> (and (!= a c) (opposite_side_of_line b d a c) (= (dist_of a b) (dist_of c d)) (= (dist_of b c) (dist_of d a))) (parallelogram a b c d)))
  hard_negative:
    statement: $B,D$が直線$AC$の同じ側にあっても、$AB=CD$、$BC=DA$なら$\overrightarrow{AB}=\overrightarrow{DC}$である。
    reason: $A=(0,0)$、$C=(4,0)$、$B=(1,2)$、$D=(3,2)$では$AB=CD=\sqrt{5}$、$BC=DA=\sqrt{13}$だが、$\overrightarrow{AB}=(1,2)$、$\overrightarrow{DC}=(1,-2)$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), A ≠ C → (line[ℝ, A, C]).SOppSide B D → dist A B = dist C D → dist B C = dist D A → B -ᵥ A = C -ᵥ D
  proof: |
    by
      intro V P _ _ _ _ A B C D hAC hs h1 h2
      obtain ⟨p, hp, hw⟩ := AffineSubspace.wOppSide_iff_exists_wbtw.mp hs.1
      have hB := hs.2.1
      have hD := hs.2.2
      obtain ⟨x, ⟨hx0, hx1⟩, rfl⟩ := hw
      obtain ⟨y, hy⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hp
      have hx0' : x ≠ 0 := by
        rintro rfl; apply hB; simpa using hp
      have hx1' : x ≠ 1 := by
        rintro rfl; apply hD; simpa using hp
      have hxpos : 0 < x := lt_of_le_of_ne hx0 (Ne.symm hx0')
      have hxlt : x < 1 := lt_of_le_of_ne hx1 hx1'
      set u : V := B -ᵥ A with hu
      set w : V := C -ᵥ A with hw
      set v : V := D -ᵥ A with hv
      have hDB : D -ᵥ B = v - u := (vsub_sub_vsub_cancel_right D B A).symm
      have h3 : u + x • (v - u) = y • w := by
        have h4 := congrArg (· -ᵥ A) hy
        simp only [AffineMap.lineMap_apply, vadd_vsub, vadd_vsub_assoc, hDB] at h4
        rw [add_comm]
        exact h4.symm
      set α : ℝ := -(1 - x) / x with hα
      set β : ℝ := y / x with hβ
      have hv' : v = α • u + β • w := by
        have : x • v = (-(1 - x)) • u + y • w := by rw [← h3]; module
        rw [hα, hβ, div_eq_inv_mul, div_eq_inv_mul, mul_smul, mul_smul, ← smul_add, ← this, smul_smul,
          inv_mul_cancel₀ hx0', one_smul]
      have hαneg : α < 0 := by
        rw [hα]; exact div_neg_of_neg_of_pos (by linarith) hxpos
      have nsq : ∀ a b : ℝ, ‖a • u + b • w‖ ^ 2 = a ^ 2 * ‖u‖ ^ 2 + 2 * a * b * inner ℝ u w + b ^ 2 * ‖w‖ ^ 2 := by
        intro a b
        rw [norm_add_sq_real, norm_smul, norm_smul, mul_pow, mul_pow, Real.norm_eq_abs, Real.norm_eq_abs, sq_abs, sq_abs,
          real_inner_smul_left, real_inner_smul_right]
        ring
      have hwpos : 0 < ‖w‖ ^ 2 := by
        have : w ≠ 0 := vsub_ne_zero.mpr hAC.symm
        positivity
      have E1 : α ^ 2 * ‖u‖ ^ 2 + 2 * α * β * inner ℝ u w + β ^ 2 * ‖w‖ ^ 2 = ‖u‖ ^ 2 - 2 * inner ℝ u w + ‖w‖ ^ 2 := by
        have e1 : ‖v‖ = ‖(1 : ℝ) • u + (-1 : ℝ) • w‖ := by
          have : (1 : ℝ) • u + (-1 : ℝ) • w = B -ᵥ C := by
            rw [one_smul, neg_one_smul, ← sub_eq_add_neg, hu, hw, vsub_sub_vsub_cancel_right]
          rw [this, ← dist_eq_norm_vsub V B C, h2, dist_eq_norm_vsub V D A]
        have e2 := nsq 1 (-1)
        rw [← e1, hv', nsq] at e2
        linarith
      have E2 : α ^ 2 * ‖u‖ ^ 2 + 2 * α * (β - 1) * inner ℝ u w + (β - 1) ^ 2 * ‖w‖ ^ 2 = ‖u‖ ^ 2 := by
        have e1 : ‖α • u + (β - 1) • w‖ = ‖u‖ := by
          have : α • u + (β - 1) • w = D -ᵥ C := by
            rw [← vsub_sub_vsub_cancel_right D C A, ← hv, ← hw, hv']; module
          rw [this, ← dist_eq_norm_vsub V D C, dist_comm, ← h1, dist_comm, dist_eq_norm_vsub V B A]
        have e2 := nsq α (β - 1)
        rw [e1] at e2
        exact e2.symm
      have L : (α + 1) * inner ℝ u w + (β - 1) * ‖w‖ ^ 2 = 0 := by linear_combination (1 / 2) * E1 - (1 / 2) * E2
      have hcs : 0 < ‖u‖ ^ 2 * ‖w‖ ^ 2 - inner ℝ u w ^ 2 := by
        have hne : ‖w‖ ^ 2 • u - inner ℝ u w • w ≠ 0 := by
          intro h0
          apply hB
          have : u = (inner ℝ u w / ‖w‖ ^ 2) • w := by
            rw [div_eq_inv_mul, mul_smul, ← sub_eq_zero.mp h0, smul_smul, inv_mul_cancel₀ hwpos.ne', one_smul]
          have h3 := AffineMap.lineMap_mem_affineSpan_pair (inner ℝ u w / ‖w‖ ^ 2) A C
          rwa [AffineMap.lineMap_apply, ← hw, ← this, hu, vsub_vadd] at h3
        have h5 : 0 < ‖‖w‖ ^ 2 • u + (- inner ℝ u w) • w‖ ^ 2 := by
          rw [neg_smul, ← sub_eq_add_neg]
          have := norm_pos_iff.mpr hne
          positivity
        rw [nsq] at h5
        have h6 : 0 < ‖w‖ ^ 2 * (‖u‖ ^ 2 * ‖w‖ ^ 2 - inner ℝ u w ^ 2) := by linarith [h5, (by ring : ‖w‖ ^ 2 * (‖u‖ ^ 2 * ‖w‖ ^ 2 - inner ℝ u w ^ 2) = (‖w‖ ^ 2) ^ 2 * ‖u‖ ^ 2 + 2 * ‖w‖ ^ 2 * -inner ℝ u w * inner ℝ u w + (-inner ℝ u w) ^ 2 * ‖w‖ ^ 2)]
        exact (pos_iff_pos_of_mul_pos h6).mp hwpos
      have K : (α + 1) * (α - 1) * (‖u‖ ^ 2 * ‖w‖ ^ 2 - inner ℝ u w ^ 2) = 0 := by
        linear_combination ‖w‖ ^ 2 * E2 - (2 * α * inner ℝ u w + (β - 1) * ‖w‖ ^ 2 - (α + 1) * inner ℝ u w) * L
      have hα1 : α = -1 := by
        rcases mul_eq_zero.mp K with h | h
        · rcases mul_eq_zero.mp h with h | h
          · linarith
          · linarith
        · exact absurd h hcs.ne'
      have hβ1 : β = 1 := by
        rw [hα1] at L
        have : (β - 1) * ‖w‖ ^ 2 = 0 := by linarith
        rcases mul_eq_zero.mp this with h | h
        · linarith
        · exact absurd h hwpos.ne'
      rw [← vsub_sub_vsub_cancel_right C D A, ← hw, ← hv, hv', hα1, hβ1, hu]
      module
- id: rectangle_diagonals_equal
  kind: textbook
  level: middle
  topic: 長方形・性質
  statement: ユークリッド空間の点$A,B,C,D$が$A\neq B$、$A\neq D$、$\overrightarrow{AB}=\overrightarrow{DC}$、$\angle DAB=\pi/2$をみたす（長方形$ABCD$）なら、対角線の長さは等しく$AC=BD$であり、残りの3つの角も直角である。
  statement_en: If A ≠ B, A ≠ D, AB = DC as vectors and ∠DAB = π/2, then |AC| = |BD| and the other three angles ∠ABC, ∠BCD, ∠CDA are right angles.
  assumptions:
  - $A\neq B$、$A\neq D$
  - $\overrightarrow{AB}=\overrightarrow{DC}$
  - $\angle DAB=\pi/2$
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $AC=BD$であり、$\angle ABC=\angle BCD=\angle CDA=\pi/2$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$A\neq B$、$A\neq D$、$\overrightarrow{AB}=\overrightarrow{DC}$、$\angle DAB=\pi/2$とする。$u=\overrightarrow{AB}$、$v=\overrightarrow{AD}$とおくと、直角の仮定より$u\cdot v=0$である。また$\overrightarrow{AC}=u+v$、$\overrightarrow{BD}=v-u$、$\overrightarrow{BC}=v$、$\overrightarrow{DC}=u$である。

    $|u+v|^2=|u|^2+2u\cdot v+|v|^2=|u|^2+|v|^2$、$|v-u|^2=|u|^2-2u\cdot v+|v|^2=|u|^2+|v|^2$より、$AC=BD$である。

    $\angle ABC$は$\overrightarrow{BA}=-u$と$\overrightarrow{BC}=v$のなす角で、その値は$\pi$から$u$と$v$のなす角を引いたもの、すなわち$\pi-\pi/2=\pi/2$である。$\angle BCD$は$\overrightarrow{CB}=-v$と$\overrightarrow{CD}=-u$のなす角で、$u,v$のなす角に等しく$\pi/2$である。$\angle CDA$は$\overrightarrow{DC}=u$と$\overrightarrow{DA}=-v$のなす角で、同様に$\pi/2$である。
  strategy: Use vectors u = AB, v = AD with u·v = 0, expand the squared diagonals, and read the remaining angles from sign changes.
  sketch:
  - 'setup: Put u = AB and v = AD, so u·v = 0, AC = u + v and BD = v - u.'
  - 'derive: Both diagonals have squared length |u|² + |v|².'
  - 'derive: The angles at B and D are π minus the angle between u and v.'
  - 'conclude: The angle at C is the angle between -v and -u, so all four angles are right.'
  openmath: (forall (a b c d) (-> (and (!= a b) (!= a d) (parallelogram a b c d) (= (euclid_angle d a b) (/ pi 2))) (and (= (dist_of a c) (dist_of b d)) (= (euclid_angle a b c) (/ pi 2)) (= (euclid_angle b c d) (/ pi 2)) (= (euclid_angle c d a) (/ pi 2)))))
  hard_negative:
    statement: 長方形の対角線は直交する。
    reason: $A=(0,0)$、$B=(2,0)$、$C=(2,1)$、$D=(0,1)$では$\overrightarrow{AC}\cdot\overrightarrow{BD}=(2,1)\cdot(-2,1)=-3\neq0$である。直交するのは正方形のときである。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), A ≠ B → A ≠ D → B -ᵥ A = C -ᵥ D → EuclideanGeometry.angle D A B = Real.pi / 2 → dist A C = dist B D ∧ EuclideanGeometry.angle A B C = Real.pi / 2 ∧ EuclideanGeometry.angle B C D = Real.pi / 2 ∧ EuclideanGeometry.angle C D A = Real.pi / 2
  proof: |
    by
      intro V P _ _ _ _ A B C D _ _ h hr
      have hin : inner ℝ (D -ᵥ A) (B -ᵥ A) = 0 := InnerProductGeometry.inner_eq_zero_iff_angle_eq_pi_div_two _ _ |>.mpr hr
      have hCA : C -ᵥ A = (B -ᵥ A) + (D -ᵥ A) := by
        rw [h, vsub_add_vsub_cancel]
      have hDB : D -ᵥ B = (D -ᵥ A) - (B -ᵥ A) := (vsub_sub_vsub_cancel_right D B A).symm
      have hCB : C -ᵥ B = D -ᵥ A := by
        rw [← vsub_sub_vsub_cancel_right C B A, hCA]; abel
      refine ⟨?_, ?_, ?_, ?_⟩
      · rw [dist_comm A C, dist_comm B D, dist_eq_norm_vsub V C A, dist_eq_norm_vsub V D B, hCA, hDB]
        have h1 := norm_add_sq_real (B -ᵥ A) (D -ᵥ A)
        have h2 := norm_sub_sq_real (D -ᵥ A) (B -ᵥ A)
        rw [real_inner_comm] at h1
        rw [hin] at h1 h2
        have h3 : ‖(B -ᵥ A) + (D -ᵥ A)‖ ^ 2 = ‖(D -ᵥ A) - (B -ᵥ A)‖ ^ 2 := by rw [h1, h2]; ring
        exact (sq_eq_sq₀ (norm_nonneg _) (norm_nonneg _)).mp h3
      · unfold EuclideanGeometry.angle
        rw [hCB, ← neg_vsub_eq_vsub_rev B A, InnerProductGeometry.angle_neg_left, InnerProductGeometry.angle_comm]
        unfold EuclideanGeometry.angle at hr
        rw [hr]; ring
      · unfold EuclideanGeometry.angle
        rw [← neg_vsub_eq_vsub_rev C B, hCB, ← neg_vsub_eq_vsub_rev C D, ← h, InnerProductGeometry.angle_neg_neg]
        exact hr
      · unfold EuclideanGeometry.angle
        rw [← h, ← neg_vsub_eq_vsub_rev D A, InnerProductGeometry.angle_neg_right, InnerProductGeometry.angle_comm]
        unfold EuclideanGeometry.angle at hr
        rw [hr]; ring
- id: rectangle_of_equal_diagonals
  kind: gap
  level: middle
  topic: 長方形・判定
  statement: ユークリッド空間の点$A,B,C,D$が$A\neq B$、$A\neq D$、$\overrightarrow{AB}=\overrightarrow{DC}$をみたし（平行四辺形）、対角線の長さが等しく$AC=BD$なら、$\angle DAB=\pi/2$である。
  statement_en: If A ≠ B, A ≠ D, AB = DC as vectors and |AC| = |BD|, then ∠DAB = π/2.
  assumptions:
  - $A\neq B$、$A\neq D$
  - $\overrightarrow{AB}=\overrightarrow{DC}$
  - $AC=BD$
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $\angle DAB=\pi/2$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$A\neq B$、$A\neq D$、$\overrightarrow{AB}=\overrightarrow{DC}$、$AC=BD$とする。$u=\overrightarrow{AB}$、$v=\overrightarrow{AD}$とおくと$\overrightarrow{AC}=u+v$、$\overrightarrow{BD}=v-u$である。$|u+v|^2=|v-u|^2$を展開すると$4u\cdot v=0$となるので、$u\cdot v=0$である。よって$u$と$v$のなす角、つまり$\angle DAB$は$\pi/2$である。
  strategy: Expand the equality of the squared diagonals to get u·v = 0.
  sketch:
  - 'setup: Put u = AB and v = AD, so the diagonals are u + v and v - u.'
  - 'derive: Equal squared lengths give 4 u·v = 0.'
  - 'conclude: Zero inner product means ∠DAB = π/2.'
  openmath: (forall (a b c d) (-> (and (!= a b) (!= a d) (parallelogram a b c d) (= (dist_of a c) (dist_of b d))) (= (euclid_angle d a b) (/ pi 2))))
  hard_negative:
    statement: 四角形$ABCD$の対角線の長さが等しければ、平行四辺形でなくても$\angle DAB=\pi/2$である。
    reason: 等脚台形$A=(0,0)$、$B=(4,0)$、$C=(3,1)$、$D=(1,1)$では$AC=BD=\sqrt{10}$だが、$\angle DAB=\pi/4$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), A ≠ B → A ≠ D → B -ᵥ A = C -ᵥ D → dist A C = dist B D → EuclideanGeometry.angle D A B = Real.pi / 2
  proof: |
    by
      intro V P _ _ _ _ A B C D _ _ h hd
      have hCA : C -ᵥ A = (B -ᵥ A) + (D -ᵥ A) := by
        rw [h, vsub_add_vsub_cancel]
      have hDB : D -ᵥ B = (D -ᵥ A) - (B -ᵥ A) := (vsub_sub_vsub_cancel_right D B A).symm
      rw [dist_comm A C, dist_comm B D, dist_eq_norm_vsub V C A, dist_eq_norm_vsub V D B, hCA, hDB] at hd
      have h1 := norm_add_sq_real (B -ᵥ A) (D -ᵥ A)
      have h2 := norm_sub_sq_real (D -ᵥ A) (B -ᵥ A)
      rw [real_inner_comm] at h1
      rw [hd] at h1
      apply (InnerProductGeometry.inner_eq_zero_iff_angle_eq_pi_div_two _ _).mp
      linarith
- id: rhombus_diagonals_perpendicular
  kind: textbook
  level: middle
  topic: ひし形・性質
  statement: ユークリッド空間の点$A,B,C,D$が$\overrightarrow{AB}=\overrightarrow{DC}$、$AB=AD$をみたす（ひし形$ABCD$）なら、対角線$AC$と$BD$は直交し、$\overrightarrow{AC}\cdot\overrightarrow{BD}=0$である。
  statement_en: If AB = DC as vectors and |AB| = |AD|, then the diagonals are orthogonal, AC · BD = 0.
  assumptions:
  - $\overrightarrow{AB}=\overrightarrow{DC}$
  - $AB=AD$
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $\overrightarrow{AC}\cdot\overrightarrow{BD}=0$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$\overrightarrow{AB}=\overrightarrow{DC}$、$AB=AD$とする。$u=\overrightarrow{AB}$、$v=\overrightarrow{AD}$とおくと、$\overrightarrow{AC}=u+v$、$\overrightarrow{BD}=v-u$である。よって$\overrightarrow{AC}\cdot\overrightarrow{BD}=(u+v)\cdot(v-u)=|v|^2-|u|^2=0$である。
  strategy: Write the diagonals as u + v and v - u, so their inner product is a difference of squares.
  sketch:
  - 'setup: Put u = AB and v = AD, so AC = u + v and BD = v - u.'
  - 'derive: The inner product is |v|² - |u|².'
  - 'conclude: Equal side lengths make it zero.'
  openmath: (forall (a b c d) (-> (and (parallelogram a b c d) (= (dist_of a b) (dist_of a d))) (perpendicular_lines a c b d)))
  hard_negative:
    statement: 四角形$ABCD$が$AB=AD$をみたせば、平行四辺形でなくても対角線は直交する。
    reason: $A=(0,0)$、$B=(1,0)$、$D=(0,1)$、$C=(3,1)$では$AB=AD=1$だが、$\overrightarrow{AC}\cdot\overrightarrow{BD}=(3,1)\cdot(-1,1)=-2$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), B -ᵥ A = C -ᵥ D → dist A B = dist A D → inner ℝ (C -ᵥ A) (D -ᵥ B) = 0
  proof: |
    by
      intro V P _ _ _ _ A B C D h hd
      have hCA : C -ᵥ A = (B -ᵥ A) + (D -ᵥ A) := by
        rw [h, vsub_add_vsub_cancel]
      have hDB : D -ᵥ B = (D -ᵥ A) - (B -ᵥ A) := (vsub_sub_vsub_cancel_right D B A).symm
      rw [dist_comm A B, dist_comm A D, dist_eq_norm_vsub V B A, dist_eq_norm_vsub V D A] at hd
      rw [hCA, hDB, inner_add_left, inner_sub_right, inner_sub_right, real_inner_self_eq_norm_sq,
        real_inner_self_eq_norm_sq, real_inner_comm (B -ᵥ A) (D -ᵥ A), hd]
      ring
- id: rhombus_of_perpendicular_diagonals
  kind: gap
  level: middle
  topic: ひし形・判定
  statement: ユークリッド空間の点$A,B,C,D$が$\overrightarrow{AB}=\overrightarrow{DC}$をみたし（平行四辺形）、対角線が直交して$\overrightarrow{AC}\cdot\overrightarrow{BD}=0$なら、$AB=AD$である。
  statement_en: If AB = DC as vectors and AC · BD = 0, then |AB| = |AD|.
  assumptions:
  - $\overrightarrow{AB}=\overrightarrow{DC}$
  - $\overrightarrow{AC}\cdot\overrightarrow{BD}=0$
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $AB=AD$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$\overrightarrow{AB}=\overrightarrow{DC}$、$\overrightarrow{AC}\cdot\overrightarrow{BD}=0$とする。$u=\overrightarrow{AB}$、$v=\overrightarrow{AD}$とおくと、$\overrightarrow{AC}=u+v$、$\overrightarrow{BD}=v-u$である。仮定より$0=(u+v)\cdot(v-u)=|v|^2-|u|^2$である。長さは非負だから$|u|=|v|$、つまり$AB=AD$である。
  strategy: The inner product of the diagonals equals |v|² - |u|², so orthogonality forces equal sides.
  sketch:
  - 'setup: Put u = AB and v = AD, so AC = u + v and BD = v - u.'
  - 'derive: Orthogonality gives |v|² = |u|².'
  - 'conclude: Taking nonnegative roots gives |AB| = |AD|.'
  openmath: (forall (a b c d) (-> (and (parallelogram a b c d) (perpendicular_lines a c b d)) (= (dist_of a b) (dist_of a d))))
  hard_negative:
    statement: 四角形$ABCD$の対角線が直交すれば、平行四辺形でなくても$AB=AD$である。
    reason: $A=(0,0)$、$C=(3,0)$、$B=(1,2)$、$D=(1,-1)$では対角線は直交するが、$AB=\sqrt{5}$、$AD=\sqrt{2}$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), B -ᵥ A = C -ᵥ D → inner ℝ (C -ᵥ A) (D -ᵥ B) = 0 → dist A B = dist A D
  proof: |
    by
      intro V P _ _ _ _ A B C D h hi
      have hCA : C -ᵥ A = (B -ᵥ A) + (D -ᵥ A) := by
        rw [h, vsub_add_vsub_cancel]
      have hDB : D -ᵥ B = (D -ᵥ A) - (B -ᵥ A) := (vsub_sub_vsub_cancel_right D B A).symm
      rw [hCA, hDB, inner_add_left, inner_sub_right, inner_sub_right, real_inner_self_eq_norm_sq,
        real_inner_self_eq_norm_sq, real_inner_comm (B -ᵥ A) (D -ᵥ A)] at hi
      rw [dist_comm A B, dist_comm A D, dist_eq_norm_vsub V B A, dist_eq_norm_vsub V D A]
      have h3 : ‖B -ᵥ A‖ ^ 2 = ‖D -ᵥ A‖ ^ 2 := by linarith
      exact (sq_eq_sq₀ (norm_nonneg _) (norm_nonneg _)).mp h3
- id: rhombus_diagonal_bisects_angle
  kind: gap
  level: middle
  topic: ひし形・対角線と角の二等分
  statement: ユークリッド空間の点$A,B,C,D$が、$A,B,D$は同一直線上になく、$\overrightarrow{AB}=\overrightarrow{DC}$、$AB=AD$をみたす（ひし形$ABCD$）なら、対角線$AC$は頂点$A$の角を二等分し、$\angle BAC=\angle CAD$である。
  statement_en: If A, B, D are not collinear, AB = DC as vectors and |AB| = |AD|, then the diagonal AC bisects the angle at A, ∠BAC = ∠CAD.
  assumptions:
  - $A,B,D$は同一直線上にない
  - $\overrightarrow{AB}=\overrightarrow{DC}$
  - $AB=AD$
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $\angle BAC=\angle CAD$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$A,B,D$は同一直線上になく、$\overrightarrow{AB}=\overrightarrow{DC}$、$AB=AD$とする。$u=\overrightarrow{AB}$、$v=\overrightarrow{AD}$とおくと$\overrightarrow{AC}=u+v$、$|u|=|v|$である。$u,v$は線形独立なので$u,v,u+v$はどれも零ベクトルでなく、以下の角はすべて定まる。

    2つのベクトルのなす角は、内積を長さの積で割った値の逆余弦で与えられる。$u\cdot(u+v)=|u|^2+u\cdot v$、$v\cdot(u+v)=u\cdot v+|v|^2$であり、$|u|=|v|$よりこの2つは等しい。分母の$|u||u+v|$と$|v||u+v|$も等しい。よって$u$と$u+v$のなす角は、$v$と$u+v$のなす角に等しい。これは$\angle BAC=\angle CAD$である。
  strategy: Compare the inner products and norms in the arccos formula for the two angles.
  sketch:
  - 'setup: Put u = AB and v = AD, so AC = u + v and |u| = |v|.'
  - 'derive: u·(u+v) and v·(u+v) agree since |u|² = |v|².'
  - 'conclude: The arccos formula gives equal angles.'
  openmath: (forall (a b c d) (-> (and (not (collinear_points a b d)) (parallelogram a b c d) (= (dist_of a b) (dist_of a d))) (= (euclid_angle b a c) (euclid_angle c a d))))
  hard_negative:
    statement: 平行四辺形の対角線は頂点の角を二等分する。
    reason: $A=(0,0)$、$B=(2,0)$、$C=(3,1)$、$D=(1,1)$では$\cos\angle BAC=3/\sqrt{10}$、$\cos\angle CAD=2/\sqrt{5}$なので$\angle BAC\neq\angle CAD$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), ¬Collinear ℝ ({A, B, D} : Set P) → B -ᵥ A = C -ᵥ D → dist A B = dist A D → EuclideanGeometry.angle B A C = EuclideanGeometry.angle C A D
  proof: |
    by
      intro V P _ _ _ _ A B C D _ h hd
      have hCA : C -ᵥ A = (B -ᵥ A) + (D -ᵥ A) := by
        rw [h, vsub_add_vsub_cancel]
      rw [dist_comm A B, dist_comm A D, dist_eq_norm_vsub V B A, dist_eq_norm_vsub V D A] at hd
      unfold EuclideanGeometry.angle
      rw [InnerProductGeometry.angle_comm (C -ᵥ A), hCA]
      unfold InnerProductGeometry.angle
      congr 1
      rw [inner_add_right, inner_add_right, real_inner_self_eq_norm_sq, real_inner_self_eq_norm_sq, hd,
        real_inner_comm (B -ᵥ A) (D -ᵥ A)]
      ring
- id: square_diagonal_length_and_angle
  kind: gap
  level: middle
  topic: 正方形・対角線
  statement: ユークリッド空間の点$A,B,C,D$が$A\neq B$、$\overrightarrow{AB}=\overrightarrow{DC}$、$AB=AD$、$\angle DAB=\pi/2$をみたす（正方形$ABCD$）なら、$AC=\sqrt{2}\,AB$かつ$\angle BAC=\pi/4$である。
  statement_en: If A ≠ B, AB = DC as vectors, |AB| = |AD| and ∠DAB = π/2, then |AC| = √2 |AB| and ∠BAC = π/4.
  assumptions:
  - $A\neq B$
  - $\overrightarrow{AB}=\overrightarrow{DC}$
  - $AB=AD$
  - $\angle DAB=\pi/2$
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $AC=\sqrt{2}\,AB$、$\angle BAC=\pi/4$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$A\neq B$、$\overrightarrow{AB}=\overrightarrow{DC}$、$AB=AD$、$\angle DAB=\pi/2$とする。$u=\overrightarrow{AB}$、$v=\overrightarrow{AD}$とおくと、$\overrightarrow{AC}=u+v$、$u\cdot v=0$、$|u|=|v|$である。

    $|u+v|^2=|u|^2+2u\cdot v+|v|^2=2|u|^2$より、$AC=\sqrt{2}\,AB$である。

    次に、$u\neq\vec{0}$より$\cos\angle BAC=\dfrac{u\cdot(u+v)}{|u||u+v|}=\dfrac{|u|^2}{|u|\cdot\sqrt{2}|u|}=\dfrac{1}{\sqrt{2}}$である。$\angle BAC$は$0$以上$\pi$以下で、この範囲で余弦が$1/\sqrt{2}$となる角は$\pi/4$だけだから、$\angle BAC=\pi/4$である。
  strategy: Expand |u + v|² with u·v = 0 and |u| = |v|, then compute the cosine of ∠BAC.
  sketch:
  - 'setup: Put u = AB and v = AD with u·v = 0 and |u| = |v|.'
  - 'derive: |AC|² = 2|u|², so |AC| = √2 |AB|.'
  - 'derive: cos ∠BAC = |u|²/(|u|·√2|u|) = 1/√2.'
  - 'conclude: On [0, π] this means ∠BAC = π/4.'
  openmath: (forall (a b c d) (-> (and (!= a b) (parallelogram a b c d) (= (dist_of a b) (dist_of a d)) (= (euclid_angle d a b) (/ pi 2))) (and (= (dist_of a c) (* (root 2 2) (dist_of a b))) (= (euclid_angle b a c) (/ pi 4)))))
  hard_negative:
    statement: 長方形$ABCD$でも$AC=\sqrt{2}\,AB$、$\angle BAC=\pi/4$である。
    reason: $A=(0,0)$、$B=(2,0)$、$C=(2,1)$、$D=(0,1)$では$AC=\sqrt{5}$、$\sqrt{2}\,AB=2\sqrt{2}$である。条件$AB=AD$は外せない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), A ≠ B → B -ᵥ A = C -ᵥ D → dist A B = dist A D → EuclideanGeometry.angle D A B = Real.pi / 2 → dist A C = Real.sqrt 2 * dist A B ∧ EuclideanGeometry.angle B A C = Real.pi / 4
  proof: |
    by
      intro V P _ _ _ _ A B C D hAB h hd hr
      have hin : inner ℝ (B -ᵥ A) (D -ᵥ A) = 0 := by
        rw [real_inner_comm]; exact (InnerProductGeometry.inner_eq_zero_iff_angle_eq_pi_div_two _ _).mpr hr
      have hCA : C -ᵥ A = (B -ᵥ A) + (D -ᵥ A) := by
        rw [h, vsub_add_vsub_cancel]
      rw [dist_comm A B, dist_comm A D, dist_eq_norm_vsub V B A, dist_eq_norm_vsub V D A] at hd
      have hnn : ‖C -ᵥ A‖ = Real.sqrt 2 * ‖B -ᵥ A‖ := by
        have h1 := norm_add_sq_real (B -ᵥ A) (D -ᵥ A)
        rw [hin, ← hCA, ← hd] at h1
        have h2 : ‖C -ᵥ A‖ ^ 2 = (Real.sqrt 2 * ‖B -ᵥ A‖) ^ 2 := by
          rw [h1, mul_pow, Real.sq_sqrt (by norm_num)]; ring
        exact (sq_eq_sq₀ (norm_nonneg _) (by positivity)).mp h2
      have hne : ‖B -ᵥ A‖ ≠ 0 := norm_ne_zero_iff.mpr (vsub_ne_zero.mpr hAB.symm)
      constructor
      · rw [dist_comm A C, dist_comm A B, dist_eq_norm_vsub V C A, dist_eq_norm_vsub V B A, hnn]
      · unfold EuclideanGeometry.angle InnerProductGeometry.angle
        rw [hnn, hCA, inner_add_right, hin, real_inner_self_eq_norm_sq, add_zero, ← Real.arccos_cos (x := Real.pi / 4) (by positivity) (by linarith [Real.pi_pos]), Real.cos_pi_div_four]
        congr 1
        have hs : Real.sqrt 2 ≠ 0 := by positivity
        have hs2 : Real.sqrt 2 * Real.sqrt 2 = 2 := Real.mul_self_sqrt (by norm_num)
        field_simp
        nlinarith [hs2]
- id: trapezoid_midline
  kind: textbook
  level: middle
  topic: 台形・中点連結
  statement: ユークリッド空間の点$A,B,C,D$について、$A\neq C$で、$B$と$D$が直線$AC$に関して真に反対側にあり、直線$AB$と直線$DC$が平行な台形$ABCD$では、脚$AD$の中点$M$と脚$BC$の中点$N$を結ぶ直線は$AB$に平行で、$MN=(AB+DC)/2$である。
  statement_en: If A ≠ C, B and D lie strictly on opposite sides of line AC and line AB is parallel to line DC, then for the midpoints M of AD and N of BC, line MN is parallel to line AB and |MN| = (|AB| + |DC|)/2.
  assumptions:
  - $A\neq C$
  - $B$と$D$は直線$AC$に関して真に反対側にある
  - 直線$AB$と直線$DC$は平行である
  - $M$は線分$AD$の中点、$N$は線分$BC$の中点である
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: 直線$MN$は直線$AB$に平行で、$MN=(AB+DC)/2$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$A\neq C$、$B$と$D$は直線$AC$に関して真に反対側にあり、直線$AB$と直線$DC$は平行とする。$M,N$をそれぞれ線分$AD$、線分$BC$の中点とする。$u=\overrightarrow{AB}$とおく。平行であるから、実数$k$により$\overrightarrow{DC}=ku$と書ける。

    $k>0$を示す。$k=0$なら$D=C$となり、$D$が直線$AC$上にないことに反する。$k<0$なら$D=C+(-k)u$は、直線$AC$上の点に$\overrightarrow{AB}$の正の倍を足した点だから$B$と同じ側にあり、仮定に反する。よって$k>0$である。

    位置ベクトルで計算すると$\overrightarrow{MN}=\frac{1}{2}(\overrightarrow{AB}+\overrightarrow{DC})=\frac{1+k}{2}u$である。$\frac{1+k}{2}>0$なので直線$MN$は直線$AB$に平行である。長さは$MN=\frac{1+k}{2}|u|=\frac{1}{2}(|u|+k|u|)=\frac{1}{2}(AB+DC)$である。
  strategy: Fix the sign of k in DC = k AB from the opposite-side hypothesis, then compute MN = (AB + DC)/2 as vectors.
  sketch:
  - 'setup: Write DC = k AB using parallelism.'
  - 'contradiction: k = 0 or k < 0 contradicts the opposite-side hypothesis.'
  - 'derive: As vectors MN = (AB + DC)/2 = ((1 + k)/2) AB.'
  - 'conclude: The positive coefficient gives the parallelism and the length formula.'
  openmath: (forall (a b c d) (-> (and (!= a c) (opposite_side_of_line b d a c) (parallel_lines a b d c)) (and (parallel_lines (midpoint_of a d) (midpoint_of b c) a b) (= (dist_of (midpoint_of a d) (midpoint_of b c)) (/ (+ (dist_of a b) (dist_of d c)) 2)))))
  hard_negative:
    statement: $B,D$が直線$AC$の同じ側にあっても$MN=(AB+DC)/2$である。
    reason: $A=(0,0)$、$B=(1,0)$、$D=(3,1)$、$C=(2,1)$では$M=N=(3/2,1/2)$で$MN=0$だが、$(AB+DC)/2=1$である。辺が交差する配置では和が差に変わる。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), A ≠ C → (line[ℝ, A, C]).SOppSide B D → (line[ℝ, A, B]).Parallel line[ℝ, D, C] → (line[ℝ, midpoint ℝ A D, midpoint ℝ B C]).Parallel line[ℝ, A, B] ∧ dist (midpoint ℝ A D) (midpoint ℝ B C) = (dist A B + dist D C) / 2
  proof: |
    by
      intro V P _ _ _ _ A B C D _ hs hpar
      rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev] at hpar
      have m1 : C -ᵥ D ∈ Submodule.span ℝ {B -ᵥ A} := by rw [hpar]; exact Submodule.mem_span_singleton_self _
      obtain ⟨k, hk⟩ := Submodule.mem_span_singleton.mp m1
      have hkpos : 0 < k := by
        by_contra hk0
        rcases (not_lt.mp hk0).lt_or_eq with hneg | hz
        · have hD : D = (-k) • (B -ᵥ A) +ᵥ C := by
            rw [neg_smul, hk, neg_vsub_eq_vsub_rev, vsub_vadd]
          have h3 := AffineSubspace.sSameSide_smul_vsub_vadd_left (s := line[ℝ, A, C]) hs.2.1
            (left_mem_affineSpan_pair ℝ A C) (right_mem_affineSpan_pair ℝ A C) (neg_pos.mpr hneg)
          rw [← hD] at h3
          exact h3.symm.not_sOppSide hs
        · rw [hz, zero_smul] at hk
          exact hs.2.2 (vsub_eq_zero_iff_eq.mp hk.symm ▸ right_mem_affineSpan_pair ℝ A C)
      have hMN : midpoint ℝ B C -ᵥ midpoint ℝ A D = ((1 + k) / 2) • (B -ᵥ A) := by
        rw [midpoint_vsub_midpoint, midpoint_eq_smul_add, ← hk, invOf_eq_inv]
        module
      have hpos : 0 < (1 + k) / 2 := by positivity
      constructor
      · rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev, hMN]
        exact Submodule.span_singleton_smul_eq (IsUnit.mk0 _ hpos.ne') _
      · rw [dist_comm (midpoint ℝ A D), dist_comm A B, dist_comm D C, dist_eq_norm_vsub V (midpoint ℝ B C), dist_eq_norm_vsub V B A,
          dist_eq_norm_vsub V C D, hMN, ← hk, norm_smul, norm_smul, Real.norm_of_nonneg hpos.le, Real.norm_of_nonneg hkpos.le]
        ring
- id: isosceles_trapezoid_diagonals_base_angles
  kind: gap
  level: middle
  topic: 台形・等脚台形
  statement: ユークリッド空間の点$A,B,C,D$について、$A\neq C$で、$B$と$D$が直線$AC$に関して真に反対側にあり、直線$AB$と直線$DC$が平行で$AB\neq DC$、脚が等しく$AD=BC$（等脚台形）なら、$AC=BD$かつ$\angle DAB=\angle ABC$である。
  statement_en: If A ≠ C, B and D lie strictly on opposite sides of line AC, line AB is parallel to line DC, |AB| ≠ |DC| and |AD| = |BC|, then |AC| = |BD| and ∠DAB = ∠ABC.
  assumptions:
  - $A\neq C$
  - $B$と$D$は直線$AC$に関して真に反対側にある
  - 直線$AB$と直線$DC$は平行である
  - $AB\neq DC$
  - $AD=BC$
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $AC=BD$、$\angle DAB=\angle ABC$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$A\neq C$、$B$と$D$は直線$AC$に関して真に反対側にあり、直線$AB$と直線$DC$は平行で、$AB\neq DC$、$AD=BC$とする。$u=\overrightarrow{AB}$、$v=\overrightarrow{AD}$とおく。$B$は直線$AC$上にないので$u\neq\vec{0}$である。平行であるから、実数$k$により$\overrightarrow{DC}=ku$と書ける。

    $k>0$である。実際、$k=0$なら$D=C$となり$D$が直線$AC$上にないことに反し、$k<0$なら$D=C+(-k)u$は$B$と同じ側にあって仮定に反する。また$AB\neq DC$より$k\neq1$である。

    $\overrightarrow{AC}=ku+v$、$\overrightarrow{BC}=v+(k-1)u$、$\overrightarrow{BD}=v-u$である。条件$|v|=|v+(k-1)u|$の両辺を2乗すると$(k-1)\bigl(2u\cdot v+(k-1)|u|^2\bigr)=0$となり、$k\neq1$より$2u\cdot v=(1-k)|u|^2$を得る。これを(1)とする。

    $|ku+v|^2-|v-u|^2=(k^2-1)|u|^2+2(k+1)u\cdot v=(k+1)\bigl((k-1)|u|^2+2u\cdot v\bigr)$であり、(1)よりこれは$0$である。よって$AC=BD$である。

    $\angle DAB$の余弦の式の分子は$v\cdot u$である。$\angle ABC$の余弦の式の分子は$(-u)\cdot(v+(k-1)u)=-u\cdot v-(k-1)|u|^2$であり、(1)よりこれは$u\cdot v$に等しい。分母はそれぞれ$|v||u|$、$|u||v+(k-1)u|=|u||v|$で等しい。ゆえに$\angle DAB=\angle ABC$である。
  strategy: With u = AB, v = AD and DC = k u, the leg equality gives 2u·v = (1-k)|u|², which makes both the diagonal lengths and the base angles agree.
  sketch:
  - 'setup: Write DC = k u with u = AB, using the opposite-side hypothesis for k > 0 and |AB| ≠ |DC| for k ≠ 1.'
  - 'derive: Squaring |AD| = |BC| and dividing by k - 1 gives 2u·v = (1-k)|u|².'
  - 'derive: The squared diagonals differ by (k+1)((k-1)|u|² + 2u·v) = 0.'
  - 'conclude: The cosine numerators and denominators of the two base angles agree, so the angles agree.'
  openmath: (forall (a b c d) (-> (and (!= a c) (opposite_side_of_line b d a c) (parallel_lines a b d c) (!= (dist_of a b) (dist_of d c)) (= (dist_of a d) (dist_of b c))) (and (= (dist_of a c) (dist_of b d)) (= (euclid_angle d a b) (euclid_angle a b c)))))
  hard_negative:
    statement: 条件$AB\neq DC$を外しても、$AB\parallel DC$、$AD=BC$なら$AC=BD$である。
    reason: 平行四辺形$A=(0,0)$、$B=(2,0)$、$C=(3,1)$、$D=(1,1)$では$AD=BC=\sqrt{2}$だが、$AC=\sqrt{10}$、$BD=\sqrt{2}$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), A ≠ C → (line[ℝ, A, C]).SOppSide B D → (line[ℝ, A, B]).Parallel line[ℝ, D, C] → dist A B ≠ dist D C → dist A D = dist B C → dist A C = dist B D ∧ EuclideanGeometry.angle D A B = EuclideanGeometry.angle A B C
  proof: |
    by
      intro V P _ _ _ _ A B C D _ hs hpar hne hleg
      have hBA : B ≠ A := fun h => hs.2.1 (h ▸ left_mem_affineSpan_pair ℝ A C)
      rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev] at hpar
      have m1 : C -ᵥ D ∈ Submodule.span ℝ {B -ᵥ A} := by rw [hpar]; exact Submodule.mem_span_singleton_self _
      obtain ⟨k, hk⟩ := Submodule.mem_span_singleton.mp m1
      have hkpos : 0 < k := by
        by_contra hk0
        rcases (not_lt.mp hk0).lt_or_eq with hneg | hz
        · have hD : D = (-k) • (B -ᵥ A) +ᵥ C := by
            rw [neg_smul, hk, neg_vsub_eq_vsub_rev, vsub_vadd]
          have h3 := AffineSubspace.sSameSide_smul_vsub_vadd_left (s := line[ℝ, A, C]) hs.2.1
            (left_mem_affineSpan_pair ℝ A C) (right_mem_affineSpan_pair ℝ A C) (neg_pos.mpr hneg)
          rw [← hD] at h3
          exact h3.symm.not_sOppSide hs
        · rw [hz, zero_smul] at hk
          exact hs.2.2 (vsub_eq_zero_iff_eq.mp hk.symm ▸ right_mem_affineSpan_pair ℝ A C)
      set u : V := B -ᵥ A with hu
      set v : V := D -ᵥ A with hv
      have hk1 : k ≠ 1 := by
        rintro rfl
        apply hne
        rw [dist_comm A B, dist_comm D C, dist_eq_norm_vsub V B A, dist_eq_norm_vsub V C D, ← hk, one_smul]
      have hCA : C -ᵥ A = k • u + v := by rw [hk, hv, vsub_add_vsub_cancel]
      have hCB : C -ᵥ B = v + (k - 1) • u := by
        rw [← vsub_sub_vsub_cancel_right C B A, hCA, ← hu]; module
      have hDB : D -ᵥ B = v - u := (vsub_sub_vsub_cancel_right D B A).symm
      have hu0 : u ≠ 0 := vsub_ne_zero.mpr hBA
      have hupos : 0 < ‖u‖ ^ 2 := by positivity
      have nsq : ∀ (a b : ℝ), ‖a • u + b • v‖ ^ 2 = a ^ 2 * ‖u‖ ^ 2 + 2 * a * b * inner ℝ u v + b ^ 2 * ‖v‖ ^ 2 := by
        intro a b
        rw [norm_add_sq_real, norm_smul, norm_smul, mul_pow, mul_pow, Real.norm_eq_abs, Real.norm_eq_abs, sq_abs, sq_abs,
          real_inner_smul_left, real_inner_smul_right]
        ring
      have hE : 2 * inner ℝ u v = (1 - k) * ‖u‖ ^ 2 := by
        have h1 : ‖v‖ = ‖C -ᵥ B‖ := by
          rw [hv, ← dist_eq_norm_vsub V D A, ← dist_eq_norm_vsub V C B, dist_comm D A, dist_comm C B, hleg]
        rw [hCB] at h1
        have h2 := nsq (k - 1) 1
        rw [one_smul, add_comm, ← h1] at h2
        have h3 : (k - 1) * (2 * inner ℝ u v - (1 - k) * ‖u‖ ^ 2) = 0 := by linear_combination -h2
        rcases mul_eq_zero.mp h3 with h | h
        · exact absurd (by linarith) hk1
        · linarith
      constructor
      · rw [dist_comm A C, dist_comm B D, dist_eq_norm_vsub V C A, dist_eq_norm_vsub V D B, hCA, hDB]
        have e1 := nsq k 1
        have e2 := nsq (-1) 1
        rw [one_smul] at e1 e2
        rw [neg_smul, one_smul, add_comm, ← sub_eq_add_neg] at e2
        apply (sq_eq_sq₀ (norm_nonneg _) (norm_nonneg _)).mp
        rw [e1, e2]
        linear_combination (k + 1) * hE
      · unfold EuclideanGeometry.angle InnerProductGeometry.angle
        rw [← neg_vsub_eq_vsub_rev B A, ← hu, hCB, ← hv]
        have hn : ‖v + (k - 1) • u‖ = ‖v‖ := by
          rw [← hCB, ← dist_eq_norm_vsub V C B, dist_comm, ← hleg, dist_comm, dist_eq_norm_vsub V D A]
        rw [hn, norm_neg, inner_neg_left, inner_add_right, inner_smul_right, real_inner_self_eq_norm_sq,
          real_inner_comm u v, mul_comm ‖v‖ ‖u‖]
        congr 2
        linear_combination hE
- id: varignon_parallelogram
  kind: named
  level: middle
  topic: 四角形・バリニョンの定理
  statement: （バリニョンの定理）ユークリッド空間の任意の4点$A,B,C,D$について、辺$AB,BC,CD,DA$の中点を順に$P,Q,R,S$とすると$\overrightarrow{PQ}=\overrightarrow{SR}$である。さらに$PQ=AC/2$、$QR=BD/2$である。
  statement_en: (Varignon) For any four points A, B, C, D with P, Q, R, S the midpoints of AB, BC, CD, DA, one has PQ = SR as vectors, |PQ| = |AC|/2 and |QR| = |BD|/2.
  assumptions:
  - $P,Q,R,S$は線分$AB,BC,CD,DA$の中点である
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $\overrightarrow{PQ}=\overrightarrow{SR}$、$PQ=AC/2$、$QR=BD/2$である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$P,Q,R,S$をそれぞれ線分$AB,BC,CD,DA$の中点とする。任意の3点$X,Y,Z$について、$XY$の中点から$YZ$の中点へのベクトルは、位置ベクトルで計算すると$\frac{1}{2}(Y+Z)-\frac{1}{2}(X+Y)=\frac{1}{2}\overrightarrow{XZ}$である。

    $(X,Y,Z)=(A,B,C)$とすると$\overrightarrow{PQ}=\frac{1}{2}\overrightarrow{AC}$である。$(X,Y,Z)=(C,D,A)$とすると$\overrightarrow{RS}=\frac{1}{2}\overrightarrow{CA}$であり、反転して$\overrightarrow{SR}=\frac{1}{2}\overrightarrow{AC}$である。よって$\overrightarrow{PQ}=\overrightarrow{SR}$である。

    長さをとると$PQ=AC/2$である。$(X,Y,Z)=(B,C,D)$とすると$\overrightarrow{QR}=\frac{1}{2}\overrightarrow{BD}$であり、$QR=BD/2$である。
  strategy: Show the vector between consecutive edge midpoints is half the vector between the outer vertices, then apply it to three triples.
  sketch:
  - 'derive: For any X, Y, Z, the midpoint of YZ minus the midpoint of XY is (Z - X)/2.'
  - 'derive: Applying this to (A,B,C) and (C,D,A) gives PQ = SR = AC/2 as vectors.'
  - 'conclude: Applying it to (B,C,D) and taking norms gives the lengths.'
  openmath: (forall (a b c d) (and (parallelogram (midpoint_of a b) (midpoint_of b c) (midpoint_of c d) (midpoint_of d a)) (= (dist_of (midpoint_of a b) (midpoint_of b c)) (/ (dist_of a c) 2)) (= (dist_of (midpoint_of b c) (midpoint_of c d)) (/ (dist_of b d) 2))))
  hard_negative:
    statement: どの四角形でも、辺の中点を結ぶ四角形$PQRS$は長方形である。
    reason: $\overrightarrow{PQ}\cdot\overrightarrow{QR}=\frac{1}{4}\overrightarrow{AC}\cdot\overrightarrow{BD}$なので、長方形になるのは対角線が直交するときだけである。平行四辺形であることだけが常に成り立つ。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), midpoint ℝ B C -ᵥ midpoint ℝ A B = midpoint ℝ C D -ᵥ midpoint ℝ D A ∧ dist (midpoint ℝ A B) (midpoint ℝ B C) = dist A C / 2 ∧ dist (midpoint ℝ B C) (midpoint ℝ C D) = dist B D / 2
  proof: |
    by
      intro V P _ _ _ _ A B C D
      have key : ∀ X Y Z : P, midpoint ℝ Y Z -ᵥ midpoint ℝ X Y = (2⁻¹ : ℝ) • (Z -ᵥ X) := by
        intro X Y Z
        rw [midpoint_vsub_midpoint, midpoint_eq_smul_add, add_comm, vsub_add_vsub_cancel, invOf_eq_inv]
      have hd : ∀ X Y Z : P, dist (midpoint ℝ X Y) (midpoint ℝ Y Z) = dist X Z / 2 := by
        intro X Y Z
        rw [dist_comm, dist_eq_norm_vsub V, key, norm_smul, dist_comm X Z, dist_eq_norm_vsub V Z X]
        norm_num
        ring
      refine ⟨?_, hd A B C, hd B C D⟩
      rw [key A B C, ← neg_vsub_eq_vsub_rev (midpoint ℝ D A) (midpoint ℝ C D), key C D A, ← smul_neg, neg_vsub_eq_vsub_rev]
- id: varignon_rectangle_rhombus_criteria
  kind: gap
  level: high
  topic: 四角形・中点四角形の形
  statement: ユークリッド空間の4点$A,B,C,D$について、辺$AB,BC,CD$の中点を$P,Q,R$とすると、$\overrightarrow{PQ}\cdot\overrightarrow{QR}=0$は$\overrightarrow{AC}\cdot\overrightarrow{BD}=0$と同値であり、$PQ=QR$は$AC=BD$と同値である。
  statement_en: With P, Q, R the midpoints of AB, BC, CD, one has PQ · QR = 0 if and only if AC · BD = 0, and |PQ| = |QR| if and only if |AC| = |BD|.
  assumptions:
  - $P,Q,R$は線分$AB,BC,CD$の中点である
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $\overrightarrow{PQ}\cdot\overrightarrow{QR}=0$は$\overrightarrow{AC}\cdot\overrightarrow{BD}=0$と同値であり、$PQ=QR$は$AC=BD$と同値である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とし、$P,Q,R$をそれぞれ線分$AB,BC,CD$の中点とする。位置ベクトルで計算すると$\overrightarrow{PQ}=\frac{1}{2}\overrightarrow{AC}$、$\overrightarrow{QR}=\frac{1}{2}\overrightarrow{BD}$である。

    したがって$\overrightarrow{PQ}\cdot\overrightarrow{QR}=\frac{1}{4}\overrightarrow{AC}\cdot\overrightarrow{BD}$であり、一方が$0$であることと他方が$0$であることは同値である。また$PQ=AC/2$、$QR=BD/2$なので、$PQ=QR$と$AC=BD$は同値である。
  strategy: Both consecutive sides of the midpoint quadrilateral are half of the diagonals as vectors.
  sketch:
  - 'derive: As vectors PQ = AC/2 and QR = BD/2.'
  - 'derive: The inner product scales by 1/4, so the orthogonality conditions are equivalent.'
  - 'conclude: The lengths scale by 1/2, so the equal-length conditions are equivalent.'
  openmath: (forall (a b c d) (and (<-> (perpendicular_lines (midpoint_of a b) (midpoint_of b c) (midpoint_of b c) (midpoint_of c d)) (perpendicular_lines a c b d)) (<-> (= (dist_of (midpoint_of a b) (midpoint_of b c)) (dist_of (midpoint_of b c) (midpoint_of c d))) (= (dist_of a c) (dist_of b d)))))
  hard_negative:
    statement: 対角線が直交する四角形では、中点四角形はひし形である。
    reason: $A=(0,0)$、$C=(4,0)$、$B=(1,1)$、$D=(1,-1)$では対角線は直交するが、$PQ=AC/2=2$、$QR=BD/2=1$である。対角線の直交に対応するのは長方形である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), (inner ℝ (midpoint ℝ B C -ᵥ midpoint ℝ A B) (midpoint ℝ C D -ᵥ midpoint ℝ B C) = 0 ↔ inner ℝ (C -ᵥ A) (D -ᵥ B) = 0) ∧ (dist (midpoint ℝ A B) (midpoint ℝ B C) = dist (midpoint ℝ B C) (midpoint ℝ C D) ↔ dist A C = dist B D)
  proof: |
    by
      intro V P _ _ _ _ A B C D
      have key : ∀ X Y Z : P, midpoint ℝ Y Z -ᵥ midpoint ℝ X Y = (2⁻¹ : ℝ) • (Z -ᵥ X) := by
        intro X Y Z
        rw [midpoint_vsub_midpoint, midpoint_eq_smul_add, add_comm, vsub_add_vsub_cancel, invOf_eq_inv]
      have hd : ∀ X Y Z : P, dist (midpoint ℝ X Y) (midpoint ℝ Y Z) = dist X Z / 2 := by
        intro X Y Z
        rw [dist_comm, dist_eq_norm_vsub V, key, norm_smul, dist_comm X Z, dist_eq_norm_vsub V Z X]
        norm_num
        ring
      constructor
      · rw [key A B C, key B C D, real_inner_smul_left, real_inner_smul_right]
        constructor
        · intro h
          have h2 : (2⁻¹ * 2⁻¹ : ℝ) * inner ℝ (C -ᵥ A) (D -ᵥ B) = 0 := by linarith
          nlinarith [h2]
        · intro h
          rw [h]; ring
      · rw [hd A B C, hd B C D]
        constructor
        · intro h; linarith
        · intro h; rw [h]
- id: angle_addition_point_on_segment
  kind: gap
  level: middle
  topic: 角・線分上の点による分割
  statement: ユークリッド空間で$E$が$A$と$C$の真に間にあり、$B$が$A,C,E$のいずれとも異なるなら、$\angle ABC=\angle ABE+\angle EBC$である。
  statement_en: If E lies strictly between A and C and B differs from A, C and E, then ∠ABC = ∠ABE + ∠EBC.
  assumptions:
  - $E$は$A$と$C$の真に間にある
  - $B\neq A$、$B\neq C$、$B\neq E$
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,E$
  conclusion: $\angle ABC=\angle ABE+\angle EBC$である。
  answer: |
    $A,B,C,E$をユークリッド空間の点とし、$E$は$A$と$C$の真に間にあり、$B\neq A$、$B\neq C$、$B\neq E$とする。内角の和の式を3組の3点に使う。3点が同一直線上にあっても、互いに異なる3点の3つの角は$0,0,\pi$なので、和は$\pi$である。

    $\angle ABE+\angle BEA+\angle EAB=\pi$、$\angle EBC+\angle BCE+\angle CEB=\pi$、$\angle ABC+\angle BCA+\angle CAB=\pi$である。

    $E$が$A$と$C$の真に間にあるので、$\angle BEA+\angle CEB=\pi$である。また半直線$AE$と半直線$AC$は一致するから$\angle EAB=\angle CAB$であり、半直線$CE$と半直線$CA$も一致するから$\angle BCE=\angle BCA$である。

    はじめの2式を足し、これらを代入すると$\angle ABE+\angle EBC+\pi+\angle CAB+\angle BCA=2\pi$となる。第3式と比べて$\angle ABC=\angle ABE+\angle EBC$を得る。
  strategy: Apply the triangle angle sum to ABE, EBC and ABC, and eliminate using the straight angle at E.
  sketch:
  - 'setup: Write the angle sums of triangles ABE, EBC and ABC.'
  - 'derive: The straight angle at E gives ∠BEA + ∠CEB = π.'
  - 'derive: E on segment AC gives ∠EAB = ∠CAB and ∠BCE = ∠BCA.'
  - 'conclude: Eliminating gives ∠ABC = ∠ABE + ∠EBC.'
  openmath: (forall (a b c e) (-> (and (strictly_between a e c) (!= b a) (!= b c) (!= b e)) (= (euclid_angle a b c) (+ (euclid_angle a b e) (euclid_angle e b c)))))
  hard_negative:
    statement: $E$が直線$AC$上にあれば、線分の外でも$\angle ABC=\angle ABE+\angle EBC$である。
    reason: $A=(0,0)$、$C=(1,0)$、$E=(2,0)$、$B=(0,1)$では$\angle ABC=\pi/4$だが、$\angle ABE=\arctan2$だけですでに$\angle ABC$より大きい。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C E : P), B ≠ A → B ≠ C → B ≠ E → Sbtw ℝ A E C → EuclideanGeometry.angle A B C = EuclideanGeometry.angle A B E + EuclideanGeometry.angle E B C
  proof: |
    by
      intro V P _ _ _ _ A B C E hBA _ hBE hE
      have t1 := EuclideanGeometry.angle_add_angle_add_angle_eq_pi E hBA
      have t2 := EuclideanGeometry.angle_add_angle_add_angle_eq_pi C hBE
      have t3 := EuclideanGeometry.angle_add_angle_add_angle_eq_pi C hBA
      have l := EuclideanGeometry.angle_add_angle_eq_pi_of_angle_eq_pi B hE.angle₁₂₃_eq_pi
      have e1 := hE.angle_eq_left B
      have e2 := hE.symm.angle_eq_right B
      rw [EuclideanGeometry.angle_comm C E B] at t2
      linarith
- id: convex_quadrilateral_angle_sum
  kind: gap
  level: middle
  topic: 多角形・四角形の内角の和
  statement: ユークリッド空間の四角形$ABCD$の対角線が内部の点$E$で交わる（$E$は$A,C$の真に間にあり、$B,D$の真に間にある）とき、隣り合う頂点が異なるなら、4つの内角の和は$2\pi$である。
  statement_en: If E lies strictly between A and C and strictly between B and D, and A ≠ B, B ≠ C, C ≠ D, D ≠ A, then ∠DAB + ∠ABC + ∠BCD + ∠CDA = 2π.
  assumptions:
  - $E$は$A$と$C$の真に間にある
  - $E$は$B$と$D$の真に間にある
  - $A\neq B$、$B\neq C$、$C\neq D$、$D\neq A$
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D,E$
  conclusion: $\angle DAB+\angle ABC+\angle BCD+\angle CDA=2\pi$である。
  answer: |
    $A,B,C,D,E$をユークリッド空間の点とし、$E$は$A$と$C$の真に間かつ$B$と$D$の真に間にあり、$A\neq B$、$B\neq C$、$C\neq D$、$D\neq A$とする。

    まず次の補題を示す。$W$が$X$と$Z$の真に間にあり、$Y\neq X$、$Y\neq Z$、$Y\neq W$なら$\angle XYZ=\angle XYW+\angle WYZ$である。3組の3点$X,Y,W$、$W,Y,Z$、$X,Y,Z$はそれぞれ互いに異なるので、それぞれの3つの角の和は$\pi$である（同一直線上なら角は$0,0,\pi$である）。$\angle YWX+\angle ZWY=\pi$、$\angle WXY=\angle ZXY$、$\angle YZW=\angle YZX$を用いて整理すると、補題を得る。

    補題より、各頂点の角は$E$へ向かう線分で2つに分かれる。$\angle DAB=\angle DAE+\angle EAB$、$\angle ABC=\angle ABE+\angle EBC$、$\angle BCD=\angle BCE+\angle ECD$、$\angle CDA=\angle CDE+\angle EDA$である。

    右辺の8つの角は、三角形$ABE$、$BCE$、$CDE$、$DAE$の$E$以外の内角である。4つの三角形の内角の和は$4\pi$である。$E$での4つの角の和は、$\angle BEA+\angle BEC=\pi$、$\angle DEA+\angle DEC=\pi$より$2\pi$である。したがって求める和は$4\pi-2\pi=2\pi$である。
  strategy: Split each vertex angle along the segment to E, then subtract the four angles at E from the total angle sum of the four triangles around E.
  sketch:
  - 'derive: A point strictly inside a segment splits the opposite vertex angle into a sum.'
  - 'derive: Each of the four angles splits along the segment to E.'
  - 'derive: The four triangles around E have total angle sum 4π.'
  - 'derive: The angles at E form two straight angles, totalling 2π.'
  - 'conclude: The quadrilateral angle sum is 4π - 2π = 2π.'
  openmath: (forall (a b c d e) (-> (and (!= a b) (!= b c) (!= c d) (!= d a) (strictly_between a e c) (strictly_between b e d)) (= (+ (euclid_angle d a b) (euclid_angle a b c) (euclid_angle b c d) (euclid_angle c d a)) (* 2 pi))))
  hard_negative:
    statement: 対角線が内部で交わらない四角形でも、0以上$\pi$以下で測った4つの角の和は$2\pi$である。
    reason: 凹四角形$A=(0,0)$、$B=(4,0)$、$C=(1,1)$、$D=(0,4)$では、$\angle BCD$を$\pi$以下で測ると和は約$253.7^\circ$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D E : P), A ≠ B → B ≠ C → C ≠ D → D ≠ A → Sbtw ℝ A E C → Sbtw ℝ B E D → EuclideanGeometry.angle D A B + EuclideanGeometry.angle A B C + EuclideanGeometry.angle B C D + EuclideanGeometry.angle C D A = 2 * Real.pi
  proof: |
    by
      intro V P _ _ _ _ A B C D E hAB hBC hCD hDA hAC hBD
      have add : ∀ X Y Z W : P, Y ≠ X → Y ≠ W → Sbtw ℝ X W Z →
          EuclideanGeometry.angle X Y Z = EuclideanGeometry.angle X Y W + EuclideanGeometry.angle W Y Z := by
        intro X Y Z W hYX hYW hW
        have t1 := EuclideanGeometry.angle_add_angle_add_angle_eq_pi W hYX
        have t2 := EuclideanGeometry.angle_add_angle_add_angle_eq_pi Z hYW
        have t3 := EuclideanGeometry.angle_add_angle_add_angle_eq_pi Z hYX
        have l := EuclideanGeometry.angle_add_angle_eq_pi_of_angle_eq_pi Y hW.angle₁₂₃_eq_pi
        have e1 := hW.angle_eq_left Y
        have e2 := hW.symm.angle_eq_right Y
        rw [EuclideanGeometry.angle_comm Z W Y] at t2
        linarith
      have a1 := add D A B E hDA.symm hAC.ne_left.symm hBD.symm
      have a2 := add A B C E hAB.symm hBD.ne_left.symm hAC
      have a3 := add B C D E hBC.symm hAC.ne_right.symm hBD
      have a4 := add C D A E hCD.symm hBD.ne_right.symm hAC.symm
      have t1 := EuclideanGeometry.angle_add_angle_add_angle_eq_pi E hAB.symm
      have t2 := EuclideanGeometry.angle_add_angle_add_angle_eq_pi E hBC.symm
      have t3 := EuclideanGeometry.angle_add_angle_add_angle_eq_pi E hCD.symm
      have t4 := EuclideanGeometry.angle_add_angle_add_angle_eq_pi E hDA.symm
      have l1 := EuclideanGeometry.angle_add_angle_eq_pi_of_angle_eq_pi B hAC.angle₁₂₃_eq_pi
      have l2 := EuclideanGeometry.angle_add_angle_eq_pi_of_angle_eq_pi D hAC.angle₁₂₃_eq_pi
      linarith [EuclideanGeometry.angle_comm C E B, EuclideanGeometry.angle_comm A E D]
- id: convex_polygon_interior_angle_sum
  kind: textbook
  level: middle
  topic: 多角形・内角の和
  statement: 向きのついたユークリッド平面の点列$p_0,\dots,p_{n+2}$（$n\geq0$）が、$i<j<k$のとき常に3点$p_i,p_j,p_k$が正の向きに並ぶという意味で凸$(n+3)$角形の頂点をなすなら、内角の和は$(n+1)\pi$である。
  statement_en: In an oriented Euclidean plane, if p_0, ..., p_{n+2} are such that every triple with i < j < k has positive oriented angle sign, then the interior angles of the convex (n+3)-gon sum to (n+1)π.
  assumptions:
  - 向きのついた2次元のユークリッド平面で考える
  - $n$は$0$以上の整数である
  - $i<j<k\leq n+2$のとき、有向角$p_ip_jp_k$の符号は正である
  quantifiers:
  - 任意の$n\geq0$と平面の点列$p_0,\dots,p_{n+2}$
  conclusion: 内角$\angle p_{n+2}p_0p_1$、$\angle p_ip_{i+1}p_{i+2}$（$0\leq i\leq n$）、$\angle p_{n+1}p_{n+2}p_0$の和は$(n+1)\pi$である。
  answer: |
    向きのついたユークリッド平面の点列$p_0,p_1,\dots$と$n\geq0$を考え、$i<j<k\leq n+2$のとき有向角$p_ip_jp_k$の符号は正であるとする。符号が正の有向角について、3点の頂点はすべて異なり3点は同一直線上にないので、対応する無向角は$0$より大きく$\pi$より小さい。また3点を巡回させても符号は変わらない。

    補題を示す。点$X,A,B,C$について、有向角$AXB$、$BXC$、$AXC$の符号がすべて正なら、$\angle AXC=\angle AXB+\angle BXC$である。符号が正なので有向角は無向角に等しく、有向角の加法から$\angle AXB+\angle BXC-\angle AXC$は$2\pi$の整数倍である。この値は$-\pi$より大きく$2\pi$より小さいので$0$である。

    $n$に関する帰納法で和が$(n+1)\pi$であることを示す。$n=0$では三角形の内角の和そのものである。

    $n$で成り立つとして、頂点$p_0,\dots,p_{n+3}$を考える。$p_0,\dots,p_{n+2}$は帰納法の仮定をみたす。補題を2回使うと
    $\angle p_{n+1}p_{n+2}p_{n+3}=\angle p_{n+1}p_{n+2}p_0+\angle p_0p_{n+2}p_{n+3}$、
    $\angle p_{n+3}p_0p_1=\angle p_{n+3}p_0p_{n+2}+\angle p_{n+2}p_0p_1$
    である。符号の仮定は、3つ組$(0,n+1,n+2)$、$(0,n+2,n+3)$、$(n+1,n+2,n+3)$、$(0,1,n+2)$、$(0,1,n+3)$とその巡回から得られる。

    頂点が$n+4$個の多角形の内角の和を書き、この2式を代入する。すると、頂点が$n+3$個の多角形の内角の和と、三角形$p_0p_{n+2}p_{n+3}$の内角の和$\pi$に分かれる。よって合計は$(n+1)\pi+\pi=(n+2)\pi$であり、帰納法が完結する。
  strategy: Induct by cutting off the triangle at the last vertex, using a lemma that adds angles at a vertex when all three oriented signs are positive.
  sketch:
  - 'derive: Positive signs make each unoriented angle lie strictly between 0 and π, and cyclic rotation keeps the sign.'
  - 'derive: If the three oriented angles at X are positive, the unoriented angles add, since their defect is a multiple of 2π in (-π, 2π).'
  - 'induction: The base case n = 0 is the triangle angle sum.'
  - 'derive: For the step, split the angles at p_{n+2} and p_0 along the diagonal p_0 p_{n+2}.'
  - 'conclude: The sum separates into the smaller polygon and one triangle, adding π.'
  openmath: (forall (p n) (-> (and (in n N) (convex_polygon_points p n)) (= (polygon_interior_angle_sum p n) (* (+ n 1) pi))))
  hard_negative:
    statement: 凸でない多角形でも、0以上$\pi$以下で測った角の和は$(n+1)\pi$である。
    reason: 凹四角形$A=(0,0)$、$B=(4,0)$、$C=(1,1)$、$D=(0,4)$では、和は約$253.7^\circ$であり$2\pi$にならない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] [Module.Oriented ℝ V (Fin 2)] (n : ℕ) (p : ℕ → P), (∀ i j k : ℕ, i < j → j < k → k ≤ n + 2 → (EuclideanGeometry.oangle (p i) (p j) (p k)).sign = 1) → ∑ i ∈ Finset.range (n + 1), EuclideanGeometry.angle (p i) (p (i + 1)) (p (i + 2)) + EuclideanGeometry.angle (p (n + 1)) (p (n + 2)) (p 0) + EuclideanGeometry.angle (p (n + 2)) (p 0) (p 1) = ((n : ℝ) + 1) * Real.pi
  proof: |
    by
      intro V P _ _ _ _ _ _ n p
      have key : ∀ X A B C : P, (EuclideanGeometry.oangle A X B).sign = 1 → (EuclideanGeometry.oangle B X C).sign = 1 →
          (EuclideanGeometry.oangle A X C).sign = 1 →
          EuclideanGeometry.angle A X C = EuclideanGeometry.angle A X B + EuclideanGeometry.angle B X C := by
        intro X A B C h1 h2 h3
        have hlt : ∀ U W : P, (EuclideanGeometry.oangle U X W).sign = 1 → EuclideanGeometry.angle U X W < Real.pi := by
          intro U W h
          apply EuclideanGeometry.angle_lt_pi_of_not_collinear
          rw [← EuclideanGeometry.oangle_sign_eq_zero_iff_collinear, h]
          decide
        have hadd := EuclideanGeometry.oangle_add (EuclideanGeometry.left_ne_of_oangle_sign_eq_one h1)
          (EuclideanGeometry.right_ne_of_oangle_sign_eq_one h1) (EuclideanGeometry.right_ne_of_oangle_sign_eq_one h2)
        rw [EuclideanGeometry.oangle_eq_angle_of_sign_eq_one h1, EuclideanGeometry.oangle_eq_angle_of_sign_eq_one h2,
          EuclideanGeometry.oangle_eq_angle_of_sign_eq_one h3, ← Real.Angle.coe_add, Real.Angle.angle_eq_iff_two_pi_dvd_sub] at hadd
        obtain ⟨k, hk⟩ := hadd
        have a1 := hlt _ _ h1
        have a2 := hlt _ _ h2
        have a3 := hlt _ _ h3
        have b1 := EuclideanGeometry.angle_nonneg A X B
        have b2 := EuclideanGeometry.angle_nonneg B X C
        have b3 := EuclideanGeometry.angle_nonneg A X C
        have hpi := Real.pi_pos
        have hk0 : k = 0 := by
          have u1 : (k : ℝ) < 1 := by
            by_contra hc
            push Not at hc
            nlinarith
          have u2 : (-1 : ℝ) < k := by
            by_contra hc
            push Not at hc
            nlinarith
          have u1' : k < 1 := by exact_mod_cast u1
          have u2' : -1 < k := by exact_mod_cast u2
          omega
        rw [hk0] at hk
        simp at hk
        linarith
      induction n with
      | zero =>
        intro h
        have hne : p 1 ≠ p 0 := (EuclideanGeometry.left_ne_of_oangle_sign_eq_one (h 0 1 2 (by norm_num) (by norm_num) (by norm_num))).symm
        have := EuclideanGeometry.angle_add_angle_add_angle_eq_pi (p 2) hne
        simp
        linarith
      | succ n ih =>
        intro h
        have ih' := ih (fun i j k hij hjk hk => h i j k hij hjk (by omega))
        rw [Finset.sum_range_succ]
        have s1 : (EuclideanGeometry.oangle (p 0) (p (n + 1)) (p (n + 2))).sign = 1 := h _ _ _ (by omega) (by omega) (by omega)
        have s2 : (EuclideanGeometry.oangle (p 0) (p (n + 2)) (p (n + 3))).sign = 1 := h _ _ _ (by omega) (by omega) (by omega)
        have s3 : (EuclideanGeometry.oangle (p (n + 1)) (p (n + 2)) (p (n + 3))).sign = 1 := h _ _ _ (by omega) (by omega) (by omega)
        have s4 : (EuclideanGeometry.oangle (p 0) (p 1) (p (n + 2))).sign = 1 := h _ _ _ (by omega) (by omega) (by omega)
        have s5 : (EuclideanGeometry.oangle (p 0) (p 1) (p (n + 3))).sign = 1 := h _ _ _ (by omega) (by omega) (by omega)
        have r : ∀ U W Z : P, (EuclideanGeometry.oangle U W Z).sign = 1 → (EuclideanGeometry.oangle W Z U).sign = 1 := by
          intro U W Z hs
          rw [EuclideanGeometry.oangle_rotate_sign, hs]
        have k1 := key (p (n + 2)) (p (n + 1)) (p 0) (p (n + 3)) (r _ _ _ s1) s2 s3
        have k2 := key (p 0) (p (n + 3)) (p (n + 2)) (p 1) (r _ _ _ (r _ _ _ s2)) (r _ _ _ (r _ _ _ s4)) (r _ _ _ (r _ _ _ s5))
        have hne : p (n + 2) ≠ p 0 := (EuclideanGeometry.left_ne_of_oangle_sign_eq_one s2).symm
        have t := EuclideanGeometry.angle_add_angle_add_angle_eq_pi (p (n + 3)) hne
        push_cast
        simp only [show n + 1 + 2 = n + 3 by ring, show n + 1 + 1 = n + 2 by ring] at *
        linarith
- id: convex_polygon_exterior_angle_sum
  kind: textbook
  level: middle
  topic: 多角形・外角の和
  statement: 向きのついたユークリッド平面の点列$p_0,\dots,p_{n+2}$（$n\geq0$）が、$i<j<k$のとき常に3点$p_i,p_j,p_k$が正の向きに並ぶという意味で凸$(n+3)$角形の頂点をなすなら、各頂点の外角（$\pi$から内角を引いた角）の和は$n$によらず$2\pi$である。
  statement_en: In an oriented Euclidean plane, if p_0, ..., p_{n+2} are such that every triple with i < j < k has positive oriented angle sign, then the exterior angles, each π minus the interior angle, sum to 2π.
  assumptions:
  - 向きのついた2次元のユークリッド平面で考える
  - $n$は$0$以上の整数である
  - $i<j<k\leq n+2$のとき、有向角$p_ip_jp_k$の符号は正である
  quantifiers:
  - 任意の$n\geq0$と平面の点列$p_0,\dots,p_{n+2}$
  conclusion: $n+3$個の頂点での$\pi$から内角を引いた角の和は$2\pi$である。
  answer: |
    向きのついたユークリッド平面の点列$p_0,p_1,\dots$と$n\geq0$を考え、$i<j<k\leq n+2$のとき有向角$p_ip_jp_k$の符号は正であるとする。

    符号が正の有向角について、無向角は$0$より大きく$\pi$より小さく、3点を巡回させても符号は変わらない。点$X,A,B,C$について有向角$AXB$、$BXC$、$AXC$の符号がすべて正なら、$\angle AXB+\angle BXC-\angle AXC$は$2\pi$の整数倍で、$-\pi$より大きく$2\pi$より小さいから$0$である。

    これを用いて、内角の和が$(n+1)\pi$であることを$n$の帰納法で示す。$n=0$は三角形の内角の和である。頂点$p_0,\dots,p_{n+3}$の多角形では、$\angle p_{n+1}p_{n+2}p_{n+3}=\angle p_{n+1}p_{n+2}p_0+\angle p_0p_{n+2}p_{n+3}$、$\angle p_{n+3}p_0p_1=\angle p_{n+3}p_0p_{n+2}+\angle p_{n+2}p_0p_1$である。必要な符号は、3つ組$(0,n+1,n+2)$、$(0,n+2,n+3)$、$(n+1,n+2,n+3)$、$(0,1,n+2)$、$(0,1,n+3)$とその巡回から得られる。これらを代入すると、和は頂点が1つ少ない多角形の内角の和と、三角形$p_0p_{n+2}p_{n+3}$の内角の和$\pi$に分かれる。

    頂点は$n+3$個あるので、外角の和は$(n+3)\pi-(n+1)\pi=2\pi$である。
  strategy: Prove the interior sum (n+1)π by cutting off triangles, then subtract from (n+3)π.
  sketch:
  - 'derive: Positive oriented signs let unoriented angles at a vertex add.'
  - 'induction: The interior angle sum is (n+1)π, by cutting off the triangle at the last vertex.'
  - 'conclude: The exterior sum is (n+3)π - (n+1)π = 2π.'
  openmath: (forall (p n) (-> (and (in n N) (convex_polygon_points p n)) (= (polygon_exterior_angle_sum p n) (* 2 pi))))
  hard_negative:
    statement: 凸でない多角形でも、$\pi$から0以上$\pi$以下の角を引いた値の和は$2\pi$である。
    reason: 凹四角形$A=(0,0)$、$B=(4,0)$、$C=(1,1)$、$D=(0,4)$では、4つの角の和が約$253.7^\circ$なので、この和は約$466.3^\circ$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 2)] [Module.Oriented ℝ V (Fin 2)] (n : ℕ) (p : ℕ → P), (∀ i j k : ℕ, i < j → j < k → k ≤ n + 2 → (EuclideanGeometry.oangle (p i) (p j) (p k)).sign = 1) → ∑ i ∈ Finset.range (n + 1), (Real.pi - EuclideanGeometry.angle (p i) (p (i + 1)) (p (i + 2))) + (Real.pi - EuclideanGeometry.angle (p (n + 1)) (p (n + 2)) (p 0)) + (Real.pi - EuclideanGeometry.angle (p (n + 2)) (p 0) (p 1)) = 2 * Real.pi
  proof: |
    by
      intro V P _ _ _ _ _ _ n p h0
      have main : ∀ (n : ℕ), (∀ i j k : ℕ, i < j → j < k → k ≤ n + 2 → (EuclideanGeometry.oangle (p i) (p j) (p k)).sign = 1) →
          ∑ i ∈ Finset.range (n + 1), EuclideanGeometry.angle (p i) (p (i + 1)) (p (i + 2)) +
            EuclideanGeometry.angle (p (n + 1)) (p (n + 2)) (p 0) + EuclideanGeometry.angle (p (n + 2)) (p 0) (p 1) =
          ((n : ℝ) + 1) * Real.pi := by
        intro n
        have key : ∀ X A B C : P, (EuclideanGeometry.oangle A X B).sign = 1 → (EuclideanGeometry.oangle B X C).sign = 1 →
            (EuclideanGeometry.oangle A X C).sign = 1 →
            EuclideanGeometry.angle A X C = EuclideanGeometry.angle A X B + EuclideanGeometry.angle B X C := by
          intro X A B C h1 h2 h3
          have hlt : ∀ U W : P, (EuclideanGeometry.oangle U X W).sign = 1 → EuclideanGeometry.angle U X W < Real.pi := by
            intro U W h
            apply EuclideanGeometry.angle_lt_pi_of_not_collinear
            rw [← EuclideanGeometry.oangle_sign_eq_zero_iff_collinear, h]
            decide
          have hadd := EuclideanGeometry.oangle_add (EuclideanGeometry.left_ne_of_oangle_sign_eq_one h1)
            (EuclideanGeometry.right_ne_of_oangle_sign_eq_one h1) (EuclideanGeometry.right_ne_of_oangle_sign_eq_one h2)
          rw [EuclideanGeometry.oangle_eq_angle_of_sign_eq_one h1, EuclideanGeometry.oangle_eq_angle_of_sign_eq_one h2,
            EuclideanGeometry.oangle_eq_angle_of_sign_eq_one h3, ← Real.Angle.coe_add, Real.Angle.angle_eq_iff_two_pi_dvd_sub] at hadd
          obtain ⟨k, hk⟩ := hadd
          have a1 := hlt _ _ h1
          have a2 := hlt _ _ h2
          have a3 := hlt _ _ h3
          have b1 := EuclideanGeometry.angle_nonneg A X B
          have b2 := EuclideanGeometry.angle_nonneg B X C
          have b3 := EuclideanGeometry.angle_nonneg A X C
          have hpi := Real.pi_pos
          have hk0 : k = 0 := by
            have u1 : (k : ℝ) < 1 := by
              by_contra hc
              push Not at hc
              nlinarith
            have u2 : (-1 : ℝ) < k := by
              by_contra hc
              push Not at hc
              nlinarith
            have u1' : k < 1 := by exact_mod_cast u1
            have u2' : -1 < k := by exact_mod_cast u2
            omega
          rw [hk0] at hk
          simp at hk
          linarith
        induction n with
        | zero =>
          intro h
          have hne : p 1 ≠ p 0 := (EuclideanGeometry.left_ne_of_oangle_sign_eq_one (h 0 1 2 (by norm_num) (by norm_num) (by norm_num))).symm
          have := EuclideanGeometry.angle_add_angle_add_angle_eq_pi (p 2) hne
          simp
          linarith
        | succ n ih =>
          intro h
          have ih' := ih (fun i j k hij hjk hk => h i j k hij hjk (by omega))
          rw [Finset.sum_range_succ]
          have s1 : (EuclideanGeometry.oangle (p 0) (p (n + 1)) (p (n + 2))).sign = 1 := h _ _ _ (by omega) (by omega) (by omega)
          have s2 : (EuclideanGeometry.oangle (p 0) (p (n + 2)) (p (n + 3))).sign = 1 := h _ _ _ (by omega) (by omega) (by omega)
          have s3 : (EuclideanGeometry.oangle (p (n + 1)) (p (n + 2)) (p (n + 3))).sign = 1 := h _ _ _ (by omega) (by omega) (by omega)
          have s4 : (EuclideanGeometry.oangle (p 0) (p 1) (p (n + 2))).sign = 1 := h _ _ _ (by omega) (by omega) (by omega)
          have s5 : (EuclideanGeometry.oangle (p 0) (p 1) (p (n + 3))).sign = 1 := h _ _ _ (by omega) (by omega) (by omega)
          have r : ∀ U W Z : P, (EuclideanGeometry.oangle U W Z).sign = 1 → (EuclideanGeometry.oangle W Z U).sign = 1 := by
            intro U W Z hs
            rw [EuclideanGeometry.oangle_rotate_sign, hs]
          have k1 := key (p (n + 2)) (p (n + 1)) (p 0) (p (n + 3)) (r _ _ _ s1) s2 s3
          have k2 := key (p 0) (p (n + 3)) (p (n + 2)) (p 1) (r _ _ _ (r _ _ _ s2)) (r _ _ _ (r _ _ _ s4)) (r _ _ _ (r _ _ _ s5))
          have hne : p (n + 2) ≠ p 0 := (EuclideanGeometry.left_ne_of_oangle_sign_eq_one s2).symm
          have t := EuclideanGeometry.angle_add_angle_add_angle_eq_pi (p (n + 3)) hne
          push_cast
          simp only [show n + 1 + 2 = n + 3 by ring, show n + 1 + 1 = n + 2 by ring] at *
          linarith
      have h1 := main n h0
      rw [Finset.sum_sub_distrib, Finset.sum_const, Finset.card_range, nsmul_eq_mul]
      push_cast
      linarith
- id: triangle_area_sine
  kind: textbook
  level: high
  topic: 面積・三角形の面積公式
  statement: 平面$\mathbb{R}^2$の3点$A,B,C$について、凸包として定めた三角形$ABC$の面積は$\frac{1}{2}AB\cdot AC\sin\angle BAC$である。3点が同一直線上にあるときは両辺とも$0$である（$A=B$または$A=C$のときは$AB\cdot AC=0$なので、角の値によらず右辺は$0$である）。
  statement_en: For points A, B, C of the Euclidean plane, the area of the convex hull of {A, B, C} equals (1/2)|AB||AC| sin ∠BAC.
  assumptions:
  - 三角形の面積は3点の凸包のルベーグ測度とする
  quantifiers:
  - 平面$\mathbb{R}^2$の任意の点$A,B,C$
  conclusion: 面積は$\frac{1}{2}AB\cdot AC\sin\angle BAC$である。
  answer: |
    $A,B,C$を平面$\mathbb{R}^2$の点とし、三角形$ABC$の面積を3点の凸包の面積で定める。$u=\overrightarrow{AB}$、$w=\overrightarrow{AC}$とおく。

    標準三角形$T=\{(x,y)\mid x\geq0,\ y\geq0,\ x+y\leq1\}$の面積は$\int_0^1(1-x)\,dx=\frac{1}{2}$である。線形写像$L(x,y)=xu+yw$を考える。$T$は凸で、$L(T)$を$A$だけ平行移動した集合は$A,B,C$を含む凸集合だから、3点の凸包を含む。逆に$T$の点$(x,y)$の像は$(1-x-y)A+xB+yC$という凸結合なので、凸包に含まれる。よって凸包は$L(T)+A$に等しい。

    平行移動で面積は変わらず、線形写像は面積を行列式の絶対値倍するので、面積は$\frac{1}{2}|u_1w_2-u_2w_1|$である。

    一方、$(u_1w_2-u_2w_1)^2=|u|^2|w|^2-(u\cdot w)^2$であり、$u\cdot w=|u||w|\cos\angle BAC$と$\sin\angle BAC\geq0$より、$|u_1w_2-u_2w_1|=|u||w|\sin\angle BAC$である。ただし$u$または$w$が零ベクトルのときは両辺とも$0$である。したがって面積は$\frac{1}{2}AB\cdot AC\sin\angle BAC$である。
  strategy: Realize the triangle as an affine image of the standard triangle, so its area is half the absolute determinant, and identify the determinant with |u||w| sin θ.
  sketch:
  - 'derive: The standard triangle has area 1/2 by slicing.'
  - 'construct: The linear map sending the unit vectors to AB and AC, followed by translation by A, carries it onto the convex hull.'
  - 'apply_theorem: Linear maps scale area by the absolute determinant, and translations preserve it.'
  - 'derive: The squared determinant is |u|²|w|² - (u·w)², so its absolute value is |u||w| sin θ.'
  - 'conclude: The area is (1/2)|AB||AC| sin ∠BAC.'
  openmath: (forall (a b c) (= (triangle_area a b c) (* (/ 1 2) (dist_of a b) (dist_of a c) (sin (euclid_angle b a c)))))
  hard_negative:
    statement: 三角形$ABC$の面積は$\frac{1}{2}AB\cdot AC\sin\angle ABC$である。
    reason: 2辺の間の角を使う必要がある。$A=(0,0)$、$B=(1,0)$、$C=(0,1)$では面積は$\frac{1}{2}$だが、右辺は$\frac{1}{2}\sin(\pi/4)$である。
  target: |
    ∀ (A B C : EuclideanSpace ℝ (Fin 2)), (MeasureTheory.volume (convexHull ℝ ({A, B, C} : Set (EuclideanSpace ℝ (Fin 2))))).toReal = 1 / 2 * dist A B * dist A C * Real.sin (EuclideanGeometry.angle B A C)
  proof: |
    by
      intro A B C
      let S : Set (ℝ × ℝ) := {p | 0 ≤ p.1 ∧ 0 ≤ p.2 ∧ p.1 + p.2 ≤ 1}
      have hSm : MeasurableSet S := by
        apply IsClosed.measurableSet
        exact (isClosed_le continuous_const continuous_fst).inter
          ((isClosed_le continuous_const continuous_snd).inter
            (isClosed_le (continuous_fst.add continuous_snd) continuous_const))
      have hSv : MeasureTheory.volume S = ENNReal.ofReal (1 / 2) := by
        rw [MeasureTheory.Measure.volume_eq_prod, MeasureTheory.Measure.prod_apply hSm]
        have hslice : ∀ x : ℝ, MeasureTheory.volume (Prod.mk x ⁻¹' S) =
            (Set.Icc (0 : ℝ) 1).indicator (fun x => ENNReal.ofReal (1 - x)) x := by
          intro x
          by_cases hx : x ∈ Set.Icc (0 : ℝ) 1
          · rw [Set.indicator_of_mem hx]
            have : Prod.mk x ⁻¹' S = Set.Icc 0 (1 - x) := by
              ext y
              simp only [S, Set.mem_preimage, Set.mem_setOf_eq, Set.mem_Icc]
              constructor
              · rintro ⟨_, h2, h3⟩; exact ⟨h2, by linarith⟩
              · rintro ⟨h2, h3⟩; exact ⟨hx.1, h2, by linarith⟩
            rw [this, Real.volume_Icc, sub_zero]
          · rw [Set.indicator_of_notMem hx]
            have : Prod.mk x ⁻¹' S = ∅ := by
              ext y
              simp only [S, Set.mem_preimage, Set.mem_setOf_eq, Set.mem_empty_iff_false, iff_false]
              rintro ⟨h1, h2, h3⟩
