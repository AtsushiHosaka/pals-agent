- id: heron_sine_form
  kind: gap
  level: high
  topic: 面積・二辺夾角とヘロンの式
  statement: ユークリッド空間の3点$A,B,C$について、$a=BC$、$b=CA$、$c=AB$、$s=(a+b+c)/2$とすると、$\frac{1}{2}bc\sin\angle BAC=\sqrt{s(s-a)(s-b)(s-c)}$である（$A=B$または$A=C$のときは$bc=0$なので、角の値によらず左辺は$0$である）。
  statement_en: For points A, B, C with a = |BC|, b = |CA|, c = |AB| and s = (a+b+c)/2, one has (1/2) b c sin ∠BAC = √(s(s-a)(s-b)(s-c)).
  assumptions:
  - $a=BC$、$b=CA$、$c=AB$、$s=(a+b+c)/2$
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C$
  conclusion: $\frac{1}{2}bc\sin\angle BAC=\sqrt{s(s-a)(s-b)(s-c)}$である。
  answer: |
    $A,B,C$をユークリッド空間の点とし、$a=BC$、$b=CA$、$c=AB$、$s=(a+b+c)/2$とする。$A=B$のときは$c=0$、$a=b$、$s=a$なので両辺とも$0$であり、$A=C$のときは$b=0$、$a=c$、$s=a$なので両辺とも$0$である。以下$A\neq B$、$A\neq C$とし、$\theta=\angle BAC$とおく。余弦定理より$2bc\cos\theta=b^2+c^2-a^2$である。$0\leq\theta\leq\pi$より$\sin\theta\geq0$なので、左辺は$0$以上である。よって左辺の2乗が$s(s-a)(s-b)(s-c)$に等しいことを示せばよい。

    $\sin^2\theta=1-\cos^2\theta$より、$\left(\frac{1}{2}bc\sin\theta\right)^2=\frac{1}{4}b^2c^2-\frac{1}{16}(2bc\cos\theta)^2=\frac{1}{4}b^2c^2-\frac{1}{16}(b^2+c^2-a^2)^2$である。

    右辺を展開すると$\frac{1}{16}(a+b+c)(-a+b+c)(a-b+c)(a+b-c)$に等しく、これは$s(s-a)(s-b)(s-c)$である。
  strategy: Square the left side, substitute the cosine rule and factor as a difference of squares.
  sketch:
  - 'apply_theorem: The cosine rule gives 2bc cos θ = b² + c² - a².'
  - 'derive: The left side is nonnegative, so compare squares.'
  - 'derive: The squared left side is b²c²/4 - (b²+c²-a²)²/16.'
  - 'conclude: This factors as s(s-a)(s-b)(s-c).'
  openmath: (forall (a b c) (= (* (/ 1 2) (dist_of a b) (dist_of a c) (sin (euclid_angle b a c))) (root (* (/ (+ (dist_of a b) (dist_of a c) (dist_of b c)) 2) (- (/ (+ (dist_of a b) (dist_of a c) (dist_of b c)) 2) (dist_of b c)) (- (/ (+ (dist_of a b) (dist_of a c) (dist_of b c)) 2) (dist_of a c)) (- (/ (+ (dist_of a b) (dist_of a c) (dist_of b c)) 2) (dist_of a b))) 2)))
  hard_negative:
    statement: $s=a+b+c$としても$\frac{1}{2}bc\sin\angle BAC=\sqrt{s(s-a)(s-b)(s-c)}$である。
    reason: 3辺が$3,4,5$の直角三角形では左辺は$6$だが、$s=12$とすると右辺は$\sqrt{12\cdot9\cdot8\cdot7}$である。$s$は周の半分である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), 1 / 2 * dist A B * dist A C * Real.sin (EuclideanGeometry.angle B A C) = Real.sqrt (((dist A B + dist A C + dist B C) / 2) * ((dist A B + dist A C + dist B C) / 2 - dist B C) * ((dist A B + dist A C + dist B C) / 2 - dist A C) * ((dist A B + dist A C + dist B C) / 2 - dist A B))
  proof: |
    by
      intro V P _ _ _ _ A B C
      have hcos := EuclideanGeometry.dist_sq_eq_dist_sq_add_dist_sq_sub_two_mul_dist_mul_dist_mul_cos_angle B A C
      rw [dist_comm B A, dist_comm C A] at hcos
      have hsin := Real.sin_sq_add_cos_sq (EuclideanGeometry.angle B A C)
      have hs0 : 0 ≤ Real.sin (EuclideanGeometry.angle B A C) := Real.sin_nonneg_of_nonneg_of_le_pi (EuclideanGeometry.angle_nonneg _ _ _) (EuclideanGeometry.angle_le_pi _ _ _)
      have hnn : 0 ≤ 1 / 2 * dist A B * dist A C * Real.sin (EuclideanGeometry.angle B A C) := by positivity
      rw [← Real.sqrt_sq hnn]
      congr 1
      set c := dist A B
      set b := dist A C
      set a := dist B C
      set θ := EuclideanGeometry.angle B A C
      have h1 : Real.sin θ ^ 2 = 1 - Real.cos θ ^ 2 := by linarith
      have h2 : 2 * c * b * Real.cos θ = c * c + b * b - a * a := by linarith
      have : (1 / 2 * c * b * Real.sin θ) ^ 2 = (1 / 4) * c ^ 2 * b ^ 2 - (1 / 16) * (2 * c * b * Real.cos θ) ^ 2 := by
        rw [mul_pow, h1]; ring
      rw [this, h2]
      ring
- id: heron_formula_area
  kind: named
  level: high
  topic: 面積・ヘロンの公式
  statement: （ヘロンの公式）平面$\mathbb{R}^2$の3点$A,B,C$について、$a=BC$、$b=CA$、$c=AB$、$s=(a+b+c)/2$とすると、凸包として定めた三角形$ABC$の面積は$\sqrt{s(s-a)(s-b)(s-c)}$である。
  statement_en: (Heron) For points A, B, C of the Euclidean plane with side lengths a, b, c and s = (a+b+c)/2, the area of the convex hull of {A, B, C} equals √(s(s-a)(s-b)(s-c)).
  assumptions:
  - 三角形の面積は3点の凸包のルベーグ測度とする
  - $a=BC$、$b=CA$、$c=AB$、$s=(a+b+c)/2$
  quantifiers:
  - 平面$\mathbb{R}^2$の任意の点$A,B,C$
  conclusion: 面積は$\sqrt{s(s-a)(s-b)(s-c)}$である。
  answer: |
    $A,B,C$を平面$\mathbb{R}^2$の点とし、$a=BC$、$b=CA$、$c=AB$、$s=(a+b+c)/2$、$\theta=\angle BAC$とする。

    まず面積が$\frac{1}{2}bc\sin\theta$であることを示す。標準三角形$\{(x,y)\mid x,y\geq0,\ x+y\leq1\}$の面積は$\frac{1}{2}$である。$u=\overrightarrow{AB}$、$w=\overrightarrow{AC}$に対し、写像$(x,y)\mapsto A+xu+yw$は標準三角形を$A,B,C$の凸包に写す。線形写像は面積を行列式の絶対値倍するので、面積は$\frac{1}{2}|u_1w_2-u_2w_1|$である。$(u_1w_2-u_2w_1)^2=|u|^2|w|^2-(u\cdot w)^2$より、これは$\frac{1}{2}|u||w|\sin\theta=\frac{1}{2}bc\sin\theta$である（$u$または$w$が零ベクトルのときは両辺とも$0$である）。

    次に、余弦定理より$2bc\cos\theta=b^2+c^2-a^2$である（$bc=0$のときは$a=b$または$a=c$なので両辺とも$0$である）。また$\sin\theta\geq0$である。$\left(\frac{1}{2}bc\sin\theta\right)^2=\frac{1}{4}b^2c^2-\frac{1}{16}(b^2+c^2-a^2)^2=\frac{1}{16}(a+b+c)(-a+b+c)(a-b+c)(a+b-c)=s(s-a)(s-b)(s-c)$である。

    面積は$0$以上なので、平方根をとって結論を得る。
  strategy: First show the area equals (1/2)bc sin θ via an affine image of the standard triangle, then eliminate θ with the cosine rule.
  sketch:
  - 'construct: Map the standard triangle affinely onto the convex hull.'
  - 'apply_theorem: Area scales by the absolute determinant, giving (1/2)bc sin θ.'
  - 'apply_theorem: The cosine rule gives 2bc cos θ = b² + c² - a².'
  - 'derive: The squared area factors as s(s-a)(s-b)(s-c).'
  - 'conclude: Take the nonnegative square root.'
  openmath: (forall (a b c) (= (triangle_area a b c) (root (* (/ (+ (dist_of a b) (dist_of a c) (dist_of b c)) 2) (- (/ (+ (dist_of a b) (dist_of a c) (dist_of b c)) 2) (dist_of b c)) (- (/ (+ (dist_of a b) (dist_of a c) (dist_of b c)) 2) (dist_of a c)) (- (/ (+ (dist_of a b) (dist_of a c) (dist_of b c)) 2) (dist_of a b))) 2)))
  hard_negative:
    statement: 三角形の面積は$s(s-a)(s-b)(s-c)$に等しい。
    reason: 3辺が$3,4,5$の直角三角形では面積は$6$だが、$s(s-a)(s-b)(s-c)=36$である。平方根が必要である。
  target: |
    ∀ (A B C : EuclideanSpace ℝ (Fin 2)), (MeasureTheory.volume (convexHull ℝ ({A, B, C} : Set (EuclideanSpace ℝ (Fin 2))))).toReal = Real.sqrt (((dist A B + dist A C + dist B C) / 2) * ((dist A B + dist A C + dist B C) / 2 - dist B C) * ((dist A B + dist A C + dist B C) / 2 - dist A C) * ((dist A B + dist A C + dist B C) / 2 - dist A B))
  proof: |
    by
      intro A B C
      have hsinarea : ∀ A B C : EuclideanSpace ℝ (Fin 2), (MeasureTheory.volume (convexHull ℝ ({A, B, C} : Set (EuclideanSpace ℝ (Fin 2))))).toReal =
          1 / 2 * dist A B * dist A C * Real.sin (EuclideanGeometry.angle B A C) := by
        intro A B C
        let S : Set (ℝ × ℝ) := {p | 0 ≤ p.1 ∧ 0 ≤ p.2 ∧ p.1 + p.2 ≤ 1}
        have hSm : MeasurableSet S := by
          apply IsClosed.measurableSet
          exact (isClosed_le continuous_const continuous_fst).inter
            ((isClosed_le continuous_const continuous_snd).inter
              (isClosed_le (continuous_fst.add continuous_snd) continuous_const))
        have hSv : MeasureTheory.volume S = ENNReal.ofReal (1 / 2) := by
          rw [MeasureTheory.Measure.volume_eq_prod, MeasureTheory.Measure.prod_apply hSm]
          have hslice : ∀ x : ℝ, MeasureTheory.volume (Prod.mk x ⁻¹' S) =
