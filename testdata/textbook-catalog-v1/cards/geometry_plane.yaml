    by
      intro A B C D E F k hk h1 h2 h3
      have hsinarea : ∀ A B C : EuclideanSpace ℝ (Fin 2), (MeasureTheory.volume (convexHull ℝ ({A, B, C} : Set (EuclideanSpace ℝ (Fin 2))))).toReal =
          1 / 2 * dist A B * dist A C * Real.sin (EuclideanGeometry.angle B A C) := by
        intro A B C
        let S : Set (ℝ × ℝ) := {p | 0 ≤ p.1 ∧ 0 ≤ p.2 ∧ p.1 + p.2 ≤ 1}
        have hSm : MeasurableSet S := by
          apply IsClosed.measurableSet
          exact (isClosed_le continuous_const continuous_fst).inter
            ((isClosed_le continuous_const continuous_snd).inter
              (isClosed_le (continuous_fst.add continuous_snd) continuous_const))
        have hSv : MeasureTheory.volume S = ENNReal.ofReal (1 / 2) := by
          rw [MeasureTheory.Measure.volume_eq_prod, MeasureTheory.Measure.prod_apply hSm]
          have hslice : ∀ x : ℝ, MeasureTheory.volume (Prod.mk x ⁻¹' S) =
              (Set.Icc (0 : ℝ) 1).indicator (fun x => ENNReal.ofReal (1 - x)) x := by
            intro x
            by_cases hx : x ∈ Set.Icc (0 : ℝ) 1
            · rw [Set.indicator_of_mem hx]
              have : Prod.mk x ⁻¹' S = Set.Icc 0 (1 - x) := by
                ext y
                simp only [S, Set.mem_preimage, Set.mem_setOf_eq, Set.mem_Icc]
                constructor
                · rintro ⟨_, h2, h3⟩; exact ⟨h2, by linarith⟩
                · rintro ⟨h2, h3⟩; exact ⟨hx.1, h2, by linarith⟩
              rw [this, Real.volume_Icc, sub_zero]
            · rw [Set.indicator_of_notMem hx]
              have : Prod.mk x ⁻¹' S = ∅ := by
                ext y
                simp only [S, Set.mem_preimage, Set.mem_setOf_eq, Set.mem_empty_iff_false, iff_false]
                rintro ⟨h1, h2, h3⟩
                exact hx ⟨h1, by linarith⟩
              rw [this, MeasureTheory.measure_empty]
          simp_rw [hslice]
          rw [MeasureTheory.lintegral_indicator measurableSet_Icc]
          rw [← MeasureTheory.ofReal_integral_eq_lintegral_ofReal]
          · congr 1
            rw [MeasureTheory.integral_Icc_eq_integral_Ioc, ← intervalIntegral.integral_of_le zero_le_one,
              intervalIntegral.integral_sub intervalIntegrable_const (continuous_id'.intervalIntegrable _ _), integral_id]
            norm_num
          · exact (continuous_const.sub continuous_id).integrableOn_Icc
          · filter_upwards [MeasureTheory.ae_restrict_mem measurableSet_Icc] with x hx
            simpa using hx.2
        let T : Set (EuclideanSpace ℝ (Fin 2)) := {x | 0 ≤ x 0 ∧ 0 ≤ x 1 ∧ x 0 + x 1 ≤ 1}
        have hTv : MeasureTheory.volume T = ENNReal.ofReal (1 / 2) := by
          have mp := (MeasureTheory.volume_preserving_finTwoArrow ℝ).comp (PiLp.volume_preserving_ofLp (Fin 2))
          have := mp.measure_preimage hSm.nullMeasurableSet
          rw [hSv] at this
          exact this
        have hTc : Convex ℝ T := by
          intro x hx y hy a b ha hb hab
          simp only [T, Set.mem_setOf_eq, PiLp.add_apply, PiLp.smul_apply, smul_eq_mul] at hx hy ⊢
          obtain ⟨h1, h2, h3⟩ := hx
          obtain ⟨h4, h5, h6⟩ := hy
          refine ⟨by positivity, by positivity, ?_⟩
          nlinarith
        set u := B - A with hu
        set w := C - A with hw
        let L : EuclideanSpace ℝ (Fin 2) →ₗ[ℝ] EuclideanSpace ℝ (Fin 2) :=
          { toFun := fun x => x 0 • u + x 1 • w
            map_add' := by
              intro x y
              simp only [PiLp.add_apply, add_smul]
              abel
            map_smul' := by
              intro c x
              simp only [PiLp.smul_apply, smul_eq_mul, mul_smul, smul_add, RingHom.id_apply] }
        have hL : ∀ x, L x = x 0 • u + x 1 • w := fun _ => rfl
        have hdet : LinearMap.det L = u 0 * w 1 - u 1 * w 0 := by
          rw [← LinearMap.det_toMatrix (EuclideanSpace.basisFun (Fin 2) ℝ).toBasis L, Matrix.det_fin_two]
          simp [LinearMap.toMatrix_apply, hL]
          ring
        have hhull : convexHull ℝ ({A, B, C} : Set (EuclideanSpace ℝ (Fin 2))) = (fun y => y + A) '' (L '' T) := by
          apply Set.Subset.antisymm
          · apply convexHull_min
            · intro p hp
              simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hp
              rcases hp with rfl | rfl | rfl
              · exact ⟨0, ⟨0, by simp [T], by simp⟩, by simp⟩
              · refine ⟨u, ⟨EuclideanSpace.single 0 1, by simp [T], by simp [hL]⟩, by simp [hu]⟩
              · refine ⟨w, ⟨EuclideanSpace.single 1 1, by simp [T], by simp [hL]⟩, by simp [hw]⟩
            · have := (hTc.linear_image L).translate A
              convert this using 1
              ext y
              simp [add_comm]
          · rintro _ ⟨_, ⟨x, ⟨h1, h2, h3⟩, rfl⟩, rfl⟩
            have hc := convex_convexHull ℝ ({A, B, C} : Set (EuclideanSpace ℝ (Fin 2)))
            have := hc.sum_mem (t := Finset.univ) (w := ![1 - x 0 - x 1, x 0, x 1]) (z := ![A, B, C])
              (by intro i _; fin_cases i <;> simp <;> linarith) (by simp [Fin.sum_univ_three]; ring)
              (by
                intro i _
                apply subset_convexHull
                fin_cases i <;> simp)
            rw [Fin.sum_univ_three] at this
            convert this using 1
            simp [hL, hu, hw]
            module
        rw [hhull, Set.image_add_right, MeasureTheory.measure_preimage_add_right,
          MeasureTheory.Measure.addHaar_image_linearMap, hTv, hdet, ENNReal.toReal_mul, ENNReal.toReal_ofReal (abs_nonneg _),
          ENNReal.toReal_ofReal (by norm_num)]
        have hsin := InnerProductGeometry.sin_angle_mul_norm_mul_norm u w
        have inn : ∀ U W : EuclideanSpace ℝ (Fin 2), inner ℝ U W = U 0 * W 0 + U 1 * W 1 := by
          intro U W
          simp [PiLp.inner_apply, Fin.sum_univ_two]
          ring
        rw [inn, inn, inn,
          show (u 0 * u 0 + u 1 * u 1) * (w 0 * w 0 + w 1 * w 1) - (u 0 * w 0 + u 1 * w 1) * (u 0 * w 0 + u 1 * w 1) =
            (u 0 * w 1 - u 1 * w 0) ^ 2 by ring, Real.sqrt_sq_eq_abs] at hsin
        rw [← hsin, dist_comm A B, dist_comm A C, dist_eq_norm, dist_eq_norm, EuclideanGeometry.angle]
        simp only [vsub_eq_sub]
        ring
      have area : ∀ A B C : EuclideanSpace ℝ (Fin 2), (MeasureTheory.volume (convexHull ℝ ({A, B, C} : Set (EuclideanSpace ℝ (Fin 2))))).toReal =
          Real.sqrt (((dist A B + dist A C + dist B C) / 2) * ((dist A B + dist A C + dist B C) / 2 - dist B C) * ((dist A B + dist A C + dist B C) / 2 - dist A C) * ((dist A B + dist A C + dist B C) / 2 - dist A B)) := by
        intro A B C
        rw [hsinarea]
        have hcos := EuclideanGeometry.dist_sq_eq_dist_sq_add_dist_sq_sub_two_mul_dist_mul_dist_mul_cos_angle B A C
        rw [dist_comm B A, dist_comm C A] at hcos
        have hsin := Real.sin_sq_add_cos_sq (EuclideanGeometry.angle B A C)
        have hs0 : 0 ≤ Real.sin (EuclideanGeometry.angle B A C) := Real.sin_nonneg_of_nonneg_of_le_pi (EuclideanGeometry.angle_nonneg _ _ _) (EuclideanGeometry.angle_le_pi _ _ _)
        have hnn : 0 ≤ 1 / 2 * dist A B * dist A C * Real.sin (EuclideanGeometry.angle B A C) := by positivity
        rw [← Real.sqrt_sq hnn]
        congr 1
        set c := dist A B
        set b := dist A C
        set a := dist B C
        set θ := EuclideanGeometry.angle B A C
        have h1 : Real.sin θ ^ 2 = 1 - Real.cos θ ^ 2 := by linarith
        have h2 : 2 * c * b * Real.cos θ = c * c + b * b - a * a := by linarith
        have : (1 / 2 * c * b * Real.sin θ) ^ 2 = (1 / 4) * c ^ 2 * b ^ 2 - (1 / 16) * (2 * c * b * Real.cos θ) ^ 2 := by
          rw [mul_pow, h1]; ring
        rw [this, h2]
        ring
      rw [area D E F, area A B C, h1, h2, h3]
      generalize dist A B = c
      generalize dist A C = b
      generalize dist B C = a
      rw [show ((k * c + k * b + k * a) / 2) * ((k * c + k * b + k * a) / 2 - k * a) * ((k * c + k * b + k * a) / 2 - k * b) * ((k * c + k * b + k * a) / 2 - k * c) =
          (k ^ 2) ^ 2 * (((c + b + a) / 2) * ((c + b + a) / 2 - a) * ((c + b + a) / 2 - b) * ((c + b + a) / 2 - c)) by ring,
        Real.sqrt_mul (sq_nonneg _), Real.sqrt_sq (by positivity)]
- id: parallelogram_area
  kind: textbook
  level: high
  topic: 面積・平行四辺形
  statement: 平面$\mathbb{R}^2$の点$A,B,C,D$が$\overrightarrow{AB}=\overrightarrow{DC}$をみたすなら、4点の凸包として定めた平行四辺形の面積は$AB\cdot AD\sin\angle BAD$である（$A=B$または$A=D$のときは両辺とも$0$である）。
  statement_en: In the Euclidean plane, if AB = DC as vectors, then the area of the convex hull of {A, B, C, D} equals |AB||AD| sin ∠BAD.
  assumptions:
  - 面積は4点の凸包のルベーグ測度とする
  - $\overrightarrow{AB}=\overrightarrow{DC}$
  quantifiers:
  - 平面$\mathbb{R}^2$の任意の点$A,B,C,D$
  conclusion: 面積は$AB\cdot AD\sin\angle BAD$である。
  answer: |
    $A,B,C,D$を平面$\mathbb{R}^2$の点とし、$\overrightarrow{AB}=\overrightarrow{DC}$とする。$u=\overrightarrow{AB}$、$w=\overrightarrow{AD}$とおくと$C=A+u+w$である。

    単位正方形$T=[0,1]^2$の面積は$1$である。写像$L(x,y)=xu+yw$を考える。$L(T)+A$は$A,B,C,D$を含む凸集合なので、4点の凸包を含む。逆に$(x,y)\in T$の像は$(1-x)(1-y)A+x(1-y)B+xyC+(1-x)yD$と書ける。係数は$0$以上で和が$1$だから、この点は凸包に含まれる。よって凸包は$L(T)+A$に等しい。

    平行移動で面積は変わらず、線形写像は面積を行列式の絶対値倍するので、面積は$|u_1w_2-u_2w_1|$である。$(u_1w_2-u_2w_1)^2=|u|^2|w|^2-(u\cdot w)^2$と$\sin\angle BAD\geq0$より、これは$|u||w|\sin\angle BAD$に等しい。$u$または$w$が零ベクトルのときは両辺とも$0$である。したがって面積は$AB\cdot AD\sin\angle BAD$である。
  strategy: Realize the convex hull as an affine image of the unit square and identify the determinant with |u||w| sin θ.
  sketch:
  - 'setup: Put u = AB and w = AD, so C = A + u + w.'
  - 'construct: The affine map (x, y) to A + xu + yw carries the unit square onto the hull, using bilinear convex weights.'
  - 'apply_theorem: Area scales by the absolute determinant, and translation preserves it.'
  - 'conclude: The absolute determinant equals |u||w| sin ∠BAD.'
  openmath: (forall (a b c d) (-> (parallelogram a b c d) (= (quadrilateral_area a b c d) (* (dist_of a b) (dist_of a d) (sin (euclid_angle b a d))))))
  hard_negative:
    statement: 平行四辺形の面積は隣り合う2辺の長さの積$AB\cdot AD$である。
    reason: $A=(0,0)$、$B=(1,0)$、$D=(1,1)$、$C=(2,1)$では面積は$1$だが、$AB\cdot AD=\sqrt{2}$である。この積に等しいのは長方形のときである。
  target: |
    ∀ (A B C D : EuclideanSpace ℝ (Fin 2)), B -ᵥ A = C -ᵥ D → (MeasureTheory.volume (convexHull ℝ ({A, B, C, D} : Set (EuclideanSpace ℝ (Fin 2))))).toReal = dist A B * dist A D * Real.sin (EuclideanGeometry.angle B A D)
  proof: |
    by
      intro A B C D h
      have hC : C = B + D - A := by
        rw [vsub_eq_sub, vsub_eq_sub] at h
        calc C = (C - D) + D := by abel
          _ = (B - A) + D := by rw [h]
          _ = B + D - A := by abel
      subst hC
      let S : Set (ℝ × ℝ) := Set.Icc 0 1 ×ˢ Set.Icc 0 1
      have hSm : MeasurableSet S := measurableSet_Icc.prod measurableSet_Icc
      have hSv : MeasureTheory.volume S = 1 := by
        rw [MeasureTheory.Measure.volume_eq_prod, MeasureTheory.Measure.prod_prod, Real.volume_Icc]
        simp
      let T : Set (EuclideanSpace ℝ (Fin 2)) := {x | (0 ≤ x 0 ∧ x 0 ≤ 1) ∧ (0 ≤ x 1 ∧ x 1 ≤ 1)}
      have hTv : MeasureTheory.volume T = 1 := by
        have mp := (MeasureTheory.volume_preserving_finTwoArrow ℝ).comp (PiLp.volume_preserving_ofLp (Fin 2))
        have := mp.measure_preimage hSm.nullMeasurableSet
        rw [hSv] at this
        exact this
      have hTc : Convex ℝ T := by
        intro x hx y hy a b ha hb hab
        simp only [T, Set.mem_setOf_eq, PiLp.add_apply, PiLp.smul_apply, smul_eq_mul] at hx hy ⊢
        obtain ⟨⟨h1, h2⟩, h3, h4⟩ := hx
        obtain ⟨⟨h5, h6⟩, h7, h8⟩ := hy
        refine ⟨⟨by positivity, by nlinarith⟩, by positivity, by nlinarith⟩
      set u := B - A with hu
      set w := D - A with hw
      let L : EuclideanSpace ℝ (Fin 2) →ₗ[ℝ] EuclideanSpace ℝ (Fin 2) :=
        { toFun := fun x => x 0 • u + x 1 • w
          map_add' := by
            intro x y
            simp only [PiLp.add_apply, add_smul]
            abel
          map_smul' := by
            intro c x
            simp only [PiLp.smul_apply, smul_eq_mul, mul_smul, smul_add, RingHom.id_apply] }
      have hL : ∀ x, L x = x 0 • u + x 1 • w := fun _ => rfl
      have hdet : LinearMap.det L = u 0 * w 1 - u 1 * w 0 := by
        rw [← LinearMap.det_toMatrix (EuclideanSpace.basisFun (Fin 2) ℝ).toBasis L, Matrix.det_fin_two]
        simp [LinearMap.toMatrix_apply, hL]
        ring
      have hhull : convexHull ℝ ({A, B, B + D - A, D} : Set (EuclideanSpace ℝ (Fin 2))) = (fun y => y + A) '' (L '' T) := by
        apply Set.Subset.antisymm
        · apply convexHull_min
          · intro p hp
            simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hp
            rcases hp with rfl | rfl | rfl | rfl
            · exact ⟨0, ⟨0, by simp [T], by simp⟩, by simp⟩
            · refine ⟨u, ⟨EuclideanSpace.single 0 1, by simp [T], by simp [hL]⟩, by simp [hu]⟩
            · refine ⟨u + w, ⟨!₂[1, 1], by simp [T], by simp [hL]⟩, ?_⟩
              simp only [hu, hw]
              abel
            · refine ⟨w, ⟨EuclideanSpace.single 1 1, by simp [T], by simp [hL]⟩, by simp [hw]⟩
          · have := (hTc.linear_image L).translate A
            convert this using 1
            ext y
            simp [add_comm]
        · rintro _ ⟨_, ⟨x, ⟨⟨h1, h2⟩, h3, h4⟩, rfl⟩, rfl⟩
          have hc := convex_convexHull ℝ ({A, B, B + D - A, D} : Set (EuclideanSpace ℝ (Fin 2)))
          have := hc.sum_mem (t := Finset.univ) (w := ![(1 - x 0) * (1 - x 1), x 0 * (1 - x 1), x 0 * x 1, (1 - x 0) * x 1])
            (z := ![A, B, B + D - A, D])
            (by
              intro i _
              fin_cases i <;> simp <;> apply mul_nonneg <;> linarith)
            (by simp [Fin.sum_univ_four]; ring)
            (by
              intro i _
              apply subset_convexHull
              fin_cases i <;> simp)
          rw [Fin.sum_univ_four] at this
          convert this using 1
          simp [hL, hu, hw]
          module
      rw [hhull, Set.image_add_right, MeasureTheory.measure_preimage_add_right,
        MeasureTheory.Measure.addHaar_image_linearMap, hTv, hdet, ENNReal.toReal_mul, ENNReal.toReal_ofReal (abs_nonneg _)]
      have hsin := InnerProductGeometry.sin_angle_mul_norm_mul_norm u w
      have inn : ∀ U W : EuclideanSpace ℝ (Fin 2), inner ℝ U W = U 0 * W 0 + U 1 * W 1 := by
        intro U W
        simp [PiLp.inner_apply, Fin.sum_univ_two]
        ring
      rw [inn, inn, inn,
        show (u 0 * u 0 + u 1 * u 1) * (w 0 * w 0 + w 1 * w 1) - (u 0 * w 0 + u 1 * w 1) * (u 0 * w 0 + u 1 * w 1) =
          (u 0 * w 1 - u 1 * w 0) ^ 2 by ring, Real.sqrt_sq_eq_abs] at hsin
      rw [← hsin, dist_comm A B, dist_comm A D, dist_eq_norm, dist_eq_norm, EuclideanGeometry.angle]
      simp only [vsub_eq_sub, ENNReal.toReal_one]
      ring
- id: three_perpendiculars
  kind: named
  level: high
  topic: 空間図形・三垂線の定理
  statement: （三垂線の定理）平面$\alpha$上に点$H,B,C$があり$B\neq C$とする。$\overrightarrow{HA}$が$\alpha$に垂直で、$HB\perp BC$なら、$AB\perp BC$である。
  statement_en: (Theorem of three perpendiculars) If H, B, C lie in an affine subspace α with B ≠ C, HA is orthogonal to the direction of α, and HB is orthogonal to BC, then AB is orthogonal to BC.
  assumptions:
  - $H,B,C$は平面$\alpha$（一般にアフィン部分空間でよい）上にある
  - $B\neq C$
  - $\overrightarrow{HA}$は$\alpha$上のすべてのベクトルに垂直である
  - $\overrightarrow{BH}\cdot\overrightarrow{BC}=0$
  quantifiers:
  - ユークリッド空間の任意の点$A,H,B,C$と平面$\alpha$
  conclusion: $\overrightarrow{BA}\cdot\overrightarrow{BC}=0$である。
  answer: |
    ユークリッド空間の平面$\alpha$と点$A,H,B,C$をとり、$H,B,C$は$\alpha$上にあり、$B\neq C$で、$\overrightarrow{HA}$は$\alpha$上のすべてのベクトルに垂直であり、$\overrightarrow{BH}\cdot\overrightarrow{BC}=0$とする。

    $\overrightarrow{BA}=\overrightarrow{BH}+\overrightarrow{HA}$であるから、$\overrightarrow{BA}\cdot\overrightarrow{BC}=\overrightarrow{BH}\cdot\overrightarrow{BC}+\overrightarrow{HA}\cdot\overrightarrow{BC}$である。第1項は仮定より$0$である。$B,C$は$\alpha$上にあるので$\overrightarrow{BC}$は$\alpha$上のベクトルであり、第2項も$0$である。よって$AB\perp BC$である。
  strategy: Decompose BA through H and use the two perpendicularity hypotheses.
  sketch:
  - 'translate: BA = BH + HA.'
  - 'derive: BH·BC = 0 by hypothesis, and HA·BC = 0 since BC lies in α.'
  - 'conclude: Hence BA·BC = 0.'
  openmath: (forall (s a h b c) (-> (and (in_affine_subspace h s) (in_affine_subspace b s) (in_affine_subspace c s) (!= b c) (perpendicular_to_subspace a h s) (perpendicular_lines h b b c)) (perpendicular_lines a b b c)))
  hard_negative:
    statement: $\overrightarrow{HA}$が平面$\alpha$に垂直でなくても、$HB\perp BC$なら$AB\perp BC$である。
    reason: $\alpha$を$xy$平面とし、$H=(0,0,0)$、$B=(1,0,0)$、$C=(1,1,0)$、$A=(0,5,1)$とすると$HB\perp BC$だが、$\overrightarrow{BA}\cdot\overrightarrow{BC}=5$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (α : AffineSubspace ℝ P) (A H B C : P), H ∈ α → B ∈ α → C ∈ α → B ≠ C → (∀ w ∈ α.direction, inner ℝ (A -ᵥ H) w = 0) → inner ℝ (H -ᵥ B) (C -ᵥ B) = 0 → inner ℝ (A -ᵥ B) (C -ᵥ B) = 0
  proof: |
    by
      intro V P _ _ _ _ α A H B C _ hB hC _ hperp h
      rw [← vsub_add_vsub_cancel A H B, inner_add_left, h, add_zero]
      exact hperp _ (AffineSubspace.vsub_mem_direction hC hB)
- id: three_perpendiculars_converse_foot
  kind: gap
  level: high
  topic: 空間図形・三垂線の定理の逆（足）
  statement: 平面$\alpha$上に点$H,B,C$があり$B\neq C$とする。$\overrightarrow{HA}$が$\alpha$に垂直で、$AB\perp BC$なら、$HB\perp BC$である。
  statement_en: If H, B, C lie in an affine subspace α with B ≠ C, HA is orthogonal to the direction of α, and AB is orthogonal to BC, then HB is orthogonal to BC.
  assumptions:
  - $H,B,C$は平面$\alpha$（一般にアフィン部分空間でよい）上にある
  - $B\neq C$
  - $\overrightarrow{HA}$は$\alpha$上のすべてのベクトルに垂直である
  - $\overrightarrow{BA}\cdot\overrightarrow{BC}=0$
  quantifiers:
  - ユークリッド空間の任意の点$A,H,B,C$と平面$\alpha$
  conclusion: $\overrightarrow{BH}\cdot\overrightarrow{BC}=0$である。
  answer: |
    ユークリッド空間の平面$\alpha$と点$A,H,B,C$をとり、$H,B,C$は$\alpha$上にあり、$B\neq C$で、$\overrightarrow{HA}$は$\alpha$上のすべてのベクトルに垂直であり、$\overrightarrow{BA}\cdot\overrightarrow{BC}=0$とする。

    $\overrightarrow{BA}=\overrightarrow{BH}+\overrightarrow{HA}$であり、$\overrightarrow{BC}$は$\alpha$上のベクトルだから$\overrightarrow{HA}\cdot\overrightarrow{BC}=0$である。よって$\overrightarrow{BH}\cdot\overrightarrow{BC}=\overrightarrow{BA}\cdot\overrightarrow{BC}-\overrightarrow{HA}\cdot\overrightarrow{BC}=0$である。
  strategy: Decompose BA through H and subtract the vanishing component along HA.
  sketch:
  - 'translate: BA = BH + HA.'
  - 'derive: HA·BC = 0 since BC lies in α.'
  - 'conclude: BH·BC = BA·BC - HA·BC = 0.'
  openmath: (forall (s a h b c) (-> (and (in_affine_subspace h s) (in_affine_subspace b s) (in_affine_subspace c s) (!= b c) (perpendicular_to_subspace a h s) (perpendicular_lines a b b c)) (perpendicular_lines h b b c)))
  hard_negative:
    statement: $H$が平面$\alpha$上の任意の点でも、$AB\perp BC$なら$HB\perp BC$である。
    reason: $\alpha$を$xy$平面とし、$A=(1,0,1)$、$B=(1,0,0)$、$C=(1,1,0)$、$H=(0,1,0)$とすると$AB\perp BC$だが、$\overrightarrow{BH}\cdot\overrightarrow{BC}=1$である。$H$は垂線の足でなければならない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (α : AffineSubspace ℝ P) (A H B C : P), H ∈ α → B ∈ α → C ∈ α → B ≠ C → (∀ w ∈ α.direction, inner ℝ (A -ᵥ H) w = 0) → inner ℝ (A -ᵥ B) (C -ᵥ B) = 0 → inner ℝ (H -ᵥ B) (C -ᵥ B) = 0
  proof: |
    by
      intro V P _ _ _ _ α A H B C _ hB hC _ hperp h
      rw [← vsub_add_vsub_cancel A H B, inner_add_left, hperp _ (AffineSubspace.vsub_mem_direction hC hB), zero_add] at h
      exact h
- id: three_perpendiculars_converse_plane
  kind: gap
  level: high
  topic: 空間図形・三垂線の定理の逆（平面への垂直）
  statement: 点$H,B,C$が同一直線上になく、$AB\perp BC$、$HB\perp BC$、$AH\perp HB$なら、直線$AH$は平面$HBC$に垂直である。
  statement_en: If H, B, C are not collinear, AB is orthogonal to BC, HB is orthogonal to BC and AH is orthogonal to HB, then AH is orthogonal to the plane through H, B, C.
  assumptions:
  - $H,B,C$は同一直線上にない
  - $\overrightarrow{BA}\cdot\overrightarrow{BC}=0$
  - $\overrightarrow{BH}\cdot\overrightarrow{BC}=0$
  - $\overrightarrow{HA}\cdot\overrightarrow{BH}=0$
  quantifiers:
  - ユークリッド空間の任意の点$A,H,B,C$
  conclusion: $\overrightarrow{HA}$は平面$HBC$上のすべてのベクトルに垂直である。
  answer: |
    $A,H,B,C$をユークリッド空間の点とし、$H,B,C$は同一直線上になく、$\overrightarrow{BA}\cdot\overrightarrow{BC}=0$、$\overrightarrow{BH}\cdot\overrightarrow{BC}=0$、$\overrightarrow{HA}\cdot\overrightarrow{BH}=0$とする。

    平面$HBC$上のベクトルは$\overrightarrow{BH}$と$\overrightarrow{BC}$の線形結合だから、$\overrightarrow{HA}$がこの2つに垂直であることを示せばよい。$\overrightarrow{BH}$については仮定である。$\overrightarrow{HA}=\overrightarrow{BA}-\overrightarrow{BH}$なので、$\overrightarrow{HA}\cdot\overrightarrow{BC}=\overrightarrow{BA}\cdot\overrightarrow{BC}-\overrightarrow{BH}\cdot\overrightarrow{BC}=0$である。よって$\overrightarrow{HA}$は平面$HBC$上のすべてのベクトルに垂直である。
  strategy: Check orthogonality against the two spanning vectors BH and BC of the plane.
  sketch:
  - 'translate: Vectors in the plane are combinations of BH and BC.'
  - 'derive: HA·BH = 0 by hypothesis.'
  - 'derive: HA·BC = BA·BC - BH·BC = 0.'
  - 'conclude: Linearity gives orthogonality to the whole plane.'
  openmath: (forall (a h b c) (-> (and (not (collinear_points h b c)) (perpendicular_lines a b b c) (perpendicular_lines h b b c) (perpendicular_lines a h h b)) (perpendicular_to_plane a h h b c)))
  hard_negative:
    statement: 条件$AH\perp HB$がなくても、$AB\perp BC$、$HB\perp BC$なら$AH$は平面$HBC$に垂直である。
    reason: $H=(0,0,0)$、$B=(1,0,0)$、$C=(1,1,0)$、$A=(1,0,1)$では2つの垂直はみたすが、$\overrightarrow{HA}\cdot\overrightarrow{HB}=1$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A H B C : P), ¬Collinear ℝ ({H, B, C} : Set P) → inner ℝ (A -ᵥ B) (C -ᵥ B) = 0 → inner ℝ (H -ᵥ B) (C -ᵥ B) = 0 → inner ℝ (A -ᵥ H) (H -ᵥ B) = 0 → ∀ w ∈ (affineSpan ℝ ({H, B, C} : Set P)).direction, inner ℝ (A -ᵥ H) w = 0
  proof: |
    by
      intro V P _ _ _ _ A H B C _ h1 h2 h3 w hw
      rw [direction_affineSpan, vectorSpan_eq_span_vsub_set_right ℝ (show B ∈ ({H, B, C} : Set P) by simp)] at hw
      induction hw using Submodule.span_induction with
      | mem x hx =>
        obtain ⟨y, hy, rfl⟩ := hx
        simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hy
        rcases hy with rfl | rfl | rfl
        · exact h3
        · simp
        · change inner ℝ (A -ᵥ H) (y -ᵥ B) = 0
          have : A -ᵥ H = (A -ᵥ B) - (H -ᵥ B) := (vsub_sub_vsub_cancel_right A H B).symm
          rw [this, inner_sub_left, h1, h2, sub_zero]
      | zero => simp
      | add x y _ _ hx hy => rw [inner_add_right, hx, hy, add_zero]
      | smul a x _ hx => rw [real_inner_smul_right, hx, mul_zero]
- id: line_perpendicular_plane_criterion
  kind: textbook
  level: high
  topic: 空間図形・直線と平面の垂直
  statement: 点$O,B,C$が同一直線上になく、直線$AO$が平面$OBC$上の交わる2直線$OB$、$OC$に垂直なら、直線$AO$は平面$OBC$上の任意の2点$X,Y$を通る方向に垂直である。
  statement_en: If O, B, C are not collinear and AO is orthogonal to OB and OC, then AO is orthogonal to XY for all points X, Y of the plane through O, B, C.
  assumptions:
  - $O,B,C$は同一直線上にない
  - $\overrightarrow{OA}\cdot\overrightarrow{OB}=0$
  - $\overrightarrow{OA}\cdot\overrightarrow{OC}=0$
  - $X,Y$は平面$OBC$上の点である
  quantifiers:
  - ユークリッド空間の任意の点$A,O,B,C,X,Y$
  conclusion: $\overrightarrow{OA}\cdot\overrightarrow{XY}=0$である。
  answer: |
    $A,O,B,C,X,Y$をユークリッド空間の点とし、$O,B,C$は同一直線上になく、$\overrightarrow{OA}\cdot\overrightarrow{OB}=0$、$\overrightarrow{OA}\cdot\overrightarrow{OC}=0$であり、$X,Y$は平面$OBC$上にあるとする。

    $X,Y$は平面$OBC$上にあるので、$\overrightarrow{XY}$はこの平面上のベクトルであり、実数$r,t$により$\overrightarrow{XY}=r\overrightarrow{OB}+t\overrightarrow{OC}$と書ける。よって$\overrightarrow{OA}\cdot\overrightarrow{XY}=r\,\overrightarrow{OA}\cdot\overrightarrow{OB}+t\,\overrightarrow{OA}\cdot\overrightarrow{OC}=0$である。
  strategy: Write XY as a combination of OB and OC and use linearity of the inner product.
  sketch:
  - 'translate: XY lies in the direction of the plane, spanned by OB and OC.'
  - 'derive: XY = r OB + t OC.'
  - 'conclude: Linearity gives OA·XY = 0.'
  openmath: (forall (a o b c x y) (-> (and (not (collinear_points o b c)) (perpendicular_lines a o o b) (perpendicular_lines a o o c) (on_plane x o b c) (on_plane y o b c)) (perpendicular_lines a o x y)))
  hard_negative:
    statement: 直線$AO$が平面上の1本の直線$OB$に垂直なら、$AO$は平面に垂直である。
    reason: $O=(0,0,0)$、$B=(0,1,0)$、$C=(1,0,0)$、$A=(1,0,1)$では$AO\perp OB$だが、$\overrightarrow{OA}\cdot\overrightarrow{OC}=1$である。交わる2直線に垂直であることが要る。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A O B C X Y : P), ¬Collinear ℝ ({O, B, C} : Set P) → inner ℝ (A -ᵥ O) (B -ᵥ O) = 0 → inner ℝ (A -ᵥ O) (C -ᵥ O) = 0 → X ∈ affineSpan ℝ ({O, B, C} : Set P) → Y ∈ affineSpan ℝ ({O, B, C} : Set P) → inner ℝ (A -ᵥ O) (Y -ᵥ X) = 0
  proof: |
    by
      intro V P _ _ _ _ A O B C X Y _ h1 h2 hX hY
      have key : ∀ w ∈ (affineSpan ℝ ({O, B, C} : Set P)).direction, inner ℝ (A -ᵥ O) w = 0 := by
        intro w hw
        rw [direction_affineSpan, vectorSpan_eq_span_vsub_set_right ℝ (show O ∈ ({O, B, C} : Set P) by simp)] at hw
        induction hw using Submodule.span_induction with
        | mem x hx =>
          obtain ⟨y, hy, rfl⟩ := hx
          simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hy
          rcases hy with rfl | rfl | rfl
          · simp
          · exact h1
          · exact h2
        | zero => simp
        | add x y _ _ hx hy => rw [inner_add_right, hx, hy, add_zero]
        | smul a x _ hx => rw [real_inner_smul_right, hx, mul_zero]
      exact key _ (AffineSubspace.vsub_mem_direction hY hX)
- id: lines_perpendicular_to_plane_parallel
  kind: textbook
  level: high
  topic: 空間図形・同じ平面に垂直な2直線
  statement: 3次元ユークリッド空間で$A\neq B$、$C\neq D$、$X,Y,Z$が同一直線上になく、直線$AB$と直線$CD$がともに平面$XYZ$に垂直なら、直線$AB$と直線$CD$は平行である（一致する場合を含む）。
  statement_en: In 3-dimensional Euclidean space, if A ≠ B, C ≠ D, X, Y, Z are not collinear and AB and CD are both orthogonal to XY and XZ, then line AB is parallel to line CD, coincidence allowed.
  assumptions:
  - 3次元のユークリッド空間で考える
  - $A\neq B$、$C\neq D$
  - $X,Y,Z$は同一直線上にない
  - $\overrightarrow{AB}$と$\overrightarrow{CD}$はともに$\overrightarrow{XY}$と$\overrightarrow{XZ}$に垂直である
  quantifiers:
  - 3次元ユークリッド空間の任意の点$A,B,C,D,X,Y,Z$
  conclusion: 直線$AB$と直線$CD$は平行である（一致を含む）。
  answer: |
    $A,B,C,D,X,Y,Z$を3次元ユークリッド空間の点とし、$A\neq B$、$C\neq D$、$X,Y,Z$は同一直線上になく、$\overrightarrow{AB}$と$\overrightarrow{CD}$はともに$\overrightarrow{XY}$と$\overrightarrow{XZ}$に垂直とする。

    $X,Y,Z$が同一直線上にないので、$\overrightarrow{XY},\overrightarrow{XZ}$が張る部分空間$W$の次元は$2$である。全体の次元が$3$だから、$W$の直交補空間の次元は$1$である。$\overrightarrow{AB}$と$\overrightarrow{CD}$は$W$の生成元に垂直なので、この直交補空間に属する。$\overrightarrow{AB}\neq\vec{0}$だから、実数$c$により$\overrightarrow{CD}=c\overrightarrow{AB}$と書ける。$\overrightarrow{CD}\neq\vec{0}$より$c\neq0$である。よって2直線の方向は一致し、平行である。
  strategy: The orthogonal complement of the plane direction in dimension 3 is one-dimensional and contains both direction vectors.
  sketch:
  - 'derive: The plane direction W has dimension 2 since X, Y, Z are not collinear.'
  - 'derive: Its orthogonal complement has dimension 1 and contains AB and CD.'
  - 'derive: Hence CD = c AB, with c ≠ 0 because CD ≠ 0.'
  - 'conclude: The lines have the same direction, so they are parallel.'
  openmath: (forall (a b c d x y z) (-> (and (!= a b) (!= c d) (not (collinear_points x y z)) (perpendicular_lines a b x y) (perpendicular_lines a b x z) (perpendicular_lines c d x y) (perpendicular_lines c d x z)) (parallel_lines a b c d)))
  hard_negative:
    statement: 4次元空間でも、同じ平面に垂直な2直線は平行である。
    reason: $\mathbb{R}^4$の第1、第2座標軸が張る平面に対し、第3座標軸と第4座標軸はともに垂直だが平行でない。次元が$3$という仮定が要る。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] [Fact (Module.finrank ℝ V = 3)] (A B C D X Y Z : P), A ≠ B → C ≠ D → ¬Collinear ℝ ({X, Y, Z} : Set P) → inner ℝ (B -ᵥ A) (Y -ᵥ X) = 0 → inner ℝ (B -ᵥ A) (Z -ᵥ X) = 0 → inner ℝ (D -ᵥ C) (Y -ᵥ X) = 0 → inner ℝ (D -ᵥ C) (Z -ᵥ X) = 0 → (line[ℝ, A, B]).Parallel line[ℝ, C, D]
  proof: |
    by
      intro V P _ _ _ _ _ A B C D X Y Z hAB hCD hXYZ h1 h2 h3 h4
      haveI : FiniteDimensional ℝ V := Module.finite_of_finrank_pos (by rw [Fact.out (p := Module.finrank ℝ V = 3)]; norm_num)
      set W : Submodule ℝ V := vectorSpan ℝ ({X, Y, Z} : Set P) with hW
      have hind : AffineIndependent ℝ ![X, Y, Z] := affineIndependent_iff_not_collinear_set.mpr hXYZ
      have hfr : Module.finrank ℝ W = 2 := by
        have := hind.finrank_vectorSpan (n := 2) (by simp)
        rwa [Matrix.range_cons, Matrix.range_cons, Matrix.range_cons, Matrix.range_empty, Set.union_empty, Set.singleton_union, Set.singleton_union] at this
      have hsum := Submodule.finrank_add_finrank_orthogonal W
      have hfr2 : Module.finrank ℝ Wᗮ = 1 := by
        rw [hfr, Fact.out (p := Module.finrank ℝ V = 3)] at hsum
        omega
      have mem : ∀ v : V, inner ℝ v (Y -ᵥ X) = 0 → inner ℝ v (Z -ᵥ X) = 0 → v ∈ Wᗮ := by
        intro v h5 h6
        rw [Submodule.mem_orthogonal']
        intro w hw
        rw [hW, vectorSpan_eq_span_vsub_set_right ℝ (show X ∈ ({X, Y, Z} : Set P) by simp)] at hw
        induction hw using Submodule.span_induction with
        | mem x hx =>
          obtain ⟨y, hy, rfl⟩ := hx
          simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hy
          rcases hy with rfl | rfl | rfl
          · simp
          · exact h5
          · exact h6
        | zero => simp
        | add x y _ _ hx hy => rw [inner_add_right, hx, hy, add_zero]
        | smul a x _ hx => rw [real_inner_smul_right, hx, mul_zero]
      have hu0 : (⟨B -ᵥ A, mem _ h1 h2⟩ : Wᗮ) ≠ 0 := by
        intro h; exact hAB (vsub_eq_zero_iff_eq.mp (congrArg Subtype.val h)).symm
      obtain ⟨c, hc⟩ := (finrank_eq_one_iff_of_nonzero' _ hu0).mp hfr2 ⟨D -ᵥ C, mem _ h3 h4⟩
      have hc' : c • (B -ᵥ A) = D -ᵥ C := congrArg Subtype.val hc
      have hc0 : c ≠ 0 := by
        rintro rfl
        rw [zero_smul] at hc'
        exact hCD (vsub_eq_zero_iff_eq.mp hc'.symm).symm
      rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev, ← hc']
      exact (Submodule.span_singleton_smul_eq (IsUnit.mk0 _ hc0) _).symm
- id: foot_of_perpendicular_shortest
  kind: gap
  level: high
  topic: 空間図形・垂線の足と最短距離
  statement: 平面$\alpha$上の点$H,X$について、$\overrightarrow{HA}$が$\alpha$に垂直なら、$AX^2=AH^2+HX^2$であり、$AH\leq AX$である。
  statement_en: If H and X lie in an affine subspace α and HA is orthogonal to the direction of α, then |AX|² = |AH|² + |HX|² and |AH| ≤ |AX|.
  assumptions:
  - $H,X$は平面$\alpha$（一般にアフィン部分空間でよい）上にある
  - $\overrightarrow{HA}$は$\alpha$上のすべてのベクトルに垂直である
  quantifiers:
  - ユークリッド空間の任意の点$A,H,X$と平面$\alpha$
  conclusion: $AX^2=AH^2+HX^2$かつ$AH\leq AX$である。
  answer: |
    ユークリッド空間の平面$\alpha$と点$A,H,X$をとり、$H,X$は$\alpha$上にあり、$\overrightarrow{HA}$は$\alpha$上のすべてのベクトルに垂直とする。

    $\overrightarrow{XA}=\overrightarrow{XH}+\overrightarrow{HA}$であり、$\overrightarrow{XH}$は$\alpha$上のベクトルだから$\overrightarrow{XH}\cdot\overrightarrow{HA}=0$である。よって$|\overrightarrow{XA}|^2=|\overrightarrow{XH}|^2+|\overrightarrow{HA}|^2$、つまり$AX^2=AH^2+HX^2$である。$HX^2\geq0$より$AH^2\leq AX^2$であり、長さは$0$以上なので$AH\leq AX$である。
  strategy: Expand |XH + HA|² with the orthogonality of XH and HA.
  sketch:
  - 'translate: XA = XH + HA with XH in α.'
  - 'derive: Orthogonality gives the Pythagorean identity.'
  - 'conclude: Since |HX|² ≥ 0, we get |AH| ≤ |AX|.'
  openmath: (forall (s a h x) (-> (and (in_affine_subspace h s) (in_affine_subspace x s) (perpendicular_to_subspace a h s)) (and (= (^ (dist_of a x) 2) (+ (^ (dist_of a h) 2) (^ (dist_of h x) 2))) (<= (dist_of a h) (dist_of a x)))))
  hard_negative:
    statement: $H$が平面$\alpha$上の任意の点でも、$\alpha$上の任意の$X$について$AH\leq AX$である。
    reason: $\alpha$を$xy$平面、$A=(0,0,1)$、$H=(1,0,0)$、$X=(0,0,0)$とすると$AH=\sqrt{2}$、$AX=1$である。最短になるのは垂線の足だけである。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (α : AffineSubspace ℝ P) (A H X : P), H ∈ α → X ∈ α → (∀ w ∈ α.direction, inner ℝ (A -ᵥ H) w = 0) → dist A X ^ 2 = dist A H ^ 2 + dist H X ^ 2 ∧ dist A H ≤ dist A X
  proof: |
    by
      intro V P _ _ _ _ α A H X hH hX hperp
      have h0 : inner ℝ (A -ᵥ H) (H -ᵥ X) = 0 := hperp _ (AffineSubspace.vsub_mem_direction hH hX)
      have h1 : dist A X ^ 2 = dist A H ^ 2 + dist H X ^ 2 := by
        rw [dist_eq_norm_vsub V A X, dist_eq_norm_vsub V A H, dist_eq_norm_vsub V H X, ← vsub_add_vsub_cancel A H X,
          norm_add_sq_real, h0]
        ring
      refine ⟨h1, ?_⟩
      exact abs_le_of_sq_le_sq' (by nlinarith [sq_nonneg (dist H X)]) dist_nonneg |>.2
- id: slant_equal_iff_foot_equal
  kind: gap
  level: high
  topic: 四面体・頂点から底面への垂線の足
  statement: 平面$\alpha$上に点$H,B,C,D$があり、$\overrightarrow{HA}$が$\alpha$に垂直なら、$AB=AC=AD$であることと$HB=HC=HD$であることは同値である。特に、四面体$ABCD$で$AB=AC=AD$なら、$A$から底面への垂線の足は$B,C,D$から等距離にある。
  statement_en: If H, B, C, D lie in an affine subspace α and HA is orthogonal to the direction of α, then |AB| = |AC| = |AD| if and only if |HB| = |HC| = |HD|.
  assumptions:
  - $H,B,C,D$は平面$\alpha$（一般にアフィン部分空間でよい）上にある
  - $\overrightarrow{HA}$は$\alpha$上のすべてのベクトルに垂直である
  quantifiers:
  - ユークリッド空間の任意の点$A,H,B,C,D$と平面$\alpha$
  conclusion: $AB=AC=AD$と$HB=HC=HD$は同値である。
  answer: |
    ユークリッド空間の平面$\alpha$と点$A,H,B,C,D$をとり、$H,B,C,D$は$\alpha$上にあり、$\overrightarrow{HA}$は$\alpha$上のすべてのベクトルに垂直とする。

    $\alpha$上の任意の点$X$について、$\overrightarrow{XH}$は$\alpha$上のベクトルだから$\overrightarrow{XH}\cdot\overrightarrow{HA}=0$であり、$\overrightarrow{XA}=\overrightarrow{XH}+\overrightarrow{HA}$より$AX^2=AH^2+HX^2$である。

    したがって$\alpha$上の2点$X,Y$について、$AX^2=AY^2$と$HX^2=HY^2$は同値である。長さは$0$以上なので、$AX=AY$と$HX=HY$は同値である。これを$(X,Y)=(B,C)$と$(C,D)$に使えば結論を得る。
  strategy: The Pythagorean identity AX² = AH² + HX² transfers equalities of distances between A and H.
  sketch:
  - 'derive: For X in α, |AX|² = |AH|² + |HX|².'
  - 'derive: Hence |AX| = |AY| if and only if |HX| = |HY|, for X, Y in α.'
  - 'conclude: Apply this to the pairs (B, C) and (C, D).'
  openmath: (forall (s a h b c d) (-> (and (in_affine_subspace h s) (in_affine_subspace b s) (in_affine_subspace c s) (in_affine_subspace d s) (perpendicular_to_subspace a h s)) (<-> (and (= (dist_of a b) (dist_of a c)) (= (dist_of a c) (dist_of a d))) (and (= (dist_of h b) (dist_of h c)) (= (dist_of h c) (dist_of h d))))))
  hard_negative:
    statement: $H$が垂線の足でなくても、$AB=AC=AD$なら$HB=HC=HD$である。
    reason: $\alpha$を$xy$平面、$A=(0,0,1)$、$B=(1,0,0)$、$C=(-1,0,0)$、$D=(0,1,0)$、$H=(\frac{1}{2},0,0)$とすると$AB=AC=AD$だが、$HB=\frac{1}{2}$、$HC=\frac{3}{2}$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (α : AffineSubspace ℝ P) (A H B C D : P), H ∈ α → B ∈ α → C ∈ α → D ∈ α → (∀ w ∈ α.direction, inner ℝ (A -ᵥ H) w = 0) → ((dist A B = dist A C ∧ dist A C = dist A D) ↔ (dist H B = dist H C ∧ dist H C = dist H D))
  proof: |
    by
      intro V P _ _ _ _ α A H B C D hH hB hC hD hperp
      have py : ∀ X, X ∈ α → dist A X ^ 2 = dist A H ^ 2 + dist H X ^ 2 := by
        intro X hX
        have h0 : inner ℝ (A -ᵥ H) (H -ᵥ X) = 0 := hperp _ (AffineSubspace.vsub_mem_direction hH hX)
        rw [dist_eq_norm_vsub V A X, dist_eq_norm_vsub V A H, dist_eq_norm_vsub V H X, ← vsub_add_vsub_cancel A H X,
          norm_add_sq_real, h0]
        ring
      have eq : ∀ X Y, X ∈ α → Y ∈ α → (dist A X = dist A Y ↔ dist H X = dist H Y) := by
        intro X Y hX hY
        rw [← sq_eq_sq₀ (dist_nonneg (x := A) (y := X)) dist_nonneg, ← sq_eq_sq₀ (dist_nonneg (x := H) (y := X)) dist_nonneg, py X hX, py Y hY]
        constructor <;> intro h <;> linarith
      rw [eq B C hB hC, eq C D hC hD]
- id: tetrahedron_opposite_edges_perpendicular_iff
  kind: gap
  level: high
  topic: 四面体・対辺の垂直
  statement: ユークリッド空間の4点$A,B,C,D$について、対辺$AB$と$CD$が垂直であること（$\overrightarrow{AB}\cdot\overrightarrow{CD}=0$）は、$AC^2+BD^2=AD^2+BC^2$と同値である。
  statement_en: For points A, B, C, D, AB · CD = 0 if and only if |AC|² + |BD|² = |AD|² + |BC|².
  assumptions:
  - $A,B,C,D$はユークリッド空間の点である
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: $\overrightarrow{AB}\cdot\overrightarrow{CD}=0$と$AC^2+BD^2=AD^2+BC^2$は同値である。
  answer: |
    $A,B,C,D$をユークリッド空間の点とする。$u=\overrightarrow{AB}$、$w=\overrightarrow{AC}$、$v=\overrightarrow{AD}$とおく。$\overrightarrow{CD}=v-w$、$\overrightarrow{BC}=w-u$、$\overrightarrow{BD}=v-u$である。

    展開すると、$AC^2+BD^2=|w|^2+|v|^2-2u\cdot v+|u|^2$、$AD^2+BC^2=|v|^2+|w|^2-2u\cdot w+|u|^2$である。差は$(AC^2+BD^2)-(AD^2+BC^2)=-2u\cdot v+2u\cdot w=-2\,u\cdot(v-w)=-2\overrightarrow{AB}\cdot\overrightarrow{CD}$である。

    よって$\overrightarrow{AB}\cdot\overrightarrow{CD}=0$と$AC^2+BD^2=AD^2+BC^2$は同値である。
  strategy: Expand the four squared distances from A and observe the difference is -2 AB·CD.
  sketch:
  - 'setup: Put u = AB, w = AC, v = AD.'
  - 'derive: Expand the squared lengths of BC and BD.'
  - 'derive: The difference of the two sums equals -2 u·(v - w).'
  - 'conclude: This is -2 AB·CD, so the conditions are equivalent.'
  openmath: (forall (a b c d) (<-> (perpendicular_lines a b c d) (= (+ (^ (dist_of a c) 2) (^ (dist_of b d) 2)) (+ (^ (dist_of a d) 2) (^ (dist_of b c) 2)))))
  hard_negative:
    statement: $AB\perp CD$は$AC^2+BD^2=AB^2+CD^2$と同値である。
    reason: $A=(0,0,0)$、$B=(1,0,0)$、$C=(0,1,0)$、$D=(0,2,0)$では$AB\perp CD$だが、$AC^2+BD^2=6$、$AB^2+CD^2=2$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), inner ℝ (B -ᵥ A) (D -ᵥ C) = 0 ↔ dist A C ^ 2 + dist B D ^ 2 = dist A D ^ 2 + dist B C ^ 2
  proof: |
    by
      intro V P _ _ _ _ A B C D
      have e1 : dist A C ^ 2 = ‖C -ᵥ A‖ ^ 2 := by rw [dist_comm, dist_eq_norm_vsub V]
      have e2 : dist A D ^ 2 = ‖D -ᵥ A‖ ^ 2 := by rw [dist_comm, dist_eq_norm_vsub V]
      have e3 : dist B C ^ 2 = ‖(C -ᵥ A) - (B -ᵥ A)‖ ^ 2 := by
        rw [dist_comm, dist_eq_norm_vsub V, vsub_sub_vsub_cancel_right]
      have e4 : dist B D ^ 2 = ‖(D -ᵥ A) - (B -ᵥ A)‖ ^ 2 := by
        rw [dist_comm, dist_eq_norm_vsub V, vsub_sub_vsub_cancel_right]
      have e5 : D -ᵥ C = (D -ᵥ A) - (C -ᵥ A) := (vsub_sub_vsub_cancel_right D C A).symm
      rw [e1, e2, e3, e4, e5, inner_sub_right, norm_sub_sq_real, norm_sub_sq_real, real_inner_comm (B -ᵥ A) (C -ᵥ A), real_inner_comm (B -ᵥ A) (D -ᵥ A)]
      rw [real_inner_comm (C -ᵥ A) (B -ᵥ A), real_inner_comm (D -ᵥ A) (B -ᵥ A)]
      constructor <;> intro h <;> linarith
- id: tetrahedron_bimedians_concurrent
  kind: gap
  level: high
  topic: 四面体・対辺の中点を結ぶ線分
  statement: ユークリッド空間の4点$A,B,C,D$について、対辺の中点を結ぶ3本の線分（$AB$と$CD$、$AC$と$BD$、$AD$と$BC$の中点を結ぶ線分）の中点はすべて一致する。
  statement_en: For points A, B, C, D, the three segments joining the midpoints of opposite edges have the same midpoint.
  assumptions:
  - $A,B,C,D$はユークリッド空間の点である
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: 3本の線分の中点は一致する。
  answer: |
    $A,B,C,D$をユークリッド空間の点とする。任意の4点$X,Y,Z,W$について、$XY$の中点と$ZW$の中点を結ぶ線分の中点を$A$からの位置ベクトルで表すと、$\frac{1}{4}(\overrightarrow{AX}+\overrightarrow{AY}+\overrightarrow{AZ}+\overrightarrow{AW})$である。この式は4点の順序によらない。

    $(X,Y,Z,W)$を$(A,B,C,D)$、$(A,C,B,D)$、$(A,D,B,C)$とすると、3本の線分の中点はいずれも同じ位置ベクトルをもつ。よって3点は一致する。
  strategy: The midpoint of a bimedian is the average of the four position vectors, which is symmetric in the vertices.
  sketch:
  - 'derive: The midpoint of the segment joining the midpoints of XY and ZW has position vector (X+Y+Z+W)/4.'
  - 'conclude: This expression is symmetric, so the three midpoints coincide.'
  openmath: (forall (a b c d) (and (= (midpoint_of (midpoint_of a b) (midpoint_of c d)) (midpoint_of (midpoint_of a c) (midpoint_of b d))) (= (midpoint_of (midpoint_of a b) (midpoint_of c d)) (midpoint_of (midpoint_of a d) (midpoint_of b c)))))
  hard_negative:
    statement: 対辺の中点を結ぶ3本の線分の長さは常に等しい。
    reason: $A=(0,0,0)$、$B=(1,0,0)$、$C=(1,1,0)$、$D=(1,1,1)$では、$AB,CD$の中点を結ぶ線分の長さの2乗は$\frac{3}{2}$、$AC,BD$の中点を結ぶ線分では$\frac{1}{2}$である。一致するのは中点である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), midpoint ℝ (midpoint ℝ A B) (midpoint ℝ C D) = midpoint ℝ (midpoint ℝ A C) (midpoint ℝ B D) ∧ midpoint ℝ (midpoint ℝ A B) (midpoint ℝ C D) = midpoint ℝ (midpoint ℝ A D) (midpoint ℝ B C)
  proof: |
    by
      intro V P _ _ _ _ A B C D
      have key : ∀ X Y Z W : P, midpoint ℝ (midpoint ℝ X Y) (midpoint ℝ Z W) -ᵥ A =
          (4⁻¹ : ℝ) • ((X -ᵥ A) + (Y -ᵥ A) + (Z -ᵥ A) + (W -ᵥ A)) := by
        intro X Y Z W
        rw [midpoint_vsub, midpoint_vsub, midpoint_vsub, invOf_eq_inv]
        module
      constructor
      · apply vsub_left_injective A
        simp only [key]
        congr 1
        abel
      · apply vsub_left_injective A
        simp only [key]
        congr 1
        abel
- id: tetrahedron_centroid_three_to_one
  kind: gap
  level: high
  topic: 四面体・重心
  statement: ユークリッド空間の4点$A,B,C,D$について、各頂点と向かい合う面の重心を結ぶ線分を、頂点から$3:1$に内分する点はすべて一致する（面の重心は中線を頂点から$2:1$に内分する点とする）。
  statement_en: For points A, B, C, D, the point dividing the segment from each vertex to the centroid of the opposite face in ratio 3:1 is the same for all four vertices, each face centroid being the point dividing a median in ratio 2:1.
  assumptions:
  - 面の重心は中線を頂点から$2:1$に内分する点である
  quantifiers:
  - ユークリッド空間の任意の点$A,B,C,D$
  conclusion: 4本の線分を頂点から$3:1$に内分する点は一致する。
  answer: |
    $A,B,C,D$をユークリッド空間の点とする。任意の4点$W,X,Y,Z$について、三角形$XYZ$の重心を$G$とする。$A$からの位置ベクトルを$\vec{w},\vec{x},\vec{y},\vec{z}$と書く。$YZ$の中点の位置ベクトルは$\frac{1}{2}(\vec{y}+\vec{z})$なので、$G$の位置ベクトルは$\frac{1}{3}\vec{x}+\frac{2}{3}\cdot\frac{1}{2}(\vec{y}+\vec{z})=\frac{1}{3}(\vec{x}+\vec{y}+\vec{z})$である。

    線分$WG$を$W$から$3:1$に内分する点の位置ベクトルは$\frac{1}{4}\vec{w}+\frac{3}{4}\cdot\frac{1}{3}(\vec{x}+\vec{y}+\vec{z})=\frac{1}{4}(\vec{w}+\vec{x}+\vec{y}+\vec{z})$である。この式は4点について対称である。

    したがって、頂点$D,A,B,C$のどれから出発しても同じ点を得る。
  strategy: Compute the division point in position vectors; it is the symmetric average of the four vertices.
  sketch:
  - 'derive: The face centroid has position vector (x + y + z)/3.'
  - 'derive: The 3:1 point from W has position vector (w + x + y + z)/4.'
  - 'conclude: This expression is symmetric, so all four points coincide.'
  openmath: (forall (a b c d) (and (= (division_point d (division_point a (midpoint_of b c) (/ 2 3)) (/ 3 4)) (division_point a (division_point b (midpoint_of c d) (/ 2 3)) (/ 3 4))) (= (division_point d (division_point a (midpoint_of b c) (/ 2 3)) (/ 3 4)) (division_point b (division_point c (midpoint_of d a) (/ 2 3)) (/ 3 4))) (= (division_point d (division_point a (midpoint_of b c) (/ 2 3)) (/ 3 4)) (division_point c (division_point d (midpoint_of a b) (/ 2 3)) (/ 3 4)))))
  hard_negative:
    statement: 四面体の重心は、頂点と向かい合う面の重心を結ぶ線分を頂点から$2:1$に内分する。
    reason: $2:1$の点の位置ベクトルは$\frac{1}{3}\vec{w}+\frac{2}{9}(\vec{x}+\vec{y}+\vec{z})$で、4点について対称でない。三角形の比をそのまま移すことはできず、四面体では$3:1$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), AffineMap.lineMap D (AffineMap.lineMap A (midpoint ℝ B C) (2 / 3 : ℝ)) (3 / 4 : ℝ) = AffineMap.lineMap A (AffineMap.lineMap B (midpoint ℝ C D) (2 / 3 : ℝ)) (3 / 4 : ℝ) ∧ AffineMap.lineMap D (AffineMap.lineMap A (midpoint ℝ B C) (2 / 3 : ℝ)) (3 / 4 : ℝ) = AffineMap.lineMap B (AffineMap.lineMap C (midpoint ℝ D A) (2 / 3 : ℝ)) (3 / 4 : ℝ) ∧ AffineMap.lineMap D (AffineMap.lineMap A (midpoint ℝ B C) (2 / 3 : ℝ)) (3 / 4 : ℝ) = AffineMap.lineMap C (AffineMap.lineMap D (midpoint ℝ A B) (2 / 3 : ℝ)) (3 / 4 : ℝ)
  proof: |
    by
      intro V P _ _ _ _ A B C D
      have key : ∀ W X Y Z : P, AffineMap.lineMap W (AffineMap.lineMap X (midpoint ℝ Y Z) (2 / 3 : ℝ)) (3 / 4 : ℝ) -ᵥ A =
          (4⁻¹ : ℝ) • ((W -ᵥ A) + (X -ᵥ A) + (Y -ᵥ A) + (Z -ᵥ A)) := by
        intro W X Y Z
        have e1 : ∀ S T : P, ∀ r : ℝ, AffineMap.lineMap S T r -ᵥ A = (1 - r) • (S -ᵥ A) + r • (T -ᵥ A) := by
          intro S T r
          rw [AffineMap.lineMap_apply, vadd_vsub_assoc, ← vsub_sub_vsub_cancel_right T S A]
          module
        rw [e1, e1, midpoint_vsub, invOf_eq_inv]
        module
      refine ⟨?_, ?_, ?_⟩ <;>
      · apply vsub_left_injective A
        simp only [key]
        congr 1
        abel
