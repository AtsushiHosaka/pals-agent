- id: fa_opnorm_eq_of_bound_attained
  kind: gap
  level: 3
  topic: 関数解析・作用素ノルムの計算
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E,F$を$\mathbb{K}$上のノルム空間、$T:E\to F$を有界線形作用素、$M\geq 0$とする。全ての$x$で$\|Tx\|\leq M\|x\|$であり、ある$x_0\neq 0$で$\|Tx_0\|=M\|x_0\|$となるならば、$\|T\|=M$である。
  statement_en: Let T be a bounded linear operator between normed spaces over ℝ or ℂ and M ≥ 0. If ‖Tx‖ ≤ M‖x‖ for all x and ‖Tx₀‖ = M‖x₀‖ for some x₀ ≠ 0, then ‖T‖ = M.
  assumptions:
  - $E,F$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $T:E\to F$は有界線形作用素
  - $M\geq 0$で、全ての$x$について$\|Tx\|\leq M\|x\|$
  - ある$x_0\neq 0$で$\|Tx_0\|=M\|x_0\|$
  quantifiers:
  - 任意の$E,F,T,M,x_0$
  conclusion: $\|T\|=M$である。
  answer: |
    $E,F$をノルム空間、$T:E\to F$を有界線形作用素とし、$M\geq 0$が全ての$x$で$\|Tx\|\leq M\|x\|$を満たし、$x_0\neq 0$で$\|Tx_0\|=M\|x_0\|$とする。

    作用素ノルムは$\|Tx\|\leq C\|x\|$を全ての$x$で満たす$C\geq 0$の最小値である。$M$はこの条件を満たすので$\|T\|\leq M$である。

    一方、$M\|x_0\|=\|Tx_0\|\leq\|T\|\|x_0\|$であり、$\|x_0\|>0$で割ると$M\leq\|T\|$を得る。よって$\|T\|=M$である。
  strategy: The bound gives ‖T‖ ≤ M and the extremal vector gives the reverse inequality.
  sketch:
  - 'derive: The bound for all x gives ‖T‖ ≤ M by minimality of the operator norm.'
  - 'derive: At x₀ we have M‖x₀‖ = ‖Tx₀‖ ≤ ‖T‖‖x₀‖.'
  - 'conclude: Dividing by ‖x₀‖ > 0 gives M ≤ ‖T‖, so ‖T‖ = M.'
  openmath: (forall (E F T M x0) (-> (and (normed_space E) (normed_space F) (bounded_operator T E F) (>= M 0) (forall (x) (-> (in x E) (<= (norm (fn_value T x)) (* M (norm x))))) (in x0 E) (!= x0 0) (= (norm (fn_value T x0)) (* M (norm x0)))) (= (norm T) M)))
  hard_negative:
    statement: $\|Tx\|\leq M\|x\|$が全ての$x$で成り立つなら$\|T\|=M$である。
    reason: $T=0$、$M=1$で$E\neq\{0\}$とすると不等式は成り立つが$\|T\|=0\neq 1$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [NormedAddCommGroup F] [NormedSpace 𝕜 F] (T : E →L[𝕜] F) (M : ℝ) (x₀ : E), 0 ≤ M → (∀ x, ‖T x‖ ≤ M * ‖x‖) → x₀ ≠ 0 → ‖T x₀‖ = M * ‖x₀‖ → ‖T‖ = M
  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ T M x₀ hM hb hx₀ he
      apply le_antisymm (T.opNorm_le_bound hM hb)
      have h := T.le_opNorm x₀
      rw [he] at h
      exact le_of_mul_le_mul_right h (norm_pos_iff.mpr hx₀)
- id: fa_opnorm_eq_of_bound_approached
  kind: gap
  level: 3
  topic: 関数解析・作用素ノルムの計算
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E,F$を$\mathbb{K}$上のノルム空間、$T:E\to F$を有界線形作用素、$M\geq 0$とする。全ての$v$で$\|Tv\|\leq M\|v\|$であり、ノルム$1$のベクトル列$(x_n)$で$\|Tx_n\|\to M$となるならば、$\|T\|=M$である。上限が達成されない場合に使う形である。
  statement_en: Let T be a bounded linear operator between normed spaces over ℝ or ℂ and M ≥ 0. If ‖Tv‖ ≤ M‖v‖ for all v and there are unit vectors x_n with ‖Tx_n‖ → M, then ‖T‖ = M.
  assumptions:
  - $E,F$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $T:E\to F$は有界線形作用素
  - $M\geq 0$で、全ての$v$について$\|Tv\|\leq M\|v\|$
  - 全ての$n$で$\|x_n\|=1$、かつ$\|Tx_n\|\to M$
  quantifiers:
  - 任意の$E,F,T,M$とベクトル列$(x_n)$
  conclusion: $\|T\|=M$である。
  answer: |
    $E,F$をノルム空間、$T:E\to F$を有界線形作用素とする。$M\geq 0$は全ての$v$で$\|Tv\|\leq M\|v\|$を満たし、$\|x_n\|=1$である列$(x_n)$について$\|Tx_n\|\to M$とする。

    仮定の不等式と作用素ノルムの最小性から$\|T\|\leq M$である。

    各$n$で$\|Tx_n\|\leq\|T\|\|x_n\|=\|T\|$である。$n\to\infty$とすると$M\leq\|T\|$を得る。よって$\|T\|=M$である。
  strategy: Pass to the limit in ‖Tx_n‖ ≤ ‖T‖ along the norming sequence.
  sketch:
  - 'derive: The bound gives ‖T‖ ≤ M.'
  - 'derive: For unit vectors, ‖Tx_n‖ ≤ ‖T‖.'
  - 'conclude: Taking the limit gives M ≤ ‖T‖, hence equality.'
  openmath: (forall (E F T M x) (-> (and (normed_space E) (normed_space F) (bounded_operator T E F) (>= M 0) (forall (v) (-> (in v E) (<= (norm (fn_value T v)) (* M (norm v))))) (forall (n) (= (norm (seq_value x n)) 1)) (seq_fn_tends_to (lambda (n) (norm (fn_value T (seq_value x n)))) M)) (= (norm T) M)))
  hard_negative:
    statement: ノルム$1$の列で$\|Tx_n\|\to M$となるなら、他の仮定なしに$\|T\|=M$である。
    reason: $T$を$\mathbb{R}^2$上の$\mathrm{diag}(2,1)$、$x_n=e_2$とすると$\|Tx_n\|\to 1$だが$\|T\|=2$である。上からの評価が要る。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [NormedAddCommGroup F] [NormedSpace 𝕜 F] (T : E →L[𝕜] F) (M : ℝ) (x : ℕ → E), 0 ≤ M → (∀ v, ‖T v‖ ≤ M * ‖v‖) → (∀ n, ‖x n‖ = 1) → Filter.Tendsto (fun n => ‖T (x n)‖) Filter.atTop (nhds M) → ‖T‖ = M
  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ T M x hM hb hx ht
      apply le_antisymm (T.opNorm_le_bound hM hb)
      refine le_of_tendsto' ht fun n => ?_
      have h := T.le_opNorm (x n)
      rwa [hx n, mul_one] at h
- id: fa_bounded_below_iff_injective_closed_range
  kind: gap
  level: 4
  topic: 関数解析・下に有界な作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E,F$を$\mathbb{K}$上のバナッハ空間、$T:E\to F$を有界線形作用素とする。$T$が単射で値域が閉であることと、ある$c>0$で全ての$x$について$\|x\|\leq c\|Tx\|$となることは同値である。
  statement_en: For a bounded linear operator T between Banach spaces over ℝ or ℂ, T is injective with closed range if and only if there is c > 0 with ‖x‖ ≤ c‖Tx‖ for all x.
  assumptions:
  - $E,F$は$\mathbb{R}$または$\mathbb{C}$上のバナッハ空間
  - $T:E\to F$は有界線形作用素
  quantifiers:
  - 任意の$E,F,T$
  conclusion: $T$が単射かつ値域が閉であることと、ある$c>0$で全ての$x$について$\|x\|\leq c\|Tx\|$となることは同値である。
  answer: |
    $E,F$をバナッハ空間、$T:E\to F$を有界線形作用素とする。

    $T$が単射で値域$R$が閉であるとする。$R$はバナッハ空間$F$の閉部分空間なのでバナッハ空間であり、$T:E\to R$は有界な全単射である。有界逆写像定理より$T^{-1}:R\to E$は有界である。$c=\|T^{-1}\|+1>0$とおくと、$\|x\|=\|T^{-1}Tx\|\leq c\|Tx\|$となる。

    逆に、$c>0$で全ての$x$について$\|x\|\leq c\|Tx\|$とする。$Tx=0$なら$x=0$なので$T$は単射である。値域の点列$Tx_n$が$y\in F$に収束するとする。$\|x_n-x_m\|\leq c\|Tx_n-Tx_m\|$より$(x_n)$はコーシー列であり、$E$の完備性から$x\in E$に収束する。$T$の連続性から$Tx_n\to Tx$なので$y=Tx$である。よって値域は閉である。
  strategy: Use the bounded inverse theorem on the range for one direction and a Cauchy argument for the other.
  sketch:
  - 'apply_theorem: If T is injective with closed range, T onto its range is a bijection of Banach spaces, so its inverse is bounded.'
  - 'derive: This yields ‖x‖ ≤ c‖Tx‖.'
  - 'derive: Conversely the estimate gives injectivity.'
  - 'derive: If Tx_n → y then (x_n) is Cauchy, so it converges to some x and y = Tx.'
  - 'conclude: The range is closed.'
  openmath: (forall (E F T) (-> (and (banach_space E) (banach_space F) (bounded_operator T E F)) (<-> (and (injective_map T) (closed_set (range_of T))) (exists (c) (and (> c 0) (forall (x) (-> (in x E) (<= (norm x) (* c (norm (fn_value T x)))))))))))
  hard_negative:
    statement: 単射な有界線形作用素は必ず$\|x\|\leq c\|Tx\|$を満たす。
    reason: $\ell^2$上の$T(x_n)=(x_n/n)$は単射だが、$\|Te_n\|=1/n$なので下に有界でない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [CompleteSpace E] [NormedAddCommGroup F] [NormedSpace 𝕜 F] [CompleteSpace F] (T : E →L[𝕜] F), (Function.Injective T ∧ IsClosed (Set.range T)) ↔ ∃ c : ℝ, 0 < c ∧ ∀ x, ‖x‖ ≤ c * ‖T x‖
  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ _ _ T
      constructor
      · rintro ⟨hi, hc⟩
        obtain ⟨K, hK⟩ := T.antilipschitz_of_injective_of_isClosed_range hi hc
        refine ⟨K + 1, by positivity, fun x => ?_⟩
        have h := hK.le_mul_dist x 0
        simp only [dist_zero_right, map_zero] at h
        have : (0 : ℝ) ≤ ‖T x‖ := norm_nonneg _
        nlinarith
      · rintro ⟨c, hc, h⟩
        have hA : AntilipschitzWith ⟨c, hc.le⟩ T := T.antilipschitz_of_bound h
        exact ⟨hA.injective, hA.isClosed_range T.uniformContinuous⟩
- id: fa_dense_subspace_bounded_extension
  kind: textbook
  level: 3
  topic: 関数解析・稠密部分空間からの拡張
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のノルム空間、$F$を$\mathbb{K}$上のバナッハ空間、$D$を$E$の稠密な部分空間、$T:D\to F$を有界線形作用素とする。$T$の有界線形な拡張$S:E\to F$で$\|S\|=\|T\|$となるものが存在し、$T$の有界線形な拡張は一つしかない。
  statement_en: If D is a dense subspace of a normed space E over ℝ or ℂ and T is a bounded linear operator from D to a Banach space F, then T has a bounded linear extension S to E with ‖S‖ = ‖T‖, and any two bounded linear extensions of T coincide.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $F$は同じ体上のバナッハ空間
  - $D$は$E$の稠密な部分空間
  - $T:D\to F$は有界線形作用素
  quantifiers:
  - 任意の$E,F,D,T$
  conclusion: ノルムが等しい有界線形な拡張$S$が存在し、有界線形な拡張は一意である。
  answer: |
    $E$をノルム空間、$F$をバナッハ空間、$D$を$E$の稠密な部分空間、$T:D\to F$を有界線形作用素とする。

    $x\in E$に対し$x_n\to x$となる$x_n\in D$をとる。$\|Tx_n-Tx_m\|\leq\|T\|\|x_n-x_m\|$より$(Tx_n)$はコーシー列なので、$F$の完備性から収束する。極限は列の選び方によらない。実際、$x_n'\to x$も$D$の列なら$\|Tx_n-Tx_n'\|\leq\|T\|\|x_n-x_n'\|\to 0$である。そこで$Sx=\lim Tx_n$と定める。

    $x\in D$なら定数列をとって$Sx=Tx$である。線形性は極限の線形性から従う。$\|Tx_n\|\leq\|T\|\|x_n\|$で極限をとると$\|Sx\|\leq\|T\|\|x\|$なので$\|S\|\leq\|T\|$である。$S$は$T$の拡張なので$\|T\|\leq\|S\|$でもある。

    $S_1,S_2$を有界線形な拡張とする。$S_1,S_2$は連続で稠密な$D$上で一致するので、$E$全体で一致する。
  strategy: Define the extension by limits along approximating sequences and use completeness of F.
  sketch:
  - 'construct: For x in E choose x_n in D with x_n → x; (Tx_n) is Cauchy.'
  - 'derive: The limit does not depend on the chosen sequence, so Sx = lim Tx_n is well defined.'
  - 'derive: S is linear, extends T and satisfies ‖S‖ ≤ ‖T‖.'
  - 'derive: As an extension, ‖T‖ ≤ ‖S‖.'
  - 'conclude: Two continuous maps agreeing on a dense set coincide, which gives uniqueness.'
  openmath: (forall (E F D T) (-> (and (normed_space E) (banach_space F) (subspace_of D E) (dense_in D E) (bounded_operator T D F)) (and (exists (S) (and (bounded_operator S E F) (restricts_to S D T) (= (norm S) (norm T)))) (forall (S1 S2) (-> (and (bounded_operator S1 E F) (bounded_operator S2 E F) (restricts_to S1 D T) (restricts_to S2 D T)) (= S1 S2))))))
  hard_negative:
    statement: $F$が完備でなくても、稠密部分空間上の有界線形作用素は全体へ拡張できる。
    reason: $E$を$F$の完備化、$D=F$、$T=\mathrm{id}_F$とする。$F\neq E$なら連続な拡張$S:E\to F$は連続性から$E$上の恒等写像となり値が$F$に収まらない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [NormedAddCommGroup F] [NormedSpace 𝕜 F] [CompleteSpace F] (D : Submodule 𝕜 E) (T : D →L[𝕜] F), Dense (D : Set E) → (∃ S : E →L[𝕜] F, (∀ x : D, S x = T x) ∧ ‖S‖ = ‖T‖) ∧ ∀ S₁ S₂ : E →L[𝕜] F, (∀ x : D, S₁ x = T x) → (∀ x : D, S₂ x = T x) → S₁ = S₂
  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ _ D T hD
      have hdr : DenseRange (D.subtypeL : D →L[𝕜] E) := by
        simpa [DenseRange] using hD
      have hie : IsUniformInducing (D.subtypeL : D →L[𝕜] E) := D.subtypeₗᵢ.isometry.isUniformInducing
      constructor
      · refine ⟨T.extend D.subtypeL, fun x => ?_, ?_⟩
        · exact T.extend_eq (e := D.subtypeL) hdr hie x
        · apply le_antisymm
          · have := T.opNorm_extend_le (e := D.subtypeL) (N := 1) hdr (fun x => by simp)
            simpa using this
          · refine T.opNorm_le_bound (norm_nonneg _) fun x => ?_
            rw [← T.extend_eq (e := D.subtypeL) hdr hie x]
            exact (ContinuousLinearMap.le_opNorm _ _).trans_eq (by simp)
      · intro S₁ S₂ h₁ h₂
        apply ContinuousLinearMap.ext
        refine fun x => (hdr.equalizer S₁.continuous S₂.continuous ?_ |> congrFun <| x)
        funext y
        simp [h₁ y, h₂ y]
- id: fa_quotient_norm_eq_infdist
  kind: gap
  level: 3
  topic: 関数解析・商ノルム
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のノルム空間、$M$を部分空間とする。商半ノルムは$\|[x]\|=\inf_{m\in M}\|x+m\|$で定まる。このとき$\|[x]\|$は$x$と$M$の距離$\mathrm{dist}(x,M)$に等しい。
  statement_en: For a subspace M of a normed space E over ℝ or ℂ, the quotient seminorm ‖[x]‖ = inf over m in M of ‖x + m‖ equals the distance from x to M.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $M$は$E$の部分空間
  - 商半ノルムは$\|[x]\|=\inf_{m\in M}\|x+m\|$で定める
  quantifiers:
  - 任意の$E,M$と$x\in E$
  conclusion: $\|[x]\|=\mathrm{dist}(x,M)$である。
  answer: |
    $E$をノルム空間、$M$を部分空間、$x\in E$とする。商半ノルムは$\|[x]\|=\inf_{m\in M}\|x+m\|$である。

    $m\mapsto -m$は$M$の全単射なので、$\inf_{m\in M}\|x+m\|=\inf_{m\in M}\|x-m\|$である。右辺は$\mathrm{dist}(x,M)$の定義そのものである。
  strategy: Substitute m by -m in the infimum defining the quotient seminorm.
  sketch:
  - 'translate: Write the quotient seminorm as an infimum over M.'
  - 'derive: The map m to -m is a bijection of M.'
  - 'conclude: The infimum becomes the distance from x to M.'
  openmath: (forall (E M x) (-> (and (normed_space E) (subspace_of M E) (in x E)) (= (norm (quotient_class x M)) (dist_to_set x M))))
  hard_negative:
    statement: $\|[x]\|=\|x\|$である。
    reason: $x\in M$、$x\neq 0$なら$\|[x]\|=0$だが$\|x\|>0$である。一般に成り立つのは$\|[x]\|\leq\|x\|$だけである。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] (M : Submodule 𝕜 E) (x : E), ‖(Submodule.Quotient.mk x : E ⧸ M)‖ = Metric.infDist x (M : Set E)
  proof: |
    by
      intro 𝕜 _ E _ _ M x
      exact QuotientAddGroup.norm_mk x
- id: fa_quotient_norm_zero_iff_mem
  kind: gap
  level: 3
  topic: 関数解析・商ノルム
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のノルム空間、$M$を閉部分空間とする。$x\in E$について$\|[x]\|=0$であることと$x\in M$は同値である。
  statement_en: For a closed subspace M of a normed space E over ℝ or ℂ and x in E, the quotient seminorm of [x] vanishes if and only if x lies in M.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $M$は$E$の閉部分空間
  quantifiers:
  - 任意の$E,M$と$x\in E$
  conclusion: $\|[x]\|=0\iff x\in M$である。
  answer: |
    $E$をノルム空間、$M$を閉部分空間、$x\in E$とする。商半ノルムは$\|[x]\|=\mathrm{dist}(x,M)$と書ける。

    $x\in M$なら$\mathrm{dist}(x,M)=0$である。

    逆に$\mathrm{dist}(x,M)=0$とする。各$n$で$\|x-m_n\|<1/n$となる$m_n\in M$がとれるので、$m_n\to x$である。$M$は閉なので$x\in M$である。
  strategy: Translate to the distance from x to M and use closedness.
  sketch:
  - 'translate: The quotient seminorm of [x] is the distance from x to M.'
  - 'derive: If the distance is zero, there are m_n in M with m_n → x.'
  - 'conclude: Closedness of M gives x in M; the converse is immediate.'
  openmath: (forall (E M x) (-> (and (normed_space E) (subspace_of M E) (closed_set M) (in x E)) (<-> (= (norm (quotient_class x M)) 0) (in x M))))
  hard_negative:
    statement: 閉とは限らない部分空間$M$でも、$\|[x]\|=0$なら$x\in M$である。
    reason: $M$が稠密な真部分空間なら、$x\notin M$でも$\mathrm{dist}(x,M)=0$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] (M : Submodule 𝕜 E) (x : E), IsClosed (M : Set E) → (‖(Submodule.Quotient.mk x : E ⧸ M)‖ = 0 ↔ x ∈ M)
  proof: |
    by
      intro 𝕜 _ E _ _ M x hM
      have h : ‖(Submodule.Quotient.mk x : E ⧸ M)‖ = Metric.infDist x (M : Set E) := QuotientAddGroup.norm_mk x
      rw [h, ← hM.mem_iff_infDist_zero ⟨0, M.zero_mem⟩]
      rfl
- id: fa_quotient_banach_complete
  kind: textbook
  level: 3
  topic: 関数解析・商ノルム
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のバナッハ空間、$M$を閉部分空間とする。商空間$E/M$は商ノルムについて完備である。
  statement_en: The quotient of a Banach space over ℝ or ℂ by a closed subspace is complete in the quotient norm.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のバナッハ空間
  - $M$は$E$の閉部分空間
  quantifiers:
  - 任意の$E,M$
  conclusion: $E/M$は完備である。
  answer: |
    $E$をバナッハ空間、$M$を閉部分空間とする。ノルム空間が完備であることは、ノルムの和が収束する級数がすべて収束することと同値なので、これを確かめる。

    $y_n\in E/M$が$\sum_n\|y_n\|<\infty$を満たすとする。商ノルムの定義から、各$n$で$[x_n]=y_n$かつ$\|x_n\|<\|y_n\|+2^{-n}$となる$x_n\in E$がとれる。すると$\sum_n\|x_n\|<\infty$であり、$E$の完備性から$\sum_n x_n$は$x\in E$に収束する。

    $\|[x]-\sum_{n\leq N}y_n\|=\|[x-\sum_{n\leq N}x_n]\|\leq\|x-\sum_{n\leq N}x_n\|\to 0$である。よって$\sum_n y_n=[x]$であり、$E/M$は完備である。
  strategy: Lift an absolutely summable series to representatives with almost the same norms.
  sketch:
  - 'translate: Use the criterion that absolutely summable series converge.'
  - 'construct: Choose representatives x_n with ‖x_n‖ < ‖y_n‖ + 2^(-n).'
  - 'derive: The lifted series converges to some x in E.'
  - 'derive: The quotient map has norm at most 1, so the partial sums of y_n converge to [x].'
  - 'conclude: E/M is complete.'
  openmath: (forall (E M) (-> (and (banach_space E) (subspace_of M E) (closed_set M)) (complete_space (quotient_space E M))))
  hard_negative:
    statement: 商$E/M$が完備なら$E$も完備である。
    reason: $M=E$とすると$E/M=\{0\}$は完備だが、$E$は任意のノルム空間でよい。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [CompleteSpace E] (M : Submodule 𝕜 E), IsClosed (M : Set E) → CompleteSpace (E ⧸ M)
  proof: |
    by
      intro 𝕜 _ E _ _ _ M hM
      infer_instance
- id: fa_norm_tsum_le_tsum_norm
  kind: gap
  level: 3
  topic: 関数解析・絶対収束級数
  statement: $E$をバナッハ空間、$(a_n)$を$E$の列とする。$\sum_n\|a_n\|<\infty$ならば$\sum_n a_n$は無条件収束し、$\|\sum_n a_n\|\leq\sum_n\|a_n\|$である。絶対収束から収束を導く命題に、和のノルム評価を加えた形である。
  statement_en: If (a_n) is a sequence in a Banach space with summable norms, then the series of a_n converges unconditionally and ‖Σ a_n‖ ≤ Σ ‖a_n‖. This adds the norm estimate to the statement that absolutely summable series converge.
  assumptions:
  - $E$はバナッハ空間
  - $\sum_n\|a_n\|<\infty$
  quantifiers:
  - 任意の$E$と$E$の列$(a_n)$
  conclusion: $\sum_n a_n$は無条件収束し、$\|\sum_n a_n\|\leq\sum_n\|a_n\|$である。
  answer: |
    $E$をバナッハ空間、$(a_n)$を$\sum_n\|a_n\|<\infty$を満たす列とする。

    $\varepsilon>0$をとる。$\sum_n\|a_n\|<\infty$なので、$N$以上の添字だけからなる全ての有限集合$s$で$\sum_{n\in s}\|a_n\|<\varepsilon$となる$N$がある。三角不等式から$\|\sum_{n\in s}a_n\|\leq\sum_{n\in s}\|a_n\|<\varepsilon$である。これは有限部分和のコーシー条件なので、$E$の完備性から$\sum_na_n$は無条件収束する。

    有限集合$s$について$\|\sum_{n\in s}a_n\|\leq\sum_{n\in s}\|a_n\|\leq\sum_n\|a_n\|$である。ノルムは連続なので、$s$を増やした極限で$\|\sum_na_n\|\leq\sum_n\|a_n\|$を得る。
  strategy: Check the Cauchy condition for finite partial sums and pass to the limit in the triangle inequality.
  sketch:
  - 'derive: The triangle inequality bounds finite sums far out by tails of the norm series.'
  - 'derive: Completeness gives unconditional convergence.'
  - 'conclude: Continuity of the norm gives the estimate for the sum.'
  openmath: (forall (E a) (-> (and (banach_space E) (series_abs_summable a)) (and (series_summable a) (<= (norm (series_sum_fn (lambda (n) (seq_value a n)))) (series_sum_fn (lambda (n) (norm (seq_value a n))))))))
  hard_negative:
    statement: バナッハ空間で$\sum_n a_n$が収束すれば$\sum_n\|a_n\|<\infty$である。
    reason: $\ell^2$で$a_n=e_n/n$とすると級数は収束するが、$\sum_n\|a_n\|=\sum_n 1/n=\infty$である。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [CompleteSpace E] (a : ℕ → E), Summable (fun n => ‖a n‖) → Summable a ∧ ‖∑' n, a n‖ ≤ ∑' n, ‖a n‖
  proof: |
    by
      intro E _ _ a h
      exact ⟨h.of_norm, norm_tsum_le_tsum_norm h⟩
- id: fa_neumann_inverse_norm_bound
  kind: gap
  level: 4
  topic: 関数解析・ノイマン級数の評価
  statement: $R$を$\|1\|=1$を満たす完備ノルム環、$t\in R$を$\|t\|<1$とする。$1-t$は両側逆元$u$をもち、$\|u\|\leq(1-\|t\|)^{-1}$である。級数$\sum_n t^n$が逆元を与えるノイマン級数の命題に、逆元のノルムの評価を加えた形である。
  statement_en: In a complete normed ring with ‖1‖ = 1, if ‖t‖ < 1 then 1 - t has a two-sided inverse u with ‖u‖ ≤ (1 - ‖t‖)⁻¹. This adds the norm bound to the statement that the Neumann series gives the inverse.
  assumptions:
  - $R$は完備ノルム環で$\|1\|=1$
  - $t\in R$で$\|t\|<1$
  quantifiers:
  - 任意の$R$と$t$
  conclusion: $u(1-t)=(1-t)u=1$かつ$\|u\|\leq(1-\|t\|)^{-1}$となる$u$が存在する。
  answer: |
    $R$を$\|1\|=1$の完備ノルム環、$\|t\|<1$とする。

    $\|t^n\|\leq\|t\|^n$（$n=0$では$\|1\|=1$）なので$\sum_n\|t^n\|\leq\sum_n\|t\|^n=(1-\|t\|)^{-1}<\infty$である。$R$は完備なので$u=\sum_n t^n$は収束し、$\|u\|\leq(1-\|t\|)^{-1}$である。

    部分和$u_N=\sum_{n\leq N}t^n$について$u_N(1-t)=(1-t)u_N=1-t^{N+1}$である。$t^{N+1}\to 0$と積の連続性から、$N\to\infty$で$u(1-t)=(1-t)u=1$を得る。
  strategy: Sum the geometric series, bound it by the real geometric series and telescope.
  sketch:
  - 'derive: The norms of t^n are bounded by ‖t‖^n, whose sum is (1-‖t‖)⁻¹.'
  - 'construct: Completeness gives u as the sum of t^n with the norm bound.'
  - 'derive: The partial sums satisfy u_N(1-t) = (1-t)u_N = 1 - t^(N+1).'
  - 'conclude: Passing to the limit shows u is a two-sided inverse.'
  openmath: (forall (A t) (-> (and (banach_algebra A) (= (norm (unit_of A)) 1) (in t A) (< (norm t) 1)) (exists (u) (and (in u A) (= (* u (- (unit_of A) t)) (unit_of A)) (= (* (- (unit_of A) t) u) (unit_of A)) (<= (norm u) (/ 1 (- 1 (norm t))))))))
  hard_negative:
    statement: $\|t\|\leq 1$なら$1-t$は可逆である。
    reason: $R=\mathbb{R}$、$t=1$では$\|t\|\leq 1$だが$1-t=0$は可逆でない。
  target: |
    ∀ (R : Type*) [NormedRing R] [NormOneClass R] [CompleteSpace R] (t : R), ‖t‖ < 1 → ∃ u : R, u * (1 - t) = 1 ∧ (1 - t) * u = 1 ∧ ‖u‖ ≤ (1 - ‖t‖)⁻¹
  proof: |
    by
      intro R _ _ _ t ht
      refine ⟨∑' n, t ^ n, ?_, ?_, ?_⟩
      · exact geom_series_mul_neg t ht
      · exact mul_neg_geom_series t ht
      · have := tsum_geometric_le_of_norm_lt_one t ht
        simpa using this
- id: fa_unit_perturbation_inverse_bound
  kind: gap
  level: 4
  topic: 関数解析・可逆元の摂動
  statement: $R$を$\|1\|=1$を満たす完備ノルム環、$a\in R$を可逆で逆元を$b$とする。$\|c-a\|<\|b\|^{-1}$ならば$c$も可逆であり、その逆元$d$は$\|d\|\leq\|b\|/(1-\|b\|\|c-a\|)$を満たす。可逆元の開集合性に半径と評価を与えた形である。
  statement_en: In a complete normed ring with ‖1‖ = 1, if a has inverse b and ‖c - a‖ < ‖b‖⁻¹, then c is invertible with inverse d satisfying ‖d‖ ≤ ‖b‖ / (1 - ‖b‖‖c - a‖). This makes the openness of the invertible elements quantitative.
  assumptions:
  - $R$は完備ノルム環で$\|1\|=1$
  - $ab=ba=1$
  - $\|c-a\|<\|b\|^{-1}$
  quantifiers:
  - 任意の$R$と$a,b,c\in R$
  conclusion: $cd=dc=1$かつ$\|d\|\leq\|b\|/(1-\|b\|\|c-a\|)$となる$d$が存在する。
  answer: |
    $R$を$\|1\|=1$の完備ノルム環、$ab=ba=1$、$\|c-a\|<\|b\|^{-1}$とする。$\|1\|=1$より$1\neq 0$なので$b\neq 0$であり、$\|c-a\|<\|b\|^{-1}$から$\|b\|\|c-a\|<1$である。

    $t=b(a-c)$とおくと$\|t\|\leq\|b\|\|c-a\|<1$であり、$a(1-t)=a-ab(a-c)=c$である。$\|t\|<1$なので、ノイマン級数により$1-t$は逆元$u$をもち、$\|u\|\leq(1-\|t\|)^{-1}\leq(1-\|b\|\|c-a\|)^{-1}$である。

    $d=ub$とおく。$cd=a(1-t)ub=ab=1$であり、$dc=uba(1-t)=u(1-t)=1$である。また$\|d\|\leq\|u\|\|b\|\leq\|b\|/(1-\|b\|\|c-a\|)$である。
  strategy: Factor c = a(1 - b(a - c)) and apply the Neumann series.
  sketch:
  - 'setup: Put t = b(a-c), so ‖t‖ ≤ ‖b‖‖c-a‖ < 1.'
  - 'derive: Then c = a(1-t).'
  - 'apply_theorem: The Neumann series inverts 1-t with inverse u and a norm bound.'
  - 'construct: Set d = ub and verify cd = dc = 1.'
  - 'conclude: Submultiplicativity gives the bound on d.'
  openmath: (forall (A a b c) (-> (and (banach_algebra A) (= (norm (unit_of A)) 1) (in a A) (in b A) (in c A) (= (* a b) (unit_of A)) (= (* b a) (unit_of A)) (< (norm (- c a)) (/ 1 (norm b)))) (exists (d) (and (in d A) (= (* c d) (unit_of A)) (= (* d c) (unit_of A)) (<= (norm d) (/ (norm b) (- 1 (* (norm b) (norm (- c a))))))))))
  hard_negative:
    statement: $\|c-a\|<\|a\|$なら$c$は可逆である。
    reason: $2\times 2$実行列の環で$a=\mathrm{diag}(1,1/2)$、$c=\mathrm{diag}(1,0)$とすると、$\|c-a\|=1/2<1=\|a\|$だが$c$は可逆でない。半径を決めるのは$\|a\|$でなく$\|a^{-1}\|^{-1}$である。
  target: |
    ∀ (R : Type*) [NormedRing R] [NormOneClass R] [CompleteSpace R] (a b c : R), a * b = 1 → b * a = 1 → ‖c - a‖ < ‖b‖⁻¹ → ∃ d : R, c * d = 1 ∧ d * c = 1 ∧ ‖d‖ ≤ ‖b‖ / (1 - ‖b‖ * ‖c - a‖)
  proof: |
    by
      intro R _ _ _ a b c hab hba h
      have hb : 0 < ‖b‖ := by
        rcases (norm_nonneg b).eq_or_lt with h0 | h0
        · rw [← h0, inv_zero] at h
          exact absurd h (not_lt.mpr (norm_nonneg _))
        · exact h0
      have hs : ‖b‖ * ‖c - a‖ < 1 := by
        have h3 := mul_lt_mul_of_pos_left h hb
        rwa [mul_inv_cancel₀ hb.ne'] at h3
      have ht : ‖b * (a - c)‖ ≤ ‖b‖ * ‖c - a‖ := by
        simpa [norm_sub_rev] using norm_mul_le b (a - c)
      have ht1 : ‖b * (a - c)‖ < 1 := lt_of_le_of_lt ht hs
      have hc : c = a * (1 - b * (a - c)) := by
        rw [mul_sub, mul_one, ← mul_assoc, hab, one_mul]; abel
      have hu1 := geom_series_mul_neg (b * (a - c)) ht1
      have hu2 := mul_neg_geom_series (b * (a - c)) ht1
      have hu3 := tsum_geometric_le_of_norm_lt_one (b * (a - c)) ht1
      rw [norm_one, sub_self, zero_add] at hu3
      refine ⟨(∑' n, (b * (a - c)) ^ n) * b, ?_, ?_, ?_⟩
      · calc c * ((∑' n, (b * (a - c)) ^ n) * b) = a * (1 - b * (a - c)) * ((∑' n, (b * (a - c)) ^ n) * b) := by rw [← hc]
          _ = a * (((1 - b * (a - c)) * ∑' n, (b * (a - c)) ^ n) * b) := by simp only [mul_assoc]
          _ = 1 := by rw [hu2, one_mul, hab]
      · calc (∑' n, (b * (a - c)) ^ n) * b * c = (∑' n, (b * (a - c)) ^ n) * b * (a * (1 - b * (a - c))) := by rw [← hc]
          _ = (∑' n, (b * (a - c)) ^ n) * (b * a) * (1 - b * (a - c)) := by simp only [mul_assoc]
          _ = 1 := by rw [hba, mul_one, hu1]
      · have h1 : 0 < 1 - ‖b‖ * ‖c - a‖ := by linarith
        have h2 : (1 - ‖b * (a - c)‖)⁻¹ ≤ (1 - ‖b‖ * ‖c - a‖)⁻¹ := by
          apply inv_anti₀ h1; linarith
        calc ‖(∑' n, (b * (a - c)) ^ n) * b‖ ≤ ‖∑' n, (b * (a - c)) ^ n‖ * ‖b‖ := norm_mul_le _ _
          _ ≤ (1 - ‖b‖ * ‖c - a‖)⁻¹ * ‖b‖ := by gcongr; exact hu3.trans h2
          _ = ‖b‖ / (1 - ‖b‖ * ‖c - a‖) := by rw [div_eq_inv_mul]
- id: fa_resolvent_identity
  kind: gap
  level: 4
  topic: 作用素論・レゾルベント
  statement: $A$を$\mathbb{C}$上の単位的多元環、$a\in A$、$s,t$を$a$のレゾルベント集合の点とし、$R(z)=(z-a)^{-1}$とする。第一レゾルベント等式$R(s)-R(t)=(t-s)R(s)R(t)$が成り立つ。
  statement_en: For an element a of a unital complex algebra and s, t in the resolvent set, with R(z) = (z - a)⁻¹, one has R(s) - R(t) = (t - s) R(s) R(t).
  assumptions:
  - $A$は$\mathbb{C}$上の単位的多元環
  - $s,t$は$a$のレゾルベント集合の点
  - $R(z)=(z-a)^{-1}$
  quantifiers:
  - 任意の$A$、$a\in A$、$s,t$
  conclusion: $R(s)-R(t)=(t-s)R(s)R(t)$である。
  answer: |
    $A$を$\mathbb{C}$上の単位的多元環、$a\in A$とし、$z=s,t$で$z-a$が可逆であるとする。$R(z)=(z-a)^{-1}$とおく。

    $(t-a)-(s-a)=t-s$である。この式に左から$R(s)$、右から$R(t)$を掛けると、左辺は$R(s)(t-a)R(t)-R(s)(s-a)R(t)=R(s)-R(t)$となり、右辺は$(t-s)R(s)R(t)$となる。
  strategy: Multiply the identity (t-a) - (s-a) = t-s by R(s) on the left and R(t) on the right.
  sketch:
  - 'derive: Note that (t-a) - (s-a) = t-s.'
  - 'derive: Multiply on the left by R(s) and on the right by R(t).'
  - 'conclude: The left side simplifies to R(s) - R(t).'
  openmath: (forall (A a s t) (-> (and (complex_unital_algebra A) (in a A) (in s (resolvent_set a)) (in t (resolvent_set a))) (= (- (resolvent_value a s) (resolvent_value a t)) (* (- t s) (* (resolvent_value a s) (resolvent_value a t))))))
  hard_negative:
    statement: $R(s)-R(t)=(s-t)R(s)R(t)$である。
    reason: $A=\mathbb{C}$、$a=0$、$s=1$、$t=2$では$R(s)-R(t)=1/2$だが$(s-t)R(s)R(t)=-1/2$である。
  target: |
    ∀ (A : Type*) [Ring A] [Algebra ℂ A] (a : A) (s t : ℂ), s ∈ resolventSet ℂ a → t ∈ resolventSet ℂ a → resolvent a s - resolvent a t = (t - s) • (resolvent a s * resolvent a t)
  proof: |
    by
      intro A _ _ a s t hs ht
      have hs' : IsUnit (algebraMap ℂ A s - a) := hs
      have ht' : IsUnit (algebraMap ℂ A t - a) := ht
      obtain ⟨u, hu⟩ := hs'
      obtain ⟨v, hv⟩ := ht'
      have hrs : resolvent a s = ((u⁻¹ : Aˣ) : A) := by
        simp [resolvent, ← hu]
      have hrt : resolvent a t = ((v⁻¹ : Aˣ) : A) := by
        simp [resolvent, ← hv]
      rw [hrs, hrt]
      have key : (t - s) • (1 : A) = (v : A) - (u : A) := by
        rw [hu, hv, sub_smul, Algebra.algebraMap_eq_smul_one, Algebra.algebraMap_eq_smul_one]; abel
      have : (t - s) • (((u⁻¹ : Aˣ) : A) * ((v⁻¹ : Aˣ) : A)) = ((u⁻¹ : Aˣ) : A) * ((t - s) • (1 : A)) * ((v⁻¹ : Aˣ) : A) := by
        simp
      rw [this, key, mul_sub, sub_mul]
      simp
- id: fa_spectrum_affine_map
  kind: gap
  level: 4
  topic: 作用素論・スペクトルの基本操作
  statement: $A$を$\mathbb{C}$上の単位的多元環、$a\in A$、$k,r\in\mathbb{C}$、$k\neq 0$とする。$\sigma(ka+r)=\{kz+r:z\in\sigma(a)\}$である。
  statement_en: For an element a of a unital complex algebra and complex numbers k ≠ 0 and r, the spectrum of ka + r equals the image of the spectrum of a under z ↦ kz + r.
  assumptions:
  - $A$は$\mathbb{C}$上の単位的多元環
  - $a\in A$
  - $k,r\in\mathbb{C}$、$k\neq 0$
  quantifiers:
  - 任意の$A,a,k,r$
  conclusion: $\sigma(ka+r)=\{kz+r:z\in\sigma(a)\}$である。
  answer: |
    $A$を$\mathbb{C}$上の単位的多元環、$a\in A$、$k\neq 0$、$r\in\mathbb{C}$とする。

    $w\in\mathbb{C}$に対し$z=(w-r)/k$とおくと、$w=kz+r$であり、$w-(ka+r)=k(z-a)$である。$k\neq 0$なので、$w-(ka+r)$が可逆であることと$z-a$が可逆であることは同値である。

    したがって$w\in\sigma(ka+r)$であることと$(w-r)/k\in\sigma(a)$は同値である。$z\mapsto kz+r$は$\mathbb{C}$の全単射なので、$\sigma(ka+r)=\{kz+r:z\in\sigma(a)\}$を得る。
  strategy: Rewrite w - (ka + r) as k(z - a) with z = (w - r)/k.
  sketch:
  - 'setup: For w put z = (w-r)/k.'
  - 'derive: Then w - (ka+r) = k(z-a).'
  - 'conclude: Since k is invertible, the two invertibility conditions agree.'
  openmath: (forall (A a k r) (-> (and (complex_unital_algebra A) (in a A) (in k C) (in r C) (!= k 0)) (forall (w) (<-> (in w (spectrum_of (+ (* k a) (* r (unit_of A))))) (exists (z) (and (in z (spectrum_of a)) (= w (+ (* k z) r))))))))
  hard_negative:
    statement: $k=0$でも$\sigma(ka+r)=\{kz+r:z\in\sigma(a)\}$である。
    reason: $A=\mathbb{C}(x)$、$a=x$では$\sigma(a)=\emptyset$なので右辺は空だが、左辺は$\sigma(r)=\{r\}$である。
  target: |
    ∀ (A : Type*) [Ring A] [Algebra ℂ A] (a : A) (k r : ℂ), k ≠ 0 → spectrum ℂ (k • a + algebraMap ℂ A r) = (fun z => k * z + r) '' spectrum ℂ a
  proof: |
    by
      intro A _ _ a k r hk
      rw [← spectrum.add_singleton_eq]
      have h := spectrum.unit_smul_eq_smul (R := ℂ) a (Units.mk0 k hk)
      have h' : spectrum ℂ (k • a) = spectrum ℂ (Units.mk0 k hk • a) := rfl
      rw [h', h]
      ext z
      simp only [Set.mem_add, Set.mem_singleton_iff, Set.mem_smul_set, Set.mem_image]
      constructor
      · rintro ⟨_, ⟨w, hw, rfl⟩, _, rfl, rfl⟩
        exact ⟨w, hw, rfl⟩
      · rintro ⟨w, hw, rfl⟩
        exact ⟨_, ⟨w, hw, rfl⟩, _, rfl, rfl⟩
- id: fa_spectrum_mul_comm_nonzero
  kind: gap
  level: 4
  topic: 作用素論・スペクトルの基本操作
  statement: $A$を$\mathbb{C}$上の単位的多元環、$a,b\in A$、$z\neq 0$とする。$z\in\sigma(ab)$と$z\in\sigma(ba)$は同値である。
  statement_en: For elements a and b of a unital complex algebra and z ≠ 0, z lies in the spectrum of ab if and only if it lies in the spectrum of ba.
  assumptions:
  - $A$は$\mathbb{C}$上の単位的多元環
  - $a,b\in A$
  - $z\in\mathbb{C}$、$z\neq 0$
  quantifiers:
  - 任意の$A,a,b,z$
  conclusion: $z\in\sigma(ab)\iff z\in\sigma(ba)$である。
  answer: |
    $A$を$\mathbb{C}$上の単位的多元環、$a,b\in A$、$z\neq 0$とする。対称性から、$z-ab$が可逆なら$z-ba$も可逆であることを示せばよい。

    $c=(z-ab)^{-1}$とおき、$d=z^{-1}(1+bca)$と定める。$c(z-ab)=(z-ab)c=1$を使うと
    $(z-ba)(1+bca)=z-ba+b(z-ab)ca=z-ba+ba=z$
    であり、同様に
    $(1+bca)(z-ba)=z-ba+bc(z-ab)a=z-ba+ba=z$
    である。よって$d$は$z-ba$の両側逆元である。
  strategy: Write down the explicit inverse of z - ba from the inverse of z - ab.
  sketch:
  - 'setup: Let c be the inverse of z - ab.'
  - 'construct: Put d = z⁻¹(1 + bca).'
  - 'derive: Direct expansion gives (z-ba)d = d(z-ba) = 1.'
  - 'conclude: By symmetry the two invertibility conditions are equivalent.'
  openmath: (forall (A a b z) (-> (and (complex_unital_algebra A) (in a A) (in b A) (in z C) (!= z 0)) (<-> (in z (spectrum_of (* a b))) (in z (spectrum_of (* b a))))))
  hard_negative:
    statement: $z=0$でも$0\in\sigma(ab)$と$0\in\sigma(ba)$は同値である。
    reason: $\ell^2$上で$a$を右シフト、$b$を左シフトとすると$ba=I$で$0\notin\sigma(ba)$だが、$ab$は単射でないので$0\in\sigma(ab)$である。
  target: |
    ∀ (A : Type*) [Ring A] [Algebra ℂ A] (a b : A) (z : ℂ), z ≠ 0 → (z ∈ spectrum ℂ (a * b) ↔ z ∈ spectrum ℂ (b * a))
  proof: |
    by
      intro A _ _ a b z hz
      exact spectrum.unit_mem_mul_comm (R := ℂ) (a := a) (b := b) (r := Units.mk0 z hz)
- id: fa_spectrum_polynomial_mapping
  kind: textbook
  level: 4
  topic: 作用素論・スペクトル写像定理
  statement: $A$を$0$でない複素バナッハ環、$a\in A$、$p$を複素係数多項式とする。$\sigma(p(a))=p(\sigma(a))$である。スペクトルが空でないことは既習とする。
  statement_en: For an element a of a nontrivial complex Banach algebra and a complex polynomial p, the spectrum of p(a) equals p applied to the spectrum of a. Nonemptiness of the spectrum is taken as known.
  assumptions:
  - $A$は$0$でない複素バナッハ環
  - $a\in A$
  - $p$は複素係数多項式
  - スペクトルが空でないことは既習
  quantifiers:
  - 任意の$A,a,p$
  conclusion: $\sigma(p(a))=p(\sigma(a))$である。
  answer: |
    $A$を$0$でない複素バナッハ環、$a\in A$、$p$を複素係数多項式とする。

    $p$が定数$c$のときは$p(a)=c\cdot 1$なので$\sigma(p(a))=\{c\}$である。$\sigma(a)\neq\emptyset$なので$p(\sigma(a))=\{c\}$でもある。

    $p$が定数でないとする。$\lambda\in\mathbb{C}$に対し代数学の基本定理から$p(X)-\lambda=\alpha\prod_{i=1}^n(X-\mu_i)$（$\alpha\neq 0$）と分解できる。$\lambda=p(z)$となる$z$は$\mu_1,\dots,\mu_n$に限られる。代入すると$p(a)-\lambda=\alpha\prod_i(a-\mu_i)$である。

    これらの因子は互いに可換である。可換な元の積が可逆であることと各因子が可逆であることは同値である。実際、積$xy$（$xy=yx$）の逆元$w$があれば$x(yw)=1$かつ$(wy)x=1$となるので$x$は可逆である。したがって$\lambda\in\sigma(p(a))$であることと、ある$i$で$\mu_i\in\sigma(a)$であることは同値である。後者は$\lambda\in p(\sigma(a))$と同値である。
  strategy: Factor p - λ into linear factors and use that commuting products are invertible exactly when each factor is.
  sketch:
  - 'case_split: Treat constant p using nonemptiness of the spectrum.'
  - 'derive: Otherwise factor p(X) - λ as α times the product of X - μ_i.'
  - 'derive: Substituting a gives p(a) - λ as a commuting product.'
  - 'derive: A commuting product is invertible if and only if each factor is.'
  - 'conclude: λ is in the spectrum of p(a) exactly when some μ_i is in the spectrum of a.'
  openmath: (forall (A a p) (-> (and (complex_banach_algebra A) (nontrivial_ring A) (in a A) (complex_polynomial p)) (forall (w) (<-> (in w (spectrum_of (polynomial_eval p a))) (exists (z) (and (in z (spectrum_of a)) (= w (polynomial_eval p z))))))))
  hard_negative:
    statement: $\sigma(ab)=\sigma(a)\sigma(b)$である。
    reason: $a=\mathrm{diag}(1,0)$、$b=\mathrm{diag}(0,1)$では$\sigma(ab)=\{0\}$だが、$\sigma(a)\sigma(b)=\{0,1\}$である。
  target: |
    ∀ (A : Type*) [NormedRing A] [NormedAlgebra ℂ A] [CompleteSpace A] [Nontrivial A] (a : A) (p : Polynomial ℂ), spectrum ℂ (Polynomial.aeval a p) = (fun z => Polynomial.eval z p) '' spectrum ℂ a
  proof: |
    by
      intro A _ _ _ _ a p
      exact spectrum.map_polynomial_aeval a p
- id: fa_resolvent_norm_ge_inv_dist_spectrum
  kind: gap
  level: 4
  topic: 作用素論・レゾルベント
  statement: $A$を$\|1\|=1$の複素バナッハ環、$a\in A$、$l$を$a$のレゾルベント集合の点、$z\in\sigma(a)$とする。$\|(l-a)^{-1}\|^{-1}\leq|l-z|$である。すなわちレゾルベントのノルムはスペクトルへの距離の逆数以上である。
  statement_en: For a in a complex Banach algebra with ‖1‖ = 1, l in the resolvent set and z in the spectrum, ‖(l-a)⁻¹‖⁻¹ ≤ |l - z|. So the norm of the resolvent is at least the reciprocal of the distance to the spectrum.
  assumptions:
  - $A$は$\|1\|=1$の複素バナッハ環
  - $a\in A$
  - $l$は$a$のレゾルベント集合の点
  - $z\in\sigma(a)$
  quantifiers:
  - 任意の$A,a,l,z$
  conclusion: $\|(l-a)^{-1}\|^{-1}\leq|l-z|$である。
  answer: |
    $A$を$\|1\|=1$の複素バナッハ環、$a\in A$、$l-a$を可逆、$z\in\sigma(a)$とする。

    $|l-z|<\|(l-a)^{-1}\|^{-1}$と仮定して矛盾を導く。$(z-a)-(l-a)=(z-l)\cdot 1$であり、$\|1\|=1$よりこのノルムは$|l-z|$である。したがって$\|(z-a)-(l-a)\|<\|(l-a)^{-1}\|^{-1}$である。

    可逆元$x$と$\|y-x\|<\|x^{-1}\|^{-1}$を満たす$y$について$y$は可逆である（$y=x(1-x^{-1}(x-y))$とノイマン級数による）。$x=l-a$、$y=z-a$に適用すると$z-a$は可逆であり、$z\in\sigma(a)$に反する。
  strategy: A point of the spectrum cannot be within the invertibility radius around l - a.
  sketch:
  - 'contradiction: Suppose |l-z| is smaller than the reciprocal of the resolvent norm.'
  - 'derive: Then z-a is within that radius of the invertible element l-a.'
  - 'apply_theorem: The Neumann series shows z-a is invertible.'
  - 'conclude: This contradicts z being in the spectrum.'
  openmath: (forall (A a l z) (-> (and (complex_banach_algebra A) (= (norm (unit_of A)) 1) (in a A) (in l (resolvent_set a)) (in z (spectrum_of a))) (<= (/ 1 (norm (resolvent_value a l))) (abs (- l z)))))
  hard_negative:
    statement: 常に$\|(l-a)^{-1}\|=1/\mathrm{dist}(l,\sigma(a))$である。
    reason: 冪零行列$a=\begin{pmatrix}0&1\\0&0\end{pmatrix}$と$l=1$では$\sigma(a)=\{0\}$で右辺は$1$だが、$(1-a)^{-1}=1+a$のノルムは$1$より大きい。等号は正規元などで成り立つ。
  target: |
    ∀ (A : Type*) [NormedRing A] [NormedAlgebra ℂ A] [NormOneClass A] [CompleteSpace A] (a : A) (l z : ℂ), l ∈ resolventSet ℂ a → z ∈ spectrum ℂ a → ‖resolvent a l‖⁻¹ ≤ ‖l - z‖
  proof: |
    by
      intro A _ _ _ _ a l z hl hz
      by_contra hlt
      push Not at hlt
      have hl' : IsUnit (algebraMap ℂ A l - a) := hl
      obtain ⟨u, hu⟩ := hl'
      have hr : resolvent a l = ((u⁻¹ : Aˣ) : A) := by simp [resolvent, ← hu]
      rw [hr] at hlt
      have hnorm : ‖(algebraMap ℂ A z - a) - (u : A)‖ < ‖((u⁻¹ : Aˣ) : A)‖⁻¹ := by
        rw [hu]
        have : algebraMap ℂ A z - a - (algebraMap ℂ A l - a) = algebraMap ℂ A (z - l) := by
          rw [map_sub]; abel
        rw [this, norm_algebraMap', norm_sub_rev]
        exact hlt
      exact hz (Units.ofNearby u _ hnorm).isUnit |>.elim
- id: fa_gelfand_mazur_division
  kind: named
  level: 4
  topic: 作用素論・ゲルファント・マズールの定理
  statement: ゲルファント・マズールの定理。$A$を$\|1\|=1$の複素バナッハ環とし、$0$以外の元がすべて可逆で$0$は可逆でないとする。$z\mapsto z\cdot 1$は$\mathbb{C}$から$A$への全単射である。スペクトルが空でないことは既習とする。
  statement_en: Gelfand–Mazur theorem. If A is a complex Banach algebra with ‖1‖ = 1 in which an element is invertible exactly when it is nonzero, then z ↦ z·1 is a bijection from ℂ onto A. Nonemptiness of the spectrum is taken as known.
  assumptions:
  - $A$は$\|1\|=1$の複素バナッハ環
  - $a\in A$が可逆であることと$a\neq 0$は同値
  - スペクトルが空でないことは既習
  quantifiers:
  - 任意の$A$
  conclusion: $z\mapsto z\cdot 1$は$\mathbb{C}$から$A$への全単射である。
  answer: |
    $A$を$\|1\|=1$の複素バナッハ環とし、$a$が可逆であることと$a\neq 0$が同値であるとする。

    $\|1\|=1$より$1\neq 0$なので$A\neq 0$である。$z\cdot 1=w\cdot 1$なら$(z-w)\cdot 1=0$であり、ノルムをとって$z=w$となる。よって単射である。

    $a\in A$をとる。$\sigma(a)$は空でないので$z\in\sigma(a)$がとれる。$z-a$は可逆でないから、仮定より$z-a=0$である。すなわち$a=z\cdot 1$であり、全射である。
  strategy: An element of the spectrum forces z - a to be zero because every nonzero element is invertible.
  sketch:
  - 'derive: The map is injective since ‖z·1‖ = |z|.'
  - 'apply_theorem: For a in A the spectrum is nonempty, so choose z in it.'
  - 'derive: z - a is not invertible, hence equals 0.'
  - 'conclude: a = z·1, so the map is surjective.'
  openmath: (forall (A) (-> (and (complex_banach_algebra A) (= (norm (unit_of A)) 1) (forall (a) (-> (in a A) (<-> (unit_element a A) (!= a 0))))) (forall (a) (-> (in a A) (exists (z) (and (in z C) (= a (* z (unit_of A))) (forall (w) (-> (and (in w C) (= a (* w (unit_of A)))) (= w z)))))))))
  hard_negative:
    statement: 実バナッハ環で$0$以外がすべて可逆なら$\mathbb{R}$と同型である。
    reason: $\mathbb{C}$や四元数体は実バナッハ環として$0$以外が可逆だが、$\mathbb{R}$と同型でない。
  target: |
    ∀ (A : Type*) [NormedRing A] [NormOneClass A] [NormedAlgebra ℂ A] [CompleteSpace A], (∀ a : A, IsUnit a ↔ a ≠ 0) → Function.Bijective (algebraMap ℂ A)
  proof: |
    by
      intro A _ _ _ _ h
      exact (NormedRing.algEquivComplexOfComplete (fun {a} => h a)).bijective
- id: fa_norm_le_of_dual_bound
  kind: gap
  level: 4
  topic: 関数解析・ハーン・バナッハの系
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のノルム空間、$x\in E$、$M\geq 0$とする。全ての有界線形汎関数$f$で$|f(x)|\leq M\|f\|$ならば$\|x\|\leq M$である。
  statement_en: Let E be a normed space over ℝ or ℂ, x in E and M ≥ 0. If |f(x)| ≤ M‖f‖ for every bounded linear functional f, then ‖x‖ ≤ M.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $x\in E$、$M\geq 0$
  - 全ての$f\in E'$で$|f(x)|\leq M\|f\|$
  quantifiers:
  - 任意の$E,x,M$
  conclusion: $\|x\|\leq M$である。
  answer: |
    $E$をノルム空間、$x\in E$、$M\geq 0$とし、全ての$f\in E'$で$|f(x)|\leq M\|f\|$とする。

    $x=0$なら$\|x\|=0\leq M$である。$x\neq 0$とする。ハーン・バナッハの定理の系により、$\|f\|=1$かつ$f(x)=\|x\|$となる$f\in E'$が存在する。この$f$に仮定を適用すると$\|x\|=|f(x)|\leq M\|f\|=M$である。
  strategy: Apply the hypothesis to a norming functional of x.
  sketch:
  - 'case_split: The case x = 0 is immediate.'
  - 'apply_theorem: Hahn-Banach gives f with ‖f‖ = 1 and f(x) = ‖x‖.'
  - 'conclude: The hypothesis for this f gives ‖x‖ ≤ M.'
  openmath: (forall (E x M) (-> (and (normed_space E) (in x E) (>= M 0) (forall (f) (-> (in f (dual_space E)) (<= (abs (fn_value f x)) (* M (norm f)))))) (<= (norm x) M)))
  hard_negative:
    statement: ある一つの$f\neq 0$で$|f(x)|\leq M\|f\|$ならば$\|x\|\leq M$である。
    reason: $E=\mathbb{R}^2$、$x=e_1$、$f(y)=y_2$、$M=0$では$|f(x)|=0\leq M\|f\|$だが$\|x\|=1>M$である。全ての$f$についての仮定が要る。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] (x : E) (M : ℝ), 0 ≤ M → (∀ f : StrongDual 𝕜 E, ‖f x‖ ≤ M * ‖f‖) → ‖x‖ ≤ M
  proof: |
    by
      intro 𝕜 _ E _ _ x M hM h
      exact NormedSpace.norm_le_dual_bound 𝕜 x hM h
- id: fa_hb_functional_distance_to_subspace
  kind: gap
  level: 4
  topic: 関数解析・ハーン・バナッハの系
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のノルム空間、$M$を閉部分空間、$x\notin M$とする。有界線形汎関数$f$で、$\|f\|=1$、$M$上で$f=0$、$f(x)=\mathrm{dist}(x,M)$となるものが存在する。
  statement_en: Let M be a closed subspace of a normed space E over ℝ or ℂ and x not in M. There is a bounded linear functional f with ‖f‖ = 1, f = 0 on M, and f(x) = dist(x, M).
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $M$は$E$の閉部分空間
  - $x\notin M$
  quantifiers:
  - 任意の$E,M,x$
  conclusion: $\|f\|=1$、$f|_M=0$、$f(x)=\mathrm{dist}(x,M)$となる$f\in E'$が存在する。
  answer: |
    $E$をノルム空間、$M$を閉部分空間、$x\notin M$とし、$d=\mathrm{dist}(x,M)$とおく。$M$は閉なので$d>0$である。

    $M_0=M+\mathbb{K}x$上で$g(m+cx)=cd$と定める。$x\notin M$なのでこれは矛盾なく定まる線形汎関数である。$c\neq 0$のとき$\|m+cx\|=|c|\|x+c^{-1}m\|\geq|c|d$なので$|g(m+cx)|\leq\|m+cx\|$であり、$\|g\|\leq 1$である。ハーン・バナッハの定理により$g$は$\|f\|=\|g\|$を満たす$f\in E'$に拡張できる。

    $f$は$M$上で$0$であり、$f(x)=d$である。$\|f\|\leq 1$である。また$m_n\in M$を$\|x-m_n\|\to d$となるようにとると、$d=f(x-m_n)\leq\|f\|\|x-m_n\|$であり、$n\to\infty$として$d\leq\|f\|d$を得る。$d>0$より$\|f\|\geq 1$である。よって$\|f\|=1$である。
  strategy: Define the functional on M + 𝕂x, bound it using the distance, and extend by Hahn-Banach.
  sketch:
  - 'setup: The distance d from x to M is positive because M is closed.'
  - 'construct: Define g(m + cx) = cd on M + 𝕂x.'
  - 'derive: The inequality ‖m + cx‖ ≥ |c|d gives ‖g‖ ≤ 1.'
  - 'apply_theorem: Extend g to f in the dual with the same norm.'
  - 'derive: Testing on x - m_n with ‖x - m_n‖ → d gives ‖f‖ ≥ 1.'
  - 'conclude: f has norm 1, vanishes on M and f(x) = d.'
  openmath: (forall (E M x) (-> (and (normed_space E) (subspace_of M E) (closed_set M) (in x E) (notin x M)) (exists (f) (and (in f (dual_space E)) (= (norm f) 1) (forall (m) (-> (in m M) (= (fn_value f m) 0))) (= (fn_value f x) (dist_to_set x M))))))
  hard_negative:
    statement: $M$が閉でなくても、$x\notin M$なら$M$上で$0$かつ$f(x)\neq 0$となる有界線形汎関数$f$が存在する。
    reason: $M$が稠密な真部分空間で$x\notin M$のとき、$M$上で$0$の有界線形汎関数は連続性から$0$しかない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] (M : Submodule 𝕜 E) (x : E), IsClosed (M : Set E) → x ∉ M → ∃ f : StrongDual 𝕜 E, ‖f‖ = 1 ∧ (∀ m ∈ M, f m = 0) ∧ f x = (Metric.infDist x (M : Set E) : 𝕜)
  proof: |
    by
      intro 𝕜 _ E _ _ M x hM hx
      have hq : ‖(Submodule.Quotient.mk x : E ⧸ M)‖ = Metric.infDist x (M : Set E) := QuotientAddGroup.norm_mk x
      have hd : 0 < Metric.infDist x (M : Set E) := by
        rw [lt_iff_le_and_ne]
        refine ⟨Metric.infDist_nonneg, fun h => hx ?_⟩
        exact (hM.mem_iff_infDist_zero ⟨0, M.zero_mem⟩).mpr h.symm
      haveI : IsClosed (M.toAddSubgroup : Set E) := hM
      have hne : ‖(Submodule.Quotient.mk x : E ⧸ M)‖ ≠ 0 := by
        rw [hq]; exact hd.ne'
      obtain ⟨g, hg1, hg2⟩ := exists_dual_vector 𝕜 (Submodule.Quotient.mk x : E ⧸ M) hne
      let π : E →L[𝕜] (E ⧸ M) := M.mkQ.mkContinuous 1 (fun y => by
        simpa using Submodule.Quotient.norm_mk_le M y)
      have hπ : ∀ y, π y = Submodule.Quotient.mk y := fun y => rfl
      have hfx : (g.comp π) x = (Metric.infDist x (M : Set E) : 𝕜) := by
        rw [ContinuousLinearMap.comp_apply, hπ, hg2, hq]
      refine ⟨g.comp π, ?_, ?_, hfx⟩
      · apply le_antisymm
        · refine ContinuousLinearMap.opNorm_le_bound _ zero_le_one fun y => ?_
          rw [one_mul, ContinuousLinearMap.comp_apply, hπ]
          calc ‖g (Submodule.Quotient.mk y)‖ ≤ ‖g‖ * ‖(Submodule.Quotient.mk y : E ⧸ M)‖ := g.le_opNorm _
            _ = ‖(Submodule.Quotient.mk y : E ⧸ M)‖ := by rw [hg1, one_mul]
            _ ≤ ‖y‖ := Submodule.Quotient.norm_mk_le M y
        · have hF : ∀ m ∈ M, Metric.infDist x (M : Set E) ≤ ‖g.comp π‖ * ‖x - m‖ := by
            intro m hm
            have h0 : (g.comp π) m = 0 := by
              rw [ContinuousLinearMap.comp_apply, hπ, (Submodule.Quotient.mk_eq_zero M).mpr hm, map_zero]
            have h1 : ‖(g.comp π) (x - m)‖ = Metric.infDist x (M : Set E) := by
              rw [map_sub, h0, sub_zero, hfx]; simp [abs_of_nonneg Metric.infDist_nonneg]
            rw [← h1]; exact ContinuousLinearMap.le_opNorm _ _
          have hpos : 0 < ‖g.comp π‖ := by
            have h2 := hF 0 M.zero_mem
            by_contra h3
            have h4 : ‖g.comp π‖ = 0 := le_antisymm (not_lt.mp h3) (norm_nonneg _)
            rw [h4, zero_mul] at h2
            linarith
          have hle : Metric.infDist x (M : Set E) / ‖g.comp π‖ ≤ Metric.infDist x (M : Set E) := by
            rw [Metric.le_infDist ⟨0, M.zero_mem⟩]
            intro y hy
            rw [div_le_iff₀ hpos, mul_comm, dist_eq_norm]
            exact hF y hy
          rw [div_le_iff₀ hpos] at hle
          have h5 := le_of_mul_le_mul_left (by simpa using hle : Metric.infDist x (M : Set E) * 1 ≤ Metric.infDist x (M : Set E) * ‖g.comp π‖) hd
          exact h5
      · intro m hm
        rw [ContinuousLinearMap.comp_apply, hπ, (Submodule.Quotient.mk_eq_zero M).mpr hm, map_zero]
- id: fa_hb_sublinear_extension
  kind: named
  level: 4
  topic: 関数解析・ハーン・バナッハの定理
  statement: ハーン・バナッハの定理の劣線形汎関数による形。$E$を実線形空間、$N:E\to\mathbb{R}$を$N(cx)=cN(x)$（$c>0$）と$N(x+y)\leq N(x)+N(y)$を満たす写像、$f$を部分空間$D$上の線形汎関数で$D$上$f\leq N$とする。$E$全体の線形汎関数$g$で、$D$上$g=f$かつ$E$上$g\leq N$となるものが存在する。$E$が実ノルム空間で$f$が有界なら、$N(x)=\|f\|\|x\|$として$f$のノルムを保つ拡張を得る。ゾルンの補題は既習とする。
  statement_en: Hahn-Banach theorem, sublinear form. Let E be a real vector space, N a function with N(cx) = cN(x) for c > 0 and N(x+y) ≤ N(x)+N(y), and f a linear functional on a subspace D with f ≤ N on D. Then f extends to a linear functional g on E with g ≤ N. On a real normed space, N(x) = ‖f‖‖x‖ gives the norm-preserving extension of a bounded f. Zorn's lemma is taken as known.
  assumptions:
  - $E$は実線形空間
  - $N(cx)=cN(x)$（$c>0$）、$N(x+y)\leq N(x)+N(y)$
  - $f$は部分空間$D$上の線形汎関数で$D$上$f\leq N$
  - ゾルンの補題は既習
  quantifiers:
  - 任意の$E,N,D,f$
  conclusion: $D$上$g=f$かつ$E$上$g\leq N$となる線形汎関数$g:E\to\mathbb{R}$が存在する。
  answer: |
    $E$を実線形空間、$N$を上の条件を満たす写像、$f$を部分空間$D$上の線形汎関数で$f\leq N$とする。

    一次元の拡張を示す。$D'\subsetneq E$上の線形汎関数$h\leq N$と$v\notin D'$をとる。$x,y\in D'$について$h(x)+h(y)=h(x+y)\leq N(x-v)+N(y+v)$なので、$h(x)-N(x-v)\leq N(y+v)-h(y)$である。そこで$\sup_x(h(x)-N(x-v))\leq\alpha\leq\inf_y(N(y+v)-h(y))$となる$\alpha$をとり、$h'(x+tv)=h(x)+t\alpha$と定める。$t=0$では$h\leq N$そのものである。$t>0$なら$y=x/t$を使い$h(x)+t\alpha\leq tN(x/t+v)=N(x+tv)$である。$t<0$なら$s=-t$、$x'=x/s$を使い$h(x)-s\alpha=s(h(x')-\alpha)\leq sN(x'-v)=N(x+tv)$である。よって$h'\leq N$である。

    $f$の拡張で$N$以下のもの全体に拡張関係で順序を入れる。鎖の上界は定義域の合併上の共通の拡張で与えられる。ゾルンの補題により極大元$g$が存在する。定義域が$E$でなければ一次元の拡張が極大性に反するので、$g$は$E$全体で定義される。
  strategy: Extend by one dimension using a suitable value α and conclude with Zorn's lemma.
  sketch:
  - 'derive: For h ≤ N on D'' and v outside D'', sublinearity separates the two bounds for the value at v.'
  - 'construct: Pick α between them and set h''(x + tv) = h(x) + tα.'
  - 'case_split: Check h'' ≤ N separately for t > 0 and t < 0 by homogeneity.'
  - 'apply_theorem: Zorn gives a maximal extension dominated by N.'
  - 'conclude: Maximality forces the domain to be all of E.'
  openmath: (forall (E q D f) (-> (and (real_vector_space E) (sublinear_functional q E) (subspace_of D E) (linear_operator f D R) (forall (x) (-> (in x D) (<= (fn_value f x) (fn_value q x))))) (exists (g) (and (linear_operator g E R) (restricts_to g D f) (forall (x) (-> (in x E) (<= (fn_value g x) (fn_value q x))))))))
  hard_negative:
    statement: $g$は常に一意に定まる。
    reason: $E=\mathbb{R}^2$、$N(x)=\|x\|$、$D=\mathbb{R}e_1$、$f(te_1)=0$とすると、$g(x)=cx_2$（$|c|\leq 1$）はすべて条件を満たす。
  target: |
    ∀ (E : Type*) [AddCommGroup E] [Module ℝ E] (f : E →ₗ.[ℝ] ℝ) (N : E → ℝ), (∀ c : ℝ, 0 < c → ∀ x, N (c • x) = c * N x) → (∀ x y, N (x + y) ≤ N x + N y) → (∀ x : f.domain, f x ≤ N x) → ∃ g : E →ₗ[ℝ] ℝ, (∀ x : f.domain, g x = f x) ∧ ∀ x, g x ≤ N x
  proof: |
    by
      intro E _ _ f N h1 h2 h3
      exact exists_extension_of_le_sublinear f N h1 h2 h3
- id: fa_separate_open_convex_from_convex
  kind: named
  level: 4
  topic: 関数解析・凸集合の分離定理
  statement: 分離定理。$E$を実位相線形空間、$s,t$を交わらない凸集合、$s$を開集合とする。連続線形汎関数$f$と実数$u$で、全ての$a\in s$で$f(a)<u$、全ての$b\in t$で$u\leq f(b)$となるものが存在する。局所凸空間で点と閉凸集合を分離する形は、点の開凸近傍を$s$とするとここから従う。ハーン・バナッハの定理の劣線形形は既習とする。
  statement_en: Separation theorem. If s and t are disjoint convex subsets of a real topological vector space and s is open, then there are a continuous linear functional f and a real u with f(a) < u on s and u ≤ f(b) on t. Separating a point from a closed convex set in a locally convex space follows by taking s to be a convex open neighbourhood of the point. The sublinear Hahn-Banach theorem is taken as known.
  assumptions:
  - $E$は実位相線形空間
  - $s,t$は交わらない凸集合で$s$は開
  - ハーン・バナッハの定理の劣線形形は既習
  quantifiers:
  - 任意の$E,s,t$
  conclusion: $f(a)<u\leq f(b)$（$a\in s$、$b\in t$）となる連続線形汎関数$f$と実数$u$が存在する。
  answer: |
    $E$を実位相線形空間、$s,t$を交わらない凸集合、$s$を開とする。$s$が空なら$f=0$、$u=0$でよい。$t$が空なら$f=0$、$u=1$でよい。以下$s,t$を空でないとする。$a_0\in s$、$b_0\in t$をとり、$x_0=b_0-a_0$、$C=s-t+x_0$とおく。$C$は$0$を含む開凸集合である。$s,t$は交わらないので$x_0\notin C$である。

    $C$のゲージ$p(x)=\inf\{\lambda>0:x\in\lambda C\}$は正斉次かつ劣加法的であり、$C$上で$p<1$、$p(x_0)\geq 1$である。$\mathbb{R}x_0$上で$g(cx_0)=c$と定めると$g\leq p$である（$c\leq 0$なら$g\le 0\le p$、$c>0$なら$p(cx_0)=cp(x_0)\geq c$）。ハーン・バナッハの定理により$g$は$f\leq p$を満たす線形汎関数$f:E\to\mathbb{R}$に拡張できる。

    $C\cap(-C)$は$0$の近傍であり、その上で$|f|\leq 1$なので$f$は連続である。$a\in s$、$b\in t$について$a-b+x_0\in C$なので$f(a)-f(b)+1<1$、すなわち$f(a)<f(b)$である。$f\neq 0$なので$f(s)$は開区間である。$u=\sup f(s)$とおくと、$f(a)<u\leq f(b)$である。
  strategy: Reduce to separating a point from an open convex set containing 0 with its gauge.
  sketch:
  - 'case_split: Empty sets are immediate.'
  - 'setup: Form the open convex set C = s - t + x₀ containing 0 and not containing x₀.'
  - 'construct: Define g(cx₀) = c, dominated by the gauge p of C.'
  - 'apply_theorem: Extend g to f ≤ p by Hahn-Banach.'
  - 'derive: Boundedness on a neighbourhood of 0 gives continuity, and f(a) < f(b).'
  - 'conclude: Since f(s) is an open interval, u = sup f(s) separates strictly on s.'
  openmath: (forall (E s t) (-> (and (topological_vector_space E) (convex_set s) (open_set s) (convex_set t) (= (inter s t) emptyset)) (exists (f u) (and (continuous_linear_functional f) (forall (a) (-> (in a s) (< (fn_value f a) u))) (forall (b) (-> (in b t) (<= u (fn_value f b))))))))
  hard_negative:
    statement: 交わらない凸集合は、開でなくても連続線形汎関数で$f(a)<u\leq f(b)$と分離できる。
    reason: 無限次元ノルム空間の不連続線形汎関数$\varphi$について、$s=\{\varphi>0\}$と$t=\{\varphi\leq 0\}$は交わらない凸集合でどちらも稠密である。$f(a)<u\leq f(b)$となる連続な$f$があれば、稠密性から$E$全体で$f=u$となり$f=0$、$u=0$であり、$f(a)<u$に反する。
  target: |
    ∀ (E : Type*) [AddCommGroup E] [Module ℝ E] [TopologicalSpace E] [IsTopologicalAddGroup E] [ContinuousSMul ℝ E] (s t : Set E), Convex ℝ s → IsOpen s → Convex ℝ t → Disjoint s t → ∃ (f : StrongDual ℝ E) (u : ℝ), (∀ a ∈ s, f a < u) ∧ ∀ b ∈ t, u ≤ f b
  proof: |
    by
      intro E _ _ _ _ _ s t hs hso ht hd
      exact geometric_hahn_banach_open hs hso ht hd
- id: fa_mazur_weak_limit_in_closed_convex_hull
  kind: gap
  level: 4
  topic: 関数解析・弱収束と凸性
  statement: $E$を実ノルム空間、$(x_n)$を$a\in E$に弱収束する列とする。すなわち全ての有界線形汎関数$f$で$f(x_n)\to f(a)$とする。このとき$a$は$\{x_n\}$の凸包のノルム閉包に属する。
  statement_en: If a sequence (x_n) in a real normed space converges weakly to a, meaning f(x_n) → f(a) for each bounded linear functional f, then a lies in the norm closure of the convex hull of the x_n.
  assumptions:
  - $E$は実ノルム空間
  - 全ての$f\in E'$で$f(x_n)\to f(a)$
  quantifiers:
  - 任意の$E$、列$(x_n)$、$a\in E$
  conclusion: $a$は$\{x_n\}$の凸包のノルム閉包に属する。
  answer: |
    $E$を実ノルム空間、$(x_n)$を$a$に弱収束する列とし、$C$を$\{x_n\}$の凸包のノルム閉包とする。$C$は閉凸集合である。

    $a\notin C$と仮定する。閉凸集合と点の分離定理により、$f\in E'$と実数$u$で、全ての$c\in C$で$f(c)<u$かつ$u<f(a)$となるものが存在する。全ての$n$で$f(x_n)<u$である。$n\to\infty$とすると$f(a)\leq u$となり、$u<f(a)$に反する。よって$a\in C$である。
  strategy: Separate a from the closed convex hull and pass to the limit along the weak convergence.
  sketch:
  - 'setup: Let C be the closed convex hull of the sequence.'
  - 'contradiction: If a is outside C, separation gives f and u with f < u on C and u < f(a).'
  - 'derive: Weak convergence gives f(a) ≤ u.'
  - 'conclude: This contradiction shows a lies in C.'
  openmath: (forall (E x a) (-> (and (normed_space E) (real_vector_space E) (in a E) (weak_tends_to x a)) (in a (closure_of (convex_hull (range_of x))))))
  hard_negative:
    statement: 弱収束する列は、ノルムでも同じ極限に収束する部分列をもつ。
    reason: $\ell^2$の正規直交系$e_n$は$0$に弱収束するが、$\|e_n-e_m\|=\sqrt 2$なのでどの部分列もノルム収束しない。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] (x : ℕ → E) (a : E), (∀ f : StrongDual ℝ E, Filter.Tendsto (fun n => f (x n)) Filter.atTop (nhds (f a))) → a ∈ closure (convexHull ℝ (Set.range x))
  proof: |
    by
      intro E _ _ x a h
      by_contra ha
      obtain ⟨f, u, hf, hu⟩ := geometric_hahn_banach_closed_point (convex_convexHull ℝ (Set.range x)).closure isClosed_closure ha
      have hle : f a ≤ u := le_of_tendsto' (h f) fun n => (hf _ (subset_closure (subset_convexHull ℝ _ ⟨n, rfl⟩))).le
      linarith
- id: fa_finite_dim_subspace_continuous_projection
  kind: gap
  level: 4
  topic: 関数解析・補空間と射影
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のノルム空間、$M$を有限次元部分空間とする。有界線形作用素$P:E\to M$で$M$上恒等となるものが存在する。
  statement_en: A finite-dimensional subspace M of a normed space over ℝ or ℂ admits a bounded linear map P from E to M which is the identity on M.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $M$は$E$の有限次元部分空間
  quantifiers:
  - 任意の$E,M$
  conclusion: 全ての$x\in M$で$Px=x$となる有界線形作用素$P:E\to M$が存在する。
  answer: |
    $E$をノルム空間、$M$を有限次元部分空間とし、$e_1,\dots,e_n$を$M$の基底とする。座標汎関数$g_i:M\to\mathbb{K}$を$x=\sum_i g_i(x)e_i$で定める。

    有限次元空間上の線形写像は連続なので、$g_i$は有界である。ハーン・バナッハの定理により$g_i$は有界線形汎関数$f_i\in E'$に拡張できる。

    $Px=\sum_i f_i(x)e_i$と定める。$P:E\to M$は有界線形である。$x\in M$なら$f_i(x)=g_i(x)$なので$Px=x$である。
  strategy: Extend the coordinate functionals by Hahn-Banach and assemble the projection.
  sketch:
  - 'setup: Take a basis of M and its coordinate functionals.'
  - 'apply_theorem: Coordinates are bounded on a finite-dimensional space and extend by Hahn-Banach.'
  - 'construct: Set Px as the sum of f_i(x) e_i.'
  - 'conclude: P is bounded and is the identity on M.'
  openmath: (forall (E M) (-> (and (normed_space E) (subspace_of M E) (finite_dim_space M)) (exists (p) (and (bounded_operator p E M) (forall (x) (-> (in x M) (= (fn_value p x) x)))))))
  hard_negative:
    statement: バナッハ空間の閉部分空間には常に有界な射影が存在する。
    reason: $c_0$は$\ell^\infty$の閉部分空間だが、有界な射影の値域にならないことが知られている（フィリップスの定理）。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] (M : Submodule 𝕜 E), FiniteDimensional 𝕜 M → ∃ P : E →L[𝕜] M, ∀ x : M, P x = x
  proof: |
    by
      intro 𝕜 _ E _ _ M hM
      exact Submodule.ClosedComplemented.of_finiteDimensional M
- id: fa_closed_complements_continuous_projection
  kind: gap
  level: 4
  topic: 関数解析・補空間と射影
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のバナッハ空間、$M,N$を代数的補空間である閉部分空間とする。$M$上恒等、$N$上$0$で値が$M$に入る有界線形作用素$P:E\to E$が存在する。
  statement_en: If M and N are closed algebraically complementary subspaces of a Banach space E over ℝ or ℂ, there is a bounded linear operator P on E with values in M, equal to the identity on M and to 0 on N.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のバナッハ空間
  - $M,N$は閉部分空間で$E=M\oplus N$（代数的直和）
  quantifiers:
  - 任意の$E,M,N$
  conclusion: $M$上恒等、$N$上$0$、値が$M$に入る有界線形作用素$P$が存在する。
  answer: |
    $E$をバナッハ空間、$M,N$を閉部分空間で$E=M\oplus N$とする。

    $M,N$は閉なのでバナッハ空間であり、$M\times N$に$\|(m,n)\|=\|m\|+\|n\|$を入れるとバナッハ空間である。$A:M\times N\to E$を$A(m,n)=m+n$で定める。$\|A(m,n)\|\leq\|(m,n)\|$なので$A$は有界であり、直和であることから全単射である。有界逆写像定理より$A^{-1}$は有界である。

    $x=m+n$に対し$Px=m$と定める。$P$は$A^{-1}$と第一成分への射影と包含写像の合成なので有界線形である。定義から$M$上で恒等、$N$上で$0$であり、値は$M$に入る。
  strategy: Apply the bounded inverse theorem to the sum map from M × N to E.
  sketch:
  - 'setup: M × N with the sum norm is a Banach space.'
  - 'derive: The map (m, n) to m + n is a bounded bijection onto E.'
  - 'apply_theorem: Its inverse is bounded by the bounded inverse theorem.'
  - 'conclude: Composing with the first projection gives the required P.'
  openmath: (forall (E M L) (-> (and (banach_space E) (subspace_of M E) (subspace_of L E) (closed_set M) (closed_set L) (direct_complement M L E)) (exists (p) (and (bounded_operator p E E) (forall (x) (-> (in x M) (= (fn_value p x) x))) (forall (y) (-> (in y L) (= (fn_value p y) 0))) (forall (x) (-> (in x E) (in (fn_value p x) M)))))))
  hard_negative:
    statement: バナッハ空間の閉部分空間$M,N$が$M\cap N=\{0\}$を満たせば、$M+N$は閉である。
    reason: $\ell^2$で$M$を$e_{2k}$の閉線形包、$N$を$f_k=e_{2k}+k^{-1}e_{2k+1}$の閉線形包とする。$x=\sum_k k^{-1}e_{2k+1}$は$M+N$の閉包に属するが、$x=m+\sum_k c_kf_k$なら奇数成分から$c_k=1$となり$\sum_k|c_k|^2=\infty$なので$M+N$に属さない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [CompleteSpace E] (M N : Submodule 𝕜 E), IsCompl M N → IsClosed (M : Set E) → IsClosed (N : Set E) → ∃ P : E →L[𝕜] E, (∀ x ∈ M, P x = x) ∧ (∀ y ∈ N, P y = 0) ∧ (∀ x, P x ∈ M)
  proof: |
    by
      intro 𝕜 _ E _ _ _ M N hc hM hN
      have ht : Submodule.IsTopCompl M N := Submodule.IsCompl.isTopCompl_of_isClosed hc hM hN
      refine ⟨M.subtypeL.comp (M.projectionOntoL N ht), fun x hx => ?_, fun y hy => ?_, fun x => (M.projectionOntoL N ht x).2⟩
      · have := Submodule.projectionOntoL_apply_left ht ⟨x, hx⟩
        simp [this]
      · have := (Submodule.projectionOntoL_apply_eq_zero_iff ht).mpr hy
        simp [this]
- id: fa_weakly_bounded_set_is_norm_bounded
  kind: gap
  level: 4
  topic: 関数解析・一様有界性の系
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のノルム空間（完備とは限らない）、$S\subset E$とする。全ての有界線形汎関数$f$で$f(S)$が有界ならば、$S$はノルム有界である。
  statement_en: If S is a subset of a normed space over ℝ or ℂ, not necessarily complete, and f(S) is bounded for each bounded linear functional f, then S is norm bounded.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $S\subset E$
  - 各$f\in E'$に対し$C_f$が存在して全ての$x\in S$で$|f(x)|\leq C_f$
  quantifiers:
  - 任意の$E,S$
  conclusion: ある$M$で全ての$x\in S$について$\|x\|\leq M$である。
  answer: |
    $E$をノルム空間、$S\subset E$とし、各$f\in E'$で$\sup_{x\in S}|f(x)|<\infty$とする。

    $x\in E$に対し$J_x\in E''$を$J_x(f)=f(x)$で定める。ハーン・バナッハの定理の系より$\|J_x\|=\|x\|$である。

    $E'$はバナッハ空間である（値域の$\mathbb{K}$が完備なので）。族$\{J_x\}_{x\in S}$は$E'$上の有界線形汎関数の族で、各$f$で$\sup_{x\in S}|J_x(f)|<\infty$を満たす。一様有界性原理により$M=\sup_{x\in S}\|J_x\|<\infty$である。$\|x\|=\|J_x\|$なので、全ての$x\in S$で$\|x\|\leq M$である。
  strategy: View S inside the double dual and apply uniform boundedness on the complete space E'.
  sketch:
  - 'setup: Embed x as J_x in the double dual, which preserves the norm.'
  - 'derive: The family J_x is pointwise bounded on the Banach space E''.'
  - 'apply_theorem: Uniform boundedness gives sup ‖J_x‖ < ∞.'
  - 'conclude: Since ‖J_x‖ = ‖x‖, S is norm bounded.'
  openmath: (forall (E S) (-> (and (normed_space E) (subset S E) (forall (f) (-> (in f (dual_space E)) (exists (c) (forall (x) (-> (in x S) (<= (abs (fn_value f x)) c))))))) (exists (M) (forall (x) (-> (in x S) (<= (norm x) M))))))
  hard_negative:
    statement: $E$の有界線形汎関数の族が各点で有界なら、$E$が完備でなくても族は一様有界である。
    reason: 有限個の成分以外$0$の列全体に$\ell^\infty$ノルムを入れ、$f_n(x)=nx_n$とすると各点で有界だが$\|f_n\|=n$である。定義域の完備性が要る。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] (S : Set E), (∀ f : StrongDual 𝕜 E, ∃ C : ℝ, ∀ x ∈ S, ‖f x‖ ≤ C) → ∃ M : ℝ, ∀ x ∈ S, ‖x‖ ≤ M
  proof: |
    by
      intro 𝕜 _ E _ _ S h
      let J := NormedSpace.inclusionInDoubleDual 𝕜 E
      have hb : ∀ f : StrongDual 𝕜 E, ∃ C : ℝ, ∀ x : S, ‖J (x : E) f‖ ≤ C := by
        intro f
        obtain ⟨C, hC⟩ := h f
        exact ⟨C, fun x => hC x x.2⟩
      obtain ⟨M, hM⟩ := banach_steinhaus (g := fun x : S => J (x : E)) hb
      refine ⟨M, fun x hx => ?_⟩
      have h1 := hM ⟨x, hx⟩
      have h2 : ‖J x‖ = ‖x‖ := (NormedSpace.inclusionInDoubleDualLi 𝕜).norm_map x
      rwa [h2] at h1
- id: fa_norm_weakly_lower_semicontinuous
  kind: gap
  level: 4
  topic: 関数解析・弱収束とノルム
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のノルム空間、$(x_n)$を$a$に弱収束する列とする。$r<\|a\|$ならば十分大きい全ての$n$で$r<\|x_n\|$である。すなわちノルムは弱収束について下半連続で、$\|a\|\leq\liminf\|x_n\|$である。
  statement_en: If (x_n) converges weakly to a in a normed space over ℝ or ℂ and r < ‖a‖, then r < ‖x_n‖ for all large n. That is, the norm is weakly lower semicontinuous and ‖a‖ ≤ liminf ‖x_n‖.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - 全ての$f\in E'$で$f(x_n)\to f(a)$
  - $r<\|a\|$
  quantifiers:
  - 任意の$E$、列$(x_n)$、$a$、$r$
  conclusion: 十分大きい全ての$n$で$r<\|x_n\|$である。
  answer: |
    $E$をノルム空間、$(x_n)$を$a$に弱収束する列、$r<\|a\|$とする。

    $r<0$なら全ての$n$で$r<\|x_n\|$である。$r\geq 0$とする。このとき$a\neq 0$なので、ハーン・バナッハの定理の系により$\|f\|=1$かつ$f(a)=\|a\|$となる$f\in E'$が存在する。

    $|f(x_n)|\to|f(a)|=\|a\|>r$なので、十分大きい$n$で$r<|f(x_n)|$である。$|f(x_n)|\leq\|f\|\|x_n\|=\|x_n\|$より$r<\|x_n\|$を得る。
  strategy: Test the weak convergence on a norming functional of a.
  sketch:
  - 'case_split: For r < 0 there is nothing to prove.'
  - 'apply_theorem: For r ≥ 0, Hahn-Banach gives f of norm 1 with f(a) = ‖a‖.'
  - 'derive: Weak convergence gives |f(x_n)| > r for large n.'
  - 'conclude: |f(x_n)| ≤ ‖x_n‖ yields r < ‖x_n‖.'
  openmath: (forall (E x a r) (-> (and (normed_space E) (in a E) (weak_tends_to x a) (< r (norm a))) (exists (m) (forall (n) (-> (>= n m) (< r (norm (seq_value x n))))))))
  hard_negative:
    statement: 弱収束なら$\|x_n\|\to\|a\|$である。
    reason: $\ell^2$で$e_n$は$0$に弱収束するが、$\|e_n\|=1$は$0$に収束しない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] (x : ℕ → E) (a : E) (r : ℝ), (∀ f : StrongDual 𝕜 E, Filter.Tendsto (fun n => f (x n)) Filter.atTop (nhds (f a))) → r < ‖a‖ → ∀ᶠ n in Filter.atTop, r < ‖x n‖
  proof: |
    by
      intro 𝕜 _ E _ _ x a r h hr
      rcases lt_or_ge r 0 with hr0 | hr0
      · exact Filter.Eventually.of_forall fun n => lt_of_lt_of_le hr0 (norm_nonneg _)
      have ha : ‖a‖ ≠ 0 := (lt_of_le_of_lt hr0 hr).ne'
      obtain ⟨f, hf1, hf2⟩ := exists_dual_vector 𝕜 a ha
      have hl : Filter.Tendsto (fun n => ‖f (x n)‖) Filter.atTop (nhds ‖f a‖) := (h f).norm
      have hfa : ‖f a‖ = ‖a‖ := by rw [hf2]; simp
      rw [hfa] at hl
      filter_upwards [hl.eventually (lt_mem_nhds hr)] with n hn
      calc r < ‖f (x n)‖ := hn
        _ ≤ ‖f‖ * ‖x n‖ := f.le_opNorm _
        _ = ‖x n‖ := by rw [hf1, one_mul]
- id: fa_pointwise_conv_strong_conv_pairing
  kind: gap
  level: 4
  topic: 関数解析・一様有界性の系
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のバナッハ空間、$F$をノルム空間、$T_n,S:E\to F$を有界線形作用素とする。$T_n$が$S$に各点収束し、$x_n\to a$がノルム収束ならば、$T_n x_n\to Sa$である。
  statement_en: Let E be a Banach space and F a normed space over ℝ or ℂ, and let T_n, S be bounded operators from E to F. If T_n → S pointwise and x_n → a in norm, then T_n x_n → Sa.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のバナッハ空間、$F$はノルム空間
  - $T_n,S:E\to F$は有界線形作用素
  - 全ての$v$で$T_n v\to Sv$
  - $x_n\to a$
  quantifiers:
  - 任意の$E,F,T_n,S,x_n,a$
  conclusion: $T_n x_n\to Sa$である。
  answer: |
    $E$をバナッハ空間、$F$をノルム空間、$T_n,S:E\to F$を有界線形作用素とし、全ての$v$で$T_nv\to Sv$、$x_n\to a$とする。

    収束列は有界なので、各$v$で$\sup_n\|T_nv\|<\infty$である。$E$は完備なので、一様有界性原理により$M=\sup_n\|T_n\|<\infty$である。

    $\|T_nx_n-Sa\|\leq\|T_n(x_n-a)\|+\|T_na-Sa\|\leq M\|x_n-a\|+\|T_na-Sa\|$である。右辺は$n\to\infty$で$0$に収束する。
  strategy: Uniform boundedness controls the term T_n(x_n - a).
  sketch:
  - 'apply_theorem: Pointwise convergence gives pointwise boundedness, so sup ‖T_n‖ = M < ∞.'
  - 'derive: Split T_n x_n - Sa as T_n(x_n - a) + (T_n a - Sa).'
  - 'conclude: Both terms tend to 0.'
  openmath: (forall (E F T S x a) (-> (and (banach_space E) (normed_space F) (forall (n) (bounded_operator (seq_value T n) E F)) (bounded_operator S E F) (pointwise_tends_to T S) (seq_tends_to x a)) (seq_fn_tends_to (lambda (n) (fn_value (seq_value T n) (seq_value x n))) (fn_value S a))))
  hard_negative:
    statement: $x_n$が$a$に弱収束するだけでも$T_nx_n\to Sa$である。
    reason: $\ell^2$で$T_n$を第$n$成分を取り出す汎関数、$S=0$、$x_n=e_n$とすると$x_n$は$0$に弱収束し$T_n\to 0$は各点収束だが、$T_nx_n=1$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [CompleteSpace E] [NormedAddCommGroup F] [NormedSpace 𝕜 F] (T : ℕ → E →L[𝕜] F) (S : E →L[𝕜] F) (x : ℕ → E) (a : E), (∀ v, Filter.Tendsto (fun n => T n v) Filter.atTop (nhds (S v))) → Filter.Tendsto x Filter.atTop (nhds a) → Filter.Tendsto (fun n => T n (x n)) Filter.atTop (nhds (S a))
  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ _ T S x a hT hx
      have hb : ∀ v, ∃ C : ℝ, ∀ n, ‖T n v‖ ≤ C := by
        intro v
        obtain ⟨C, hC⟩ := (hT v).norm.isBoundedUnder_le.bddAbove_range
        exact ⟨C, fun n => hC ⟨n, rfl⟩⟩
      obtain ⟨M, hM⟩ := banach_steinhaus hb
      have h1 : Filter.Tendsto (fun n => T n (x n) - T n a) Filter.atTop (nhds 0) := by
        apply squeeze_zero_norm (a := fun n => M * ‖x n - a‖)
        · intro n
          rw [← map_sub]
          exact ((T n).le_opNorm _).trans (by gcongr; exact hM n)
        · have := ((hx.sub_const a).norm).const_mul M
          simpa using this
      have := h1.add (hT a)
      simpa using this
- id: fa_dual_operator_norm_bound_iff
  kind: gap
  level: 4
  topic: 関数解析・双対作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E,F$を$\mathbb{K}$上のノルム空間、$T:E\to F$を有界線形作用素、$T'g=g\circ T$を双対作用素、$M\geq 0$とする。全ての$g\in F'$で$\|T'g\|\leq M\|g\|$であることと$\|T\|\leq M$は同値である。
  statement_en: Let T be a bounded operator between normed spaces over ℝ or ℂ, T'g = g∘T its dual operator and M ≥ 0. Then ‖T'g‖ ≤ M‖g‖ for all g in F' if and only if ‖T‖ ≤ M.
  assumptions:
  - $E,F$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $T:E\to F$は有界線形作用素
  - $M\geq 0$
  quantifiers:
  - 任意の$E,F,T,M$
  conclusion: 全ての$g\in F'$で$\|g\circ T\|\leq M\|g\|$であることと$\|T\|\leq M$は同値である。
  answer: |
    $E,F$をノルム空間、$T:E\to F$を有界線形作用素、$M\geq 0$とする。

    $\|T\|\leq M$なら$\|g\circ T\|\leq\|g\|\|T\|\leq M\|g\|$である。

    逆に、全ての$g\in F'$で$\|g\circ T\|\leq M\|g\|$とする。$x\in E$を固定する。$Tx\neq 0$なら、ハーン・バナッハの定理の系により$\|g\|=1$かつ$g(Tx)=\|Tx\|$となる$g\in F'$がとれる。すると$\|Tx\|=|(g\circ T)(x)|\leq\|g\circ T\|\|x\|\leq M\|x\|$である。$Tx=0$のときも$\|Tx\|\leq M\|x\|$は成り立つ。よって$\|T\|\leq M$である。
  strategy: Use submultiplicativity in one direction and norming functionals in the other.
  sketch:
  - 'derive: ‖T‖ ≤ M gives ‖g∘T‖ ≤ M‖g‖.'
  - 'apply_theorem: Conversely choose g of norm 1 with g(Tx) = ‖Tx‖.'
  - 'derive: Then ‖Tx‖ ≤ ‖g∘T‖‖x‖ ≤ M‖x‖.'
  - 'conclude: Hence ‖T‖ ≤ M.'
  openmath: (forall (E F T M) (-> (and (normed_space E) (normed_space F) (bounded_operator T E F) (>= M 0)) (<-> (forall (g) (-> (in g (dual_space F)) (<= (norm (operator_comp g T)) (* M (norm g))))) (<= (norm T) M))))
  hard_negative:
    statement: $T'$が単射なら$T$は全射である。
    reason: $\ell^2$上の$T(x_n)=(x_n/n)$は自己共役で$T'$は単射だが$T$は全射でない。$T'$の単射性から分かるのは値域の稠密性である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [NormedAddCommGroup F] [NormedSpace 𝕜 F] (T : E →L[𝕜] F) (M : ℝ), 0 ≤ M → ((∀ g : StrongDual 𝕜 F, ‖g.comp T‖ ≤ M * ‖g‖) ↔ ‖T‖ ≤ M)
  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ T M hM
      constructor
      · intro h
        refine T.opNorm_le_bound hM fun x => ?_
        refine NormedSpace.norm_le_dual_bound 𝕜 (T x) (by positivity) fun g => ?_
        calc ‖g (T x)‖ = ‖(g.comp T) x‖ := rfl
          _ ≤ ‖g.comp T‖ * ‖x‖ := ContinuousLinearMap.le_opNorm _ _
          _ ≤ (M * ‖g‖) * ‖x‖ := by gcongr; exact h g
          _ = M * ‖x‖ * ‖g‖ := by ring
      · intro h g
        calc ‖g.comp T‖ ≤ ‖g‖ * ‖T‖ := ContinuousLinearMap.opNorm_comp_le _ _
          _ ≤ ‖g‖ * M := by gcongr
          _ = M * ‖g‖ := mul_comm _ _
- id: fa_reflexive_implies_dual_reflexive
  kind: gap
  level: 4
  topic: 関数解析・反射性
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のノルム空間とし、標準埋込$J_E:E\to E''$が全射（$E$が反射的）であるとする。このとき$E'$の標準埋込$J_{E'}:E'\to E'''$も全射である。
  statement_en: If the canonical embedding of a normed space E over ℝ or ℂ into its double dual is surjective, that is E is reflexive, then the canonical embedding of E' into E''' is surjective as well.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $J_E:E\to E''$は全射
  quantifiers:
  - 任意の$E$
  conclusion: $J_{E'}:E'\to E'''$は全射である。
  answer: |
    $E$をノルム空間、$J_E:E\to E''$を全射とする。$\Phi\in E'''$をとり、$f=\Phi\circ J_E$とおく。$f$は有界線形なので$f\in E'$である。

    $J_{E'}f=\Phi$を示す。$\psi\in E''$をとる。全射性から$\psi=J_Ex$となる$x\in E$がある。すると
    $(J_{E'}f)(\psi)=\psi(f)=(J_Ex)(f)=f(x)=\Phi(J_Ex)=\Phi(\psi)$
    である。よって$J_{E'}$は全射である。
  strategy: Precompose a third-dual element with the canonical embedding of E.
  sketch:
  - 'construct: For Φ in E''''''  put f = Φ∘J_E in E''.'
  - 'derive: Any ψ in E'''' has the form J_E x.'
  - 'derive: Evaluate: (J f)(ψ) = f(x) = Φ(ψ).'
  - 'conclude: Hence J_(E'') is surjective.'
  openmath: (forall (E) (-> (and (normed_space E) (reflexive_space E)) (reflexive_space (dual_space E))))
  hard_negative:
    statement: $E'$が反射的ならば、完備とは限らない$E$も反射的である。
    reason: $E$を$\ell^2$の稠密な真部分空間とすると、$E'$は$\ell^2$と同型で反射的である。しかし反射的なノルム空間は完備なので、$E$は反射的でない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E], Function.Surjective (NormedSpace.inclusionInDoubleDual 𝕜 E) → Function.Surjective (NormedSpace.inclusionInDoubleDual 𝕜 (StrongDual 𝕜 E))
  proof: |
    by
      intro 𝕜 _ E _ _ h Φ
      refine ⟨Φ.comp (NormedSpace.inclusionInDoubleDual 𝕜 E), ?_⟩
      ext ψ
      obtain ⟨x, rfl⟩ := h ψ
      rfl
- id: fa_hilbert_space_reflexive
  kind: textbook
  level: 4
  topic: 関数解析・反射性
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間とする。標準埋込$J:H\to H''$は全射である。リースの表現定理は既習とする。
  statement_en: The canonical embedding of a Hilbert space H over ℝ or ℂ into its double dual is surjective. The Riesz representation theorem is taken as known.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - 内積は第1変数について共役線形、第2変数について線形とする
  - リースの表現定理は既習
  quantifiers:
  - 任意の$H$
  conclusion: $J:H\to H''$は全射である。
  answer: |
    $H$をヒルベルト空間とし、内積は第2変数について線形とする。リースの表現定理より、$y\mapsto T_y=\langle y,\cdot\rangle$は$H$から$H'$への共役線形な全単射である。

    $\Phi\in H''$をとる。$\psi(y)=\overline{\Phi(T_y)}$と定めると、$T$の共役線形性から$\psi$は線形であり、$|\psi(y)|\leq\|\Phi\|\|T_y\|=\|\Phi\|\|y\|$なので有界である。リースの表現定理より$\psi=T_a$となる$a\in H$がある。すなわち全ての$y$で$\langle a,y\rangle=\overline{\Phi(T_y)}$である。

    任意の$f\in H'$は$f=T_y$と書ける。$(Ja)(f)=f(a)=\langle y,a\rangle=\overline{\langle a,y\rangle}=\Phi(T_y)=\Phi(f)$である。よって$Ja=\Phi$であり、$J$は全射である。
  strategy: Apply the Riesz theorem twice, correcting the conjugate linearity with complex conjugation.
  sketch:
  - 'setup: Let T_y be the Riesz map, which is a conjugate-linear bijection H to H''.'
  - 'construct: For Φ in H'''' define ψ(y) as the conjugate of Φ(T_y), a bounded linear functional.'
  - 'apply_theorem: Riesz gives a with ψ = T_a.'
  - 'derive: Then (Ja)(T_y) = ⟨y,a⟩ = Φ(T_y).'
  - 'conclude: Since T is onto, Ja = Φ.'
  openmath: (forall (H) (-> (hilbert_space H) (reflexive_space H)))
  hard_negative:
    statement: 全てのバナッハ空間は反射的である。
    reason: $c_0$の双対は$\ell^1$、その双対は$\ell^\infty$である。$c_0$は可分で$\ell^\infty$は可分でないので、$J:c_0\to\ell^\infty$は全射でない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H], Function.Surjective (NormedSpace.inclusionInDoubleDual 𝕜 H)
  proof: |
    by
      intro 𝕜 _ H _ _ _ Φ
      let T := InnerProductSpace.toDual 𝕜 H
      let ψ : StrongDual 𝕜 H := ((starL 𝕜 : 𝕜 ≃L⋆[𝕜] 𝕜) : 𝕜 →L⋆[𝕜] 𝕜).comp (Φ.comp (T.toContinuousLinearEquiv : H →L⋆[𝕜] StrongDual 𝕜 H))
      refine ⟨T.symm ψ, ?_⟩
      ext f
      obtain ⟨y, rfl⟩ := T.surjective f
      have h1 : inner 𝕜 (T.symm ψ) y = star (Φ (T y)) := by
        rw [InnerProductSpace.toDual_symm_apply]; rfl
      have h2 : T y (T.symm ψ) = Φ (T y) := by
        rw [InnerProductSpace.toDual_apply_apply, ← inner_conj_symm, h1]
        simp
      exact h2
- id: fa_closed_subspace_of_reflexive_reflexive
  kind: textbook
  level: 4
  topic: 関数解析・反射性
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のノルム空間、$M$を閉部分空間とする。$J_E$が全射（$E$が反射的）ならば$J_M:M\to M''$も全射である。
  statement_en: A closed subspace M of a reflexive normed space E over ℝ or ℂ is reflexive.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $M$は$E$の閉部分空間
  - $J_E:E\to E''$は全射
  quantifiers:
  - 任意の$E,M$
  conclusion: $J_M:M\to M''$は全射である。
  answer: |
    $E$をノルム空間、$M$を閉部分空間、$J_E$を全射とする。$\Phi\in M''$をとる。$\psi(f)=\Phi(f|_M)$（$f\in E'$）は$E''$の元である。全射性から$\psi=J_Ex$となる$x\in E$がある。よって全ての$f\in E'$で$f(x)=\Phi(f|_M)$である。

    $x\in M$を示す。$x\notin M$なら、$M$は閉なのでハーン・バナッハの定理の系により、$M$上で$0$かつ$f(x)\neq 0$の$f\in E'$がある。このとき$f|_M=0$なので$f(x)=\Phi(0)=0$となり矛盾する。

    $g\in M'$をとる。ハーン・バナッハの定理により$g$は$f\in E'$に拡張できる。$g(x)=f(x)=\Phi(f|_M)=\Phi(g)$である。よって$J_Mx=\Phi$である。
  strategy: Represent the induced element of E'' by x, show x lies in M by separation, and extend functionals by Hahn-Banach.
  sketch:
  - 'construct: Define ψ(f) = Φ(f restricted to M), an element of E''''.'
  - 'derive: Reflexivity gives x with f(x) = Φ(f|_M) for all f.'
  - 'contradiction: If x is outside M, a functional vanishing on M but not at x gives a contradiction.'
  - 'apply_theorem: Extend g in M'' to f in E'' by Hahn-Banach.'
  - 'conclude: g(x) = Φ(g), so J_M x = Φ.'
  openmath: (forall (E M) (-> (and (normed_space E) (subspace_of M E) (closed_set M) (reflexive_space E)) (reflexive_space M)))
  hard_negative:
    statement: 反射的空間の閉でない部分空間も反射的である。
    reason: $\ell^2$の稠密な真部分空間は完備でない。反射的なノルム空間は完備なので、これは反射的でない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] (M : Submodule 𝕜 E), IsClosed (M : Set E) → Function.Surjective (NormedSpace.inclusionInDoubleDual 𝕜 E) → Function.Surjective (NormedSpace.inclusionInDoubleDual 𝕜 M)
  proof: |
    by
      intro 𝕜 _ E _ _ M hM h Φ
      let R : StrongDual 𝕜 E →L[𝕜] StrongDual 𝕜 M := (ContinuousLinearMap.compL 𝕜 M E 𝕜).flip M.subtypeL
      obtain ⟨x, hx⟩ := h (Φ.comp R)
      have hval : ∀ f : StrongDual 𝕜 E, f x = Φ (f.comp M.subtypeL) := fun f => congrArg (fun F => F f) hx
      have hxM : x ∈ M := by
        by_contra hn
        have hq : ‖(Submodule.Quotient.mk x : E ⧸ M)‖ = Metric.infDist x (M : Set E) := QuotientAddGroup.norm_mk x
        have hd : ‖(Submodule.Quotient.mk x : E ⧸ M)‖ ≠ 0 := by
          rw [hq]
          exact fun h0 => hn ((hM.mem_iff_infDist_zero ⟨0, M.zero_mem⟩).mpr h0)
        obtain ⟨g, _, hg⟩ := exists_dual_vector 𝕜 (Submodule.Quotient.mk x : E ⧸ M) hd
        let π : E →L[𝕜] (E ⧸ M) := M.mkQ.mkContinuous 1 (fun y => by
          simpa using Submodule.Quotient.norm_mk_le M y)
        have hπ : ∀ y, π y = Submodule.Quotient.mk y := fun y => rfl
        have h0 : (g.comp π).comp M.subtypeL = 0 := by
          ext m
          simp [hπ, (Submodule.Quotient.mk_eq_zero M).mpr m.2]
        have h1 := hval (g.comp π)
        rw [h0, map_zero, ContinuousLinearMap.comp_apply, hπ, hg] at h1
        exact hd (by exact_mod_cast h1)
      refine ⟨⟨x, hxM⟩, ?_⟩
      ext g
      obtain ⟨f, hf, _⟩ := exists_extension_norm_eq M g
      have hfg : f.comp M.subtypeL = g := by
        ext m
        simpa using hf m
      have h1 := hval f
      rw [hfg] at h1
      rw [← h1]
      exact (hf ⟨x, hxM⟩).symm
- id: fa_sequential_banach_alaoglu
  kind: named
  level: 4
  topic: 関数解析・バナッハ・アラオグルの周辺
  statement: 点列版のバナッハ・アラオグルの定理。$\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上の可分なノルム空間、$(f_n)$を$E'$の列で全ての$n$について$\|f_n\|\leq r$とする。部分列$f_{\varphi(n)}$と$\|g\|\leq r$となる$g\in E'$が存在し、全ての$x\in E$で$f_{\varphi(n)}(x)\to g(x)$である。双対空間の閉球の弱*コンパクト性を、$E$が可分な場合に部分列で述べた形である。
  statement_en: Sequential Banach-Alaoglu theorem. If E is a separable normed space over ℝ or ℂ and (f_n) is a sequence in E' with ‖f_n‖ ≤ r, then there are a subsequence f_φ(n) and g in E' with ‖g‖ ≤ r such that f_φ(n)(x) → g(x) for all x. This states the weak-* compactness of closed balls of the dual with subsequences, for separable E.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上の可分なノルム空間
  - $f_n\in E'$で$\|f_n\|\leq r$
  quantifiers:
  - 任意の$E,(f_n),r$
  conclusion: $\|g\|\leq r$と狭義単調な$\varphi$で、全ての$x$について$f_{\varphi(n)}(x)\to g(x)$となるものが存在する。
  answer: |
    $E$を可分なノルム空間、$\|f_n\|\leq r$とし、$\{y_k\}$を$E$の可算稠密部分集合とする。

    各$k$で$(f_n(y_k))_n$は$\mathbb{K}$の有界列である。対角線論法により、全ての$k$で$f_{\varphi(n)}(y_k)$が収束する部分列がとれる。

    任意の$x\in E$で$(f_{\varphi(n)}(x))$がコーシー列であることを示す。$\varepsilon>0$に対し$\|x-y_k\|<\varepsilon$となる$k$をとると、
    $|f_{\varphi(n)}(x)-f_{\varphi(m)}(x)|\leq 2r\varepsilon+|f_{\varphi(n)}(y_k)-f_{\varphi(m)}(y_k)|$
    である。右辺の第2項は$n,m$が大きいとき$\varepsilon$未満である。よって$(f_{\varphi(n)}(x))$は収束する。

    極限を$g(x)$とおく。$g$は線形であり、$|f_{\varphi(n)}(x)|\leq r\|x\|$の極限から$|g(x)|\leq r\|x\|$である。よって$g\in E'$、$\|g\|\leq r$である。
  strategy: Use a diagonal subsequence on a countable dense set and extend by equicontinuity.
  sketch:
  - 'setup: Fix a countable dense subset of E.'
  - 'construct: The diagonal argument gives a subsequence converging on the dense set.'
  - 'derive: The uniform bound r shows the values at any x form a Cauchy sequence.'
  - 'derive: The limit g is linear with |g(x)| ≤ r‖x‖.'
  - 'conclude: Thus g lies in E'' with ‖g‖ ≤ r.'
  openmath: (forall (E f r) (-> (and (normed_space E) (separable_space E) (forall (n) (and (in (seq_value f n) (dual_space E)) (<= (norm (seq_value f n)) r)))) (exists (g k) (and (in g (dual_space E)) (<= (norm g) r) (strict_mono_index k) (forall (x) (-> (in x E) (seq_fn_tends_to (lambda (n) (fn_value (seq_value f (seq_value k n)) x)) (fn_value g x))))))))
  hard_negative:
    statement: $E$が可分でなくても、有界列は各点収束する部分列をもつ。
    reason: $E=\ell^\infty$、$f_n(x)=x_n$とする。任意の狭義単調な$\varphi$に対し、$x_{\varphi(n)}=(-1)^n$となる$x\in\ell^\infty$をとると$f_{\varphi(n)}(x)$は収束しない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [TopologicalSpace.SeparableSpace E] (f : ℕ → StrongDual 𝕜 E) (r : ℝ), (∀ n, ‖f n‖ ≤ r) → ∃ (g : StrongDual 𝕜 E) (φ : ℕ → ℕ), StrictMono φ ∧ ‖g‖ ≤ r ∧ ∀ x, Filter.Tendsto (fun n => f (φ n) x) Filter.atTop (nhds (g x))
  proof: |
    by
      intro 𝕜 _ E _ _ _ f r h
      have hs := WeakDual.isSeqCompact_closedBall 𝕜 E (0 : StrongDual 𝕜 E) r
      obtain ⟨a, ha, φ, hφ, ht⟩ := hs (x := fun n => StrongDual.toWeakDual (f n)) (fun n => by simpa using h n)
      refine ⟨WeakDual.toStrongDual a, φ, hφ, by simpa using ha, fun x => ?_⟩
      exact (WeakDual.eval_continuous x).tendsto a |>.comp ht
- id: fa_hb_mem_closure_iff_annihilators
  kind: gap
  level: 4
  topic: 関数解析・ハーン・バナッハの系
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上のノルム空間、$M$を部分空間、$x\in E$とする。$x\in\overline{M}$であることと、$M$上で$0$の有界線形汎関数がすべて$x$で$0$となることは同値である。
  statement_en: For a subspace M of a normed space E over ℝ or ℂ and x in E, x lies in the closure of M if and only if every bounded linear functional vanishing on M vanishes at x.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $M$は$E$の部分空間
  - $x\in E$
  quantifiers:
  - 任意の$E,M,x$
  conclusion: $x\in\overline{M}$と、$f|_M=0$である全ての$f\in E'$で$f(x)=0$であることは同値である。
  answer: |
    $E$をノルム空間、$M$を部分空間、$x\in E$とする。

    $x\in\overline{M}$とし、$f\in E'$が$M$上で$0$であるとする。$m_n\in M$を$m_n\to x$となるようにとると、連続性から$f(x)=\lim f(m_n)=0$である。

    逆に$x\notin\overline{M}$とする。$\overline{M}$は閉部分空間なので、ハーン・バナッハの定理の系により、$\overline{M}$上で$0$で$f(x)=\mathrm{dist}(x,\overline{M})>0$となる$f\in E'$が存在する。この$f$は$M$上で$0$だが$f(x)\neq 0$である。
  strategy: Continuity gives one direction and a separating functional for the closed subspace gives the other.
  sketch:
  - 'derive: If x is a limit of m_n in M, continuity of f gives f(x) = 0.'
  - 'contradiction: If x is outside the closure, Hahn-Banach gives f vanishing on the closure with f(x) ≠ 0.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (E M x) (-> (and (normed_space E) (subspace_of M E) (in x E)) (<-> (in x (closure_of M)) (forall (f) (-> (and (in f (dual_space E)) (forall (m) (-> (in m M) (= (fn_value f m) 0)))) (= (fn_value f x) 0))))))
  hard_negative:
    statement: 線形部分空間でない集合$S$についても、$S$上で$0$の汎関数が$x$で$0$なら$x\in\overline{S}$である。
    reason: $S=\{e_1\}\subset\mathbb{R}^2$、$x=2e_1$とする。$e_1$で$0$の汎関数は$x$でも$0$だが、$x\notin\overline{S}$である。結論に入るのは$S$の張る部分空間の閉包である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] (M : Submodule 𝕜 E) (x : E), x ∈ M.topologicalClosure ↔ ∀ f : StrongDual 𝕜 E, (∀ m ∈ M, f m = 0) → f x = 0
  proof: |
    by
      intro 𝕜 _ E _ _ M x
      constructor
      · intro hx f hf
        have hle : M.topologicalClosure ≤ LinearMap.ker (f : E →ₗ[𝕜] 𝕜) :=
          Submodule.topologicalClosure_minimal M (fun m hm => hf m hm) (f.isClosed_ker)
        exact hle hx
      · intro h
        by_contra hn
        let N := M.topologicalClosure
        have hN : IsClosed (N : Set E) := M.isClosed_topologicalClosure
        have hq : ‖(Submodule.Quotient.mk x : E ⧸ N)‖ = Metric.infDist x (N : Set E) := QuotientAddGroup.norm_mk x
        have hd : ‖(Submodule.Quotient.mk x : E ⧸ N)‖ ≠ 0 := by
          rw [hq]
          exact fun h0 => hn ((hN.mem_iff_infDist_zero ⟨0, N.zero_mem⟩).mpr h0)
        obtain ⟨g, _, hg⟩ := exists_dual_vector 𝕜 (Submodule.Quotient.mk x : E ⧸ N) hd
        let π : E →L[𝕜] (E ⧸ N) := N.mkQ.mkContinuous 1 (fun y => by
          simpa using Submodule.Quotient.norm_mk_le N y)
        have hπ : ∀ y, π y = Submodule.Quotient.mk y := fun y => rfl
        have h0 := h (g.comp π) (fun m hm => by
          rw [ContinuousLinearMap.comp_apply, hπ, (Submodule.Quotient.mk_eq_zero N).mpr (M.le_topologicalClosure hm), map_zero])
        rw [ContinuousLinearMap.comp_apply, hπ, hg] at h0
        exact hd (by exact_mod_cast h0)
- id: fa_parallelogram_law_general
  kind: gap
  level: 3
  topic: ヒルベルト空間・内積の計算則
  statement: 中線定理の一般形。$\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上の内積空間とする。全ての$x,y\in E$で$\|x+y\|^2+\|x-y\|^2=2(\|x\|^2+\|y\|^2)$である。実内積空間の中線定理を複素の場合まで含めた形である。
  statement_en: Parallelogram law, general form. For x, y in an inner product space over ℝ or ℂ, ‖x+y‖² + ‖x-y‖² = 2(‖x‖² + ‖y‖²). This extends the real case to complex scalars.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上の内積空間
  quantifiers:
  - 任意の$E$と$x,y\in E$
  conclusion: $\|x+y\|^2+\|x-y\|^2=2(\|x\|^2+\|y\|^2)$である。
  answer: |
    $E$を$\mathbb{R}$または$\mathbb{C}$上の内積空間、$x,y\in E$とする。内積の加法性から
    $\|x+y\|^2=\|x\|^2+\langle x,y\rangle+\langle y,x\rangle+\|y\|^2,$
    $\|x-y\|^2=\|x\|^2-\langle x,y\rangle-\langle y,x\rangle+\|y\|^2$
    である。辺々足すと$\langle x,y\rangle+\langle y,x\rangle$が消え、$2(\|x\|^2+\|y\|^2)$を得る。
  strategy: Expand both squared norms with the inner product and add.
  sketch:
  - 'derive: Expand ‖x+y‖² and ‖x-y‖² by additivity of the inner product.'
  - 'conclude: The mixed terms cancel when the two identities are added.'
  openmath: (forall (K E x y) (-> (and (inner_product_space_over K E) (in x E) (in y E)) (= (+ (^ (norm (+ x y)) 2) (^ (norm (- x y)) 2)) (* 2 (+ (^ (norm x) 2) (^ (norm y) 2))))))
  hard_negative:
    statement: 任意のノルム空間で中線定理が成り立つ。
    reason: $\mathbb{R}^2$の最大値ノルムで$x=e_1$、$y=e_2$とすると左辺は$1+1=2$、右辺は$2(1+1)=4$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [InnerProductSpace 𝕜 E] (x y : E), ‖x + y‖ ^ 2 + ‖x - y‖ ^ 2 = 2 * (‖x‖ ^ 2 + ‖y‖ ^ 2)
  proof: |
    by
      intro 𝕜 _ E _ _ x y
      exact parallelogram_law_with_norm 𝕜 x y
- id: fa_polarization_complex
  kind: gap
  level: 3
  topic: ヒルベルト空間・内積の計算則
  statement: 複素内積空間の極化恒等式。$E$を第1変数について共役線形、第2変数について線形な内積をもつ複素内積空間とする。全ての$x,y\in E$で$\langle x,y\rangle=\frac14\left(\|x+y\|^2-\|x-y\|^2+i(\|x-iy\|^2-\|x+iy\|^2)\right)$である。
  statement_en: Polarization identity, complex form. For an inner product conjugate-linear in the first variable and linear in the second, ⟨x,y⟩ = (‖x+y‖² - ‖x-y‖² + i(‖x-iy‖² - ‖x+iy‖²))/4.
  assumptions:
  - $E$は複素内積空間
  - 内積は第1変数について共役線形、第2変数について線形
  quantifiers:
  - 任意の$E$と$x,y\in E$
  conclusion: $\langle x,y\rangle=\frac14\left(\|x+y\|^2-\|x-y\|^2+i(\|x-iy\|^2-\|x+iy\|^2)\right)$である。
  answer: |
    $E$を第2変数について線形な内積をもつ複素内積空間、$x,y\in E$とする。$c\in\mathbb{C}$について$\|x+cy\|^2=\|x\|^2+|c|^2\|y\|^2+2\mathrm{Re}(c\langle x,y\rangle)$である。

    $c=\pm 1$の式を引くと$\|x+y\|^2-\|x-y\|^2=4\mathrm{Re}\langle x,y\rangle$である。

    $c=\mp i$の式を引くと、$\mathrm{Re}(-i\langle x,y\rangle)=\mathrm{Im}\langle x,y\rangle$なので$\|x-iy\|^2-\|x+iy\|^2=4\mathrm{Im}\langle x,y\rangle$である。

    この二つを合わせると$\langle x,y\rangle=\mathrm{Re}\langle x,y\rangle+i\mathrm{Im}\langle x,y\rangle$から恒等式を得る。
  strategy: Compute the real and imaginary parts of the inner product separately from ‖x + cy‖².
  sketch:
  - 'derive: For complex c, ‖x+cy‖² = ‖x‖² + |c|²‖y‖² + 2Re(c⟨x,y⟩).'
  - 'derive: c = ±1 gives the real part.'
  - 'derive: c = ∓i gives the imaginary part.'
  - 'conclude: Combine the two parts.'
  openmath: (forall (E x y) (-> (and (inner_product_space E) (complex_vector_space E) (in x E) (in y E)) (= (inner_product x y) (/ (+ (- (^ (norm (+ x y)) 2) (^ (norm (- x y)) 2)) (* complex_imaginary_unit (- (^ (norm (- x (* complex_imaginary_unit y))) 2) (^ (norm (+ x (* complex_imaginary_unit y))) 2)))) 4))))
  hard_negative:
    statement: 第1変数について線形な内積でも同じ式が成り立つ。
    reason: その規約では内積は$\overline{\langle x,y\rangle}$に変わる。$E=\mathbb{C}$、$x=1$、$y=i$なら本文の式の右辺は$i$だが、第1変数線形の内積の値は$\overline{i}=-i$である。虚部の符号が反転する。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [InnerProductSpace ℂ E] (x y : E), inner ℂ x y = (((‖x + y‖ ^ 2 - ‖x - y‖ ^ 2 : ℝ) : ℂ) + Complex.I * ((‖x - Complex.I • y‖ ^ 2 - ‖x + Complex.I • y‖ ^ 2 : ℝ) : ℂ)) / 4
  proof: |
    by
      intro E _ _ x y
      have h := inner_eq_sum_norm_sq_div_four (𝕜 := ℂ) x y
      rw [h]
      have e : ∀ r : ℝ, (RCLike.ofReal r : ℂ) = (r : ℂ) := fun r => rfl
      simp only [RCLike.I_to_complex, e]
      push_cast
      ring
- id: fa_orthogonal_iff_norm_le_add_smul
  kind: gap
  level: 3
  topic: ヒルベルト空間・直交性の判定
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上の内積空間、$x,y\in E$とする。$\langle x,y\rangle=0$であることと、全てのスカラー$t$で$\|x\|\leq\|x+ty\|$であることは同値である。
  statement_en: For x, y in an inner product space over ℝ or ℂ, ⟨x,y⟩ = 0 if and only if ‖x‖ ≤ ‖x + ty‖ for all scalars t.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上の内積空間
  - $x,y\in E$
  quantifiers:
  - 任意の$E,x,y$
  conclusion: $\langle x,y\rangle=0$と、全てのスカラー$t$で$\|x\|\leq\|x+ty\|$となることは同値である。
  answer: |
    $E$を内積空間（第2変数について線形）、$x,y\in E$とする。

    $\langle x,y\rangle=0$なら、$\|x+ty\|^2=\|x\|^2+\|ty\|^2\geq\|x\|^2$である。

    逆に、全ての$t$で$\|x\|\leq\|x+ty\|$とする。$y=0$なら結論は明らかなので、$y\neq 0$とする。$c=\langle y,x\rangle/\|y\|^2$とおくと$\langle y,x-cy\rangle=0$である。ピタゴラスの定理より$\|x\|^2=\|x-cy\|^2+\|cy\|^2$である。仮定を$t=-c$に使うと$\|x\|\leq\|x-cy\|$なので、$\|cy\|=0$である。$y\neq 0$より$c=0$であり、$\langle y,x\rangle=0$である。共役をとって$\langle x,y\rangle=0$を得る。
  strategy: Test the inequality at the scalar giving the orthogonal projection of x on y.
  sketch:
  - 'derive: Orthogonality and Pythagoras give ‖x + ty‖ ≥ ‖x‖.'
  - 'construct: For the converse set c = ⟨y,x⟩/‖y‖², so x - cy is orthogonal to y.'
  - 'derive: Pythagoras gives ‖x‖² = ‖x-cy‖² + ‖cy‖².'
  - 'derive: The hypothesis at t = -c forces ‖cy‖ = 0.'
  - 'conclude: So c = 0 and ⟨x,y⟩ = 0.'
  openmath: (forall (E x y) (-> (and (inner_product_space E) (in x E) (in y E)) (<-> (= (inner_product x y) 0) (forall (t) (<= (norm x) (norm (+ x (* t y))))))))
  hard_negative:
    statement: $\|x\|\leq\|x+y\|$だけで$\langle x,y\rangle=0$である。
    reason: $E=\mathbb{R}$、$x=y=1$では$1\leq 2$だが$\langle x,y\rangle=1$である。全ての$t$についての条件が要る。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [InnerProductSpace 𝕜 E] (x y : E), inner 𝕜 x y = 0 ↔ ∀ t : 𝕜, ‖x‖ ≤ ‖x + t • y‖
  proof: |
    by
      intro 𝕜 _ E _ _ x y
      constructor
      · intro h t
        have h1 : inner 𝕜 x (t • y) = 0 := by rw [inner_smul_right, h, mul_zero]
        have h2 := norm_add_sq_eq_norm_sq_add_norm_sq_of_inner_eq_zero (𝕜 := 𝕜) x (t • y) h1
        have h3 : ‖x‖ ^ 2 ≤ ‖x + t • y‖ ^ 2 := by nlinarith [sq_nonneg ‖t • y‖]
        exact (pow_le_pow_iff_left₀ (norm_nonneg _) (norm_nonneg _) two_ne_zero).mp h3
      · intro h
        by_cases hy : y = 0
        · simp [hy]
        have hy2 : (inner 𝕜 y y : 𝕜) ≠ 0 := inner_self_ne_zero.mpr hy
        set c : 𝕜 := inner 𝕜 y x / inner 𝕜 y y with hc
        have h0 : inner 𝕜 y (x - c • y) = 0 := by
          rw [inner_sub_right, inner_smul_right, hc, div_mul_cancel₀ _ hy2, sub_self]
        have h1 : inner 𝕜 (x - c • y) (c • y) = 0 := by
          rw [inner_smul_right, ← inner_conj_symm, h0]; simp
        have h2 := norm_add_sq_eq_norm_sq_add_norm_sq_of_inner_eq_zero (𝕜 := 𝕜) (x - c • y) (c • y) h1
        rw [sub_add_cancel] at h2
        have h3 := h (-c)
        have h4 : x + (-c) • y = x - c • y := by rw [neg_smul, sub_eq_add_neg]
        rw [h4] at h3
        have h5 : ‖x‖ ^ 2 ≤ ‖x - c • y‖ ^ 2 := (pow_le_pow_iff_left₀ (norm_nonneg _) (norm_nonneg _) two_ne_zero).mpr h3
        have h6 : ‖c • y‖ ^ 2 ≤ 0 := by linarith
        have h7 : ‖c • y‖ = 0 := by nlinarith [norm_nonneg (c • y)]
        have h8 : c = 0 := by
          have := norm_eq_zero.mp h7
          exact (smul_eq_zero.mp this).resolve_right hy
        have h9 : inner 𝕜 y x = 0 := by
          rw [hc, div_eq_zero_iff] at h8
          exact h8.resolve_right hy2
        rw [← inner_conj_symm, h9]; simp
- id: fa_weak_conv_and_norm_conv_implies_strong
  kind: gap
  level: 3
  topic: ヒルベルト空間・弱収束と強収束
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上の内積空間、$(x_n)$を列、$a\in H$とする。全ての$y$で$\langle y,x_n\rangle\to\langle y,a\rangle$かつ$\|x_n\|\to\|a\|$ならば、$x_n\to a$（ノルム収束）である。
  statement_en: In an inner product space over ℝ or ℂ, if ⟨y,x_n⟩ → ⟨y,a⟩ for all y and ‖x_n‖ → ‖a‖, then x_n → a in norm.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上の内積空間
  - 全ての$y$で$\langle y,x_n\rangle\to\langle y,a\rangle$
  - $\|x_n\|\to\|a\|$
  quantifiers:
  - 任意の$H,(x_n),a$
  conclusion: $\|x_n-a\|\to 0$である。
  answer: |
    $H$を内積空間、$(x_n)$を列、$a\in H$とし、全ての$y$で$\langle y,x_n\rangle\to\langle y,a\rangle$、$\|x_n\|\to\|a\|$とする。

    展開すると$\|x_n-a\|^2=\|x_n\|^2-2\mathrm{Re}\langle a,x_n\rangle+\|a\|^2$である。$y=a$として$\langle a,x_n\rangle\to\langle a,a\rangle=\|a\|^2$なので、右辺は$\|a\|^2-2\|a\|^2+\|a\|^2=0$に収束する。
  strategy: Expand ‖x_n - a‖² and take limits of each term.
  sketch:
  - 'derive: Expand ‖x_n - a‖² as ‖x_n‖² - 2Re⟨a,x_n⟩ + ‖a‖².'
  - 'derive: The hypotheses give the limits of the terms, using y = a.'
  - 'conclude: The right side tends to 0.'
  openmath: (forall (H x a) (-> (and (inner_product_space H) (in a H) (forall (y) (-> (in y H) (seq_fn_tends_to (lambda (n) (inner_product y (seq_value x n))) (inner_product y a)))) (seq_fn_tends_to (lambda (n) (norm (seq_value x n))) (norm a))) (seq_tends_to x a)))
  hard_negative:
    statement: 弱収束だけでノルム収束する。
    reason: 正規直交列$e_n$は$0$に弱収束するが、$\|e_n\|=1$なのでノルム収束しない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] (x : ℕ → H) (a : H), (∀ y, Filter.Tendsto (fun n => inner 𝕜 y (x n)) Filter.atTop (nhds (inner 𝕜 y a))) → Filter.Tendsto (fun n => ‖x n‖) Filter.atTop (nhds ‖a‖) → Filter.Tendsto x Filter.atTop (nhds a)
  proof: |
    by
      intro 𝕜 _ H _ _ x a hw hn
      rw [tendsto_iff_norm_sub_tendsto_zero]
      have h1 : Filter.Tendsto (fun n => ‖x n - a‖ ^ 2) Filter.atTop (nhds 0) := by
        have heq : ∀ n, ‖x n - a‖ ^ 2 = ‖x n‖ ^ 2 - 2 * RCLike.re (inner 𝕜 a (x n)) + ‖a‖ ^ 2 := by
          intro n
          rw [@norm_sub_sq 𝕜, inner_re_symm]
        simp_rw [heq]
        have h2 := ((RCLike.continuous_re.tendsto _).comp (hw a))
        have h3 := ((hn.pow 2).sub (h2.const_mul 2)).add_const (‖a‖ ^ 2)
        have h4 : ‖a‖ ^ 2 - 2 * RCLike.re (inner 𝕜 a a) + ‖a‖ ^ 2 = 0 := by
          rw [inner_self_eq_norm_sq (𝕜 := 𝕜)]; ring
        rw [h4] at h3
        exact h3
      have h5 := h1.sqrt
      simpa [Real.sqrt_sq (norm_nonneg _)] using h5
- id: fa_weak_strong_inner_tendsto
  kind: gap
  level: 4
  topic: ヒルベルト空間・弱収束と強収束
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間とする。全ての$v$で$\langle x_n,v\rangle\to\langle a,v\rangle$（弱収束）、$y_n\to b$（ノルム収束）ならば、$\langle x_n,y_n\rangle\to\langle a,b\rangle$である。
  statement_en: In a Hilbert space over ℝ or ℂ, if x_n converges weakly to a, meaning ⟨x_n,v⟩ → ⟨a,v⟩ for all v, and y_n → b in norm, then ⟨x_n,y_n⟩ → ⟨a,b⟩.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - 全ての$v$で$\langle x_n,v\rangle\to\langle a,v\rangle$
  - $y_n\to b$（ノルム収束）
  quantifiers:
  - 任意の$H,(x_n),(y_n),a,b$
  conclusion: $\langle x_n,y_n\rangle\to\langle a,b\rangle$である。
  answer: |
    $H$をヒルベルト空間とし、全ての$v$で$\langle x_n,v\rangle\to\langle a,v\rangle$、$y_n\to b$とする。

    $T_nv=\langle x_n,v\rangle$は$H$上の有界線形汎関数であり、$\|T_n\|=\|x_n\|$である。各$v$で$(T_nv)$は収束するので有界である。$H$は完備なので、一様有界性原理により$M=\sup_n\|x_n\|<\infty$である。

    $\langle x_n,y_n\rangle-\langle a,b\rangle=\langle x_n,y_n-b\rangle+(\langle x_n,b\rangle-\langle a,b\rangle)$である。第1項の絶対値はコーシー・シュワルツの不等式より$M\|y_n-b\|$以下で$0$に収束する。第2項は仮定より$0$に収束する。
  strategy: Uniform boundedness makes the weakly convergent sequence bounded; split the difference into two terms.
  sketch:
  - 'apply_theorem: Pointwise boundedness of the functionals ⟨x_n,·⟩ gives sup ‖x_n‖ = M < ∞.'
  - 'derive: Split the difference as ⟨x_n,y_n-b⟩ + ⟨x_n,b⟩ - ⟨a,b⟩.'
  - 'conclude: Cauchy-Schwarz and weak convergence send both terms to 0.'
  openmath: (forall (H x y a b) (-> (and (hilbert_space H) (in a H) (in b H) (forall (v) (-> (in v H) (seq_fn_tends_to (lambda (n) (inner_product (seq_value x n) v)) (inner_product a v)))) (seq_tends_to y b)) (seq_fn_tends_to (lambda (n) (inner_product (seq_value x n) (seq_value y n))) (inner_product a b))))
  hard_negative:
    statement: $x_n,y_n$がともに弱収束なら$\langle x_n,y_n\rangle\to\langle a,b\rangle$である。
    reason: $x_n=y_n=e_n$（正規直交列）は$0$に弱収束するが、$\langle x_n,y_n\rangle=1$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (x y : ℕ → H) (a b : H), (∀ v, Filter.Tendsto (fun n => inner 𝕜 (x n) v) Filter.atTop (nhds (inner 𝕜 a v))) → Filter.Tendsto y Filter.atTop (nhds b) → Filter.Tendsto (fun n => inner 𝕜 (x n) (y n)) Filter.atTop (nhds (inner 𝕜 a b))
  proof: |
    by
      intro 𝕜 _ H _ _ _ x y a b hw hy
      have hb : ∀ v : H, ∃ C : ℝ, ∀ n, ‖innerSL 𝕜 (x n) v‖ ≤ C := by
        intro v
        obtain ⟨C, hC⟩ := (hw v).norm.isBoundedUnder_le.bddAbove_range
        exact ⟨C, fun n => hC ⟨n, rfl⟩⟩
      obtain ⟨M, hM⟩ := banach_steinhaus hb
      have h1 : Filter.Tendsto (fun n => inner 𝕜 (x n) (y n - b)) Filter.atTop (nhds 0) := by
        apply squeeze_zero_norm (a := fun n => M * ‖y n - b‖)
        · intro n
          exact ((innerSL 𝕜 (x n)).le_opNorm _).trans (by gcongr; exact hM n)
        · have := ((hy.sub_const b).norm).const_mul M
          simpa using this
      have h2 := h1.add (hw b)
      simp only [zero_add] at h2
      refine h2.congr fun n => ?_
      rw [inner_sub_right]; ring
- id: fa_dense_iff_orthogonal_bot
  kind: gap
  level: 4
  topic: ヒルベルト空間・直交補空間
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$K$を部分空間とする。$K$が稠密であることと$K^\perp=\{0\}$は同値である。射影定理は既習とする。
  statement_en: A subspace K of a Hilbert space over ℝ or ℂ is dense if and only if its orthogonal complement is {0}. The projection theorem is taken as known.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $K$は$H$の部分空間
  - 射影定理は既習
  quantifiers:
  - 任意の$H,K$
  conclusion: $K$が稠密であることと$K^\perp=\{0\}$は同値である。
  answer: |
    $H$をヒルベルト空間、$K$を部分空間とする。

    $K$が稠密とし、$x\in K^\perp$をとる。$k_n\in K$を$k_n\to x$となるようにとると、内積の連続性から$\|x\|^2=\lim\langle k_n,x\rangle=0$である。よって$K^\perp=\{0\}$である。

    逆に$K^\perp=\{0\}$とする。$L=\overline{K}$は閉部分空間であり、$L^\perp\subset K^\perp=\{0\}$である。射影定理より任意の$x$は$x=u+v$（$u\in L$、$v\in L^\perp$）と書けるので、$v=0$、$x\in L$である。よって$L=H$である。
  strategy: Use continuity of the inner product in one direction and the projection theorem for the closure in the other.
  sketch:
  - 'derive: If K is dense, an x orthogonal to K is a limit of k_n, so ‖x‖² = 0.'
  - 'derive: Conversely the orthogonal complement of the closure of K is contained in that of K.'
  - 'apply_theorem: The projection theorem decomposes any x along the closure and its orthogonal complement.'
  - 'conclude: The second component vanishes, so the closure is H.'
  openmath: (forall (H K) (-> (and (hilbert_space H) (subspace_of K H)) (<-> (dense_in K H) (= (orthogonal_complement K) (zero_subspace H)))))
  hard_negative:
    statement: 完備でない内積空間でも、$K^\perp=\{0\}$なら$K$は稠密である。
    reason: $E$を$\ell^2$の稠密な真部分空間、$u\in\ell^2\setminus E$、$K=E\cap u^\perp$とする。$K$は$E$の閉な真部分空間なので稠密でない。$K$は$u^\perp$で稠密なので、$K$に直交する$y\in E$は$u$のスカラー倍であり、$u\notin E$より$y=0$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (K : Submodule 𝕜 H), Dense (K : Set H) ↔ Kᗮ = ⊥
  proof: |
    by
      intro 𝕜 _ H _ _ _ K
      rw [← Submodule.topologicalClosure_eq_top_iff, Submodule.dense_iff_topologicalClosure_eq_top]
- id: fa_orthogonal_projection_characterization
  kind: gap
  level: 4
  topic: ヒルベルト空間・正射影
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上の内積空間、$K$を完備な部分空間、$P_K$を$K$への正射影とする。$x,v\in H$について$P_Kx=v$であることと、$v\in K$かつ$x-v\in K^\perp$であることは同値である。ヒルベルト空間の閉部分空間は完備な部分空間である。
  statement_en: Let K be a complete subspace of an inner product space H over ℝ or ℂ, for example a closed subspace of a Hilbert space, and P_K the orthogonal projection. Then P_K x = v if and only if v is in K and x - v is in the orthogonal complement of K.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上の内積空間
  - $K$は$H$の完備な部分空間
  - $P_K$は$K$への正射影
  quantifiers:
  - 任意の$H,K$と$x,v\in H$
  conclusion: $P_Kx=v$と、$v\in K$かつ$x-v\in K^\perp$であることは同値である。
  answer: |
    $H$を内積空間、$K$を完備な部分空間とする。$K$は完備なので射影定理が使え、$x\in H$は$x=u+w$（$u\in K$、$w\in K^\perp$）と一意に書ける。$P_Kx=u$である。

    $P_Kx=v$なら$v=u\in K$であり、$x-v=w\in K^\perp$である。

    逆に$v\in K$、$x-v\in K^\perp$とする。$x=v+(x-v)$は$x$の分解なので、分解の一意性から$v=u=P_Kx$である。
  strategy: The statement is the uniqueness of the orthogonal decomposition.
  sketch:
  - 'apply_theorem: The projection theorem gives a unique decomposition x = u + w with u in K and w orthogonal to K.'
  - 'derive: P_K x = u gives the forward direction.'
  - 'conclude: Uniqueness of the decomposition gives the converse.'
  openmath: (forall (H K x v) (-> (and (inner_product_space H) (subspace_of K H) (complete_space K) (in x H) (in v H)) (<-> (= (orthogonal_projection K x) v) (and (in v K) (in (- x v) (orthogonal_complement K))))))
  hard_negative:
    statement: $v\in K$かつ$\|x-v\|\leq\|x\|$なら$P_Kx=v$である。
    reason: $H=\mathbb{R}^2$、$K=\mathbb{R}e_1$、$x=e_1+e_2$、$v=(1/2)e_1$とすると$\|x-v\|<\|x\|$だが$P_Kx=e_1\neq v$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] (K : Submodule 𝕜 H) [CompleteSpace K] (x v : H), K.starProjection x = v ↔ v ∈ K ∧ x - v ∈ Kᗮ
  proof: |
    by
      intro 𝕜 _ H _ _ K _ x v
      constructor
      · rintro rfl
        exact ⟨K.starProjection_apply_mem x, K.sub_starProjection_mem_orthogonal x⟩
      · rintro ⟨h1, h2⟩
        exact Submodule.eq_starProjection_of_mem_orthogonal h1 h2
- id: fa_orthogonal_projection_pythagoras
  kind: gap
  level: 4
  topic: ヒルベルト空間・正射影
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上の内積空間、$K$を完備な部分空間、$P_K$を正射影とする。全ての$x$で$\|x\|^2=\|P_Kx\|^2+\|x-P_Kx\|^2$であり、$\|P_Kx\|\leq\|x\|$である。
  statement_en: For a complete subspace K of an inner product space over ℝ or ℂ with orthogonal projection P_K, ‖x‖² = ‖P_K x‖² + ‖x - P_K x‖² and ‖P_K x‖ ≤ ‖x‖ for all x.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上の内積空間
  - $K$は$H$の完備な部分空間
  quantifiers:
  - 任意の$H,K,x$
  conclusion: $\|x\|^2=\|P_Kx\|^2+\|x-P_Kx\|^2$かつ$\|P_Kx\|\leq\|x\|$である。
  answer: |
    $H$を内積空間、$K$を完備な部分空間、$x\in H$とする。$P_Kx\in K$、$x-P_Kx\in K^\perp$なので、この二つは直交する。ピタゴラスの定理より
    $\|x\|^2=\|P_Kx+(x-P_Kx)\|^2=\|P_Kx\|^2+\|x-P_Kx\|^2$
    である。第2項は非負なので$\|P_Kx\|^2\leq\|x\|^2$であり、$\|P_Kx\|\leq\|x\|$である。
  strategy: Apply Pythagoras to the orthogonal decomposition.
  sketch:
  - 'derive: P_K x and x - P_K x are orthogonal.'
  - 'derive: Pythagoras gives the identity.'
  - 'conclude: Dropping the nonnegative term gives the norm bound.'
  openmath: (forall (H K x) (-> (and (inner_product_space H) (subspace_of K H) (complete_space K) (in x H)) (and (= (^ (norm x) 2) (+ (^ (norm (orthogonal_projection K x)) 2) (^ (norm (- x (orthogonal_projection K x))) 2))) (<= (norm (orthogonal_projection K x)) (norm x)))))
  hard_negative:
    statement: 直交しない冪等作用素$P$でも$\|Px\|\leq\|x\|$である。
    reason: $\mathbb{R}^2$の$P(x_1,x_2)=(x_1+x_2,0)$は$P^2=P$だが、$x=(1,1)$で$\|Px\|=2>\sqrt 2=\|x\|$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] (K : Submodule 𝕜 H) [CompleteSpace K] (x : H), ‖x‖ ^ 2 = ‖K.starProjection x‖ ^ 2 + ‖x - K.starProjection x‖ ^ 2 ∧ ‖K.starProjection x‖ ≤ ‖x‖
  proof: |
    by
      intro 𝕜 _ H _ _ K _ x
      have h := Submodule.norm_sq_eq_add_norm_sq_starProjection x K
      rw [Submodule.starProjection_orthogonal_val] at h
      exact ⟨h, K.norm_starProjection_apply_le x⟩
- id: fa_idempotent_self_adjoint_is_orthogonal_projection
  kind: textbook
  level: 4
  topic: ヒルベルト空間・正射影
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$P$を$H$上の有界線形作用素とする。$P^2=P$かつ$P^*=P$であることと、$P$がある閉部分空間への正射影であることは同値である。
  statement_en: A bounded operator P on a Hilbert space over ℝ or ℂ satisfies P² = P and P* = P if and only if P is the orthogonal projection onto some closed subspace.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $P$は$H$上の有界線形作用素
  quantifiers:
  - 任意の$H,P$
  conclusion: $P^2=P$かつ$P^*=P$であることと、$P$が閉部分空間（完備な部分空間）への正射影であることは同値である。
  answer: |
    $H$をヒルベルト空間、$P$を有界線形作用素とする。

    $P^2=P=P^*$とする。$K=\{x:Px=x\}$は$\ker(I-P)$なので閉部分空間であり、$H$の完備性から完備である。任意の$x$で$P(Px)=Px$より$Px\in K$である。$u\in K$なら$\langle x-Px,u\rangle=\langle x-Px,Pu\rangle=\langle P(x-Px),u\rangle=0$なので$x-Px\in K^\perp$である。正射影の特徴づけにより$P=P_K$である。

    逆に$P=P_K$とする。$P_Kx\in K$なので$P_K(P_Kx)=P_Kx$である。また$x-P_Kx\perp K$、$y-P_Ky\perp K$より$\langle P_Kx,y\rangle=\langle P_Kx,P_Ky\rangle=\langle x,P_Ky\rangle$なので$P_K^*=P_K$である。
  strategy: Take K to be the fixed-point set of P and verify the projection characterization.
  sketch:
  - 'construct: Let K be the kernel of I - P, a closed subspace.'
  - 'derive: Px is in K and x - Px is orthogonal to K by self-adjointness and idempotence.'
  - 'apply_theorem: The characterization of the projection gives P = P_K.'
  - 'derive: Conversely a projection is idempotent and ⟨P_K x,y⟩ = ⟨P_K x,P_K y⟩ = ⟨x,P_K y⟩.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (H p) (-> (and (hilbert_space H) (bounded_operator p H H)) (<-> (and (= (operator_comp p p) p) (= (adjoint p) p)) (exists (K) (and (subspace_of K H) (complete_space K) (forall (x) (-> (in x H) (= (fn_value p x) (orthogonal_projection K x)))))))))
  hard_negative:
    statement: $P^2=P$だけで$P$は正射影である。
    reason: $\mathbb{R}^2$の$P(x_1,x_2)=(x_1+x_2,0)$は$P^2=P$だが、$\ker P$は値域に直交しない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (P : H →L[𝕜] H), (P * P = P ∧ ContinuousLinearMap.adjoint P = P) ↔ ∃ (K : Submodule 𝕜 H) (_ : CompleteSpace K), P = K.starProjection
  proof: |
    by
      intro 𝕜 _ H _ _ _ P
      constructor
      · rintro ⟨h1, h2⟩
        have hp : IsStarProjection P := ⟨h1, h2⟩
        obtain ⟨h3, h4⟩ := isStarProjection_iff_eq_starProjection_range.mp hp
        have hc : IsClosed (((P : H →ₗ[𝕜] H).range : Submodule 𝕜 H) : Set H) := ContinuousLinearMap.IsIdempotentElem.isClosed_range h1
        exact ⟨_, hc.completeSpace_coe, h4⟩
      · rintro ⟨K, hK, rfl⟩
        have h := isStarProjection_starProjection (U := K)
        exact ⟨h.isIdempotentElem, h.isSelfAdjoint⟩
- id: fa_idempotent_norm_le_one_self_adjoint
  kind: gap
  level: 4
  topic: ヒルベルト空間・正射影
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$P$を$P^2=P$である有界線形作用素とする。$P^*=P$であることと$\|P\|\leq 1$は同値である。
  statement_en: For a bounded idempotent operator P on a Hilbert space over ℝ or ℂ, P* = P if and only if ‖P‖ ≤ 1.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $P$は有界線形作用素で$P^2=P$
  quantifiers:
  - 任意の$H,P$
  conclusion: $P^*=P$と$\|P\|\leq 1$は同値である。
  answer: |
    $H$をヒルベルト空間、$P$を$P^2=P$の有界線形作用素とする。

    $P^*=P$なら$\|Px\|^2=\langle Px,Px\rangle=\langle x,P^2x\rangle=\langle x,Px\rangle\leq\|x\|\|Px\|$なので$\|Px\|\leq\|x\|$である。

    逆に$\|P\|\leq 1$とする。$y$を$P$の値域の元、$z\in\ker P$とする。$Py=y$なので、任意のスカラー$t$で$\|y\|=\|P(y+tz)\|\leq\|y+tz\|$である。直交性の判定により$\langle y,z\rangle=0$である。

    任意の$x,x'$に対し$x-Px\in\ker P$、$Px'$は値域の元なので$\langle Px',x-Px\rangle=0$である。同様に$\langle x'-Px',Px\rangle=0$である。よって$\langle Px',x\rangle=\langle Px',Px\rangle=\langle x',Px\rangle$であり、$P^*=P$である。
  strategy: Show the range and kernel are orthogonal by the minimal-norm criterion for orthogonality.
  sketch:
  - 'derive: If P* = P then ‖Px‖² = ⟨x,Px⟩ ≤ ‖x‖‖Px‖.'
  - 'setup: Conversely take y in the range and z in the kernel.'
  - 'derive: ‖y‖ = ‖P(y+tz)‖ ≤ ‖y+tz‖ for all t, so y is orthogonal to z.'
  - 'derive: x - Px is in the kernel and Px'' is in the range.'
  - 'conclude: Hence ⟨Px'',x⟩ = ⟨Px'',Px⟩ = ⟨x'',Px⟩, so P* = P.'
  openmath: (forall (H p) (-> (and (hilbert_space H) (bounded_operator p H H) (= (operator_comp p p) p)) (<-> (= (adjoint p) p) (<= (norm p) 1))))
  hard_negative:
    statement: 冪等性なしで$\|P\|\leq 1$なら$P^*=P$である。
    reason: $\mathbb{C}$上の掛け算$Px=ix$は$\|P\|=1$だが$P^*=-P\neq P$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (P : H →L[𝕜] H), P * P = P → (ContinuousLinearMap.adjoint P = P ↔ ‖P‖ ≤ 1)
  proof: |
    by
      intro 𝕜 _ H _ _ _ P hP
      constructor
      · intro hs
        have hp : IsStarProjection P := ⟨hP, hs⟩
        obtain ⟨h3, h4⟩ := isStarProjection_iff_eq_starProjection_range.mp hp
        rw [h4]
        exact Submodule.starProjection_norm_le _
      · intro hn
        have hsym : (P : H →ₗ[𝕜] H).IsSymmetric := by
          have hid : IsIdempotentElem (P : H →ₗ[𝕜] H) := by
            ext x
            exact congrArg (fun F => F x) hP
          rw [LinearMap.IsIdempotentElem.isSymmetric_iff_isOrtho_range_ker hid, Submodule.isOrtho_iff_inner_eq]
          rintro _ ⟨u, rfl⟩ z hz
          have hz' : P z = 0 := hz
          set y := P u with hy
          have hPy : P y = y := congrArg (fun F => F u) hP
          by_cases hz0 : z = 0
          · simp [hz0]
          have hzz : (inner 𝕜 z z : 𝕜) ≠ 0 := inner_self_ne_zero.mpr hz0
          set c : 𝕜 := inner 𝕜 z y / inner 𝕜 z z with hc
          have h0 : inner 𝕜 z (y - c • z) = 0 := by
            rw [inner_sub_right, inner_smul_right, hc, div_mul_cancel₀ _ hzz, sub_self]
          have h1 : inner 𝕜 (y - c • z) (c • z) = 0 := by
            rw [inner_smul_right, ← inner_conj_symm, h0]; simp
          have h2 := norm_add_sq_eq_norm_sq_add_norm_sq_of_inner_eq_zero (𝕜 := 𝕜) (y - c • z) (c • z) h1
          rw [sub_add_cancel] at h2
          have h3 : ‖y‖ ≤ ‖y - c • z‖ := by
            have e : P (y - c • z) = y := by rw [map_sub, map_smul, hz', smul_zero, sub_zero, hPy]
            calc ‖y‖ = ‖P (y - c • z)‖ := by rw [e]
              _ ≤ ‖P‖ * ‖y - c • z‖ := P.le_opNorm _
              _ ≤ 1 * ‖y - c • z‖ := by gcongr
              _ = ‖y - c • z‖ := one_mul _
          have h5 : ‖y‖ ^ 2 ≤ ‖y - c • z‖ ^ 2 := (pow_le_pow_iff_left₀ (norm_nonneg _) (norm_nonneg _) two_ne_zero).mpr h3
          have h6 : ‖c • z‖ ^ 2 ≤ 0 := by linarith
          have h7 : ‖c • z‖ = 0 := by nlinarith [norm_nonneg (c • z)]
          have h8 : c = 0 := (smul_eq_zero.mp (norm_eq_zero.mp h7)).resolve_right hz0
          have h9 : inner 𝕜 z y = 0 := by
            rw [hc, div_eq_zero_iff] at h8
            exact h8.resolve_right hzz
          change inner 𝕜 y z = 0
          rw [← inner_conj_symm, h9]; simp
        exact ContinuousLinearMap.isSelfAdjoint_iff_isSymmetric.mpr hsym
- id: fa_convex_nearest_point_variational
  kind: gap
  level: 4
  topic: ヒルベルト空間・凸集合への射影
  statement: $F$を実内積空間、$K$を凸集合、$u\in F$、$v\in K$とする。$v$が$K$の中で$u$に最も近い点であること（全ての$w\in K$で$\|u-v\|\leq\|u-w\|$）と、全ての$w\in K$で$\langle u-v,w-v\rangle\leq 0$であることは同値である。
  statement_en: Let K be a convex subset of a real inner product space, u a point and v in K. Then v is a nearest point of K to u, that is ‖u-v‖ ≤ ‖u-w‖ for all w in K, if and only if ⟨u-v, w-v⟩ ≤ 0 for all w in K.
  assumptions:
  - $F$は実内積空間
  - $K\subset F$は凸集合
  - $u\in F$、$v\in K$
  quantifiers:
  - 任意の$F,K,u,v$
  conclusion: 全ての$w\in K$で$\|u-v\|\leq\|u-w\|$であることと、全ての$w\in K$で$\langle u-v,w-v\rangle\leq 0$であることは同値である。
  answer: |
    $F$を実内積空間、$K$を凸集合、$u\in F$、$v\in K$とする。$w\in K$に対し
    $\|u-w\|^2=\|u-v\|^2-2\langle u-v,w-v\rangle+\|w-v\|^2$
    である。

    全ての$w\in K$で$\langle u-v,w-v\rangle\leq 0$なら、この式から$\|u-w\|^2\geq\|u-v\|^2$である。

    逆に$v$が最も近い点であるとし、$w\in K$、$0<t\leq 1$をとる。凸性から$v+t(w-v)\in K$である。上の式を$w$の代わりにこの点に適用すると
    $\|u-v\|^2\leq\|u-v\|^2-2t\langle u-v,w-v\rangle+t^2\|w-v\|^2$
    である。よって$2\langle u-v,w-v\rangle\leq t\|w-v\|^2$である。$t\to 0$として$\langle u-v,w-v\rangle\leq 0$を得る。
  strategy: Expand ‖u-w‖² around v and, for the converse, test on the segment from v to w.
  sketch:
  - 'derive: Expand ‖u-w‖² as ‖u-v‖² - 2⟨u-v,w-v⟩ + ‖w-v‖².'
  - 'derive: The inner product condition makes v nearest.'
  - 'construct: Conversely use v + t(w-v) in K for t in (0,1].'
  - 'conclude: Dividing by t and letting t → 0 gives the inequality.'
  openmath: (forall (F K u v) (-> (and (inner_product_space F) (real_vector_space F) (convex_set K) (subset K F) (in u F) (in v K)) (<-> (forall (w) (-> (in w K) (<= (norm (- u v)) (norm (- u w))))) (forall (w) (-> (in w K) (<= (inner_product (- u v) (- w v)) 0))))))
  hard_negative:
    statement: 凸でない集合$K$でも同じ同値が成り立つ。
    reason: $F=\mathbb{R}$、$K=\{0,3\}$、$u=1$、$v=0$なら$v$は最も近い点だが、$w=3$で$\langle u-v,w-v\rangle=3>0$である。
  target: |
    ∀ (F : Type*) [NormedAddCommGroup F] [InnerProductSpace ℝ F] (K : Set F) (u v : F), Convex ℝ K → v ∈ K → ((∀ w ∈ K, ‖u - v‖ ≤ ‖u - w‖) ↔ ∀ w ∈ K, inner ℝ (u - v) (w - v) ≤ 0)
  proof: |
    by
      intro F _ _ K u v hK hv
      rw [← norm_eq_iInf_iff_real_inner_le_zero hK hv]
      haveI : Nonempty K := ⟨⟨v, hv⟩⟩
      have hbdd : BddBelow (Set.range fun w : K => ‖u - w‖) := ⟨0, by rintro _ ⟨w, rfl⟩; exact norm_nonneg _⟩
      constructor
      · intro h
        exact le_antisymm (le_ciInf fun w => h w w.2) (ciInf_le hbdd ⟨v, hv⟩)
      · intro h w hw
        rw [h]
        exact ciInf_le hbdd ⟨w, hw⟩
- id: fa_projection_onto_convex_nonexpansive
  kind: gap
  level: 4
  topic: ヒルベルト空間・凸集合への射影
  statement: $F$を実内積空間、$K$を凸集合とする。$v_1,v_2\in K$がそれぞれ$u_1,u_2$に最も近い$K$の点ならば、$\|v_1-v_2\|\leq\|u_1-u_2\|$である。すなわち凸集合への最近点射影は$1$-リプシッツである。
  statement_en: Let K be a convex subset of a real inner product space. If v₁ and v₂ in K are nearest points of K to u₁ and u₂, then ‖v₁ - v₂‖ ≤ ‖u₁ - u₂‖. So the nearest-point projection onto a convex set is 1-Lipschitz.
  assumptions:
  - $F$は実内積空間
  - $K\subset F$は凸集合
  - $v_i\in K$は$K$の中で$u_i$に最も近い点（$i=1,2$）
  quantifiers:
  - 任意の$F,K,u_1,u_2,v_1,v_2$
  conclusion: $\|v_1-v_2\|\leq\|u_1-u_2\|$である。
  answer: |
    $F$を実内積空間、$K$を凸集合、$v_i\in K$を$K$の中で$u_i$に最も近い点とする。

    最近点の変分不等式により$\langle u_1-v_1,v_2-v_1\rangle\leq 0$、$\langle u_2-v_2,v_1-v_2\rangle\leq 0$である。二つを足して整理すると
    $\|v_1-v_2\|^2\leq\langle u_1-u_2,v_1-v_2\rangle$
    である。コーシー・シュワルツの不等式より右辺は$\|u_1-u_2\|\|v_1-v_2\|$以下である。$v_1=v_2$なら結論は明らかであり、そうでなければ$\|v_1-v_2\|$で割って結論を得る。
  strategy: Add the two variational inequalities and apply Cauchy-Schwarz.
  sketch:
  - 'apply_theorem: The variational inequalities hold at v₁ and v₂.'
  - 'derive: Adding them gives ‖v₁-v₂‖² ≤ ⟨u₁-u₂,v₁-v₂⟩.'
  - 'conclude: Cauchy-Schwarz gives the bound.'
  openmath: (forall (F K u1 u2 v1 v2) (-> (and (inner_product_space F) (real_vector_space F) (convex_set K) (subset K F) (in v1 K) (in v2 K) (forall (w) (-> (in w K) (<= (norm (- u1 v1)) (norm (- u1 w))))) (forall (w) (-> (in w K) (<= (norm (- u2 v2)) (norm (- u2 w)))))) (<= (norm (- v1 v2)) (norm (- u1 u2)))))
  hard_negative:
    statement: 凸でない閉集合でも最近点は$1$-リプシッツに動く。
    reason: $F=\mathbb{R}$、$K=\{0,3\}$で$u_1=1.4$、$u_2=1.6$の最近点は$0$と$3$である。差は$3$だが$|u_1-u_2|=0.2$である。
  target: |
    ∀ (F : Type*) [NormedAddCommGroup F] [InnerProductSpace ℝ F] (K : Set F) (u₁ u₂ v₁ v₂ : F), Convex ℝ K → v₁ ∈ K → v₂ ∈ K → (∀ w ∈ K, ‖u₁ - v₁‖ ≤ ‖u₁ - w‖) → (∀ w ∈ K, ‖u₂ - v₂‖ ≤ ‖u₂ - w‖) → ‖v₁ - v₂‖ ≤ ‖u₁ - u₂‖
  proof: |
    by
      intro F _ _ K u₁ u₂ v₁ v₂ hK h₁ h₂ m₁ m₂
      have key : ∀ (u v : F), v ∈ K → (∀ w ∈ K, ‖u - v‖ ≤ ‖u - w‖) → ∀ w ∈ K, inner ℝ (u - v) (w - v) ≤ 0 := by
        intro u v hv hm
        haveI : Nonempty K := ⟨⟨v, hv⟩⟩
        have hbdd : BddBelow (Set.range fun w : K => ‖u - w‖) := ⟨0, by rintro _ ⟨w, rfl⟩; exact norm_nonneg _⟩
        exact (norm_eq_iInf_iff_real_inner_le_zero hK hv).mp
          (le_antisymm (le_ciInf fun w => hm w w.2) (ciInf_le hbdd ⟨v, hv⟩))
      have a1 := key u₁ v₁ h₁ m₁ v₂ h₂
      have a2 := key u₂ v₂ h₂ m₂ v₁ h₁
      have a3 : ‖v₁ - v₂‖ ^ 2 ≤ inner ℝ (u₁ - u₂) (v₁ - v₂) := by
        have e1 : inner ℝ (u₁ - v₁) (v₂ - v₁) + inner ℝ (u₂ - v₂) (v₁ - v₂) = inner ℝ (v₁ - v₂) (v₁ - v₂) - inner ℝ (u₁ - u₂) (v₁ - v₂) := by
          simp only [inner_sub_left, inner_sub_right]; ring
        rw [real_inner_self_eq_norm_sq] at e1
        linarith
      have a4 := real_inner_le_norm (u₁ - u₂) (v₁ - v₂)
      by_cases h0 : ‖v₁ - v₂‖ = 0
      · rw [h0]; exact norm_nonneg _
      have hp : 0 < ‖v₁ - v₂‖ := lt_of_le_of_ne (norm_nonneg _) (Ne.symm h0)
      have : ‖v₁ - v₂‖ * ‖v₁ - v₂‖ ≤ ‖u₁ - u₂‖ * ‖v₁ - v₂‖ := by nlinarith
      exact le_of_mul_le_mul_right this hp
- id: fa_riesz_representative_norm_eq
  kind: gap
  level: 4
  topic: ヒルベルト空間・リースの表現
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E$を$\mathbb{K}$上の内積空間（第2変数について線形）、$f$を有界線形汎関数、$y\in E$とする。全ての$x$で$f(x)=\langle y,x\rangle$ならば$\|f\|=\|y\|$である。
  statement_en: In an inner product space over ℝ or ℂ, linear in the second variable, if a bounded functional f has the form f(x) = ⟨y,x⟩ for all x, then ‖f‖ = ‖y‖.
  assumptions:
  - $E$は$\mathbb{R}$または$\mathbb{C}$上の内積空間で、内積は第2変数について線形
  - $f$は有界線形汎関数
  - 全ての$x$で$f(x)=\langle y,x\rangle$
  quantifiers:
  - 任意の$E,f,y$
  conclusion: $\|f\|=\|y\|$である。
  answer: |
    $E$を内積空間、$f$を有界線形汎関数、$y\in E$とし、全ての$x$で$f(x)=\langle y,x\rangle$とする。

    コーシー・シュワルツの不等式より$|f(x)|\leq\|y\|\|x\|$なので、$\|f\|\leq\|y\|$である。

    $y=0$なら$f=0$で等号が成り立つ。$y\neq 0$なら$x=y$として$\|y\|^2=|f(y)|\leq\|f\|\|y\|$となり、$\|y\|\leq\|f\|$である。
  strategy: Cauchy-Schwarz bounds the norm above and testing at y bounds it below.
  sketch:
  - 'derive: Cauchy-Schwarz gives ‖f‖ ≤ ‖y‖.'
  - 'derive: Testing at x = y gives ‖y‖² ≤ ‖f‖‖y‖.'
  - 'conclude: Hence ‖f‖ = ‖y‖.'
  openmath: (forall (E f y) (-> (and (inner_product_space E) (in f (dual_space E)) (in y E) (forall (x) (-> (in x E) (= (fn_value f x) (inner_product y x))))) (= (norm f) (norm y))))
  hard_negative:
    statement: 完備でない内積空間でも全ての有界線形汎関数は$\langle y,\cdot\rangle$と表せる。
    reason: $E$を$\ell^2$の稠密な真部分空間、$u\in\ell^2\setminus E$とする。$f=\langle u,\cdot\rangle|_E$を$\langle y,\cdot\rangle$（$y\in E$）と書くと、稠密性から$u=y$となり矛盾する。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [InnerProductSpace 𝕜 E] (f : StrongDual 𝕜 E) (y : E), (∀ x, f x = inner 𝕜 y x) → ‖f‖ = ‖y‖
  proof: |
    by
      intro 𝕜 _ E _ _ f y h
      have : f = innerSL 𝕜 y := by
        ext x
        simp [h x]
      rw [this, innerSL_apply_norm]
- id: fa_parseval_polarized
  kind: gap
  level: 4
  topic: ヒルベルト空間・パーセバルの等式
  statement: パーセバルの等式の極化形。$\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間（内積は第2変数について線形）、$(b_i)_{i\in I}$を完全正規直交系とする。全ての$x,y$で$\sum_i\langle x,b_i\rangle\langle b_i,y\rangle$は無条件収束し、和は$\langle x,y\rangle$である。$\|x\|^2$の形のパーセバルの等式を2変数にしたものである。
  statement_en: Polarized Parseval identity. For a Hilbert basis (b_i) of a Hilbert space over ℝ or ℂ, linear in the second variable, the family ⟨x,b_i⟩⟨b_i,y⟩ is summable with sum ⟨x,y⟩. This is the two-variable form of the identity for ‖x‖².
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間で、内積は第2変数について線形
  - $(b_i)_{i\in I}$は完全正規直交系
  quantifiers:
  - 任意の$H,(b_i),x,y$
  conclusion: $\sum_i\langle x,b_i\rangle\langle b_i,y\rangle=\langle x,y\rangle$（無条件収束）である。
  answer: |
    $H$をヒルベルト空間、$(b_i)_{i\in I}$を完全正規直交系、$x,y\in H$とする。完全正規直交系による展開から、$y=\sum_i\langle b_i,y\rangle b_i$は無条件収束する。

    $\langle x,\cdot\rangle$は連続線形なので、有限部分集合$s\subset I$について$\sum_{i\in s}\langle x,b_i\rangle\langle b_i,y\rangle=\langle x,\sum_{i\in s}\langle b_i,y\rangle b_i\rangle$であり、$s$を増やした極限は$\langle x,y\rangle$である。
  strategy: Apply the continuous functional ⟨x,·⟩ to the basis expansion of y.
  sketch:
  - 'apply_theorem: The Hilbert basis expansion of y converges unconditionally.'
  - 'derive: ⟨x,·⟩ is continuous and linear, so it passes through finite partial sums.'
  - 'conclude: The net of partial sums converges to ⟨x,y⟩.'
  openmath: (forall (H b x y) (-> (and (hilbert_space H) (hilbert_basis b H) (in x H) (in y H)) (has_sum_fn (lambda (i) (* (inner_product x (seq_value b i)) (inner_product (seq_value b i) y))) (inner_product x y))))
  hard_negative:
    statement: 完全でない正規直交系でも同じ等式が成り立つ。
    reason: $H=\mathbb{R}^2$、正規直交系$\{e_1\}$、$x=y=e_2$では左辺が$0$、右辺が$1$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H ι : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] (b : HilbertBasis ι 𝕜 H) (x y : H), HasSum (fun i => inner 𝕜 x (b i) * inner 𝕜 (b i) y) (inner 𝕜 x y)
  proof: |
    by
      intro 𝕜 _ H ι _ _ b x y
      exact b.hasSum_inner_mul_inner x y
- id: fa_orthonormal_series_summable_iff_l2
  kind: gap
  level: 4
  topic: ヒルベルト空間・正規直交系と級数
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$(v_i)_{i\in I}$を正規直交系、$(a_i)$をスカラーの族とする。$\sum_ia_iv_i$が無条件収束することと$\sum_i|a_i|^2<\infty$は同値である。
  statement_en: For an orthonormal family (v_i) in a Hilbert space over ℝ or ℂ and scalars (a_i), the family a_i v_i is summable if and only if the family |a_i|² is summable.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $(v_i)_{i\in I}$は正規直交系
  - $(a_i)_{i\in I}$はスカラーの族
  quantifiers:
  - 任意の$H,(v_i),(a_i)$
  conclusion: $\sum_ia_iv_i$の無条件収束と$\sum_i|a_i|^2<\infty$は同値である。
  answer: |
    $H$をヒルベルト空間、$(v_i)$を正規直交系、$(a_i)$をスカラーの族とする。有限部分集合$s\subset I$について、ピタゴラスの定理より$\|\sum_{i\in s}a_iv_i\|^2=\sum_{i\in s}|a_i|^2$である。

    完備な空間で族が無条件収束することは、次のコーシー条件と同値である。任意の$\varepsilon>0$に対し有限集合$s_0$があり、$s_0$と交わらない任意の有限集合$s$で和のノルムが$\varepsilon$未満である。

    $H$と$\mathbb{R}$はともに完備である。上の等式より、族$(a_iv_i)$のコーシー条件（閾値$\varepsilon$）と族$(|a_i|^2)$のコーシー条件（閾値$\varepsilon^2$）は同じ内容である。よって二つの収束は同値である。
  strategy: Pythagoras identifies the Cauchy conditions of the two families.
  sketch:
  - 'derive: For finite s, ‖Σ_s a_i v_i‖² = Σ_s |a_i|².'
  - 'translate: In a complete space summability is the Cauchy condition on finite subsets.'
  - 'conclude: The Cauchy conditions of the two families are equivalent.'
  openmath: (forall (H v a) (-> (and (hilbert_space H) (orthonormal_family v H)) (<-> (series_summable_fn (lambda (i) (* (seq_value a i) (seq_value v i)))) (series_summable_fn (lambda (i) (^ (norm (seq_value a i)) 2))))))
  hard_negative:
    statement: $\sum_ia_iv_i$が無条件収束すれば$\sum_i|a_i|<\infty$である。
    reason: $\ell^2$で$v_n=e_n$、$a_n=1/n$とすると$\sum_n|a_n|^2<\infty$なので収束するが、$\sum_n|a_n|=\infty$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H ι : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (v : ι → H) (a : ι → 𝕜), Orthonormal 𝕜 v → ((Summable fun i => a i • v i) ↔ Summable fun i => ‖a i‖ ^ 2)
  proof: |
    by
      intro 𝕜 _ H ι _ _ _ v a hv
      have h := hv.orthogonalFamily.summable_iff_norm_sq_summable a
      simpa using h
- id: fa_total_family_iff_orthogonal_trivial
  kind: gap
  level: 4
  topic: ヒルベルト空間・完全系の判定
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$(v_i)_{i\in I}$をベクトルの族とする。$(v_i)$の張る部分空間が稠密であることと、全ての$i$で$\langle v_i,x\rangle=0$なら$x=0$であることは同値である。
  statement_en: For a family (v_i) in a Hilbert space over ℝ or ℂ, the linear span of the family is dense if and only if the only x with ⟨v_i,x⟩ = 0 for all i is x = 0.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $(v_i)_{i\in I}$は$H$のベクトルの族
  quantifiers:
  - 任意の$H,(v_i)$
  conclusion: 張る部分空間の稠密性と、全ての$i$で$\langle v_i,x\rangle=0$なら$x=0$であることは同値である。
  answer: |
    $H$をヒルベルト空間、$(v_i)$を族とし、$K$をその張る部分空間とする。ヒルベルト空間の部分空間が稠密であることと、直交補空間が$\{0\}$であることは同値である。

    $x\in K^\perp$であることと、全ての$i$で$\langle v_i,x\rangle=0$であることは同値である。実際、内積は第1変数について共役線形なので、$v_i$に直交する$x$は$v_i$の線形結合にも直交する。逆は$v_i\in K$から明らかである。

    よって$K$が稠密であることと、全ての$i$で$\langle v_i,x\rangle=0$なら$x=0$であることは同値である。
  strategy: Compute the orthogonal complement of the span and apply the density criterion.
  sketch:
  - 'apply_theorem: A subspace of a Hilbert space is dense exactly when its orthogonal complement is 0.'
  - 'derive: x is orthogonal to the span exactly when it is orthogonal to every v_i.'
  - 'conclude: The two conditions agree.'
  openmath: (forall (H v) (-> (hilbert_space H) (<-> (dense_in (linear_span v) H) (forall (x) (-> (and (in x H) (forall (i) (= (inner_product (seq_value v i) x) 0))) (= x 0))))))
  hard_negative:
    statement: 完全でない内積空間でも同じ同値が成り立つ。
    reason: $E$を$\ell^2$の稠密な真部分空間、$u\in\ell^2\setminus E$、$K=E\cap u^\perp$とし、$(v_i)$を$K$の元全体とする。$K$は$E$で稠密でないが、$K$に直交する$x\in E$は$u$のスカラー倍なので$x=0$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H ι : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (v : ι → H), (Submodule.span 𝕜 (Set.range v)).topologicalClosure = ⊤ ↔ ∀ x, (∀ i, inner 𝕜 (v i) x = 0) → x = 0
  proof: |
    by
      intro 𝕜 _ H ι _ _ _ v
      rw [Submodule.topologicalClosure_eq_top_iff, Submodule.eq_bot_iff]
      constructor
      · intro h x hx
        apply h x
        rw [Submodule.mem_orthogonal]
        intro u hu
        induction hu using Submodule.span_induction with
        | mem u hu => obtain ⟨i, rfl⟩ := hu; exact hx i
        | zero => simp
        | add u w _ _ hu hw => rw [inner_add_left, hu, hw, add_zero]
        | smul c u _ hu => rw [inner_smul_left, hu, mul_zero]
      · intro h x hx
        exact h x fun i => (Submodule.mem_orthogonal _ _).mp hx (v i) (Submodule.subset_span ⟨i, rfl⟩)
- id: fa_hilbert_basis_isometric_to_l2
  kind: textbook
  level: 4
  topic: ヒルベルト空間・$\ell^2$との同型
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$(b_i)_{i\in I}$を完全正規直交系とする。$Ux=(\langle b_i,x\rangle)_{i\in I}$は$H$から$\ell^2(I)$への全射線形等長写像である。
  statement_en: For a Hilbert basis (b_i), i in I, of a Hilbert space H over ℝ or ℂ, the map x ↦ (⟨b_i,x⟩)_i is a surjective linear isometry from H onto ℓ²(I).
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間で、内積は第2変数について線形
  - $(b_i)_{i\in I}$は完全正規直交系
  quantifiers:
  - 任意の$H,(b_i)$
  conclusion: 全ての$x,i$で$(Ux)_i=\langle b_i,x\rangle$となる全射線形等長写像$U:H\to\ell^2(I)$が存在する。
  answer: |
    $H$をヒルベルト空間、$(b_i)_{i\in I}$を完全正規直交系とする。$Ux=(\langle b_i,x\rangle)_i$と定める。パーセバルの等式から$\sum_i|\langle b_i,x\rangle|^2=\|x\|^2$なので、$Ux\in\ell^2(I)$かつ$\|Ux\|=\|x\|$である。第2変数の線形性から$U$は線形である。

    全射を示す。$a=(a_i)\in\ell^2(I)$をとる。正規直交系の級数の収束条件から$x=\sum_ia_ib_i$は無条件収束する。内積の連続性から$\langle b_j,x\rangle=\sum_ia_i\langle b_j,b_i\rangle=a_j$である。よって$Ux=a$である。
  strategy: Parseval gives the isometry and the ℓ² summation criterion gives surjectivity.
  sketch:
  - 'construct: Define U by the coefficients with respect to the basis.'
  - 'derive: Parseval shows U maps into ℓ² isometrically.'
  - 'derive: For a in ℓ², the series of a_i b_i converges.'
  - 'conclude: Its coefficients are a_j, so U is onto.'
  openmath: (forall (H b) (-> (and (hilbert_space H) (hilbert_basis b H)) (exists (U) (and (surjective_on U (lp_sequence_space 2)) (isometric_linear_map U H (lp_sequence_space 2)) (forall (x i) (-> (in x H) (= (seq_value (fn_value U x) i) (inner_product (seq_value b i) x))))))))
  hard_negative:
    statement: 完全でない正規直交系でも$U$は全射で等長である。
    reason: $H=\mathbb{R}^2$、正規直交系$\{e_1\}$なら$Ue_2=0$なので$U$は等長でない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H ι : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] (b : HilbertBasis ι 𝕜 H), ∃ U : H ≃ₗᵢ[𝕜] lp (fun _ : ι => 𝕜) 2, ∀ x i, (U x : ι → 𝕜) i = inner 𝕜 (b i) x
  proof: |
    by
      intro 𝕜 _ H ι _ _ b
      exact ⟨b.repr, fun x i => b.repr_apply_apply x i⟩
- id: fa_adjoint_calculus
  kind: gap
  level: 4
  topic: ヒルベルト空間・随伴作用素の計算則
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E,F,G$を$\mathbb{K}$上のヒルベルト空間、$S,T:E\to F$、$A:F\to G$を有界線形作用素、$c\in\mathbb{K}$とする。$(S+T)^*=S^*+T^*$、$(cT)^*=\bar cT^*$、$(AT)^*=T^*A^*$、$T^{**}=T$である。
  statement_en: For bounded operators S, T from E to F and A from F to G between Hilbert spaces over ℝ or ℂ and a scalar c, (S+T)* = S* + T*, (cT)* = c̄ T*, (AT)* = T*A*, and T** = T.
  assumptions:
  - $E,F,G$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $S,T:E\to F$、$A:F\to G$は有界線形作用素
  - $c$はスカラー
  quantifiers:
  - 任意の$E,F,G,S,T,A,c$
  conclusion: $(S+T)^*=S^*+T^*$、$(cT)^*=\bar cT^*$、$(AT)^*=T^*A^*$、$T^{**}=T$である。
  answer: |
    $E,F,G$をヒルベルト空間、$S,T,A$を上の有界線形作用素、$c$をスカラーとする。内積は第2変数について線形とする。随伴$T^*$は全ての$x,y$で$\langle T^*y,x\rangle=\langle y,Tx\rangle$を満たす一意な有界作用素である。したがって、この式を満たすことを確かめればよい。

    $\langle(S^*+T^*)y,x\rangle=\langle y,Sx\rangle+\langle y,Tx\rangle=\langle y,(S+T)x\rangle$である。

    $\langle\bar cT^*y,x\rangle=c\langle T^*y,x\rangle=c\langle y,Tx\rangle=\langle y,cTx\rangle$である。

    $\langle T^*A^*z,x\rangle=\langle A^*z,Tx\rangle=\langle z,ATx\rangle$である。

    $\langle Tx,y\rangle=\overline{\langle y,Tx\rangle}=\overline{\langle T^*y,x\rangle}=\langle x,T^*y\rangle$なので、$T$は$T^*$の随伴である。
  strategy: Verify the defining identity of the adjoint and invoke its uniqueness.
  sketch:
  - 'translate: The adjoint is the unique operator with ⟨T*y,x⟩ = ⟨y,Tx⟩.'
  - 'derive: Check the sum and scalar rules by additivity and conjugate linearity.'
  - 'derive: Check the composition rule by applying the definition twice.'
  - 'conclude: Conjugate symmetry gives T** = T.'
  openmath: (forall (E F G S T A c) (-> (and (hilbert_space E) (hilbert_space F) (hilbert_space G) (bounded_operator S E F) (bounded_operator T E F) (bounded_operator A F G)) (and (= (adjoint (+ S T)) (+ (adjoint S) (adjoint T))) (= (adjoint (* c T)) (* (conjugate c) (adjoint T))) (= (adjoint (operator_comp A T)) (operator_comp (adjoint T) (adjoint A))) (= (adjoint (adjoint T)) T))))
  hard_negative:
    statement: $(AT)^*=A^*T^*$である。
    reason: $2\times 2$行列$A=\begin{pmatrix}0&1\\0&0\end{pmatrix}$、$T=\begin{pmatrix}1&0\\0&0\end{pmatrix}$では$AT=0$なので$(AT)^*=0$だが、$A^*T^*=\begin{pmatrix}0&0\\1&0\end{pmatrix}\neq 0$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F G : Type*) [NormedAddCommGroup E] [InnerProductSpace 𝕜 E] [CompleteSpace E] [NormedAddCommGroup F] [InnerProductSpace 𝕜 F] [CompleteSpace F] [NormedAddCommGroup G] [InnerProductSpace 𝕜 G] [CompleteSpace G] (S T : E →L[𝕜] F) (R : F →L[𝕜] G) (c : 𝕜), ContinuousLinearMap.adjoint (S + T) = ContinuousLinearMap.adjoint S + ContinuousLinearMap.adjoint T ∧ ContinuousLinearMap.adjoint (c • T) = (starRingEnd 𝕜) c • ContinuousLinearMap.adjoint T ∧ ContinuousLinearMap.adjoint (R.comp T) = (ContinuousLinearMap.adjoint T).comp (ContinuousLinearMap.adjoint R) ∧ ContinuousLinearMap.adjoint (ContinuousLinearMap.adjoint T) = T
  proof: |
    by
      intro 𝕜 _ E F G _ _ _ _ _ _ _ _ _ S T R c
      refine ⟨map_add _ S T, ?_, ContinuousLinearMap.adjoint_comp R T, ContinuousLinearMap.adjoint_adjoint T⟩
      exact map_smulₛₗ (ContinuousLinearMap.adjoint (𝕜 := 𝕜) (E := E) (F := F)) c T
- id: fa_complex_operator_zero_of_quadratic_form_zero
  kind: gap
  level: 4
  topic: ヒルベルト空間・二次形式と作用素
  statement: $H$を複素内積空間、$T$を$H$上の有界線形作用素とする。全ての$x$で$\langle Tx,x\rangle=0$ならば$T=0$である。
  statement_en: If T is a bounded operator on a complex inner product space and ⟨Tx,x⟩ = 0 for all x, then T = 0.
  assumptions:
  - $H$は複素内積空間
  - $T$は$H$上の有界線形作用素
  - 全ての$x$で$\langle Tx,x\rangle=0$
  quantifiers:
  - 任意の$H,T$
  conclusion: $T=0$である。
  answer: |
    $H$を複素内積空間（内積は第2変数について線形）、$T$を有界線形作用素とし、全ての$x$で$\langle Tx,x\rangle=0$とする。

    $x,y\in H$とする。$\langle T(x+y),x+y\rangle=0$を展開すると$\langle Tx,y\rangle+\langle Ty,x\rangle=0$である。$y$を$iy$に置き換えると$i\langle Tx,y\rangle-i\langle Ty,x\rangle=0$、すなわち$\langle Tx,y\rangle-\langle Ty,x\rangle=0$である。

    二つを足して$\langle Tx,y\rangle=0$を得る。$y=Tx$とすると$Tx=0$である。
  strategy: Polarize the quadratic form using the substitution y → iy.
  sketch:
  - 'derive: Expanding at x+y gives ⟨Tx,y⟩ + ⟨Ty,x⟩ = 0.'
  - 'derive: Replacing y by iy gives ⟨Tx,y⟩ - ⟨Ty,x⟩ = 0.'
  - 'conclude: Hence ⟨Tx,y⟩ = 0 for all y, and y = Tx gives Tx = 0.'
  openmath: (forall (H T) (-> (and (inner_product_space H) (complex_vector_space H) (bounded_operator T H H) (forall (x) (-> (in x H) (= (inner_product (fn_value T x) x) 0)))) (forall (x) (-> (in x H) (= (fn_value T x) 0)))))
  hard_negative:
    statement: 実内積空間でも全ての$x$で$\langle Tx,x\rangle=0$なら$T=0$である。
    reason: $\mathbb{R}^2$の$90^\circ$回転$T$は全ての$x$で$\langle Tx,x\rangle=0$だが、$T\neq 0$である。
  target: |
    ∀ (H : Type*) [NormedAddCommGroup H] [InnerProductSpace ℂ H] (T : H →L[ℂ] H), (∀ x, inner ℂ (T x) x = 0) → T = 0
  proof: |
    by
      intro H _ _ T h
      have := (inner_map_self_eq_zero (T : H →ₗ[ℂ] H)).mp h
      ext x
      exact congrArg (fun F => F x) this
- id: fa_complex_self_adjoint_iff_quadratic_form_real
  kind: gap
  level: 4
  topic: ヒルベルト空間・自己共役作用素
  statement: $H$を複素ヒルベルト空間、$T$を$H$上の有界線形作用素とする。$T^*=T$であることと、全ての$x$で$\langle Tx,x\rangle$が実数であることは同値である。
  statement_en: A bounded operator T on a complex Hilbert space is self-adjoint if and only if ⟨Tx,x⟩ is real for all x.
  assumptions:
  - $H$は複素ヒルベルト空間
  - $T$は$H$上の有界線形作用素
  quantifiers:
  - 任意の$H,T$
  conclusion: $T^*=T$と、全ての$x$で$\langle Tx,x\rangle\in\mathbb{R}$であることは同値である。
  answer: |
    $H$を複素ヒルベルト空間、$T$を有界線形作用素とする。$x\in H$について$\overline{\langle Tx,x\rangle}=\langle x,Tx\rangle=\langle T^*x,x\rangle$である。

    $T^*=T$ならこの値は$\langle Tx,x\rangle$に等しいので、$\langle Tx,x\rangle$は実数である。

    逆に全ての$x$で$\langle Tx,x\rangle$が実数なら、上の式から$\langle(T-T^*)x,x\rangle=0$である。複素内積空間では、全ての$x$で$\langle Sx,x\rangle=0$となる有界作用素$S$は$0$である。これを$S=T-T^*$に使うと$T=T^*$である。
  strategy: Compare ⟨Tx,x⟩ with its conjugate and apply the vanishing criterion for quadratic forms.
  sketch:
  - 'derive: The conjugate of ⟨Tx,x⟩ equals ⟨T*x,x⟩.'
  - 'derive: Self-adjointness makes the value real.'
  - 'derive: If all values are real then ⟨(T-T*)x,x⟩ = 0 for all x.'
  - 'conclude: On a complex space this forces T = T*.'
  openmath: (forall (H T) (-> (and (hilbert_space H) (complex_vector_space H) (bounded_operator T H H)) (<-> (= (adjoint T) T) (forall (x) (-> (in x H) (= (conjugate (inner_product (fn_value T x) x)) (inner_product (fn_value T x) x)))))))
  hard_negative:
    statement: 実ヒルベルト空間でも、全ての$x$で$\langle Tx,x\rangle$が実数なら$T^*=T$である。
    reason: 実空間では値は常に実数である。$\mathbb{R}^2$の$90^\circ$回転は$T^*=-T\neq T$である。
  target: |
    ∀ (H : Type*) [NormedAddCommGroup H] [InnerProductSpace ℂ H] [CompleteSpace H] (T : H →L[ℂ] H), ContinuousLinearMap.adjoint T = T ↔ ∀ x, (starRingEnd ℂ) (inner ℂ (T x) x) = inner ℂ (T x) x
  proof: |
    by
      intro H _ _ _ T
      exact ContinuousLinearMap.isSelfAdjoint_iff_isSymmetric.trans (LinearMap.isSymmetric_iff_inner_map_self_real (T : H →ₗ[ℂ] H))
- id: fa_self_adjoint_eigen_real_orthogonal
  kind: gap
  level: 4
  topic: ヒルベルト空間・自己共役作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$T$を有界な自己共役作用素とする。$u,v\neq 0$、$Tu=au$、$Tv=bv$、$a\neq b$ならば、$a$は実数であり$\langle u,v\rangle=0$である。無限次元でも成り立つ形である。
  statement_en: Let T be a bounded self-adjoint operator on a Hilbert space over ℝ or ℂ, possibly infinite-dimensional. If u, v ≠ 0, Tu = au, Tv = bv and a ≠ b, then a is real and ⟨u,v⟩ = 0.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $T$は有界で$T^*=T$
  - $u,v\neq 0$、$Tu=au$、$Tv=bv$、$a\neq b$
  quantifiers:
  - 任意の$H,T,u,v,a,b$
  conclusion: $\bar a=a$かつ$\langle u,v\rangle=0$である。
  answer: |
    $H$をヒルベルト空間（内積は第2変数について線形）、$T$を自己共役、$u,v\neq 0$、$Tu=au$、$Tv=bv$、$a\neq b$とする。

    $\langle Tu,u\rangle=\langle u,Tu\rangle$から$\bar a\|u\|^2=a\|u\|^2$であり、$u\neq 0$より$\bar a=a$である。同様に$\bar b=b$である。

    $\langle Tu,v\rangle=\langle u,Tv\rangle$から$\bar a\langle u,v\rangle=b\langle u,v\rangle$である。$\bar a=a$なので$(a-b)\langle u,v\rangle=0$である。$a\neq b$より$\langle u,v\rangle=0$である。
  strategy: Move T across the inner product and compare scalars.
  sketch:
  - 'derive: ⟨Tu,u⟩ = ⟨u,Tu⟩ gives that a is real, and likewise b.'
  - 'derive: ⟨Tu,v⟩ = ⟨u,Tv⟩ gives (a-b)⟨u,v⟩ = 0.'
  - 'conclude: Since a ≠ b, u and v are orthogonal.'
  openmath: (forall (H T a b u v) (-> (and (hilbert_space H) (bounded_operator T H H) (= (adjoint T) T) (in u H) (in v H) (!= u 0) (!= v 0) (= (fn_value T u) (* a u)) (= (fn_value T v) (* b v)) (!= a b)) (and (= (conjugate a) a) (= (inner_product u v) 0))))
  hard_negative:
    statement: 自己共役でない作用素でも異なる固有値の固有ベクトルは直交する。
    reason: $T=\begin{pmatrix}1&1\\0&2\end{pmatrix}$の固有ベクトル$(1,0)$と$(1,1)$は固有値が$1,2$と異なるが直交しない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (T : H →L[𝕜] H) (a b : 𝕜) (u v : H), ContinuousLinearMap.adjoint T = T → u ≠ 0 → T u = a • u → T v = b • v → v ≠ 0 → a ≠ b → (starRingEnd 𝕜) a = a ∧ inner 𝕜 u v = 0
  proof: |
    by
      intro 𝕜 _ H _ _ _ T a b u v hT hu hTu hTv hv hab
      have hsym : ∀ x y, inner 𝕜 (T x) y = inner 𝕜 x (T y) := fun x y => by
        rw [← ContinuousLinearMap.adjoint_inner_left, hT]
      have ha : (starRingEnd 𝕜) a = a := by
        have h := hsym u u
        rw [hTu, inner_smul_left, inner_smul_right] at h
        exact mul_right_cancel₀ (inner_self_ne_zero.mpr hu) h
      have hb : (starRingEnd 𝕜) b = b := by
        have h := hsym v v
        rw [hTv, inner_smul_left, inner_smul_right] at h
        exact mul_right_cancel₀ (inner_self_ne_zero.mpr hv) h
      refine ⟨ha, ?_⟩
      have h := hsym u v
      rw [hTu, hTv, inner_smul_left, inner_smul_right, ha] at h
      have h2 : (a - b) * inner 𝕜 u v = 0 := by rw [sub_mul, h, sub_self]
      exact (mul_eq_zero.mp h2).resolve_left (sub_ne_zero.mpr hab)
- id: fa_self_adjoint_invariant_orthogonal_complement
  kind: gap
  level: 4
  topic: ヒルベルト空間・自己共役作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$T$を有界な自己共役作用素、$M$を$T$不変な部分空間とする。$M^\perp$も$T$不変である。
  statement_en: If T is a bounded self-adjoint operator on a Hilbert space over ℝ or ℂ and M is a T-invariant subspace, then the orthogonal complement of M is T-invariant.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $T$は有界で$T^*=T$
  - $M$は部分空間で$T(M)\subset M$
  quantifiers:
  - 任意の$H,T,M$
  conclusion: $T(M^\perp)\subset M^\perp$である。
  answer: |
    $H$をヒルベルト空間、$T$を有界な自己共役作用素、$M$を$T(M)\subset M$を満たす部分空間とする。$y\in M^\perp$、$u\in M$をとる。$\langle u,Ty\rangle=\langle T^*u,y\rangle=\langle Tu,y\rangle$である。$Tu\in M$で$y\in M^\perp$なので、これは$0$である。よって$Ty\in M^\perp$である。
  strategy: Move T onto the element of M using self-adjointness.
  sketch:
  - 'setup: Take y orthogonal to M and u in M.'
  - 'derive: ⟨u,Ty⟩ = ⟨Tu,y⟩ and Tu lies in M.'
  - 'conclude: So Ty is orthogonal to M.'
  openmath: (forall (H T M) (-> (and (hilbert_space H) (bounded_operator T H H) (= (adjoint T) T) (subspace_of M H) (forall (x) (-> (in x M) (in (fn_value T x) M)))) (forall (y) (-> (in y (orthogonal_complement M)) (in (fn_value T y) (orthogonal_complement M))))))
  hard_negative:
    statement: 自己共役でなくても$M$が$T$不変なら$M^\perp$は$T$不変である。
    reason: $T=\begin{pmatrix}1&1\\0&1\end{pmatrix}$、$M=\mathbb{R}e_1$は$T$不変だが、$Te_2=e_1+e_2\notin M^\perp$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (T : H →L[𝕜] H) (M : Submodule 𝕜 H), ContinuousLinearMap.adjoint T = T → (∀ x ∈ M, T x ∈ M) → ∀ y ∈ Mᗮ, T y ∈ Mᗮ
  proof: |
    by
      intro 𝕜 _ H _ _ _ T M hT hM y hy
      rw [Submodule.mem_orthogonal] at hy ⊢
      intro u hu
      rw [← ContinuousLinearMap.adjoint_inner_left, hT]
      exact hy _ (hM u hu)
- id: fa_self_adjoint_norm_of_quadratic_form
  kind: textbook
  level: 4
  topic: ヒルベルト空間・自己共役作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$T$を有界な自己共役作用素、$C\geq 0$とする。全ての$x$で$|\langle Tx,x\rangle|\leq C\|x\|^2$であることと$\|T\|\leq C$は同値である。
  statement_en: For a bounded self-adjoint operator T on a Hilbert space over ℝ or ℂ and C ≥ 0, |⟨Tx,x⟩| ≤ C‖x‖² for all x if and only if ‖T‖ ≤ C.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $T$は有界で$T^*=T$
  - $C\geq 0$
  quantifiers:
  - 任意の$H,T,C$
  conclusion: 全ての$x$で$|\langle Tx,x\rangle|\leq C\|x\|^2$であることと$\|T\|\leq C$は同値である。
  answer: |
    $H$をヒルベルト空間、$T$を有界な自己共役作用素、$C\geq 0$とする。

    $\|T\|\leq C$なら、コーシー・シュワルツの不等式より$|\langle Tx,x\rangle|\leq\|Tx\|\|x\|\leq C\|x\|^2$である。

    逆に全ての$x$で$|\langle Tx,x\rangle|\leq C\|x\|^2$とする。$T$は自己共役なので$\langle Tx,y\rangle+\langle Ty,x\rangle=2\mathrm{Re}\langle Tx,y\rangle$であり、
    $4\mathrm{Re}\langle Tx,y\rangle=\langle T(x+y),x+y\rangle-\langle T(x-y),x-y\rangle$
    である。右辺の絶対値は$C(\|x+y\|^2+\|x-y\|^2)=2C(\|x\|^2+\|y\|^2)$以下である（中線定理）。

    $\|x\|=1$、$Tx\neq 0$とし、$y=Tx/\|Tx\|$とおくと、$\|y\|=1$で$\mathrm{Re}\langle Tx,y\rangle=\|Tx\|$である。よって$4\|Tx\|\leq 4C$である。$Tx=0$のときも$\|Tx\|\leq C$である。したがって$\|T\|\leq C$である。
  strategy: Polarize the real part of ⟨Tx,y⟩ and use the parallelogram law with y = Tx/‖Tx‖.
  sketch:
  - 'derive: Cauchy-Schwarz gives the forward direction.'
  - 'derive: Self-adjointness gives 4Re⟨Tx,y⟩ = ⟨T(x+y),x+y⟩ - ⟨T(x-y),x-y⟩.'
  - 'derive: The parallelogram law bounds this by 2C(‖x‖²+‖y‖²).'
  - 'construct: Take ‖x‖ = 1 and y = Tx/‖Tx‖.'
  - 'conclude: This gives ‖Tx‖ ≤ C.'
  openmath: (forall (H T c) (-> (and (hilbert_space H) (bounded_operator T H H) (= (adjoint T) T) (>= c 0)) (<-> (forall (x) (-> (in x H) (<= (abs (inner_product (fn_value T x) x)) (* c (^ (norm x) 2))))) (<= (norm T) c))))
  hard_negative:
    statement: 自己共役でない作用素でも$\|T\|=\sup_{\|x\|=1}|\langle Tx,x\rangle|$である。
    reason: $T=\begin{pmatrix}0&1\\0&0\end{pmatrix}$では$\|T\|=1$だが、$\sup_{\|x\|=1}|\langle Tx,x\rangle|=1/2$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (T : H →L[𝕜] H) (C : ℝ), ContinuousLinearMap.adjoint T = T → 0 ≤ C → ((∀ x, ‖inner 𝕜 (T x) x‖ ≤ C * ‖x‖ ^ 2) ↔ ‖T‖ ≤ C)
  proof: |
    by
      intro 𝕜 _ H _ _ _ T C hT hC
      have hsym : (T : H →ₗ[𝕜] H).IsSymmetric := ContinuousLinearMap.isSelfAdjoint_iff_isSymmetric.mp hT
      constructor
      · intro h
        rw [T.norm_eq_iSup_rayleighQuotient hsym]
        refine ciSup_le fun x => ?_
        by_cases hx : x = 0
        · simpa [hx] using hC
        have hp : 0 < ‖x‖ ^ 2 := by positivity
        rw [ContinuousLinearMap.rayleighQuotient, abs_div, abs_of_pos hp, div_le_iff₀ hp]
        exact (RCLike.abs_re_le_norm _).trans (h x)
      · intro h x
        calc ‖inner 𝕜 (T x) x‖ ≤ ‖T x‖ * ‖x‖ := norm_inner_le_norm _ _
          _ ≤ (‖T‖ * ‖x‖) * ‖x‖ := by gcongr; exact T.le_opNorm x
          _ ≤ (C * ‖x‖) * ‖x‖ := by gcongr
          _ = C * ‖x‖ ^ 2 := by ring
- id: fa_normal_eigenvector_of_adjoint
  kind: gap
  level: 4
  topic: ヒルベルト空間・正規作用素
  statement: $H$を複素ヒルベルト空間、$T$を正規な有界作用素（$T^*T=TT^*$）とする。$Tx=ax$ならば$T^*x=\bar ax$である。零ベクトルも許す。
  statement_en: If T is a bounded normal operator on a complex Hilbert space and Tx = ax, then T*x = ā x. The vector x may be zero.
  assumptions:
  - $H$は複素ヒルベルト空間
  - $T$は有界作用素で$T^*T=TT^*$
  - $Tx=ax$
  quantifiers:
  - 任意の$H,T,a,x$
  conclusion: $T^*x=\bar ax$である。
  answer: |
    $H$を複素ヒルベルト空間、$T$を正規作用素、$Tx=ax$とする。$S=T-a$とおくと$S^*=T^*-\bar a$である。$T^*T=TT^*$から$S^*S=SS^*$である。

    正規作用素$S$と$v\in H$について、$\|Sv\|^2=\langle S^*Sv,v\rangle=\langle SS^*v,v\rangle=\|S^*v\|^2$である。

    $Sx=0$なので$\|S^*x\|=0$、すなわち$T^*x=\bar ax$である。
  strategy: Apply the identity ‖Sv‖ = ‖S*v‖ to the normal operator S = T - a.
  sketch:
  - 'setup: Put S = T - a, which is again normal.'
  - 'derive: For normal S, ‖Sv‖ = ‖S*v‖.'
  - 'conclude: Sx = 0 gives S*x = 0, that is T*x = ā x.'
  openmath: (forall (H T a x) (-> (and (hilbert_space H) (complex_vector_space H) (bounded_operator T H H) (= (operator_comp (adjoint T) T) (operator_comp T (adjoint T))) (in x H) (= (fn_value T x) (* a x))) (= (fn_value (adjoint T) x) (* (conjugate a) x))))
  hard_negative:
    statement: 正規でない作用素でも$Tx=ax$なら$T^*x=\bar ax$である。
    reason: $T=\begin{pmatrix}0&1\\0&0\end{pmatrix}$、$x=e_1$では$Tx=0$だが$T^*x=e_2\neq 0$である。
  target: |
    ∀ (H : Type*) [NormedAddCommGroup H] [InnerProductSpace ℂ H] [CompleteSpace H] (T : H →L[ℂ] H) (a : ℂ) (x : H), (ContinuousLinearMap.adjoint T).comp T = T.comp (ContinuousLinearMap.adjoint T) → T x = a • x → ContinuousLinearMap.adjoint T x = (starRingEnd ℂ) a • x
  proof: |
    by
      intro H _ _ _ T a x hN hx
      have hN' : IsStarNormal (T - a • (1 : H →L[ℂ] H)) := by
        have h0 : IsStarNormal T := by
          rw [isStarNormal_iff, commute_iff_eq, ContinuousLinearMap.star_eq_adjoint]
          exact hN
        rw [isStarNormal_iff, commute_iff_eq]
        have h1 := h0.star_comm_self.eq
        simp only [star_sub, star_smul, star_one, mul_sub, sub_mul, smul_mul_assoc, mul_smul_comm, mul_one, one_mul, h1]
        module
      have h := (ContinuousLinearMap.isStarNormal_iff_norm_eq_adjoint.mp hN') x
      have h1 : (T - a • (1 : H →L[ℂ] H)) x = 0 := by simp [hx]
      rw [h1, norm_zero] at h
      have h2 := norm_eq_zero.mp h.symm
      have h3 : ContinuousLinearMap.adjoint (T - a • (1 : H →L[ℂ] H)) x = ContinuousLinearMap.adjoint T x - (starRingEnd ℂ) a • x := by
        simp [map_sub, map_smulₛₗ]
      rw [h3, sub_eq_zero] at h2
      exact h2
- id: fa_unitary_iff_surjective_isometry
  kind: gap
  level: 4
  topic: ヒルベルト空間・ユニタリ作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$U$を有界線形作用素とする。$U^*U=UU^*=I$であることと、$U$が全射かつ全ての$x$で$\|Ux\|=\|x\|$であることは同値である。
  statement_en: A bounded operator U on a Hilbert space over ℝ or ℂ satisfies U*U = UU* = I if and only if U is surjective and ‖Ux‖ = ‖x‖ for all x.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $U$は有界線形作用素
  quantifiers:
  - 任意の$H,U$
  conclusion: $U^*U=UU^*=I$と、$U$が全射等長であることは同値である。
  answer: |
    $H$をヒルベルト空間、$U$を有界線形作用素とする。

    $U^*U=UU^*=I$とする。$\|Ux\|^2=\langle U^*Ux,x\rangle=\|x\|^2$である。$y\in H$について$y=U(U^*y)$なので$U$は全射である。

    逆に$U$が全射等長とする。極化恒等式から全ての$x,y$で$\langle Ux,Uy\rangle=\langle x,y\rangle$である。すなわち$\langle U^*Ux,y\rangle=\langle x,y\rangle$なので$U^*U=I$である。$y\in H$を$y=Ux$と書くと、$UU^*y=UU^*Ux=Ux=y$である。よって$UU^*=I$である。
  strategy: Use polarization to convert the isometry into U*U = I and surjectivity to get UU* = I.
  sketch:
  - 'derive: U*U = I gives the isometry and UU* = I gives surjectivity.'
  - 'derive: Conversely polarization turns the isometry into ⟨Ux,Uy⟩ = ⟨x,y⟩, so U*U = I.'
  - 'conclude: Writing y = Ux gives UU*y = y.'
  openmath: (forall (H U) (-> (and (hilbert_space H) (bounded_operator U H H)) (<-> (and (= (operator_comp (adjoint U) U) (identity_operator H)) (= (operator_comp U (adjoint U)) (identity_operator H))) (and (surjective_on U H) (forall (x) (-> (in x H) (= (norm (fn_value U x)) (norm x))))))))
  hard_negative:
    statement: 等長作用素は全射である。
    reason: $\ell^2$の右シフトは等長だが$e_1$が値域に入らない。$U^*U=I$であるが$UU^*\neq I$である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (U : H →L[𝕜] H), ((ContinuousLinearMap.adjoint U).comp U = ContinuousLinearMap.id 𝕜 H ∧ U.comp (ContinuousLinearMap.adjoint U) = ContinuousLinearMap.id 𝕜 H) ↔ (Function.Surjective U ∧ ∀ x, ‖U x‖ = ‖x‖)
  proof: |
    by
      intro 𝕜 _ H _ _ _ U
      constructor
      · rintro ⟨h1, h2⟩
        refine ⟨fun y => ⟨ContinuousLinearMap.adjoint U y, congrArg (fun F => F y) h2⟩, U.norm_map_iff_adjoint_comp_self.mpr h1⟩
      · rintro ⟨hs, hn⟩
        have h1 := U.norm_map_iff_adjoint_comp_self.mp hn
        refine ⟨h1, ?_⟩
        ext y
        obtain ⟨x, rfl⟩ := hs y
        have := congrArg (fun F => F x) h1
        exact congrArg U this
- id: fa_lax_milgram_existence_uniqueness
  kind: named
  level: 4
  topic: ヒルベルト空間・ラックス・ミルグラムの定理
  statement: ラックス・ミルグラムの定理。$H$を実ヒルベルト空間、$B$を$H$上の有界双線形形式、$c>0$とし、全ての$u$で$B(u,u)\geq c\|u\|^2$とする。全ての$f\in H'$に対し、全ての$w$で$B(v,w)=f(w)$となる$v\in H$がちょうど一つ存在する。$B$の対称性は仮定しない。リースの表現定理は既習とする。
  statement_en: Lax-Milgram theorem. Let B be a bounded bilinear form on a real Hilbert space H with B(u,u) ≥ c‖u‖² for some c > 0. For every f in H' there is a unique v in H with B(v,w) = f(w) for all w. Symmetry of B is not assumed. The Riesz representation theorem is taken as known.
  assumptions:
  - $H$は実ヒルベルト空間
  - $B$は有界双線形形式
  - $c>0$で全ての$u$について$c\|u\|^2\leq B(u,u)$
  - リースの表現定理は既習
  quantifiers:
  - 任意の$H,B,c$と$f\in H'$
  conclusion: 全ての$w$で$B(v,w)=f(w)$となる$v\in H$が一意に存在する。
  answer: |
    $H$を実ヒルベルト空間、$B$を有界双線形形式、$c>0$で$c\|u\|^2\leq B(u,u)$とする。

    各$v$について$w\mapsto B(v,w)$は有界線形汎関数である。リースの表現定理より$B(v,w)=\langle Av,w\rangle$となる$Av\in H$が一意に定まる。$A$は線形で、$\|Av\|\leq\|B\|\|v\|$より有界である。

    $c\|v\|^2\leq B(v,v)=\langle Av,v\rangle\leq\|Av\|\|v\|$なので$c\|v\|\leq\|Av\|$である。よって$A$は単射で値域は閉である（$Av_n$がコーシー列なら$v_n$もコーシー列である）。

    値域の直交補空間の元$w$をとると、$c\|w\|^2\leq\langle Aw,w\rangle=0$なので$w=0$である。値域は閉なので$A$は全射である。

    $f\in H'$をリースの表現定理で$f=\langle y,\cdot\rangle$と書く。$B(v,w)=f(w)$が全ての$w$で成り立つことは$Av=y$と同値である。$A$は全単射なので、このような$v$がちょうど一つ存在する。
  strategy: Represent B by an operator A via Riesz and show A is bijective from coercivity.
  sketch:
  - 'construct: Riesz gives a bounded operator A with B(v,w) = ⟨Av,w⟩.'
  - 'derive: Coercivity gives c‖v‖ ≤ ‖Av‖, so A is injective with closed range.'
  - 'derive: If w is orthogonal to the range then c‖w‖² ≤ ⟨Aw,w⟩ = 0.'
  - 'translate: Writing f = ⟨y,·⟩, the equation is Av = y.'
  - 'conclude: Bijectivity of A gives existence and uniqueness.'
  openmath: (forall (H B c f) (-> (and (hilbert_space H) (real_vector_space H) (bounded_bilinear_form B H) (> c 0) (forall (u) (-> (in u H) (<= (* c (* (norm u) (norm u))) (fn_value (fn_value B u) u)))) (in f (dual_space H))) (exists (v) (and (in v H) (forall (w) (-> (in w H) (= (fn_value (fn_value B v) w) (fn_value f w)))) (forall (v2) (-> (and (in v2 H) (forall (w) (-> (in w H) (= (fn_value (fn_value B v2) w) (fn_value f w))))) (= v2 v)))))))
  hard_negative:
    statement: 強圧性なしで非退化な有界双線形形式なら同じ結論が成り立つ。
    reason: $\ell^2$で$B(u,w)=\sum_n u_nw_n/n$は$B(v,\cdot)=0$なら$v=0$となるが、$f(w)=\sum_n w_n/n$に対する解は$v=(1,1,\dots)$で$\ell^2$に属さない。
  target: |
    ∀ (H : Type*) [NormedAddCommGroup H] [InnerProductSpace ℝ H] [CompleteSpace H] (B : H →L[ℝ] H →L[ℝ] ℝ) (c : ℝ), 0 < c → (∀ u, c * ‖u‖ * ‖u‖ ≤ B u u) → ∀ f : StrongDual ℝ H, ∃! v : H, ∀ w, B v w = f w
  proof: |
    by
      intro H _ _ _ B c hc h f
      have hB : IsCoercive B := ⟨c, hc, h⟩
      let A := hB.continuousLinearEquivOfBilin
      have hA : ∀ v w, B v w = inner ℝ (A v) w := fun v w => (hB.continuousLinearEquivOfBilin_apply v w).symm
      refine ⟨A.symm ((InnerProductSpace.toDual ℝ H).symm f), fun w => ?_, fun v hv => ?_⟩
      · rw [hA, A.apply_symm_apply, InnerProductSpace.toDual_symm_apply]
      · apply A.injective
        rw [A.apply_symm_apply]
        apply (InnerProductSpace.toDual ℝ H).injective
        rw [LinearIsometryEquiv.apply_symm_apply]
        ext w
        rw [InnerProductSpace.toDual_apply_apply, ← hA, hv]
- id: fa_lax_milgram_stability_estimate
  kind: gap
  level: 4
  topic: ヒルベルト空間・ラックス・ミルグラムの定理
  statement: $H$を実内積空間、$B$を有界双線形形式、$c>0$で全ての$u$について$c\|u\|^2\leq B(u,u)$とし、$f\in H'$とする。全ての$w$で$B(v,w)=f(w)$ならば$c\|v\|\leq\|f\|$である。
  statement_en: Let B be a bounded bilinear form on a real inner product space with c‖u‖² ≤ B(u,u), c > 0, and f in H'. If B(v,w) = f(w) for all w, then c‖v‖ ≤ ‖f‖.
  assumptions:
  - $H$は実内積空間
  - $B$は有界双線形形式で、$c>0$と全ての$u$について$c\|u\|^2\leq B(u,u)$
  - $f\in H'$、全ての$w$で$B(v,w)=f(w)$
  quantifiers:
  - 任意の$H,B,c,f,v$
  conclusion: $c\|v\|\leq\|f\|$である。
  answer: |
    $H$を実内積空間、$B$を上の双線形形式、$f\in H'$とし、全ての$w$で$B(v,w)=f(w)$とする。

    $w=v$とすると$c\|v\|^2\leq B(v,v)=f(v)\leq\|f\|\|v\|$である。$v=0$なら結論は明らかである。$v\neq 0$なら$\|v\|$で割って$c\|v\|\leq\|f\|$を得る。
  strategy: Test the equation with w = v.
  sketch:
  - 'derive: Setting w = v gives c‖v‖² ≤ f(v) ≤ ‖f‖‖v‖.'
  - 'conclude: Dividing by ‖v‖ gives the estimate.'
  openmath: (forall (H B c f v) (-> (and (inner_product_space H) (real_vector_space H) (bounded_bilinear_form B H) (> c 0) (forall (u) (-> (in u H) (<= (* c (* (norm u) (norm u))) (fn_value (fn_value B u) u)))) (in f (dual_space H)) (in v H) (forall (w) (-> (in w H) (= (fn_value (fn_value B v) w) (fn_value f w))))) (<= (* c (norm v)) (norm f))))
  hard_negative:
    statement: $\|v\|\leq c\|f\|$である。
    reason: $H=\mathbb{R}$、$B(u,w)=cuw$、$f(w)=w$では$v=1/c$である。$c=1/2$なら$\|v\|=2$だが$c\|f\|=1/2$である。
  target: |
    ∀ (H : Type*) [NormedAddCommGroup H] [InnerProductSpace ℝ H] (B : H →L[ℝ] H →L[ℝ] ℝ) (c : ℝ) (f : StrongDual ℝ H) (v : H), 0 < c → (∀ u, c * ‖u‖ * ‖u‖ ≤ B u u) → (∀ w, B v w = f w) → c * ‖v‖ ≤ ‖f‖
  proof: |
    by
      intro H _ _ B c f v hc h hv
      by_cases h0 : ‖v‖ = 0
      · rw [h0, mul_zero]; exact norm_nonneg _
      have hp : 0 < ‖v‖ := lt_of_le_of_ne (norm_nonneg _) (Ne.symm h0)
      have h1 := h v
      rw [hv] at h1
      have h2 : f v ≤ ‖f‖ * ‖v‖ := (le_abs_self _).trans (f.le_opNorm v)
      exact le_of_mul_le_mul_right (h1.trans h2) hp
- id: fa_rkhs_reproducing_property
  kind: gap
  level: 4
  topic: ヒルベルト空間・再生核
  statement: 再生核の再生性。$\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$V$を$\mathbb{K}$上のヒルベルト空間、$X$を集合、$H$を$X$上の$V$値関数のヒルベルト空間で、各点評価$\mathrm{ev}_x:H\to V$が有界であるものとする。$k_x=\mathrm{ev}_x^*:V\to H$とおくと、全ての$v\in V$、$f\in H$で$\langle k_xv,f\rangle=\langle v,f(x)\rangle$である。
  statement_en: Reproducing property. Let H be a Hilbert space of V-valued functions on a set X, over ℝ or ℂ, with bounded point evaluations ev_x. With k_x = ev_x*, one has ⟨k_x v, f⟩ = ⟨v, f(x)⟩ for all v in V and f in H.
  assumptions:
  - $V$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $H$は集合$X$上の$V$値関数のヒルベルト空間で、$H$の元は関数として区別され、点評価は有界
  - $k_x=\mathrm{ev}_x^*$
  quantifiers:
  - 任意の$V,X,H,x,v,f$
  conclusion: $\langle k_xv,f\rangle=\langle v,f(x)\rangle$である。
  answer: |
    $V,H,X$を上の通りとし、$x\in X$とする。$\mathrm{ev}_x:H\to V$、$\mathrm{ev}_x(f)=f(x)$は有界線形なので、随伴$k_x=\mathrm{ev}_x^*:V\to H$が定まる。

    随伴の定義より、全ての$v\in V$、$f\in H$で$\langle k_xv,f\rangle=\langle\mathrm{ev}_x^*v,f\rangle=\langle v,\mathrm{ev}_xf\rangle=\langle v,f(x)\rangle$である。
  strategy: The kernel section is the adjoint of evaluation, so the identity is the definition of the adjoint.
  sketch:
  - 'setup: Evaluation at x is a bounded operator from H to V.'
  - 'construct: Its adjoint k_x maps V to H.'
  - 'conclude: The adjoint identity is the reproducing property.'
  openmath: (forall (H X V x v f) (-> (and (hilbert_space V) (rkhs H X V) (in x X) (in v V) (in f H)) (= (inner_product (rkhs_kernel_section H x v) f) (inner_product v (fn_value f x)))))
  hard_negative:
    statement: $L^2([0,1])$は各点評価が有界な関数空間であり再生核をもつ。
    reason: $L^2([0,1])$の元はほとんど至る所での同値類なので点評価が定まらない。連続関数の部分空間でも$f_n(x)=x^n$は$\|f_n\|_2\to 0$かつ$f_n(1)=1$なので評価は有界でない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H X V : Type*) [NormedAddCommGroup V] [InnerProductSpace 𝕜 V] [CompleteSpace V] [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] [RKHS 𝕜 H X V] (x : X) (v : V) (f : H), inner 𝕜 (RKHS.kerFun H x v) f = inner 𝕜 v (f x)
  proof: |
    by
      intro 𝕜 _ H X V _ _ _ _ _ _ _ x v f
      exact RKHS.kerFun_inner x v f
- id: fa_von_neumann_mean_ergodic
  kind: named
  level: 4
  topic: ヒルベルト空間・平均エルゴード定理
  statement: フォン・ノイマンの平均エルゴード定理。$\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$T$を$\|T\|\leq 1$の有界線形作用素とする。$x\in H$の不動点空間$\{v:Tv=v\}$への正射影を$y$とする。すなわち$Ty=y$で、全ての不動点$v$について$\langle v,x-y\rangle=0$とする。このとき$\frac1n\sum_{k<n}T^kx\to y$（ノルム収束）である。
  statement_en: Von Neumann mean ergodic theorem. Let T be a bounded operator with ‖T‖ ≤ 1 on a Hilbert space over ℝ or ℂ and let y be the orthogonal projection of x onto the fixed-point space, that is Ty = y and ⟨v, x-y⟩ = 0 for each fixed point v. Then (1/n) Σ_(k<n) T^k x → y in norm.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $T$は有界線形作用素で$\|T\|\leq 1$
  - $Ty=y$かつ全ての不動点$v$で$\langle v,x-y\rangle=0$
  quantifiers:
  - 任意の$H,T,x,y$
  conclusion: $\frac1n\sum_{k<n}T^kx\to y$である。
  answer: |
    $H$をヒルベルト空間、$\|T\|\leq 1$、$A_n=\frac1n\sum_{k<n}T^k$（$n\geq 1$）とする。$\|A_n\|\leq 1$である。$y$は上の条件を満たすとし、$z=x-y$とおく。$A_ny=y$なので、$A_nz\to 0$を示せばよい。

    まず$Tv=v$なら$T^*v=v$である。実際、$\|T^*v-v\|^2=\|T^*v\|^2-2\mathrm{Re}\langle T^*v,v\rangle+\|v\|^2$であり、$\|T^*v\|\leq\|v\|$、$\langle T^*v,v\rangle=\langle v,Tv\rangle=\|v\|^2$より右辺は$0$以下である。$T^*$についても同様であり、$T$と$T^*$の不動点は一致する。

    $L=\{(I-T)w:w\in H\}$とおく。$u\perp L$は$(I-T^*)u=0$と同値であり、これは$u$が$T$の不動点であることと同値である。よって$L^\perp$は不動点空間である。$z$は不動点空間に直交するので$z\in(L^\perp)^\perp=\overline{L}$である。

    $u=(I-T)w$なら$A_nu=\frac1n(w-T^nw)$なので、$\|A_nu\|\leq 2\|w\|/n\to 0$である。$\|A_n\|\leq 1$より$\overline{L}$の元についても$A_n\to 0$である。よって$A_nz\to 0$である。
  strategy: Decompose x into a fixed vector and an element of the closure of the range of I - T, where averages telescope.
  sketch:
  - 'derive: For a contraction, fixed points of T and T* coincide.'
  - 'derive: So the orthogonal complement of the range of I - T is the fixed-point space.'
  - 'derive: z = x - y lies in the closure of that range.'
  - 'derive: On (I-T)w the averages telescope and are bounded by 2‖w‖/n.'
  - 'conclude: Uniform boundedness of the averages extends the limit 0 to the closure, so A_n x → y.'
  openmath: (forall (H T x y) (-> (and (hilbert_space H) (bounded_operator T H H) (<= (norm T) 1) (in x H) (in y H) (= (fn_value T y) y) (forall (v) (-> (and (in v H) (= (fn_value T v) v)) (= (inner_product v (- x y)) 0)))) (seq_fn_tends_to (lambda (n) (* (/ 1 n) (finset_sum (finset_range n) (lambda (k) (fn_value (^ T k) x))))) y)))
  hard_negative:
    statement: $\|T\|\leq 1$なら$T^nx$自身が$y$に収束する。
    reason: $H=\mathbb{R}$、$T=-1$、$x=1$では$y=0$だが、$T^nx=(-1)^n$は収束しない。平均をとると$0$に収束する。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (T : H →L[𝕜] H) (x y : H), ‖T‖ ≤ 1 → T y = y → (∀ v, T v = v → inner 𝕜 v (x - y) = 0) → Filter.Tendsto (fun n : ℕ => (n : 𝕜)⁻¹ • ∑ k ∈ Finset.range n, (T ^ k) x) Filter.atTop (nhds y)
  proof: |
    by
      intro 𝕜 _ H _ _ _ T x y hT hy hx
      have h := T.tendsto_birkhoffAverage_orthogonalProjection hT x
      have he : (((T : H →ₗ[𝕜] H).eqLocus (1 : H →L[𝕜] H)).orthogonalProjectionOnto x : H) = y := by
        rw [← Submodule.starProjection_apply]
        refine Submodule.eq_starProjection_of_mem_orthogonal (by simpa using hy) ?_
        rw [Submodule.mem_orthogonal]
        intro v hv
        exact hx v (by simpa using hv)
      rw [he] at h
      refine h.congr fun n => ?_
      simp [birkhoffAverage, birkhoffSum]
- id: fa_hellinger_toeplitz
  kind: named
  level: 4
  topic: ヒルベルト空間・ヘリンガー・テプリッツの定理
  statement: ヘリンガー・テプリッツの定理。$\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$T:H\to H$を全体で定義された線形写像で、全ての$x,y$について$\langle Tx,y\rangle=\langle x,Ty\rangle$を満たすものとする。$T$は連続である。閉グラフ定理は既習とする。
  statement_en: Hellinger-Toeplitz theorem. A linear map T defined on all of a Hilbert space over ℝ or ℂ with ⟨Tx,y⟩ = ⟨x,Ty⟩ for all x, y is continuous. The closed graph theorem is taken as known.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $T:H\to H$は全体で定義された線形写像
  - 全ての$x,y$で$\langle Tx,y\rangle=\langle x,Ty\rangle$
  - 閉グラフ定理は既習
  quantifiers:
  - 任意の$H,T$
  conclusion: $T$は連続である。
  answer: |
    $H$をヒルベルト空間、$T:H\to H$を線形写像で全ての$x,y$について$\langle Tx,y\rangle=\langle x,Ty\rangle$とする。

    閉グラフ定理により、$x_n\to x$かつ$Tx_n\to w$なら$w=Tx$であることを示せばよい。任意の$z\in H$について、内積の連続性から
    $\langle w,z\rangle=\lim\langle Tx_n,z\rangle=\lim\langle x_n,Tz\rangle=\langle x,Tz\rangle=\langle Tx,z\rangle$
    である。$z$は任意なので$w=Tx$である。
  strategy: Check the closed graph condition by moving T across the inner product.
  sketch:
  - 'translate: By the closed graph theorem, it suffices that x_n → x and Tx_n → w imply w = Tx.'
  - 'derive: For each z, ⟨w,z⟩ = lim⟨x_n,Tz⟩ = ⟨Tx,z⟩.'
  - 'conclude: Hence w = Tx and T is continuous.'
  openmath: (forall (H T) (-> (and (hilbert_space H) (linear_operator T H H) (forall (x y) (-> (and (in x H) (in y H)) (= (inner_product (fn_value T x) y) (inner_product x (fn_value T y)))))) (continuous_map T)))
  hard_negative:
    statement: 稠密な部分空間で定義された対称作用素も連続である。
    reason: $L^2(\mathbb{R})$の$C_c^\infty$上の$Tf=if'$は対称だが、$f_n(x)=f(nx)$の型の列で$\|Tf_n\|/\|f_n\|\to\infty$となり非有界である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (T : H →ₗ[𝕜] H), (∀ x y, inner 𝕜 (T x) y = inner 𝕜 x (T y)) → Continuous T
  proof: |
    by
      intro 𝕜 _ H _ _ _ T h
      exact LinearMap.IsSymmetric.continuous h
- id: fa_unbounded_adjoint_is_closed
  kind: textbook
  level: 4
  topic: 作用素論・非有界作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E,F$を$\mathbb{K}$上のヒルベルト空間、$T$を$E$の稠密な部分空間$D(T)$で定義された線形作用素$D(T)\to F$とする。随伴$T^*$は閉作用素である。ここで$y\in D(T^*)$は$x\mapsto\langle y,Tx\rangle$が$D(T)$上で連続であることを意味し、$\langle T^*y,x\rangle=\langle y,Tx\rangle$である。$T$の連続性や閉性は仮定しない。
  statement_en: Let T be a densely defined linear operator between Hilbert spaces over ℝ or ℂ. The adjoint T*, whose domain consists of the y for which x ↦ ⟨y,Tx⟩ is continuous on D(T) and which satisfies ⟨T*y,x⟩ = ⟨y,Tx⟩, is a closed operator. T need not be continuous or closed.
  assumptions:
  - $E,F$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $T:D(T)\to F$は線形で$D(T)$は$E$で稠密
  quantifiers:
  - 任意の$E,F,T$
  conclusion: $T^*$のグラフは閉である。
  answer: |
    $E,F$をヒルベルト空間、$T:D(T)\to F$を稠密に定義された線形作用素とする。

    $y_n\in D(T^*)$、$y_n\to y$、$T^*y_n\to w$とする。$x\in D(T)$について、内積の連続性から
    $\langle w,x\rangle=\lim\langle T^*y_n,x\rangle=\lim\langle y_n,Tx\rangle=\langle y,Tx\rangle$
    である。

    よって$x\mapsto\langle y,Tx\rangle=\langle w,x\rangle$は$D(T)$上で連続なので$y\in D(T^*)$である。$D(T)$は稠密なので、$\langle T^*y,x\rangle=\langle w,x\rangle$が全ての$x\in D(T)$で成り立つことから$T^*y=w$である。したがって$T^*$のグラフは閉である。
  strategy: Pass to the limit in the defining identity of the adjoint.
  sketch:
  - 'setup: Take y_n in the domain of T* with y_n → y and T*y_n → w.'
  - 'derive: For x in D(T), ⟨w,x⟩ = ⟨y,Tx⟩.'
  - 'derive: Hence y is in the domain of T*.'
  - 'conclude: Density of D(T) gives T*y = w.'
  openmath: (forall (E F T) (-> (and (hilbert_space E) (hilbert_space F) (densely_defined_operator T E F)) (closed_graph (adjoint T))))
  hard_negative:
    statement: 稠密に定義された作用素は閉である。
    reason: $L^2(\mathbb{R})$で$C_c^\infty$上の微分作用素は閉でない。グラフの閉包はソボレフ空間$H^1$上の微分作用素のグラフである。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F : Type*) [NormedAddCommGroup E] [InnerProductSpace 𝕜 E] [CompleteSpace E] [NormedAddCommGroup F] [InnerProductSpace 𝕜 F] [CompleteSpace F] (T : E →ₗ.[𝕜] F), Dense (T.domain : Set E) → T.adjoint.IsClosed
  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ _ _ T h
      exact LinearPMap.adjoint_isClosed h
- id: fa_compact_operators_add_smul
  kind: gap
  level: 4
  topic: 作用素論・コンパクト作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E,F$を$\mathbb{K}$上のノルム空間、$S,T:E\to F$をコンパクト作用素、$c\in\mathbb{K}$とする。$S+T$と$cT$はコンパクト作用素である。
  statement_en: If S and T are compact operators between normed spaces over ℝ or ℂ and c is a scalar, then S + T and cT are compact.
  assumptions:
  - $E,F$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $S,T:E\to F$はコンパクト作用素
  - $c$はスカラー
  quantifiers:
  - 任意の$E,F,S,T,c$
  conclusion: $S+T$と$cT$はコンパクト作用素である。
  answer: |
    $E,F$をノルム空間、$S,T$をコンパクト作用素、$c$をスカラーとする。$B$を$E$の閉単位球とする。コンパクト作用素であるとは、$B$の像が相対コンパクトであることである。

    $K_1=\overline{S(B)}$、$K_2=\overline{T(B)}$はコンパクトである。$K_1\times K_2$はコンパクトで、和の写像は連続なので$K_1+K_2$はコンパクトである。$(S+T)(B)\subset K_1+K_2$なので$S+T$はコンパクトである。

    同様に$x\mapsto cx$は連続なので$cK_2$はコンパクトであり、$(cT)(B)\subset cK_2$である。よって$cT$はコンパクトである。
  strategy: The images of the unit ball lie in continuous images of compact sets.
  sketch:
  - 'setup: The closures K₁, K₂ of the images of the unit ball are compact.'
  - 'derive: K₁ + K₂ is compact as the continuous image of K₁ × K₂ and contains (S+T)(B).'
  - 'derive: cK₂ is compact and contains (cT)(B).'
  - 'conclude: S + T and cT are compact.'
  openmath: (forall (E F S T c) (-> (and (normed_space E) (normed_space F) (bounded_operator S E F) (bounded_operator T E F) (compact_operator S) (compact_operator T)) (and (compact_operator (+ S T)) (compact_operator (* c T)))))
  hard_negative:
    statement: コンパクト作用素と有界作用素の和はコンパクトである。
    reason: 無限次元バナッハ空間で$S=0$、$T=I$とすると$S$はコンパクトだが、$S+T=I$はコンパクトでない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [NormedAddCommGroup F] [NormedSpace 𝕜 F] (S T : E →L[𝕜] F) (c : 𝕜), IsCompactOperator S → IsCompactOperator T → IsCompactOperator (S + T) ∧ IsCompactOperator (c • T)
  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ S T c hS hT
      exact ⟨hS.add hT, hT.smul c⟩
- id: fa_compact_bounded_sequence_convergent_subsequence
  kind: gap
  level: 4
  topic: 作用素論・コンパクト作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E,F$を$\mathbb{K}$上のノルム空間、$T:E\to F$をコンパクト作用素、$(x_n)$を$\|x_n\|\leq M$である有界列とする。$(Tx_n)$は$F$で収束する部分列をもつ。
  statement_en: If T is a compact operator between normed spaces over ℝ or ℂ and (x_n) is bounded, ‖x_n‖ ≤ M, then (Tx_n) has a subsequence converging in F.
  assumptions:
  - $E,F$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $T:E\to F$はコンパクト作用素
  - 全ての$n$で$\|x_n\|\leq M$
  quantifiers:
  - 任意の$E,F,T,(x_n),M$
  conclusion: $Tx_{\varphi(n)}\to y$となる狭義単調な$\varphi$と$y\in F$が存在する。
  answer: |
    $E,F$をノルム空間、$T$をコンパクト作用素、$\|x_n\|\leq M$とする。$r=\max\{M,1\}$とおく。

    $B$を閉単位球とすると、$\overline{T(B)}$はコンパクトである。スカラー倍は連続なので$r\overline{T(B)}$もコンパクトである。$x_n/r\in B$なので$Tx_n=rT(x_n/r)\in r\overline{T(B)}$である。

    距離空間のコンパクト集合は点列コンパクトなので、$(Tx_n)$は$F$で収束する部分列をもつ。
  strategy: The sequence lies in a compact set obtained by scaling the image of the unit ball.
  sketch:
  - 'setup: Put r = max(M,1), so x_n/r lies in the unit ball.'
  - 'derive: Tx_n lies in the compact set r·closure(T(B)).'
  - 'conclude: Sequential compactness gives a convergent subsequence.'
  openmath: (forall (E F T x M) (-> (and (normed_space E) (normed_space F) (bounded_operator T E F) (compact_operator T) (forall (n) (<= (norm (seq_value x n)) M))) (exists (y k) (and (in y F) (strict_mono_index k) (seq_fn_tends_to (lambda (n) (fn_value T (seq_value x (seq_value k n)))) y)))))
  hard_negative:
    statement: コンパクト作用素について$(x_n)$自身も収束する部分列をもつ。
    reason: $\ell^2$で$T=0$、$x_n=e_n$とすると$T$はコンパクトだが、$\|e_n-e_m\|=\sqrt 2$なので$(x_n)$は収束する部分列をもたない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [NormedAddCommGroup F] [NormedSpace 𝕜 F] (T : E →L[𝕜] F) (x : ℕ → E) (M : ℝ), IsCompactOperator T → (∀ n, ‖x n‖ ≤ M) → ∃ (y : F) (φ : ℕ → ℕ), StrictMono φ ∧ Filter.Tendsto (fun n => T (x (φ n))) Filter.atTop (nhds y)
  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ T x M hT hx
      have hc := hT.isCompact_closure_image_closedBall (f := (T : E →ₗ[𝕜] F)) M
      have hmem : ∀ n, T (x n) ∈ closure (T '' Metric.closedBall 0 M) := fun n =>
        subset_closure ⟨x n, by simpa using hx n, rfl⟩
      obtain ⟨y, _, φ, hφ, ht⟩ := hc.tendsto_subseq hmem
      exact ⟨y, φ, hφ, ht⟩
- id: fa_compact_with_left_inverse_finite_dimensional
  kind: gap
  level: 4
  topic: 作用素論・コンパクト作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$E,F$を$\mathbb{K}$上のノルム空間、$T:E\to F$をコンパクト作用素、$S:F\to E$を有界線形作用素で$ST=I_E$とする。$E$は有限次元である。
  statement_en: If T from E to F is a compact operator between normed spaces over ℝ or ℂ and S is a bounded operator with ST = I on E, then E is finite-dimensional.
  assumptions:
  - $E,F$は$\mathbb{R}$または$\mathbb{C}$上のノルム空間
  - $T:E\to F$はコンパクト作用素
  - $S:F\to E$は有界線形作用素で$ST=I_E$
  quantifiers:
  - 任意の$E,F,T,S$
  conclusion: $E$は有限次元である。
  answer: |
    $E,F$をノルム空間、$T$をコンパクト作用素、$S$を有界線形作用素で$ST=I_E$とする。

    $B$を$E$の閉単位球とする。$K=\overline{T(B)}$はコンパクトであり、$S$は連続なので$S(K)$はコンパクトである。$B=ST(B)\subset S(K)$であり、$B$は閉なのでコンパクトである。

    閉単位球がコンパクトなノルム空間は有限次元である（リースの補題の帰結）。よって$E$は有限次元である。
  strategy: The identity of E factors through T, so the closed unit ball is compact.
  sketch:
  - 'derive: B = ST(B) lies in the compact set S(closure T(B)).'
  - 'derive: B is closed, hence compact.'
  - 'apply_theorem: A normed space with compact unit ball is finite-dimensional.'
  - 'conclude: E is finite-dimensional.'
  openmath: (forall (E F T S) (-> (and (normed_space E) (normed_space F) (bounded_operator T E F) (compact_operator T) (bounded_operator S F E) (= (operator_comp S T) (identity_operator E))) (finite_dim_space E)))
  hard_negative:
    statement: $TS=I_F$（右逆）でも$E$は有限次元である。
    reason: $E=\ell^2$、$F=\mathbb{R}$、$T(x)=x_1$は有限階数でコンパクトであり、$S(t)=te_1$について$TS=I_F$だが、$E$は無限次元である。結論が言えるのは$F$の有限次元性である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [NormedAddCommGroup F] [NormedSpace 𝕜 F] (T : E →L[𝕜] F) (S : F →L[𝕜] E), IsCompactOperator T → S.comp T = ContinuousLinearMap.id 𝕜 E → FiniteDimensional 𝕜 E
  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ T S hT h
      have h1 : IsCompactOperator (S.comp T) := hT.clm_comp S
      rw [h] at h1
      exact isCompactOperator_id_iff_finiteDimensional.mp h1
- id: fa_fredholm_alternative
  kind: named
  level: 4
  topic: 作用素論・フレドホルムの択一
  statement: フレドホルムの択一定理。$\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$X$を$\mathbb{K}$上のバナッハ空間、$T$をコンパクト作用素、$\mu\neq 0$とする。$\mu$が$T$の固有値であるか、$\mu-T$が有界な逆をもつかのいずれかが成り立つ。リースの補題は既習とする。
  statement_en: Fredholm alternative. If T is a compact operator on a Banach space over ℝ or ℂ and μ ≠ 0, then μ is an eigenvalue of T or μ - T has a bounded inverse. Riesz's lemma is taken as known.
  assumptions:
  - $X$は$\mathbb{R}$または$\mathbb{C}$上のバナッハ空間
  - $T$は$X$上のコンパクト作用素
  - $\mu\neq 0$
  - リースの補題は既習
  quantifiers:
  - 任意の$X,T,\mu$
  conclusion: $\mu$は$T$の固有値であるか、$\mu$は$T$のレゾルベント集合に属する。
  answer: |
    $X$をバナッハ空間、$T$をコンパクト作用素、$\mu\neq 0$とし、$\mu$は固有値でないとする。$S=T-\mu$は単射である。$S$が有界な逆をもつことを示す。

    $S$は下に有界である。そうでなければ$\|x_n\|=1$、$Sx_n\to 0$となる列がある。コンパクト性から部分列で$Tx_n\to y$である。$\mu x_n=Tx_n-Sx_n\to y$なので$\|y\|=|\mu|\neq 0$であり、連続性から$Sy=\lim S(\mu x_n)=0$となって単射性に反する。よって$\|x\|\leq c\|Sx\|$となる$c$があり、$X$の完備性から全ての$S^n$の値域$V_n=S^nX$は閉である（$S^n$も下に有界である）。

    $S$は全射である。全射でないとすると、$S$は単射なので$V_{n+1}\subsetneq V_n$が全ての$n$で成り立つ。リースの補題より$x_n\in V_n$、$\|x_n\|=1$、$\mathrm{dist}(x_n,V_{n+1})\geq 1/2$となる列がとれる。$n<m$なら$Tx_n-Tx_m=\mu x_n+Sx_n-Sx_m-\mu x_m$であり、$Sx_n-Sx_m-\mu x_m\in V_{n+1}$である。よって$\|Tx_n-Tx_m\|\geq|\mu|/2$となり、$(Tx_n)$は収束する部分列をもたない。これはコンパクト性に反する。

    $S$は全単射で$\|x\|\leq c\|Sx\|$なので、$S^{-1}$は有界である。$\mu-T=-S$も有界な逆をもつ。
  strategy: Show T - μ is bounded below and, by a Riesz sequence in the decreasing ranges, surjective.
  sketch:
  - 'setup: Assume μ is not an eigenvalue, so S = T - μ is injective.'
  - 'derive: Compactness shows S is bounded below, so the ranges of its powers are closed.'
  - 'contradiction: If S is not surjective, the ranges V_n decrease strictly.'
  - 'construct: Riesz lemma gives unit x_n in V_n far from V_(n+1).'
  - 'derive: Then ‖Tx_n - Tx_m‖ ≥ |μ|/2, contradicting compactness.'
  - 'conclude: S is bijective and bounded below, so its inverse is bounded.'
  openmath: (forall (X T m) (-> (and (banach_space X) (bounded_operator T X X) (compact_operator T) (!= m 0)) (or (eigenvalue_of T m) (in m (resolvent_set T)))))
  hard_negative:
    statement: $\mu=0$でも同じ択一が成り立つ。
    reason: $\ell^2$上の$T(x_n)=(x_n/n)$はコンパクトで単射なので$0$は固有値でないが、$T$は全射でないので$T$は可逆でない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (X : Type*) [NormedAddCommGroup X] [NormedSpace 𝕜 X] [CompleteSpace X] (T : X →L[𝕜] X) (μ : 𝕜), IsCompactOperator T → μ ≠ 0 → Module.End.HasEigenvalue (T : Module.End 𝕜 X) μ ∨ μ ∈ resolventSet 𝕜 T
  proof: |
    by
      intro 𝕜 _ X _ _ _ T μ hT hμ
      exact hT.hasEigenvalue_or_mem_resolventSet hμ
- id: fa_fredholm_injective_implies_invertible
  kind: gap
  level: 4
  topic: 作用素論・フレドホルムの択一
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$X$を$\mathbb{K}$上のバナッハ空間、$T$をコンパクト作用素、$\mu\neq 0$とする。$Tx=\mu x$の解が$x=0$だけならば、有界線形作用素$A$で全ての$y$について$(T-\mu)Ay=y$かつ$A(T-\mu)y=y$となるものが存在する。すなわち方程式$Tx-\mu x=y$は全ての$y$で一意に解け、解は$y$に連続に依存する。単射を仮定する向きの命題であり、全射から単射を導く向きは含まない。フレドホルムの択一定理は既習とする。
  statement_en: Let T be a compact operator on a Banach space over ℝ or ℂ and μ ≠ 0. If Tx = μx only for x = 0, then there is a bounded operator A with (T-μ)Ay = y and A(T-μ)y = y for all y. So Tx - μx = y is uniquely solvable with continuous dependence on y. This is the direction from injectivity; it does not claim that surjectivity implies injectivity. The Fredholm alternative is taken as known.
  assumptions:
  - $X$は$\mathbb{R}$または$\mathbb{C}$上のバナッハ空間
  - $T$はコンパクト作用素、$\mu\neq 0$
  - $Tx=\mu x$なら$x=0$
  - フレドホルムの択一定理は既習
  quantifiers:
  - 任意の$X,T,\mu$
  conclusion: $(T-\mu)A=A(T-\mu)=I$となる有界線形作用素$A$が存在する。
  answer: |
    $X$をバナッハ空間、$T$をコンパクト作用素、$\mu\neq 0$とし、$Tx=\mu x$なら$x=0$とする。

    仮定は$\mu$が$T$の固有値でないことを意味する。フレドホルムの択一定理より$\mu-T$は有界な逆$B$をもつ。$A=-B$とおくと$(T-\mu)A=(\mu-T)B=I$、$A(T-\mu)=B(\mu-T)=I$である。
  strategy: The hypothesis excludes the eigenvalue branch of the Fredholm alternative.
  sketch:
  - 'derive: The hypothesis says that μ is not an eigenvalue.'
  - 'apply_theorem: The Fredholm alternative gives a bounded inverse B of μ - T.'
  - 'conclude: A = -B is the inverse of T - μ.'
  openmath: (forall (X T m) (-> (and (banach_space X) (bounded_operator T X X) (compact_operator T) (!= m 0) (forall (x) (-> (and (in x X) (= (fn_value T x) (* m x))) (= x 0)))) (exists (A) (and (bounded_operator A X X) (forall (y) (-> (in y X) (and (= (- (fn_value T (fn_value A y)) (* m (fn_value A y))) y) (= (fn_value A (- (fn_value T y) (* m y))) y))))))))
  hard_negative:
    statement: コンパクトとは限らない有界作用素$T$でも、$T-\mu$が単射なら有界な逆をもつ。
    reason: $\ell^2$の右シフト$R$と$\mu\neq 0$について$T=R+\mu$とすると、$T-\mu=R$は単射だが全射でない。$T$はコンパクトでない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (X : Type*) [NormedAddCommGroup X] [NormedSpace 𝕜 X] [CompleteSpace X] (T : X →L[𝕜] X) (μ : 𝕜), IsCompactOperator T → μ ≠ 0 → (∀ x : X, T x = μ • x → x = 0) → ∃ R : X →L[𝕜] X, ∀ y, T (R y) - μ • R y = y ∧ R (T y - μ • y) = y
  proof: |
    by
      intro 𝕜 _ X _ _ _ T μ hT hμ h
      have hnot : ¬ Module.End.HasEigenvalue (T : Module.End 𝕜 X) μ := by
        intro he
        obtain ⟨x, hx⟩ := he.exists_hasEigenvector
        exact hx.2 (h x (Module.End.mem_eigenspace_iff.mp hx.1))
      have hres := (hT.hasEigenvalue_or_mem_resolventSet hμ).resolve_left hnot
      obtain ⟨u, hu⟩ : IsUnit (algebraMap 𝕜 (X →L[𝕜] X) μ - T) := hres
      have hval : ∀ x, (u : X →L[𝕜] X) x = μ • x - T x := fun x => by
        rw [hu]; simp [Algebra.algebraMap_eq_smul_one]
      refine ⟨-((u⁻¹ : (X →L[𝕜] X)ˣ) : X →L[𝕜] X), fun y => ⟨?_, ?_⟩⟩
      · have h1 : (u : X →L[𝕜] X) (((u⁻¹ : (X →L[𝕜] X)ˣ) : X →L[𝕜] X) y) = y := congrArg (fun F => F y) u.mul_inv
        rw [hval] at h1
        change T (-(((u⁻¹ : (X →L[𝕜] X)ˣ) : X →L[𝕜] X) y)) - μ • (-(((u⁻¹ : (X →L[𝕜] X)ˣ) : X →L[𝕜] X) y)) = y
        rw [map_neg, smul_neg]
        calc -T (((u⁻¹ : (X →L[𝕜] X)ˣ) : X →L[𝕜] X) y) - -(μ • ((u⁻¹ : (X →L[𝕜] X)ˣ) : X →L[𝕜] X) y) = μ • ((u⁻¹ : (X →L[𝕜] X)ˣ) : X →L[𝕜] X) y - T (((u⁻¹ : (X →L[𝕜] X)ˣ) : X →L[𝕜] X) y) := by abel
          _ = y := h1
      · have h2 : ((u⁻¹ : (X →L[𝕜] X)ˣ) : X →L[𝕜] X) ((u : X →L[𝕜] X) y) = y := congrArg (fun F => F y) u.inv_mul
        rw [hval] at h2
        change -(((u⁻¹ : (X →L[𝕜] X)ˣ) : X →L[𝕜] X) (T y - μ • y)) = y
        rw [← neg_sub, map_neg, neg_neg, h2]
- id: fa_compact_nonzero_spectrum_is_eigenvalue
  kind: textbook
  level: 4
  topic: 作用素論・コンパクト作用素のスペクトル
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$X$を$\mathbb{K}$上のバナッハ空間、$T$をコンパクト作用素、$\mu\neq 0$とする。$\mu\in\sigma(T)$であることと、ある$x\neq 0$で$Tx=\mu x$であることは同値である。フレドホルムの択一定理は既習とする。
  statement_en: For a compact operator T on a Banach space over ℝ or ℂ and μ ≠ 0, μ lies in the spectrum of T if and only if Tx = μx for some x ≠ 0. The Fredholm alternative is taken as known.
  assumptions:
  - $X$は$\mathbb{R}$または$\mathbb{C}$上のバナッハ空間
  - $T$はコンパクト作用素、$\mu\neq 0$
  - フレドホルムの択一定理は既習
  quantifiers:
  - 任意の$X,T,\mu$
  conclusion: $\mu\in\sigma(T)$と、ある$x\neq 0$で$Tx=\mu x$であることは同値である。
  answer: |
    $X$をバナッハ空間、$T$をコンパクト作用素、$\mu\neq 0$とする。

    $x\neq 0$で$Tx=\mu x$なら、$(\mu-T)x=0$なので$\mu-T$は単射でなく、可逆でない。よって$\mu\in\sigma(T)$である。

    逆に$\mu\in\sigma(T)$とする。$\mu-T$は有界な逆をもたないので、フレドホルムの択一定理より$\mu$は固有値である。すなわち、ある$x\neq 0$で$Tx=\mu x$である。
  strategy: Combine the trivial inclusion of eigenvalues in the spectrum with the Fredholm alternative.
  sketch:
  - 'derive: An eigenvector makes μ - T non-injective, so μ is in the spectrum.'
  - 'apply_theorem: Conversely, the Fredholm alternative says a point of the spectrum other than 0 is an eigenvalue.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (X T m) (-> (and (banach_space X) (bounded_operator T X X) (compact_operator T) (!= m 0)) (<-> (in m (spectrum_of T)) (exists (x) (and (in x X) (!= x 0) (= (fn_value T x) (* m x)))))))
  hard_negative:
    statement: 有界作用素のスペクトルは固有値だけからなる。
    reason: $L^2([0,1])$上の掛け算$(Tf)(t)=tf(t)$は$\sigma(T)=[0,1]$だが固有値をもたない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (X : Type*) [NormedAddCommGroup X] [NormedSpace 𝕜 X] [CompleteSpace X] (T : X →L[𝕜] X) (μ : 𝕜), IsCompactOperator T → μ ≠ 0 → (μ ∈ spectrum 𝕜 T ↔ ∃ x : X, x ≠ 0 ∧ T x = μ • x)
  proof: |
    by
      intro 𝕜 _ X _ _ _ T μ hT hμ
      rw [← hT.hasEigenvalue_iff_mem_spectrum hμ]
      constructor
      · intro he
        obtain ⟨x, hx⟩ := he.exists_hasEigenvector
        exact ⟨x, hx.2, Module.End.mem_eigenspace_iff.mp hx.1⟩
      · rintro ⟨x, hx, hTx⟩
        exact Module.End.hasEigenvalue_of_hasEigenvector (x := x) ⟨Module.End.mem_eigenspace_iff.mpr hTx, hx⟩
- id: fa_compact_self_adjoint_has_nonzero_eigenvalue
  kind: textbook
  level: 4
  topic: 作用素論・コンパクト自己共役作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$T\neq 0$をコンパクトな自己共役作用素とする。$T$は$0$でない固有値をもつ。
  statement_en: A nonzero compact self-adjoint operator on a Hilbert space over ℝ or ℂ has a nonzero eigenvalue.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $T\neq 0$はコンパクトかつ$T^*=T$
  quantifiers:
  - 任意の$H,T$
  conclusion: $\mu\neq 0$、$x\neq 0$で$Tx=\mu x$となるものが存在する。
  answer: |
    $H$をヒルベルト空間、$T\neq 0$をコンパクトな自己共役作用素とする。$\langle Tx,x\rangle$は実数であり、自己共役作用素では、全ての$x$で$|\langle Tx,x\rangle|\leq C\|x\|^2$であることと$\|T\|\leq C$が同値なので、$\|T\|=\sup_{\|x\|=1}|\langle Tx,x\rangle|$である。

    $\|x_n\|=1$の列で$\langle Tx_n,x_n\rangle\to\lambda$、$|\lambda|=\|T\|\neq 0$となるものがとれる。すると
    $\|Tx_n-\lambda x_n\|^2=\|Tx_n\|^2-2\lambda\langle Tx_n,x_n\rangle+\lambda^2\leq 2\lambda^2-2\lambda\langle Tx_n,x_n\rangle\to 0$
    である。

    コンパクト性から部分列で$Tx_n\to y$である。$\lambda x_n=Tx_n-(Tx_n-\lambda x_n)\to y$なので$\|y\|=|\lambda|\neq 0$である。連続性から$Ty=\lim T(\lambda x_n)=\lambda\lim Tx_n=\lambda y$である。よって$\lambda\neq 0$は固有値である。
  strategy: Maximize the quadratic form along a sequence and use compactness to obtain an eigenvector.
  sketch:
  - 'setup: Take unit x_n with ⟨Tx_n,x_n⟩ → λ and |λ| = ‖T‖.'
  - 'derive: Expanding gives ‖Tx_n - λx_n‖² ≤ 2λ² - 2λ⟨Tx_n,x_n⟩ → 0.'
  - 'derive: Compactness gives a subsequence with Tx_n → y, so λx_n → y and ‖y‖ = |λ|.'
  - 'conclude: Continuity gives Ty = λy with y ≠ 0.'
  openmath: (forall (H T) (-> (and (hilbert_space H) (bounded_operator T H H) (compact_operator T) (= (adjoint T) T) (!= T 0)) (exists (m x) (and (!= m 0) (in x H) (!= x 0) (= (fn_value T x) (* m x))))))
  hard_negative:
    statement: コンパクトな作用素で$T\neq 0$なら$0$でない固有値をもつ。
    reason: $\ell^2$上の$T(x_1,x_2,\dots)=(0,x_1,x_2/2,x_3/3,\dots)$はコンパクトで$T\neq 0$だが固有値をもたない。自己共役性が要る。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (T : H →L[𝕜] H), IsCompactOperator T → ContinuousLinearMap.adjoint T = T → T ≠ 0 → ∃ (μ : 𝕜) (x : H), μ ≠ 0 ∧ x ≠ 0 ∧ T x = μ • x
  proof: |
    by
      intro 𝕜 _ H _ _ _ T hT hs h0
      have hsym := ContinuousLinearMap.isSelfAdjoint_iff_isSymmetric.mp hs
      by_contra hn
      push Not at hn
      apply h0
      rw [← T.eq_zero_of_forall_hasEigenvalue_eq_zero hT hsym]
      intro μ he
      by_contra hμ
      obtain ⟨x, hx⟩ := he.exists_hasEigenvector
      exact hn μ x hμ hx.2 (Module.End.mem_eigenspace_iff.mp hx.1)
- id: fa_compact_self_adjoint_eigenspaces_total
  kind: textbook
  level: 4
  topic: 作用素論・コンパクト自己共役作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$T$をコンパクトな自己共役作用素とする。固有空間全体の和は$H$で稠密である。$0$の固有空間も和に含める。
  statement_en: For a compact self-adjoint operator T on a Hilbert space over ℝ or ℂ, the sum of all eigenspaces, including the eigenspace of 0, is dense in H.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $T$はコンパクトかつ$T^*=T$
  quantifiers:
  - 任意の$H,T$
  conclusion: 固有空間全体の和の閉包は$H$である。
  answer: |
    $H$をヒルベルト空間、$T$をコンパクトな自己共役作用素とする。$L$を全ての固有空間の和、$M=L^\perp$とする。部分空間が稠密であることは直交補空間が$\{0\}$であることと同値なので、$M=\{0\}$を示す。

    各固有空間は$T$不変なので$L$も$T$不変であり、自己共役性から$M$も$T$不変である。$M$は閉なのでヒルベルト空間であり、$S=T|_M$はコンパクトな自己共役作用素である。

    $S$の固有ベクトルは$T$の固有ベクトルなので$L$に属する。一方それは$M=L^\perp$に属する。よって$S$は固有ベクトルをもたない。$S\neq 0$なら$0$でない固有値が存在するので$S=0$である。すると$M\neq\{0\}$なら$M$の$0$でない元が固有値$0$の固有ベクトルになり矛盾する。よって$M=\{0\}$である。
  strategy: Restrict T to the orthogonal complement of all eigenspaces, where it can have no eigenvector.
  sketch:
  - 'setup: Let M be the orthogonal complement of the sum L of the eigenspaces.'
  - 'derive: M is T-invariant, and S = T restricted to M is compact and self-adjoint.'
  - 'derive: An eigenvector of S lies both in L and in its complement, so none exists.'
  - 'apply_theorem: A nonzero compact self-adjoint operator has an eigenvalue, so S = 0.'
  - 'conclude: Then a nonzero vector of M would be an eigenvector for 0, so M = 0.'
  openmath: (forall (H T) (-> (and (hilbert_space H) (bounded_operator T H H) (compact_operator T) (= (adjoint T) T)) (dense_in (span_of_eigenspaces T) H)))
  hard_negative:
    statement: $0$の固有空間を除いても、固有空間の和は常に稠密である。
    reason: $T=0$、$H\neq 0$なら$0$以外の固有空間はないので和は$\{0\}$であり、稠密でない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (T : H →L[𝕜] H), IsCompactOperator T → ContinuousLinearMap.adjoint T = T → (⨆ μ, Module.End.eigenspace (T : Module.End 𝕜 H) μ).topologicalClosure = ⊤
  proof: |
    by
      intro 𝕜 _ H _ _ _ T hT hs
      rw [Submodule.topologicalClosure_eq_top_iff]
      exact T.orthogonalComplement_iSup_eigenspaces_eq_bot hT (ContinuousLinearMap.isSelfAdjoint_iff_isSymmetric.mp hs)
- id: fa_compact_eigenspace_finite_dimensional
  kind: gap
  level: 4
  topic: 作用素論・コンパクト自己共役作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$、$H$を$\mathbb{K}$上のヒルベルト空間、$T$をコンパクト作用素、$\mu\neq 0$とする。固有空間$\ker(T-\mu)$は有限次元である。
  statement_en: For a compact operator T on a Hilbert space over ℝ or ℂ and μ ≠ 0, the eigenspace ker(T - μ) is finite-dimensional.
  assumptions:
  - $H$は$\mathbb{R}$または$\mathbb{C}$上のヒルベルト空間
  - $T$はコンパクト作用素
  - $\mu\neq 0$
  quantifiers:
  - 任意の$H,T,\mu$
  conclusion: $\ker(T-\mu)$は有限次元である。
  answer: |
    $H$をヒルベルト空間、$T$をコンパクト作用素、$\mu\neq 0$とし、$V=\ker(T-\mu)$とする。$V$は閉部分空間である。

    $B$を$V$の閉単位球とする。$T(B)=\mu B$である。$T$はコンパクトなので$\mu B$の閉包は$H$でコンパクトである。$\mu\neq 0$で$B$は閉なので、$\mu B$は閉でありコンパクトである。したがって$B$はコンパクトである。

    閉単位球がコンパクトなノルム空間は有限次元なので、$V$は有限次元である。
  strategy: On the eigenspace T acts as a nonzero scalar, so the unit ball of the eigenspace is compact.
  sketch:
  - 'setup: On V = ker(T - μ), T equals μ.'
  - 'derive: T(B) = μB has compact closure, and μB is closed.'
  - 'derive: Hence the closed unit ball B of V is compact.'
  - 'conclude: V is finite-dimensional.'
  openmath: (forall (H T m) (-> (and (hilbert_space H) (bounded_operator T H H) (compact_operator T) (!= m 0)) (finite_dim_space (eigenspace T m))))
  hard_negative:
    statement: $\mu=0$の固有空間も有限次元である。
    reason: $\ell^2$上の$T(x_1,x_2,\dots)=(x_1,0,x_3/3,0,x_5/5,\dots)$はコンパクトで、$\ker T$は偶数番目の成分だけの無限次元部分空間である。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (H : Type*) [NormedAddCommGroup H] [InnerProductSpace 𝕜 H] [CompleteSpace H] (T : H →L[𝕜] H) (μ : 𝕜), IsCompactOperator T → μ ≠ 0 → FiniteDimensional 𝕜 (Module.End.eigenspace (T : Module.End 𝕜 H) μ)
  proof: |
    by
      intro 𝕜 _ H _ _ _ T μ hT hμ
      exact T.finite_dimensional_eigenspace hT μ hμ
- id: fa_cstar_norm_self_mul_star
  kind: gap
  level: 4
  topic: $C^*$環・$C^*$恒等式の帰結
  statement: $A$を$C^*$環（単位元の有無は問わない）とする。全ての$a\in A$で$\|aa^*\|=\|a\|^2$かつ$\|a^*\|=\|a\|$である。ここで$C^*$恒等式は$\|a^*a\|=\|a\|^2$である。
  statement_en: In a C*-algebra, unital or not, ‖aa*‖ = ‖a‖² and ‖a*‖ = ‖a‖ for all a. Here the C*-identity is ‖a*a‖ = ‖a‖².
  assumptions:
  - $A$は$C^*$環で、$\|a^*a\|=\|a\|^2$を満たす
  quantifiers:
  - 任意の$A,a$
  conclusion: $\|aa^*\|=\|a\|^2$かつ$\|a^*\|=\|a\|$である。
  answer: |
    $A$を$C^*$環、$a\in A$とする。$C^*$恒等式と積の評価から$\|a\|^2=\|a^*a\|\leq\|a^*\|\|a\|$である。$a\neq 0$なら$\|a\|\leq\|a^*\|$であり、$a=0$なら$a^*=0$なのでこれは明らかである。

    $a$の代わりに$a^*$を使うと、$a^{**}=a$より$\|a^*\|\leq\|a\|$である。よって$\|a^*\|=\|a\|$である。

    $C^*$恒等式を$a^*$に適用すると$\|aa^*\|=\|a^{**}a^*\|=\|a^*\|^2=\|a\|^2$である。
  strategy: Derive isometry of the involution from the C*-identity and apply the identity to a*.
  sketch:
  - 'derive: ‖a‖² = ‖a*a‖ ≤ ‖a*‖‖a‖ gives ‖a‖ ≤ ‖a*‖.'
  - 'derive: Replacing a by a* gives equality.'
  - 'conclude: The C*-identity for a* gives ‖aa*‖ = ‖a‖².'
  openmath: (forall (A a) (-> (and (cstar_ring A) (in a A)) (and (= (norm (* a (star_element a))) (^ (norm a) 2)) (= (norm (star_element a)) (norm a)))))
  hard_negative:
    statement: 対合つきバナッハ環で$\|a^*\|=\|a\|$なら$\|a^*a\|=\|a\|^2$である。
    reason: $\ell^1(\mathbb{Z})$に畳み込みと$a^*(n)=\overline{a(-n)}$を入れると$\|a^*\|=\|a\|$である。$a=\delta_0+\delta_1-\delta_2$では$\|a\|=3$だが、$a^*a=3\delta_0-\delta_2-\delta_{-2}$なので$\|a^*a\|=5\neq 9$である。
  target: |
    ∀ (A : Type*) [NonUnitalNormedRing A] [StarRing A] [CStarRing A] (a : A), ‖a * star a‖ = ‖a‖ ^ 2 ∧ ‖star a‖ = ‖a‖
  proof: |
    by
      intro A _ _ _ a
      exact ⟨by rw [CStarRing.norm_self_mul_star, sq], norm_star a⟩
- id: fa_cstar_unitary_norm_invariance
  kind: gap
  level: 4
  topic: $C^*$環・$C^*$恒等式の帰結
  statement: $A$を単位的$C^*$環、$u\in A$をユニタリ元（$u^*u=uu^*=1$）とする。全ての$a\in A$で$\|ua\|=\|a\|=\|au\|$である。
  statement_en: If u is a unitary element of a unital C*-algebra, then ‖ua‖ = ‖a‖ = ‖au‖ for all a.
  assumptions:
  - $A$は単位的$C^*$環
  - $u^*u=uu^*=1$
  quantifiers:
  - 任意の$A,u,a$
  conclusion: $\|ua\|=\|a\|$かつ$\|au\|=\|a\|$である。
  answer: |
    $A$を単位的$C^*$環、$u$をユニタリ元、$a\in A$とする。$C^*$恒等式より
    $\|ua\|^2=\|(ua)^*(ua)\|=\|a^*u^*ua\|=\|a^*a\|=\|a\|^2$
    である。

    $\|aa^*\|=\|a\|^2$も成り立つので、
    $\|au\|^2=\|(au)(au)^*\|=\|auu^*a^*\|=\|aa^*\|=\|a\|^2$
    である。
  strategy: Compute the squared norms with the C*-identity and cancel u*u or uu*.
  sketch:
  - 'derive: ‖ua‖² = ‖a*u*ua‖ = ‖a*a‖ = ‖a‖².'
  - 'conclude: Likewise ‖au‖² = ‖auu*a*‖ = ‖aa*‖ = ‖a‖².'
  openmath: (forall (A u a) (-> (and (cstar_ring A) (unitary_element u A) (in a A)) (and (= (norm (* u a)) (norm a)) (= (norm (* a u)) (norm a)))))
  hard_negative:
    statement: $u^*u=1$だけで$\|au\|=\|a\|$である。
    reason: $\ell^2$上の右シフト$u$は$u^*u=1$である。$a=1-uu^*$とすると$au=0$だが、$a$は$e_1$への射影なので$\|a\|=1$である。
  target: |
    ∀ (A : Type*) [NormedRing A] [StarRing A] [CStarRing A] (u a : A), u ∈ unitary A → ‖u * a‖ = ‖a‖ ∧ ‖a * u‖ = ‖a‖
  proof: |
    by
      intro A _ _ _ u a hu
      exact ⟨CStarRing.norm_coe_unitary_mul ⟨u, hu⟩ a, CStarRing.norm_mul_coe_unitary a ⟨u, hu⟩⟩
- id: fa_cstar_normal_spectral_radius_eq_norm
  kind: textbook
  level: 4
  topic: $C^*$環・スペクトル半径
  statement: $A$を単位的$C^*$環、$a\in A$を正規元（$a^*a=aa^*$）とする。特に自己共役元を含む。スペクトル半径について$\rho(a)=\|a\|$である。ゲルファントの公式は既習とする。
  statement_en: For a normal element a of a unital C*-algebra, in particular a self-adjoint one, the spectral radius satisfies ρ(a) = ‖a‖. Gelfand's formula is taken as known.
  assumptions:
  - $A$は単位的$C^*$環
  - $a^*a=aa^*$
  - ゲルファントの公式は既習
  quantifiers:
  - 任意の$A,a$
  conclusion: $\rho(a)=\|a\|$である。
  answer: |
    $A$を単位的$C^*$環、$a$を正規元とする。

    $h$を自己共役元とすると$\|h^2\|=\|h^*h\|=\|h\|^2$である。帰納法で$\|h^{2^n}\|=\|h\|^{2^n}$である。

    $a$は正規なので$(a^{2^n})^*a^{2^n}=(a^*a)^{2^n}$である。$h=a^*a$は自己共役なので
    $\|a^{2^n}\|^2=\|(a^*a)^{2^n}\|=\|a^*a\|^{2^n}=\|a\|^{2^{n+1}}$
    である。よって$\|a^{2^n}\|=\|a\|^{2^n}$である。

    ゲルファントの公式$\rho(a)=\lim_{m\to\infty}\|a^m\|^{1/m}$を部分列$m=2^n$で計算すると、$\rho(a)=\|a\|$である。
  strategy: Compute the norms of the powers 2^n by the C*-identity and apply Gelfand's formula.
  sketch:
  - 'derive: For self-adjoint h, ‖h^(2^n)‖ = ‖h‖^(2^n) by the C*-identity.'
  - 'derive: Normality gives ‖a^(2^n)‖² = ‖(a*a)^(2^n)‖ = ‖a‖^(2^(n+1)).'
  - 'apply_theorem: Gelfand''s formula along m = 2^n gives ρ(a) = ‖a‖.'
  openmath: (forall (A a) (-> (and (cstar_algebra A) (in a A) (normal_element a)) (= (spectral_radius a) (norm a))))
  hard_negative:
    statement: $C^*$環の全ての元で$\rho(a)=\|a\|$である。
    reason: $a=\begin{pmatrix}0&1\\0&0\end{pmatrix}$は冪零なので$\rho(a)=0$だが、$\|a\|=1$である。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] (a : A), star a * a = a * star a → spectralRadius ℂ a = ‖a‖₊
  proof: |
    by
      intro A _ a h
      haveI : IsStarNormal a := ⟨h⟩
      exact IsStarNormal.spectralRadius_eq_nnnorm a
- id: fa_cstar_self_adjoint_spectrum_real
  kind: gap
  level: 4
  topic: $C^*$環・スペクトルの基本
  statement: $A$を単位的$C^*$環、$a\in A$を自己共役元、$z\in\sigma(a)$とする。$z$は実数である。
  statement_en: The spectrum of a self-adjoint element of a unital C*-algebra is contained in the real line.
  assumptions:
  - $A$は単位的$C^*$環
  - $a^*=a$
  - $z\in\sigma(a)$
  quantifiers:
  - 任意の$A,a,z$
  conclusion: $\mathrm{Im}\,z=0$である。
  answer: |
    $A$を単位的$C^*$環、$a^*=a$、$z=s+it\in\sigma(a)$（$s,t$は実数）とする。$r\in\mathbb{R}$をとる。スカラーの平行移動により$z+ir\in\sigma(a+ir)$である。スペクトルの点の絶対値はノルム以下である（$\|1\|=1$）から
    $s^2+(t+r)^2\leq\|a+ir\|^2$
    である。

    $C^*$恒等式より$\|a+ir\|^2=\|(a-ir)(a+ir)\|=\|a^2+r^2\|\leq\|a\|^2+r^2$である。よって全ての実数$r$で$s^2+t^2+2tr\leq\|a\|^2$である。$r$を動かすと$t=0$でなければならない。
  strategy: Shift a by ir and let r vary in the norm bound for the spectrum.
  sketch:
  - 'setup: Write z = s + it and shift: z + ir lies in the spectrum of a + ir.'
  - 'derive: The norm bound for the spectrum gives s² + (t+r)² ≤ ‖a+ir‖².'
  - 'derive: The C*-identity gives ‖a+ir‖² ≤ ‖a‖² + r².'
  - 'conclude: s² + t² + 2tr ≤ ‖a‖² for all real r forces t = 0.'
  openmath: (forall (A a z) (-> (and (cstar_algebra A) (in a A) (= (star_element a) a) (in z (spectrum_of a))) (= (imag_part z) 0)))
  hard_negative:
    statement: 自己共役元のスペクトルは非負である。
    reason: $A=\mathbb{C}$、$a=-1$は自己共役だが$\sigma(a)=\{-1\}$である。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] (a : A) (z : ℂ), star a = a → z ∈ spectrum ℂ a → z.im = 0
  proof: |
    by
      intro A _ a z h hz
      exact IsSelfAdjoint.im_eq_zero_of_mem_spectrum (a := a) h hz
- id: fa_cstar_unitary_spectrum_circle
  kind: gap
  level: 4
  topic: $C^*$環・スペクトルの基本
  statement: $A$を単位的$C^*$環、$u\in A$をユニタリ元、$z\in\sigma(u)$とする。$|z|=1$である。
  statement_en: If u is a unitary element of a unital C*-algebra and z is in the spectrum of u, then |z| = 1.
  assumptions:
  - $A$は単位的$C^*$環
  - $u^*u=uu^*=1$
  - $z\in\sigma(u)$
  quantifiers:
  - 任意の$A,u,z$
  conclusion: $|z|=1$である。
  answer: |
    $A$を単位的$C^*$環、$u$をユニタリ元、$z\in\sigma(u)$とする。$C^*$恒等式より$\|u\|^2=\|u^*u\|=\|1\|=1$であり、同様に$\|u^*\|=1$である。

    スペクトルの点の絶対値はノルム以下なので$|z|\leq 1$である。$u$は可逆なので$z\neq 0$である。

    $u^{-1}=u^*$であり、$u^{-1}-z^{-1}=-z^{-1}u^{-1}(u-z)$である。$u-z$は可逆でないので$u^{-1}-z^{-1}$も可逆でなく、$z^{-1}\in\sigma(u^*)$である。よって$|z^{-1}|\leq\|u^*\|=1$である。したがって$|z|=1$である。
  strategy: Bound z by ‖u‖ = 1 and z⁻¹ by ‖u*‖ = 1.
  sketch:
  - 'derive: The C*-identity gives ‖u‖ = ‖u*‖ = 1, so |z| ≤ 1.'
  - 'derive: z ≠ 0 since u is invertible, and z⁻¹ lies in the spectrum of u* = u⁻¹.'
  - 'conclude: |z⁻¹| ≤ 1, hence |z| = 1.'
  openmath: (forall (A u z) (-> (and (cstar_algebra A) (unitary_element u A) (in z (spectrum_of u))) (= (abs z) 1)))
  hard_negative:
    statement: $\|u\|=1$である元のスペクトルは単位円周上にある。
    reason: $A=\mathbb{C}^2$、$u=(1,1/2)$は$\|u\|=1$だが$\sigma(u)=\{1,1/2\}$である。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] (u : A) (z : ℂ), u ∈ unitary A → z ∈ spectrum ℂ u → ‖z‖ = 1
  proof: |
    by
      intro A _ u z hu hz
      simpa using spectrum.subset_circle_of_unitary hu hz
- id: fa_cstar_star_hom_contractive
  kind: gap
  level: 4
  topic: $C^*$環・*準同型
  statement: $A,B$を単位的$C^*$環、$\varphi:A\to B$を単位元を保つ*準同型とする。連続性を仮定せずに、全ての$a$で$\|\varphi(a)\|\leq\|a\|$である。
  statement_en: A unital *-homomorphism φ between unital C*-algebras satisfies ‖φ(a)‖ ≤ ‖a‖ for all a, without assuming continuity.
  assumptions:
  - $A,B$は単位的$C^*$環
  - $\varphi:A\to B$は単位元を保つ*準同型
  quantifiers:
  - 任意の$A,B,\varphi,a$
  conclusion: $\|\varphi(a)\|\leq\|a\|$である。
  answer: |
    $A,B$を単位的$C^*$環、$\varphi:A\to B$を単位元を保つ*準同型、$a\in A$とする。

    $x\in A$について$\sigma(\varphi(x))\subset\sigma(x)$である。実際、$z-x$が可逆なら$z-\varphi(x)=\varphi(z-x)$も可逆である。よって$\rho(\varphi(x))\leq\rho(x)$である。

    $h=a^*a$は自己共役であり、$\varphi(h)=\varphi(a)^*\varphi(a)$も自己共役である。自己共役元ではスペクトル半径がノルムに等しいので
    $\|\varphi(a)\|^2=\|\varphi(h)\|=\rho(\varphi(h))\leq\rho(h)=\|h\|=\|a\|^2$
    である。
  strategy: Homomorphisms shrink spectra, and for self-adjoint elements the norm is the spectral radius.
  sketch:
  - 'derive: A unital homomorphism maps invertibles to invertibles, so σ(φ(x)) is inside σ(x).'
  - 'apply_theorem: Norm equals spectral radius for the self-adjoint elements a*a and φ(a)*φ(a).'
  - 'conclude: ‖φ(a)‖² = ρ(φ(a*a)) ≤ ρ(a*a) = ‖a‖².'
  openmath: (forall (A B f a) (-> (and (cstar_algebra A) (cstar_algebra B) (unital_star_hom f A B) (in a A)) (<= (norm (fn_value f a)) (norm a))))
  hard_negative:
    statement: 単位元を保つ準同型（*を保つとは限らない）も$\|\varphi(a)\|\leq\|a\|$を満たす。
    reason: $M_2(\mathbb{C})$上で$s=\mathrm{diag}(1,2)$による$\varphi(a)=sas^{-1}$は単位元を保つ準同型だが、$a=\begin{pmatrix}0&0\\1&0\end{pmatrix}$で$\|\varphi(a)\|=2>\|a\|$である。
  target: |
    ∀ (A B : Type*) [CStarAlgebra A] [CStarAlgebra B] (φ : A →⋆ₐ[ℂ] B) (a : A), ‖φ a‖ ≤ ‖a‖
  proof: |
    by
      intro A B _ _ φ a
      exact NonUnitalStarAlgHom.norm_apply_le φ a
- id: fa_cstar_injective_star_hom_isometric
  kind: gap
  level: 4
  topic: $C^*$環・*準同型
  statement: $A,B$を単位的$C^*$環、$\varphi:A\to B$を単射な単位的*準同型とする。全ての$a$で$\|\varphi(a)\|=\|a\|$である。連続関数計算は既習とする。
  statement_en: An injective unital *-homomorphism between unital C*-algebras is isometric. The continuous functional calculus is taken as known.
  assumptions:
  - $A,B$は単位的$C^*$環
  - $\varphi:A\to B$は単射な単位的*準同型
  - 連続関数計算は既習
  quantifiers:
  - 任意の$A,B,\varphi,a$
  conclusion: $\|\varphi(a)\|=\|a\|$である。
  answer: |
    $A,B$を単位的$C^*$環、$\varphi$を単射な単位的*準同型とする。$C^*$恒等式より、自己共役元$h=a^*a$について$\|\varphi(h)\|=\|h\|$を示せば足りる。

    *準同型はノルムを増やさないので$\|\varphi(h)\|\leq\|h\|$である。$\|\varphi(h)\|<\|h\|$と仮定する。$h\geq 0$なので$\|h\|\in\sigma(h)$である。$\sigma(\varphi(h))\subset\sigma(h)$であり、$\sigma(\varphi(h))$の元の絶対値は$\|\varphi(h)\|$以下である。

    実数上の連続関数$f$を、$|t|\leq\|\varphi(h)\|$で$f(t)=0$、$f(\|h\|)=1$となるようにとる。$\sigma(h)$上の連続関数は多項式で一様近似できるので、$\varphi(f(h))=f(\varphi(h))$である。$f$は$\sigma(\varphi(h))$上で$0$なので$\varphi(f(h))=0$である。一方、$f$は$\sigma(h)$上で$0$でないので$f(h)\neq 0$である。これは$\varphi$の単射性に反する。
  strategy: If the norm dropped, a continuous function would give a nonzero element in the kernel.
  sketch:
  - 'translate: By the C*-identity it suffices to treat h = a*a.'
  - 'contradiction: Suppose ‖φ(h)‖ < ‖h‖.'
  - 'construct: Choose continuous f vanishing on the spectrum of φ(h) with f(‖h‖) = 1.'
  - 'derive: Polynomial approximation gives φ(f(h)) = f(φ(h)) = 0 while f(h) ≠ 0.'
  - 'conclude: This contradicts injectivity.'
  openmath: (forall (A B f a) (-> (and (cstar_algebra A) (cstar_algebra B) (unital_star_hom f A B) (injective_map f) (in a A)) (= (norm (fn_value f a)) (norm a))))
  hard_negative:
    statement: 単射でない*準同型も等長である。
    reason: $A=\mathbb{C}^2$、$\varphi(x,y)=x$は単位的*準同型だが、$\|\varphi(0,1)\|=0\neq 1$である。
  target: |
    ∀ (A B : Type*) [CStarAlgebra A] [CStarAlgebra B] (φ : A →⋆ₐ[ℂ] B) (a : A), Function.Injective φ → ‖φ a‖ = ‖a‖
  proof: |
    by
      intro A B _ _ φ a h
      exact NonUnitalStarAlgHom.norm_map φ h a
- id: fa_cstar_spectral_permanence
  kind: textbook
  level: 4
  topic: $C^*$環・スペクトルの不変性
  statement: スペクトルの不変性。$A$を単位的$C^*$環、$S$を単位元を含む閉*部分環、$a\in S$とする。$S$で計算したスペクトルと$A$で計算したスペクトルは一致する。
  statement_en: Spectral permanence. If S is a closed *-subalgebra of a unital C*-algebra A containing the unit and a is in S, the spectrum of a computed in S equals the spectrum computed in A.
  assumptions:
  - $A$は単位的$C^*$環
  - $S$は$1$を含む閉*部分環
  - $a\in S$
  quantifiers:
  - 任意の$A,S,a$
  conclusion: $\sigma_S(a)=\sigma_A(a)$である。
  answer: |
    $A$を単位的$C^*$環、$S$を$1$を含む閉*部分環とする。$S$での逆元は$A$での逆元なので$\sigma_A(x)\subset\sigma_S(x)$である（$x\in S$）。逆の包含には、$a\in S$が$A$で可逆なら$a^{-1}\in S$であることを示せばよい。$z-a$に適用できるからである。

    $a$が$A$で可逆とする。$h=a^*a\in S$は$A$で可逆な自己共役元である。$S$も$C^*$環なので$\sigma_S(h)\subset\mathbb{R}$である。よって$n\geq 1$で$h+i/n$は$S$で可逆であり、$(h+i/n)^{-1}\in S$である。

    $A$で可逆な元の上で逆元をとる写像は連続なので、$(h+i/n)^{-1}\to h^{-1}$である。$S$は閉なので$h^{-1}\in S$である。$a^{-1}=h^{-1}a^*\in S$である。
  strategy: Reduce to the self-adjoint element a*a, whose spectrum in S is real, and approximate its inverse.
  sketch:
  - 'derive: σ_A(x) is contained in σ_S(x) trivially.'
  - 'translate: It suffices that a in S invertible in A has a⁻¹ in S.'
  - 'derive: For h = a*a, σ_S(h) is real, so h + i/n is invertible in S.'
  - 'derive: Continuity of inversion in A and closedness of S give h⁻¹ in S.'
  - 'conclude: a⁻¹ = h⁻¹a* lies in S.'
  openmath: (forall (A S a) (-> (and (cstar_algebra A) (star_subalgebra S A) (closed_set S) (in a S)) (= (spectrum_in S a) (spectrum_of a))))
  hard_negative:
    statement: バナッハ環の閉部分環でもスペクトルは常に一致する。
    reason: $C(\mathbb{T})$の閉部分環である円板環$A(\mathbb{D})$で$a(z)=z$は、円板環では$\sigma=\overline{\mathbb{D}}$だが、$C(\mathbb{T})$では$\sigma=\mathbb{T}$である。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] (S : StarSubalgebra ℂ A) (a : S), IsClosed (S : Set A) → spectrum ℂ a = spectrum ℂ (a : A)
  proof: |
    by
      intro A _ S a h
      haveI := h
      exact StarSubalgebra.spectrum_eq S
- id: fa_cstar_nonneg_iff_self_adjoint_spectrum
  kind: gap
  level: 4
  topic: $C^*$環・正元の特徴づけ
  statement: $A$を単位的$C^*$環とし、順序を$0\leq a\iff a$が$b^*b$の形の元の有限和である、で定める。$0\leq a$であることと、$a$が自己共役で$\sigma(a)\subset[0,\infty)$であることは同値である。連続関数計算は既習とする。
  statement_en: Order a unital C*-algebra by declaring 0 ≤ a when a is a finite sum of elements b*b. Then 0 ≤ a if and only if a is self-adjoint with spectrum in [0,∞). The continuous functional calculus is taken as known.
  assumptions:
  - $A$は単位的$C^*$環
  - $0\leq a$は$a$が$b^*b$の有限和であることを表す
  - 連続関数計算は既習
  quantifiers:
  - 任意の$A,a$
  conclusion: $0\leq a$と、$a^*=a$かつ$\sigma(a)\subset[0,\infty)$であることは同値である。
  answer: |
    $A$を単位的$C^*$環とする。$P$を、自己共役で$\sigma\subset[0,\infty)$である元全体とする。

    $a\in P$なら$c=\sqrt{a}$（連続関数計算）は自己共役で$c^*c=a$なので$0\leq a$である。逆を示すには、$P$が和で閉じること（第1段）と、$b^*b\in P$（第3段）を示せばよい。

    第1段。自己共役な$h$と$t\geq\|h\|$について、$h\in P$と$\|t-h\|\leq t$は同値である。連続関数計算により$\|t-h\|=\sup_{s\in\sigma(h)}|t-s|$であり、$s\leq t$だからである。$h_1,h_2\in P$、$t_i=\|h_i\|$とすると、$\|(t_1+t_2)-(h_1+h_2)\|\leq t_1+t_2$かつ$t_1+t_2\geq\|h_1+h_2\|$なので、$h_1+h_2\in P$である。

    第2段。$-c^*c\in P$なら$c=0$である。$c=x+iy$（$x,y$は自己共役）と書くと$c^*c+cc^*=2x^2+2y^2$なので、$cc^*=2x^2+2y^2+(-c^*c)\in P$である。$\sigma(c^*c)$と$\sigma(cc^*)$は$0$以外で一致するので、$\sigma(c^*c)\subset(-\infty,0]\cap[0,\infty)=\{0\}$である。自己共役元のノルムはスペクトル半径なので$\|c\|^2=\|c^*c\|=0$である。

    第3段。$h=b^*b$とする。連続関数計算で$h=h_+-h_-$、$h_\pm\in P$、$h_+h_-=0$と分解する。$c=bh_-$とおくと$c^*c=h_-(h_+-h_-)h_-=-h_-^3$なので$-c^*c=h_-^3\in P$である。第2段より$c=0$なので$h_-^3=0$であり、$h_-=0$である。よって$b^*b=h_+\in P$である。

    第1段と第3段から、$b^*b$の有限和は$P$に属する。
  strategy: Show the set of self-adjoint elements with nonnegative spectrum is a cone containing every b*b.
  sketch:
  - 'derive: For self-adjoint h and t ≥ ‖h‖, nonnegative spectrum is equivalent to ‖t - h‖ ≤ t, so such elements are closed under sums.'
  - 'derive: If -c*c has nonnegative spectrum then cc* does too, so σ(c*c) = {0} and c = 0.'
  - 'construct: Decompose b*b = h₊ - h₋ and set c = bh₋, so -c*c = h₋³.'
  - 'derive: Hence h₋ = 0 and b*b has nonnegative spectrum.'
  - 'conclude: Finite sums of b*b are exactly the self-adjoint elements with nonnegative spectrum, using square roots.'
  openmath: (forall (A a) (-> (and (cstar_algebra A) (star_ordered A) (in a A)) (<-> (nonneg_element a) (and (= (star_element a) a) (forall (z) (-> (in z (spectrum_of a)) (>= z 0)))))))
  hard_negative:
    statement: 自己共役でなくても$\sigma(a)\subset[0,\infty)$なら$a$は正である。
    reason: $a=\begin{pmatrix}0&1\\0&0\end{pmatrix}$は$\sigma(a)=\{0\}$だが自己共役でない。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] [PartialOrder A] [StarOrderedRing A] (a : A), 0 ≤ a ↔ star a = a ∧ ∀ z ∈ spectrum ℝ a, 0 ≤ z
  proof: |
    by
      intro A _ _ _ a
      constructor
      · intro h
        exact ⟨IsSelfAdjoint.of_nonneg h, fun z hz => spectrum_nonneg_of_nonneg h hz⟩
      · rintro ⟨h1, h2⟩
        have ha : IsSelfAdjoint a := h1
        rw [← cfc_id ℝ a]
        exact cfc_nonneg fun x hx => h2 x hx
- id: fa_cstar_nonneg_iff_star_mul_self
  kind: textbook
  level: 4
  topic: $C^*$環・正元の特徴づけ
  statement: $A$を単位的$C^*$環とし、順序を$0\leq a\iff a$が$b^*b$の形の元の有限和である、で定める。$0\leq a$であることと、ある$b$で$a=b^*b$であることは同値である。すなわち有限和は一つの$b^*b$にまとめられる。正元のスペクトルによる特徴づけと連続関数計算は既習とする。
  statement_en: Order a unital C*-algebra by declaring 0 ≤ a when a is a finite sum of elements b*b. Then 0 ≤ a if and only if a = b*b for a single b. The spectral characterization of positive elements and the continuous functional calculus are taken as known.
  assumptions:
  - $A$は単位的$C^*$環
  - $0\leq a$は$a$が$b^*b$の有限和であることを表す
  - 正元のスペクトルによる特徴づけと連続関数計算は既習
  quantifiers:
  - 任意の$A,a$
  conclusion: $0\leq a$と、ある$b$で$a=b^*b$であることは同値である。
  answer: |
    $A$を単位的$C^*$環、$a\in A$とする。

    $a=b^*b$なら、定義から$0\leq a$である。

    逆に$0\leq a$とする。正元の特徴づけより$a$は自己共役で$\sigma(a)\subset[0,\infty)$である。連続関数$\sqrt{t}$は$\sigma(a)$上で定まるので、連続関数計算により$b=\sqrt{a}$をとれる。$b$は自己共役で$b^2=a$なので、$a=b^*b$である。
  strategy: Take the square root by the continuous functional calculus.
  sketch:
  - 'derive: b*b is nonnegative by definition.'
  - 'apply_theorem: A nonnegative element is self-adjoint with spectrum in [0,∞).'
  - 'conclude: Its square root b satisfies a = b*b.'
  openmath: (forall (A a) (-> (and (cstar_algebra A) (star_ordered A) (in a A)) (<-> (nonneg_element a) (exists (b) (and (in b A) (= a (* (star_element b) b)))))))
  hard_negative:
    statement: $0\leq a$と、ある$b$で$a=b^2$であることは同値である。
    reason: $b=\begin{pmatrix}0&-1\\1&0\end{pmatrix}$は$b^2=-I$を満たすが、$-I$は正元でない。$b$が自己共役なら$b^2=b^*b$である。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] [PartialOrder A] [StarOrderedRing A] (a : A), 0 ≤ a ↔ ∃ b, a = star b * b
  proof: |
    by
      intro A _ _ _ a
      exact CStarAlgebra.nonneg_iff_eq_star_mul_self
- id: fa_cstar_nonneg_norm_monotone
  kind: gap
  level: 4
  topic: $C^*$環・順序とノルム
  statement: $A$を単位的$C^*$環（$0\leq a\iff a$は$b^*b$の有限和）とする。$0\leq a\leq b$ならば$\|a\|\leq\|b\|$である。正元の特徴づけは既習とする。
  statement_en: In a unital C*-algebra with the order given by finite sums of b*b, if 0 ≤ a ≤ b then ‖a‖ ≤ ‖b‖. The characterization of positive elements is taken as known.
  assumptions:
  - $A$は単位的$C^*$環で順序は$b^*b$の有限和で定まる
  - $0\leq a\leq b$
  - 正元の特徴づけは既習
  quantifiers:
  - 任意の$A,a,b$
  conclusion: $\|a\|\leq\|b\|$である。
  answer: |
    $A$を単位的$C^*$環、$0\leq a\leq b$とする。$b$は$a$と$b-a$の和なので正元である。

    自己共役な$b$について、$\sigma(\|b\|-b)\subset[0,\infty)$なので$b\leq\|b\|\cdot 1$である。よって$a\leq b\leq\|b\|\cdot 1$であり、$\|b\|-a$は正元である。すなわち$\sigma(a)$の元$s$は$s\leq\|b\|$を満たす。

    $a$は正元なので$s\geq 0$である。自己共役元のノルムはスペクトル半径なので$\|a\|=\max_{s\in\sigma(a)}|s|\leq\|b\|$である。
  strategy: Dominate a by ‖b‖·1 and read off the spectrum of a.
  sketch:
  - 'derive: b is positive, and b ≤ ‖b‖·1 by the spectrum of ‖b‖ - b.'
  - 'derive: So ‖b‖ - a is positive and σ(a) is contained in [0,‖b‖].'
  - 'conclude: The norm of a equals its spectral radius, which is at most ‖b‖.'
  openmath: (forall (A a b) (-> (and (cstar_algebra A) (star_ordered A) (in a A) (in b A) (nonneg_element a) (nonneg_element (- b a))) (<= (norm a) (norm b))))
  hard_negative:
    statement: $a\leq b$だけで$\|a\|\leq\|b\|$である。
    reason: $A=\mathbb{C}$、$a=-2$、$b=1$では$a\leq b$だが$\|a\|=2>1=\|b\|$である。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] [PartialOrder A] [StarOrderedRing A] (a b : A), 0 ≤ a → a ≤ b → ‖a‖ ≤ ‖b‖
  proof: |
    by
      intro A _ _ _ a b h1 h2
      exact CStarAlgebra.norm_le_norm_of_nonneg_of_le h1 h2
- id: fa_cstar_unique_positive_square_root
  kind: textbook
  level: 4
  topic: $C^*$環・正元の平方根
  statement: $A$を単位的$C^*$環（順序は$b^*b$の有限和で定まる）、$0\leq a$とする。$0\leq b$かつ$b^2=a$となる$b$がちょうど一つ存在する。連続関数計算、ゲルファント変換、スペクトルの不変性は既習とする。
  statement_en: In a unital C*-algebra with the order given by finite sums of b*b, each a ≥ 0 has exactly one b ≥ 0 with b² = a. The continuous functional calculus, the Gelfand transform and spectral permanence are taken as known.
  assumptions:
  - $A$は単位的$C^*$環で順序は$b^*b$の有限和で定まる
  - $0\leq a$
  - 連続関数計算、ゲルファント変換、スペクトルの不変性は既習
  quantifiers:
  - 任意の$A,a$
  conclusion: $0\leq b$かつ$b^2=a$となる$b$が一意に存在する。
  answer: |
    $A$を単位的$C^*$環、$0\leq a$とする。$a$は自己共役で$\sigma(a)\subset[0,\infty)$である。

    存在。連続関数計算により$c=\sqrt{a}$をとる。$c$は自己共役で、$\sigma(c)=\sqrt{\sigma(a)}\subset[0,\infty)$なので$0\leq c$であり、$c^2=a$である。

    一意性。$b\geq 0$、$b^2=a$とする。$b$は$a=b^2$と可換であり、$c$は$\sigma(a)$上の多項式の一様極限で近似される$a$の連続関数なので、$b$は$c$とも可換である。$b,c$と$1$の生成する可換$C^*$部分環を$B$とする。

    ゲルファント変換により$B$を連続関数環と同一視する。スペクトルの不変性より、$B$で計算した$b,c$のスペクトルは$[0,\infty)$に含まれるので、$\hat b,\hat c\geq 0$である。また$\hat b^2=\hat c^2$である。各点で非負の平方根は一意なので$\hat b=\hat c$である。ゲルファント変換は単射なので$b=c$である。
  strategy: Construct the root by functional calculus and prove uniqueness in a commutative subalgebra.
  sketch:
  - 'construct: c = √a by the continuous functional calculus.'
  - 'derive: Any positive root b commutes with a, hence with c.'
  - 'setup: Work in the commutative C*-algebra generated by b, c and 1.'
  - 'conclude: Gelfand transforms give nonnegative functions with equal squares, so b = c.'
  openmath: (forall (A a) (-> (and (cstar_algebra A) (star_ordered A) (in a A) (nonneg_element a)) (exists (b) (and (in b A) (nonneg_element b) (= (* b b) a) (forall (c) (-> (and (in c A) (nonneg_element c) (= (* c c) a)) (= c b)))))))
  hard_negative:
    statement: $b^2=a$となる$b$は正元に限らなくても一意である。
    reason: $A=\mathbb{C}^2$、$a=(1,1)$では$(1,1)$、$(1,-1)$、$(-1,1)$、$(-1,-1)$がすべて平方根である。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] [PartialOrder A] [StarOrderedRing A] (a : A), 0 ≤ a → ∃! b : A, 0 ≤ b ∧ b * b = a
  proof: |
    by
      intro A _ _ _ a h
      refine ⟨CFC.sqrt a, ⟨CFC.sqrt_nonneg a, CFC.sqrt_mul_sqrt_self a h⟩, ?_⟩
      rintro b ⟨hb, hba⟩
      exact (CFC.sqrt_unique hba hb).symm
- id: fa_cfc_algebra_rules
  kind: gap
  level: 4
  topic: $C^*$環・連続関数計算の計算則
  statement: $A$を単位的$C^*$環、$a$を正規元、$f,g$を$\sigma(a)$上連続な複素関数とする。連続関数計算$f\mapsto f(a)$について$(f+g)(a)=f(a)+g(a)$、$(fg)(a)=f(a)g(a)$、$\bar f(a)=f(a)^*$である。連続関数計算は単位的*準同型$C(\sigma(a))\to A$で恒等関数を$a$に送るものとして既習とする。
  statement_en: For a normal element a of a unital C*-algebra and functions f, g continuous on σ(a), the continuous functional calculus satisfies (f+g)(a) = f(a) + g(a), (fg)(a) = f(a)g(a) and f̄(a) = f(a)*. The calculus is taken as known as the unital *-homomorphism from C(σ(a)) to A sending the identity function to a.
  assumptions:
  - $A$は単位的$C^*$環、$a^*a=aa^*$
  - $f,g$は$\sigma(a)$上連続
  - 連続関数計算は単位的*準同型$C(\sigma(a))\to A$として既習
  quantifiers:
  - 任意の$A,a,f,g$
  conclusion: $(f+g)(a)=f(a)+g(a)$、$(fg)(a)=f(a)g(a)$、$\bar f(a)=f(a)^*$である。
  answer: |
    $A$を単位的$C^*$環、$a$を正規元、$f,g$を$\sigma(a)$上連続な関数とする。$\Phi:C(\sigma(a))\to A$を連続関数計算とする。$f(a)=\Phi(f|_{\sigma(a)})$である。

    $\Phi$は*準同型である。制限の写像は和、積、複素共役を保つので、$(f+g)|_{\sigma(a)}=f|_{\sigma(a)}+g|_{\sigma(a)}$などが成り立つ。$\Phi$を適用すると3つの式を得る。
  strategy: Each rule is the *-homomorphism property of the functional calculus after restricting to the spectrum.
  sketch:
  - 'translate: f(a) is Φ applied to the restriction of f to the spectrum.'
  - 'derive: Restriction preserves sums, products and conjugates.'
  - 'conclude: Φ is a *-homomorphism, which gives the three rules.'
  openmath: (forall (A a f g) (-> (and (cstar_algebra A) (in a A) (normal_element a) (continuous_on_set f (spectrum_of a)) (continuous_on_set g (spectrum_of a))) (and (= (cfc_apply (lambda (z) (+ (fn_value f z) (fn_value g z))) a) (+ (cfc_apply (lambda (z) (fn_value f z)) a) (cfc_apply (lambda (z) (fn_value g z)) a))) (= (cfc_apply (lambda (z) (* (fn_value f z) (fn_value g z))) a) (* (cfc_apply (lambda (z) (fn_value f z)) a) (cfc_apply (lambda (z) (fn_value g z)) a))) (= (cfc_apply (lambda (z) (conjugate (fn_value f z))) a) (star_element (cfc_apply (lambda (z) (fn_value f z)) a))))))
  hard_negative:
    statement: 正規でない元にも同じ連続関数計算が定まる。
    reason: $a=\begin{pmatrix}0&1\\0&0\end{pmatrix}$は$\sigma(a)=\{0\}$である。$C(\{0\})$は$1$次元なので、そこからの準同型の像には$a$が入らない。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] (a : A) (f g : ℂ → ℂ), star a * a = a * star a → ContinuousOn f (spectrum ℂ a) → ContinuousOn g (spectrum ℂ a) → cfc (fun z => f z + g z) a = cfc f a + cfc g a ∧ cfc (fun z => f z * g z) a = cfc f a * cfc g a ∧ cfc (fun z => star (f z)) a = star (cfc f a)
  proof: |
    by
      intro A _ a f g hN hf hg
      haveI : IsStarNormal a := ⟨hN⟩
      exact ⟨cfc_add a f g, cfc_mul f g a, cfc_star f a⟩
- id: fa_cfc_composition
  kind: gap
  level: 4
  topic: $C^*$環・連続関数計算の計算則
  statement: $A$を単位的$C^*$環、$a$を正規元、$f$を$\sigma(a)$上連続、$g$を$f(\sigma(a))$上連続な複素関数とする。$(g\circ f)(a)=g(f(a))$である。連続関数計算のスペクトル写像定理と一意性は既習とする。
  statement_en: For a normal element a of a unital C*-algebra, f continuous on σ(a) and g continuous on f(σ(a)), one has (g∘f)(a) = g(f(a)). The spectral mapping theorem and uniqueness of the functional calculus are taken as known.
  assumptions:
  - $A$は単位的$C^*$環、$a^*a=aa^*$
  - $f$は$\sigma(a)$上連続、$g$は$f(\sigma(a))$上連続
  - スペクトル写像定理と連続関数計算の一意性は既習
  quantifiers:
  - 任意の$A,a,f,g$
  conclusion: $(g\circ f)(a)=g(f(a))$である。
  answer: |
    $A$を単位的$C^*$環、$a$を正規元、$f,g$を上の関数とし、$b=f(a)$とする。$b$は正規であり、$\sigma(b)=f(\sigma(a))$である。

    $\Psi:C(\sigma(b))\to A$を$\Psi(h)=(h\circ f)(a)$で定める。$\Psi$は単位的*準同型であり、恒等関数$\mathrm{id}$について$\Psi(\mathrm{id})=f(a)=b$である。

    $\sigma(b)$上の連続関数の空間で、$z$と$\bar z$の多項式は一様稠密である（ストーン・ワイエルシュトラスの定理）。単位的*準同型は$z$と$\bar z$の多項式での値を$b$と$b^*$の多項式に定め、ノルムを増やさないので連続である。よって、恒等関数を$b$に送る単位的*準同型は一意である。したがって$\Psi(h)=h(b)$である。$h=g$として$(g\circ f)(a)=g(b)=g(f(a))$を得る。
  strategy: The map h ↦ (h∘f)(a) is a functional calculus for f(a), so uniqueness applies.
  sketch:
  - 'setup: Put b = f(a), normal with σ(b) = f(σ(a)).'
  - 'construct: Define Ψ(h) = (h∘f)(a), a unital *-homomorphism with Ψ(id) = b.'
  - 'apply_theorem: Stone-Weierstrass makes such a homomorphism unique.'
  - 'conclude: Hence Ψ(g) = g(b), which is the identity.'
  openmath: (forall (A a f g) (-> (and (cstar_algebra A) (in a A) (normal_element a) (continuous_on_set f (spectrum_of a)) (continuous_on_set g (image_of f (spectrum_of a)))) (= (cfc_apply (lambda (z) (fn_value g (fn_value f z))) a) (cfc_apply (lambda (w) (fn_value g w)) (cfc_apply (lambda (z) (fn_value f z)) a)))))
  hard_negative:
    statement: $(g\circ f)(a)=f(g(a))$である。
    reason: $A=\mathbb{C}$、$a=1$、$f(z)=z+1$、$g(z)=2z$では$(g\circ f)(a)=4$だが、$f(g(a))=3$である。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] (a : A) (f g : ℂ → ℂ), star a * a = a * star a → ContinuousOn f (spectrum ℂ a) → ContinuousOn g (f '' spectrum ℂ a) → cfc (g ∘ f) a = cfc g (cfc f a)
  proof: |
    by
      intro A _ a f g hN hf hg
      haveI : IsStarNormal a := ⟨hN⟩
      exact cfc_comp g f a
- id: fa_cfc_spectral_mapping
  kind: gap
  level: 4
  topic: $C^*$環・連続関数計算の計算則
  statement: 連続関数計算のスペクトル写像定理。$A$を単位的$C^*$環、$a$を正規元、$f$を$\sigma(a)$上連続な複素関数とする。$\sigma(f(a))=f(\sigma(a))$である。連続関数計算が単射な単位的*準同型であること、スペクトルの不変性は既習とする。
  statement_en: Spectral mapping for the continuous functional calculus. For a normal element a of a unital C*-algebra and f continuous on σ(a), σ(f(a)) = f(σ(a)). Injectivity of the calculus and spectral permanence are taken as known.
  assumptions:
  - $A$は単位的$C^*$環、$a^*a=aa^*$
  - $f$は$\sigma(a)$上連続
  - 連続関数計算の単射性とスペクトルの不変性は既習
  quantifiers:
  - 任意の$A,a,f$
  conclusion: $\sigma(f(a))=f(\sigma(a))$である。
  answer: |
    $A$を単位的$C^*$環、$a$を正規元、$f$を$\sigma(a)$上連続な関数、$X=\sigma(a)$とする。$\Phi:C(X)\to A$を連続関数計算とする。

    $\Phi$は単射な単位的*準同型なので等長であり、像$S$は$1$を含む閉*部分環である。$\Phi:C(X)\to S$は*同型なので、$\sigma_S(f(a))=\sigma_{C(X)}(f)$である。

    $C(X)$で$f-\lambda$が可逆であることは、$X$上で$f\neq\lambda$であることと同値である。実際、そのとき$1/(f-\lambda)$は連続である。よって$\sigma_{C(X)}(f)=f(X)$である。

    スペクトルの不変性より$\sigma_A(f(a))=\sigma_S(f(a))=f(X)$である。
  strategy: Transfer the computation to C(σ(a)) by the isomorphism onto a closed subalgebra and spectral permanence.
  sketch:
  - 'setup: The calculus Φ is an isometric *-isomorphism from C(σ(a)) onto a closed subalgebra S.'
  - 'derive: In C(X), the spectrum of f is its range f(X).'
  - 'apply_theorem: Spectral permanence gives the same spectrum in A.'
  - 'conclude: Hence σ(f(a)) = f(σ(a)).'
  openmath: (forall (A a f) (-> (and (cstar_algebra A) (in a A) (normal_element a) (continuous_on_set f (spectrum_of a))) (= (spectrum_of (cfc_apply (lambda (z) (fn_value f z)) a)) (image_of f (spectrum_of a)))))
  hard_negative:
    statement: 自己共役元$a,b$について$\sigma(a+b)=\sigma(a)+\sigma(b)$である。
    reason: $a=\mathrm{diag}(1,-1)$、$b=\begin{pmatrix}0&1\\1&0\end{pmatrix}$では$\sigma(a+b)=\{\pm\sqrt 2\}$だが、$\sigma(a)+\sigma(b)=\{-2,0,2\}$である。スペクトル写像定理は一つの元の関数についての命題である。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] (a : A) (f : ℂ → ℂ), star a * a = a * star a → ContinuousOn f (spectrum ℂ a) → spectrum ℂ (cfc f a) = f '' spectrum ℂ a
  proof: |
    by
      intro A _ a f hN hf
      haveI : IsStarNormal a := ⟨hN⟩
      exact cfc_map_spectrum f a
- id: fa_cfc_norm_le_iff_sup_on_spectrum
  kind: gap
  level: 4
  topic: $C^*$環・連続関数計算の計算則
  statement: $A$を単位的$C^*$環、$a$を正規元、$f$を$\sigma(a)$上連続な複素関数、$c\geq 0$とする。$\|f(a)\|\leq c$であることと、全ての$z\in\sigma(a)$で$|f(z)|\leq c$であることは同値である。連続関数計算のスペクトル写像定理は既習とする。
  statement_en: For a normal element a of a unital C*-algebra, f continuous on σ(a) and c ≥ 0, ‖f(a)‖ ≤ c if and only if |f(z)| ≤ c for all z in σ(a). The spectral mapping theorem for the calculus is taken as known.
  assumptions:
  - $A$は単位的$C^*$環、$a^*a=aa^*$
  - $f$は$\sigma(a)$上連続、$c\geq 0$
  - スペクトル写像定理は既習
  quantifiers:
  - 任意の$A,a,f,c$
  conclusion: $\|f(a)\|\leq c$と、全ての$z\in\sigma(a)$で$|f(z)|\leq c$であることは同値である。
  answer: |
    $A$を単位的$C^*$環、$a$を正規元、$f$を$\sigma(a)$上連続な関数、$c\geq 0$とする。

    連続関数計算$\Phi:C(\sigma(a))\to A$は*準同型で$C(\sigma(a))$は可換なので、$b=f(a)=\Phi(f|_{\sigma(a)})$は正規である。正規元のノルムはスペクトル半径なので$\|b\|=\sup\{|w|:w\in\sigma(b)\}$である。スペクトル写像定理より$\sigma(b)=f(\sigma(a))$なので$\|f(a)\|=\sup_{z\in\sigma(a)}|f(z)|$である。

    この等式から、$\|f(a)\|\leq c$であることと全ての$z\in\sigma(a)$で$|f(z)|\leq c$であることは同値である。
  strategy: The norm of the normal element f(a) is its spectral radius, computed by spectral mapping.
  sketch:
  - 'derive: f(a) is normal, so its norm is its spectral radius.'
  - 'apply_theorem: Spectral mapping gives σ(f(a)) = f(σ(a)).'
  - 'conclude: ‖f(a)‖ is the supremum of |f| on σ(a), which gives the equivalence.'
  openmath: (forall (A a f c) (-> (and (cstar_algebra A) (in a A) (normal_element a) (continuous_on_set f (spectrum_of a)) (>= c 0)) (<-> (<= (norm (cfc_apply (lambda (z) (fn_value f z)) a)) c) (forall (z) (-> (in z (spectrum_of a)) (<= (abs (fn_value f z)) c))))))
  hard_negative:
    statement: 正規でない元でも$\|a\|=\sup_{z\in\sigma(a)}|z|$である。
    reason: $a=\begin{pmatrix}0&1\\0&0\end{pmatrix}$では$\|a\|=1$だが、$\sigma(a)=\{0\}$である。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] (a : A) (f : ℂ → ℂ) (c : ℝ), star a * a = a * star a → ContinuousOn f (spectrum ℂ a) → 0 ≤ c → (‖cfc f a‖ ≤ c ↔ ∀ z ∈ spectrum ℂ a, ‖f z‖ ≤ c)
  proof: |
    by
      intro A _ a f c hN hf hc
      haveI : IsStarNormal a := ⟨hN⟩
      exact norm_cfc_le_iff f a hc
- id: fa_cfc_nonneg_iff_nonneg_on_spectrum
  kind: gap
  level: 4
  topic: $C^*$環・連続関数計算の計算則
  statement: $A$を単位的$C^*$環（順序は$b^*b$の有限和で定まる）、$a$を自己共役元、$f$を$\sigma(a)$上連続な実関数とする。$0\leq f(a)$であることと、全ての$x\in\sigma(a)$で$f(x)\geq 0$であることは同値である。正元のスペクトルによる特徴づけとスペクトル写像定理は既習とする。
  statement_en: For a self-adjoint element a of a unital C*-algebra, ordered by finite sums of b*b, and a real function f continuous on σ(a), 0 ≤ f(a) if and only if f(x) ≥ 0 for all x in σ(a). The spectral characterization of positivity and the spectral mapping theorem are taken as known.
  assumptions:
  - $A$は単位的$C^*$環で順序は$b^*b$の有限和で定まる
  - $a^*=a$
  - $f$は$\sigma(a)$上連続な実関数
  - 正元の特徴づけとスペクトル写像定理は既習
  quantifiers:
  - 任意の$A,a,f$
  conclusion: $0\leq f(a)$と、$\sigma(a)$上$f\geq 0$であることは同値である。
  answer: |
    $A$を単位的$C^*$環、$a$を自己共役元、$f$を$\sigma(a)$上連続な実関数とする。

    $\bar f=f$なので$f(a)^*=f(a)$であり、$f(a)$は自己共役である。スペクトル写像定理より$\sigma(f(a))=f(\sigma(a))$である。

    正元の特徴づけより、$0\leq f(a)$であることは$\sigma(f(a))\subset[0,\infty)$と同値である。これは$f(\sigma(a))\subset[0,\infty)$、すなわち全ての$x\in\sigma(a)$で$f(x)\geq 0$であることに等しい。
  strategy: f(a) is self-adjoint and its spectrum is f(σ(a)), so the spectral criterion applies.
  sketch:
  - 'derive: A real f gives a self-adjoint element f(a).'
  - 'apply_theorem: Spectral mapping gives σ(f(a)) = f(σ(a)).'
  - 'conclude: The spectral characterization of positivity gives the equivalence.'
  openmath: (forall (A a f) (-> (and (cstar_algebra A) (star_ordered A) (in a A) (= (star_element a) a) (continuous_on_set f (spectrum_of a))) (<-> (nonneg_element (cfc_apply (lambda (x) (fn_value f x)) a)) (forall (x) (-> (in x (spectrum_of a)) (>= (fn_value f x) 0))))))
  hard_negative:
    statement: $0\leq f(a)$なら$\mathbb{R}$全体で$f\geq 0$である。
    reason: $A=\mathbb{C}$、$a=1$、$f(x)=x$では$f(a)=1\geq 0$だが、$f(-1)=-1<0$である。効くのは$\sigma(a)$上の値だけである。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] [PartialOrder A] [StarOrderedRing A] (a : A) (f : ℝ → ℝ), star a = a → ContinuousOn f (spectrum ℝ a) → (0 ≤ cfc f a ↔ ∀ x ∈ spectrum ℝ a, 0 ≤ f x)
  proof: |
    by
      intro A _ _ _ a f h hf
      have ha : IsSelfAdjoint a := h
      exact cfc_nonneg_iff f a
- id: fa_gelfand_transform_isometric_star_bijection
  kind: named
  level: 4
  topic: $C^*$環・ゲルファント変換
  statement: ゲルファント・ナイマルクの定理（可換の場合）。$A$を可換な単位的$C^*$環、$X$を指標空間とする。ゲルファント変換$\Gamma:A\to C(X)$、$\Gamma(a)(\varphi)=\varphi(a)$は等長全単射で、$\Gamma(a^*)=\overline{\Gamma(a)}$である。指標とスペクトルの関係、$\rho(a)=\|a\|$（正規元）、ストーン・ワイエルシュトラスの定理は既習とする。
  statement_en: Gelfand-Naimark theorem, commutative case. For a commutative unital C*-algebra A with character space X, the Gelfand transform Γ from A to C(X) is an isometric bijection and Γ(a*) is the conjugate of Γ(a). The relation of characters to the spectrum, ρ(a) = ‖a‖ for normal elements, and the Stone-Weierstrass theorem are taken as known.
  assumptions:
  - $A$は可換な単位的$C^*$環
  - $X$は指標空間
  - 指標とスペクトルの関係、正規元の$\rho(a)=\|a\|$、ストーン・ワイエルシュトラスの定理は既習
  quantifiers:
  - 任意の$A$
  conclusion: $\Gamma$は等長全単射で$\Gamma(a^*)=\overline{\Gamma(a)}$である。
  answer: |
    $A$を可換な単位的$C^*$環、$X$を指標空間、$\Gamma$をゲルファント変換とする。

    $\sigma(a)=\{\varphi(a):\varphi\in X\}$なので$\|\Gamma(a)\|_\infty=\rho(a)$である。$A$は可換なので$a$は正規であり、$\rho(a)=\|a\|$である。よって$\Gamma$は等長であり、単射である。

    自己共役元$h$と$\varphi\in X$について、$\varphi(h)\in\sigma(h)\subset\mathbb{R}$である。$a=x+iy$（$x,y$は自己共役）と分解すると、$\varphi(a^*)=\varphi(x)-i\varphi(y)=\overline{\varphi(a)}$である。よって$\Gamma(a^*)=\overline{\Gamma(a)}$である。

    像$\Gamma(A)$は$C(X)$の単位的*部分環である。$\Gamma$は等長で$A$は完備なので、像は閉である。像は$X$の点を分離する（指標は$A$上の値で区別される）。ストーン・ワイエルシュトラスの定理より$\Gamma(A)=C(X)$である。
  strategy: The norm is the spectral radius, characters respect the involution, and Stone-Weierstrass gives surjectivity.
  sketch:
  - 'derive: ‖Γ(a)‖∞ = ρ(a) = ‖a‖ by normality, so Γ is isometric.'
  - 'derive: Characters take real values on self-adjoint elements, so Γ preserves the involution.'
  - 'derive: The image is a closed unital *-subalgebra separating points.'
  - 'apply_theorem: Stone-Weierstrass gives surjectivity.'
  openmath: (forall (A) (-> (comm_cstar_algebra A) (and (isometric_map (gelfand_transform A)) (bijective_on (gelfand_transform A) A (continuous_functions_on (character_space A))) (forall (a) (-> (in a A) (= (fn_value (gelfand_transform A) (star_element a)) (function_conj (fn_value (gelfand_transform A) a))))))))
  hard_negative:
    statement: 可換でない単位的$C^*$環も$C(X)$と*同型である。
    reason: $M_2(\mathbb{C})$は可換でないので、可換な$C(X)$と同型にならない。
  target: |
    ∀ (A : Type*) [CommCStarAlgebra A], Isometry (WeakDual.gelfandTransform ℂ A) ∧ Function.Bijective (WeakDual.gelfandTransform ℂ A) ∧ ∀ a : A, WeakDual.gelfandTransform ℂ A (star a) = star (WeakDual.gelfandTransform ℂ A a)
  proof: |
    by
      intro A _
      exact ⟨gelfandTransform_isometry A, gelfandTransform_bijective A, gelfandTransform_map_star⟩
- id: fa_commutative_spectrum_via_characters
  kind: textbook
  level: 4
  topic: $C^*$環・ゲルファント変換
  statement: $A$を可換な複素バナッハ環（単位的）、$a\in A$、$z\in\mathbb{C}$とする。$z\in\sigma(a)$であることと、ある指標$\varphi$で$\varphi(a)=z$であることは同値である。ここで指標は$0$でない連続な乗法的線形汎関数である。ゲルファント・マズールの定理と極大イデアルの存在は既習とする。
  statement_en: For a commutative unital complex Banach algebra A, a in A and z in ℂ, z is in the spectrum of a if and only if φ(a) = z for some character φ, a nonzero continuous multiplicative linear functional. The Gelfand-Mazur theorem and existence of maximal ideals are taken as known.
  assumptions:
  - $A$は可換な単位的複素バナッハ環
  - $a\in A$、$z\in\mathbb{C}$
  - ゲルファント・マズールの定理と極大イデアルの存在は既習
  quantifiers:
  - 任意の$A,a,z$
  conclusion: $z\in\sigma(a)$と、ある指標$\varphi$で$\varphi(a)=z$であることは同値である。
  answer: |
    $A$を可換な単位的複素バナッハ環、$a\in A$、$z\in\mathbb{C}$とする。

    $\varphi$を指標とし$\varphi(a)=z$とする。$\varphi$は$0$でなく乗法的なので$\varphi(1)=1$である。$\varphi(z-a)=0$である。$z-a$が可逆なら$1=\varphi((z-a)(z-a)^{-1})=0$となり矛盾するので、$z\in\sigma(a)$である。

    逆に$z\in\sigma(a)$とする。$z-a$は可逆でないので、それを含む極大イデアル$M$がある。可逆元の集合は開なので$\overline{M}$は真のイデアルであり、極大性から$M$は閉である。$A/M$は商ノルムについてバナッハ環で体である。$\|1\|\neq 1$のときは、左乗法の作用素ノルムという同値なノルムに取り替えて$\|1\|=1$とする。ゲルファント・マズールの定理より$A/M$は$\mathbb{C}$と同型である。$\varphi:A\to A/M\cong\mathbb{C}$は連続な指標であり、$\varphi(z-a)=0$なので$\varphi(a)=z$である。
  strategy: A character cannot send an invertible element to 0; conversely pass to a maximal ideal and apply Gelfand-Mazur.
  sketch:
  - 'derive: If φ(a) = z then φ(z-a) = 0, so z-a is not invertible.'
  - 'construct: Otherwise take a maximal ideal M containing z-a; it is closed.'
  - 'apply_theorem: A/M is a Banach field, hence ℂ by Gelfand-Mazur.'
  - 'conclude: The quotient map is a character with φ(a) = z.'
  openmath: (forall (A a z) (-> (and (complex_banach_algebra A) (comm_algebra A) (in a A)) (<-> (in z (spectrum_of a)) (exists (f) (and (character_of f A) (= (fn_value f a) z))))))
  hard_negative:
    statement: 可換でないバナッハ環でも、スペクトルは指標の値で尽くされる。
    reason: $M_2(\mathbb{C})$には指標が存在しない（$M_2(\mathbb{C})$は単純で$1$次元でない）。一方スペクトルは空でない。
  target: |
    ∀ (A : Type*) [NormedCommRing A] [NormedAlgebra ℂ A] [CompleteSpace A] (a : A) (z : ℂ), z ∈ spectrum ℂ a ↔ ∃ φ : WeakDual.characterSpace ℂ A, φ a = z
  proof: |
    by
      intro A _ _ _ a z
      exact WeakDual.CharacterSpace.mem_spectrum_iff_exists
- id: fa_gns_vector_state
  kind: named
  level: 4
  topic: $C^*$環・$\mathrm{GNS}$構成
  statement: $\mathrm{GNS}$構成。$A$を単位的$C^*$環、$f$を正の線形汎関数とする。$A$に半内積$\langle a,b\rangle_f=f(a^*b)$を入れて完備化したヒルベルト空間を$H_f$、$a$による左乗法から定まる表現を$\pi_f:A\to B(H_f)$、$1$の像を$\xi_f$とする。全ての$a$で$f(a)=\langle\xi_f,\pi_f(a)\xi_f\rangle$である。正元の順序の性質は既習とする。
  statement_en: GNS construction. Let f be a positive linear functional on a unital C*-algebra A, H_f the Hilbert space completing A with the semi-inner product f(a*b), π_f the representation by left multiplication and ξ_f the image of 1. Then f(a) = ⟨ξ_f, π_f(a)ξ_f⟩ for all a. Properties of the order on positive elements are taken as known.
  assumptions:
  - $A$は単位的$C^*$環、$f$は正の線形汎関数
  - $H_f$は半内積$f(a^*b)$の完備化
  - $\pi_f$は左乗法から定まる表現、$\xi_f$は$1$の像
  - 正元の順序の性質は既習
  quantifiers:
  - 任意の$A,f,a$
  conclusion: $f(a)=\langle\xi_f,\pi_f(a)\xi_f\rangle$である。
  answer: |
    $A$を単位的$C^*$環、$f$を正の線形汎関数とする。$\langle a,b\rangle_f=f(a^*b)$は$f$の正値性から半内積である。

    左乗法$L_a(b)=ab$は有界である。実際、$a^*a\leq\|a\|^2$より$b^*a^*ab\leq\|a\|^2b^*b$なので、$\|ab\|_f^2=f(b^*a^*ab)\leq\|a\|^2\|b\|_f^2$である。よって$L_a$は完備化$H_f$上の有界作用素$\pi_f(a)$に拡張され、$\pi_f$は単位的*準同型である。

    $\xi_f$を$1\in A$の像とする。$\pi_f(a)\xi_f$は$a\cdot 1=a$の像なので、
    $\langle\xi_f,\pi_f(a)\xi_f\rangle=\langle 1,a\rangle_f=f(1^*a)=f(a)$
    である。
  strategy: Left multiplication is bounded for the semi-inner product, and the state is recovered at the image of 1.
  sketch:
  - 'setup: f(a*b) is a semi-inner product by positivity.'
  - 'derive: b*a*ab ≤ ‖a‖²b*b makes left multiplication bounded, so it extends to the completion.'
  - 'conclude: ⟨ξ,π(a)ξ⟩ = f(1*a) = f(a).'
  openmath: (forall (A f a) (-> (and (cstar_algebra A) (star_ordered A) (positive_functional f A) (in a A)) (= (fn_value f a) (inner_product (gns_cyclic_vector f) (fn_value (fn_value (gns_representation f) a) (gns_cyclic_vector f))))))
  hard_negative:
    statement: 任意の線形汎関数$f$について同じ構成で$f(a)=\langle\xi,\pi(a)\xi\rangle$が得られる。
    reason: $A=\mathbb{C}$、$f(a)=-a$では$f(a^*a)=-|a|^2<0$なので半内積にならない。実際$\langle\xi,\pi(1)\xi\rangle=\|\xi\|^2\geq 0$だが$f(1)=-1$である。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] [PartialOrder A] [StarOrderedRing A] (f : @PositiveLinearMap ℂ A ℂ _ _ _ _ Complex.partialOrder _ _) (a : A), f a = inner ℂ ((f.toPreGNS 1 : f.PreGNS) : f.GNS) (f.gnsStarAlgHom a ((f.toPreGNS 1 : f.PreGNS) : f.GNS))
  proof: |
    by
      intro A _ _ _ f a
      change f a = inner ℂ _ (f.gnsNonUnitalStarAlgHom a _)
      rw [PositiveLinearMap.gnsNonUnitalStarAlgHom_apply_coe, UniformSpace.Completion.inner_coe]
      simp [PositiveLinearMap.preGNS_inner_def, PositiveLinearMap.leftMulMapPreGNS]
- id: fa_fuglede_putnam_rosenblum
  kind: named
  level: 4
  topic: $C^*$環・Fuglede の定理
  statement: Fuglede–Putnam–Rosenblum の定理。$A$を単位的$C^*$環、$a,b$を正規元、$x\in A$とする。$xa=bx$ならば$xa^*=b^*x$である。特に$b=a$とすると、$a$と可換な元は$a^*$とも可換である。リウヴィルの定理は既習とする。
  statement_en: Fuglede-Putnam-Rosenblum theorem. If a, b are normal elements of a unital C*-algebra and xa = bx, then xa* = b*x. In particular an element commuting with a normal a also commutes with a*. Liouville's theorem is taken as known.
  assumptions:
  - $A$は単位的$C^*$環
  - $a,b$は正規元
  - $xa=bx$
  - リウヴィルの定理は既習
  quantifiers:
  - 任意の$A,a,b,x$
  conclusion: $xa^*=b^*x$である。
  answer: |
    $A$を単位的$C^*$環、$a,b$を正規元、$xa=bx$とする。帰納法で$xa^n=b^nx$なので、全ての$w\in\mathbb{C}$で$xe^{wa}=e^{wb}x$、すなわち$x=e^{wb}xe^{-wa}$である。

    $z\in\mathbb{C}$に対し$F(z)=e^{zb^*}xe^{-za^*}$と定める。$F$は$A$値の整関数である。$w=-\bar z$とおいて上の式を代入し、$b,b^*$の可換性と$a,a^*$の可換性を使うと
    $F(z)=e^{zb^*}e^{-\bar zb}\,x\,e^{\bar za}e^{-za^*}=e^{zb^*-\bar zb}\,x\,e^{\bar za-za^*}$
    である。

    $zb^*-\bar zb$と$\bar za-za^*$は歪自己共役なので、その指数はユニタリである。ユニタリ元を掛けてもノルムは変わらないので$\|F(z)\|=\|x\|$である。有界な整関数は定数なので（リウヴィルの定理）$F(z)=F(0)=x$である。

    $z=0$で微分すると$b^*x-xa^*=0$である。
  strategy: Rosenblum's argument. A bounded entire function built from exponentials of skew-adjoint elements is constant.
  sketch:
  - 'derive: xa = bx gives x = e^(wb) x e^(-wa) for all w.'
  - 'construct: Define the entire function F(z) = e^(zb*) x e^(-za*).'
  - 'derive: Substituting w = -z̄ and using normality gives skew-adjoint exponents on both sides.'
  - 'derive: Those exponentials are unitary, so ‖F(z)‖ = ‖x‖.'
  - 'apply_theorem: Liouville gives F constant.'
  - 'conclude: Differentiating at 0 yields b*x = xa*.'
  openmath: (forall (A a b x) (-> (and (cstar_algebra A) (in a A) (in b A) (in x A) (normal_element a) (normal_element b) (= (* x a) (* b x))) (= (* x (star_element a)) (* (star_element b) x))))
  hard_negative:
    statement: 正規でない$a$でも$xa=ax$なら$xa^*=a^*x$である。
    reason: $a=\begin{pmatrix}0&1\\0&0\end{pmatrix}$、$x=a$とすると$xa=ax$だが、$xa^*=\mathrm{diag}(1,0)$、$a^*x=\mathrm{diag}(0,1)$である。
  target: |
    ∀ (A : Type*) [CStarAlgebra A] (a b x : A), star a * a = a * star a → star b * b = b * star b → x * a = b * x → x * star a = star b * x
  proof: |
    by
      intro A _ a b x ha hb h
      exact SemiconjBy.star_right (A := A) ⟨ha⟩ ⟨hb⟩ h
- id: fa_holder_integrable_product_bound
  kind: gap
  level: 3
  topic: $L^p$空間・ヘルダーの不等式
  statement: 符号つき関数に使える形のヘルダーの不等式。$\mu$を測度、$p,q>1$を$1/p+1/q=1$を満たす実数、$f\in L^p(\mu)$、$g\in L^q(\mu)$を実数値関数とする。$fg$は可積分であり、$|\int fg\,d\mu|\leq(\int|f|^p\,d\mu)^{1/p}(\int|g|^q\,d\mu)^{1/q}$である。非負関数の場合のヘルダーの不等式は既習とする。
  statement_en: Hölder inequality for signed functions. For real f in L^p(μ) and g in L^q(μ) with p, q > 1 and 1/p + 1/q = 1, fg is integrable and |∫fg dμ| ≤ (∫|f|^p dμ)^(1/p) (∫|g|^q dμ)^(1/q). The nonnegative case is taken as known.
  assumptions:
  - $\mu$は測度
  - $p,q>1$、$1/p+1/q=1$
  - $f\in L^p(\mu)$、$g\in L^q(\mu)$は実数値
  - 非負関数のヘルダーの不等式は既習
  quantifiers:
  - 任意の$\mu,p,q,f,g$
  conclusion: $fg$は可積分で、$|\int fg\,d\mu|\leq(\int|f|^p\,d\mu)^{1/p}(\int|g|^q\,d\mu)^{1/q}$である。
  answer: |
    $\mu$を測度、$p,q>1$を$1/p+1/q=1$を満たす実数、$f\in L^p(\mu)$、$g\in L^q(\mu)$とする。

    非負関数のヘルダーの不等式を$|f|,|g|$に適用すると
    $\int|f||g|\,d\mu\leq\left(\int|f|^p\,d\mu\right)^{1/p}\left(\int|g|^q\,d\mu\right)^{1/q}<\infty$
    である。$fg$は$f,g$の可測性からほとんど至る所強可測なので、可積分である。

    $|\int fg\,d\mu|\leq\int|fg|\,d\mu=\int|f||g|\,d\mu$と合わせて結論を得る。
  strategy: Apply the nonnegative Hölder inequality to |f| and |g| and use the triangle inequality for integrals.
  sketch:
  - 'apply_theorem: Hölder for |f| and |g| bounds ∫|f||g| by the finite product.'
  - 'derive: Measurability and the bound make fg integrable.'
  - 'conclude: The triangle inequality for integrals gives the estimate.'
  openmath: (forall (mu f g p q) (-> (and (is_measure mu) (> p 1) (> q 1) (= (+ (/ 1 p) (/ 1 q)) 1) (mem_lp f p mu) (mem_lp g q mu)) (and (integrable_fn (fn_smul f g) mu) (<= (abs (integral_wrt (lambda (a) (* (fn_value f a) (fn_value g a))) mu)) (* (^ (integral_wrt (lambda (a) (^ (abs (fn_value f a)) p)) mu) (/ 1 p)) (^ (integral_wrt (lambda (a) (^ (abs (fn_value g a)) q)) mu) (/ 1 q)))))))
  hard_negative:
    statement: $f,g\in L^p(\mu)$なら$fg\in L^1(\mu)$である。
    reason: $\mu$を$(0,1)$上のルベーグ測度、$p=3/2$、$f=g=x^{-1/2}$とする。$\int f^{3/2}\,dx=\int x^{-3/4}\,dx<\infty$だが、$\int fg\,dx=\int x^{-1}\,dx=\infty$である。
  target: |
    ∀ (α : Type*) [MeasurableSpace α] (μ : MeasureTheory.Measure α) (f g : α → ℝ) (p q : ℝ), p.HolderConjugate q → MeasureTheory.MemLp f (ENNReal.ofReal p) μ → MeasureTheory.MemLp g (ENNReal.ofReal q) μ → MeasureTheory.Integrable (fun a => f a * g a) μ ∧ |∫ a, f a * g a ∂μ| ≤ (∫ a, |f a| ^ p ∂μ) ^ (1 / p) * (∫ a, |g a| ^ q ∂μ) ^ (1 / q)
  proof: |
    by
      intro α _ μ f g p q hpq hf hg
      haveI : (ENNReal.ofReal p).HolderTriple (ENNReal.ofReal q) 1 := by
        refine ⟨?_⟩
        have hp := hpq.pos
        have hq := hpq.symm.pos
        rw [← ENNReal.ofReal_inv_of_pos hp, ← ENNReal.ofReal_inv_of_pos hq, ← ENNReal.ofReal_add (by positivity) (by positivity), hpq.inv_add_inv_eq_inv]
        simp
      have h1 : MeasureTheory.Integrable (f * g) μ := hf.integrable_mul hg
      refine ⟨h1, ?_⟩
      have h2 := MeasureTheory.integral_mul_norm_le_Lp_mul_Lq (μ := μ) hpq hf hg
      simp only [Real.norm_eq_abs] at h2
      calc |∫ a, f a * g a ∂μ| ≤ ∫ a, |f a * g a| ∂μ := MeasureTheory.abs_integral_le_integral_abs
        _ = ∫ a, |f a| * |g a| ∂μ := by simp_rw [abs_mul]
        _ ≤ _ := h2
- id: fa_holder_general_exponents
  kind: gap
  level: 3
  topic: $L^p$空間・ヘルダーの不等式
  statement: 一般の指数のヘルダーの不等式。$\mu$を測度、$p,q,r\in(0,\infty]$を$1/p+1/q=1/r$を満たす指数、$\varphi$を実数値、$f$を実ノルム空間に値をとる（ほとんど至る所強）可測関数とする。$\|\varphi f\|_r\leq\|\varphi\|_p\|f\|_q$である。両辺は$[0,\infty]$の値をとり、$1/\infty=0$、$0\cdot\infty=0$とする。$r=1$の場合が通常のヘルダーの不等式である。$r=1$の非負関数のヘルダーの不等式は既習とする。
  statement_en: Hölder inequality with general exponents. For exponents p, q, r in (0,∞] with 1/p + 1/q = 1/r, a real function φ and a function f with values in a real normed space, both a.e. strongly measurable, ‖φf‖_r ≤ ‖φ‖_p ‖f‖_q in [0,∞], with 0·∞ = 0. The usual Hölder inequality is the case r = 1. The case r = 1 for nonnegative functions is taken as known.
  assumptions:
  - $\mu$は測度
  - $p,q,r\in(0,\infty]$、$1/p+1/q=1/r$（$1/\infty=0$、$0\cdot\infty=0$）
  - $\varphi$は実数値、$f$は実ノルム空間値で、どちらもほとんど至る所強可測
  - $r=1$の非負関数のヘルダーの不等式は既習
  quantifiers:
  - 任意の$\mu,\varphi,f,p,q,r$
  conclusion: $\|\varphi f\|_r\leq\|\varphi\|_p\|f\|_q$である。
  answer: |
    $\mu$を測度、$p,q,r\in(0,\infty]$、$1/p+1/q=1/r$とし、$\varphi,f$を可測とする。$\|\varphi f\|=|\varphi|\|f\|$である。$\|\varphi\|_p$か$\|f\|_q$が$0$なら、その関数はほとんど至る所$0$なので左辺も$0$である。以下ではどちらも$0$でないとする。

    $p=\infty$のとき$r=q$である。ほとんど至る所$|\varphi|\leq\|\varphi\|_\infty$なので、$\|\varphi f\|_q\leq\|\varphi\|_\infty\|f\|_q$である。$q=\infty$のときも同様である。

    $p,q<\infty$のとき$r<\infty$である。$P=p/r$、$Q=q/r$とおくと$P,Q>1$、$1/P+1/Q=1$である。$r=1$のヘルダーの不等式を$|\varphi|^r,\|f\|^r$に適用すると
    $\int|\varphi|^r\|f\|^r\,d\mu\leq\left(\int|\varphi|^p\,d\mu\right)^{r/p}\left(\int\|f\|^q\,d\mu\right)^{r/q}$
    である。$1/r$乗して結論を得る。
  strategy: Reduce to the classical case r = 1 with exponents p/r and q/r, treating infinite exponents directly.
  sketch:
  - 'case_split: If p or q is infinite, bound by the essential supremum.'
  - 'translate: Otherwise set P = p/r and Q = q/r, which are conjugate.'
  - 'apply_theorem: Classical Hölder applies to |φ|^r and ‖f‖^r.'
  - 'conclude: Taking r-th roots gives the inequality.'
  openmath: (forall (mu phi f p q r) (-> (and (is_measure mu) (holder_exponents p q r) (ae_measurable_fn phi mu) (ae_measurable_fn f mu)) (<= (lp_norm (fn_smul phi f) r mu) (* (lp_norm phi p mu) (lp_norm f q mu)))))
  hard_negative:
    statement: 指数の関係なしに$\|\varphi f\|_1\leq\|\varphi\|_2\|f\|_3$である。
    reason: $\mu$を$\mathbb{R}$上のルベーグ測度、$\varphi=f=1_{[0,R]}$とすると、左辺は$R$、右辺は$R^{1/2}R^{1/3}=R^{5/6}$である。$R>1$で不等式は成り立たない。
  target: |
    ∀ (α E : Type*) [MeasurableSpace α] [NormedAddCommGroup E] (μ : MeasureTheory.Measure α) (φ : α → ℝ) (f : α → E) [NormedSpace ℝ E] (p q r : ENNReal) [p.HolderTriple q r], p ≠ 0 → q ≠ 0 → MeasureTheory.AEStronglyMeasurable φ μ → MeasureTheory.AEStronglyMeasurable f μ → MeasureTheory.eLpNorm (fun x => φ x • f x) r μ ≤ MeasureTheory.eLpNorm φ p μ * MeasureTheory.eLpNorm f q μ
  proof: |
    by
      intro α E _ _ μ φ f _ p q r _ _ _ hφ hf
      exact MeasureTheory.eLpNorm_smul_le_mul_eLpNorm hf hφ
- id: fa_minkowski_integral_form
  kind: gap
  level: 3
  topic: $L^p$空間・ミンコフスキーの不等式
  statement: 実数の積分で書いたミンコフスキーの不等式。$\mu$を測度、$p\geq 1$を実数、$f,g\in L^p(\mu)$を実数値とする。$(\int|f+g|^p\,d\mu)^{1/p}\leq(\int|f|^p\,d\mu)^{1/p}+(\int|g|^p\,d\mu)^{1/p}$である。$L^p$ノルムの三角不等式を、実数値の積分の式にした形である。ヘルダーの不等式は既習とする。
  statement_en: Minkowski inequality in terms of real integrals. For real p ≥ 1 and real f, g in L^p(μ), (∫|f+g|^p dμ)^(1/p) ≤ (∫|f|^p dμ)^(1/p) + (∫|g|^p dμ)^(1/p). This restates the triangle inequality for the L^p norm with real-valued integrals. Hölder's inequality is taken as known.
  assumptions:
  - $\mu$は測度
  - $p\geq 1$は実数
  - $f,g\in L^p(\mu)$は実数値
  - ヘルダーの不等式は既習
  quantifiers:
  - 任意の$\mu,p,f,g$
  conclusion: $(\int|f+g|^p\,d\mu)^{1/p}\leq(\int|f|^p\,d\mu)^{1/p}+(\int|g|^p\,d\mu)^{1/p}$である。
  answer: |
    $\mu$を測度、$p\geq 1$、$f,g\in L^p(\mu)$とする。

    $p=1$なら$|f+g|\leq|f|+|g|$を積分すればよい。$p>1$とする。$t\mapsto t^p$の凸性から$|f+g|^p\leq 2^{p-1}(|f|^p+|g|^p)$なので、$I=\int|f+g|^p\,d\mu<\infty$である。$I=0$なら結論は明らかなので$I>0$とする。

    $q=p/(p-1)$とおく。$|f+g|^p\leq|f||f+g|^{p-1}+|g||f+g|^{p-1}$であり、$|f+g|^{(p-1)q}=|f+g|^p$である。ヘルダーの不等式より
    $I\leq\left(\left(\int|f|^p\,d\mu\right)^{1/p}+\left(\int|g|^p\,d\mu\right)^{1/p}\right)I^{1/q}$
    である。$I^{1/q}$で割ると、$1-1/q=1/p$より結論を得る。
  strategy: Split |f+g|^p and apply Hölder to each piece with the conjugate exponent.
  sketch:
  - 'case_split: The case p = 1 is the pointwise triangle inequality.'
  - 'derive: Convexity gives finiteness of I = ∫|f+g|^p.'
  - 'derive: Split |f+g|^p ≤ |f||f+g|^(p-1) + |g||f+g|^(p-1).'
  - 'apply_theorem: Hölder bounds each term by a norm times I^(1/q).'
  - 'conclude: Dividing by I^(1/q) gives the inequality.'
  openmath: (forall (mu f g p) (-> (and (is_measure mu) (>= p 1) (mem_lp f p mu) (mem_lp g p mu)) (<= (^ (integral_wrt (lambda (a) (^ (abs (+ (fn_value f a) (fn_value g a))) p)) mu) (/ 1 p)) (+ (^ (integral_wrt (lambda (a) (^ (abs (fn_value f a)) p)) mu) (/ 1 p)) (^ (integral_wrt (lambda (a) (^ (abs (fn_value g a)) p)) mu) (/ 1 p))))))
  hard_negative:
    statement: $0<p<1$でも同じ不等式が成り立つ。
    reason: $\mu$を$\{1,2\}$上の数え上げ測度、$p=1/2$、$f=1_{\{1\}}$、$g=1_{\{2\}}$とすると、左辺は$(1+1)^2=4$、右辺は$1+1=2$である。
  target: |
    ∀ (α : Type*) [MeasurableSpace α] (μ : MeasureTheory.Measure α) (f g : α → ℝ) (p : ℝ), 1 ≤ p → MeasureTheory.MemLp f (ENNReal.ofReal p) μ → MeasureTheory.MemLp g (ENNReal.ofReal p) μ → (∫ a, |f a + g a| ^ p ∂μ) ^ (1 / p) ≤ (∫ a, |f a| ^ p ∂μ) ^ (1 / p) + (∫ a, |g a| ^ p ∂μ) ^ (1 / p)
  proof: |
    by
      intro α _ μ f g p hp hf hg
      have hp0 : 0 < p := by linarith
      have h0 : ENNReal.ofReal p ≠ 0 := by simpa using hp0
      have ht : ENNReal.ofReal p ≠ ⊤ := ENNReal.ofReal_ne_top
      have hr : (ENNReal.ofReal p).toReal = p := ENNReal.toReal_ofReal hp0.le
      have e : ∀ u : α → ℝ, MeasureTheory.MemLp u (ENNReal.ofReal p) μ → MeasureTheory.eLpNorm u (ENNReal.ofReal p) μ = ENNReal.ofReal ((∫ a, |u a| ^ p ∂μ) ^ (1 / p)) := by
        intro u hu
        have := hu.eLpNorm_eq_integral_rpow_norm h0 ht
        simpa [hr, one_div] using this
      have h1 := MeasureTheory.eLpNorm_add_le hf.1 hg.1 (p := ENNReal.ofReal p) (by simpa using hp)
      have hfg : MeasureTheory.MemLp (f + g) (ENNReal.ofReal p) μ := hf.add hg
      rw [e _ hfg, e _ hf, e _ hg] at h1
      have n1 : 0 ≤ (∫ a, |f a| ^ p ∂μ) ^ (1 / p) := by positivity
      have n2 : 0 ≤ (∫ a, |g a| ^ p ∂μ) ^ (1 / p) := by positivity
      rw [← ENNReal.ofReal_add n1 n2] at h1
      exact (ENNReal.ofReal_le_ofReal_iff (add_nonneg n1 n2)).mp h1
- id: fa_lp_summable_differences_converge
  kind: gap
  level: 4
  topic: $L^p$空間・完備性の使いやすい形
  statement: $\mu$を測度、$1\leq p\leq\infty$、$E$をバナッハ空間、$(f_n)$を$L^p(\mu;E)$の列とする。$\sum_n\|f_{n+1}-f_n\|_p<\infty$ならば、$\|f_n-g\|_p\to 0$となる$g\in L^p(\mu;E)$が存在する。$L^p$の完備性は既習とする。
  statement_en: For 1 ≤ p ≤ ∞, a Banach space E and a sequence (f_n) in L^p(μ;E), if Σ‖f_(n+1) - f_n‖_p < ∞ then there is g in L^p(μ;E) with ‖f_n - g‖_p → 0. Completeness of L^p is taken as known.
  assumptions:
  - $\mu$は測度、$1\leq p\leq\infty$
  - $E$はバナッハ空間
  - $f_n\in L^p(\mu;E)$、$\sum_n\|f_{n+1}-f_n\|_p<\infty$
  - $L^p$の完備性は既習
  quantifiers:
  - 任意の$\mu,p,E,(f_n)$
  conclusion: $\|f_n-g\|_p\to 0$となる$g\in L^p(\mu;E)$が存在する。
  answer: |
    $\mu$を測度、$1\leq p\leq\infty$、$E$をバナッハ空間、$(f_n)$を$L^p(\mu;E)$の列で$\sum_n\|f_{n+1}-f_n\|_p<\infty$とする。

    $m<n$なら三角不等式より$\|f_n-f_m\|_p\leq\sum_{k=m}^{n-1}\|f_{k+1}-f_k\|_p$である。右辺は収束級数の裾なので、$m\to\infty$で$0$に近づく。よって$(f_n)$はコーシー列である。

    $L^p(\mu;E)$は完備なので、$\|f_n-g\|_p\to 0$となる$g\in L^p(\mu;E)$が存在する。
  strategy: A sequence with summable successive distances is Cauchy, and L^p is complete.
  sketch:
  - 'derive: The triangle inequality bounds ‖f_n - f_m‖ by a tail of the series.'
  - 'derive: Hence (f_n) is Cauchy.'
  - 'conclude: Completeness gives the limit g.'
  openmath: (forall (mu p E f) (-> (and (is_measure mu) (>= p 1) (banach_space E) (forall (n) (in (seq_value f n) (lp_space p mu))) (series_summable_fn (lambda (n) (norm (- (seq_value f (+ n 1)) (seq_value f n)))))) (exists (g) (and (in g (lp_space p mu)) (seq_fn_tends_to (lambda (n) (norm (- (seq_value f n) g))) 0)))))
  hard_negative:
    statement: $\|f_{n+1}-f_n\|_p\to 0$だけで$(f_n)$は収束する。
    reason: $\mu$を$\mathbb{N}$の数え上げ測度、$p=2$、$f_n=\sum_{k\leq n}k^{-1/2}e_k$とする。$\|f_{n+1}-f_n\|_2=(n+1)^{-1/2}\to 0$だが、$\|f_n\|_2^2=\sum_{k\leq n}1/k\to\infty$である。
  target: |
    ∀ (α E : Type*) [MeasurableSpace α] [NormedAddCommGroup E] (μ : MeasureTheory.Measure α) (p : ENNReal) [Fact (1 ≤ p)] (f : ℕ → MeasureTheory.Lp E p μ) [CompleteSpace E], Summable (fun n => ‖f (n + 1) - f n‖) → ∃ g : MeasureTheory.Lp E p μ, Filter.Tendsto (fun n => ‖f n - g‖) Filter.atTop (nhds 0)
  proof: |
    by
      intro α E _ _ μ p _ f _ h
      have hc : CauchySeq f := cauchySeq_of_summable_dist (by simpa [dist_eq_norm, norm_sub_rev] using h)
      obtain ⟨g, hg⟩ := cauchySeq_tendsto_of_complete hc
      exact ⟨g, tendsto_iff_norm_sub_tendsto_zero.mp hg⟩
- id: fa_lp_compact_support_continuous_dense
  kind: textbook
  level: 4
  topic: $L^p$空間・稠密性
  statement: $X$を$R_1$かつ弱局所コンパクトな正規空間、$\mu$を$X$上の正則なボレル測度、$1\leq p<\infty$、$E$を実ノルム空間、$f\in L^p(\mu;E)$、$\varepsilon\in(0,\infty]$とする。コンパクト台をもつ連続な$g\in L^p(\mu;E)$で$\|f-g\|_p\leq\varepsilon$となるものが存在する。単関数の稠密性とウリゾーンの補題は既習とする。
  statement_en: Let X be a normal, R1, weakly locally compact space, μ a regular Borel measure, 1 ≤ p < ∞, E a real normed space, f in L^p(μ;E) and ε in (0,∞]. There is a continuous g with compact support in L^p(μ;E) with ‖f - g‖_p ≤ ε. Density of simple functions and Urysohn's lemma are taken as known.
  assumptions:
  - $X$は$R_1$、弱局所コンパクト、正規な位相空間
  - $\mu$は正則なボレル測度
  - $1\leq p<\infty$
  - $f\in L^p(\mu;E)$
  - 単関数の稠密性とウリゾーンの補題は既習
  quantifiers:
  - 任意の$X,\mu,p,E,f,\varepsilon$
  conclusion: コンパクト台をもつ連続な$g\in L^p(\mu;E)$で$\|f-g\|_p\leq\varepsilon$となるものが存在する。
  answer: |
    $X,\mu,p,E,f,\varepsilon$を上の通りとする。単関数は$L^p$で稠密であり、三角不等式を使えるので、$f=c1_A$（$c\in E$、$\mu(A)<\infty$）の場合に示せばよい。$c\neq 0$とする。

    $\delta>0$を任意にとる。$\mu$の正則性から、コンパクト集合$K$と開集合$U$で$K\subset A\subset U$、$\mu(U\setminus K)<\delta$となるものがある。$\mu(A)<\infty$なので$\mu(U)<\infty$である。$A$は相対コンパクトとは限らないので、$U$の閉包もコンパクトとは限らない。一方、$K$はコンパクトなので、弱局所コンパクト性から、開集合$V$で$K\subset V\subset U$かつ$V$の閉包がコンパクトであるものがとれる。$R_1$空間ではコンパクト集合の閉包はそれを含む任意の開集合に含まれるので、$\overline{K}\subset V$である。

    $X$は正規なので、ウリゾーンの補題から、連続関数$\psi:X\to[0,1]$で$\overline{K}$上$1$、$V$の外で$0$となるものがある。$g=c\psi$は連続で、台は$V$の閉包に含まれるのでコンパクトである。$\|g\|\leq\|c\|$かつ$\mu(V)<\infty$なので$g\in L^p(\mu;E)$である。$f-g$は$U\setminus K$の外で$0$であり、大きさは$\|c\|$以下なので$\|f-g\|_p\leq\|c\|\delta^{1/p}$である。$\delta$を小さくとれば$\varepsilon$以下にできる。
  strategy: Reduce to indicators of finite-measure sets and approximate them by Urysohn functions using regularity.
  sketch:
  - 'translate: By density of simple functions it suffices to treat f = c 1_A.'
  - 'derive: Regularity gives compact K and open U with K ⊂ A ⊂ U and μ(U∖K) small.'
  - 'construct: Shrink to an open V with K ⊂ V ⊂ U and compact closure; Urysohn gives continuous ψ equal to 1 on K and 0 outside V.'
  - 'conclude: g = cψ has compact support and ‖f - g‖_p ≤ ‖c‖ μ(U∖K)^(1/p).'
  openmath: (forall (X mu p E f e) (-> (and (normal_space X) (r1_space X) (weakly_locally_compact X) (regular_measure mu X) (>= p 1) (finite_exponent p) (normed_space E) (mem_lp f p mu) (> e 0)) (exists (g) (and (compact_support g) (continuous_map g) (mem_lp g p mu) (<= (lp_norm (- f g) p mu) e)))))
  hard_negative:
    statement: $p=\infty$でもコンパクト台をもつ連続関数は$L^\infty$で稠密である。
    reason: $\mathbb{R}$上の定数関数$1$に対し、コンパクト台の$g$は$\|1-g\|_\infty\geq 1$を満たす。
  target: |
    ∀ (α E : Type*) [TopologicalSpace α] [NormalSpace α] [MeasurableSpace α] [BorelSpace α] [NormedAddCommGroup E] [NormedSpace ℝ E] [R1Space α] [WeaklyLocallyCompactSpace α] (μ : MeasureTheory.Measure α) [μ.Regular] (p : ENNReal) (f : α → E) (ε : ENNReal), 1 ≤ p → p ≠ ⊤ → MeasureTheory.MemLp f p μ → ε ≠ 0 → ∃ g : α → E, HasCompactSupport g ∧ MeasureTheory.eLpNorm (f - g) p μ ≤ ε ∧ Continuous g ∧ MeasureTheory.MemLp g p μ
  proof: |
    by
      intro α E _ _ _ _ _ _ _ _ μ _ p f ε _ hp hf hε
      exact hf.exists_hasCompactSupport_eLpNorm_sub_le hp hε
- id: fa_lp_holder_sequence_space
  kind: gap
  level: 3
  topic: $L^p$空間・数列空間のヘルダーの不等式
  statement: $I$を添字集合、$p,q\in(1,\infty)$を$1/p+1/q=1$を満たす指数、$f\in\ell^p(I)$、$g\in\ell^q(I)$を複素数値とする。$\sum_i|f_i||g_i|$は収束し、$\sum_i|f_i||g_i|\leq\|f\|_p\|g\|_q$である。有限和のヘルダーの不等式は既習とする。
  statement_en: For an index set I, conjugate exponents p, q in (1,∞) and complex f in ℓ^p(I), g in ℓ^q(I), the family |f_i||g_i| is summable and Σ|f_i||g_i| ≤ ‖f‖_p ‖g‖_q. The finite-sum Hölder inequality is taken as known.
  assumptions:
  - $I$は添字集合
  - $p,q\in(1,\infty)$、$1/p+1/q=1$
  - $f\in\ell^p(I)$、$g\in\ell^q(I)$は複素数値
  - 有限和のヘルダーの不等式は既習
  quantifiers:
  - 任意の$I,p,q,f,g$
  conclusion: $\sum_i|f_i||g_i|$は収束し、$\sum_i|f_i||g_i|\leq\|f\|_p\|g\|_q$である。
  answer: |
    $I$を添字集合、$p,q$を共役な指数、$f\in\ell^p(I)$、$g\in\ell^q(I)$とする。

    有限集合$s\subset I$について、有限和のヘルダーの不等式より
    $\sum_{i\in s}|f_i||g_i|\leq\left(\sum_{i\in s}|f_i|^p\right)^{1/p}\left(\sum_{i\in s}|g_i|^q\right)^{1/q}\leq\|f\|_p\|g\|_q$
    である。

    非負項の族は有限部分和が有界なら無条件収束し、和は部分和の上限である。よって結論を得る。
  strategy: Bound finite partial sums by the finite Hölder inequality and take the supremum.
  sketch:
  - 'apply_theorem: Finite Hölder bounds each finite partial sum by ‖f‖_p‖g‖_q.'
  - 'conclude: A nonnegative family with bounded partial sums is summable with sum at most this bound.'
  openmath: (forall (I p q f g) (-> (and (> p 1) (> q 1) (= (+ (/ 1 p) (/ 1 q)) 1) (in f (lp_sequence_space p)) (in g (lp_sequence_space q))) (and (series_summable_fn (lambda (i) (* (norm (seq_value f i)) (norm (seq_value g i))))) (<= (series_sum_fn (lambda (i) (* (norm (seq_value f i)) (norm (seq_value g i))))) (* (norm f) (norm g))))))
  hard_negative:
    statement: $f,g\in\ell^4$なら$\sum_i|f_i||g_i|<\infty$である。
    reason: $f_i=g_i=i^{-1/2}$とすると$\sum_ii^{-2}<\infty$なので$f,g\in\ell^4$だが、$\sum_i|f_i||g_i|=\sum_i1/i=\infty$である。
  target: |
    ∀ (ι : Type*) (p q : ENNReal) (f : lp (fun _ : ι => ℂ) p) (g : lp (fun _ : ι => ℂ) q), p.toReal.HolderConjugate q.toReal → (Summable fun i => ‖(f : ι → ℂ) i‖ * ‖(g : ι → ℂ) i‖) ∧ ∑' i, ‖(f : ι → ℂ) i‖ * ‖(g : ι → ℂ) i‖ ≤ ‖f‖ * ‖g‖
  proof: |
    by
      intro ι p q f g h
      exact lp.tsum_mul_le_mul_norm h f g
- id: fa_du_bois_reymond_open
  kind: named
  level: 4
  topic: 超関数・変分法の基本補題
  statement: 変分法の基本補題（デュ・ボア・レーモン）。$E$を有限次元実ノルム空間、$\mu$を$E$上のボレル測度、$F$を実バナッハ空間、$U\subset E$を開集合、$f:E\to F$を$U$上で局所可積分な関数とする。台がコンパクトで$U$に含まれる全ての$C^\infty$関数$g:E\to\mathbb{R}$について$\int g(x)f(x)\,d\mu=0$ならば、$\mu$についてほとんど全ての$x$で、$x\in U$なら$f(x)=0$である。滑らかなウリゾーン関数の存在とラドン測度の正則性は既習とする。
  statement_en: Fundamental lemma of the calculus of variations (du Bois-Reymond). Let E be a finite-dimensional real normed space, μ a Borel measure, F a real Banach space, U open in E and f locally integrable on U. If ∫g f dμ = 0 for each C^∞ function g with compact support in U, then for μ-almost every x, x in U implies f(x) = 0. Existence of smooth Urysohn functions and regularity of Radon measures are taken as known.
  assumptions:
  - $E$は有限次元実ノルム空間、$\mu$はボレル測度
  - $F$は実バナッハ空間、$U\subset E$は開集合
  - $f$は$U$上で局所可積分
  - 台がコンパクトで$U$に含まれる全ての$C^\infty$関数$g$で$\int gf\,d\mu=0$
  - 滑らかなウリゾーン関数の存在とラドン測度の正則性は既習
  quantifiers:
  - 任意の$E,\mu,F,U,f$
  conclusion: ほとんど全ての$x\in U$で$f(x)=0$である。
  answer: |
    $E,\mu,F,U,f$を上の通りとする。$U$は$f$が可積分な相対コンパクト開集合$V$（$\overline{V}\subset U$）の可算和で覆えるので、各$V$の上で$f=0$（ほとんど至る所）を示せばよい。

    可積分関数$f$はほとんど至る所可分な部分空間に値をとるので、そこで点を分離する可算個の連続線形汎関数$\ell_k$がとれる。$\int g\,\ell_k(f)\,d\mu=\ell_k(\int gf\,d\mu)=0$なので、各$k$で実数値関数$h=\ell_k\circ f$について$h=0$（ほとんど至る所、$V$）を示せばよい。

    $\nu=|h|\mu$は$V$上の有限ボレル測度であり、$E$は局所コンパクトで第二可算なので正則である。$A\subset V$を可測集合、$\varepsilon>0$とする。コンパクト集合$K$と開集合$W$で$K\subset A\subset W\subset V$、$\nu(W\setminus K)<\varepsilon$となるものをとる。滑らかなウリゾーン関数$g$で$K$上$1$、$0\leq g\leq 1$、台がコンパクトで$W$に含まれるものをとる。

    $\int_Ah\,d\mu$と$\int gh\,d\mu=0$の差の絶対値は$\nu(W\setminus K)$以下なので$|\int_Ah\,d\mu|<\varepsilon$である。$\varepsilon,A$は任意なので、$V$上で$h=0$（ほとんど至る所）である。
  strategy: Reduce to real functions by functionals and approximate indicators of measurable sets by smooth cutoffs in L¹(|h|μ).
  sketch:
  - 'translate: Cover U by countably many relatively compact open sets where f is integrable.'
  - 'derive: Separability and countably many functionals reduce to real-valued h.'
  - 'derive: The finite measure |h|μ is regular on the bounded open set.'
  - 'construct: For measurable A choose smooth g approximating 1_A in L¹(|h|μ).'
  - 'conclude: ∫_A h dμ = 0 for all A, so h vanishes almost everywhere.'
  openmath: (forall (E F mu f U) (-> (and (normed_space E) (finite_dim_space E) (banach_space F) (is_measure mu) (open_set U) (locally_integrable_on f U mu) (forall (g) (-> (and (smooth_function g) (compact_support g) (support_subset g U)) (= (integral_wrt (lambda (x) (* (fn_value g x) (fn_value f x))) mu) 0)))) (ae_zero_on f U mu)))
  hard_negative:
    statement: $\int_Uf\,d\mu=0$だけで$U$上$f=0$（ほとんど至る所）である。
    reason: $U=(-1,1)$、$\mu$をルベーグ測度、$f(x)=x$なら$\int_Uf\,d\mu=0$だが、$f$は$0$でない。全ての試験関数についての仮定が要る。
  target: |
    ∀ (E F : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] [FiniteDimensional ℝ E] [MeasurableSpace E] [BorelSpace E] [NormedAddCommGroup F] [NormedSpace ℝ F] [CompleteSpace F] (μ : MeasureTheory.Measure E) (f : E → F) (U : Set E), IsOpen U → MeasureTheory.LocallyIntegrableOn f U μ → (∀ g : E → ℝ, ContDiff ℝ (⊤ : ℕ∞) g → HasCompactSupport g → tsupport g ⊆ U → ∫ x, g x • f x ∂μ = 0) → ∀ᵐ x ∂μ, x ∈ U → f x = 0
  proof: |
    by
      intro E F _ _ _ _ _ _ _ _ μ f U hU hf h
      exact hU.ae_eq_zero_of_integral_contDiff_smul_eq_zero hf h
- id: fa_schwartz_integration_by_parts
  kind: gap
  level: 4
  topic: 超関数・シュワルツ空間
  statement: $f,g$を$\mathbb{R}$上の複素数値シュワルツ関数とする。$\int_{\mathbb{R}}f(x)g'(x)\,dx=-\int_{\mathbb{R}}f'(x)g(x)\,dx$である。
  statement_en: For complex-valued Schwartz functions f and g on ℝ, ∫ f g' dx = -∫ f' g dx.
  assumptions:
  - $f,g$は$\mathbb{R}$上の複素数値シュワルツ関数
  quantifiers:
  - 任意の$f,g$
  conclusion: $\int f g'\,dx=-\int f'g\,dx$である。
  answer: |
    $f,g$を$\mathbb{R}$上の複素数値シュワルツ関数とする。$f,g,f',g'$はすべて有界で急減少する。したがって$fg$、$fg'$、$f'g$は可積分であり、$fg\to 0$（$|x|\to\infty$）である。

    $(fg)'=f'g+fg'$を$[-R,R]$で積分すると、微積分学の基本定理より
    $f(R)g(R)-f(-R)g(-R)=\int_{-R}^R f'g\,dx+\int_{-R}^R fg'\,dx$
    である。$R\to\infty$とすると左辺は$0$に収束し、右辺は$\int f'g\,dx+\int fg'\,dx$に収束する。
  strategy: Integrate (fg)' over a large interval and let the interval grow, using decay.
  sketch:
  - 'derive: Decay makes fg, fg'', f''g integrable and fg → 0 at infinity.'
  - 'apply_theorem: The fundamental theorem of calculus on [-R,R].'
  - 'conclude: Letting R → ∞ gives the identity.'
  openmath: (forall (f g) (-> (and (schwartz_on R f) (schwartz_on R g)) (= (integral_wrt (lambda (x) (* (fn_value f x) (deriv_value g x))) lebesgue_measure) (neg (integral_wrt (lambda (x) (* (deriv_value f x) (fn_value g x))) lebesgue_measure)))))
  hard_negative:
    statement: 無限遠で$0$に近づかない有界な$C^1$関数でも、$f',g'$が可積分なら同じ公式が成り立つ。
    reason: $f=\tanh$、$g=1+\tanh$では$\int(f'g+fg')\,dx=[fg]_{-\infty}^{\infty}=2\neq 0$である。境界項が残る。
  target: |
    ∀ (f g : SchwartzMap ℝ ℂ), ∫ x : ℝ, f x * deriv g x = -∫ x : ℝ, deriv f x * g x
  proof: |
    by
      intro f g
      exact SchwartzMap.integral_mul_deriv_eq_neg_deriv_mul f g
- id: fa_dirac_derivative_tempered
  kind: gap
  level: 4
  topic: 超関数・緩増加超関数
  statement: $E$を実ノルム空間、$x,m\in E$、$\delta_x$を$x$のディラック緩増加超関数、$\partial_m$を方向$m$の方向微分とする。緩増加超関数の微分は$\langle\partial_mT,g\rangle=-\langle T,\partial_mg\rangle$で定まる。全ての複素数値シュワルツ関数$g$で$\langle\partial_m\delta_x,g\rangle=-(\partial_mg)(x)$である。
  statement_en: Let E be a real normed space, x, m in E, δ_x the Dirac tempered distribution at x and ∂_m the directional derivative. With the derivative defined by ⟨∂_m T, g⟩ = -⟨T, ∂_m g⟩, one has ⟨∂_m δ_x, g⟩ = -(∂_m g)(x) for all complex Schwartz functions g.
  assumptions:
  - $E$は実ノルム空間、$x,m\in E$
  - 緩増加超関数の微分は$\langle\partial_mT,g\rangle=-\langle T,\partial_mg\rangle$で定める
  - $\langle\delta_x,g\rangle=g(x)$
  quantifiers:
  - 任意の$E,x,m$と複素数値シュワルツ関数$g$
  conclusion: $\langle\partial_m\delta_x,g\rangle=-(\partial_mg)(x)$である。
  answer: |
    $E$を実ノルム空間、$x,m\in E$、$g$を複素数値シュワルツ関数とする。$\partial_mg$もシュワルツ関数である。

    超関数の微分の定義から$\langle\partial_m\delta_x,g\rangle=-\langle\delta_x,\partial_mg\rangle$である。$\delta_x$の定義から$\langle\delta_x,\partial_mg\rangle=(\partial_mg)(x)$である。よって$\langle\partial_m\delta_x,g\rangle=-(\partial_mg)(x)$である。
  strategy: Unfold the distributional derivative and the definition of the Dirac distribution.
  sketch:
  - 'translate: The derivative of a tempered distribution is defined by duality with a minus sign.'
  - 'conclude: Evaluate δ_x at the Schwartz function ∂_m g.'
  openmath: (forall (E x m g) (-> (and (normed_space E) (in x E) (in m E) (schwartz_on E g)) (= (fn_value (tempered_line_deriv m (dirac_delta x)) g) (neg (fn_value (schwartz_line_deriv m g) x)))))
  hard_negative:
    statement: $\langle\partial_m\delta_x,g\rangle=(\partial_mg)(x)$である。
    reason: $E=\mathbb{R}$で滑らかな関数$u$に対応する超関数では、部分積分から$\langle u',g\rangle=\int u'g=-\int ug'$である。この整合性のため定義に符号が入り、$\delta_x$でも符号は$-$である。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] (x m : E) (g : SchwartzMap E ℂ), (LineDeriv.lineDerivOp m (TemperedDistribution.delta x : TemperedDistribution E ℂ)) g = -(LineDeriv.lineDerivOp m g) x
  proof: |
    by
      intro E _ _ x m g
      simp [TemperedDistribution.lineDerivOp_apply_apply, TemperedDistribution.delta_apply]
- id: fa_mollifier_convolution_converges_at_point
  kind: gap
  level: 4
  topic: 超関数・軟化子
  statement: $G$を有限次元実ノルム空間、$\mu$を加法的ハール測度、$E$を実バナッハ空間、$g:G\to E$を連続関数とする。$\varphi_n\geq 0$を滑らかな実数値関数で$\int\varphi_n\,d\mu=1$を満たすものとし、その台は原点を中心とする半径$r_n$の球に含まれ、$r_n\to 0$とする。各点$x_0$で$(\varphi_n*g)(x_0)\to g(x_0)$である。
  statement_en: Let G be a finite-dimensional real normed space with additive Haar measure μ, E a real Banach space, g from G to E continuous and φ_n ≥ 0 smooth real functions with ∫φ_n dμ = 1 supported in the ball of radius r_n about 0, where r_n → 0. Then (φ_n * g)(x₀) → g(x₀) at each point x₀.
  assumptions:
  - $G$は有限次元実ノルム空間、$\mu$は加法的ハール測度
  - $E$は実バナッハ空間、$g:G\to E$は連続
  - $\varphi_n\geq 0$は滑らかで$\int\varphi_n\,d\mu=1$、台は原点を中心とする半径$r_n$の球に含まれ$r_n\to 0$
  quantifiers:
  - 任意の$G,\mu,E,g,(\varphi_n),(r_n),x_0$
  conclusion: $(\varphi_n*g)(x_0)\to g(x_0)$である。
  answer: |
    $G,\mu,E,g,\varphi_n,x_0$を上の通りとする。$\varphi_n$は可積分で台が有界であり、$g$は連続なので、$\varphi_n(t)g(x_0-t)$は可積分である。$\int\varphi_n\,d\mu=1$なので
    $(\varphi_n*g)(x_0)-g(x_0)=\int\varphi_n(t)\bigl(g(x_0-t)-g(x_0)\bigr)\,d\mu(t)$
    である。ここで畳み込みは$(\varphi*g)(x)=\int\varphi(t)g(x-t)\,d\mu(t)$である。

    $\varepsilon>0$をとる。$g$は$x_0$で連続なので、$\delta>0$があり$\|t\|<\delta$で$\|g(x_0-t)-g(x_0)\|<\varepsilon$である。$r_n<\delta$となる$n$では$\varphi_n$の台は$\|t\|<\delta$に含まれるので、ノルムの評価から差のノルムは$\varepsilon\int\varphi_n\,d\mu=\varepsilon$以下である。
  strategy: The convolution is an average of g over a shrinking ball with weight φ_n.
  sketch:
  - 'derive: Normalization rewrites the difference as an average of g(x₀-t) - g(x₀).'
  - 'derive: Continuity makes the integrand small on the shrinking support.'
  - 'conclude: The weighted average is bounded by ε for large n.'
  openmath: (forall (G E mu phi g x0) (-> (and (normed_space G) (finite_dim_space G) (additive_haar_measure mu G) (banach_space E) (forall (n) (normalized_bump (seq_value phi n) mu)) (seq_fn_tends_to (lambda (n) (bump_outer_radius (seq_value phi n))) 0) (continuous_map g) (in x0 G)) (seq_fn_tends_to (lambda (n) (convolution_at (seq_value phi n) g mu x0)) (fn_value g x0))))
  hard_negative:
    statement: 正規化なしの隆起関数でも$(\varphi_n*g)(x_0)\to g(x_0)$である。
    reason: $\int\varphi_n\,d\mu=2$なら、$g=1$で$(\varphi_n*g)(x_0)=2$であり$1$に収束しない。
  target: |
    ∀ (G E : Type*) [NormedAddCommGroup G] [NormedSpace ℝ G] [FiniteDimensional ℝ G] [MeasurableSpace G] [BorelSpace G] (μ : MeasureTheory.Measure G) [μ.IsAddHaarMeasure] [NormedAddCommGroup E] [NormedSpace ℝ E] [CompleteSpace E] (φ : ℕ → G → ℝ) (r : ℕ → ℝ) (g : G → E) (x₀ : G), (∀ n, ContDiff ℝ (⊤ : ℕ∞) (φ n)) → (∀ n x, 0 ≤ φ n x) → (∀ n, ∫ x, φ n x ∂μ = 1) → (∀ n, Function.support (φ n) ⊆ Metric.ball (0 : G) (r n)) → Filter.Tendsto r Filter.atTop (nhds 0) → Continuous g → Filter.Tendsto (fun n => MeasureTheory.convolution (φ n) g (ContinuousLinearMap.lsmul ℝ ℝ) μ x₀) Filter.atTop (nhds (g x₀))
  proof: |
    by
      intro G E _ _ _ _ _ μ _ _ _ _ φ r g x₀ _ hn hi hs hr hg
      refine MeasureTheory.convolution_tendsto_right (Filter.Eventually.of_forall hn) (Filter.Eventually.of_forall hi) ?_ (Filter.Eventually.of_forall fun _ => hg.aestronglyMeasurable) ((hg.tendsto x₀).comp Filter.tendsto_snd) tendsto_const_nhds
      rw [Filter.tendsto_smallSets_iff]
      intro t ht
      obtain ⟨ε, hε, hb⟩ := Metric.mem_nhds_iff.mp ht
      filter_upwards [hr.eventually (Metric.ball_mem_nhds (0 : ℝ) hε)] with n hn'
      have hlt : r n < ε := by simpa [abs_lt, Real.dist_eq] using (abs_lt.mp (by simpa [Real.dist_eq] using hn')).2
      exact (hs n).trans ((Metric.ball_subset_ball hlt.le).trans hb)
