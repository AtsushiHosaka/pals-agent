      obtain ⟨h1, h2⟩ := pdf_int a (r - t) ha hrt
      refine ⟨h1.const_mul _, ?_⟩
      rw [MeasureTheory.integral_const_mul, h2, mul_one]
- id: exponential_tail_memoryless
  kind: gap
  level: 2
  topic: 確率分布・指数分布の裾と無記憶性
  statement: レート$r>0$の指数分布に従う$X$について、$x\geq 0$なら$P(X>x)=e^{-rx}$であり、$s,t\geq 0$なら$P(X>s+t\mid X>s)=P(X>t)$である。
  statement_en: If X is exponential with rate r > 0, then P(X > x) = e^{-rx} for x ≥ 0, and P(X > s+t | X > s) = P(X > t) for s, t ≥ 0.
  assumptions:
  - $r>0$
  - $X$はレート$r$の指数分布に従う
  - $x,s,t\geq 0$
  quantifiers:
  - 任意の$x,s,t\geq 0$
  conclusion: $P(X>x)=e^{-rx}$であり、$P(X>s+t\mid X>s)=P(X>t)$である。
  answer: |
    $r>0$とし、$X$を密度$re^{-ry}$（$y\geq 0$）をもつ確率変数とする。$x\geq 0$なら
    $P(X>x)=\int_x^\infty re^{-ry}\,dy=e^{-rx}$
    である。

    $s,t\geq 0$とする。$P(X>s)=e^{-rs}>0$であり、$\{X>s+t\}\subset\{X>s\}$なので
    $P(X>s+t\mid X>s)=\frac{e^{-r(s+t)}}{e^{-rs}}=e^{-rt}=P(X>t)$
    である。
  strategy: Integrate the density for the tail and divide tails for the conditional probability.
  sketch:
  - 'derive: Integrating the density over (x, ∞) gives e^{-rx}.'
  - 'setup: The conditioning event has positive probability and contains {X > s+t}.'
  - 'conclude: The quotient of tails is e^{-rt}.'
  openmath: (forall (r x s t) (-> (and (> r 0) (>= x 0) (>= s 0) (>= t 0)) (and (= (prob (exponential_measure r) (open_half_line_right x)) (exp (neg (* r x)))) (= (cond_prob (exponential_measure r) (open_half_line_right (+ s t)) (open_half_line_right s)) (prob (exponential_measure r) (open_half_line_right t))))))
  hard_negative:
    statement: すべての実数$x$について$P(X>x)=e^{-rx}$である。
    reason: $x<0$なら$P(X>x)=1$であり、一方$e^{-rx}>1$である。
  target: |
    ∀ r : ℝ, 0 < r → (∀ x : ℝ, 0 ≤ x → (ProbabilityTheory.expMeasure r).real (Set.Ioi x) = Real.exp (-(r * x))) ∧ ∀ s t : ℝ, 0 ≤ s → 0 ≤ t → (ProbabilityTheory.cond (ProbabilityTheory.expMeasure r) (Set.Ioi s)).real (Set.Ioi (s + t)) = (ProbabilityTheory.expMeasure r).real (Set.Ioi t)
  proof: |
    by
      intro r hr
      have : MeasureTheory.IsProbabilityMeasure (ProbabilityTheory.expMeasure r) := ProbabilityTheory.isProbabilityMeasure_expMeasure hr
      have tail : ∀ x : ℝ, 0 ≤ x → (ProbabilityTheory.expMeasure r).real (Set.Ioi x) = Real.exp (-(r * x)) := by
        intro x hx
        have h := ProbabilityTheory.cdf_expMeasure_eq hr x
        rw [if_pos hx, ProbabilityTheory.cdf_eq_real] at h
        have hc : (Set.Ioi x) = (Set.Iic x)ᶜ := by ext; simp
        rw [hc, MeasureTheory.probReal_compl_eq_one_sub measurableSet_Iic, h]
        ring
      refine ⟨tail, fun s t hs ht => ?_⟩
      have hinter : Set.Ioi s ∩ Set.Ioi (s + t) = Set.Ioi (s + t) := by
        ext x; simp only [Set.mem_inter_iff, Set.mem_Ioi]; constructor
        · exact fun h => h.2
        · exact fun h => ⟨by linarith, h⟩
      rw [MeasureTheory.measureReal_def, ProbabilityTheory.cond_apply measurableSet_Ioi, hinter, ENNReal.toReal_mul, ENNReal.toReal_inv, ← MeasureTheory.measureReal_def, ← MeasureTheory.measureReal_def, tail s hs, tail (s + t) (by linarith), tail t ht, mul_add, neg_add, Real.exp_add]
      have := Real.exp_pos (-(r * s))
      field_simp
- id: exponential_mean_variance
  kind: textbook
  level: 2
