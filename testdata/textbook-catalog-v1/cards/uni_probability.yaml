- id: poisson_pmf_sum_one
  kind: gap
  level: 2
  topic: 確率分布・ポアソン分布の確率質量
  statement: パラメータ$r\geq 0$のポアソン分布$\mathrm{Po}(r)$は$\mathbb{N}=\{0,1,2,\dots\}$上の確率測度で、各$n$の確率は$e^{-r}r^n/n!$である。この確率の総和は$1$に収束する。ただし$0^0=1$とする。
  statement_en: The Poisson distribution with parameter r ≥ 0 gives mass e^{-r} r^n / n! to each natural number n, with the convention 0^0 = 1, and these masses sum to 1.
  assumptions:
  - $r\geq 0$
  - $0^0=1$とする
  quantifiers:
  - 任意の$r\geq 0$
  - 任意の$n\in\mathbb{N}$
  conclusion: $\mathrm{Po}(r)(\{n\})=e^{-r}r^n/n!$であり、$\sum_{n\geq 0}e^{-r}r^n/n!=1$である。
  answer: |
    $r\geq 0$とする。$\mathrm{Po}(r)$は各$n\in\mathbb{N}$に質量$e^{-r}r^n/n!$を与える測度として定義されるので、$\mathrm{Po}(r)(\{n\})=e^{-r}r^n/n!$である。

    指数関数のテイラー展開より、$\sum_{n\geq 0}r^n/n!$は$e^r$に収束する。両辺に$e^{-r}$を掛けると、$\sum_{n\geq 0}e^{-r}r^n/n!=e^{-r}e^r=1$を得る。
  strategy: Read the mass off the definition and sum it with the exponential series.
  sketch:
  - 'setup: The Poisson measure puts mass e^{-r} r^n / n! at n.'
  - 'apply_theorem: The exponential series gives the sum of r^n / n! equal to e^r.'
  - 'conclude: Multiplying by e^{-r} gives total mass 1.'
  openmath: (forall (r n) (-> (and (>= r 0) (in n N)) (and (= (prob (poisson_measure r) (singleton_set n)) (/ (* (exp (neg r)) (^ r n)) (factorial n))) (series_has_sum (lambda (k) (/ (* (exp (neg r)) (^ r k)) (factorial k))) 1))))
  hard_negative:
    statement: 確率$e^{-r}r^n/n!$の総和は$r$の値によらず$e^{-r}$である。
    reason: $r=1$のとき$n=0$の項だけで$e^{-1}$となり、$n=1$の項も$e^{-1}>0$なので総和は$e^{-1}$より大きい。実際の総和は$1$である。
  target: |
    ∀ (r : NNReal), (∀ n : ℕ, (ProbabilityTheory.poissonMeasure r).real {n} = Real.exp (-(r : ℝ)) * (r : ℝ) ^ n / (n.factorial : ℝ)) ∧ HasSum (fun n : ℕ => Real.exp (-(r : ℝ)) * (r : ℝ) ^ n / (n.factorial : ℝ)) 1
  proof: |
    by
      intro r
      exact ⟨ProbabilityTheory.poissonMeasure_real_singleton r, ProbabilityTheory.hasSum_one_poissonMeasure r⟩
- id: poisson_factorial_moment
  kind: gap
  level: 2
  topic: 確率分布・ポアソン分布の階乗モーメント
  statement: パラメータ$r\geq 0$のポアソン分布に従う$X$と自然数$k$について、$X(X-1)\cdots(X-k+1)$は可積分であり、$E[X(X-1)\cdots(X-k+1)]=r^k$である。
  statement_en: If X has the Poisson distribution with parameter r ≥ 0, then for each natural number k the falling factorial X(X-1)...(X-k+1) is integrable with expectation r^k.
  assumptions:
  - $r\geq 0$
  - $X$はパラメータ$r$のポアソン分布に従う
  quantifiers:
  - 任意の$r\geq 0$
  - 任意の自然数$k$
  conclusion: $X(X-1)\cdots(X-k+1)$は可積分で、期待値は$r^k$である。
  answer: |
    $r\geq 0$、$k$を自然数とし、$X$をパラメータ$r$のポアソン分布に従う確率変数とする。$n\in\mathbb{N}$に対し$n^{\underline{k}}=n(n-1)\cdots(n-k+1)$とおく。$n<k$なら$n^{\underline{k}}=0$であり、$n\geq k$なら$n^{\underline{k}}=n!/(n-k)!$である。これらは非負である。

    したがって
    $\sum_{n\geq 0}n^{\underline{k}}\frac{e^{-r}r^n}{n!}=\sum_{n\geq k}\frac{e^{-r}r^n}{(n-k)!}=r^k\sum_{m\geq 0}\frac{e^{-r}r^m}{m!}=r^k$
    である。最後の等号は$m=n-k$と置き換え、ポアソン分布の確率の総和が$1$であることを使った。この級数は非負項で収束するので$X^{\underline{k}}$は可積分であり、期待値はこの和$r^k$に等しい。
  strategy: Cancel the factorial in the mass and shift the summation index by k.
  sketch:
  - 'setup: Write n^{(k)} for the falling factorial, which vanishes for n < k and equals n!/(n-k)! otherwise.'
  - 'derive: The term n^{(k)} e^{-r} r^n / n! equals e^{-r} r^n / (n-k)! for n ≥ k.'
  - 'derive: Shifting the index by k factors out r^k from the total mass of the distribution.'
  - 'conclude: The series of nonnegative terms converges to r^k, so the variable is integrable with that mean.'
  openmath: (forall (r k) (-> (and (>= r 0) (in k N)) (and (integrable_rv (falling_factorial identity_rv k) (poisson_measure r)) (= (expectation (poisson_measure r) (falling_factorial identity_rv k)) (^ r k)))))
  hard_negative:
    statement: ポアソン分布に従う$X$について$E[X^k]=r^k$である。
    reason: $k=2$のとき$E[X^2]=r^2+r$であり、$r>0$なら$r^2$と異なる。$r^k$になるのは階乗モーメントである。
  target: |
    ∀ (r : NNReal) (k : ℕ), MeasureTheory.Integrable (fun n : ℕ => (n.descFactorial k : ℝ)) (ProbabilityTheory.poissonMeasure r) ∧ ∫ n : ℕ, (n.descFactorial k : ℝ) ∂(ProbabilityTheory.poissonMeasure r) = (r : ℝ) ^ k
  proof: |
    by
      intro r k
      have h1 : HasSum (fun n : ℕ => Real.exp (-(r : ℝ)) * (r : ℝ) ^ n / (n.factorial : ℝ) * (n.descFactorial k : ℝ)) ((r : ℝ) ^ k) := by
        rw [← hasSum_nat_add_iff' k]
        have h0 : ∑ i ∈ Finset.range k, Real.exp (-(r : ℝ)) * (r : ℝ) ^ i / (i.factorial : ℝ) * (i.descFactorial k : ℝ) = 0 :=
          Finset.sum_eq_zero fun i hi => by
            rw [Nat.descFactorial_eq_zero_iff_lt.mpr (Finset.mem_range.mp hi)]; simp
        rw [h0, sub_zero]
        have := (ProbabilityTheory.hasSum_one_poissonMeasure r).mul_left ((r : ℝ) ^ k)
        rw [mul_one] at this
        refine Eq.mpr (congrArg (fun f : ℕ → ℝ => HasSum f _) (funext fun n => ?_)) this
        have hf : ((n + k).factorial : ℝ) = (n.factorial : ℝ) * ((n + k).descFactorial k : ℝ) := by
          have := Nat.factorial_mul_descFactorial (Nat.le_add_left k n)
          rw [Nat.add_sub_cancel] at this
          exact_mod_cast this.symm
        have hn : (n.factorial : ℝ) ≠ 0 := by positivity
        have hd : ((n + k).descFactorial k : ℝ) ≠ 0 := by
          have : ((n + k).factorial : ℝ) ≠ 0 := by positivity
          intro h; rw [h, mul_zero] at hf; exact this hf
        rw [hf, pow_add]
        field_simp
      have hint : MeasureTheory.Integrable (fun n : ℕ => (n.descFactorial k : ℝ)) (ProbabilityTheory.poissonMeasure r) := by
        rw [ProbabilityTheory.integrable_poissonMeasure_iff]
        simpa only [Real.norm_natCast] using h1.summable
      refine ⟨hint, ?_⟩
      have h2 := ProbabilityTheory.hasSum_integral_poissonMeasure hint
      simp only [smul_eq_mul] at h2
      exact h2.unique h1
- id: poisson_mean_variance
  kind: textbook
  level: 2
  topic: 確率分布・ポアソン分布の平均と分散
  statement: パラメータ$r\geq 0$のポアソン分布に従う$X$は2乗可積分であり、$E[X]=r$、$V[X]=r$である。
  statement_en: A random variable with the Poisson distribution of parameter r ≥ 0 is square-integrable, with mean r and variance r.
  assumptions:
  - $r\geq 0$
  - $X$はパラメータ$r$のポアソン分布に従う
  quantifiers:
  - 任意の$r\geq 0$
  conclusion: $X$は2乗可積分で、$E[X]=r$かつ$V[X]=r$である。
  answer: |
    $r\geq 0$とし、$X$をパラメータ$r$のポアソン分布に従う確率変数とする。確率の総和が$1$であることを使う。

    $n\geq 1$では$n\cdot e^{-r}r^n/n!=r\cdot e^{-r}r^{n-1}/(n-1)!$なので、$\sum_{n\geq 0}n\,e^{-r}r^n/n!=r$である。同様に$n\geq 2$では$n(n-1)e^{-r}r^n/n!=r^2e^{-r}r^{n-2}/(n-2)!$なので、$\sum_{n\geq 0}n(n-1)e^{-r}r^n/n!=r^2$である。

    $n^2=n(n-1)+n$より$\sum_{n\geq 0}n^2e^{-r}r^n/n!=r^2+r$であり、非負項の級数が収束するので$X$は2乗可積分である。よって$E[X]=r$であり、$V[X]=E[X^2]-E[X]^2=r^2+r-r^2=r$である。
  strategy: Compute E[X] and E[X(X-1)] by index shifts, then use n^2 = n(n-1) + n.
  sketch:
  - 'derive: Shifting the index by one gives E[X] = r.'
  - 'derive: Shifting the index by two gives E[X(X-1)] = r^2.'
  - 'derive: Hence the series for E[X^2] converges to r^2 + r, so X is square-integrable.'
  - 'conclude: The variance is r^2 + r - r^2 = r.'
  openmath: (forall (r) (-> (>= r 0) (and (square_integrable_rv identity_rv (poisson_measure r)) (= (expectation (poisson_measure r) identity_rv) r) (= (variance (poisson_measure r) identity_rv) r))))
  hard_negative:
    statement: ポアソン分布の分散は$r^2$である。
    reason: $E[X^2]=r^2+r$、$E[X]=r$より分散は$r$である。$r=1$なら$1$で一致するが、$r=2$なら$V[X]=2$であり$r^2=4$と異なる。
  target: |
    ∀ (r : NNReal), MeasureTheory.MemLp (fun n : ℕ => (n : ℝ)) 2 (ProbabilityTheory.poissonMeasure r) ∧ ∫ n : ℕ, (n : ℝ) ∂(ProbabilityTheory.poissonMeasure r) = (r : ℝ) ∧ ProbabilityTheory.variance (fun n : ℕ => (n : ℝ)) (ProbabilityTheory.poissonMeasure r) = (r : ℝ)
  proof: |
    by
      intro r
      have h1 : HasSum (fun n : ℕ => Real.exp (-(r : ℝ)) * (r : ℝ) ^ n / (n.factorial : ℝ) * (n : ℝ)) (r : ℝ) := by
        rw [← hasSum_nat_add_iff' 1]
        simp only [Finset.range_one, Finset.sum_singleton, Nat.cast_zero, mul_zero, sub_zero]
        have := (ProbabilityTheory.hasSum_one_poissonMeasure r).mul_left (r : ℝ)
        rw [mul_one] at this
        refine Eq.mpr (congrArg (fun f : ℕ → ℝ => HasSum f _) (funext fun n => ?_)) this
        rw [Nat.factorial_succ, pow_succ]
        push_cast
        have hn : (n.factorial : ℝ) ≠ 0 := by positivity
        have hn1 : ((n : ℝ) + 1) ≠ 0 := by positivity
        field_simp
      have h3 : HasSum (fun n : ℕ => Real.exp (-(r : ℝ)) * (r : ℝ) ^ n / (n.factorial : ℝ) * ((n : ℝ) * ((n : ℝ) - 1))) ((r : ℝ) ^ 2) := by
        rw [← hasSum_nat_add_iff' 2]
        simp only [Finset.sum_range_succ, Finset.range_zero, Finset.sum_empty]
        norm_num
        have := (ProbabilityTheory.hasSum_one_poissonMeasure r).mul_left ((r : ℝ) ^ 2)
        rw [mul_one] at this
        refine Eq.mpr (congrArg (fun f : ℕ → ℝ => HasSum f _) (funext fun n => ?_)) this
        rw [show n + 2 = (n + 1) + 1 from rfl, Nat.factorial_succ, Nat.factorial_succ]
        push_cast
        have hn : (n.factorial : ℝ) ≠ 0 := by positivity
        have hn1 : ((n : ℝ) + 1) ≠ 0 := by positivity
        have hn2 : ((n : ℝ) + 1 + 1) ≠ 0 := by positivity
        ring_nf
        field_simp
      have h4 : HasSum (fun n : ℕ => Real.exp (-(r : ℝ)) * (r : ℝ) ^ n / (n.factorial : ℝ) * (n : ℝ) ^ 2) ((r : ℝ) ^ 2 + (r : ℝ)) := by
        refine Eq.mpr (congrArg (fun f : ℕ → ℝ => HasSum f _) (funext fun n => ?_)) (h3.add h1)
        ring
      have hint1 : MeasureTheory.Integrable (fun n : ℕ => (n : ℝ)) (ProbabilityTheory.poissonMeasure r) := by
        rw [ProbabilityTheory.integrable_poissonMeasure_iff]
        simpa only [Real.norm_natCast] using h1.summable
      have hint2 : MeasureTheory.Integrable (fun n : ℕ => (n : ℝ) ^ 2) (ProbabilityTheory.poissonMeasure r) := by
        rw [ProbabilityTheory.integrable_poissonMeasure_iff]
        simpa only [norm_pow, Real.norm_natCast] using h4.summable
      have hL : MeasureTheory.MemLp (fun n : ℕ => (n : ℝ)) 2 (ProbabilityTheory.poissonMeasure r) :=
        (MeasureTheory.memLp_two_iff_integrable_sq (MeasureTheory.AEStronglyMeasurable.of_discrete)).mpr hint2
      have e1 := (ProbabilityTheory.hasSum_integral_poissonMeasure hint1)
      have e2 := (ProbabilityTheory.hasSum_integral_poissonMeasure hint2)
      simp only [smul_eq_mul] at e1 e2
      have e1' := e1.unique h1
      have e2' := e2.unique h4
      refine ⟨hL, e1', ?_⟩
      rw [ProbabilityTheory.variance_eq_sub hL]
      simp only [Pi.pow_apply]
      rw [e1', e2']
      ring
- id: poisson_mgf
  kind: textbook
  level: 2
  topic: 確率分布・ポアソン分布の積率母関数
  statement: パラメータ$r\geq 0$のポアソン分布に従う$X$と実数$t$について、$e^{tX}$は可積分であり、$E[e^{tX}]=\exp(r(e^t-1))$である。
  statement_en: If X has the Poisson distribution with parameter r ≥ 0, then for every real t the variable e^{tX} is integrable and E[e^{tX}] = exp(r(e^t - 1)).
  assumptions:
  - $r\geq 0$
  - $X$はパラメータ$r$のポアソン分布に従う
  quantifiers:
  - 任意の$r\geq 0$と実数$t$
  conclusion: $e^{tX}$は可積分で、$E[e^{tX}]=\exp(r(e^t-1))$である。
  answer: |
    $r\geq 0$、$t$を実数とし、$X$をパラメータ$r$のポアソン分布に従う確率変数とする。各$n$で
    $e^{tn}\cdot\frac{e^{-r}r^n}{n!}=e^{-r}\frac{(re^t)^n}{n!}$
    である。指数関数のテイラー展開より右辺の和は$e^{-r}\exp(re^t)=\exp(r(e^t-1))$に収束する。非負項の級数が収束するので$e^{tX}$は可積分で、期待値はこの和である。
  strategy: Combine the factors into (r e^t)^n / n! and sum the exponential series.
  sketch:
  - 'derive: The n-th term equals e^{-r} (r e^t)^n / n!.'
  - 'apply_theorem: The exponential series sums to exp(r e^t).'
  - 'conclude: Nonnegative terms give integrability and the value exp(r(e^t - 1)).'
  openmath: (forall (r t) (-> (and (>= r 0) (in t R)) (and (integrable_rv (exp (* t identity_rv)) (poisson_measure r)) (= (mgf (poisson_measure r) identity_rv t) (exp (* r (- (exp t) 1)))))))
  hard_negative:
    statement: ポアソン分布の積率母関数は$\exp(r(e^t-1))$であり、$t<\log 2$でしか有限でない。
    reason: 級数$\sum(re^t)^n/n!$はすべての実数$t$で収束する。有限なのは全実数上である。
  target: |
    ∀ (r : NNReal) (t : ℝ), MeasureTheory.Integrable (fun n : ℕ => Real.exp (t * (n : ℝ))) (ProbabilityTheory.poissonMeasure r) ∧ ProbabilityTheory.mgf (fun n : ℕ => (n : ℝ)) (ProbabilityTheory.poissonMeasure r) t = Real.exp ((r : ℝ) * (Real.exp t - 1))
  proof: |
    by
      intro r t
      have h0 : HasSum (fun n : ℕ => ((r : ℝ) * Real.exp t) ^ n / (n.factorial : ℝ)) (Real.exp ((r : ℝ) * Real.exp t)) := by
        have := NormedSpace.expSeries_div_hasSum_exp ((r : ℝ) * Real.exp t)
        rwa [← Real.exp_eq_exp_ℝ] at this
      have h1 : HasSum (fun n : ℕ => Real.exp (-(r : ℝ)) * (r : ℝ) ^ n / (n.factorial : ℝ) * Real.exp (t * (n : ℝ))) (Real.exp ((r : ℝ) * (Real.exp t - 1))) := by
        have := h0.mul_left (Real.exp (-(r : ℝ)))
        have hv : Real.exp ((r : ℝ) * (Real.exp t - 1)) = Real.exp (-(r : ℝ)) * Real.exp ((r : ℝ) * Real.exp t) := by
          rw [← Real.exp_add]; congr 1; ring
        rw [hv]
        refine Eq.mpr (congrArg (fun f : ℕ → ℝ => HasSum f _) (funext fun n => ?_)) this
        rw [mul_comm t, Real.exp_nat_mul, mul_pow]
        ring
      have hint : MeasureTheory.Integrable (fun n : ℕ => Real.exp (t * (n : ℝ))) (ProbabilityTheory.poissonMeasure r) := by
        rw [ProbabilityTheory.integrable_poissonMeasure_iff]
        simpa only [Real.norm_eq_abs, abs_of_pos (Real.exp_pos _)] using h1.summable
      refine ⟨hint, ?_⟩
      have h2 := ProbabilityTheory.hasSum_integral_poissonMeasure hint
      simp only [smul_eq_mul] at h2
      exact h2.unique h1
- id: geometric_pmf_sum_one
  kind: gap
  level: 2
  topic: 確率分布・幾何分布の確率質量
  statement: 成功確率$p\in(0,1]$の幾何分布を、最初の成功までの失敗回数の分布として$\mathbb{N}=\{0,1,\dots\}$上にとる。各$n$の確率は$(1-p)^np$であり、総和は$1$に収束する。ただし$0^0=1$とする。
  statement_en: For p in (0,1], the geometric distribution on the natural numbers, counting failures before the first success, gives mass (1-p)^n p to n, with 0^0 = 1, and these masses sum to 1.
  assumptions:
  - $0<p\leq 1$
  - 幾何分布は$\{0,1,2,\dots\}$上で失敗回数を数える
  - $0^0=1$とする
  quantifiers:
  - 任意の$p\in(0,1]$と$n\in\mathbb{N}$
  conclusion: $\mathrm{Geom}(p)(\{n\})=(1-p)^np$であり、$\sum_{n\geq 0}(1-p)^np=1$である。
  answer: |
    $0<p\leq 1$とする。幾何分布$\mathrm{Geom}(p)$は各$n\in\mathbb{N}$に質量$(1-p)^np$を与える測度として定義されるので、$\mathrm{Geom}(p)(\{n\})=(1-p)^np$である。

    $0\leq 1-p<1$なので等比級数の和の公式より$\sum_{n\geq 0}(1-p)^n=1/(1-(1-p))=1/p$である。両辺に$p$を掛けると総和は$1$である。
  strategy: Read the mass from the definition and sum the geometric series.
  sketch:
  - 'setup: The measure puts mass (1-p)^n p at n.'
  - 'apply_theorem: Since 0 ≤ 1-p < 1 the geometric series sums to 1/p.'
  - 'conclude: Multiplying by p gives total mass 1.'
  openmath: (forall (p n) (-> (and (< 0 p) (<= p 1) (in n N)) (and (= (prob (geometric_measure p) (singleton_set n)) (* (^ (- 1 p) n) p)) (series_has_sum (lambda (k) (* (^ (- 1 p) k) p)) 1))))
  hard_negative:
    statement: $p=0$でも$\sum_{n\geq 0}(1-p)^np=1$である。
    reason: $p=0$ではすべての項が$0$なので和は$0$である。
  target: |
    ∀ (p : unitInterval), p ≠ 0 → (∀ n : ℕ, (ProbabilityTheory.geometricMeasure p).real {n} = (1 - (p : ℝ)) ^ n * (p : ℝ)) ∧ HasSum (fun n : ℕ => (1 - (p : ℝ)) ^ n * (p : ℝ)) 1
  proof: |
    by
      intro p hp
      exact ⟨ProbabilityTheory.geometricMeasure_real_singleton hp, ProbabilityTheory.hasSum_one_geometricMeasure hp⟩
- id: geometric_tail_memoryless
  kind: gap
  level: 2
  topic: 確率分布・幾何分布の裾と無記憶性
  statement: 成功確率$p\in(0,1]$の幾何分布（$\{0,1,\dots\}$上で失敗回数を数える）に従う$X$について、$P(X\geq k)=(1-p)^k$である。さらに$p<1$なら、自然数$m,n$について$P(X\geq m+n\mid X\geq m)=P(X\geq n)$である。
  statement_en: If X is geometric with success probability p in (0,1], counting failures on the natural numbers, then P(X ≥ k) = (1-p)^k; if moreover p < 1, then P(X ≥ m+n | X ≥ m) = P(X ≥ n) for all natural numbers m and n.
  assumptions:
  - $0<p\leq 1$
  - $X$は$\{0,1,\dots\}$上の幾何分布に従う
  - 無記憶性では$p<1$
  quantifiers:
  - 任意の自然数$k,m,n$
  conclusion: $P(X\geq k)=(1-p)^k$であり、$p<1$なら$P(X\geq m+n\mid X\geq m)=P(X\geq n)$である。
  answer: |
    $0<p\leq 1$とし、$X$を$P(X=n)=(1-p)^np$を満たす確率変数とする。$k$についての帰納法で$P(X\geq k)=(1-p)^k$を示す。$k=0$では確率の総和が$1$である。$\{X\geq k\}$は$\{X=k\}$と$\{X\geq k+1\}$の非交和なので、
    $P(X\geq k+1)=(1-p)^k-(1-p)^kp=(1-p)^{k+1}$
    である。

    $p<1$とする。$P(X\geq m)=(1-p)^m>0$なので条件付き確率が定まる。$\{X\geq m+n\}\subset\{X\geq m\}$より
    $P(X\geq m+n\mid X\geq m)=\frac{(1-p)^{m+n}}{(1-p)^m}=(1-p)^n=P(X\geq n)$
    である。
  strategy: Induct on k by splitting off the atom at k, then divide the tail formulas.
  sketch:
  - 'induction: The tail at 0 is 1 and P(X ≥ k+1) = P(X ≥ k) - P(X = k).'
  - 'derive: Hence P(X ≥ k) = (1-p)^k.'
  - 'derive: For p < 1 the conditioning event has positive probability and contains the event {X ≥ m+n}.'
  - 'conclude: The quotient of tails is (1-p)^n.'
  openmath: (forall (p k m n) (-> (and (< 0 p) (<= p 1) (in k N) (in m N) (in n N)) (and (= (prob (geometric_measure p) (half_line_right k)) (^ (- 1 p) k)) (-> (< p 1) (= (cond_prob (geometric_measure p) (half_line_right (+ m n)) (half_line_right m)) (prob (geometric_measure p) (half_line_right n)))))))
  hard_negative:
    statement: $p=1$でも$P(X\geq 2\mid X\geq 1)=P(X\geq 1)$が条件付き確率の通常の定義で成り立つ。
    reason: $p=1$なら$X=0$が確率$1$で成り立ち$P(X\geq 1)=0$となるので、$X\geq 1$を条件とする条件付き確率は定義できない。
  target: |
    ∀ (p : unitInterval), p ≠ 0 → (∀ k : ℕ, (ProbabilityTheory.geometricMeasure p).real (Set.Ici k) = (1 - (p : ℝ)) ^ k) ∧ (p ≠ 1 → ∀ m n : ℕ, (ProbabilityTheory.cond (ProbabilityTheory.geometricMeasure p) (Set.Ici m)).real (Set.Ici (m + n)) = (ProbabilityTheory.geometricMeasure p).real (Set.Ici n))
  proof: |
    by
      intro p hp
      have tail : ∀ k : ℕ, (ProbabilityTheory.geometricMeasure p).real (Set.Ici k) = (1 - (p : ℝ)) ^ k := by
        intro k
        induction k with
        | zero =>
          have : Set.Ici (0 : ℕ) = Set.univ := by ext; simp
          rw [this]; simp
        | succ k ih =>
          have hu : Set.Ici k = {k} ∪ Set.Ici (k + 1) := by
            ext n; simp only [Set.mem_Ici, Set.mem_union, Set.mem_singleton_iff]; omega
          have hd : Disjoint ({k} : Set ℕ) (Set.Ici (k + 1)) := by
            rw [Set.disjoint_singleton_left]; simp
          have := MeasureTheory.measureReal_union (μ := ProbabilityTheory.geometricMeasure p) hd measurableSet_Ici
          rw [← hu, ih, ProbabilityTheory.geometricMeasure_real_singleton hp] at this
          rw [pow_succ]
          linarith
      refine ⟨tail, fun hp1 m n => ?_⟩
      have hq : (0 : ℝ) < 1 - (p : ℝ) := by
        have : (p : ℝ) < 1 := lt_of_le_of_ne p.2.2 (fun h => hp1 (Subtype.ext h))
        linarith
      have hinter : Set.Ici m ∩ Set.Ici (m + n) = Set.Ici (m + n) := by
        ext x; simp only [Set.mem_inter_iff, Set.mem_Ici]; omega
      rw [MeasureTheory.measureReal_def, ProbabilityTheory.cond_apply measurableSet_Ici, hinter, ENNReal.toReal_mul, ENNReal.toReal_inv, ← MeasureTheory.measureReal_def, ← MeasureTheory.measureReal_def, tail, tail, tail, pow_add]
      field_simp
- id: geometric_mean_variance
  kind: textbook
  level: 2
  topic: 確率分布・幾何分布の平均と分散
  statement: 成功確率$p\in(0,1]$の幾何分布（$\{0,1,\dots\}$上で失敗回数を数える）に従う$X$は2乗可積分であり、$E[X]=(1-p)/p$、$V[X]=(1-p)/p^2$である。
  statement_en: A random variable with the geometric distribution of success probability p in (0,1], counting failures on the natural numbers, is square-integrable with mean (1-p)/p and variance (1-p)/p².
  assumptions:
  - $0<p\leq 1$
  - $X$は$\{0,1,\dots\}$上の幾何分布に従う
  quantifiers:
  - 任意の$p\in(0,1]$
  conclusion: $X$は2乗可積分で、$E[X]=(1-p)/p$、$V[X]=(1-p)/p^2$である。
  answer: |
    $0<p\leq 1$、$q=1-p$とし、$X$を$P(X=n)=q^np$を満たす確率変数とする。$0\leq q<1$なので、等比級数$\sum_{n\geq 0}q^n=1/(1-q)$は項別微分でき、
    $\sum_{n\geq 0}nq^n=\frac{q}{(1-q)^2},\qquad\sum_{n\geq 0}n(n-1)q^n=\frac{2q^2}{(1-q)^3}$
    である。$1-q=p$を代入して$p$を掛けると、$\sum nq^np=q/p$、$\sum n(n-1)q^np=2q^2/p^2$を得る。

    $n^2=n(n-1)+n$より$\sum n^2q^np=2q^2/p^2+q/p$であり、非負項の級数が収束するので$X$は2乗可積分である。よって$E[X]=q/p$であり、
    $V[X]=\frac{2q^2}{p^2}+\frac{q}{p}-\frac{q^2}{p^2}=\frac{q^2+qp}{p^2}=\frac{q(q+p)}{p^2}=\frac{q}{p^2}$
    である。
  strategy: Differentiate the geometric series twice to get E[X] and E[X(X-1)].
  sketch:
  - 'apply_theorem: Termwise differentiation gives the sums of n q^n and n(n-1) q^n.'
  - 'derive: Multiplying by p gives E[X] = q/p and E[X(X-1)] = 2q²/p².'
  - 'derive: The series for E[X²] converges, so X is square-integrable.'
  - 'conclude: The variance simplifies to q/p² using p + q = 1.'
  openmath: (forall (p) (-> (and (< 0 p) (<= p 1)) (and (square_integrable_rv identity_rv (geometric_measure p)) (= (expectation (geometric_measure p) identity_rv) (/ (- 1 p) p)) (= (variance (geometric_measure p) identity_rv) (/ (- 1 p) (^ p 2))))))
  hard_negative:
    statement: この幾何分布の平均は$1/p$である。
    reason: $\{0,1,\dots\}$上で失敗回数を数えるので平均は$(1-p)/p$である。$p=1$では$X=0$となり平均は$0$であって$1/p=1$ではない。$1/p$は成功までの試行回数の平均である。
  target: |
    ∀ (p : unitInterval), p ≠ 0 → MeasureTheory.MemLp (fun n : ℕ => (n : ℝ)) 2 (ProbabilityTheory.geometricMeasure p) ∧ ∫ n : ℕ, (n : ℝ) ∂(ProbabilityTheory.geometricMeasure p) = (1 - (p : ℝ)) / (p : ℝ) ∧ ProbabilityTheory.variance (fun n : ℕ => (n : ℝ)) (ProbabilityTheory.geometricMeasure p) = (1 - (p : ℝ)) / (p : ℝ) ^ 2
  proof: |
    by
      intro p hp
      have hp0 : (0 : ℝ) < (p : ℝ) := lt_of_le_of_ne p.2.1 (fun h => hp (Subtype.ext h.symm))
      set q : ℝ := 1 - (p : ℝ) with hq
      have hq0 : 0 ≤ q := by rw [hq]; linarith [p.2.2]
      have hq1 : q < 1 := by rw [hq]; linarith
      have hn : ‖q‖ < 1 := by rw [Real.norm_eq_abs, abs_of_nonneg hq0]; exact hq1
      have hpq : (p : ℝ) = 1 - q := by rw [hq]; ring
      have h1 : HasSum (fun n : ℕ => q ^ n * (p : ℝ) * (n : ℝ)) (q / (p : ℝ)) := by
        have := (hasSum_coe_mul_geometric_of_norm_lt_one hn).mul_right (p : ℝ)
        have hv : q / (p : ℝ) = q / (1 - q) ^ 2 * (p : ℝ) := by rw [← hpq]; field_simp
        rw [hv]
        refine Eq.mpr (congrArg (fun f : ℕ → ℝ => HasSum f _) (funext fun n => ?_)) this
        ring
      have hch : HasSum (fun n : ℕ => ((n + 2).choose 2 : ℝ) * q ^ n) (1 / (1 - q) ^ (2 + 1)) := hasSum_choose_mul_geometric_of_norm_lt_one 2 hn
      have h3 : HasSum (fun n : ℕ => q ^ n * (p : ℝ) * ((n : ℝ) * ((n : ℝ) - 1))) (2 * q ^ 2 / (p : ℝ) ^ 2) := by
        rw [← hasSum_nat_add_iff' 2]
        simp only [Finset.sum_range_succ, Finset.range_zero, Finset.sum_empty]
        norm_num
        have := hch.mul_left (2 * q ^ 2 * (p : ℝ))
        have hv : 2 * q ^ 2 / (p : ℝ) ^ 2 = 2 * q ^ 2 * (p : ℝ) * (1 / (1 - q) ^ (2 + 1)) := by rw [← hpq]; field_simp
        rw [hv]
        refine Eq.mpr (congrArg (fun f : ℕ → ℝ => HasSum f _) (funext fun n => ?_)) this
        have hc : ((n + 2).choose 2 : ℝ) = ((n : ℝ) + 2) * ((n : ℝ) + 1) / 2 := by
          rw [Nat.cast_choose_two]; push_cast; ring
        rw [hc]
        push_cast
        ring
      have h4 : HasSum (fun n : ℕ => q ^ n * (p : ℝ) * (n : ℝ) ^ 2) (2 * q ^ 2 / (p : ℝ) ^ 2 + q / (p : ℝ)) := by
        refine Eq.mpr (congrArg (fun f : ℕ → ℝ => HasSum f _) (funext fun n => ?_)) (h3.add h1)
        ring
      have hint1 : MeasureTheory.Integrable (fun n : ℕ => (n : ℝ)) (ProbabilityTheory.geometricMeasure p) := by
        rw [ProbabilityTheory.integrable_geometricMeasure_iff hp]
        simpa only [Real.norm_natCast] using h1.summable
      have hint2 : MeasureTheory.Integrable (fun n : ℕ => (n : ℝ) ^ 2) (ProbabilityTheory.geometricMeasure p) := by
        rw [ProbabilityTheory.integrable_geometricMeasure_iff hp]
        simpa only [norm_pow, Real.norm_natCast] using h4.summable
      have hL : MeasureTheory.MemLp (fun n : ℕ => (n : ℝ)) 2 (ProbabilityTheory.geometricMeasure p) :=
        (MeasureTheory.memLp_two_iff_integrable_sq (MeasureTheory.AEStronglyMeasurable.of_discrete)).mpr hint2
      have e1 := ProbabilityTheory.hasSum_integral_geometricMeasure hp hint1
      have e2 := ProbabilityTheory.hasSum_integral_geometricMeasure hp hint2
      simp only [smul_eq_mul] at e1 e2
      have e1' := e1.unique h1
      have e2' := e2.unique h4
      refine ⟨hL, e1', ?_⟩
      rw [ProbabilityTheory.variance_eq_sub hL]
      simp only [Pi.pow_apply]
      rw [e1', e2']
      have hq2 : q = 1 - (p : ℝ) := rfl
      field_simp
      rw [hq2]
      ring
- id: geometric_mgf
  kind: textbook
  level: 2
  topic: 確率分布・幾何分布の積率母関数
  statement: 成功確率$p\in(0,1]$の幾何分布（$\{0,1,\dots\}$上で失敗回数を数える）に従う$X$と、$(1-p)e^t<1$を満たす実数$t$について、$e^{tX}$は可積分であり、$E[e^{tX}]=p/(1-(1-p)e^t)$である。
  statement_en: If X is geometric with success probability p in (0,1], counting failures, and t is real with (1-p)e^t < 1, then e^{tX} is integrable and E[e^{tX}] = p / (1 - (1-p) e^t).
  assumptions:
  - $0<p\leq 1$
  - $X$は$\{0,1,\dots\}$上の幾何分布に従う
  - $(1-p)e^t<1$
  quantifiers:
  - 上の条件を満たす任意の$p$と実数$t$
  conclusion: $e^{tX}$は可積分で、$E[e^{tX}]=p/(1-(1-p)e^t)$である。
  answer: |
    $0<p\leq 1$、$t$を$(1-p)e^t<1$を満たす実数とし、$X$を$P(X=n)=(1-p)^np$を満たす確率変数とする。$a=(1-p)e^t$とおくと$0\leq a<1$である。各$n$で$e^{tn}(1-p)^np=pa^n$なので、等比級数の和の公式より$\sum_{n\geq 0}e^{tn}(1-p)^np=p/(1-a)$である。非負項の級数が収束するので$e^{tX}$は可積分で、期待値はこの和である。
  strategy: Combine the exponential with the mass to get a geometric series with ratio (1-p)e^t.
  sketch:
  - 'setup: Put a = (1-p) e^t, so 0 ≤ a < 1.'
  - 'derive: The n-th term equals p a^n.'
  - 'conclude: The geometric series gives p / (1 - a), and nonnegativity gives integrability.'
  openmath: (forall (p t) (-> (and (< 0 p) (<= p 1) (in t R) (< (* (- 1 p) (exp t)) 1)) (and (integrable_rv (exp (* t identity_rv)) (geometric_measure p)) (= (mgf (geometric_measure p) identity_rv t) (/ p (- 1 (* (- 1 p) (exp t))))))))
  hard_negative:
    statement: 幾何分布の$e^{tX}$はすべての実数$t$で可積分である。
    reason: $p=1/2$、$t=\log 2$なら$e^{tn}(1-p)^np=1/2$となり、和は発散する。
  target: |
    ∀ (p : unitInterval) (t : ℝ), p ≠ 0 → (1 - (p : ℝ)) * Real.exp t < 1 → MeasureTheory.Integrable (fun n : ℕ => Real.exp (t * (n : ℝ))) (ProbabilityTheory.geometricMeasure p) ∧ ProbabilityTheory.mgf (fun n : ℕ => (n : ℝ)) (ProbabilityTheory.geometricMeasure p) t = (p : ℝ) / (1 - (1 - (p : ℝ)) * Real.exp t)
  proof: |
    by
      intro p t hp hq
      have hnn : 0 ≤ (1 - (p : ℝ)) * Real.exp t := mul_nonneg (by linarith [p.2.2]) (Real.exp_pos t).le
      have h1 : HasSum (fun n : ℕ => (1 - (p : ℝ)) ^ n * (p : ℝ) * Real.exp (t * (n : ℝ))) ((p : ℝ) / (1 - (1 - (p : ℝ)) * Real.exp t)) := by
        have := (hasSum_geometric_of_lt_one hnn hq).mul_left (p : ℝ)
        rw [div_eq_mul_inv]
        refine Eq.mpr (congrArg (fun f : ℕ → ℝ => HasSum f _) (funext fun n => ?_)) this
        rw [mul_comm t, Real.exp_nat_mul, mul_pow]; ring
      have hint : MeasureTheory.Integrable (fun n : ℕ => Real.exp (t * (n : ℝ))) (ProbabilityTheory.geometricMeasure p) := by
        rw [ProbabilityTheory.integrable_geometricMeasure_iff hp]
        simpa only [Real.norm_eq_abs, abs_of_pos (Real.exp_pos _)] using h1.summable
      refine ⟨hint, ?_⟩
      have h2 := ProbabilityTheory.hasSum_integral_geometricMeasure hp hint
      simp only [smul_eq_mul] at h2
      exact h2.unique h1
- id: binomial_mgf
  kind: textbook
  level: 2
  topic: 確率分布・二項分布の積率母関数
  statement: 二項分布$\mathrm{Bin}(n,p)$（$0\leq p\leq 1$）に従う$X$と実数$t$について、$E[e^{tX}]=(1-p+pe^t)^n$である。
  statement_en: If X has the binomial distribution Bin(n,p) with 0 ≤ p ≤ 1, then E[e^{tX}] = (1 - p + p e^t)^n for every real t.
  assumptions:
  - $n$は自然数
  - $0\leq p\leq 1$
  - $X$は$\mathrm{Bin}(n,p)$に従う
  quantifiers:
  - 任意の$n$、$p$と実数$t$
  conclusion: $E[e^{tX}]=(1-p+pe^t)^n$である。
  answer: |
    $n$を自然数、$0\leq p\leq 1$、$t$を実数とし、$X$を$\mathrm{Bin}(n,p)$に従う確率変数とする。$X$の値は$0,\dots,n$で、$P(X=k)=\binom{n}{k}p^k(1-p)^{n-k}$である。有限和なので可積分性の問題はなく、二項定理より
    $E[e^{tX}]=\sum_{k=0}^n\binom{n}{k}(pe^t)^k(1-p)^{n-k}=(pe^t+1-p)^n$
    である。
  strategy: Write the expectation as a finite sum and apply the binomial theorem.
  sketch:
  - 'setup: X takes values 0,...,n with the binomial masses.'
  - 'derive: The expectation is the sum of C(n,k) (p e^t)^k (1-p)^(n-k).'
  - 'apply_theorem: The binomial theorem gives (p e^t + 1 - p)^n.'
  openmath: (forall (n p t) (-> (and (in n N) (<= 0 p) (<= p 1) (in t R)) (= (mgf (binomial_measure n p) identity_rv t) (^ (+ (- 1 p) (* p (exp t))) n))))
  hard_negative:
    statement: 二項分布の積率母関数は$1-p+pe^{nt}$である。
    reason: $n=2$、$p=1/2$、$t=\log 2$なら$E[e^{tX}]=(3/2)^2=9/4$であり、$1/2+2=5/2$と異なる。
  target: |
    ∀ (n : ℕ) (p : unitInterval) (t : ℝ), ProbabilityTheory.mgf (fun k : ℕ => (k : ℝ)) (ProbabilityTheory.binomial n p) t = (1 - (p : ℝ) + (p : ℝ) * Real.exp t) ^ n
  proof: |
    by
      intro n p t
      rw [ProbabilityTheory.mgf, ProbabilityTheory.integral_binomial, add_comm (1 - (p : ℝ)), add_pow]
      rw [show Finset.Iic n = Finset.range (n + 1) by ext; simp]
      refine Finset.sum_congr rfl fun k _ => ?_
      rw [smul_eq_mul, mul_comm t, Real.exp_nat_mul, mul_pow]
      ring
- id: gamma_moment
  kind: gap
  level: 2
  topic: 確率分布・ガンマ分布のモーメント
  statement: 形状$a>0$、レート$r>0$のガンマ分布（密度$\frac{r^a}{\Gamma(a)}x^{a-1}e^{-rx}$、$x\geq 0$）に従う$X$と実数$s\geq 0$について、$X^s$は可積分であり、$E[X^s]=\Gamma(a+s)/(\Gamma(a)r^s)$である。
  statement_en: If X has the gamma distribution with shape a > 0 and rate r > 0, with density r^a/Γ(a) x^{a-1} e^{-rx} on x ≥ 0, then for real s ≥ 0 the variable X^s is integrable and E[X^s] = Γ(a+s)/(Γ(a) r^s).
  assumptions:
  - $a>0$、$r>0$
  - $s\geq 0$
  - $X$は形状$a$、レート$r$のガンマ分布に従う
  quantifiers:
  - 任意の$a,r>0$と$s\geq 0$
  conclusion: $X^s$は可積分で、$E[X^s]=\Gamma(a+s)/(\Gamma(a)r^s)$である。
  answer: |
    $a,r>0$、$s\geq 0$とし、$X$を形状$a$、レート$r$のガンマ分布に従う確率変数とする。$X$は確率$1$で正である。$x>0$では
    $x^s\cdot\frac{r^a}{\Gamma(a)}x^{a-1}e^{-rx}=\frac{\Gamma(a+s)}{\Gamma(a)r^s}\cdot\frac{r^{a+s}}{\Gamma(a+s)}x^{a+s-1}e^{-rx}$
    である。右辺の後ろの因子は形状$a+s$、レート$r$のガンマ分布の密度で、$a+s>0$なので積分は$1$である。したがって被積分関数は可積分であり、$E[X^s]=\Gamma(a+s)/(\Gamma(a)r^s)$である。
  strategy: Recognize x^s times the density as a constant multiple of the gamma density with shape a+s.
  sketch:
  - 'setup: X is almost surely positive, so work with x > 0.'
  - 'derive: x^s times the density is Γ(a+s)/(Γ(a) r^s) times the gamma density with shape a+s.'
  - 'conclude: That density integrates to 1, giving integrability and the value.'
  openmath: (forall (a r s) (-> (and (> a 0) (> r 0) (>= s 0)) (and (integrable_rv (^ identity_rv s) (gamma_measure a r)) (= (expectation (gamma_measure a r) (^ identity_rv s)) (/ (gamma_fn (+ a s)) (* (gamma_fn a) (^ r s)))))))
  hard_negative:
    statement: $E[X^s]=\Gamma(a+s)/\Gamma(a)$である。
    reason: $a=1$、$r=2$、$s=1$なら平均は$1/2$であり、$\Gamma(2)/\Gamma(1)=1$と異なる。レートの因子$r^{-s}$が要る。
  target: |
    ∀ (a r s : ℝ), 0 < a → 0 < r → 0 ≤ s → MeasureTheory.Integrable (fun x : ℝ => x ^ s) (ProbabilityTheory.gammaMeasure a r) ∧ ∫ x, x ^ s ∂(ProbabilityTheory.gammaMeasure a r) = Real.Gamma (a + s) / (Real.Gamma a * r ^ s)
  proof: |
    by
      have pdf_int : ∀ a r : ℝ, 0 < a → 0 < r → MeasureTheory.Integrable (ProbabilityTheory.gammaPDFReal a r) ∧ ∫ x, ProbabilityTheory.gammaPDFReal a r x = 1 := by
        intro a r ha hr
        have e : ProbabilityTheory.gammaPDFReal a r = fun x => (ProbabilityTheory.gammaPDF a r x).toReal := by
          funext x
          rw [ProbabilityTheory.gammaPDF, ENNReal.toReal_ofReal (ProbabilityTheory.gammaPDFReal_nonneg ha hr x)]
        have hm : Measurable (ProbabilityTheory.gammaPDF a r) := (ProbabilityTheory.measurable_gammaPDFReal a r).ennreal_ofReal
        rw [e]
        refine ⟨MeasureTheory.integrable_toReal_of_lintegral_ne_top hm.aemeasurable ?_, ?_⟩
        · rw [ProbabilityTheory.lintegral_gammaPDF_eq_one ha hr]; exact ENNReal.one_ne_top
        · rw [MeasureTheory.integral_toReal hm.aemeasurable (Filter.Eventually.of_forall fun x => ENNReal.ofReal_lt_top), ProbabilityTheory.lintegral_gammaPDF_eq_one ha hr]; rfl
      have key_int : ∀ (a r : ℝ) (g : ℝ → ℝ), 0 < a → 0 < r → (MeasureTheory.Integrable g (ProbabilityTheory.gammaMeasure a r) ↔ MeasureTheory.Integrable (fun x => ProbabilityTheory.gammaPDFReal a r x * g x)) ∧ ∫ x, g x ∂(ProbabilityTheory.gammaMeasure a r) = ∫ x, ProbabilityTheory.gammaPDFReal a r x * g x := by
        intro a r g ha hr
        have e : ∀ x, (ProbabilityTheory.gammaPDF a r x).toReal = ProbabilityTheory.gammaPDFReal a r x := fun x => by
          rw [ProbabilityTheory.gammaPDF, ENNReal.toReal_ofReal (ProbabilityTheory.gammaPDFReal_nonneg ha hr x)]
        have hm : Measurable (ProbabilityTheory.gammaPDF a r) := (ProbabilityTheory.measurable_gammaPDFReal a r).ennreal_ofReal
        constructor
        · rw [ProbabilityTheory.gammaMeasure, MeasureTheory.integrable_withDensity_iff_integrable_smul₀' hm.aemeasurable (Filter.Eventually.of_forall fun x => ENNReal.ofReal_lt_top)]
          simp only [e, smul_eq_mul]
        · rw [ProbabilityTheory.gammaMeasure, integral_withDensity_eq_integral_toReal_smul₀ hm.aemeasurable (Filter.Eventually.of_forall fun x => ENNReal.ofReal_lt_top)]
          simp only [e, smul_eq_mul]
      have mom : ∀ (a r s : ℝ), 0 < a → 0 < r → 0 ≤ s → MeasureTheory.Integrable (fun x : ℝ => x ^ s) (ProbabilityTheory.gammaMeasure a r) ∧ ∫ x, x ^ s ∂(ProbabilityTheory.gammaMeasure a r) = Real.Gamma (a + s) / (Real.Gamma a * r ^ s) := by
        intro a r s ha hr hs
        have has : 0 < a + s := by linarith
        have hGa := Real.Gamma_pos_of_pos ha
        have hrs : 0 < r ^ s := Real.rpow_pos_of_pos hr s
