  answer: |
    $r>0$とし、$X$を密度$re^{-rx}$（$x\geq 0$）をもつ確率変数とする。置換$u=rx$とガンマ関数の定義より
    $E[X]=\int_0^\infty xre^{-rx}\,dx=\frac{1}{r}\int_0^\infty ue^{-u}\,du=\frac{\Gamma(2)}{r}=\frac{1}{r}$
