  statement: レート$r>0$の指数分布に従う$X$は2乗可積分であり、$E[X]=1/r$、$V[X]=1/r^2$である。
  statement_en: An exponential random variable with rate r > 0 is square-integrable with mean 1/r and variance 1/r².
  assumptions:
  - $r>0$
