- id: gamma_mean_variance
  kind: textbook
  level: 2
  topic: 確率分布・ガンマ分布の平均と分散
  statement: 形状$a>0$、レート$r>0$のガンマ分布に従う$X$は2乗可積分であり、$E[X]=a/r$、$V[X]=a/r^2$である。
  statement_en: A random variable with the gamma distribution of shape a > 0 and rate r > 0 is square-integrable with mean a/r and variance a/r².
  assumptions:
  - $a>0$、$r>0$
  - $X$は形状$a$、レート$r$のガンマ分布に従う
  quantifiers:
  - 任意の$a,r>0$
  conclusion: $X$は2乗可積分で、$E[X]=a/r$、$V[X]=a/r^2$である。
  answer: |
    $a,r>0$とし、$X$を形状$a$、レート$r$のガンマ分布に従う確率変数とする。$s\geq 0$に対し、$x^s$と密度の積は形状$a+s$、レート$r$の密度の$\Gamma(a+s)/(\Gamma(a)r^s)$倍である。その密度の積分は$1$なので、$X^s$は可積分で$E[X^s]=\Gamma(a+s)/(\Gamma(a)r^s)$である。

    $\Gamma(a+1)=a\Gamma(a)$より$E[X]=a/r$である。$\Gamma(a+2)=(a+1)a\Gamma(a)$より$E[X^2]=a(a+1)/r^2<\infty$なので$X$は2乗可積分である。したがって$V[X]=a(a+1)/r^2-a^2/r^2=a/r^2$である。
  strategy: Use the moment formula at s = 1, 2 and the recurrence of the Gamma function.
  sketch:
  - 'derive: x^s times the density is a constant multiple of the density with shape a+s.'
  - 'apply_theorem: Gamma(a+1) = a Gamma(a) gives E[X] = a/r.'
  - 'derive: Applying the recurrence twice gives E[X²] = a(a+1)/r².'
  - 'conclude: The variance is a/r².'
  openmath: (forall (a r) (-> (and (> a 0) (> r 0)) (and (square_integrable_rv identity_rv (gamma_measure a r)) (= (expectation (gamma_measure a r) identity_rv) (/ a r)) (= (variance (gamma_measure a r) identity_rv) (/ a (^ r 2))))))
  hard_negative:
    statement: レート$r$のガンマ分布の平均は$ar$である。
    reason: $a=1$、$r=2$の指数分布の平均は$1/2$であり、$ar=2$ではない。$ar$は$r$を尺度母数とした場合の式である。
  target: |
    ∀ (a r : ℝ), 0 < a → 0 < r → MeasureTheory.MemLp (fun x : ℝ => x) 2 (ProbabilityTheory.gammaMeasure a r) ∧ ∫ x, x ∂(ProbabilityTheory.gammaMeasure a r) = a / r ∧ ProbabilityTheory.variance (fun x : ℝ => x) (ProbabilityTheory.gammaMeasure a r) = a / r ^ 2
  proof: |
    by
      have pdf_int : ∀ a r : ℝ, 0 < a → 0 < r → MeasureTheory.Integrable (ProbabilityTheory.gammaPDFReal a r) ∧ ∫ x, ProbabilityTheory.gammaPDFReal a r x = 1 := by
        intro a r ha hr
        have e : ProbabilityTheory.gammaPDFReal a r = fun x => (ProbabilityTheory.gammaPDF a r x).toReal := by
          funext x
          rw [ProbabilityTheory.gammaPDF, ENNReal.toReal_ofReal (ProbabilityTheory.gammaPDFReal_nonneg ha hr x)]
        have hm : Measurable (ProbabilityTheory.gammaPDF a r) := (ProbabilityTheory.measurable_gammaPDFReal a r).ennreal_ofReal
        rw [e]
        refine ⟨MeasureTheory.integrable_toReal_of_lintegral_ne_top hm.aemeasurable ?_, ?_⟩
        · rw [ProbabilityTheory.lintegral_gammaPDF_eq_one ha hr]; exact ENNReal.one_ne_top
        · rw [MeasureTheory.integral_toReal hm.aemeasurable (Filter.Eventually.of_forall fun x => ENNReal.ofReal_lt_top), ProbabilityTheory.lintegral_gammaPDF_eq_one ha hr]; rfl
      have key_int : ∀ (a r : ℝ) (g : ℝ → ℝ), 0 < a → 0 < r → (MeasureTheory.Integrable g (ProbabilityTheory.gammaMeasure a r) ↔ MeasureTheory.Integrable (fun x => ProbabilityTheory.gammaPDFReal a r x * g x)) ∧ ∫ x, g x ∂(ProbabilityTheory.gammaMeasure a r) = ∫ x, ProbabilityTheory.gammaPDFReal a r x * g x := by
        intro a r g ha hr
        have e : ∀ x, (ProbabilityTheory.gammaPDF a r x).toReal = ProbabilityTheory.gammaPDFReal a r x := fun x => by
          rw [ProbabilityTheory.gammaPDF, ENNReal.toReal_ofReal (ProbabilityTheory.gammaPDFReal_nonneg ha hr x)]
        have hm : Measurable (ProbabilityTheory.gammaPDF a r) := (ProbabilityTheory.measurable_gammaPDFReal a r).ennreal_ofReal
        constructor
        · rw [ProbabilityTheory.gammaMeasure, MeasureTheory.integrable_withDensity_iff_integrable_smul₀' hm.aemeasurable (Filter.Eventually.of_forall fun x => ENNReal.ofReal_lt_top)]
          simp only [e, smul_eq_mul]
        · rw [ProbabilityTheory.gammaMeasure, integral_withDensity_eq_integral_toReal_smul₀ hm.aemeasurable (Filter.Eventually.of_forall fun x => ENNReal.ofReal_lt_top)]
          simp only [e, smul_eq_mul]
      have mom : ∀ (a r s : ℝ), 0 < a → 0 < r → 0 ≤ s → MeasureTheory.Integrable (fun x : ℝ => x ^ s) (ProbabilityTheory.gammaMeasure a r) ∧ ∫ x, x ^ s ∂(ProbabilityTheory.gammaMeasure a r) = Real.Gamma (a + s) / (Real.Gamma a * r ^ s) := by
        intro a r s ha hr hs
        have has : 0 < a + s := by linarith
        have hGa := Real.Gamma_pos_of_pos ha
        have hrs : 0 < r ^ s := Real.rpow_pos_of_pos hr s
        have e : (fun x : ℝ => ProbabilityTheory.gammaPDFReal a r x * x ^ s) =ᵐ[MeasureTheory.volume] fun x => (Real.Gamma (a + s) / (Real.Gamma a * r ^ s)) * ProbabilityTheory.gammaPDFReal (a + s) r x := by
          have hne : ∀ᵐ x : ℝ, x ≠ 0 := by simp [MeasureTheory.ae_iff]
          filter_upwards [hne] with x hx0
          by_cases hx : 0 ≤ x
          · have hxp : 0 < x := lt_of_le_of_ne hx (Ne.symm hx0)
            have hGas := Real.Gamma_pos_of_pos has
            simp only [ProbabilityTheory.gammaPDFReal, if_pos hx]
            rw [show a + s - 1 = (a - 1) + s by ring, Real.rpow_add hxp, Real.rpow_add hr]
            field_simp
          · simp [ProbabilityTheory.gammaPDFReal, if_neg hx]
        rw [(key_int a r _ ha hr).1, (key_int a r _ ha hr).2, MeasureTheory.integrable_congr e, MeasureTheory.integral_congr_ae e]
        obtain ⟨h1, h2⟩ := pdf_int (a + s) r has hr
        refine ⟨h1.const_mul _, ?_⟩
        rw [MeasureTheory.integral_const_mul, h2, mul_one]
      intro a r ha hr
      have : MeasureTheory.IsProbabilityMeasure (ProbabilityTheory.gammaMeasure a r) := ProbabilityTheory.isProbabilityMeasure_gammaMeasure ha hr
      obtain ⟨h1, h2⟩ := mom a r 1 ha hr zero_le_one
      obtain ⟨h3, h4⟩ := mom a r 2 ha hr zero_le_two
      simp only [Real.rpow_one] at h1 h2
      simp only [Real.rpow_two] at h3 h4
      have hL : MeasureTheory.MemLp (fun x : ℝ => x) 2 (ProbabilityTheory.gammaMeasure a r) :=
        (MeasureTheory.memLp_two_iff_integrable_sq measurable_id.aestronglyMeasurable).mpr h3
      have hG := Real.Gamma_pos_of_pos ha
      have hmean : ∫ x, x ∂(ProbabilityTheory.gammaMeasure a r) = a / r := by
        rw [h2, Real.Gamma_add_one ha.ne']
        field_simp
      refine ⟨hL, hmean, ?_⟩
      rw [ProbabilityTheory.variance_eq_sub hL]
      simp only [Pi.pow_apply]
      rw [h2, h4, Real.Gamma_add_one ha.ne', show a + 2 = (a + 1) + 1 by ring, Real.Gamma_add_one (by positivity), Real.Gamma_add_one ha.ne']
      have := Real.Gamma_pos_of_pos ha
      field_simp
      ring
- id: gamma_mgf
  kind: textbook
  level: 2
  topic: 確率分布・ガンマ分布の積率母関数
  statement: 形状$a>0$、レート$r>0$のガンマ分布に従う$X$と$t<r$について、$e^{tX}$は可積分であり、$E[e^{tX}]=(r/(r-t))^a$である。
  statement_en: If X has the gamma distribution of shape a > 0 and rate r > 0 and t < r, then e^{tX} is integrable and E[e^{tX}] = (r/(r-t))^a.
  assumptions:
  - $a>0$、$r>0$
  - $t<r$
  - $X$は形状$a$、レート$r$のガンマ分布に従う
  quantifiers:
  - 任意の$a,r>0$と$t<r$
  conclusion: $e^{tX}$は可積分で、$E[e^{tX}]=(r/(r-t))^a$である。
  answer: |
    $a,r>0$、$t<r$とし、$X$を形状$a$、レート$r$のガンマ分布に従う確率変数とする。$r-t>0$である。$x\geq 0$では
    $e^{tx}\frac{r^a}{\Gamma(a)}x^{a-1}e^{-rx}=\Bigl(\frac{r}{r-t}\Bigr)^a\frac{(r-t)^a}{\Gamma(a)}x^{a-1}e^{-(r-t)x}$
    であり、$x<0$では両辺とも$0$である。右辺の後ろの因子は形状$a$、レート$r-t$のガンマ分布の密度なので積分は$1$である。よって$e^{tX}$は可積分で、$E[e^{tX}]=(r/(r-t))^a$である。
  strategy: Absorb e^{tx} into the density by changing the rate from r to r-t.
  sketch:
  - 'setup: Since t < r, the number r - t is a valid rate.'
  - 'derive: e^{tx} times the density is (r/(r-t))^a times the gamma density with rate r-t.'
  - 'conclude: That density integrates to 1, which gives integrability and the value.'
  openmath: (forall (a r t) (-> (and (> a 0) (> r 0) (< t r)) (and (integrable_rv (exp (* t identity_rv)) (gamma_measure a r)) (= (mgf (gamma_measure a r) identity_rv t) (^ (/ r (- r t)) a)))))
  hard_negative:
    statement: ガンマ分布の$e^{tX}$はすべての実数$t$で可積分である。
    reason: $a=1$、$t=r$なら被積分関数は$x\geq 0$で定数$r$となり、積分は発散する。
  target: |
    ∀ (a r t : ℝ), 0 < a → 0 < r → t < r → MeasureTheory.Integrable (fun x : ℝ => Real.exp (t * x)) (ProbabilityTheory.gammaMeasure a r) ∧ ProbabilityTheory.mgf (fun x : ℝ => x) (ProbabilityTheory.gammaMeasure a r) t = (r / (r - t)) ^ a
  proof: |
    by
      have pdf_int : ∀ a r : ℝ, 0 < a → 0 < r → MeasureTheory.Integrable (ProbabilityTheory.gammaPDFReal a r) ∧ ∫ x, ProbabilityTheory.gammaPDFReal a r x = 1 := by
        intro a r ha hr
        have e : ProbabilityTheory.gammaPDFReal a r = fun x => (ProbabilityTheory.gammaPDF a r x).toReal := by
          funext x
          rw [ProbabilityTheory.gammaPDF, ENNReal.toReal_ofReal (ProbabilityTheory.gammaPDFReal_nonneg ha hr x)]
        have hm : Measurable (ProbabilityTheory.gammaPDF a r) := (ProbabilityTheory.measurable_gammaPDFReal a r).ennreal_ofReal
        rw [e]
        refine ⟨MeasureTheory.integrable_toReal_of_lintegral_ne_top hm.aemeasurable ?_, ?_⟩
        · rw [ProbabilityTheory.lintegral_gammaPDF_eq_one ha hr]; exact ENNReal.one_ne_top
        · rw [MeasureTheory.integral_toReal hm.aemeasurable (Filter.Eventually.of_forall fun x => ENNReal.ofReal_lt_top), ProbabilityTheory.lintegral_gammaPDF_eq_one ha hr]; rfl
      have key_int : ∀ (a r : ℝ) (g : ℝ → ℝ), 0 < a → 0 < r → (MeasureTheory.Integrable g (ProbabilityTheory.gammaMeasure a r) ↔ MeasureTheory.Integrable (fun x => ProbabilityTheory.gammaPDFReal a r x * g x)) ∧ ∫ x, g x ∂(ProbabilityTheory.gammaMeasure a r) = ∫ x, ProbabilityTheory.gammaPDFReal a r x * g x := by
        intro a r g ha hr
        have e : ∀ x, (ProbabilityTheory.gammaPDF a r x).toReal = ProbabilityTheory.gammaPDFReal a r x := fun x => by
          rw [ProbabilityTheory.gammaPDF, ENNReal.toReal_ofReal (ProbabilityTheory.gammaPDFReal_nonneg ha hr x)]
        have hm : Measurable (ProbabilityTheory.gammaPDF a r) := (ProbabilityTheory.measurable_gammaPDFReal a r).ennreal_ofReal
        constructor
        · rw [ProbabilityTheory.gammaMeasure, MeasureTheory.integrable_withDensity_iff_integrable_smul₀' hm.aemeasurable (Filter.Eventually.of_forall fun x => ENNReal.ofReal_lt_top)]
          simp only [e, smul_eq_mul]
        · rw [ProbabilityTheory.gammaMeasure, integral_withDensity_eq_integral_toReal_smul₀ hm.aemeasurable (Filter.Eventually.of_forall fun x => ENNReal.ofReal_lt_top)]
          simp only [e, smul_eq_mul]
      intro a r t ha hr ht
      have hrt : 0 < r - t := by linarith
      have e : (fun x : ℝ => ProbabilityTheory.gammaPDFReal a r x * Real.exp (t * x)) = fun x => (r / (r - t)) ^ a * ProbabilityTheory.gammaPDFReal a (r - t) x := by
        funext x
        by_cases hx : 0 ≤ x
        · simp only [ProbabilityTheory.gammaPDFReal, if_pos hx]
          rw [Real.div_rpow hr.le hrt.le]
          have h1 : (r - t) ^ a ≠ 0 := (Real.rpow_pos_of_pos hrt a).ne'
          have h2 : Real.exp (-(r * x)) * Real.exp (t * x) = Real.exp (-((r - t) * x)) := by
            rw [← Real.exp_add]; congr 1; ring
          have hG := (Real.Gamma_pos_of_pos ha).ne'
