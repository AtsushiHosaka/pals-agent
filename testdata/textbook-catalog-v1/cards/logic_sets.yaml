      intro α β f A B
      exact Set.image_subset_iff
- id: injective_iff_preimage_image
  kind: gap
  level: 1
  topic: 写像・単射と逆像
  statement: 写像fが単射であることは、定義域の全ての部分集合Aについてf⁻¹(f(A))=Aが成り立つことと同値である。
  statement_en: A map f is injective if and only if f⁻¹(f(A)) = A for every subset A of its domain.
  assumptions:
    - f:α→βは写像
  quantifiers:
    - 任意の写像f
    - 同値の右辺では全ての部分集合A
  conclusion: fが単射であることと、全てのAでf⁻¹(f(A))=Aが成り立つことは同値である。
  answer: |
    fが単射とする。A⊆f⁻¹(f(A))は常に成り立つ。xがf⁻¹(f(A))に属するとf(x)=f(a)となるa∈Aがあり、単射性からx=aなのでxはAに属する。逆に等式が全てのAで成り立つとし、f(x)=f(y)とする。A={x}とおくとyはf⁻¹(f({x}))={x}に属するので、y=xである。
  strategy: Use injectivity for the forward direction and singleton sets for the converse.
  sketch:
    - "derive: A ⊆ f⁻¹(f(A)) holds for any map."
    - "apply_theorem: If f(x) = f(a) with a ∈ A, injectivity gives x = a."
    - "construct: For the converse take A = {x} when f(x) = f(y)."
    - "conclude: Then y lies in {x}, so x = y."
  openmath: (forall (f) (<-> (injective f) (forall (A) (= (preimage f (image (lambda (x) (fn_value f x)) A)) A))))
  hard_negative:
    statement: 任意の写像fについてf⁻¹(f(A))=Aが成り立つ。
    reason: 常に成り立つのは包含A⊆f⁻¹(f(A))だけである。f(x)=x², A={1}ではf⁻¹(f(A))={1,-1}となる。
  target: |
    ∀ (α β : Type*) (f : α → β), Function.Injective f ↔ ∀ A : Set α, f ⁻¹' (f '' A) = A
  proof: |
    by
      intro α β f
      constructor
      · intro h A
        exact Set.preimage_image_eq A h
      · intro h x y hxy
        have hy : y ∈ f ⁻¹' (f '' {x}) := ⟨x, rfl, hxy⟩
        rw [h {x}] at hy
        exact (Set.mem_singleton_iff.mp hy).symm
- id: surjective_iff_image_preimage
  kind: gap
  level: 1
  topic: 写像・全射と像
  statement: 写像fが全射であることは、値域側の全ての部分集合Bについてf(f⁻¹(B))=Bが成り立つことと同値である。
  statement_en: A map f is surjective if and only if f(f⁻¹(B)) = B for every subset B of its codomain.
  assumptions:
    - f:α→βは写像
  quantifiers:
    - 任意の写像f
    - 同値の右辺では全ての部分集合B
  conclusion: fが全射であることと、全てのBでf(f⁻¹(B))=Bが成り立つことは同値である。
  answer: |
    f(f⁻¹(B))⊆Bは常に成り立つ。fが全射なら、y∈Bに対しf(x)=yとなるxがあり、xはf⁻¹(B)に属するのでyはf(f⁻¹(B))に属する。逆に等式が全てのBで成り立つとき、B={y}とおくとyはf(f⁻¹({y}))に属する。よってf(x)=yとなるxが存在する。
  strategy: Use surjectivity to lift points for the forward direction, and singletons for the converse.
  sketch:
    - "derive: f(f⁻¹(B)) ⊆ B holds for any map."
    - "apply_theorem: For y ∈ B surjectivity gives x with f(x) = y."
    - "construct: For the converse take B = {y}."
    - "conclude: Then y is in the image of f⁻¹({y}), so y has a preimage."
  openmath: (forall (f) (<-> (surjective f) (forall (B) (= (image (lambda (x) (fn_value f x)) (preimage f B)) B))))
  hard_negative:
    statement: 任意の写像fについてf(f⁻¹(B))=Bが成り立つ。
    reason: 常に成り立つのは包含f(f⁻¹(B))⊆Bだけである。f(x)=x², B={-1}ではf⁻¹(B)が空なので左辺は空集合である。
  target: |
    ∀ (α β : Type*) (f : α → β), Function.Surjective f ↔ ∀ B : Set β, f '' (f ⁻¹' B) = B
  proof: |
    by
      intro α β f
      constructor
      · intro h B
        exact Set.image_preimage_eq B h
      · intro h y
        have hy : y ∈ f '' (f ⁻¹' {y}) := by
          rw [h {y}]
          exact Set.mem_singleton y
        obtain ⟨x, hx, -⟩ := hy
        exact ⟨x, hx⟩
- id: injective_comp
  kind: gap
  level: 1
  topic: 写像・単射の合成
  statement: 単射f:α→βと単射g:β→γの合成g∘fは単射である。
  statement_en: The composition g ∘ f of injective maps f and g is injective.
  assumptions:
    - f:α→βは単射
    - g:β→γは単射
  quantifiers:
    - 任意の単射f, g
  conclusion: g∘fは単射である。
  answer: |
    g(f(x))=g(f(y))とする。gが単射なのでf(x)=f(y)であり、fが単射なのでx=yである。よってg∘fは単射である。
  strategy: Cancel g first and then f.
  sketch:
    - "setup: Assume g(f(x)) = g(f(y))."
    - "apply_theorem: Injectivity of g gives f(x) = f(y)."
    - "apply_theorem: Injectivity of f gives x = y."
    - "conclude: Hence g ∘ f is injective."
  openmath: (forall (f g) (-> (and (injective f) (injective g)) (injective (fn_comp g f))))
  hard_negative:
    statement: g∘fが単射ならばgも単射である。
    reason: 単射性が従うのはfだけである。f:{0}→{0,1}を包含、g:{0,1}→{0}とするとg∘fは単射だがgは単射でない。
  target: |
    ∀ (α β γ : Type*) (f : α → β) (g : β → γ), Function.Injective f → Function.Injective g → Function.Injective (g ∘ f)
  proof: |
    by
      intro α β γ f g hf hg
      exact hg.comp hf
