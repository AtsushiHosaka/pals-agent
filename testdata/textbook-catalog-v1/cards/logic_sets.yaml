  strategy: The converse chooses a preimage of every point, which uses the axiom of choice.
  sketch:
    - "derive: y = f(g(y)) shows that f is surjective."
    - "setup: Conversely each fiber f⁻¹({y}) is nonempty."
    - "construct: Choose g(y) in each fiber by the axiom of choice."
    - "conclude: Then f(g(y)) = y for every y."
  openmath: (forall (A B f) (-> (map_between f A B) (<-> (surjective f) (exists (g) (and (map_between g B A) (forall (y) (-> (in y B) (= (fn_value f (fn_value g y)) y))))))))
  hard_negative:
    statement: 全射fの右逆写像gは一意である。
