- id: ring_hom_injective_iff_ker_bot
  kind: gap
  level: 2
  topic: 環論・環準同型と核
  statement: 可換環の間の環準同型$f:R\to S$について、$f$が単射であることと、$f$の核が零イデアルであることは同値である。
  statement_en: A ring homomorphism f between commutative rings is injective if and only if its kernel is the zero ideal.
  assumptions:
  - $R,S$は可換環
  - $f:R\to S$は環準同型
  quantifiers:
  - 任意の可換環$R,S$と環準同型$f:R\to S$
  conclusion: $f$が単射であることと$\operatorname{Ker}f=\{0\}$は同値である。
  answer: |
    $R,S$を可換環、$f:R\to S$を環準同型とし、$\operatorname{Ker}f=\{x\in R\mid f(x)=0\}$とおく。$f(0)=0$なので、つねに$0\in\operatorname{Ker}f$である。

    $f$が単射であるとする。$x\in\operatorname{Ker}f$なら$f(x)=0=f(0)$なので、$x=0$である。よって$\operatorname{Ker}f=\{0\}$である。

    逆に$\operatorname{Ker}f=\{0\}$とし、$x,y\in R$が$f(x)=f(y)$を満たすとする。$f(x-y)=f(x)-f(y)=0$より$x-y\in\operatorname{Ker}f$なので、$x-y=0$、すなわち$x=y$である。よって$f$は単射である。
  strategy: Translate equality of images into membership of the difference in the kernel.
  sketch:
  - 'setup: Suppose f is injective and x lies in the kernel.'
  - 'derive: Then f(x) = 0 = f(0), so x = 0.'
  - 'translate: Conversely, f(x) = f(y) gives f(x - y) = 0.'
  - 'conclude: A zero kernel forces x - y = 0, so f is injective.'
  openmath: (forall (R S f) (-> (and (comm_ring R) (comm_ring S) (ring_hom f R S)) (<-> (injective_function f) (= (ring_kernel f) (zero_ideal R)))))
  hard_negative:
    statement: 環準同型の核が零イデアルならば、その準同型は環の同型である。
    reason: 包含写像ℤ→ℚの核は零だが全射でなく、同型ではない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] (f : R →+* S), Function.Injective f ↔ RingHom.ker f = ⊥
  proof: |
    by
      intro R S _ _ f
      exact RingHom.injective_iff_ker_eq_bot f
- id: comap_prime_ideal
  kind: gap
  level: 3
  topic: 環論・素イデアルの逆像
  statement: 可換環の間の環準同型$f:R\to S$による、$S$の素イデアル$P$の逆像は$R$の素イデアルである。
  statement_en: The preimage of a prime ideal P of S under a ring homomorphism f from R to S is a prime ideal of R.
  assumptions:
  - $R,S$は可換環
  - $f:R\to S$は環準同型
  - $P$は$S$の素イデアル
  quantifiers:
  - 任意の可換環$R,S$、環準同型$f:R\to S$、$S$の素イデアル$P$
  conclusion: $f^{-1}(P)$は$R$の素イデアルである。
  answer: |
    $R,S$を可換環、$f:R\to S$を環準同型、$P$を$S$の素イデアルとする。

    $f^{-1}(P)$はイデアルである。実際、$a,b\in f^{-1}(P)$と$r\in R$について$f(a+b)=f(a)+f(b)\in P$かつ$f(ra)=f(r)f(a)\in P$である。また$f(0)=0\in P$である。

    $P$は素イデアルなので$1\notin P$であり、$f(1)=1$より$1\notin f^{-1}(P)$である。よって$f^{-1}(P)\neq R$である。

    $a,b\in R$が$ab\in f^{-1}(P)$を満たすとする。$f(a)f(b)=f(ab)\in P$であり、$P$は素イデアルなので$f(a)\in P$または$f(b)\in P$である。すなわち$a\in f^{-1}(P)$または$b\in f^{-1}(P)$である。したがって$f^{-1}(P)$は素イデアルである。
  strategy: Check properness through f(1) = 1 and transport the prime property along multiplicativity.
  sketch:
  - 'setup: The preimage of an ideal under f is an ideal of R.'
  - 'derive: Since f(1) = 1 is not in P, the preimage is proper.'
  - 'translate: If ab is in the preimage, then f(a)f(b) lies in P.'
  - 'conclude: Primality of P puts f(a) or f(b) in P, so a or b is in the preimage.'
  openmath: (forall (R S f P) (-> (and (comm_ring R) (comm_ring S) (ring_hom f R S) (prime_ideal P S)) (prime_ideal (ideal_comap f P) R)))
  hard_negative:
    statement: 環準同型による極大イデアルの逆像は常に極大イデアルである。
    reason: 包含写像ℤ→ℚで極大イデアル(0)の逆像は(0)であり、ℤでは素イデアルだが極大ではない。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] (f : R →+* S) (P : Ideal S), P.IsPrime → (P.comap f).IsPrime
  proof: |
    by
      intro R S _ _ f P hP
      exact Ideal.comap_isPrime f P
- id: ideal_top_iff_contains_unit
  kind: gap
  level: 2
  topic: 環論・イデアルと単元
  statement: 可換環$R$のイデアル$I$が$R$全体に等しいことと、$I$が単元を含むことは同値である。
  statement_en: An ideal I of a commutative ring equals the whole ring if and only if I contains a unit.
  assumptions:
  - $R$は可換環
  - $I$は$R$のイデアル
  quantifiers:
  - 任意の可換環$R$とそのイデアル$I$
  conclusion: $I=R$であることと、$I$が$R$の単元を含むことは同値である。
  answer: |
    $R$を可換環、$I$を$R$のイデアルとする。

    $I=R$なら、単元$1$が$I$に属する。

    逆に単元$u$が$I$に属するとする。$I$はイデアルなので$1=u^{-1}u\in I$である。すると任意の$x\in R$について$x=x\cdot 1\in I$となるので、$I=R$である。
  strategy: Multiply a unit by its inverse to place 1 in the ideal.
  sketch:
  - 'setup: If I = R then 1 is a unit in I.'
  - 'derive: If u in I is a unit, then 1 = u⁻¹u lies in I.'
  - 'conclude: Then x = x·1 lies in I for every x, so I = R.'
  openmath: (forall (R I) (-> (and (comm_ring R) (ideal_of I R)) (<-> (= I (unit_ideal R)) (exists (u) (and (in u I) (unit_element u R))))))
  hard_negative:
    statement: イデアルが0でない元を含めば、そのイデアルは環全体である。
    reason: ℤのイデアル2ℤは0でない元2を含むが、環全体ではない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R), I = ⊤ ↔ ∃ u ∈ I, IsUnit u
  proof: |
    by
      intro R _ I
      constructor
      · rintro rfl
        exact ⟨1, Submodule.mem_top, isUnit_one⟩
      · rintro ⟨u, hu, hunit⟩
        exact I.eq_top_of_isUnit_mem hu hunit
- id: coprime_ideals_inf_eq_mul
  kind: gap
  level: 3
  topic: 環論・イデアルの積と共通部分
  statement: 可換環$R$のイデアル$I,J$が$I+J=R$を満たすならば、$I\cap J=IJ$である。
  statement_en: If ideals I and J of a commutative ring satisfy I + J = R, then their intersection equals their product.
  assumptions:
  - $R$は可換環
  - $I,J$は$R$のイデアル
  - $I+J=R$
  quantifiers:
  - 任意の可換環$R$とそのイデアル$I,J$
  conclusion: $I\cap J=IJ$が成り立つ。
  answer: |
    $R$を可換環、$I,J$を$I+J=R$を満たす$R$のイデアルとする。

    $IJ\subseteq I\cap J$を示す。$IJ$の元は$a\in I$と$b\in J$の積$ab$の有限和である。各$ab$は$I$にも$J$にも属するので、その和も$I\cap J$に属する。

    $I\cap J\subseteq IJ$を示す。$I+J=R$より、$i+j=1$となる$i\in I$と$j\in J$がとれる。$x\in I\cap J$とすると$x=x\cdot 1=xi+xj$である。$x\in J$かつ$i\in I$より$xi=ix\in IJ$であり、$x\in I$かつ$j\in J$より$xj\in IJ$である。よって$x\in IJ$である。
  strategy: Write 1 = i + j and split an element of the intersection into two products.
  sketch:
  - 'setup: The inclusion IJ ⊆ I ∩ J holds for any ideals.'
  - 'construct: Choose i in I and j in J with i + j = 1.'
  - 'derive: For x in I ∩ J, x = xi + xj.'
  - 'conclude: Both xi and xj lie in IJ, so x lies in IJ.'
  openmath: (forall (R I J) (-> (and (comm_ring R) (ideal_of I R) (ideal_of J R) (= (ideal_sum I J) (unit_ideal R))) (= (inter I J) (ideal_product I J))))
  hard_negative:
    statement: 可換環の任意のイデアルI, Jに対してI∩J=IJである。
    reason: ℤでI=J=2ℤとするとI∩J=2ℤだがIJ=4ℤである。
  target: |
    ∀ (R : Type*) [CommRing R] (I J : Ideal R), I ⊔ J = ⊤ → I ⊓ J = I * J
  proof: |
    by
      intro R _ I J h
      exact (Ideal.mul_eq_inf_of_isCoprime (Ideal.isCoprime_iff_sup_eq.mpr h)).symm
- id: principal_ideal_le_iff_dvd
  kind: gap
  level: 2
  topic: 環論・単項イデアルと整除
  statement: 可換環$R$の元$a,b$について、単項イデアルの包含$(a)\subseteq(b)$は、$b$が$a$を割り切ることと同値である。
  statement_en: For elements a and b of a commutative ring, the principal ideal (a) is contained in (b) if and only if b divides a.
  assumptions:
  - $R$は可換環
  - $a,b\in R$
  quantifiers:
  - 任意の可換環$R$と元$a,b\in R$
  conclusion: $(a)\subseteq(b)$であることと$b\mid a$は同値である。
  answer: |
    $R$を可換環、$a,b\in R$とする。$(b)=\{bc\mid c\in R\}$である。

    $(a)\subseteq(b)$とする。$a\in(a)\subseteq(b)$なので、$a=bc$となる$c\in R$があり、$b\mid a$である。

    逆に$b\mid a$とし、$a=bc$とする。$(a)$の任意の元$ar$は$ar=b(cr)$と書けるので$(b)$に属する。よって$(a)\subseteq(b)$である。
  strategy: Unfold membership in a principal ideal as divisibility.
  sketch:
  - 'translate: Membership of a in (b) means a = bc for some c.'
  - 'derive: If b divides a, every multiple of a is a multiple of b.'
  - 'conclude: Hence (a) ⊆ (b) is equivalent to b dividing a.'
  openmath: (forall (R a b) (-> (and (comm_ring R) (in a R) (in b R)) (<-> (subset (principal_ideal a) (principal_ideal b)) (dvd b a))))
  hard_negative:
    statement: (a)⊆(b)であることはaがbを割り切ることと同値である。
    reason: ℤで(4)⊆(2)だが4は2を割り切らない。割り切る向きが逆である。
  target: |
    ∀ (R : Type*) [CommRing R] (a b : R), Ideal.span {a} ≤ Ideal.span {b} ↔ b ∣ a
  proof: |
    by
      intro R _ a b
      exact Ideal.span_singleton_le_span_singleton
- id: quotient_mk_eq_iff_sub_mem
  kind: gap
  level: 2
  topic: 環論・剰余環の元の相等
  statement: 可換環$R$のイデアル$I$と$x,y\in R$について、剰余環$R/I$で$x$と$y$の剰余類が等しいことと、$x-y\in I$は同値である。
  statement_en: In the quotient ring R/I, the residue classes of x and y coincide if and only if x - y belongs to I.
  assumptions:
  - $R$は可換環
  - $I$は$R$のイデアル
  - $x,y\in R$
  quantifiers:
  - 任意の可換環$R$、イデアル$I$、元$x,y\in R$
  conclusion: $x+I=y+I$であることと$x-y\in I$は同値である。
  answer: |
    $R$を可換環、$I$を$R$のイデアル、$x,y\in R$とする。

    $x+I=y+I$とする。$x=x+0\in x+I=y+I$なので、$x=y+i$となる$i\in I$がある。よって$x-y=i\in I$である。

    逆に$i=x-y\in I$とする。$I$は加法について部分群なので$i+I=I$である。したがって$x+I=y+i+I=y+I$である。
  strategy: Compare cosets of the additive subgroup I.
  sketch:
  - 'translate: Equal cosets means x lies in y + I.'
  - 'derive: Then x - y lies in I.'
  - 'conclude: Conversely, x = y + i with i in I gives x + I = y + I.'
  openmath: (forall (R I x y) (-> (and (comm_ring R) (ideal_of I R) (in x R) (in y R)) (<-> (= (residue_class I x) (residue_class I y)) (in (- x y) I))))
  hard_negative:
    statement: xとyの剰余類が等しいことは、xとyがともにIに属することと同値である。
    reason: ℤでI=2ℤ, x=y=1とすると剰余類は等しいが、1はIに属さない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R) (x y : R), Ideal.Quotient.mk I x = Ideal.Quotient.mk I y ↔ x - y ∈ I
  proof: |
    by
      intro R _ I x y
      exact Ideal.Quotient.eq
- id: ring_quotient_lift_unique
  kind: textbook
  level: 3
  topic: 環論・剰余環の普遍性
  statement: 可換環の間の環準同型$f:R\to S$が$R$のイデアル$I$の元をすべて$0$に写すならば、すべての$x\in R$で$g(x+I)=f(x)$を満たす環準同型$g:R/I\to S$がただ一つ存在する。
  statement_en: If a ring homomorphism f from R to S vanishes on an ideal I, then there is a unique ring homomorphism g from R/I to S with g(x + I) = f(x) for all x.
  assumptions:
  - $R,S$は可換環
  - $I$は$R$のイデアル
  - $f:R\to S$は環準同型
  - 任意の$a\in I$で$f(a)=0$
  quantifiers:
  - 任意の可換環$R,S$、イデアル$I$、環準同型$f:R\to S$
  conclusion: 自然な射影を$\pi:R\to R/I$とするとき、$g\circ\pi=f$を満たす環準同型$g:R/I\to S$がただ一つ存在する。
  answer: |
    $R,S$を可換環、$I$を$R$のイデアル、$f:R\to S$を$I$の元をすべて$0$に写す環準同型とし、$\pi:R\to R/I$を自然な射影とする。

    存在を示す。$x+I=y+I$なら$x-y\in I$なので、$f(x)-f(y)=f(x-y)=0$である。よって$g(x+I)=f(x)$は代表元によらず定まり、$g\circ\pi=f$を満たす。さらに$g((x+I)+(y+I))=f(x+y)=g(x+I)+g(y+I)$、$g((x+I)(y+I))=f(xy)=g(x+I)g(y+I)$、$g(1+I)=f(1)=1$が成り立つので、$g$は環準同型である。

    一意性を示す。$h:R/I\to S$が環準同型で$h\circ\pi=f$を満たすとする。$R/I$の任意の元は$x+I$の形であり、$h(x+I)=f(x)=g(x+I)$である。よって$h=g$である。
  strategy: Define the map on representatives, check it is well defined, and use surjectivity of the projection for uniqueness.
  sketch:
  - 'construct: Set g(x + I) = f(x).'
  - 'derive: If x - y lies in I then f(x) = f(y), so g is well defined.'
  - 'derive: Additivity and multiplicativity of g follow from those of f.'
  - 'conclude: Every element of R/I is a residue class, so the condition determines g uniquely.'
  openmath: (forall (R S I f) (-> (and (comm_ring R) (comm_ring S) (ideal_of I R) (ring_hom f R S) (forall (a) (-> (in a I) (= (fn_value f a) 0)))) (exists (g) (and (ring_hom g (quotient_ring R I) S) (forall (x) (= (fn_value g (residue_class I x)) (fn_value f x))) (forall (h) (-> (and (ring_hom h (quotient_ring R I) S) (forall (x) (= (fn_value h (residue_class I x)) (fn_value f x)))) (= h g)))))))
  hard_negative:
    statement: Iがfの核に含まれなくても、fはR/Iを経由する環準同型に分解する。
    reason: f=id:ℤ→ℤ, I=2ℤでは、g(1+I)=1とすると0=g(2+I)=2となり矛盾する。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] (I : Ideal R) (f : R →+* S), (∀ a ∈ I, f a = 0) → ∃! g : (R ⧸ I) →+* S, g.comp (Ideal.Quotient.mk I) = f
  proof: |
    by
      intro R S _ _ I f h
      refine ⟨Ideal.Quotient.lift I f h, ?_, ?_⟩
      · ext x
        simp
      · intro g hg
        apply Ideal.Quotient.ringHom_ext
        ext x
        simp [← hg]
- id: first_isomorphism_theorem_ring
  kind: named
  level: 3
  topic: 環論・準同型定理
  statement: 環の準同型定理。可換環の間の環準同型$f:R\to S$について、$x+\operatorname{Ker}f$を$f(x)$に写す写像は、$R/\operatorname{Ker}f$から$f$の像への環同型である。
  statement_en: First isomorphism theorem for rings. For a ring homomorphism f from R to S, sending x + ker f to f(x) gives a ring isomorphism from R/ker f onto the image of f.
  assumptions:
  - $R,S$は可換環
  - $f:R\to S$は環準同型
  quantifiers:
  - 任意の可換環$R,S$と環準同型$f:R\to S$
  conclusion: $x+\operatorname{Ker}f$を$f(x)$に写す環同型$R/\operatorname{Ker}f\cong\operatorname{Im}f$が存在する。
  answer: |
    $R,S$を可換環、$f:R\to S$を環準同型とし、$K=\operatorname{Ker}f$とおく。$x,y\in R$について$x+K=y+K\iff x-y\in K\iff f(x)=f(y)$が成り立つ。

    左から右への含意により、$e(x+K)=f(x)$は代表元によらず定まる。右から左への含意により、$e:R/K\to\operatorname{Im}f$は単射である。$\operatorname{Im}f$の元は$f(x)$の形なので、$e$は全射である。

    $f$が環準同型なので、$e((x+K)+(y+K))=f(x+y)=f(x)+f(y)$、$e((x+K)(y+K))=f(xy)=f(x)f(y)$、$e(1+K)=f(1)=1$が成り立つ。よって$e$は環同型であり、$e(x+K)=f(x)$を満たす。
  strategy: Use the equivalence between equal values and differences in the kernel to get a well-defined injective map.
  sketch:
  - 'translate: f(x) = f(y) holds exactly when x - y lies in ker f.'
  - 'construct: Define the map on residue classes by x + ker f ↦ f(x).'
  - 'derive: The equivalence shows the map is well defined and injective.'
  - 'derive: It is a ring homomorphism because f is.'
  - 'conclude: It is onto the image by definition, hence an isomorphism.'
  openmath: (forall (R S f) (-> (and (comm_ring R) (comm_ring S) (ring_hom f R S)) (exists (e) (and (ring_iso e (quotient_ring R (ring_kernel f)) (ring_image f)) (forall (x) (= (fn_value e (residue_class (ring_kernel f) x)) (fn_value f x)))))))
  hard_negative:
    statement: 任意の環準同型f:R→SについてR/Ker fはS全体と同型である。
    reason: 包含写像ℤ→ℚでは核が0でR/Ker f=ℤとなるが、ℤとℚは同型でない。全射の仮定が必要である。
  target: |
    ∀ (R S : Type*) [CommRing R] [CommRing S] (f : R →+* S), ∃ e : (R ⧸ RingHom.ker f) ≃+* f.range, ∀ x : R, ((e (Ideal.Quotient.mk (RingHom.ker f) x) : f.range) : S) = f x
  proof: |
    by
      intro R S _ _ f
      refine ⟨RingHom.quotientKerEquivRange f, ?_⟩
      intro x
      rfl
- id: third_isomorphism_theorem_ring
  kind: textbook
  level: 3
  topic: 環論・第三同型定理
  statement: 可換環$R$のイデアル$I\subseteq J$について、$J$の$R/I$における像で$R/I$を割った環は$R/J$と同型である。この同型は$x$の二重の剰余類を$x+J$に写す。
  statement_en: For ideals I ⊆ J of a commutative ring, the quotient of R/I by the image of J is isomorphic to R/J, compatibly with residue classes.
  assumptions:
  - $R$は可換環
  - $I,J$は$R$のイデアル
  - $I\subseteq J$
  quantifiers:
  - 任意の可換環$R$とそのイデアル$I,J$
  conclusion: $\pi:R\to R/I$を自然な射影とするとき、$(R/I)/\pi(J)\cong R/J$であり、$x$の二重の剰余類は$x+J$に対応する。
  answer: |
    $R$を可換環、$I\subseteq J$を$R$のイデアルとし、$\pi:R\to R/I$を自然な射影とする。$\pi$は全射なので、$J$の像$\pi(J)$は$R/I$のイデアルである。

    写像$\psi:R/I\to R/J$を$\psi(x+I)=x+J$で定める。$x+I=y+I$なら$x-y\in I\subseteq J$なので$x+J=y+J$であり、$\psi$は代表元によらず定まる。$\psi$は環準同型であり、明らかに全射である。

    $\psi$の核を求める。$x\in J$なら$\psi(x+I)=0$である。逆に$\psi(x+I)=0$なら$x\in J$なので、$x+I=\pi(x)\in\pi(J)$である。よって$\operatorname{Ker}\psi=\pi(J)$である。

    環の準同型定理より、$\psi$は環同型$(R/I)/\pi(J)\cong R/J$を誘導する。この同型は$x+I$の$\pi(J)$を法とする剰余類を$\psi(x+I)=x+J$に写す。
  strategy: Apply the first isomorphism theorem to the induced surjection from R/I onto R/J.
  sketch:
  - 'construct: Since I ⊆ J, define R/I → R/J by x + I ↦ x + J.'
  - 'derive: This map is surjective.'
  - 'derive: Its kernel is the image of J in R/I.'
  - 'apply_theorem: The first isomorphism theorem gives the claimed isomorphism.'
  openmath: (forall (R I J) (-> (and (comm_ring R) (ideal_of I R) (ideal_of J R) (subset I J)) (exists (e) (and (ring_iso e (quotient_ring (quotient_ring R I) (ideal_map (ring_quotient_map I) J)) (quotient_ring R J)) (forall (x) (= (fn_value e (residue_class (ideal_map (ring_quotient_map I) J) (residue_class I x))) (residue_class J x)))))))
  hard_negative:
    statement: I⊆Jを仮定しなくても、(R/I)/(Jの像)はR/Jと同型である。
    reason: ℤでI=2ℤ, J=3ℤとするとJの像はℤ/2ℤ全体で商は零環だが、ℤ/3ℤは零環でない。
  target: |
    ∀ (R : Type*) [CommRing R] (I J : Ideal R), I ≤ J → ∃ e : ((R ⧸ I) ⧸ J.map (Ideal.Quotient.mk I)) ≃+* (R ⧸ J), ∀ x : R, e (Ideal.Quotient.mk _ (Ideal.Quotient.mk I x)) = Ideal.Quotient.mk J x
  proof: |
    by
      intro R _ I J h
      refine ⟨DoubleQuot.quotQuotEquivQuotOfLE h, ?_⟩
      intro x
      rfl
- id: quotient_ideal_correspondence
  kind: gap
  level: 3
  topic: 環論・イデアルの対応
  statement: 可換環$R$のイデアル$I$と自然な射影$\pi:R\to R/I$について、$I\subseteq J$を満たす$R$の任意のイデアル$J$で$\pi^{-1}(\pi(J))=J$であり、$R/I$の任意のイデアル$K$で$\pi(\pi^{-1}(K))=K$である。
  statement_en: 'Let I be an ideal of a commutative ring R with projection π: R → R/I. For every ideal J ⊇ I of R, π⁻¹(π(J)) = J, and for every ideal K of R/I, π(π⁻¹(K)) = K.'
  assumptions:
  - $R$は可換環
  - $I$は$R$のイデアル
  - $\pi:R\to R/I$は自然な射影
  quantifiers:
  - 任意の可換環$R$とそのイデアル$I$
  - $I\subseteq J$を満たす任意のイデアル$J\subseteq R$
  - $R/I$の任意のイデアル$K$
  conclusion: $I\subseteq J$なら$\pi^{-1}(\pi(J))=J$であり、$R/I$の任意のイデアル$K$で$\pi(\pi^{-1}(K))=K$である。
  answer: |
    $R$を可換環、$I\subseteq J$を$R$のイデアル、$\pi:R\to R/I$を自然な射影とする。$\pi$は全射なので、$\pi(J)$は$R/I$のイデアルであり、$J$の元の剰余類の全体である。

    $j\in J$なら$\pi(j)\in\pi(J)$なので、$J\subseteq\pi^{-1}(\pi(J))$である。

    逆に$x\in\pi^{-1}(\pi(J))$とする。$\pi(x)=\pi(j)$となる$j\in J$があるので、$x-j\in I\subseteq J$である。したがって$x=(x-j)+j\in J$である。

    次に$K$を$R/I$のイデアルとする。$y\in K$なら、$\pi$は全射なので$y=\pi(x)$となる$x\in R$がある。$\pi(x)=y\in K$より$x\in\pi^{-1}(K)$なので$y\in\pi(\pi^{-1}(K))$である。逆に$\pi(\pi^{-1}(K))$の元は$\pi(x)$（$\pi(x)\in K$）の形なので$K$に属する。よって$\pi(\pi^{-1}(K))=K$である。
  strategy: Compare residue classes and use I ⊆ J to absorb the difference.
  sketch:
  - 'setup: The inclusion J ⊆ π⁻¹(π(J)) is immediate.'
  - 'translate: For x in π⁻¹(π(J)), choose j in J with π(x) = π(j).'
  - 'derive: Then x - j lies in I, hence in J.'
  - 'conclude: So x = (x - j) + j lies in J.'
  openmath: (forall (R I) (-> (and (comm_ring R) (ideal_of I R)) (and (forall (J) (-> (and (ideal_of J R) (subset I J)) (= (ideal_comap (ring_quotient_map I) (ideal_map (ring_quotient_map I) J)) J))) (forall (K) (-> (ideal_of K (quotient_ring R I)) (= (ideal_map (ring_quotient_map I) (ideal_comap (ring_quotient_map I) K)) K))))))
  hard_negative:
    statement: I⊆Jを仮定しなくても、π^{-1}(π(J))=Jである。
    reason: 一般にはπ^{-1}(π(J))=I+Jであり、ℤでI=2ℤ, J=3ℤならℤとなって3ℤと異なる。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R), (∀ J : Ideal R, I ≤ J → (J.map (Ideal.Quotient.mk I)).comap (Ideal.Quotient.mk I) = J) ∧ (∀ K : Ideal (R ⧸ I), (K.comap (Ideal.Quotient.mk I)).map (Ideal.Quotient.mk I) = K)
  proof: |
    by
      intro R _ I
      refine ⟨fun J h => ?_, fun K => ?_⟩
      · rw [Ideal.comap_map_of_surjective _ Ideal.Quotient.mk_surjective, ← RingHom.ker_eq_comap_bot, Ideal.mk_ker]
        exact sup_eq_left.mpr h
      · exact Ideal.map_comap_of_surjective _ Ideal.Quotient.mk_surjective K
- id: chinese_remainder_two_ideals
  kind: named
  level: 3
  topic: 環論・中国剰余定理
  statement: 中国剰余定理。可換環$R$のイデアル$I,J$が$I+J=R$を満たすならば、$x+(I\cap J)$を$(x+I,x+J)$に写す写像は$R/(I\cap J)$から$R/I\times R/J$への環同型である。
  statement_en: Chinese remainder theorem. If ideals I and J of a commutative ring satisfy I + J = R, then x + (I ∩ J) ↦ (x + I, x + J) is a ring isomorphism from R/(I ∩ J) onto R/I × R/J.
  assumptions:
  - $R$は可換環
  - $I,J$は$R$のイデアル
  - $I+J=R$
  quantifiers:
  - 任意の可換環$R$とそのイデアル$I,J$
  conclusion: $x+(I\cap J)$を$(x+I,x+J)$に写す環同型$R/(I\cap J)\cong R/I\times R/J$が存在する。
  answer: |
    $R$を可換環、$I,J$を$I+J=R$を満たす$R$のイデアルとする。環準同型$\varphi:R\to R/I\times R/J$を$\varphi(x)=(x+I,x+J)$で定める。

    $\varphi(x)=0$は$x\in I$かつ$x\in J$と同値なので、$\operatorname{Ker}\varphi=I\cap J$である。

    $\varphi$が全射であることを示す。$I+J=R$より、$i+j=1$となる$i\in I$と$j\in J$がとれる。$a,b\in R$に対して$x=aj+bi$とおくと、$j=1-i$と$i=1-j$より$x-a=(b-a)i\in I,\qquad x-b=(a-b)j\in J$である。よって$\varphi(x)=(a+I,b+J)$であり、$R/I\times R/J$の任意の元は$\varphi$の像に入る。

    環の準同型定理より、$x+(I\cap J)$を$\varphi(x)=(x+I,x+J)$に写す環同型が得られる。
  strategy: Build the map to the product, identify its kernel, and prove surjectivity from i + j = 1.
  sketch:
  - 'construct: Consider R → R/I × R/J sending x to its two residue classes.'
  - 'derive: Its kernel is I ∩ J.'
  - 'construct: Choose i in I and j in J with i + j = 1.'
  - 'derive: The element aj + bi reduces to a mod I and b mod J, so the map is surjective.'
  - 'apply_theorem: The first isomorphism theorem gives the isomorphism.'
  openmath: (forall (R I J) (-> (and (comm_ring R) (ideal_of I R) (ideal_of J R) (= (ideal_sum I J) (unit_ideal R))) (exists (e) (and (ring_iso e (quotient_ring R (inter I J)) (ring_product (quotient_ring R I) (quotient_ring R J))) (forall (x) (= (fn_value e (residue_class (inter I J) x)) (ordered_pair (residue_class I x) (residue_class J x))))))))
  hard_negative:
    statement: 任意のイデアルI, Jに対してR/(I∩J)はR/I×R/Jと同型である。
    reason: ℤでI=J=2ℤとすると左辺は位数2、右辺は位数4であり同型でない。
  target: |
    ∀ (R : Type*) [CommRing R] (I J : Ideal R), I ⊔ J = ⊤ → ∃ e : (R ⧸ (I ⊓ J)) ≃+* (R ⧸ I) × (R ⧸ J), ∀ x : R, e (Ideal.Quotient.mk (I ⊓ J) x) = (Ideal.Quotient.mk I x, Ideal.Quotient.mk J x)
  proof: |
    by
      intro R _ I J h
      refine ⟨Ideal.quotientInfEquivQuotientProd I J (Ideal.isCoprime_iff_sup_eq.mpr h), ?_⟩
      intro x
      rfl
- id: coprime_ideals_simultaneous_congruence
  kind: gap
  level: 3
  topic: 環論・連立合同式
  statement: 可換環$R$のイデアル$I,J$が$I+J=R$を満たすならば、任意の$a,b\in R$に対して$x-a\in I$かつ$x-b\in J$を満たす$x\in R$が存在する。
  statement_en: If ideals I and J satisfy I + J = R, then for all a and b there is an x with x - a in I and x - b in J.
  assumptions:
  - $R$は可換環
  - $I,J$は$R$のイデアル
  - $I+J=R$
  quantifiers:
  - 任意の可換環$R$、イデアル$I,J$、元$a,b\in R$
  conclusion: $x-a\in I$かつ$x-b\in J$を満たす$x\in R$が存在する。
  answer: |
    $R$を可換環、$I,J$を$I+J=R$を満たす$R$のイデアル、$a,b\in R$とする。$I+J=R$より、$i+j=1$となる$i\in I$と$j\in J$がとれる。$x=aj+bi$とおく。

    $j=1-i$を代入すると$x-a=a(1-i)+bi-a=(b-a)i\in I$である。$i=1-j$を代入すると$x-b=aj+b(1-j)-b=(a-b)j\in J$である。
  strategy: Use the decomposition of 1 to interpolate a and b explicitly.
  sketch:
  - 'construct: Choose i in I and j in J with i + j = 1, and put x = aj + bi.'
  - 'derive: Then x - a = (b - a)i lies in I.'
  - 'conclude: Likewise x - b = (a - b)j lies in J.'
  openmath: (forall (R I J a b) (-> (and (comm_ring R) (ideal_of I R) (ideal_of J R) (= (ideal_sum I J) (unit_ideal R)) (in a R) (in b R)) (exists (x) (and (in (- x a) I) (in (- x b) J)))))
  hard_negative:
    statement: 任意のイデアルI, Jと元a, bに対してx-a∈Iかつx-b∈Jを満たすxが存在する。
    reason: ℤでI=J=2ℤ, a=0, b=1とすると、xは偶数かつ奇数となり存在しない。
  target: |
    ∀ (R : Type*) [CommRing R] (I J : Ideal R), I ⊔ J = ⊤ → ∀ a b : R, ∃ x : R, x - a ∈ I ∧ x - b ∈ J
  proof: |
    by
      intro R _ I J h a b
      have h1 : (1 : R) ∈ I ⊔ J := by
        rw [h]
        exact Submodule.mem_top
      obtain ⟨i, hi, j, hj, hij⟩ := Submodule.mem_sup.mp h1
      refine ⟨a * j + b * i, ?_, ?_⟩
      · have : a * j + b * i - a = (b - a) * i := by
          linear_combination a * hij
        rw [this]
        exact I.mul_mem_left _ hi
      · have : a * j + b * i - b = (a - b) * j := by
          linear_combination b * hij
        rw [this]
        exact J.mul_mem_left _ hj
- id: quotient_domain_iff_prime
  kind: textbook
  level: 3
  topic: 環論・素イデアルと整域
  statement: 可換環$R$のイデアル$I$について、$R/I$が整域であることと$I$が素イデアルであることは同値である。
  statement_en: For an ideal I of a commutative ring R, the quotient R/I is an integral domain if and only if I is a prime ideal.
  assumptions:
  - $R$は可換環
  - $I$は$R$のイデアル
  quantifiers:
  - 任意の可換環$R$とそのイデアル$I$
  conclusion: $R/I$が整域であることと$I$が素イデアルであることは同値である。
  answer: |
    $R$を可換環、$I$を$R$のイデアルとする。$R/I$は可換環なので、整域であるとは、零環でなく零因子を持たないことである。

    $R/I$が零環でないことは$I\neq R$と同値である。また$a,b\in R$について、$(a+I)(b+I)=0$は$ab\in I$と同値であり、$a+I=0$は$a\in I$と同値である。

    したがって、$R/I$に零因子がないこと、すなわち「$(a+I)(b+I)=0$なら$a+I=0$または$b+I=0$」は、「$ab\in I$なら$a\in I$または$b\in I$」と同値である。$I\neq R$と合わせると、これは$I$が素イデアルであるという条件そのものである。
  strategy: Translate zero products in the quotient into memberships in I.
  sketch:
  - 'translate: R/I is nonzero exactly when I ≠ R.'
  - 'translate: (a + I)(b + I) = 0 means ab lies in I.'
  - 'translate: a + I = 0 means a lies in I.'
  - 'conclude: Absence of zero divisors in R/I is the prime condition on I.'
  openmath: (forall (R I) (-> (and (comm_ring R) (ideal_of I R)) (<-> (integral_domain (quotient_ring R I)) (prime_ideal I R))))
  hard_negative:
    statement: R/Iが整域であることとIが極大イデアルであることは同値である。
    reason: ℤ/(0)=ℤは整域だが、(0)はℤの極大イデアルではない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R), IsDomain (R ⧸ I) ↔ I.IsPrime
  proof: |
    by
      intro R _ I
      exact Ideal.Quotient.isDomain_iff_prime I
- id: quotient_field_iff_maximal
  kind: textbook
  level: 3
  topic: 環論・極大イデアルと体
  statement: 可換環$R$のイデアル$I$について、$R/I$が体であることと$I$が極大イデアルであることは同値である。
  statement_en: For an ideal I of a commutative ring R, the quotient R/I is a field if and only if I is a maximal ideal.
  assumptions:
  - $R$は可換環
  - $I$は$R$のイデアル
  quantifiers:
  - 任意の可換環$R$とそのイデアル$I$
  conclusion: $R/I$が体であることと$I$が極大イデアルであることは同値である。
  answer: |
    $R$を可換環、$I$を$R$のイデアルとする。

    $I$が極大であるとする。$I\neq R$なので$R/I$は零環でない。$a\notin I$とすると、$I+(a)$は$I$を真に含むイデアルなので$R$に等しい。よって$ab+i=1$となる$b\in R$と$i\in I$があり、$(a+I)(b+I)=1+I$である。$R/I$の$0$でない元はすべて可逆なので、$R/I$は体である。

    逆に$R/I$が体であるとする。$R/I$は零環でないので$I\neq R$である。$J$を$I$を真に含むイデアルとし、$a\in J\setminus I$をとる。$a+I\neq 0$なので、$ab-1\in I$となる$b\in R$がある。$I\subseteq J$と$ab\in J$より$1=ab-(ab-1)\in J$なので、$J=R$である。よって$I$は極大イデアルである。
  strategy: Convert maximality into invertibility of nonzero residue classes, in both directions.
  sketch:
  - 'setup: Assume I is maximal and a is not in I.'
  - 'derive: Then I + (a) = R, so ab + i = 1 with i in I.'
  - 'translate: Thus b + I inverts a + I, and R/I is a field.'
  - 'setup: Conversely assume R/I is a field and J strictly contains I.'
  - 'derive: Taking a in J outside I, ab - 1 lies in I for some b.'
  - 'conclude: So 1 lies in J, J = R, and I is maximal.'
  openmath: (forall (R I) (-> (and (comm_ring R) (ideal_of I R)) (<-> (is_field (quotient_ring R I)) (maximal_ideal I R))))
  hard_negative:
    statement: R/Iが体であることとIが素イデアルであることは同値である。
    reason: ℤの(0)は素イデアルだが、ℤ/(0)=ℤは体でない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R), IsField (R ⧸ I) ↔ I.IsMaximal
  proof: |
    by
      intro R _ I
      exact (Ideal.Quotient.maximal_ideal_iff_isField_quotient I).symm
- id: maximal_ideal_is_prime
  kind: gap
  level: 3
  topic: 環論・極大イデアルと素イデアル
  statement: 可換環の極大イデアルは素イデアルである。
  statement_en: Every maximal ideal of a commutative ring is a prime ideal.
  assumptions:
  - $R$は可換環
  - $M$は$R$の極大イデアル
  quantifiers:
  - 任意の可換環$R$とその極大イデアル$M$
  conclusion: $M$は$R$の素イデアルである。
  answer: |
    $R$を可換環、$M$を$R$の極大イデアルとする。極大イデアルの定義より$M\neq R$である。

    $a,b\in R$が$ab\in M$かつ$a\notin M$を満たすとする。$M+(a)$は$M$を真に含むイデアルなので$R$に等しく、$m+ac=1$となる$m\in M$と$c\in R$がある。両辺に$b$を掛けると$b=mb+(ab)c$であり、右辺の二項はどちらも$M$に属する。よって$b\in M$である。したがって$M$は素イデアルである。
  strategy: Pass through the quotient, which is a field and therefore a domain.
  sketch:
  - 'apply_theorem: R/M is a field because M is maximal.'
  - 'derive: Every field is an integral domain.'
  - 'conclude: R/M being a domain means M is prime.'
  openmath: (forall (R M) (-> (and (comm_ring R) (maximal_ideal M R)) (prime_ideal M R)))
  hard_negative:
    statement: 可換環の素イデアルは極大イデアルである。
    reason: ℤの(0)は素イデアルだが、2ℤに真に含まれるので極大ではない。
  target: |
    ∀ (R : Type*) [CommRing R] (M : Ideal R), M.IsMaximal → M.IsPrime
  proof: |
    by
      intro R _ M h
      exact h.isPrime
- id: exists_maximal_ideal_containing
  kind: named
  level: 3
  topic: 環論・極大イデアルの存在
  statement: クルルの定理。可換環$R$のイデアル$I$が$R$と異なるならば、$I$を含む$R$の極大イデアルが存在する。
  statement_en: Krull's theorem. Every proper ideal I of a commutative ring is contained in a maximal ideal.
  assumptions:
  - $R$は可換環
  - $I$は$R$のイデアル
  - $I\neq R$
  quantifiers:
  - 任意の可換環$R$とそのイデアル$I$
  conclusion: $I\subseteq M$を満たす$R$の極大イデアル$M$が存在する。
  answer: |
    $R$を可換環、$I\neq R$を$R$のイデアルとする。$I$を含み$R$と異なるイデアルの全体を$\mathcal{S}$とし、包含で順序づける。$I\in\mathcal{S}$なので$\mathcal{S}$は空でない。

    $\mathcal{C}$を$\mathcal{S}$の空でない鎖とし、$U$をその和集合とする。$a,b\in U$なら、鎖なので$a,b$を同時に含む$\mathcal{C}$の元があり、$a+b\in U$である。同様に$r\in R$について$ra\in U$である。よって$U$はイデアルである。$U$は$I$を含む。$\mathcal{C}$のどの元も$1$を含まないので$1\notin U$であり、$U\neq R$である。したがって$U\in\mathcal{S}$は$\mathcal{C}$の上界である。

    ツォルンの補題より、$\mathcal{S}$は極大元$M$を持つ。$M$は$I$を含み$R$と異なる。$M$を真に含むイデアルは$I$を含むので、$\mathcal{S}$に属さず、$R$に等しい。よって$M$は$I$を含む極大イデアルである。
  strategy: Apply Zorn's lemma to proper ideals containing I.
  sketch:
  - 'setup: Order proper ideals containing I by inclusion.'
  - 'derive: The union of a chain is an ideal.'
  - 'derive: The union does not contain 1, so it is proper.'
  - 'apply_theorem: Zorn''s lemma gives a maximal element M.'
  - 'conclude: M is a maximal ideal containing I.'
  openmath: (forall (R I) (-> (and (comm_ring R) (ideal_of I R) (!= I (unit_ideal R))) (exists (M) (and (maximal_ideal M R) (subset I M)))))
  hard_negative:
    statement: 環全体を含め、任意のイデアルは極大イデアルに含まれる。
    reason: 極大イデアルはRと異なるので、I=Rを含む極大イデアルは存在しない。
  target: |
    ∀ (R : Type*) [CommRing R] (I : Ideal R), I ≠ ⊤ → ∃ M : Ideal R, M.IsMaximal ∧ I ≤ M
  proof: |
    by
      intro R _ I h
      exact Ideal.exists_le_maximal I h
- id: nonunit_in_maximal_ideal
  kind: gap
  level: 3
  topic: 環論・非単元と極大イデアル
  statement: 可換環の単元でない元は、ある極大イデアルに属する。
  statement_en: Every non-unit of a commutative ring lies in some maximal ideal.
  assumptions:
  - $R$は可換環
  - $a\in R$は単元でない
  quantifiers:
  - 任意の可換環$R$と単元でない元$a\in R$
  conclusion: $a\in M$を満たす$R$の極大イデアル$M$が存在する。
  answer: |
    $R$を可換環、$a\in R$を単元でない元とする。$1\in(a)$なら$1=ab$となる$b$があり、$a$は単元となってしまう。よって$1\notin(a)$であり、$(a)\neq R$である。

    クルルの定理（$R$と異なるイデアルは極大イデアルに含まれる）より、$(a)\subseteq M$となる極大イデアル$M$が存在する。このとき$a\in M$である。
  strategy: Enlarge the principal ideal generated by a to a maximal ideal.
  sketch:
  - 'derive: Since a is not a unit, (a) does not contain 1.'
  - 'apply_theorem: The proper ideal (a) lies in a maximal ideal M.'
  - 'conclude: Therefore a lies in M.'
  openmath: (forall (R a) (-> (and (comm_ring R) (in a R) (not (unit_element a R))) (exists (M) (and (maximal_ideal M R) (in a M)))))
  hard_negative:
    statement: 可換環の非単元全体はイデアルをなす。
    reason: ℤで3と-2は非単元だが、和1は単元である。非単元全体がイデアルになるのは局所環のときである。
  target: |
    ∀ (R : Type*) [CommRing R] (a : R), ¬ IsUnit a → ∃ M : Ideal R, M.IsMaximal ∧ a ∈ M
  proof: |
