      intro R _ a h
      exact exists_max_ideal_of_mem_nonunits h
- id: prime_ideal_contains_product
  kind: gap
  level: 3
  topic: 環論・素イデアルとイデアルの積
  statement: 可換環の素イデアル$P$がイデアルの積$IJ$を含むならば、$P$は$I$または$J$を含む。
  statement_en: If a prime ideal P contains the product IJ of two ideals, then P contains I or J.
  assumptions:
  - $R$は可換環
  - $P$は$R$の素イデアル
  - $I,J$は$R$のイデアル
  - $IJ\subseteq P$
  quantifiers:
  - 任意の可換環$R$、素イデアル$P$、イデアル$I,J$
  conclusion: $I\subseteq P$または$J\subseteq P$である。
  answer: |
    $R$を可換環、$P$を$R$の素イデアル、$I,J$を$IJ\subseteq P$を満たす$R$のイデアルとする。

    $I\subseteq P$でないとして、$J\subseteq P$を示す。$I$の元$a$で$a\notin P$であるものをとる。任意の$b\in J$について、$ab\in IJ\subseteq P$である。$P$は素イデアルで$a\notin P$なので、$b\in P$である。よって$J\subseteq P$である。
  strategy: Pick an element of I outside P and apply the prime condition to its products with J.
  sketch:
  - 'case_split: Assume I is not contained in P and take a in I outside P.'
  - 'derive: For b in J, ab lies in IJ and hence in P.'
  - 'derive: Primality of P forces b into P.'
  - 'conclude: Thus J is contained in P.'
  openmath: (forall (R P I J) (-> (and (comm_ring R) (prime_ideal P R) (ideal_of I R) (ideal_of J R) (subset (ideal_product I J) P)) (or (subset I P) (subset J P))))
  hard_negative:
    statement: 任意のイデアルPについて、IJ⊆PならI⊆PまたはJ⊆Pである。
    reason: ℤでP=6ℤ, I=2ℤ, J=3ℤとするとIJ=Pだが、IもJもPに含まれない。
  target: |
    ∀ (R : Type*) [CommRing R] (P I J : Ideal R), P.IsPrime → I * J ≤ P → I ≤ P ∨ J ≤ P
  proof: |
    by
      intro R _ P I J hP h
      exact hP.mul_le.mp h
- id: finite_domain_is_field
  kind: textbook
  level: 2
  topic: 環論・有限整域
  statement: 有限整域は体である。
  statement_en: Every finite integral domain is a field.
  assumptions:
  - $R$は整域
  - $R$は有限集合
  quantifiers:
  - 任意の有限整域$R$
  conclusion: $R$は体である。
  answer: |
    $R$を有限整域とし、$a\in R$を$0$でない元とする。写像$x\mapsto ax$は単射である。実際、$ax=ay$なら$a(x-y)=0$であり、$R$は整域で$a\neq 0$なので$x=y$である。

    $R$は有限集合なので、この単射は全射でもある。よって$ab=1$となる$b\in R$が存在する。

    $R$は零環でない可換環であり、$0$でない元はすべて単元なので、体である。
  strategy: Multiplication by a nonzero element is injective, hence surjective on a finite set.
  sketch:
  - 'setup: Fix a nonzero element a of R.'
  - 'derive: Cancellation makes x ↦ ax injective.'
  - 'derive: Finiteness makes the map surjective.'
  - 'conclude: Some b satisfies ab = 1, so a is a unit.'
  openmath: (forall (R) (-> (and (integral_domain R) (finite_ring R)) (is_field R)))
  hard_negative:
    statement: 整域は体である。
    reason: ℤは無限個の元をもつ整域だが、2が逆元をもたないので体でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] [Finite R], IsField R
  proof: |
    by
      intro R _ _ _
      exact Finite.isField_of_domain R
- id: unit_add_nilpotent_is_unit
  kind: gap
  level: 3
  topic: 環論・単元と冪零元
  statement: 可換環において、単元と冪零元の和は単元である。
  statement_en: In a commutative ring, the sum of a unit and a nilpotent element is a unit.
  assumptions:
  - $R$は可換環
  - $u\in R$は単元
  - $n\in R$は冪零元
  quantifiers:
  - 任意の可換環$R$、単元$u$、冪零元$n$
  conclusion: $u+n$は単元である。
  answer: |
    $R$を可換環、$u\in R$を単元、$n\in R$を冪零元とする。$n^k=0$となる正の整数$k$をとる。

    $m=-u^{-1}n$とおくと、$R$は可換なので$m^k=(-u^{-1})^kn^k=0$であり、$u+n=u(1-m)$である。さらに$(1-m)(1+m+\cdots+m^{k-1})=1-m^k=1$なので、$1-m$は単元である。したがって$u+n=u(1-m)$は単元の積であり、単元である。
  strategy: Factor out u and invert 1 - m by the finite geometric series.
  sketch:
  - 'setup: Put m = -u⁻¹n, which is nilpotent by commutativity.'
  - 'derive: Then u + n = u(1 - m).'
  - 'construct: If m^k = 0, the sum 1 + m + ... + m^(k-1) inverts 1 - m.'
  - 'conclude: So u + n is a product of units.'
  openmath: (forall (R u n) (-> (and (comm_ring R) (unit_element u R) (nilpotent_element n R)) (unit_element (+ u n) R)))
  hard_negative:
    statement: 可換環において単元と単元の和は単元である。
    reason: ℤで1+1=2は単元でない。
  target: |
    ∀ (R : Type*) [CommRing R] (u n : R), IsUnit u → IsNilpotent n → IsUnit (u + n)
  proof: |
    by
      intro R _ u n hu hn
      exact hn.isUnit_add_left_of_commute hu (Commute.all _ _)
- id: prime_element_irreducible
  kind: gap
  level: 3
  topic: 環論・素元と既約元
  statement: 整域の素元は既約元である。
  statement_en: Every prime element of an integral domain is irreducible.
  assumptions:
  - $R$は整域
  - $p\in R$は素元
  quantifiers:
  - 任意の整域$R$と素元$p\in R$
  conclusion: $p$は既約元である。
  answer: |
    $R$を整域、$p\in R$を素元とする。素元の定義より、$p\neq 0$で$p$は単元でなく、$p\mid ab$なら$p\mid a$または$p\mid b$である。

    $p=ab$とする。$p\mid ab$なので、$p\mid a$または$p\mid b$である。

    $p\mid a$のとき$a=pc$とおくと$p=pcb$である。$R$は整域で$p\neq 0$なので、$p$を消去して$cb=1$を得る。よって$b$は単元である。$p\mid b$のときも同様に$a$が単元となる。

    $p$は単元でないので、$p$は既約元である。
  strategy: Use primality on a factorization and cancel p.
  sketch:
  - 'setup: Suppose p = ab.'
  - 'derive: Primality gives p | a or p | b.'
  - 'case_split: If a = pc, then p = pcb.'
  - 'derive: Cancelling p shows b is a unit.'
  - 'conclude: The other case is symmetric, so p is irreducible.'
  openmath: (forall (R p) (-> (and (integral_domain R) (prime_element p R)) (irreducible_element p R)))
  hard_negative:
    statement: 整域でない可換環でも、素元は既約元である。
    reason: ℤ/6ℤで2は素元だが、2=2·4で2も4も単元でないので既約でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] (p : R), Prime p → Irreducible p
  proof: |
    by
      intro R _ _ p h
      exact h.irreducible
- id: pid_irreducible_is_prime
  kind: gap
  level: 3
  topic: 環論・単項イデアル整域の既約元
  statement: 単項イデアル整域の既約元は素元である。
  statement_en: Every irreducible element of a principal ideal domain is prime.
  assumptions:
  - $R$は単項イデアル整域
  - $p\in R$は既約元
  quantifiers:
  - 任意の単項イデアル整域$R$と既約元$p\in R$
  conclusion: $p$は素元である。
  answer: |
    $R$を単項イデアル整域、$p\in R$を既約元とする。既約元は$0$でも単元でもない。$a,b\in R$について$p\mid ab$かつ$p\nmid a$と仮定し、$p\mid b$を示す。

    $R$は単項イデアル整域なので、イデアル$(p,a)$は$(d)$と書ける。$p\in(d)$より$p=de$となる$e$がある。$p$は既約なので、$d$または$e$が単元である。

    $e$が単元なら$d=pe^{-1}$であり、$a\in(d)$より$p\mid a$となって仮定に反する。よって$d$は単元であり、$(p,a)=R$である。

    したがって$1=px+ay$となる$x,y\in R$がある。$b$を掛けると$b=pbx+(ab)y$であり、右辺の二項はどちらも$p$で割り切れる。よって$p\mid b$である。
  strategy: Generate the ideal (p, a) by one element and extract a Bezout identity.
  sketch:
  - 'setup: Suppose p divides ab but not a.'
  - 'construct: Write the ideal (p, a) as (d).'
  - 'derive: Since d divides p and p does not divide a, irreducibility makes d a unit.'
  - 'derive: Hence 1 = px + ay.'
  - 'conclude: Multiplying by b shows p divides b.'
  openmath: (forall (R p) (-> (and (principal_ideal_domain R) (irreducible_element p R)) (prime_element p R)))
  hard_negative:
    statement: 任意の整域において既約元は素元である。
    reason: ℤ[√-5]で2は既約だが、2は(1+√-5)(1-√-5)=6を割り切るのにどちらの因子も割り切らない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] [IsPrincipalIdealRing R] (p : R), Irreducible p → Prime p
  proof: |
    by
      intro R _ _ _ p h
      exact h.prime
- id: ufd_irreducible_iff_prime
  kind: gap
  level: 3
  topic: 環論・一意分解整域の既約元
  statement: 一意分解整域では、元が既約であることと素元であることは同値である。
  statement_en: In a unique factorization domain, an element is irreducible if and only if it is prime.
  assumptions:
  - $R$は一意分解整域
  - $p\in R$
  quantifiers:
  - 任意の一意分解整域$R$と元$p\in R$
  conclusion: $p$が既約元であることと$p$が素元であることは同値である。
  answer: |
    $R$を一意分解整域、$p\in R$とする。すなわち$R$の$0$でも単元でもない元は既約元の積に書け、その書き方は順序と同伴を除いて一意である。

    $p$が素元なら、整域の素元は既約元であるので$p$は既約である。

    逆に$p$を既約元とする。$p$は$0$でも単元でもない。$p\mid ab$とし、$ab=pc$と書く。$a$または$b$が$0$なら、$p$は$0$を割り切るので結論が成り立つ。$a$が単元なら$b=a^{-1}pc$より$p\mid b$であり、$b$が単元のときも同様に$p\mid a$である。

    残るのは$a,b$がともに$0$でも単元でもない場合である。$ab\neq 0$より$c\neq 0$である。$a,b$を既約元の積に書いて並べると、$ab$の既約分解が得られる。一方、$c$が単元なら$pc$は既約元であり、$c$が単元でなければ$c$の既約分解に$p$を加えて$pc$の既約分解が得られる。分解の一意性より、$p$は$a$または$b$の既約因子のどれかと同伴である。よって$p\mid a$または$p\mid b$であり、$p$は素元である。
  strategy: Compare the factorizations of ab and pc using uniqueness.
  sketch:
  - 'derive: Prime elements are irreducible in any domain.'
  - 'setup: Let p be irreducible with p | ab, and write ab = pc.'
  - 'case_split: The case a = 0 or b = 0 is immediate.'
  - 'derive: Uniqueness of factorization makes p an associate of an irreducible factor of a or b.'
  - 'conclude: So p divides a or b.'
  openmath: (forall (R p) (-> (unique_factorization_domain R) (<-> (irreducible_element p R) (prime_element p R))))
  hard_negative:
    statement: 一意分解整域では、既約元が生成するイデアルは極大イデアルである。
    reason: ℤ[X]は一意分解整域でXは既約だが、ℤ[X]/(X)≅ℤは体でなく、(X)は極大でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] [UniqueFactorizationMonoid R] (p : R), Irreducible p ↔ Prime p
  proof: |
    by
      intro R _ _ _ p
      exact UniqueFactorizationMonoid.irreducible_iff_prime
- id: two_irreducible_not_prime_z_sqrt_neg5
  kind: textbook
  level: 3
  topic: 環論・既約元と素元の違い
  statement: $\mathbb{Z}[\sqrt{-5}]$において$2$は既約元であるが素元ではない。
  statement_en: In the ring Z[√-5], the element 2 is irreducible but not prime.
  assumptions:
  - 環は$\mathbb{Z}[\sqrt{-5}]$である
  quantifiers:
  - $\mathbb{Z}[\sqrt{-5}]$の元$2$について述べる
  conclusion: $2$は既約元であり、素元でない。
  answer: |
    $A=\mathbb{Z}[\sqrt{-5}]$とし、$a,b\in\mathbb{Z}$について$N(a+b\sqrt{-5})=a^2+5b^2$とおく。$N(\alpha)$は$\alpha$とその共役$\bar\alpha$の積$\alpha\bar\alpha$に等しいので、$N(\alpha\beta)=N(\alpha)N(\beta)$であり、$N$の値は$0$以上の整数である。

    $N(\alpha)=1$なら$\alpha\bar\alpha=1$より$\alpha$は単元である。逆に$\alpha\beta=1$なら$N(\alpha)N(\beta)=1$より$N(\alpha)=1$である。よって単元とはノルムが$1$の元のことである。

    既約であることを示す。$N(2)=4$なので$2$は単元でなく、$0$でもない。$2=\alpha\beta$とすると$N(\alpha)N(\beta)=4$である。$a^2+5b^2=2$は整数解を持たない。実際、$b\neq 0$なら左辺は$5$以上であり、$b=0$なら$a^2=2$となって不可能である。よって$N(\alpha)$も$N(\beta)$も$2$でなく、$N(\alpha)=1$または$N(\beta)=1$である。すなわち$\alpha$または$\beta$は単元である。

    素元でないことを示す。$(1+\sqrt{-5})(1-\sqrt{-5})=6=2\cdot 3$なので、$2$はこの積を割り切る。$A$の元の$2$倍は$2c+2d\sqrt{-5}$の形であり、$\sqrt{-5}$の係数は偶数である。$1\pm\sqrt{-5}$の$\sqrt{-5}$の係数は奇数なので、$2$はどちらの因子も割り切らない。よって$2$は素元でない。
  strategy: Use the multiplicative norm for irreducibility and the factorization of 6 for non-primality.
  sketch:
  - 'setup: Use the multiplicative norm N(a + b√-5) = a² + 5b².'
  - 'derive: A factorization of 2 gives norms multiplying to 4.'
  - 'derive: The equation a² + 5b² = 2 has no integer solution, so one factor has norm 1 and is a unit.'
  - 'derive: The element 2 divides (1 + √-5)(1 - √-5) = 6.'
  - 'contradiction: Neither factor is divisible by 2 because its √-5 coefficient is odd.'
  - 'conclude: So 2 is irreducible but not prime.'
  openmath: (and (irreducible_element 2 (int_adjoin_sqrt -5)) (not (prime_element 2 (int_adjoin_sqrt -5))))
  hard_negative:
    statement: ガウス整数環ℤ[i]でも2は既約元で素元でない。
    reason: ℤ[i]では2=(1+i)(1-i)と非単元の積に分解するので、2は既約でない。
  target: |
    Irreducible (2 : Zsqrtd (-5)) ∧ ¬ Prime (2 : Zsqrtd (-5))
  proof: |
    by
      have nrm2 : ∀ z : Zsqrtd (-5), z.norm ≠ 2 := by
        intro z hz
        have h : z.re * z.re + 5 * (z.im * z.im) = 2 := by
          have := hz
          rw [Zsqrtd.norm_def] at this
          linarith
        have h1 : z.im * z.im = 0 := by nlinarith [mul_self_nonneg z.re, mul_self_nonneg z.im]
        have h2 : z.re * z.re = 2 := by
          rw [h1] at h
          linarith
        have h3 : z.re ≤ 1 := by nlinarith
        have h4 : -1 ≤ z.re := by nlinarith
        generalize z.re = r at *
        interval_cases r <;> omega
      have hnorm2 : Zsqrtd.norm (2 : Zsqrtd (-5)) = 4 := by decide
      constructor
      · refine ⟨?_, ?_⟩
        · intro h
          have := (Zsqrtd.isUnit_iff_norm_isUnit (2 : Zsqrtd (-5))).mp h
          rw [hnorm2] at this
          exact absurd this (by decide)
        · intro a b hab
          have hn : a.norm * b.norm = 4 := by rw [← Zsqrtd.norm_mul, ← hab, hnorm2]
          have ha : 0 ≤ a.norm := Zsqrtd.norm_nonneg (by norm_num) a
          have hb : 0 ≤ b.norm := Zsqrtd.norm_nonneg (by norm_num) b
          have hbpos : 0 < b.norm := by
            rcases hb.lt_or_eq with h | h
            · exact h
            · rw [← h] at hn
              simp at hn
          have ha4 : a.norm ≤ 4 := by nlinarith
          have ha2 := nrm2 a
          have hb2 := nrm2 b
          have hcases : a.norm = 1 ∨ b.norm = 1 := by
            generalize a.norm = u at *
            generalize b.norm = v at *
            interval_cases u
            · simp at hn
            · left
              rfl
            · exact absurd rfl ha2
            · omega
            · right
              omega
          rcases hcases with h | h
          · left
            exact (Zsqrtd.norm_eq_one_iff' (by norm_num) a).mp h
          · right
            exact (Zsqrtd.norm_eq_one_iff' (by norm_num) b).mp h
      · intro hp
        have hprod : (⟨1, 1⟩ : Zsqrtd (-5)) * ⟨1, -1⟩ = 2 * 3 := by
          ext <;> simp
        rcases hp.2.2 _ _ ⟨3, hprod⟩ with ⟨c, hc⟩ | ⟨c, hc⟩
        · have := congrArg Zsqrtd.im hc
          simp at this
          omega
        · have := congrArg Zsqrtd.im hc
          simp at this
          omega
- id: euclidean_domain_is_pid
  kind: textbook
  level: 3
  topic: 環論・ユークリッド整域
  statement: ユークリッド整域は単項イデアル整域である。
  statement_en: Every Euclidean domain is a principal ideal domain.
  assumptions:
  - $R$はユークリッド整域
  quantifiers:
  - 任意のユークリッド整域$R$
  conclusion: $R$の任意のイデアルは単項イデアルである。
  answer: |
    $R$をユークリッド整域とする。すなわち$R$は整域で、$R$上に整礎な関係$\prec$（無限に下る列を持たない関係）があり、任意の$x\in R$と$d\neq 0$について、$x=dq+r$かつ「$r=0$または$r\prec d$」を満たす$q,r\in R$が存在する。ふつうは自然数値の関数$\delta$を使い、$r\prec d$を$\delta(r)<\delta(d)$とする。

    $I$を$R$のイデアルとする。$I=\{0\}$なら$I=(0)$である。$I\neq\{0\}$なら、$I$の$0$でない元の集合は空でなく$\prec$が整礎なので、$\prec$について極小な元$d$がある。$(d)\subseteq I$は明らかである。

    $x\in I$をとり、$x=dq+r$と割る。$r=x-dq\in I$である。$r\neq 0$なら$r\prec d$となり、$d$の極小性に反する。よって$r=0$であり、$x\in(d)$である。したがって$I=(d)$である。
  strategy: Generate the ideal by a nonzero element of minimal Euclidean size.
  sketch:
  - 'setup: Let I be a nonzero ideal.'
  - 'construct: Pick a nonzero d in I of minimal Euclidean size.'
  - 'derive: For x in I, divide to get x = dq + r with r in I.'
  - 'contradiction: A nonzero r would have smaller size than d.'
  - 'conclude: So r = 0 and I = (d).'
  openmath: (forall (R) (-> (euclidean_domain R) (principal_ideal_domain R)))
  hard_negative:
    statement: 単項イデアル整域はユークリッド整域である。
    reason: ℤ[(1+√-19)/2]は単項イデアル整域だが、ユークリッド整域でないことが知られている。
  target: |
    ∀ (R : Type*) [EuclideanDomain R], IsPrincipalIdealRing R
  proof: |
    by
      intro R _
      infer_instance
- id: pid_is_ufd
  kind: textbook
  level: 3
  topic: 環論・一意分解整域
  statement: 単項イデアル整域は一意分解整域である。
  statement_en: Every principal ideal domain is a unique factorization domain.
  assumptions:
  - $R$は単項イデアル整域
  quantifiers:
  - 任意の単項イデアル整域$R$
  conclusion: $R$は一意分解整域である。
  answer: |
    $R$を単項イデアル整域とする。

    まず、単項イデアルの真の昇鎖$(a_1)\subsetneq(a_2)\subsetneq\cdots$が無限に続くことはない。無限に続くとすると、和集合はイデアルなので$(d)$と書ける。$d$はある$(a_k)$に属するので$(a_{k+1})\subseteq(d)\subseteq(a_k)$となり、矛盾する。

    分解の存在を示す。$0$でも単元でもない元$a$で既約元の積に書けないものがあるとする。$a$は既約でないので、$a=bc$と単元でない元の積に書ける。$b,c$はともに$0$でも単元でもなく、少なくとも一方は既約元の積に書けない。それを$b$とする。$c$は単元でないので$(a)\subsetneq(b)$である。実際、$(a)=(b)$なら$b=ae=bce$となる$e$があり、$b$を消去して$ce=1$となってしまう。同じ操作を$b$に繰り返すと単項イデアルの真の昇鎖が無限に続き、上で示したことに反する。

    分解の一意性を示す。単項イデアル整域の既約元は素元である。$p_1\cdots p_m=uq_1\cdots q_n$（$u$は単元、$p_i,q_j$は既約元）とし、$m$に関する帰納法を用いる。$m=0$なら左辺は$1$なので各$q_j$は単元となり、$n=0$である。$m\geq 1$なら$p_1$は素元なので、右辺の因子を割り切る。$p_1$は単元を割り切らないので、ある$q_j$を割り切る。$q_j$は既約で$p_1$は単元でないので、$q_j$は$p_1$の単元倍である。両辺から$p_1$を消去すると因子が一つ減った等式が得られ、帰納法の仮定より、分解は順序と同伴を除いて一意である。
  strategy: Get existence from the ascending chain condition and uniqueness from irreducible elements being prime.
  sketch:
  - 'derive: Every ascending chain of principal ideals stabilizes because its union is principal.'
  - 'derive: A nonzero non-unit therefore factors into irreducibles in finitely many steps.'
  - 'apply_theorem: Irreducible elements of a principal ideal domain are prime.'
  - 'induction: Cancel prime factors one at a time to compare two factorizations.'
  - 'conclude: The factorization is unique up to order and associates.'
  openmath: (forall (R) (-> (principal_ideal_domain R) (unique_factorization_domain R)))
  hard_negative:
    statement: 一意分解整域は単項イデアル整域である。
    reason: ℤ[X]は一意分解整域だが、イデアル(2, X)は単項でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] [IsPrincipalIdealRing R], UniqueFactorizationMonoid R
  proof: |
    by
      intro R _ _ _
      infer_instance
- id: pid_nonzero_prime_is_maximal
  kind: gap
  level: 3
  topic: 環論・単項イデアル整域の素イデアル
  statement: 単項イデアル整域の$0$でない素イデアルは極大イデアルである。
  statement_en: Every nonzero prime ideal of a principal ideal domain is maximal.
  assumptions:
  - $R$は単項イデアル整域
  - $P$は$R$の素イデアル
  - $P\neq\{0\}$
  quantifiers:
  - 任意の単項イデアル整域$R$と$0$でない素イデアル$P$
  conclusion: $P$は$R$の極大イデアルである。
  answer: |
    $R$を単項イデアル整域、$P$を$R$の$0$でない素イデアルとする。$P=(p)$と書くと$p\neq 0$である。素イデアルなので$P\neq R$である。

    $P$を含むイデアルは$(a)$と書ける。$p\in(a)$より$p=ab$となる$b\in R$がある。$ab\in P$で$P$は素イデアルなので、$a\in P$または$b\in P$である。

    $a\in P$なら$(a)\subseteq P$であり、$(a)=P$である。$b\in P$なら$b=pc$と書ける。すると$p=apc$であり、$R$は整域で$p\neq 0$なので$ac=1$である。よって$(a)=R$である。

    $P$を含むイデアルは$P$か$R$に限られるので、$P$は極大イデアルである。
  strategy: Write P = (p), factor p through any larger ideal, and use primality with cancellation.
  sketch:
  - 'setup: Write P = (p) with p nonzero and take (a) containing P.'
  - 'derive: Then p = ab for some b.'
  - 'case_split: Primality puts a or b in P.'
  - 'derive: If a is in P then (a) = P.'
  - 'derive: If b = pc then cancelling p gives ac = 1, so (a) = R.'
  - 'conclude: Hence P is maximal.'
  openmath: (forall (R P) (-> (and (principal_ideal_domain R) (prime_ideal P R) (!= P (zero_ideal R))) (maximal_ideal P R)))
  hard_negative:
    statement: 単項イデアル整域の素イデアルはすべて極大イデアルである。
    reason: ℤの(0)は素イデアルだが極大でない。P≠0の仮定が必要である。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] [IsPrincipalIdealRing R] (P : Ideal R), P.IsPrime → P ≠ ⊥ → P.IsMaximal
  proof: |
    by
      intro R _ _ _ P hP h
      exact IsPrime.to_maximal_ideal h
- id: polynomial_ring_over_ufd_is_ufd
  kind: named
  level: 3
  topic: 環論・多項式環の一意分解性
  statement: ガウスの定理。$R$が一意分解整域ならば、多項式環$R[X]$も一意分解整域である。
  statement_en: Gauss's theorem. If R is a unique factorization domain, then the polynomial ring R[X] is also a unique factorization domain.
  assumptions:
  - $R$は一意分解整域
  quantifiers:
  - 任意の一意分解整域$R$
  conclusion: $R[X]$は一意分解整域である。
  answer: |
    $R$を一意分解整域とし、$K$をその商体とする。$0$でない$f\in R[X]$の係数の最大公約元を$c(f)$と書く（単元倍を除いて定まる）。$c(f)$が単元のとき$f$は原始的であるという。$f=c(f)f_0$と書くと$f_0$は原始的である。一意分解整域では既約元は素元である。

    補題1（ガウスの補題）。原始多項式$f,g$の積は原始的である。$fg$が原始的でないとすると、$fg$の係数をすべて割り切る$R$の素元$p$がある。$R/(p)$は整域なので$(R/(p))[X]$も整域である。$fg$の像は$0$なので、$f$または$g$の像が$0$となる。すなわち$p$は$f$または$g$の係数をすべて割り切り、原始性に反する。

    補題2。$f\in R[X]$を原始的、$g\in R[X]$とする。$K[X]$で$f\mid g$なら$R[X]$でも$f\mid g$である。$g=0$なら明らかなので$g\neq 0$とし、$g=fh$（$h\in K[X]$）とする。分母を払って内容をくくり出すと、$h=(u/v)h_0$と書ける。ここで$h_0\in R[X]$は原始的、$u,v\in R$は互いに素で$v\neq 0$である。$vg=ufh_0$の両辺の内容を比べると、補題1より$vc(g)$は$u$の単元倍である。よって$v\mid u$であり、$v$は単元である。したがって$h\in R[X]$である。

    補題3。$f\in R[X]$が正の次数の原始多項式で$K[X]$において既約なら、$f$は$R[X]$の素元である。$f$は$0$でも単元でもない。$R[X]$で$f\mid gh$とする。$K[X]$は単項イデアル整域なので$f$は$K[X]$の素元であり、$K[X]$で$f\mid g$または$f\mid h$である。補題2より$R[X]$でも同じ整除が成り立つ。

    補題4。$p$が$R$の素元なら、$p$は$R[X]$の素元である。$R[X]/(p)\cong(R/(p))[X]$は整域だからである。

    素元分解の存在を示す。$f\in R[X]$を$0$でも単元でもない元とし、$f=c(f)f_0$と書く。$c(f)$は単元であるか$R$の素元の積であり、補題4より後者は$R[X]$の素元の積である。$f_0$の次数が$0$なら$f_0$は単元である。$f_0$の次数が正なら、単項イデアル整域$K[X]$で$f_0=h_1\cdots h_r$と既約元の積に書ける。各$h_i$を$h_i=c_ig_i$（$c_i\in K^\times$、$g_i\in R[X]$は原始的）と書くと、$g_i$は$K[X]$で既約である。$f_0=cg_1\cdots g_r$（$c\in K^\times$）と書くと、補題1より$g_1\cdots g_r$は原始的である。$c=u/v$（$u,v$は互いに素）とすると、$vf_0=ug_1\cdots g_r$の内容を比べて$v$と$u$は同伴となるので、$c$は$R$の単元である。補題3より$g_i$は素元なので、$f_0$は単元と素元の積である。

    一意性を示す。$R[X]$は整域で、$0$でも単元でもない元はすべて素元の積である。既約元$q$を素元の積に書くと、既約性より因子は一つだけなので$q$は素元の単元倍であり、それ自身素元である。また素元は既約元である。よって既約元と素元は一致する。既約元の積の等式$p_1\cdots p_m=uq_1\cdots q_n$では、$p_1$がある$q_j$を割り切り、既約性より両者は同伴である。これを消去して$m$に関する帰納法を用いると、分解は順序と同伴を除いて一意である。
  strategy: Reduce to the Euclidean ring K[X] and to R through contents and Gauss's lemma.
  sketch:
  - 'setup: Let K be the field of fractions of R.'
  - 'derive: Write a polynomial as its content times a primitive polynomial.'
  - 'apply_theorem: Factor the primitive part in the unique factorization domain K[X].'
  - 'apply_theorem: Gauss''s lemma brings the factorization back to R[X].'
  - 'conclude: Uniqueness in R and K[X] gives uniqueness in R[X].'
  openmath: (forall (R) (-> (unique_factorization_domain R) (unique_factorization_domain (polynomial_ring R))))
  hard_negative:
    statement: Rが単項イデアル整域ならば、R[X]も単項イデアル整域である。
    reason: ℤは単項イデアル整域だが、ℤ[X]のイデアル(2, X)は単項でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] [UniqueFactorizationMonoid R], UniqueFactorizationMonoid (Polynomial R)
  proof: |
    by
      intro R _ _ _
      infer_instance
- id: polynomial_monic_division
  kind: textbook
  level: 2
  topic: 環論・多項式の割り算
  statement: 零環でない可換環$R$上の多項式$f$とモニック多項式$g$に対して、$f=gq+r$かつ$\deg r<\deg g$を満たす多項式$q,r\in R[X]$が存在する。ただし$\deg 0=-\infty$とする。
  statement_en: For a polynomial f and a monic polynomial g over a nontrivial commutative ring, there are polynomials q and r with f = gq + r and deg r < deg g.
  assumptions:
  - $R$は零環でない可換環
  - $f,g\in R[X]$
  - $g$はモニック
  quantifiers:
  - 任意の零環でない可換環$R$と多項式$f,g\in R[X]$
  conclusion: $f=gq+r$かつ$\deg r<\deg g$となる$q,r\in R[X]$が存在する（$\deg 0=-\infty$とする）。
  answer: |
    $R$を零環でない可換環、$f,g\in R[X]$とし、$g$をモニックとする。$\deg 0=-\infty$と約束する。$R$は零環でないので$g\neq 0$であり、$m=\deg g\geq 0$である。

    $\deg f$に関する帰納法で示す。$\deg f<m$（$f=0$の場合を含む）なら、$q=0$、$r=f$でよい。

    $n=\deg f\geq m$とし、$f$の主係数を$a$とする。$g$はモニックなので$aX^{n-m}g$の主係数は$a$、次数は$n$である。よって$f_1=f-aX^{n-m}g$の次数は$n$より小さい。帰納法の仮定より、$f_1=gq_1+r$かつ$\deg r<m$となる$q_1,r$がある。$q=q_1+aX^{n-m}$とおくと$f=gq+r$である。
  strategy: Induct on the degree of f and remove the leading term using the monic divisor.
  sketch:
  - 'induction: Induct on the degree of f.'
  - 'case_split: If deg f < deg g, take q = 0 and r = f.'
  - 'derive: Otherwise subtract aX^(n-m)g, which lowers the degree because g is monic.'
  - 'conclude: Add aX^(n-m) to the quotient from the induction hypothesis.'
  openmath: (forall (R f g) (-> (and (comm_ring R) (nontrivial_ring R) (in f (polynomial_ring R)) (in g (polynomial_ring R)) (monic_polynomial g)) (exists (q r) (and (= f (+ (* g q) r)) (or (= r 0) (< (poly_degree r) (poly_degree g)))))))
  hard_negative:
    statement: 任意の可換環上で、0でない任意のgについてf=gq+r, deg r<deg gと割り算できる。
    reason: ℤ[X]でf=X, g=2Xとすると、Xの係数の比較から1=2q_0となり不可能である。
  target: |
    ∀ (R : Type*) [CommRing R] [Nontrivial R] (f g : Polynomial R), g.Monic → ∃ q r : Polynomial R, f = g * q + r ∧ r.degree < g.degree
  proof: |
    by
      intro R _ _ f g hg
      refine ⟨f /ₘ g, f %ₘ g, ?_, Polynomial.degree_modByMonic_lt f hg⟩
      rw [add_comm]
      exact (Polynomial.modByMonic_add_div f g).symm
- id: polynomial_remainder_theorem
  kind: gap
  level: 2
  topic: 環論・剰余の定理
  statement: 可換環$R$上の多項式$f$と$a\in R$について、$f=(X-a)q+f(a)$を満たす多項式$q\in R[X]$が存在する。
  statement_en: For a polynomial f over a commutative ring and an element a, there is a polynomial q with f = (X - a)q + f(a).
  assumptions:
  - $R$は可換環
  - $f\in R[X]$
  - $a\in R$
  quantifiers:
  - 任意の可換環$R$、多項式$f\in R[X]$、元$a\in R$
  conclusion: $f=(X-a)q+f(a)$となる$q\in R[X]$が存在する。
  answer: |
    $R$を可換環、$f=\sum_{k=0}^{n}c_kX^k\in R[X]$、$a\in R$とする。このとき$f-f(a)=\sum_{k=0}^{n}c_k(X^k-a^k)$である。$k\geq 1$について$X^k-a^k=(X-a)(X^{k-1}+aX^{k-2}+\cdots+a^{k-1})$であり、$k=0$の項は$0$である。よって$f-f(a)$は$X-a$で割り切れ、$f=(X-a)q+f(a)$となる$q\in R[X]$が存在する。
  strategy: Divide by the monic polynomial X - a and substitute X = a.
  sketch:
  - 'apply_theorem: Divide f by the monic polynomial X - a.'
  - 'derive: The remainder r has degree below 1, so it is a constant.'
  - 'conclude: Substituting X = a shows r = f(a).'
  openmath: (forall (R f a) (-> (and (comm_ring R) (in f (polynomial_ring R)) (in a R)) (exists (q) (= f (+ (* (- poly_var (poly_const a)) q) (poly_const (poly_eval f a)))))))
  hard_negative:
    statement: fをX-aで割った余りはf(-a)である。
    reason: f=X, a=1では余りは1だが、f(-1)=-1である。
  target: |
    ∀ (R : Type*) [CommRing R] (f : Polynomial R) (a : R), ∃ q : Polynomial R, f = (Polynomial.X - Polynomial.C a) * q + Polynomial.C (f.eval a)
  proof: |
    by
      intro R _ f a
      refine ⟨f /ₘ (Polynomial.X - Polynomial.C a), ?_⟩
      rw [← Polynomial.modByMonic_X_sub_C_eq_C_eval, add_comm]
      exact (Polynomial.modByMonic_add_div f _).symm
- id: polynomial_factor_theorem
  kind: textbook
  level: 2
  topic: 環論・因数定理
  statement: 因数定理。可換環$R$上の多項式$f$と$a\in R$について、$X-a$が$f$を割り切ることと$f(a)=0$は同値である。
  statement_en: Factor theorem. For a polynomial f over a commutative ring and an element a, X - a divides f if and only if f(a) = 0.
  assumptions:
  - $R$は可換環
  - $f\in R[X]$
  - $a\in R$
  quantifiers:
  - 任意の可換環$R$、多項式$f\in R[X]$、元$a\in R$
  conclusion: $X-a\mid f$であることと$f(a)=0$は同値である。
  answer: |
    $R$を可換環、$f\in R[X]$、$a\in R$とする。

    $f=(X-a)g$（$g\in R[X]$）とする。$R$は可換なので$a$の代入は環準同型であり、$f(a)=(a-a)g(a)=0$である。

    逆に$f(a)=0$とする。剰余の定理より$f=(X-a)q+f(a)$となる$q\in R[X]$があるので、$f=(X-a)q$である。
  strategy: Substitute in one direction and use the remainder theorem in the other.
  sketch:
  - 'derive: If f = (X - a)g, substituting a gives f(a) = 0.'
  - 'apply_theorem: The remainder theorem gives f = (X - a)q + f(a).'
  - 'conclude: If f(a) = 0 this says X - a divides f.'
  openmath: (forall (R f a) (-> (and (comm_ring R) (in f (polynomial_ring R)) (in a R)) (<-> (dvd (- poly_var (poly_const a)) f) (= (poly_eval f a) 0))))
  hard_negative:
    statement: f(a)=0ならば(X-a)²はfを割り切る。
    reason: f=X, a=0ではf(0)=0だが、X²はXを割り切らない。
  target: |
    ∀ (R : Type*) [CommRing R] (f : Polynomial R) (a : R), (Polynomial.X - Polynomial.C a) ∣ f ↔ f.eval a = 0
  proof: |
    by
      intro R _ f a
      exact Polynomial.dvd_iff_isRoot
- id: polynomial_root_count_le_degree
  kind: textbook
  level: 2
  topic: 環論・多項式の根の個数
  statement: 整域上の$0$でない多項式の相異なる根の個数は、その次数以下である。
  statement_en: A nonzero polynomial over an integral domain has at most as many distinct roots as its degree.
  assumptions:
  - $R$は整域
  - $f\in R[X]$は$0$でない
  - $S$は$f$の根からなる$R$の有限部分集合
  quantifiers:
  - 任意の整域$R$、多項式$f\in R[X]$、根の有限集合$S$
  conclusion: $S$の元の個数は$\deg f$以下である。
  answer: |
    $R$を整域、$f\in R[X]$を$0$でない多項式、$S\subseteq R$を$f$の根からなる有限集合とする。$\deg f$に関する帰納法で$|S|\leq\deg f$を示す。

    $S$が空なら明らかである。$S$が空でないとして$a\in S$をとる。因数定理より$f=(X-a)g$となる$g\in R[X]$があり、$g\neq 0$である。$R$は整域なので$\deg g=\deg f-1$である（特に$\deg f\geq 1$である）。

    $b\in S\setminus\{a\}$とすると$0=f(b)=(b-a)g(b)$である。$R$は整域で$b-a\neq 0$なので、$g(b)=0$である。よって$S\setminus\{a\}$は$g$の根からなる。帰納法の仮定より$|S|-1\leq\deg g=\deg f-1$であり、$|S|\leq\deg f$を得る。
  strategy: Peel off one root by the factor theorem and use that a domain has no zero divisors.
  sketch:
  - 'induction: Induct on the degree of f.'
  - 'apply_theorem: If a is a root, the factor theorem gives f = (X - a)g.'
  - 'derive: For another root b, 0 = (b - a)g(b), so g(b) = 0.'
  - 'conclude: The remaining roots are roots of g, so the bound follows.'
  openmath: (forall (R f S) (-> (and (integral_domain R) (in f (polynomial_ring R)) (!= f 0) (subset S R) (finite_set S) (forall (a) (-> (in a S) (= (poly_eval f a) 0)))) (<= (size S) (poly_degree f))))
  hard_negative:
    statement: 任意の可換環上で、0でない多項式の根の個数は次数以下である。
    reason: ℤ/8ℤではX²-1は1, 3, 5, 7の4個の根をもつ。整域の仮定が必要である。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] (f : Polynomial R) (S : Finset R), f ≠ 0 → (∀ a ∈ S, f.eval a = 0) → S.card ≤ f.natDegree
  proof: |
    by
      intro R _ _ f S hf hS
      classical
      have hsub : S ⊆ f.roots.toFinset := by
        intro a ha
        rw [Multiset.mem_toFinset, Polynomial.mem_roots hf]
        exact hS a ha
      calc S.card ≤ f.roots.toFinset.card := Finset.card_le_card hsub
        _ ≤ Multiset.card f.roots := Multiset.toFinset_card_le _
        _ ≤ f.natDegree := Polynomial.card_roots' f
- id: gauss_lemma_primitive_product
  kind: named
  level: 3
  topic: 環論・ガウスの補題
  statement: ガウスの補題。$\mathrm{GCD}$整域（一意分解整域を含む）上の原始多項式の積は原始多項式である。
  statement_en: Gauss's lemma. Over a GCD domain, which includes every unique factorization domain, the product of two primitive polynomials is primitive.
  assumptions:
  - $R$は$\mathrm{GCD}$整域
  - $f,g\in R[X]$は原始多項式
  quantifiers:
  - 任意の$\mathrm{GCD}$整域$R$と原始多項式$f,g\in R[X]$
  conclusion: $fg$は原始多項式である。
  answer: |
    $R$を$\mathrm{GCD}$整域、すなわち任意の二元が最大公約元を持つ整域とする。最大公約元は単元倍を除いて定まり、以下の等式は単元倍を除いて考える。有限個の元の最大公約元は、それらの公約元の全体で決まる。多項式$h\in R[X]$の係数の最大公約元を内容$c(h)$とし、$c(h)=1$のとき$h$は原始的であるという。$0$は原始的でない。

    次の二つの性質を用いる。

    性質1。$\gcd(ax,ay)=a\gcd(x,y)$である。$a\neq 0$かつ$x,y$の少なくとも一方が$0$でないとし、$d=\gcd(x,y)$とおく。$ad$は$ax,ay$を割り切るので、$\gcd(ax,ay)=adw$と書ける。$adw\mid ax$と$adw\mid ay$より$dw\mid x$かつ$dw\mid y$なので、$dw\mid d$であり、$w$は単元である。特に$c(ah)=ac(h)$である。

    性質2。$\gcd(d,a)=1$かつ$d\mid ab$なら$d\mid b$である。$b=0$なら明らかである。$b\neq 0$なら、$d$は$db$と$ab$を割り切り、性質1より$\gcd(db,ab)=b\gcd(d,a)=b$だからである。

    $f,g$を原始多項式とし、$\deg f+\deg g$に関する帰納法で$fg$が原始的であることを示す。$f,g$の主係数を$a,b$とし、$d=c(fg)$とおく。$R$は整域なので$fg\neq 0$であり、$fg$の主係数は$ab$である。よって$d\mid ab$である。

    $\gcd(d,a)=1$を示す。$n=\deg f$、$f'=f-aX^n$とおく。$f'=0$なら$f=aX^n$が原始的なので$a$は単元であり、主張は明らかである。$f'\neq 0$なら$f'=c(f')f_0$（$f_0$は原始的）と書ける。$\deg f_0<\deg f$なので、帰納法の仮定より$f_0g$は原始的であり、性質1より$c(f'g)=c(f')$である。$fg=f'g+aX^ng$なので、$fg$と$f'g$の対応する係数の差は$a$の倍数である。よって、$fg$の係数全体と$a$の公約元は、$f'g$の係数全体と$a$の公約元に一致する。したがって$\gcd(d,a)=\gcd(c(f'g),a)=\gcd(c(f'),a)=c(f)=1$である。

    $f$と$g$を入れ替えて同じ議論をすると$\gcd(d,b)=1$である。$\gcd(d,a)=1$と$d\mid ab$に性質2を使うと$d\mid b$である。すると$d=\gcd(d,b)=1$である。よって$fg$は原始的である。
  strategy: Induct on the total degree, showing the content of fg is coprime to both leading coefficients.
  sketch:
  - 'setup: Let d be the content of fg, which divides the product of the leading coefficients a and b.'
  - 'derive: Remove the leading term of f, write the rest as a content times a primitive polynomial, and apply the induction hypothesis.'
  - 'derive: Coefficients of fg and of the shorter product differ by multiples of a, so gcd(d, a) = 1.'
  - 'derive: Swapping f and g gives gcd(d, b) = 1.'
  - 'conclude: Since d divides ab and is coprime to a, it divides b, so d is a unit.'
  openmath: (forall (R f g) (-> (and (gcd_domain R) (in f (polynomial_ring R)) (in g (polynomial_ring R)) (primitive_polynomial f) (primitive_polynomial g)) (primitive_polynomial (* f g))))
  hard_negative:
    statement: 原始多項式の和は原始多項式である。
    reason: ℤ[X]でf=g=2X+1は原始的だが、和4X+2の係数は2で割り切れる。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] [NormalizedGCDMonoid R] (f g : Polynomial R), f.IsPrimitive → g.IsPrimitive → (f * g).IsPrimitive
  proof: |
    by
      intro R _ _ _ f g hf hg
      exact hf.mul hg
- id: primitive_irreducible_over_int_iff_rat
  kind: textbook
  level: 3
  topic: 環論・ℤ上とℚ上の既約性
  statement: $\mathbb{Z}$係数の原始多項式$f$について、$f$が$\mathbb{Z}[X]$で既約であることと$\mathbb{Q}[X]$で既約であることは同値である。
  statement_en: A primitive polynomial with integer coefficients is irreducible in Z[X] if and only if it is irreducible in Q[X].
  assumptions:
  - $f\in\mathbb{Z}[X]$は原始多項式
  quantifiers:
  - 任意の原始多項式$f\in\mathbb{Z}[X]$
  conclusion: $f$が$\mathbb{Z}[X]$で既約であることと$\mathbb{Q}[X]$で既約であることは同値である。
  answer: |
    $f\in\mathbb{Z}[X]$を原始多項式とする。すなわち$f$の係数の最大公約数は$1$である。

    $f$が$\mathbb{Q}[X]$で既約であるとする。$\mathbb{Z}[X]$の単元$\pm 1$は$\mathbb{Q}[X]$の単元なので、$f$は$\mathbb{Z}[X]$の単元でない。$\mathbb{Z}[X]$で$f=gh$とすると、$\mathbb{Q}[X]$での既約性より、$g$または$h$は$0$でない定数である。その定数は$f$の係数をすべて割り切るので$\pm 1$であり、$\mathbb{Z}[X]$の単元である。よって$f$は$\mathbb{Z}[X]$で既約である。

    逆に$f$が$\mathbb{Z}[X]$で既約であるとする。$f$が定数なら原始性より$f=\pm 1$となり単元であるから、$\deg f\geq 1$である。よって$f$は$\mathbb{Q}[X]$で$0$でも単元でもない。$\mathbb{Q}[X]$で$f=gh$と正の次数の二因子に分解したとする。分母を払って内容をくくり出すと、$g=\alpha g_0$、$h=\beta h_0$（$\alpha,\beta\in\mathbb{Q}$、$g_0,h_0\in\mathbb{Z}[X]$は原始的）と書ける。$\alpha\beta=u/v$（$u,v$は互いに素な整数）とすると$vf=ug_0h_0$である。ガウスの補題より$g_0h_0$は原始的なので、両辺の係数の最大公約数を比べて$|v|=|u|$である。よって$\alpha\beta=\pm 1$であり、$f=(\pm g_0)h_0$は$\mathbb{Z}[X]$での正の次数の二因子への分解である。正の次数の多項式は$\mathbb{Z}[X]$の単元でないので、$f$の既約性に反する。したがって$f$は$\mathbb{Q}[X]$で既約である。
  strategy: Clear denominators to primitive factors and apply Gauss's lemma.
  sketch:
  - 'setup: Suppose f = gh in Q[X] with both factors of positive degree.'
  - 'construct: Rescale g and h to primitive integer polynomials g₀ and h₀, so f = c g₀ h₀.'
  - 'apply_theorem: Gauss''s lemma makes g₀h₀ primitive.'
  - 'derive: Since f is primitive, c = ±1, which factors f in Z[X].'
  - 'derive: Conversely, non-unit factors of primitive f in Z[X] are nonconstant.'
  - 'conclude: So such a factorization remains proper in Q[X].'
  openmath: (forall (f) (-> (and (in f (polynomial_ring Z)) (primitive_polynomial f)) (<-> (irreducible_element f (polynomial_ring Z)) (irreducible_element (poly_map (canonical_ring_hom Z Q) f) (polynomial_ring Q)))))
  hard_negative:
    statement: 任意のf∈ℤ[X]について、ℤ[X]で既約であることとℚ[X]で既約であることは同値である。
    reason: 2Xはℚ[X]で既約だが、ℤ[X]では非単元2とXの積であり既約でない。
  target: |
    ∀ (f : Polynomial ℤ), f.IsPrimitive → (Irreducible f ↔ Irreducible (f.map (Int.castRingHom ℚ)))
  proof: |
    by
      intro f hf
      exact Polynomial.IsPrimitive.Int.irreducible_iff_irreducible_map_cast hf
- id: eisenstein_criterion_prime_ideal
  kind: named
  level: 3
  topic: 環論・アイゼンシュタインの判定法
  statement: アイゼンシュタインの判定法。整域$R$の素イデアル$P$と正の次数の原始多項式$f\in R[X]$について、主係数が$P$に属さず、主係数以外の係数が$P$に属し、定数項が$P^2$に属さなければ、$f$は$R[X]$で既約である。
  statement_en: Eisenstein's criterion. Let P be a prime ideal of an integral domain R and f a primitive polynomial of positive degree. If the leading coefficient is not in P, all other coefficients are in P and the constant term is not in P², then f is irreducible in R[X].
  assumptions:
  - $R$は整域
  - $P$は$R$の素イデアル
  - $f\in R[X]$は正の次数の原始多項式
  - $f$の主係数は$P$に属さない
  - $f$の主係数以外の係数は$P$に属する
  - $f$の定数項は$P^2$に属さない
  quantifiers:
  - 任意の整域$R$、素イデアル$P$、多項式$f\in R[X]$
  conclusion: $f$は$R[X]$で既約である。
  answer: |
    $R$を整域、$P$を$R$の素イデアルとする。$f=\sum_{i=0}^{n}c_iX^i\in R[X]$は$n\geq 1$の原始多項式で、$c_n\notin P$、$i<n$について$c_i\in P$、$c_0\notin P^2$を満たすとする。ここで原始的とは、$f$を割り切る定数が単元に限ることである。

    $f$は正の次数を持つので$0$でも単元でもない。$f=gh$と単元でない$g,h\in R[X]$の積に書けたと仮定する。$g$が定数なら原始性より単元となるので、$g$は定数でない。$h$も同様である。よって$k=\deg g\geq 1$、$l=\deg h\geq 1$、$k+l=n$である。

    $A=R/P$は整域であり、その商体を$L$とする。係数を$A$に写した多項式を上線で表す。$c_i\in P$（$i<n$）より$\bar g\bar h=\bar f=\bar c_nX^n$であり、$\bar c_n\neq 0$である。$L[X]$は一意分解整域で$X$は素元なので、$\bar g=aX^s$、$\bar h=bX^t$（$a,b\in L$は$0$でない、$s+t=n$）と書ける。$s\leq k$、$t\leq l$、$s+t=k+l$より$s=k\geq 1$、$t=l\geq 1$である。

    したがって$\bar g,\bar h$の定数項は$0$であり、$g(0),h(0)\in P$である。すると$c_0=g(0)h(0)\in P^2$となり、仮定に反する。よって$f$は既約である。
  strategy: Reduce modulo P, where the polynomial becomes a monomial, and deduce that both constant terms lie in P.
  sketch:
  - 'setup: Suppose f = gh with non-units g and h.'
  - 'derive: Primitivity forces both factors to have positive degree.'
  - 'translate: Modulo P the image of f is a nonzero monomial cXⁿ.'
  - 'derive: Over the fraction field of R/P, the images of g and h are monomials of positive degree.'
  - 'derive: Hence the constant terms of g and h both lie in P.'
  - 'contradiction: The constant term of f then lies in P².'
  openmath: (forall (R P f) (-> (and (integral_domain R) (prime_ideal P R) (in f (polynomial_ring R)) (primitive_polynomial f) (> (poly_degree f) 0) (notin (poly_leading_coeff f) P) (forall (n) (-> (and (in n N) (< n (poly_degree f))) (in (poly_coeff f n) P))) (notin (poly_coeff f 0) (ideal_product P P))) (irreducible_element f (polynomial_ring R))))
  hard_negative:
    statement: 原始性を仮定しなくても、他の条件を満たす多項式はR[X]で既約である。
    reason: ℤ[X]でf=2X+6, P=(3)は他の条件を満たすが、f=2(X+3)で2は非単元なので既約でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] (f : Polynomial R) (P : Ideal R), P.IsPrime → f.leadingCoeff ∉ P → (∀ n : ℕ, (n : WithBot ℕ) < f.degree → f.coeff n ∈ P) → 0 < f.degree → f.coeff 0 ∉ P ^ 2 → f.IsPrimitive → Irreducible f
  proof: |
    by
      intro R _ _ f P hP hl hc hd h0 hu
      exact Polynomial.irreducible_of_eisenstein_criterion hP hl hc hd h0 hu
- id: eisenstein_integer_monic_over_rat
  kind: gap
  level: 3
  topic: 環論・ℤ係数のアイゼンシュタイン判定
  statement: 正の次数のモニック多項式$f\in\mathbb{Z}[X]$と$\mathbb{Z}$の素元$p$について、主係数以外の係数が$p$で割り切れ、定数項が$p^2$で割り切れなければ、$f$は$\mathbb{Q}[X]$で既約である。
  statement_en: Let f in Z[X] be monic of positive degree and p a prime. If p divides every non-leading coefficient and p² does not divide the constant term, then f is irreducible in Q[X].
  assumptions:
  - $f\in\mathbb{Z}[X]$はモニック
  - $\deg f>0$
  - $p$は$\mathbb{Z}$の素元（素数またはその$-1$倍）
  - $f$の主係数以外の係数は$p$で割り切れる
  - $f$の定数項は$p^2$で割り切れない
  quantifiers:
  - 任意の$f\in\mathbb{Z}[X]$と$\mathbb{Z}$の素元$p$
  conclusion: $f$は$\mathbb{Q}[X]$で既約である。
  answer: |
    $f\in\mathbb{Z}[X]$を正の次数のモニック多項式、$p$を$\mathbb{Z}$の素元（素数またはその$-1$倍）とする。$f$の主係数以外の係数は$p$で割り切れ、定数項は$p^2$で割り切れないとする。

    モニック多項式は主係数が$1$なので原始的である。素イデアル$P=(p)$について、主係数$1$は$P$に属さず、主係数以外の係数は$P$に属する。$P^2=(p^2)$なので定数項は$P^2$に属さない。よってアイゼンシュタインの判定法（整域の素イデアルに関する形）より、$f$は$\mathbb{Z}[X]$で既約である。

    $\mathbb{Z}$係数の原始多項式については、$\mathbb{Z}[X]$での既約性と$\mathbb{Q}[X]$での既約性は同値である。したがって$f$は$\mathbb{Q}[X]$で既約である。
  strategy: Apply Eisenstein at the ideal (p), then transfer irreducibility to Q[X] by Gauss.
  sketch:
  - 'derive: A monic polynomial is primitive.'
  - 'translate: The divisibility conditions say the coefficients lie in (p) and the constant term is not in (p²).'
  - 'apply_theorem: Eisenstein''s criterion gives irreducibility in Z[X].'
  - 'apply_theorem: Gauss''s lemma transfers irreducibility to Q[X].'
  openmath: (forall (f p) (-> (and (in f (polynomial_ring Z)) (monic_polynomial f) (> (poly_degree f) 0) (prime_element p Z) (forall (n) (-> (and (in n N) (< n (poly_degree f))) (dvd p (poly_coeff f n)))) (not (dvd (^ p 2) (poly_coeff f 0)))) (irreducible_element (poly_map (canonical_ring_hom Z Q) f) (polynomial_ring Q))))
  hard_negative:
    statement: 定数項がp²で割り切れる場合も、他の条件を満たせばfはℚ[X]で既約である。
    reason: f=X²-4, p=2は他の条件を満たすが、f=(X-2)(X+2)と分解する。
  target: |
    ∀ (f : Polynomial ℤ) (p : ℤ), Prime p → f.Monic → 0 < f.natDegree → (∀ n, n < f.natDegree → p ∣ f.coeff n) → ¬ p ^ 2 ∣ f.coeff 0 → Irreducible (f.map (Int.castRingHom ℚ))
  proof: |
    by
      intro f p hp hm hd hc h0
      have hprim : f.IsPrimitive := hm.isPrimitive
      rw [← Polynomial.IsPrimitive.Int.irreducible_iff_irreducible_map_cast hprim]
      have hP : (Ideal.span {p}).IsPrime := (Ideal.span_singleton_prime hp.ne_zero).mpr hp
      refine Polynomial.irreducible_of_eisenstein_criterion hP ?_ ?_ ?_ ?_ hprim
      · rw [hm.leadingCoeff, Ideal.mem_span_singleton]
        exact hp.not_dvd_one
      · intro n hn
        rw [Ideal.mem_span_singleton]
        apply hc
        rw [Polynomial.degree_eq_natDegree hm.ne_zero] at hn
        exact_mod_cast hn
      · exact Polynomial.natDegree_pos_iff_degree_pos.mp hd
      · rw [Ideal.span_singleton_pow, Ideal.mem_span_singleton]
        exact h0
- id: monic_irreducible_of_reduction
  kind: gap
  level: 3
  topic: 環論・還元による既約性判定
  statement: 整域の間の環準同型$\varphi:R\to S$とモニック多項式$f\in R[X]$について、係数を$\varphi$で写した多項式$\varphi f$が$S[X]$で既約ならば、$f$は$R[X]$で既約である。
  statement_en: Let φ from R to S be a ring homomorphism between integral domains and f in R[X] monic. If the polynomial obtained by applying φ to the coefficients is irreducible in S[X], then f is irreducible in R[X].
  assumptions:
  - $R,S$は整域
  - $\varphi:R\to S$は環準同型
  - $f\in R[X]$はモニック
  - $\varphi f$は$S[X]$で既約
  quantifiers:
  - 任意の整域$R,S$、環準同型$\varphi:R\to S$、多項式$f\in R[X]$
  conclusion: $f$は$R[X]$で既約である。
  answer: |
    $R,S$を整域、$\varphi:R\to S$を環準同型、$f\in R[X]$をモニック多項式とする。$g\in R[X]$の係数を$\varphi$で写した多項式を$\varphi g$と書き、$\varphi f$が$S[X]$で既約であるとする。

    $f$は単元でない。$f$が単元なら$\varphi f$も単元となり、既約性に反するからである。また$f\neq 0$である。

    $f=gh$とする。$R$は整域なので、$g,h$の主係数の積は$f$の主係数$1$に等しく、どちらの主係数も$R$の単元である。単元は$\varphi$で$S$の単元に写り、$S$は整域なのでその像は$0$でない。よって$\deg\varphi g=\deg g$、$\deg\varphi h=\deg h$である。

    $\varphi f=(\varphi g)(\varphi h)$は既約なので、たとえば$\varphi g$が$S[X]$の単元である。$S$は整域なので$\deg\varphi g=0$であり、$\deg g=0$である。すると$g$はその主係数に等しく、$R$の単元である。$\varphi h$が単元の場合も同様に$h$が単元である。したがって$f$は既約である。
  strategy: Use that a monic factorization preserves degrees under reduction.
  sketch:
  - 'setup: Suppose f = gh.'
  - 'derive: The leading coefficients of g and h multiply to 1, so they are units.'
  - 'derive: Hence φ preserves the degrees of g and h.'
  - 'apply_theorem: Irreducibility of φ(f) makes one image a unit of degree 0.'
  - 'conclude: The corresponding factor has degree 0 and unit leading coefficient, so it is a unit.'
  openmath: (forall (R S phi f) (-> (and (integral_domain R) (integral_domain S) (ring_hom phi R S) (in f (polynomial_ring R)) (monic_polynomial f) (irreducible_element (poly_map phi f) (polynomial_ring S))) (irreducible_element f (polynomial_ring R))))
  hard_negative:
    statement: fがモニックでなくても、還元した多項式が既約ならfは既約である。
    reason: f=2X+2∈ℤ[X]はmod 3で次数1なので既約だが、f=2(X+1)で2は非単元である。
  target: |
    ∀ (R S : Type*) [CommRing R] [IsDomain R] [CommRing S] [IsDomain S] (φ : R →+* S) (f : Polynomial R), f.Monic → Irreducible (f.map φ) → Irreducible f
  proof: |
    by
      intro R S _ _ _ _ φ f hf h
      exact Polynomial.Monic.irreducible_of_irreducible_map φ f hf h
- id: low_degree_irreducible_iff_no_root
  kind: gap
  level: 3
  topic: 環論・低次多項式の既約性
  statement: 体$K$上の次数$2$または$3$の多項式$f$について、$f$が既約であることと$K$に根を持たないことは同値である。
  statement_en: A polynomial of degree 2 or 3 over a field K is irreducible if and only if it has no root in K.
  assumptions:
  - $K$は体
  - $f\in K[X]$
  - $2\leq\deg f\leq 3$
  quantifiers:
  - 任意の体$K$と多項式$f\in K[X]$
  conclusion: $f$が既約であることと、任意の$a\in K$で$f(a)\neq 0$であることは同値である。
  answer: |
    $K$を体、$f\in K[X]$を$2\leq\deg f\leq 3$の多項式とする。

    $f$が根$a\in K$を持つとする。因数定理より$f=(X-a)g$であり、$\deg g=\deg f-1\geq 1$である。$X-a$も$g$も単元でないので、$f$は既約でない。

    逆に$f$が既約でないとする。$f$は$0$でも単元でもないので、$f=gh$と単元でない$g,h$の積に書ける。体上では単元でない$0$以外の多項式の次数は$1$以上であり、$\deg g+\deg h\leq 3$なので、一方の次数は$1$である。それを$g=cX+d$（$c\neq 0$）とすると、$a=-d/c\in K$は$g$の根であり、$f(a)=g(a)h(a)=0$である。

    以上の対偶をとると、$f$が既約であることと$K$に根を持たないことは同値である。
  strategy: Link roots to linear factors and use the small degree to force a linear factor.
  sketch:
  - 'apply_theorem: A root a gives f = (X - a)g by the factor theorem.'
  - 'derive: Since deg g ≥ 1, f is reducible.'
  - 'setup: Conversely suppose f = gh with non-units g and h.'
  - 'derive: Degrees are at least 1 and sum to at most 3, so one factor is linear.'
  - 'conclude: A linear factor over a field has a root, which is a root of f.'
  openmath: (forall (K f) (-> (and (is_field K) (in f (polynomial_ring K)) (<= 2 (poly_degree f)) (<= (poly_degree f) 3)) (<-> (irreducible_element f (polynomial_ring K)) (forall (a) (-> (in a K) (!= (poly_eval f a) 0))))))
  hard_negative:
    statement: 体上の次数4の多項式についても、既約であることと根をもたないことは同値である。
    reason: (X²+1)²はℝ上で根をもたないが既約でない。
  target: |
    ∀ (K : Type*) [Field K] (f : Polynomial K), 2 ≤ f.natDegree → f.natDegree ≤ 3 → (Irreducible f ↔ ∀ a : K, f.eval a ≠ 0)
  proof: |
    by
      intro K _ f h2 h3
      rw [Polynomial.irreducible_iff_roots_eq_zero_of_degree_le_three h2 h3, Multiset.eq_zero_iff_forall_notMem]
      have hf : f ≠ 0 := by
        rintro rfl
        simp at h2
      simp only [Polynomial.mem_roots hf, Polynomial.IsRoot.def]
- id: polynomial_quotient_field_iff_irreducible
  kind: textbook
  level: 3
  topic: 環論・多項式環の剰余体
  statement: 体$K$上の多項式$f$について、$K[X]/(f)$が体であることと$f$が既約であることは同値である。
  statement_en: For a polynomial f over a field K, the quotient K[X]/(f) is a field if and only if f is irreducible.
  assumptions:
  - $K$は体
  - $f\in K[X]$
  quantifiers:
  - 任意の体$K$と多項式$f\in K[X]$
  conclusion: $K[X]/(f)$が体であることと$f$が既約であることは同値である。
  answer: |
    $K$を体、$f\in K[X]$とする。$K[X]/(f)$が体であることは、$(f)$が極大イデアルであることと同値である。よって$(f)$が極大であることと$f$が既約であることの同値を示せばよい。

    $f=0$のとき、$K[X]/(0)=K[X]$は$X$が逆元を持たないので体でなく、$(0)$は極大でない。$0$は既約でないので、どちらも成り立たない。

    $f\neq 0$とする。$(f)$が極大なら素イデアルである。$(f)\neq K[X]$より$f$は単元でないので、$f$は素元であり、整域の素元として既約である。

    逆に$f$が既約とする。$f$は単元でないので$(f)\neq K[X]$である。$(f)$を含むイデアルは、$K[X]$が単項イデアル整域なので$(g)$と書ける。$f=gh$となる$h$があり、既約性より$g$または$h$は単元である。$g$が単元なら$(g)=K[X]$であり、$h$が単元なら$(g)=(f)$である。よって$(f)$は極大である。
  strategy: Reduce to maximality of (f) in the principal ideal domain K[X], treating f = 0 separately.
  sketch:
  - 'apply_theorem: The quotient is a field exactly when (f) is maximal.'
  - 'case_split: If f = 0, both sides fail because K[X] is not a field and 0 is not irreducible.'
  - 'derive: If f ≠ 0 and (f) is maximal, then (f) is prime, so f is prime and irreducible.'
  - 'derive: If f is irreducible and (f) ⊆ (g), then g is a unit or an associate of f.'
  - 'conclude: Hence (f) is maximal exactly when f is irreducible.'
  openmath: (forall (K f) (-> (and (is_field K) (in f (polynomial_ring K))) (<-> (is_field (quotient_ring (polynomial_ring K) (principal_ideal f))) (irreducible_element f (polynomial_ring K)))))
  hard_negative:
    statement: ℤ上の多項式fについても、ℤ[X]/(f)が体であることとfが既約であることは同値である。
    reason: Xはℤ[X]で既約だが、ℤ[X]/(X)≅ℤは体でない。
  target: |
    ∀ (K : Type*) [Field K] (f : Polynomial K), IsField (Polynomial K ⧸ Ideal.span {f}) ↔ Irreducible f
  proof: |
    by
      intro K _ f
      rw [← Ideal.Quotient.maximal_ideal_iff_isField_quotient]
      constructor
      · intro h
        have hf : f ≠ 0 := by
          rintro rfl
          have hb : (⊥ : Ideal (Polynomial K)).IsMaximal := by simpa using h
          exact Polynomial.not_isField K (Ring.isField_iff_maximal_bot.mpr hb)
        exact ((Ideal.span_singleton_prime hf).mp h.isPrime).irreducible
      · intro h
        exact PrincipalIdealRing.isMaximal_of_irreducible h
- id: domain_characteristic_prime_or_zero
  kind: gap
  level: 3
  topic: 環論・環の標数
  statement: 整域の標数は$0$または素数である。
  statement_en: The characteristic of an integral domain is either zero or a prime number.
  assumptions:
  - $R$は整域
  - $p$は$R$の標数
  quantifiers:
  - 任意の整域$R$とその標数$p$
  conclusion: $p$は素数または$0$である。
  answer: |
    $R$を整域、$p$をその標数とする。すなわち$p$は自然数であり、自然数$m$について$m\cdot 1=0$と$p\mid m$は同値である。$p\neq 0$として$p$が素数であることを示す。

    整域は零環でないので$1\neq 0$であり、$p\neq 1$である。$p$が合成数であるとして、$p=ab$（$1<a<p$、$1<b<p$）と書く。$R$で$(a\cdot 1)(b\cdot 1)=p\cdot 1=0$であり、$R$は整域なので$a\cdot 1=0$または$b\cdot 1=0$である。すると$p\mid a$または$p\mid b$となるが、$0<a,b<p$なのでこれは起こらない。よって$p$は素数である。
  strategy: Factor the characteristic and use the absence of zero divisors.
  sketch:
  - 'setup: Assume p ≠ 0; since 1 ≠ 0, also p ≠ 1.'
  - 'case_split: Suppose p = ab with 1 < a, b < p.'
  - 'derive: Then (a·1)(b·1) = 0 in R.'
  - 'contradiction: One factor vanishes, against minimality of p.'
  - 'conclude: So p is prime.'
  openmath: (forall (R p) (-> (and (integral_domain R) (ring_characteristic R p)) (or (in p P) (= p 0))))
  hard_negative:
    statement: 任意の可換環の標数は0または素数である。
    reason: ℤ/6ℤの標数は6であり、素数でも0でもない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] (p : ℕ) [CharP R p], p.Prime ∨ p = 0
  proof: |
    by
      intro R _ _ p _
      exact CharP.char_is_prime_or_zero R p
- id: add_pow_prime_characteristic
  kind: gap
  level: 3
  topic: 環論・標数pとフロベニウス
  statement: 素数$p$を標数とする可換環では、任意の元$x,y$について$(x+y)^p=x^p+y^p$が成り立つ。
  statement_en: In a commutative ring of prime characteristic p, one has (x + y)^p = x^p + y^p.
  assumptions:
  - $R$は可換環
  - $p$は素数
  - $R$の標数は$p$
  quantifiers:
  - 任意の可換環$R$、素数$p$、元$x,y\in R$
  conclusion: $(x+y)^p=x^p+y^p$が成り立つ。
  answer: |
    $p$を素数、$R$を標数$p$の可換環、$x,y\in R$とする。$R$は可換なので二項定理より$(x+y)^p=\sum_{k=0}^{p}\binom{p}{k}x^ky^{p-k}$である。

    $0<k<p$とする。$k!\,(p-k)!\binom{p}{k}=p!$の右辺は$p$で割り切れる。一方、$k!\,(p-k)!$は$p$未満の正の整数の積であり、$p$は素数なのでこれを割り切らない。よって$p\mid\binom{p}{k}$である。

    標数が$p$なので$p\cdot 1=0$であり、$0<k<p$の項はすべて$0$である。残るのは$k=0,p$の項$y^p$と$x^p$である。
  strategy: Expand by the binomial theorem and kill the middle binomial coefficients.
  sketch:
  - 'apply_theorem: Expand (x + y)^p by the binomial theorem.'
  - 'derive: For 0 < k < p, the prime p divides the binomial coefficient C(p, k).'
  - 'conclude: In characteristic p only x^p and y^p remain.'
  openmath: (forall (R p x y) (-> (and (comm_ring R) (in p P) (ring_characteristic R p) (in x R) (in y R)) (= (^ (+ x y) p) (+ (^ x p) (^ y p)))))
  hard_negative:
    statement: 合成数nを標数とする可換環でも(x+y)^n=x^n+y^nが成り立つ。
    reason: ℤ/4ℤでx=y=1とすると、(1+1)^4=0だが1^4+1^4=2である。
  target: |
    ∀ (R : Type*) [CommRing R] (p : ℕ) [Fact p.Prime] [CharP R p] (x y : R), (x + y) ^ p = x ^ p + y ^ p
  proof: |
    by
      intro R _ p _ _ x y
      exact add_pow_char x y p
- id: frobenius_injective_reduced
  kind: gap
  level: 3
  topic: 環論・フロベニウス写像の単射性
  statement: 素数$p$を標数とする被約な可換環では、フロベニウス写像は単射である。すなわち$x^p=y^p$なら$x=y$である。
  statement_en: In a reduced commutative ring of prime characteristic p, the Frobenius map is injective, that is, x^p = y^p implies x = y.
  assumptions:
  - $R$は被約な可換環
  - $p$は素数
  - $R$の標数は$p$
  - $x,y\in R$は$x^p=y^p$を満たす
  quantifiers:
  - 任意の被約可換環$R$、素数$p$、元$x,y\in R$
  conclusion: $x=y$である。
  answer: |
    $p$を素数、$R$を標数$p$の被約な可換環とする。被約とは、$0$以外に冪零元を持たないことである。$x,y\in R$が$x^p=y^p$を満たすとする。

    標数$p$の可換環で成り立つ等式$(a+b)^p=a^p+b^p$を$a=x-y$、$b=y$に使うと、$x^p=(x-y)^p+y^p$である。仮定より$(x-y)^p=0$なので、$x-y$は冪零である。$R$は被約なので$x-y=0$であり、$x=y$である。
  strategy: Turn equal p-th powers into nilpotence of the difference.
  sketch:
  - 'derive: In characteristic p, (x - y)^p = x^p - y^p.'
  - 'translate: The hypothesis gives (x - y)^p = 0, so x - y is nilpotent.'
  - 'conclude: Reducedness gives x = y.'
  openmath: (forall (R p x y) (-> (and (comm_ring R) (reduced_ring R) (in p P) (ring_characteristic R p) (in x R) (in y R) (= (^ x p) (^ y p))) (= x y)))
  hard_negative:
    statement: 素数標数の任意の可換環でフロベニウス写像は単射である。
    reason: 𝔽_2[Y]/(Y²)ではYの像の2乗は0=0²だが、Yの像は0でない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsReduced R] (p : ℕ) [Fact p.Prime] [CharP R p] (x y : R), x ^ p = y ^ p → x = y
  proof: |
    by
      intro R _ _ p _ _ x y h
      exact frobenius_inj R p h
- id: fraction_field_element_as_quotient
  kind: gap
  level: 3
  topic: 環論・商体の元の表示
  statement: 整域$A$の商体$K$の任意の元は、$A$の元$a,b$（$b\neq 0$）の$K$における像の商として書ける。
  statement_en: Every element of the field of fractions K of an integral domain A has the form a/b with a and b in A and b nonzero.
  assumptions:
  - $A$は整域
  - $K$は$A$の商体
  quantifiers:
  - 任意の整域$A$、商体$K$、元$z\in K$
  conclusion: $\iota:A\to K$を標準的な写像とするとき、$z=\iota(a)/\iota(b)$となる$a,b\in A$（$b\neq 0$）が存在する。
  answer: |
    $A$を整域、$K$をその商体、$\iota:A\to K$を標準的な写像とし、$z\in K$とする。$K$は$A$上の同型を除いて、組$(a,b)$（$a,b\in A$、$b\neq 0$）の同値類$[a,b]$のなす体であり、$\iota(a)=[a,1]$である。同値関係は$(a,b)\sim(c,d)\iff ad=bc$で定まり、演算は分数の計算と同じである。

    $z=[a,b]$と書く。$b\neq 0$なので$[b,1]\neq 0$であり、その逆元は$[1,b]$である。積の定義より$[a,1][1,b]=[a,b]$なので、$z=[a,b]=[a,1][b,1]^{-1}=\iota(a)/\iota(b)$である。
  strategy: Unfold the definition of the field of fractions as equivalence classes of pairs.
  sketch:
  - 'translate: An element of K is a class of a pair (a, b) with b nonzero.'
  - 'conclude: This class equals the quotient of the images of a and b.'
  openmath: (forall (A K z) (-> (and (integral_domain A) (fraction_field_of K A) (in z K)) (exists (a b) (and (in a A) (in b A) (!= b 0) (= z (/ (fn_value (fraction_embedding A K) a) (fn_value (fraction_embedding A K) b)))))))
  hard_negative:
    statement: 商体の任意の元は、Aの元aとAの単元bによってa/bと書ける。
    reason: ℚの元1/2は、ℤの単元±1を分母とする形に書けない。
  target: |
    ∀ (A K : Type*) [CommRing A] [IsDomain A] [Field K] [Algebra A K] [IsFractionRing A K] (z : K), ∃ a b : A, b ≠ 0 ∧ z = algebraMap A K a / algebraMap A K b
  proof: |
    by
      intro A K _ _ _ _ _ z
      obtain ⟨a, b, hb, h⟩ := IsFractionRing.div_surjective A z
      exact ⟨a, b, nonZeroDivisors.ne_zero hb, h.symm⟩
- id: fraction_field_universal_property
  kind: textbook
  level: 3
  topic: 環論・商体の普遍性
  statement: 整域$A$の商体を$K$、標準的な写像を$\iota:A\to K$とする。体$L$への単射環準同型$g:A\to L$に対して、$h\circ\iota=g$を満たす環準同型$h:K\to L$がただ一つ存在する。
  statement_en: Let K be the field of fractions of an integral domain A. Every injective ring homomorphism g from A to a field L extends uniquely to a ring homomorphism from K to L.
  assumptions:
  - $A$は整域
  - $K$は$A$の商体で、$\iota:A\to K$は標準的な写像
  - $L$は体
  - $g:A\to L$は単射環準同型
  quantifiers:
  - 任意の整域$A$、商体$K$、体$L$、単射環準同型$g:A\to L$
  conclusion: 任意の$a\in A$で$h(\iota(a))=g(a)$を満たす環準同型$h:K\to L$がただ一つ存在する。
  answer: |
    $A$を整域、$K$をその商体、$\iota:A\to K$を標準的な写像、$L$を体、$g:A\to L$を単射環準同型とする。$K$の元は$\iota(a)/\iota(b)$（$b\neq 0$）の形である。以下、これを$a/b$と略記する。$a/b=c/d$は$ad=bc$と同値である。

    存在を示す。$g$は単射なので、$b\neq 0$なら$g(b)\neq 0$である。そこで$h(a/b)=g(a)/g(b)$と定める。$a/b=c/d$なら$ad=bc$より$g(a)g(d)=g(b)g(c)$なので、$g(a)/g(b)=g(c)/g(d)$であり、値は表示によらない。さらに$h\left(\frac{a}{b}+\frac{c}{d}\right)=\frac{g(ad+bc)}{g(bd)}=\frac{g(a)}{g(b)}+\frac{g(c)}{g(d)},\qquad h\left(\frac{a}{b}\cdot\frac{c}{d}\right)=\frac{g(ac)}{g(bd)}=\frac{g(a)}{g(b)}\cdot\frac{g(c)}{g(d)}$であり、$h(1/1)=1$なので、$h$は環準同型である。また$h(\iota(a))=h(a/1)=g(a)$である。

    一意性を示す。環準同型$k:K\to L$が$k\circ\iota=g$を満たすとする。$b\neq 0$なら$k(\iota(b))\,k(1/\iota(b))=k(1)=1$である。よって$k(a/b)=k(\iota(a))/k(\iota(b))=g(a)/g(b)=h(a/b)$であり、$k=h$である。
  strategy: Define the extension on fractions and use injectivity to keep denominators invertible.
  sketch:
  - 'derive: Injectivity gives g(b) ≠ 0 for b ≠ 0.'
  - 'construct: Set h(a/b) = g(a)/g(b).'
  - 'derive: The cross-multiplication relation shows h is well defined.'
  - 'derive: Fraction arithmetic shows h is a ring homomorphism.'
  - 'conclude: Any extension must satisfy the same formula, so it is unique.'
  openmath: (forall (A K L g) (-> (and (integral_domain A) (fraction_field_of K A) (is_field L) (ring_hom g A L) (injective_function g)) (exists (h) (and (ring_hom h K L) (forall (a) (-> (in a A) (= (fn_value h (fn_value (fraction_embedding A K) a)) (fn_value g a)))) (forall (k) (-> (and (ring_hom k K L) (forall (a) (-> (in a A) (= (fn_value k (fn_value (fraction_embedding A K) a)) (fn_value g a))))) (= k h)))))))
  hard_negative:
    statement: 単射でない環準同型g:A→Lも商体Kに拡張される。
    reason: ℤ→𝔽_pはpを0に写すが、拡張があれば1=h(p)h(1/p)=0となり矛盾する。
  target: |
    ∀ (A K L : Type*) [CommRing A] [IsDomain A] [Field K] [Algebra A K] [IsFractionRing A K] [Field L] (g : A →+* L), Function.Injective g → ∃! h : K →+* L, ∀ a : A, h (algebraMap A K a) = g a
  proof: |
    by
      intro A K L _ _ _ _ _ _ g hg
      refine ⟨IsFractionRing.lift hg, fun a => IsFractionRing.lift_algebraMap hg a, ?_⟩
      intro h' hh'
      apply IsFractionRing.ringHom_ext (A := A)
      intro a
      rw [hh', IsFractionRing.lift_algebraMap]
- id: nilradical_eq_inter_primes
  kind: textbook
  level: 4
  topic: 環論・冪零根基
  statement: 可換環の冪零根基（冪零元全体）は、すべての素イデアルの共通部分に等しい。
  statement_en: The nilradical of a commutative ring, that is, the set of its nilpotent elements, equals the intersection of all prime ideals.
  assumptions:
  - $R$は可換環
  quantifiers:
  - 任意の可換環$R$
  conclusion: $R$の冪零根基は$R$の素イデアル全体の共通部分に等しい。
  answer: |
    $R$を可換環とする。$x\in R$が冪零であることと、$x$がすべての素イデアルに属することの同値を示す。

    $x$が冪零とし、$x^n=0$（$n\geq 1$）とする。$P$を素イデアルとすると、$x^n=0\in P$である。$P$は素イデアルなので、$n$に関する帰納法により$x\in P$である。

    逆に$x$が冪零でないとして、$x$を含まない素イデアルを構成する。$S=\{x^n\mid n\geq 0\}$とする。$S$と交わらない$R$のイデアルの全体を$\mathcal{T}$とし、包含で順序づける。$x$は冪零でないので$0\notin S$であり、$\{0\}\in\mathcal{T}$である。$\mathcal{T}$の空でない鎖の和集合はイデアルであり、$S$と交わらないので、鎖の上界である。ツォルンの補題より、$\mathcal{T}$は極大元$P$を持つ。

    $P$が素イデアルであることを示す。$1\in S$より$P\neq R$である。$a,b\notin P$とする。$P+(a)$と$P+(b)$は$P$を真に含むので$S$と交わり、$x^m\in P+(a)$、$x^n\in P+(b)$となる$m,n$がある。積をとると$x^{m+n}\in P+(ab)$である。$ab\in P$なら$x^{m+n}\in P$となり、$P$が$S$と交わらないことに反する。よって$ab\notin P$である。

    $x\in S$なので$x\notin P$である。したがって$x$はすべての素イデアルに属するわけではない。
  strategy: The easy inclusion uses primality; the other builds a prime ideal avoiding the powers of x by Zorn's lemma.
  sketch:
  - 'derive: If x^n = 0, then x lies in every prime ideal.'
  - 'setup: Conversely, let x be non-nilpotent.'
  - 'apply_theorem: Zorn''s lemma gives an ideal P maximal among those missing all powers of x.'
  - 'derive: If a, b are outside P, then P + (a) and P + (b) contain powers of x.'
  - 'contradiction: If ab were in P, a power of x would lie in P.'
  - 'conclude: So P is a prime ideal not containing x.'
  openmath: (forall (R x) (-> (and (comm_ring R) (in x R)) (<-> (in x (nilradical_of R)) (forall (P) (-> (prime_ideal P R) (in x P))))))
  hard_negative:
    statement: 冪零根基はすべての極大イデアルの共通部分に等しい。
    reason: それはジャコブソン根基であり、局所環ℤ_(p)では冪零根基は0だがジャコブソン根基はpℤ_(p)である。
  target: |
    ∀ (R : Type*) [CommRing R], nilradical R = sInf {P : Ideal R | P.IsPrime}
  proof: |
    by
      intro R _
      exact nilradical_eq_sInf R
- id: jacobson_radical_mem_iff
  kind: gap
  level: 4
  topic: 環論・ジャコブソン根基
  statement: 可換環$R$の元$x$について、$x$がジャコブソン根基（極大イデアル全体の共通部分）に属することと、任意の$y\in R$に対して$xy+1$が単元であることは同値である。
  statement_en: An element x lies in the Jacobson radical of a commutative ring if and only if xy + 1 is a unit for every y.
  assumptions:
  - $R$は可換環
  - $x\in R$
  quantifiers:
  - 任意の可換環$R$と元$x\in R$
  conclusion: $x$がジャコブソン根基に属することと、すべての$y\in R$で$xy+1$が単元であることは同値である。
  answer: |
    $R$を可換環、$x\in R$とする。ジャコブソン根基とは、$R$の極大イデアル全体の共通部分である。

    $x$がジャコブソン根基に属するとし、$y\in R$とする。$xy+1$が単元でないとすると、可換環の非単元はある極大イデアルに属するので、$xy+1\in M$となる極大イデアル$M$がある。$x\in M$なので$1=(xy+1)-xy\in M$となり、$M\neq R$に反する。よって$xy+1$は単元である。

    逆に$x$がある極大イデアル$M$に属さないとする。$M+(x)$は$M$を真に含むので$R$に等しく、$m+xz=1$となる$m\in M$と$z\in R$がある。$y=-z$とおくと$xy+1=m\in M$である。$M$は真のイデアルなので$m$は単元でない。よって、すべての$y$で$xy+1$が単元であれば、$x$はすべての極大イデアルに属する。
  strategy: Put a non-unit into a maximal ideal for one direction and use M + (x) = R for the other.
  sketch:
  - 'setup: Assume x is in every maximal ideal.'
  - 'contradiction: A non-unit xy + 1 lies in a maximal ideal containing x, which would contain 1.'
  - 'setup: Conversely, suppose x is not in a maximal ideal M.'
  - 'derive: Then M + (x) = R, so m + xz = 1 with m in M.'
  - 'conclude: With y = -z, xy + 1 = m is not a unit.'
  openmath: (forall (R x) (-> (and (comm_ring R) (in x R)) (<-> (in x (jacobson_radical R)) (forall (y) (-> (in y R) (unit_element (+ (* x y) 1) R))))))
  hard_negative:
    statement: xがジャコブソン根基に属することとx+1が単元であることは同値である。
    reason: ℤでx=-2とするとx+1=-1は単元だが、ℤのジャコブソン根基は0である。
  target: |
    ∀ (R : Type*) [CommRing R] (x : R), x ∈ Ideal.jacobson (⊥ : Ideal R) ↔ ∀ y : R, IsUnit (x * y + 1)
  proof: |
    by
      intro R _ x
      exact Ideal.mem_jacobson_bot
- id: nakayama_lemma
  kind: named
  level: 4
  topic: 環論・中山の補題
  statement: 中山の補題。可換環$R$のイデアル$I$がジャコブソン根基に含まれ、$R$加群の有限生成部分加群$N$が$N\subseteq IN$を満たすならば、$N=0$である。
  statement_en: Nakayama's lemma. If an ideal I of a commutative ring R lies in the Jacobson radical and a finitely generated submodule N satisfies N ⊆ IN, then N = 0.
  assumptions:
  - $R$は可換環
  - $M$は$R$加群
  - $N$は$M$の有限生成部分加群
  - $I$は$R$のイデアルでジャコブソン根基に含まれる
  - $N\subseteq IN$
  quantifiers:
  - 任意の可換環$R$、$R$加群$M$、部分加群$N$、イデアル$I$
  conclusion: $N=0$である。
  answer: |
    $R$を可換環、$M$を$R$加群、$N$を$M$の有限生成部分加群、$I$を$R$のジャコブソン根基に含まれるイデアルとし、$N\subseteq IN$とする。

    $N\neq 0$と仮定する。$N$の生成系のうち元の個数$n$が最小のものを$u_1,\ldots,u_n$とする。$n\geq 1$である。

    $u_n\in N\subseteq IN$であり、$IN$の元は$r\in I$と$w\in N$の積$rw$の有限和である。各$w$を$u_i$で展開すると、$u_n=\sum_{i=1}^{n}a_iu_i$（$a_i\in I$）と書ける。移項すると$(1-a_n)u_n=\sum_{i<n}a_iu_i$である。

    $a_n$はジャコブソン根基に属するので、$1-a_n=a_n\cdot(-1)+1$は単元である。よって$u_n$は$u_1,\ldots,u_{n-1}$の$R$係数一次結合である。$n=1$なら$u_1=0$となって$N=0$であり、仮定に反する。$n\geq 2$なら$u_1,\ldots,u_{n-1}$が$N$を生成し、$n$の最小性に反する。したがって$N=0$である。
  strategy: Take a minimal generating set and eliminate one generator using that 1 - a is a unit.
  sketch:
  - 'setup: Suppose N ≠ 0 and choose a generating set of minimal size.'
  - 'derive: Since N ⊆ IN, the last generator is an I-combination of all generators.'
  - 'derive: Moving terms gives (1 - a) uₙ as a combination of the others.'
  - 'apply_theorem: The element 1 - a is a unit because a lies in the Jacobson radical.'
  - 'contradiction: Then uₙ is redundant, against minimality.'
  openmath: (forall (R M N I) (-> (and (comm_ring R) (module_over M R) (submodule_of N M) (finitely_generated_submodule N) (ideal_of I R) (subset I (jacobson_radical R)) (subset N (ideal_smul_submodule I N))) (= N (zero_submodule M))))
  hard_negative:
    statement: 有限生成を仮定しなくても、N⊆INならN=0である。
    reason: 局所環ℤ_(p)上の加群ℚでは、I=(p)についてIℚ=ℚだがℚ≠0である。
  target: |
    ∀ (R M : Type*) [CommRing R] [AddCommGroup M] [Module R M] (I : Ideal R) (N : Submodule R M), N.FG → N ≤ I • N → I ≤ Ideal.jacobson ⊥ → N = ⊥
  proof: |
    by
      intro R M _ _ _ I N hN h hI
      exact Submodule.eq_bot_of_le_smul_of_le_jacobson_bot I N hN h hI
- id: domain_idempotent_zero_or_one
  kind: gap
  level: 2
  topic: 環論・冪等元
  statement: 整域の冪等元は$0$または$1$である。
  statement_en: The only idempotents of an integral domain are 0 and 1.
  assumptions:
  - $R$は整域
  - $e\in R$は$e^2=e$を満たす
  quantifiers:
  - 任意の整域$R$と元$e\in R$
  conclusion: $e=0$または$e=1$である。
  answer: |
    $R$を整域、$e\in R$を$e^2=e$を満たす元とする。$e(e-1)=e^2-e=0$である。$R$は整域なので、$e=0$または$e-1=0$である。すなわち$e=0$または$e=1$である。
  strategy: Factor e² - e and use that a domain has no zero divisors.
  sketch:
  - 'derive: The hypothesis gives e(e - 1) = 0.'
  - 'conclude: With no zero divisors, e = 0 or e = 1.'
  openmath: (forall (R e) (-> (and (integral_domain R) (in e R) (= (* e e) e)) (or (= e 0) (= e 1))))
  hard_negative:
    statement: 任意の可換環の冪等元は0または1である。
    reason: ℤ/6ℤで3²=3であり、3は0でも1でもない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsDomain R] (e : R), e * e = e → e = 0 ∨ e = 1
  proof: |
    by
      intro R _ _ e h
      by_cases he : e = 0
      · exact Or.inl he
      · exact Or.inr (mul_left_cancel₀ he (by rw [h, mul_one]))
- id: idempotent_ideal_decomposition
  kind: gap
  level: 3
  topic: 環論・冪等元とイデアル分解
  statement: 可換環$R$の冪等元$e$について、$(e)+(1-e)=R$かつ$(e)\cap(1-e)=\{0\}$が成り立つ。
  statement_en: For an idempotent e of a commutative ring, one has (e) + (1 - e) = R and (e) ∩ (1 - e) = 0.
  assumptions:
  - $R$は可換環
  - $e\in R$は$e^2=e$を満たす
  quantifiers:
  - 任意の可換環$R$と冪等元$e\in R$
  conclusion: $(e)+(1-e)=R$かつ$(e)\cap(1-e)=\{0\}$である。
  answer: |
    $R$を可換環、$e\in R$を$e^2=e$を満たす元とする。

    $1=e+(1-e)\in(e)+(1-e)$なので、$(e)+(1-e)=R$である。

    $x\in(e)\cap(1-e)$とし、$x=ea=(1-e)b$（$a,b\in R$）と書く。$x=ea$より$ex=e^2a=ea=x$である。一方、$x=(1-e)b$より$ex=(e-e^2)b=0$である。よって$x=0$である。
  strategy: Use 1 = e + (1 - e) and e(1 - e) = 0.
  sketch:
  - 'derive: The identity 1 = e + (1 - e) shows the sum is R.'
  - 'setup: Take x = ea = (1 - e)b in the intersection.'
  - 'derive: Idempotence gives ex = x.'
  - 'conclude: Also ex = e(1 - e)b = 0, so x = 0.'
  openmath: (forall (R e) (-> (and (comm_ring R) (in e R) (= (* e e) e)) (and (= (ideal_sum (principal_ideal e) (principal_ideal (- 1 e))) (unit_ideal R)) (= (inter (principal_ideal e) (principal_ideal (- 1 e))) (zero_ideal R)))))
  hard_negative:
    statement: 可換環の任意の元eについて(e)∩(1-e)=0である。
    reason: ℤでe=2とすると(1-e)=(-1)=ℤなので、共通部分は2ℤであり0でない。
  target: |
    ∀ (R : Type*) [CommRing R] (e : R), e * e = e → Ideal.span {e} ⊔ Ideal.span {1 - e} = ⊤ ∧ Ideal.span {e} ⊓ Ideal.span {1 - e} = ⊥
  proof: |
    by
      intro R _ e h
      constructor
      · rw [Ideal.eq_top_iff_one, Submodule.mem_sup]
        exact ⟨e, Ideal.mem_span_singleton_self e, 1 - e, Ideal.mem_span_singleton_self _, by ring⟩
      · rw [eq_bot_iff]
        intro x hx
        obtain ⟨hx1, hx2⟩ := Submodule.mem_inf.mp hx
        obtain ⟨a, ha⟩ := Ideal.mem_span_singleton.mp hx1
        obtain ⟨b, hb⟩ := Ideal.mem_span_singleton.mp hx2
        have h0 : x = 0 := by
          have hex : e * x = x := by rw [ha, ← mul_assoc, h]
          have hz : e * x = 0 := by
            rw [hb]
            linear_combination (-b) * h
          rw [← hex, hz]
        rw [h0]
        exact Submodule.zero_mem _
- id: matrix_unit_iff_det_unit
  kind: gap
  level: 2
  topic: 環論・行列環の単元
  statement: 可換環$R$上の正方行列$A$について、$A$が行列環の単元であることと$\det A$が$R$の単元であることは同値である。
  statement_en: A square matrix A over a commutative ring R is a unit of the matrix ring if and only if det A is a unit of R.
  assumptions:
  - $R$は可換環
  - $A$は有限集合で添字づけられた$R$上の正方行列
  quantifiers:
  - 任意の可換環$R$、有限な添字集合、正方行列$A$
  conclusion: $A$が行列環の単元であることと$\det A$が$R$の単元であることは同値である。
  answer: |
    $R$を可換環、$A$を有限集合で添字づけられた$R$上の正方行列、$E$を単位行列とする。

    $A$が単元なら、$AB=E$となる行列$B$がある。行列式の乗法性より$\det A\cdot\det B=\det E=1$なので、$\det A$は$R$の単元である。

    逆に$\det A$が単元とする。余因子行列$\operatorname{adj}A$は$A\operatorname{adj}A=(\operatorname{adj}A)A=(\det A)E$を満たす。よって$(\det A)^{-1}\operatorname{adj}A$は$A$の両側逆行列であり、$A$は単元である。
  strategy: Use multiplicativity of the determinant and the adjugate formula.
  sketch:
  - 'derive: AB = E gives det A · det B = 1.'
  - 'apply_theorem: The adjugate satisfies A adj A = adj A A = (det A) E.'
  - 'conclude: If det A is a unit, then (det A)⁻¹ adj A inverts A.'
  openmath: (forall (n R A) (-> (and (comm_ring R) (finite_set n) (in A (matrix_ring n R))) (<-> (unit_element A (matrix_ring n R)) (unit_element (matrix_det A) R))))
  hard_negative:
    statement: 可換環上の正方行列が可逆であることとdet A≠0は同値である。
    reason: ℤ上の1次行列(2)はdet=2≠0だが、ℤ上で逆行列をもたない。
  target: |
    ∀ (n R : Type*) [Fintype n] [DecidableEq n] [CommRing R] (A : Matrix n n R), IsUnit A ↔ IsUnit A.det
  proof: |
    by
      intro n R _ _ _ A
      exact Matrix.isUnit_iff_isUnit_det A
- id: matrix_ring_nonzero_square_zero
  kind: gap
  level: 2
  topic: 環論・行列環の冪零元
  statement: 零環でない可換環$R$上で、相異なる添字$i,j$を持つ有限集合で添字づけられた行列環には、$A\neq 0$かつ$A^2=0$を満たす行列$A$が存在する。
  statement_en: Over a nontrivial commutative ring, a matrix ring with at least two distinct indices contains a nonzero matrix A with A² = 0.
  assumptions:
  - $R$は零環でない可換環
  - $i,j$は有限な添字集合の相異なる元
  quantifiers:
  - 任意の零環でない可換環$R$、有限な添字集合、相異なる添字$i,j$
  conclusion: $A\neq 0$かつ$A^2=0$を満たす行列$A$が存在する。
  answer: |
    $R$を零環でない可換環、$\Lambda$を有限集合、$i,j\in\Lambda$を$i\neq j$である添字とする。$(i,j)$成分だけが$1$で他の成分が$0$の行列を$E_{ij}$とする。$R$は零環でないので$1\neq 0$であり、$E_{ij}\neq 0$である。

    $E_{ij}^2$の$(k,l)$成分は$\sum_{m\in\Lambda}(E_{ij})_{km}(E_{ij})_{ml}$である。第$m$項が$0$でないためには$m=j$かつ$m=i$が必要だが、$i\neq j$なのでそのような$m$はない。よって$E_{ij}^2=0$である。$A=E_{ij}$が求める行列である。
  strategy: Exhibit an off-diagonal matrix unit.
  sketch:
  - 'construct: Take the matrix unit E_ij with i ≠ j.'
  - 'derive: It is nonzero because 1 ≠ 0 in R.'
  - 'conclude: The product rule for matrix units gives E_ij² = 0.'
  openmath: (forall (n R i j) (-> (and (comm_ring R) (nontrivial_ring R) (finite_set n) (in i n) (in j n) (!= i j)) (exists (A) (and (in A (matrix_ring n R)) (!= A 0) (= (* A A) 0)))))
  hard_negative:
    statement: 添字が1個の行列環でも、零環でなければA≠0かつA²=0となる行列が存在する。
    reason: ℝ上の1次行列環はℝと同じであり、0でない元の2乗は0でない。
  target: |
    ∀ (n R : Type*) [Fintype n] [DecidableEq n] [CommRing R] [Nontrivial R] (i j : n), i ≠ j → ∃ A : Matrix n n R, A ≠ 0 ∧ A * A = 0
  proof: |
    by
      intro n R _ _ _ _ i j hij
      refine ⟨Matrix.single i j 1, ?_, ?_⟩
      · intro h
        have := congrFun (congrFun h i) j
        simp at this
      · rw [Matrix.single_mul_single_of_ne]
        exact hij.symm
- id: noetherian_iff_ideals_fg
  kind: textbook
  level: 3
  topic: 環論・ネーター環
  statement: 可換環$R$について、イデアルの任意の昇鎖$I_0\subseteq I_1\subseteq\cdots$がある番号から先で一定になること（昇鎖条件）と、$R$のすべてのイデアルが有限生成であることは同値である。
  statement_en: For a commutative ring R, every ascending chain of ideals I_0 ⊆ I_1 ⊆ ... is eventually constant if and only if every ideal of R is finitely generated.
  assumptions:
  - $R$は可換環
  quantifiers:
  - 任意の可換環$R$
  conclusion: イデアルの昇鎖条件が成り立つことと、$R$のすべてのイデアルが有限生成であることは同値である。
  answer: |
    $R$を可換環とする。ネーター環とは、イデアルの任意の昇鎖$I_1\subseteq I_2\subseteq\cdots$がある番号から先で一定になる環のことである。

    $R$がネーター環であるとし、有限生成でないイデアル$I$があると仮定する。$a_1\in I$を任意にとる。$a_1,\ldots,a_k\in I$をとったとき、$I$は有限生成でないので$(a_1,\ldots,a_k)\neq I$であり、$a_{k+1}\in I\setminus(a_1,\ldots,a_k)$がとれる。すると$(a_1)\subsetneq(a_1,a_2)\subsetneq\cdots$は一定にならない昇鎖であり、矛盾する。

    逆に$R$のすべてのイデアルが有限生成であるとし、$I_1\subseteq I_2\subseteq\cdots$を昇鎖とする。和集合$I$はイデアルなので、$I=(b_1,\ldots,b_s)$と書ける。各$b_i$はある$I_{n_i}$に属するので、$N=\max n_i$とおくと$b_1,\ldots,b_s\in I_N$である。よって$I=I_N$であり、$m\geq N$なら$I_N\subseteq I_m\subseteq I=I_N$である。したがって$R$はネーター環である。
  strategy: Build a strict chain from a non-finitely-generated ideal, and conversely use generators of the union.
  sketch:
  - 'contradiction: A non-finitely-generated ideal gives an infinite strict chain of finitely generated subideals.'
  - 'setup: Conversely assume every ideal is finitely generated and take an ascending chain.'
  - 'derive: The union is an ideal with finitely many generators.'
  - 'derive: All generators appear at some stage of the chain.'
  - 'conclude: The chain stabilizes there.'
  openmath: (forall (R) (-> (comm_ring R) (<-> (forall (I) (-> (and (forall (n) (-> (in n N) (ideal_of (seq_value I n) R))) (forall (n) (-> (in n N) (subset (seq_value I n) (seq_value I (+ n 1)))))) (exists (k) (and (in k N) (forall (m) (-> (and (in m N) (<= k m)) (= (seq_value I k) (seq_value I m)))))))) (forall (J) (-> (ideal_of J R) (finitely_generated_ideal J))))))
  hard_negative:
    statement: ネーター環のイデアルはすべて単項である。
    reason: ℤ[X]はネーター環だが、イデアル(2, X)は単項でない。
  target: |
    ∀ (R : Type*) [CommRing R], (∀ I : ℕ → Ideal R, Monotone I → ∃ N, ∀ m, N ≤ m → I N = I m) ↔ ∀ I : Ideal R, I.FG
  proof: |
    by
      intro R _
      rw [← isNoetherianRing_iff_ideal_fg, isNoetherianRing_iff, ← monotone_stabilizes_iff_noetherian]
      constructor
      · intro h f
        exact h f f.monotone
      · intro h I hI
        exact h ⟨I, hI⟩
- id: noetherian_ascending_chain_stabilizes
  kind: gap
  level: 3
  topic: 環論・昇鎖条件
  statement: すべてのイデアルが有限生成である可換環（ネーター環）のイデアルの昇鎖$I_0\subseteq I_1\subseteq\cdots$は、ある番号から先で一定になる。
  statement_en: Every ascending chain of ideals I_0 ⊆ I_1 ⊆ ... in a Noetherian ring is eventually constant.
  assumptions:
  - $R$はネーター環
  - $(I_n)_{n\in\mathbb{N}}$は$R$のイデアルの昇鎖
  quantifiers:
  - 任意のネーター環$R$とイデアルの昇鎖$(I_n)_{n\in\mathbb{N}}$
  conclusion: ある$N\in\mathbb{N}$が存在し、$m\geq N$なら$I_N=I_m$である。
  answer: |
    $R$をすべてのイデアルが有限生成である可換環、$I_0\subseteq I_1\subseteq\cdots$を$R$のイデアルの昇鎖とする。

    和集合$I=\bigcup_nI_n$はイデアルである。実際、$a,b\in I$は共通のある$I_n$に属するので$a+b\in I$であり、$r\in R$について$ra\in I$である。

    仮定より$I=(b_1,\ldots,b_s)$と書ける。各$b_i$はある項に属するので、十分大きい$N$について$b_1,\ldots,b_s\in I_N$である。よって$I=I_N$であり、$m\geq N$なら$I_N\subseteq I_m\subseteq I=I_N$である。
  strategy: Take the union, which is finitely generated, and locate its generators.
  sketch:
  - 'derive: The union I of the chain is an ideal.'
  - 'apply_theorem: Since R is Noetherian, I is finitely generated.'
  - 'derive: The generators all lie in some I_N, so I = I_N.'
  - 'conclude: For m ≥ N, I_N ⊆ I_m ⊆ I = I_N.'
  openmath: (forall (R I) (-> (and (comm_ring R) (noetherian_ring R) (forall (n) (-> (in n N) (and (ideal_of (seq_value I n) R) (subset (seq_value I n) (seq_value I (+ n 1))))))) (exists (k) (and (in k N) (forall (m) (-> (and (in m N) (<= k m)) (= (seq_value I k) (seq_value I m))))))))
  hard_negative:
    statement: ネーター環のイデアルの降鎖は、ある番号から先で一定になる。
    reason: ℤはネーター環だが、(2)⊋(4)⊋(8)⊋…は一定にならない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R] (I : ℕ → Ideal R), (∀ n, I n ≤ I (n + 1)) → ∃ N, ∀ m, N ≤ m → I N = I m
  proof: |
    by
      intro R _ _ I h
      exact monotone_stabilizes_iff_noetherian.mpr inferInstance ⟨I, monotone_nat_of_le_succ h⟩
- id: hilbert_basis_theorem
  kind: named
  level: 4
  topic: 環論・ヒルベルトの基底定理
  statement: ヒルベルトの基底定理。$R$がネーター環ならば、多項式環$R[X]$もネーター環である。
  statement_en: Hilbert's basis theorem. If R is a Noetherian ring, then the polynomial ring R[X] is Noetherian.
  assumptions:
  - $R$はネーター環
  quantifiers:
  - 任意のネーター環$R$
  conclusion: $R[X]$はネーター環である。
  answer: |
    $R$をネーター環、すなわちすべてのイデアルが有限生成である可換環とする。$R[X]$のすべてのイデアルが有限生成であることを示す。

    $R[X]$のイデアル$I$が有限生成でないと仮定する。$k\geq 0$について帰納的に、$f_{k+1}$を$I\setminus(f_1,\ldots,f_k)$の元のうち次数が最小のものとする。$k=0$のときの$(f_1,\ldots,f_k)$は$(0)$とする。$I$は有限生成でないので、この集合はつねに空でない。また$f_{k+1}$は$0$でなく、$f_{k+2}$は$f_{k+1}$を選ぶ集合にも属するので、$\deg f_{k+1}\leq\deg f_{k+2}$である。

    $f_k$の主係数を$a_k$、$\deg f_k=d_k$とする。$R$のイデアル$(a_1,a_2,\ldots)$は有限生成であり、その有限個の生成元は有限個の$a_i$の$R$係数一次結合である。よって、ある$k$について$(a_1,a_2,\ldots)=(a_1,\ldots,a_k)$である。特に$a_{k+1}=\sum_{i\leq k}r_ia_i$（$r_i\in R$）と書ける。

    $g=f_{k+1}-\sum_{i\leq k}r_iX^{d_{k+1}-d_i}f_i$とおく。$d_i\leq d_{k+1}$なので$g\in R[X]$であり、$g\in I$である。$X^{d_{k+1}}$の係数は打ち消しあうので、$\deg g<d_{k+1}$である。$f_{k+1}\notin(f_1,\ldots,f_k)$より$g\notin(f_1,\ldots,f_k)$である。これは$f_{k+1}$の次数の最小性に反する。したがって$I$は有限生成であり、$R[X]$はネーター環である。
  strategy: Choose generators of minimal degree and use finite generation of the ideal of leading coefficients.
  sketch:
  - 'setup: Suppose an ideal I of R[X] is not finitely generated.'
  - 'construct: Pick f_{k+1} of minimal degree in I outside (f_1, ..., f_k).'
  - 'apply_theorem: The ideal of leading coefficients of the f_i is finitely generated.'
  - 'derive: So some leading coefficient a_{k+1} is an R-combination of the earlier ones.'
  - 'contradiction: Subtracting the matching combination gives an element of smaller degree outside (f_1, ..., f_k).'
  openmath: (forall (R) (-> (and (comm_ring R) (noetherian_ring R)) (noetherian_ring (polynomial_ring R))))
  hard_negative:
    statement: Rがネーター環ならば、無限個の変数をもつ多項式環R[x_1, x_2, …]もネーター環である。
    reason: イデアル(x_1, x_2, …)は有限生成でないので、ネーター環にならない。
  target: |
    ∀ (R : Type*) [CommRing R] [IsNoetherianRing R], IsNoetherianRing (Polynomial R)
  proof: |
    by
      intro R _ _
      infer_instance
