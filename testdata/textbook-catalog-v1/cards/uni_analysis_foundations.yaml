- id: tendsto_at_top_iff_inv_null
  kind: gap
  level: 1
  topic: 数列の発散・逆数
  statement: 正の実数列$(a_n)$について、$a_n\to+\infty$と$1/a_n\to0$は同値である。
  statement_en: For a positive real sequence, a_n → +∞ if and only if 1/a_n → 0.
  assumptions:
  - 全ての$n$で$a_n>0$
  quantifiers:
  - 任意の$(a_n)$
  conclusion: $a_n\to+\infty$と$1/a_n\to0$は同値である。
  answer: |
    $(a_n)$を正の実数列とする。

    $a_n\to+\infty$とする。$\varepsilon>0$に対し、ある$K$があり$n\geq K$なら$a_n>1/\varepsilon$である。このとき$0<1/a_n<\varepsilon$である。

    逆に$1/a_n\to0$とする。実数$M$に対し$\varepsilon=1/(|M|+1)>0$をとる。ある$K$があり$n\geq K$なら$1/a_n<\varepsilon$である。逆数をとると$a_n>|M|+1>M$である。よって$a_n\to+\infty$である。
  strategy: Exchange M and ε = 1/M by taking reciprocals of positive numbers.
  sketch:
  - "derive: If a_n > 1/ε for n ≥ K, then 0 < 1/a_n < ε."
  - "derive: If 1/a_n < 1/(|M|+1) for n ≥ K, then a_n > |M| + 1 > M."
  - "conclude: The two conditions are equivalent."
  openmath: (forall (a) (-> (forall (n) (> (seq_value a n) 0)) (<-> (seq_fn_tends_to_infinity (lambda (n) (seq_value a n))) (seq_fn_tends_to (lambda (n) (/ 1 (seq_value a n))) 0))))
  hard_negative:
    statement: 符号の条件なしで、$1/a_n\to0$ならば$a_n\to+\infty$である。
    reason: $a_n=-(n+1)$では$1/a_n\to0$だが$a_n\to-\infty$である。$a_n=(-1)^n(n+1)$なら発散の向きも定まらない。
  target: |
    ∀ a : ℕ → ℝ, (∀ n, 0 < a n) → (Filter.Tendsto a Filter.atTop Filter.atTop ↔ Filter.Tendsto (fun n => 1 / a n) Filter.atTop (nhds 0))
  proof: |
    by
      intro a ha
      constructor
      · intro h
        have h1 := tendsto_inv_atTop_zero.comp h
        refine h1.congr fun n => ?_
        simp
      · intro h
        rw [Filter.tendsto_atTop]
        intro M
        obtain ⟨K, hK⟩ := Metric.tendsto_atTop.1 h (1 / (|M| + 1)) (by positivity)
        refine Filter.eventually_atTop.2 ⟨K, fun n hn => ?_⟩
        have h3 := hK n hn
        have hpos := ha n
        rw [Real.dist_eq, sub_zero, abs_of_pos (by positivity)] at h3
        have h4 := (one_div_lt_one_div hpos (by positivity)).1 h3
        linarith [le_abs_self M]
