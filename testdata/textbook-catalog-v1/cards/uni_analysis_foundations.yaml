- id: moore_osgood_limit_interchange
  kind: textbook
  level: 2
  topic: 一様収束・極限の順序交換
  statement: $F_n,f:\mathbb{R}\to\mathbb{R}$、$a\in\mathbb{R}$とする。$F_n$が$\mathbb{R}\setminus\{a\}$上$f$に一様収束し、各$n$で$x\to a$（$x\neq a$）のとき$F_n(x)\to L_n$ならば、ある$l$があり$L_n\to l$かつ$x\to a$で$f(x)\to l$である。
  statement_en: Let F_n and f be real functions on the reals and a a real. If F_n converges uniformly to f on the reals other than a and F_n(x) → L_n as x → a with x ≠ a for each n, then there is l with L_n → l and f(x) → l as x → a with x ≠ a.
  assumptions:
  - $F_n,f:\mathbb{R}\to\mathbb{R}$、$a\in\mathbb{R}$
  - $F_n\to f$は$\mathbb{R}\setminus\{a\}$上一様収束
  - 各$n$で、$x\to a$（$x\neq a$）のとき$F_n(x)\to L_n$
  quantifiers:
  - 任意の$(F_n)$、$f$、$a$、$(L_n)$
  conclusion: $l$があり、$L_n\to l$かつ$x\to a$（$x\neq a$）で$f(x)\to l$である。
  answer: |
    $F_n,f:\mathbb{R}\to\mathbb{R}$、$a\in\mathbb{R}$とする。$F_n$が$\mathbb{R}\setminus\{a\}$上$f$に一様収束し、各$n$で$x\to a$（$x\neq a$）のとき$F_n(x)\to L_n$とする。

    $\varepsilon>0$に対し$K$をとり、$m,n\geq K$と$x\neq a$で$|F_m(x)-F_n(x)|<\varepsilon$とする。$m,n$を固定して$x\to a$とすると$|L_m-L_n|\leq\varepsilon$である。よって$(L_n)$はコーシー列で、ある$l$に収束する。

    $\varepsilon>0$をとる。$N$を、$x\neq a$で$|F_N(x)-f(x)|<\varepsilon/3$かつ$|L_N-l|<\varepsilon/3$となるようにとる。$F_N(x)\to L_N$より$\delta>0$があり、$0<|x-a|<\delta$なら$|F_N(x)-L_N|<\varepsilon/3$である。このとき$|f(x)-l|\leq|f(x)-F_N(x)|+|F_N(x)-L_N|+|L_N-l|<\varepsilon$である。
  strategy: The uniform Cauchy condition passes to the limits L_n, and an ε/3 argument gives the limit of f.
  sketch:
  - "derive: Letting x → a in the uniform Cauchy condition makes L_n a Cauchy sequence with limit l."
  - "setup: Choose N with F_N close to f and L_N close to l."
  - "apply_theorem: The limit of F_N at a gives δ."
  - "conclude: An ε/3 argument gives |f(x) - l| < ε for 0 < |x - a| < δ."
  openmath: (forall (F f a c) (-> (and (uniform_converges_on (lambda (n x) (fn_value (seq_value F n) x)) (lambda (x) (fn_value f x)) (setdiff R (singleton_set a))) (forall (n) (fn_limit_at (lambda (x) (fn_value (seq_value F n) x)) a (seq_value c n)))) (exists (l) (and (seq_tends_to c l) (fn_limit_at (lambda (x) (fn_value f x)) a l)))))
  hard_negative:
    statement: 一様収束の代わりに各点収束でも、$\lim_{n}\lim_{x\to a}F_n(x)=\lim_{x\to a}\lim_nF_n(x)$である。
    reason: $F_n(x)=x^{2}/(x^{2}+1/(n+1))$、$a=0$では$\lim_{x\to0}F_n(x)=0$だが、$x\neq0$で$F_n(x)\to1$なので、順序によって値が$0$と$1$に分かれる。
  target: |
    ∀ (F : ℕ → ℝ → ℝ) (f : ℝ → ℝ) (a : ℝ) (L : ℕ → ℝ), TendstoUniformlyOn F f Filter.atTop {a}ᶜ → (∀ n, Filter.Tendsto (F n) (nhdsWithin a {a}ᶜ) (nhds (L n))) → ∃ l : ℝ, Filter.Tendsto L Filter.atTop (nhds l) ∧ Filter.Tendsto f (nhdsWithin a {a}ᶜ) (nhds l)
  proof: |
    by
      intro F f a L hu hL
      have hC : CauchySeq L := by
        refine Metric.cauchySeq_iff.2 fun ε hε => ?_
        have hε4 : 0 < ε / 4 := by positivity
        obtain ⟨K, hK⟩ := Filter.eventually_atTop.1 (Metric.tendstoUniformlyOn_iff.1 hu (ε / 4) hε4)
        refine ⟨K, fun m hm n hn => ?_⟩
        have h1 := (hL m).eventually (Metric.ball_mem_nhds (L m) hε4)
        have h2 := (hL n).eventually (Metric.ball_mem_nhds (L n) hε4)
        obtain ⟨x, hx, hm1, hn1⟩ := (eventually_mem_nhdsWithin.and (h1.and h2)).exists
        have a1 := hK m hm x hx
        have a2 := hK n hn x hx
        have b1 := Metric.mem_ball.1 hm1
        have b2 := Metric.mem_ball.1 hn1
        have t1 := dist_triangle (L m) (F m x) (L n)
        have t2 := dist_triangle (F m x) (f x) (L n)
        have t3 := dist_triangle (f x) (F n x) (L n)
        rw [dist_comm (L m) (F m x)] at t1
        rw [dist_comm (F m x) (f x)] at t2
        linarith
      obtain ⟨l, hl⟩ := cauchySeq_tendsto_of_complete hC
      refine ⟨l, hl, ?_⟩
      have hf : TendstoUniformlyOnFilter F f Filter.atTop (nhdsWithin a {a}ᶜ) :=
        (tendstoUniformlyOn_iff_tendstoUniformlyOnFilter.1 hu).mono_right (by
          exact inf_le_right)
      exact hf.tendsto_of_eventually_tendsto (Filter.Eventually.of_forall hL) hl
- id: uniform_series_terms_null
  kind: gap
  level: 2
  topic: 関数項級数・項の一様収束
  statement: $f_n,g:\mathbb{R}\to\mathbb{R}$、$S\subset\mathbb{R}$とする。関数項級数の部分和$\sum_{i<N}f_i$が$S$上$g$に一様収束するならば、$f_n$は$S$上$0$に一様収束する。
