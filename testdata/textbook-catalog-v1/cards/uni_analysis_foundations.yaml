  answer: |
    $(a_n)$を実数列、$L\neq0$、$0<c<1$とし、任意の$\varepsilon>0$に対してある$K$があり$n\geq K$なら$|a_n-L|<\varepsilon$となると仮定する。

    $\varepsilon=(1-c)|L|$は正なので、対応する$K$をとる。$n\geq K$なら、三角不等式から$|L|\leq|L-a_n|+|a_n|<(1-c)|L|+|a_n|$である。移項すると$c|L|<|a_n|$を得る。
  strategy: Take ε = (1-c)|L| in the definition and use the triangle inequality.
  sketch:
  - "setup: Since L ≠ 0 and c < 1, ε = (1-c)|L| is positive; take the corresponding K."
  - "derive: For n ≥ K, |L| ≤ |L - a_n| + |a_n| < (1-c)|L| + |a_n|."
  - "conclude: Rearranging gives c|L| < |a_n|."
  openmath: (forall (a L c) (-> (and (!= L 0) (< 0 c) (< c 1) (forall (e) (-> (> e 0) (exists (K) (forall (n) (-> (>= n K) (< (abs (- (seq_value a n) L)) e))))))) (exists (K) (forall (n) (-> (>= n K) (< (* c (abs L)) (abs (seq_value a n))))))))
  hard_negative:
