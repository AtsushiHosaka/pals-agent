  level: 2
  topic: 距離空間・隣接距離の和が有限な点列
  statement: 完備距離空間の点列$(x_n)$について$\sum_nd(x_n,x_{n+1})$が収束するならば、$(x_n)$は収束する。
  statement_en: In a complete metric space, if the series of d(x_n, x_{n+1}) converges, then the sequence x_n converges.
  assumptions:
  - $X$は完備距離空間
  - $\sum_nd(x_n,x_{n+1})$は収束する
