  conclusion: 狭義単調増加な$p:\mathbb{N}\to\mathbb{N}$があり、$(x_{p(n)})$は単調非減少または単調非増加である。
  answer: |
    $(x_n)$を実数列とする。全ての$m>n$で$x_m<x_n$となる添字$n$を「山」と呼ぶ。

    山が無限個あるとき、山を小さい順に$p(0)<p(1)<\cdots$と並べる。$p(k)$が山なので$x_{p(k+1)}<x_{p(k)}$であり、$(x_{p(n)})$は単調非増加である。

    山が有限個のとき、全ての山より大きい添字$p(0)$をとる。$p(k)$まで定まったとする。$p(k)$は山でないので、$m>p(k)$かつ$x_m\geq x_{p(k)}$となる$m$があり、これを$p(k+1)$とする。$p(k+1)>p(k)$も山でないから、この構成は続けられる。こうして得た$(x_{p(n)})$は単調非減少である。
  strategy: Split on whether infinitely many indices dominate all later terms.
  sketch:
  - "setup: Call n a peak if x_m < x_n for all m > n."
  - "case_split: With infinitely many peaks, listing them gives a decreasing subsequence."
  - "case_split: With finitely many peaks, start after the last one."
  - "construct: Each non-peak index has a later index with a term at least as large, which gives a nondecreasing subsequence."
  - "conclude: In both cases a monotone subsequence exists."
  openmath: (forall (x) (exists (p) (and (strict_mono_index p) (or (forall (m n) (-> (<= m n) (<= (seq_value x (fn_value p m)) (seq_value x (fn_value p n))))) (forall (m n) (-> (<= m n) (<= (seq_value x (fn_value p n)) (seq_value x (fn_value p m)))))))))
  hard_negative:
    statement: 任意の実数列は、狭義単調増加な部分列をもつ。
    reason: 定数列や$x_n=-n$にはどの部分列にも狭義単調増加なものがない。
  target: |
    ∀ x : ℕ → ℝ, ∃ p : ℕ → ℕ, StrictMono p ∧ (Monotone (fun n => x (p n)) ∨ Antitone (fun n => x (p n)))
  proof: |
    by
      intro x
      obtain ⟨g, hg | hg⟩ := exists_increasing_or_nonincreasing_subseq (· < ·) x
      · exact ⟨g, g.strictMono, Or.inl (monotone_nat_of_le_succ fun n => (hg n (n + 1) (Nat.lt_succ_self n)).le)⟩
      · refine ⟨g, g.strictMono, Or.inr fun m n hmn => ?_⟩
        rcases hmn.eq_or_lt with rfl | h
        · exact le_rfl
        · exact not_lt.1 (hg m n h)
- id: separated_sets_gap_point
  kind: gap
  level: 1
  topic: 実数の完備性・二つの集合の間の点
  statement: 空でない$A,B\subset\mathbb{R}$が、全ての$a\in A$と$b\in B$で$a\leq b$を満たすならば、全ての$a\in A$と$b\in B$で$a\leq c\leq b$となる実数$c$が存在する。
  statement_en: If nonempty sets A, B of reals satisfy a ≤ b for all a in A and b in B, then there is a real c with a ≤ c ≤ b for all a in A and b in B.
  assumptions:
