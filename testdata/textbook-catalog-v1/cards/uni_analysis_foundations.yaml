  - "derive: For 0 < |x - a| < δ the difference quotient is greater than u/2 > 0."
  - "case_split: Split on the sign of x - a."
  - "conclude: f(x) - f(a) has the same sign as x - a."
  openmath: (forall (f a u) (-> (and (has_deriv_at (lambda (y) (fn_value f y)) u a) (> u 0)) (exists (d) (and (> d 0) (forall (x) (and (-> (and (< a x) (< x (+ a d))) (< (fn_value f a) (fn_value f x))) (-> (and (< (- a d) x) (< x a)) (< (fn_value f x) (fn_value f a)))))))))
  hard_negative:
    statement: $f'(a)>0$なら、$f$は$a$を含むある開区間で単調増加である。
    reason: $x\neq0$で$f(x)=x+2x^2\sin(1/x)$、$f(0)=0$とすると$f'(0)=1$だが、$f'$は$0$のどの近くでも負の値をとるので、$f$は$0$の近くで単調でない。
  target: |
    ∀ (f : ℝ → ℝ) (a u : ℝ), HasDerivAt f u a → 0 < u → ∃ δ : ℝ, 0 < δ ∧ ∀ x : ℝ, (a < x → x < a + δ → f a < f x) ∧ (a - δ < x → x < a → f x < f a)
  proof: |
    by
      intro f a u hf hu
      have h := Asymptotics.isLittleO_iff.1 (hasDerivAt_iff_isLittleO.1 hf) (half_pos hu)
      obtain ⟨δ, hδ, hd⟩ := Metric.eventually_nhds_iff.1 h
      refine ⟨δ, hδ, fun x => ⟨fun h1 h2 => ?_, fun h1 h2 => ?_⟩⟩
      · have h3 := hd (y := x) (by rw [Real.dist_eq, abs_lt]; constructor <;> linarith)
        simp only [Real.norm_eq_abs, smul_eq_mul] at h3
        rw [abs_of_pos (show 0 < x - a by linarith)] at h3
        have h4 := (abs_le.1 h3).1
        nlinarith [sub_pos.2 h1]
      · have h3 := hd (y := x) (by rw [Real.dist_eq, abs_lt]; constructor <;> linarith)
        simp only [Real.norm_eq_abs, smul_eq_mul] at h3
        rw [abs_of_neg (show x - a < 0 by linarith)] at h3
        have h4 := (abs_le.1 h3).2
        nlinarith [sub_pos.2 h2]
- id: deriv_of_limit_of_deriv
  kind: gap
  level: 2
  topic: 平均値の定理の系・導関数の極限と微分可能性
  statement: $f:\mathbb{R}\to\mathbb{R}$が$a$で連続で、$x\neq a$で微分係数$g(x)$をもち、$x\to a$（$x\neq a$）のとき$g(x)\to u$ならば、$f$は$a$で微分可能で$f'(a)=u$である。
  statement_en: If f is continuous at a, has derivative g(x) at every x ≠ a, and g(x) → u as x → a with x ≠ a, then f has derivative u at a.
  assumptions:
  - $f:\mathbb{R}\to\mathbb{R}$は$a$で連続
  - $x\neq a$なら$f$は$x$で微分係数$g(x)$をもつ
  - $x\to a$（$x\neq a$）のとき$g(x)\to u$
  quantifiers:
  - 任意の$f,g:\mathbb{R}\to\mathbb{R}$と$a,u\in\mathbb{R}$
  conclusion: $f'(a)=u$である。
  answer: |
    $f,g:\mathbb{R}\to\mathbb{R}$、$a,u\in\mathbb{R}$とし、$f$は$a$で連続、$x\neq a$で$f$は$x$において微分係数$g(x)$をもち、$x\to a$（$x\neq a$）のとき$g(x)\to u$とする。

    $\varepsilon>0$を任意にとる。$\delta>0$があり、$0<|t-a|<\delta$なら$|g(t)-u|<\varepsilon$である。$0<|x-a|<\delta$とする。$f$は$a$と$x$を端点とする閉区間上で連続である。$a$では仮定により連続であり、他の点では微分可能だからである。また$f$は開区間上で微分可能である。平均値の定理から、$a$と$x$の間の点$c$で$(f(x)-f(a))/(x-a)=g(c)$となる。$0<|c-a|<|x-a|<\delta$なので、$|(f(x)-f(a))/(x-a)-u|=|g(c)-u|<\varepsilon$である。よって$f'(a)=u$である。
  strategy: Apply the mean value theorem between a and x, then pass the intermediate point to a.
  sketch:
  - "setup: Fix ε > 0 and take δ with |g(t) - u| < ε for 0 < |t - a| < δ."
  - "apply_theorem: For 0 < |x - a| < δ the mean value theorem gives c between a and x with difference quotient g(c)."
  - "derive: Since 0 < |c - a| < δ, the difference quotient is within ε of u."
  - "conclude: Therefore the derivative at a exists and equals u."
  openmath: (forall (f g a u) (-> (and (fn_continuous_at (lambda (x) (fn_value f x)) a) (forall (x) (-> (!= x a) (has_deriv_at (lambda (y) (fn_value f y)) (fn_value g x) x))) (fn_limit_at (lambda (x) (fn_value g x)) a u)) (has_deriv_at (lambda (y) (fn_value f y)) u a)))
  hard_negative:
    statement: $a$での連続性を仮定しなくても、$x\neq a$で$f'(x)=g(x)$かつ$g(x)\to u$なら$f'(a)=u$である。
    reason: $x\neq a$で$f(x)=x$、$f(a)=a+1$とすると$g(x)=1\to1$だが、$f$は$a$で連続でないので微分可能でない。
  target: |
    ∀ (f g : ℝ → ℝ) (a u : ℝ), ContinuousAt f a → (∀ x : ℝ, x ≠ a → HasDerivAt f (g x) x) → Filter.Tendsto g (nhdsWithin a {a}ᶜ) (nhds u) → HasDerivAt f u a
  proof: |
    by
      intro f g a u hf hd hg
      have hc : ContinuousAt (Function.update g a u) a := continuousAt_update_same.2 hg
      have := hasDerivAt_of_hasDerivAt_of_ne (g := Function.update g a u) (x := a)
        (fun y hy => by rw [Function.update_of_ne hy]; exact hd y hy) hf hc
      simpa using this
- id: vanishing_higher_derivative_polynomial
  kind: gap
  level: 2
  topic: 平均値の定理の系・高階導関数が0の関数
  statement: 関数列$F_0,F_1,\dots$が全ての$k,x$で$F_k'(x)=F_{k+1}(x)$を満たし、$F_{n+1}$が恒等的に$0$ならば、$F_0$は次数$n$以下の多項式関数である。
  statement_en: If functions F_k on the reals satisfy F_k'(x) = F_{k+1}(x) for all k and x and F_{n+1} vanishes identically, then F_0 is a polynomial function of degree at most n.
  assumptions:
  - 全ての$k,x$で$F_k$は$x$において微分係数$F_{k+1}(x)$をもつ
  - $F_{n+1}$は恒等的に$0$
  quantifiers:
  - 任意の自然数$n$と関数列$(F_k)$
  - ある実数列$(c_k)$
  conclusion: 全ての$x$で$F_0(x)=\sum_{k=0}^{n}c_kx^k$である。
  answer: |
    関数$F_0,F_1,\dots:\mathbb{R}\to\mathbb{R}$が全ての$k,x$で$F_k'(x)=F_{k+1}(x)$を満たし、$F_{n+1}$が恒等的に$0$であるとする。このとき$F_0$が次数$n$以下の多項式関数であること、すなわち実数列$(c_k)$があり全ての$x$で$F_0(x)=\sum_{k=0}^{n}c_kx^k$となることを、$n$についての帰納法で示す。帰納法の主張は、条件を満たす全ての関数列$(F_k)$についてのものとする。導関数が恒等的に$0$である$\mathbb{R}$上の関数は、平均値の定理により定数である。

    $n=0$のとき、$F_0'=F_1=0$なので$F_0$は定数であり、結論は成り立つ。

    $n$で成り立つとし、$F_{n+2}$が恒等的に$0$である関数列$(F_k)$をとる。関数列$(F_{k+1})$に帰納法の仮定を適用すると、実数列$(c_k)$があり$F_1(x)=\sum_{k=0}^{n}c_kx^k$となる。$P(x)=\sum_{k=0}^{n}c_kx^{k+1}/(k+1)$とおくと$P'=F_1$である。$(F_0-P)'=F_1-F_1=0$なので、$F_0-P$は定数$d$である。したがって$F_0(x)=d+\sum_{k=0}^{n}c_kx^{k+1}/(k+1)$は次数$n+1$以下の多項式関数である。
  strategy: Induct on n; integrate the polynomial for F_1 and use that zero derivative means constant.
  sketch:
  - "induction: Induct on n over all sequences of functions."
  - "derive: For n = 0, F_0 has zero derivative and is constant by the mean value theorem."
  - "derive: For the step, the induction hypothesis gives F_1 as a polynomial."
  - "construct: Let P be the termwise antiderivative of F_1."
  - "conclude: F_0 - P has zero derivative, so F_0 is P plus a constant."
  openmath: (forall (n F) (-> (and (in n N) (forall (k x) (has_deriv_at (lambda (y) (fn_value (seq_value F k) y)) (fn_value (seq_value F (+ k 1)) x) x)) (forall (x) (= (fn_value (seq_value F (+ n 1)) x) 0))) (exists (c) (forall (x) (= (fn_value (seq_value F 0) x) (real_partial_sum (lambda (k) (* (seq_value c k) (^ x k))) (+ n 1)))))))
  hard_negative:
    statement: 定義域が$\mathbb{R}\setminus\{0\}$でも、導関数が恒等的に$0$なら関数は定数である。
    reason: $x>0$で$1$、$x<0$で$-1$をとる関数は導関数が$0$だが定数でない。定義域が連結であることが必要である。
  target: |
    ∀ (n : ℕ) (F : ℕ → ℝ → ℝ), (∀ k x, HasDerivAt (F k) (F (k + 1) x) x) → (∀ x, F (n + 1) x = 0) → ∃ c : ℕ → ℝ, ∀ x, F 0 x = ∑ k ∈ Finset.range (n + 1), c k * x ^ k
  proof: |
    by
      intro n
      induction n with
      | zero =>
        intro F hF h0
        have hconst := is_const_of_deriv_eq_zero (f := F 0) (fun x => (hF 0 x).differentiableAt)
          (fun x => by rw [(hF 0 x).deriv]; exact h0 x)
        exact ⟨fun _ => F 0 0, fun x => by simp [hconst x 0]⟩
      | succ n ih =>
        intro F hF h0
        obtain ⟨c, hc⟩ := ih (fun k => F (k + 1)) (fun k x => hF (k + 1) x) h0
        let P : ℝ → ℝ := fun x => ∑ k ∈ Finset.range (n + 1), c k / ((k : ℝ) + 1) * x ^ (k + 1)
        have hP : ∀ x, HasDerivAt P (F 1 x) x := by
          intro x
          have : F 1 x = ∑ k ∈ Finset.range (n + 1), c k / ((k : ℝ) + 1) * (((k + 1 : ℕ) : ℝ) * x ^ k) := by
            rw [hc x]
            refine Finset.sum_congr rfl fun k _ => ?_
            have : ((k : ℝ) + 1) ≠ 0 := by positivity
            push_cast
            field_simp
          rw [this]
          refine HasDerivAt.fun_sum fun k _ => ?_
          exact ((hasDerivAt_pow (k + 1) x).const_mul _)
        have hd : ∀ x, HasDerivAt (fun x => F 0 x - P x) (F 1 x - F 1 x) x := fun x =>
          (hF 0 x).fun_sub (hP x)
        have hconst := is_const_of_deriv_eq_zero (f := fun x => F 0 x - P x)
          (fun x => (hd x).differentiableAt)
          (fun x => by rw [(hd x).deriv]; ring)
        refine ⟨fun k => if k = 0 then F 0 0 - P 0 else c (k - 1) / (k : ℝ), fun x => ?_⟩
        have e : F 0 x - P x = F 0 0 - P 0 := hconst x 0
        rw [Finset.sum_range_succ']
        have : F 0 x = P x + (F 0 0 - P 0) := by linarith
        rw [this]
        simp [P]
- id: leibniz_iterated_derivative
  kind: named
  level: 2
  topic: 微分の規則・積の高階導関数
  statement: ライプニッツの公式。関数$f,g:\mathbb{R}\to\mathbb{R}$が$x$の近くで$n$回連続微分可能ならば、$(fg)^{(n)}(x)=\sum_{k=0}^{n}\binom{n}{k}f^{(k)}(x)g^{(n-k)}(x)$である。
  statement_en: Leibniz formula. If f and g are n times continuously differentiable near x, then the n-th derivative of fg at x is the sum over k from 0 to n of C(n,k) f^(k)(x) g^(n-k)(x).
  assumptions:
  - $n$は自然数
  - $f,g:\mathbb{R}\to\mathbb{R}$は$x$の近くで$n$回連続微分可能
  quantifiers:
  - 任意の$n$、$f$、$g$、$x$
  conclusion: $(fg)^{(n)}(x)=\sum_{k=0}^{n}\binom{n}{k}f^{(k)}(x)g^{(n-k)}(x)$である。
  answer: |
    $n$についての帰納法で、$x$の近くで$n$回連続微分可能な任意の$f,g:\mathbb{R}\to\mathbb{R}$と任意の$x$について等式を示す。

    $n=0$では両辺とも$f(x)g(x)$である。

    $n$で成り立つとし、$f,g$が$x$の近くで$n+1$回連続微分可能であるとする。このとき$x$のある近傍の全ての点$y$で、$f,g$は$y$の近くで$n$回連続微分可能なので、帰納法の仮定から$(fg)^{(n)}(y)=\sum_{k=0}^{n}\binom{n}{k}f^{(k)}(y)g^{(n-k)}(y)$である。右辺の各因子は$x$で微分可能なので、積の微分により
    $(fg)^{(n+1)}(x)=\sum_{k=0}^{n}\binom{n}{k}\bigl(f^{(k+1)}(x)g^{(n-k)}(x)+f^{(k)}(x)g^{(n+1-k)}(x)\bigr)$
    となる。第1項の和で添字を$k+1$から$k$に付け替えて第2項の和とまとめる。$1\leq k\leq n$では$f^{(k)}(x)g^{(n+1-k)}(x)$の係数が$\binom{n}{k-1}+\binom{n}{k}=\binom{n+1}{k}$となり、$k=0$と$k=n+1$の係数は$1=\binom{n+1}{0}=\binom{n+1}{n+1}$である。よって$n+1$でも等式が成り立つ。
  strategy: Induct on n, differentiate the formula with the product rule and combine coefficients by Pascal's rule.
  sketch:
  - "induction: Induct on n; the case n = 0 is the product itself."
  - "derive: For n + 1 the formula for n holds on a neighbourhood of x."
  - "apply_theorem: Differentiating each term with the product rule produces two sums."
  - "derive: Reindexing and Pascal's rule give the coefficient C(n+1,k)."
  - "conclude: The formula holds for n + 1."
  openmath: (forall (n f g x) (-> (and (in n N) (cont_diff_at n f x) (cont_diff_at n g x)) (= (iterated_deriv (lambda (y) (* (fn_value f y) (fn_value g y))) n x) (real_partial_sum (lambda (k) (* (* (binom n k) (iterated_deriv (lambda (y) (fn_value f y)) k x)) (iterated_deriv (lambda (y) (fn_value g y)) (- n k) x))) (+ n 1)))))
  hard_negative:
    statement: $(fg)^{(n)}=\sum_{k=0}^{n}f^{(k)}g^{(n-k)}$であり、二項係数は現れない。
    reason: $n=2$では$(fg)''=f''g+2f'g'+fg''$であり、中央の項の係数は$2$である。
  target: |
    ∀ (n : ℕ) (f g : ℝ → ℝ) (x : ℝ), ContDiffAt ℝ n f x → ContDiffAt ℝ n g x → iteratedDeriv n (fun y => f y * g y) x = ∑ k ∈ Finset.range (n + 1), (Nat.choose n k : ℝ) * iteratedDeriv k f x * iteratedDeriv (n - k) g x
  proof: |
    by
      intro n f g x hf hg
      rw [iteratedDeriv_fun_mul hf hg]
- id: series_cauchy_criterion
  kind: gap
  level: 1
  topic: 級数・コーシーの判定条件
  statement: 実数列$(a_n)$について、部分和$\sum_{i<n}a_i$が収束することと、任意の$\varepsilon>0$に対してある$N$があり、$N\leq m\leq n$なら$|\sum_{m\leq i<n}a_i|<\varepsilon$となることは同値である。
  statement_en: The partial sums of a real series converge if and only if for every ε > 0 there is N with |Σ_{m ≤ i < n} a_i| < ε whenever N ≤ m ≤ n.
  assumptions:
  - $(a_n)$は実数列
  quantifiers:
  - 任意の$(a_n)$
  conclusion: 部分和の収束とコーシーの条件は同値である。
  answer: |
    $(a_n)$を実数列とし、$S_n=\sum_{i<n}a_i$とおく。$m\leq n$なら$\sum_{m\leq i<n}a_i=S_n-S_m$である。

    $(S_n)$が収束するなら$(S_n)$はコーシー列である。よって$\varepsilon>0$に対してある$N$があり、$m,n\geq N$なら$|S_n-S_m|<\varepsilon$である。特に$N\leq m\leq n$なら$|\sum_{m\leq i<n}a_i|<\varepsilon$となる。

    逆に条件を仮定する。$\varepsilon>0$に対する$N$をとり、$m,n\geq N$とする。$m\leq n$なら$|S_n-S_m|<\varepsilon$であり、$n\leq m$でも$m$と$n$を入れ替えて$|S_m-S_n|<\varepsilon$である。したがって$(S_n)$はコーシー列であり、実数の完備性から収束する。
  strategy: Express block sums as differences of partial sums and use completeness of the reals.
  sketch:
  - "translate: For m ≤ n, the block sum equals S_n - S_m."
  - "derive: A convergent sequence of partial sums is Cauchy, which gives the condition."
  - "derive: Conversely the condition says the partial sums are Cauchy, treating m ≤ n and n ≤ m."
  - "apply_theorem: Completeness of the reals gives convergence."
  openmath: (forall (a) (<-> (exists (L) (seq_fn_tends_to (lambda (n) (real_partial_sum (lambda (i) (seq_value a i)) n)) L)) (forall (e) (-> (> e 0) (exists (M) (forall (m n) (-> (and (>= m M) (<= m n)) (< (abs (- (real_partial_sum (lambda (i) (seq_value a i)) n) (real_partial_sum (lambda (i) (seq_value a i)) m))) e))))))))
  hard_negative:
    statement: $n=m+1$の場合だけ、つまり$a_m\to0$だけを確かめれば、級数は収束する。
    reason: $a_n=1/(n+1)$は$0$に収束するが、部分和は発散する。
  target: |
    ∀ a : ℕ → ℝ, (∃ L : ℝ, Filter.Tendsto (fun n => ∑ i ∈ Finset.range n, a i) Filter.atTop (nhds L)) ↔ ∀ ε : ℝ, 0 < ε → ∃ N : ℕ, ∀ m n, N ≤ m → m ≤ n → |∑ i ∈ Finset.Ico m n, a i| < ε
  proof: |
    by
      intro a
      constructor
      · rintro ⟨L, hL⟩ ε hε
        obtain ⟨N, hN⟩ := Metric.cauchySeq_iff.1 hL.cauchySeq ε hε
        refine ⟨N, fun m n hm hmn => ?_⟩
        rw [Finset.sum_Ico_eq_sub _ hmn, ← Real.dist_eq]
        exact hN n (hm.trans hmn) m hm
      · intro h
        apply cauchySeq_tendsto_of_complete
        rw [Metric.cauchySeq_iff]
        intro ε hε
        obtain ⟨N, hN⟩ := h ε hε
        refine ⟨N, fun m hm n hn => ?_⟩
        rcases le_total m n with hmn | hmn
        · have := hN m n hm hmn
          rwa [Finset.sum_Ico_eq_sub _ hmn, ← Real.dist_eq, dist_comm] at this
        · have := hN n m hn hmn
          rwa [Finset.sum_Ico_eq_sub _ hmn, ← Real.dist_eq] at this
- id: limit_comparison
  kind: gap
  level: 1
  topic: 級数・極限比較判定法
  statement: 全ての項が正の実数列$(a_n),(b_n)$について$a_n/b_n\to c>0$ならば、$\sum a_n$が収束することと$\sum b_n$が収束することは同値である。
  statement_en: If a_n, b_n > 0 for all n and a_n/b_n → c > 0, then the series of a_n converges if and only if the series of b_n converges.
  assumptions:
  - 全ての$n$で$a_n>0$、$b_n>0$
  - $a_n/b_n\to c$
  - $c>0$
  quantifiers:
  - 任意の$(a_n),(b_n)$と$c$
  conclusion: $\sum a_n$の収束と$\sum b_n$の収束は同値である。
  answer: |
    $(a_n),(b_n)$を全ての項が正の実数列とし、$a_n/b_n\to c>0$とする。$\varepsilon=c/2$に対してある$N$があり、$n\geq N$なら$c/2<a_n/b_n<3c/2$である。$b_n>0$なので、$n\geq N$なら$(c/2)b_n<a_n<(3c/2)b_n$となる。

    級数の収束は有限個の項の値によらない。$\sum b_n$が収束するなら、$n\geq N$で$a_n<(3c/2)b_n$なので、比較判定法により$\sum a_n$は収束する。$\sum a_n$が収束するなら、$n\geq N$で$b_n<(2/c)a_n$なので、$\sum b_n$は収束する。
  strategy: The limit gives two-sided constant bounds for large n; apply comparison in each direction.
  sketch:
  - "setup: Take N with c/2 < a_n/b_n < 3c/2 for n ≥ N."
  - "derive: Hence (c/2)b_n < a_n < (3c/2)b_n for n ≥ N."
  - "apply_theorem: Comparison on the tails gives each implication."
  - "conclude: Convergence of the two series is equivalent."
  openmath: (forall (a b c) (-> (and (forall (n) (> (seq_value a n) 0)) (forall (n) (> (seq_value b n) 0)) (> c 0) (seq_fn_tends_to (lambda (n) (/ (seq_value a n) (seq_value b n))) c)) (<-> (real_series_summable (lambda (n) (seq_value a n))) (real_series_summable (lambda (n) (seq_value b n))))))
  hard_negative:
    statement: $c=0$でも、$\sum a_n$と$\sum b_n$の収束は同値である。
    reason: $a_n=1/(n+1)^2$、$b_n=1/(n+1)$では$a_n/b_n\to0$であり、$\sum a_n$は収束するが$\sum b_n$は発散する。
  target: |
    ∀ (a b : ℕ → ℝ) (c : ℝ), (∀ n, 0 < a n) → (∀ n, 0 < b n) → 0 < c → Filter.Tendsto (fun n => a n / b n) Filter.atTop (nhds c) → (Summable a ↔ Summable b)
  proof: |
    by
      intro a b c ha hb hc h
      have h1 : ∀ᶠ n in Filter.atTop, a n / b n < c + 1 := h.eventually (gt_mem_nhds (by linarith))
      have h2 : ∀ᶠ n in Filter.atTop, c / 2 < a n / b n := h.eventually (lt_mem_nhds (by linarith))
      constructor
      · intro hs
        refine (hs.mul_left (2 / c)).of_norm_bounded_eventually_nat ?_
        filter_upwards [h2] with n hn
        rw [Real.norm_of_nonneg (hb n).le]
        rw [lt_div_iff₀ (hb n)] at hn
        rw [div_mul_eq_mul_div, le_div_iff₀ hc]
        linarith
      · intro hs
        refine (hs.mul_left (c + 1)).of_norm_bounded_eventually_nat ?_
        filter_upwards [h1] with n hn
        rw [Real.norm_of_nonneg (ha n).le]
        rw [div_lt_iff₀ (hb n)] at hn
        exact hn.le
- id: p_series_convergence
  kind: textbook
  level: 1
  topic: 級数・p級数
  statement: 実数$p$について、級数$\sum_{n\geq0}1/(n+1)^p$が収束することと$p>1$は同値である。
  statement_en: For real p, the series of 1/(n+1)^p over natural numbers n converges if and only if p > 1.
  assumptions:
  - $p\in\mathbb{R}$
  quantifiers:
  - 任意の$p$
  conclusion: $\sum_{n\geq0}1/(n+1)^p$の収束と$p>1$は同値である。
  answer: |
    $p\in\mathbb{R}$とし、級数$\sum_{n\geq0}1/(n+1)^p$を考える。$m=n+1$と書くとこの級数は$\sum_{m\geq1}m^{-p}$であり、項は正なので、収束と部分和の有界性は同値である。

    $p>1$とする。$k\geq0$と$2^k\leq m<2^{k+1}$を満たす$m$について$m^{-p}\leq2^{-kp}$である。そのような$m$は$2^k$個あるので、この範囲の和は$(2^{1-p})^k$以下である。$2^{1-p}<1$なので、$\sum_{m<2^K}m^{-p}\leq\sum_{k<K}(2^{1-p})^k\leq1/(1-2^{1-p})$となる。部分和は単調増加でこの定数で抑えられるので、級数は収束する。

    $0<p\leq1$とする。$2^k<m\leq2^{k+1}$を満たす$m$について$m^{-p}\geq2^{-(k+1)p}\geq2^{-(k+1)}$であり、そのような$m$は$2^k$個あるので、この範囲の和は$1/2$以上である。よって$\sum_{m\leq2^K}m^{-p}\geq K/2$となり、部分和は有界でない。

    $p\leq0$なら全ての$m\geq1$で$m^{-p}\geq1$なので項が$0$に収束せず、級数は発散する。以上より、級数が収束することと$p>1$は同値である。
  strategy: Group terms in dyadic blocks and compare with a geometric series or with a constant lower bound.
  sketch:
  - "setup: Positive terms converge if and only if the partial sums are bounded."
  - "derive: For p > 1 the block 2^k ≤ m < 2^(k+1) sums to at most (2^(1-p))^k, a convergent geometric series."
  - "derive: For 0 < p ≤ 1 each block 2^k < m ≤ 2^(k+1) sums to at least 1/2."
  - "derive: For p ≤ 0 the terms do not tend to 0."
  - "conclude: The series converges exactly when p > 1."
  openmath: (forall (p) (<-> (real_series_summable (lambda (n) (/ 1 (^ (+ n 1) p)))) (> p 1)))
  hard_negative:
    statement: 級数$\sum_{n\geq0}1/(n+1)^p$は$p\geq1$で収束する。
    reason: $p=1$は調和級数であり、部分和は発散する。
  target: |
    ∀ p : ℝ, Summable (fun n : ℕ => 1 / ((n : ℝ) + 1) ^ p) ↔ 1 < p
  proof: |
    by
      intro p
      have h := summable_nat_add_iff (f := fun n : ℕ => 1 / (n : ℝ) ^ p) 1
      rw [← Real.summable_one_div_nat_rpow (p := p), ← h]
      simp only [Nat.cast_add, Nat.cast_one]
- id: cauchy_condensation
  kind: named
  level: 1
  topic: 級数・コーシーの凝集判定法
  statement: コーシーの凝集判定法。実数列$f(0),f(1),\dots$が非負で単調非増加ならば、$\sum_nf(n)$が収束することと$\sum_k2^kf(2^k)$が収束することは同値である。
  statement_en: Cauchy condensation test. If f is a nonnegative nonincreasing real sequence, then the series of f(n) converges if and only if the series of 2^k f(2^k) converges.
  assumptions:
  - 全ての$n$で$f(n)\geq0$
  - $f$は単調非増加
  quantifiers:
  - 任意の$f:\mathbb{N}\to\mathbb{R}$
  conclusion: $\sum_nf(n)$の収束と$\sum_k2^kf(2^k)$の収束は同値である。
  answer: |
    $f:\mathbb{N}\to\mathbb{R}$を非負で単調非増加な数列とする。どちらの級数も項が非負なので、収束と部分和の有界性は同値である。$T_K=\sum_{k<K}2^kf(2^k)$とおく。

    $2^k\leq i<2^{k+1}$なら$f(i)\leq f(2^k)$であり、この範囲の$i$は$2^k$個ある。したがって$\sum_{1\leq i<2^K}f(i)\leq T_K$である。$(T_K)$が有界なら$\sum_nf(n)$の部分和も有界である。

    $2^k<i\leq2^{k+1}$なら$f(i)\geq f(2^{k+1})$であり、この範囲の$i$は$2^k$個ある。したがって$\sum_{2\leq i\leq2^K}f(i)\geq\sum_{k<K}2^kf(2^{k+1})=\frac12\sum_{1\leq k\leq K}2^kf(2^k)=\frac12(T_{K+1}-f(1))$である。$\sum_nf(n)$の部分和が有界なら$(T_K)$も有界である。
  strategy: Compare the partial sums in dyadic blocks using monotonicity in both directions.
  sketch:
  - "setup: Both series have nonnegative terms, so convergence is boundedness of partial sums."
  - "derive: On 2^k ≤ i < 2^(k+1), f(i) ≤ f(2^k), so the sum up to 2^K is at most T_K."
  - "derive: On 2^k < i ≤ 2^(k+1), f(i) ≥ f(2^(k+1)), so T_(K+1) ≤ f(1) + 2 times the partial sum."
  - "conclude: The two sequences of partial sums are bounded together."
  openmath: (forall (f) (-> (and (forall (n) (>= (seq_value f n) 0)) (seq_antitone f)) (<-> (real_series_summable (lambda (n) (seq_value f n))) (real_series_summable (lambda (k) (* (^ 2 k) (seq_value f (^ 2 k))))))))
  hard_negative:
    statement: 単調性を仮定しなくても、非負の数列なら同じ同値が成り立つ。
    reason: $n$が$2$のべきでないとき$f(n)=1$、$2$のべきのとき$f(n)=0$とすると、$\sum_k2^kf(2^k)=0$は収束するが、$\sum_nf(n)$は発散する。
  target: |
    ∀ f : ℕ → ℝ, (∀ n, 0 ≤ f n) → Antitone f → (Summable f ↔ Summable (fun k : ℕ => (2 : ℝ) ^ k * f (2 ^ k)))
  proof: |
    by
      intro f h0 hf
      exact (summable_condensed_iff_of_nonneg h0 (fun _ _ _ h => hf h)).symm
- id: summation_by_parts
  kind: gap
  level: 1
  topic: 級数・アーベルの総和法
  statement: 実数列$(a_k),(b_k)$と自然数$n$について、$B_m=\sum_{i<m}b_i$とおくと、$\sum_{k=0}^{n}a_kb_k=a_nB_{n+1}-\sum_{k=0}^{n-1}(a_{k+1}-a_k)B_{k+1}$である。
  statement_en: For real sequences a, b and natural n, with B_m the sum of b_i over i < m, the sum of a_k b_k over k ≤ n equals a_n B_(n+1) minus the sum of (a_(k+1) - a_k) B_(k+1) over k < n.
  assumptions:
  - $(a_k),(b_k)$は実数列
  - $n$は自然数
  - $B_m=\sum_{i<m}b_i$
  quantifiers:
  - 任意の$(a_k),(b_k)$と$n$
  conclusion: $\sum_{k=0}^{n}a_kb_k=a_nB_{n+1}-\sum_{k=0}^{n-1}(a_{k+1}-a_k)B_{k+1}$である。
  answer: |
    $(a_k),(b_k)$を実数列とし、$B_m=\sum_{i<m}b_i$とおく。$n$についての帰納法で示す。

    $n=0$では、左辺は$a_0b_0$、右辺は$a_0B_1=a_0b_0$である。

    $n$で等式が成り立つとする。$B_{n+2}=B_{n+1}+b_{n+1}$より、$n+1$での右辺は
    $a_{n+1}(B_{n+1}+b_{n+1})-\sum_{k=0}^{n-1}(a_{k+1}-a_k)B_{k+1}-(a_{n+1}-a_n)B_{n+1}=a_nB_{n+1}-\sum_{k=0}^{n-1}(a_{k+1}-a_k)B_{k+1}+a_{n+1}b_{n+1}$
    である。帰納法の仮定から、これは$\sum_{k=0}^{n}a_kb_k+a_{n+1}b_{n+1}=\sum_{k=0}^{n+1}a_kb_k$に等しい。
  strategy: Induct on n, expanding B_(n+2) = B_(n+1) + b_(n+1).
  sketch:
  - "induction: Induct on n; the case n = 0 reads a_0 b_0 = a_0 B_1."
  - "derive: Expand the right side at n + 1 using B_(n+2) = B_(n+1) + b_(n+1)."
  - "conclude: The induction hypothesis turns it into the left side at n + 1."
  openmath: (forall (a b n) (-> (in n N) (= (real_partial_sum (lambda (k) (* (seq_value a k) (seq_value b k))) (+ n 1)) (- (* (seq_value a n) (real_partial_sum (lambda (i) (seq_value b i)) (+ n 1))) (real_partial_sum (lambda (k) (* (- (seq_value a (+ k 1)) (seq_value a k)) (real_partial_sum (lambda (i) (seq_value b i)) (+ k 1)))) n)))))
  hard_negative:
    statement: 右辺の第1項$a_nB_{n+1}$を除いても等式が成り立つ。
    reason: 全ての$k$で$a_k=b_k=1$とすると、左辺は$n+1$で、第1項を除いた右辺は$0$である。
  target: |
    ∀ (a b : ℕ → ℝ) (n : ℕ), ∑ k ∈ Finset.range (n + 1), a k * b k = a n * (∑ i ∈ Finset.range (n + 1), b i) - ∑ k ∈ Finset.range n, (a (k + 1) - a k) * ∑ i ∈ Finset.range (k + 1), b i
  proof: |
    by
      intro a b n
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_range_succ (fun k => a k * b k) (n + 1), ih,
          Finset.sum_range_succ (fun k => (a (k + 1) - a k) * ∑ i ∈ Finset.range (k + 1), b i) n,
          Finset.sum_range_succ b (n + 1)]
        ring
- id: dirichlet_test
  kind: named
  level: 2
  topic: 級数・ディリクレの判定法
  statement: ディリクレの判定法。実数列$(a_n)$が単調非増加で$0$に収束し、実数列$(b_n)$の部分和が全ての$n$で$|\sum_{i<n}b_i|\leq C$を満たすならば、$\sum_{i<n}a_ib_i$は収束する。
  statement_en: Dirichlet test. If a is nonincreasing and converges to 0 and the partial sums of b are bounded by C, then the partial sums of a_i b_i converge.
  assumptions:
  - $(a_n)$は単調非増加で$a_n\to0$
  - 全ての$n$で$|\sum_{i<n}b_i|\leq C$
  quantifiers:
  - 任意の$(a_n),(b_n)$と$C$
  - ある$L\in\mathbb{R}$
  conclusion: $\sum_{i<n}a_ib_i\to L$である。
  answer: |
    $(a_n)$を$0$に収束する単調非増加な実数列、$(b_n)$を実数列とし、$B_n=\sum_{i<n}b_i$が全ての$n$で$|B_n|\leq C$を満たすとする。$(a_n)$は単調非増加で$0$に収束するので$a_n\geq0$である。

    $m<n$とする。$b_k=B_{k+1}-B_k$を代入して和を整理すると、
    $\sum_{k=m}^{n-1}a_kb_k=a_{n-1}B_n-a_mB_m+\sum_{k=m}^{n-2}(a_k-a_{k+1})B_{k+1}$
    となる。$a_k-a_{k+1}\geq0$と$|B_k|\leq C$から、右辺の絶対値は$C(a_{n-1}+a_m+(a_m-a_{n-1}))=2Ca_m$以下である。

    $a_m\to0$なので、$\sum_{i<n}a_ib_i$はコーシー列である。実数の完備性から収束する。
  strategy: Apply summation by parts to a block sum and bound it by 2C a_m, which tends to 0.
  sketch:
  - "setup: Put B_n for the partial sums of b and note a_n ≥ 0."
  - "translate: Summation by parts rewrites a block sum in terms of B and the differences of a."
  - "derive: Monotonicity makes the differences nonnegative, so the block sum is at most 2C a_m in absolute value."
  - "apply_theorem: The partial sums are Cauchy, so they converge."
  openmath: (forall (a b c) (-> (and (seq_antitone a) (seq_tends_to a 0) (forall (n) (<= (abs (real_partial_sum (lambda (i) (seq_value b i)) n)) c))) (exists (L) (seq_fn_tends_to (lambda (n) (real_partial_sum (lambda (i) (* (seq_value a i) (seq_value b i))) n)) L))))
  hard_negative:
    statement: $(a_n)$の単調性を仮定しなくても、$a_n\to0$なら同じ結論が成り立つ。
    reason: $a_n=(-1)^n/\sqrt{n+1}$、$b_n=(-1)^n$とすると、$b_n$の部分和は有界で$a_n\to0$だが、$a_nb_n=1/\sqrt{n+1}$の和は発散する。
  target: |
    ∀ (a b : ℕ → ℝ) (C : ℝ), Antitone a → Filter.Tendsto a Filter.atTop (nhds 0) → (∀ n, |∑ i ∈ Finset.range n, b i| ≤ C) → ∃ L : ℝ, Filter.Tendsto (fun n => ∑ i ∈ Finset.range n, a i * b i) Filter.atTop (nhds L)
  proof: |
    by
      intro a b C ha h0 hb
      have := ha.cauchySeq_series_mul_of_tendsto_zero_of_bounded h0 (z := b) (b := C) (fun n => by simpa using hb n)
      simp only [smul_eq_mul] at this
      exact cauchySeq_tendsto_of_complete this
- id: power_series_ratio_radius
  kind: gap
  level: 2
  topic: 冪級数・係数の比による収束判定
  statement: 全ての項が$0$でない実数列$(a_n)$と$x\neq0$について$|a_{n+1}|/|a_n|\to l$とする。$l|x|<1$なら$\sum|a_nx^n|$は収束し、$l|x|>1$なら$\sum a_nx^n$の部分和は収束しない。
  statement_en: Let a_n ≠ 0 for all n, x ≠ 0 and |a_(n+1)|/|a_n| → l. If l|x| < 1 then the series of |a_n x^n| converges, and if l|x| > 1 then the partial sums of a_n x^n do not converge.
  assumptions:
  - 全ての$n$で$a_n\neq0$
  - $x\neq0$
  - $|a_{n+1}|/|a_n|\to l$
  quantifiers:
  - 任意の$(a_n)$、$l$、$x$
  conclusion: $l|x|<1$なら絶対収束し、$l|x|>1$なら部分和は収束しない。
  answer: |
    $(a_n)$を全ての項が$0$でない実数列、$x\neq0$とし、$|a_{n+1}|/|a_n|\to l$とする。$c_n=|a_nx^n|$とおくと$c_n>0$であり、$c_{n+1}/c_n=(|a_{n+1}|/|a_n|)|x|\to l|x|$である。

    $l|x|<1$とする。$l|x|<\rho<1$となる$\rho$をとると、ある$N$があり、$n\geq N$なら$c_{n+1}\leq\rho c_n$である。帰納法により$c_{N+k}\leq\rho^kc_N$となり、等比級数との比較から$\sum c_n$は収束する。

    $l|x|>1$とする。ある$N$があり、$n\geq N$なら$c_{n+1}/c_n>1$である。よって$n\geq N$で$c_n\geq c_N>0$となり、$a_nx^n$は$0$に収束しない。部分和$S_n$が収束すると仮定すると、$a_nx^n=S_{n+1}-S_n\to0$となり矛盾する。
  strategy: Apply the ratio argument to c_n = |a_n x^n|, whose ratio tends to l|x|.
  sketch:
  - "translate: With c_n = |a_n x^n|, the ratio c_(n+1)/c_n tends to l|x|."
  - "derive: If l|x| < 1, then c_(n+1) ≤ ρ c_n eventually with some ρ < 1, and comparison with a geometric series applies."
  - "derive: If l|x| > 1, then c_n is eventually at least c_N > 0, so the terms do not tend to 0."
  - "contradiction: Convergent partial sums would force the terms to tend to 0."
  openmath: (forall (a l x) (-> (and (forall (n) (!= (seq_value a n) 0)) (!= x 0) (seq_fn_tends_to (lambda (n) (/ (abs (seq_value a (+ n 1))) (abs (seq_value a n)))) l)) (and (-> (< (* l (abs x)) 1) (real_series_summable (lambda (n) (abs (* (seq_value a n) (^ x n)))))) (-> (> (* l (abs x)) 1) (not (exists (s) (seq_fn_tends_to (lambda (K) (real_partial_sum (lambda (n) (* (seq_value a n) (^ x n))) K)) s)))))))
  hard_negative:
    statement: $l|x|=1$なら、$\sum a_nx^n$の部分和は収束しない。
    reason: $a_n=1/(n+1)^2$、$x=1$では$l|x|=1$だが、級数は収束する。比の極限が$1$の場合、この判定法からは何も分からない。
  target: |
    ∀ (a : ℕ → ℝ) (l x : ℝ), (∀ n, a n ≠ 0) → x ≠ 0 → Filter.Tendsto (fun n => |a (n + 1)| / |a n|) Filter.atTop (nhds l) → (l * |x| < 1 → Summable (fun n => |a n * x ^ n|)) ∧ (1 < l * |x| → ¬ ∃ s : ℝ, Filter.Tendsto (fun K => ∑ n ∈ Finset.range K, a n * x ^ n) Filter.atTop (nhds s))
  proof: |
    by
      intro a l x ha hx h
      have hne : ∀ n, a n * x ^ n ≠ 0 := fun n => mul_ne_zero (ha n) (pow_ne_zero n hx)
      have hr : Filter.Tendsto (fun n => |a (n + 1) * x ^ (n + 1)| / |a n * x ^ n|) Filter.atTop (nhds (l * |x|)) := by
        refine (h.mul_const |x|).congr fun n => ?_
        have h1 : |a n| ≠ 0 := abs_ne_zero.2 (ha n)
        have h2 : |x| ≠ 0 := abs_ne_zero.2 hx
        rw [abs_mul, abs_mul, abs_pow, abs_pow, pow_succ]
        field_simp
      constructor
      · intro hl
        refine summable_of_ratio_test_tendsto_lt_one hl (Filter.Eventually.of_forall fun n => abs_ne_zero.2 (hne n)) ?_
        simpa using hr
      · rintro hl ⟨s, hs⟩
        have h0 : Filter.Tendsto (fun n => a n * x ^ n) Filter.atTop (nhds 0) := by
          have h2 := (hs.comp (Filter.tendsto_add_atTop_nat 1)).sub hs
          simp only [sub_self] at h2
          refine h2.congr fun n => ?_
          simp [Finset.sum_range_succ]
        obtain ⟨N, hN⟩ := Filter.eventually_atTop.1 (hr.eventually (lt_mem_nhds hl))
        have hgrow : ∀ k, |a N * x ^ N| ≤ |a (N + k) * x ^ (N + k)| := by
          intro k
          induction k with
          | zero => simp
          | succ k ih =>
            have h3 := hN (N + k) (by omega)
            rw [one_lt_div (abs_pos.2 (hne (N + k)))] at h3
            exact ih.trans h3.le
        obtain ⟨M, hM⟩ := Metric.tendsto_atTop.1 h0 _ (abs_pos.2 (hne N))
        have h4 := hM (N + M) (by omega)
        rw [Real.dist_eq, sub_zero] at h4
        exact absurd h4 (not_lt.2 (hgrow M))
- id: power_series_derivative
  kind: textbook
  level: 2
  topic: 冪級数・項別微分
  statement: $r>0$で$\sum|a_n|r^n$が収束し$|x|<r$ならば、$\sum_{n\geq0}(n+1)a_{n+1}x^n$は絶対収束し、関数$y\mapsto\sum_{n\geq0}a_ny^n$は$x$で微分可能で、その微分係数はこの級数の和に等しい。
  statement_en: If r > 0, the series of |a_n| r^n converges and |x| < r, then the series of (n+1) a_(n+1) x^n converges absolutely and the function y ↦ Σ a_n y^n has that sum as its derivative at x.
  assumptions:
  - $r>0$
  - $\sum|a_n|r^n$は収束
  - $|x|<r$
  quantifiers:
  - 任意の実数列$(a_n)$と$r,x\in\mathbb{R}$
  conclusion: $\sum_{n\geq0}(n+1)a_{n+1}x^n$は絶対収束し、その和は$y\mapsto\sum_{n\geq0}a_ny^n$の$x$での微分係数に等しい。
  answer: |
    $(a_n)$を実数列、$r>0$とし、$\sum|a_n|r^n$は収束し、$|x|<r$とする。$|y|<r$なら$|a_ny^n|\leq|a_n|r^n$なので、$\sum a_ny^n$は絶対収束する。

    $s=(|x|+r)/2$、$q=s/r$とおくと、$|x|<s<r$かつ$0<q<1$である。$(n+1)q^n\to0$なので、ある$K$があり全ての$n$で$(n+1)q^n\leq K$である。したがって$u_n=|a_{n+1}|(n+1)s^n$とおくと
    $u_n=|a_{n+1}|(n+1)q^nr^n\leq(K/r)|a_{n+1}|r^{n+1}$
    となり、$\sum u_n$は収束する。

    $g_n(y)=a_{n+1}y^{n+1}$とおくと$g_n'(y)=(n+1)a_{n+1}y^n$であり、開区間$(-s,s)$上で$|g_n'(y)|\leq u_n$である。特に$\sum(n+1)a_{n+1}x^n$は絶対収束する。項別微分の定理（開区間上の微分可能な関数$g_n$が$|g_n'|\leq u_n$、$\sum u_n<\infty$を満たし、$\sum g_n$が1点で収束するなら、$\sum g_n$はその区間で微分可能で導関数は$\sum g_n'$である）を適用する。$y=0$では全ての$g_n(0)$が$0$なので、$\sum g_n$は$(-s,s)$の1点で収束している。よって$G(y)=\sum_{n\geq0}g_n(y)$は$x$で微分係数$\sum(n+1)a_{n+1}x^n$をもつ。

    $|y|<r$なら$\sum_{n\geq0}a_ny^n=a_0+G(y)$である。この関数は$x$の近くで$a_0+G$と一致するので、同じ微分係数をもつ。
  strategy: Choose s between |x| and r, bound the differentiated terms by a summable sequence, and differentiate term by term.
  sketch:
  - "setup: Put s = (|x|+r)/2 and q = s/r, so |x| < s < r and q < 1."
  - "derive: The sequence (n+1)q^n is bounded by some K, so u_n = |a_(n+1)|(n+1)s^n is summable."
  - "apply_theorem: The term-by-term differentiation theorem applies to a_(n+1) y^(n+1) on (-s, s)."
  - "derive: The differentiated series converges absolutely at x."
  - "conclude: Adding the constant a_0 gives the derivative of the original power series near x."
  openmath: (forall (a r x) (-> (and (> r 0) (real_series_summable (lambda (n) (* (abs (seq_value a n)) (^ r n)))) (< (abs x) r)) (and (real_series_summable (lambda (n) (* (* (+ n 1) (seq_value a (+ n 1))) (^ x n)))) (has_deriv_at (lambda (y) (real_series_sum (lambda (n) (* (seq_value a n) (^ y n))))) (real_series_sum (lambda (n) (* (* (+ n 1) (seq_value a (+ n 1))) (^ x n)))) x))))
  hard_negative:
    statement: $|x|=r$でも、項別微分した級数$\sum(n+1)a_{n+1}x^n$は収束する。
    reason: $n\geq1$で$a_n=1/n^2$、$a_0=0$、$r=1$、$x=1$とすると$\sum|a_n|r^n$は収束するが、$(n+1)a_{n+1}x^n=1/(n+1)$の和は発散する。
  target: |
    ∀ (a : ℕ → ℝ) (r x : ℝ), 0 < r → Summable (fun n => |a n| * r ^ n) → |x| < r → Summable (fun n : ℕ => ((n : ℝ) + 1) * a (n + 1) * x ^ n) ∧ HasDerivAt (fun y : ℝ => ∑' n, a n * y ^ n) (∑' n : ℕ, ((n : ℝ) + 1) * a (n + 1) * x ^ n) x
  proof: |
    by
      intro a r x hr hs hx
      have hsum : ∀ y : ℝ, |y| < r → Summable (fun n => a n * y ^ n) := fun y hy =>
        Summable.of_norm_bounded hs fun n => by
          rw [norm_mul, norm_pow, Real.norm_eq_abs, Real.norm_eq_abs]
          have : |y| ^ n ≤ r ^ n := by gcongr
          exact mul_le_mul_of_nonneg_left this (abs_nonneg _)
      have hxs : |x| < (|x| + r) / 2 := by linarith
      have hsr : (|x| + r) / 2 < r := by linarith
      have hs0 : 0 < (|x| + r) / 2 := by positivity
      obtain ⟨s, hs_def⟩ : ∃ s, s = (|x| + r) / 2 := ⟨_, rfl⟩
      rw [← hs_def] at hxs hsr hs0
      have hq0 : 0 ≤ s / r := by positivity
      have hq1 : s / r < 1 := (div_lt_one hr).2 hsr
      have hlim : Filter.Tendsto (fun n : ℕ => (n : ℝ) * (s / r) ^ n + (s / r) ^ n) Filter.atTop (nhds 0) := by
        simpa using (tendsto_self_mul_const_pow_of_lt_one hq0 hq1).add (tendsto_pow_atTop_nhds_zero_of_lt_one hq0 hq1)
      obtain ⟨C, hC⟩ := isBounded_iff_forall_norm_le.1 (Metric.isBounded_range_of_tendsto _ hlim)
      have hbd : ∀ n : ℕ, ((n : ℝ) + 1) * s ^ n ≤ C / r * r ^ (n + 1) := fun n => by
        have h1 := (le_abs_self _).trans (hC _ ⟨n, rfl⟩)
        have e1 : ((n : ℝ) + 1) * s ^ n = ((n : ℝ) * (s / r) ^ n + (s / r) ^ n) * r ^ n := by
          rw [div_pow]; field_simp
        have e2 : C / r * r ^ (n + 1) = C * r ^ n := by rw [pow_succ]; field_simp
        rw [e1, e2]
        gcongr
      have hu : Summable (fun n : ℕ => |a (n + 1)| * (((n : ℝ) + 1) * s ^ n)) := by
        refine Summable.of_nonneg_of_le (fun n => by positivity) (fun n => ?_)
          (((summable_nat_add_iff 1).2 hs).mul_left (C / r))
        calc |a (n + 1)| * (((n : ℝ) + 1) * s ^ n) ≤ |a (n + 1)| * (C / r * r ^ (n + 1)) :=
              mul_le_mul_of_nonneg_left (hbd n) (abs_nonneg _)
          _ = C / r * (|a (n + 1)| * r ^ (n + 1)) := by ring
      have hbound : ∀ (n : ℕ) (y : ℝ), |y| < s → ‖a (n + 1) * (((n : ℝ) + 1) * y ^ n)‖ ≤ |a (n + 1)| * (((n : ℝ) + 1) * s ^ n) := by
        intro n y hy
        rw [norm_mul, norm_mul, norm_pow, Real.norm_eq_abs, Real.norm_eq_abs, Real.norm_eq_abs,
          abs_of_nonneg (by positivity : (0 : ℝ) ≤ (n : ℝ) + 1)]
        gcongr
      have hmem : x ∈ Metric.ball (0 : ℝ) s := by simpa using hxs
      have key : HasDerivAt (fun z : ℝ => ∑' n : ℕ, a (n + 1) * z ^ (n + 1))
          (∑' n : ℕ, a (n + 1) * (((n : ℝ) + 1) * x ^ n)) x := by
        refine hasDerivAt_tsum_of_isPreconnected (g := fun (n : ℕ) (z : ℝ) => a (n + 1) * z ^ (n + 1))
          (g' := fun (n : ℕ) (z : ℝ) => a (n + 1) * (((n : ℝ) + 1) * z ^ n)) (y₀ := x) hu Metric.isOpen_ball
          (convex_ball (0 : ℝ) s).isPreconnected ?_ ?_ hmem ?_ hmem
        · intro n y _
          have := (hasDerivAt_pow (n + 1) y).const_mul (a (n + 1))
          simpa using this
        · intro n y hy
          exact hbound n y (by simpa using hy)
        · exact (summable_nat_add_iff 1).2 (hsum x (hxs.trans hsr))
      have hev : (fun y : ℝ => ∑' n, a n * y ^ n) =ᶠ[nhds x] fun y => a 0 + ∑' n : ℕ, a (n + 1) * y ^ (n + 1) := by
        filter_upwards [Metric.ball_mem_nhds x (sub_pos.2 hx)] with y hy
        have hy' : |y| < r := by
          have := abs_sub_abs_le_abs_sub y x
          rw [Metric.mem_ball, Real.dist_eq] at hy
          linarith [le_abs_self (y - x)]
        rw [(hsum y hy').tsum_eq_zero_add]
        simp
      have e : (∑' n : ℕ, ((n : ℝ) + 1) * a (n + 1) * x ^ n) = ∑' n : ℕ, a (n + 1) * (((n : ℝ) + 1) * x ^ n) :=
        tsum_congr fun n => by ring
      constructor
      · refine Summable.of_norm_bounded hu fun n => ?_
        have := hbound n x hxs
        rwa [show ((n : ℝ) + 1) * a (n + 1) * x ^ n = a (n + 1) * (((n : ℝ) + 1) * x ^ n) by ring]
      · rw [e]
        exact (key.const_add (a 0)).congr_of_eventuallyEq hev
- id: abel_limit_theorem
  kind: named
  level: 2
  topic: 冪級数・アーベルの極限定理
  statement: アーベルの極限定理。実数列$(a_n)$の部分和$\sum_{i<n}a_i$が$l$に収束するならば、$|x|<1$で$\sum a_nx^n$は絶対収束し、$x\to1-0$のとき$\sum_{n\geq0}a_nx^n\to l$である。
  statement_en: Abel's limit theorem. If the partial sums of a real series a converge to l, then the series of a_n x^n converges absolutely for |x| < 1 and its sum tends to l as x tends to 1 from the left.
  assumptions:
  - $(a_n)$は実数列
  - $\sum_{i<n}a_i\to l$
  quantifiers:
  - 任意の$(a_n)$と$l$
  conclusion: $|x|<1$で$\sum a_nx^n$は絶対収束し、$x\to1-0$で和は$l$に収束する。
  answer: |
    $(a_n)$を実数列とし、部分和$\sum_{i<n}a_i$が$l$に収束するとする。$A_n=\sum_{i\leq n}a_i$とおくと$A_n\to l$であり、$a_n=A_n-A_{n-1}\to0$（$n\geq1$）である。

    $(a_n)$と$(A_n)$は収束するので有界である。よって$|x|<1$なら等比級数との比較により、$\sum a_nx^n$と$\sum A_nx^n$は絶対収束する。項を並べ替えて
    $(1-x)\sum_{n\geq0}A_nx^n=A_0+\sum_{n\geq1}(A_n-A_{n-1})x^n=\sum_{n\geq0}a_nx^n$
    を得る。$(1-x)\sum_{n\geq0}x^n=1$と合わせると、$\sum_{n\geq0}a_nx^n-l=(1-x)\sum_{n\geq0}(A_n-l)x^n$である。

    $\varepsilon>0$を任意にとる。ある$N$があり、$n\geq N$なら$|A_n-l|<\varepsilon/2$である。$D=\sum_{n<N}|A_n-l|$とおく。$0\leq x<1$なら
    $\left|\sum_{n\geq0}a_nx^n-l\right|\leq(1-x)D+(1-x)\sum_{n\geq N}\frac{\varepsilon}{2}x^n\leq(1-x)D+\frac{\varepsilon}{2}$
    である。$0<\eta\leq1$を$\eta D<\varepsilon/2$となるようにとると、$1-\eta<x<1$で左辺は$\varepsilon$より小さい。
  strategy: Rewrite the power series with partial sums via Abel summation, then split into a finite head and a small tail.
  sketch:
  - "derive: The partial sums A_n and the terms a_n are bounded, so both power series converge absolutely for |x| < 1."
  - "translate: The sum of a_n x^n minus l equals (1-x) times the sum of (A_n - l) x^n."
  - "setup: Fix ε > 0 and take N with |A_n - l| < ε/2 for n ≥ N."
  - "derive: The head contributes at most (1-x)D and the tail at most ε/2."
  - "conclude: Choosing x close to 1 makes the difference smaller than ε."
  openmath: (forall (a l) (-> (seq_fn_tends_to (lambda (n) (real_partial_sum (lambda (i) (seq_value a i)) n)) l) (and (forall (x) (-> (< (abs x) 1) (real_series_summable (lambda (n) (* (seq_value a n) (^ x n)))))) (fn_left_limit_at (lambda (x) (real_series_sum (lambda (n) (* (seq_value a n) (^ x n))))) 1 l))))
  hard_negative:
    statement: $x\to1-0$で$\sum_{n\geq0}a_nx^n$が収束すれば、$\sum a_n$も収束する。
    reason: $a_n=(-1)^n$なら$\sum_{n\geq0}a_nx^n=1/(1+x)\to1/2$だが、$\sum a_n$は発散する。
  target: |
    ∀ (a : ℕ → ℝ) (l : ℝ), Filter.Tendsto (fun n => ∑ i ∈ Finset.range n, a i) Filter.atTop (nhds l) → (∀ x : ℝ, |x| < 1 → Summable (fun n => a n * x ^ n)) ∧ Filter.Tendsto (fun x : ℝ => ∑' n, a n * x ^ n) (nhdsWithin 1 (Set.Iio 1)) (nhds l)
  proof: |
    by
      intro a l h
      refine ⟨fun x hx => ?_, Real.tendsto_tsum_powerSeries_nhdsWithin_lt h⟩
      have h0 : Filter.Tendsto a Filter.atTop (nhds 0) := by
        have h1 := h.comp (Filter.tendsto_add_atTop_nat 1)
        have h2 := h1.sub h
        simp only [sub_self] at h2
        refine h2.congr fun n => ?_
        simp [Finset.sum_range_succ]
      obtain ⟨C, hC⟩ := isBounded_iff_forall_norm_le.1 (Metric.isBounded_range_of_tendsto a h0)
      refine Summable.of_norm_bounded (g := fun n => C * |x| ^ n) ((summable_geometric_of_lt_one (abs_nonneg x) hx).mul_left C) fun n => ?_
      rw [norm_mul, norm_pow, Real.norm_eq_abs x]
      exact mul_le_mul_of_nonneg_right (hC _ ⟨n, rfl⟩) (by positivity)
- id: inf_dist_lipschitz
  kind: gap
  level: 2
  topic: 距離空間・集合への距離
  statement: 距離空間$X$の空でない部分集合$S$について$d(x,S)=\inf_{s\in S}d(x,s)$とおくと、全ての$x,y\in X$で$|d(x,S)-d(y,S)|\leq d(x,y)$である。
  statement_en: For a nonempty subset S of a metric space X, with d(x,S) the infimum of d(x,s) over s in S, |d(x,S) - d(y,S)| ≤ d(x,y) for all x, y in X.
  assumptions:
  - $X$は距離空間
  - $S\subseteq X$は空でない
  quantifiers:
  - 任意の$X$、$S$、$x,y\in X$
  conclusion: $|d(x,S)-d(y,S)|\leq d(x,y)$である。
  answer: |
    $X$を距離空間、$S\subseteq X$を空でない部分集合とし、$x,y\in X$とする。

    $s\in S$を任意にとる。下限の定義と三角不等式から$d(x,S)\leq d(x,s)\leq d(x,y)+d(y,s)$である。$s$について下限をとると$d(x,S)\leq d(x,y)+d(y,S)$となる。$x$と$y$を入れ替えると$d(y,S)\leq d(x,y)+d(x,S)$である。二つを合わせて$|d(x,S)-d(y,S)|\leq d(x,y)$を得る。
  strategy: Use the triangle inequality for each s and take the infimum, then swap x and y.
  sketch:
  - "derive: For s in S, d(x,S) ≤ d(x,y) + d(y,s)."
  - "derive: Taking the infimum over s gives d(x,S) ≤ d(x,y) + d(y,S)."
  - "conclude: Swapping x and y gives the absolute value bound."
  openmath: (forall (X S x y) (-> (and (metric_space X) (exists (s) (in s S)) (subset S X) (in x X) (in y X)) (<= (abs (- (dist_to_set x S) (dist_to_set y S))) (dist_of x y))))
  hard_negative:
    statement: $d(x,S)=0$なら$x\in S$である。
    reason: $X=\mathbb{R}$、$S=(0,1)$、$x=0$とすると$d(x,S)=0$だが$x\notin S$である。$d(x,S)=0$は$x$が$S$の閉包に属することを意味する。
  target: |
    ∀ (X : Type*) [MetricSpace X] (S : Set X) (x y : X), S.Nonempty → |Metric.infDist x S - Metric.infDist y S| ≤ dist x y
  proof: |
    by
      intro X _ S x y hS
      rw [abs_le]
      constructor
      · have := Metric.infDist_le_infDist_add_dist (s := S) (x := y) (y := x)
        rw [dist_comm] at this
        linarith
      · have := Metric.infDist_le_infDist_add_dist (s := S) (x := x) (y := y)
        linarith
- id: cantor_intersection
  kind: named
  level: 2
  topic: 距離空間・カントールの共通部分定理
  statement: カントールの共通部分定理。完備距離空間$X$の空でない閉集合の減少列$(F_n)$について、任意の$\varepsilon>0$に対してある$N$があり$F_N$の任意の2点の距離が$\varepsilon$未満ならば、全ての$F_n$に属する点がちょうど1つ存在する。
  statement_en: Cantor intersection theorem. If F_n is a decreasing sequence of nonempty closed subsets of a complete metric space and for every ε > 0 some F_N has all pairwise distances below ε, then exactly one point lies in every F_n.
  assumptions:
  - $X$は完備距離空間
  - 各$F_n$は空でない閉集合で$F_{n+1}\subseteq F_n$
  - 任意の$\varepsilon>0$に対してある$N$があり、$x,y\in F_N$なら$d(x,y)<\varepsilon$
  quantifiers:
  - 任意の$X$と$(F_n)$
  conclusion: 全ての$F_n$に属する点がちょうど1つ存在する。
  answer: |
    $X$を完備距離空間、$(F_n)$を$F_{n+1}\subseteq F_n$を満たす空でない閉集合の列とし、任意の$\varepsilon>0$に対してある$N$があり、$x,y\in F_N$なら$d(x,y)<\varepsilon$であるとする。

    各$n$で$p_n\in F_n$を選ぶ。$\varepsilon>0$に対する$N$をとると、$m,n\geq N$なら$p_m,p_n\in F_N$なので$d(p_m,p_n)<\varepsilon$である。よって$(p_n)$はコーシー列であり、完備性からある$x\in X$に収束する。

    $n$を固定する。$m\geq n$なら$p_m\in F_n$であり、$F_n$は閉集合なので、極限$x$も$F_n$に属する。したがって$x$は全ての$F_n$に属する。

    $y$も全ての$F_n$に属するとし、$y\neq x$と仮定する。$\varepsilon=d(y,x)>0$に対する$N$をとると、$x,y\in F_N$より$d(y,x)<d(y,x)$となり矛盾する。よって$y=x$である。
  strategy: Choose a point in each set; they form a Cauchy sequence whose limit lies in every closed set.
  sketch:
  - "construct: Pick p_n in F_n for each n."
  - "derive: The shrinking condition makes (p_n) a Cauchy sequence, so it converges to some x."
  - "derive: For fixed n, p_m lies in the closed set F_n for m ≥ n, so x lies in F_n."
  - "contradiction: A second common point y would give d(y,x) < d(y,x)."
  - "conclude: The common point exists and is unique."
  openmath: (forall (X F) (-> (and (metric_space X) (complete_space X) (forall (n) (closed_in (seq_value F n) X)) (forall (n) (exists (x) (in x (seq_value F n)))) (forall (n) (subset (seq_value F (+ n 1)) (seq_value F n))) (forall (e) (-> (> e 0) (exists (M) (forall (x y) (-> (and (in x (seq_value F M)) (in y (seq_value F M))) (< (dist_of x y) e))))))) (exists (x) (and (forall (n) (in x (seq_value F n))) (forall (y) (-> (forall (n) (in y (seq_value F n))) (= y x)))))))
  hard_negative:
    statement: 完備距離空間の空でない閉集合の減少列は、直径の条件がなくても共通点をもつ。
    reason: $\mathbb{R}$で$F_n=[n,\infty)$とすると、空でない閉集合の減少列だが、共通部分は空である。
  target: |
    ∀ (X : Type*) [MetricSpace X] [CompleteSpace X] (F : ℕ → Set X), (∀ n, IsClosed (F n)) → (∀ n, (F n).Nonempty) → (∀ n, F (n + 1) ⊆ F n) → (∀ ε : ℝ, 0 < ε → ∃ N : ℕ, ∀ x ∈ F N, ∀ y ∈ F N, dist x y < ε) → ∃! x : X, ∀ n, x ∈ F n
  proof: |
    by
      intro X _ _ F hc hne hd hs
      have hanti : Antitone F := antitone_nat_of_succ_le hd
      choose p hp using hne
      have hC : CauchySeq p := by
        rw [Metric.cauchySeq_iff]
        intro ε hε
        obtain ⟨N, hN⟩ := hs ε hε
        exact ⟨N, fun m hm n hn => hN _ (hanti hm (hp m)) _ (hanti hn (hp n))⟩
      obtain ⟨x, hx⟩ := cauchySeq_tendsto_of_complete hC
      have hmem : ∀ n, x ∈ F n := fun n =>
        (hc n).mem_of_tendsto hx (Filter.eventually_atTop.2 ⟨n, fun m hm => hanti hm (hp m)⟩)
      refine ⟨x, hmem, fun y hy => ?_⟩
      by_contra hne'
      have hpos : 0 < dist y x := dist_pos.2 hne'
      obtain ⟨N, hN⟩ := hs (dist y x) hpos
      exact lt_irrefl _ (hN y (hy N) x (hmem N))
