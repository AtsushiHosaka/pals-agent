  - $[a,b]$上で$|f|\leq M$
  quantifiers:
  - 任意の$f$、$a$、$b$、$M$、$x,y\in[a,b]$
  conclusion: $\left|\int_a^xf-\int_a^yf\right|\leq M|x-y|$である。
  answer: |
    $f$を$[a,b]$上の連続関数とし、$|f|\leq M$、$x,y\in[a,b]$とする。

    積分の加法性から$\int_a^xf-\int_a^yf=\int_y^xf$である。$y\leq x$なら、$|f|\leq M$と積分の単調性から$\left|\int_y^xf\right|\leq\int_y^x|f|\leq M(x-y)$である。$x<y$なら$\int_y^xf=-\int_x^yf$であり、同様に$M(y-x)$以下である。
  strategy: Reduce the difference to a single integral between y and x and bound the integrand.
  sketch:
  - "derive: The difference equals the integral of f from y to x."
  - "conclude: Bounding the integrand by M gives at most M|x - y|."
  openmath: (forall (f a b c x y) (-> (and (fn_continuous_on (lambda (t) (fn_value f t)) (closed_interval a b)) (forall (t) (-> (in t (closed_interval a b)) (<= (abs (fn_value f t)) c))) (in x (closed_interval a b)) (in y (closed_interval a b))) (<= (abs (- (interval_integral a x (lambda (t) (fn_value f t))) (interval_integral a y (lambda (t) (fn_value f t))))) (* c (abs (- x y))))))
  hard_negative:
    statement: $f$が$[a,b]$上連続ならば、原始関数の差は$|x-y|$以下である。
    reason: $f=2$、$[a,b]=[0,1]$、$x=1$、$y=0$では差は$2$で、$|x-y|=1$を超える。$f$の上界$M$が必要である。
  target: |
    ∀ (f : ℝ → ℝ) (a b M : ℝ), ContinuousOn f (Set.Icc a b) → (∀ t ∈ Set.Icc a b, |f t| ≤ M) → ∀ x ∈ Set.Icc a b, ∀ y ∈ Set.Icc a b, |(∫ t in a..x, f t) - ∫ t in a..y, f t| ≤ M * |x - y|
  proof: |
    by
      intro f a b M hf hM x hx y hy
      have hab : a ≤ b := hx.1.trans hx.2
      have ha : a ∈ Set.Icc a b := Set.left_mem_Icc.2 hab
      have hi : ∀ s ∈ Set.Icc a b, ∀ t ∈ Set.Icc a b, IntervalIntegrable f MeasureTheory.volume s t := fun s hs t ht =>
        (hf.mono (Set.uIcc_subset_Icc hs ht)).intervalIntegrable
      rw [intervalIntegral.integral_interval_sub_left (hi a ha x hx) (hi a ha y hy)]
      have h := intervalIntegral.norm_integral_le_of_norm_le_const (a := y) (b := x) (f := f) (C := M) (fun t ht =>
        by
          rw [Real.norm_eq_abs]
          exact hM t (Set.uIcc_subset_Icc hy hx (Set.uIoc_subset_uIcc ht)))
      rwa [Real.norm_eq_abs] at h
- id: integral_average_limit
  kind: gap
  level: 1
  topic: 積分・平均値の極限
  statement: $f:\mathbb{R}\to\mathbb{R}$が連続ならば、$h\to0$（$h\neq0$）で$\frac1h\int_a^{a+h}f(x)\,dx\to f(a)$である。
  statement_en: If f is continuous on the reals, then (1/h) ∫_a^(a+h) f(x) dx → f(a) as h → 0 with h ≠ 0.
  assumptions:
  - $f:\mathbb{R}\to\mathbb{R}$は連続
  quantifiers:
  - 任意の$f$と$a$
  conclusion: $h\to0$（$h\neq0$）で$\frac1h\int_a^{a+h}f\to f(a)$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$を連続関数とし、$a\in\mathbb{R}$、$\varepsilon>0$とする。

    $\delta>0$があり、$|x-a|<\delta$なら$|f(x)-f(a)|<\varepsilon/2$である。$0<|h|<\delta$とする。$\frac1h\int_a^{a+h}f(a)\,dx=f(a)$なので$\left|\frac1h\int_a^{a+h}f(x)\,dx-f(a)\right|=\frac1{|h|}\left|\int_a^{a+h}(f(x)-f(a))\,dx\right|\leq\frac\varepsilon2<\varepsilon$である。最後の不等号は、$a$と$a+h$の間の$x$が$|x-a|<\delta$を満たすことによる。
  strategy: Subtract the constant f(a) and bound the integrand with the ε-δ condition.
  sketch:
  - "setup: Take δ with |f(x) - f(a)| < ε/2 for |x - a| < δ."
  - "derive: (1/h) ∫_a^(a+h) f - f(a) equals (1/h) ∫_a^(a+h) (f - f(a))."
  - "conclude: For 0 < |h| < δ the absolute value is at most ε/2."
  openmath: (forall (f a) (-> (fn_continuous (lambda (x) (fn_value f x))) (fn_limit_at (lambda (h) (* (/ 1 h) (interval_integral a (+ a h) (lambda (x) (fn_value f x))))) 0 (fn_value f a))))
  hard_negative:
    statement: $\frac1h\int_a^{a+h}f\to c$となる$f$は、$a$で連続で$f(a)=c$である。
    reason: $f(0)=1$、$x\neq0$で$f(x)=0$とすると、$a=0$で積分は常に$0$なので$c=0$だが、$f$は$0$で連続でなく$f(0)=1$である。
  target: |
    ∀ (f : ℝ → ℝ) (a : ℝ), Continuous f → Filter.Tendsto (fun h => (1 / h) * ∫ x in a..a + h, f x) (nhdsWithin 0 {0}ᶜ) (nhds (f a))
  proof: |
    by
      intro f a hf
      have hd : HasDerivAt (fun u => ∫ x in a..u, f x) (f a) a :=
        intervalIntegral.integral_hasDerivAt_right (hf.intervalIntegrable _ _) (hf.stronglyMeasurableAtFilter _ _) hf.continuousAt
      refine hd.tendsto_slope_zero.congr fun h => ?_
      simp only [intervalIntegral.integral_same, sub_zero, smul_eq_mul, one_div]
- id: integral_all_subintervals_zero
  kind: gap
  level: 1
  topic: 積分・部分区間の積分が全て0の連続関数
  statement: $a<b$で$f:\mathbb{R}\to\mathbb{R}$が連続であり、全ての$x\in[a,b]$で$\int_a^xf(t)\,dt=0$ならば、$[a,b]$上で$f=0$である。
  statement_en: If a < b, f is continuous on the reals and the integral of f from a to x vanishes for all x in [a, b], then f = 0 on [a, b].
  assumptions:
  - $a<b$
  - $f$は連続
  - 全ての$x\in[a,b]$で$\int_a^xf=0$
  quantifiers:
  - 任意の$f$、$a<b$
  conclusion: 全ての$x\in[a,b]$で$f(x)=0$である。
  answer: |
    $a<b$とし、$f:\mathbb{R}\to\mathbb{R}$を連続関数、全ての$x\in[a,b]$で$F(x)=\int_a^xf=0$とする。

    $x\in(a,b)$とする。微積分学の基本定理から$F'(x)=f(x)$である。一方$F$は$x$の近傍で恒等的に$0$なので$F'(x)=0$である。よって$f(x)=0$である。

    $f$は連続で$(a,b)$上$0$なので、端点でも$f(a)=\lim_{x\to a+0}f(x)=0$、$f(b)=\lim_{x\to b-0}f(x)=0$である。
  strategy: Differentiate the vanishing primitive at interior points and extend to the endpoints by continuity.
  sketch:
  - "apply_theorem: The fundamental theorem gives F'(x) = f(x) on (a, b)."
  - "derive: F vanishes near each interior point, so F'(x) = 0 and f(x) = 0."
  - "conclude: Continuity extends f = 0 to the endpoints."
  openmath: (forall (f a b) (-> (and (< a b) (fn_continuous (lambda (x) (fn_value f x))) (forall (x) (-> (in x (closed_interval a b)) (= (interval_integral a x (lambda (t) (fn_value f t))) 0)))) (forall (x) (-> (in x (closed_interval a b)) (= (fn_value f x) 0)))))
  hard_negative:
    statement: $a<b$で$f$が連続であり$\int_a^bf=0$ならば、$[a,b]$上で$f=0$である。
    reason: $f(x)=x$、$[a,b]=[-1,1]$では$\int_{-1}^1x\,dx=0$だが、$f$は恒等的に$0$でない。全ての上端での積分が$0$である必要がある。
  target: |
    ∀ (f : ℝ → ℝ) (a b : ℝ), a < b → Continuous f → (∀ x ∈ Set.Icc a b, ∫ t in a..x, f t = 0) → ∀ x ∈ Set.Icc a b, f x = 0
  proof: |
    by
      intro f a b hab hf h
      have hopen : Set.EqOn f (fun _ => 0) (Set.Ioo a b) := by
        intro x hx
        have hd : HasDerivAt (fun u => ∫ t in a..u, f t) (f x) x :=
          intervalIntegral.integral_hasDerivAt_right (hf.intervalIntegrable _ _) (hf.stronglyMeasurableAtFilter _ _) hf.continuousAt
        have h0 : HasDerivAt (fun u => ∫ t in a..u, f t) 0 x := by
          refine (hasDerivAt_const x (0 : ℝ)).congr_of_eventuallyEq ?_
          filter_upwards [Ioo_mem_nhds hx.1 hx.2] with u hu
          exact h u ⟨hu.1.le, hu.2.le⟩
        exact hd.unique h0
      intro x hx
      have hcl : x ∈ closure (Set.Ioo a b) := by
        rw [closure_Ioo hab.ne]
        exact hx
      exact hopen.closure hf continuous_const hcl
- id: improper_cauchy_criterion
  kind: gap
  level: 1
  topic: 広義積分・コーシーの判定条件
  statement: $f$が$[a,\infty)$で連続のとき、$\lim_{t\to\infty}\int_a^tf$が存在することと、任意の$\varepsilon>0$に対してある$T\geq a$があり、$s,t\geq T$なら$\left|\int_s^tf\right|<\varepsilon$となることは同値である。
  statement_en: If f is continuous on [a, ∞), then the limit of ∫_a^t f as t → ∞ exists if and only if for every ε > 0 there is T ≥ a with |∫_s^t f| < ε for all s, t ≥ T.
  assumptions:
  - $f$は$[a,\infty)$で連続
  quantifiers:
  - 任意の$f$と$a$
  conclusion: 広義積分の収束とコーシーの条件は同値である。
  answer: |
    $f$を$[a,\infty)$で連続な関数とし、$t\geq a$で$F(t)=\int_a^tf$とおく。$s,t\geq a$なら$F(t)-F(s)=\int_s^tf$である。

    $F(t)\to L$とする。$\varepsilon>0$に対し$T\geq a$をとり、$t\geq T$で$|F(t)-L|<\varepsilon/2$とする。$s,t\geq T$なら$\left|\int_s^tf\right|=|F(t)-F(s)|<\varepsilon$である。

    逆に条件を仮定する。$t_n=a+n$とおくと、条件から$(F(t_n))$はコーシー列なのである$L$に収束する。$\varepsilon>0$に対し、条件を$\varepsilon/2$に使って$T$をとる。$t_n\geq T$かつ$|F(t_n)-L|<\varepsilon/2$となる$n$をとると、$t\geq T$で$|F(t)-L|\leq|F(t)-F(t_n)|+|F(t_n)-L|<\varepsilon$である。よって$F(t)\to L$である。
  strategy: Translate the integral over [s, t] into a difference of the primitive and use completeness along a sequence.
  sketch:
  - "setup: Put F(t) for the integral from a to t, so that F(t) - F(s) is the integral from s to t."
  - "derive: Convergence of F gives the condition by the triangle inequality."
  - "construct: Conversely F(a+n) is a Cauchy sequence with a limit L."
  - "conclude: The condition extends this limit to all t → ∞."
  openmath: (forall (f a) (-> (fn_continuous_on (lambda (x) (fn_value f x)) (closed_half_line_right a)) (<-> (exists (L) (fn_limit_at_top (lambda (t) (interval_integral a t (lambda (x) (fn_value f x)))) L)) (forall (e) (-> (> e 0) (exists (T) (and (>= T a) (forall (s t) (-> (and (>= s T) (>= t T)) (< (abs (interval_integral s t (lambda (x) (fn_value f x)))) e))))))))))
  hard_negative:
    statement: $x\to\infty$で$f(x)\to0$ならば、$\lim_{t\to\infty}\int_a^tf$は存在する。
    reason: $f(x)=1/x$、$a=1$では$f(x)\to0$だが、$\int_1^tf=\log t$は発散する。
  target: |
    ∀ (f : ℝ → ℝ) (a : ℝ), ContinuousOn f (Set.Ici a) → ((∃ L : ℝ, Filter.Tendsto (fun t => ∫ x in a..t, f x) Filter.atTop (nhds L)) ↔ ∀ ε : ℝ, 0 < ε → ∃ T : ℝ, a ≤ T ∧ ∀ s t : ℝ, T ≤ s → T ≤ t → |∫ x in s..t, f x| < ε)
  proof: |
    by
      intro f a hf
      have hi : ∀ s t : ℝ, a ≤ s → a ≤ t → IntervalIntegrable f MeasureTheory.volume s t := fun s t hs ht =>
        (hf.mono fun x hx => (le_min hs ht).trans hx.1).intervalIntegrable
      have hsub : ∀ s t : ℝ, a ≤ s → a ≤ t → (∫ x in a..t, f x) - ∫ x in a..s, f x = ∫ x in s..t, f x := fun s t hs ht =>
        intervalIntegral.integral_interval_sub_left (hi a t le_rfl ht) (hi a s le_rfl hs)
      constructor
      · rintro ⟨L, hL⟩ ε hε
        obtain ⟨T, hT⟩ := Filter.eventually_atTop.1 (hL.eventually (Metric.ball_mem_nhds L (half_pos hε)))
        refine ⟨max T a, le_max_right _ _, fun s t hs ht => ?_⟩
        have hsa : a ≤ s := (le_max_right _ _).trans hs
        have hta : a ≤ t := (le_max_right _ _).trans ht
        rw [← hsub s t hsa hta, ← Real.dist_eq]
        have h1 := Metric.mem_ball.1 (hT s ((le_max_left _ _).trans hs))
        have h2 := Metric.mem_ball.1 (hT t ((le_max_left _ _).trans ht))
        exact (dist_triangle_right _ _ L).trans_lt (by linarith)
      · intro h
        have hc : Cauchy (Filter.map (fun t => ∫ x in a..t, f x) Filter.atTop) := by
          refine Metric.cauchy_iff.2 ⟨inferInstance, fun ε hε => ?_⟩
          obtain ⟨T, hTa, hT⟩ := h ε hε
          refine ⟨(fun t => ∫ x in a..t, f x) '' Set.Ici T, Filter.image_mem_map (Filter.Ici_mem_atTop T), ?_⟩
          rintro _ ⟨s, hs, rfl⟩ _ ⟨t, ht, rfl⟩
          rw [Real.dist_eq, hsub t s (hTa.trans ht) (hTa.trans hs)]
          exact hT t s ht hs
        exact cauchy_map_iff_exists_tendsto.1 hc
- id: improper_absolute_implies_convergent
  kind: gap
  level: 1
  topic: 広義積分・絶対収束すれば収束
  statement: $f$が$[a,\infty)$で連続で$\lim_{t\to\infty}\int_a^t|f|$が存在するならば、$\lim_{t\to\infty}\int_a^tf$も存在する。
  statement_en: If f is continuous on [a, ∞) and the limit of ∫_a^t |f| as t → ∞ exists, then the limit of ∫_a^t f also exists.
  assumptions:
  - $f$は$[a,\infty)$で連続
  - $\lim_{t\to\infty}\int_a^t|f|$は存在する
  quantifiers:
  - 任意の$f$と$a$
  conclusion: $\lim_{t\to\infty}\int_a^tf$は存在する。
  answer: |
    $f$を$[a,\infty)$で連続とし、$G(t)=\int_a^t|f|$が$t\to\infty$で収束するとする。$F(t)=\int_a^tf$とおく。

    $\varepsilon>0$をとる。$G$の収束から$T\geq a$があり、$s,t\geq T$なら$|G(t)-G(s)|<\varepsilon$である。$s\leq t$のとき$|F(t)-F(s)|=\left|\int_s^tf\right|\leq\int_s^t|f|=G(t)-G(s)<\varepsilon$である。$s>t$でも同じである。$\varepsilon>0$は任意なので、数列$(F(a+n))$はコーシー列で、ある$L$に収束する。

    $\varepsilon>0$と上の$T$に対し、$a+n\geq T$かつ$|F(a+n)-L|<\varepsilon$となる$n$をとる。$t\geq T$なら$|F(t)-L|\leq|F(t)-F(a+n)|+|F(a+n)-L|<2\varepsilon$である。よって$F(t)\to L$を得る。
  strategy: Control increments of the primitive of f by increments of the primitive of |f|.
  sketch:
  - "setup: Put F and G for the primitives of f and |f| from a."
  - "derive: |F(t) - F(s)| ≤ |G(t) - G(s)| for s, t ≥ a."
  - "derive: Convergence of G makes F(a+n) a Cauchy sequence with some limit L."
  - "conclude: The same bound gives F(t) → L."
  openmath: (forall (f a) (-> (and (fn_continuous_on (lambda (x) (fn_value f x)) (closed_half_line_right a)) (exists (L) (fn_limit_at_top (lambda (t) (interval_integral a t (lambda (x) (abs (fn_value f x))))) L))) (exists (L) (fn_limit_at_top (lambda (t) (interval_integral a t (lambda (x) (fn_value f x)))) L))))
  hard_negative:
    statement: $\lim_{t\to\infty}\int_a^tf$が存在すれば、$\lim_{t\to\infty}\int_a^t|f|$も存在する。
    reason: $f(x)=\sin x/x$（$x\geq1$）では前者は存在する（部分積分で$\int_1^t\cos x/x^2\,dx$に帰着する）が、後者は$\sum_n\int_{n\pi}^{(n+1)\pi}|\sin x|/x\,dx\geq\sum_n\frac{2}{(n+1)\pi}$より発散する。
  target: |
    ∀ (f : ℝ → ℝ) (a : ℝ), ContinuousOn f (Set.Ici a) → (∃ L : ℝ, Filter.Tendsto (fun t => ∫ x in a..t, |f x|) Filter.atTop (nhds L)) → ∃ L : ℝ, Filter.Tendsto (fun t => ∫ x in a..t, f x) Filter.atTop (nhds L)
  proof: |
    by
      rintro f a hf ⟨L, hL⟩
      have hfi : ∀ t : ℝ, MeasureTheory.IntegrableOn f (Set.Ioc a t) := fun t =>
        ((hf.mono Set.Icc_subset_Ici_self).integrableOn_compact isCompact_Icc).mono_set Set.Ioc_subset_Icc_self
      have hI : MeasureTheory.IntegrableOn f (Set.Ioi a) :=
        MeasureTheory.integrableOn_Ioi_of_intervalIntegral_norm_tendsto L a hfi Filter.tendsto_id
          (by simpa only [Real.norm_eq_abs, id] using hL)
      exact ⟨_, MeasureTheory.intervalIntegral_tendsto_integral_Ioi a hI Filter.tendsto_id⟩
