    by
      intro x hx
      have key : ∀ m : ℕ, 2 * Real.sin (x / 2) * ∑ k ∈ Finset.range m, Real.sin (((k : ℝ) + 1) * x) = Real.cos (x / 2) - Real.cos (((m : ℝ) + 1 / 2) * x) := by
        intro m
        induction m with
        | zero =>
          simp only [Finset.range_zero, Finset.sum_empty, mul_zero, Nat.cast_zero]
          rw [show ((0 : ℝ) + 1 / 2) * x = x / 2 by ring]
          ring
        | succ m ih =>
          rw [Finset.sum_range_succ, mul_add, ih]
          push_cast
          have h := Real.cos_sub_cos (((m : ℝ) + 1 / 2) * x) (((m : ℝ) + 1 + 1 / 2) * x)
          have e1 : (((m : ℝ) + 1 / 2) * x + ((m : ℝ) + 1 + 1 / 2) * x) / 2 = ((m : ℝ) + 1) * x := by ring
          have e2 : (((m : ℝ) + 1 / 2) * x - ((m : ℝ) + 1 + 1 / 2) * x) / 2 = -(x / 2) := by ring
          rw [e1, e2, Real.sin_neg] at h
          linarith
      have hs : 0 < |Real.sin (x / 2)| := abs_pos.2 hx
      have hb : ∀ n : ℕ, ‖∑ k ∈ Finset.range n, Real.sin (((k : ℝ) + 1) * x)‖ ≤ 1 / |Real.sin (x / 2)| := by
        intro n
        have h1 : |2 * Real.sin (x / 2) * ∑ k ∈ Finset.range n, Real.sin (((k : ℝ) + 1) * x)| ≤ 2 := by
          rw [key]
          exact abs_le.2 ⟨by linarith [Real.neg_one_le_cos (x / 2), Real.cos_le_one (((n : ℝ) + 1 / 2) * x)], by linarith [Real.cos_le_one (x / 2), Real.neg_one_le_cos (((n : ℝ) + 1 / 2) * x)]⟩
        rw [abs_mul, abs_mul, abs_of_pos (by norm_num : (0 : ℝ) < 2)] at h1
        rw [Real.norm_eq_abs, le_div_iff₀ hs]
        linarith
      have hanti : Antitone (fun n : ℕ => 1 / ((n : ℝ) + 1)) := fun m n h =>
        one_div_le_one_div_of_le (by positivity) (by
          have h1 : (m : ℝ) ≤ n := by exact_mod_cast h
          linarith)
      obtain ⟨s, hsum⟩ := cauchySeq_tendsto_of_complete
        (hanti.cauchySeq_series_mul_of_tendsto_zero_of_bounded tendsto_one_div_add_atTop_nhds_zero_nat hb)
      refine ⟨s, hsum.congr fun m => Finset.sum_congr rfl fun n _ => ?_⟩
      simp only [smul_eq_mul]
      ring
- id: uniform_continuous_of_distinct_limits_at_infinity
  kind: textbook
  level: 2
  topic: 一様連続性・無限遠で極限をもつ連続関数の一般形
  statement: 連続関数$f:\mathbb{R}\to\mathbb{R}$が$x\to+\infty$で$L$に、$x\to-\infty$で$M$に収束するならば、$f$は$\mathbb{R}$上で一様連続である。$L$と$M$は異なっていてもよく、両者が等しい場合を含む一般形である。
  statement_en: General form allowing different limits. A continuous function on the reals that tends to L at plus infinity and to M at minus infinity, where L and M may differ, is uniformly continuous.
  assumptions:
  - $f:\mathbb{R}\to\mathbb{R}$は連続
  - $x\to+\infty$で$f(x)\to L$
  - $x\to-\infty$で$f(x)\to M$
  quantifiers:
  - 任意の$f$、$L$、$M$
  conclusion: $f$は$\mathbb{R}$上で一様連続である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$を連続関数とし、$x\to+\infty$で$f(x)\to L$、$x\to-\infty$で$f(x)\to M$とする。$\varepsilon>0$をとる。

    実数$A,B$があり、$x\geq B$なら$|f(x)-L|<\varepsilon/2$、$x\leq A$なら$|f(x)-M|<\varepsilon/2$である。有界閉区間上の連続関数は一様連続なので、$\delta_0>0$があり、$x,y\in[A-1,B+1]$、$|x-y|<\delta_0$なら$|f(x)-f(y)|<\varepsilon$である。$\delta=\min\{\delta_0,1\}$とおく。

    $|x-y|<\delta$とする。$x,y\geq B$なら$|f(x)-f(y)|\leq|f(x)-L|+|L-f(y)|<\varepsilon$である。$x,y\leq A$なら、$M$を経由して同様である。

    どちらでもないとき、$x,y\in[A-1,B+1]$を示す。$x>B+1$なら$|x-y|<1$より$y>B$となり、$x,y\geq B$の場合に入る。$x<A-1$なら$y<A$となり、$x,y\leq A$の場合に入る。$y$についても同じである。したがって$x,y\in[A-1,B+1]$で、$|f(x)-f(y)|<\varepsilon$である。
  strategy: Far on either side both values are near the corresponding limit; on the compact middle use uniform continuity.
  sketch:
  - "setup: Choose A and B with f within ε/2 of M left of A and within ε/2 of L right of B."
  - "apply_theorem: f is uniformly continuous on [A-1, B+1], which gives δ₀."
  - "construct: Put δ = min(δ₀, 1)."
  - "case_split: If x, y ≥ B compare through L; if x, y ≤ A compare through M."
  - "derive: Otherwise |x - y| < 1 forces both points into [A-1, B+1]."
  - "conclude: In every case |f(x) - f(y)| < ε."
  openmath: (forall (f L M) (-> (and (fn_continuous (lambda (x) (fn_value f x))) (fn_limit_at_top (lambda (x) (fn_value f x)) L) (fn_limit_at_bot (lambda (x) (fn_value f x)) M)) (uniform_continuous f)))
  hard_negative:
    statement: 連続関数$f:\mathbb{R}\to\mathbb{R}$が$x\to+\infty$で収束するならば、$f$は$\mathbb{R}$上で一様連続である。
    reason: $x\leq0$で$f(x)=x^2$、$x\geq0$で$f(x)=0$とすると、$+\infty$で収束するが、$x\to-\infty$の側で一様連続でない。両側の仮定が必要である。
  target: |
    ∀ (f : ℝ → ℝ) (L M : ℝ), Continuous f → Filter.Tendsto f Filter.atTop (nhds L) → Filter.Tendsto f Filter.atBot (nhds M) → UniformContinuous f
  proof: |
    by
      intro f L M hf h1 h2
      rw [Metric.uniformContinuous_iff]
      intro ε hε
      obtain ⟨B, hB⟩ := Filter.eventually_atTop.1 (h1.eventually (Metric.ball_mem_nhds L (half_pos hε)))
      obtain ⟨A, hA⟩ := Filter.eventually_atBot.1 (h2.eventually (Metric.ball_mem_nhds M (half_pos hε)))
      have huc := (isCompact_Icc (a := A - 1) (b := B + 1)).uniformContinuousOn_of_continuous hf.continuousOn
      rw [Metric.uniformContinuousOn_iff] at huc
      obtain ⟨δ0, hδ0, h0⟩ := huc ε hε
      refine ⟨min δ0 1, lt_min hδ0 one_pos, fun x y hxy => ?_⟩
      have h3 : dist x y < δ0 := hxy.trans_le (min_le_left _ _)
      have h4 : |x - y| < 1 := by
        have h := hxy.trans_le (min_le_right _ _)
        rwa [Real.dist_eq] at h
      obtain ⟨h5, h6⟩ := abs_lt.1 h4
      by_cases hbig : B ≤ x ∧ B ≤ y
      · have hx := Metric.mem_ball.1 (hB x hbig.1)
        have hy := Metric.mem_ball.1 (hB y hbig.2)
        exact (dist_triangle_right _ _ L).trans_lt (by linarith)
      · by_cases hsmall : x ≤ A ∧ y ≤ A
        · have hx := Metric.mem_ball.1 (hA x hsmall.1)
          have hy := Metric.mem_ball.1 (hA y hsmall.2)
          exact (dist_triangle_right _ _ M).trans_lt (by linarith)
        · have hx1 : A - 1 ≤ x := by
            by_contra h
            push_neg at h
            exact hsmall ⟨by linarith, by linarith⟩
          have hx2 : x ≤ B + 1 := by
            by_contra h
            push_neg at h
            exact hbig ⟨by linarith, by linarith⟩
          have hy1 : A - 1 ≤ y := by
            by_contra h
            push_neg at h
            exact hsmall ⟨by linarith, by linarith⟩
          have hy2 : y ≤ B + 1 := by
            by_contra h
            push_neg at h
            exact hbig ⟨by linarith, by linarith⟩
          exact h0 x ⟨hx1, hx2⟩ y ⟨hy1, hy2⟩ h3
- id: eps_delta_continuous_comp
  kind: gap
  level: 1
  topic: 連続性・合成のε-δ論法
  statement: $f$が$a$で、$g$が$f(a)$で、それぞれ$\varepsilon$-$\delta$の意味で連続ならば、$g\circ f$は$a$で$\varepsilon$-$\delta$の意味で連続である。
  statement_en: If f is continuous at a and g is continuous at f(a) in the ε-δ sense, then g ∘ f is continuous at a in the ε-δ sense.
  assumptions:
  - $f$は$a$で$\varepsilon$-$\delta$の意味で連続
  - $g$は$f(a)$で$\varepsilon$-$\delta$の意味で連続
  quantifiers:
  - 任意の$f$、$g$、$a$
  conclusion: 任意の$\varepsilon>0$に対し$\delta>0$があり、$|x-a|<\delta$なら$|g(f(x))-g(f(a))|<\varepsilon$である。
  answer: |
    $f,g:\mathbb{R}\to\mathbb{R}$とし、$f$は$a$で、$g$は$f(a)$で$\varepsilon$-$\delta$の意味で連続とする。$\varepsilon>0$をとる。

    $g$の連続性から$\eta>0$があり、$|y-f(a)|<\eta$なら$|g(y)-g(f(a))|<\varepsilon$である。この$\eta$に$f$の連続性を使うと$\delta>0$があり、$|x-a|<\delta$なら$|f(x)-f(a)|<\eta$である。よって$|x-a|<\delta$なら$|g(f(x))-g(f(a))|<\varepsilon$である。
  strategy: Choose η from g first, then δ from f for that η.
  sketch:
  - "apply_theorem: Continuity of g at f(a) gives η for ε."
  - "apply_theorem: Continuity of f at a gives δ for η."
  - "conclude: |x - a| < δ implies |g(f(x)) - g(f(a))| < ε."
  openmath: (forall (f g a) (-> (and (forall (e) (-> (> e 0) (exists (d) (and (> d 0) (forall (x) (-> (< (abs (- x a)) d) (< (abs (- (fn_value f x) (fn_value f a))) e))))))) (forall (e) (-> (> e 0) (exists (d) (and (> d 0) (forall (y) (-> (< (abs (- y (fn_value f a))) d) (< (abs (- (fn_value g y) (fn_value g (fn_value f a)))) e)))))))) (forall (e) (-> (> e 0) (exists (d) (and (> d 0) (forall (x) (-> (< (abs (- x a)) d) (< (abs (- (fn_value g (fn_value f x)) (fn_value g (fn_value f a)))) e)))))))))
  hard_negative:
    statement: $f$と$g$がともに$a$で連続ならば、$g\circ f$は$a$で連続である。
    reason: $f(x)=x+1$、$a=0$とし、$g$を$x<1$で$0$、$x\geq1$で$1$とすると、$g$は$0$で連続だが、$g\circ f$は$0$で不連続である。$g$の連続性は$f(a)$で必要である。
  target: |
    ∀ (f g : ℝ → ℝ) (a : ℝ), (∀ ε : ℝ, 0 < ε → ∃ δ : ℝ, 0 < δ ∧ ∀ x : ℝ, |x - a| < δ → |f x - f a| < ε) → (∀ ε : ℝ, 0 < ε → ∃ δ : ℝ, 0 < δ ∧ ∀ y : ℝ, |y - f a| < δ → |g y - g (f a)| < ε) → ∀ ε : ℝ, 0 < ε → ∃ δ : ℝ, 0 < δ ∧ ∀ x : ℝ, |x - a| < δ → |g (f x) - g (f a)| < ε
  proof: |
    by
      intro f g a hf hg ε hε
      obtain ⟨η, hη, h1⟩ := hg ε hε
      obtain ⟨δ, hδ, h2⟩ := hf η hη
      exact ⟨δ, hδ, fun x hx => h1 _ (h2 x hx)⟩
- id: continuous_locally_bounded
  kind: gap
  level: 1
  topic: 連続性・近傍での有界性
  statement: $f$が$a$で$\varepsilon$-$\delta$の意味で連続ならば、$\delta>0$と$K$があり、$|x-a|<\delta$なら$|f(x)|\leq K$である。
  statement_en: If f is continuous at a in the ε-δ sense, then there are δ > 0 and K with |f(x)| ≤ K whenever |x - a| < δ.
  assumptions:
  - $f$は$a$で$\varepsilon$-$\delta$の意味で連続
  quantifiers:
  - 任意の$f$と$a$
  conclusion: $\delta>0$と$K$があり、$|x-a|<\delta$なら$|f(x)|\leq K$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$が$a$で$\varepsilon$-$\delta$の意味で連続とする。$\varepsilon=1$に対応する$\delta>0$をとる。

    $|x-a|<\delta$なら$|f(x)-f(a)|<1$なので、三角不等式から$|f(x)|\leq|f(x)-f(a)|+|f(a)|<|f(a)|+1$である。$K=|f(a)|+1$とおけばよい。
  strategy: Apply continuity with ε = 1 and the triangle inequality.
  sketch:
  - "setup: Take δ for ε = 1."
  - "derive: For |x - a| < δ, |f(x)| ≤ |f(x) - f(a)| + |f(a)| < |f(a)| + 1."
  - "conclude: K = |f(a)| + 1 works."
  openmath: (forall (f a) (-> (forall (e) (-> (> e 0) (exists (d) (and (> d 0) (forall (x) (-> (< (abs (- x a)) d) (< (abs (- (fn_value f x) (fn_value f a))) e))))))) (exists (d K) (and (> d 0) (forall (x) (-> (< (abs (- x a)) d) (<= (abs (fn_value f x)) K)))))))
  hard_negative:
    statement: $f$が全ての点で連続ならば、ある$K$があり全ての$x\in\mathbb{R}$で$|f(x)|\leq K$である。
    reason: $f(x)=x$は連続だが有界でない。各点の近傍での有界性は、全体の有界性を与えない。
  target: |
    ∀ (f : ℝ → ℝ) (a : ℝ), (∀ ε : ℝ, 0 < ε → ∃ δ : ℝ, 0 < δ ∧ ∀ x : ℝ, |x - a| < δ → |f x - f a| < ε) → ∃ δ K : ℝ, 0 < δ ∧ ∀ x : ℝ, |x - a| < δ → |f x| ≤ K
  proof: |
    by
      intro f a h
      obtain ⟨δ, hδ, h1⟩ := h 1 one_pos
      refine ⟨δ, |f a| + 1, hδ, fun x hx => ?_⟩
      have h2 := h1 x hx
      have h3 := abs_sub_abs_le_abs_sub (f x) (f a)
      linarith
- id: continuous_gt_near
  kind: gap
  level: 1
  topic: 連続性・不等式の近傍への伝播の一般形
  statement: $f$が$a$で連続で$c<f(a)$ならば、$\delta>0$があり、$|x-a|<\delta$なら$c<f(x)$である。$f(a)>0$、$c=f(a)/2$とする形はこの特別な場合である。
  statement_en: General form of the sign-preservation lemma. If f is continuous at a and c < f(a), then there is δ > 0 with c < f(x) whenever |x - a| < δ.
  assumptions:
  - $f$は$a$で連続
  - $c<f(a)$
  quantifiers:
  - 任意の$f$、$a$、$c$
  conclusion: $\delta>0$があり、$|x-a|<\delta$なら$c<f(x)$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$が$a$で連続で$c<f(a)$とする。

    $\varepsilon=f(a)-c>0$に対応する$\delta>0$をとる。$|x-a|<\delta$なら$|f(x)-f(a)|<f(a)-c$なので、$f(x)-f(a)>-(f(a)-c)$であり、$f(x)>c$を得る。
  strategy: Apply continuity with ε = f(a) - c.
  sketch:
  - "setup: Put ε = f(a) - c > 0 and take the corresponding δ."
  - "conclude: For |x - a| < δ, f(x) > f(a) - ε = c."
  openmath: (forall (f a c) (-> (and (fn_continuous_at (lambda (x) (fn_value f x)) a) (< c (fn_value f a))) (exists (d) (and (> d 0) (forall (x) (-> (< (abs (- x a)) d) (< c (fn_value f x))))))))
  hard_negative:
    statement: $f$が$a$で連続で$c\leq f(a)$ならば、$a$の近傍で$c\leq f(x)$である。
    reason: $f(x)=x$、$a=0$、$c=0$では$c\leq f(a)$だが、$x<0$で$f(x)<c$である。等号の場合は近傍に伝わらない。
  target: |
    ∀ (f : ℝ → ℝ) (a c : ℝ), ContinuousAt f a → c < f a → ∃ δ : ℝ, 0 < δ ∧ ∀ x : ℝ, |x - a| < δ → c < f x
  proof: |
    by
      intro f a c hf hc
      obtain ⟨δ, hδ, h⟩ := Metric.continuousAt_iff.1 hf (f a - c) (by linarith)
      refine ⟨δ, hδ, fun x hx => ?_⟩
      have h1 := h (show dist x a < δ by rwa [Real.dist_eq])
      rw [Real.dist_eq] at h1
      have h2 := (abs_lt.1 h1).1
      linarith
- id: ivt_image_closed_interval
  kind: gap
  level: 1
  topic: 連続関数・閉区間の像
  statement: $a\leq b$で$f$が$[a,b]$上連続ならば、像$f([a,b])$はある閉区間$[m,M]$である。
  statement_en: If a ≤ b and f is continuous on [a, b], then the image f([a, b]) is a closed interval [m, M].
  assumptions:
  - $a\leq b$
  - $f$は$[a,b]$上連続
  quantifiers:
  - 任意の$f$、$a\leq b$
  conclusion: 実数$m,M$があり、$f([a,b])=[m,M]$である。
  answer: |
    $a\leq b$とし、$f$を$[a,b]$上の連続関数とする。

    最大値・最小値の定理から、$c,d\in[a,b]$があり$m=f(c)$が最小値、$M=f(d)$が最大値である。よって$f([a,b])\subset[m,M]$である。

    逆に$u\in[m,M]$とする。$c$と$d$の間の閉区間で$f$は連続であり、端点の値は$m$と$M$である。中間値の定理から、この区間の点$x$で$f(x)=u$となるものがある。よって$[m,M]\subset f([a,b])$である。
  strategy: Combine the extreme value theorem and the intermediate value theorem.
  sketch:
  - "apply_theorem: f attains a minimum m at c and a maximum M at d."
  - "derive: So the image lies in [m, M]."
  - "apply_theorem: The intermediate value theorem between c and d hits every value of [m, M]."
  - "conclude: The image equals [m, M]."
  openmath: (forall (f a b) (-> (and (<= a b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b))) (exists (m M) (forall (y) (<-> (exists (x) (and (in x (closed_interval a b)) (= (fn_value f x) y))) (in y (closed_interval m M)))))))
  hard_negative:
    statement: 連続関数による開区間の像は開区間である。
    reason: $f(x)=x^2$による$(-1,1)$の像は$[0,1)$であり、開区間でない。
  target: |
    ∀ (f : ℝ → ℝ) (a b : ℝ), a ≤ b → ContinuousOn f (Set.Icc a b) → ∃ m M : ℝ, f '' Set.Icc a b = Set.Icc m M
  proof: |
    by
      intro f a b hab hf
      exact ⟨_, _, ContinuousOn.image_Icc hab hf⟩
- id: strict_mono_continuous_inverse_continuous
  kind: textbook
  level: 1
  topic: 連続関数・狭義単調関数の逆関数の連続性
  statement: $a\leq b$で$f$が$[a,b]$上連続かつ狭義単調増加のとき、$[f(a),f(b)]$上の関数$g$が全ての$x\in[a,b]$で$g(f(x))=x$を満たすならば、$g$は$[f(a),f(b)]$上連続である。
  statement_en: If a ≤ b, f is continuous and strictly increasing on [a, b], and g satisfies g(f(x)) = x for all x in [a, b], then g is continuous on [f(a), f(b)].
  assumptions:
  - $a\leq b$
  - $f$は$[a,b]$上連続かつ狭義単調増加
  - 全ての$x\in[a,b]$で$g(f(x))=x$
  quantifiers:
  - 任意の$f$、$g$、$a\leq b$
  conclusion: $g$は$[f(a),f(b)]$上連続である。
  answer: |
    $a\leq b$とし、$f$を$[a,b]$上で連続かつ狭義単調増加、$g$を全ての$x\in[a,b]$で$g(f(x))=x$を満たす関数とする。

    単調性から$f([a,b])\subset[f(a),f(b)]$であり、中間値の定理から逆の包含も成り立つ。よって$f$は$[a,b]$から$[f(a),f(b)]$への全単射で、$g$はその上で逆関数である。特に$g$は$[f(a),f(b)]$上で狭義単調増加である。

    $y_0\in[f(a),f(b)]$、$x_0=g(y_0)$とし、$\varepsilon>0$をとる。$x_1=\max\{a,x_0-\varepsilon\}$、$x_2=\min\{b,x_0+\varepsilon\}$とおく。$x_1\leq x_0\leq x_2$なので$f(x_1)\leq y_0\leq f(x_2)$であり、等号は$x_1=x_0$または$x_2=x_0$のときに限る。$y_0$の$[f(a),f(b)]$内の近傍で$f(x_1)\leq y\leq f(x_2)$となる（$x_1=x_0$なら$x_0=a$で$y_0=f(a)$が左端点であり、$x_2=x_0$の場合も同様である）。この近傍の$y$は$g$の単調性から$x_1\leq g(y)\leq x_2$を満たすので、$|g(y)-x_0|\leq\varepsilon$である。
  strategy: The inverse is monotone and has an interval as image, so ε-neighbourhoods pull back to neighbourhoods through f.
  sketch:
  - "derive: Monotonicity and the intermediate value theorem show that f maps [a, b] onto [f(a), f(b)]."
  - "derive: g is the inverse on this interval and is strictly increasing."
  - "construct: Around x_0 = g(y_0) take endpoints x_1, x_2 within ε of x_0 inside [a, b]."
  - "derive: Near y_0 in the interval, f(x_1) ≤ y ≤ f(x_2)."
  - "conclude: Monotonicity of g gives |g(y) - x_0| ≤ ε."
  openmath: (forall (f g a b) (-> (and (<= a b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (forall (x y) (-> (and (in x (closed_interval a b)) (in y (closed_interval a b)) (< x y)) (< (fn_value f x) (fn_value f y)))) (forall (x) (-> (in x (closed_interval a b)) (= (fn_value g (fn_value f x)) x)))) (fn_continuous_on (lambda (y) (fn_value g y)) (closed_interval (fn_value f a) (fn_value f b)))))
  hard_negative:
    statement: 区間の和集合上の連続な単射の逆写像は連続である。
    reason: $[0,1)\cup[2,3]$上で$x<1$なら$f(x)=x$、$x\geq2$なら$f(x)=x-1$とすると、$f$は$[0,2]$への連続な全単射だが、逆写像は$1$で不連続である。定義域が区間であることが必要である。
  target: |
    ∀ (f g : ℝ → ℝ) (a b : ℝ), a ≤ b → ContinuousOn f (Set.Icc a b) → StrictMonoOn f (Set.Icc a b) → (∀ x ∈ Set.Icc a b, g (f x) = x) → ContinuousOn g (Set.Icc (f a) (f b))
  proof: |
    by
      intro f g a b hab hc hm hg
      have himg : f '' Set.Icc a b = Set.Icc (f a) (f b) := by
        apply Set.Subset.antisymm
        · rintro _ ⟨x, hx, rfl⟩
          exact ⟨hm.monotoneOn (Set.left_mem_Icc.2 hab) hx hx.1, hm.monotoneOn hx (Set.right_mem_Icc.2 hab) hx.2⟩
        · exact intermediate_value_Icc hab hc
      rw [continuousOn_iff_isClosed]
      intro t ht
      refine ⟨f '' (t ∩ Set.Icc a b), ((isCompact_Icc.inter_left ht).image_of_continuousOn (hc.mono Set.inter_subset_right)).isClosed, ?_⟩
      ext y
      constructor
      · rintro ⟨hy1, hy2⟩
        have hy3 := hy2
        rw [← himg] at hy3
        obtain ⟨x, hx, rfl⟩ := hy3
        have hy4 : g (f x) ∈ t := hy1
        rw [hg x hx] at hy4
        exact ⟨⟨x, ⟨hy4, hx⟩, rfl⟩, hy2⟩
      · rintro ⟨⟨x, ⟨hxt, hx⟩, rfl⟩, hy2⟩
        refine ⟨?_, hy2⟩
        show g (f x) ∈ t
        rw [hg x hx]
        exact hxt
- id: monotone_countable_discontinuities
  kind: textbook
  level: 2
  topic: 単調関数・不連続点の個数
  statement: 単調非減少な関数$f:\mathbb{R}\to\mathbb{R}$の不連続点の集合は高々可算である。
  statement_en: The set of points of discontinuity of a nondecreasing function on the reals is countable.
  assumptions:
  - $f:\mathbb{R}\to\mathbb{R}$は単調非減少
  quantifiers:
  - 任意の$f$
  conclusion: $\{x\mid f\text{は}x\text{で不連続}\}$は高々可算である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$を単調非減少とする。各点$x$で、単調性と上限の性質から左極限$f(x-)=\sup_{t<x}f(t)$と右極限$f(x+)=\inf_{t>x}f(t)$が存在し、$f(x-)\leq f(x)\leq f(x+)$である。$f$が$x$で不連続であることは$f(x-)<f(x+)$と同値である。

    不連続点$x$ごとに、有理数$q(x)$を$f(x-)<q(x)<f(x+)$となるように選ぶ。$x<y$なら、$x<t<y$をとると$f(x+)\leq f(t)\leq f(y-)$なので、区間$(f(x-),f(x+))$と$(f(y-),f(y+))$は交わらない。よって$q$は単射である。不連続点の集合は可算集合$\mathbb{Q}$へ単射で移るので、高々可算である。
  strategy: Assign a rational number to each jump interval; distinct jumps have disjoint intervals.
  sketch:
  - "derive: One-sided limits exist at each point and f is discontinuous at x exactly when f(x-) < f(x+)."
  - "construct: Choose a rational q(x) in each jump interval."
  - "derive: For x < y, f(x+) ≤ f(y-), so jump intervals are disjoint and q is injective."
  - "conclude: The discontinuity set injects into the rationals."
  openmath: (forall (f) (-> (fn_monotone (lambda (x) (fn_value f x))) (countable_set (discontinuity_set f))))
  hard_negative:
    statement: 任意の関数$f:\mathbb{R}\to\mathbb{R}$の不連続点の集合は高々可算である。
    reason: 有理数で$1$、無理数で$0$をとる関数は全ての点で不連続であり、$\mathbb{R}$は可算でない。
  target: |
    ∀ f : ℝ → ℝ, Monotone f → {x : ℝ | ¬ ContinuousAt f x}.Countable
  proof: |
    by
      intro f hf
      exact hf.countable_not_continuousAt
- id: uniform_continuous_on_adjacent_intervals
  kind: gap
  level: 1
  topic: 一様連続性・隣接する閉区間の貼り合わせ
  statement: $a\leq b\leq c$で$f$が$[a,b]$と$[b,c]$の両方で一様連続ならば、$f$は$[a,c]$で一様連続である。
  statement_en: If a ≤ b ≤ c and f is uniformly continuous on both [a, b] and [b, c], then f is uniformly continuous on [a, c].
  assumptions:
  - $a\leq b\leq c$
  - $f$は$[a,b]$と$[b,c]$で一様連続
  quantifiers:
  - 任意の$f$、$a\leq b\leq c$
  conclusion: $f$は$[a,c]$で一様連続である。
  answer: |
    $a\leq b\leq c$とし、$f$が$[a,b]$と$[b,c]$で一様連続とする。$\varepsilon>0$をとる。

    $\delta_1>0$があり、$x,y\in[a,b]$、$|x-y|<\delta_1$なら$|f(x)-f(y)|<\varepsilon/2$である。$\delta_2>0$があり、$x,y\in[b,c]$、$|x-y|<\delta_2$なら$|f(x)-f(y)|<\varepsilon/2$である。$\delta=\min\{\delta_1,\delta_2\}$とおく。

    $x,y\in[a,c]$、$|x-y|<\delta$とする。$x,y$が同じ区間に属するなら$|f(x)-f(y)|<\varepsilon/2$である。そうでないとき、たとえば$x\leq b\leq y$なら$|x-b|\leq|x-y|<\delta_1$、$|b-y|\leq|x-y|<\delta_2$なので、$|f(x)-f(y)|\leq|f(x)-f(b)|+|f(b)-f(y)|<\varepsilon$である。
  strategy: Use ε/2 on each piece and pass through b when the points lie on different sides.
  sketch:
  - "setup: Take δ_1 and δ_2 for ε/2 on the two intervals and put δ as their minimum."
  - "case_split: If x and y lie in the same interval, the bound is immediate."
  - "case_split: If x ≤ b ≤ y, both |x - b| and |b - y| are at most |x - y|."
  - "conclude: The triangle inequality through f(b) gives |f(x) - f(y)| < ε."
  openmath: (forall (f a b c) (-> (and (<= a b) (<= b c) (uniform_continuous_on f (closed_interval a b)) (uniform_continuous_on f (closed_interval b c))) (uniform_continuous_on f (closed_interval a c))))
  hard_negative:
    statement: $f$が開区間$(a,b)$と$(b,c)$の両方で一様連続ならば、$f$は$(a,b)\cup(b,c)$で一様連続である。
    reason: $(-1,0)\cup(0,1)$上で$x<0$なら$f(x)=-1$、$x>0$なら$f(x)=1$とすると、各区間では定数だが、$0$をはさむ近い2点で値が$2$離れる。
  target: |
    ∀ (f : ℝ → ℝ) (a b c : ℝ), a ≤ b → b ≤ c → UniformContinuousOn f (Set.Icc a b) → UniformContinuousOn f (Set.Icc b c) → UniformContinuousOn f (Set.Icc a c)
  proof: |
    by
      intro f a b c hab hbc h1 h2
      rw [Metric.uniformContinuousOn_iff] at h1 h2 ⊢
      intro ε hε
      obtain ⟨δ1, hδ1, g1⟩ := h1 (ε / 2) (half_pos hε)
      obtain ⟨δ2, hδ2, g2⟩ := h2 (ε / 2) (half_pos hε)
      refine ⟨min δ1 δ2, lt_min hδ1 hδ2, fun x hx y hy hxy => ?_⟩
      have d1 : dist x y < δ1 := hxy.trans_le (min_le_left _ _)
      have d2 : dist x y < δ2 := hxy.trans_le (min_le_right _ _)
      have hsplit : ∀ u v : ℝ, u ≤ b → b ≤ v → dist u v < δ1 → dist u v < δ2 → u ∈ Set.Icc a c → v ∈ Set.Icc a c → dist (f u) (f v) < ε := by
        intro u v hu hv du dv hu' hv'
        have e1 : dist u b ≤ dist u v := by
          rw [Real.dist_eq, Real.dist_eq, abs_sub_comm, abs_sub_comm u v, abs_of_nonneg (sub_nonneg.2 hu), abs_of_nonneg (sub_nonneg.2 (hu.trans hv))]
          linarith
        have e2 : dist b v ≤ dist u v := by
          rw [Real.dist_eq, Real.dist_eq, abs_sub_comm, abs_sub_comm u v, abs_of_nonneg (sub_nonneg.2 hv), abs_of_nonneg (sub_nonneg.2 (hu.trans hv))]
          linarith
        have f1 := g1 u ⟨hu'.1, hu⟩ b ⟨hab, le_rfl⟩ (e1.trans_lt du)
        have f2 := g2 b ⟨le_rfl, hbc⟩ v ⟨hv, hv'.2⟩ (e2.trans_lt dv)
        have f3 := dist_triangle (f u) (f b) (f v)
        linarith
      rcases le_total x b with hxb | hxb <;> rcases le_total y b with hyb | hyb
      · exact (g1 x ⟨hx.1, hxb⟩ y ⟨hy.1, hyb⟩ d1).trans (half_lt_self hε)
      · exact hsplit x y hxb hyb d1 d2 hx hy
      · rw [dist_comm] at d1 d2 ⊢
        exact hsplit y x hyb hxb d1 d2 hy hx
      · exact (g2 x ⟨hxb, hx.2⟩ y ⟨hyb, hy.2⟩ d2).trans (half_lt_self hε)
- id: uniform_continuous_bounded_mul
  kind: gap
  level: 1
  topic: 一様連続性・有界な関数の積
  statement: 有界な一様連続関数$f,g:\mathbb{R}\to\mathbb{R}$の積$fg$は一様連続である。
  statement_en: The product of two bounded uniformly continuous functions on the reals is uniformly continuous.
  assumptions:
  - $f,g$は一様連続
  - 全ての$x$で$|f(x)|\leq K$、$|g(x)|\leq K$
  quantifiers:
  - 任意の$f$、$g$、$K$
  conclusion: $fg$は一様連続である。
  answer: |
    $f,g:\mathbb{R}\to\mathbb{R}$を一様連続とし、全ての$x$で$|f(x)|\leq K$、$|g(x)|\leq K$とする。$K\geq0$である。$\varepsilon>0$をとり、$\eta=\varepsilon/(2(K+1))>0$とおく。

    $\delta>0$があり、$|x-y|<\delta$なら$|f(x)-f(y)|<\eta$かつ$|g(x)-g(y)|<\eta$である。このとき$|f(x)g(x)-f(y)g(y)|\leq|f(x)||g(x)-g(y)|+|f(x)-f(y)||g(y)|\leq2K\eta<\varepsilon$である。
  strategy: Split the difference of products into two terms and bound the factors by K.
  sketch:
  - "setup: Put η = ε/(2(K+1)) and take δ for η for both functions."
  - "derive: f(x)g(x) - f(y)g(y) = f(x)(g(x) - g(y)) + (f(x) - f(y))g(y)."
  - "conclude: The bound is at most 2Kη < ε."
  openmath: (forall (f g K) (-> (and (uniform_continuous f) (uniform_continuous g) (forall (x) (<= (abs (fn_value f x)) K)) (forall (x) (<= (abs (fn_value g x)) K))) (forall (e) (-> (> e 0) (exists (d) (and (> d 0) (forall (x y) (-> (< (abs (- x y)) d) (< (abs (- (* (fn_value f x) (fn_value g x)) (* (fn_value f y) (fn_value g y)))) e)))))))))
  hard_negative:
    statement: 一様連続関数$f,g:\mathbb{R}\to\mathbb{R}$の積は一様連続である。
    reason: $f(x)=g(x)=x$は一様連続だが、積$x^2$は一様連続でない。有界性が必要である。
  target: |
    ∀ (f g : ℝ → ℝ) (K : ℝ), UniformContinuous f → UniformContinuous g → (∀ x, |f x| ≤ K) → (∀ x, |g x| ≤ K) → UniformContinuous (fun x => f x * g x)
  proof: |
    by
      intro f g K hf hg hfK hgK
      have hK : 0 ≤ K := (abs_nonneg _).trans (hfK 0)
      rw [Metric.uniformContinuous_iff] at hf hg ⊢
      intro ε hε
      have hη : 0 < ε / (2 * (K + 1)) := by positivity
      have hη2 : 2 * (K + 1) * (ε / (2 * (K + 1))) = ε := by
        field_simp
      obtain ⟨δ1, hδ1, h1⟩ := hf _ hη
      obtain ⟨δ2, hδ2, h2⟩ := hg _ hη
      refine ⟨min δ1 δ2, lt_min hδ1 hδ2, fun x y hxy => ?_⟩
      have a1 := h1 (hxy.trans_le (min_le_left _ _))
      have a2 := h2 (hxy.trans_le (min_le_right _ _))
      rw [Real.dist_eq] at a1 a2
      rw [Real.dist_eq]
      have e : f x * g x - f y * g y = f x * (g x - g y) + (f x - f y) * g y := by ring
      rw [e]
      have b1 : |f x * (g x - g y)| ≤ K * (ε / (2 * (K + 1))) := by
        rw [abs_mul]
        exact mul_le_mul (hfK x) a2.le (abs_nonneg _) hK
      have b2 : |(f x - f y) * g y| ≤ (ε / (2 * (K + 1))) * K := by
        rw [abs_mul]
        exact mul_le_mul a1.le (hgK y) (abs_nonneg _) hη.le
      have b3 := abs_add_le (f x * (g x - g y)) ((f x - f y) * g y)
      nlinarith
- id: periodic_continuous_uniform
  kind: gap
  level: 2
  topic: 一様連続性・周期関数
  statement: $T>0$を周期とする連続関数$f:\mathbb{R}\to\mathbb{R}$は一様連続である。
  statement_en: A continuous function on the reals with period T > 0 is uniformly continuous.
  assumptions:
  - $T>0$
  - $f$は連続で、全ての$x$で$f(x+T)=f(x)$
  quantifiers:
  - 任意の$f$と$T>0$
  conclusion: $f$は一様連続である。
  answer: |
    $T>0$とし、$f:\mathbb{R}\to\mathbb{R}$を周期$T$の連続関数とする。$\varepsilon>0$をとる。

    有界閉区間上の連続関数は一様連続なので、$\delta_0>0$があり、$u,v\in[-T,2T]$、$|u-v|<\delta_0$なら$|f(u)-f(v)|<\varepsilon$である。$\delta=\min\{\delta_0,T\}$とおく。

    $|x-y|<\delta$とする。整数$n$を$nT\leq x<(n+1)T$となるようにとり、$u=x-nT$、$v=y-nT$とおく。$u\in[0,T)$であり、$|u-v|=|x-y|<T$より$v\in[-T,2T]$である。周期性から$f(u)=f(x)$、$f(v)=f(y)$なので、$|f(x)-f(y)|=|f(u)-f(v)|<\varepsilon$である。
  strategy: Translate the two points by a multiple of the period into a fixed compact interval.
  sketch:
  - "apply_theorem: f is uniformly continuous on [-T, 2T], which gives δ₀."
  - "construct: Put δ = min(δ₀, T) and choose n with nT ≤ x < (n+1)T."
  - "derive: The translates u = x - nT and v = y - nT lie in [-T, 2T] at the same distance."
  - "conclude: Periodicity gives |f(x) - f(y)| = |f(u) - f(v)| < ε."
  openmath: (forall (f T) (-> (and (> T 0) (fn_continuous (lambda (x) (fn_value f x))) (forall (x) (= (fn_value f (+ x T)) (fn_value f x)))) (uniform_continuous f)))
  hard_negative:
    statement: 周期的な関数$f:\mathbb{R}\to\mathbb{R}$は一様連続である。
    reason: 有理数で$1$、無理数で$0$をとる関数は周期$1$をもつが、どの点でも連続でない。連続性が必要である。
  target: |
    ∀ (f : ℝ → ℝ) (T : ℝ), 0 < T → Continuous f → (∀ x, f (x + T) = f x) → UniformContinuous f
  proof: |
    by
      intro f T hT hf hp
      rw [Metric.uniformContinuous_iff]
      intro ε hε
      have huc := (isCompact_Icc (a := -T) (b := 2 * T)).uniformContinuousOn_of_continuous hf.continuousOn
      rw [Metric.uniformContinuousOn_iff] at huc
      obtain ⟨δ0, hδ0, h0⟩ := huc ε hε
      refine ⟨min δ0 T, lt_min hδ0 hT, fun x y hxy => ?_⟩
      have h3 : dist x y < δ0 := hxy.trans_le (min_le_left _ _)
      have h4 : |x - y| < T := by
        have h := hxy.trans_le (min_le_right _ _)
        rwa [Real.dist_eq] at h
      obtain ⟨h5, h6⟩ := abs_lt.1 h4
      have hper : Function.Periodic f T := hp
      have h7 := (le_div_iff₀ hT).1 (Int.floor_le (x / T))
      have h8 := (div_lt_iff₀ hT).1 (Int.lt_floor_add_one (x / T))
      have h9 : (⌊x / T⌋ + 1 : ℝ) * T = ⌊x / T⌋ * T + T := by ring
      have hu : x - ⌊x / T⌋ * T ∈ Set.Icc (-T) (2 * T) := ⟨by linarith, by linarith⟩
      have hv : y - ⌊x / T⌋ * T ∈ Set.Icc (-T) (2 * T) := ⟨by linarith, by linarith⟩
      have hd : dist (x - ⌊x / T⌋ * T) (y - ⌊x / T⌋ * T) < δ0 := by
        rw [dist_sub_right]
        exact h3
      have h10 := h0 _ hu _ hv hd
      rwa [hper.sub_int_mul_eq, hper.sub_int_mul_eq] at h10
- id: continuous_additive_is_linear
  kind: textbook
  level: 1
  topic: 連続関数・コーシーの関数方程式
  statement: 連続関数$f:\mathbb{R}\to\mathbb{R}$が全ての$x,y$で$f(x+y)=f(x)+f(y)$を満たすならば、全ての$x$で$f(x)=f(1)x$である。
  statement_en: If a continuous function on the reals satisfies f(x+y) = f(x) + f(y) for all x and y, then f(x) = f(1) x for all x.
  assumptions:
  - $f$は連続
  - 全ての$x,y$で$f(x+y)=f(x)+f(y)$
  quantifiers:
  - 任意の$f$
  conclusion: 全ての$x$で$f(x)=f(1)x$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$を連続で加法的な関数とする。

    $f(0)=f(0+0)=2f(0)$より$f(0)=0$であり、$0=f(x+(-x))=f(x)+f(-x)$より$f(-x)=-f(x)$である。帰納法から自然数$n$で$f(nx)=nf(x)$となり、符号の式と合わせて整数$n$でも成り立つ。

    有理数$q=m/n$（$n\geq1$）について、$nf(q)=f(nq)=f(m)=mf(1)$なので$f(q)=f(1)q$である。

    実数$x$に対し、有理数の稠密性から$q_k\to x$となる有理数列をとる。$f$の連続性から$f(x)=\lim f(q_k)=\lim f(1)q_k=f(1)x$である。
  strategy: Prove the formula on rationals from additivity and extend by density and continuity.
  sketch:
  - "derive: Additivity gives f(0) = 0, f(-x) = -f(x) and f(nx) = n f(x) for integers n."
  - "derive: For rational q = m/n, n f(q) = m f(1), so f(q) = f(1) q."
  - "apply_theorem: Rationals are dense, so choose rational q_k → x."
  - "conclude: Continuity gives f(x) = f(1) x."
  openmath: (forall (f) (-> (and (fn_continuous (lambda (x) (fn_value f x))) (forall (x y) (= (fn_value f (+ x y)) (+ (fn_value f x) (fn_value f y))))) (forall (x) (= (fn_value f x) (* (fn_value f 1) x)))))
  hard_negative:
    statement: 加法的な関数$f:\mathbb{R}\to\mathbb{R}$は、連続性なしで$f(x)=f(1)x$を満たす。
    reason: $\mathbb{R}$の$\mathbb{Q}$上の基底で$1$と$\sqrt2$を含むものをとり、$f(1)=1$、$f(\sqrt2)=0$となる$\mathbb{Q}$線形写像を作ると、加法的だが$f(\sqrt2)\neq\sqrt2$である。
  target: |
    ∀ f : ℝ → ℝ, Continuous f → (∀ x y, f (x + y) = f x + f y) → ∀ x, f x = f 1 * x
  proof: |
    by
      intro f hc hadd x
      let φ : ℝ →+ ℝ := AddMonoidHom.mk' f hadd
      have h := map_real_smul φ (show Continuous φ from hc) x 1
      have h1 : φ x = f x := rfl
      have h2 : φ 1 = f 1 := rfl
      simp only [smul_eq_mul, mul_one] at h
      rw [h1, h2] at h
      rw [h]
      ring
- id: continuous_bounded_of_limits_at_infinity
  kind: gap
  level: 1
  topic: 連続関数・無限遠で極限をもつ関数の有界性
  statement: 連続関数$f:\mathbb{R}\to\mathbb{R}$が$x\to+\infty$と$x\to-\infty$でそれぞれ有限の極限をもつならば、$f$は有界である。
  statement_en: A continuous function on the reals with finite limits at plus and minus infinity is bounded.
  assumptions:
  - $f$は連続
  - $x\to+\infty$で$f(x)\to L$、$x\to-\infty$で$f(x)\to M$
  quantifiers:
  - 任意の$f$、$L$、$M$
  conclusion: $K$があり、全ての$x$で$|f(x)|\leq K$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$を連続関数とし、$x\to+\infty$で$f(x)\to L$、$x\to-\infty$で$f(x)\to M$とする。

    実数$A,B$があり、$x\geq B$なら$|f(x)-L|<1$、$x\leq A$なら$|f(x)-M|<1$である。よって$x\geq B$で$|f(x)|<|L|+1$、$x\leq A$で$|f(x)|<|M|+1$である。

    閉区間$[A,B]$上の連続関数は有界なので、$C$があり$x\in[A,B]$で$|f(x)|\leq C$である（$A>B$なら区間は空で、$C=0$でよい）。$K=\max\{C,|L|+1,|M|+1\}$とおくと全ての$x$で$|f(x)|\leq K$である。
  strategy: Bound f near each infinity by its limit plus 1 and use compactness on the rest.
  sketch:
  - "setup: Choose A and B beyond which f is within 1 of its limits."
  - "apply_theorem: f is bounded by some C on the closed interval [A, B]."
  - "conclude: K = max(C, |L|+1, |M|+1) bounds f everywhere."
  openmath: (forall (f L M) (-> (and (fn_continuous (lambda (x) (fn_value f x))) (fn_limit_at_top (lambda (x) (fn_value f x)) L) (fn_limit_at_bot (lambda (x) (fn_value f x)) M)) (exists (K) (forall (x) (<= (abs (fn_value f x)) K)))))
  hard_negative:
    statement: 連続関数$f:\mathbb{R}\to\mathbb{R}$が$x\to+\infty$で有限の極限をもつならば、$f$は有界である。
    reason: $f(x)=e^{-x}$は$+\infty$で$0$に収束するが、$x\to-\infty$で非有界である。
  target: |
    ∀ (f : ℝ → ℝ) (L M : ℝ), Continuous f → Filter.Tendsto f Filter.atTop (nhds L) → Filter.Tendsto f Filter.atBot (nhds M) → ∃ K : ℝ, ∀ x, |f x| ≤ K
  proof: |
    by
      intro f L M hf h1 h2
      obtain ⟨B, hB⟩ := Filter.eventually_atTop.1 (h1.eventually (Metric.ball_mem_nhds L one_pos))
      obtain ⟨A, hA⟩ := Filter.eventually_atBot.1 (h2.eventually (Metric.ball_mem_nhds M one_pos))
      obtain ⟨C, hC⟩ := (isCompact_Icc (a := A) (b := B)).exists_bound_of_continuousOn hf.continuousOn
      refine ⟨max C (max (|L| + 1) (|M| + 1)), fun x => ?_⟩
      by_cases hx1 : B ≤ x
      · have h3 := Metric.mem_ball.1 (hB x hx1)
        rw [Real.dist_eq] at h3
        have h4 := abs_sub_abs_le_abs_sub (f x) L
        exact le_trans (by linarith) ((le_max_left _ _).trans (le_max_right _ _))
      · by_cases hx2 : x ≤ A
        · have h3 := Metric.mem_ball.1 (hA x hx2)
          rw [Real.dist_eq] at h3
          have h4 := abs_sub_abs_le_abs_sub (f x) M
          exact le_trans (by linarith) ((le_max_right _ _).trans (le_max_right _ _))
        · push_neg at hx1 hx2
          exact (hC x ⟨hx2.le, hx1.le⟩).trans (le_max_left _ _)
- id: coercive_continuous_attains_min
  kind: gap
  level: 1
  topic: 連続関数・無限遠で発散する関数の最小値
  statement: 連続関数$f:\mathbb{R}\to\mathbb{R}$が$x\to+\infty$と$x\to-\infty$でともに$+\infty$に発散するならば、$f$は最小値をもつ。
  statement_en: A continuous function on the reals that diverges to plus infinity at both plus and minus infinity attains a minimum.
  assumptions:
  - $f$は連続
  - $x\to\pm\infty$で$f(x)\to+\infty$
  quantifiers:
  - 任意の$f$
  conclusion: $x_0$があり、全ての$x$で$f(x_0)\leq f(x)$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$を連続関数とし、$x\to\pm\infty$で$f(x)\to+\infty$とする。

    実数$A<0<B$があり、$x\geq B$または$x\leq A$なら$f(x)>f(0)$である。閉区間$[A,B]$で$f$は最小値をもつ。その最小値を与える点を$x_0$とする。$0\in[A,B]$より$f(x_0)\leq f(0)$である。

    $x\in[A,B]$なら$f(x_0)\leq f(x)$である。$x\notin[A,B]$なら$f(x)>f(0)\geq f(x_0)$である。よって$f(x_0)$は$\mathbb{R}$全体での最小値である。
  strategy: Outside a large interval f exceeds f(0), so the minimum on that interval is global.
  sketch:
  - "setup: Choose A < 0 < B with f(x) > f(0) outside [A, B]."
  - "apply_theorem: f attains a minimum on [A, B] at some x_0, and f(x_0) ≤ f(0)."
  - "conclude: Outside the interval f(x) > f(0) ≥ f(x_0), so x_0 is a global minimum."
  openmath: (forall (f) (-> (and (fn_continuous (lambda (x) (fn_value f x))) (fn_tends_to_infinity_at_top (lambda (x) (fn_value f x))) (fn_tends_to_infinity_at_bot (lambda (x) (fn_value f x)))) (exists (c) (forall (x) (<= (fn_value f c) (fn_value f x))))))
  hard_negative:
    statement: 連続関数$f:\mathbb{R}\to\mathbb{R}$が$x\to+\infty$で$+\infty$に発散するならば、$f$は最小値をもつ。
    reason: $f(x)=e^x$は$+\infty$に発散するが、下限$0$は達成されず最小値をもたない。
  target: |
    ∀ f : ℝ → ℝ, Continuous f → Filter.Tendsto f Filter.atTop Filter.atTop → Filter.Tendsto f Filter.atBot Filter.atTop → ∃ c : ℝ, ∀ x, f c ≤ f x
  proof: |
    by
      intro f hf h1 h2
      refine hf.exists_forall_le ?_
      rw [cocompact_eq_atBot_atTop]
      exact h2.sup h1
- id: uniform_continuous_linear_growth
  kind: gap
  level: 1
  topic: 一様連続性・高々一次の増大
  statement: 一様連続な関数$f:\mathbb{R}\to\mathbb{R}$には定数$A,B$があり、全ての$x$で$|f(x)|\leq A|x|+B$である。
  statement_en: For every uniformly continuous function on the reals there are constants A and B with |f(x)| ≤ A|x| + B for all x.
  assumptions:
  - $f$は$\mathbb{R}$上で一様連続
  quantifiers:
  - 任意の$f$
  conclusion: $A,B$があり、全ての$x$で$|f(x)|\leq A|x|+B$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$を一様連続とする。$\varepsilon=1$に対応する$\delta>0$をとる。

    全ての自然数$n$と、$|x|\leq n\delta/2$を満たす$x$について$|f(x)-f(0)|\leq n$であることを帰納法で示す。$n=0$なら$x=0$で成り立つ。$n$で成り立つとし、$|x|\leq(n+1)\delta/2$とする。$y=\frac{n}{n+1}x$とおくと$|y|\leq n\delta/2$、$|x-y|=|x|/(n+1)\leq\delta/2<\delta$である。よって$|f(x)-f(0)|\leq|f(x)-f(y)|+|f(y)-f(0)|\leq1+n$である。

    任意の$x$に対し、$n=\lceil2|x|/\delta\rceil$とおくと$|x|\leq n\delta/2$であり、$n<2|x|/\delta+1$である。したがって$|f(x)|\leq|f(0)|+n\leq\frac2\delta|x|+|f(0)|+1$であり、$A=2/\delta$、$B=|f(0)|+1$とおけばよい。
  strategy: Walk from 0 to x in steps shorter than δ; each step changes f by at most 1.
  sketch:
  - "setup: Take δ for ε = 1."
  - "induction: For |x| ≤ nδ/2, |f(x) - f(0)| ≤ n, using the intermediate point n x/(n+1)."
  - "construct: Take n as the ceiling of 2|x|/δ."
  - "conclude: |f(x)| ≤ (2/δ)|x| + |f(0)| + 1."
  openmath: (forall (f) (-> (uniform_continuous f) (exists (A B) (forall (x) (<= (abs (fn_value f x)) (+ (* A (abs x)) B))))))
  hard_negative:
    statement: 連続関数$f:\mathbb{R}\to\mathbb{R}$には定数$A,B$があり、全ての$x$で$|f(x)|\leq A|x|+B$である。
    reason: $f(x)=x^2$は連続だが、どの$A,B$についても$|x|$が大きいと$x^2>A|x|+B$となる。
  target: |
    ∀ f : ℝ → ℝ, UniformContinuous f → ∃ A B : ℝ, ∀ x, |f x| ≤ A * |x| + B
  proof: |
    by
      intro f hf
      obtain ⟨δ, hδ, h⟩ := Metric.uniformContinuous_iff.1 hf 1 one_pos
      have key : ∀ (n : ℕ) (x : ℝ), |x| ≤ n * (δ / 2) → |f x - f 0| ≤ n := by
        intro n
        induction n with
        | zero =>
          intro x hx
          have hx0 : x = 0 := by
            have h1 : |x| ≤ 0 := by simpa using hx
            exact abs_nonpos_iff.1 h1
          simp [hx0]
        | succ n ih =>
          intro x hx
          push_cast at hx ⊢
          have hn : (0 : ℝ) < (n : ℝ) + 1 := by positivity
          have hy : |x * ((n : ℝ) / ((n : ℝ) + 1))| ≤ n * (δ / 2) := by
            rw [abs_mul, abs_of_nonneg (by positivity : (0 : ℝ) ≤ (n : ℝ) / ((n : ℝ) + 1))]
            have h1 : |x| * ((n : ℝ) / ((n : ℝ) + 1)) ≤ ((n : ℝ) + 1) * (δ / 2) * ((n : ℝ) / ((n : ℝ) + 1)) :=
              mul_le_mul_of_nonneg_right hx (by positivity)
            have h2 : ((n : ℝ) + 1) * (δ / 2) * ((n : ℝ) / ((n : ℝ) + 1)) = n * (δ / 2) := by
              field_simp
            linarith
          have hxy : dist x (x * ((n : ℝ) / ((n : ℝ) + 1))) < δ := by
            rw [Real.dist_eq]
            have e : x - x * ((n : ℝ) / ((n : ℝ) + 1)) = x / ((n : ℝ) + 1) := by
              field_simp
              ring
            rw [e, abs_div, abs_of_pos hn, div_lt_iff₀ hn]
            have h3 : 0 < ((n : ℝ) + 1) * (δ / 2) := by positivity
            linarith
          have h4 := h hxy
          rw [Real.dist_eq] at h4
          have h5 := ih _ hy
          have h6 := abs_sub_le (f x) (f (x * ((n : ℝ) / ((n : ℝ) + 1)))) (f 0)
          linarith
      refine ⟨2 / δ, |f 0| + 1, fun x => ?_⟩
      have h1 := Nat.le_ceil (2 * |x| / δ)
      have h2 := Nat.ceil_lt_add_one (show 0 ≤ 2 * |x| / δ by positivity)
      have h3 : |x| ≤ (⌈2 * |x| / δ⌉₊ : ℝ) * (δ / 2) := by
        have h4 := (div_le_iff₀ hδ).1 h1
        linarith
      have h5 := key _ _ h3
      have h6 := abs_sub_abs_le_abs_sub (f x) (f 0)
      have h7 : 2 * |x| / δ = 2 / δ * |x| := by ring
      linarith
- id: lhopital_quotient_at_point
  kind: gap
  level: 1
  topic: 微分・不定形の極限（一点での微分係数の比）
  statement: $f,g$が$a$で微分可能で$f(a)=g(a)=0$、$g'(a)\neq0$ならば、$a$の近くの$x\neq a$で$g(x)\neq0$であり、$x\to a$で$f(x)/g(x)\to f'(a)/g'(a)$である。
  statement_en: If f and g have derivatives u and v ≠ 0 at a and f(a) = g(a) = 0, then g(x) ≠ 0 for x ≠ a near a and f(x)/g(x) → u/v as x → a with x ≠ a.
  assumptions:
  - $f$は$a$で微分係数$u$をもち、$g$は$a$で微分係数$v\neq0$をもつ
  - $f(a)=g(a)=0$
  quantifiers:
  - 任意の$f$、$g$、$a$、$u$、$v$
  conclusion: $a$の近くの$x\neq a$で$g(x)\neq0$であり、$f(x)/g(x)\to u/v$である。
  answer: |
    $f,g$が$a$で微分係数$u,v$をもち、$v\neq0$、$f(a)=g(a)=0$とする。

    $x\neq a$について$g(x)/(x-a)=(g(x)-g(a))/(x-a)\to v\neq0$である。極限が$0$でないので、$a$の近くの$x\neq a$で$g(x)/(x-a)\neq0$、すなわち$g(x)\neq0$である。

    そのような$x$で$\frac{f(x)}{g(x)}=\frac{(f(x)-f(a))/(x-a)}{(g(x)-g(a))/(x-a)}$である。分子は$u$に、分母は$v\neq0$に収束するので、商の極限から$f(x)/g(x)\to u/v$である。
  strategy: Divide numerator and denominator by x - a to obtain difference quotients.
  sketch:
  - "derive: g(x)/(x-a) tends to v ≠ 0, so g(x) ≠ 0 near a with x ≠ a."
  - "derive: f(x)/g(x) is the quotient of the two difference quotients."
  - "conclude: The limit of the quotient is u/v."
  openmath: (forall (f g a u v) (-> (and (has_deriv_at (lambda (x) (fn_value f x)) u a) (has_deriv_at (lambda (x) (fn_value g x)) v a) (= (fn_value f a) 0) (= (fn_value g a) 0) (!= v 0)) (and (exists (d) (and (> d 0) (forall (x) (-> (and (!= x a) (< (abs (- x a)) d)) (!= (fn_value g x) 0))))) (fn_limit_at (lambda (x) (/ (fn_value f x) (fn_value g x))) a (/ u v)))))
  hard_negative:
    statement: $f,g$が$a$で微分可能で$g'(a)\neq0$ならば、$f(a)$と$g(a)$の値によらず$f(x)/g(x)\to f'(a)/g'(a)$である。
    reason: $f(x)=x+2$、$g(x)=x+1$、$a=0$では$f(x)/g(x)\to2$だが、$f'(0)/g'(0)=1$である。$f(a)=g(a)=0$が必要である。
  target: |
    ∀ (f g : ℝ → ℝ) (a u v : ℝ), HasDerivAt f u a → HasDerivAt g v a → f a = 0 → g a = 0 → v ≠ 0 → (∀ᶠ x in nhdsWithin a {a}ᶜ, g x ≠ 0) ∧ Filter.Tendsto (fun x => f x / g x) (nhdsWithin a {a}ᶜ) (nhds (u / v))
  proof: |
    by
      intro f g a u v hf hg hfa hga hv
      refine ⟨hg.eventually_ne hv, ?_⟩
      have h1 := hasDerivAt_iff_tendsto_slope.1 hf
      have h2 := hasDerivAt_iff_tendsto_slope.1 hg
      refine (h1.div h2 hv).congr' ?_
      filter_upwards [self_mem_nhdsWithin] with x hx
      have hx' : x - a ≠ 0 := sub_ne_zero.2 hx
      simp only [Pi.div_apply, slope_def_field, hfa, hga, sub_zero]
      exact div_div_div_cancel_right₀ hx' _ _
- id: lhopital_zero_at_top
  kind: textbook
  level: 1
  topic: 微分・ロピタルの定理（無限遠での0/0型）
  statement: $x>a$で$f,g$が微分可能で$g'(x)\neq0$とする。$x\to+\infty$で$f(x)\to0$、$g(x)\to0$、$f'(x)/g'(x)\to L$ならば、$f(x)/g(x)\to L$である。
  statement_en: Let f and g be differentiable for x > a with g'(x) ≠ 0. If f(x) → 0, g(x) → 0 and f'(x)/g'(x) → L as x → +∞, then f(x)/g(x) → L.
  assumptions:
  - $x>a$で$f,g$は微分可能で$g'(x)\neq0$
  - $x\to+\infty$で$f(x)\to0$、$g(x)\to0$
  - $x\to+\infty$で$f'(x)/g'(x)\to L$
  quantifiers:
  - 任意の$f$、$g$、$f'$、$g'$、$a$、$L$
  conclusion: $x\to+\infty$で$f(x)/g(x)\to L$である。
  answer: |
    $f,g:\mathbb{R}\to\mathbb{R}$が$x>a$で微分可能で$g'(x)\neq0$、$x\to+\infty$で$f(x)\to0$、$g(x)\to0$、$f'(x)/g'(x)\to L$とする。$\varepsilon>0$をとり、$N>a$を、$x>N$で$|f'(x)/g'(x)-L|<\varepsilon$となるようにとる。

    $g'$は$x>a$で$0$にならないので、ロルの定理から$g$は$x>a$で単射である。$N<x<y$とする。コーシーの平均値の定理から$c\in(x,y)$があり、$(f(y)-f(x))g'(c)=(g(y)-g(x))f'(c)$である。$g(y)\neq g(x)$なので$\left|\frac{f(y)-f(x)}{g(y)-g(x)}-L\right|=\left|\frac{f'(c)}{g'(c)}-L\right|<\varepsilon$である。

    $g(x)\neq0$を確かめる。$g$は連続で単射なので狭義単調であり、$+\infty$で$0$に収束するから、$g(x)\neq0$である。$x$を固定して$y\to+\infty$とすると$f(y),g(y)\to0$なので、$|f(x)/g(x)-L|\leq\varepsilon$を得る。これが全ての$x>N$で成り立つので、$f(x)/g(x)\to L$である。
  strategy: Apply Cauchy's mean value theorem on [x, y] and let y tend to infinity.
  sketch:
  - "setup: Fix ε and N beyond which f'/g' is within ε of L."
  - "derive: g is injective by Rolle, hence strictly monotone, so g(x) ≠ 0."
  - "apply_theorem: Cauchy's mean value theorem bounds (f(y)-f(x))/(g(y)-g(x)) within ε of L."
  - "conclude: Letting y → +∞ gives |f(x)/g(x) - L| ≤ ε for x > N."
  openmath: (forall (f g h k a L) (-> (and (forall (x) (-> (> x a) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value h x) x))) (forall (x) (-> (> x a) (has_deriv_at (lambda (t) (fn_value g t)) (fn_value k x) x))) (forall (x) (-> (> x a) (!= (fn_value k x) 0))) (fn_limit_at_top (lambda (x) (fn_value f x)) 0) (fn_limit_at_top (lambda (x) (fn_value g x)) 0) (fn_limit_at_top (lambda (x) (/ (fn_value h x) (fn_value k x))) L)) (fn_limit_at_top (lambda (x) (/ (fn_value f x) (fn_value g x))) L)))
  hard_negative:
    statement: $f(x)/g(x)$が収束すれば、$f'(x)/g'(x)$も同じ値に収束する。
    reason: $f(x)=\sin(x^2)/x^2$、$g(x)=1/x$では$f/g=\sin(x^2)/x\to0$だが、$f'/g'$は$-2x\cos(x^2)+2\sin(x^2)/x$となり収束しない。
  target: |
    ∀ (f g f' g' : ℝ → ℝ) (a L : ℝ), (∀ x ∈ Set.Ioi a, HasDerivAt f (f' x) x) → (∀ x ∈ Set.Ioi a, HasDerivAt g (g' x) x) → (∀ x ∈ Set.Ioi a, g' x ≠ 0) → Filter.Tendsto f Filter.atTop (nhds 0) → Filter.Tendsto g Filter.atTop (nhds 0) → Filter.Tendsto (fun x => f' x / g' x) Filter.atTop (nhds L) → Filter.Tendsto (fun x => f x / g x) Filter.atTop (nhds L)
  proof: |
    by
      intro f g f' g' a L hf hg hg' hf0 hg0 hq
      exact HasDerivAt.lhopital_zero_atTop_on_Ioi hf hg hg' hf0 hg0 hq
- id: lhopital_infty_at_top
  kind: textbook
  level: 1
  topic: 微分・ロピタルの定理（無限遠での∞/∞型）
  statement: $x>a$で$f,g$が微分可能で$g'(x)\neq0$とする。$x\to+\infty$で$g(x)\to+\infty$かつ$f'(x)/g'(x)\to L$ならば、$f(x)/g(x)\to L$である。$f$の発散は仮定しない。
  statement_en: Let f and g be differentiable for x > a with g'(x) ≠ 0. If g(x) → +∞ and f'(x)/g'(x) → L as x → +∞, then f(x)/g(x) → L; no divergence of f is assumed.
  assumptions:
  - $x>a$で$f,g$は微分可能で$g'(x)\neq0$
  - $x\to+\infty$で$g(x)\to+\infty$
  - $x\to+\infty$で$f'(x)/g'(x)\to L$
  quantifiers:
  - 任意の$f$、$g$、$f'$、$g'$、$a$、$L$
  conclusion: $x\to+\infty$で$f(x)/g(x)\to L$である。
  answer: |
    $f,g:\mathbb{R}\to\mathbb{R}$が$x>a$で微分可能で$g'(x)\neq0$、$x\to+\infty$で$g(x)\to+\infty$、$f'(x)/g'(x)\to L$とする。$\varepsilon>0$をとり、$N>a$を、$x>N$で$|f'(x)/g'(x)-L|<\varepsilon/2$となるようにとる。$A=|f(N)-Lg(N)|+\frac\varepsilon2|g(N)|$とおく。

    $x>N$とする。コーシーの平均値の定理から$c\in(N,x)$があり、$(g(x)-g(N))f'(c)=(f(x)-f(N))g'(c)$である。$q=f'(c)/g'(c)$とおくと$f(x)-f(N)=q(g(x)-g(N))$なので$f(x)-Lg(x)=f(N)-Lg(N)+(q-L)(g(x)-g(N))$である。$|q-L|<\varepsilon/2$より、$|f(x)-Lg(x)|\leq A+\frac\varepsilon2|g(x)|$である。

    $g(x)\to+\infty$より、十分大きな$x$で$g(x)>0$かつ$A<\frac\varepsilon2g(x)$である。このとき$|f(x)-Lg(x)|<\varepsilon g(x)$であり、$g(x)$で割ると$|f(x)/g(x)-L|<\varepsilon$を得る。
  strategy: Fix a base point N, compare increments with Cauchy's mean value theorem and absorb the constant terms by the divergence of g.
  sketch:
  - "setup: Choose N with f'/g' within ε/2 of L beyond N and put A = |f(N) - L g(N)| + (ε/2)|g(N)|."
  - "apply_theorem: Cauchy's mean value theorem on [N, x] gives f(x) - f(N) = q (g(x) - g(N)) with |q - L| < ε/2."
  - "derive: Hence |f(x) - L g(x)| ≤ A + (ε/2)|g(x)|."
  - "conclude: For large x, A < (ε/2) g(x), so |f(x)/g(x) - L| < ε."
  openmath: (forall (f g h k a L) (-> (and (forall (x) (-> (> x a) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value h x) x))) (forall (x) (-> (> x a) (has_deriv_at (lambda (t) (fn_value g t)) (fn_value k x) x))) (forall (x) (-> (> x a) (!= (fn_value k x) 0))) (fn_tends_to_infinity_at_top (lambda (x) (fn_value g x))) (fn_limit_at_top (lambda (x) (/ (fn_value h x) (fn_value k x))) L)) (fn_limit_at_top (lambda (x) (/ (fn_value f x) (fn_value g x))) L)))
  hard_negative:
    statement: $g(x)\to+\infty$で$f(x)/g(x)$が収束すれば、$f'(x)/g'(x)$も同じ値に収束する。
    reason: $f(x)=x+\sin x$、$g(x)=x$では$f/g\to1$だが、$f'/g'=1+\cos x$は収束しない。
  target: |
    ∀ (f g f' g' : ℝ → ℝ) (a L : ℝ), (∀ x ∈ Set.Ioi a, HasDerivAt f (f' x) x) → (∀ x ∈ Set.Ioi a, HasDerivAt g (g' x) x) → (∀ x ∈ Set.Ioi a, g' x ≠ 0) → Filter.Tendsto g Filter.atTop Filter.atTop → Filter.Tendsto (fun x => f' x / g' x) Filter.atTop (nhds L) → Filter.Tendsto (fun x => f x / g x) Filter.atTop (nhds L)
  proof: |
    by
      intro f g f' g' a L hf hg hg' hinf hq
      refine Metric.tendsto_atTop.2 fun ε hε => ?_
      obtain ⟨N0, hN0⟩ := Metric.tendsto_atTop.1 hq (ε / 2) (half_pos hε)
      obtain ⟨N, hNdef⟩ : ∃ N, N = max N0 (a + 1) := ⟨_, rfl⟩
      have hNa : a < N := by
        have h := le_max_right N0 (a + 1)
        rw [← hNdef] at h
        linarith
      have hN0N : N0 ≤ N := hNdef ▸ le_max_left _ _
      obtain ⟨M1, hM1⟩ := Filter.tendsto_atTop_atTop.1 hinf (2 * (|f N - L * g N| + ε / 2 * |g N|) / ε + 1)
      refine ⟨max (N + 1) M1, fun x hx => ?_⟩
      have hxN : N < x := by
        have h := le_max_left (N + 1) M1
        linarith
      have hgx := hM1 x ((le_max_right _ _).trans hx)
      have hA : 0 ≤ 2 * (|f N - L * g N| + ε / 2 * |g N|) / ε := by positivity
      have hgpos : 0 < g x := by linarith
      have hgA : 2 * (|f N - L * g N| + ε / 2 * |g N|) / ε < g x := by linarith
      rw [div_lt_iff₀ hε] at hgA
      obtain ⟨c, hc, hcq⟩ := exists_ratio_hasDerivAt_eq_ratio_slope f f' hxN
        (fun y hy => (hf y (lt_of_lt_of_le hNa hy.1)).continuousAt.continuousWithinAt)
        (fun y hy => hf y (hNa.trans hy.1)) g g'
        (fun y hy => (hg y (lt_of_lt_of_le hNa hy.1)).continuousAt.continuousWithinAt)
        (fun y hy => hg y (hNa.trans hy.1))
      have hcg : g' c ≠ 0 := hg' c (hNa.trans hc.1)
      have hcl := hN0 c (hN0N.trans hc.1.le)
      rw [Real.dist_eq] at hcl
      have hdiff : f x - f N = f' c / g' c * (g x - g N) := by
        field_simp
        linarith
      have e : f x - L * g x = (f N - L * g N) + (f' c / g' c - L) * (g x - g N) := by
        rw [sub_mul]
        linarith
      have b1 : |(f' c / g' c - L) * (g x - g N)| ≤ ε / 2 * (|g x| + |g N|) := by
        rw [abs_mul]
        exact mul_le_mul hcl.le (abs_sub _ _) (abs_nonneg _) (half_pos hε).le
      have b2 : |f x - L * g x| < ε * g x := by
        rw [e]
        have b3 := abs_add_le (f N - L * g N) ((f' c / g' c - L) * (g x - g N))
        rw [abs_of_pos hgpos] at b1
        nlinarith
      have e2 : f x / g x - L = (f x - L * g x) / g x := by
        field_simp
      rw [Real.dist_eq, e2, abs_div, abs_of_pos hgpos, div_lt_iff₀ hgpos]
      exact b2
- id: symmetric_difference_quotient
  kind: gap
  level: 1
  topic: 微分・対称差分商
  statement: $f$が$a$で微分係数$u$をもつならば、$h\to0$（$h\neq0$）で$\frac{f(a+h)-f(a-h)}{2h}\to u$である。
  statement_en: If f has derivative u at a, then (f(a+h) - f(a-h))/(2h) → u as h → 0 with h ≠ 0.
  assumptions:
  - $f$は$a$で微分係数$u$をもつ
  quantifiers:
  - 任意の$f$、$a$、$u$
  conclusion: $h\to0$（$h\neq0$）で$\frac{f(a+h)-f(a-h)}{2h}\to u$である。
  answer: |
    $f$が$a$で微分係数$u$をもつとする。$h\neq0$について$\frac{f(a+h)-f(a-h)}{2h}=\frac12\left(\frac{f(a+h)-f(a)}{h}+\frac{f(a+(-h))-f(a)}{-h}\right)$である。$h\to0$のとき$-h\to0$でもあるから、括弧内の二つの差分商はともに$u$に収束する。よって全体は$\frac12(u+u)=u$に収束する。
  strategy: Write the symmetric quotient as the average of the difference quotients at h and -h.
  sketch:
  - "derive: The symmetric quotient is the average of the quotients at h and at -h."
  - "derive: Both quotients tend to u as h → 0."
  - "conclude: The average tends to u."
  openmath: (forall (f a u) (-> (has_deriv_at (lambda (x) (fn_value f x)) u a) (fn_limit_at (lambda (h) (/ (- (fn_value f (+ a h)) (fn_value f (- a h))) (* 2 h))) 0 u)))
  hard_negative:
    statement: 対称差分商$\frac{f(a+h)-f(a-h)}{2h}$が収束すれば、$f$は$a$で微分可能である。
    reason: $f(x)=|x|$、$a=0$では対称差分商は常に$0$で収束するが、$f$は$0$で微分可能でない。
  target: |
    ∀ (f : ℝ → ℝ) (a u : ℝ), HasDerivAt f u a → Filter.Tendsto (fun h => (f (a + h) - f (a - h)) / (2 * h)) (nhdsWithin 0 {0}ᶜ) (nhds u)
  proof: |
    by
      intro f a u hf
      have h1 := hf.tendsto_slope_zero
      have hneg : Filter.Tendsto (fun h : ℝ => -h) (nhdsWithin 0 {0}ᶜ) (nhdsWithin 0 {0}ᶜ) := by
        refine tendsto_nhdsWithin_iff.2 ⟨?_, ?_⟩
        · have h2 : Filter.Tendsto (fun h : ℝ => -h) (nhds 0) (nhds 0) := by
            simpa using (continuous_neg (G := ℝ)).tendsto 0
          exact h2.mono_left nhdsWithin_le_nhds
        · filter_upwards [self_mem_nhdsWithin] with h hh
          simpa using hh
      have h3 := (h1.add (h1.comp hneg)).const_mul (1 / 2 : ℝ)
      have e : (1 / 2 : ℝ) * (u + u) = u := by ring
      rw [e] at h3
      refine h3.congr' ?_
      filter_upwards [self_mem_nhdsWithin] with h hh
      have hh' : h ≠ 0 := hh
      simp only [Function.comp, smul_eq_mul, sub_eq_add_neg a h]
      field_simp
      ring
- id: deriv_caratheodory
  kind: gap
  level: 1
  topic: 微分・カラテオドリの判定条件
  statement: $f$が$a$で微分係数$u$をもつことと、$a$で連続な関数$\varphi$で$\varphi(a)=u$かつ全ての$x$で$f(x)-f(a)=\varphi(x)(x-a)$を満たすものが存在することは同値である。
  statement_en: A function f has derivative u at a if and only if there is a function φ continuous at a with φ(a) = u and f(x) - f(a) = φ(x)(x - a) for all x.
  assumptions:
  - $f:\mathbb{R}\to\mathbb{R}$、$a,u\in\mathbb{R}$
  quantifiers:
  - 任意の$f$、$a$、$u$
  conclusion: $f$の$a$での微分係数が$u$であることと、$\varphi$の存在は同値である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$、$a,u\in\mathbb{R}$とする。

    $f$が$a$で微分係数$u$をもつとする。$x\neq a$で$\varphi(x)=(f(x)-f(a))/(x-a)$、$\varphi(a)=u$と定める。$x\neq a$では定義から$f(x)-f(a)=\varphi(x)(x-a)$であり、$x=a$では両辺とも$0$である。微分係数の定義より$x\to a$（$x\neq a$）で$\varphi(x)\to u=\varphi(a)$なので、$\varphi$は$a$で連続である。

    逆に$\varphi$が条件を満たすとする。$x\neq a$で$(f(x)-f(a))/(x-a)=\varphi(x)$であり、$\varphi$の$a$での連続性から$\varphi(x)\to\varphi(a)=u$である。よって$f$は$a$で微分係数$u$をもつ。
  strategy: Extend the difference quotient to a by the value u.
  sketch:
  - "construct: Define φ as the difference quotient for x ≠ a and φ(a) = u."
  - "derive: The derivative condition says exactly that φ is continuous at a."
  - "conclude: Conversely, a continuous φ makes the difference quotient converge to φ(a) = u."
  openmath: (forall (f a u) (<-> (has_deriv_at (lambda (x) (fn_value f x)) u a) (exists (g) (and (fn_continuous_at (lambda (x) (fn_value g x)) a) (= (fn_value g a) u) (forall (x) (= (- (fn_value f x) (fn_value f a)) (* (fn_value g x) (- x a))))))))
  hard_negative:
    statement: $f(x)-f(a)=\varphi(x)(x-a)$を満たす関数$\varphi$が（連続性なしで）存在すれば、$f$は$a$で微分可能である。
    reason: $f(x)=|x|$、$a=0$では$\varphi(x)=x/|x|$（$x\neq0$）、$\varphi(0)=0$が式を満たすが、$f$は$0$で微分可能でない。
  target: |
    ∀ (f : ℝ → ℝ) (a u : ℝ), HasDerivAt f u a ↔ ∃ φ : ℝ → ℝ, ContinuousAt φ a ∧ φ a = u ∧ ∀ x, f x - f a = φ x * (x - a)
  proof: |
    by
      intro f a u
      constructor
      · intro hf
        refine ⟨Function.update (slope f a) a u, ?_, by simp, fun x => ?_⟩
        · exact continuousAt_update_same.2 (hasDerivAt_iff_tendsto_slope.1 hf)
        · by_cases hx : x = a
          · subst hx
            simp
          · rw [Function.update_of_ne hx, slope_def_field]
            have hx' : x - a ≠ 0 := sub_ne_zero.2 hx
            field_simp
      · rintro ⟨φ, hc, hu, h⟩
        rw [hasDerivAt_iff_tendsto_slope, ← hu]
        refine (hc.tendsto.mono_left nhdsWithin_le_nhds).congr' ?_
        filter_upwards [self_mem_nhdsWithin] with x hx
        have hx' : x - a ≠ 0 := sub_ne_zero.2 hx
        rw [slope_def_field, h x]
        field_simp
- id: taylor_cauchy_remainder
  kind: textbook
  level: 2
  topic: テイラーの定理・コーシー型剰余
  statement: $a\neq x$で、$f$が$a$と$x$を結ぶ閉区間$I$で$C^n$級、$f^{(n)}$がその内部で微分可能ならば、$a$と$x$の間の$c$があり、$f(x)=\sum_{k=0}^n\frac{f^{(k)}(a)}{k!}(x-a)^k+\frac{f^{(n+1)}(c)}{n!}(x-c)^n(x-a)$である。導関数は$I$上で（端点では片側で）とる。
  statement_en: If a ≠ x, f is C^n on the closed interval I between a and x and f^(n) is differentiable on its interior, then there is c strictly between a and x with f(x) = Σ_{k≤n} f^(k)(a)(x-a)^k/k! + f^(n+1)(c)(x-c)^n(x-a)/n!, with derivatives taken within I.
  assumptions:
  - $a\neq x$
  - $f$は$a$と$x$を結ぶ閉区間で$C^n$級
  - $f^{(n)}$は開区間で微分可能
  quantifiers:
  - 任意の$f$、$a$、$x$、自然数$n$
  conclusion: $a$と$x$の間の$c$で、コーシー型の剰余をもつテイラーの公式が成り立つ。
  answer: |
    $a\neq x$とし、$I$を$a$と$x$を結ぶ閉区間、$f$を$I$で$C^n$級で$f^{(n)}$が内部で微分可能な関数とする。$t\in I$について$F(t)=\sum_{k=0}^n\frac{f^{(k)}(t)}{k!}(x-t)^k$とおく。$F$は$I$で連続、内部で微分可能である。積の微分をすると和が打ち消し合い、内部の$t$で$F'(t)=\frac{f^{(n+1)}(t)}{n!}(x-t)^n$となる。

    平均値の定理から$a$と$x$の間の$c$があり、$F(x)-F(a)=F'(c)(x-a)$である。$F(x)=f(x)$であり、$F(a)$は$x$での$n$次のテイラー多項式の値なので、主張を得る。
  strategy: Regard the Taylor polynomial as a function of its base point and apply the mean value theorem.
  sketch:
  - "construct: Define F(t) as the Taylor polynomial at x with base point t."
  - "derive: The derivative of F telescopes to f^(n+1)(t)(x-t)^n/n!."
  - "apply_theorem: The mean value theorem between a and x gives c with F(x) - F(a) = F'(c)(x-a)."
  - "conclude: F(x) = f(x) and F(a) is the Taylor polynomial, which gives the formula."
  openmath: (forall (f a x n) (-> (and (!= a x) (in n N) (cont_diff_on (lambda (t) (fn_value f t)) n (closed_interval_between a x)) (differentiable_on (lambda (t) (iterated_deriv_within (lambda (s) (fn_value f s)) n (closed_interval_between a x) t)) (open_interval_between a x))) (exists (c) (and (in c (open_interval_between a x)) (= (fn_value f x) (+ (sum (natural_range (+ n 1)) (lambda (k) (* (/ (iterated_deriv_within (lambda (s) (fn_value f s)) k (closed_interval_between a x) a) (factorial k)) (^ (- x a) k)))) (* (/ (* (iterated_deriv_within (lambda (s) (fn_value f s)) (+ n 1) (closed_interval_between a x) c) (^ (- x c) n)) (factorial n)) (- x a))))))))
  hard_negative:
    statement: コーシー型の剰余の$c$は、$a$と$x$の中点にとれる。
    reason: $f(t)=t^3$、$a=0$、$x=1$、$n=1$では$f(1)=0+0+6c(1-c)$となり、$c(1-c)=1/6$が必要だが、中点$c=1/2$では$c(1-c)=1/4$である。
  target: |
    ∀ (f : ℝ → ℝ) (a x : ℝ) (n : ℕ), a ≠ x → ContDiffOn ℝ n f (Set.uIcc a x) → DifferentiableOn ℝ (iteratedDerivWithin n f (Set.uIcc a x)) (Set.uIoo a x) → ∃ c ∈ Set.uIoo a x, f x = ∑ k ∈ Finset.range (n + 1), iteratedDerivWithin k f (Set.uIcc a x) a / (k.factorial : ℝ) * (x - a) ^ k + iteratedDerivWithin (n + 1) f (Set.uIcc a x) c * (x - c) ^ n / (n.factorial : ℝ) * (x - a)
  proof: |
    by
      intro f a x n hax hf hd
      obtain ⟨c, hc, e⟩ := taylor_mean_remainder_cauchy hax hf hd
      refine ⟨c, hc, ?_⟩
      rw [taylor_within_apply] at e
      have hs : ∑ k ∈ Finset.range (n + 1), iteratedDerivWithin k f (Set.uIcc a x) a / (k.factorial : ℝ) * (x - a) ^ k = ∑ k ∈ Finset.range (n + 1), ((k.factorial : ℝ)⁻¹ * (x - a) ^ k) • iteratedDerivWithin k f (Set.uIcc a x) a := by
        refine Finset.sum_congr rfl fun k _ => ?_
        rw [smul_eq_mul]
        ring
      rw [hs, ← e]
      ring
- id: taylor_integral_remainder
  kind: textbook
  level: 2
  topic: テイラーの定理・積分型剰余
  statement: $f$が$a$と$x$を結ぶ閉区間$I$で$C^{n+1}$級ならば、$f(x)=\sum_{k=0}^n\frac{f^{(k)}(a)}{k!}(x-a)^k+\int_a^x\frac{(x-t)^n}{n!}f^{(n+1)}(t)\,dt$である。導関数は$I$上で（端点では片側で）とる。
  statement_en: If f is C^(n+1) on the closed interval I between a and x, then f(x) = Σ_{k≤n} f^(k)(a)(x-a)^k/k! + ∫_a^x (x-t)^n f^(n+1)(t)/n! dt, with derivatives taken within I.
  assumptions:
  - $f$は$a$と$x$を結ぶ閉区間で$C^{n+1}$級
  quantifiers:
  - 任意の$f$、$a$、$x$、自然数$n$
  conclusion: 積分型の剰余をもつテイラーの公式が成り立つ。
  answer: |
    $I$を$a$と$x$を結ぶ閉区間、$f$を$I$で$C^{n+1}$級の関数とする。$t\in I$について$F(t)=\sum_{k=0}^n\frac{f^{(k)}(t)}{k!}(x-t)^k$とおく。$F$は$I$で$C^1$級である。積の微分をすると和が打ち消し合い、$F'(t)=\frac{f^{(n+1)}(t)}{n!}(x-t)^n$となる。微積分学の基本定理から$F(x)-F(a)=\int_a^xF'(t)\,dt$である。$F(x)=f(x)$であり、$F(a)$は$n$次のテイラー多項式の値なので、主張を得る。
  strategy: Regard the Taylor polynomial as a function of its base point and apply the fundamental theorem of calculus.
  sketch:
  - "construct: Define F(t) as the Taylor polynomial at x with base point t."
  - "derive: The derivative of F telescopes to f^(n+1)(t)(x-t)^n/n!, which is continuous."
  - "apply_theorem: The fundamental theorem of calculus gives F(x) - F(a) = ∫_a^x F'."
  - "conclude: F(x) = f(x), and F(a) is the Taylor polynomial."
  openmath: (forall (f a x n) (-> (and (in n N) (cont_diff_on (lambda (t) (fn_value f t)) (+ n 1) (closed_interval_between a x))) (= (fn_value f x) (+ (sum (natural_range (+ n 1)) (lambda (k) (* (/ (iterated_deriv_within (lambda (s) (fn_value f s)) k (closed_interval_between a x) a) (factorial k)) (^ (- x a) k)))) (interval_integral a x (lambda (t) (* (/ (^ (- x t) n) (factorial n)) (iterated_deriv_within (lambda (s) (fn_value f s)) (+ n 1) (closed_interval_between a x) t))))))))
  hard_negative:
    statement: 同じ公式で、積分の中の因子$(x-t)^n/n!$を$(t-a)^n/n!$に置き換えてもよい。
    reason: $f(t)=t^2$、$a=0$、$x=1$、$n=1$では右辺の積分は$\int_0^1t\cdot2\,dt=1$で、$f(1)=1$と一致するが、$f(t)=t^3$では$\int_0^1t\cdot6t\,dt=2\neq1$となり成り立たない。
  target: |
    ∀ (f : ℝ → ℝ) (a x : ℝ) (n : ℕ), ContDiffOn ℝ (n + 1 : ℕ) f (Set.uIcc a x) → f x = ∑ k ∈ Finset.range (n + 1), iteratedDerivWithin k f (Set.uIcc a x) a / (k.factorial : ℝ) * (x - a) ^ k + ∫ t in a..x, (x - t) ^ n / (n.factorial : ℝ) * iteratedDerivWithin (n + 1) f (Set.uIcc a x) t
  proof: |
    by
      intro f a x n hf
      have e := taylor_integral_remainder hf
      rw [taylor_within_apply] at e
      have hs : ∑ k ∈ Finset.range (n + 1), iteratedDerivWithin k f (Set.uIcc a x) a / (k.factorial : ℝ) * (x - a) ^ k = ∑ k ∈ Finset.range (n + 1), ((k.factorial : ℝ)⁻¹ * (x - a) ^ k) • iteratedDerivWithin k f (Set.uIcc a x) a := by
        refine Finset.sum_congr rfl fun k _ => ?_
        rw [smul_eq_mul]
        ring
      have hi : ∫ t in a..x, (x - t) ^ n / (n.factorial : ℝ) * iteratedDerivWithin (n + 1) f (Set.uIcc a x) t = ∫ t in a..x, ((x - t) ^ n / (n.factorial : ℝ)) • iteratedDerivWithin (n + 1) f (Set.uIcc a x) t := by
        refine intervalIntegral.integral_congr fun t _ => ?_
        simp only [smul_eq_mul]
      rw [hs, hi, ← e]
      ring
- id: taylor_peano
  kind: textbook
  level: 2
  topic: テイラーの定理・ペアノ型剰余
  statement: $f:\mathbb{R}\to\mathbb{R}$が$C^n$級ならば、$x\to a$（$x\neq a$）で$\frac{f(x)-\sum_{k=0}^n\frac{f^{(k)}(a)}{k!}(x-a)^k}{(x-a)^n}\to0$である。
  statement_en: If f is C^n on the reals, then (f(x) - Σ_{k≤n} f^(k)(a)(x-a)^k/k!)/(x-a)^n → 0 as x → a with x ≠ a.
  assumptions:
  - $f:\mathbb{R}\to\mathbb{R}$は$C^n$級
  quantifiers:
  - 任意の$f$、$a$、自然数$n$
  conclusion: $x\to a$で剰余を$(x-a)^n$で割った値は$0$に収束する。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$を$C^n$級とする。

    $n=0$のとき、式は$f(x)-f(a)$であり、$f$の連続性から$0$に収束する。

    $n\geq1$とする。$x\neq a$について、ラグランジュ型の剰余をもつテイラーの定理を次数$n-1$で使うと、$a$と$x$の間の$c_x$があり$f(x)=\sum_{k=0}^{n-1}\frac{f^{(k)}(a)}{k!}(x-a)^k+\frac{f^{(n)}(c_x)}{n!}(x-a)^n$である。よって$\frac{f(x)-\sum_{k=0}^n\frac{f^{(k)}(a)}{k!}(x-a)^k}{(x-a)^n}=\frac{f^{(n)}(c_x)-f^{(n)}(a)}{n!}$である。$x\to a$のとき$c_x\to a$であり、$f^{(n)}$は連続なので右辺は$0$に収束する。
  strategy: Use the Lagrange remainder of order n-1 and the continuity of the n-th derivative.
  sketch:
  - "case_split: For n = 0 the claim is continuity of f."
  - "apply_theorem: For n ≥ 1 the Lagrange form of order n-1 gives a point c_x between a and x."
  - "derive: The quotient equals (f^(n)(c_x) - f^(n)(a))/n!."
  - "conclude: c_x → a and f^(n) is continuous, so the quotient tends to 0."
  openmath: (forall (f a n) (-> (and (in n N) (cont_diff_on (lambda (t) (fn_value f t)) n R)) (fn_limit_at (lambda (x) (/ (- (fn_value f x) (sum (natural_range (+ n 1)) (lambda (k) (* (/ (iterated_deriv (lambda (s) (fn_value f s)) k a) (factorial k)) (^ (- x a) k))))) (^ (- x a) n))) a 0)))
  hard_negative:
    statement: $f$が$C^n$級なら、剰余を$(x-a)^{n+1}$で割った値も$0$に収束する。
    reason: $f(x)=x^3$、$a=0$、$n=2$では剰余は$x^3$であり、$x^3$で割ると常に$1$である。
  target: |
    ∀ (f : ℝ → ℝ) (a : ℝ) (n : ℕ), ContDiff ℝ n f → Filter.Tendsto (fun x => (f x - ∑ k ∈ Finset.range (n + 1), iteratedDeriv k f a / (k.factorial : ℝ) * (x - a) ^ k) / (x - a) ^ n) (nhdsWithin a {a}ᶜ) (nhds 0)
  proof: |
    by
      intro f a n hf
      have h := (taylor_isLittleO_univ (x₀ := a) hf).tendsto_div_nhds_zero
      refine (h.mono_left nhdsWithin_le_nhds).congr fun x => ?_
      rw [taylor_within_apply]
      congr 2
      refine Finset.sum_congr rfl fun k _ => ?_
      rw [smul_eq_mul, iteratedDerivWithin_univ]
      ring
- id: taylor_remainder_bound
  kind: gap
  level: 2
  topic: テイラーの定理・剰余の一様な評価
  statement: $a\leq b$で$f$が$[a,b]$上$C^{n+1}$級ならば、定数$C$があり、全ての$x\in[a,b]$で$\left|f(x)-\sum_{k=0}^n\frac{f^{(k)}(a)}{k!}(x-a)^k\right|\leq C(x-a)^{n+1}$である。導関数は$[a,b]$上で（端点では片側で）とる。
  statement_en: If a ≤ b and f is C^(n+1) on [a, b], then there is a constant C with |f(x) - Σ_{k≤n} f^(k)(a)(x-a)^k/k!| ≤ C (x-a)^(n+1) for all x in [a, b], with derivatives taken within [a, b].
  assumptions:
  - $a\leq b$
  - $f$は$[a,b]$上$C^{n+1}$級
  quantifiers:
  - 任意の$f$、$a\leq b$、自然数$n$
  conclusion: 定数$C$があり、$[a,b]$上で剰余の絶対値は$C(x-a)^{n+1}$以下である。
  answer: |
    $a\leq b$とし、$f$を$[a,b]$上$C^{n+1}$級の関数とする。$f^{(n+1)}$は閉区間上連続なので、$|f^{(n+1)}|\leq M$となる$M$がある。$C=M/(n+1)!$とおく。

    $x=a$なら左辺は$0$で右辺も$0$以上である（$n+1\geq1$より$(x-a)^{n+1}=0$）。$a<x\leq b$なら、ラグランジュ型の剰余をもつテイラーの定理から$c\in(a,x)$があり、剰余は$\frac{f^{(n+1)}(c)}{(n+1)!}(x-a)^{n+1}$に等しい。その絶対値は$C(x-a)^{n+1}$以下である。
  strategy: Bound the (n+1)-st derivative on the compact interval and use the Lagrange remainder.
  sketch:
  - "apply_theorem: The continuous function f^(n+1) is bounded by M on [a, b]."
  - "case_split: At x = a both sides vanish."
  - "apply_theorem: For x > a the Lagrange remainder equals f^(n+1)(c)(x-a)^(n+1)/(n+1)!."
  - "conclude: C = M/(n+1)! works."
  openmath: (forall (f a b n) (-> (and (<= a b) (in n N) (cont_diff_on (lambda (t) (fn_value f t)) (+ n 1) (closed_interval a b))) (exists (c) (forall (x) (-> (in x (closed_interval a b)) (<= (abs (- (fn_value f x) (sum (natural_range (+ n 1)) (lambda (k) (* (/ (iterated_deriv_within (lambda (s) (fn_value f s)) k (closed_interval a b) a) (factorial k)) (^ (- x a) k)))))) (* c (^ (- x a) (+ n 1)))))))))
  hard_negative:
    statement: 同じ仮定で、$f$が$C^{n}$級でしかなくても同じ評価が成り立つ。
    reason: $f(x)=x^{3/2}$、$[a,b]=[0,1]$、$n=1$は$C^1$級だが、剰余$x^{3/2}$を$Cx^2$で抑えることは$x\to+0$でできない。
  target: |
    ∀ (f : ℝ → ℝ) (a b : ℝ) (n : ℕ), a ≤ b → ContDiffOn ℝ (n + 1) f (Set.Icc a b) → ∃ C : ℝ, ∀ x ∈ Set.Icc a b, |f x - ∑ k ∈ Finset.range (n + 1), iteratedDerivWithin k f (Set.Icc a b) a / (k.factorial : ℝ) * (x - a) ^ k| ≤ C * (x - a) ^ (n + 1)
  proof: |
    by
      intro f a b n hab hf
      obtain ⟨C, hC⟩ := exists_taylor_mean_remainder_bound hab hf
      refine ⟨C, fun x hx => ?_⟩
      have h := hC x hx
      rw [taylor_within_apply, Real.norm_eq_abs] at h
      have hs : ∑ k ∈ Finset.range (n + 1), iteratedDerivWithin k f (Set.Icc a b) a / (k.factorial : ℝ) * (x - a) ^ k = ∑ k ∈ Finset.range (n + 1), ((k.factorial : ℝ)⁻¹ * (x - a) ^ k) • iteratedDerivWithin k f (Set.Icc a b) a := by
        refine Finset.sum_congr rfl fun k _ => ?_
        rw [smul_eq_mul]
        ring
      rw [hs]
      exact h
- id: convex_three_slopes
  kind: gap
  level: 1
  topic: 凸関数・傾きの単調性
  statement: $f$が凸集合$S\subset\mathbb{R}$上の凸関数で、$x,z\in S$、$x<y<z$ならば、$\frac{f(y)-f(x)}{y-x}\leq\frac{f(z)-f(x)}{z-x}\leq\frac{f(z)-f(y)}{z-y}$である。
  statement_en: If f is convex on a convex set S of reals, x and z lie in S and x < y < z, then (f(y)-f(x))/(y-x) ≤ (f(z)-f(x))/(z-x) ≤ (f(z)-f(y))/(z-y).
  assumptions:
  - $f$は$S$上の凸関数
  - $x,z\in S$、$x<y<z$
  quantifiers:
  - 任意の$f$、$S$、$x$、$y$、$z$
  conclusion: 三つの傾きについて$\frac{f(y)-f(x)}{y-x}\leq\frac{f(z)-f(x)}{z-x}\leq\frac{f(z)-f(y)}{z-y}$である。
  answer: |
    $f$を凸集合$S\subset\mathbb{R}$上の凸関数とし、$x,z\in S$、$x<y<z$とする。

    $\lambda=\frac{z-y}{z-x}$、$\mu=\frac{y-x}{z-x}$とおくと、$\lambda,\mu\geq0$、$\lambda+\mu=1$、$\lambda x+\mu z=y$である。凸性から$f(y)\leq\lambda f(x)+\mu f(z)$であり、$z-x>0$を掛けると$(z-x)f(y)\leq(z-y)f(x)+(y-x)f(z)$である。

    右辺の$(z-y)f(x)$を$(z-x)f(x)-(y-x)f(x)$と書いて整理すると$(z-x)(f(y)-f(x))\leq(y-x)(f(z)-f(x))$となり、$(z-x)(y-x)>0$で割ると左の不等式を得る。同様に$(y-x)f(z)=(z-x)f(z)-(z-y)f(z)$と書いて整理すると$(z-y)(f(z)-f(x))\leq(z-x)(f(z)-f(y))$となり、$(z-x)(z-y)>0$で割ると右の不等式を得る。
  strategy: Write y as a convex combination of x and z, clear denominators and rearrange.
  sketch:
  - "construct: y = λx + μz with λ = (z-y)/(z-x) and μ = (y-x)/(z-x)."
  - "apply_theorem: Convexity gives (z-x) f(y) ≤ (z-y) f(x) + (y-x) f(z)."
  - "derive: Rearranging gives each of the two inequalities between slopes."
  openmath: (forall (f S x y z) (-> (and (convex_function_on f S) (in x S) (in z S) (< x y) (< y z)) (and (<= (/ (- (fn_value f y) (fn_value f x)) (- y x)) (/ (- (fn_value f z) (fn_value f x)) (- z x))) (<= (/ (- (fn_value f z) (fn_value f x)) (- z x)) (/ (- (fn_value f z) (fn_value f y)) (- z y))))))
  hard_negative:
    statement: 凸関数について、$\frac{f(y)-f(x)}{y-x}\geq\frac{f(z)-f(y)}{z-y}$である。
    reason: $f(t)=t^2$、$x=0$、$y=1$、$z=2$では左辺が$1$、右辺が$3$である。凸関数の傾きは増加する。
  target: |
    ∀ (f : ℝ → ℝ) (S : Set ℝ) (x y z : ℝ), ConvexOn ℝ S f → x ∈ S → z ∈ S → x < y → y < z → (f y - f x) / (y - x) ≤ (f z - f x) / (z - x) ∧ (f z - f x) / (z - x) ≤ (f z - f y) / (z - y)
  proof: |
    by
      intro f S x y z hf hx hz hxy hyz
      have hxz : 0 < z - x := by linarith
      have ha : 0 ≤ (z - y) / (z - x) := div_nonneg (by linarith) hxz.le
      have hb : 0 ≤ (y - x) / (z - x) := div_nonneg (by linarith) hxz.le
      have hab : (z - y) / (z - x) + (y - x) / (z - x) = 1 := by
        field_simp
        ring
      have key := hf.2 hx hz ha hb hab
      have hne : z - x ≠ 0 := hxz.ne'
      have e : ((z - y) / (z - x)) • x + ((y - x) / (z - x)) • z = y := by
        simp only [smul_eq_mul]
        field_simp
        ring
      rw [e] at key
      simp only [smul_eq_mul] at key
      have key2 : f y * (z - x) ≤ (z - y) * f x + (y - x) * f z := by
        have h1 := mul_le_mul_of_nonneg_right key hxz.le
        have e2 : ((z - y) / (z - x) * f x + (y - x) / (z - x) * f z) * (z - x) = (z - y) * f x + (y - x) * f z := by
          field_simp
        rwa [e2] at h1
      constructor
      · rw [div_le_div_iff₀ (by linarith) hxz]
        nlinarith [key2]
      · rw [div_le_div_iff₀ hxz (by linarith)]
        nlinarith [key2]
- id: convex_le_max_endpoints
  kind: gap
  level: 1
  topic: 凸関数・閉区間での最大値
  statement: $f$が$[a,b]$上の凸関数ならば、全ての$x\in[a,b]$で$f(x)\leq\max\{f(a),f(b)\}$である。
  statement_en: If f is convex on [a, b], then f(x) ≤ max(f(a), f(b)) for all x in [a, b].
  assumptions:
  - $f$は$[a,b]$上の凸関数
  - $x\in[a,b]$
  quantifiers:
  - 任意の$f$、$a$、$b$、$x$
  conclusion: $f(x)\leq\max\{f(a),f(b)\}$である。
  answer: |
    $f$を$[a,b]$上の凸関数とし、$x\in[a,b]$とする。$a=b$なら$x=a$なので$f(x)=f(a)\leq\max\{f(a),f(b)\}$である。

    $a<b$のとき、$\lambda=(b-x)/(b-a)$、$\mu=(x-a)/(b-a)$とおくと$\lambda,\mu\geq0$、$\lambda+\mu=1$、$\lambda a+\mu b=x$である。凸性から$f(x)\leq\lambda f(a)+\mu f(b)\leq(\lambda+\mu)\max\{f(a),f(b)\}=\max\{f(a),f(b)\}$である。
  strategy: Write x as a convex combination of the endpoints.
  sketch:
  - "construct: x = λa + μb with λ, μ ≥ 0 and λ + μ = 1."
  - "apply_theorem: Convexity gives f(x) ≤ λ f(a) + μ f(b)."
  - "conclude: The right side is at most max(f(a), f(b))."
  openmath: (forall (f a b x) (-> (and (convex_function_on f (closed_interval a b)) (in x (closed_interval a b))) (<= (fn_value f x) (max_of (fn_value f a) (fn_value f b)))))
  hard_negative:
    statement: $f$が$[a,b]$上の凸関数ならば、全ての$x\in[a,b]$で$f(x)\geq\min\{f(a),f(b)\}$である。
    reason: $f(x)=x^2$、$[a,b]=[-1,1]$では$f(0)=0<1=\min\{f(-1),f(1)\}$である。
  target: |
    ∀ (f : ℝ → ℝ) (a b x : ℝ), ConvexOn ℝ (Set.Icc a b) f → x ∈ Set.Icc a b → f x ≤ max (f a) (f b)
  proof: |
    by
      intro f a b x hf hx
      have hab : a ≤ b := hx.1.trans hx.2
      exact hf.le_max_of_mem_Icc (Set.left_mem_Icc.2 hab) (Set.right_mem_Icc.2 hab) hx
- id: convex_bounded_above_constant
  kind: gap
  level: 1
  topic: 凸関数・上に有界な関数
  statement: $f:\mathbb{R}\to\mathbb{R}$が凸で上に有界ならば、$f$は定数関数である。
  statement_en: A convex function on the whole real line that is bounded above is constant.
  assumptions:
  - $f:\mathbb{R}\to\mathbb{R}$は凸
  - 全ての$x$で$f(x)\leq K$
  quantifiers:
  - 任意の$f$と$K$
  conclusion: 全ての$x,y$で$f(x)=f(y)$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$を凸関数とし、全ての$x$で$f(x)\leq K$とする。$f(x)<f(y)$となる$x,y$があると仮定して矛盾を導く。

    $t=\frac{K-f(y)}{f(y)-f(x)}+1>0$、$w=y+t(y-x)$とおく。$y=\frac1{1+t}w+\frac t{1+t}x$なので、凸性から$f(y)\leq\frac1{1+t}f(w)+\frac t{1+t}f(x)$である。$1+t$を掛けて整理すると$f(w)\geq f(y)+t(f(y)-f(x))=f(y)+K-f(y)+f(y)-f(x)=K+f(y)-f(x)>K$となり、$f(w)\leq K$に矛盾する。よって全ての$x,y$で$f(y)\leq f(x)$であり、$x,y$を入れ替えると$f(x)=f(y)$である。
  strategy: If f(x) < f(y), extending the chord beyond y forces f to exceed any bound.
  sketch:
  - "setup: Suppose f(x) < f(y) and take t large and w = y + t(y-x)."
  - "derive: y is a convex combination of w and x, so f(w) ≥ f(y) + t(f(y) - f(x))."
  - "contradiction: With t = (K - f(y))/(f(y) - f(x)) + 1, this gives f(w) > K."
  - "conclude: Hence f(y) ≤ f(x) for all x, y, and f is constant."
  openmath: (forall (f K) (-> (and (convex_function_on f R) (forall (x) (<= (fn_value f x) K))) (forall (x y) (= (fn_value f x) (fn_value f y)))))
  hard_negative:
    statement: $f:\mathbb{R}\to\mathbb{R}$が凸で下に有界ならば、$f$は定数関数である。
    reason: $f(x)=x^2$は凸で$0$以上だが定数でない。
  target: |
    ∀ (f : ℝ → ℝ) (K : ℝ), ConvexOn ℝ Set.univ f → (∀ x, f x ≤ K) → ∀ x y, f x = f y
  proof: |
    by
      intro f K hf hK
      have key : ∀ x y, f y ≤ f x := by
        intro x y
        by_contra hc
        push_neg at hc
        have hd : 0 < f y - f x := by linarith
        have ht0 : 0 ≤ (K - f y) / (f y - f x) := div_nonneg (by linarith [hK y]) hd.le
        have ht : 0 < (K - f y) / (f y - f x) + 1 := by linarith
        obtain ⟨t, htdef⟩ : ∃ t, t = (K - f y) / (f y - f x) + 1 := ⟨_, rfl⟩
        rw [← htdef] at ht
        have hne : (1 : ℝ) + t ≠ 0 := by linarith
        have h1 : 0 ≤ 1 / (1 + t) := by positivity
        have h2 : 0 ≤ t / (1 + t) := by positivity
        have h3 : 1 / (1 + t) + t / (1 + t) = 1 := by
          field_simp
        have c := hf.2 (Set.mem_univ (y + t * (y - x))) (Set.mem_univ x) h1 h2 h3
        have e : (1 / (1 + t)) • (y + t * (y - x)) + (t / (1 + t)) • x = y := by
          simp only [smul_eq_mul]
          field_simp
          ring
        rw [e] at c
        simp only [smul_eq_mul] at c
        have hp : 0 < 1 + t := by linarith
        have c2 : f y * (1 + t) ≤ f (y + t * (y - x)) + t * f x := by
          have h4 := mul_le_mul_of_nonneg_right c hp.le
          have e2 : (1 / (1 + t) * f (y + t * (y - x)) + t / (1 + t) * f x) * (1 + t) = f (y + t * (y - x)) + t * f x := by
            field_simp
          rwa [e2] at h4
        have h5 := hK (y + t * (y - x))
        have h6 : t * (f y - f x) = K - f y + (f y - f x) := by
          rw [htdef]
          field_simp
        nlinarith
      intro x y
      exact le_antisymm (key y x) (key x y)
- id: convex_open_interval_continuous
  kind: textbook
  level: 1
  topic: 凸関数・開区間での連続性
  statement: 開区間$(a,b)$上の凸関数は、$(a,b)$上で連続である。
  statement_en: A convex function on an open interval (a, b) is continuous on (a, b).
  assumptions:
  - $f$は$(a,b)$上の凸関数
  quantifiers:
  - 任意の$f$、$a$、$b$
  conclusion: $f$は$(a,b)$上で連続である。
  answer: |
    $f$を$(a,b)$上の凸関数とし、$x_0\in(a,b)$とする。$a<c<p<x_0<q<d<b$となる点をとる。

    $p\leq s<t\leq q$とする。凸関数の傾きは増加するので$\frac{f(p)-f(c)}{p-c}\leq\frac{f(t)-f(s)}{t-s}\leq\frac{f(d)-f(q)}{d-q}$である。左端と右端の絶対値の大きい方を$L$とおくと、$L$は$s,t$によらず、$|f(t)-f(s)|\leq L|t-s|$である。

    よって$x\in[p,q]$で$|f(x)-f(x_0)|\leq L|x-x_0|$であり、$x\to x_0$で$f(x)\to f(x_0)$である。$x_0$は任意なので$f$は$(a,b)$上で連続である。
  strategy: Monotonicity of slopes makes f Lipschitz on compact subintervals.
  sketch:
  - "setup: Around x_0 choose a < c < p < x_0 < q < d < b."
  - "apply_theorem: Monotonicity of slopes bounds the slope between any s < t in [p, q] by the slopes on [c, p] and [q, d]."
  - "derive: So f is Lipschitz on [p, q]."
  - "conclude: f is continuous at x_0."
  openmath: (forall (f a b) (-> (convex_function_on f (open_interval a b)) (fn_continuous_on (lambda (x) (fn_value f x)) (open_interval a b))))
  hard_negative:
    statement: 閉区間$[a,b]$上の凸関数は、$[a,b]$上で連続である。
    reason: $[0,1]$上で$x<1$なら$f(x)=0$、$f(1)=1$とすると$f$は凸だが、$x=1$で不連続である。
  target: |
    ∀ (f : ℝ → ℝ) (a b : ℝ), ConvexOn ℝ (Set.Ioo a b) f → ContinuousOn f (Set.Ioo a b)
  proof: |
    by
      intro f a b hf
      exact hf.continuousOn isOpen_Ioo
- id: integral_cauchy_schwarz
  kind: gap
  level: 1
  topic: 積分の不等式・コーシー・シュワルツの不等式
  statement: $a\leq b$で$f,g$が$[a,b]$上連続ならば、$\left(\int_a^bf(x)g(x)\,dx\right)^2\leq\int_a^bf(x)^2\,dx\int_a^bg(x)^2\,dx$である。
  statement_en: If a ≤ b and f, g are continuous on [a, b], then the square of the integral of f g over [a, b] is at most the product of the integrals of f^2 and g^2.
  assumptions:
  - $a\leq b$
  - $f,g$は$[a,b]$上連続
  quantifiers:
  - 任意の$f$、$g$、$a\leq b$
  conclusion: $\left(\int_a^bfg\right)^2\leq\int_a^bf^2\int_a^bg^2$である。
  answer: |
    $a\leq b$とし、$f,g$を$[a,b]$上の連続関数とする。$A=\int_a^bf^2$、$B=\int_a^bfg$、$C=\int_a^bg^2$とおく。

    任意の実数$t$について$(tf+g)^2\geq0$なので、積分の単調性と線形性から$0\leq\int_a^b(tf(x)+g(x))^2\,dx=At^2+2Bt+C$である。

    $A>0$なら、$t=-B/A$を代入して$0\leq C-B^2/A$、すなわち$B^2\leq AC$である。$A=0$なら、全ての$t$で$2Bt+C\geq0$なので$B=0$であり、$B^2\leq AC$である。
  strategy: The integral of (t f + g)^2 is a nonnegative quadratic in t.
  sketch:
  - "setup: Put A, B, C for the integrals of f², f g and g²."
  - "derive: For all t, 0 ≤ A t² + 2 B t + C."
  - "case_split: If A > 0, take t = -B/A."
  - "case_split: If A = 0, a nonnegative affine function has slope 0, so B = 0."
  - "conclude: In both cases B² ≤ A C."
  openmath: (forall (f g a b) (-> (and (<= a b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (fn_continuous_on (lambda (x) (fn_value g x)) (closed_interval a b))) (<= (^ (interval_integral a b (lambda (x) (* (fn_value f x) (fn_value g x)))) 2) (* (interval_integral a b (lambda (x) (^ (fn_value f x) 2))) (interval_integral a b (lambda (x) (^ (fn_value g x) 2)))))))
  hard_negative:
    statement: 同じ仮定で、$\int_a^bf(x)g(x)\,dx\leq\int_a^bf(x)\,dx\int_a^bg(x)\,dx$である。
    reason: $f=g=1$、$[a,b]=[0,1/2]$では左辺が$1/2$、右辺が$1/4$である。
  target: |
    ∀ (f g : ℝ → ℝ) (a b : ℝ), a ≤ b → ContinuousOn f (Set.Icc a b) → ContinuousOn g (Set.Icc a b) → (∫ x in a..b, f x * g x) ^ 2 ≤ (∫ x in a..b, f x ^ 2) * ∫ x in a..b, g x ^ 2
  proof: |
    by
      intro f g a b hab hf hg
      have i1 : IntervalIntegrable (fun x => f x ^ 2) MeasureTheory.volume a b :=
        ContinuousOn.intervalIntegrable_of_Icc hab (hf.pow 2)
      have i2 : IntervalIntegrable (fun x => f x * g x) MeasureTheory.volume a b :=
        ContinuousOn.intervalIntegrable_of_Icc hab (hf.mul hg)
      have i3 : IntervalIntegrable (fun x => g x ^ 2) MeasureTheory.volume a b :=
        ContinuousOn.intervalIntegrable_of_Icc hab (hg.pow 2)
      have hq : ∀ t : ℝ, 0 ≤ (∫ x in a..b, f x ^ 2) * (t * t) + (2 * ∫ x in a..b, f x * g x) * t + ∫ x in a..b, g x ^ 2 := by
        intro t
        have h : 0 ≤ ∫ x in a..b, (t * t) * f x ^ 2 + (2 * t) * (f x * g x) + g x ^ 2 := by
          refine intervalIntegral.integral_nonneg hab fun x _ => ?_
          have h1 : (t * t) * f x ^ 2 + (2 * t) * (f x * g x) + g x ^ 2 = (t * f x + g x) ^ 2 := by ring
          rw [h1]
          exact sq_nonneg _
        rw [intervalIntegral.integral_add ((i1.const_mul _).add (i2.const_mul _)) i3,
          intervalIntegral.integral_add (i1.const_mul _) (i2.const_mul _),
          intervalIntegral.integral_const_mul, intervalIntegral.integral_const_mul] at h
        linarith
      have hd := discrim_le_zero hq
      unfold discrim at hd
      nlinarith [hd]
- id: integral_primitive_lipschitz
  kind: gap
  level: 1
  topic: 積分・原始関数のLipschitz評価
  statement: $f$が$[a,b]$上連続で$|f|\leq M$ならば、全ての$x,y\in[a,b]$で$\left|\int_a^xf-\int_a^yf\right|\leq M|x-y|$である。
  statement_en: If f is continuous on [a, b] with |f| ≤ M, then |∫_a^x f - ∫_a^y f| ≤ M|x - y| for all x, y in [a, b].
  assumptions:
