  topic: 一様収束・動く点での収束
  statement: $F_n,f:\mathbb{R}\to\mathbb{R}$、$S\subset\mathbb{R}$とする。$F_n$が$S$上$f$に一様収束し、$f$が$x_0$で$S$上連続で、$S$の点列が$x_n\to x_0$ならば、$F_n(x_n)\to f(x_0)$である。
