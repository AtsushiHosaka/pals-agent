    reason: $a_n=L$の定数列では$|a_n|=|L|$であり、$|a_n|>|L|$は成り立たない。
  target: |
    ∀ (a : ℕ → ℝ) (L c : ℝ), (∀ ε : ℝ, 0 < ε → ∃ K : ℕ, ∀ n, K ≤ n → |a n - L| < ε) → L ≠ 0 → 0 < c → c < 1 → ∃ K : ℕ, ∀ n, K ≤ n → c * |L| < |a n|
  proof: |
