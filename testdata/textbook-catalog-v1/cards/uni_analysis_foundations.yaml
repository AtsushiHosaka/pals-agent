    reason: $a_n=(-1)^n$では偶数番目が$1$に、奇数番目が$-1$に収束する。一意性は数列全体の極限についてのものである。
  target: |
    ∀ (a : ℕ → ℝ) (L M : ℝ), (∀ ε : ℝ, 0 < ε → ∃ K : ℕ, ∀ n, K ≤ n → |a n - L| < ε) → (∀ ε : ℝ, 0 < ε → ∃ K : ℕ, ∀ n, K ≤ n → |a n - M| < ε) → L = M
  proof: |
