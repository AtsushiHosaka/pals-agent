  conclusion: $\lim_{t\to\infty}\int_a^tf$は存在する。
  answer: |
    $f$を$[a,\infty)$で連続かつ非負とし、$F(t)=\int_a^tf\leq K$（$t\geq a$）とする。

    $a\leq s\leq t$なら$F(t)-F(s)=\int_s^tf\geq0$なので、$F$は単調非減少である。$F$は上に有界なので上限$L=\sup_{t\geq a}F(t)$が存在する。$\varepsilon>0$に対し$F(T)>L-\varepsilon$となる$T\geq a$をとると、$t\geq T$で$L-\varepsilon<F(T)\leq F(t)\leq L$である。よって$F(t)\to L$である。
