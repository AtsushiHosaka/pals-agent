  quantifiers:
  - 任意の$a>0$
  conclusion: $a^{1/(n+1)}\to1$である。
  answer: |
    $a>0$とする。

    $a\geq1$のとき、$h_n=a^{1/(n+1)}-1\geq0$とおく。ベルヌーイの不等式から$a=(1+h_n)^{n+1}\geq1+(n+1)h_n$なので、$0\leq h_n\leq(a-1)/(n+1)$である。右辺は$0$に収束するから$h_n\to0$であり、$a^{1/(n+1)}\to1$である。

    $0<a<1$のとき、$1/a>1$に前半を使うと$(1/a)^{1/(n+1)}\to1$である。その逆数をとると$a^{1/(n+1)}\to1$である。
