  answer: |
    $S\subset\mathbb{R}$を空でない閉集合とし、$a$をその上限とする。

    各自然数$n$について、$a-1/(n+1)$は$a$より小さいので$S$の上界ではない。よって$a-1/(n+1)<x_n$となる$x_n\in S$がとれる。$x_n\leq a$でもあるから$|x_n-a|<1/(n+1)$であり、$x_n\to a$となる。$S$は閉集合なので、$S$の点列の極限$a$も$S$に属する。
