- id: totally_bounded_cauchy_subsequence
  kind: textbook
  level: 3
  topic: 距離空間・全有界集合の点列
  statement: 距離空間の全有界な部分集合$S$の点列は、コーシー列である部分列をもつ。
  statement_en: Every sequence in a totally bounded subset of a metric space has a Cauchy subsequence.
  assumptions:
  - $X$は距離空間、$S\subset X$は全有界
  - 全ての$n$で$x_n\in S$
  quantifiers:
  - 任意の$X$、$S$、$(x_n)$
  conclusion: 狭義単調増加な$p$があり、$(x_{p(n)})$はコーシー列である。
  answer: |
    $X$を距離空間、$S\subset X$を全有界、$(x_n)$を$S$の点列とする。

    $N_{-1}=\mathbb{N}$とする。$k\geq0$で無限集合$N_{k-1}\subset\mathbb{N}$が定まったとする。全有界性から$S$は半径$1/(k+1)$の有限個の開球で覆われる。$n\in N_{k-1}$は無限個あるので、ある開球$B_k$には無限個の$n\in N_{k-1}$について$x_n$が入る。そのような$n$全体を$N_k$とする。

    $p(0)\in N_0$をとり、$p(k+1)\in N_{k+1}$を$p(k+1)>p(k)$となるように選ぶ。$N_k$は無限集合なので選べる。$j\geq k$なら$p(j)\in N_j\subset N_k$なので$x_{p(j)}\in B_k$である。よって$i,j\geq k$なら$d(x_{p(i)},x_{p(j)})<2/(k+1)$であり、$(x_{p(n)})$はコーシー列である。
  strategy: Choose nested infinite index sets by the pigeonhole principle with shrinking radii and take a diagonal subsequence.
  sketch:
  - "construct: For each k cover S by finitely many balls of radius 1/(k+1)."
  - "derive: The pigeonhole principle gives nested infinite index sets N_k with x_n in one ball B_k."
  - "construct: Choose increasing p(k) in N_k."
  - "conclude: For i, j ≥ k, d(x_{p(i)}, x_{p(j)}) < 2/(k+1), so the subsequence is Cauchy."
  openmath: (forall (X S x) (-> (and (metric_space X) (totally_bounded_in X S) (forall (n) (in (seq_value x n) S))) (exists (p) (and (strict_mono_index p) (forall (e) (-> (> e 0) (exists (K) (forall (i j) (-> (and (>= i K) (>= j K)) (< (dist_of (seq_value x (fn_value p i)) (seq_value x (fn_value p j))) e))))))))))
  hard_negative:
    statement: 距離空間の有界な部分集合の点列は、コーシー列である部分列をもつ。
    reason: 無限集合に異なる2点の距離を$1$とする離散距離を入れると全体は有界だが、相異なる点の列にはコーシーな部分列がない。
  target: |
    ∀ (X : Type*) [MetricSpace X] (S : Set X) (x : ℕ → X), TotallyBounded S → (∀ n, x n ∈ S) → ∃ p : ℕ → ℕ, StrictMono p ∧ CauchySeq (fun n => x (p n))
  proof: |
    by
      intro X _ S x hS hx
      have hT : TotallyBounded ((fun y : X => (y : UniformSpace.Completion X)) '' S) :=
        hS.image (UniformSpace.Completion.uniformContinuous_coe X)
      have hK : IsCompact (closure ((fun y : X => (y : UniformSpace.Completion X)) '' S)) :=
        hT.closure.isCompact_of_isClosed isClosed_closure
      obtain ⟨a, _, p, hp, h⟩ := hK.tendsto_subseq (x := fun n => ((x n : X) : UniformSpace.Completion X))
        (fun n => subset_closure ⟨x n, hx n, rfl⟩)
      refine ⟨p, hp, ?_⟩
      have hc := h.cauchySeq
      rw [Metric.cauchySeq_iff] at hc ⊢
      intro ε hε
      obtain ⟨K, hK'⟩ := hc ε hε
      refine ⟨K, fun m hm n hn => ?_⟩
      have h1 := hK' m hm n hn
      simpa [UniformSpace.Completion.dist_eq] using h1
- id: continuous_image_seq_compact
  kind: gap
  level: 2
  topic: 距離空間・点列コンパクト性と連続写像
  statement: 距離空間の間の連続写像$f:X\to Y$について、$S\subset X$が点列コンパクトならば、像$f(S)$も点列コンパクトである。
  statement_en: For a continuous map f between metric spaces, if S is sequentially compact, then the image f(S) is sequentially compact.
  assumptions:
  - $X,Y$は距離空間、$f:X\to Y$は連続
  - $S\subset X$は点列コンパクト
  quantifiers:
  - 任意の$X$、$Y$、$f$、$S$
  conclusion: $f(S)$は点列コンパクトである。
  answer: |
    $f:X\to Y$を距離空間の間の連続写像、$S\subset X$を点列コンパクトとする。$(y_n)$を$f(S)$の点列とする。

    各$n$で$y_n=f(x_n)$となる$x_n\in S$を選ぶ。$S$は点列コンパクトなので、狭義単調増加な$p$と$a\in S$があり$x_{p(n)}\to a$である。$f$は連続なので$y_{p(n)}=f(x_{p(n)})\to f(a)\in f(S)$である。よって$f(S)$は点列コンパクトである。
  strategy: Lift the sequence to S, extract a convergent subsequence and apply f.
  sketch:
  - "construct: Choose preimages x_n in S of the given points y_n."
  - "apply_theorem: Sequential compactness gives x_{p(n)} → a in S."
  - "conclude: Continuity gives y_{p(n)} → f(a), which lies in f(S)."
  openmath: (forall (X Y f S) (-> (and (metric_space X) (metric_space Y) (continuous_map f) (sequentially_compact_in X S)) (sequentially_compact_in Y (image_of f S))))
  hard_negative:
    statement: 連続写像による点列コンパクト集合の逆像は点列コンパクトである。
    reason: 定数写像$f:\mathbb{R}\to\mathbb{R}$、$f(x)=0$で$\{0\}$は点列コンパクトだが、逆像$\mathbb{R}$は点列コンパクトでない。
  target: |
    ∀ (X Y : Type*) [MetricSpace X] [MetricSpace Y] (f : X → Y) (S : Set X), Continuous f → IsSeqCompact S → IsSeqCompact (f '' S)
  proof: |
    by
      intro X Y _ _ f S hf hS y hy
      choose x hxS hxy using hy
      obtain ⟨a, ha, p, hp, h⟩ := hS hxS
      refine ⟨f a, ⟨a, ha, rfl⟩, p, hp, ?_⟩
      have h1 := (hf.tendsto a).comp h
      refine h1.congr fun n => ?_
      simp [Function.comp, hxy]
- id: compact_nested_nonempty
  kind: gap
  level: 2
  topic: 距離空間・コンパクト集合の縮小列
  statement: 距離空間の空でないコンパクト集合の減少列$K_0\supset K_1\supset\cdots$の共通部分は空でない。
  statement_en: The intersection of a decreasing sequence of nonempty compact subsets of a metric space is nonempty.
  assumptions:
  - $X$は距離空間
  - 各$K_n$は空でないコンパクト集合で$K_{n+1}\subset K_n$
  quantifiers:
  - 任意の$X$と$(K_n)$
  conclusion: $\bigcap_nK_n$は空でない。
  answer: |
    $X$を距離空間とし、各$K_n$を空でないコンパクト集合で$K_{n+1}\subset K_n$とする。コンパクト集合は閉集合なので、$U_n=X\setminus K_n$は開集合である。

    $\bigcap_nK_n=\emptyset$と仮定する。このとき$(U_n)$は$X$を覆うので、特に$K_0$の開被覆である。$K_0$はコンパクトなので、有限個の$U_{n_1},\dots,U_{n_k}$で覆われる。$K_n$は減少列なので$U_n$は増加列であり、$N=\max\{n_1,\dots,n_k\}$とおくと$K_0\subset U_N$である。

    一方$K_N\subset K_0$であり、$K_N$は空でないので$x\in K_N$がとれる。$x\in K_0\subset U_N=X\setminus K_N$となり、矛盾する。よって$\bigcap_nK_n$は空でない。
  strategy: If the intersection were empty, the complements would form an increasing open cover of K_0, and a finite subcover contradicts nonemptiness.
  sketch:
  - "setup: The complements U_n of K_n are open and increasing."
  - "derive: If the intersection is empty, the U_n cover K_0."
  - "apply_theorem: Compactness gives a finite subcover, hence K_0 ⊂ U_N for some N."
  - "contradiction: A point of the nonempty set K_N ⊂ K_0 would lie outside U_N."
  openmath: (forall (X K) (-> (and (metric_space X) (forall (n) (and (compact_set (seq_value K n)) (exists (x) (in x (seq_value K n))) (subset (seq_value K (+ n 1)) (seq_value K n))))) (exists (a) (forall (n) (in a (seq_value K n))))))
  hard_negative:
    statement: 距離空間の空でない閉集合の減少列の共通部分は空でない。
    reason: $\mathbb{R}$で$K_n=[n,\infty)$は空でない閉集合の減少列だが、共通部分は空である。
  target: |
    ∀ (X : Type*) [MetricSpace X] (K : ℕ → Set X), (∀ n, IsCompact (K n)) → (∀ n, (K n).Nonempty) → (∀ n, K (n + 1) ⊆ K n) → (⋂ n, K n).Nonempty
  proof: |
    by
      intro X _ K hc hn hd
      exact IsCompact.nonempty_iInter_of_sequence_nonempty_isCompact_isClosed K hd hn (hc 0) fun n => (hc n).isClosed
- id: closure_iff_inf_dist_zero
  kind: gap
  level: 2
  topic: 距離空間・閉包と点と集合の距離
  statement: 距離空間$X$の空でない部分集合$S$と$x\in X$について、$x$が$S$の閉包に属することと$d(x,S)=\inf_{s\in S}d(x,s)=0$は同値である。
  statement_en: For a nonempty subset S of a metric space and a point x, x lies in the closure of S if and only if the distance from x to S, the infimum of d(x, s) over s in S, is 0.
  assumptions:
  - $X$は距離空間、$S\subset X$は空でない
  quantifiers:
  - 任意の$X$、$S$、$x$
  conclusion: $x\in\overline S$と$d(x,S)=0$は同値である。
  answer: |
    $X$を距離空間、$S\subset X$を空でない集合、$x\in X$とする。

    $x\in\overline S$とする。任意の$\varepsilon>0$で$B(x,\varepsilon)$は$S$と交わるので、$d(x,s)<\varepsilon$となる$s\in S$がある。よって$0\leq d(x,S)<\varepsilon$であり、$d(x,S)=0$である。

    逆に$d(x,S)=0$とする。$\varepsilon>0$をとると、下限の性質から$d(x,s)<\varepsilon$となる$s\in S$がある。よって$B(x,\varepsilon)$は$S$と交わる。$\varepsilon$は任意なので$x\in\overline S$である。
  strategy: Translate meeting every ball into the infimum condition.
  sketch:
  - "derive: If x is in the closure, each ball around x meets S, so the infimum is below every ε > 0."
  - "derive: If the infimum is 0, each ε > 0 admits s in S with d(x, s) < ε."
  - "conclude: So every ball around x meets S."
  openmath: (forall (X S x) (-> (and (metric_space X) (exists (s) (in s S))) (<-> (in x (closure_of S)) (= (dist_to_set x S) 0))))
  hard_negative:
    statement: $d(x,S)=0$ならば$x\in S$である。
    reason: $S=(0,1)$、$x=0$では$d(x,S)=0$だが$0\notin S$である。閉包に属するだけである。
  target: |
    ∀ (X : Type*) [MetricSpace X] (S : Set X) (x : X), S.Nonempty → (x ∈ closure S ↔ Metric.infDist x S = 0)
  proof: |
    by
      intro X _ S x hS
      exact Metric.mem_closure_iff_infDist_zero hS
- id: contraction_apriori_estimate
  kind: gap
  level: 2
  topic: 距離空間・縮小写像の事前評価
  statement: 距離空間上の写像$T$が$0\leq K<1$で$d(T(u),T(v))\leq Kd(u,v)$を満たし、$T(a)=a$ならば、全ての$x$と自然数$n$で$d(T^n(x),a)\leq\frac{K^n}{1-K}d(x,T(x))$である。
  statement_en: If a map T on a metric space satisfies d(T(u), T(v)) ≤ K d(u, v) with 0 ≤ K < 1 and T(a) = a, then d(T^n(x), a) ≤ K^n/(1-K) d(x, T(x)) for all x and all natural numbers n.
  assumptions:
  - $X$は距離空間、$0\leq K<1$
  - 全ての$u,v$で$d(T(u),T(v))\leq Kd(u,v)$
  - $T(a)=a$
  quantifiers:
  - 任意の$X$、$T$、$K$、$a$、$x$、自然数$n$
  conclusion: $d(T^n(x),a)\leq\frac{K^n}{1-K}d(x,T(x))$である。
  answer: |
    $X$を距離空間、$0\leq K<1$、$T$を$d(T(u),T(v))\leq Kd(u,v)$を満たす写像、$T(a)=a$とする。$x\in X$をとる。

    三角不等式から$d(x,a)\leq d(x,T(x))+d(T(x),T(a))\leq d(x,T(x))+Kd(x,a)$なので、$d(x,a)\leq\frac1{1-K}d(x,T(x))$である。

    $n$についての帰納法で$d(T^n(x),a)\leq K^nd(x,a)$を示す。$n=0$では等号である。$n$で成り立つなら、$T(a)=a$より$d(T^{n+1}(x),a)=d(T(T^n(x)),T(a))\leq Kd(T^n(x),a)\leq K^{n+1}d(x,a)$である。

    二つの評価を合わせると主張を得る。
  strategy: Bound d(x, a) by the first step and use geometric decay under iteration.
  sketch:
  - "derive: d(x, a) ≤ d(x, T x) + K d(x, a), so d(x, a) ≤ d(x, T x)/(1-K)."
  - "induction: d(T^n x, a) ≤ K^n d(x, a)."
  - "conclude: Combining the two bounds gives the estimate."
  openmath: (forall (X f K a x n) (-> (and (metric_space X) (in n N) (<= 0 K) (< K 1) (forall (u v) (<= (dist_of (fn_value f u) (fn_value f v)) (* K (dist_of u v)))) (= (fn_value f a) a)) (<= (dist_of (iterate_of f n x) a) (* (/ (^ K n) (- 1 K)) (dist_of x (fn_value f x))))))
  hard_negative:
    statement: $K=1$でも、$d(T(u),T(v))\leq d(u,v)$と$T(a)=a$から$T^n(x)\to a$である。
    reason: $T(x)=-x$、$a=0$は等長で$T(0)=0$だが、$x\neq0$で$T^n(x)$は$x$と$-x$を往復して収束しない。
  target: |
    ∀ (X : Type*) [MetricSpace X] (T : X → X) (K : ℝ) (a x : X) (n : ℕ), 0 ≤ K → K < 1 → (∀ u v, dist (T u) (T v) ≤ K * dist u v) → T a = a → dist (T^[n] x) a ≤ K ^ n / (1 - K) * dist x (T x)
  proof: |
    by
      intro X _ T K a x n hK0 hK1 h ha
      have hpos : 0 < 1 - K := by linarith
      have h1 : dist x a ≤ dist x (T x) / (1 - K) := by
        rw [le_div_iff₀ hpos]
        have t := dist_triangle x (T x) a
        have h2 := h x a
        rw [ha] at h2
        linarith
      have h2 : ∀ m : ℕ, dist (T^[m] x) a ≤ K ^ m * dist x a := by
        intro m
        induction m with
        | zero => simp
        | succ m ih =>
          rw [Function.iterate_succ_apply']
          have h3 := h (T^[m] x) a
          rw [ha] at h3
          have h4 := mul_le_mul_of_nonneg_left ih hK0
          rw [pow_succ]
          nlinarith
      have h3 := mul_le_mul_of_nonneg_left h1 (pow_nonneg hK0 n)
      have e : K ^ n * (dist x (T x) / (1 - K)) = K ^ n / (1 - K) * dist x (T x) := by ring
      linarith [h2 n]
- id: contraction_iterate_power
  kind: textbook
  level: 3
  topic: 距離空間・反復が縮小写像となる写像
  statement: 空でない完備距離空間上の写像$T$について、ある$m\geq1$と$0\leq K<1$で$T^m$が$d(T^m(u),T^m(v))\leq Kd(u,v)$を満たすならば、$T$はただ1つの不動点をもつ。$T$自身は縮小写像でなくてよい。
  statement_en: If T is a map on a nonempty complete metric space and for some m ≥ 1 and 0 ≤ K < 1 the iterate T^m satisfies d(T^m(u), T^m(v)) ≤ K d(u, v), then T has exactly one fixed point; T itself need not be a contraction.
  assumptions:
  - $X$は空でない完備距離空間
  - $m\geq1$、$0\leq K<1$
  - 全ての$u,v$で$d(T^m(u),T^m(v))\leq Kd(u,v)$
  quantifiers:
  - 任意の$X$、$T$、$m$、$K$
  conclusion: $T(a)=a$となる$a$がただ1つ存在する。
  answer: |
    $X$を空でない完備距離空間、$T:X\to X$とし、$m\geq1$、$0\leq K<1$で$T^m$が定数$K$の縮小写像とする。

    バナッハの不動点定理から、$T^m$は不動点$a$をただ1つもつ。$T^m(T(a))=T(T^m(a))=T(a)$なので、$T(a)$も$T^m$の不動点である。一意性から$T(a)=a$である。

    $T(b)=b$なら$T^m(b)=b$なので、$T^m$の不動点の一意性から$b=a$である。
  strategy: The fixed point of T^m is mapped by T to another fixed point of T^m, so uniqueness forces it to be fixed by T.
  sketch:
  - "apply_theorem: Banach's fixed point theorem gives a unique fixed point a of T^m."
  - "derive: T^m(T a) = T(T^m a) = T a, so T a is also fixed by T^m."
  - "derive: Uniqueness gives T a = a."
  - "conclude: Every fixed point of T is fixed by T^m, so it equals a."
  openmath: (forall (X f m K) (-> (and (metric_space X) (complete_space X) (!= X emptyset) (in m N) (>= m 1) (<= 0 K) (< K 1) (forall (u v) (<= (dist_of (iterate_of f m u) (iterate_of f m v)) (* K (dist_of u v))))) (exists (a) (and (= (fn_value f a) a) (forall (b) (-> (= (fn_value f b) b) (= b a)))))))
  hard_negative:
    statement: $T^m$が不動点をもてば、$T$も不動点をもつ。
    reason: $X=\{0,1\}$で$T(0)=1$、$T(1)=0$とすると、$T^2$は恒等写像で不動点をもつが、$T$は不動点をもたない。
  target: |
    ∀ (X : Type*) [MetricSpace X] [CompleteSpace X] [Nonempty X] (T : X → X) (m : ℕ) (K : ℝ), 0 < m → 0 ≤ K → K < 1 → (∀ u v, dist (T^[m] u) (T^[m] v) ≤ K * dist u v) → ∃ a : X, T a = a ∧ ∀ b, T b = b → b = a
  proof: |
    by
      intro X _ _ _ T m K _ hK0 hK1 h
      have hc : ContractingWith K.toNNReal (T^[m]) := by
        refine ⟨by simpa using hK1, LipschitzWith.of_dist_le_mul fun u v => ?_⟩
        rw [Real.coe_toNNReal K hK0]
        exact h u v
      have hp : Function.IsFixedPt (T^[m]) (hc.fixedPoint) := hc.fixedPoint_isFixedPt
      have hT : Function.IsFixedPt (T^[m]) (T hc.fixedPoint) := by
        show T^[m] (T hc.fixedPoint) = T hc.fixedPoint
        rw [← Function.iterate_succ_apply, Function.iterate_succ_apply', hp]
      refine ⟨hc.fixedPoint, hc.fixedPoint_unique hT, fun b hb => ?_⟩
      exact hc.fixedPoint_unique (Function.iterate_fixed hb m)
- id: discrete_cauchy_eventually_constant
  kind: gap
  level: 2
  topic: 距離空間・一様に離れた点からなる空間のコーシー列
  statement: 距離空間$X$と$c>0$について、相異なる2点の距離が常に$c$以上ならば、$X$のコーシー列はある番号から先で定数である。
  statement_en: If c > 0 and any two distinct points of a metric space are at distance at least c, then every Cauchy sequence is eventually constant.
  assumptions:
  - $c>0$
  - $u\neq v$なら$d(u,v)\geq c$
  - $(x_n)$はコーシー列
  quantifiers:
  - 任意の$X$、$c>0$、$(x_n)$
  conclusion: $K$があり、$n\geq K$で$x_n=x_K$である。
  answer: |
    $X$を距離空間、$c>0$とし、$u\neq v$なら$d(u,v)\geq c$とする。$(x_n)$をコーシー列とする。

    $\varepsilon=c$に対し$K$があり、$m,n\geq K$なら$d(x_m,x_n)<c$である。$n\geq K$で$x_n\neq x_K$なら$d(x_n,x_K)\geq c$となり矛盾する。よって$n\geq K$で$x_n=x_K$である。
  strategy: Apply the Cauchy condition with ε = c.
  sketch:
  - "setup: Take K for ε = c."
  - "contradiction: If x_n ≠ x_K with n ≥ K, then d(x_n, x_K) ≥ c, against the Cauchy condition."
  - "conclude: The sequence is constant from K on."
  openmath: (forall (X c x) (-> (and (metric_space X) (> c 0) (forall (u v) (-> (!= u v) (>= (dist_of u v) c))) (cauchy_seq X x)) (exists (K) (forall (n) (-> (>= n K) (= (seq_value x n) (seq_value x K)))))))
  hard_negative:
    statement: 相異なる2点の距離が常に正であれば、コーシー列は最終的に定数である。
    reason: 距離空間では相異なる2点の距離は常に正だが、$\mathbb{R}$の$x_n=1/(n+1)$はコーシー列で定数にならない。共通の下界$c>0$が必要である。
  target: |
    ∀ (X : Type*) [MetricSpace X] (c : ℝ) (x : ℕ → X), 0 < c → (∀ u v : X, u ≠ v → c ≤ dist u v) → CauchySeq x → ∃ K : ℕ, ∀ n, K ≤ n → x n = x K
  proof: |
    by
      intro X _ c x hc h hx
      obtain ⟨K, hK⟩ := Metric.cauchySeq_iff.1 hx c hc
      refine ⟨K, fun n hn => ?_⟩
      by_contra hne
      have h1 := h _ _ hne
      have h2 := hK n hn K le_rfl
      linarith
