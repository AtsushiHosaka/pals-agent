    $\varepsilon=|L-M|/2>0$とおく。ある$K_1,K_2$があり、$n\geq K_1$なら$|a_n-L|<\varepsilon$、$n\geq K_2$なら$|a_n-M|<\varepsilon$である。$n=\max\{K_1,K_2\}$とすると、$|L-M|\leq|L-a_n|+|a_n-M|<2\varepsilon=|L-M|$となり矛盾する。よって$L=M$である。
