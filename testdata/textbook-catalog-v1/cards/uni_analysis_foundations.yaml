  target: |
    ∀ (S : Set ℝ) (a : ℝ), IsClosed S → S.Nonempty → IsLUB S a → a ∈ S
  proof: |
    by
      intro S a hc hne h
      exact h.mem_of_isClosed hne hc
- id: nested_intervals_unique_point
  kind: gap
  level: 1
  topic: 実数の完備性・区間縮小法
  statement: 単調非減少な実数列$(a_n)$と単調非増加な実数列$(b_n)$が全ての$n$で$a_n\leq b_n$を満たし、$b_n-a_n\to0$ならば、全ての区間$[a_n,b_n]$に属する実数はちょうど1つ存在し、$a_n$と$b_n$はともにその実数に収束する。
  statement_en: If a is nondecreasing, b is nonincreasing, a_n ≤ b_n for all n and b_n - a_n → 0, then exactly one real x lies in every interval [a_n, b_n], and both a_n and b_n converge to x.
  assumptions:
  - $(a_n)$は単調非減少、$(b_n)$は単調非増加
  - 全ての$n$で$a_n\leq b_n$
  - $b_n-a_n\to0$
  quantifiers:
  - 任意の$(a_n)$、$(b_n)$
  conclusion: 全ての$[a_n,b_n]$に属する実数$x$がただ1つ存在し、$a_n\to x$、$b_n\to x$である。
  answer: |
    $(a_n)$を単調非減少、$(b_n)$を単調非増加な実数列とし、全ての$n$で$a_n\leq b_n$、$b_n-a_n\to0$とする。

    全ての$n$で$a_n\leq b_n\leq b_0$なので$(a_n)$は上に有界である。単調収束定理から$(a_n)$は上限$x$に収束し、全ての$n$で$a_n\leq x$である。$b_n=(b_n-a_n)+a_n\to0+x=x$であり、$(b_n)$は単調非増加だから全ての$n$で$x\leq b_n$である。よって$x$は全ての$[a_n,b_n]$に属する。

    $y$も全ての$[a_n,b_n]$に属するとする。$a_n\leq y\leq b_n$で$n\to\infty$とすると$x\leq y\leq x$となり、$y=x$である。
  strategy: Take the limit of the increasing endpoints and use the vanishing lengths for the rest.
  sketch:
  - "apply_theorem: a is nondecreasing and bounded above by b_0, so it converges to its supremum x."
  - "derive: b_n = (b_n - a_n) + a_n converges to x as well."
  - "derive: Monotonicity gives a_n ≤ x ≤ b_n for all n."
  - "conclude: Any y in all the intervals satisfies x ≤ y ≤ x in the limit, so y = x."
  openmath: (forall (a b) (-> (and (seq_monotone a) (seq_antitone b) (forall (n) (<= (seq_value a n) (seq_value b n))) (seq_fn_tends_to (lambda (n) (- (seq_value b n) (seq_value a n))) 0)) (exists (x) (and (forall (n) (and (<= (seq_value a n) x) (<= x (seq_value b n)))) (forall (y) (-> (forall (n) (and (<= (seq_value a n) y) (<= y (seq_value b n)))) (= y x))) (seq_tends_to a x) (seq_tends_to b x)))))
  hard_negative:
    statement: 開区間$(a_n,b_n)$が縮小し$b_n-a_n\to0$ならば、全ての開区間に属する実数がただ1つ存在する。
    reason: $a_n=0$、$b_n=1/(n+1)$とすると、全ての$(0,1/(n+1))$に属する実数は存在しない。閉区間であることが必要である。
  target: |
    ∀ a b : ℕ → ℝ, Monotone a → Antitone b → (∀ n, a n ≤ b n) → Filter.Tendsto (fun n => b n - a n) Filter.atTop (nhds 0) → ∃ x : ℝ, (∀ n, a n ≤ x ∧ x ≤ b n) ∧ (∀ y : ℝ, (∀ n, a n ≤ y ∧ y ≤ b n) → y = x) ∧ Filter.Tendsto a Filter.atTop (nhds x) ∧ Filter.Tendsto b Filter.atTop (nhds x)
  proof: |
    by
      intro a b ha hb hab hlen
      have hbdd : BddAbove (Set.range a) :=
        ⟨b 0, by
          rintro _ ⟨n, rfl⟩
          exact (hab n).trans (hb (Nat.zero_le n))⟩
      have hax : Filter.Tendsto a Filter.atTop (nhds (⨆ n, a n)) := tendsto_atTop_ciSup ha hbdd
      have hbx : Filter.Tendsto b Filter.atTop (nhds (⨆ n, a n)) := by
        have h := hlen.add hax
        simpa using h
      refine ⟨⨆ n, a n, fun n => ⟨le_ciSup hbdd n, hb.le_of_tendsto hbx n⟩, fun y hy => ?_, hax, hbx⟩
      exact le_antisymm (ge_of_tendsto' hbx fun n => (hy n).2) (le_of_tendsto' hax fun n => (hy n).1)
