  hard_negative:
    statement: 実数$a<b$に対して、$a<x<b$を満たす無理数は有限個である。
    reason: $a<b$の間には無理数が無限個ある。たとえば$(a,b)$内の無理数$x$をとれば、$(a,x)$の中に別の無理数がとれることを繰り返せる。
  target: |
