    reason: $f_n(x)=1/(n+1)$は定数列として$0$に一様収束するが、級数は発散する。
  target: |
    ∀ (f : ℕ → ℝ → ℝ) (g : ℝ → ℝ) (S : Set ℝ), TendstoUniformlyOn (fun (N : ℕ) (x : ℝ) => ∑ i ∈ Finset.range N, f i x) g Filter.atTop S → TendstoUniformlyOn f (fun _ => 0) Filter.atTop S
  proof: |
