- id: integral_series_sandwich
  kind: gap
  level: 1
  topic: 級数と積分・単調減少関数の評価
  statement: 連続関数$f$が区間$[x_0,x_0+n]$（$n$は自然数）で単調非増加ならば、$\sum_{i=1}^nf(x_0+i)\leq\int_{x_0}^{x_0+n}f(x)\,dx\leq\sum_{i=0}^{n-1}f(x_0+i)$である。
  statement_en: If a continuous function f is nonincreasing on [x_0, x_0 + n] with n natural, then the sum of f(x_0 + i) over 1 ≤ i ≤ n is at most the integral of f over [x_0, x_0 + n], which is at most the sum of f(x_0 + i) over 0 ≤ i ≤ n - 1.
  assumptions:
  - $f$は$[x_0,x_0+n]$で連続かつ単調非増加
  quantifiers:
  - 任意の$f$、$x_0$、自然数$n$
  conclusion: $\sum_{i=1}^nf(x_0+i)\leq\int_{x_0}^{x_0+n}f\leq\sum_{i=0}^{n-1}f(x_0+i)$である。
  answer: |
    $f$を$[x_0,x_0+n]$で連続かつ単調非増加な関数とする。

    $0\leq i<n$とする。$x\in[x_0+i,x_0+i+1]$では$f(x_0+i+1)\leq f(x)\leq f(x_0+i)$である。この区間で積分すると、区間の長さは$1$なので$f(x_0+i+1)\leq\int_{x_0+i}^{x_0+i+1}f(x)\,dx\leq f(x_0+i)$となる。$i=0,\dots,n-1$について足し合わせると、積分の加法性から主張を得る。
