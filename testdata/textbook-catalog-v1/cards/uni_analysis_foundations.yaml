  sketch:
  - "setup: Suppose L ≠ M and put ε = |L - M|/2 > 0."
  - "derive: At n = max(K_1, K_2), both |a_n - L| and |a_n - M| are below ε."
  - "contradiction: The triangle inequality gives |L - M| < |L - M|."
