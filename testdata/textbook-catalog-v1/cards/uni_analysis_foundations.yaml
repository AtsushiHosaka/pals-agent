        have e : f x - L = (f x - f (a + 1 / (((max N₁ N₂ : ℕ) : ℝ) + 1))) + (f (a + 1 / (((max N₁ N₂ : ℕ) : ℝ) + 1)) - L) := by ring
        rw [e]
        calc _ ≤ _ := abs_add_le _ _
          _ < ε := by linarith
- id: dirichlet_nowhere_continuous
  kind: textbook
  level: 1
  topic: 連続性・有理数と無理数で値を変える関数
  statement: 関数$f:\mathbb{R}\to\mathbb{R}$が有理数で$1$、無理数で$0$をとるならば、$f$はどの点でも連続でない。
  statement_en: A function on the reals that equals 1 at every rational and 0 at every irrational is continuous at no point.
  assumptions:
  - $f:\mathbb{R}\to\mathbb{R}$
  - 有理数$q$で$f(q)=1$
  - 無理数$x$で$f(x)=0$
  quantifiers:
  - 任意の$f$と任意の$a\in\mathbb{R}$
  conclusion: $f$は$a$で連続でない。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$を、有理数で$1$、無理数で$0$をとる関数とする。ある$a\in\mathbb{R}$で$f$が連続であると仮定して矛盾を導く。

    $\varepsilon=1/2$に対して$\delta>0$があり、$|x-a|<\delta$なら$|f(x)-f(a)|<1/2$である。区間$(a,a+\delta)$は有理数$q$と無理数$u$を含む。すると$|1-f(a)|<1/2$かつ$|0-f(a)|<1/2$なので、三角不等式から$1=|1-0|\leq|1-f(a)|+|f(a)-0|<1$となり矛盾する。
  strategy: Every interval contains both a rational and an irrational, whose values differ by 1.
  sketch:
  - "contradiction: Assume continuity at a and take δ for ε = 1/2."
  - "apply_theorem: The interval (a, a+δ) contains a rational q and an irrational u."
  - "derive: Then |1 - f(a)| < 1/2 and |f(a)| < 1/2."
  - "conclude: The triangle inequality gives 1 < 1."
  openmath: (forall (f a) (-> (and (forall (x) (-> (in x Q) (= (fn_value f x) 1))) (forall (x) (-> (notin x Q) (= (fn_value f x) 0)))) (not (fn_continuous_at (lambda (x) (fn_value f x)) a))))
  hard_negative:
    statement: 有理数$x$で$f(x)=x$、無理数$x$で$f(x)=0$となる関数も、どの点でも連続でない。
    reason: この$f$は全ての$x$で$|f(x)|\leq|x|$を満たすので、$0$で連続である。
  target: |
    ∀ f : ℝ → ℝ, (∀ q : ℚ, f (q : ℝ) = 1) → (∀ x : ℝ, Irrational x → f x = 0) → ∀ a : ℝ, ¬ ContinuousAt f a
  proof: |
    by
      intro f hq hi a hc
      obtain ⟨δ, hδ, h⟩ := Metric.continuousAt_iff.1 hc (1 / 2) (by norm_num)
      have ha : a < a + δ := by linarith
      obtain ⟨q, h1, h2⟩ := exists_rat_btwn ha
      obtain ⟨u, hu, h3, h4⟩ := exists_irrational_btwn ha
      have b1 := h (x := (q : ℝ)) (by rw [Real.dist_eq, abs_lt]; constructor <;> linarith)
      have b2 := h (x := u) (by rw [Real.dist_eq, abs_lt]; constructor <;> linarith)
      rw [hq, Real.dist_eq, abs_lt] at b1
      rw [hi u hu, Real.dist_eq, abs_lt] at b2
      linarith [b1.1, b1.2, b2.1, b2.2]
- id: uniform_continuous_maps_cauchy
  kind: gap
  level: 1
  topic: 一様連続性・コーシー列の像
  statement: $f:\mathbb{R}\to\mathbb{R}$が$\varepsilon$-$\delta$の意味で一様連続で、$(a_n)$が$\varepsilon$-$N$の意味でコーシー列ならば、$(f(a_n))$もコーシー列である。
  statement_en: If f on the reals is uniformly continuous in the ε-δ sense and a is a Cauchy sequence in the ε-N sense, then f(a_n) is a Cauchy sequence.
  assumptions:
  - 任意の$\varepsilon>0$に対してある$\delta>0$があり、$|x-y|<\delta$なら$|f(x)-f(y)|<\varepsilon$
  - 任意の$\varepsilon>0$に対してある$N$があり、$m,n\geq N$なら$|a_m-a_n|<\varepsilon$
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$と実数列$(a_n)$
  conclusion: 任意の$\varepsilon>0$に対してある$N$があり、$m,n\geq N$なら$|f(a_m)-f(a_n)|<\varepsilon$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$を一様連続な関数、$(a_n)$をコーシー列とする。

    $\varepsilon>0$を任意にとる。一様連続性から$\delta>0$があり、$|x-y|<\delta$なら$|f(x)-f(y)|<\varepsilon$である。コーシー列の定義を$\delta$に適用するとある$N$があり、$m,n\geq N$なら$|a_m-a_n|<\delta$である。したがって$m,n\geq N$なら$|f(a_m)-f(a_n)|<\varepsilon$となる。
  strategy: Feed the δ from uniform continuity into the Cauchy condition.
  sketch:
  - "setup: Fix ε > 0 and take δ from uniform continuity."
  - "apply_theorem: Take N from the Cauchy condition at level δ."
  - "conclude: For m, n ≥ N, |f(a_m) - f(a_n)| < ε."
  openmath: (forall (f a) (-> (and (forall (e) (-> (> e 0) (exists (d) (and (> d 0) (forall (x y) (-> (< (abs (- x y)) d) (< (abs (- (fn_value f x) (fn_value f y))) e))))))) (forall (e) (-> (> e 0) (exists (M) (forall (m n) (-> (and (>= m M) (>= n M)) (< (abs (- (seq_value a m) (seq_value a n))) e))))))) (forall (e) (-> (> e 0) (exists (M) (forall (m n) (-> (and (>= m M) (>= n M)) (< (abs (- (fn_value f (seq_value a m)) (fn_value f (seq_value a n)))) e))))))))
  hard_negative:
    statement: 区間$(0,1)$上の連続関数は、$(0,1)$内のコーシー列をコーシー列に写す。
    reason: $f(x)=1/x$と$a_n=1/(n+2)$では、$(a_n)$はコーシー列だが、$f(a_n)=n+2$は有界でない。
  target: |
    ∀ (f : ℝ → ℝ) (a : ℕ → ℝ), (∀ ε : ℝ, 0 < ε → ∃ δ : ℝ, 0 < δ ∧ ∀ x y : ℝ, |x - y| < δ → |f x - f y| < ε) → (∀ ε : ℝ, 0 < ε → ∃ N : ℕ, ∀ m n, N ≤ m → N ≤ n → |a m - a n| < ε) → ∀ ε : ℝ, 0 < ε → ∃ N : ℕ, ∀ m n, N ≤ m → N ≤ n → |f (a m) - f (a n)| < ε
  proof: |
    by
      intro f a hf ha ε hε
      obtain ⟨δ, hδ, h⟩ := hf ε hε
      obtain ⟨N, hN⟩ := ha δ hδ
      exact ⟨N, fun m n hm hn => h _ _ (hN m n hm hn)⟩
- id: uniform_continuous_on_bounded_set_bounded
  kind: gap
  level: 2
  topic: 一様連続性・有界集合上の有界性
  statement: $f:\mathbb{R}\to\mathbb{R}$が有界な集合$S\subseteq\mathbb{R}$上で一様連続ならば、$f$は$S$上で有界である。
  statement_en: If f on the reals is uniformly continuous on a bounded set S of reals, then f is bounded on S.
  assumptions:
  - $S\subseteq\mathbb{R}$で、全ての$x\in S$について$|x|\leq B$
  - $f$は$S$上で一様連続
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$、$S$、$B$
  - ある$K\in\mathbb{R}$
  conclusion: 全ての$x\in S$で$|f(x)|\leq K$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$、$S\subseteq\mathbb{R}$、$B\in\mathbb{R}$とし、全ての$x\in S$で$|x|\leq B$、$f$は$S$上で一様連続とする。

    一様連続性を$\varepsilon=1$に適用すると、$\delta>0$があり、$x,y\in S$、$|x-y|<\delta$なら$|f(x)-f(y)|<1$である。$S\subseteq[-B,B]$なので、$[-B,B]$を長さ$\delta/2$以下の有限個の小区間に分ける。$S$と交わる各小区間から$S$の点を1つずつ選び、それらを$y_1,\dots,y_m$とする。$K=1+\max_j|f(y_j)|$とおく（$S$が空なら$K=1$とする）。

    $x\in S$とすると、$x$を含む小区間から選んだ点$y_j$について$|x-y_j|\leq\delta/2<\delta$である。よって$|f(x)|\leq|f(y_j)|+|f(x)-f(y_j)|<|f(y_j)|+1\leq K$となる。
  strategy: Cover S by finitely many pieces of diameter below δ for ε = 1 and bound f by the values at chosen points.
  sketch:
  - "setup: Take δ from uniform continuity at ε = 1."
  - "construct: Split [-B, B] into finitely many intervals of length at most δ/2 and pick a point of S from each that meets S."
  - "derive: Every x in S lies within δ of a chosen point y_j, so |f(x)| < |f(y_j)| + 1."
  - "conclude: K = 1 + max |f(y_j)| bounds f on S."
  openmath: (forall (f S B) (-> (and (forall (x) (-> (in x S) (<= (abs x) B))) (uniform_continuous_on f S)) (exists (K) (forall (x) (-> (in x S) (<= (abs (fn_value f x)) K))))))
  hard_negative:
    statement: 有界な集合上で連続な関数は、その集合上で有界である。
    reason: $f(x)=1/x$（$x\neq0$）は$(0,1)$上で連続だが、$(0,1)$上で有界でない。
  target: |
    ∀ (f : ℝ → ℝ) (S : Set ℝ) (B : ℝ), (∀ x ∈ S, |x| ≤ B) → UniformContinuousOn f S → ∃ K : ℝ, ∀ x ∈ S, |f x| ≤ K
  proof: |
    by
      intro f S B hB hf
      have hs : S ⊆ Set.Icc (-B) B := fun x hx => abs_le.1 (hB x hx)
      have ht : TotallyBounded S := (isCompact_Icc.totallyBounded).subset hs
      obtain ⟨δ, hδ, h⟩ := Metric.uniformContinuousOn_iff.1 hf 1 one_pos
      obtain ⟨t, hts, htf, hc⟩ := Metric.finite_approx_of_totallyBounded ht δ hδ
      obtain ⟨M, hM⟩ := (htf.image (fun y => |f y|)).bddAbove
      refine ⟨M + 1, fun x hx => ?_⟩
      obtain ⟨y, hy, hxy⟩ := Set.mem_iUnion₂.1 (hc hx)
      have h1 := h x hx y (hts hy) hxy
      rw [Real.dist_eq] at h1
      have h2 : |f y| ≤ M := hM ⟨y, hy, rfl⟩
      have h3 : |f x| ≤ |f x - f y| + |f y| := by simpa using abs_add_le (f x - f y) (f y)
      linarith
- id: not_uniform_continuous_of_sequences
  kind: gap
  level: 1
  topic: 一様連続性・数列による否定
  statement: $S\subseteq\mathbb{R}$内の数列$(x_n),(y_n)$が$x_n-y_n\to0$を満たし、ある$e>0$について全ての$n$で$|f(x_n)-f(y_n)|\geq e$ならば、$f$は$S$上で一様連続でない。
  statement_en: If sequences x, y in S satisfy x_n - y_n → 0 and |f(x_n) - f(y_n)| ≥ e for all n with some e > 0, then f is not uniformly continuous on S.
  assumptions:
  - 全ての$n$で$x_n,y_n\in S$
  - $x_n-y_n\to0$
  - $e>0$で、全ての$n$について$|f(x_n)-f(y_n)|\geq e$
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$、$S\subseteq\mathbb{R}$、$(x_n)$、$(y_n)$、$e$
  conclusion: $f$は$S$上で一様連続でない。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$、$S\subseteq\mathbb{R}$とし、$S$内の数列$(x_n),(y_n)$が$x_n-y_n\to0$を満たし、$e>0$について全ての$n$で$|f(x_n)-f(y_n)|\geq e$とする。

    $f$が$S$上で一様連続であると仮定する。$\varepsilon=e$に対して$\delta>0$があり、$x,y\in S$、$|x-y|<\delta$なら$|f(x)-f(y)|<e$である。$x_n-y_n\to0$より、ある$n$で$|x_n-y_n|<\delta$となる。このとき$|f(x_n)-f(y_n)|<e$であり、仮定に矛盾する。
  strategy: Apply uniform continuity at level e to a pair (x_n, y_n) closer than δ.
  sketch:
  - "contradiction: Assume f is uniformly continuous on S and take δ for ε = e."
  - "derive: Since x_n - y_n → 0, some n has |x_n - y_n| < δ."
  - "conclude: Then |f(x_n) - f(y_n)| < e, against the hypothesis."
  openmath: (forall (f S x y e) (-> (and (> e 0) (forall (n) (and (in (seq_value x n) S) (in (seq_value y n) S))) (seq_fn_tends_to (lambda (n) (- (seq_value x n) (seq_value y n))) 0) (forall (n) (>= (abs (- (fn_value f (seq_value x n)) (fn_value f (seq_value y n)))) e))) (not (uniform_continuous_on f S))))
  hard_negative:
    statement: $x_n-y_n\to0$かつ$f(x_n)-f(y_n)\to0$となる数列の組が1組あれば、$f$は一様連続である。
    reason: $f(x)=x^2$と$x_n=y_n=n$はこの条件を満たすが、$f$は$\mathbb{R}$上で一様連続でない。一様連続性の判定には全ての組を調べる必要がある。
  target: |
    ∀ (f : ℝ → ℝ) (S : Set ℝ) (x y : ℕ → ℝ) (e : ℝ), 0 < e → (∀ n, x n ∈ S) → (∀ n, y n ∈ S) → Filter.Tendsto (fun n => x n - y n) Filter.atTop (nhds 0) → (∀ n, e ≤ |f (x n) - f (y n)|) → ¬ UniformContinuousOn f S
  proof: |
    by
      intro f S x y e he hx hy hd hb hu
      obtain ⟨δ, hδ, h⟩ := Metric.uniformContinuousOn_iff.1 hu e he
      obtain ⟨N, hN⟩ := Metric.tendsto_atTop.1 hd δ hδ
      have h1 := hN N le_rfl
      rw [Real.dist_eq, sub_zero] at h1
      have h2 := h (x N) (hx N) (y N) (hy N) (by rwa [Real.dist_eq])
      rw [Real.dist_eq] at h2
      exact absurd h2 (not_lt.2 (hb N))
- id: uniform_continuous_of_limits_at_infinity
  kind: textbook
  level: 2
  topic: 一様連続性・無限遠で極限をもつ連続関数
  statement: 連続関数$f:\mathbb{R}\to\mathbb{R}$が$x\to+\infty$と$x\to-\infty$でともに同じ値$L$に収束するならば、$f$は$\mathbb{R}$上で一様連続である。
  statement_en: A continuous function on the reals that tends to the same value L at plus and minus infinity is uniformly continuous.
  assumptions:
  - $f:\mathbb{R}\to\mathbb{R}$は連続
  - $x\to+\infty$で$f(x)\to L$
  - $x\to-\infty$で$f(x)\to L$
  quantifiers:
  - 任意の$f$と$L$
  conclusion: $f$は$\mathbb{R}$上で一様連続である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$を連続関数とし、$x\to+\infty$と$x\to-\infty$でともに$f(x)\to L$とする。

    $\varepsilon>0$を任意にとる。$R>0$があり、$|x|\geq R$なら$|f(x)-L|<\varepsilon/2$である。有界閉区間上の連続関数は一様連続なので、$\delta_0>0$があり、$x,y\in[-R-1,R+1]$、$|x-y|<\delta_0$なら$|f(x)-f(y)|<\varepsilon$である。$\delta=\min\{\delta_0,1\}$とおく。

    $|x-y|<\delta$とする。$x,y$がともに$[-R-1,R+1]$に属するなら$|f(x)-f(y)|<\varepsilon$である。そうでないとき、たとえば$|x|>R+1$なら、$|x-y|<1$より$|y|>R$でもある。よって$|f(x)-f(y)|\leq|f(x)-L|+|L-f(y)|<\varepsilon$となる。
  strategy: Outside a large interval both values are near L; on the interval use uniform continuity on a compact set.
  sketch:
  - "setup: Choose R with |f(x) - L| < ε/2 for |x| ≥ R."
  - "apply_theorem: f is uniformly continuous on [-R-1, R+1], which gives δ₀."
  - "construct: Put δ = min(δ₀, 1)."
  - "case_split: If x, y lie in the interval use δ₀; otherwise both have absolute value at least R."
  - "conclude: In either case |f(x) - f(y)| < ε."
  openmath: (forall (f L) (-> (and (fn_continuous (lambda (x) (fn_value f x))) (fn_limit_at_top (lambda (x) (fn_value f x)) L) (fn_limit_at_bot (lambda (x) (fn_value f x)) L)) (uniform_continuous f)))
  hard_negative:
    statement: 有界な連続関数$f:\mathbb{R}\to\mathbb{R}$は一様連続である。
    reason: $f(x)=\sin(x^2)$は有界で連続だが一様連続でない。$x_n=\sqrt{2\pi n}$と$y_n=\sqrt{2\pi n+\pi/2}$で$x_n-y_n\to0$かつ$|f(x_n)-f(y_n)|=1$である。
  target: |
    ∀ (f : ℝ → ℝ) (L : ℝ), Continuous f → Filter.Tendsto f Filter.atTop (nhds L) → Filter.Tendsto f Filter.atBot (nhds L) → UniformContinuous f
  proof: |
    by
      intro f L hf h1 h2
      refine hf.uniformContinuous_of_tendsto_cocompact (x := L) ?_
      rw [cocompact_eq_atBot_atTop]
      exact h2.sup h1
- id: uniform_continuous_open_interval_endpoint_limit
  kind: gap
  level: 2
  topic: 一様連続性・開区間の端点での極限
  statement: $a<b$とし、$f:\mathbb{R}\to\mathbb{R}$が開区間$(a,b)$上で一様連続ならば、右極限$\lim_{x\to a+0}f(x)$が存在する。
  statement_en: If a < b and f is uniformly continuous on the open interval (a,b), then the right limit of f at a exists.
  assumptions:
  - $a<b$
  - $f$は$(a,b)$上で一様連続
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$と$a<b$
  - ある$L\in\mathbb{R}$
  conclusion: $x\to a+0$で$f(x)\to L$である。
  answer: |
    $a<b$とし、$f:\mathbb{R}\to\mathbb{R}$を$(a,b)$上で一様連続な関数とする。

    $x_n=a+(b-a)/(n+2)$とおくと、$x_n\in(a,b)$かつ$x_n\to a$である。$\varepsilon>0$に対し、一様連続性から$\delta>0$があり、$x,y\in(a,b)$、$|x-y|<\delta$なら$|f(x)-f(y)|<\varepsilon$である。$(x_n)$は収束するのでコーシー列であり、$m,n$が十分大きければ$|x_m-x_n|<\delta$なので$|f(x_m)-f(x_n)|<\varepsilon$となる。よって$(f(x_n))$はコーシー列であり、実数の完備性からある$L$に収束する。

    $\varepsilon>0$を任意にとり、$\delta>0$を$x,y\in(a,b)$、$|x-y|<\delta$なら$|f(x)-f(y)|<\varepsilon/2$となるようにとる。$n$を十分大きくとって$|x_n-a|<\delta/2$かつ$|f(x_n)-L|<\varepsilon/2$とする。$\eta=\min\{b-a,\delta/2\}$とおく。$a<x<a+\eta$なら$x\in(a,b)$かつ$|x-x_n|<\delta$なので、$|f(x)-L|\leq|f(x)-f(x_n)|+|f(x_n)-L|<\varepsilon$となる。
  strategy: Uniform continuity sends a sequence decreasing to a to a Cauchy sequence, whose limit is the right limit.
  sketch:
  - "construct: Let x_n = a + (b-a)/(n+2), a sequence in (a,b) tending to a."
  - "apply_theorem: Uniform continuity makes f(x_n) Cauchy, so it converges to some L."
  - "setup: Fix ε > 0 and take δ for ε/2 and n with x_n within δ/2 of a and f(x_n) within ε/2 of L."
  - "conclude: For a < x < a + min(b - a, δ/2), comparing with f(x_n) gives |f(x) - L| < ε."
  openmath: (forall (f a b) (-> (and (< a b) (uniform_continuous_on f (open_interval a b))) (exists (L) (fn_right_limit_at (lambda (x) (fn_value f x)) a L))))
  hard_negative:
    statement: 開区間$(a,b)$上で連続な関数は、$a$での右極限をもつ。
    reason: $x\neq a$で$f(x)=\sin(1/(x-a))$とすると$f$は$(a,b)$上で連続だが、$a$に右から近づくとき$-1$と$1$の間を振動して右極限をもたない。
  target: |
    ∀ (f : ℝ → ℝ) (a b : ℝ), a < b → UniformContinuousOn f (Set.Ioo a b) → ∃ L : ℝ, Filter.Tendsto f (nhdsWithin a (Set.Ioi a)) (nhds L)
  proof: |
    by
      intro f a b hab hf
      have hm : Cauchy (Filter.map f (nhdsWithin a (Set.Ioi a))) := by
        rw [Metric.cauchy_iff]
        refine ⟨inferInstance, fun ε hε => ?_⟩
        obtain ⟨δ, hδ, h⟩ := Metric.uniformContinuousOn_iff.1 hf ε hε
        have hη : 0 < min (b - a) (δ / 2) := lt_min (by linarith) (by linarith)
        refine ⟨f '' Set.Ioo a (a + min (b - a) (δ / 2)), Filter.image_mem_map (Ioo_mem_nhdsGT (by linarith)), ?_⟩
        rintro _ ⟨x, hx, rfl⟩ _ ⟨y, hy, rfl⟩
        have h1 := min_le_left (b - a) (δ / 2)
        have h2 := min_le_right (b - a) (δ / 2)
        refine h x ⟨hx.1, by linarith [hx.2]⟩ y ⟨hy.1, by linarith [hy.2]⟩ ?_
        rw [Real.dist_eq, abs_lt]
        constructor <;> linarith [hx.1, hx.2, hy.1, hy.2]
      exact CompleteSpace.complete hm
- id: deriv_linear_approx_eps
  kind: gap
  level: 1
  topic: 微分・1次近似のε-δ表示
  statement: 関数$f:\mathbb{R}\to\mathbb{R}$が$a$で微分可能で微分係数が$u$であることは、任意の$\varepsilon>0$に対してある$\delta>0$があり、$|x-a|<\delta$なら$|f(x)-f(a)-u(x-a)|\leq\varepsilon|x-a|$となることと同値である。
  statement_en: A function f has derivative u at a if and only if for every ε > 0 there is δ > 0 with |f(x) - f(a) - u(x-a)| ≤ ε|x-a| whenever |x - a| < δ.
  assumptions:
  - $f:\mathbb{R}\to\mathbb{R}$、$a,u\in\mathbb{R}$
  quantifiers:
  - 任意の$f$、$a$、$u$
  conclusion: $f'(a)=u$と、1次近似の$\varepsilon$-$\delta$評価は同値である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$、$a,u\in\mathbb{R}$とする。$f$が$a$で微分可能で微分係数が$u$であるとは、任意の$\varepsilon>0$に対してある$\delta>0$があり、$0<|x-a|<\delta$なら$|(f(x)-f(a))/(x-a)-u|<\varepsilon$となることである。

    この条件を仮定する。$\varepsilon>0$に対する$\delta$をとる。$0<|x-a|<\delta$なら、両辺に$|x-a|$を掛けて$|f(x)-f(a)-u(x-a)|\leq\varepsilon|x-a|$を得る。$x=a$なら両辺とも$0$である。

    逆に評価を仮定する。$\varepsilon>0$に対し、$\varepsilon/2$に対応する$\delta$をとる。$0<|x-a|<\delta$なら、$|x-a|$で割って$|(f(x)-f(a))/(x-a)-u|\leq\varepsilon/2<\varepsilon$となる。よって微分係数は$u$である。
  strategy: Multiply or divide the difference quotient estimate by |x - a|.
  sketch:
  - "translate: The derivative condition is the ε-δ limit of the difference quotient."
  - "derive: Multiplying by |x - a| gives the linear approximation bound, and x = a is trivial."
  - "derive: Conversely, dividing the bound for ε/2 by |x - a| gives the quotient estimate."
  - "conclude: The two conditions are equivalent."
  openmath: (forall (f a u) (<-> (has_deriv_at (lambda (y) (fn_value f y)) u a) (forall (e) (-> (> e 0) (exists (d) (and (> d 0) (forall (x) (-> (< (abs (- x a)) d) (<= (abs (- (- (fn_value f x) (fn_value f a)) (* u (- x a)))) (* e (abs (- x a))))))))))))
  hard_negative:
    statement: 右辺の$\varepsilon|x-a|$を$\varepsilon$に置き換えても、$f'(a)=u$と同値である。
    reason: 置き換えた条件は$a$での連続性にすぎない。$f(x)=|x|$、$a=0$、$u=0$はこの条件を満たすが、$0$で微分可能でない。
  target: |
    ∀ (f : ℝ → ℝ) (a u : ℝ), HasDerivAt f u a ↔ ∀ ε : ℝ, 0 < ε → ∃ δ : ℝ, 0 < δ ∧ ∀ x : ℝ, |x - a| < δ → |f x - f a - u * (x - a)| ≤ ε * |x - a|
  proof: |
    by
      intro f a u
      rw [hasDerivAt_iff_isLittleO, Asymptotics.isLittleO_iff]
      constructor
      · intro h ε hε
        obtain ⟨δ, hδ, hd⟩ := Metric.eventually_nhds_iff.1 (h hε)
        refine ⟨δ, hδ, fun x hx => ?_⟩
        have := hd (y := x) (by rwa [Real.dist_eq])
        simpa [mul_comm] using this
      · intro h ε hε
        obtain ⟨δ, hδ, hd⟩ := h ε hε
        refine Metric.eventually_nhds_iff.2 ⟨δ, hδ, fun x hx => ?_⟩
        have := hd x (by rwa [Real.dist_eq] at hx)
        simpa [mul_comm] using this
- id: positive_derivative_local_increase
  kind: gap
  level: 1
  topic: 微分・正の微分係数と点の近くの大小
  statement: $f:\mathbb{R}\to\mathbb{R}$が$a$で微分係数$u>0$をもつならば、ある$\delta>0$があり、$a<x<a+\delta$なら$f(a)<f(x)$、$a-\delta<x<a$なら$f(x)<f(a)$である。
  statement_en: If f has derivative u > 0 at a, then there is δ > 0 with f(a) < f(x) for a < x < a + δ and f(x) < f(a) for a - δ < x < a.
  assumptions:
