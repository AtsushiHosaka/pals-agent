  sketch:
  - "derive: On each unit interval, monotonicity gives f(x_0+i+1) ≤ f(x) ≤ f(x_0+i)."
  - "derive: Integrating over the interval keeps these bounds."
  - "conclude: Summing over i and using additivity of the integral gives the claim."
  openmath: (forall (f x n) (-> (and (in n N) (fn_continuous_on (lambda (t) (fn_value f t)) (closed_interval x (+ x n))) (forall (s t) (-> (and (in s (closed_interval x (+ x n))) (in t (closed_interval x (+ x n))) (<= s t)) (<= (fn_value f t) (fn_value f s))))) (and (<= (real_partial_sum (lambda (i) (fn_value f (+ x (+ i 1)))) n) (interval_integral x (+ x n) (lambda (t) (fn_value f t)))) (<= (interval_integral x (+ x n) (lambda (t) (fn_value f t))) (real_partial_sum (lambda (i) (fn_value f (+ x i))) n)))))
