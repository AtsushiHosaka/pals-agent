        linarith
      obtain ⟨K1, hK1⟩ := h1 _ hpos
      obtain ⟨K2, hK2⟩ := h2 _ hpos
      have h3 := hK1 (max K1 K2) (le_max_left _ _)
      have h4 := hK2 (max K1 K2) (le_max_right _ _)
      have h5 := abs_sub_le L (a (max K1 K2)) M
      rw [abs_sub_comm L (a (max K1 K2))] at h5
      linarith
