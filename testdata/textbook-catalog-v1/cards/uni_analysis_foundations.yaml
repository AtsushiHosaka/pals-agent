    級数の収束から$K$があり、$\sum_{i\geq K}d(x_i,x_{i+1})<\varepsilon$である。$K\leq m<n$なら、三角不等式から$d(x_m,x_n)\leq\sum_{i=m}^{n-1}d(x_i,x_{i+1})\leq\sum_{i\geq K}d(x_i,x_{i+1})<\varepsilon$である。よって$(x_n)$はコーシー列であり、$X$の完備性から収束する。
