    ∀ (F : ℕ → ℝ → ℝ) (f : ℝ → ℝ) (S : Set ℝ) (c : ℝ) (x : ℕ → ℝ), TendstoUniformlyOn F f Filter.atTop S → ContinuousWithinAt f S c → (∀ n, x n ∈ S) → Filter.Tendsto x Filter.atTop (nhds c) → Filter.Tendsto (fun n => F n (x n)) Filter.atTop (nhds (f c))
