  quantifiers:
  - 任意の$S$と$a$
  conclusion: $a$が$S$の下限であることと、$-a$が$-S$の上限であることは同値である。
  answer: |
    $S\subset\mathbb{R}$、$a\in\mathbb{R}$とする。実数$x,b$について$b\leq x$と$-x\leq-b$は同値である。

    この同値から、$b$が$S$の下界であることと$-b$が$-S$の上界であることは同値になる。$-S$の上界はすべて$-b$（$b$は$S$の下界）の形に書ける。

    $a$が$S$の下限であるとは、$a$が$S$の下界であり、任意の下界$b$に対して$b\leq a$となることである。これは、$-a$が$-S$の上界であり、任意の上界$-b$に対して$-a\leq-b$となることと同値である。後者は$-a$が$-S$の上限であることにほかならない。
  strategy: Translate lower bounds of S into upper bounds of -S with the order-reversing map x ↦ -x.
  sketch:
  - "translate: b ≤ x is equivalent to -x ≤ -b."
  - "derive: So b is a lower bound of S exactly when -b is an upper bound of -S."
  - "conclude: Greatest lower bounds correspond to least upper bounds under this bijection."
  openmath: (forall (S T a) (-> (forall (y) (<-> (in y T) (exists (x) (and (in x S) (= y (neg x)))))) (<-> (is_glb S a) (is_lub T (neg a)))))
  hard_negative:
    statement: $a$が$S$の上限ならば、$-a$は$-S$の上限である。
    reason: $S=[0,1]$では$a=1$だが、$-S=[-1,0]$の上限は$0$であり$-1$ではない。符号反転で上限は下限に移る。
  target: |
    ∀ (S : Set ℝ) (a : ℝ), IsGLB S a ↔ IsLUB ((fun x => -x) '' S) (-a)
  proof: |
    by
      intro S a
      constructor
      · intro h
        constructor
        · rintro _ ⟨x, hx, rfl⟩
          have h1 := h.1 hx
          show -x ≤ -a
          linarith
        · intro b hb
          have h1 : -b ≤ a := h.2 (fun x hx => by
            have h2 : -x ≤ b := hb ⟨x, hx, rfl⟩
            linarith)
          linarith
      · intro h
        constructor
        · intro x hx
          have h1 : -x ≤ -a := h.1 ⟨x, hx, rfl⟩
          linarith
        · intro b hb
          have h1 : -a ≤ -b := h.2 (by
            rintro _ ⟨x, hx, rfl⟩
            have h2 := hb hx
            show -x ≤ -b
            linarith)
          linarith
- id: sup_mem_of_closed
  kind: gap
  level: 2
  topic: 上限・閉集合
  statement: 空でない閉集合$S\subset\mathbb{R}$の上限が$a$ならば、$a\in S$である。
