  openmath: (forall (F f S c x) (-> (and (uniform_converges_on (lambda (n t) (fn_value (seq_value F n) t)) (lambda (t) (fn_value f t)) S) (forall (e) (-> (> e 0) (exists (d) (and (> d 0) (forall (t) (-> (and (in t S) (< (abs (- t c)) d)) (< (abs (- (fn_value f t) (fn_value f c))) e))))))) (forall (n) (in (seq_value x n) S)) (seq_tends_to x c)) (seq_fn_tends_to (lambda (n) (fn_value (seq_value F n) (seq_value x n))) (fn_value f c))))
