- id: term_by_term_derivative_sequence
  kind: textbook
  level: 2
  topic: 関数列・極限と微分の交換
  statement: $F_n,F_n',f,g:\mathbb{R}\to\mathbb{R}$とする。開区間$(a,b)$上で$F_n$が微分可能で$F_n'\to g$が一様収束し、各点で$F_n\to f$ならば、$(a,b)$上で$f'=g$である。
  statement_en: Let F_n, F_n', f and g be real functions on the reals. If F_n is differentiable on the open interval (a, b), F_n' converges uniformly to g on (a, b) and F_n converges pointwise to f on (a, b), then f has derivative g on (a, b).
  assumptions:
  - $F_n,F_n',f,g:\mathbb{R}\to\mathbb{R}$
  - $(a,b)$上で$F_n$は微分可能で導関数は$F_n'$
  - $F_n'\to g$は$(a,b)$上一様収束
  - $(a,b)$の各点で$F_n\to f$
  quantifiers:
  - 任意の$(F_n)$、$(F_n')$、$f$、$g$、$a$、$b$
  conclusion: 全ての$x\in(a,b)$で$f$は微分係数$g(x)$をもつ。
  answer: |
    $F_n,F_n',f,g:\mathbb{R}\to\mathbb{R}$とし、$(a,b)$上で$F_n$は微分可能で導関数が$F_n'$、$F_n'\to g$は$(a,b)$上一様収束、$(a,b)$の各点で$F_n\to f$とする。$x\in(a,b)$、$\varepsilon>0$をとる。

    $N$を、$m,n\geq N$と$t\in(a,b)$で$|F_m'(t)-F_n'(t)|<\varepsilon/3$、さらに$|F_N'(x)-g(x)|<\varepsilon/3$となるようにとる。平均値の定理を$F_m-F_n$に使うと、$y\in(a,b)$、$y\neq x$で$\left|\frac{F_m(y)-F_m(x)}{y-x}-\frac{F_n(y)-F_n(x)}{y-x}\right|\leq\frac\varepsilon3$である。$n=N$に固定して$m\to\infty$とすると$\left|\frac{f(y)-f(x)}{y-x}-\frac{F_N(y)-F_N(x)}{y-x}\right|\leq\frac\varepsilon3$である。

    $F_N$は$x$で微分可能なので$\delta>0$があり、$0<|y-x|<\delta$なら$y\in(a,b)$かつ$\frac{F_N(y)-F_N(x)}{y-x}$と$F_N'(x)$の差は$\varepsilon/3$より小さい。三つの評価を合わせると$\left|\frac{f(y)-f(x)}{y-x}-g(x)\right|<\varepsilon$である。
