    ∀ (a : ℕ → ℝ) (L : ℝ), (∀ n, 0 ≤ a n) → Filter.Tendsto a Filter.atTop (nhds L) → Filter.Tendsto (fun n => Real.sqrt (a n)) Filter.atTop (nhds (Real.sqrt L))
  proof: |
    by
      intro a L _ h
      exact (Real.continuous_sqrt.tendsto L).comp h
- id: seq_limit_inv_eps
  kind: gap
  level: 1
  topic: 数列の極限・逆数のε-N評価
  statement: 実数列$(a_n)$が$\varepsilon$-$N$の意味で$L\neq0$に収束するならば、任意の$\varepsilon>0$に対してある$K$があり、$n\geq K$なら$a_n\neq0$かつ$|1/a_n-1/L|<\varepsilon$となる。
  statement_en: If a real sequence a converges to L ≠ 0 in the ε-N sense, then for every ε > 0 there is K such that a_n ≠ 0 and |1/a_n - 1/L| < ε for all n ≥ K.
  assumptions:
  - $L\neq0$
  - $(a_n)$は$\varepsilon$-$N$の意味で$L$に収束する
  quantifiers:
  - 任意の$(a_n)$、$L\neq0$、$\varepsilon>0$
  conclusion: ある$K$があり、$n\geq K$なら$a_n\neq0$かつ$|1/a_n-1/L|<\varepsilon$である。
  answer: |
    $L\neq0$とし、実数列$(a_n)$が$\varepsilon$-$N$の意味で$L$に収束するとする。$\varepsilon>0$をとる。

    $|L|/2>0$と$\varepsilon|L|^2/2>0$に対応する番号の大きい方を$K$とする。$n\geq K$なら$|a_n-L|<|L|/2$なので、$|L|\leq|L-a_n|+|a_n|$より$|a_n|>|L|/2>0$であり、$a_n\neq0$である。さらに$\left|\frac1{a_n}-\frac1L\right|=\frac{|a_n-L|}{|a_n||L|}<\frac{\varepsilon|L|^2/2}{(|L|/2)|L|}=\varepsilon$となる。
  strategy: First bound |a_n| below by |L|/2, then control the difference of reciprocals.
  sketch:
  - "setup: Take K for both |L|/2 and ε|L|²/2."
  - "derive: For n ≥ K, |a_n| > |L|/2, so a_n ≠ 0."
  - "derive: |1/a_n - 1/L| = |a_n - L|/(|a_n||L|)."
  - "conclude: The bounds give a value below ε."
  openmath: (forall (a L) (-> (and (!= L 0) (forall (e) (-> (> e 0) (exists (K) (forall (n) (-> (>= n K) (< (abs (- (seq_value a n) L)) e))))))) (forall (e) (-> (> e 0) (exists (K) (forall (n) (-> (>= n K) (and (!= (seq_value a n) 0) (< (abs (- (/ 1 (seq_value a n)) (/ 1 L))) e)))))))))
  hard_negative:
    statement: $(a_n)$が$L\neq0$に収束すれば、全ての$n$で$a_n\neq0$である。
    reason: $a_0=0$、$n\geq1$で$a_n=1$とすると$1$に収束するが$a_0=0$である。保証されるのは十分先の項だけである。
  target: |
    ∀ (a : ℕ → ℝ) (L : ℝ), L ≠ 0 → (∀ ε : ℝ, 0 < ε → ∃ K : ℕ, ∀ n, K ≤ n → |a n - L| < ε) → ∀ ε : ℝ, 0 < ε → ∃ K : ℕ, ∀ n, K ≤ n → a n ≠ 0 ∧ |1 / a n - 1 / L| < ε
  proof: |
    by
      intro a L hL h ε hε
      have hLp : 0 < |L| := abs_pos.2 hL
      obtain ⟨K1, h1⟩ := h (|L| / 2) (by positivity)
      obtain ⟨K2, h2⟩ := h (ε * |L| * |L| / 2) (by positivity)
      refine ⟨max K1 K2, fun n hn => ?_⟩
      have hn1 := h1 n (le_of_max_le_left hn)
      have hn2 := h2 n (le_of_max_le_right hn)
      have hlow : |L| / 2 < |a n| := by
        have h3 : |L| - |a n| ≤ |a n - L| := by
          rw [abs_sub_comm]
          exact abs_sub_abs_le_abs_sub L (a n)
        linarith
      have hapos : 0 < |a n| := by linarith
      have hne : a n ≠ 0 := abs_pos.1 hapos
      refine ⟨hne, ?_⟩
      have heq : 1 / a n - 1 / L = (L - a n) / (a n * L) := by
        field_simp
      rw [heq, abs_div, abs_mul, abs_sub_comm, div_lt_iff₀ (by positivity)]
      have h4 : ε * (|L| / 2 * |L|) ≤ ε * (|a n| * |L|) := by
        have h5 : |L| / 2 * |L| ≤ |a n| * |L| := mul_le_mul_of_nonneg_right hlow.le hLp.le
        exact mul_le_mul_of_nonneg_left h5 hε.le
      have h6 : ε * (|L| / 2 * |L|) = ε * |L| * |L| / 2 := by ring
      linarith
