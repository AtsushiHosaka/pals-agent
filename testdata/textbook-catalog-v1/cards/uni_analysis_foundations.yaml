- id: seq_limit_sqrt
  kind: gap
  level: 1
  topic: 数列の極限・平方根
  statement: 非負の実数列が$a_n\to L$を満たすならば、$\sqrt{a_n}\to\sqrt L$である。
  statement_en: If a nonnegative real sequence satisfies a_n → L, then √(a_n) → √L.
  assumptions:
  - 全ての$n$で$a_n\geq0$
  - $a_n\to L$
  quantifiers:
  - 任意の$(a_n)$と$L$
