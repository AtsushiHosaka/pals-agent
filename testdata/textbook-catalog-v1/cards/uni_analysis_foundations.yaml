  - 全ての$a\in A$、$b\in B$で$a\leq b$
  quantifiers:
  - 任意の$A$、$B$
  conclusion: 全ての$a\in A$、$b\in B$で$a\leq c\leq b$となる$c$が存在する。
  answer: |
    $A,B\subset\mathbb{R}$を空でない集合とし、全ての$a\in A$、$b\in B$で$a\leq b$とする。

    $B$の元はどれも$A$の上界であり、$B$は空でないので、$A$は上に有界である。$A$も空でないから上限$c=\sup A$が存在する。上界であることから全ての$a\in A$で$a\leq c$である。また$b\in B$は$A$の上界で、$c$は最小の上界だから$c\leq b$である。
  strategy: Take c to be the supremum of A; each element of B is an upper bound of A.
  sketch:
  - "derive: Every element of B is an upper bound of A, so A is bounded above."
  - "apply_theorem: The nonempty set A has a supremum c."
  - "conclude: a ≤ c for a in A, and c ≤ b for b in B because c is the least upper bound."
  openmath: (forall (A B) (-> (and (exists (a) (in a A)) (exists (b) (in b B)) (forall (a b) (-> (and (in a A) (in b B)) (<= a b)))) (exists (c) (forall (a b) (-> (and (in a A) (in b B)) (and (<= a c) (<= c b)))))))
  hard_negative:
    statement: 全ての$a\in A$、$b\in B$で$a<b$ならば、全ての$a\in A$、$b\in B$で$a<c<b$となる実数$c$が存在する。
    reason: $A=(-\infty,0)$、$B=[0,\infty)$では$a<b$が常に成り立つが、$c<0$なら$a=c/2\in A$で$a<c$が破れ、$c\geq0$なら$b=0\in B$で$c<b$が破れる。
  target: |
    ∀ A B : Set ℝ, A.Nonempty → B.Nonempty → (∀ a ∈ A, ∀ b ∈ B, a ≤ b) → ∃ c : ℝ, (∀ a ∈ A, a ≤ c) ∧ (∀ b ∈ B, c ≤ b)
  proof: |
    by
      intro A B hA hB h
      obtain ⟨b0, hb0⟩ := hB
      have hbdd : BddAbove A := ⟨b0, fun a ha => h a ha b0 hb0⟩
      exact ⟨sSup A, fun a ha => le_csSup hbdd ha, fun b hb => csSup_le hA fun a ha => h a ha b hb⟩
- id: cluster_point_subsequence
  kind: gap
  level: 1
  topic: 数列・集積値と部分列
  statement: 実数列$(a_n)$と実数$c$について、$c$に収束する部分列が存在することは、任意の$\varepsilon>0$と任意の$K$に対して$n\geq K$かつ$|a_n-c|<\varepsilon$となる$n$が存在することと同値である。
  statement_en: For a real sequence a and a real c, some subsequence of a converges to c if and only if for every ε > 0 and every K there is n ≥ K with |a_n - c| < ε.
  assumptions:
  - $(a_n)$は実数列、$c\in\mathbb{R}$
  quantifiers:
  - 任意の$(a_n)$と$c$
  conclusion: $c$に収束する部分列の存在は、$c$の任意の$\varepsilon$近傍に無限個の項が入ることと同値である。
  answer: |
    $(a_n)$を実数列、$c\in\mathbb{R}$とする。

    狭義単調増加な$p$で$a_{p(n)}\to c$となるとする。$\varepsilon>0$と$K$をとる。ある$M$があり$n\geq M$なら$|a_{p(n)}-c|<\varepsilon$である。$m=\max\{M,K\}$とおくと、$p(m)\geq m\geq K$かつ$|a_{p(m)}-c|<\varepsilon$である。

    逆に右辺の条件を仮定する。$p(0)$を$|a_{p(0)}-c|<1$となるようにとる。$p(k)$まで定まったら、$K=p(k)+1$、$\varepsilon=1/(k+2)$に条件を使い、$p(k+1)\geq p(k)+1$かつ$|a_{p(k+1)}-c|<1/(k+2)$となる$p(k+1)$をとる。$p$は狭義単調増加で、$|a_{p(k)}-c|<1/(k+1)\to0$だから$a_{p(k)}\to c$である。
  strategy: One direction uses p(m) ≥ m; for the other, pick indices inductively with shrinking radii 1/(k+1).
  sketch:
  - "derive: If a_{p(n)} → c, then p(m) ≥ m provides arbitrarily late terms close to c."
  - "construct: Conversely choose p(k+1) > p(k) with |a_{p(k+1)} - c| < 1/(k+2)."
  - "conclude: The radii tend to 0, so the subsequence converges to c."
  openmath: (forall (a c) (<-> (exists (p) (and (strict_mono_index p) (seq_fn_tends_to (lambda (n) (seq_value a (fn_value p n))) c))) (forall (e K) (-> (> e 0) (exists (n) (and (>= n K) (< (abs (- (seq_value a n) c)) e)))))))
  hard_negative:
    statement: 任意の$\varepsilon>0$に対して$|a_n-c|<\varepsilon$となる$n$が存在すれば、$c$に収束する部分列が存在する。
    reason: $a_0=c$で、$n\geq1$では$a_n=c+1$とすると、$n=0$で条件を満たすが$c$に収束する部分列はない。遅い番号でも見つかることが必要である。
  target: |
    ∀ (a : ℕ → ℝ) (c : ℝ), (∃ p : ℕ → ℕ, StrictMono p ∧ Filter.Tendsto (fun n => a (p n)) Filter.atTop (nhds c)) ↔ ∀ (ε : ℝ) (K : ℕ), 0 < ε → ∃ n : ℕ, K ≤ n ∧ |a n - c| < ε
  proof: |
    by
      intro a c
      constructor
      · rintro ⟨p, hp, ht⟩ ε K hε
        obtain ⟨M, hM⟩ := Metric.tendsto_atTop.1 ht ε hε
        refine ⟨p (max M K), (le_max_right M K).trans hp.le_apply, ?_⟩
        have h1 := hM (max M K) (le_max_left _ _)
        rwa [Real.dist_eq] at h1
      · intro h
        have hf : ∀ k : ℕ, ∃ᶠ n in Filter.atTop, |a n - c| < 1 / ((k : ℝ) + 1) := fun k =>
          Filter.frequently_atTop.2 fun K => h _ K (by positivity)
        obtain ⟨p, hp, hp2⟩ := Filter.extraction_forall_of_frequently hf
        refine ⟨p, hp, Metric.tendsto_atTop.2 fun ε hε => ?_⟩
        obtain ⟨M, hM⟩ := exists_nat_one_div_lt hε
        refine ⟨M, fun n hn => ?_⟩
        rw [Real.dist_eq]
        have h2 : 1 / ((n : ℝ) + 1) ≤ 1 / ((M : ℝ) + 1) := by
          apply one_div_le_one_div_of_le (by positivity)
          have h3 : (M : ℝ) ≤ n := by exact_mod_cast hn
          linarith
        exact ((hp2 n).trans_le h2).trans hM
- id: seq_eventually_abs_gt_fraction
  kind: gap
  level: 1
  topic: 数列の極限・0でない極限と項の下界の一般形
  statement: 実数列$(a_n)$が$\varepsilon$-$N$の意味で$L\neq0$に収束し、$0<c<1$ならば、ある$K$があり、$n\geq K$なら$|a_n|>c|L|$となる。これは$c=1/2$の場合を一般化した形である。
