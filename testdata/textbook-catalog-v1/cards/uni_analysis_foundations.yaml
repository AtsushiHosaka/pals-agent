- id: integral_test
  kind: textbook
  level: 1
  topic: 級数と積分・積分判定法
  statement: $f$が$[0,\infty)$で連続、非負、単調非増加ならば、級数$\sum_nf(n)$が収束することと、広義積分$\lim_{t\to\infty}\int_0^tf(x)\,dx$が収束することは同値である。
  statement_en: If f is continuous, nonnegative and nonincreasing on [0, ∞), then the series of f(n) converges if and only if the integral of f over [0, t] converges as t tends to infinity.
  assumptions:
  - $f$は$[0,\infty)$で連続、非負、単調非増加
  quantifiers:
  - 任意の$f$
  conclusion: $\sum_nf(n)$の収束と$\lim_{t\to\infty}\int_0^tf$の収束は同値である。
  answer: |
    $f$を$[0,\infty)$で連続、非負、単調非増加な関数とし、$F(t)=\int_0^tf$、$S_m=\sum_{n<m}f(n)$とおく。$f\geq0$より$F$と$(S_m)$は単調非減少である。

    各区間$[i,i+1]$で$f(i+1)\leq f\leq f(i)$なので、積分して足すと、自然数$m$について$\sum_{i=1}^{m}f(i)\leq F(m)\leq S_m$である。

    $S_m\to s$なら$S_m\leq s$である。$t\geq0$に対し$t\leq m$となる自然数$m$をとると$F(t)\leq F(m)\leq S_m\leq s$なので、単調有界な$F$は$t\to\infty$で収束する。

    逆に$F(t)\to L$なら$F(m)\leq L$であり、$S_{m+1}=f(0)+\sum_{i=1}^mf(i)\leq f(0)+L$である。単調有界な$(S_m)$は収束する。
  strategy: Compare partial sums and integrals over unit intervals, then use monotone convergence on both sides.
  sketch:
  - "setup: Put F(t) for the integral of f over [0, t] and S_m for the partial sums; both are nondecreasing."
  - "derive: Monotonicity on unit intervals gives Σ_{i=1}^m f(i) ≤ F(m) ≤ S_m."
  - "case_split: If S_m converges, F is bounded and monotone, hence convergent."
  - "case_split: If F converges, S_{m+1} ≤ f(0) + lim F, hence S_m converges."
  openmath: (forall (f) (-> (and (fn_continuous_on (lambda (x) (fn_value f x)) (closed_half_line_right 0)) (forall (x) (-> (>= x 0) (>= (fn_value f x) 0))) (forall (x y) (-> (and (<= 0 x) (<= x y)) (<= (fn_value f y) (fn_value f x))))) (<-> (exists (s) (seq_fn_tends_to (lambda (m) (real_partial_sum (lambda (n) (fn_value f n)) m)) s)) (exists (L) (fn_limit_at_top (lambda (t) (interval_integral 0 t (lambda (x) (fn_value f x)))) L)))))
  hard_negative:
    statement: 単調性なしで、連続で非負な$f$について$\int_0^\infty f$が収束すれば$\sum_nf(n)$も収束する。
    reason: 各自然数$n\geq1$を中心に高さ$1$、幅$2^{-n}$の三角形を並べた$f$は、積分が有限だが$f(n)=1$なので級数は発散する。
  target: |
    ∀ f : ℝ → ℝ, ContinuousOn f (Set.Ici 0) → AntitoneOn f (Set.Ici 0) → (∀ x, 0 ≤ x → 0 ≤ f x) → ((∃ s : ℝ, Filter.Tendsto (fun m : ℕ => ∑ n ∈ Finset.range m, f (n : ℝ)) Filter.atTop (nhds s)) ↔ ∃ L : ℝ, Filter.Tendsto (fun t : ℝ => ∫ x in (0 : ℝ)..t, f x) Filter.atTop (nhds L))
  proof: |
    by
      intro f hc hanti hnn
      have hint : ∀ s t : ℝ, 0 ≤ s → 0 ≤ t → IntervalIntegrable f MeasureTheory.volume s t := fun s t hs ht =>
        (hc.mono fun x hx => (le_min hs ht).trans hx.1).intervalIntegrable
      have hsub : ∀ n : ℕ, AntitoneOn f (Set.Icc (0 : ℝ) ((0 : ℝ) + n)) := fun n =>
        hanti.mono fun x hx => hx.1
      constructor
      · rintro ⟨s, hs⟩
        have hmono : Monotone (fun m : ℕ => ∑ n ∈ Finset.range m, f (n : ℝ)) :=
          monotone_nat_of_le_succ fun m => by
            rw [Finset.sum_range_succ]
            have := hnn m (Nat.cast_nonneg m)
            linarith
        have hle : ∀ m : ℕ, ∑ n ∈ Finset.range m, f (n : ℝ) ≤ s := fun m => hmono.ge_of_tendsto hs m
        have hIoi : MeasureTheory.IntegrableOn f (Set.Ioi 0) := by
          refine MeasureTheory.integrableOn_Ioi_of_intervalIntegral_norm_bounded s 0
            (fun n : ℕ => (hint 0 n le_rfl (Nat.cast_nonneg n)).1) tendsto_natCast_atTop_atTop
            (Filter.Eventually.of_forall fun n => ?_)
          have h1 : ∫ x in (0 : ℝ)..(n : ℝ), ‖f x‖ = ∫ x in (0 : ℝ)..(n : ℝ), f x := by
            refine intervalIntegral.integral_congr fun x hx => ?_
            have hx0 : 0 ≤ x := by
              rw [Set.uIcc_of_le (Nat.cast_nonneg n)] at hx
              exact hx.1
            exact Real.norm_of_nonneg (hnn x hx0)
          have h2 := (hsub n).integral_le_sum
          simp only [zero_add] at h2
          rw [h1]
          exact h2.trans (hle n)
        exact ⟨_, MeasureTheory.intervalIntegral_tendsto_integral_Ioi 0 hIoi Filter.tendsto_id⟩
      · rintro ⟨L, hL⟩
        have hseq : Filter.Tendsto (fun n : ℕ => ∫ x in (0 : ℝ)..(n : ℝ), f x) Filter.atTop (nhds L) :=
          hL.comp tendsto_natCast_atTop_atTop
        have hmono : Monotone (fun n : ℕ => ∫ x in (0 : ℝ)..(n : ℝ), f x) :=
          monotone_nat_of_le_succ fun n => by
            have h0 : (0 : ℝ) ≤ n := Nat.cast_nonneg n
            have h1 : (0 : ℝ) ≤ ((n + 1 : ℕ) : ℝ) := Nat.cast_nonneg _
            have e := intervalIntegral.integral_add_adjacent_intervals (hint 0 n le_rfl h0) (hint n ((n + 1 : ℕ) : ℝ) h0 h1)
            have p : 0 ≤ ∫ x in (n : ℝ)..((n + 1 : ℕ) : ℝ), f x :=
              intervalIntegral.integral_nonneg (by push_cast; linarith) fun u hu => hnn u (h0.trans hu.1)
            linarith
        have hle : ∀ n : ℕ, ∫ x in (0 : ℝ)..(n : ℝ), f x ≤ L := fun n => hmono.ge_of_tendsto hseq n
        have hb : ∀ m : ℕ, ∑ n ∈ Finset.range m, f (n : ℝ) ≤ f 0 + L := by
          intro m
          have hL0 : 0 ≤ L := by
            have := hle 0
            simpa using this
          have hf0 := hnn 0 le_rfl
          cases m with
          | zero => simp; linarith
          | succ m =>
            have h2 := (hsub m).sum_le_integral
            simp only [zero_add] at h2
            rw [Finset.sum_range_succ']
            have h3 := hle m
            simp only [Nat.cast_zero]
            linarith
        exact ⟨_, (summable_of_sum_range_le (fun n => hnn n (Nat.cast_nonneg n)) hb).hasSum.tendsto_sum_nat⟩
- id: euler_mascheroni_limit
  kind: named
  level: 1
  topic: 級数と対数・オイラーの定数
  statement: 数列$\sum_{k<n}\frac1{k+1}-\log n$は$n\to\infty$で収束する。この極限がオイラーの定数である。
  statement_en: The sequence Σ_{k<n} 1/(k+1) - log n converges as n tends to infinity; its limit is Euler's constant.
  assumptions:
  - なし
  quantifiers:
  - なし
  conclusion: $\sum_{k<n}\frac1{k+1}-\log n$は収束する。
  answer: |
    $n\geq1$について$d_n=\sum_{k<n}\frac1{k+1}-\log n$とおく。$x>-1$で$\log(1+x)\leq x$であり、$x>0$では$\log(1+x)=-\log\frac1{1+x}\geq-(\frac1{1+x}-1)=\frac{x}{1+x}$である。

    $x=1/n$として、$d_{n+1}-d_n=\frac1{n+1}-\log(1+\frac1n)\leq\frac1{n+1}-\frac{1/n}{1+1/n}=0$である。よって$(d_n)$は単調非増加である。

    また$\frac1k\geq\log(1+\frac1k)=\log(k+1)-\log k$を$k=1,\dots,n$で足すと、$\sum_{k<n}\frac1{k+1}\geq\log(n+1)$である。よって$d_n\geq\log(n+1)-\log n>0$である。下に有界な単調非増加数列$(d_n)$は収束する。
  strategy: Show the sequence is nonincreasing and positive from the bounds x/(1+x) ≤ log(1+x) ≤ x.
  sketch:
  - "setup: Put d_n for the difference and recall x/(1+x) ≤ log(1+x) ≤ x for x > 0."
  - "derive: With x = 1/n, d_{n+1} - d_n ≤ 0."
  - "derive: Summing 1/k ≥ log(k+1) - log k gives d_n > 0."
  - "conclude: A nonincreasing sequence bounded below converges."
  openmath: (exists (c) (seq_fn_tends_to (lambda (n) (- (real_partial_sum (lambda (k) (/ 1 (+ k 1))) n) (ln n))) c))
  hard_negative:
    statement: 数列$\sum_{k<n}\frac1{k+1}$は収束する。
    reason: 調和級数の部分和は$+\infty$に発散する。収束するのは$\log n$を引いた差である。
  target: |
    ∃ c : ℝ, Filter.Tendsto (fun n : ℕ => ∑ k ∈ Finset.range n, 1 / ((k : ℝ) + 1) - Real.log n) Filter.atTop (nhds c)
  proof: |
    by
      refine ⟨Real.eulerMascheroniConstant, Real.tendsto_harmonic_sub_log.congr fun n => ?_⟩
      simp [harmonic]
- id: sin_partial_sum_bound
  kind: gap
  level: 1
  topic: 級数・三角関数の部分和の有界性
  statement: $\sin(x/2)\neq0$ならば、全ての自然数$n$で$\left|\sum_{k<n}\sin((k+1)x)\right|\leq\frac1{|\sin(x/2)|}$である。
  statement_en: If sin(x/2) ≠ 0, then |Σ_{k<n} sin((k+1)x)| ≤ 1/|sin(x/2)| for every natural number n.
  assumptions:
  - $\sin(x/2)\neq0$
  quantifiers:
  - 任意の実数$x$と自然数$n$
  conclusion: $\left|\sum_{k<n}\sin((k+1)x)\right|\leq1/|\sin(x/2)|$である。
  answer: |
    $x$を$\sin(x/2)\neq0$を満たす実数とする。積和の公式から$2\sin\frac x2\sin((k+1)x)=\cos\left(\left(k+\frac12\right)x\right)-\cos\left(\left(k+\frac32\right)x\right)$である。$k=0,\dots,n-1$について足すと、右辺の和は打ち消し合い$2\sin\frac x2\sum_{k<n}\sin((k+1)x)=\cos\frac x2-\cos\left(\left(n+\frac12\right)x\right)$となる。右辺の絶対値は$2$以下なので、両辺の絶対値をとって$2|\sin(x/2)|$で割ると主張を得る。
  strategy: Multiply by 2 sin(x/2) so that the sum telescopes.
  sketch:
  - "derive: 2 sin(x/2) sin((k+1)x) = cos((k+1/2)x) - cos((k+3/2)x)."
  - "derive: The sum telescopes to cos(x/2) - cos((n+1/2)x)."
  - "conclude: The right side has absolute value at most 2; divide by 2|sin(x/2)|."
  openmath: (forall (x n) (-> (and (in n N) (!= (sin (/ x 2)) 0)) (<= (abs (real_partial_sum (lambda (k) (sin (* (+ k 1) x))) n)) (/ 1 (abs (sin (/ x 2)))))))
  hard_negative:
    statement: 全ての実数$x$で、$\sum_{k<n}\sin((k+1)x)$は$n$について有界であり、その上界は$x$によらず一定にとれる。
    reason: $x_m=\pi/m$、$n=m$では和は$\sum_{k=1}^m\sin(k\pi/m)$で項は全て$0$以上である。$m/6\leq k\leq5m/6$の項は$1/2$以上で、その個数は$2m/3-1$以上なので、和は$m/3-1/2$以上となる。上界は$x$に依存する。
  target: |
    ∀ (x : ℝ) (n : ℕ), Real.sin (x / 2) ≠ 0 → |∑ k ∈ Finset.range n, Real.sin (((k : ℝ) + 1) * x)| ≤ 1 / |Real.sin (x / 2)|
  proof: |
    by
      intro x n hx
      have key : ∀ m : ℕ, 2 * Real.sin (x / 2) * ∑ k ∈ Finset.range m, Real.sin (((k : ℝ) + 1) * x) = Real.cos (x / 2) - Real.cos (((m : ℝ) + 1 / 2) * x) := by
        intro m
        induction m with
        | zero =>
          simp only [Finset.range_zero, Finset.sum_empty, mul_zero, Nat.cast_zero]
          rw [show ((0 : ℝ) + 1 / 2) * x = x / 2 by ring]
          ring
        | succ m ih =>
          rw [Finset.sum_range_succ, mul_add, ih]
          push_cast
          have h := Real.cos_sub_cos (((m : ℝ) + 1 / 2) * x) (((m : ℝ) + 1 + 1 / 2) * x)
          have e1 : (((m : ℝ) + 1 / 2) * x + ((m : ℝ) + 1 + 1 / 2) * x) / 2 = ((m : ℝ) + 1) * x := by ring
          have e2 : (((m : ℝ) + 1 / 2) * x - ((m : ℝ) + 1 + 1 / 2) * x) / 2 = -(x / 2) := by ring
          rw [e1, e2, Real.sin_neg] at h
          linarith
      have hs : 0 < |Real.sin (x / 2)| := abs_pos.2 hx
      have h1 : |2 * Real.sin (x / 2) * ∑ k ∈ Finset.range n, Real.sin (((k : ℝ) + 1) * x)| ≤ 2 := by
        rw [key]
        exact abs_le.2 ⟨by linarith [Real.neg_one_le_cos (x / 2), Real.cos_le_one (((n : ℝ) + 1 / 2) * x)], by linarith [Real.cos_le_one (x / 2), Real.neg_one_le_cos (((n : ℝ) + 1 / 2) * x)]⟩
      rw [abs_mul, abs_mul, abs_of_pos (by norm_num : (0 : ℝ) < 2)] at h1
      rw [le_div_iff₀ hs]
      linarith
- id: sin_series_dirichlet
  kind: gap
  level: 2
  topic: 級数・ディリクレの判定法の応用
  statement: $\sin(x/2)\neq0$ならば、級数$\sum_n\frac{\sin((n+1)x)}{n+1}$は収束する。
