  sketch:
  - "construct: For each n choose x_n in S with a - 1/(n+1) < x_n ≤ a."
  - "derive: Then x_n converges to a."
  - "conclude: Since S is closed, a belongs to S."
  openmath: (forall (S a) (-> (and (closed_in R S) (exists (x) (in x S)) (is_lub S a)) (in a S)))
  hard_negative:
    statement: 上に有界で空でない$S\subset\mathbb{R}$の上限は$S$に属する。
