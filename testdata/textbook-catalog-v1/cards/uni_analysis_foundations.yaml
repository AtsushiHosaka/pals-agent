  kind: gap
  level: 1
  topic: 広義積分・非負関数と有界な積分
  statement: $f$が$[a,\infty)$で連続かつ非負で、全ての$t\geq a$で$\int_a^tf\leq K$ならば、$\lim_{t\to\infty}\int_a^tf$は存在する。
  statement_en: If f is continuous and nonnegative on [a, ∞) and ∫_a^t f ≤ K for all t ≥ a, then the limit of ∫_a^t f as t → ∞ exists.
  assumptions:
