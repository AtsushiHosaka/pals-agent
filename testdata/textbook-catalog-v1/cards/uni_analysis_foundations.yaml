- id: const_nth_root_limit
  kind: gap
  level: 1
  topic: 数列の極限・定数のべき根
  statement: $a>0$ならば、$a^{1/(n+1)}\to1$である。
  statement_en: If a > 0, then a^(1/(n+1)) → 1 as n tends to infinity.
  assumptions:
