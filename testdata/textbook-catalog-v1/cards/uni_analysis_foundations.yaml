  - $u>0$
  quantifiers:
  - 任意の$f$、$a$、$u$
  - ある$\delta>0$
  conclusion: $a<x<a+\delta$なら$f(a)<f(x)$、$a-\delta<x<a$なら$f(x)<f(a)$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$が$a$で微分係数$u>0$をもつとする。微分係数の定義を$\varepsilon=u/2$に適用すると、$\delta>0$があり、$0<|x-a|<\delta$なら$|(f(x)-f(a))/(x-a)-u|<u/2$である。特に$(f(x)-f(a))/(x-a)>u/2>0$となる。

    $a<x<a+\delta$なら$x-a>0$なので$f(x)-f(a)>0$である。$a-\delta<x<a$なら$x-a<0$なので$f(x)-f(a)<0$である。
  strategy: Near a the difference quotient exceeds u/2, so its numerator has the sign of x - a.
  sketch:
