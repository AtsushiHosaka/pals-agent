        push_neg at hc
        exact hb ⟨M, fun n => (hc n).le⟩
      obtain ⟨K, hK⟩ := h1
      exact ⟨K, fun n hn => hK.trans (hm hn)⟩
- id: two_subsequence_limits_not_convergent
  kind: gap
  level: 1
  topic: 数列の発散・極限の異なる部分列
  statement: 実数列$(a_n)$の二つの部分列が異なる値に収束するならば、$(a_n)$は収束しない。
  statement_en: If two subsequences of a real sequence converge to different values, then the sequence does not converge.
  assumptions:
  - $p,q$は狭義単調増加、$a_{p(n)}\to L$、$a_{q(n)}\to M$
  - $L\neq M$
  quantifiers:
  - 任意の$(a_n)$、$p$、$q$、$L$、$M$
  conclusion: $(a_n)$は収束しない。
  answer: |
    実数列$(a_n)$と狭義単調増加な$p,q:\mathbb{N}\to\mathbb{N}$があり、$a_{p(n)}\to L$、$a_{q(n)}\to M$、$L\neq M$とする。

    $(a_n)$が$A$に収束すると仮定する。$\varepsilon>0$に対し$K$をとり$n\geq K$で$|a_n-A|<\varepsilon$とする。$p(n)\geq n$なので、$n\geq K$で$|a_{p(n)}-A|<\varepsilon$である。よって$a_{p(n)}\to A$であり、同様に$a_{q(n)}\to A$である。極限の一意性から$L=A=M$となり、$L\neq M$に矛盾する。
  strategy: A limit of the whole sequence would also be the limit of each subsequence.
  sketch:
  - "setup: Suppose a converges to A."
  - "derive: Since p(n) ≥ n, the subsequence a_{p(n)} converges to A; likewise for q."
  - "contradiction: Uniqueness of limits gives L = A = M."
  openmath: (forall (a p q L M) (-> (and (strict_mono_index p) (strict_mono_index q) (seq_fn_tends_to (lambda (n) (seq_value a (fn_value p n))) L) (seq_fn_tends_to (lambda (n) (seq_value a (fn_value q n))) M) (!= L M)) (not (exists (A) (seq_tends_to a A)))))
  hard_negative:
    statement: 実数列の二つの部分列が同じ値$L$に収束するならば、数列全体も$L$に収束する。
    reason: $a_n$を$3$の倍数の番号で$0$、それ以外で$n$とすると、$a_{6n}$も$a_{3n}$も$0$に収束するが、数列全体は収束しない。
  target: |
    ∀ (a : ℕ → ℝ) (p q : ℕ → ℕ) (L M : ℝ), StrictMono p → StrictMono q → Filter.Tendsto (fun n => a (p n)) Filter.atTop (nhds L) → Filter.Tendsto (fun n => a (q n)) Filter.atTop (nhds M) → L ≠ M → ¬ ∃ A : ℝ, Filter.Tendsto a Filter.atTop (nhds A)
  proof: |
    by
      intro a p q L M hp hq h1 h2 hne
      rintro ⟨A, hA⟩
      have h3 := tendsto_nhds_unique h1 (hA.comp hp.tendsto_atTop)
      have h4 := tendsto_nhds_unique h2 (hA.comp hq.tendsto_atTop)
      exact hne (h3.trans h4.symm)
- id: seq_monotone_limit_upper_bound
  kind: gap
  level: 1
  topic: 数列の極限・単調列の極限は上界
  statement: 単調非減少な実数列が$L$に収束するならば、全ての$n$で$a_n\leq L$である。
  statement_en: If a nondecreasing real sequence converges to L, then a_n ≤ L for all n.
  assumptions:
  - $(a_n)$は単調非減少
  - $a_n\to L$
  quantifiers:
  - 任意の$(a_n)$と$L$
  conclusion: 全ての$n$で$a_n\leq L$である。
  answer: |
    $(a_n)$を単調非減少な実数列とし、$a_n\to L$とする。

    ある$n$で$a_n>L$と仮定する。$\varepsilon=a_n-L>0$に対し、十分大きな$m\geq n$で$|a_m-L|<\varepsilon$である。このとき$a_m<L+\varepsilon=a_n$となるが、単調性から$a_n\leq a_m$なので矛盾する。よって全ての$n$で$a_n\leq L$である。
  strategy: A term above L would keep all later terms away from L by monotonicity.
  sketch:
  - "setup: Suppose a_n > L and put ε = a_n - L."
  - "derive: For large m ≥ n, a_m < L + ε = a_n."
  - "contradiction: Monotonicity gives a_n ≤ a_m."
  openmath: (forall (a L) (-> (and (seq_monotone a) (seq_tends_to a L)) (forall (n) (<= (seq_value a n) L))))
  hard_negative:
    statement: 単調非減少な実数列が$L$に収束するならば、全ての$n$で$a_n<L$である。
    reason: 定数列$a_n=L$では$a_n=L$であり、狭義の不等式は成り立たない。
  target: |
    ∀ (a : ℕ → ℝ) (L : ℝ), Monotone a → Filter.Tendsto a Filter.atTop (nhds L) → ∀ n, a n ≤ L
  proof: |
    by
      intro a L hm h n
      exact hm.ge_of_tendsto h n
- id: stolz_cesaro
  kind: named
  level: 1
  topic: 数列の極限・シュトルツ・チェザロの定理
  statement: シュトルツ・チェザロの定理。実数列$(b_n)$が狭義単調増加で$+\infty$に発散し、$(a_{n+1}-a_n)/(b_{n+1}-b_n)\to L$ならば、$a_n/b_n\to L$である。
  statement_en: Stolz-Cesàro theorem. If a real sequence b is strictly increasing and diverges to plus infinity, and (a_{n+1} - a_n)/(b_{n+1} - b_n) → L, then a_n/b_n → L.
  assumptions:
  - $(b_n)$は狭義単調増加で$b_n\to+\infty$
  - $(a_{n+1}-a_n)/(b_{n+1}-b_n)\to L$
  quantifiers:
  - 任意の$(a_n)$、$(b_n)$、$L$
  conclusion: $a_n/b_n\to L$である。ここで$b_n>0$となる十分先の$n$で商を考える。
  answer: |
    実数列$(b_n)$が狭義単調増加で$b_n\to+\infty$、実数列$(a_n)$と$L\in\mathbb{R}$が$(a_{n+1}-a_n)/(b_{n+1}-b_n)\to L$を満たすとする。$c_n=a_n-Lb_n$とおき、$\varepsilon>0$をとる。

    ある$K$があり、$n\geq K$なら$b_n>0$かつ$\left|\frac{a_{n+1}-a_n}{b_{n+1}-b_n}-L\right|<\varepsilon/2$である。$b_{n+1}-b_n>0$なので、$n\geq K$で$|c_{n+1}-c_n|\leq\frac\varepsilon2(b_{n+1}-b_n)$となる。これを$K$から$n-1$まで足すと、$n\geq K$で$|c_n-c_K|\leq\frac\varepsilon2(b_n-b_K)$である。

    $b_n\to+\infty$より、ある$K'\geq K$があり、$n\geq K'$なら$|c_K|<\frac\varepsilon2b_n$である。このとき$b_K>0$より$|c_n|\leq|c_K|+\frac\varepsilon2(b_n-b_K)<\varepsilon b_n$である。$b_n>0$で割ると$|a_n/b_n-L|=|c_n|/b_n<\varepsilon$を得る。
  strategy: Telescope the increments of c_n = a_n - L b_n after a threshold and divide by b_n.
  sketch:
  - "setup: Put c_n = a_n - L b_n and fix ε > 0."
  - "derive: For n ≥ K, |c_{n+1} - c_n| ≤ (ε/2)(b_{n+1} - b_n) and b_n > 0."
  - "induction: Summing gives |c_n - c_K| ≤ (ε/2)(b_n - b_K)."
  - "derive: Since b_n → +∞, |c_K| < (ε/2) b_n for large n."
  - "conclude: So |c_n| < ε b_n, that is, |a_n/b_n - L| < ε."
  openmath: (forall (a b L) (-> (and (forall (n) (< (seq_value b n) (seq_value b (+ n 1)))) (seq_fn_tends_to_infinity (lambda (n) (seq_value b n))) (seq_fn_tends_to (lambda (n) (/ (- (seq_value a (+ n 1)) (seq_value a n)) (- (seq_value b (+ n 1)) (seq_value b n)))) L)) (seq_fn_tends_to (lambda (n) (/ (seq_value a n) (seq_value b n))) L)))
  hard_negative:
    statement: $b_n$が$+\infty$に発散しなくても、狭義単調増加で差の比が$L$に収束すれば、$a_n/b_n\to L$である。
    reason: $a_n=1+1/(n+1)$の差と$b_n=1-1/(n+1)$の差の比は常に$-1$だが、$a_n/b_n\to1\neq-1$である（$n=0$では$b_0=0$だが、十分先の極限は変わらない）。
  target: |
    ∀ (a b : ℕ → ℝ) (L : ℝ), StrictMono b → Filter.Tendsto b Filter.atTop Filter.atTop → Filter.Tendsto (fun n => (a (n + 1) - a n) / (b (n + 1) - b n)) Filter.atTop (nhds L) → Filter.Tendsto (fun n => a n / b n) Filter.atTop (nhds L)
  proof: |
    by
      intro a b L hb hinf h
      refine Metric.tendsto_atTop.2 fun ε hε => ?_
      obtain ⟨N1, hN1⟩ := Metric.tendsto_atTop.1 h (ε / 2) (by positivity)
      obtain ⟨N2, hN2⟩ := Filter.tendsto_atTop_atTop.1 hinf 1
      obtain ⟨N, hNdef⟩ : ∃ N, N = max N1 N2 := ⟨_, rfl⟩
      have hbN : 0 < b N := by
        have h1 := hN2 N (hNdef ▸ le_max_right _ _)
        linarith
      have hstep : ∀ n, N ≤ n → |(a (n + 1) - L * b (n + 1)) - (a n - L * b n)| ≤ ε / 2 * (b (n + 1) - b n) := by
        intro n hn
        have hd : 0 < b (n + 1) - b n := sub_pos.2 (hb (Nat.lt_succ_self n))
        have hq := hN1 n ((le_max_left N1 N2).trans (hNdef ▸ hn))
        rw [Real.dist_eq] at hq
        have e : (a (n + 1) - L * b (n + 1)) - (a n - L * b n) = ((a (n + 1) - a n) / (b (n + 1) - b n) - L) * (b (n + 1) - b n) := by
          field_simp
          ring
        rw [e, abs_mul, abs_of_pos hd]
        exact mul_le_mul_of_nonneg_right hq.le hd.le
      have hsum : ∀ n, N ≤ n → |(a n - L * b n) - (a N - L * b N)| ≤ ε / 2 * (b n - b N) := by
        intro n hn
        induction n, hn using Nat.le_induction with
        | base => simp
        | succ n hn ih =>
          have h1 := hstep n hn
          have t := abs_add_le ((a (n + 1) - L * b (n + 1)) - (a n - L * b n)) ((a n - L * b n) - (a N - L * b N))
          have e2 : (a (n + 1) - L * b (n + 1)) - (a n - L * b n) + ((a n - L * b n) - (a N - L * b N)) = (a (n + 1) - L * b (n + 1)) - (a N - L * b N) := by ring
          rw [e2] at t
          have e3 : ε / 2 * (b (n + 1) - b n) + ε / 2 * (b n - b N) = ε / 2 * (b (n + 1) - b N) := by ring
          linarith
      obtain ⟨N3, hN3⟩ := Filter.tendsto_atTop_atTop.1 hinf (2 * |a N - L * b N| / ε + 1)
      refine ⟨max N N3, fun n hn => ?_⟩
      have hnN : N ≤ n := le_of_max_le_left hn
      have hbn : 0 < b n := lt_of_lt_of_le hbN (hb.monotone hnN)
      have hM := hN3 n (le_of_max_le_right hn)
      have hM2 : 2 * |a N - L * b N| / ε < b n := by linarith
      rw [div_lt_iff₀ hε] at hM2
      have e4 : a n / b n - L = (a n - L * b n) / b n := by
        field_simp
      rw [Real.dist_eq, e4, abs_div, abs_of_pos hbn, div_lt_iff₀ hbn]
      have h5 := hsum n hnN
      have h6 : |a n - L * b n| ≤ |(a n - L * b n) - (a N - L * b N)| + |a N - L * b N| := by
        have h7 := abs_add_le ((a n - L * b n) - (a N - L * b N)) (a N - L * b N)
        rwa [sub_add_cancel] at h7
      have h8 : 0 < ε / 2 * b N := by positivity
      have e5 : ε / 2 * (b n - b N) = ε / 2 * b n - ε / 2 * b N := by ring
      nlinarith
- id: limsup_subsequence_exists
  kind: gap
  level: 2
  topic: 上極限・上極限に収束する部分列
  statement: 有界な実数列$(a_n)$には、上極限$\limsup_{n\to\infty}a_n$に収束する部分列が存在する。
  statement_en: Every bounded real sequence has a subsequence converging to its limit superior.
  assumptions:
  - 全ての$n$で$|a_n|\leq M$
  quantifiers:
  - 任意の$(a_n)$と$M$
  conclusion: 狭義単調増加な$p$があり、$a_{p(n)}\to\limsup a_n$である。
  answer: |
    $(a_n)$を全ての$n$で$|a_n|\leq M$を満たす実数列とし、$l=\limsup a_n$、$s_n=\sup_{k\geq n}a_k$とおく。$(s_n)$は単調非増加で$l$に収束し、全ての$n$で$s_n\geq l$である。

    $\varepsilon>0$と$K$をとる。十分大きな$n\geq K$で$s_n<l+\varepsilon$である。また$s_n\geq l>l-\varepsilon$なので、上限の性質から$a_k>l-\varepsilon$となる$k\geq n$がある。この$k$は$k\geq K$かつ$l-\varepsilon<a_k\leq s_n<l+\varepsilon$を満たす。

    したがって$l$の任意の$\varepsilon$近傍に、いくらでも先の番号の項が入る。$|a_{p(0)}-l|<1$となる$p(0)$をとり、$p(k+1)>p(k)$かつ$|a_{p(k+1)}-l|<1/(k+2)$となるように$p$を帰納的に選ぶと、$a_{p(k)}\to l$である。
  strategy: Late terms lie below l + ε and infinitely many lie above l - ε, so indices can be extracted with shrinking radii.
  sketch:
  - "setup: Let l be the limit superior and s_n the supremum of a_k over k ≥ n."
  - "derive: For large n, s_n < l + ε, and s_n ≥ l gives some k ≥ n with a_k > l - ε."
  - "construct: Choose p inductively with |a_{p(k)} - l| < 1/(k+1)."
  - "conclude: The subsequence converges to l."
  openmath: (forall (a M) (-> (forall (n) (<= (abs (seq_value a n)) M)) (exists (p) (and (strict_mono_index p) (seq_fn_tends_to (lambda (n) (seq_value a (fn_value p n))) (seq_limsup a))))))
  hard_negative:
    statement: 有界な実数列の上極限は、数列のどれかの項の値に一致する。
    reason: $a_n=1-1/(n+1)$の上極限は$1$だが、どの項も$1$に等しくない。
  target: |
    ∀ (a : ℕ → ℝ) (M : ℝ), (∀ n, |a n| ≤ M) → ∃ p : ℕ → ℕ, StrictMono p ∧ Filter.Tendsto (fun n => a (p n)) Filter.atTop (nhds (Filter.limsup a Filter.atTop))
  proof: |
    by
      intro a M h
      have hb : Filter.IsBoundedUnder (· ≤ ·) Filter.atTop a :=
        Filter.isBoundedUnder_of ⟨M, fun n => (le_abs_self _).trans (h n)⟩
      have hb' : Filter.IsBoundedUnder (· ≥ ·) Filter.atTop a :=
        Filter.isBoundedUnder_of ⟨-M, fun n => (abs_le.1 (h n)).1⟩
      have hf : ∀ k : ℕ, ∃ᶠ n in Filter.atTop, |a n - Filter.limsup a Filter.atTop| < 1 / ((k : ℝ) + 1) := by
        intro k
        have hp : 0 < 1 / ((k : ℝ) + 1) := by positivity
        have h1 : ∃ᶠ n in Filter.atTop, Filter.limsup a Filter.atTop - 1 / ((k : ℝ) + 1) < a n :=
          Filter.frequently_lt_of_lt_limsup hb'.isCoboundedUnder_le (by linarith)
        have h2 : ∀ᶠ n in Filter.atTop, a n < Filter.limsup a Filter.atTop + 1 / ((k : ℝ) + 1) :=
          Filter.eventually_lt_of_limsup_lt (by linarith) hb
        exact (h1.and_eventually h2).mono fun n hn => abs_lt.2 ⟨by linarith [hn.1], by linarith [hn.2]⟩
      obtain ⟨p, hp, hp2⟩ := Filter.extraction_forall_of_frequently hf
      refine ⟨p, hp, Metric.tendsto_atTop.2 fun ε hε => ?_⟩
      obtain ⟨K, hK⟩ := exists_nat_one_div_lt hε
      refine ⟨K, fun n hn => ?_⟩
      rw [Real.dist_eq]
      have h2 : 1 / ((n : ℝ) + 1) ≤ 1 / ((K : ℝ) + 1) := by
        apply one_div_le_one_div_of_le (by positivity)
        have h3 : (K : ℝ) ≤ n := by exact_mod_cast hn
        linarith
      exact ((hp2 n).trans_le h2).trans hK
- id: limsup_eq_limit_of_tail_sup
  kind: textbook
  level: 2
  topic: 上極限・尾部の上限の極限
  statement: 有界な実数列$(a_n)$について、$s_n=\sup_{k\geq n}a_k$は単調非増加で、$s_n\to\limsup_{n\to\infty}a_n$である。ここで$\limsup a_n$は「十分先の全ての項の上界となる実数の下限」とする。
  statement_en: For a bounded real sequence a, the numbers s_n = sup of a_k over k ≥ n are nonincreasing and converge to the limit superior of a, where the limit superior is the infimum of the reals that bound all sufficiently late terms from above.
  assumptions:
  - 全ての$n$で$|a_n|\leq M$
  quantifiers:
  - 任意の$(a_n)$と$M$
  conclusion: $(s_n)$は単調非増加で$s_n\to\limsup a_n$である。
  answer: |
    $(a_n)$を全ての$n$で$|a_n|\leq M$を満たす実数列とし、$l$を、ある$K$以降の全ての項の上界となる実数全体の下限とする。この集合は$M$を含み$-M$を下界にもつので$l$は定まる。

    $n\leq m$なら$\{a_k\mid k\geq m\}\subset\{a_k\mid k\geq n\}$なので$s_m\leq s_n$である。

    $\varepsilon>0$をとる。$l$は下限なので、ある$u<l+\varepsilon/2$とある$K$があり、$k\geq K$なら$a_k\leq u$である。よって$n\geq K$なら$s_n\leq u<l+\varepsilon$である。

    一方、任意の$n$で$s_n$は$n$以降の全ての項の上界なので、定義から$l\leq s_n$である。以上より$n\geq K$で$|s_n-l|<\varepsilon$となる。
  strategy: Monotonicity follows from shrinking tails, and the two bounds on s_n come directly from the definition of l as an infimum.
  sketch:
  - "derive: Shrinking the tail shrinks the supremum, so s_n is nonincreasing."
  - "derive: l is an infimum, so some u < l + ε bounds all terms from some K on; hence s_n ≤ u for n ≥ K."
  - "derive: Each s_n bounds all terms from n on, so l ≤ s_n."
  - "conclude: |s_n - l| < ε for n ≥ K."
  openmath: (forall (a M s) (-> (and (forall (n) (<= (abs (seq_value a n)) M)) (forall (n) (and (forall (k) (-> (>= k n) (<= (seq_value a k) (seq_value s n)))) (forall (u) (-> (forall (k) (-> (>= k n) (<= (seq_value a k) u))) (<= (seq_value s n) u)))))) (and (seq_antitone s) (seq_tends_to s (seq_limsup a)))))
  hard_negative:
    statement: 有界な実数列について、$\sup_{k\geq0}a_k=\limsup a_n$である。
    reason: $a_0=1$、$n\geq1$で$a_n=0$とすると、全体の上限は$1$だが上極限は$0$である。尾部をとる操作が必要である。
  target: |
    ∀ (a : ℕ → ℝ) (M : ℝ), (∀ n, |a n| ≤ M) → Antitone (fun n => sSup (a '' Set.Ici n)) ∧ Filter.Tendsto (fun n => sSup (a '' Set.Ici n)) Filter.atTop (nhds (Filter.limsup a Filter.atTop))
  proof: |
    by
      intro a M h
      have hbdd : ∀ n, BddAbove (a '' Set.Ici n) := fun n =>
        ⟨M, by
          rintro _ ⟨k, _, rfl⟩
          exact (le_abs_self _).trans (h k)⟩
      have hb : Filter.IsBoundedUnder (· ≤ ·) Filter.atTop a :=
        Filter.isBoundedUnder_of ⟨M, fun n => (le_abs_self _).trans (h n)⟩
      have hb' : Filter.IsBoundedUnder (· ≥ ·) Filter.atTop a :=
        Filter.isBoundedUnder_of ⟨-M, fun n => (abs_le.1 (h n)).1⟩
      constructor
      · intro m n hmn
        refine csSup_le_csSup (hbdd m) ⟨a n, n, Set.mem_Ici.2 le_rfl, rfl⟩ ?_
        rintro _ ⟨k, hk, rfl⟩
        exact ⟨k, Set.mem_Ici.2 (hmn.trans hk), rfl⟩
      · refine Metric.tendsto_atTop.2 fun ε hε => ?_
        have h1 : ∀ᶠ n in Filter.atTop, a n < Filter.limsup a Filter.atTop + ε / 2 :=
          Filter.eventually_lt_of_limsup_lt (by linarith) hb
        obtain ⟨K, hK⟩ := Filter.eventually_atTop.1 h1
        refine ⟨K, fun n hn => ?_⟩
        have hup : sSup (a '' Set.Ici n) ≤ Filter.limsup a Filter.atTop + ε / 2 := by
          refine csSup_le ⟨a n, n, Set.mem_Ici.2 le_rfl, rfl⟩ ?_
          rintro _ ⟨k, hk, rfl⟩
          exact (hK k (hn.trans hk)).le
        have hlow : Filter.limsup a Filter.atTop - ε / 2 < sSup (a '' Set.Ici n) := by
          have h2 : ∃ᶠ k in Filter.atTop, Filter.limsup a Filter.atTop - ε / 2 < a k :=
            Filter.frequently_lt_of_lt_limsup hb'.isCoboundedUnder_le (by linarith)
          obtain ⟨k, hk, hk2⟩ := Filter.frequently_atTop.1 h2 n
          exact hk2.trans_le (le_csSup (hbdd n) ⟨k, Set.mem_Ici.2 hk, rfl⟩)
        rw [Real.dist_eq, abs_lt]
        constructor <;> linarith
- id: frequently_gt_of_lt_limsup
  kind: gap
  level: 2
  topic: 上極限・上極限より小さい値を超える項
  statement: 有界な実数列$(a_n)$と$c<\limsup_{n\to\infty}a_n$について、任意の$K$に対して$n\geq K$かつ$c<a_n$となる$n$が存在する。
  statement_en: For a bounded real sequence a and c below its limit superior, for every K there is n ≥ K with c < a_n.
  assumptions:
  - 全ての$n$で$|a_n|\leq M$
  - $c<\limsup a_n$
  quantifiers:
  - 任意の$(a_n)$、$M$、$c$、$K$
  conclusion: $n\geq K$かつ$c<a_n$となる$n$が存在する。
  answer: |
    $(a_n)$を全ての$n$で$|a_n|\leq M$を満たす実数列とし、$c<\limsup a_n$、$K$を自然数とする。

    $n\geq K$の全てで$a_n\leq c$と仮定する。$c$は$K$以降の全ての項の上界になるので、上極限の定義（十分先の全ての項の上界の下限）から$\limsup a_n\leq c$となり、仮定に矛盾する。よって$n\geq K$かつ$c<a_n$となる$n$がある。
  strategy: If all terms from K on were at most c, then c would bound the limit superior.
  sketch:
  - "setup: Suppose a_n ≤ c for all n ≥ K."
  - "derive: Then c bounds all sufficiently late terms, so the limit superior is at most c."
  - "contradiction: This contradicts c < limsup a."
  openmath: (forall (a M c K) (-> (and (forall (n) (<= (abs (seq_value a n)) M)) (< c (seq_limsup a))) (exists (n) (and (>= n K) (< c (seq_value a n))))))
  hard_negative:
    statement: $c<\limsup a_n$ならば、十分大きな全ての$n$で$c<a_n$である。
    reason: $a_n=(-1)^n$、$c=0$では$\limsup a_n=1>0$だが、奇数番目で$a_n<0$である。超える項は無限個あるが、全てではない。
  target: |
    ∀ (a : ℕ → ℝ) (M c : ℝ) (K : ℕ), (∀ n, |a n| ≤ M) → c < Filter.limsup a Filter.atTop → ∃ n, K ≤ n ∧ c < a n
  proof: |
    by
      intro a M c K h hc
      have hb' : Filter.IsBoundedUnder (· ≥ ·) Filter.atTop a :=
        Filter.isBoundedUnder_of ⟨-M, fun n => (abs_le.1 (h n)).1⟩
      have h1 : ∃ᶠ n in Filter.atTop, c < a n :=
        Filter.frequently_lt_of_lt_limsup hb'.isCoboundedUnder_le hc
      exact Filter.frequently_atTop.1 h1 K
- id: limsup_add_le_bounded
  kind: gap
  level: 2
  topic: 上極限・和の劣加法性
  statement: 有界な実数列$(a_n),(b_n)$について、$\limsup(a_n+b_n)\leq\limsup a_n+\limsup b_n$である。
  statement_en: For bounded real sequences a and b, the limit superior of a_n + b_n is at most the sum of the limit superiors of a and b.
  assumptions:
  - 全ての$n$で$|a_n|\leq M$、$|b_n|\leq M$
  quantifiers:
  - 任意の$(a_n)$、$(b_n)$、$M$
  conclusion: $\limsup(a_n+b_n)\leq\limsup a_n+\limsup b_n$である。
  answer: |
    $(a_n),(b_n)$を全ての$n$で$|a_n|\leq M$、$|b_n|\leq M$を満たす実数列とする。$A=\limsup a_n$、$B=\limsup b_n$とおき、$\varepsilon>0$をとる。

    $\limsup$の定義から、十分大きな全ての$n$で$a_n<A+\varepsilon/2$かつ$b_n<B+\varepsilon/2$である。よって十分大きな全ての$n$で$a_n+b_n<A+B+\varepsilon$であり、$A+B+\varepsilon$は十分先の項の上界である。したがって$\limsup(a_n+b_n)\leq A+B+\varepsilon$である。$\varepsilon>0$は任意なので$\limsup(a_n+b_n)\leq A+B$である。
  strategy: Bound both sequences above by their limit superiors plus ε/2 for large n and let ε tend to 0.
  sketch:
  - "setup: Put A, B for the two limit superiors and fix ε > 0."
  - "derive: For large n, a_n + b_n < A + B + ε."
  - "derive: Hence the limit superior of the sum is at most A + B + ε."
  - "conclude: ε is arbitrary, which gives the inequality."
  openmath: (forall (a b c M) (-> (and (forall (n) (and (<= (abs (seq_value a n)) M) (<= (abs (seq_value b n)) M))) (forall (n) (= (seq_value c n) (+ (seq_value a n) (seq_value b n))))) (<= (seq_limsup c) (+ (seq_limsup a) (seq_limsup b)))))
  hard_negative:
    statement: 有界な実数列について、常に$\limsup(a_n+b_n)=\limsup a_n+\limsup b_n$である。
    reason: $a_n=(-1)^n$、$b_n=-(-1)^n$では左辺が$0$、右辺が$2$である。
  target: |
    ∀ (a b : ℕ → ℝ) (M : ℝ), (∀ n, |a n| ≤ M) → (∀ n, |b n| ≤ M) → Filter.limsup (fun n => a n + b n) Filter.atTop ≤ Filter.limsup a Filter.atTop + Filter.limsup b Filter.atTop
  proof: |
    by
      intro a b M ha hb
      have ba : Filter.IsBoundedUnder (· ≤ ·) Filter.atTop a :=
        Filter.isBoundedUnder_of ⟨M, fun n => (le_abs_self _).trans (ha n)⟩
      have bb : Filter.IsBoundedUnder (· ≤ ·) Filter.atTop b :=
        Filter.isBoundedUnder_of ⟨M, fun n => (le_abs_self _).trans (hb n)⟩
      have bs : Filter.IsBoundedUnder (· ≥ ·) Filter.atTop (fun n => a n + b n) :=
        Filter.isBoundedUnder_of ⟨-M + -M, fun n => add_le_add (abs_le.1 (ha n)).1 (abs_le.1 (hb n)).1⟩
      refine le_of_forall_pos_le_add fun ε hε => ?_
      have h1 : ∀ᶠ n in Filter.atTop, a n < Filter.limsup a Filter.atTop + ε / 2 :=
        Filter.eventually_lt_of_limsup_lt (by linarith) ba
      have h2 : ∀ᶠ n in Filter.atTop, b n < Filter.limsup b Filter.atTop + ε / 2 :=
        Filter.eventually_lt_of_limsup_lt (by linarith) bb
      refine Filter.limsup_le_of_le bs.isCoboundedUnder_le ?_
      filter_upwards [h1, h2] with n hn1 hn2
      linarith
- id: subsequence_limit_le_limsup
  kind: gap
  level: 2
  topic: 上極限・部分列の極限の上界
  statement: 有界な実数列$(a_n)$の部分列が$c$に収束するならば、$c\leq\limsup_{n\to\infty}a_n$である。
  statement_en: If a subsequence of a bounded real sequence converges to c, then c is at most the limit superior of the sequence.
  assumptions:
  - 全ての$n$で$|a_n|\leq M$
  - $p$は狭義単調増加、$a_{p(n)}\to c$
  quantifiers:
  - 任意の$(a_n)$、$M$、$p$、$c$
  conclusion: $c\leq\limsup a_n$である。
  answer: |
    $(a_n)$を全ての$n$で$|a_n|\leq M$を満たす実数列、$p$を狭義単調増加とし、$a_{p(n)}\to c$とする。$l=\limsup a_n$とおき、$l<c$と仮定して矛盾を導く。

    $l<s<c$となる$s$をとる。上極限の定義から、ある$K$があり$n\geq K$なら$a_n\leq s$である。$p(n)\geq n$なので、$n\geq K$で$a_{p(n)}\leq s$である。極限は弱い不等式を保つから$c\leq s$となり、$s<c$に矛盾する。
  strategy: A value between the limit superior and c would bound the late terms and hence the limit of the subsequence.
  sketch:
  - "setup: Suppose limsup a < c and choose s between them."
  - "derive: All sufficiently late terms are at most s, so a_{p(n)} ≤ s for large n."
  - "contradiction: Passing to the limit gives c ≤ s < c."
  openmath: (forall (a M p c) (-> (and (forall (n) (<= (abs (seq_value a n)) M)) (strict_mono_index p) (seq_fn_tends_to (lambda (n) (seq_value a (fn_value p n))) c)) (<= c (seq_limsup a))))
  hard_negative:
    statement: 有界な実数列の部分列が$c$に収束するならば、$c=\limsup a_n$である。
    reason: $a_n=(-1)^n$の奇数番目は$-1$に収束するが、上極限は$1$である。
  target: |
    ∀ (a : ℕ → ℝ) (M c : ℝ) (p : ℕ → ℕ), (∀ n, |a n| ≤ M) → StrictMono p → Filter.Tendsto (fun n => a (p n)) Filter.atTop (nhds c) → c ≤ Filter.limsup a Filter.atTop
  proof: |
    by
      intro a M c p h hp ht
      have hb : Filter.IsBoundedUnder (· ≤ ·) Filter.atTop a :=
        Filter.isBoundedUnder_of ⟨M, fun n => (le_abs_self _).trans (h n)⟩
      by_contra hc
      push_neg at hc
      obtain ⟨s, h1, h2⟩ := exists_between hc
      have h3 : ∀ᶠ n in Filter.atTop, a n < s := Filter.eventually_lt_of_limsup_lt h1 hb
      have h4 : ∀ᶠ n in Filter.atTop, a (p n) < s := hp.tendsto_atTop.eventually h3
      have h5 : c ≤ s := le_of_tendsto ht (h4.mono fun n hn => hn.le)
      linarith
- id: series_tail_shift_iff
  kind: gap
  level: 1
  topic: 級数・有限項の除去
  statement: 実数列$(a_n)$と自然数$k$について、級数$\sum_n a_{n+k}$が収束することと級数$\sum_n a_n$が収束することは同値である。
  statement_en: For a real sequence a and a natural number k, the series of a_{n+k} converges if and only if the series of a_n converges.
  assumptions:
  - $(a_n)$は実数列、$k$は自然数
  quantifiers:
  - 任意の$(a_n)$と$k$
  conclusion: 部分和$\sum_{i<m}a_{i+k}$の収束と部分和$\sum_{i<m}a_i$の収束は同値である。
  answer: |
    $(a_n)$を実数列、$k$を自然数とし、$A=\sum_{i<k}a_i$とおく。全ての$m$で$\sum_{i<m+k}a_i=A+\sum_{i<m}a_{i+k}$である。

    $\sum_{i<m}a_{i+k}\to s$なら、$\sum_{i<m+k}a_i\to A+s$である。数列の極限は添字を$k$ずらしても変わらないので、$\sum_{i<m}a_i\to A+s$である。

    逆に$\sum_{i<m}a_i\to s$なら、添字をずらして$\sum_{i<m+k}a_i\to s$であり、$\sum_{i<m}a_{i+k}\to s-A$である。
  strategy: Compare partial sums through the identity with the finite sum A and shift the index.
  sketch:
  - "setup: Put A for the sum of the first k terms."
  - "derive: The partial sum up to m + k equals A plus the partial sum of the shifted series."
  - "apply_theorem: Shifting the index of a sequence does not change its limit."
  - "conclude: Each series converges exactly when the other does."
  openmath: (forall (a k) (-> (in k N) (<-> (exists (s) (seq_fn_tends_to (lambda (m) (real_partial_sum (lambda (i) (seq_value a (+ i k))) m)) s)) (exists (s) (seq_fn_tends_to (lambda (m) (real_partial_sum (lambda (i) (seq_value a i)) m)) s)))))
  hard_negative:
    statement: 級数$\sum_n a_{n+k}$と$\sum_n a_n$が収束するとき、両者の和は等しい。
    reason: $a_0=1$、$n\geq1$で$a_n=0$、$k=1$とすると、和はそれぞれ$0$と$1$である。和は最初の$k$項の分だけ変わる。
  target: |
    ∀ (a : ℕ → ℝ) (k : ℕ), (∃ s : ℝ, Filter.Tendsto (fun m => ∑ i ∈ Finset.range m, a (i + k)) Filter.atTop (nhds s)) ↔ ∃ s : ℝ, Filter.Tendsto (fun m => ∑ i ∈ Finset.range m, a i) Filter.atTop (nhds s)
  proof: |
    by
      intro a k
      have key : ∀ m : ℕ, ∑ i ∈ Finset.range (m + k), a i = ∑ i ∈ Finset.range k, a i + ∑ i ∈ Finset.range m, a (i + k) := by
        intro m
        rw [add_comm m k, Finset.sum_range_add]
        congr 1
        exact Finset.sum_congr rfl fun i _ => by rw [add_comm]
      constructor
      · rintro ⟨s, h⟩
        refine ⟨∑ i ∈ Finset.range k, a i + s, ?_⟩
        rw [← Filter.tendsto_add_atTop_iff_nat k]
        simp only [key]
        exact tendsto_const_nhds.add h
      · rintro ⟨s, h⟩
        refine ⟨s - ∑ i ∈ Finset.range k, a i, ?_⟩
        have h2 := (Filter.tendsto_add_atTop_iff_nat k).2 h
        refine (h2.sub_const (∑ i ∈ Finset.range k, a i)).congr fun m => ?_
        rw [key]
        ring
- id: series_tail_tends_zero
  kind: gap
  level: 1
  topic: 級数・余りの収束
  statement: 実数列$(a_n)$の級数が収束するならば、余り$\sum_{i\geq0}a_{i+m}$は$m\to\infty$で$0$に収束する。ここで収束は無条件収束（実数列では絶対収束と同じ）とする。
  statement_en: If the series of a real sequence converges unconditionally, then its tails, the sums of a_{i+m} over i, tend to 0 as m tends to infinity.
  assumptions:
  - $\sum_n a_n$は絶対収束する
  quantifiers:
  - 任意の$(a_n)$
  conclusion: $\sum_{i\geq0}a_{i+m}\to0$（$m\to\infty$）である。
  answer: |
    $(a_n)$を実数列とし、$\sum_n a_n$が絶対収束するとする。$s=\sum_n a_n$、$S_m=\sum_{i<m}a_i$とおく。

    級数の和は最初の$m$項とそれ以降に分けられるので、$\sum_{i\geq0}a_{i+m}=s-S_m$である。$S_m\to s$なので、余りは$0$に収束する。
  strategy: The tail equals the difference between the sum and the partial sum.
  sketch:
  - "derive: The tail from m equals s - S_m."
  - "conclude: Since S_m → s, the tail tends to 0."
  openmath: (forall (a) (-> (real_series_summable (lambda (n) (seq_value a n))) (seq_fn_tends_to (lambda (m) (real_series_sum (lambda (i) (seq_value a (+ i m))))) 0)))
  hard_negative:
    statement: 項が$a_n\to0$を満たせば、余り$\sum_{i\geq0}a_{i+m}$は定まり$0$に収束する。
    reason: $a_n=1/(n+1)$は$0$に収束するが級数は発散するので、余りは実数として定まらない。
  target: |
    ∀ a : ℕ → ℝ, Summable a → Filter.Tendsto (fun m => ∑' i, a (i + m)) Filter.atTop (nhds 0)
  proof: |
    by
      intro a _
      exact tendsto_sum_nat_add a
- id: nonneg_series_bounded_partial_sums
  kind: gap
  level: 1
  topic: 級数・非負項と有界な部分和
  statement: 非負の実数列$(a_n)$の部分和が全て$K$以下ならば、級数$\sum_n a_n$は収束する。
  statement_en: If the partial sums of a nonnegative real sequence are all at most K, then the series converges.
  assumptions:
  - 全ての$n$で$a_n\geq0$
  - 全ての$m$で$\sum_{i<m}a_i\leq K$
  quantifiers:
  - 任意の$(a_n)$と$K$
  conclusion: 部分和はある実数に収束する。
  answer: |
    $(a_n)$を非負の実数列とし、全ての$m$で$\sum_{i<m}a_i\leq K$とする。

    $S_m=\sum_{i<m}a_i$とおく。$S_{m+1}-S_m=a_m\geq0$なので$(S_m)$は単調非減少であり、仮定から上に有界である。単調収束定理から$(S_m)$は収束する。
  strategy: The partial sums form a monotone bounded sequence.
  sketch:
  - "derive: S_{m+1} - S_m = a_m ≥ 0, so the partial sums are nondecreasing."
  - "apply_theorem: A nondecreasing sequence bounded above converges."
  openmath: (forall (a K) (-> (and (forall (n) (>= (seq_value a n) 0)) (forall (m) (<= (real_partial_sum (lambda (i) (seq_value a i)) m) K))) (exists (s) (seq_fn_tends_to (lambda (m) (real_partial_sum (lambda (i) (seq_value a i)) m)) s))))
  hard_negative:
    statement: 実数列の部分和が有界ならば、級数は収束する。
    reason: $a_n=(-1)^n$の部分和は$0$と$1$を繰り返して有界だが、収束しない。非負という仮定が必要である。
  target: |
    ∀ (a : ℕ → ℝ) (K : ℝ), (∀ n, 0 ≤ a n) → (∀ m, ∑ i ∈ Finset.range m, a i ≤ K) → ∃ s : ℝ, Filter.Tendsto (fun m => ∑ i ∈ Finset.range m, a i) Filter.atTop (nhds s)
  proof: |
    by
      intro a K h hb
      exact ⟨_, (summable_of_sum_range_le h hb).hasSum.tendsto_sum_nat⟩
- id: series_comparison_eventually_abs
  kind: gap
  level: 1
  topic: 級数・比較判定の一般形
  statement: 実数列$(a_n),(b_n)$について、ある$K$があり$n\geq K$なら$|a_n|\leq b_n$で、$\sum_n b_n$が収束するならば、$\sum_n a_n$は絶対収束する。これは全ての$n$で$0\leq a_n\leq b_n$を仮定する比較判定法を、符号の制限なしで十分先の$n$だけの仮定にした一般形である。
  statement_en: General form of the comparison test. Let a and b be real sequences. If |a_n| ≤ b_n for all n ≥ K and the series of b_n converges, then the series of a_n converges absolutely.
  assumptions:
  - $(a_n),(b_n)$は実数列
  - ある$K$があり、$n\geq K$なら$|a_n|\leq b_n$
  - $\sum_n b_n$は収束する
  quantifiers:
  - 任意の$(a_n)$、$(b_n)$、$K$
  conclusion: $\sum_n|a_n|$は収束する。
  answer: |
    実数列$(a_n),(b_n)$と$K$が、$n\geq K$で$|a_n|\leq b_n$を満たし、$\sum_n b_n$は収束するとする。

    $m\geq K$なら$\sum_{i<m}|a_i|\leq\sum_{i<K}|a_i|+\sum_{K\leq i<m}b_i$である。$n\geq K$で$b_n\geq0$なので、右辺の$\sum_{K\leq i<m}b_i$は$m$について単調非減少で、和の収束から上に有界である。よって部分和$\sum_{i<m}|a_i|$は上に有界で、単調非減少でもあるから収束する。
  strategy: Split off the first K terms and bound the remaining partial sums by those of the b series.
  sketch:
  - "derive: For m ≥ K, the partial sum of |a_i| is at most a finite sum plus the sum of b_i from K to m."
  - "derive: The latter is bounded because the series of b_n converges and b_n ≥ 0 for n ≥ K."
  - "conclude: A monotone bounded sequence of partial sums converges."
  openmath: (forall (a b K) (-> (and (forall (n) (-> (>= n K) (<= (abs (seq_value a n)) (seq_value b n)))) (real_series_summable (lambda (n) (seq_value b n)))) (real_series_summable (lambda (n) (abs (seq_value a n))))))
  hard_negative:
    statement: 十分先の$n$で$a_n\leq b_n$であり$\sum_n b_n$が収束すれば、$\sum_n a_n$は収束する。
    reason: $a_n=-1$、$b_n=0$は$a_n\leq b_n$を満たし$\sum_n b_n=0$だが、$\sum_n a_n$は発散する。下からの評価が必要である。
  target: |
    ∀ (a b : ℕ → ℝ) (K : ℕ), (∀ n, K ≤ n → |a n| ≤ b n) → Summable b → Summable (fun n => |a n|)
  proof: |
    by
      intro a b K h hb
      refine Summable.of_norm_bounded_eventually_nat hb (Filter.eventually_atTop.2 ⟨K, fun n hn => ?_⟩)
      rw [Real.norm_eq_abs, abs_abs]
      exact h n hn
- id: ratio_bound_test
  kind: gap
  level: 1
  topic: 級数・比の上からの評価による判定
  statement: $(a_n)$を実数列、$0\leq r<1$とする。ある$K$があり$n\geq K$なら$|a_{n+1}|\leq r|a_n|$ならば、$\sum_n a_n$は絶対収束する。比の極限の存在は仮定しない。
  statement_en: Let a be a real sequence and 0 ≤ r < 1. If |a_{n+1}| ≤ r|a_n| for all n ≥ K, then the series of a_n converges absolutely; no limit of the ratios is assumed.
  assumptions:
  - $(a_n)$は実数列
  - $0\leq r<1$
  - ある$K$があり、$n\geq K$なら$|a_{n+1}|\leq r|a_n|$
  quantifiers:
  - 任意の$(a_n)$、$r$、$K$
  conclusion: $\sum_n|a_n|$は収束する。
  answer: |
    $0\leq r<1$とし、実数列$(a_n)$が$n\geq K$で$|a_{n+1}|\leq r|a_n|$を満たすとする。

    帰納法により、$n\geq K$で$|a_n|\leq|a_K|r^{n-K}$である。$0\leq r<1$より等比級数$\sum_n|a_K|r^{n-K}$（$n\geq K$）は収束する。比較判定法から$\sum_n|a_n|$は収束する。
  strategy: Compare with a geometric series from index K on.
  sketch:
  - "induction: For n ≥ K, |a_n| ≤ |a_K| r^(n-K)."
  - "apply_theorem: The geometric series with ratio r converges."
  - "conclude: The comparison test gives absolute convergence."
  openmath: (forall (a r K) (-> (and (<= 0 r) (< r 1) (forall (n) (-> (>= n K) (<= (abs (seq_value a (+ n 1))) (* r (abs (seq_value a n))))))) (real_series_summable (lambda (n) (abs (seq_value a n))))))
  hard_negative:
    statement: 全ての$n$で$|a_{n+1}|<|a_n|$かつ$a_n\neq0$ならば、$\sum_n a_n$は絶対収束する。
    reason: $a_n=1/(n+1)$は$|a_{n+1}|<|a_n|$を満たすが、$\sum_n a_n$は発散する。比は$1$未満の共通の定数で抑える必要がある。
  target: |
    ∀ (a : ℕ → ℝ) (r : ℝ) (K : ℕ), 0 ≤ r → r < 1 → (∀ n, K ≤ n → |a (n + 1)| ≤ r * |a n|) → Summable (fun n => |a n|)
  proof: |
    by
      intro a r K _ hr h
      refine summable_of_ratio_norm_eventually_le hr (Filter.eventually_atTop.2 ⟨K, fun n hn => ?_⟩)
      simp only [Real.norm_eq_abs, abs_abs]
      exact h n hn
- id: root_bound_test
  kind: gap
  level: 1
  topic: 級数・べき根の上からの評価による判定
  statement: $(a_n)$を実数列、$0\leq r<1$とする。ある$K$があり、$n\geq K$かつ$n\geq1$なら$|a_n|^{1/n}\leq r$ならば、$\sum_n a_n$は絶対収束する。べき根の極限の存在は仮定しない。
  statement_en: Let a be a real sequence and 0 ≤ r < 1. If |a_n|^(1/n) ≤ r for all n ≥ K with n ≥ 1, then the series of a_n converges absolutely; no limit of the roots is assumed.
  assumptions:
  - $(a_n)$は実数列
  - $0\leq r<1$
  - ある$K$があり、$n\geq K$、$n\geq1$なら$|a_n|^{1/n}\leq r$
  quantifiers:
  - 任意の$(a_n)$、$r$、$K$
  conclusion: $\sum_n|a_n|$は収束する。
  answer: |
    $0\leq r<1$とし、実数列$(a_n)$が$n\geq K$、$n\geq1$で$|a_n|^{1/n}\leq r$を満たすとする。

    そのような$n$で両辺を$n$乗すると$|a_n|\leq r^n$である。$0\leq r<1$より等比級数$\sum_n r^n$は収束する。比較判定法から$\sum_n|a_n|$は収束する。
  strategy: Raise the bound to the n-th power and compare with a geometric series.
  sketch:
  - "derive: Raising to the n-th power gives |a_n| ≤ r^n for large n."
  - "apply_theorem: The geometric series of r^n converges."
  - "conclude: The comparison test gives absolute convergence."
  openmath: (forall (a r K) (-> (and (<= 0 r) (< r 1) (forall (n) (-> (and (>= n K) (>= n 1)) (<= (^ (abs (seq_value a n)) (/ 1 n)) r)))) (real_series_summable (lambda (n) (abs (seq_value a n))))))
  hard_negative:
    statement: 十分先の$n$で$|a_n|^{1/n}<1$ならば、$\sum_n a_n$は絶対収束する。
    reason: $a_n=1/n$では$n\geq2$で$|a_n|^{1/n}<1$だが、$\sum_n a_n$は発散する。$1$未満の共通の定数$r$で抑える必要がある。
  target: |
    ∀ (a : ℕ → ℝ) (r : ℝ) (K : ℕ), 0 ≤ r → r < 1 → (∀ n : ℕ, K ≤ n → 1 ≤ n → |a n| ^ (1 / (n : ℝ)) ≤ r) → Summable (fun n => |a n|)
  proof: |
    by
      intro a r K hr0 hr1 h
      refine Summable.of_norm_bounded_eventually_nat (summable_geometric_of_lt_one hr0 hr1) ?_
      filter_upwards [Filter.eventually_ge_atTop (max K 1)] with n hn
      have hn1 : 1 ≤ n := le_of_max_le_right hn
      have h1 := h n (le_of_max_le_left hn) hn1
      rw [Real.norm_eq_abs, abs_abs]
      have h2 : |a n| = (|a n| ^ (1 / (n : ℝ))) ^ n := by
        rw [one_div, Real.rpow_inv_natCast_pow (abs_nonneg _) (by omega)]
      rw [h2]
      exact pow_le_pow_left₀ (by positivity) h1 n
- id: alternating_series_error_bound
  kind: gap
  level: 1
  topic: 級数・交代級数の誤差評価
  statement: 実数列$(a_n)$が単調非増加で$0$に収束し、交代級数の和が$s=\lim_{m}\sum_{i<m}(-1)^ia_i$であるとき、全ての$n$で$\left|s-\sum_{i<n}(-1)^ia_i\right|\leq a_n$である。
  statement_en: If a real sequence a is nonincreasing and converges to 0, and s is the limit of the partial sums of (-1)^i a_i, then |s - Σ_{i<n} (-1)^i a_i| ≤ a_n for all n.
  assumptions:
  - $(a_n)$は単調非増加で$a_n\to0$
  - $\sum_{i<m}(-1)^ia_i\to s$
  quantifiers:
  - 任意の$(a_n)$、$s$、$n$
  conclusion: $\left|s-\sum_{i<n}(-1)^ia_i\right|\leq a_n$である。
  answer: |
    $(a_n)$を単調非増加で$0$に収束する実数列とし、$S_m=\sum_{i<m}(-1)^ia_i\to s$とする。単調性と極限から全ての$n$で$a_n\geq0$である。

    $S_{2k+2}-S_{2k}=a_{2k}-a_{2k+1}\geq0$なので$(S_{2k})$は単調非減少で、極限$s$以下である。$S_{2k+3}-S_{2k+1}=-a_{2k+1}+a_{2k+2}\leq0$なので$(S_{2k+1})$は単調非増加で、極限$s$以上である。

    $n=2k$のとき、$S_{2k}\leq s\leq S_{2k+1}=S_{2k}+a_{2k}$より$0\leq s-S_n\leq a_n$である。$n=2k+1$のとき、$S_{2k+1}-a_{2k+1}=S_{2k+2}\leq s\leq S_{2k+1}$より$-a_n\leq s-S_n\leq0$である。どちらの場合も$|s-S_n|\leq a_n$である。
  strategy: Even partial sums increase to s and odd partial sums decrease to s, so s lies between consecutive partial sums.
  sketch:
  - "derive: a_n ≥ 0 by monotonicity and the limit."
  - "derive: S_{2k} is nondecreasing and S_{2k+1} is nonincreasing, both with limit s."
  - "case_split: For n = 2k, S_{2k} ≤ s ≤ S_{2k} + a_{2k}."
  - "case_split: For n = 2k+1, S_{2k+1} - a_{2k+1} ≤ s ≤ S_{2k+1}."
  - "conclude: In both cases |s - S_n| ≤ a_n."
  openmath: (forall (a s) (-> (and (seq_antitone a) (seq_tends_to a 0) (seq_fn_tends_to (lambda (m) (real_partial_sum (lambda (i) (* (^ (neg 1) i) (seq_value a i))) m)) s)) (forall (n) (<= (abs (- s (real_partial_sum (lambda (i) (* (^ (neg 1) i) (seq_value a i))) n))) (seq_value a n)))))
  hard_negative:
    statement: 単調性を仮定せず、$a_n\geq0$、$a_n\to0$で交代級数が$s$に収束するならば、同じ誤差評価が成り立つ。
    reason: $a_0=0$、$a_1=1$で$n\geq2$なら$a_n=0$とすると、$s=-1$、$n=0$で$|s-S_0|=1>a_0=0$である。
  target: |
    ∀ (a : ℕ → ℝ) (s : ℝ), Antitone a → Filter.Tendsto a Filter.atTop (nhds 0) → Filter.Tendsto (fun m => ∑ i ∈ Finset.range m, (-1 : ℝ) ^ i * a i) Filter.atTop (nhds s) → ∀ n, |s - ∑ i ∈ Finset.range n, (-1 : ℝ) ^ i * a i| ≤ a n
  proof: |
    by
      intro a s hanti h0 hs n
      have hnn : ∀ m, 0 ≤ a m := fun m => hanti.le_of_tendsto h0 m
      rcases Nat.even_or_odd' n with ⟨k, rfl | rfl⟩
      · have h1 := hanti.alternating_series_le_tendsto hs k
        have h2 := hanti.tendsto_le_alternating_series hs k
        rw [Finset.sum_range_succ, pow_mul] at h2
        simp only [neg_one_sq, one_pow, one_mul] at h2
        have h3 := hnn (2 * k)
        exact abs_le.2 ⟨by linarith, by linarith⟩
      · have h1 := hanti.alternating_series_le_tendsto hs (k + 1)
        have h2 := hanti.tendsto_le_alternating_series hs k
        have e : 2 * (k + 1) = 2 * k + 1 + 1 := by ring
        rw [e, Finset.sum_range_succ, pow_succ, pow_mul] at h1
        simp only [neg_one_sq, one_pow, one_mul] at h1
        have h3 := hnn (2 * k + 1)
        exact abs_le.2 ⟨by linarith, by linarith⟩
- id: abel_test
  kind: named
  level: 2
  topic: 級数・アーベルの判定法
  statement: アーベルの判定法。実数列$(a_n),(b_n)$について、級数$\sum_n a_n$が収束し、$(b_n)$が単調で有界ならば、級数$\sum_n a_nb_n$は収束する。
  statement_en: Abel's test. For real sequences a and b, if the series of a_n converges and b is a bounded monotone sequence, then the series of a_n b_n converges.
  assumptions:
  - 部分和$\sum_{i<m}a_i$は収束する
  - $(b_n)$は単調非減少または単調非増加
  - 全ての$n$で$|b_n|\leq K$
  quantifiers:
  - 任意の$(a_n)$、$(b_n)$、$K$
  conclusion: 部分和$\sum_{i<m}a_ib_i$は収束する。
  answer: |
    実数列$(a_n),(b_n)$について、部分和$A_m=\sum_{i<m}a_i$が$s$に収束し、$(b_n)$が単調で$|b_n|\leq K$を満たすとする。単調有界数列は収束するので$b_n\to B$とする。

    $c_n=b_n-B$とおくと$(c_n)$は単調で$0$に収束し、$(A_m)$は収束列なので有界である。ディリクレの判定法から、部分和$\sum_{i<m}a_ic_i$はある$t$に収束する（$(c_n)$が単調非増加ならそのまま適用し、単調非減少なら$-c_n$に適用する）。

    $\sum_{i<m}a_ib_i=\sum_{i<m}a_ic_i+BA_m$なので、$\sum_{i<m}a_ib_i\to t+Bs$である。
  strategy: Subtract the limit of b to reach a monotone null sequence and apply Dirichlet's test.
  sketch:
  - "apply_theorem: The bounded monotone sequence b converges to some B."
  - "setup: Put c_n = b_n - B, which is monotone and tends to 0."
  - "apply_theorem: Partial sums of a are bounded, so Dirichlet's test applies to a_n c_n."
  - "conclude: Adding B times the partial sums of a gives convergence of the series of a_n b_n."
  openmath: (forall (a b K) (-> (and (exists (s) (seq_fn_tends_to (lambda (m) (real_partial_sum (lambda (i) (seq_value a i)) m)) s)) (or (seq_monotone b) (seq_antitone b)) (forall (n) (<= (abs (seq_value b n)) K))) (exists (t) (seq_fn_tends_to (lambda (m) (real_partial_sum (lambda (i) (* (seq_value a i) (seq_value b i))) m)) t))))
  hard_negative:
    statement: 級数$\sum_n a_n$が収束し$(b_n)$が有界ならば、単調でなくても$\sum_n a_nb_n$は収束する。
    reason: $a_n=(-1)^n/(n+1)$、$b_n=(-1)^n$では$\sum_n a_n$は収束するが、$\sum_n a_nb_n=\sum_n1/(n+1)$は発散する。
  target: |
    ∀ (a b : ℕ → ℝ) (K : ℝ), (∃ s : ℝ, Filter.Tendsto (fun m => ∑ i ∈ Finset.range m, a i) Filter.atTop (nhds s)) → (Monotone b ∨ Antitone b) → (∀ n, |b n| ≤ K) → ∃ t : ℝ, Filter.Tendsto (fun m => ∑ i ∈ Finset.range m, a i * b i) Filter.atTop (nhds t)
  proof: |
    by
      rintro a b K ⟨s, hs⟩ hmono hK
      obtain ⟨C, hC'⟩ := (Metric.isBounded_range_of_tendsto _ hs).exists_norm_le
      have hC : ∀ n, ‖∑ i ∈ Finset.range n, a i‖ ≤ C := fun n => hC' _ ⟨n, rfl⟩
      rcases hmono with hm | hm
      · have hbB := tendsto_atTop_ciSup hm ⟨K, by
          rintro _ ⟨n, rfl⟩
          exact (le_abs_self _).trans (hK n)⟩
        have h0 : Filter.Tendsto (fun n => b n - ⨆ i, b i) Filter.atTop (nhds 0) := by
          simpa using hbB.sub_const (⨆ i, b i)
        have hmm : Monotone (fun n => b n - ⨆ i, b i) := fun m n h => sub_le_sub_right (hm h) _
        obtain ⟨t, ht⟩ := cauchySeq_tendsto_of_complete (hmm.cauchySeq_series_mul_of_tendsto_zero_of_bounded h0 hC)
        refine ⟨t + (⨆ i, b i) * s, (ht.add (hs.const_mul (⨆ i, b i))).congr fun n => ?_⟩
        rw [Finset.mul_sum, ← Finset.sum_add_distrib]
        refine Finset.sum_congr rfl fun i _ => ?_
        simp only [smul_eq_mul]
        ring
      · have hbB := tendsto_atTop_ciInf hm ⟨-K, by
          rintro _ ⟨n, rfl⟩
          exact (abs_le.1 (hK n)).1⟩
        have h0 : Filter.Tendsto (fun n => b n - ⨅ i, b i) Filter.atTop (nhds 0) := by
          simpa using hbB.sub_const (⨅ i, b i)
        have hmm : Antitone (fun n => b n - ⨅ i, b i) := fun m n h => sub_le_sub_right (hm h) _
        obtain ⟨t, ht⟩ := cauchySeq_tendsto_of_complete (hmm.cauchySeq_series_mul_of_tendsto_zero_of_bounded h0 hC)
        refine ⟨t + (⨅ i, b i) * s, (ht.add (hs.const_mul (⨅ i, b i))).congr fun n => ?_⟩
        rw [Finset.mul_sum, ← Finset.sum_add_distrib]
        refine Finset.sum_congr rfl fun i _ => ?_
        simp only [smul_eq_mul]
        ring
- id: alternating_harmonic_conditional
  kind: textbook
  level: 1
  topic: 級数・交代調和級数の条件収束
  statement: 交代調和級数$\sum_n(-1)^n/(n+1)$は収束するが、絶対収束しない。
  statement_en: The alternating harmonic series, the series of (-1)^n/(n+1), converges but does not converge absolutely.
  assumptions:
  - なし
  quantifiers:
  - なし
  conclusion: 部分和$\sum_{n<m}(-1)^n/(n+1)$は収束し、$\sum_n1/(n+1)$は発散する。
  answer: |
    $a_n=1/(n+1)$とおく。$(a_n)$は単調非増加で$0$に収束するので、交代級数の判定法から部分和$\sum_{n<m}(-1)^na_n$は収束する。

    一方$|(-1)^na_n|=1/(n+1)$であり、調和級数$\sum_n1/(n+1)$の部分和は$+\infty$に発散する。よって絶対収束しない。
  strategy: Apply the alternating series test and the divergence of the harmonic series.
  sketch:
  - "apply_theorem: 1/(n+1) is nonincreasing and tends to 0, so the alternating series converges."
  - "derive: The absolute values form the harmonic series."
  - "conclude: The harmonic series diverges, so convergence is not absolute."
  openmath: (and (exists (s) (seq_fn_tends_to (lambda (m) (real_partial_sum (lambda (n) (* (^ (neg 1) n) (/ 1 (+ n 1)))) m)) s)) (not (real_series_summable (lambda (n) (abs (* (^ (neg 1) n) (/ 1 (+ n 1))))))))
  hard_negative:
    statement: 収束する級数$\sum_n(-1)^nb_n$（$b_n>0$）は、必ず絶対収束する。
    reason: $b_n=1/(n+1)$が反例である。交代級数は収束しても、$\sum_n1/(n+1)$は発散する。
  target: |
    (∃ s : ℝ, Filter.Tendsto (fun m => ∑ n ∈ Finset.range m, (-1 : ℝ) ^ n * (1 / ((n : ℝ) + 1))) Filter.atTop (nhds s)) ∧ ¬ Summable (fun n : ℕ => |(-1 : ℝ) ^ n * (1 / ((n : ℝ) + 1))|)
  proof: |
    by
      constructor
      · have hanti : Antitone (fun n : ℕ => 1 / ((n : ℝ) + 1)) := fun m n h =>
          one_div_le_one_div_of_le (by positivity) (by
            have h1 : (m : ℝ) ≤ n := by exact_mod_cast h
            linarith)
        exact hanti.tendsto_alternating_series_of_tendsto_zero tendsto_one_div_add_atTop_nhds_zero_nat
      · intro h
        have h1 : Summable (fun n : ℕ => 1 / ((n : ℝ) + 1)) := h.congr fun n => by
          rw [abs_mul, abs_pow, abs_neg, abs_one, one_pow, one_mul, abs_of_pos (by positivity)]
        apply Real.not_summable_one_div_natCast
        rw [← summable_nat_add_iff 1]
        simpa using h1
- id: conditional_pos_neg_parts_diverge
  kind: gap
  level: 2
  topic: 級数・条件収束と正部分・負部分
  statement: 実数の級数$\sum_n a_n$が収束するが絶対収束しないならば、正部分の級数$\sum_n\max\{a_n,0\}$と負部分の級数$\sum_n\max\{-a_n,0\}$はともに発散する。
  statement_en: If a real series converges but not absolutely, then both the series of positive parts max(a_n, 0) and the series of negative parts max(-a_n, 0) diverge.
  assumptions:
  - 部分和$\sum_{i<m}a_i$は収束する
  - $\sum_n|a_n|$は発散する
  quantifiers:
  - 任意の$(a_n)$
  conclusion: $\sum_n\max\{a_n,0\}$も$\sum_n\max\{-a_n,0\}$も収束しない。
  answer: |
    $(a_n)$を実数列とし、部分和$A_m=\sum_{i<m}a_i$は$s$に収束するが$\sum_n|a_n|$は発散するとする。$p_n=\max\{a_n,0\}$、$q_n=\max\{-a_n,0\}$とおくと、$p_n,q_n\geq0$、$a_n=p_n-q_n$、$|a_n|=p_n+q_n$である。

    $\sum_n p_n$が収束すると仮定する。$\sum_{i<m}q_i=\sum_{i<m}p_i-A_m$は収束するので$\sum_n q_n$も収束し、$\sum_{i<m}|a_i|=\sum_{i<m}p_i+\sum_{i<m}q_i$も収束する。これは$\sum_n|a_n|$の発散に矛盾する。

    $\sum_n q_n$が収束すると仮定しても、$\sum_{i<m}p_i=\sum_{i<m}q_i+A_m$から同じ矛盾が生じる。
  strategy: If one of the two parts converged, the identity a_n = p_n - q_n would force the other to converge and hence |a_n| = p_n + q_n.
  sketch:
  - "setup: Put p_n = max(a_n, 0) and q_n = max(-a_n, 0), so a_n = p_n - q_n and |a_n| = p_n + q_n."
  - "case_split: If the series of p_n converges, then the series of q_n = p_n - a_n converges."
  - "case_split: If the series of q_n converges, then the series of p_n = q_n + a_n converges."
  - "contradiction: In both cases the series of |a_n| converges."
  openmath: (forall (a) (-> (and (exists (s) (seq_fn_tends_to (lambda (m) (real_partial_sum (lambda (i) (seq_value a i)) m)) s)) (not (real_series_summable (lambda (n) (abs (seq_value a n)))))) (and (not (real_series_summable (lambda (n) (max_of (seq_value a n) 0)))) (not (real_series_summable (lambda (n) (max_of (neg (seq_value a n)) 0)))))))
  hard_negative:
    statement: 級数$\sum_n a_n$が発散するならば、正部分と負部分の級数はともに発散する。
    reason: $a_n=1$では$\sum_n a_n$は発散するが、負部分は全て$0$で収束する。
  target: |
    ∀ a : ℕ → ℝ, (∃ s : ℝ, Filter.Tendsto (fun m => ∑ i ∈ Finset.range m, a i) Filter.atTop (nhds s)) → ¬ Summable (fun n => |a n|) → ¬ Summable (fun n => max (a n) 0) ∧ ¬ Summable (fun n => max (-a n) 0)
  proof: |
    by
      rintro a ⟨s, hs⟩ hna
      have hsum : ∀ x : ℝ, |x| = max x 0 + max (-x) 0 := by
        intro x
        rcases le_total 0 x with h | h
        · rw [abs_of_nonneg h, max_eq_left h, max_eq_right (by linarith)]
          ring
        · rw [abs_of_nonpos h, max_eq_right h, max_eq_left (by linarith)]
          ring
      have hdiff : ∀ x : ℝ, max x 0 - x = max (-x) 0 := by
        intro x
        rcases le_total 0 x with h | h
        · rw [max_eq_left h, max_eq_right (by linarith)]
          ring
        · rw [max_eq_right h, max_eq_left (by linarith)]
          ring
      constructor
      · intro hp
        apply hna
        have hq : Summable (fun n => max (-a n) 0) := by
          have ht := hp.hasSum.tendsto_sum_nat.sub hs
          refine ((hasSum_iff_tendsto_nat_of_nonneg (fun n => le_max_right _ _) _).2 (ht.congr fun m => ?_)).summable
          rw [← Finset.sum_sub_distrib]
          exact Finset.sum_congr rfl fun n _ => hdiff (a n)
        exact (hp.add hq).congr fun n => (hsum (a n)).symm
      · intro hq
        apply hna
        have hp : Summable (fun n => max (a n) 0) := by
          have ht := hq.hasSum.tendsto_sum_nat.add hs
          refine ((hasSum_iff_tendsto_nat_of_nonneg (fun n => le_max_right _ _) _).2 (ht.congr fun m => ?_)).summable
          rw [← Finset.sum_add_distrib]
          refine Finset.sum_congr rfl fun n _ => ?_
          have h1 := hdiff (a n)
          linarith
        exact (hp.add hq).congr fun n => (hsum (a n)).symm
- id: series_grouping
  kind: gap
  level: 1
  topic: 級数・項のまとめ方
  statement: 実数列$(a_n)$の部分和$\sum_{i<m}a_i$が$s$に収束し、$p:\mathbb{N}\to\mathbb{N}$が狭義単調増加で$p(0)=0$ならば、まとめた級数の部分和$\sum_{k<K}\sum_{p(k)\leq i<p(k+1)}a_i$も$s$に収束する。
  statement_en: If the partial sums of a real sequence a converge to s and p is strictly increasing with p(0) = 0, then the partial sums of the blocks, Σ_{k<K} Σ_{p(k) ≤ i < p(k+1)} a_i, also converge to s.
  assumptions:
  - $(a_n)$は実数列
  - $\sum_{i<m}a_i\to s$
  - $p$は狭義単調増加で$p(0)=0$
  quantifiers:
  - 任意の$(a_n)$、$p$、$s$
  conclusion: $\sum_{k<K}\sum_{p(k)\leq i<p(k+1)}a_i\to s$である。
  answer: |
    実数列$(a_n)$の部分和$S_m=\sum_{i<m}a_i$が$s$に収束し、$p$が狭義単調増加で$p(0)=0$とする。

