      refine ⟨K, fun n hn => ?_⟩
      have h1 := hK n hn
      have h2 : |L| - |a n| ≤ |a n - L| := by
        rw [abs_sub_comm]
        exact abs_sub_abs_le_abs_sub L (a n)
