- id: seq_limit_eps_scaled
  kind: gap
  level: 1
  topic: 数列の極限・ε-N論法の定数倍
  statement: 実数列$(a_n)$、実数$L$、定数$K>0$について、任意の$\varepsilon>0$に対してある$N$があり$n\geq N$なら$|a_n-L|\leq K\varepsilon$となるならば、任意の$\varepsilon>0$に対してある$N$があり$n\geq N$なら$|a_n-L|<\varepsilon$となる。
  statement_en: Let a be a real sequence, L real and K > 0. If for every ε > 0 there is N with |a_n - L| ≤ Kε for all n ≥ N, then for every ε > 0 there is N with |a_n - L| < ε for all n ≥ N.
  assumptions:
  - $(a_n)$は実数列、$L\in\mathbb{R}$、$K>0$
  - 任意の$\varepsilon>0$に対してある$N$があり、$n\geq N$なら$|a_n-L|\leq K\varepsilon$
  quantifiers:
  - 任意の$(a_n)$、$L$、$K>0$
  conclusion: 任意の$\varepsilon>0$に対してある$N$があり、$n\geq N$なら$|a_n-L|<\varepsilon$である。
  answer: |
    $(a_n)$を実数列、$L\in\mathbb{R}$、$K>0$とし、任意の$\varepsilon>0$に対してある$N$があり$n\geq N$なら$|a_n-L|\leq K\varepsilon$となると仮定する。

    $\varepsilon>0$を任意にとり、$\varepsilon'=\varepsilon/(2K)$とおく。$K>0$より$\varepsilon'>0$なので、仮定からある$N$があり、$n\geq N$なら$|a_n-L|\leq K\varepsilon'=\varepsilon/2<\varepsilon$となる。
  strategy: Apply the hypothesis to ε/(2K) so that the constant cancels.
  sketch:
  - "setup: Fix ε > 0 and put ε' = ε/(2K), which is positive because K > 0."
  - "apply_theorem: The hypothesis for ε' gives N with |a_n - L| ≤ Kε' for n ≥ N."
  - "conclude: Since Kε' = ε/2 < ε, the strict bound holds for n ≥ N."
  openmath: (forall (a L K) (-> (and (> K 0) (forall (e) (-> (> e 0) (exists (M) (forall (n) (-> (>= n M) (<= (abs (- (seq_value a n) L)) (* K e)))))))) (forall (e) (-> (> e 0) (exists (M) (forall (n) (-> (>= n M) (< (abs (- (seq_value a n) L)) e))))))))
  hard_negative:
    statement: 定数$K$を$n$に依存する正の数$K_n$に置き換えても、同じ結論が成り立つ。
    reason: $a_n=1$、$L=0$、$K_n=n+1$とすると、各$\varepsilon>0$に対して大きな$n$で$|a_n-L|\leq K_n\varepsilon$となるが、$a_n$は$0$に収束しない。
  target: |
    ∀ (a : ℕ → ℝ) (L K : ℝ), 0 < K → (∀ ε : ℝ, 0 < ε → ∃ N : ℕ, ∀ n, N ≤ n → |a n - L| ≤ K * ε) → ∀ ε : ℝ, 0 < ε → ∃ N : ℕ, ∀ n, N ≤ n → |a n - L| < ε
  proof: |
    by
      intro a L K hK h ε hε
      obtain ⟨N, hN⟩ := h (ε / (2 * K)) (by positivity)
      refine ⟨N, fun n hn => lt_of_le_of_lt (hN n hn) ?_⟩
      have : K * (ε / (2 * K)) = ε / 2 := by field_simp
      rw [this]; linarith
- id: seq_eventually_abs_gt_half
  kind: gap
  level: 1
  topic: 数列の極限・0でない極限と項の下界
  statement: 実数列$(a_n)$が$\varepsilon$-$N$の意味で$L\neq0$に収束するならば、ある$N$があり、$n\geq N$なら$|a_n|>|L|/2$となる。
  statement_en: If a real sequence a converges to L ≠ 0 in the ε-N sense, then there is N with |a_n| > |L|/2 for all n ≥ N.
  assumptions:
  - $(a_n)$は実数列、$L\neq0$
  - 任意の$\varepsilon>0$に対してある$N$があり、$n\geq N$なら$|a_n-L|<\varepsilon$
  quantifiers:
  - 任意の$(a_n)$と$L\neq0$
  conclusion: ある$N$があり、$n\geq N$なら$|L|/2<|a_n|$である。
  answer: |
    $(a_n)$を実数列、$L\neq0$とし、任意の$\varepsilon>0$に対してある$N$があり$n\geq N$なら$|a_n-L|<\varepsilon$となると仮定する。

    $L\neq0$より$|L|/2>0$なので、$\varepsilon=|L|/2$に対する$N$をとる。$n\geq N$なら、三角不等式から$|L|\leq|L-a_n|+|a_n|<|L|/2+|a_n|$となる。移項すると$|L|/2<|a_n|$を得る。
  strategy: Take ε = |L|/2 in the definition and use the triangle inequality.
  sketch:
  - "setup: Since L ≠ 0, ε = |L|/2 is positive; take the corresponding N."
  - "derive: For n ≥ N, |L| ≤ |L - a_n| + |a_n| < |L|/2 + |a_n|."
  - "conclude: Rearranging gives |L|/2 < |a_n|."
  openmath: (forall (a L) (-> (and (!= L 0) (forall (e) (-> (> e 0) (exists (M) (forall (n) (-> (>= n M) (< (abs (- (seq_value a n) L)) e))))))) (exists (M) (forall (n) (-> (>= n M) (< (/ (abs L) 2) (abs (seq_value a n))))))))
  hard_negative:
    statement: $(a_n)$が$L\neq0$に収束するならば、全ての$n$で$|a_n|>|L|/2$となる。
    reason: $a_0=0$、$n\geq1$で$a_n=1$とすると$L=1$に収束するが、$n=0$で不等式が成り立たない。有限個の項は極限に影響しない。
  target: |
    ∀ (a : ℕ → ℝ) (L : ℝ), (∀ ε : ℝ, 0 < ε → ∃ N : ℕ, ∀ n, N ≤ n → |a n - L| < ε) → L ≠ 0 → ∃ N : ℕ, ∀ n, N ≤ n → |L| / 2 < |a n|
  proof: |
    by
      intro a L h hL
      obtain ⟨N, hN⟩ := h (|L| / 2) (by positivity)
      refine ⟨N, fun n hn => ?_⟩
      have h1 := hN n hn
      have h2 : |L| - |a n| ≤ |a n - L| := by
        rw [abs_sub_comm]; exact abs_sub_abs_le_abs_sub L (a n)
      linarith
- id: seq_limit_div
  kind: textbook
  level: 1
  topic: 数列の極限・商
  statement: 実数列$(a_n),(b_n)$が$a_n\to L$、$b_n\to M$を満たし、$M\neq0$かつ全ての$n$で$b_n\neq0$ならば、$a_n/b_n\to L/M$である。
  statement_en: If real sequences satisfy a_n → L and b_n → M with M ≠ 0 and b_n ≠ 0 for all n, then a_n/b_n → L/M.
  assumptions:
  - $(a_n),(b_n)$は実数列
  - $a_n\to L$、$b_n\to M$
  - $M\neq0$
  - 全ての$n$で$b_n\neq0$
  quantifiers:
  - 任意の$(a_n),(b_n)$と$L,M\in\mathbb{R}$
  conclusion: $a_n/b_n\to L/M$である。
  answer: |
    $(a_n),(b_n)$を実数列、$L,M\in\mathbb{R}$とし、$a_n\to L$、$b_n\to M$、$M\neq0$、全ての$n$で$b_n\neq0$とする。

    $M\neq0$より$|M|/2>0$なので、ある$N_0$があり、$n\geq N_0$なら$|b_n-M|<|M|/2$である。このとき$|M|\leq|M-b_n|+|b_n|$より$|b_n|>|M|/2$となる。また$\frac{a_n}{b_n}-\frac{L}{M}=\frac{M(a_n-L)-L(b_n-M)}{b_nM}$なので、$n\geq N_0$なら$\left|\frac{a_n}{b_n}-\frac{L}{M}\right|\leq\frac{2|a_n-L|}{|M|}+\frac{2|L||b_n-M|}{|M|^2}$が成り立つ。

    $\varepsilon>0$を任意にとる。ある$N_1$があり$n\geq N_1$なら$|a_n-L|<\varepsilon|M|/4$であり、ある$N_2$があり$n\geq N_2$なら$|b_n-M|<\varepsilon|M|^2/(4(|L|+1))$である。$n\geq\max(N_0,N_1,N_2)$なら、上の評価の第1項は$\varepsilon/2$未満、第2項も$\varepsilon/2$未満である。よって$a_n/b_n\to L/M$である。
  strategy: Bound the denominator away from zero, then estimate the difference by the two errors.
  sketch:
  - "derive: Eventually |b_n| > |M|/2 because b_n → M and M ≠ 0."
  - "translate: Write a_n/b_n - L/M = (M(a_n - L) - L(b_n - M))/(b_n M)."
  - "derive: For large n the difference is at most 2|a_n - L|/|M| + 2|L||b_n - M|/|M|²."
  - "conclude: Choose N so that each of the two terms is below ε/2."
  openmath: (forall (a b L M) (-> (and (seq_tends_to a L) (seq_tends_to b M) (!= M 0) (forall (n) (!= (seq_value b n) 0))) (seq_fn_tends_to (lambda (n) (/ (seq_value a n) (seq_value b n))) (/ L M))))
  hard_negative:
    statement: $M=0$でも、全ての$n$で$b_n\neq0$なら$a_n/b_n$は収束する。
    reason: $a_n=1$、$b_n=1/(n+1)$とすると$b_n\to0$で、$a_n/b_n=n+1$は発散する。
  target: |
    ∀ (a b : ℕ → ℝ) (L M : ℝ), Filter.Tendsto a Filter.atTop (nhds L) → Filter.Tendsto b Filter.atTop (nhds M) → M ≠ 0 → (∀ n, b n ≠ 0) → Filter.Tendsto (fun n => a n / b n) Filter.atTop (nhds (L / M))
  proof: |
    by
      intro a b L M ha hb hM _
      exact ha.div hb hM
- id: seq_subsequence_limit
  kind: textbook
  level: 1
  topic: 数列の極限・部分列
  statement: 実数列$(a_n)$が$L$に収束し、$p:\mathbb{N}\to\mathbb{N}$が狭義単調増加ならば、部分列$(a_{p(n)})$も$L$に収束する。
  statement_en: If a real sequence a converges to L and p from the naturals to the naturals is strictly increasing, then the subsequence a_{p(n)} converges to L.
  assumptions:
  - $(a_n)$は実数列で$a_n\to L$
  - $p:\mathbb{N}\to\mathbb{N}$は狭義単調増加
  quantifiers:
  - 任意の$(a_n)$、$L$、$p$
  conclusion: $a_{p(n)}\to L$である。
  answer: |
    $(a_n)$を$L$に収束する実数列、$p:\mathbb{N}\to\mathbb{N}$を狭義単調増加な写像とする。

    まず全ての$n$で$p(n)\geq n$であることを帰納法で示す。$p(0)\geq0$は明らかである。$p(n)\geq n$なら、$p(n+1)>p(n)\geq n$より$p(n+1)\geq n+1$となる。

    $\varepsilon>0$を任意にとると、ある$N$があり、$m\geq N$なら$|a_m-L|<\varepsilon$である。$n\geq N$なら$p(n)\geq n\geq N$なので、$|a_{p(n)}-L|<\varepsilon$となる。よって$a_{p(n)}\to L$である。
  strategy: Show p(n) ≥ n by induction, so the same N works for the subsequence.
  sketch:
  - "induction: A strictly increasing p on the naturals satisfies p(n) ≥ n."
  - "setup: Fix ε > 0 and take N for the sequence a."
  - "conclude: For n ≥ N we have p(n) ≥ N, hence |a_{p(n)} - L| < ε."
  openmath: (forall (a p L) (-> (and (strict_mono_index p) (seq_tends_to a L)) (seq_fn_tends_to (lambda (n) (seq_value a (fn_value p n))) L)))
  hard_negative:
    statement: 実数列のある部分列が$L$に収束すれば、元の数列も$L$に収束する。
    reason: $a_n=(-1)^n$の偶数番目の部分列は$1$に収束するが、$(a_n)$は収束しない。
  target: |
    ∀ (a : ℕ → ℝ) (p : ℕ → ℕ) (L : ℝ), StrictMono p → Filter.Tendsto a Filter.atTop (nhds L) → Filter.Tendsto (fun n => a (p n)) Filter.atTop (nhds L)
  proof: |
    by
      intro a p L hp ha
      exact ha.comp hp.tendsto_atTop
- id: seq_even_odd_limit
  kind: gap
  level: 1
  topic: 数列の極限・偶数番目と奇数番目
  statement: 実数列$(a_n)$について、$a_{2n}\to L$かつ$a_{2n+1}\to L$ならば$a_n\to L$である。
  statement_en: If the even-indexed and the odd-indexed terms of a real sequence both converge to L, then the sequence converges to L.
  assumptions:
  - $(a_n)$は実数列
  - $a_{2n}\to L$
  - $a_{2n+1}\to L$
  quantifiers:
  - 任意の$(a_n)$と$L\in\mathbb{R}$
  conclusion: $a_n\to L$である。
  answer: |
    $(a_n)$を実数列、$L\in\mathbb{R}$とし、$a_{2n}\to L$かつ$a_{2n+1}\to L$とする。

    $\varepsilon>0$を任意にとる。ある$N_1$があり$k\geq N_1$なら$|a_{2k}-L|<\varepsilon$であり、ある$N_2$があり$k\geq N_2$なら$|a_{2k+1}-L|<\varepsilon$である。$N=2N_1+2N_2+1$とおき、$n\geq N$とする。

    $n=2k$と書けるなら$2k\geq 2N_1$より$k\geq N_1$なので$|a_n-L|<\varepsilon$である。$n=2k+1$と書けるなら$2k+1\geq 2N_2+1$より$k\geq N_2$なので、やはり$|a_n-L|<\varepsilon$である。よって$a_n\to L$である。
  strategy: Choose N large enough for both parities and split on the parity of n.
  sketch:
  - "setup: Fix ε > 0 and take N₁, N₂ for the even and odd subsequences."
  - "case_split: Write n = 2k or n = 2k + 1 for n ≥ 2N₁ + 2N₂ + 1."
  - "conclude: In each case k is beyond the corresponding threshold, so |a_n - L| < ε."
  openmath: (forall (a L) (-> (and (seq_fn_tends_to (lambda (n) (seq_value a (* 2 n))) L) (seq_fn_tends_to (lambda (n) (seq_value a (+ (* 2 n) 1))) L)) (seq_tends_to a L)))
  hard_negative:
    statement: $(a_{2n})$と$(a_{2n+1})$がそれぞれ収束すれば、極限が異なっていても$(a_n)$は収束する。
    reason: $a_n=(-1)^n$では偶数番目は$1$に、奇数番目は$-1$に収束するが、$(a_n)$は収束しない。
  target: |
    ∀ (a : ℕ → ℝ) (L : ℝ), Filter.Tendsto (fun n => a (2 * n)) Filter.atTop (nhds L) → Filter.Tendsto (fun n => a (2 * n + 1)) Filter.atTop (nhds L) → Filter.Tendsto a Filter.atTop (nhds L)
  proof: |
    by
      intro a L he ho
      rw [Metric.tendsto_atTop] at he ho ⊢
      intro ε hε
      obtain ⟨N₁, h₁⟩ := he ε hε
      obtain ⟨N₂, h₂⟩ := ho ε hε
      refine ⟨2 * N₁ + 2 * N₂ + 1, fun n hn => ?_⟩
      rcases Nat.even_or_odd' n with ⟨k, rfl | rfl⟩
      · exact h₁ k (by omega)
      · exact h₂ k (by omega)
- id: seq_every_subsequence_criterion
  kind: gap
  level: 2
  topic: 数列の極限・部分列による収束判定
  statement: 実数列$(a_n)$が$L$に収束するための必要十分条件は、任意の部分列$(a_{p(n)})$がさらに部分列$(a_{p(q(n))})$をもち、それが$L$に収束することである。
  statement_en: A real sequence a converges to L if and only if for every strictly increasing p there is a strictly increasing q such that a_{p(q(n))} converges to L.
  assumptions:
  - $(a_n)$は実数列、$L\in\mathbb{R}$
  quantifiers:
  - 任意の$(a_n)$と$L$
  - 任意の狭義単調増加な$p:\mathbb{N}\to\mathbb{N}$に対し、ある狭義単調増加な$q:\mathbb{N}\to\mathbb{N}$
  conclusion: $a_n\to L$と、任意の部分列が$L$に収束する部分列をもつことは同値である。
  answer: |
    $(a_n)$を実数列、$L\in\mathbb{R}$とする。

    $a_n\to L$とする。狭義単調増加な$p:\mathbb{N}\to\mathbb{N}$は全ての$n$で$p(n)\geq n$を満たす。したがって$\varepsilon>0$に対する$N$をとると、$n\geq N$で$|a_{p(n)}-L|<\varepsilon$であり、$a_{p(n)}\to L$である。$q$を恒等写像とすれば$a_{p(q(n))}=a_{p(n)}\to L$となる。

    逆に、$a_n\to L$でないとする。このときある$\varepsilon>0$があり、任意の$N$に対して$|a_n-L|\geq\varepsilon$となる$n\geq N$が存在する。$p(0)$をそのような$n$の一つとし、$p(k)$が定まったら$N=p(k)+1$に対するそのような$n$を$p(k+1)$とする。すると$p$は狭義単調増加で、全ての$k$で$|a_{p(k)}-L|\geq\varepsilon$である。部分列$(a_{p(n)})$のどの部分列の項も$L$から$\varepsilon$以上離れているので、$L$に収束する部分列は存在しない。対偶により十分性が示された。
  strategy: The forward direction takes q to be the identity; for the converse, extract a subsequence staying ε away from L.
  sketch:
  - "derive: If a_n → L then every subsequence converges to L, so q = id works."
  - "contradiction: If a_n does not tend to L, some ε > 0 has |a_n - L| ≥ ε for arbitrarily large n."
  - "construct: Choose a strictly increasing p with |a_{p(k)} - L| ≥ ε for all k."
  - "conclude: No further subsequence of a_{p(n)} can converge to L."
  openmath: (forall (a L) (<-> (seq_tends_to a L) (forall (p) (-> (strict_mono_index p) (exists (q) (and (strict_mono_index q) (seq_fn_tends_to (lambda (n) (seq_value a (fn_value p (fn_value q n)))) L)))))))
  hard_negative:
    statement: 実数列の任意の部分列が収束する部分列をもつならば、その数列は収束する。
    reason: $a_n=(-1)^n$の任意の部分列は収束する部分列をもつが、$(a_n)$は収束しない。極限$L$が共通であることが必要である。
  target: |
    ∀ (a : ℕ → ℝ) (L : ℝ), Filter.Tendsto a Filter.atTop (nhds L) ↔ ∀ p : ℕ → ℕ, StrictMono p → ∃ q : ℕ → ℕ, StrictMono q ∧ Filter.Tendsto (fun n => a (p (q n))) Filter.atTop (nhds L)
  proof: |
    by
      intro a L
      constructor
      · intro h p hp
        exact ⟨id, strictMono_id, h.comp hp.tendsto_atTop⟩
      · intro h
        by_contra hn
        rw [Metric.tendsto_atTop] at hn
        push Not at hn
        obtain ⟨ε, hε, hN⟩ := hn
        obtain ⟨p, hp, hP⟩ := Filter.extraction_of_frequently_atTop (P := fun n => ε ≤ dist (a n) L)
          (Filter.frequently_atTop.2 hN)
        obtain ⟨q, hq, hT⟩ := h p hp
        rw [Metric.tendsto_atTop] at hT
        obtain ⟨N, hN'⟩ := hT ε hε
        exact absurd (hN' N le_rfl) (not_lt.2 (hP (q N)))
- id: cesaro_mean
  kind: textbook
  level: 1
  topic: 数列の極限・算術平均
  statement: 実数列$(a_n)$が$L$に収束するならば、算術平均$(a_0+\cdots+a_n)/(n+1)$も$L$に収束する。
  statement_en: If a real sequence a converges to L, then the arithmetic means (a_0 + ... + a_n)/(n+1) converge to L.
  assumptions:
  - $(a_n)$は実数列で$a_n\to L$
  quantifiers:
  - 任意の$(a_n)$と$L\in\mathbb{R}$
  conclusion: $(a_0+\cdots+a_n)/(n+1)\to L$である。
  answer: |
    $(a_n)$を$L$に収束する実数列とし、$b_n=a_n-L$とおく。すると$\frac{a_0+\cdots+a_n}{n+1}-L=\frac{b_0+\cdots+b_n}{n+1}$である。

    $\varepsilon>0$を任意にとる。ある$N$があり、$n\geq N$なら$|b_n|<\varepsilon/2$である。$A=\sum_{i<N}|b_i|$とおき、$A/(M+1)<\varepsilon/2$を満たす$M\geq N$をとる。$n\geq M$なら$\left|\frac{b_0+\cdots+b_n}{n+1}\right|\leq\frac{A}{n+1}+\frac{1}{n+1}\sum_{i=N}^{n}|b_i|\leq\frac{A}{M+1}+\frac{n-N+1}{n+1}\cdot\frac{\varepsilon}{2}<\frac{\varepsilon}{2}+\frac{\varepsilon}{2}=\varepsilon$となる。よって算術平均は$L$に収束する。
  strategy: Reduce to limit 0 and split the sum into a fixed head and a small tail.
  sketch:
  - "translate: With b_n = a_n - L, the mean minus L equals the mean of the b_i."
  - "setup: Fix ε > 0 and take N with |b_n| < ε/2 for n ≥ N."
  - "derive: The first N terms contribute at most A/(n+1), which is below ε/2 for large n."
  - "derive: The remaining terms contribute at most ε/2."
  - "conclude: The mean differs from L by less than ε for large n."
  openmath: (forall (a L) (-> (seq_tends_to a L) (seq_fn_tends_to (lambda (n) (/ (real_partial_sum (lambda (i) (seq_value a i)) (+ n 1)) (+ n 1))) L)))
  hard_negative:
    statement: 算術平均$(a_0+\cdots+a_n)/(n+1)$が$L$に収束すれば、$a_n$も$L$に収束する。
    reason: $a_n=(-1)^n$の算術平均は$0$に収束するが、$(a_n)$は収束しない。
  target: |
    ∀ (a : ℕ → ℝ) (L : ℝ), Filter.Tendsto a Filter.atTop (nhds L) → Filter.Tendsto (fun n : ℕ => (∑ i ∈ Finset.range (n + 1), a i) / ((n : ℝ) + 1)) Filter.atTop (nhds L)
  proof: |
    by
      intro a L h
      have := h.cesaro.comp (Filter.tendsto_add_atTop_nat 1)
      refine this.congr fun n => ?_
      simp only [Function.comp, Nat.cast_add, Nat.cast_one]
      rw [div_eq_inv_mul]
- id: seq_fixed_point_of_recursion
  kind: gap
  level: 1
  topic: 数列の極限・漸化式の極限
  statement: 実数列$(a_n)$と関数$f:\mathbb{R}\to\mathbb{R}$が全ての$n$で$a_{n+1}=f(a_n)$を満たし、$a_n\to L$かつ$f$が$L$で連続ならば、$f(L)=L$である。
  statement_en: If a_{n+1} = f(a_n) for all n, a_n → L and f is continuous at L, then f(L) = L.
  assumptions:
  - 全ての$n$で$a_{n+1}=f(a_n)$
  - $a_n\to L$
  - $f:\mathbb{R}\to\mathbb{R}$は$L$で連続
  quantifiers:
  - 任意の$(a_n)$、$f$、$L$
  conclusion: $f(L)=L$である。
  answer: |
    $(a_n)$を実数列、$f:\mathbb{R}\to\mathbb{R}$とし、全ての$n$で$a_{n+1}=f(a_n)$、$a_n\to L$、$f$は$L$で連続とする。

    $f(a_n)\to f(L)$を示す。$\varepsilon>0$に対し、連続性から$\delta>0$があり、$|x-L|<\delta$なら$|f(x)-f(L)|<\varepsilon$である。$a_n\to L$よりある$N$があり、$n\geq N$なら$|a_n-L|<\delta$なので、$|f(a_n)-f(L)|<\varepsilon$となる。

    一方、$\varepsilon>0$に対し、$a_n\to L$よりある$N'$があり、$n\geq N'$なら$|a_n-L|<\varepsilon$である。$n\geq N'$なら$n+1\geq N'$でもあるので、$|f(a_n)-L|=|a_{n+1}-L|<\varepsilon$となる。つまり数列$f(a_n)$は$L$にも収束する。極限は一意なので$f(L)=L$である。
  strategy: The sequence a_{n+1} = f(a_n) has both limits L and f(L), and limits are unique.
  sketch:
  - "derive: Continuity at L gives f(a_n) → f(L)."
  - "derive: Shifting the index gives f(a_n) = a_{n+1} → L."
  - "conclude: Uniqueness of limits gives f(L) = L."
  openmath: (forall (a f L) (-> (and (forall (n) (= (seq_value a (+ n 1)) (fn_value f (seq_value a n)))) (seq_tends_to a L) (fn_continuous_at (lambda (x) (fn_value f x)) L)) (= (fn_value f L) L)))
  hard_negative:
    statement: $f$が$L$で連続でなくても、$a_{n+1}=f(a_n)$かつ$a_n\to L$なら$f(L)=L$である。
    reason: $x\neq0$で$f(x)=x/2$、$f(0)=1$とし、$a_0=1$とすると$a_n=2^{-n}\to0$だが、$f(0)=1\neq0$である。
  target: |
    ∀ (a : ℕ → ℝ) (f : ℝ → ℝ) (L : ℝ), (∀ n, a (n + 1) = f (a n)) → Filter.Tendsto a Filter.atTop (nhds L) → ContinuousAt f L → f L = L
  proof: |
    by
      intro a f L hr ha hf
      have h1 : Filter.Tendsto (fun n => f (a n)) Filter.atTop (nhds (f L)) := hf.tendsto.comp ha
      have h2 : Filter.Tendsto (fun n => f (a n)) Filter.atTop (nhds L) := by
        have := ha.comp (Filter.tendsto_add_atTop_nat 1)
        exact this.congr fun n => hr n
      exact tendsto_nhds_unique h1 h2
- id: nth_root_n_limit
  kind: textbook
  level: 1
  topic: 数列の極限・自然数のべき根
  statement: 自然数$n$について、$(n+1)^{1/(n+1)}$は$n\to\infty$で$1$に収束する。
  statement_en: For natural numbers n, the (n+1)-th root of n+1 converges to 1 as n tends to infinity.
  assumptions:
  - $n$は自然数
  quantifiers:
  - $n\to\infty$の極限
  conclusion: $(n+1)^{1/(n+1)}\to1$である。
  answer: |
    自然数$m\geq1$に対して$h_m=m^{1/m}-1$とおく。$m\geq1$より$m^{1/m}\geq1$なので$h_m\geq0$である。$m=(1+h_m)^m$なので、$m\geq2$なら二項定理と$h_m\geq0$から$m\geq\frac{m(m-1)}{2}h_m^2$となる。したがって$0\leq h_m\leq\sqrt{2/(m-1)}$である。

    $\varepsilon>0$を任意にとり、$M\geq2$かつ$M>1+2/\varepsilon^2$となる$M$をとる。$m\geq M$なら$2/(m-1)<\varepsilon^2$なので$0\leq h_m<\varepsilon$である。よって$m^{1/m}\to1$であり、$m=n+1$とおいて結論を得る。
  strategy: Write the root as 1 + h and bound h with one term of the binomial expansion.
  sketch:
  - "setup: Put h_m = m^(1/m) - 1, which is nonnegative."
  - "derive: The binomial theorem gives m ≥ m(m-1)h_m²/2 for m ≥ 2."
  - "derive: Hence h_m ≤ √(2/(m-1))."
  - "conclude: The right side tends to 0, so m^(1/m) → 1."
  openmath: (seq_fn_tends_to (lambda (n) (^ (+ n 1) (/ 1 (+ n 1)))) 1)
  hard_negative:
    statement: $(n+1)^{1/(n+1)}$は$n$について単調減少である。
    reason: $n=0$で$1$、$n=1$で$\sqrt{2}>1$なので、最初の2項で増加している。
  target: |
    Filter.Tendsto (fun n : ℕ => ((n : ℝ) + 1) ^ ((1 : ℝ) / ((n : ℝ) + 1))) Filter.atTop (nhds 1)
  proof: |
    by
      have h : Filter.Tendsto (fun n : ℕ => (n : ℝ) + 1) Filter.atTop Filter.atTop :=
        Filter.tendsto_atTop_add_const_right _ _ tendsto_natCast_atTop_atTop
      exact tendsto_rpow_div.comp h
- id: pow_mul_geometric_null
  kind: gap
  level: 1
  topic: 数列の極限・多項式と等比数列の積
  statement: 自然数$k$と$|r|<1$を満たす実数$r$について、$n^kr^n\to0$である。
  statement_en: For a natural number k and real r with |r| < 1, the sequence n^k r^n converges to 0.
  assumptions:
  - $k$は自然数
  - $r\in\mathbb{R}$、$|r|<1$
  quantifiers:
  - 任意の$k$と$|r|<1$を満たす$r$
  conclusion: $n^kr^n\to0$である。
  answer: |
    $k$を自然数、$r$を$|r|<1$を満たす実数とする。$r=0$なら$n\geq1$で$n^kr^n=0$なので結論は成り立つ。以下$r\neq0$とする。

    $s=|r|^{1/(k+1)}$とおくと$0<s<1$である。$s=1/(1+h)$により$h>0$を定める。二項定理より$n\geq2$で$(1+h)^n\geq n(n-1)h^2/2$なので、$0\leq ns^n\leq\frac{2}{(n-1)h^2}$となり、はさみうちにより$ns^n\to0$である。

    $|n^kr^n|=n^ks^{(k+1)n}=(ns^n)^ks^n$である。十分大きな$n$では$ns^n\leq1$なので$(ns^n)^k\leq1$となり、$n\geq1$なら$s^n\leq ns^n$であるから、$|n^kr^n|\leq ns^n$を得る。右辺は$0$に収束するので、$n^kr^n\to0$である。
  strategy: Take a (k+1)-th root of |r| and reduce to n s^n → 0, which follows from the binomial theorem.
  sketch:
  - "setup: Treat r = 0 directly and otherwise put s = |r|^(1/(k+1)) in (0,1)."
  - "derive: The binomial theorem gives n s^n ≤ 2/((n-1)h²) with s = 1/(1+h), so n s^n → 0."
  - "translate: |n^k r^n| = (n s^n)^k s^n."
  - "conclude: For large n this is at most n s^n, which tends to 0."
  openmath: (forall (k r) (-> (and (in k N) (< (abs r) 1)) (seq_fn_tends_to (lambda (n) (* (^ n k) (^ r n))) 0)))
  hard_negative:
    statement: $|r|\leq1$なら$n^kr^n\to0$である。
    reason: $k=0$、$r=1$とすると、$n\geq1$で$n^kr^n=1$となり$0$に収束しない。
  target: |
    ∀ (k : ℕ) (r : ℝ), |r| < 1 → Filter.Tendsto (fun n : ℕ => (n : ℝ) ^ k * r ^ n) Filter.atTop (nhds 0)
  proof: |
    by
      intro k r hr
      exact tendsto_pow_const_mul_const_pow_of_abs_lt_one k hr
- id: cauchy_of_geometric_increments
  kind: gap
  level: 1
  topic: コーシー列・等比的に減る増分
  statement: 実数列$(a_n)$と実数$C$、$0\leq r<1$が全ての$n$で$|a_{n+1}-a_n|\leq Cr^n$を満たすならば、$(a_n)$はある$L$に収束し、全ての$n$で$|a_n-L|\leq Cr^n/(1-r)$である。ただし$r=0$でも$r^0=1$とする。
  statement_en: If |a_{n+1} - a_n| ≤ C r^n for all n with 0 ≤ r < 1, then a converges to some L and |a_n - L| ≤ C r^n/(1-r) for all n.
  assumptions:
  - $(a_n)$は実数列、$C\in\mathbb{R}$、$0\leq r<1$
  - 全ての$n$で$|a_{n+1}-a_n|\leq Cr^n$
  quantifiers:
  - 任意の$(a_n)$、$C$、$r$
  - ある$L\in\mathbb{R}$
  conclusion: $a_n\to L$かつ全ての$n$で$|a_n-L|\leq Cr^n/(1-r)$である。
  answer: |
    $(a_n)$を実数列、$C\in\mathbb{R}$、$0\leq r<1$とし、全ての$n$で$|a_{n+1}-a_n|\leq Cr^n$とする（$r=0$でも$r^0=1$とする）。$n=0$の不等式から$C\geq0$である。

    $m>n$なら三角不等式と等比数列の和から$|a_m-a_n|\leq\sum_{k=n}^{m-1}|a_{k+1}-a_k|\leq C\sum_{k=n}^{m-1}r^k\leq\frac{Cr^n}{1-r}$となる。$0\leq r<1$より$r^n\to0$なので、$(a_n)$はコーシー列である。実数の完備性からある$L$に収束する。

    上の不等式で$n$を固定して$m\to\infty$とすると、$|a_n-L|\leq Cr^n/(1-r)$を得る。
  strategy: Sum the increments as a geometric series to get a Cauchy bound, then pass to the limit.
  sketch:
  - "derive: For m > n, |a_m - a_n| ≤ C r^n/(1-r) by the triangle inequality."
  - "apply_theorem: Since r^n → 0 the sequence is Cauchy, so it converges to some L."
  - "conclude: Letting m → ∞ gives |a_n - L| ≤ C r^n/(1-r)."
  openmath: (forall (a c r) (-> (and (<= 0 r) (< r 1) (forall (n) (<= (abs (- (seq_value a (+ n 1)) (seq_value a n))) (* c (^ r n))))) (exists (L) (and (seq_tends_to a L) (forall (n) (<= (abs (- (seq_value a n) L)) (/ (* c (^ r n)) (- 1 r))))))))
  hard_negative:
    statement: $r=1$でも、全ての$n$で$|a_{n+1}-a_n|\leq Cr^n$なら$(a_n)$は収束する。
    reason: $a_n=n$、$C=1$、$r=1$は不等式を満たすが、$(a_n)$は発散する。
  target: |
    ∀ (a : ℕ → ℝ) (C r : ℝ), 0 ≤ r → r < 1 → (∀ n, |a (n + 1) - a n| ≤ C * r ^ n) → ∃ L : ℝ, Filter.Tendsto a Filter.atTop (nhds L) ∧ ∀ n, |a n - L| ≤ C * r ^ n / (1 - r)
  proof: |
    by
      intro a C r _ hr h
      have hu : ∀ n, dist (a n) (a (n + 1)) ≤ C * r ^ n := fun n => by
        rw [dist_comm, Real.dist_eq]; exact h n
      obtain ⟨L, hL⟩ := cauchySeq_tendsto_of_complete (cauchySeq_of_le_geometric r C hr hu)
      refine ⟨L, hL, fun n => ?_⟩
      have := dist_le_of_le_geometric_of_tendsto r C hr hu hL n
      rwa [Real.dist_eq] at this
- id: pow_continuous_eps_delta
  kind: gap
  level: 1
  topic: 連続性・ε-δ論法とべき関数
  statement: 自然数$n$と実数$a$、$\varepsilon>0$に対して$\delta>0$が存在し、$|x-a|<\delta$を満たす全ての実数$x$で$|x^n-a^n|<\varepsilon$となる。
  statement_en: For a natural number n, real a and ε > 0 there is δ > 0 such that |x^n - a^n| < ε whenever |x - a| < δ.
  assumptions:
  - $n$は自然数、$a\in\mathbb{R}$、$\varepsilon>0$
  quantifiers:
  - 任意の$n$、$a$、$\varepsilon>0$
  - ある$\delta>0$
  - 全ての$x\in\mathbb{R}$
  conclusion: $|x-a|<\delta$なら$|x^n-a^n|<\varepsilon$である。
  answer: |
    $n$を自然数、$a\in\mathbb{R}$、$\varepsilon>0$とする。$n=0$なら$x^n-a^n=0$なので、$\delta=1$でよい。以下$n\geq1$とする。

    $B=|a|+1$とおく。$|x-a|<1$なら$|x|\leq B$であり、$|a|\leq B$でもある。因数分解$x^n-a^n=(x-a)\sum_{i=0}^{n-1}x^ia^{n-1-i}$の和の各項の絶対値は$B^{n-1}$以下なので、$|x^n-a^n|\leq nB^{n-1}|x-a|$となる。

    $\delta=\min\{1,\varepsilon/(nB^{n-1})\}$とおくと$\delta>0$である。$|x-a|<\delta$なら$|x^n-a^n|\leq nB^{n-1}|x-a|<\varepsilon$となる。
  strategy: Factor x^n - a^n and bound the cofactor after restricting to |x - a| < 1.
  sketch:
  - "case_split: The case n = 0 is immediate since the difference vanishes."
  - "translate: Factor x^n - a^n as (x - a) times a sum of n products."
  - "derive: For |x - a| < 1 each product is at most B^(n-1) with B = |a| + 1."
  - "construct: Take δ = min(1, ε/(n B^(n-1)))."
  - "conclude: Then |x - a| < δ gives |x^n - a^n| < ε."
  openmath: (forall (n a e) (-> (and (in n N) (> e 0)) (exists (d) (and (> d 0) (forall (x) (-> (< (abs (- x a)) d) (< (abs (- (^ x n) (^ a n))) e)))))))
  hard_negative:
    statement: $n\geq2$のとき、$\delta$を$a$によらず$\varepsilon$だけから選べる。
    reason: $n=2$、$a>0$、$x=a+\delta/2$とすると$|x^2-a^2|=\delta a+\delta^2/4$であり、$\delta$を固定して$a$を大きくすれば$\varepsilon$を超える。
  target: |
    ∀ (n : ℕ) (a ε : ℝ), 0 < ε → ∃ δ : ℝ, 0 < δ ∧ ∀ x : ℝ, |x - a| < δ → |x ^ n - a ^ n| < ε
  proof: |
    by
      intro n a ε hε
      obtain ⟨δ, hδ, h⟩ := Metric.continuous_iff.1 (continuous_pow n : Continuous fun x : ℝ => x ^ n) a ε hε
      exact ⟨δ, hδ, fun x hx => by simpa [Real.dist_eq] using h x (by simpa [Real.dist_eq] using hx)⟩
- id: abs_sqrt_sub_sqrt_le
  kind: gap
  level: 1
  topic: 連続性・平方根の評価
  statement: $x,y\geq0$なら$|\sqrt{x}-\sqrt{y}|\leq\sqrt{|x-y|}$である。
  statement_en: For real x, y ≥ 0, |√x - √y| ≤ √|x - y|.
  assumptions:
  - $x,y\in\mathbb{R}$、$x\geq0$、$y\geq0$
  quantifiers:
  - 任意の$x,y\geq0$
  conclusion: $|\sqrt{x}-\sqrt{y}|\leq\sqrt{|x-y|}$である。
  answer: |
    $x,y\geq0$とする。両辺は$x,y$について対称なので、$y\leq x$としてよい。$s=\sqrt{x}$、$t=\sqrt{y}$とおくと$s\geq t\geq0$である。

    $t^2\leq st$なので、$(s-t)^2=s^2-2st+t^2\leq s^2-t^2=x-y=|x-y|$となる。両辺の平方根をとると$|s-t|\leq\sqrt{|x-y|}$を得る。
  strategy: Assume y ≤ x, compare the square of the difference with x - y, and take roots.
  sketch:
  - "setup: By symmetry assume y ≤ x and put s = √x, t = √y."
  - "derive: Since t² ≤ st, (s - t)² ≤ s² - t² = |x - y|."
  - "conclude: Taking square roots gives the bound."
  openmath: (forall (x y) (-> (and (>= x 0) (>= y 0)) (<= (abs (- (root x 2) (root y 2))) (root (abs (- x y)) 2))))
  hard_negative:
    statement: $x,y\geq0$なら$|\sqrt{x}-\sqrt{y}|\leq|x-y|$である。
    reason: $x=1/4$、$y=0$では左辺が$1/2$、右辺が$1/4$である。平方根は原点の近くでリプシッツ連続でない。
  target: |
    ∀ x y : ℝ, 0 ≤ x → 0 ≤ y → |Real.sqrt x - Real.sqrt y| ≤ Real.sqrt |x - y|
  proof: |
    by
      intro x y hx hy
      apply Real.abs_le_sqrt
      have h1 := Real.sq_sqrt hx
      have h2 := Real.sq_sqrt hy
      have h3 := Real.sqrt_nonneg x
      have h4 := Real.sqrt_nonneg y
      rcases le_total x y with h | h
      · have h5 := Real.sqrt_le_sqrt h
        rw [abs_of_nonpos (sub_nonpos.2 h)]
        nlinarith
      · have h5 := Real.sqrt_le_sqrt h
        rw [abs_of_nonneg (sub_nonneg.2 h)]
        nlinarith
- id: eps_delta_limit_add
  kind: gap
  level: 1
  topic: 関数の極限・ε-δ論法と和
  statement: 関数$f,g:\mathbb{R}\to\mathbb{R}$が$\varepsilon$-$\delta$の意味で$x\to a$（$x\neq a$）のとき$f(x)\to L$、$g(x)\to M$を満たすならば、同じ意味で$f(x)+g(x)\to L+M$である。
  statement_en: If f(x) → L and g(x) → M as x → a with x ≠ a in the ε-δ sense, then f(x) + g(x) → L + M in the same sense.
  assumptions:
  - 任意の$\varepsilon>0$に対してある$\delta>0$があり、$0<|x-a|<\delta$なら$|f(x)-L|<\varepsilon$
  - 任意の$\varepsilon>0$に対してある$\delta>0$があり、$0<|x-a|<\delta$なら$|g(x)-M|<\varepsilon$
  quantifiers:
  - 任意の$f,g:\mathbb{R}\to\mathbb{R}$と$a,L,M\in\mathbb{R}$
  conclusion: 任意の$\varepsilon>0$に対してある$\delta>0$があり、$0<|x-a|<\delta$なら$|f(x)+g(x)-(L+M)|<\varepsilon$である。
  answer: |
    $f,g:\mathbb{R}\to\mathbb{R}$、$a,L,M\in\mathbb{R}$とし、$x\to a$（$x\neq a$）のとき$\varepsilon$-$\delta$の意味で$f(x)\to L$、$g(x)\to M$とする。

    $\varepsilon>0$を任意にとる。仮定を$\varepsilon/2$に適用すると、$\delta_1>0$と$\delta_2>0$があり、$0<|x-a|<\delta_1$なら$|f(x)-L|<\varepsilon/2$、$0<|x-a|<\delta_2$なら$|g(x)-M|<\varepsilon/2$である。$\delta=\min\{\delta_1,\delta_2\}$とおく。$0<|x-a|<\delta$なら、三角不等式から$|f(x)+g(x)-(L+M)|\leq|f(x)-L|+|g(x)-M|<\varepsilon$となる。
  strategy: Apply both hypotheses to ε/2, take the smaller δ and use the triangle inequality.
  sketch:
  - "setup: Fix ε > 0 and take δ₁, δ₂ for ε/2."
  - "construct: Put δ = min(δ₁, δ₂)."
  - "conclude: The triangle inequality bounds the sum error by ε/2 + ε/2."
  openmath: (forall (f g a L M) (-> (and (forall (e) (-> (> e 0) (exists (d) (and (> d 0) (forall (x) (-> (and (< 0 (abs (- x a))) (< (abs (- x a)) d)) (< (abs (- (fn_value f x) L)) e))))))) (forall (e) (-> (> e 0) (exists (d) (and (> d 0) (forall (x) (-> (and (< 0 (abs (- x a))) (< (abs (- x a)) d)) (< (abs (- (fn_value g x) M)) e)))))))) (forall (e) (-> (> e 0) (exists (d) (and (> d 0) (forall (x) (-> (and (< 0 (abs (- x a))) (< (abs (- x a)) d)) (< (abs (- (+ (fn_value f x) (fn_value g x)) (+ L M))) e)))))))))
  hard_negative:
    statement: $f(x)+g(x)$が$x\to a$で収束すれば、$f(x)$と$g(x)$もそれぞれ収束する。
    reason: $x\neq a$で$f(x)=1/(x-a)$、$g(x)=-1/(x-a)$とすると和は$0$だが、$f$も$g$も収束しない。
  target: |
    ∀ (f g : ℝ → ℝ) (a L M : ℝ), (∀ ε : ℝ, 0 < ε → ∃ δ : ℝ, 0 < δ ∧ ∀ x : ℝ, 0 < |x - a| → |x - a| < δ → |f x - L| < ε) → (∀ ε : ℝ, 0 < ε → ∃ δ : ℝ, 0 < δ ∧ ∀ x : ℝ, 0 < |x - a| → |x - a| < δ → |g x - M| < ε) → ∀ ε : ℝ, 0 < ε → ∃ δ : ℝ, 0 < δ ∧ ∀ x : ℝ, 0 < |x - a| → |x - a| < δ → |f x + g x - (L + M)| < ε
  proof: |
    by
      intro f g a L M hf hg ε hε
      obtain ⟨δ₁, hδ₁, h₁⟩ := hf (ε / 2) (by positivity)
      obtain ⟨δ₂, hδ₂, h₂⟩ := hg (ε / 2) (by positivity)
      refine ⟨min δ₁ δ₂, lt_min hδ₁ hδ₂, fun x h0 hx => ?_⟩
      have h3 := h₁ x h0 (lt_of_lt_of_le hx (min_le_left _ _))
      have h4 := h₂ x h0 (lt_of_lt_of_le hx (min_le_right _ _))
      have h5 : f x + g x - (L + M) = (f x - L) + (g x - M) := by ring
      rw [h5]
      calc _ ≤ |f x - L| + |g x - M| := abs_add_le _ _
        _ < ε := by linarith
- id: eps_delta_limit_mul
  kind: gap
  level: 1
  topic: 関数の極限・ε-δ論法と積
  statement: 関数$f,g:\mathbb{R}\to\mathbb{R}$が$\varepsilon$-$\delta$の意味で$x\to a$（$x\neq a$）のとき$f(x)\to L$、$g(x)\to M$を満たすならば、同じ意味で$f(x)g(x)\to LM$である。
