    全ての$n$で$a_n\geq0$であり$a_n\to L$とする。極限は弱い不等式を保つので$L\geq0$である。

    $L=0$のとき、$\varepsilon>0$に対し、十分大きな$n$で$a_n<\varepsilon^2$となり、$\sqrt{a_n}<\varepsilon$である。

    $L>0$のとき、$\sqrt{a_n}+\sqrt L\geq\sqrt L>0$より$|\sqrt{a_n}-\sqrt L|=\frac{|a_n-L|}{\sqrt{a_n}+\sqrt L}\leq\frac{|a_n-L|}{\sqrt L}$である。右辺は$0$に収束するので$\sqrt{a_n}\to\sqrt L$である。
