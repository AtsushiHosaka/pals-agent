  hard_negative:
    statement: $\int_a^bf(b-x)\,dx=\int_a^bf(x)\,dx$である。
    reason: 端点が入れ替わるのは$a+b-x$の場合に限る。$f(x)=x$、$a=1$、$b=2$では左辺は$\dfrac12$、右辺は$\dfrac32$である。
  target: |
    ∀ (f : ℝ → ℝ) (a b : ℝ), IntervalIntegrable f MeasureTheory.volume a b → (∫ x in a..b, f (a + b - x)) = ∫ x in a..b, f x
  proof: |
    by
      intro f a b _
      rw [intervalIntegral.integral_comp_sub_left (fun x => f x) (a + b)]
      simp
- id: antitone_sum_integral_bounds
  kind: gap
  level: high
  topic: 定積分・和と積分の比較
  statement: $f$が$[m,m+n]$で単調非増加なら、$\sum_{i=0}^{n-1}f(m+i+1)\leq\int_m^{m+n}f(x)\,dx\leq\sum_{i=0}^{n-1}f(m+i)$である。ここで$m$は実数、$n$は自然数である。
  statement_en: If f is nonincreasing on [m, m+n] with m real and n natural, then ∑_{i<n} f(m+i+1) ≤ ∫_m^{m+n} f ≤ ∑_{i<n} f(m+i).
  assumptions:
  - $m$は実数、$n$は自然数
  - $f$は$[m,m+n]$で単調非増加
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$、実数$m$、自然数$n$
  conclusion: $\sum_{i=0}^{n-1}f(m+i+1)\leq\int_m^{m+n}f(x)\,dx\leq\sum_{i=0}^{n-1}f(m+i)$である。
  answer: |
    $m$を実数、$n$を自然数とし、$f:\mathbb{R}\to\mathbb{R}$は$[m,m+n]$で単調非増加とする。単調関数なので$f$はこの区間で積分可能である。
    $0\leq i<n$とする。$x\in[m+i,m+i+1]$で$f(m+i+1)\leq f(x)\leq f(m+i)$である。この区間の長さは$1$なので、積分すると
    $f(m+i+1)\leq\int_{m+i}^{m+i+1}f(x)\,dx\leq f(m+i)$
    である。これを$i=0,\dots,n-1$について足す。積分の区間は順につながるので、中央の和は$\int_m^{m+n}f(x)\,dx$となる。
  strategy: Bound the integral on each unit interval by the endpoint values and sum.
  sketch:
  - 'setup: A monotone function is integrable on the interval.'
  - 'derive: On each unit interval the values lie between the endpoint values.'
  - 'derive: Integrating over length 1 gives the two bounds for that interval.'
  - 'conclude: Add over i and combine the adjacent integrals.'
  openmath: (forall (f m n) (-> (and (in n N) (fn_antitone_on (lambda (x) (fn_value f x)) (closed_interval m (+ m n)))) (and (<= (sum (natural_range n) (lambda (i) (fn_value f (+ m (+ i 1))))) (interval_integral m (+ m n) (lambda (x) (fn_value f x)))) (<= (interval_integral m (+ m n) (lambda (x) (fn_value f x))) (sum (natural_range n) (lambda (i) (fn_value f (+ m i))))))))
  hard_negative:
    statement: 単調性がなくても$\int_m^{m+n}f(x)\,dx\leq\sum_{i=0}^{n-1}f(m+i)$である。
    reason: $f(x)=x$、$m=0$、$n=1$では積分は$\dfrac12$だが、右辺は$f(0)=0$である。
  target: |
    ∀ (f : ℝ → ℝ) (m : ℝ) (n : ℕ), AntitoneOn f (Set.Icc m (m + n)) → (∑ i ∈ Finset.range n, f (m + ((i : ℝ) + 1))) ≤ (∫ x in m..(m + n), f x) ∧ (∫ x in m..(m + n), f x) ≤ ∑ i ∈ Finset.range n, f (m + i)
  proof: |
    by
      intro f m n hf
      refine ⟨?_, hf.integral_le_sum⟩
      have := hf.sum_le_integral
      simpa using this
- id: derivative_of_integral_x_minus_t
  kind: gap
  level: high
  topic: 微積分の基本定理・積分内に変数がある形
  statement: $f$が連続なら、$\int_a^y(y-t)f(t)\,dt$を$y$の関数と見たときの$x$における微分係数は$\int_a^xf(t)\,dt$である。
  statement_en: If f is continuous, then the function y ↦ ∫_a^y (y-t) f(t) dt has derivative ∫_a^x f(t) dt at x.
  assumptions:
  - $f$は実数全体で連続
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$と実数$a,x$
  conclusion: $y\mapsto\int_a^y(y-t)f(t)\,dt$の$x$における微分係数は$\int_a^xf(t)\,dt$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$を連続とし、$a,x$を実数とする。被積分関数の中の$y$は積分変数$t$から見て定数なので、外に出すと
    $\int_a^y(y-t)f(t)\,dt=y\int_a^yf(t)\,dt-\int_a^ytf(t)\,dt$
    である。$f(t)$と$tf(t)$は連続なので、微積分の基本定理により、$\int_a^yf(t)\,dt$と$\int_a^ytf(t)\,dt$の$x$における微分係数はそれぞれ$f(x)$、$xf(x)$である。積の微分法により、右辺全体の微分係数は$\int_a^xf(t)\,dt+xf(x)-xf(x)=\int_a^xf(t)\,dt$である。
  strategy: Pull y out of the integral, then use the product rule and the fundamental theorem.
  sketch:
  - 'derive: Split the integrand and pull y out of the first integral.'
  - 'apply_theorem: The fundamental theorem differentiates each integral.'
  - 'derive: The product rule gives ∫_a^x f + x f(x) - x f(x).'
  - 'conclude: The terms x f(x) cancel.'
  openmath: (forall (f a x) (-> (fn_continuous (lambda (t) (fn_value f t))) (has_deriv_at (lambda (y) (interval_integral a y (lambda (t) (* (- y t) (fn_value f t))))) (interval_integral a x (lambda (t) (fn_value f t))) x)))
  hard_negative:
    statement: $\int_a^y(y-t)f(t)\,dt$の$y=x$における微分係数は、上端を代入した$(x-x)f(x)=0$である。
    reason: 被積分関数も$y$を含むので、基本定理をそのまま使えない。$f=1$、$a=0$では積分は$\dfrac{y^2}{2}$で、微分係数は$x$である。
  target: |
    ∀ (f : ℝ → ℝ) (a x : ℝ), Continuous f → HasDerivAt (fun y => ∫ t in a..y, (y - t) * f t) (∫ t in a..x, f t) x
  proof: |
    by
      intro f a x hf
      have heq : (fun y => ∫ t in a..y, (y - t) * f t) = fun y => y * (∫ t in a..y, f t) - ∫ t in a..y, t * f t := by
        ext y
        have h1 : IntervalIntegrable (fun t => y * f t) MeasureTheory.volume a y := (by fun_prop : Continuous fun t => y * f t).intervalIntegrable a y
        have h2 : IntervalIntegrable (fun t => t * f t) MeasureTheory.volume a y := (by fun_prop : Continuous fun t => t * f t).intervalIntegrable a y
        rw [← intervalIntegral.integral_const_mul, ← intervalIntegral.integral_sub h1 h2]
        refine intervalIntegral.integral_congr fun t _ => ?_
        ring
      rw [heq]
      have hF : HasDerivAt (fun y => ∫ t in a..y, f t) (f x) x := (hf.integral_hasStrictDerivAt a x).hasDerivAt
      have hG : HasDerivAt (fun y => ∫ t in a..y, t * f t) (x * f x) x :=
        ((by fun_prop : Continuous fun t => t * f t).integral_hasStrictDerivAt a x).hasDerivAt
      exact (((hasDerivAt_id' x).fun_mul hF).fun_sub hG).congr_deriv (by ring)
