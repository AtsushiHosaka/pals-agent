- id: derivative_comparison_inequality
  kind: gap
  level: high
  topic: 微分・不等式の証明
  statement: $f,g$が$x\geq a$で連続、$x>a$で微分可能で$g'\leq f'$、さらに$g(a)\leq f(a)$なら、$x\geq a$で$g(x)\leq f(x)$である。
  statement_en: If f and g are continuous on [a, ∞), have derivatives f' and g' on (a, ∞) with g' ≤ f' there, and g(a) ≤ f(a), then g(x) ≤ f(x) for all x ≥ a.
  assumptions:
  - $f,g$は$[a,\infty)$で連続
  - $x>a$で$f,g$の導関数は$f',g'$
  - $x>a$で$g'(x)\leq f'(x)$
  - $g(a)\leq f(a)$
  quantifiers:
  - 任意の$f,g,f',g':\mathbb{R}\to\mathbb{R}$と実数$a$
  - 任意の$x\geq a$
  conclusion: $g(x)\leq f(x)$である。
  answer: |
    $f,g:\mathbb{R}\to\mathbb{R}$は$[a,\infty)$で連続とする。$x>a$で$f,g$の導関数がそれぞれ$f',g'$であり、$x>a$で$g'(x)\leq f'(x)$、また$g(a)\leq f(a)$とする。$x\geq a$をとる。
    $x=a$なら仮定そのものである。
    $x>a$とする。$h=f-g$は$[a,x]$で連続、$(a,x)$で微分可能である。平均値の定理により、ある$c\in(a,x)$で$h(x)-h(a)=(f'(c)-g'(c))(x-a)$となる。右辺は$0$以上なので$h(x)\geq h(a)\geq 0$であり、$g(x)\leq f(x)$である。
  strategy: Apply the mean value theorem to the difference f - g.
  sketch:
  - 'case_split: The case x = a is the hypothesis at the left endpoint.'
  - 'setup: For x > a put h = f - g on [a, x].'
  - 'apply_theorem: The mean value theorem gives c with h(x) - h(a) = (f''(c) - g''(c))(x-a).'
  - 'conclude: The right side is nonnegative, so h(x) ≥ h(a) ≥ 0.'
  openmath: (forall (f g df dg a) (-> (and (fn_continuous_on (lambda (x) (fn_value f x)) (closed_half_line_right a)) (fn_continuous_on (lambda (x) (fn_value g x)) (closed_half_line_right a)) (forall (x) (-> (< a x) (has_deriv_at (lambda (y) (fn_value f y)) (fn_value df x) x))) (forall (x) (-> (< a x) (has_deriv_at (lambda (y) (fn_value g y)) (fn_value dg x) x))) (forall (x) (-> (< a x) (<= (fn_value dg x) (fn_value df x)))) (<= (fn_value g a) (fn_value f a))) (forall (x) (-> (<= a x) (<= (fn_value g x) (fn_value f x))))))
  hard_negative:
    statement: $x>a$で$g'\leq f'$なら、$x\geq a$で$g(x)\leq f(x)$である。
    reason: 始点での条件が必要である。$f(x)=x$、$g(x)=x+1$、$a=0$では$g'=f'$だが、つねに$g(x)>f(x)$である。
  target: |
    ∀ (f g f' g' : ℝ → ℝ) (a : ℝ), ContinuousOn f (Set.Ici a) → ContinuousOn g (Set.Ici a) → (∀ x, a < x → HasDerivAt f (f' x) x) → (∀ x, a < x → HasDerivAt g (g' x) x) → (∀ x, a < x → g' x ≤ f' x) → g a ≤ f a → ∀ x, a ≤ x → g x ≤ f x
  proof: |
    by
      intro f g f' g' a hf hg hdf hdg hle ha x hx
      rcases hx.eq_or_lt with rfl | hx
      · exact ha
      · have hcont : ContinuousOn (fun y => f y - g y) (Set.Icc a x) :=
          (hf.mono Set.Icc_subset_Ici_self).sub (hg.mono Set.Icc_subset_Ici_self)
        obtain ⟨c, hc1, hc2⟩ := exists_hasDerivAt_eq_slope (fun y => f y - g y) (fun y => f' y - g' y) hx hcont (fun y hy => (hdf y hy.1).sub (hdg y hy.1))
        have hpos : 0 < x - a := by linarith
        rw [eq_div_iff hpos.ne'] at hc2
        have := hle c hc1.1
        nlinarith
- id: unique_root_of_positive_derivative
  kind: gap
  level: high
  topic: 微分・方程式の解の個数
  statement: $a<b$とする。$f$が$[a,b]$で連続、$(a,b)$で$f'>0$、$f(a)<0<f(b)$なら、$f(x)=0$の解は$(a,b)$にちょうど1個ある。
  statement_en: If a < b, f is continuous on [a,b], has a positive derivative on (a,b), and f(a) < 0 < f(b), then f has exactly one zero in (a,b).
  assumptions:
  - $a<b$
  - $f$は$[a,b]$で連続
  - $(a,b)$で$f$の導関数は$f'$で、$f'>0$
  - $f(a)<0<f(b)$
  quantifiers:
  - 任意の$f,f':\mathbb{R}\to\mathbb{R}$と実数$a,b$
  conclusion: $x\in(a,b)$かつ$f(x)=0$を満たす$x$がただ1つ存在する。
  answer: |
    $a<b$とし、$f:\mathbb{R}\to\mathbb{R}$は$[a,b]$で連続、$(a,b)$で導関数$f'$をもち$f'>0$、$f(a)<0<f(b)$とする。
    中間値の定理により、ある$x\in(a,b)$で$f(x)=0$となる。
    次に、$u<v$を$(a,b)$の点とする。平均値の定理により、ある$c\in(u,v)$で$f(v)-f(u)=f'(c)(v-u)>0$である。よって$f$は$(a,b)$で狭義単調増加である。$f(x)=f(y)=0$を満たす$x,y\in(a,b)$が異なると、この単調性に反する。したがって解はただ1つである。
  strategy: Get existence from the intermediate value theorem and uniqueness from strict monotonicity.
  sketch:
  - 'apply_theorem: The intermediate value theorem gives a zero x in (a,b).'
  - 'apply_theorem: The mean value theorem makes f strictly increasing on (a,b).'
  - 'conclude: Two distinct zeros would contradict strict monotonicity.'
  openmath: (forall (f df a b) (-> (and (< a b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (forall (x) (-> (in x (open_interval a b)) (has_deriv_at (lambda (y) (fn_value f y)) (fn_value df x) x))) (forall (x) (-> (in x (open_interval a b)) (< 0 (fn_value df x)))) (< (fn_value f a) 0) (< 0 (fn_value f b))) (exists (x) (and (in x (open_interval a b)) (= (fn_value f x) 0) (forall (y) (-> (and (in y (open_interval a b)) (= (fn_value f y) 0)) (= y x)))))))
  hard_negative:
    statement: $f$が連続で$f(a)<0<f(b)$なら、$f(x)=0$の解は$(a,b)$にちょうど1個ある。
