- id: integral_semicircle
  kind: textbook
  level: high
  topic: 置換積分・半円の面積
  statement: $a>0$のとき、$\int_{-a}^{a}\sqrt{a^2-x^2}\,dx=\dfrac{\pi a^2}{2}$である。
  statement_en: For a > 0, ∫_{-a}^{a} √(a^2 - x^2) dx = π a^2 / 2.
  assumptions:
  - $a>0$
  quantifiers:
  - 任意の実数$a$
  conclusion: $\int_{-a}^{a}\sqrt{a^2-x^2}\,dx=\dfrac{\pi a^2}{2}$である。
  answer: |
    $a>0$とする。$x=a\sin\theta$（$-\dfrac{\pi}{2}\leq\theta\leq\dfrac{\pi}{2}$）と置換する。$dx=a\cos\theta\,d\theta$であり、この範囲で$\cos\theta\geq 0$なので$\sqrt{a^2-x^2}=a\cos\theta$である。$x=-a$のとき$\theta=-\dfrac{\pi}{2}$、$x=a$のとき$\theta=\dfrac{\pi}{2}$なので、
    $\int_{-a}^{a}\sqrt{a^2-x^2}\,dx=a^2\int_{-\pi/2}^{\pi/2}\cos^2\theta\,d\theta=a^2\int_{-\pi/2}^{\pi/2}\dfrac{1+\cos 2\theta}{2}\,d\theta=a^2\left[\dfrac{\theta}{2}+\dfrac{\sin 2\theta}{4}\right]_{-\pi/2}^{\pi/2}=\dfrac{\pi a^2}{2}$
    である。
  strategy: Substitute x = a sin θ and integrate cos^2 θ with the double angle formula.
  sketch:
  - 'construct: Put x = a sin θ on [-π/2, π/2].'
  - 'derive: Since cos θ ≥ 0 there, the root becomes a cos θ.'
  - 'derive: The integral becomes a^2 ∫ cos^2 θ dθ.'
  - 'conclude: The double angle formula gives π a^2 / 2.'
  openmath: (forall (a) (-> (> a 0) (= (interval_integral (neg a) a (lambda (x) (root (- (^ a 2) (^ x 2)) 2))) (/ (* pi (^ a 2)) 2))))
  hard_negative:
    statement: $a>0$のとき、$\int_0^a\sqrt{a^2-x^2}\,dx=\dfrac{\pi a^2}{2}$である。
    reason: $[0,a]$の積分は四分円の面積で、値は$\dfrac{\pi a^2}{4}$である。
  target: |
    ∀ (a : ℝ), 0 < a → (∫ x in (-a)..a, Real.sqrt (a ^ 2 - x ^ 2)) = Real.pi * a ^ 2 / 2
  proof: |
    by
      intro a ha
      have h := intervalIntegral.integral_comp_mul_left (a := -1) (b := 1) (fun x => Real.sqrt (a ^ 2 - x ^ 2)) ha.ne'
      have hscale : ∀ u : ℝ, Real.sqrt (a ^ 2 - (a * u) ^ 2) = a * Real.sqrt (1 - u ^ 2) := by
        intro u
        rw [show a ^ 2 - (a * u) ^ 2 = a ^ 2 * (1 - u ^ 2) by ring, Real.sqrt_mul (sq_nonneg a), Real.sqrt_sq ha.le]
      simp only [hscale] at h
      rw [intervalIntegral.integral_const_mul, integral_sqrt_one_sub_sq] at h
      simp only [mul_neg, mul_one, smul_eq_mul] at h
      have hne := ha.ne'
      have : (∫ x in (-a)..a, Real.sqrt (a ^ 2 - x ^ 2)) = a * (a * (Real.pi / 2)) := by
        rw [h]
        field_simp
      rw [this]
      ring
- id: integral_one_over_sum_of_squares
  kind: textbook
  level: high
  topic: 置換積分・逆正接
  statement: $c>0$のとき、$\int_s^t\dfrac{dx}{x^2+c^2}=\dfrac{1}{c}\left(\arctan\dfrac{t}{c}-\arctan\dfrac{s}{c}\right)$である。
  statement_en: For c > 0, ∫_s^t dx/(x^2 + c^2) = (arctan(t/c) - arctan(s/c))/c.
  assumptions:
  - $c>0$
  quantifiers:
  - 任意の実数$c,s,t$
  conclusion: $\int_s^t\dfrac{dx}{x^2+c^2}=\dfrac{1}{c}\left(\arctan\dfrac{t}{c}-\arctan\dfrac{s}{c}\right)$である。
  answer: |
    $c>0$、$s,t$を実数とする。$\arctan$は$\tan$の逆関数で、その導関数は$\dfrac{1}{1+y^2}$である。$F(x)=\dfrac{1}{c}\arctan\dfrac{x}{c}$とおくと、合成関数の微分法により
    $F'(x)=\dfrac{1}{c}\cdot\dfrac{1}{1+(x/c)^2}\cdot\dfrac{1}{c}=\dfrac{1}{x^2+c^2}$
    である。被積分関数は$x^2+c^2>0$により連続なので、微積分の基本定理により積分の値は$F(t)-F(s)$である。
  strategy: Differentiate the scaled inverse tangent and apply the fundamental theorem.
  sketch:
  - 'construct: Put F(x) = arctan(x/c)/c.'
  - 'derive: The chain rule gives F''(x) = 1/(x^2 + c^2).'
  - 'derive: The integrand is continuous because the denominator is positive.'
  - 'conclude: The fundamental theorem gives F(t) - F(s).'
  openmath: (forall (c s t) (-> (> c 0) (= (interval_integral s t (lambda (x) (/ 1 (+ (^ x 2) (^ c 2))))) (/ (- (arctan_value (/ t c)) (arctan_value (/ s c))) c))))
  hard_negative:
    statement: $c>0$のとき、$\int_s^t\dfrac{dx}{x^2+c^2}=\arctan\dfrac{t}{c}-\arctan\dfrac{s}{c}$である。
    reason: 因子$\dfrac1c$が抜けている。$c=2$、$s=0$、$t=2$では積分は$\dfrac{\pi}{8}$だが、この式は$\dfrac{\pi}{4}$を与える。
  target: |
    ∀ (c s t : ℝ), 0 < c → (∫ x in s..t, 1 / (x ^ 2 + c ^ 2)) = (Real.arctan (t / c) - Real.arctan (s / c)) / c
  proof: |
    by
      intro c s t hc
      have hF : ∀ x ∈ Set.uIcc s t, HasDerivAt (fun x => Real.arctan (x / c) / c) (1 / (x ^ 2 + c ^ 2)) x := by
        intro x _
        have h : HasDerivAt (fun y : ℝ => y / c) (1 / c) x := (hasDerivAt_id' x).div_const c
        refine (h.arctan.div_const c).congr_deriv ?_
        have : x ^ 2 + c ^ 2 ≠ 0 := by positivity
        field_simp
        ring
      have hi : Continuous fun x : ℝ => 1 / (x ^ 2 + c ^ 2) := by
        refine continuous_const.div (by fun_prop) fun x => ?_
        positivity
      rw [intervalIntegral.integral_eq_sub_of_hasDerivAt hF (hi.intervalIntegrable s t)]
      ring
- id: integral_log_formula
  kind: textbook
  level: high
  topic: 部分積分・対数関数
  statement: $s,t>0$のとき、$\int_s^t\log x\,dx=t\log t-s\log s-t+s$である。
  statement_en: For s, t > 0, ∫_s^t log x dx = t log t - s log s - t + s.
  assumptions:
  - $s>0$
  - $t>0$
  quantifiers:
  - 任意の実数$s,t$
  conclusion: $\int_s^t\log x\,dx=t\log t-s\log s-t+s$である。
  answer: |
    $s,t>0$とする。$s,t$の間の閉区間は正の数からなるので、$\log x$はそこで連続である。$F(x)=x\log x-x$とおくと、積の微分法により$F'(x)=\log x+x\cdot\dfrac1x-1=\log x$である。微積分の基本定理により、積分の値は$F(t)-F(s)=t\log t-s\log s-t+s$である。
  strategy: Use the antiderivative x log x - x obtained by parts.
  sketch:
  - 'setup: log is continuous on the positive interval between s and t.'
  - 'construct: Put F(x) = x log x - x.'
  - 'derive: The product rule gives F''(x) = log x.'
  - 'conclude: The fundamental theorem gives F(t) - F(s).'
  openmath: (forall (s t) (-> (and (> s 0) (> t 0)) (= (interval_integral s t (lambda (x) (ln x))) (+ (- (- (* t (ln t)) (* s (ln s))) t) s))))
  hard_negative:
    statement: $s,t>0$のとき、$\int_s^t\log x\,dx=t\log t-s\log s$である。
    reason: 部分積分で残る$-t+s$が抜けている。$s=1$、$t=e$では積分は$1$だが、この式は$e$を与える。
  target: |
    ∀ (s t : ℝ), 0 < s → 0 < t → (∫ x in s..t, Real.log x) = t * Real.log t - s * Real.log s - t + s
  proof: |
    by
      intro s t _ _
      exact integral_log
- id: integral_x_mul_derivative
  kind: gap
  level: high
  topic: 部分積分・実用形
  statement: $f$が$a,b$の間の閉区間で微分可能で導関数$f'$が連続なら、$\int_a^bxf'(x)\,dx=bf(b)-af(a)-\int_a^bf(x)\,dx$である。
  statement_en: If f has a continuous derivative f' on the closed interval between a and b, then ∫_a^b x f'(x) dx = b f(b) - a f(a) - ∫_a^b f(x) dx.
  assumptions:
  - $a,b$の間の閉区間の各点で$f$の導関数は$f'$
  - $f'$はその閉区間で連続
  quantifiers:
  - 任意の$f,f':\mathbb{R}\to\mathbb{R}$と実数$a,b$
  conclusion: $\int_a^bxf'(x)\,dx=bf(b)-af(a)-\int_a^bf(x)\,dx$である。
  answer: |
    $a,b$を実数とし、$f:\mathbb{R}\to\mathbb{R}$は$a,b$の間の閉区間の各点で導関数$f'(x)$をもち、$f'$はその閉区間で連続とする。$f$は微分可能なので連続である。$(xf(x))'=f(x)+xf'(x)$の右辺は連続なので、微積分の基本定理により
    $bf(b)-af(a)=\int_a^bf(x)\,dx+\int_a^bxf'(x)\,dx$
    である。$\int_a^bf(x)\,dx$を移項すると等式を得る。
  strategy: Integrate the product rule for x f(x) over the interval.
  sketch:
  - 'setup: f is continuous because it is differentiable.'
  - 'derive: The product rule gives (x f(x))'' = f(x) + x f''(x).'
  - 'apply_theorem: Integrate both sides using the fundamental theorem.'
  - 'conclude: Move ∫_a^b f to the other side.'
  openmath: (forall (f df a b) (-> (and (forall (x) (-> (in x (closed_interval_between a b)) (has_deriv_at (lambda (y) (fn_value f y)) (fn_value df x) x))) (fn_continuous_on (lambda (x) (fn_value df x)) (closed_interval_between a b))) (= (interval_integral a b (lambda (x) (* x (fn_value df x)))) (- (- (* b (fn_value f b)) (* a (fn_value f a))) (interval_integral a b (lambda (x) (fn_value f x)))))))
  hard_negative:
    statement: $\int_a^bxf'(x)\,dx=bf(b)-af(a)+\int_a^bf(x)\,dx$である。
    reason: 符号が逆である。$f=1$、$[0,1]$では左辺は$0$だが、この式は$2$を与える。
  target: |
    ∀ (f f' : ℝ → ℝ) (a b : ℝ), (∀ x ∈ Set.uIcc a b, HasDerivAt f (f' x) x) → ContinuousOn f' (Set.uIcc a b) → (∫ x in a..b, x * f' x) = b * f b - a * f a - ∫ x in a..b, f x
  proof: |
    by
      intro f f' a b hd hc
      have h := intervalIntegral.integral_mul_deriv_eq_deriv_mul (u := fun x => x) (v := f) (u' := fun _ => 1) (v' := f') (a := a) (b := b) (fun x _ => hasDerivAt_id' x) hd intervalIntegrable_const (ContinuousOn.intervalIntegrable hc)
      simpa using h
- id: integral_exp_mul_sin
  kind: textbook
  level: high
  topic: 部分積分・指数関数と三角関数
  statement: $a^2+b^2\neq 0$のとき、$\int_s^te^{ax}\sin bx\,dx=\left[\dfrac{e^{ax}(a\sin bx-b\cos bx)}{a^2+b^2}\right]_s^t$である。
  statement_en: If a^2 + b^2 ≠ 0, then ∫_s^t e^(ax) sin(bx) dx equals F(t) - F(s) with F(x) = e^(ax)(a sin bx - b cos bx)/(a^2 + b^2).
