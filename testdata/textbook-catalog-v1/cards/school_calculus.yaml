  - $\alpha,\beta$は実数
  quantifiers:
  - 任意の実数$\alpha,\beta$
  conclusion: $\int_\alpha^\beta(x-\alpha)(x-\beta)\,dx=-\dfrac{(\beta-\alpha)^3}{6}$である。
  answer: |
    $\alpha,\beta$を実数とする。$x-\beta=(x-\alpha)-(\beta-\alpha)$なので、被積分関数は$(x-\alpha)^2-(\beta-\alpha)(x-\alpha)$である。その原始関数として$F(x)=\dfrac{(x-\alpha)^3}{3}-(\beta-\alpha)\dfrac{(x-\alpha)^2}{2}$がとれる。微積分の基本定理により、積分の値は$F(\beta)-F(\alpha)=\dfrac{(\beta-\alpha)^3}{3}-\dfrac{(\beta-\alpha)^3}{2}=-\dfrac{(\beta-\alpha)^3}{6}$である。
  strategy: Expand around α and evaluate an explicit antiderivative.
  sketch:
  - 'derive: Rewrite x - β as (x-α) - (β-α).'
  - 'construct: Take F(x) = (x-α)^3/3 - (β-α)(x-α)^2/2.'
  - 'apply_theorem: The fundamental theorem gives F(β) - F(α).'
  - 'conclude: Simplify to -(β-α)^3/6.'
  openmath: (forall (p q) (= (interval_integral p q (lambda (x) (* (- x p) (- x q)))) (/ (neg (^ (- q p) 3)) 6)))
  hard_negative:
    statement: $\alpha<\beta$のとき、$\int_\alpha^\beta(x-\alpha)(x-\beta)\,dx=\dfrac{(\beta-\alpha)^3}{6}$である。
    reason: 符号が逆である。$\alpha<x<\beta$で被積分関数は負なので、積分は負になる。$\alpha=0$、$\beta=1$では値は$-\dfrac16$である。
  target: |
    ∀ (α β : ℝ), (∫ x in α..β, (x - α) * (x - β)) = -(β - α) ^ 3 / 6
  proof: |
    by
      intro α β
      have hd : ∀ x ∈ Set.uIcc α β, HasDerivAt (fun x : ℝ => (x - α) ^ 3 / 3 - (β - α) * (x - α) ^ 2 / 2) ((x - α) * (x - β)) x := by
        intro x _
        have h1 : HasDerivAt (fun x : ℝ => x - α) 1 x := (hasDerivAt_id' x).sub_const α
        exact (((h1.fun_pow 3).div_const 3).fun_sub (((h1.fun_pow 2).const_mul (β - α)).div_const 2)).congr_deriv (by norm_num; ring)
      rw [intervalIntegral.integral_eq_sub_of_hasDerivAt hd ((by fun_prop : Continuous fun x : ℝ => (x - α) * (x - β)).intervalIntegrable α β)]
      ring
