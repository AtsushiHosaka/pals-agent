  answer: |
    $f:\mathbb{R}\to\mathbb{R}$は$a,b$の間で積分可能とする。$u=a+b-x$と置換する。$du=-dx$であり、$x=a$のとき$u=b$、$x=b$のとき$u=a$である。よって
    $\int_a^bf(a+b-x)\,dx=\int_b^af(u)(-du)=\int_a^bf(u)\,du$
    である。
  strategy: Substitute u = a + b - x, which swaps the endpoints.
  sketch:
  - 'construct: Put u = a + b - x, so du = -dx.'
  - 'derive: The endpoints a and b are exchanged.'
  - 'conclude: The sign from du cancels the reversal of the limits.'
