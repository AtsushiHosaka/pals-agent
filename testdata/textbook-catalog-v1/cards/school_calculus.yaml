  answer: |
    $a,b,s,t$を実数とし、$a^2+b^2\neq 0$とする。$F(x)=\dfrac{e^{ax}(a\sin bx-b\cos bx)}{a^2+b^2}$とおくと、積の微分法と合成関数の微分法により
    $F'(x)=\dfrac{e^{ax}\left(a(a\sin bx-b\cos bx)+(ab\cos bx+b^2\sin bx)\right)}{a^2+b^2}=\dfrac{e^{ax}(a^2+b^2)\sin bx}{a^2+b^2}=e^{ax}\sin bx$
    である。被積分関数は連続なので、微積分の基本定理により積分の値は$F(t)-F(s)$である。
  strategy: Verify an explicit antiderivative, the one that two integrations by parts produce.
  sketch:
  - 'construct: Put F(x) = e^(ax)(a sin bx - b cos bx)/(a^2 + b^2).'
  - 'derive: Differentiate with the product rule and chain rule.'
  - 'derive: The cosine terms cancel and a^2 + b^2 cancels.'
  - 'conclude: The fundamental theorem gives F(t) - F(s).'
  openmath: (forall (a b s t) (-> (!= (+ (^ a 2) (^ b 2)) 0) (= (interval_integral s t (lambda (x) (* (exp (* a x)) (sin (* b x))))) (/ (- (* (exp (* a t)) (- (* a (sin (* b t))) (* b (cos (* b t))))) (* (exp (* a s)) (- (* a (sin (* b s))) (* b (cos (* b s)))))) (+ (^ a 2) (^ b 2))))))
  hard_negative:
    statement: $a^2+b^2\neq 0$のとき、$\int_s^te^{ax}\sin bx\,dx=\left[\dfrac{e^{ax}(a\sin bx+b\cos bx)}{a^2+b^2}\right]_s^t$である。
    reason: 余弦の項の符号が逆である。$a=0$、$b=1$、$[0,\pi]$では積分は$2$だが、この式は$-2$を与える。
  target: |
    ∀ (a b s t : ℝ), a ^ 2 + b ^ 2 ≠ 0 → (∫ x in s..t, Real.exp (a * x) * Real.sin (b * x)) = (Real.exp (a * t) * (a * Real.sin (b * t) - b * Real.cos (b * t)) - Real.exp (a * s) * (a * Real.sin (b * s) - b * Real.cos (b * s))) / (a ^ 2 + b ^ 2)
  proof: |
    by
      intro a b s t hne
      have hF : ∀ x ∈ Set.uIcc s t, HasDerivAt (fun x => Real.exp (a * x) * (a * Real.sin (b * x) - b * Real.cos (b * x)) / (a ^ 2 + b ^ 2)) (Real.exp (a * x) * Real.sin (b * x)) x := by
        intro x _
        have ha : HasDerivAt (fun y => a * y) a x := ((hasDerivAt_id' x).const_mul a).congr_deriv (by ring)
        have hb : HasDerivAt (fun y => b * y) b x := ((hasDerivAt_id' x).const_mul b).congr_deriv (by ring)
        refine ((ha.exp.fun_mul ((hb.sin.const_mul a).fun_sub (hb.cos.const_mul b))).div_const _).congr_deriv ?_
        field_simp
        ring
      rw [intervalIntegral.integral_eq_sub_of_hasDerivAt hF ((by fun_prop : Continuous fun x : ℝ => Real.exp (a * x) * Real.sin (b * x)).intervalIntegrable s t)]
      ring
- id: area_split_at_crossing
  kind: gap
  level: high
  topic: 定積分・2曲線の間の面積
  statement: $a\leq c\leq b$とし、$f,g$は$[a,b]$で連続とする。$[a,c]$で$g\leq f$、$[c,b]$で$f\leq g$なら、$\int_a^b|f(x)-g(x)|\,dx=\int_a^c(f(x)-g(x))\,dx+\int_c^b(g(x)-f(x))\,dx$である。
  statement_en: If a ≤ c ≤ b, f and g are continuous on [a,b], g ≤ f on [a,c] and f ≤ g on [c,b], then ∫_a^b |f-g| = ∫_a^c (f-g) + ∫_c^b (g-f).
  assumptions:
  - $a\leq c\leq b$
  - $f,g$は$[a,b]$で連続
  - $[a,c]$で$g\leq f$
  - $[c,b]$で$f\leq g$
  quantifiers:
  - 任意の$f,g:\mathbb{R}\to\mathbb{R}$と実数$a,b,c$
  conclusion: $\int_a^b|f(x)-g(x)|\,dx=\int_a^c(f(x)-g(x))\,dx+\int_c^b(g(x)-f(x))\,dx$である。
  answer: |
    $a\leq c\leq b$とし、$f,g:\mathbb{R}\to\mathbb{R}$は$[a,b]$で連続、$[a,c]$で$g\leq f$、$[c,b]$で$f\leq g$とする。$|f-g|$は$[a,b]$で連続なので、
    $\int_a^b|f(x)-g(x)|\,dx=\int_a^c|f(x)-g(x)|\,dx+\int_c^b|f(x)-g(x)|\,dx$
    である。$[a,c]$では$f-g\geq 0$なので$|f-g|=f-g$であり、$[c,b]$では$f-g\leq 0$なので$|f-g|=g-f$である。各区間でこれを代入すると等式を得る。
  strategy: Split the integral at the crossing point and remove the absolute value on each part.
  sketch:
  - 'setup: The function |f - g| is continuous on [a,b].'
  - 'derive: Split the integral at c.'
  - 'derive: On [a,c] the absolute value equals f - g.'
  - 'conclude: On [c,b] the absolute value equals g - f.'
  openmath: (forall (f g a b c) (-> (and (<= a c) (<= c b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (fn_continuous_on (lambda (x) (fn_value g x)) (closed_interval a b)) (forall (x) (-> (in x (closed_interval a c)) (<= (fn_value g x) (fn_value f x)))) (forall (x) (-> (in x (closed_interval c b)) (<= (fn_value f x) (fn_value g x))))) (= (interval_integral a b (lambda (x) (abs (- (fn_value f x) (fn_value g x))))) (+ (interval_integral a c (lambda (x) (- (fn_value f x) (fn_value g x)))) (interval_integral c b (lambda (x) (- (fn_value g x) (fn_value f x))))))))
  hard_negative:
    statement: $\int_a^b|f(x)-g(x)|\,dx=\left|\int_a^b(f(x)-g(x))\,dx\right|$である。
    reason: 上下が入れ替わると打ち消し合う。$f(x)=x$、$g=0$、$[-1,1]$では左辺は$1$、右辺は$0$である。
  target: |
    ∀ (f g : ℝ → ℝ) (a b c : ℝ), a ≤ c → c ≤ b → ContinuousOn f (Set.Icc a b) → ContinuousOn g (Set.Icc a b) → (∀ x ∈ Set.Icc a c, g x ≤ f x) → (∀ x ∈ Set.Icc c b, f x ≤ g x) → (∫ x in a..b, |f x - g x|) = (∫ x in a..c, (f x - g x)) + ∫ x in c..b, (g x - f x)
  proof: |
    by
      intro f g a b c hac hcb hf hg h1 h2
      have habs : ContinuousOn (fun x => |f x - g x|) (Set.Icc a b) := (hf.sub hg).abs
      have i1 : IntervalIntegrable (fun x => |f x - g x|) MeasureTheory.volume a c :=
        ContinuousOn.intervalIntegrable_of_Icc hac (habs.mono (Set.Icc_subset_Icc_right hcb))
      have i2 : IntervalIntegrable (fun x => |f x - g x|) MeasureTheory.volume c b :=
        ContinuousOn.intervalIntegrable_of_Icc hcb (habs.mono (Set.Icc_subset_Icc_left hac))
      rw [← intervalIntegral.integral_add_adjacent_intervals i1 i2]
      congr 1
      · refine intervalIntegral.integral_congr fun x hx => ?_
        rw [Set.uIcc_of_le hac] at hx
        exact abs_of_nonneg (sub_nonneg.mpr (h1 x hx))
      · refine intervalIntegral.integral_congr fun x hx => ?_
        rw [Set.uIcc_of_le hcb] at hx
