  kind: named
  level: high
  topic: 定積分・ウォリスの漸化式
  statement: 自然数$n$について、$\int_0^{\pi/2}\sin^{n+2}x\,dx=\dfrac{n+1}{n+2}\int_0^{\pi/2}\sin^nx\,dx$である（ウォリスの漸化式）。
  statement_en: Wallis recursion. For a natural number n, ∫_0^{π/2} sin^(n+2) x dx = ((n+1)/(n+2)) ∫_0^{π/2} sin^n x dx.
  assumptions:
  - $n$は自然数
  quantifiers:
  - 任意の自然数$n$
  conclusion: $\int_0^{\pi/2}\sin^{n+2}x\,dx=\dfrac{n+1}{n+2}\int_0^{\pi/2}\sin^nx\,dx$である。
  answer: |
    $n$を自然数とし、$I_n=\int_0^{\pi/2}\sin^nx\,dx$とおく。$\sin^{n+2}x=\sin^{n+1}x\cdot\sin x$と見て部分積分すると、$-\cos x$が$\sin x$の原始関数なので
    $I_{n+2}=\left[-\sin^{n+1}x\cos x\right]_0^{\pi/2}+(n+1)\int_0^{\pi/2}\sin^nx\cos^2x\,dx$
    となる。$\cos(\pi/2)=0$かつ$\sin 0=0$なので境界項は$0$である。$\cos^2x=1-\sin^2x$を代入すると$I_{n+2}=(n+1)(I_n-I_{n+2})$となる。これを$I_{n+2}$について解くと$I_{n+2}=\dfrac{n+1}{n+2}I_n$である。
  strategy: Integrate by parts once and replace cos^2 with 1 - sin^2.
  sketch:
  - 'setup: Let I_n be the integral of sin^n over [0, π/2].'
  - 'derive: Integrate by parts with sin x as the factor to integrate.'
  - 'derive: The boundary term vanishes at both endpoints.'
  - 'derive: Use cos^2 x = 1 - sin^2 x to get I_{n+2} = (n+1)(I_n - I_{n+2}).'
  - 'conclude: Solve for I_{n+2}.'
  openmath: (forall (n) (-> (in n N) (= (interval_integral 0 (/ pi 2) (lambda (x) (^ (sin x) (+ n 2)))) (* (/ (+ n 1) (+ n 2)) (interval_integral 0 (/ pi 2) (lambda (x) (^ (sin x) n)))))))
  hard_negative:
    statement: 実数$b$について、$\int_0^b\sin^{n+2}x\,dx=\dfrac{n+1}{n+2}\int_0^b\sin^nx\,dx$である。
    reason: $b=\dfrac{\pi}{2}$でないと境界項が残る。$n=0$、$b=\dfrac{\pi}{4}$では左辺は$\dfrac{\pi}{8}-\dfrac14$、右辺は$\dfrac{\pi}{8}$である。
  target: |
    ∀ (n : ℕ), (∫ x in (0 : ℝ)..(Real.pi / 2), Real.sin x ^ (n + 2)) = ((n : ℝ) + 1) / ((n : ℝ) + 2) * ∫ x in (0 : ℝ)..(Real.pi / 2), Real.sin x ^ n
  proof: |
    by
      intro n
      rw [integral_sin_pow]
      simp
- id: integral_reflection
  kind: gap
  level: high
  topic: 定積分・端点を入れ替える置換
  statement: $f$が$a,b$の間で積分可能なら、$\int_a^bf(a+b-x)\,dx=\int_a^bf(x)\,dx$である。
  statement_en: If f is interval integrable between a and b, then ∫_a^b f(a+b-x) dx = ∫_a^b f(x) dx.
  assumptions:
  - $f$は$a,b$の間で積分可能
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$と実数$a,b$
