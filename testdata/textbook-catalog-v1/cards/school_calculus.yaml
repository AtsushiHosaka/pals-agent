- id: integral_inverse_function_identity
  kind: textbook
  level: high
  topic: 定積分・逆関数の積分
  statement: $f$が$a,b$の間の閉区間$I$で微分可能で導関数$f'$が連続、$g$が$f(I)$で連続、$I$上で$g(f(x))=x$なら、$\int_a^bf(x)\,dx+\int_{f(a)}^{f(b)}g(y)\,dy=bf(b)-af(a)$である。
  statement_en: If f has a continuous derivative f' on the closed interval I between a and b, g is continuous on f(I), and g(f(x)) = x on I, then ∫_a^b f + ∫_{f(a)}^{f(b)} g = b f(b) - a f(a).
  assumptions:
  - $I$は$a,b$の間の閉区間
  - $I$の各点で$f$の導関数は$f'$で、$f'$は$I$で連続
  - $g$は$f(I)$で連続
  - $x\in I$で$g(f(x))=x$
  quantifiers:
  - 任意の$f,f',g:\mathbb{R}\to\mathbb{R}$と実数$a,b$
  conclusion: $\int_a^bf(x)\,dx+\int_{f(a)}^{f(b)}g(y)\,dy=bf(b)-af(a)$である。
  answer: |
    $a,b$を実数、$I$をその間の閉区間とする。$f:\mathbb{R}\to\mathbb{R}$は$I$の各点で導関数$f'(x)$をもち、$f'$は$I$で連続とする。$g:\mathbb{R}\to\mathbb{R}$は$f(I)$で連続で、$x\in I$で$g(f(x))=x$とする。
    $y=f(x)$と置換すると、
    $\int_{f(a)}^{f(b)}g(y)\,dy=\int_a^bg(f(x))f'(x)\,dx=\int_a^bxf'(x)\,dx$
    である。$f$は$I$で連続で、$(xf(x))'=f(x)+xf'(x)$の右辺も$I$で連続なので、微積分の基本定理により
    $bf(b)-af(a)=\int_a^bf(x)\,dx+\int_a^bxf'(x)\,dx$
    である。2つの式から結論を得る。
  strategy: Substitute y = f(x) in the inverse integral, then integrate the product rule.
  sketch:
  - 'derive: The substitution y = f(x) turns the integral of g into ∫ g(f(x)) f''(x) dx.'
  - 'derive: The hypothesis g(f(x)) = x gives ∫ x f''(x) dx.'
  - 'apply_theorem: Integrating the product rule for x f(x) gives b f(b) - a f(a) = ∫ f + ∫ x f''.'
  - 'conclude: Combine the two identities.'
  openmath: (forall (f df g a b) (-> (and (forall (x) (-> (in x (closed_interval_between a b)) (has_deriv_at (lambda (y) (fn_value f y)) (fn_value df x) x))) (fn_continuous_on (lambda (x) (fn_value df x)) (closed_interval_between a b)) (fn_continuous_on (lambda (y) (fn_value g y)) (image (lambda (x) (fn_value f x)) (closed_interval_between a b))) (forall (x) (-> (in x (closed_interval_between a b)) (= (fn_value g (fn_value f x)) x)))) (= (+ (interval_integral a b (lambda (x) (fn_value f x))) (interval_integral (fn_value f a) (fn_value f b) (lambda (y) (fn_value g y)))) (- (* b (fn_value f b)) (* a (fn_value f a))))))
  hard_negative:
    statement: $I$を$a,b$の間の閉区間とする。$f$が$I$で微分可能で導関数が連続、$g$が$f(I)$で連続、$I$上で$g(f(x))=x$なら、$\int_a^bf(x)\,dx+\int_{f(a)}^{f(b)}g(y)\,dy=(b-a)(f(b)-f(a))$である。
    reason: 長方形の面積を間違えている。$f(x)=x$、$[a,b]=[1,2]$では和は$3$だが、この式は$1$を与える。
  target: |
    ∀ (f f' g : ℝ → ℝ) (a b : ℝ), (∀ x ∈ Set.uIcc a b, HasDerivAt f (f' x) x) → ContinuousOn f' (Set.uIcc a b) → ContinuousOn g (f '' Set.uIcc a b) → (∀ x ∈ Set.uIcc a b, g (f x) = x) → (∫ x in a..b, f x) + (∫ y in (f a)..(f b), g y) = b * f b - a * f a
  proof: |
    by
      intro f f' g a b hd hc hg hgf
      have hsub := intervalIntegral.integral_comp_mul_deriv' hd hc hg
      have hcongr : (∫ x in a..b, (g ∘ f) x * f' x) = ∫ x in a..b, x * f' x := by
        refine intervalIntegral.integral_congr fun x hx => ?_
        simp only [Function.comp_apply, hgf x hx]
      have hparts := intervalIntegral.integral_mul_deriv_eq_deriv_mul (u := fun x => x) (v := f) (u' := fun _ => 1) (v' := f') (a := a) (b := b) (fun x _ => hasDerivAt_id' x) hd intervalIntegrable_const (ContinuousOn.intervalIntegrable hc)
      simp only [one_mul] at hparts
      linarith
- id: geometric_sequence_convergence_criterion
  kind: textbook
  level: high
  topic: 数列の極限・等比数列
  statement: 実数$r$について、数列$r^n$が収束することと$-1<r\leq 1$であることは同値である。さらに$|r|<1$なら$r^n\to 0$である。
  statement_en: For real r, the sequence r^n converges if and only if -1 < r ≤ 1, and if |r| < 1 then r^n tends to 0.
  assumptions:
  - $r$は実数
  quantifiers:
  - 任意の実数$r$
  conclusion: $r^n$が収束することと$-1<r\leq 1$は同値であり、$|r|<1$なら極限は$0$である。
  answer: |
    $r$を実数とする。
    $|r|<1$のとき$r^n\to 0$を示す。$r=0$なら明らかである。$r\neq 0$なら$\dfrac{1}{|r|}=1+h$（$h>0$）と書ける。二項定理より$(1+h)^n\geq 1+nh>nh$なので、$|r^n|<\dfrac{1}{nh}\to 0$である。
    $-1<r\leq 1$とする。$r=1$なら$r^n=1$は$1$に収束し、$-1<r<1$なら$0$に収束する。
    逆に$r^n\to L$とし、$-1<r\leq 1$でないと仮定する。このとき$|r|\geq 1$かつ$r\neq 1$である。$r^{n+1}=r\cdot r^n$の両辺の極限をとると$L=rL$となり、$r\neq 1$より$L=0$である。しかし全ての$n$で$|r^n|=|r|^n\geq 1$なので、$|r^n|\to 0$に反する。
  strategy: Use the fixed point equation of the limit to exclude all other r.
  sketch:
  - 'derive: For |r| < 1 bound |r^n| by a multiple of 1/n with the binomial theorem.'
  - 'case_split: For r = 1 the sequence is constant; for -1 < r < 1 it tends to 0.'
  - 'contradiction: Suppose r^n converges to L with |r| ≥ 1 and r ≠ 1.'
  - 'derive: Passing to the limit in r^(n+1) = r r^n gives L = rL, hence L = 0.'
  - 'conclude: This contradicts |r^n| ≥ 1.'
  openmath: (forall (r) (and (<-> (exists (L) (seq_limit_of (lambda (n) (^ r n)) L)) (and (< (neg 1) r) (<= r 1))) (-> (< (abs r) 1) (seq_limit_of (lambda (n) (^ r n)) 0))))
  hard_negative:
    statement: $|r|\leq 1$なら数列$r^n$は収束する。
    reason: $r=-1$では$r^n$は$1$と$-1$を交互にとるので収束しない。
  target: |
    ∀ (r : ℝ), ((∃ L : ℝ, Filter.Tendsto (fun n : ℕ => r ^ n) Filter.atTop (nhds L)) ↔ (-1 < r ∧ r ≤ 1)) ∧ (|r| < 1 → Filter.Tendsto (fun n : ℕ => r ^ n) Filter.atTop (nhds 0))
  proof: |
    by
      intro r
      refine ⟨⟨?_, ?_⟩, tendsto_pow_atTop_nhds_zero_of_abs_lt_one⟩
      · rintro ⟨L, hL⟩
        by_contra hcon
        have habs : 1 ≤ |r| := by
          by_contra hlt
          have := abs_lt.mp (not_le.mp hlt)
          exact hcon ⟨this.1, this.2.le⟩
        have hr1 : r ≠ 1 := by
          rintro rfl
          exact hcon ⟨by norm_num, le_rfl⟩
        have h1 : Filter.Tendsto (fun n : ℕ => r ^ (n + 1)) Filter.atTop (nhds L) := (Filter.tendsto_add_atTop_iff_nat 1).mpr hL
        have h2 : Filter.Tendsto (fun n : ℕ => r ^ (n + 1)) Filter.atTop (nhds (L * r)) := by
          simpa [pow_succ] using hL.mul_const r
        have hLr := tendsto_nhds_unique h1 h2
        have hL0 : L = 0 := by
          have : L * (r - 1) = 0 := by linarith
          exact (mul_eq_zero.mp this).resolve_right (sub_ne_zero.mpr hr1)
        subst hL0
        have h3 : Filter.Tendsto (fun n : ℕ => |r ^ n|) Filter.atTop (nhds 0) := by
          simpa using hL.abs
        have h4 : ∀ n : ℕ, (1 : ℝ) ≤ |r ^ n| := by
          intro n
          rw [abs_pow]
          exact one_le_pow₀ habs
        have := ge_of_tendsto' h3 h4
        linarith
      · rintro ⟨h1, h2⟩
        rcases h2.eq_or_lt with rfl | h2
        · exact ⟨1, by simp⟩
        · exact ⟨0, tendsto_pow_atTop_nhds_zero_of_abs_lt_one (abs_lt.mpr ⟨h1, h2⟩)⟩
- id: rational_sequence_limit
  kind: gap
  level: high
  topic: 数列の極限・分数式
  statement: 実数係数の多項式$P,Q$（$Q\neq 0$）について、次数が等しければ$\dfrac{P(n)}{Q(n)}$は最高次の係数の比に収束し、$P$の次数が$Q$の次数より小さければ$0$に収束する。
  statement_en: For real polynomials P and Q with Q ≠ 0, P(n)/Q(n) tends to the ratio of the leading coefficients if the degrees are equal, and to 0 if deg P < deg Q.
  assumptions:
  - $P,Q$は実数係数の多項式で$Q\neq 0$
  quantifiers:
  - 任意の実数係数多項式$P,Q$
  conclusion: 次数が等しいとき極限は最高次の係数の比であり、$P$の次数が小さいとき極限は$0$である。
  answer: |
    $P,Q$を実数係数の多項式とし、$Q\neq 0$とする。$Q$の根は有限個なので、十分大きい$n$で$Q(n)\neq 0$であり、極限はそのような$n$だけで決まる。$Q$の次数を$d$、最高次の係数を$q$とする。
    分子と分母を$n^d$で割る。$k<d$なら$\dfrac{n^k}{n^d}\to 0$なので、$\dfrac{Q(n)}{n^d}\to q\neq 0$である。
    $P$の次数が$d$で最高次の係数が$p$なら、同様に$\dfrac{P(n)}{n^d}\to p$なので、$\dfrac{P(n)}{Q(n)}\to\dfrac{p}{q}$である。
    $P$の次数が$d$より小さいなら、$P$の各項について$\dfrac{n^k}{n^d}\to 0$なので$\dfrac{P(n)}{n^d}\to 0$であり、$\dfrac{P(n)}{Q(n)}\to 0$である。$P=0$でも同じである。
  strategy: Divide numerator and denominator by the top power of n.
  sketch:
  - 'setup: Q has finitely many roots, so Q(n) ≠ 0 for large n.'
  - 'derive: Dividing by n^d sends Q(n)/n^d to the leading coefficient of Q.'
  - 'case_split: With equal degrees P(n)/n^d tends to the leading coefficient of P.'
  - 'case_split: With smaller degree P(n)/n^d tends to 0.'
  - 'conclude: Take the quotient of the limits.'
  openmath: (forall (u v) (-> (and (real_polynomial u) (real_polynomial v) (!= v 0)) (and (-> (= (polynomial_degree u) (polynomial_degree v)) (seq_limit_of (lambda (n) (/ (polynomial_eval u n) (polynomial_eval v n))) (/ (poly_leading_coeff u) (poly_leading_coeff v)))) (-> (< (polynomial_degree u) (polynomial_degree v)) (seq_limit_of (lambda (n) (/ (polynomial_eval u n) (polynomial_eval v n))) 0)))))
  hard_negative:
    statement: 実数係数の多項式$P,Q$の次数が等しいとき、$\dfrac{P(n)}{Q(n)}$は定数項の比に収束する。
    reason: 最高次の係数の比に収束する。$\dfrac{2n+1}{n+1}\to 2$であり、定数項の比は$1$である。
  target: |
    ∀ (P Q : Polynomial ℝ), Q ≠ 0 → (P.degree = Q.degree → Filter.Tendsto (fun n : ℕ => P.eval (n : ℝ) / Q.eval (n : ℝ)) Filter.atTop (nhds (P.leadingCoeff / Q.leadingCoeff))) ∧ (P.degree < Q.degree → Filter.Tendsto (fun n : ℕ => P.eval (n : ℝ) / Q.eval (n : ℝ)) Filter.atTop (nhds 0))
  proof: |
    by
      intro P Q hQ
      constructor
      · intro h
        exact (Polynomial.div_tendsto_atTop_leadingCoeff_div_of_degree_eq P Q h).comp tendsto_natCast_atTop_atTop
      · intro h
        exact (Polynomial.div_tendsto_atTop_zero_of_degree_lt P Q h).comp tendsto_natCast_atTop_atTop
- id: sqrt_quadratic_sub_x_limit
  kind: gap
  level: high
  topic: 関数の極限・根号の有理化
  statement: 実数$a,b$について、$x\to+\infty$で$\sqrt{x^2+ax+b}-x\to\dfrac{a}{2}$である。十分大きい$x$では根号の中は正である。
  statement_en: For real a and b, √(x^2 + ax + b) - x tends to a/2 as x tends to +∞; the radicand is positive for all large x.
  assumptions:
  - $a,b$は実数
  quantifiers:
  - 任意の実数$a,b$
  conclusion: $x\to+\infty$で$\sqrt{x^2+ax+b}-x\to\dfrac{a}{2}$である。
  answer: |
    $a,b$を実数とする。$x>0$に対し$u=\dfrac1x$、$w=1+au+bu^2$とおく。$x\to+\infty$で$u\to 0$、$w\to 1$なので、十分大きい$x$で$w>0$である。このとき$x^2+ax+b=x^2w>0$であり、$\sqrt{x^2+ax+b}=x\sqrt{w}$である。
    $(\sqrt{w}-1)(\sqrt{w}+1)=w-1=au+bu^2$と$xu=1$より、
    $\sqrt{x^2+ax+b}-x=x(\sqrt{w}-1)=\dfrac{x(au+bu^2)}{\sqrt{w}+1}=\dfrac{a+bu}{\sqrt{w}+1}$
    である。$u\to 0$、$\sqrt{w}\to 1$なので、右辺は$\dfrac{a}{2}$に収束する。
  strategy: Rationalize after factoring x out of the root, in the variable u = 1/x.
  sketch:
  - 'setup: Put u = 1/x and w = 1 + au + bu^2, which is positive for large x.'
  - 'derive: The root equals x√w for large x.'
  - 'derive: Rationalizing gives (a + bu)/(√w + 1).'
  - 'conclude: As u tends to 0 the expression tends to a/2.'
  openmath: (forall (a b) (fn_limit_at_top (lambda (x) (- (root (+ (+ (^ x 2) (* a x)) b) 2) x)) (/ a 2)))
  hard_negative:
    statement: $\sqrt{x^2+ax+b}\sim x$なので、$\sqrt{x^2+ax+b}-x\to 0$である。
    reason: 差の極限は比の極限から決まらない。$a=2$、$b=0$では有理化により極限は$1$である。
  target: |
    ∀ (a b : ℝ), Filter.Tendsto (fun x : ℝ => Real.sqrt (x ^ 2 + a * x + b) - x) Filter.atTop (nhds (a / 2))
  proof: |
    by
      intro a b
      have hu : Filter.Tendsto (fun x : ℝ => x⁻¹) Filter.atTop (nhds 0) := tendsto_inv_atTop_zero
      have hG : ContinuousAt (fun u : ℝ => (a + b * u) / (Real.sqrt (1 + a * u + b * u ^ 2) + 1)) 0 := by
        apply ContinuousAt.div (by fun_prop) (by fun_prop)
        simp
      have hlim := hG.tendsto.comp hu
      have hval : (a + b * 0) / (Real.sqrt (1 + a * 0 + b * 0 ^ 2) + 1) = a / 2 := by
        norm_num
      rw [hval] at hlim
      have hw : Filter.Tendsto (fun x : ℝ => 1 + a * x⁻¹ + b * (x⁻¹) ^ 2) Filter.atTop (nhds (1 + a * 0 + b * 0 ^ 2)) :=
        ((hu.const_mul a).const_add 1).add ((hu.pow 2).const_mul b)
      have hw' : ∀ᶠ x : ℝ in Filter.atTop, 0 < 1 + a * x⁻¹ + b * (x⁻¹) ^ 2 := by
        apply hw.eventually
        exact lt_mem_nhds (by norm_num)
      refine hlim.congr' ?_
      filter_upwards [hw', Filter.eventually_gt_atTop 0] with x hx hx0
      simp only [Function.comp_apply]
      set w := 1 + a * x⁻¹ + b * (x⁻¹) ^ 2 with hwdef
      have hxne : x ≠ 0 := hx0.ne'
      have hs : Real.sqrt w ^ 2 = w := Real.sq_sqrt hx.le
      have hspos : 0 < Real.sqrt w := Real.sqrt_pos.mpr hx
      have heq : x ^ 2 + a * x + b = (x * Real.sqrt w) ^ 2 := by
        rw [mul_pow, hs, hwdef]
        field_simp
      rw [heq, Real.sqrt_sq (by positivity)]
      have hne : Real.sqrt w + 1 ≠ 0 := by positivity
      rw [div_eq_iff hne]
      have : (x * Real.sqrt w - x) * (Real.sqrt w + 1) = x * (Real.sqrt w ^ 2 - 1) := by ring
      rw [this, hs, hwdef]
      field_simp
      ring
- id: pow_div_factorial_limit
  kind: gap
  level: high
  topic: 数列の極限・階乗
  statement: 実数$c$について、$\dfrac{c^n}{n!}\to 0$である。
  statement_en: For every real c, c^n/n! tends to 0.
  assumptions:
  - $c$は実数
  quantifiers:
  - 任意の実数$c$
  conclusion: $n\to\infty$で$\dfrac{c^n}{n!}\to 0$である。
  answer: |
    $c$を実数とする。自然数$N\geq 2|c|$をとり、$N\geq 1$とする。$n>N$なら
    $\left|\dfrac{c^n}{n!}\right|=\dfrac{|c|^N}{N!}\prod_{k=N+1}^{n}\dfrac{|c|}{k}\leq\dfrac{|c|^N}{N!}\left(\dfrac12\right)^{n-N}$
    である。各因子で$k>N\geq 2|c|$より$\dfrac{|c|}{k}\leq\dfrac12$を使った。$\dfrac{|c|^N}{N!}$は$n$によらないので右辺は$0$に収束し、はさみうちにより$\dfrac{c^n}{n!}\to 0$である。
  strategy: After the index passes 2|c|, each new factor is at most 1/2.
  sketch:
  - 'setup: Choose a natural N ≥ 1 with N ≥ 2|c|.'
  - 'derive: For k > N the factor |c|/k is at most 1/2.'
  - 'derive: So |c^n/n!| is bounded by a constant times (1/2)^(n-N).'
  - 'conclude: The squeeze principle gives the limit 0.'
  openmath: (forall (c) (seq_limit_of (lambda (n) (/ (^ c n) (factorial n))) 0))
  hard_negative:
    statement: $\dfrac{n^n}{n!}\to 0$である。
    reason: 底が固定されていない。$\dfrac{n^n}{n!}=\prod_{k=1}^{n}\dfrac{n}{k}\geq n$なので発散する。
  target: |
    ∀ (c : ℝ), Filter.Tendsto (fun n : ℕ => c ^ n / (n.factorial : ℝ)) Filter.atTop (nhds 0)
  proof: |
    by
      intro c
      exact FloorSemiring.tendsto_pow_div_factorial_atTop c
- id: linear_recurrence_limit
  kind: gap
  level: high
  topic: 数列の極限・漸化式
  statement: $|r|<1$で$a_{n+1}=ra_n+s$なら、数列$a_n$は$\dfrac{s}{1-r}$に収束する。
  statement_en: If |r| < 1 and a_{n+1} = r a_n + s for all n, then a_n converges to s/(1-r).
  assumptions:
  - $|r|<1$
  - 全ての$n$で$a_{n+1}=ra_n+s$
  quantifiers:
  - 任意の実数列$a$と実数$r,s$
  conclusion: $a_n\to\dfrac{s}{1-r}$である。
  answer: |
    $a$を実数列、$r,s$を実数とし、$|r|<1$、全ての$n$で$a_{n+1}=ra_n+s$とする。$r<1$なので$L=\dfrac{s}{1-r}$が定まり、$L=rL+s$を満たす。漸化式からこの式を引くと$a_{n+1}-L=r(a_n-L)$である。帰納法により$a_n-L=r^n(a_0-L)$となる。$|r|<1$より$r^n\to 0$なので、$a_n\to L$である。
  strategy: Subtract the fixed point to reduce to a geometric sequence.
  sketch:
  - 'setup: L = s/(1-r) satisfies L = rL + s.'
  - 'derive: Subtracting gives a_{n+1} - L = r(a_n - L).'
  - 'induction: Hence a_n - L = r^n (a_0 - L).'
  - 'conclude: Since r^n tends to 0, a_n tends to L.'
  openmath: (forall (a r s) (-> (and (< (abs r) 1) (forall (n) (-> (in n N) (= (seq_value a (+ n 1)) (+ (* r (seq_value a n)) s))))) (seq_tends_to a (/ s (- 1 r)))))
  hard_negative:
    statement: $r\neq 1$で$a_{n+1}=ra_n+s$なら、$a_n$は$\dfrac{s}{1-r}$に収束する。
    reason: $|r|<1$が必要である。$r=2$、$s=0$、$a_0=1$では$a_n=2^n$は発散する。
  target: |
    ∀ (a : ℕ → ℝ) (r s : ℝ), |r| < 1 → (∀ n, a (n + 1) = r * a n + s) → Filter.Tendsto a Filter.atTop (nhds (s / (1 - r)))
  proof: |
    by
      intro a r s hr hrec
      have hne : 1 - r ≠ 0 := by
        have := (abs_lt.mp hr).2
        linarith
      set L := s / (1 - r) with hL
      have hfix : L = r * L + s := by
        rw [hL]
        field_simp
        ring
      have hclosed : ∀ n, a n = r ^ n * (a 0 - L) + L := by
        intro n
        induction n with
        | zero => simp
        | succ m ih =>
          rw [hrec, ih, pow_succ]
          linarith [hfix, mul_comm (r ^ m) r]
      have hlim := ((tendsto_pow_atTop_nhds_zero_of_abs_lt_one hr).mul_const (a 0 - L)).add_const L
      simp only [zero_mul, zero_add] at hlim
      exact hlim.congr fun n => (hclosed n).symm
- id: contraction_recurrence_limit
  kind: gap
  level: high
  topic: 数列の極限・漸化不等式
  statement: $0\leq r<1$で全ての$n$について$|a_{n+1}-L|\leq r|a_n-L|$なら、$a_n\to L$である。
  statement_en: If 0 ≤ r < 1 and |a_{n+1} - L| ≤ r|a_n - L| for all n, then a_n converges to L.
  assumptions:
  - $0\leq r<1$
  - 全ての$n$で$|a_{n+1}-L|\leq r|a_n-L|$
  quantifiers:
  - 任意の実数列$a$と実数$L,r$
  conclusion: $a_n\to L$である。
  answer: |
    $a$を実数列、$L,r$を実数とし、$0\leq r<1$、全ての$n$で$|a_{n+1}-L|\leq r|a_n-L|$とする。帰納法で$|a_n-L|\leq r^n|a_0-L|$を示す。$n=0$では等号である。$n=m$で成り立つとすると、$r\geq 0$より$|a_{m+1}-L|\leq r|a_m-L|\leq r^{m+1}|a_0-L|$である。$0\leq r<1$より$r^n\to 0$なので、はさみうちにより$|a_n-L|\to 0$であり、$a_n\to L$である。
  strategy: Iterate the inequality and squeeze by a geometric sequence.
  sketch:
  - 'induction: Prove |a_n - L| ≤ r^n |a_0 - L|, using r ≥ 0 in the step.'
  - 'derive: The bound tends to 0 because 0 ≤ r < 1.'
  - 'conclude: The squeeze principle gives a_n tends to L.'
  openmath: (forall (a L r) (-> (and (<= 0 r) (< r 1) (forall (n) (-> (in n N) (<= (abs (- (seq_value a (+ n 1)) L)) (* r (abs (- (seq_value a n) L))))))) (seq_tends_to a L)))
  hard_negative:
    statement: 全ての$n$で$|a_{n+1}-L|<|a_n-L|$なら、$a_n\to L$である。
    reason: 比が$1$に近づく場合は、$L$に収束するとは限らない。$L=0$、$a_n=1+\dfrac{1}{n+1}$では不等式が成り立つが、極限は$1$である。
  target: |
    ∀ (a : ℕ → ℝ) (L r : ℝ), 0 ≤ r → r < 1 → (∀ n, |a (n + 1) - L| ≤ r * |a n - L|) → Filter.Tendsto a Filter.atTop (nhds L)
  proof: |
    by
      intro a L r h0 h1 hc
      have hb : ∀ n, |a n - L| ≤ r ^ n * |a 0 - L| := by
        intro n
        induction n with
        | zero => simp
        | succ m ih =>
          calc |a (m + 1) - L| ≤ r * |a m - L| := hc m
            _ ≤ r * (r ^ m * |a 0 - L|) := mul_le_mul_of_nonneg_left ih h0
            _ = r ^ (m + 1) * |a 0 - L| := by ring
      have hlim : Filter.Tendsto (fun n : ℕ => r ^ n * |a 0 - L|) Filter.atTop (nhds 0) := by
        simpa using (tendsto_pow_atTop_nhds_zero_of_lt_one h0 h1).mul_const |a 0 - L|
      rw [tendsto_iff_norm_sub_tendsto_zero]
      exact squeeze_zero (fun n => norm_nonneg _) (fun n => by simpa [Real.norm_eq_abs] using hb n) hlim
- id: numerator_vanishes_when_denominator_does
  kind: gap
  level: high
  topic: 関数の極限・分母が0に近づく形
  statement: $f$が$a$で連続、$x\neq a$で$g(x)\neq 0$とする。$x\to a$で$g(x)\to 0$かつ$\dfrac{f(x)}{g(x)}$が収束するなら、$f(a)=0$である。
  statement_en: If f is continuous at a, g(x) ≠ 0 for x ≠ a, g(x) → 0 as x → a, and f(x)/g(x) converges as x → a with x ≠ a, then f(a) = 0.
  assumptions:
  - $f$は$a$で連続
  - $x\neq a$で$g(x)\neq 0$
  - $x\to a$で$g(x)\to 0$
  - $x\to a$で$\dfrac{f(x)}{g(x)}\to L$
  quantifiers:
  - 任意の$f,g:\mathbb{R}\to\mathbb{R}$と実数$a,L$
  conclusion: $f(a)=0$である。
  answer: |
    $f,g:\mathbb{R}\to\mathbb{R}$と実数$a,L$について、$f$は$a$で連続、$x\neq a$で$g(x)\neq 0$とする。$x\to a$（$x\neq a$）で$g(x)\to 0$、$\dfrac{f(x)}{g(x)}\to L$とする。$x\neq a$では$f(x)=\dfrac{f(x)}{g(x)}\cdot g(x)$なので、積の極限により$x\to a$で$f(x)\to L\cdot 0=0$である。一方、$f$は$a$で連続なので$f(x)\to f(a)$である。極限の一意性により$f(a)=0$である。
  strategy: Multiply the quotient by g and compare with the limit from continuity.
  sketch:
  - 'derive: For x ≠ a write f(x) as (f(x)/g(x)) g(x).'
  - 'derive: The product of limits gives f(x) tending to 0.'
  - 'derive: Continuity gives f(x) tending to f(a).'
  - 'conclude: Uniqueness of limits gives f(a) = 0.'
  openmath: (forall (f g a L) (-> (and (fn_continuous_at (lambda (x) (fn_value f x)) a) (forall (x) (-> (!= x a) (!= (fn_value g x) 0))) (fn_limit_at (lambda (x) (fn_value g x)) a 0) (fn_limit_at (lambda (x) (/ (fn_value f x) (fn_value g x))) a L)) (= (fn_value f a) 0)))
  hard_negative:
    statement: $\dfrac{f(x)}{g(x)}$が$x\to a$で収束するなら、$f(a)=0$である。
    reason: 分母が$0$に近づく条件が必要である。$f=g=1$では比は$1$に収束するが、$f(a)=1$である。
  target: |
    ∀ (f g : ℝ → ℝ) (a L : ℝ), ContinuousAt f a → (∀ x, x ≠ a → g x ≠ 0) → Filter.Tendsto g (nhdsWithin a {a}ᶜ) (nhds 0) → Filter.Tendsto (fun x => f x / g x) (nhdsWithin a {a}ᶜ) (nhds L) → f a = 0
  proof: |
    by
      intro f g a L hf hg hg0 hq
      have h1 : Filter.Tendsto (fun x => f x / g x * g x) (nhdsWithin a {a}ᶜ) (nhds (L * 0)) := hq.mul hg0
      have h2 : Filter.Tendsto f (nhdsWithin a {a}ᶜ) (nhds 0) := by
        rw [mul_zero] at h1
        refine h1.congr' ?_
        filter_upwards [self_mem_nhdsWithin] with x hx
        exact div_mul_cancel₀ _ (hg x hx)
      have h3 : Filter.Tendsto f (nhdsWithin a {a}ᶜ) (nhds (f a)) := hf.tendsto.mono_left nhdsWithin_le_nhds
      exact tendsto_nhds_unique h3 h2
- id: one_sub_cos_limit
  kind: gap
  level: high
  topic: 関数の極限・三角関数
  statement: 実数$a$について、$x\to 0$で$\dfrac{1-\cos ax}{x^2}\to\dfrac{a^2}{2}$である。
  statement_en: For real a, (1 - cos(ax))/x^2 tends to a^2/2 as x tends to 0 with x ≠ 0.
  assumptions:
  - $a$は実数
  quantifiers:
  - 任意の実数$a$
  conclusion: $x\to 0$（$x\neq 0$）で$\dfrac{1-\cos ax}{x^2}\to\dfrac{a^2}{2}$である。
  answer: |
    $a$を実数とする。$h(x)=\sin\dfrac{ax}{2}$は$h(0)=0$を満たし、$0$における微分係数は$\dfrac{a}{2}\cos 0=\dfrac{a}{2}$である。微分係数の定義により、$x\to 0$で$\dfrac{h(x)}{x}\to\dfrac{a}{2}$である。
    倍角の公式より$1-\cos ax=2\sin^2\dfrac{ax}{2}$なので、$x\neq 0$で
    $\dfrac{1-\cos ax}{x^2}=2\left(\dfrac{h(x)}{x}\right)^2$
    である。右辺は$2\left(\dfrac{a}{2}\right)^2=\dfrac{a^2}{2}$に収束する。
  strategy: Use the half angle identity and the derivative of sin(ax/2) at 0.
  sketch:
  - 'derive: The derivative of sin(ax/2) at 0 is a/2, so sin(ax/2)/x tends to a/2.'
  - 'derive: The double angle formula gives 1 - cos(ax) = 2 sin^2(ax/2).'
  - 'derive: Hence the quotient equals 2 (sin(ax/2)/x)^2 for x ≠ 0.'
  - 'conclude: Pass to the limit to get a^2/2.'
  openmath: (forall (a) (fn_limit_at (lambda (x) (/ (- 1 (cos (* a x))) (^ x 2))) 0 (/ (^ a 2) 2)))
  hard_negative:
    statement: $x\to 0$で$\dfrac{1-\cos ax}{x^2}\to a^2$である。
    reason: 係数$\dfrac12$が抜けている。$a=1$で極限は$\dfrac12$である。
  target: |
    ∀ (a : ℝ), Filter.Tendsto (fun x : ℝ => (1 - Real.cos (a * x)) / x ^ 2) (nhdsWithin 0 {0}ᶜ) (nhds (a ^ 2 / 2))
  proof: |
    by
      intro a
      have hd : HasDerivAt (fun x : ℝ => Real.sin (a / 2 * x)) (a / 2) 0 := by
        have h : HasDerivAt (fun y : ℝ => a / 2 * y) (a / 2) 0 := ((hasDerivAt_id' (0 : ℝ)).const_mul (a / 2)).congr_deriv (by ring)
        exact h.sin.congr_deriv (by simp)
      have hs := hasDerivAt_iff_tendsto_slope.mp hd
      have hlim : Filter.Tendsto (fun x : ℝ => 2 * (slope (fun x : ℝ => Real.sin (a / 2 * x)) 0 x) ^ 2) (nhdsWithin 0 {0}ᶜ) (nhds (2 * (a / 2) ^ 2)) := (hs.pow 2).const_mul 2
      rw [show 2 * (a / 2) ^ 2 = a ^ 2 / 2 by ring] at hlim
      refine hlim.congr' ?_
      filter_upwards [self_mem_nhdsWithin] with x hx
      have hx0 : x ≠ 0 := hx
      have hcos : Real.cos (a * x) = 1 - 2 * Real.sin (a / 2 * x) ^ 2 := by
        have := Real.cos_two_mul (a / 2 * x)
        rw [show 2 * (a / 2 * x) = a * x by ring] at this
        rw [this]
        linarith [Real.sin_sq_add_cos_sq (a / 2 * x)]
      rw [hcos, slope_def_field]
      simp only [mul_zero, Real.sin_zero, sub_zero]
      field_simp
      ring
- id: exp_log_difference_quotient_limit
  kind: gap
  level: high
  topic: 関数の極限・指数と対数
  statement: 実数$c$について、$x\to 0$で$\dfrac{e^{cx}-1}{x}\to c$かつ$\dfrac{\log(1+cx)}{x}\to c$である。
  statement_en: For real c, as x tends to 0 with x ≠ 0, (e^(cx) - 1)/x tends to c and log(1 + cx)/x tends to c.
  assumptions:
  - $c$は実数
  quantifiers:
  - 任意の実数$c$
  conclusion: $x\to 0$（$x\neq 0$）で$\dfrac{e^{cx}-1}{x}\to c$かつ$\dfrac{\log(1+cx)}{x}\to c$である。
  answer: |
    $c$を実数とする。$p(x)=e^{cx}$は$p(0)=1$を満たし、$0$における微分係数は$c$である。$q(x)=\log(1+cx)$は$0$の近くで$1+cx>0$なので定義され、$q(0)=0$であり、$0$における微分係数は$\dfrac{c}{1+0}=c$である。
    微分係数の定義により、$x\to 0$で$\dfrac{p(x)-p(0)}{x}=\dfrac{e^{cx}-1}{x}\to c$、$\dfrac{q(x)-q(0)}{x}=\dfrac{\log(1+cx)}{x}\to c$である。
  strategy: Recognize both quotients as difference quotients at 0.
  sketch:
  - 'derive: e^(cx) has value 1 and derivative c at 0.'
  - 'derive: log(1 + cx) has value 0 and derivative c at 0.'
  - 'conclude: The definition of the derivative gives both limits.'
  openmath: (forall (c) (and (fn_limit_at (lambda (x) (/ (- (exp (* c x)) 1) x)) 0 c) (fn_limit_at (lambda (x) (/ (ln (+ 1 (* c x))) x)) 0 c)))
  hard_negative:
    statement: $x\to 0$で$\dfrac{e^{cx}-1}{x}\to 1$である。
    reason: $c=1$の場合に限る。$c=2$では極限は$2$である。
  target: |
    ∀ (c : ℝ), Filter.Tendsto (fun x : ℝ => (Real.exp (c * x) - 1) / x) (nhdsWithin 0 {0}ᶜ) (nhds c) ∧ Filter.Tendsto (fun x : ℝ => Real.log (1 + c * x) / x) (nhdsWithin 0 {0}ᶜ) (nhds c)
  proof: |
    by
      intro c
      have h : HasDerivAt (fun y : ℝ => c * y) c 0 := ((hasDerivAt_id' (0 : ℝ)).const_mul c).congr_deriv (by ring)
      constructor
      · have hd : HasDerivAt (fun x : ℝ => Real.exp (c * x)) c 0 := h.exp.congr_deriv (by simp)
        refine (hasDerivAt_iff_tendsto_slope.mp hd).congr' ?_
        filter_upwards with x
        simp [slope_def_field]
      · have h1 : HasDerivAt (fun y : ℝ => 1 + c * y) c 0 := h.const_add 1
        have hd : HasDerivAt (fun x : ℝ => Real.log (1 + c * x)) c 0 := (h1.log (by simp)).congr_deriv (by simp)
        refine (hasDerivAt_iff_tendsto_slope.mp hd).congr' ?_
        filter_upwards with x
        simp [slope_def_field]
- id: telescoping_sum_limit
  kind: gap
  level: high
  topic: 無限級数・差の形の和
  statement: 実数列$b_k$が$L$に収束するなら、$\sum_{k=0}^{n-1}(b_k-b_{k+1})\to b_0-L$である。
  statement_en: If a real sequence b converges to L, then the partial sums ∑_{k<n} (b_k - b_{k+1}) tend to b_0 - L.
  assumptions:
  - $b_k\to L$
  quantifiers:
  - 任意の実数列$b$と実数$L$
  conclusion: $n\to\infty$で$\sum_{k=0}^{n-1}(b_k-b_{k+1})\to b_0-L$である。
  answer: |
    $b$を実数列、$L$を実数とし、$b_k\to L$とする。和の途中の項は打ち消し合うので、$\sum_{k=0}^{n-1}(b_k-b_{k+1})=b_0-b_n$である。$b_n\to L$なので、これは$b_0-L$に収束する。
  strategy: Collapse the telescoping sum and pass to the limit.
  sketch:
  - 'derive: The sum collapses to b_0 - b_n.'
  - 'conclude: Since b_n tends to L, the limit is b_0 - L.'
  openmath: (forall (b L) (-> (seq_tends_to b L) (seq_limit_of (lambda (n) (sum (natural_range n) (lambda (k) (- (seq_value b k) (seq_value b (+ k 1)))))) (- (seq_value b 0) L))))
  hard_negative:
    statement: 実数列$b_k$が何であっても、$\sum_{k=0}^{n-1}(b_k-b_{k+1})$は収束する。
    reason: $b_k$の収束が必要である。$b_k=k$では和は$-n$となり発散する。
  target: |
    ∀ (b : ℕ → ℝ) (L : ℝ), Filter.Tendsto b Filter.atTop (nhds L) → Filter.Tendsto (fun n : ℕ => ∑ k ∈ Finset.range n, (b k - b (k + 1))) Filter.atTop (nhds (b 0 - L))
  proof: |
    by
      intro b L h
      have := h.const_sub (b 0)
      refine this.congr fun n => ?_
      rw [Finset.sum_range_sub']
- id: geometric_series_convergence_criterion
  kind: textbook
  level: high
  topic: 無限等比級数・収束条件
  statement: $a\neq 0$のとき、無限等比級数$\sum_{n=0}^{\infty}ar^n$が絶対収束する（実数項の級数として無条件に和をもつ）ことと$|r|<1$であることは同値である。
  statement_en: For a ≠ 0, the series ∑ a r^n is summable (absolutely convergent) if and only if |r| < 1.
  assumptions:
  - $a\neq 0$
  quantifiers:
  - 任意の実数$a,r$
  conclusion: $\sum_{n=0}^{\infty}ar^n$が絶対収束することと$|r|<1$は同値である。
  answer: |
    $a\neq 0$、$r$を実数とする。
    $|r|<1$とする。$\sum_{k=0}^{n-1}|ar^k|=|a|\dfrac{1-|r|^n}{1-|r|}\leq\dfrac{|a|}{1-|r|}$なので、級数は絶対収束する。
    逆に級数が収束するとする。収束する級数の項は$0$に収束するので、$ar^n\to 0$である。$a\neq 0$より$|r|^n\to 0$である。$|r|\geq 1$なら全ての$n$で$|r|^n\geq 1$となり、これに反する。よって$|r|<1$である。
  strategy: Bound the partial sums for one direction and use that terms tend to 0 for the other.
  sketch:
  - 'derive: For |r| < 1 the partial sums of |a r^n| are bounded by |a|/(1-|r|).'
  - 'derive: Conversely, the terms a r^n of a convergent series tend to 0.'
  - 'derive: Dividing by a ≠ 0 gives |r|^n tending to 0.'
  - 'conclude: This is impossible when |r| ≥ 1.'
  openmath: (forall (a r) (-> (!= a 0) (<-> (real_series_summable (lambda (n) (* a (^ r n)))) (< (abs r) 1))))
  hard_negative:
    statement: 無限等比級数$\sum_{n=0}^{\infty}ar^n$が収束するなら、$|r|<1$である。
    reason: $a=0$を除く必要がある。$a=0$なら全ての項が$0$なので、$r=2$でも級数は収束する。
  target: |
    ∀ (a r : ℝ), a ≠ 0 → (Summable (fun n : ℕ => a * r ^ n) ↔ |r| < 1)
  proof: |
    by
      intro a r ha
      rw [summable_mul_left_iff ha, summable_geometric_iff_norm_lt_one, Real.norm_eq_abs]
- id: geometric_series_tail
  kind: gap
  level: high
  topic: 無限等比級数・途中から始まる和
  statement: $|r|<1$のとき、自然数$m$について$\sum_{n=0}^{\infty}ar^{m+n}=\dfrac{ar^m}{1-r}$である。
  statement_en: If |r| < 1 and m is a natural number, then the series ∑_{n≥0} a r^(m+n) sums to a r^m/(1-r).
  assumptions:
  - $|r|<1$
  - $m$は自然数
  quantifiers:
  - 任意の実数$a,r$と自然数$m$
  conclusion: $\sum_{n=0}^{\infty}ar^{m+n}=\dfrac{ar^m}{1-r}$である。
  answer: |
    $a,r$を実数、$m$を自然数とし、$|r|<1$とする。$ar^{m+n}=ar^m\cdot r^n$である。$\sum_{n=0}^{k-1}r^n=\dfrac{1-r^k}{1-r}$と$r^k\to 0$から、無限等比級数$\sum_{n=0}^{\infty}r^n$は$\dfrac{1}{1-r}$に収束する。$|r|$についても同じ計算ができるので、この収束は絶対収束である。定数$ar^m$を掛けると、与えられた級数は$\dfrac{ar^m}{1-r}$に収束する。
  strategy: Factor out the first term and use the geometric series with ratio r.
  sketch:
  - 'derive: Factor a r^(m+n) as a r^m times r^n.'
  - 'apply_theorem: The geometric series of r^n sums to 1/(1-r).'
  - 'conclude: Multiply by the constant a r^m.'
  openmath: (forall (a r m) (-> (and (in m N) (< (abs r) 1)) (has_sum_fn (lambda (n) (* a (^ r (+ m n)))) (/ (* a (^ r m)) (- 1 r)))))
  hard_negative:
    statement: $|r|<1$のとき、$\sum_{n=0}^{\infty}ar^{m+n}=\dfrac{a}{1-r}$である。
    reason: 初項は$ar^m$である。$a=1$、$r=\dfrac12$、$m=1$では和は$1$だが、この式は$2$を与える。
  target: |
    ∀ (a r : ℝ) (m : ℕ), |r| < 1 → HasSum (fun n : ℕ => a * r ^ (m + n)) (a * r ^ m / (1 - r))
  proof: |
    by
      intro a r m hr
      have h := (hasSum_geometric_of_abs_lt_one hr).mul_left (a * r ^ m)
      have heq : (fun n : ℕ => a * r ^ (m + n)) = fun n : ℕ => a * r ^ m * r ^ n := by
        ext n
        rw [pow_add]
        ring
      rw [heq, div_eq_mul_inv]
      exact h
- id: arithmetic_geometric_series
  kind: textbook
  level: high
  topic: 無限級数・等差と等比の積
  statement: $|r|<1$のとき、$\sum_{n=0}^{\infty}nr^n=\dfrac{r}{(1-r)^2}$である。
  statement_en: If |r| < 1, then the series ∑_{n≥0} n r^n sums to r/(1-r)^2.
  assumptions:
  - $|r|<1$
  quantifiers:
  - 任意の実数$r$
  conclusion: $\sum_{n=0}^{\infty}nr^n=\dfrac{r}{(1-r)^2}$である。
  answer: |
    $r$を実数とし、$|r|<1$とする。$S_N=\sum_{n=0}^{N}nr^n$とおく。$S_N-rS_N$を項ごとに計算すると
    $(1-r)S_N=\sum_{n=1}^{N}r^n-Nr^{N+1}=\dfrac{r(1-r^N)}{1-r}-Nr^{N+1}$
    である。$|r|<1$より$r^N\to 0$である。また$|r|=\dfrac{1}{1+h}$（$h>0$）と書くと、$r\neq 0$のとき$(1+h)^{N+1}\geq\dfrac{N(N+1)}{2}h^2$なので$N|r|^{N+1}\to 0$である（$r=0$なら明らかである）。したがって$(1-r)S_N\to\dfrac{r}{1-r}$であり、$S_N\to\dfrac{r}{(1-r)^2}$である。
    さらに$|r|$についても同じ計算ができるので、級数は絶対収束する。
  strategy: Compute S_N - r S_N and control N r^(N+1).
  sketch:
  - 'setup: Let S_N be the partial sum of n r^n.'
  - 'derive: S_N - r S_N is a geometric sum minus N r^(N+1).'
  - 'derive: N |r|^(N+1) tends to 0 by the binomial bound.'
  - 'derive: Hence (1-r) S_N tends to r/(1-r).'
  - 'conclude: Divide by 1-r; the same computation with |r| gives absolute convergence.'
  openmath: (forall (r) (-> (< (abs r) 1) (has_sum_fn (lambda (n) (* n (^ r n))) (/ r (^ (- 1 r) 2)))))
  hard_negative:
    statement: $|r|<1$のとき、$\sum_{n=0}^{\infty}nr^n=\dfrac{1}{(1-r)^2}$である。
    reason: 分子の$r$が抜けている。$r=\dfrac12$では和は$2$だが、この式は$4$を与える。
  target: |
    ∀ (r : ℝ), |r| < 1 → HasSum (fun n : ℕ => (n : ℝ) * r ^ n) (r / (1 - r) ^ 2)
  proof: |
    by
      intro r hr
      exact hasSum_coe_mul_geometric_of_norm_lt_one (by simpa using hr)
- id: integral_power_product_general
  kind: gap
  level: high
  topic: 定積分・端点の冪の積
  statement: 実数$\alpha,\beta$と$0$以上の整数$m,n$について、$\displaystyle\int_\alpha^\beta(x-\alpha)^m(x-\beta)^n\,dx=\dfrac{(-1)^n\,m!\,n!}{(m+n+1)!}(\beta-\alpha)^{m+n+1}$である。
  statement_en: For reals α, β and nonnegative integers m, n, the integral of (x-α)^m (x-β)^n from α to β equals (-1)^n m! n! / (m+n+1)! times (β-α)^(m+n+1).
  assumptions:
  - $\alpha,\beta$は実数
  - $m,n$は$0$以上の整数
  quantifiers:
  - 任意の実数$\alpha,\beta$
  - 任意の$0$以上の整数$m,n$
  conclusion: $\displaystyle\int_\alpha^\beta(x-\alpha)^m(x-\beta)^n\,dx=\dfrac{(-1)^n\,m!\,n!}{(m+n+1)!}(\beta-\alpha)^{m+n+1}$である。
  answer: |
    $\alpha,\beta$を実数、$m,n$を$0$以上の整数とし、$I(m,n)=\displaystyle\int_\alpha^\beta(x-\alpha)^m(x-\beta)^n\,dx$とおく。$I(m,n)=\dfrac{(-1)^n\,m!\,n!}{(m+n+1)!}(\beta-\alpha)^{m+n+1}$を、$n$についての帰納法で、すべての$m$に対して示す。
    $n=0$のとき、$I(m,0)=\left[\dfrac{(x-\alpha)^{m+1}}{m+1}\right]_\alpha^\beta=\dfrac{(\beta-\alpha)^{m+1}}{m+1}$であり、右辺の$\dfrac{m!\,0!}{(m+1)!}=\dfrac{1}{m+1}$と一致する。
    $n$で成り立つとする。部分積分により
    $I(m,n+1)=\left[(x-\beta)^{n+1}\dfrac{(x-\alpha)^{m+1}}{m+1}\right]_\alpha^\beta-\dfrac{n+1}{m+1}\displaystyle\int_\alpha^\beta(x-\alpha)^{m+1}(x-\beta)^n\,dx$である。
    境界項は、$x=\beta$では$(x-\beta)^{n+1}=0$、$x=\alpha$では$(x-\alpha)^{m+1}=0$なので$0$である。よって$I(m,n+1)=-\dfrac{n+1}{m+1}I(m+1,n)$となる。
    帰納法の仮定を$m+1$に使うと、$I(m,n+1)=-\dfrac{n+1}{m+1}\cdot\dfrac{(-1)^n(m+1)!\,n!}{(m+n+2)!}(\beta-\alpha)^{m+n+2}=\dfrac{(-1)^{n+1}m!\,(n+1)!}{(m+n+2)!}(\beta-\alpha)^{m+n+2}$である。これは$n+1$の場合の主張である。
  strategy: Induct on n for all m, integrating by parts so that the boundary terms vanish.
  sketch:
  - 'setup: Fix reals α, β and write I(m,n) for the integral.'
  - 'base: For n = 0, integrate (x-α)^m directly.'
  - 'induct: Integration by parts gives I(m,n+1) = -(n+1)/(m+1) I(m+1,n), since the boundary terms vanish.'
  - 'conclude: Substitute the induction hypothesis at m+1.'
  openmath: (forall (p q m n) (-> (and (in m N) (in n N)) (= (interval_integral p q (lambda (x) (* (^ (- x p) m) (^ (- x q) n)))) (* (/ (* (^ (neg 1) n) (* (factorial m) (factorial n))) (factorial (+ (+ m n) 1))) (^ (- q p) (+ (+ m n) 1))))))
  hard_negative:
    statement: 実数$\alpha,\beta$と$0$以上の整数$m,n$について、$\displaystyle\int_\alpha^\beta(x-\alpha)^m(x-\beta)^n\,dx=\dfrac{m!\,n!}{(m+n+1)!}(\beta-\alpha)^{m+n+1}$である。
    reason: $m=n=1$、$\alpha=0$、$\beta=1$のとき左辺は$\displaystyle\int_0^1x(x-1)\,dx=-\dfrac{1}{6}$であり、右辺は$\dfrac{1}{6}$である。符号$(-1)^n$が要る。
  target: |
    ∀ (α β : ℝ) (m n : ℕ), (∫ x in α..β, (x - α) ^ m * (x - β) ^ n) = (-1 : ℝ) ^ n * ((m.factorial * n.factorial : ℕ) : ℝ) / ((m + n + 1).factorial : ℝ) * (β - α) ^ (m + n + 1)
  proof: |
    by
      intro α β m n
      induction n generalizing m with
      | zero =>
        have h := intervalIntegral.integral_comp_sub_right (a := α) (b := β) (fun y : ℝ => y ^ m) α
        simp only [pow_zero, mul_one]
        rw [h, integral_pow]
        have hf : ((m + 0 + 1).factorial : ℝ) = (m + 1 : ℝ) * (m.factorial : ℝ) := by
          simp [Nat.factorial_succ]
        have hm : (m.factorial : ℝ) ≠ 0 := by positivity
        have hm1 : (m + 1 : ℝ) ≠ 0 := by positivity
        simp only [sub_self, Nat.factorial_zero, mul_one, one_mul, add_zero]
        rw [show ((m + 1).factorial : ℝ) = (m + 1 : ℝ) * (m.factorial : ℝ) by simp [Nat.factorial_succ]]
        rw [zero_pow (by omega)]
        field_simp
        ring
      | succ n ih =>
        have hm1 : (m + 1 : ℝ) ≠ 0 := by positivity
        have key := intervalIntegral.integral_mul_deriv_eq_deriv_mul
          (a := α) (b := β)
          (u := fun x : ℝ => (x - β) ^ (n + 1))
          (v := fun x : ℝ => (x - α) ^ (m + 1) / (m + 1 : ℝ))
          (u' := fun x : ℝ => ((n + 1 : ℕ) : ℝ) * (x - β) ^ n)
          (v' := fun x : ℝ => (x - α) ^ m)
          (fun x _ => by
            have := ((hasDerivAt_id' x).sub_const β).fun_pow (n + 1)
            simpa using this)
          (fun x _ => by
            have := (((hasDerivAt_id' x).sub_const α).fun_pow (m + 1)).div_const (m + 1 : ℝ)
            convert this using 1
            simp only [Nat.add_sub_cancel, Nat.cast_add, Nat.cast_one, mul_one]
            field_simp)
          (by apply Continuous.intervalIntegrable; fun_prop)
          (by apply Continuous.intervalIntegrable; fun_prop)
        have e1 : (∫ x in α..β, (x - α) ^ m * (x - β) ^ (n + 1)) = ∫ x in α..β, (x - β) ^ (n + 1) * (x - α) ^ m := by
          congr 1; ext x; ring
        have e2 : (∫ x in α..β, ((n + 1 : ℕ) : ℝ) * (x - β) ^ n * ((x - α) ^ (m + 1) / (m + 1 : ℝ))) = ((n + 1 : ℕ) : ℝ) / (m + 1 : ℝ) * ∫ x in α..β, (x - α) ^ (m + 1) * (x - β) ^ n := by
          rw [← intervalIntegral.integral_const_mul]
          congr 1; ext x; field_simp
        rw [e1, key, e2, ih (m + 1)]
        have hf : ((m + 1 + n + 1).factorial : ℝ) = ((m + (n + 1) + 1).factorial : ℝ) := by
          congr 2; omega
        have hp : (β - α) ^ (m + 1 + n + 1) = (β - α) ^ (m + (n + 1) + 1) := by
          congr 1; omega
        rw [hf, hp]
        have hF : ((m + (n + 1) + 1).factorial : ℝ) ≠ 0 := by positivity
        simp only [sub_self, zero_div, mul_zero, ne_eq, zero_pow, zero_mul, sub_zero, Nat.factorial_succ, Nat.cast_mul, Nat.cast_add, Nat.cast_one, pow_succ]
        field_simp
        ring
