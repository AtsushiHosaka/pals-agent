  statement_en: For f(x) = ax^2 + bx + c with tangent lines L_p and L_q at p and q, and m = (p+q)/2, L_p(m) = L_q(m) and ∫_p^m (f - L_p) + ∫_m^q (f - L_q) = a(q-p)^3/12.
