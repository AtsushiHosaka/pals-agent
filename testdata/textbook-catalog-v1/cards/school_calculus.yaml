  strategy: Complete the square in the derivative and test at its vertex.
  sketch:
  - 'derive: Multiply f'' by 3a and complete the square.'
  - 'derive: If b^2 ≤ 3ac the derivative is nonnegative, so f is nondecreasing.'
  - 'derive: If f is nondecreasing its derivative is nonnegative everywhere.'
  - 'conclude: Evaluate at x = -b/(3a) to obtain b^2 ≤ 3ac.'
  openmath: (forall (a b c d) (-> (> a 0) (<-> (fn_monotone (lambda (x) (+ (+ (+ (* a (^ x 3)) (* b (^ x 2))) (* c x)) d))) (<= (^ b 2) (* (* 3 a) c)))))
  hard_negative:
    statement: $a\neq 0$なら、$b^2\leq 3ac$のとき$ax^3+bx^2+cx+d$は単調非減少である。
    reason: $a<0$が反例である。$-x^3$は$b^2=3ac=0$を満たすが、単調減少である。
  target: |
    ∀ (a b c d : ℝ), 0 < a → (Monotone (fun x : ℝ => a * x ^ 3 + b * x ^ 2 + c * x + d) ↔ b ^ 2 ≤ 3 * a * c)
  proof: |
    by
      intro a b c d ha
      have hd : ∀ x : ℝ, HasDerivAt (fun y : ℝ => a * y ^ 3 + b * y ^ 2 + c * y + d) (3 * a * x ^ 2 + 2 * b * x + c) x := by
        intro x
        have h3 := (hasDerivAt_pow 3 x).const_mul a
        have h2 := (hasDerivAt_pow 2 x).const_mul b
        have h1 := (hasDerivAt_id' x).const_mul c
        exact (((h3.fun_add h2).fun_add h1).add_const d).congr_deriv (by norm_num; ring)
      constructor
      · intro hm
        have h0 : 0 ≤ deriv (fun y : ℝ => a * y ^ 3 + b * y ^ 2 + c * y + d) (-b / (3 * a)) := hm.deriv_nonneg
        rw [(hd _).deriv] at h0
        have h3a : 3 * a ≠ 0 := by positivity
        have : 3 * a * (-b / (3 * a)) ^ 2 + 2 * b * (-b / (3 * a)) + c = (3 * a * c - b ^ 2) / (3 * a) := by
          field_simp
          ring
        rw [this] at h0
        have := (div_nonneg_iff.mp h0)
        rcases this with h | h
        · linarith [h.1]
        · linarith [h.2]
      · intro h
        apply monotone_of_deriv_nonneg (fun x => (hd x).differentiableAt)
        intro x
        rw [(hd x).deriv]
        have : 0 ≤ a * (3 * a * x ^ 2 + 2 * b * x + c) := by nlinarith [sq_nonneg (3 * a * x + b)]
        exact nonneg_of_mul_nonneg_right this ha
- id: cubic_local_extremum_iff_discriminant
  kind: textbook
  level: high
  topic: 微分・極値の判定
  statement: $a\neq 0$のとき、$f(x)=ax^3+bx^2+cx+d$が極値をもつことと、$b^2-3ac>0$であることは同値である。
  statement_en: For a ≠ 0, the cubic ax^3 + bx^2 + cx + d has a local extremum at some point if and only if b^2 - 3ac > 0.
  assumptions:
  - $a\neq 0$
  quantifiers:
  - 任意の実数$a,b,c,d$
  conclusion: $f$が極小または極大となる点をもつことと$b^2-3ac>0$は同値である。
  answer: |
    $a\neq 0$、$b,c,d$を実数とし、$f(x)=ax^3+bx^2+cx+d$とする。$f'(x)=3ax^2+2bx+c$、$f''(x)=6ax+2b$であり、$3af'(x)=(3ax+b)^2-(b^2-3ac)$が成り立つ。
    $f$が$x$で極値をとるとする。$f'(x)=0$なので$(3ax+b)^2=b^2-3ac$であり、$b^2-3ac\geq 0$である。$b^2-3ac=0$と仮定すると$3ax+b=0$となるので、$b=-3ax$、$c=3ax^2$である。これを代入すると全ての$y$で$f(y)-f(x)=a(y-x)^3$が成り立つ。$y-x$の符号によって右辺の符号が変わるので、$x$のどの近くでも$f(y)-f(x)$は正の値と負の値の両方をとる。これは極値であることに反する。よって$b^2-3ac>0$である。
    逆に$D=b^2-3ac>0$とし、$s=\sqrt{D}>0$、$x_0=\dfrac{-b+s}{3a}$とおく。$3ax_0+b=s$なので$3af'(x_0)=s^2-D=0$となり、$f'(x_0)=0$である。また$f''(x_0)=2(3ax_0+b)=2s>0$である。第2次導関数による判定法により、$f$は$x_0$で極小となる。
  strategy: Use the completed square of f' for necessity and the second derivative test for sufficiency.
  sketch:
  - 'derive: Multiply f'' by 3a and complete the square.'
  - 'derive: An extremum at x gives f''(x) = 0, hence b^2 - 3ac ≥ 0.'
  - 'contradiction: If b^2 - 3ac = 0 then f(y) - f(x) = a(y-x)^3 changes sign at x.'
  - 'construct: If D > 0 take x_0 = (-b + √D)/(3a), a zero of f''.'
  - 'apply_theorem: Since f''''(x_0) = 2√D > 0, x_0 is a local minimum.'
  openmath: (forall (a b c d) (-> (!= a 0) (<-> (exists (x) (or (local_min_at (lambda (y) (+ (+ (+ (* a (^ y 3)) (* b (^ y 2))) (* c y)) d)) x) (local_max_at (lambda (y) (+ (+ (+ (* a (^ y 3)) (* b (^ y 2))) (* c y)) d)) x))) (> (- (^ b 2) (* (* 3 a) c)) 0))))
  hard_negative:
    statement: $a\neq 0$のとき、$b^2-3ac\geq 0$なら$ax^3+bx^2+cx+d$は極値をもつ。
    reason: 等号の場合が成り立たない。$x^3$は$b^2-3ac=0$で$f'(0)=0$となるが、単調増加なので極値をもたない。
  target: |
    ∀ (a b c d : ℝ), a ≠ 0 → ((∃ x, IsLocalExtr (fun y : ℝ => a * y ^ 3 + b * y ^ 2 + c * y + d) x) ↔ 0 < b ^ 2 - 3 * a * c)
  proof: |
    by
      intro a b c d ha
      have hd : ∀ x : ℝ, HasDerivAt (fun y : ℝ => a * y ^ 3 + b * y ^ 2 + c * y + d) (3 * a * x ^ 2 + 2 * b * x + c) x := by
        intro x
        have h3 := (hasDerivAt_pow 3 x).const_mul a
        have h2 := (hasDerivAt_pow 2 x).const_mul b
        have h1 := (hasDerivAt_id' x).const_mul c
        exact (((h3.fun_add h2).fun_add h1).add_const d).congr_deriv (by norm_num; ring)
      constructor
      · rintro ⟨x, hx⟩
        have h0 := hx.hasDerivAt_eq_zero (hd x)
        by_contra hneg
        have hsq : (3 * a * x + b) ^ 2 = b ^ 2 - 3 * a * c := by
          have : 3 * a * (3 * a * x ^ 2 + 2 * b * x + c) = 0 := by rw [h0]; ring
          nlinarith
        have hzero : 3 * a * x + b = 0 := by
          have : (3 * a * x + b) ^ 2 ≤ 0 := by rw [hsq]; linarith
          nlinarith [sq_nonneg (3 * a * x + b)]
        have hb : b = -(3 * a * x) := by linarith
        have hcc : c = 3 * a * x ^ 2 := by
          rw [hb] at h0
          linarith
        have hdiff : ∀ y : ℝ, (a * y ^ 3 + b * y ^ 2 + c * y + d) - (a * x ^ 3 + b * x ^ 2 + c * x + d) = a * (y - x) ^ 3 := by
