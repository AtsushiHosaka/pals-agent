- id: polynomial_sum_derivative
  kind: gap
  level: high
  topic: 微分・多項式の導関数
  statement: 実数$a_0,\dots,a_n$を係数とする多項式$\sum_{k=0}^{n}a_ky^k$の$x$における微分係数は$\sum_{k=0}^{n-1}(k+1)a_{k+1}x^k$である。
  statement_en: For a natural number n and real coefficients a_0, ..., a_n, the polynomial ∑_{k=0}^{n} a_k y^k has derivative ∑_{k=0}^{n-1} (k+1) a_{k+1} x^k at x.
  assumptions:
  - $n$は自然数
  - $a_0,\dots,a_n$は実数
  quantifiers:
  - 任意の自然数$n$、実数列$a$、実数$x$
  conclusion: $\sum_{k=0}^{n}a_ky^k$は$y=x$で微分可能で、微分係数は$\sum_{k=0}^{n-1}(k+1)a_{k+1}x^k$である。
  answer: |
    $n$を自然数、$a_0,\dots,a_n,x$を実数とし、$g_n(y)=\sum_{k=0}^{n}a_ky^k$とおく。$g_n$の$x$における微分係数が$\sum_{k=0}^{n-1}(k+1)a_{k+1}x^k$であることを$n$に関する帰納法で示す。
    $n=0$のとき$g_0$は定数なので微分係数は$0$であり、右辺の空の和と一致する。
    $n=m$で成り立つとする。$g_{m+1}(y)=g_m(y)+a_{m+1}y^{m+1}$であり、$y^{m+1}$の$x$における微分係数は$(m+1)x^m$である。和の微分により、$g_{m+1}$の微分係数は$\sum_{k=0}^{m-1}(k+1)a_{k+1}x^k+(m+1)a_{m+1}x^m=\sum_{k=0}^{m}(k+1)a_{k+1}x^k$となる。
  strategy: Induct on the degree, adding one monomial at a time.
  sketch:
  - 'setup: Let g_n be the polynomial with coefficients a_0, ..., a_n.'
  - 'induction: For n = 0 the polynomial is constant and the empty sum is 0.'
  - 'derive: Write g_{m+1} as g_m plus a_{m+1} y^{m+1} and differentiate the sum.'
  - 'conclude: The new term extends the sum on the derivative side by one index.'
  openmath: (forall (n a x) (-> (in n N) (has_deriv_at (lambda (y) (sum (natural_range (+ n 1)) (lambda (k) (* (seq_value a k) (^ y k))))) (sum (natural_range n) (lambda (k) (* (* (+ k 1) (seq_value a (+ k 1))) (^ x k)))) x)))
  hard_negative:
    statement: $\sum_{k=0}^{n}a_ky^k$の微分係数は$\sum_{k=0}^{n}ka_kx^k$である。
    reason: 次数を下げ忘れている。$y^2$の$x$における微分係数は$2x$であり、$2x^2$ではない。
  target: |
    ∀ (n : ℕ) (a : ℕ → ℝ) (x : ℝ), HasDerivAt (fun y : ℝ => ∑ k ∈ Finset.range (n + 1), a k * y ^ k) (∑ k ∈ Finset.range n, ((k : ℝ) + 1) * a (k + 1) * x ^ k) x
  proof: |
    by
      intro n a x
      induction n with
      | zero => simpa using hasDerivAt_const x (a 0)
      | succ m ih =>
        have h := ih.fun_add ((hasDerivAt_pow (m + 1) x).const_mul (a (m + 1)))
        simp only [Finset.sum_range_succ _ (m + 1), Finset.sum_range_succ _ m] at h ⊢
        refine h.congr_deriv ?_
        simp only [Nat.add_sub_cancel]
        push_cast
        ring
- id: function_power_derivative
  kind: gap
  level: high
  topic: 微分・合成関数の実用形
  statement: $f$の$a$における微分係数が$u$なら、自然数$n$について$f(x)^{n+1}$の$a$における微分係数は$(n+1)f(a)^nu$である。
  statement_en: If f has derivative u at a and n is a natural number, then f(x)^(n+1) has derivative (n+1) f(a)^n u at a.
  assumptions:
  - $f$の$a$における微分係数は$u$
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$、実数$u,a$、自然数$n$
  conclusion: $f(x)^{n+1}$の$a$における微分係数は$(n+1)f(a)^nu$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$は$a$で微分可能で微分係数が$u$であるとし、$n$を自然数とする。$g(y)=y^{n+1}$とおくと$f(x)^{n+1}=g(f(x))$であり、$g$の$f(a)$における微分係数は$(n+1)f(a)^n$である。合成関数の微分法により、$g\circ f$の$a$における微分係数は$(n+1)f(a)^nu$である。
  strategy: Compose the power function with f and apply the chain rule.
  sketch:
  - 'setup: Write f(x)^(n+1) as g(f(x)) with g(y) = y^(n+1).'
  - 'apply_theorem: The chain rule gives g''(f(a)) u.'
  - 'conclude: Substitute g''(y) = (n+1) y^n.'
  openmath: (forall (f u a n) (-> (and (in n N) (has_deriv_at (lambda (x) (fn_value f x)) u a)) (has_deriv_at (lambda (x) (^ (fn_value f x) (+ n 1))) (* (* (+ n 1) (^ (fn_value f a) n)) u) a)))
  hard_negative:
    statement: $f(x)^{n+1}$の$a$における微分係数は$(n+1)f(a)^n$である。
    reason: 内側の微分係数$u$が抜けている。$f(x)=2x$、$n=1$では$4x^2$の微分係数は$8x$だが、この式は$4x$を与える。
  target: |
    ∀ (f : ℝ → ℝ) (u a : ℝ) (n : ℕ), HasDerivAt f u a → HasDerivAt (fun x => f x ^ (n + 1)) (((n : ℝ) + 1) * f a ^ n * u) a
  proof: |
    by
      intro f u a n hf
      refine (hf.fun_pow (n + 1)).congr_deriv ?_
      simp only [Nat.add_sub_cancel]
      push_cast
      ring
- id: sqrt_composite_derivative
  kind: gap
  level: high
  topic: 微分・合成関数の実用形
  statement: $f$の$a$における微分係数が$u$で$f(a)>0$なら、$\sqrt{f(x)}$の$a$における微分係数は$\dfrac{u}{2\sqrt{f(a)}}$である。
  statement_en: If f has derivative u at a and f(a) > 0, then √(f(x)) has derivative u/(2√(f(a))) at a.
  assumptions:
  - $f$の$a$における微分係数は$u$
  - $f(a)>0$
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$と実数$u,a$
  conclusion: $\sqrt{f(x)}$の$a$における微分係数は$\dfrac{u}{2\sqrt{f(a)}}$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$は$a$で微分可能で微分係数が$u$であり、$f(a)>0$とする。$y>0$で$\sqrt{y}$は微分可能で、その導関数は$\dfrac{1}{2\sqrt{y}}$である。$f(a)>0$なので合成関数の微分法を使えて、$\sqrt{f(x)}$の$a$における微分係数は$\dfrac{1}{2\sqrt{f(a)}}\cdot u=\dfrac{u}{2\sqrt{f(a)}}$である。
  strategy: Apply the chain rule to the square root at the positive point f(a).
  sketch:
  - 'setup: The square root is differentiable at f(a) because f(a) > 0.'
  - 'apply_theorem: Compose with f by the chain rule.'
  - 'conclude: The derivative is u/(2√(f(a))).'
  openmath: (forall (f u a) (-> (and (has_deriv_at (lambda (x) (fn_value f x)) u a) (> (fn_value f a) 0)) (has_deriv_at (lambda (x) (root (fn_value f x) 2)) (/ u (* 2 (root (fn_value f a) 2))) a)))
  hard_negative:
    statement: $f$が$a$で微分可能なら、$f(a)=0$でも$\sqrt{f(x)}$は$a$で微分可能である。
    reason: $f(x)=x^2$、$a=0$では$\sqrt{f(x)}=|x|$となり、$0$で微分可能でない。
  target: |
    ∀ (f : ℝ → ℝ) (u a : ℝ), HasDerivAt f u a → 0 < f a → HasDerivAt (fun x => Real.sqrt (f x)) (u / (2 * Real.sqrt (f a))) a
  proof: |
    by
      intro f u a hf ha
      exact hf.sqrt ha.ne'
- id: sin_cos_affine_derivative
  kind: gap
  level: high
  topic: 微分・三角関数の合成
  statement: 実数$a,b$について、$\sin(ax+b)$の導関数は$a\cos(ax+b)$、$\cos(ax+b)$の導関数は$-a\sin(ax+b)$である。
  statement_en: For real a and b, at every x the function sin(ay+b) has derivative a cos(ax+b) and cos(ay+b) has derivative -a sin(ax+b).
  assumptions:
  - $a,b,x$は実数
  quantifiers:
  - 任意の実数$a,b,x$
  conclusion: $\sin(ay+b)$の$x$における微分係数は$a\cos(ax+b)$、$\cos(ay+b)$の$x$における微分係数は$-a\sin(ax+b)$である。
  answer: |
    $a,b,x$を実数とする。$h(y)=ay+b$の$x$における微分係数は$a$である。正弦の導関数は余弦、余弦の導関数は正弦の符号を変えたものなので、合成関数の微分法により、$\sin(h(y))$の$x$における微分係数は$\cos(ax+b)\cdot a$、$\cos(h(y))$の$x$における微分係数は$-\sin(ax+b)\cdot a$である。
  strategy: Apply the chain rule with the affine inner function.
  sketch:
  - 'setup: The inner function ay+b has derivative a.'
  - 'apply_theorem: Use the chain rule with the derivatives of sine and cosine.'
  - 'conclude: Move the factor a to the front.'
  openmath: (forall (a b x) (and (has_deriv_at (lambda (y) (sin (+ (* a y) b))) (* a (cos (+ (* a x) b))) x) (has_deriv_at (lambda (y) (cos (+ (* a y) b))) (neg (* a (sin (+ (* a x) b)))) x)))
  hard_negative:
    statement: $\sin(ax+b)$の導関数は$\cos(ax+b)$である。
    reason: 内側の係数$a$が抜けている。$\sin 2x$の$x=0$における微分係数は$2$であり、$\cos 0=1$ではない。
  target: |
    ∀ (a b x : ℝ), HasDerivAt (fun y => Real.sin (a * y + b)) (a * Real.cos (a * x + b)) x ∧ HasDerivAt (fun y => Real.cos (a * y + b)) (-(a * Real.sin (a * x + b))) x
  proof: |
    by
      intro a b x
      have h : HasDerivAt (fun y => a * y + b) a x := by
        simpa using ((hasDerivAt_id x).const_mul a).add_const b
      constructor
      · exact h.sin.congr_deriv (by ring)
      · exact h.cos.congr_deriv (by ring)
- id: exponential_base_derivative
  kind: textbook
  level: high
  topic: 微分・指数関数
  statement: $a>0$のとき、$a^y$の$x$における微分係数は$a^x\log a$である。
  statement_en: For a > 0, the function a^y has derivative a^x log a at x.
  assumptions:
  - $a>0$
  quantifiers:
  - 任意の実数$a,x$
  conclusion: $a^y$の$x$における微分係数は$a^x\log a$である。
  answer: |
    $a>0$、$x$を実数とする。$a^y=e^{y\log a}$と書ける。内側の$y\log a$の微分係数は$\log a$なので、合成関数の微分法により、$a^y$の$x$における微分係数は$e^{x\log a}\log a=a^x\log a$である。
  strategy: Rewrite the base through the natural logarithm and use the chain rule.
  sketch:
  - 'translate: Write a^y as exp(y log a), which is valid since a > 0.'
  - 'apply_theorem: The chain rule gives exp(x log a) log a.'
  - 'conclude: Rewrite exp(x log a) as a^x.'
  openmath: (forall (a x) (-> (> a 0) (has_deriv_at (lambda (y) (^ a y)) (* (^ a x) (ln a)) x)))
  hard_negative:
    statement: $a>0$のとき、$a^y$の$x$における微分係数は$xa^{x-1}$である。
    reason: 冪関数の公式を指数関数に当てはめている。$a=2$、$x=0$では正しい値は$\log 2$で、この式の値は$0$である。
  target: |
    ∀ (a x : ℝ), 0 < a → HasDerivAt (fun y => a ^ y) (a ^ x * Real.log a) x
  proof: |
    by
      intro a x ha
      exact (Real.hasStrictDerivAt_const_rpow ha x).hasDerivAt
- id: log_abs_composite_derivative
  kind: gap
  level: high
  topic: 微分・対数微分
  statement: $f$の$a$における微分係数が$u$で$f(a)\neq 0$なら、$\log|f(x)|$の$a$における微分係数は$\dfrac{u}{f(a)}$である。
  statement_en: If f has derivative u at a and f(a) ≠ 0, then log|f(x)| has derivative u/f(a) at a.
  assumptions:
  - $f$の$a$における微分係数は$u$
  - $f(a)\neq 0$
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$と実数$u,a$
  conclusion: $\log|f(x)|$の$a$における微分係数は$\dfrac{u}{f(a)}$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$は$a$で微分可能で微分係数が$u$であり、$f(a)\neq 0$とする。$f$は$a$で連続なので、$a$の近くで$f(x)$は$f(a)$と同じ符号をもつ。
    $f(a)>0$のとき、$a$の近くで$\log|f(x)|=\log f(x)$なので、合成関数の微分法により微分係数は$\dfrac{u}{f(a)}$である。
    $f(a)<0$のとき、$a$の近くで$\log|f(x)|=\log(-f(x))$である。$-f$の$a$における微分係数は$-u$なので、微分係数は$\dfrac{-u}{-f(a)}=\dfrac{u}{f(a)}$である。
  strategy: Split on the sign of f(a) and differentiate the logarithm locally.
  sketch:
  - 'setup: By continuity f keeps the sign of f(a) near a.'
  - 'case_split: If f(a) > 0 then log|f| = log f near a.'
  - 'case_split: If f(a) < 0 then log|f| = log(-f) near a.'
  - 'conclude: Both cases give u/f(a) by the chain rule.'
  openmath: (forall (f u a) (-> (and (has_deriv_at (lambda (x) (fn_value f x)) u a) (!= (fn_value f a) 0)) (has_deriv_at (lambda (x) (ln (abs (fn_value f x)))) (/ u (fn_value f a)) a)))
  hard_negative:
    statement: $\log|f(x)|$の$a$における微分係数は$\dfrac{1}{f(a)}$である。
    reason: 内側の微分係数が抜けている。$f(x)=2x$、$a=1$では$\log|2x|$の微分係数は$1$で、$\dfrac{1}{f(1)}=\dfrac12$ではない。
  target: |
    ∀ (f : ℝ → ℝ) (u a : ℝ), HasDerivAt f u a → f a ≠ 0 → HasDerivAt (fun x => Real.log |f x|) (u / f a) a
  proof: |
    by
      intro f u a hf ha
      simpa only [Real.log_abs] using hf.log ha
- id: tangent_line_equation_form
  kind: gap
  level: high
  topic: 微分・接線の方程式
  statement: $f$の$a$における微分係数が$u$のとき、直線$y=mx+n$が点$(a,f(a))$を通り傾きが$u$であることと、この直線が$y=f(a)+u(x-a)$と一致することは同値である。
  statement_en: If f has derivative u at a, then the line y = mx + n passes through (a, f(a)) with slope u if and only if mx + n = f(a) + u(x-a) for all x.
  assumptions:
  - $f$の$a$における微分係数は$u$
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$と実数$u,a,m,n$
  conclusion: $ma+n=f(a)$かつ$m=u$であることと、全ての実数$x$で$mx+n=f(a)+u(x-a)$であることは同値である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$の$a$における微分係数を$u$とし、$m,n$を実数とする。
    $ma+n=f(a)$かつ$m=u$とする。任意の$x$で$mx+n=m(x-a)+(ma+n)=u(x-a)+f(a)$である。
    逆に全ての$x$で$mx+n=f(a)+u(x-a)$とする。$x=a$を代入すると$ma+n=f(a)$である。$x=a+1$を代入して$x=a$の式を引くと$m=u$である。
  strategy: Compare the two affine expressions by evaluating at two points.
  sketch:
  - 'derive: Rewrite mx + n as m(x-a) + (ma+n) and substitute the two conditions.'
  - 'derive: Conversely evaluate the identity at x = a to get ma + n = f(a).'
  - 'conclude: Evaluate at x = a + 1 and subtract to get m = u.'
  openmath: (forall (f u a m n) (-> (has_deriv_at (lambda (x) (fn_value f x)) u a) (<-> (and (= (+ (* m a) n) (fn_value f a)) (= m u)) (forall (x) (= (+ (* m x) n) (+ (fn_value f a) (* u (- x a))))))))
  hard_negative:
    statement: 点$(a,f(a))$を通る直線は、その点における$y=f(x)$の接線である。
    reason: 傾きの条件が抜けている。$f(x)=x^2$、$a=0$で直線$y=x$は原点を通るが、接線は$y=0$である。
  target: |
    ∀ (f : ℝ → ℝ) (u a m n : ℝ), HasDerivAt f u a → ((m * a + n = f a ∧ m = u) ↔ ∀ x, m * x + n = f a + u * (x - a))
  proof: |
    by
      intro f u a m n _
      constructor
      · rintro ⟨h1, rfl⟩ x
        rw [← h1]; ring
      · intro h
        have h0 := h a
        have h1 := h (a + 1)
        constructor
        · linarith
        · nlinarith
- id: cubic_minus_tangent_factorization
  kind: gap
  level: high
  topic: 微分・3次関数の接線
  statement: $a\neq 0$の3次関数$f(x)=ax^3+bx^2+cx+d$の$x=t$における接線の傾きは$f'(t)=3at^2+2bt+c$であり、$f(x)-(f(t)+f'(t)(x-t))=a(x-t)^2\left(x+2t+\dfrac{b}{a}\right)$が成り立つ。
  statement_en: For a ≠ 0 and f(x) = ax^3 + bx^2 + cx + d, f has derivative 3at^2 + 2bt + c at t, and f(x) minus the tangent line at t equals a(x-t)^2(x + 2t + b/a) for all x.
  assumptions:
  - $a\neq 0$
  - $f(x)=ax^3+bx^2+cx+d$
  quantifiers:
  - 任意の実数$a,b,c,d,t$
  - 任意の実数$x$
  conclusion: $f$の$t$における微分係数は$3at^2+2bt+c$で、$f$と接線の差は$a(x-t)^2\left(x+2t+\dfrac{b}{a}\right)$である。
  answer: |
    $a\neq 0$、$b,c,d,t$を実数とし、$f(x)=ax^3+bx^2+cx+d$とする。各項を微分して$f'(t)=3at^2+2bt+c$を得る。
    $x$を実数とする。$f(x)-f(t)=(x-t)\left(a(x^2+xt+t^2)+b(x+t)+c\right)$なので、$f'(t)$を引いて整理すると
    $f(x)-f(t)-f'(t)(x-t)=(x-t)\left(a(x^2+xt-2t^2)+b(x-t)\right)$
    となる。$x^2+xt-2t^2=(x-t)(x+2t)$を用いると、右辺は$(x-t)^2\left(a(x+2t)+b\right)=a(x-t)^2\left(x+2t+\dfrac{b}{a}\right)$に等しい。
  strategy: Differentiate termwise and factor the difference of f and its tangent.
  sketch:
  - 'derive: Differentiate each term of f at t.'
  - 'derive: Factor x - t out of f(x) - f(t) and subtract f''(t)(x-t).'
  - 'derive: Factor x^2 + xt - 2t^2 as (x-t)(x+2t).'
  - 'conclude: Pull out the factor a, which is nonzero.'
  openmath: (forall (a b c d t) (-> (!= a 0) (and (has_deriv_at (lambda (y) (+ (+ (+ (* a (^ y 3)) (* b (^ y 2))) (* c y)) d)) (+ (+ (* (* 3 a) (^ t 2)) (* (* 2 b) t)) c) t) (forall (x) (= (- (+ (+ (+ (* a (^ x 3)) (* b (^ x 2))) (* c x)) d) (+ (+ (+ (+ (* a (^ t 3)) (* b (^ t 2))) (* c t)) d) (* (+ (+ (* (* 3 a) (^ t 2)) (* (* 2 b) t)) c) (- x t)))) (* (* a (^ (- x t) 2)) (+ (+ x (* 2 t)) (/ b a))))))))
  hard_negative:
    statement: 3次関数のグラフとその接線は、接点以外で交わらない。
    reason: $f(x)=x^3$、$t=1$の接線$y=3x-2$は$x=-2$でも交わる。接点だけになるのは$x+2t+\dfrac{b}{a}$の根が$t$と一致するときに限る。
  target: |
    ∀ (a b c d t : ℝ), a ≠ 0 → HasDerivAt (fun y => a * y ^ 3 + b * y ^ 2 + c * y + d) (3 * a * t ^ 2 + 2 * b * t + c) t ∧ ∀ x, (a * x ^ 3 + b * x ^ 2 + c * x + d) - ((a * t ^ 3 + b * t ^ 2 + c * t + d) + (3 * a * t ^ 2 + 2 * b * t + c) * (x - t)) = a * (x - t) ^ 2 * (x + 2 * t + b / a)
  proof: |
    by
      intro a b c d t ha
      constructor
      · have h3 := (hasDerivAt_pow 3 t).const_mul a
        have h2 := (hasDerivAt_pow 2 t).const_mul b
        have h1 := (hasDerivAt_id' t).const_mul c
        exact (((h3.fun_add h2).fun_add h1).add_const d).congr_deriv (by norm_num; ring)
      · intro x
        field_simp
        ring
- id: convex_function_above_tangent
  kind: gap
  level: high
  topic: 微分・接線と不等式
  statement: 実数全体で$f''\geq 0$なら、任意の$a,x$で$f(x)\geq f(a)+f'(a)(x-a)$である。つまり$y=f(x)$は各点の接線より下に出ない。
  statement_en: If f has derivative f1 and f1 has derivative f2 everywhere with f2 ≥ 0 everywhere, then f(x) ≥ f(a) + f1(a)(x-a) for all a and x.
  assumptions:
  - 実数全体で$f$の導関数は$f_1$
  - 実数全体で$f_1$の導関数は$f_2$
  - 全ての$y$で$f_2(y)\geq 0$
  quantifiers:
  - 任意の$f,f_1,f_2:\mathbb{R}\to\mathbb{R}$と実数$a,x$
  conclusion: $f(a)+f_1(a)(x-a)\leq f(x)$である。
  answer: |
    $f,f_1,f_2:\mathbb{R}\to\mathbb{R}$について、実数全体で$f'=f_1$、$f_1'=f_2$、$f_2\geq 0$とし、$a,x$を実数とする。導関数が非負なので$f_1$は単調非減少である。
    $x=a$なら等号が成り立つ。
    $x>a$とする。平均値の定理により、ある$c\in(a,x)$で$f(x)-f(a)=f_1(c)(x-a)$となる。$f_1(c)\geq f_1(a)$かつ$x-a>0$なので、$f(x)-f(a)\geq f_1(a)(x-a)$である。
    $x<a$とする。平均値の定理により、ある$c\in(x,a)$で$f(a)-f(x)=f_1(c)(a-x)$となる。$f_1(c)\leq f_1(a)$かつ$a-x>0$なので、$f(a)-f(x)\leq f_1(a)(a-x)$であり、整理すると$f(x)-f(a)\geq f_1(a)(x-a)$である。
  strategy: Combine the mean value theorem with monotonicity of the first derivative.
  sketch:
  - 'derive: A nonnegative second derivative makes f1 nondecreasing.'
  - 'case_split: The case x = a is an equality.'
  - 'apply_theorem: For x > a apply the mean value theorem on [a, x] and use f1(c) ≥ f1(a).'
  - 'apply_theorem: For x < a apply it on [x, a] and use f1(c) ≤ f1(a).'
  - 'conclude: Both cases give the tangent line bound.'
  openmath: (forall (f f1 f2 a x) (-> (and (forall (y) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value f1 y) y)) (forall (y) (has_deriv_at (lambda (t) (fn_value f1 t)) (fn_value f2 y) y)) (forall (y) (<= 0 (fn_value f2 y)))) (<= (+ (fn_value f a) (* (fn_value f1 a) (- x a))) (fn_value f x))))
  hard_negative:
    statement: $f'(a)$が存在すれば、$y=f(x)$は$x=a$における接線より下に出ない。
    reason: $f''\geq 0$が必要である。$f(x)=x^3$、$a=0$の接線は$y=0$で、$x<0$ではグラフが接線より下にある。
  target: |
    ∀ (f f1 f2 : ℝ → ℝ) (a x : ℝ), (∀ y, HasDerivAt f (f1 y) y) → (∀ y, HasDerivAt f1 (f2 y) y) → (∀ y, 0 ≤ f2 y) → f a + f1 a * (x - a) ≤ f x
  proof: |
    by
      intro f f1 f2 a x hf hf1 h2
      have hm : Monotone f1 := by
        apply monotone_of_deriv_nonneg (fun y => (hf1 y).differentiableAt)
        intro y
        rw [(hf1 y).deriv]
        exact h2 y
      have hc : Continuous f := continuous_iff_continuousAt.mpr fun y => (hf y).continuousAt
      rcases lt_trichotomy x a with h | rfl | h
      · obtain ⟨c, hc1, hc2⟩ := exists_hasDerivAt_eq_slope f f1 h hc.continuousOn (fun y _ => hf y)
        have hle : f1 c ≤ f1 a := hm hc1.2.le
        have hpos : 0 < a - x := by linarith
        rw [eq_div_iff hpos.ne'] at hc2
        nlinarith
      · simp
      · obtain ⟨c, hc1, hc2⟩ := exists_hasDerivAt_eq_slope f f1 h hc.continuousOn (fun y _ => hf y)
        have hle : f1 a ≤ f1 c := hm hc1.1.le
        have hpos : 0 < x - a := by linarith
        rw [eq_div_iff hpos.ne'] at hc2
        nlinarith
- id: cubic_monotone_iff_discriminant
  kind: gap
  level: high
  topic: 微分・増減と導関数の符号
  statement: $a>0$のとき、$f(x)=ax^3+bx^2+cx+d$が実数全体で単調非減少であることと、$b^2\leq 3ac$であることは同値である。
  statement_en: For a > 0, the cubic ax^3 + bx^2 + cx + d is nondecreasing on the reals if and only if b^2 ≤ 3ac.
  assumptions:
  - $a>0$
  quantifiers:
  - 任意の実数$a,b,c,d$
  conclusion: $ax^3+bx^2+cx+d$が単調非減少であることと$b^2\leq 3ac$は同値である。
  answer: |
    $a>0$、$b,c,d$を実数とし、$f(x)=ax^3+bx^2+cx+d$とする。$f'(x)=3ax^2+2bx+c$であり、
    $3af'(x)=(3ax+b)^2+3ac-b^2$
    が成り立つ。
    $b^2\leq 3ac$とする。右辺は常に$0$以上で$3a>0$なので、全ての$x$で$f'(x)\geq 0$である。平均値の定理により$f$は単調非減少である。
