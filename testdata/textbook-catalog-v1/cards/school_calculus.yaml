        have hcpos := hp c ⟨hu.1.trans hc1.1, hc1.2.trans hv.2⟩
        rw [hc2] at hcpos
        have hpos : 0 < v - u := by linarith
        have := (div_pos_iff_of_pos_right hpos).mp hcpos
        linarith
      rcases lt_trichotomy y x with h | h | h
      · have := key y hy x hx h; linarith
      · exact h
      · have := key x hx y hy h; linarith
- id: max_at_endpoint_or_critical_point
  kind: gap
  level: high
  topic: 微分・最大最小
  statement: $a<b$で$f$が$[a,b]$で連続、$(a,b)$で微分可能なら、$f$の$[a,b]$における最大値は、端点または$f'=0$となる点でとられる。
  statement_en: If a < b, f is continuous on [a,b] and has derivative g on (a,b), then f attains its maximum over [a,b] at some c that is an endpoint or satisfies g(c) = 0.
  assumptions:
  - $a<b$
  - $f$は$[a,b]$で連続
  - $(a,b)$で$f$の導関数は$g$
  quantifiers:
  - 任意の$f,g:\mathbb{R}\to\mathbb{R}$と実数$a,b$
  conclusion: ある$c\in[a,b]$が存在し、$c=a$または$c=b$または$g(c)=0$であり、全ての$x\in[a,b]$で$f(x)\leq f(c)$である。
  answer: |
    $a<b$とし、$f:\mathbb{R}\to\mathbb{R}$は$[a,b]$で連続、$(a,b)$で導関数$g$をもつとする。最大値の定理により、ある$c\in[a,b]$で全ての$x\in[a,b]$について$f(x)\leq f(c)$となる。
    $c=a$または$c=b$なら条件を満たす。
    $a<c<b$とする。$x\in(a,b)$で$f(x)\leq f(c)$なので、$x>c$では$\dfrac{f(x)-f(c)}{x-c}\leq 0$、$x<c$では$\dfrac{f(x)-f(c)}{x-c}\geq 0$である。$f$は$c$で微分可能なので、$x\to c+0$と$x\to c-0$の極限をとると$g(c)\leq 0$かつ$g(c)\geq 0$となる。よって$g(c)=0$である。
  strategy: Take a maximizer by compactness and use the interior extremum criterion.
  sketch:
  - 'apply_theorem: The extreme value theorem gives a maximizer c in [a,b].'
  - 'case_split: If c is an endpoint there is nothing more to prove.'
  - 'derive: If c is interior then c is a local maximum.'
  - 'conclude: The derivative at an interior local maximum is 0.'
  openmath: (forall (f g a b) (-> (and (< a b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (forall (x) (-> (in x (open_interval a b)) (has_deriv_at (lambda (y) (fn_value f y)) (fn_value g x) x)))) (exists (c) (and (in c (closed_interval a b)) (or (= c a) (= c b) (= (fn_value g c) 0)) (forall (x) (-> (in x (closed_interval a b)) (<= (fn_value f x) (fn_value f c))))))))
  hard_negative:
    statement: $f$の$[a,b]$における最大値は、必ず$f'=0$となる点でとられる。
    reason: 端点を除けない。$f(x)=x$の$[0,1]$における最大値は$x=1$でとられ、$f'$はつねに$1$である。
  target: |
    ∀ (f g : ℝ → ℝ) (a b : ℝ), a < b → ContinuousOn f (Set.Icc a b) → (∀ x ∈ Set.Ioo a b, HasDerivAt f (g x) x) → ∃ c ∈ Set.Icc a b, (c = a ∨ c = b ∨ g c = 0) ∧ ∀ x ∈ Set.Icc a b, f x ≤ f c
  proof: |
    by
      intro f g a b hab hc hd
      obtain ⟨c, hc1, hc2⟩ := isCompact_Icc.exists_isMaxOn (Set.nonempty_Icc.mpr hab.le) hc
      refine ⟨c, hc1, ?_, fun x hx => hc2 hx⟩
      rcases hc1.1.eq_or_lt with h | h
      · exact Or.inl h.symm
      rcases hc1.2.eq_or_lt with h' | h'
      · exact Or.inr (Or.inl h')
      refine Or.inr (Or.inr ?_)
      have hloc : IsLocalMax f c := (hc2.on_subset Set.Ioo_subset_Icc_self).isLocalMax (Ioo_mem_nhds h h')
      exact hloc.hasDerivAt_eq_zero (hd c ⟨h, h'⟩)
- id: max_at_derivative_sign_change
  kind: gap
  level: high
  topic: 微分・最大最小
  statement: $a\leq c\leq b$とする。$f$が$[a,b]$で連続で、$(a,c)$で$f'\geq 0$、$(c,b)$で$f'\leq 0$なら、$f(c)$は$f$の$[a,b]$における最大値である。
  statement_en: If a ≤ c ≤ b, f is continuous on [a,b], has derivative g on (a,c) and (c,b), with g ≥ 0 on (a,c) and g ≤ 0 on (c,b), then f(x) ≤ f(c) for all x in [a,b].
  assumptions:
  - $a\leq c\leq b$
  - $f$は$[a,b]$で連続
  - $(a,c)$と$(c,b)$で$f$の導関数は$g$
  - $(a,c)$で$g\geq 0$、$(c,b)$で$g\leq 0$
  quantifiers:
  - 任意の$f,g:\mathbb{R}\to\mathbb{R}$と実数$a,b,c$
  - 任意の$x\in[a,b]$
  conclusion: $f(x)\leq f(c)$である。
  answer: |
    $a\leq c\leq b$とし、$f:\mathbb{R}\to\mathbb{R}$は$[a,b]$で連続、$(a,c)$と$(c,b)$で導関数$g$をもち、$(a,c)$で$g\geq 0$、$(c,b)$で$g\leq 0$とする。$x\in[a,b]$をとる。
    $x<c$なら、平均値の定理により、ある$e\in(x,c)$で$f(c)-f(x)=g(e)(c-x)$となる。$e\in(a,c)$なので右辺は$0$以上であり、$f(x)\leq f(c)$である。
    $x=c$なら等号が成り立つ。
    $x>c$なら、平均値の定理により、ある$e\in(c,x)$で$f(x)-f(c)=g(e)(x-c)$となる。$e\in(c,b)$なので右辺は$0$以下であり、$f(x)\leq f(c)$である。
  strategy: Apply the mean value theorem between x and c on each side.
  sketch:
  - 'case_split: Treat x < c, x = c and x > c separately.'
  - 'apply_theorem: For x < c the mean value theorem on [x, c] gives f(c) - f(x) ≥ 0.'
  - 'apply_theorem: For x > c the mean value theorem on [c, x] gives f(x) - f(c) ≤ 0.'
  - 'conclude: In all cases f(x) ≤ f(c).'
  openmath: (forall (f g a b c) (-> (and (<= a c) (<= c b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (forall (x) (-> (in x (open_interval a c)) (has_deriv_at (lambda (y) (fn_value f y)) (fn_value g x) x))) (forall (x) (-> (in x (open_interval c b)) (has_deriv_at (lambda (y) (fn_value f y)) (fn_value g x) x))) (forall (x) (-> (in x (open_interval a c)) (<= 0 (fn_value g x)))) (forall (x) (-> (in x (open_interval c b)) (<= (fn_value g x) 0)))) (forall (x) (-> (in x (closed_interval a b)) (<= (fn_value f x) (fn_value f c))))))
  hard_negative:
    statement: $f'(c)=0$なら、$f(c)$は$[a,b]$における最大値である。
    reason: 符号の変化を調べる必要がある。$f(x)=x^2$、$[a,b]=[-1,1]$、$c=0$では$f'(0)=0$だが、$f(0)$は最小値である。
  target: |
    ∀ (f g : ℝ → ℝ) (a b c : ℝ), a ≤ c → c ≤ b → ContinuousOn f (Set.Icc a b) → (∀ x ∈ Set.Ioo a c, HasDerivAt f (g x) x) → (∀ x ∈ Set.Ioo c b, HasDerivAt f (g x) x) → (∀ x ∈ Set.Ioo a c, 0 ≤ g x) → (∀ x ∈ Set.Ioo c b, g x ≤ 0) → ∀ x ∈ Set.Icc a b, f x ≤ f c
  proof: |
    by
      intro f g a b c hac hcb hf hd1 hd2 hg1 hg2 x hx
      rcases lt_trichotomy x c with h | rfl | h
      · have hsub : Set.Icc x c ⊆ Set.Icc a b := Set.Icc_subset_Icc hx.1 hcb
        obtain ⟨e, he1, he2⟩ := exists_hasDerivAt_eq_slope f g h (hf.mono hsub) (fun z hz => hd1 z ⟨hx.1.trans_lt hz.1, hz.2⟩)
        have := hg1 e ⟨hx.1.trans_lt he1.1, he1.2⟩
        have hpos : 0 < c - x := by linarith
        rw [eq_div_iff hpos.ne'] at he2
        nlinarith
      · exact le_rfl
      · have hsub : Set.Icc c x ⊆ Set.Icc a b := Set.Icc_subset_Icc hac hx.2
        obtain ⟨e, he1, he2⟩ := exists_hasDerivAt_eq_slope f g h (hf.mono hsub) (fun z hz => hd2 z ⟨hz.1, hz.2.trans_le hx.2⟩)
        have := hg2 e ⟨he1.1, he1.2.trans_le hx.2⟩
        have hpos : 0 < x - c := by linarith
        rw [eq_div_iff hpos.ne'] at he2
        nlinarith
- id: integral_adjacent_intervals
  kind: textbook
  level: high
  topic: 定積分・区間の分割
  statement: $f$が$a,b$の間と$b,c$の間で積分可能なら、$\int_a^bf(x)\,dx+\int_b^cf(x)\,dx=\int_a^cf(x)\,dx$である。$a,b,c$の大小は問わない。
  statement_en: If f is interval integrable between a and b and between b and c, then ∫_a^b f + ∫_b^c f = ∫_a^c f, whatever the order of a, b, c.
  assumptions:
  - $f$は$a,b$の間で積分可能
  - $f$は$b,c$の間で積分可能
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$と実数$a,b,c$
  conclusion: $\int_a^bf(x)\,dx+\int_b^cf(x)\,dx=\int_a^cf(x)\,dx$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$は$a,b$の間と$b,c$の間で積分可能とする。定積分は$p\leq q$のとき$[p,q]$上の積分とし、$p>q$のとき$\int_p^qf=-\int_q^pf$と定める。
    $a,b,c$を小さい順に並べたものを$p\leq q\leq r$とする。仮定から$f$は$[p,r]$で積分可能であり、$[p,r]$を$[p,q]$と$[q,r]$に分けると$\int_p^qf+\int_q^rf=\int_p^rf$である。向きの定義により、これは$\int_p^qf+\int_q^rf+\int_r^pf=0$と同じである。
    証明すべき式も、向きの定義により$S(a,b,c)=\int_a^bf+\int_b^cf+\int_c^af=0$と同じである。$S$は3つの引数を巡回的にずらしても変わらず、2つを入れ替えると符号だけが変わる。$(a,b,c)$は$(p,q,r)$の並べ替えなので$S(a,b,c)=\pm S(p,q,r)=0$である。
  strategy: Reduce every ordering of the three points to additivity over an ordered split.
  sketch:
  - 'setup: Recall the oriented definition of the integral.'
  - 'derive: For a ≤ b ≤ c, split [a,c] into [a,b] and [b,c].'
  - 'case_split: For other orderings, sort the points and move reversed terms across.'
  - 'conclude: Each ordering yields the same identity.'
  openmath: (forall (f a b c) (-> (and (interval_integrable (lambda (x) (fn_value f x)) a b) (interval_integrable (lambda (x) (fn_value f x)) b c)) (= (+ (interval_integral a b (lambda (x) (fn_value f x))) (interval_integral b c (lambda (x) (fn_value f x)))) (interval_integral a c (lambda (x) (fn_value f x))))))
  hard_negative:
    statement: $\int_a^bf(x)\,dx+\int_c^bf(x)\,dx=\int_a^cf(x)\,dx$である。
    reason: 第2項の向きが逆である。$f=1$、$a=0$、$b=1$、$c=2$では左辺は$0$、右辺は$2$である。
  target: |
    ∀ (f : ℝ → ℝ) (a b c : ℝ), IntervalIntegrable f MeasureTheory.volume a b → IntervalIntegrable f MeasureTheory.volume b c → (∫ x in a..b, f x) + (∫ x in b..c, f x) = ∫ x in a..c, f x
  proof: |
    by
      intro f a b c h1 h2
      exact intervalIntegral.integral_add_adjacent_intervals h1 h2
- id: polynomial_definite_integral
  kind: textbook
  level: high
  topic: 定積分・多項式
  statement: 実数$a_0,\dots,a_{n-1}$と$s,t$について、$\int_s^t\sum_{k=0}^{n-1}a_kx^k\,dx=\sum_{k=0}^{n-1}a_k\dfrac{t^{k+1}-s^{k+1}}{k+1}$である。
  statement_en: For real coefficients a_k and reals s and t, ∫_s^t ∑_{k<n} a_k x^k dx = ∑_{k<n} a_k (t^(k+1) - s^(k+1))/(k+1).
  assumptions:
  - $n$は自然数
  - $a_k,s,t$は実数
  quantifiers:
  - 任意の自然数$n$、実数列$a$、実数$s,t$
  conclusion: $\int_s^t\sum_{k=0}^{n-1}a_kx^k\,dx=\sum_{k=0}^{n-1}a_k\dfrac{t^{k+1}-s^{k+1}}{k+1}$である。
  answer: |
    $n$を自然数、$a_k,s,t$を実数とする。各項$a_kx^k$は連続なので積分可能であり、有限和の定積分は項別の定積分の和になる。定数倍は積分の外に出せる。$\dfrac{x^{k+1}}{k+1}$の導関数は$x^k$なので、微積分の基本定理により$\int_s^tx^k\,dx=\dfrac{t^{k+1}-s^{k+1}}{k+1}$である。これらを足し合わせると等式を得る。
  strategy: Integrate the finite sum termwise using the power antiderivative.
  sketch:
  - 'derive: Each monomial is continuous, so the integral of the sum is the sum of the integrals.'
  - 'derive: Pull each coefficient out of its integral.'
  - 'apply_theorem: The fundamental theorem evaluates the integral of x^k.'
  - 'conclude: Sum the resulting terms.'
  openmath: (forall (n a s t) (-> (in n N) (= (interval_integral s t (lambda (x) (sum (natural_range n) (lambda (k) (* (seq_value a k) (^ x k)))))) (sum (natural_range n) (lambda (k) (* (seq_value a k) (/ (- (^ t (+ k 1)) (^ s (+ k 1))) (+ k 1))))))))
  hard_negative:
    statement: $\int_s^t\sum_ka_kx^k\,dx=\sum_ka_k(t^{k+1}-s^{k+1})$である。
    reason: $k+1$で割り忘れている。$\int_0^1x\,dx=\dfrac12$だが、この式は$1$を与える。
  target: |
    ∀ (n : ℕ) (a : ℕ → ℝ) (s t : ℝ), (∫ x in s..t, ∑ k ∈ Finset.range n, a k * x ^ k) = ∑ k ∈ Finset.range n, a k * ((t ^ (k + 1) - s ^ (k + 1)) / ((k : ℝ) + 1))
  proof: |
    by
      intro n a s t
      rw [intervalIntegral.integral_finsetSum]
      · refine Finset.sum_congr rfl fun k _ => ?_
        rw [intervalIntegral.integral_const_mul, integral_pow]
      · intro k _
        exact (by fun_prop : Continuous fun x : ℝ => a k * x ^ k).intervalIntegrable s t
- id: integral_sixth_formula
  kind: gap
  level: high
  topic: 定積分・6分の1公式
  statement: 実数$\alpha,\beta$について、$\int_\alpha^\beta(x-\alpha)(x-\beta)\,dx=-\dfrac{(\beta-\alpha)^3}{6}$である。これは$\int_\alpha^\beta(x-\alpha)^m(x-\beta)^n\,dx$の$m=n=1$の特殊形（6分の1公式）である。
  statement_en: For real α and β, ∫_α^β (x-α)(x-β) dx = -(β-α)^3/6. This is the special case m = n = 1 of ∫_α^β (x-α)^m (x-β)^n dx (the 1/6 formula).
