    reason: $M_2(\mathbb{Q})$で$a=E_{12}$、$b=E_{21}$はどちらも2乗が零だが、$(a+b)^2$は単位行列なので$a+b$は冪零でない。
  target: |
    ∀ (A : Type*) [Ring A] (a b : A), Commute a b → IsNilpotent a → IsNilpotent b → IsNilpotent (a + b) ∧ IsNilpotent (a * b)
  proof: |
    by
      intro A _ a b h ha hb
      exact ⟨h.isNilpotent_add ha hb, h.isNilpotent_mul_right ha⟩
- id: one_sub_nilpotent_geometric_inverse
  kind: gap
  level: 3
  topic: 環論・冪零元と単元
  statement: 1をもつ環（可換とは限らない）の元$a$が$a^n=0$を満たすならば、$1-a$は単元であり、その逆元は$\sum_{i=0}^{n-1}a^i$である。
  statement_en: If an element a of a ring with identity, not necessarily commutative, satisfies a^n = 0, then 1 - a is a unit with inverse the sum of a^i for i from 0 to n - 1.
  assumptions:
  - $A$は1をもつ環（可換とは限らない）
  - $a\in A$、$n$は自然数、$a^n=0$
  quantifiers:
  - 任意の環$A$、元$a$、自然数$n$
  conclusion: $(1-a)\sum_{i=0}^{n-1}a^i=\sum_{i=0}^{n-1}a^i\,(1-a)=1$である。
  answer: |
    $A$を1をもつ環、$a\in A$、$n$を$a^n=0$を満たす自然数とする。$s=\sum_{i=0}^{n-1}a^i$とおく。

    $1$と$a$は可換なので、$(1-a)s=\sum_{i=0}^{n-1}a^i-\sum_{i=1}^{n}a^i=1-a^n=1$である。同じ計算で$s(1-a)=1-a^n=1$である。$n=0$のときは$1=a^0=0$なので$A$は零環であり、$s=0=1$として同じ式が成り立つ。

    よって$s$は$1-a$の両側の逆元である。
  strategy: Telescope the geometric sum on both sides.
  sketch:
  - 'setup: Put s equal to the sum of a^i for i < n.'
  - 'derive: (1 - a)s telescopes to 1 - a^n.'
  - 'derive: s(1 - a) telescopes to 1 - a^n as well.'
  - 'conclude: Since a^n = 0, s is the two-sided inverse of 1 - a.'
  openmath: (forall (A a n) (-> (and (is_ring A) (in a A) (in n N) (= (^ a n) 0)) (and (= (* (- 1 a) (range_sum n (lambda (i) (^ a i)))) 1) (= (* (range_sum n (lambda (i) (^ a i))) (- 1 a)) 1))))
