  answer: |
    $A$を1をもつ環、$e\in A$を$e^2=e$を満たす元とする。

    $e(1-e)=e-e^2=0$であり、$(1-e)e=e-e^2=0$である。

    また$(1-e)^2=(1-e)-e(1-e)=1-e$である。よって$1-e$は冪等元である。
  strategy: Expand the products and use e^2 = e.
  sketch:
  - 'setup: Let e satisfy e^2 = e.'
  - 'derive: e(1 - e) = e - e^2 = 0 and (1 - e)e = 0.'
  - 'conclude: (1 - e)^2 = (1 - e) - e(1 - e) = 1 - e.'
