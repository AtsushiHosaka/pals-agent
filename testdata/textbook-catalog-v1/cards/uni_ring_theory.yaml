    ∀ (A : Type*) [Ring A] (a : A) (n : ℕ), a ^ n = 0 → (1 - a) * (∑ i ∈ Finset.range n, a ^ i) = 1 ∧ (∑ i ∈ Finset.range n, a ^ i) * (1 - a) = 1
