  topic: 環論・多項式環の商
  statement: 可換環$A$のイデアル$I$について、$A[X]/IA[X]$は$(A/I)[X]$と環同型である。ここで$IA[X]$は$I$で生成される$A[X]$のイデアルである。
  statement_en: For an ideal I of a commutative ring A, the quotient A[X]/IA[X] is isomorphic to (A/I)[X], where IA[X] is the ideal of A[X] generated by I.
  assumptions:
