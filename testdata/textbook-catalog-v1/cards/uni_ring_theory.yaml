    ∀ (A : Type*) [Ring A] (e : A), e * e = e → (1 - e) * (1 - e) = 1 - e ∧ e * (1 - e) = 0 ∧ (1 - e) * e = 0
  proof: |
    by
      intro A _ e h
      refine ⟨by rw [mul_sub, mul_one, sub_mul, one_mul, h, sub_self, sub_zero], by rw [mul_sub, mul_one, h, sub_self], by rw [sub_mul, one_mul, h, sub_self]⟩
- id: zmod_reduced_iff_squarefree
  kind: gap
  level: 2
  topic: 環論・被約環と剰余環
  statement: 正の整数$n$について、$\mathbb{Z}/n\mathbb{Z}$が零以外の冪零元をもたないことと、$n$が平方因子をもたないことは同値である。
  statement_en: For a positive integer n, the ring Z/nZ has no nonzero nilpotent elements if and only if n is squarefree.
  assumptions:
  - $n$は正の整数
  quantifiers:
  - 任意の正の整数$n$
  conclusion: $\mathbb{Z}/n\mathbb{Z}$が被約であることと、$n$が平方因子をもたないことは同値である。
  answer: |
    $n$を正の整数とする。

    $n$が平方因子をもつとする。素数$p$と整数$m$で$n=p^2m$と書ける。$x=pm$とおくと$0<x<n$なので、$x$の類は零でない。$x^2=p^2m^2=nm$は$n$の倍数なので、$x$の類は零でない冪零元である。

    $n$が平方因子をもたないとする。$n$は相異なる素数の積$p_1\cdots p_r$である。整数$a$の類が冪零なら、ある$k\geq 1$で$n\mid a^k$である。各$p_i$は$a^k$を割るので、素数の性質より$p_i\mid a$である。$p_i$は相異なる素数なので$n=p_1\cdots p_r\mid a$であり、$a$の類は零である。
  strategy: A square factor produces an explicit nilpotent class; for squarefree n every prime factor of n divides a whenever n divides a power of a.
  sketch:
  - 'case_split: Assume first that n = p^2 m.'
  - 'construct: The class of pm is nonzero and its square vanishes.'
  - 'setup: Now let n = p_1 ... p_r with distinct primes.'
  - 'derive: If n divides a^k, each p_i divides a.'
  - 'conclude: Hence n divides a and the class of a is zero.'
  openmath: (forall (n) (-> (and (in n N) (> n 0)) (<-> (reduced_ring (zmod_ring n)) (squarefree n))))
  hard_negative:
    statement: 任意の非負整数$n$について、$\mathbb{Z}/n\mathbb{Z}$が被約であることと$n$が平方因子をもたないことは同値である。
    reason: $n=0$では$\mathbb{Z}/0\mathbb{Z}=\mathbb{Z}$は被約だが、$0$は平方数$4$で割り切れるので平方因子をもつ。$n>0$の仮定が必要である。
  target: |
    ∀ n : ℕ, n ≠ 0 → (IsReduced (ZMod n) ↔ Squarefree n)
  proof: |
    by
      intro n hn
      rw [isReduced_zmod]
      simp [hn]
- id: zmod_nilpotent_iff_prime_divisors
  kind: gap
  level: 2
  topic: 環論・冪零元と剰余環
  statement: 正の整数$n$と非負整数$a$について、$\mathbb{Z}/n\mathbb{Z}$で$a$の類が冪零であることと、$n$の素因数がすべて$a$を割ることは同値である。
  statement_en: For a positive integer n and a nonnegative integer a, the class of a in Z/nZ is nilpotent if and only if every prime divisor of n divides a.
  assumptions:
  - $n$は正の整数
  - $a$は非負整数
  quantifiers:
  - 任意の正の整数$n$と非負整数$a$
  conclusion: $a$の類が冪零であることと、$n$の素因数がすべて$a$を割ることは同値である。
  answer: |
    $n$を正の整数、$a$を非負整数とする。

    $a$の類が冪零なら、ある$k$で$n\mid a^k$である。$p$を$n$の素因数とすると$p\mid a^k$であり、$p$は素数なので$p\mid a$である。

    逆に$n$の素因数がすべて$a$を割るとする。$n=p_1^{e_1}\cdots p_r^{e_r}$と素因数分解する。各$i$で$e_i\leq n$である。実際$2^{e_i}\leq p_i^{e_i}\leq n$であり、$e_i<2^{e_i}$である。$p_i\mid a$より$p_i^{n}\mid a^n$なので$p_i^{e_i}\mid a^n$である。$p_i^{e_i}$は互いに素なので、その積$n$は$a^n$を割る。よって$a$の類の$n$乗は零であり、冪零である。
  strategy: A prime dividing a power divides the base; conversely compare prime powers of n with a^n.
  sketch:
  - 'setup: Suppose n divides a^k and p is a prime factor of n.'
  - 'derive: Then p divides a.'
  - 'setup: Conversely factor n into prime powers p_i^{e_i}.'
  - 'derive: Each e_i ≤ n, so p_i^{e_i} divides a^n.'
  - 'conclude: Coprimality gives n | a^n, so the class of a is nilpotent.'
  openmath: (forall (n a) (-> (and (in n N) (> n 0) (in a N)) (<-> (nilpotent_element a (zmod_ring n)) (forall (p) (-> (and (in p P) (dvd p n)) (dvd p a))))))
  hard_negative:
    statement: $a$の類が冪零であることと、$a$の素因数がすべて$n$を割ることは同値である。
    reason: $n=6$、$a=2$とすると、$a$の素因数$2$は$6$を割るが、$2^k$は$3$で割り切れないので$6$の倍数にならず、$a$の類は冪零でない。
  target: |
    ∀ (n a : ℕ), n ≠ 0 → (IsNilpotent (a : ZMod n) ↔ ∀ p : ℕ, p.Prime → p ∣ n → p ∣ a)
  proof: |
    by
      intro n a hn
      constructor
      · rintro ⟨k, hk⟩ p hp hpn
        have h1 : n ∣ a ^ k := by
          have : ((a ^ k : ℕ) : ZMod n) = 0 := by push_cast; exact hk
          exact (ZMod.natCast_eq_zero_iff _ _).mp this
        exact hp.dvd_of_dvd_pow (hpn.trans h1)
      · intro h
        refine ⟨n, ?_⟩
        have : ((a ^ n : ℕ) : ZMod n) = 0 := by
          rw [ZMod.natCast_eq_zero_iff]
          rcases eq_or_ne a 0 with rfl | ha
          · simp [hn]
          · rw [← Nat.factorization_le_iff_dvd hn (pow_ne_zero _ ha)]
            intro p
            rw [Nat.factorization_pow]
            simp only [Finsupp.smul_apply, smul_eq_mul]
            by_cases hp : p.Prime ∧ p ∣ n
            · have h1 : 1 ≤ a.factorization p := (hp.1.dvd_iff_one_le_factorization ha).mp (h p hp.1 hp.2)
              have h2 : n.factorization p ≤ n := (Nat.factorization_lt p hn).le
              nlinarith
            · have : n.factorization p = 0 := by
                by_cases hp1 : p.Prime
                · exact Nat.factorization_eq_zero_of_not_dvd (fun hd => hp ⟨hp1, hd⟩)
                · exact Nat.factorization_eq_zero_of_not_prime _ hp1
              omega
        simpa using this
- id: boolean_ring_char_two_commutative
  kind: textbook
  level: 2
  topic: 環論・ブール環
  statement: 1をもつ環のすべての元$x$が$x^2=x$を満たすならば、すべての$x$で$x+x=0$であり、この環は可換である。
  statement_en: If every element x of a ring with identity satisfies x^2 = x, then x + x = 0 for all x and the ring is commutative.
  assumptions:
  - $A$は1をもつ環（可換性は仮定しない）
  - すべての$x\in A$で$x^2=x$
  quantifiers:
  - 任意の環$A$
  conclusion: すべての$x$で$x+x=0$であり、すべての$x,y$で$xy=yx$である。
  answer: |
    $A$を1をもつ環とし、すべての$x\in A$で$x^2=x$とする。

    $x\in A$をとる。$x+x=(x+x)^2=x^2+x^2+x^2+x^2=x+x+x+x$なので、両辺から$x+x$を引いて$x+x=0$である。

    $x,y\in A$をとる。$x+y=(x+y)^2=x^2+xy+yx+y^2=x+xy+yx+y$なので、$xy+yx=0$である。先に示したことから$xy+xy=0$なので、$xy+yx=xy+xy$となり、$yx=xy$である。
  strategy: Apply x^2 = x to x + x and to x + y.
  sketch:
  - 'setup: Assume x^2 = x for every x.'
  - 'derive: Squaring x + x gives x + x = 0.'
  - 'derive: Squaring x + y gives xy + yx = 0.'
  - 'conclude: Since xy + xy = 0, we get xy = yx.'
  openmath: (forall (A) (-> (and (is_ring A) (forall (x) (-> (in x A) (= (^ x 2) x)))) (and (forall (x) (-> (in x A) (= (+ x x) 0))) (forall (x y) (-> (and (in x A) (in y A)) (= (* x y) (* y x)))))))
  hard_negative:
    statement: すべての元が$x^2=x$を満たす環は体である。
    reason: $\mathbb{Z}/2\mathbb{Z}\times\mathbb{Z}/2\mathbb{Z}$はこの条件を満たすが、$(1,0)(0,1)=0$なので整域でもない。
  target: |
    ∀ (A : Type*) [Ring A], (∀ x : A, x * x = x) → (∀ x : A, x + x = 0) ∧ ∀ x y : A, x * y = y * x
  proof: |
    by
      intro A _ h
      have h2 : ∀ x : A, x + x = 0 := by
        intro x
        have := h (x + x)
        simp only [add_mul, mul_add, h x] at this
        have h3 : x + x + (x + x) = (x + x) + 0 := by rw [add_zero]; exact this
        exact add_left_cancel h3
      refine ⟨h2, fun x y => ?_⟩
      have := h (x + y)
      simp only [add_mul, mul_add, h x, h y] at this
      have h4 : x * y + y * x = 0 := by
        have h5 : x + (x * y + y * x) + y = x + 0 + y := by rw [add_zero]; rw [← this]; abel
        exact add_left_cancel (add_right_cancel h5)
      have h6 := h2 (x * y)
      exact add_left_cancel (h6.trans h4.symm)
- id: idempotent_splits_comm_ring
  kind: gap
  level: 3
  topic: 環論・冪等元と直積分解
  statement: 可換環$A$の冪等元$e$について、$A$は$A/(e)\times A/(1-e)$と環同型である。
  statement_en: For an idempotent e of a commutative ring A, the ring A is isomorphic to the product A/(e) x A/(1 - e).
  assumptions:
  - $A$は可換環
  - $e\in A$、$e^2=e$
  quantifiers:
  - 任意の可換環$A$と冪等元$e$
  conclusion: $A\cong A/(e)\times A/(1-e)$である。
  answer: |
    $A$を可換環、$e\in A$を冪等元とする。$I=(e)$、$J=(1-e)$とおく。

    $e+(1-e)=1$なので$I+J=A$である。$x\in I\cap J$なら$x=ea$かつ$x=(1-e)b$と書ける。$e(1-e)=e-e^2=0$より、$x=ea=e^2a=ex=e(1-e)b=0$である。よって$I\cap J=0$である。

    写像$\varphi\colon A\to A/I\times A/J$、$\varphi(x)=(x+I,x+J)$は環準同型であり、核は$I\cap J=0$なので単射である。全射を示す。$a,b\in A$に対し$x=(1-e)a+eb$とおく。$x-a=-ea+eb\in I$、$x-b=(1-e)a-(1-e)b\in J$なので、$\varphi(x)=(a+I,b+J)$である。よって$\varphi$は環同型である。
  strategy: The ideals (e) and (1 - e) are comaximal with zero intersection, and (1 - e)a + eb is an explicit preimage.
  sketch:
  - 'setup: Put I = (e) and J = (1 - e).'
  - 'derive: e + (1 - e) = 1 gives I + J = A.'
  - 'derive: e(1 - e) = 0 gives I ∩ J = 0.'
  - 'construct: The element (1 - e)a + eb maps to the pair of classes of a and b.'
  - 'conclude: The natural map to the product is an isomorphism.'
  openmath: (forall (A e) (-> (and (comm_ring A) (idempotent_element e A)) (ring_isomorphic A (ring_product (quotient_ring A (principal_ideal e)) (quotient_ring A (principal_ideal (- 1 e)))))))
  hard_negative:
    statement: 可換環$A$の任意の元$e$について$A\cong A/(e)\times A/(1-e)$である。
    reason: $A=\mathbb{Z}$、$e=2$とすると$A/(2)\times A/(-1)\cong\mathbb{Z}/2\mathbb{Z}$であり、$\mathbb{Z}$と同型でない。冪等性が必要である。
  target: |
    ∀ (A : Type*) [CommRing A] (e : A), e * e = e → Nonempty (A ≃+* (A ⧸ Ideal.span {e}) × (A ⧸ Ideal.span {1 - e}))
  proof: |
    by
      intro A _ e he
      have hco : IsCoprime (Ideal.span {e}) (Ideal.span {1 - e}) :=
        (Ideal.isCoprime_span_singleton_iff e (1 - e)).mpr ⟨1, 1, by ring⟩
      have hinf : Ideal.span {e} ⊓ Ideal.span {1 - e} = (⊥ : Ideal A) := by
        rw [Ideal.inf_eq_mul_of_isCoprime hco, Ideal.span_singleton_mul_span_singleton]
        have : e * (1 - e) = 0 := by rw [mul_sub, mul_one, he, sub_self]
        rw [this]; simp
      exact ⟨(RingEquiv.quotientBot A).symm.trans ((Ideal.quotEquivOfEq hinf.symm).trans (Ideal.quotientInfEquivQuotientProd _ _ hco))⟩
- id: idempotent_lifts_modulo_nil_kernel
  kind: gap
  level: 3
  topic: 環論・冪等元の持ち上げ
  statement: 環準同型$f\colon A\to B$（$A,B$は1をもつ環で可換とは限らず、$f$は1を1に写す）の核の元がすべて冪零であるとする。$f$の像に属する冪等元$e'$に対し、$f(e)=e'$となる冪等元$e\in A$が存在する。
  statement_en: Let f from A to B be a ring homomorphism of rings with identity, not necessarily commutative, preserving 1, such that every element of the kernel is nilpotent. Every idempotent e' in the image of f has an idempotent preimage e in A.
  assumptions:
  - $A,B$は1をもつ環（可換とは限らない）
  - $f\colon A\to B$は1を1に写す環準同型
  - $\ker f$の元はすべて冪零
  - $e'\in f(A)$は冪等元
  quantifiers:
  - 任意の環$A,B$、環準同型$f$、冪等元$e'$
  conclusion: $e^2=e$かつ$f(e)=e'$となる$e\in A$が存在する。
  answer: |
    $A,B,f$を仮定のとおりとし、$e'\in f(A)$を冪等元とする。$f(a)=e'$となる$a\in A$をとる。$f(a^2-a)=e'^2-e'=0$なので$a^2-a$は$\ker f$の元であり、冪零である。$(a(1-a))^n=0$となる$n\geq 1$をとる。

    $a$と$1-a$は可換なので二項定理が使えて、$1=(a+(1-a))^{2n-1}=\sum_{i=0}^{2n-1}\binom{2n-1}{i}a^{2n-1-i}(1-a)^i$である。$i\leq n-1$の項の和を$e$、$i\geq n$の項の和を$e''$とおく。$e+e''=1$である。

    $e$の各項は$a^n$で割り切れ、$e''$の各項は$(1-a)^n$で割り切れる。$a$と$1-a$は可換なので、$ee''$は$a^n(1-a)^n=(a(1-a))^n=0$の倍数であり、$ee''=0$である。よって$e=e(e+e'')=e^2$である。

    $f(a)=e'$、$f(1-a)=1-e'$であり、$e'(1-e')=0$である。$e$の項のうち$1\leq i\leq n-1$のものは$e'(1-e')$の倍数に写るので$0$に写る。$i=0$の項は$a^{2n-1}$であり、$e'^{2n-1}=e'$に写る。したがって$f(e)=e'$である。
  strategy: Split the binomial expansion of (a + (1 - a))^(2n-1) into two orthogonal parts.
  sketch:
  - 'setup: Pick a with f(a) = e, so a(1 - a) is nilpotent, with n-th power zero.'
  - 'apply_theorem: Expand 1 = (a + (1 - a))^(2n-1) by the binomial theorem.'
  - 'construct: Let e be the sum of the terms with i ≤ n - 1 and e2 the rest.'
  - 'derive: e e2 is a multiple of (a(1 - a))^n, so it is 0 and e is idempotent.'
  - 'derive: Under f only the term a^(2n-1) survives, so f(e) = e prime.'
  - 'conclude: e is an idempotent lift.'
  openmath: (forall (A B f y) (-> (and (is_ring A) (is_ring B) (ring_hom f A B) (forall (x) (-> (in x (ring_kernel f)) (nilpotent_element x A))) (idempotent_element y B) (in y (ring_image f))) (exists (e) (and (idempotent_element e A) (= (fn_value f e) y)))))
  hard_negative:
    statement: 全射環準同型$f\colon A\to B$なら、核の条件なしに$B$の冪等元は$A$の冪等元に持ち上がる。
    reason: $f\colon\mathbb{Z}\to\mathbb{Z}/6\mathbb{Z}$では$3$の類は冪等元だが、$\mathbb{Z}$の冪等元は$0,1$だけで、どちらも$3$の類に写らない。
  target: |
    ∀ (A B : Type*) [Ring A] [Ring B] (f : A →+* B) (y : B), (∀ x ∈ RingHom.ker f, IsNilpotent x) → y * y = y → y ∈ f.range → ∃ e : A, e * e = e ∧ f e = y
  proof: |
    by
      intro A B _ _ f y h he hr
      exact exists_isIdempotentElem_eq_of_ker_isNilpotent f h y hr he
- id: ideal_product_contained_in_intersection
  kind: gap
  level: 2
  topic: 環論・イデアルの積と共通部分
  statement: 可換環のイデアル$I,J$について、積$IJ$は共通部分$I\cap J$に含まれる。
  statement_en: For ideals I and J of a commutative ring, the product IJ is contained in the intersection of I and J.
  assumptions:
  - $A$は可換環
  - $I,J$は$A$のイデアル
  quantifiers:
  - 任意の可換環$A$とイデアル$I,J$
  conclusion: $IJ\subseteq I\cap J$である。
  answer: |
    $A$を可換環、$I,J$をそのイデアルとする。$IJ$は$ab$（$a\in I$、$b\in J$）の形の元の有限和全体である。

    $a\in I$、$b\in J$とする。$I$はイデアルなので$ab\in I$であり、$J$はイデアルなので$ab\in J$である。よって$ab\in I\cap J$である。$I\cap J$は加法で閉じるので、そのような元の有限和も$I\cap J$に属する。したがって$IJ\subseteq I\cap J$である。
  strategy: Each generator ab lies in both ideals by absorption.
  sketch:
  - 'setup: IJ consists of finite sums of products ab with a in I and b in J.'
  - 'derive: Absorption gives ab in I and ab in J.'
  - 'conclude: Finite sums stay in the intersection.'
  openmath: (forall (A I J) (-> (and (comm_ring A) (ideal_of I A) (ideal_of J A)) (subset (ideal_product I J) (inter I J))))
  hard_negative:
    statement: 可換環のイデアル$I,J$について、$IJ=I\cap J$である。
    reason: $\mathbb{Z}$で$I=J=(2)$とすると$IJ=(4)$、$I\cap J=(2)$である。等号には$I+J=A$などの条件が必要である。
  target: |
    ∀ (A : Type*) [CommRing A] (I J : Ideal A), I * J ≤ I ⊓ J
  proof: |
    by
      intro A _ I J
      exact Ideal.mul_le_inf
- id: ideal_pair_elementary_operation
  kind: gap
  level: 2
  topic: 環論・イデアルの生成元
  statement: 可換環の元$a,b,q$について、イデアルの等式$(a+bq,b)=(a,b)$が成り立つ。
  statement_en: For elements a, b and q of a commutative ring, the ideals (a + bq, b) and (a, b) are equal.
  assumptions:
  - $A$は可換環
  - $a,b,q\in A$
  quantifiers:
  - 任意の可換環$A$と元$a,b,q$
  conclusion: $(a+bq,b)=(a,b)$である。
  answer: |
    $A$を可換環、$a,b,q\in A$とする。

    $a+bq$と$b$はどちらも$(a,b)$に属するので、$(a+bq,b)\subseteq(a,b)$である。

    逆に$b\in(a+bq,b)$であり、$a=(a+bq)-bq\in(a+bq,b)$である。よって$(a,b)\subseteq(a+bq,b)$である。
  strategy: Show that each pair of generators lies in the other ideal.
  sketch:
  - 'derive: a + bq and b lie in (a, b).'
  - 'derive: a = (a + bq) - bq and b lie in (a + bq, b).'
  - 'conclude: The two ideals coincide.'
  openmath: (forall (A a b q) (-> (and (comm_ring A) (in a A) (in b A) (in q A)) (= (ideal_sum (principal_ideal (+ a (* b q))) (principal_ideal b)) (ideal_sum (principal_ideal a) (principal_ideal b)))))
  hard_negative:
    statement: 可換環の元$a,b,q$について、$(a+q,b)=(a,b)$である。
    reason: $\mathbb{Z}$で$a=0$、$b=2$、$q=1$とすると$(1,2)=\mathbb{Z}$だが$(0,2)=(2)$である。足す元は$b$の倍数でなければならない。
  target: |
    ∀ (A : Type*) [CommRing A] (a b q : A), Ideal.span {a + b * q, b} = Ideal.span {a, b}
  proof: |
    by
      intro A _ a b q
      ext x
      simp only [Ideal.mem_span_pair]
      constructor
      · rintro ⟨u, v, rfl⟩
        exact ⟨u, u * q + v, by ring⟩
      · rintro ⟨u, v, rfl⟩
        exact ⟨u, v - u * q, by ring⟩
- id: union_of_two_left_ideals_iff_comparable
  kind: gap
  level: 2
  topic: 環論・イデアルの和集合
  statement: 1をもつ環（可換とは限らない）の左イデアル$I,J$について、和集合$I\cup J$が左イデアルであることと、$I\subseteq J$または$J\subseteq I$であることは同値である。
  statement_en: For left ideals I and J of a ring with identity, not necessarily commutative, the union of I and J is a left ideal if and only if one of them contains the other.
  assumptions:
  - $A$は1をもつ環（可換とは限らない）
  - $I,J$は$A$の左イデアル
  quantifiers:
  - 任意の環$A$と左イデアル$I,J$
  conclusion: $I\cup J$が左イデアルであることと、$I\subseteq J$または$J\subseteq I$であることは同値である。
  answer: |
    $A$を1をもつ環、$I,J$を左イデアルとする。

    $I\subseteq J$なら$I\cup J=J$、$J\subseteq I$なら$I\cup J=I$であり、どちらも左イデアルである。

    逆に$I\cup J$が左イデアルであり、$I\not\subseteq J$かつ$J\not\subseteq I$であると仮定する。$x\in I\setminus J$、$y\in J\setminus I$をとる。$x,y\in I\cup J$なので$x+y\in I\cup J$である。$x+y\in I$なら$y=(x+y)-x\in I$となり矛盾する。$x+y\in J$なら$x=(x+y)-y\in J$となり矛盾する。よって$I\subseteq J$または$J\subseteq I$である。
  strategy: If neither ideal contains the other, the sum of an element of each lies in neither.
  sketch:
  - 'derive: If one ideal contains the other, the union is the larger ideal.'
  - 'setup: Otherwise pick x in I outside J and y in J outside I.'
  - 'contradiction: x + y lies in the union, but it can lie in neither I nor J.'
  - 'conclude: Hence the ideals are comparable.'
  openmath: (forall (A I J) (-> (and (is_ring A) (left_ideal_of I A) (left_ideal_of J A)) (<-> (left_ideal_of (union I J) A) (or (subset I J) (subset J I)))))
  hard_negative:
    statement: 可換環のイデアル$I,J$の和集合$I\cup J$はイデアルである。
    reason: $\mathbb{Z}$で$I=(2)$、$J=(3)$とすると$2,3\in I\cup J$だが$2+3=5\notin I\cup J$である。
  target: |
    ∀ (A : Type*) [Ring A] (I J : Ideal A), (∃ K : Ideal A, (K : Set A) = (I : Set A) ∪ (J : Set A)) ↔ I ≤ J ∨ J ≤ I
  proof: |
    by
      intro A _ I J
      constructor
      · rintro ⟨K, hK⟩
        by_contra hcon
        push Not at hcon
        obtain ⟨h1, h2⟩ := hcon
        obtain ⟨x, hxI, hxJ⟩ := SetLike.not_le_iff_exists.mp h1
        obtain ⟨y, hyJ, hyI⟩ := SetLike.not_le_iff_exists.mp h2
        have hxK : x ∈ K := by rw [← SetLike.mem_coe, hK]; exact Or.inl hxI
        have hyK : y ∈ K := by rw [← SetLike.mem_coe, hK]; exact Or.inr hyJ
        have hs : x + y ∈ (K : Set A) := K.add_mem hxK hyK
        rw [hK] at hs
        rcases hs with hs | hs
        · exact hyI ((I.add_mem_iff_right hxI).mp hs)
        · exact hxJ ((J.add_mem_iff_left hyJ).mp hs)
      · rintro (h | h)
        · exact ⟨J, by rw [Set.union_eq_self_of_subset_left h]⟩
        · exact ⟨I, by rw [Set.union_eq_self_of_subset_right h]⟩
- id: ascending_left_ideals_union_is_left_ideal
  kind: gap
  level: 2
  topic: 環論・イデアルの昇鎖
  statement: 1をもつ環（可換とは限らない）の左イデアルの昇鎖$I_0\subseteq I_1\subseteq\cdots$の和集合は左イデアルである。
  statement_en: The union of an ascending chain I_0 ⊆ I_1 ⊆ ... of left ideals of a ring with identity, not necessarily commutative, is a left ideal.
  assumptions:
  - $A$は1をもつ環（可換とは限らない）
  - $I_0\subseteq I_1\subseteq\cdots$は$A$の左イデアルの昇鎖
  quantifiers:
  - 任意の環$A$と左イデアルの昇鎖$(I_n)$
  conclusion: $\bigcup_nI_n$は左イデアルである。
  answer: |
    $A$を1をもつ環、$I_0\subseteq I_1\subseteq\cdots$を左イデアルの昇鎖とし、$U=\bigcup_nI_n$とおく。

    $0\in I_0$なので$0\in U$である。$x,y\in U$なら、$x\in I_m$、$y\in I_n$となる$m,n$がある。$k=\max(m,n)$とすると昇鎖なので$x,y\in I_k$であり、$x+y\in I_k\subseteq U$である。$a\in A$、$x\in I_m$なら$ax\in I_m\subseteq U$である。よって$U$は左イデアルである。
  strategy: Two elements of the union lie in a common member of the chain.
  sketch:
  - 'setup: Put U equal to the union of the I_n.'
  - 'derive: Elements x in I_m and y in I_n both lie in I_k with k = max(m, n).'
  - 'derive: Hence x + y lies in U, and U absorbs left multiplication.'
  - 'conclude: U is a left ideal.'
  openmath: (forall (A I) (-> (and (is_ring A) (forall (n) (-> (in n N) (and (left_ideal_of (ideal_sequence_term I n) A) (subset (ideal_sequence_term I n) (ideal_sequence_term I (+ n 1))))))) (exists (U) (and (left_ideal_of U A) (forall (x) (<-> (in x U) (exists (n) (and (in n N) (in x (ideal_sequence_term I n))))))))))
  hard_negative:
    statement: 任意の左イデアルの族の和集合は左イデアルである。
    reason: $\mathbb{Z}$の$(2)$と$(3)$の和集合は$5=2+3$を含まない。昇鎖であることが必要である。
  target: |
    ∀ (A : Type*) [Ring A] (I : ℕ → Ideal A), Monotone I → ∃ U : Ideal A, (U : Set A) = ⋃ n, (I n : Set A)
  proof: |
    by
      intro A _ I hI
      refine ⟨⨆ n, I n, ?_⟩
      ext x
      simp only [SetLike.mem_coe, Set.mem_iUnion]
      exact Submodule.mem_iSup_of_chain ⟨I, hI⟩ x
- id: surjective_image_of_ideal_is_ideal
  kind: gap
  level: 2
  topic: 環論・環準同型とイデアル
  statement: 可換環の全射環準同型$f\colon A\to B$と$A$のイデアル$I$について、像$f(I)$は$B$のイデアルである。
  statement_en: For a surjective ring homomorphism f from A to B of commutative rings and an ideal I of A, the image f(I) is an ideal of B.
  assumptions:
  - $A,B$は可換環
  - $f\colon A\to B$は全射環準同型
  - $I$は$A$のイデアル
  quantifiers:
  - 任意の可換環$A,B$、全射環準同型$f$、イデアル$I$
  conclusion: $f(I)$は$B$のイデアルである。
  answer: |
    $A,B$を可換環、$f\colon A\to B$を全射環準同型、$I$を$A$のイデアルとする。

    $f(I)$は加法群の準同型による部分群の像なので、$B$の加法部分群である。

    $b\in B$、$x\in I$をとる。$f$は全射なので$b=f(a)$となる$a\in A$がある。$bf(x)=f(a)f(x)=f(ax)$であり、$ax\in I$なので$bf(x)\in f(I)$である。よって$f(I)$は$B$のイデアルである。
  strategy: Surjectivity lets every multiplier in B be pulled back to A.
  sketch:
  - 'derive: f(I) is an additive subgroup of B.'
  - 'setup: For b in B choose a in A with f(a) = b.'
  - 'derive: b f(x) = f(ax) lies in f(I).'
  - 'conclude: f(I) is an ideal.'
  openmath: (forall (A B f I) (-> (and (comm_ring A) (comm_ring B) (ring_hom f A B) (surjective f) (ideal_of I A)) (exists (J) (and (ideal_of J B) (forall (y) (<-> (in y J) (exists (x) (and (in x I) (= (fn_value f x) y)))))))))
  hard_negative:
    statement: 任意の環準同型の像$f(I)$は終域のイデアルである。
    reason: 包含写像$\mathbb{Z}\to\mathbb{Q}$で$I=\mathbb{Z}$とすると、$\mathbb{Z}$は$\mathbb{Q}$のイデアルでない。全射性が必要である。
  target: |
    ∀ (A B : Type*) [CommRing A] [CommRing B] (f : A →+* B), Function.Surjective f → ∀ I : Ideal A, ∃ J : Ideal B, (J : Set B) = f '' (I : Set A)
  proof: |
    by
      intro A B _ _ f hf I
      refine ⟨I.map f, ?_⟩
      ext y
      simp only [SetLike.mem_coe, Set.mem_image]
      exact Ideal.mem_map_iff_of_surjective f hf
- id: quotient_ideal_prime_maximal_correspondence
  kind: gap
  level: 3
  topic: 環論・商環のイデアル
  statement: 可換環$A$のイデアル$I\subseteq J$について、$J$が素イデアルであることと$J/I$が$A/I$の素イデアルであることは同値である。極大イデアルについても同様である。
  statement_en: For ideals I ⊆ J of a commutative ring A, J is prime if and only if J/I is a prime ideal of A/I, and J is maximal if and only if J/I is a maximal ideal of A/I.
  assumptions:
  - $A$は可換環
  - $I,J$は$A$のイデアルで$I\subseteq J$
  quantifiers:
  - 任意の可換環$A$とイデアル$I\subseteq J$
  conclusion: $J$が素であることと$J/I$が素であることは同値であり、$J$が極大であることと$J/I$が極大であることは同値である。
  answer: |
    $A$を可換環、$I\subseteq J$をイデアルとし、$\pi\colon A\to A/I$を射影とする。$\pi(J)=J/I$である。$x\in A$について、$\pi(x)\in J/I$と$x\in J$は同値である。実際$\pi(x)=\pi(y)$、$y\in J$なら$x-y\in I\subseteq J$なので$x\in J$である。

    素イデアルについて示す。$J=A$と$J/I=A/I$は同値である。$x,y\in A$に対し、$\pi(x)\pi(y)\in J/I$は$xy\in J$と同値であり、$\pi(x)\in J/I$は$x\in J$と同値である。$\pi$は全射なので$A/I$の元はすべて$\pi(x)$の形である。したがって素イデアルの条件は$J$と$J/I$で同値である。

    極大イデアルについて示す。$A/I$のイデアルと、$I$を含む$A$のイデアルは、$K\mapsto\pi(K)$によって包含を保って一対一に対応する。$J\subseteq K$ならば$I\subseteq K$なので、$J$を含むイデアルはすべてこの対応の範囲にある。よって$J$と全体の間にイデアルがないことと、$J/I$と$A/I$の間にイデアルがないことは同値である。
  strategy: Membership in J/I of the class of x is equivalent to membership of x in J; for maximality use the ideal correspondence.
  sketch:
  - 'setup: Let π be the projection to A/I.'
  - 'derive: π(x) lies in J/I if and only if x lies in J, because I ⊆ J.'
  - 'derive: The primality condition transfers through the surjection π.'
  - 'apply_theorem: Ideals of A/I correspond to ideals of A containing I.'
  - 'conclude: Maximality transfers through this correspondence.'
  openmath: (forall (A I J) (-> (and (comm_ring A) (ideal_of I A) (ideal_of J A) (subset I J)) (and (<-> (prime_ideal (ideal_map (ring_quotient_map I) J) (quotient_ring A I)) (prime_ideal J A)) (<-> (maximal_ideal (ideal_map (ring_quotient_map I) J) (quotient_ring A I)) (maximal_ideal J A)))))
  hard_negative:
    statement: $I\subseteq J$の仮定なしに、$J$が素イデアルなら$A/I$における$J$の像も素イデアルである。
    reason: $A=\mathbb{Z}$、$I=(6)$、$J=(5)$とすると、$5$は$\mathbb{Z}/6\mathbb{Z}$の単元なので$J$の像は全体になり、素イデアルでない。
  target: |
    ∀ (A : Type*) [CommRing A] (I J : Ideal A), I ≤ J → ((J.map (Ideal.Quotient.mk I)).IsPrime ↔ J.IsPrime) ∧ ((J.map (Ideal.Quotient.mk I)).IsMaximal ↔ J.IsMaximal)
  proof: |
    by
      intro A _ I J h
      have hs := Ideal.Quotient.mk_surjective (I := I)
      have hc : (J.map (Ideal.Quotient.mk I)).comap (Ideal.Quotient.mk I) = J := by
        rw [Ideal.comap_map_of_surjective _ hs, ← RingHom.ker_eq_comap_bot, Ideal.mk_ker]
        exact sup_eq_left.mpr h
      have hker : RingHom.ker (Ideal.Quotient.mk I) ≤ J := by rwa [Ideal.mk_ker]
      constructor
      · constructor
        · intro hp
          rw [← hc]
          exact Ideal.comap_isPrime _ _
        · intro hp
          exact Ideal.map_isPrime_of_surjective hs hker
      · constructor
        · intro hm
          rw [← hc]
          exact Ideal.comap_isMaximal_of_surjective _ hs
        · intro hm
          rcases Ideal.map_eq_top_or_isMaximal_of_surjective _ hs hm with h1 | h1
          · exfalso
            apply hm.ne_top
            rw [← hc, h1, Ideal.comap_top]
          · exact h1
- id: second_isomorphism_subring_ideal
  kind: textbook
  level: 3
  topic: 環論・準同型定理
  statement: 可換環$A$の部分環$S$（$A$の1を含む）とイデアル$I$について、$S/(S\cap I)$は$S$の$A/I$における像、すなわち$(S+I)/I$と環同型である。
  statement_en: For a subring S of a commutative ring A containing 1 and an ideal I of A, the quotient S/(S ∩ I) is isomorphic to the image of S in A/I, that is, to (S + I)/I.
  assumptions:
  - $A$は可換環
  - $S$は$A$の部分環で$A$の1を含む
  - $I$は$A$のイデアル
  quantifiers:
  - 任意の可換環$A$、部分環$S$、イデアル$I$
  conclusion: $S/(S\cap I)\cong(S+I)/I$である。
  answer: |
    $A$を可換環、$S$を$A$の1を含む部分環、$I$をイデアルとする。$\pi\colon A\to A/I$を射影とし、$f\colon S\to A/I$をその制限とする。$f$は環準同型である。

    $f$の核は、$x\in S$で$x\in I$となるもの全体、すなわち$S\cap I$である。$f$の像は$\{s+I\mid s\in S\}$であり、これは$(S+I)/I$に等しい。

    環の第一同型定理より、$S/\ker f$は$f$の像と環同型である。よって$S/(S\cap I)\cong(S+I)/I$である。
  strategy: Apply the first isomorphism theorem to the restriction of the projection A → A/I to S.
  sketch:
  - 'construct: Restrict the projection A → A/I to f on S.'
  - 'derive: The kernel of f is S ∩ I.'
  - 'derive: The image of f is the set of classes of elements of S, which is (S + I)/I.'
  - 'apply_theorem: The first isomorphism theorem gives the claim.'
  openmath: (forall (A S I) (-> (and (comm_ring A) (subring_of S A) (ideal_of I A)) (ring_isomorphic (quotient_ring S (inter S I)) (subring_image_in_quotient S I))))
  hard_negative:
    statement: $S/(S\cap I)$は$A/I$と環同型である。
    reason: $A=\mathbb{Z}[X]$、$S=\mathbb{Z}$、$I=(2)$とすると、$S/(S\cap I)\cong\mathbb{Z}/2\mathbb{Z}$だが$A/I\cong(\mathbb{Z}/2\mathbb{Z})[X]$である。
  target: |
    ∀ (A : Type*) [CommRing A] (S : Subring A) (I : Ideal A), Nonempty ((S ⧸ I.comap S.subtype) ≃+* (S.map (Ideal.Quotient.mk I)))
  proof: |
    by
      intro A _ S I
      let f : S →+* A ⧸ I := (Ideal.Quotient.mk I).comp S.subtype
      have hk : RingHom.ker f = I.comap S.subtype := by
        ext x
        simp [f, RingHom.mem_ker, Ideal.Quotient.eq_zero_iff_mem]
      have hr : f.range = S.map (Ideal.Quotient.mk I) := by
        ext y
        simp [f, RingHom.mem_range, Subring.mem_map]
      exact ⟨(Ideal.quotEquivOfEq hk.symm).trans ((RingHom.quotientKerEquivRange f).trans (RingEquiv.subringCongr hr))⟩
- id: comaximal_ideals_products_and_powers
  kind: gap
  level: 3
  topic: 環論・互いに素なイデアル
  statement: 可換環$A$のイデアルについて、$I+J=A$かつ$I+K=A$ならば$I+JK=A$である。また$I+J=A$ならば、任意の自然数$m,n$で$I^m+J^n=A$である。
  statement_en: For ideals of a commutative ring A, if I + J = A and I + K = A, then I + JK = A; and if I + J = A, then I^m + J^n = A for all natural numbers m and n.
  assumptions:
  - $A$は可換環
  - $I,J,K$は$A$のイデアル
  - $m,n$は自然数
  quantifiers:
  - 任意の可換環$A$、イデアル$I,J,K$、自然数$m,n$
  conclusion: $I+J=A$かつ$I+K=A$なら$I+JK=A$であり、$I+J=A$なら$I^m+J^n=A$である。
  answer: |
    $A$を可換環、$I,J,K$をイデアル、$m,n$を自然数とする。$I^0=A$とする。

    $I+J=A$、$I+K=A$とする。$1=x+y$（$x\in I$、$y\in J$）、$1=x'+z$（$x'\in I$、$z\in K$）と書ける。$1=(x+y)(x'+z)=x(x'+z)+yx'+yz$である。右辺の最初の2項は$I$に属し、$yz\in JK$である。よって$1\in I+JK$であり、$I+JK=A$である。

    $I+J=A$とする。$n$についての帰納法で$I+J^n=A$を示す。$n=0$では$J^0=A$なので成り立つ。$I+J^n=A$なら、前半を$K=J^n$に用いて$I+J^{n+1}=A$である。

    $I+J^n=A$に同じ議論を$I$の冪について適用すると、$m$についての帰納法で$I^m+J^n=A$である。
  strategy: Expand the product of two expressions of 1; powers follow by induction on the exponents.
  sketch:
  - 'setup: Write 1 = x + y and 1 = x2 + z with x, x2 in I, y in J, z in K.'
  - 'derive: Multiplying gives 1 in I + JK.'
  - 'induction: Apply this repeatedly to get I + J^n = A.'
  - 'induction: Apply it again in the first variable to get I^m + J^n = A.'
  openmath: (forall (A I J K m n) (-> (and (comm_ring A) (ideal_of I A) (ideal_of J A) (ideal_of K A) (in m N) (in n N)) (and (-> (and (= (ideal_sum I J) (unit_ideal A)) (= (ideal_sum I K) (unit_ideal A))) (= (ideal_sum I (ideal_product J K)) (unit_ideal A))) (-> (= (ideal_sum I J) (unit_ideal A)) (= (ideal_sum (ideal_power I m) (ideal_power J n)) (unit_ideal A))))))
  hard_negative:
    statement: $I+JK=A$ならば、$J=A$または$K=A$である。
    reason: $\mathbb{Z}$で$I=(5)$、$J=(2)$、$K=(3)$とすると$I+JK=(5)+(6)=\mathbb{Z}$だが、$J,K$はどちらも全体でない。
  target: |
    ∀ (A : Type*) [CommRing A] (I J K : Ideal A) (m n : ℕ), (I ⊔ J = ⊤ → I ⊔ K = ⊤ → I ⊔ J * K = ⊤) ∧ (I ⊔ J = ⊤ → I ^ m ⊔ J ^ n = ⊤)
  proof: |
    by
      intro A _ I J K m n
      constructor
      · intro h1 h2
        rw [← Ideal.isCoprime_iff_sup_eq] at *
        exact h1.mul_right h2
      · intro h
        rw [← Ideal.isCoprime_iff_sup_eq] at *
        exact h.pow
- id: nilpotent_ideals_sum_is_nilpotent
  kind: gap
  level: 3
  topic: 環論・冪零イデアル
  statement: 可換環のイデアル$I,J$が$I^m=0$、$J^n=0$を満たすならば、$(I+J)^{m+n}=0$である。
  statement_en: If ideals I and J of a commutative ring satisfy I^m = 0 and J^n = 0, then (I + J)^(m+n) = 0.
  assumptions:
  - $A$は可換環
  - $I,J$は$A$のイデアル
  - $I^m=0$、$J^n=0$
  quantifiers:
  - 任意の可換環$A$、イデアル$I,J$、自然数$m,n$
  conclusion: $(I+J)^{m+n}=0$である。
  answer: |
    $A$を可換環、$I,J$をイデアル、$m,n$を$I^m=0$、$J^n=0$を満たす自然数とする。

    $(I+J)^{m+n}$は、$I\cup J$の元を$m+n$個掛けた積の有限和全体である。$A$は可換なので、そのような積は$I$の元$k$個と$J$の元$m+n-k$個の積に並べ替えられ、$I^kJ^{m+n-k}$に属する。

    $k\geq m$なら$I^k\subseteq I^m=0$なのでこの積は$0$である。$k<m$なら$m+n-k>n$なので$J^{m+n-k}\subseteq J^n=0$であり、この積は$0$である。したがって$(I+J)^{m+n}=0$である。
  strategy: Expand products of elements of I ∪ J; each product has at least m factors in I or at least n factors in J.
  sketch:
  - 'setup: (I + J)^(m+n) is spanned by products of m + n elements of I ∪ J.'
  - 'derive: Each such product lies in I^k J^(m+n-k) for some k.'
  - 'case_split: If k ≥ m it lies in I^m = 0; otherwise it lies in J^n = 0.'
  - 'conclude: Hence (I + J)^(m+n) = 0.'
  openmath: (forall (A I J m n) (-> (and (comm_ring A) (ideal_of I A) (ideal_of J A) (in m N) (in n N) (= (ideal_power I m) (zero_ideal A)) (= (ideal_power J n) (zero_ideal A))) (= (ideal_power (ideal_sum I J) (+ m n)) (zero_ideal A))))
  hard_negative:
    statement: 可換環のイデアル$I,J$が$I^m=0$、$J^n=0$を満たすならば、$(I+J)^{\max(m,n)}=0$である。
    reason: $A=\mathbb{Q}[X,Y]/(X^2,Y^2)$、$I=(X)$、$J=(Y)$では$I^2=J^2=0$だが、$(X+Y)^2=2XY\neq 0$である。
  target: |
    ∀ (A : Type*) [CommRing A] (I J : Ideal A) (m n : ℕ), I ^ m = ⊥ → J ^ n = ⊥ → (I ⊔ J) ^ (m + n) = ⊥
  proof: |
    by
      intro A _ I J m n h1 h2
      rw [eq_bot_iff]
      refine Ideal.sup_pow_add_le_pow_sup_pow.trans ?_
      rw [h1, h2]; simp
- id: product_ring_ideals_are_products
  kind: gap
  level: 3
  topic: 環論・直積環のイデアル
  statement: 可換環の直積$A\times B$のイデアルは、$A$のイデアル$I$と$B$のイデアル$J$により$I\times J$と書ける。
  statement_en: Every ideal of a product A x B of commutative rings has the form I x J with I an ideal of A and J an ideal of B.
  assumptions:
  - $A,B$は可換環
  - $L$は$A\times B$のイデアル
  quantifiers:
  - 任意の可換環$A,B$とイデアル$L$
  conclusion: $L=I\times J$となる$A$のイデアル$I$と$B$のイデアル$J$が存在する。
  answer: |
    $A,B$を可換環、$L$を$A\times B$のイデアルとする。$I=\{a\in A\mid(a,0)\in L\}$、$J=\{b\in B\mid(0,b)\in L\}$とおく。

    $I$は$A$のイデアルである。実際$(a,0),(a',0)\in L$なら$(a+a',0)\in L$であり、$c\in A$なら$(ca,0)=(c,0)(a,0)\in L$である。同様に$J$は$B$のイデアルである。

    $I\times J\subseteq L$を示す。$a\in I$、$b\in J$なら$(a,b)=(a,0)+(0,b)\in L$である。

    $L\subseteq I\times J$を示す。$(a,b)\in L$なら$(a,0)=(1,0)(a,b)\in L$、$(0,b)=(0,1)(a,b)\in L$なので、$a\in I$、$b\in J$である。よって$L=I\times J$である。
  strategy: Multiply by the idempotents (1, 0) and (0, 1) to separate the components.
  sketch:
  - 'construct: Let I be the a with (a, 0) in L and J the b with (0, b) in L.'
  - 'derive: I and J are ideals.'
  - 'derive: (a, b) = (a, 0) + (0, b) gives I x J ⊆ L.'
  - 'derive: Multiplying by (1, 0) and (0, 1) gives L ⊆ I x J.'
  - 'conclude: L = I x J.'
  openmath: (forall (A B L) (-> (and (comm_ring A) (comm_ring B) (ideal_of L (ring_product A B))) (exists (I J) (and (ideal_of I A) (ideal_of J B) (= L (ideal_direct_product I J))))))
  hard_negative:
    statement: 直積環$A\times B$の部分環は、$A$の部分環$S$と$B$の部分環$T$により$S\times T$と書ける。
    reason: $\mathbb{Z}\times\mathbb{Z}$の対角$\{(n,n)\}$は1を含む部分環だが、$S\times T$の形でない。
  target: |
    ∀ (A B : Type*) [CommRing A] [CommRing B] (L : Ideal (A × B)), ∃ (I : Ideal A) (J : Ideal B), L = Ideal.prod I J
  proof: |
    by
      intro A B _ _ L
      exact ⟨_, _, Ideal.ideal_prod_eq L⟩
- id: product_ring_prime_ideals
  kind: gap
  level: 3
  topic: 環論・直積環のイデアル
  statement: 可換環の直積$A\times B$の素イデアルは、$A$の素イデアル$p$による$p\times B$と、$B$の素イデアル$q$による$A\times q$の形のものに限る。逆にこれらは素イデアルである。
  statement_en: The prime ideals of a product A x B of commutative rings are exactly the ideals p x B with p a prime ideal of A and the ideals A x q with q a prime ideal of B.
  assumptions:
  - $A,B$は可換環
  - $L$は$A\times B$のイデアル
  quantifiers:
  - 任意の可換環$A,B$とイデアル$L$
  conclusion: $L$が素イデアルであることと、$L=p\times B$（$p$は素イデアル）または$L=A\times q$（$q$は素イデアル）であることは同値である。
  answer: |
    $A,B$を可換環、$L$を$A\times B$のイデアルとする。$L=I\times J$と書ける。実際$I=\{a\mid(a,0)\in L\}$、$J=\{b\mid(0,b)\in L\}$とおくと、$(a,b)\in L$は$(1,0)(a,b)\in L$かつ$(0,1)(a,b)\in L$と同値である。

    $L$が素イデアルとする。$(1,0)(0,1)=0\in L$なので、$(1,0)\in L$または$(0,1)\in L$である。両方が$L$に属すると$(1,1)\in L$となり、$L$が全体になって矛盾する。

    $(0,1)\in L$のとき$J=B$であり、$L=I\times B$である。$a,a'\in A$に対し$aa'\in I$は$(a,1)(a',1)\in L$と同値であり、$a\in I$は$(a,1)\in L$と同値である。$L\neq A\times B$より$I\neq A$である。よって$I$は素イデアルである。$(1,0)\in L$のときも同様に$L=A\times J$で、$J$は素イデアルである。

    逆を示す。$p$を$A$の素イデアルとする。$(a,b)(a',b')\in p\times B$は$aa'\in p$と同値であり、$a\in p$または$a'\in p$となるので、$(a,b)$または$(a',b')$が$p\times B$に属する。$p\neq A$より$p\times B$は全体でない。よって$p\times B$は素イデアルである。$A\times q$についても同様である。
  strategy: The relation (1, 0)(0, 1) = 0 forces a prime ideal to contain exactly one of the two idempotents.
  sketch:
  - 'setup: Write L = I x J using the idempotents (1, 0) and (0, 1).'
  - 'derive: Since (1, 0)(0, 1) = 0, exactly one idempotent lies in a prime L.'
  - 'case_split: If (0, 1) is in L, then L = I x B and I is prime; the other case is symmetric.'
  - 'derive: Conversely p x B and A x q satisfy the definition of a prime ideal.'
  - 'conclude: This gives the classification.'
  openmath: (forall (A B L) (-> (and (comm_ring A) (comm_ring B) (ideal_of L (ring_product A B))) (<-> (prime_ideal L (ring_product A B)) (or (exists (p) (and (prime_ideal p A) (= L (ideal_direct_product p (unit_ideal B))))) (exists (q) (and (prime_ideal q B) (= L (ideal_direct_product (unit_ideal A) q))))))))
  hard_negative:
    statement: $A$の素イデアル$p$と$B$の素イデアル$q$について、$p\times q$は$A\times B$の素イデアルである。
    reason: $\mathbb{Z}\times\mathbb{Z}$で$(2)\times(3)$は$(2,1)(1,3)=(2,3)$を含むが、$(2,1),(1,3)$をどちらも含まないので素イデアルでない。
  target: |
    ∀ (A B : Type*) [CommRing A] [CommRing B] (L : Ideal (A × B)), L.IsPrime ↔ (∃ p : Ideal A, p.IsPrime ∧ L = Ideal.prod p ⊤) ∨ (∃ q : Ideal B, q.IsPrime ∧ L = Ideal.prod ⊤ q)
  proof: |
    by
      intro A B _ _ L
      exact Ideal.ideal_prod_prime L
- id: finite_comm_ring_prime_is_maximal
  kind: gap
  level: 3
  topic: 環論・素イデアルと極大イデアル
  statement: 有限可換環の素イデアルは極大イデアルである。
  statement_en: Every prime ideal of a finite commutative ring is a maximal ideal.
  assumptions:
  - $A$は有限可換環
  - $p$は$A$の素イデアル
  quantifiers:
  - 任意の有限可換環$A$と素イデアル$p$
  conclusion: $p$は極大イデアルである。
  answer: |
    $A$を有限可換環、$p$を素イデアルとする。$A/p$は整域であり、$A$が有限なので有限集合である。

    $x\in A/p$を零でない元とする。$A/p$は整域なので、$y\mapsto xy$は単射である。有限集合上の単射は全射なので、$xy=1$となる$y$がある。よって$A/p$は体である。商環が体なので$p$は極大イデアルである。
  strategy: The quotient is a finite integral domain, hence a field.
  sketch:
  - 'setup: A/p is a finite integral domain.'
  - 'derive: Multiplication by a nonzero x is injective, hence surjective.'
  - 'derive: So x has an inverse and A/p is a field.'
  - 'conclude: Therefore p is maximal.'
  openmath: (forall (A p) (-> (and (comm_ring A) (finite_ring A) (prime_ideal p A)) (maximal_ideal p A)))
  hard_negative:
    statement: 可換環の素イデアルは極大イデアルである。
    reason: $\mathbb{Z}$の零イデアルは素イデアルだが、$(2)$に真に含まれるので極大でない。有限性が必要である。
  target: |
    ∀ (A : Type*) [CommRing A] [Finite A] (p : Ideal A), p.IsPrime → p.IsMaximal
  proof: |
    by
      intro A _ _ p hp
      have : IsDomain (A ⧸ p) := (Ideal.Quotient.isDomain_iff_prime p).mpr hp
      have : Finite (A ⧸ p) := Finite.of_surjective (Ideal.Quotient.mk p) Ideal.Quotient.mk_surjective
      exact Ideal.Quotient.maximal_of_isField p (Finite.isField_of_domain _)
- id: rationals_unique_ring_hom_char_zero
  kind: gap
  level: 3
  topic: 環論・素体と環準同型
  statement: 標数$0$の体$K$に対し、$\mathbb{Q}$から$K$への環準同型はちょうど一つ存在する。
  statement_en: For a field K of characteristic zero, there is exactly one ring homomorphism from Q to K.
  assumptions:
  - $K$は標数$0$の体
  - 環準同型は1を1に写す
  quantifiers:
  - 任意の標数$0$の体$K$
  conclusion: 環準同型$\mathbb{Q}\to K$はちょうど一つ存在する。
  answer: |
    $K$を標数$0$の体とする。整数$n$の$K$での像を$n\cdot 1$と書く。標数が$0$なので、$n\neq 0$なら$n\cdot 1\neq 0$である。

    存在を示す。$f(a/b)=(a\cdot 1)(b\cdot 1)^{-1}$（$a,b\in\mathbb{Z}$、$b\neq 0$）と定める。$a/b=c/d$なら$ad=bc$なので$(a\cdot 1)(d\cdot 1)=(b\cdot 1)(c\cdot 1)$であり、値は表し方によらない。$a/b+c/d=(ad+bc)/(bd)$と$(a/b)(c/d)=ac/(bd)$を$K$で計算すると、$f$は和と積を保つ。また$f(1)=1$である。

    一意性を示す。$g\colon\mathbb{Q}\to K$を環準同型とする。$g(1)=1$と和を保つことから、$g(n)=n\cdot 1$が整数$n$で成り立つ。$b\neq 0$なら$g(b)g(1/b)=1$なので、$g(a/b)=g(a)g(b)^{-1}=f(a/b)$である。
  strategy: The values on integers are forced by g(1) = 1, and inverses force the values on fractions.
  sketch:
  - 'construct: Define f(a/b) = (a·1)(b·1)^{-1}, using that b·1 ≠ 0 in characteristic zero.'
  - 'derive: The value is independent of the representation and f is a ring map.'
  - 'setup: Let g be any ring homomorphism from Q to K.'
  - 'derive: g agrees with n·1 on integers and hence with f on fractions.'
  - 'conclude: f is the only homomorphism.'
  openmath: (forall (K) (-> (and (is_field K) (ring_characteristic K 0)) (exists (f) (and (ring_hom f Q K) (forall (g) (-> (ring_hom g Q K) (= g f)))))))
  hard_negative:
    statement: 任意の体$K$に対し、$\mathbb{Q}$から$K$への環準同型が存在する。
    reason: 標数$p>0$の体$K$への環準同型$f$があると、$f(p)=p\cdot 1=0$なので$1=f(p)f(1/p)=0$となり矛盾する。
  target: |
    ∀ (K : Type*) [Field K] [CharZero K], Nonempty (ℚ →+* K) ∧ ∀ f g : ℚ →+* K, f = g
  proof: |
    by
      intro K _ _
      exact ⟨⟨Rat.castHom K⟩, fun f g => RingHom.ext_rat f g⟩
- id: zmod_ring_hom_exists_iff_cast_zero
  kind: gap
  level: 3
  topic: 環論・環準同型と標数
  statement: 非負整数$n$と1をもつ環$A$について、環準同型$\mathbb{Z}/n\mathbb{Z}\to A$（1を1に写す）が存在することと、$A$で$n\cdot 1=0$であることは同値である。さらにそのような準同型は高々一つである。
  statement_en: For a nonnegative integer n and a ring A with identity, a ring homomorphism from Z/nZ to A preserving 1 exists if and only if n·1 = 0 in A, and there is at most one such homomorphism.
  assumptions:
  - $n$は非負整数
  - $A$は1をもつ環（可換とは限らない）
  - 環準同型は1を1に写す
  quantifiers:
  - 任意の非負整数$n$と環$A$
  conclusion: 環準同型$\mathbb{Z}/n\mathbb{Z}\to A$の存在は$n\cdot 1=0$と同値であり、準同型は高々一つである。
  answer: |
    $n$を非負整数、$A$を1をもつ環とする。

    $f\colon\mathbb{Z}/n\mathbb{Z}\to A$を環準同型とする。$f(1)=1$と和を保つことから、整数$k$について$f(k+n\mathbb{Z})=k\cdot 1$である。よって$f$は値が決まっていて高々一つである。また$k=n$とすると$n\cdot 1=f(0)=0$である。

    逆に$n\cdot 1=0$とする。環準同型$\varphi\colon\mathbb{Z}\to A$、$\varphi(k)=k\cdot 1$を考える。$\varphi(n)=0$なので$n\mathbb{Z}\subseteq\ker\varphi$である。よって$\varphi$は$\mathbb{Z}/n\mathbb{Z}\to A$を誘導する。
  strategy: Values on classes are forced by f(1) = 1; existence comes from the universal property of the quotient of Z.
  sketch:
  - 'derive: Any homomorphism sends the class of k to k·1, which gives uniqueness.'
  - 'derive: Taking k = n gives n·1 = 0.'
  - 'construct: If n·1 = 0, the map k to k·1 from Z kills nZ.'
  - 'conclude: It induces a homomorphism from Z/nZ.'
  openmath: (forall (n A) (-> (and (in n N) (is_ring A)) (and (<-> (exists (f) (ring_hom f (zmod_ring n) A)) (= (ring_nat_cast n A) 0)) (forall (f g) (-> (and (ring_hom f (zmod_ring n) A) (ring_hom g (zmod_ring n) A)) (= f g))))))
  hard_negative:
    statement: $\mathbb{Z}/m\mathbb{Z}\to\mathbb{Z}/n\mathbb{Z}$の環準同型が存在するための条件は$m\mid n$である。
    reason: 向きが逆である。$\mathbb{Z}/2\mathbb{Z}\to\mathbb{Z}/4\mathbb{Z}$では$2\cdot 1\neq 0$なので環準同型はなく、$\mathbb{Z}/4\mathbb{Z}\to\mathbb{Z}/2\mathbb{Z}$にはある。条件は$n\mid m$である。
  target: |
    ∀ (A : Type*) [Ring A] (n : ℕ), (Nonempty (ZMod n →+* A) ↔ (n : A) = 0) ∧ ∀ f g : ZMod n →+* A, f = g
  proof: |
    by
      intro A _ n
      refine ⟨⟨?_, ?_⟩, fun f g => Subsingleton.elim f g⟩
      · rintro ⟨f⟩
        rw [← map_natCast f n, ZMod.natCast_self, map_zero]
      · intro h
        exact ⟨ZMod.castHom ((ringChar.spec A n).mp h) A⟩
- id: real_ring_endomorphism_is_identity
  kind: textbook
  level: 2
  topic: 環論・環準同型
  statement: 環準同型$\mathbb{R}\to\mathbb{R}$（1を1に写す）は恒等写像だけである。
  statement_en: The identity map is the only ring homomorphism from R to R preserving 1.
  assumptions:
  - $f\colon\mathbb{R}\to\mathbb{R}$は1を1に写す環準同型
  quantifiers:
  - 任意の環準同型$f\colon\mathbb{R}\to\mathbb{R}$
  conclusion: $f$は恒等写像である。
  answer: |
    $f\colon\mathbb{R}\to\mathbb{R}$を1を1に写す環準同型とする。

    $f(1)=1$と和を保つことから整数$n$で$f(n)=n$である。$b\neq 0$なら$f(b)f(1/b)=f(1)=1$なので$f(a/b)=a/b$である。よって$f$は有理数を固定する。

    $x\geq 0$なら$x=y^2$となる実数$y$があり、$f(x)=f(y)^2\geq 0$である。したがって$x\leq x'$なら$f(x'-x)\geq 0$より$f(x)\leq f(x')$であり、$f$は単調増加である。

    ある$x$で$f(x)\neq x$と仮定する。$x<f(x)$なら、$x<r<f(x)$となる有理数$r$をとると、単調性より$f(x)\leq f(r)=r<f(x)$となり矛盾する。$f(x)<x$なら、$f(x)<r<x$となる有理数$r$をとると、$r=f(r)\leq f(x)<r$となり矛盾する。よって$f$は恒等写像である。
  strategy: The map fixes the rationals and preserves order because nonnegative reals are squares; density of the rationals finishes.
  sketch:
  - 'derive: f fixes every rational number.'
  - 'derive: Nonnegative reals are squares, so f preserves order.'
  - 'contradiction: If f(x) ≠ x, a rational between x and f(x) contradicts monotonicity.'
  - 'conclude: f is the identity.'
  openmath: (forall (f) (-> (ring_hom f R R) (forall (x) (-> (in x R) (= (fn_value f x) x)))))
  hard_negative:
    statement: 環準同型$\mathbb{C}\to\mathbb{C}$は恒等写像だけである。
    reason: 複素共役は恒等写像でない環準同型である。$\mathbb{R}$の場合の証明は順序を使っている。
  target: |
    ∀ f : ℝ →+* ℝ, f = RingHom.id ℝ
  proof: |
    by
      intro f
      exact Subsingleton.elim f (RingHom.id ℝ)
- id: polynomial_ring_universal_property
  kind: textbook
  level: 2
  topic: 環論・多項式環の普遍性
  statement: 可換環の環準同型$\varphi\colon A\to B$と$s\in B$に対し、$f(a)=\varphi(a)$（$a\in A$）かつ$f(X)=s$を満たす環準同型$f\colon A[X]\to B$がちょうど一つ存在する。
  statement_en: For a ring homomorphism φ from A to B of commutative rings and s in B, there is exactly one ring homomorphism f from A[X] to B with f(a) = φ(a) for a in A and f(X) = s.
  assumptions:
  - $A,B$は可換環
  - $\varphi\colon A\to B$は環準同型
  - $s\in B$
  quantifiers:
  - 任意の可換環$A,B$、環準同型$\varphi$、元$s$
  conclusion: $f|_A=\varphi$かつ$f(X)=s$を満たす環準同型$f\colon A[X]\to B$がちょうど一つ存在する。
  answer: |
    $A,B$を可換環、$\varphi\colon A\to B$を環準同型、$s\in B$とする。

    存在を示す。多項式$g=\sum_ia_iX^i$に対し$f(g)=\sum_i\varphi(a_i)s^i$と定める。$g$の係数は一意に決まるので$f$は写像として定まる。和を保つことは定義から分かる。積については、$gh$の$X^k$の係数は$\sum_{i+j=k}a_ib_j$であり、$B$が可換なので$f(g)f(h)=\sum_k\big(\sum_{i+j=k}\varphi(a_i)\varphi(b_j)\big)s^k=f(gh)$である。$f(1)=1$、$f(a)=\varphi(a)$、$f(X)=s$も成り立つ。

    一意性を示す。$f'$が同じ条件を満たす環準同型なら、$f'(\sum_ia_iX^i)=\sum_if'(a_i)f'(X)^i=\sum_i\varphi(a_i)s^i=f(\sum_ia_iX^i)$である。
  strategy: Define the map on coefficients by substitution; A and X generate A[X], which gives uniqueness.
  sketch:
  - 'construct: Put f(sum a_i X^i) = sum φ(a_i) s^i.'
  - 'derive: Commutativity of B shows that f preserves products.'
  - 'setup: Let f2 be another homomorphism with the same values on A and X.'
  - 'derive: f2 agrees with f on every polynomial, since A and X generate A[X].'
  - 'conclude: f exists and is unique.'
  openmath: (forall (A B h s) (-> (and (comm_ring A) (comm_ring B) (ring_hom h A B) (in s B)) (exists (f) (and (ring_hom f (polynomial_ring A) B) (forall (a) (-> (in a A) (= (fn_value f (poly_const a)) (fn_value h a)))) (= (fn_value f poly_var) s) (forall (g) (-> (and (ring_hom g (polynomial_ring A) B) (forall (a) (-> (in a A) (= (fn_value g (poly_const a)) (fn_value h a)))) (= (fn_value g poly_var) s)) (= g f)))))))
  hard_negative:
    statement: 非可換環$B$と環準同型$\varphi\colon A\to B$、$s\in B$に対しても、$f|_A=\varphi$、$f(X)=s$となる環準同型$f\colon A[X]\to B$が常に存在する。
    reason: $A=\mathbb{Q}[Y]$、$B=M_2(\mathbb{Q})$、$\varphi(Y)=E_{11}$、$s=E_{12}$とする。$A[X]$では$YX=XY$なので$E_{11}E_{12}=E_{12}E_{11}$が必要だが、左辺は$E_{12}$、右辺は$0$である。
  target: |
    ∀ (A B : Type*) [CommRing A] [CommRing B] (φ : A →+* B) (s : B), ∃! f : Polynomial A →+* B, (∀ a, f (Polynomial.C a) = φ a) ∧ f Polynomial.X = s
  proof: |
    by
      intro A B _ _ φ s
      refine ⟨Polynomial.eval₂RingHom φ s, ⟨by simp, by simp⟩, ?_⟩
      rintro g ⟨h1, h2⟩
      apply Polynomial.ringHom_ext
      · intro a; simpa using h1 a
      · simpa using h2
- id: polynomial_evaluation_kernel_x_sub_a
  kind: gap
  level: 2
  topic: 環論・多項式環と代入
  statement: 可換環$A$と$a\in A$について、代入準同型$A[X]\to A$、$f\mapsto f(a)$の核は$(X-a)$である。
  statement_en: For a commutative ring A and a in A, the kernel of the evaluation homomorphism from A[X] to A sending f to f(a) is the ideal (X - a).
  assumptions:
  - $A$は可換環
  - $a\in A$
  quantifiers:
  - 任意の可換環$A$と元$a$
  conclusion: $\{f\in A[X]\mid f(a)=0\}=(X-a)$である。
  answer: |
    $A$を可換環、$a\in A$とする。

    $f=(X-a)g$なら$f(a)=0$なので、$(X-a)$は核に含まれる。

    逆に$f(a)=0$とする。$X^i-a^i=(X-a)(X^{i-1}+X^{i-2}a+\cdots+a^{i-1})$なので、$f=\sum_ic_iX^i$について$f-f(a)=\sum_ic_i(X^i-a^i)$は$X-a$で割り切れる。$f(a)=0$より$f$は$X-a$で割り切れる。よって核は$(X-a)$に含まれる。
  strategy: Factor X^i - a^i and sum up to write f - f(a) as a multiple of X - a.
  sketch:
  - 'derive: Multiples of X - a vanish at a.'
  - 'derive: X^i - a^i is divisible by X - a for each i.'
  - 'derive: Hence f - f(a) is divisible by X - a.'
  - 'conclude: If f(a) = 0, then f lies in (X - a).'
  openmath: (forall (A a) (-> (and (comm_ring A) (in a A)) (forall (f) (-> (in f (polynomial_ring A)) (<-> (= (poly_eval f a) 0) (in f (principal_ideal (- poly_var (poly_const a)))))))))
  hard_negative:
    statement: 相異なる$a,b$について、$f(a)=f(b)=0$となる多項式全体は可換環$A$でいつも$((X-a)(X-b))$である。
    reason: $A=\mathbb{Z}/6\mathbb{Z}$、$a=0$、$b=2$とする。$f=3X$は$f(0)=0$、$f(2)=0$を満たすが、$X(X-2)$はモニックで次数$2$なので$f$を割り切れない。
  target: |
    ∀ (A : Type*) [CommRing A] (a : A), RingHom.ker (Polynomial.evalRingHom a) = Ideal.span {Polynomial.X - Polynomial.C a}
  proof: |
    by
      intro A _ a
      exact Polynomial.ker_evalRingHom a
- id: polynomial_quotient_by_const_and_x
  kind: gap
  level: 3
  topic: 環論・多項式環の商
  statement: 可換環$A$と$a\in A$について、$A[X]/(a,X)$は$A/(a)$と環同型である。
  statement_en: For a commutative ring A and a in A, the quotient A[X]/(a, X) is isomorphic to A/(a).
  assumptions:
  - $A$は可換環
  - $a\in A$
  quantifiers:
  - 任意の可換環$A$と元$a$
  conclusion: $A[X]/(a,X)\cong A/(a)$である。
  answer: |
    $A$を可換環、$a\in A$とする。環準同型$\varphi\colon A[X]\to A/(a)$を、$f$に$f(0)$の類を対応させる写像として定める。これは定数項をとる環準同型と射影の合成である。定数多項式の像を考えると$\varphi$は全射である。

    核が$(a,X)$であることを示す。$f=ag+Xh$なら$f(0)=ag(0)\in(a)$なので$\varphi(f)=0$である。逆に$\varphi(f)=0$なら、$f(0)=ac$となる$c\in A$がある。$f-f(0)$は定数項が$0$なので$Xh$と書け、$f=ac+Xh\in(a,X)$である。

    環の第一同型定理より$A[X]/(a,X)\cong A/(a)$である。
  strategy: Compose evaluation at zero with the projection to A/(a) and compute the kernel.
  sketch:
  - 'construct: Let φ send f to the class of f(0) in A/(a).'
  - 'derive: φ is surjective, by looking at constants.'
  - 'derive: The kernel of φ is (a, X).'
  - 'apply_theorem: The first isomorphism theorem gives the isomorphism.'
  openmath: (forall (A a) (-> (and (comm_ring A) (in a A)) (ring_isomorphic (quotient_ring (polynomial_ring A) (ideal_sum (principal_ideal (poly_const a)) (principal_ideal poly_var))) (quotient_ring A (principal_ideal a)))))
  hard_negative:
    statement: 可換環$A$と$a\in A$について、$A[X]/(a)$は$A/(a)$と環同型である。
    reason: $A=\mathbb{Z}$、$a=2$とすると、$\mathbb{Z}[X]/(2)\cong(\mathbb{Z}/2\mathbb{Z})[X]$は無限環であり、$\mathbb{Z}/2\mathbb{Z}$と同型でない。
  target: |
    ∀ (A : Type*) [CommRing A] (a : A), Nonempty ((Polynomial A ⧸ (Ideal.span {Polynomial.C a, Polynomial.X} : Ideal (Polynomial A))) ≃+* (A ⧸ Ideal.span {a}))
  proof: |
    by
      intro A _ a
      have hk : RingHom.ker ((Ideal.Quotient.mk (Ideal.span {a})).comp (Polynomial.evalRingHom (0 : A))) = (Ideal.span {Polynomial.C a, Polynomial.X} : Ideal (Polynomial A)) := by
        ext f
        simp only [RingHom.mem_ker, RingHom.comp_apply, Polynomial.coe_evalRingHom, Ideal.Quotient.eq_zero_iff_mem, Ideal.mem_span_singleton, Ideal.mem_span_pair]
        constructor
        · rintro ⟨c, hc⟩
          refine ⟨Polynomial.C c, Polynomial.divX f, ?_⟩
          have h1 := Polynomial.divX_mul_X_add f
          rw [Polynomial.coeff_zero_eq_eval_zero, hc, Polynomial.C_mul] at h1
          calc Polynomial.C c * Polynomial.C a + f.divX * Polynomial.X = f.divX * Polynomial.X + Polynomial.C a * Polynomial.C c := by ring
            _ = f := h1
        · rintro ⟨g, h, rfl⟩
          exact ⟨g.eval 0, by simp; ring⟩
      have hs : Function.Surjective ((Ideal.Quotient.mk (Ideal.span {a})).comp (Polynomial.evalRingHom (0 : A))) := by
        intro y
        obtain ⟨x, rfl⟩ := Ideal.Quotient.mk_surjective y
        exact ⟨Polynomial.C x, by simp⟩
      exact ⟨(Ideal.quotEquivOfEq hk.symm).trans (RingHom.quotientKerEquivOfSurjective hs)⟩
- id: domain_ideal_const_and_x_not_principal
  kind: gap
  level: 2
  topic: 環論・多項式環と単項イデアル
  statement: 整域$A$の零でも単元でもない元$a$について、$A[X]$のイデアル$(a,X)$は単項イデアルでない。これは$\mathbb{Z}[X]$のイデアル$(2,X)$が単項でないことの一般形である。
  statement_en: For an element a of an integral domain A that is neither zero nor a unit, the ideal (a, X) of A[X] is not principal; this generalizes the fact that (2, X) is not principal in Z[X].
  assumptions:
  - $A$は整域
  - $a\in A$は零でも単元でもない
  quantifiers:
  - 任意の整域$A$と零でも単元でもない元$a$
  conclusion: $(a,X)$は$A[X]$の単項イデアルでない。
  answer: |
    $A$を整域、$a\in A$を零でも単元でもない元とする。$(a,X)=(d)$となる$d\in A[X]$があると仮定する。

    $d$は$a$を割る。$a=de$と書くと、$a\neq 0$より$d,e\neq 0$である。$A$は整域なので次数は足し合わされ、$0=\deg a=\deg d+\deg e$である。よって$\deg d=0$であり、$d$は定数$c\in A$である。

    $d$は$X$も割るので、$X=ch$となる$h\in A[X]$がある。$X$の係数を比べると、$1$は$c$と$h$の$X$の係数の積である。よって$c$は$A$の単元であり、$d$は$A[X]$の単元である。したがって$(a,X)=A[X]$である。

    すると$1=au+Xv$となる$u,v\in A[X]$がある。$X=0$を代入すると$1=au(0)$であり、$a$は単元となって仮定に反する。よって$(a,X)$は単項イデアルでない。
  strategy: A generator divides a, so it is constant, and it divides X, so it is a unit; evaluating at zero then makes a a unit.
  sketch:
  - 'setup: Suppose (a, X) = (d).'
  - 'derive: d divides the nonzero constant a, so d is a constant c.'
  - 'derive: c divides X, so comparing coefficients of X shows that c is a unit.'
  - 'contradiction: Then 1 = au + Xv, and X = 0 makes a a unit.'
  - 'conclude: Hence (a, X) is not principal.'
  openmath: (forall (A a) (-> (and (integral_domain A) (in a A) (!= a 0) (not (unit_element a A))) (not (ideal_is_principal (ideal_sum (principal_ideal (poly_const a)) (principal_ideal poly_var))))))
  hard_negative:
    statement: 整域$A$の任意の元$a$について、$(a,X)$は単項イデアルでない。
    reason: $a=0$なら$(a,X)=(X)$であり、$a$が単元なら$(a,X)=A[X]=(1)$である。どちらも単項である。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] (a : A), a ≠ 0 → ¬ IsUnit a → ¬ (Ideal.span ({Polynomial.C a, Polynomial.X} : Set (Polynomial A))).IsPrincipal
  proof: |
    by
      intro A _ _ a ha hu ⟨⟨d, hd⟩⟩
      have hd' : Ideal.span ({Polynomial.C a, Polynomial.X} : Set (Polynomial A)) = Ideal.span {d} := hd
      have h1 : d ∣ Polynomial.C a := Ideal.mem_span_singleton.mp (hd' ▸ Ideal.subset_span (by simp))
      have h2 : d ∣ Polynomial.X := Ideal.mem_span_singleton.mp (hd' ▸ Ideal.subset_span (by simp))
      have hd0 : d.natDegree = 0 := by
        obtain ⟨e, he⟩ := h1
        have hd0 : d ≠ 0 := by rintro rfl; simp at he; exact ha he
        have he0 : e ≠ 0 := by rintro rfl; simp at he; exact ha he
        have := congrArg Polynomial.natDegree he
        rw [Polynomial.natDegree_C, Polynomial.natDegree_mul hd0 he0] at this
        omega
      obtain ⟨c, rfl⟩ : ∃ c, d = Polynomial.C c := ⟨d.coeff 0, Polynomial.eq_C_of_natDegree_eq_zero hd0⟩
      obtain ⟨e, he⟩ := h2
      have hcu : IsUnit c := by
        have := congrArg (fun p => Polynomial.coeff p 1) he
        simp only [Polynomial.coeff_X_one, Polynomial.coeff_C_mul] at this
        exact IsUnit.of_mul_eq_one _ this.symm
      have h1m : (1 : Polynomial A) ∈ Ideal.span ({Polynomial.C a, Polynomial.X} : Set (Polynomial A)) := by
        rw [hd']
        exact Ideal.mem_span_singleton.mpr (((Polynomial.isUnit_C).mpr hcu).dvd)
      obtain ⟨f, g, hfg⟩ := Ideal.mem_span_pair.mp h1m
      have := congrArg (fun p => Polynomial.coeff p 0) hfg
      simp only [Polynomial.coeff_add, Polynomial.coeff_mul_C, Polynomial.coeff_mul_X_zero, Polynomial.coeff_one_zero, add_zero] at this
      exact hu (IsUnit.of_mul_eq_one _ ((mul_comm _ _).trans this))
- id: polynomial_x_ideal_prime_maximal_iff
  kind: gap
  level: 3
  topic: 環論・多項式環のイデアル
  statement: 可換環$A$について、$A[X]$のイデアル$(X)$が素イデアルであることと$A$が整域であることは同値であり、$(X)$が極大イデアルであることと$A$が体であることは同値である。
  statement_en: For a commutative ring A, the ideal (X) of A[X] is prime if and only if A is an integral domain, and it is maximal if and only if A is a field.
  assumptions:
  - $A$は可換環
  quantifiers:
  - 任意の可換環$A$
  conclusion: $(X)$が素であることと$A$が整域であることは同値であり、$(X)$が極大であることと$A$が体であることは同値である。
  answer: |
    $A$を可換環とする。定数項をとる写像$\varphi\colon A[X]\to A$、$f\mapsto f(0)$は全射環準同型である。$f(0)=0$は$f$が$X$で割り切れることと同値なので、核は$(X)$である。よって環の第一同型定理より$A[X]/(X)\cong A$である。

    イデアルが素であることと商環が整域であることは同値であり、イデアルが極大であることと商環が体であることは同値である。この同型を合わせると結論が従う。
  strategy: Identify A[X]/(X) with A by taking constant terms and apply the quotient characterizations.
  sketch:
  - 'construct: Let φ take the constant term of a polynomial.'
  - 'derive: φ is surjective with kernel (X), so A[X]/(X) is isomorphic to A.'
  - 'apply_theorem: An ideal is prime exactly when its quotient is a domain.'
  - 'apply_theorem: An ideal is maximal exactly when its quotient is a field.'
  openmath: (forall (A) (-> (comm_ring A) (and (<-> (prime_ideal (principal_ideal poly_var) (polynomial_ring A)) (integral_domain A)) (<-> (maximal_ideal (principal_ideal poly_var) (polynomial_ring A)) (is_field A)))))
  hard_negative:
    statement: 整域$A$について、$A[X]$のイデアル$(X)$は極大イデアルである。
    reason: $A=\mathbb{Z}$では$A[X]/(X)\cong\mathbb{Z}$は体でなく、$(X)$は$(2,X)$に真に含まれる。
  target: |
    ∀ (A : Type*) [CommRing A], ((Ideal.span {Polynomial.X} : Ideal (Polynomial A)).IsPrime ↔ IsDomain A) ∧ ((Ideal.span {Polynomial.X} : Ideal (Polynomial A)).IsMaximal ↔ IsField A)
  proof: |
    by
      intro A _
      have hk : RingHom.ker (Polynomial.evalRingHom (0 : A)) = Ideal.span {Polynomial.X} := by
        simpa using Polynomial.ker_evalRingHom (0 : A)
      have hs : Function.Surjective (Polynomial.evalRingHom (0 : A)) := fun a => ⟨Polynomial.C a, by simp⟩
      let e := RingHom.quotientKerEquivOfSurjective hs
      constructor
      · rw [← hk, ← Ideal.Quotient.isDomain_iff_prime]
        exact ⟨fun h => MulEquiv.isDomain _ e.symm.toMulEquiv, fun h => MulEquiv.isDomain _ e.toMulEquiv⟩
      · rw [← hk, Ideal.Quotient.maximal_ideal_iff_isField_quotient]
        exact ⟨fun h => MulEquiv.isField h e.symm.toMulEquiv, fun h => MulEquiv.isField h e.toMulEquiv⟩
