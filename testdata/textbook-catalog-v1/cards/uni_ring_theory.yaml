  - 'apply_theorem: The first isomorphism theorem gives the claim.'
  openmath: (forall (A I) (-> (and (comm_ring A) (ideal_of I A)) (ring_isomorphic (quotient_ring (polynomial_ring A) (ideal_extension_to_polynomials I)) (polynomial_ring (quotient_ring A I)))))
  hard_negative:
    statement: 可換環$A$のイデアル$I$について、$A[X]/IA[X]$は$A/I$と環同型である。
    reason: $A=\mathbb{Z}$、$I=(2)$とすると、左辺$(\mathbb{Z}/2\mathbb{Z})[X]$は無限環で、右辺$\mathbb{Z}/2\mathbb{Z}$は有限環である。
  target: |
    ∀ (A : Type*) [CommRing A] (I : Ideal A), Nonempty ((Polynomial A ⧸ I.map (Polynomial.C : A →+* Polynomial A)) ≃+* Polynomial (A ⧸ I))
  proof: |
    by
      intro A _ I
      exact ⟨(Ideal.polynomialQuotientEquivQuotientPolynomial I).symm⟩
- id: monic_polynomial_cancels_and_adds_degree
  kind: gap
  level: 2
  topic: 環論・モニック多項式
  statement: 可換環上のモニック多項式$f$と零でない多項式$g$について、$fg\neq 0$であり、$\deg(fg)=\deg f+\deg g$である。
  statement_en: For a monic polynomial f and a nonzero polynomial g over a commutative ring, fg is nonzero and deg(fg) = deg f + deg g.
  assumptions:
  - $A$は可換環
  - $f\in A[X]$はモニック
  - $g\in A[X]$、$g\neq 0$
  quantifiers:
  - 任意の可換環$A$、モニック多項式$f$、零でない多項式$g$
  conclusion: $fg\neq 0$かつ$\deg(fg)=\deg f+\deg g$である。
  answer: |
    $A$を可換環、$f\in A[X]$をモニック多項式、$g\in A[X]$を零でない多項式とする。$m=\deg f$、$n=\deg g$とし、$g$の最高次係数を$b$とする。$b\neq 0$である。

    $f$の$X^i$の係数と$g$の$X^j$の係数の積は、$i+j>m+n$なら$0$である。よって$fg$の$X^k$の係数は$k>m+n$で$0$である。$X^{m+n}$の係数に寄与するのは$(i,j)=(m,n)$だけなので、この係数は$1\cdot b=b\neq 0$である。

    したがって$fg\neq 0$であり、$\deg(fg)=m+n$である。
  strategy: The coefficient of X^(m+n) in fg is the leading coefficient of g because f is monic.
  sketch:
  - 'setup: Let m = deg f, n = deg g and let b be the leading coefficient of g.'
  - 'derive: The coefficients of fg vanish above degree m + n.'
  - 'derive: The coefficient of X^(m+n) equals 1·b = b, which is nonzero.'
  - 'conclude: Hence fg is nonzero of degree m + n.'
  openmath: (forall (A f g) (-> (and (comm_ring A) (in f (polynomial_ring A)) (in g (polynomial_ring A)) (monic_polynomial f) (!= g 0)) (and (!= (* f g) 0) (= (poly_degree (* f g)) (+ (poly_degree f) (poly_degree g))))))
  hard_negative:
    statement: 可換環上の零でない多項式$f,g$について、$f$の最高次係数が零でなければ$fg\neq 0$である。
    reason: $\mathbb{Z}/6\mathbb{Z}$上で$f=2X$、$g=3$とすると、どちらも零でないが$fg=0$である。最高次係数が単元であることが効いている。
  target: |
    ∀ (A : Type*) [CommRing A] (f g : Polynomial A), f.Monic → g ≠ 0 → f * g ≠ 0 ∧ (f * g).natDegree = f.natDegree + g.natDegree
  proof: |
    by
      intro A _ f g hf hg
      exact ⟨hf.mul_right_ne_zero hg, hf.natDegree_mul' hg⟩
- id: mccoy_polynomial_zero_divisor
  kind: named
  level: 3
  topic: 環論・多項式環の零因子
  statement: マッコイの定理。可換環$A$上の多項式$f$が$A[X]$の零因子であることと、$cf=0$となる零でない$c\in A$が存在することは同値である。
  statement_en: McCoy's theorem. A polynomial f over a commutative ring A is a zero divisor of A[X] if and only if cf = 0 for some nonzero c in A.
  assumptions:
  - $A$は可換環
  - $f\in A[X]$
  - 零因子とは、$fg=0$となる零でない$g\in A[X]$をもつ元をいう
  quantifiers:
  - 任意の可換環$A$と多項式$f$
  conclusion: $f$が零因子であることと、$cf=0$となる$c\in A\setminus\{0\}$が存在することは同値である。
  answer: |
    $A$を可換環、$f\in A[X]$とする。$cf=0$、$c\neq 0$なら、定数多項式$c$が$fg=0$を満たす零でない$g$である。

    逆に$f$が零因子であるとする。$f=\sum_{i=0}^{n}a_iX^i$と書く。$fg=0$となる零でない$g$のうち次数が最小のものをとり、$g=\sum_{j=0}^{m}b_jX^j$、$b_m\neq 0$とする。$a_ig=0$がすべての$i$で成り立つことを示す。

    そうでないと仮定し、$a_ig\neq 0$となる最大の$i$を$r$とする。$i>r$では$a_ig=0$なので、$0=fg=\sum_{i\leq r}a_iX^ig$である。$X^{r+m}$の係数を比べると$a_rb_m=0$である。よって$a_rg$の次数は$m$より小さい。また$f(a_rg)=a_r(fg)=0$であり、$a_rg\neq 0$である。これは$g$の次数の最小性に反する。

    したがって$a_ig=0$がすべての$i$で成り立つ。とくに$a_ib_m=0$であり、$c=b_m\neq 0$とすると$cf=0$である。
  strategy: Take a nonzero annihilator of minimal degree; the top nonannihilating coefficient would produce one of lower degree.
  sketch:
  - 'derive: A nonzero constant annihilator makes f a zero divisor.'
  - 'setup: Conversely take g nonzero of minimal degree with fg = 0.'
  - 'contradiction: If some a_i g ≠ 0, take the largest such r; then a_r b_m = 0 and a_r g is a smaller annihilator.'
  - 'derive: So a_i g = 0 for every i.'
  - 'conclude: The leading coefficient c of g satisfies cf = 0.'
  openmath: (forall (A f) (-> (and (comm_ring A) (in f (polynomial_ring A))) (<-> (exists (g) (and (in g (polynomial_ring A)) (!= g 0) (= (* f g) 0))) (exists (c) (and (in c A) (!= c 0) (= (* (poly_const c) f) 0))))))
  hard_negative:
    statement: 可換環上の多項式は、定数項が零因子ならば零因子である。
    reason: $\mathbb{Z}/4\mathbb{Z}$上の$f=X+2$の定数項$2$は零因子である。$cf=0$なら$X$の係数から$c=0$なので、この定理より$f$は零因子でない。
  target: |
    ∀ (A : Type*) [CommRing A] (f : Polynomial A), (∃ g : Polynomial A, g ≠ 0 ∧ f * g = 0) ↔ ∃ c : A, c ≠ 0 ∧ Polynomial.C c * f = 0
  proof: |
    by
      intro A _ f
      have h1 : (∃ g : Polynomial A, g ≠ 0 ∧ f * g = 0) ↔ f ∉ nonZeroDivisors (Polynomial A) := by
        rw [notMem_nonZeroDivisors_iff_right]
        constructor
        · rintro ⟨g, hg, h⟩
          exact ⟨g, by rw [mul_comm]; exact h, hg⟩
        · rintro ⟨g, h, hg⟩
          exact ⟨g, hg, by rw [mul_comm]; exact h⟩
      rw [h1, Polynomial.notMem_nonZeroDivisors_iff]
      simp [Polynomial.smul_eq_C_mul]
- id: poly_root_multiplicity_factorization
  kind: gap
  level: 2
  topic: 環論・多項式の根の重複度
  statement: 零環でない可換環$A$上の零でない多項式$f$と$a\in A$について、$f=(X-a)^mg$、$g(a)\neq 0$となる非負整数$m$と$g\in A[X]$が存在する。
  statement_en: For a nonzero polynomial f over a nonzero commutative ring A and a in A, there are a nonnegative integer m and g in A[X] with f = (X - a)^m g and g(a) ≠ 0.
  assumptions:
  - $A$は零環でない可換環
  - $f\in A[X]$、$f\neq 0$
  - $a\in A$
  quantifiers:
  - 任意の零環でない可換環$A$、零でない多項式$f$、元$a$
  conclusion: $f=(X-a)^mg$、$g(a)\neq 0$となる$m$と$g$が存在する。
  answer: |
    $A$を零環でない可換環、$f\in A[X]$を零でない多項式、$a\in A$とする。

    $X-a$はモニックなので、$(X-a)^k$は次数$k$のモニック多項式である。$(X-a)^k\mid f$、$f=(X-a)^kh$なら、$f\neq 0$より$h\neq 0$であり、モニック多項式との積の次数公式から$k+\deg h=\deg f$である。よって$k\leq\deg f$である。

    $k=0$では$(X-a)^k\mid f$が成り立つので、$(X-a)^k\mid f$を満たす最大の$k$がある。それを$m$とし、$f=(X-a)^mg$と書く。$g(a)=0$と仮定すると、因数定理より$g=(X-a)g'$と書け、$(X-a)^{m+1}\mid f$となって$m$の最大性に反する。よって$g(a)\neq 0$である。
  strategy: Divisibility by powers of the monic polynomial X - a is bounded by the degree; take the largest power and use the factor theorem.
  sketch:
  - 'derive: (X - a)^k | f forces k ≤ deg f, because X - a is monic.'
  - 'setup: Let m be the largest k with (X - a)^k | f and write f = (X - a)^m g.'
  - 'contradiction: If g(a) = 0, the factor theorem gives a higher power dividing f.'
  - 'conclude: So g(a) ≠ 0.'
  openmath: (forall (A f a) (-> (and (comm_ring A) (nontrivial_ring A) (in f (polynomial_ring A)) (!= f 0) (in a A)) (exists (m g) (and (in m N) (in g (polynomial_ring A)) (= f (* (^ (- poly_var (poly_const a)) m) g)) (!= (poly_eval g a) 0)))))
  hard_negative:
    statement: 零多項式でも同じ分解が存在する。
    reason: $f=0$なら$(X-a)^mg=0$である。$X-a$はモニックで零因子でないので$g=0$となり、$g(a)\neq 0$に反する。
  target: |
    ∀ (A : Type*) [CommRing A] [Nontrivial A] (f : Polynomial A) (a : A), f ≠ 0 → ∃ (m : ℕ) (g : Polynomial A), f = (Polynomial.X - Polynomial.C a) ^ m * g ∧ g.eval a ≠ 0
  proof: |
    by
      intro A _ _ f a hf
      obtain ⟨g, h1, h2⟩ := Polynomial.exists_eq_pow_rootMultiplicity_mul_and_not_dvd f hf a
      exact ⟨_, g, h1, fun h => h2 (Polynomial.dvd_iff_isRoot.mpr h)⟩
- id: comm_ring_double_root_iff_derivative_root
  kind: gap
  level: 2
  topic: 環論・形式微分と重根
  statement: 可換環$A$上の多項式$f$と$a\in A$について、$(X-a)^2\mid f$であることと、$f(a)=0$かつ$f'(a)=0$であることは同値である。ここで$f'$は形式微分である。これは実数係数の場合の一般形である。
  statement_en: For a polynomial f over a commutative ring A and a in A, (X - a)^2 divides f if and only if f(a) = 0 and f'(a) = 0, where f' is the formal derivative; this generalizes the real case.
  assumptions:
  - $A$は可換環
  - $f\in A[X]$、$a\in A$
  - $f'$は形式微分
  quantifiers:
  - 任意の可換環$A$、多項式$f$、元$a$
  conclusion: $(X-a)^2\mid f$であることと、$f(a)=f'(a)=0$であることは同値である。
  answer: |
    $A$を可換環、$f\in A[X]$、$a\in A$とする。形式微分は積の微分法則を満たす。

    $f=(X-a)^2g$なら$f(a)=0$である。$f'=2(X-a)g+(X-a)^2g'$なので$f'(a)=0$である。

    逆に$f(a)=f'(a)=0$とする。$f(a)=0$と因数定理より$f=(X-a)g$と書ける。$f'=g+(X-a)g'$なので、$f'(a)=g(a)$である。よって$g(a)=0$であり、因数定理より$g=(X-a)h$と書ける。したがって$f=(X-a)^2h$である。
  strategy: Use the factor theorem twice, together with the product rule for the formal derivative.
  sketch:
  - 'derive: If f = (X - a)^2 g, the product rule gives f(a) = f''(a) = 0.'
  - 'setup: Conversely write f = (X - a)g by the factor theorem.'
  - 'derive: The product rule gives f''(a) = g(a), so g(a) = 0.'
  - 'conclude: Applying the factor theorem to g gives (X - a)^2 | f.'
  openmath: (forall (A f a) (-> (and (comm_ring A) (in f (polynomial_ring A)) (in a A)) (<-> (dvd (^ (- poly_var (poly_const a)) 2) f) (and (= (poly_eval f a) 0) (= (poly_eval (poly_derivative f) a) 0)))))
  hard_negative:
    statement: 体上の多項式$f$について、$f'(a)=0$ならば$a$は$f$の重根である。
    reason: $\mathbb{Q}$上で$f=X^2+1$、$a=0$とすると$f'(0)=0$だが$f(0)=1\neq 0$であり、$0$は根でない。
  target: |
    ∀ (A : Type*) [CommRing A] (f : Polynomial A) (a : A), (Polynomial.X - Polynomial.C a) ^ 2 ∣ f ↔ f.eval a = 0 ∧ (Polynomial.derivative f).eval a = 0
  proof: |
    by
      intro A _ f a
      constructor
      · rintro ⟨g, rfl⟩
        simp [Polynomial.derivative_mul, Polynomial.derivative_pow]
      · rintro ⟨h1, h2⟩
        obtain ⟨g, rfl⟩ := Polynomial.dvd_iff_isRoot.mpr h1
        have : g.eval a = 0 := by simpa [Polynomial.derivative_mul] using h2
        obtain ⟨k, rfl⟩ := Polynomial.dvd_iff_isRoot.mpr this
        exact ⟨k, by ring⟩
- id: derivative_root_multiplicity_char_zero
  kind: gap
  level: 3
  topic: 環論・形式微分と重根
  statement: 標数$0$の整域$A$上の零でない多項式$f$の根$a$について、$a$の$f'$における重複度は、$a$の$f$における重複度より$1$小さい。ここで$f$の根でない元の重複度は$0$とする。
  statement_en: If a is a root of a nonzero polynomial f over an integral domain of characteristic zero, then the multiplicity of a as a root of f' is one less than its multiplicity as a root of f, where a non-root has multiplicity zero.
  assumptions:
  - $A$は標数$0$の整域
  - $f\in A[X]$、$f\neq 0$
  - $a\in A$、$f(a)=0$
  quantifiers:
  - 任意の標数$0$の整域$A$、零でない多項式$f$、根$a$
  conclusion: $a$の$f'$における重複度は、$a$の$f$における重複度から$1$を引いた値である。
  answer: |
    $A$を標数$0$の整域、$f\in A[X]$を零でない多項式、$a$を$f$の根とする。$a$の重複度を$m$とする。$m\geq 1$であり、$f=(X-a)^mg$、$g(a)\neq 0$と書ける。

    積の微分法則より、$f'=m(X-a)^{m-1}g+(X-a)^mg'=(X-a)^{m-1}h$である。ここで$h=mg+(X-a)g'$である。$h(a)=mg(a)$である。標数$0$なので$m\neq 0$であり、$A$は整域なので$h(a)\neq 0$である。

    $g(a)\neq 0$より$g\neq 0$であり、$h(a)\neq 0$より$h\neq 0$なので$f'\neq 0$である。$(X-a)^{m-1}$は$f'$を割り、$h(a)\neq 0$なので$h$は$X-a$で割り切れない。整域なので$(X-a)^m$は$f'$を割らない。実際$(X-a)^{m-1}h=(X-a)^mk$なら、$(X-a)^{m-1}$で簡約して$h=(X-a)k$となり矛盾する。したがって$f'$における重複度は$m-1$である。
  strategy: Differentiate f = (X - a)^m g and check that the cofactor of (X - a)^(m-1) does not vanish at a.
  sketch:
  - 'setup: Write f = (X - a)^m g with g(a) ≠ 0 and m ≥ 1.'
  - 'derive: f'' = (X - a)^(m-1) h with h = mg + (X - a)g''.'
  - 'derive: h(a) = m g(a) ≠ 0, because the characteristic is zero and A is a domain.'
  - 'conclude: The multiplicity of a in f'' is exactly m - 1.'
  openmath: (forall (A f a) (-> (and (integral_domain A) (ring_characteristic A 0) (in f (polynomial_ring A)) (!= f 0) (in a A) (= (poly_eval f a) 0)) (= (poly_root_multiplicity (poly_derivative f) a) (- (poly_root_multiplicity f a) 1))))
  hard_negative:
    statement: 標数$p>0$の体上でも、根の$f'$における重複度は$f$における重複度より$1$小さい。
    reason: 標数$p$の体上で$f=X^p$、$a=0$とすると$f$における重複度は$p$だが、$f'=0$なので$a$は重複度$p-1$の根にならない。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] [CharZero A] (f : Polynomial A) (a : A), f ≠ 0 → f.eval a = 0 → (Polynomial.derivative f).rootMultiplicity a = f.rootMultiplicity a - 1
  proof: |
    by
      intro A _ _ _ f a hf h
      exact Polynomial.derivative_rootMultiplicity_of_root h
- id: polynomial_derivative_product_rule
  kind: gap
  level: 2
  topic: 環論・形式微分
  statement: 可換環上の多項式$f,g$の形式微分について、積の法則$(fg)'=f'g+fg'$が成り立つ。
  statement_en: The formal derivative of polynomials f and g over a commutative ring satisfies the product rule (fg)' = f'g + fg'.
  assumptions:
  - $A$は可換環
  - $f,g\in A[X]$
  - 形式微分は$(\sum_ia_iX^i)'=\sum_iia_iX^{i-1}$で定める
  quantifiers:
  - 任意の可換環$A$と多項式$f,g$
  conclusion: $(fg)'=f'g+fg'$である。
  answer: |
    $A$を可換環、$f,g\in A[X]$とする。形式微分は$A$線形である。積の両辺は$f$についても$g$についても$A$線形なので、$f=X^m$、$g=X^n$の場合に示せばよい。

    このとき$(X^{m+n})'=(m+n)X^{m+n-1}$である。一方$(X^m)'X^n+X^m(X^n)'=mX^{m-1}X^n+nX^mX^{n-1}=(m+n)X^{m+n-1}$である。ただし$m=0$や$n=0$の項は$0$と読む。両者は等しい。
  strategy: Both sides are bilinear, so it suffices to check monomials.
  sketch:
  - 'setup: The derivative is linear over A, so both sides are bilinear in f and g.'
  - 'derive: For monomials both sides equal (m + n)X^(m+n-1).'
  - 'conclude: Bilinearity gives the rule for all polynomials.'
  openmath: (forall (A f g) (-> (and (comm_ring A) (in f (polynomial_ring A)) (in g (polynomial_ring A))) (= (poly_derivative (* f g)) (+ (* (poly_derivative f) g) (* f (poly_derivative g))))))
  hard_negative:
    statement: 形式微分について$(fg)'=f'g'$である。
    reason: $f=g=X$とすると、左辺は$(X^2)'=2X$であり、右辺は$1$である。
  target: |
    ∀ (A : Type*) [CommRing A] (f g : Polynomial A), Polynomial.derivative (f * g) = Polynomial.derivative f * g + f * Polynomial.derivative g
  proof: |
    by
      intro A _ f g
      exact Polynomial.derivative_mul
- id: derivative_zero_constant_char_zero
  kind: gap
  level: 3
  topic: 環論・形式微分と標数
  statement: 標数$0$の整域$A$上の多項式$f$の形式微分が$0$ならば、$f$は定数である。
  statement_en: If the formal derivative of a polynomial f over an integral domain of characteristic zero vanishes, then f is constant.
  assumptions:
  - $A$は標数$0$の整域
  - $f\in A[X]$、$f'=0$
  quantifiers:
  - 任意の標数$0$の整域$A$と多項式$f$
  conclusion: $f$は定数多項式である。
  answer: |
    $A$を標数$0$の整域、$f=\sum_ia_iX^i\in A[X]$を$f'=0$を満たす多項式とする。

    $f'=\sum_{i\geq 1}ia_iX^{i-1}$なので、$i\geq 1$で$ia_i=0$である。標数$0$なので$i\cdot 1\neq 0$であり、$A$は整域なので$a_i=0$である。よって$f=a_0$は定数である。
  strategy: Compare coefficients of f'; multiples by positive integers are injective in characteristic zero domains.
  sketch:
  - 'setup: Write f as the sum of a_i X^i.'
  - 'derive: f'' = 0 gives i a_i = 0 for i ≥ 1.'
  - 'derive: In a characteristic zero domain this forces a_i = 0.'
  - 'conclude: f equals its constant term.'
  openmath: (forall (A f) (-> (and (integral_domain A) (ring_characteristic A 0) (in f (polynomial_ring A)) (= (poly_derivative f) 0)) (exists (c) (and (in c A) (= f (poly_const c))))))
  hard_negative:
    statement: 任意の体上の多項式$f$は、$f'=0$なら定数である。
    reason: 標数$p$の体上で$f=X^p$とすると$f'=pX^{p-1}=0$だが、$f$は定数でない。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] [CharZero A] (f : Polynomial A), Polynomial.derivative f = 0 → ∃ c : A, f = Polynomial.C c
  proof: |
    by
      intro A _ _ _ f h
      exact ⟨_, Polynomial.eq_C_of_natDegree_eq_zero (Polynomial.derivative_eq_zero.mp h)⟩
- id: derivative_zero_iff_polynomial_in_x_pow_p
  kind: gap
  level: 3
  topic: 環論・形式微分と標数
  statement: 標数が素数$p$の整域$A$上の多項式$f$について、$f'=0$であることと、$f=g(X^p)$となる$g\in A[X]$が存在することは同値である。
  statement_en: For a polynomial f over an integral domain of prime characteristic p, f' = 0 if and only if f = g(X^p) for some g in A[X].
  assumptions:
  - $A$は整域で標数は素数$p$
  - $f\in A[X]$
  quantifiers:
  - 任意の標数$p$の整域$A$と多項式$f$
  conclusion: $f'=0$であることと、$f=g(X^p)$となる$g$が存在することは同値である。
  answer: |
    $A$を標数が素数$p$の整域、$f=\sum_ia_iX^i\in A[X]$とする。

    $f=g(X^p)$、$g=\sum_jb_jX^j$なら、$f=\sum_jb_jX^{pj}$である。$f'=\sum_jpjb_jX^{pj-1}=0$である。標数が$p$なので$p\cdot 1=0$だからである。

    逆に$f'=0$とする。$f'=\sum_{i\geq 1}ia_iX^{i-1}$なので、$ia_i=0$がすべての$i\geq 1$で成り立つ。$p\nmid i$なら、$i$の$A$での像は零でない。実際、標数が$p$なので、整数$i$の像が$0$であることと$p\mid i$は同値である。$A$は整域なので$a_i=0$である。よって$f$に現れる$X^i$は$p\mid i$のものだけであり、$f=\sum_ja_{pj}X^{pj}$である。$g=\sum_ja_{pj}X^j$とすると$f=g(X^p)$である。
  strategy: In characteristic p, only exponents divisible by p survive when f' vanishes.
  sketch:
  - 'derive: The derivative of b_j X^(pj) has factor p, so it vanishes.'
  - 'setup: Conversely f'' = 0 gives i a_i = 0 for every i ≥ 1.'
  - 'derive: If p does not divide i, the image of i is nonzero, so a_i = 0.'
  - 'construct: Put g equal to the sum of a_(pj) X^j.'
  - 'conclude: Then f = g(X^p).'
  openmath: (forall (A p f) (-> (and (integral_domain A) (in p P) (ring_characteristic A p) (in f (polynomial_ring A))) (<-> (= (poly_derivative f) 0) (exists (g) (and (in g (polynomial_ring A)) (= f (poly_comp g (^ poly_var p))))))))
  hard_negative:
    statement: 標数$p$の整域上で$f'=0$ならば、$f=g^p$となる$g\in A[X]$が存在する。
    reason: $A=\mathbb{F}_p(t)$、$f=X^p-t$とすると$f'=0$だが、$f=g^p$なら定数項$-t$が$A$の$p$乗になるはずで、$t$は$A$の$p$乗でない。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] (p : ℕ) [Fact p.Prime] [CharP A p] (f : Polynomial A), Polynomial.derivative f = 0 ↔ ∃ g : Polynomial A, f = g.comp (Polynomial.X ^ p)
  proof: |
    by
      intro A _ _ p _ _ f
      constructor
      · intro h
        refine ⟨Polynomial.contract p f, ?_⟩
        have := Polynomial.expand_contract p h (Fact.out : p.Prime).ne_zero
        rw [Polynomial.expand_eq_comp_X_pow] at this
        exact this.symm
      · rintro ⟨g, rfl⟩
        simp [Polynomial.derivative_comp, Polynomial.derivative_pow]
- id: square_factor_divides_derivative
  kind: gap
  level: 2
  topic: 環論・形式微分と重因子
  statement: 可換環上の多項式$f,g$について、$g^2\mid f$ならば$g\mid f'$である。
  statement_en: For polynomials f and g over a commutative ring, if g^2 divides f, then g divides the formal derivative f'.
  assumptions:
  - $A$は可換環
  - $f,g\in A[X]$、$g^2\mid f$
  quantifiers:
  - 任意の可換環$A$と多項式$f,g$
  conclusion: $g\mid f'$である。
  answer: |
    $A$を可換環、$f,g\in A[X]$とし、$f=g^2h$と書く。積の微分法則より$f'=2gg'h+g^2h'=g(2g'h+gh')$である。よって$g\mid f'$である。
  strategy: Apply the product rule to f = g^2 h.
  sketch:
  - 'setup: Write f = g^2 h.'
  - 'derive: The product rule gives f'' = g(2g''h + gh'').'
  - 'conclude: Hence g divides f''.'
  openmath: (forall (A f g) (-> (and (comm_ring A) (in f (polynomial_ring A)) (in g (polynomial_ring A)) (dvd (^ g 2) f)) (dvd g (poly_derivative f))))
  hard_negative:
    statement: $g\mid f$かつ$g\mid f'$ならば、$g^2\mid f$である。
    reason: $\mathbb{Z}[X]$で$f=2X$、$g=2$とすると、$f'=2$なので$g\mid f$かつ$g\mid f'$だが、$4\nmid 2X$である。
  target: |
    ∀ (A : Type*) [CommRing A] (f g : Polynomial A), g ^ 2 ∣ f → g ∣ Polynomial.derivative f
  proof: |
    by
      intro A _ f g ⟨h, hh⟩
      rw [hh, Polynomial.derivative_mul, Polynomial.derivative_pow]
      exact ⟨Polynomial.C 2 * Polynomial.derivative g * h + g * Polynomial.derivative h, by simp; ring⟩
- id: polynomial_determined_by_values_infinite_domain
  kind: gap
  level: 2
  topic: 環論・多項式と多項式関数
  statement: 無限整域$A$上の多項式$f,g$がすべての$a\in A$で$f(a)=g(a)$を満たすならば、$f=g$である。
  statement_en: If polynomials f and g over an infinite integral domain A satisfy f(a) = g(a) for all a in A, then f = g.
  assumptions:
  - $A$は無限整域
  - $f,g\in A[X]$
  - すべての$a\in A$で$f(a)=g(a)$
  quantifiers:
  - 任意の無限整域$A$と多項式$f,g$
  conclusion: $f=g$である。
  answer: |
    $A$を無限整域、$f,g\in A[X]$をすべての$a\in A$で$f(a)=g(a)$を満たす多項式とする。$h=f-g$とおくと、$A$のすべての元が$h$の根である。

    $h\neq 0$と仮定する。整域上の零でない多項式の相異なる根の個数は次数以下なので、$h$の根は有限個である。これは$A$が無限であることに反する。よって$h=0$であり、$f=g$である。
  strategy: The difference has infinitely many roots, which is impossible for a nonzero polynomial over a domain.
  sketch:
  - 'setup: Put h = f - g.'
  - 'derive: Every element of A is a root of h.'
  - 'contradiction: A nonzero polynomial over a domain has finitely many roots.'
  - 'conclude: Hence h = 0.'
  openmath: (forall (A f g) (-> (and (integral_domain A) (infinite_ring A) (in f (polynomial_ring A)) (in g (polynomial_ring A)) (forall (a) (-> (in a A) (= (poly_eval f a) (poly_eval g a))))) (= f g)))
  hard_negative:
    statement: 任意の体上の多項式$f,g$について、値がすべて等しければ$f=g$である。
    reason: $\mathbb{F}_p$上で$f=X^p$、$g=X$とすると、Fermatの小定理よりすべての元で値が等しいが$f\neq g$である。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] [Infinite A] (f g : Polynomial A), (∀ a, f.eval a = g.eval a) → f = g
  proof: |
    by
      intro A _ _ _ f g h
      exact Polynomial.funext h
- id: distinct_roots_product_divides_polynomial
  kind: gap
  level: 2
  topic: 環論・多項式の根と因数
  statement: 整域$A$の相異なる元$a_1,\dots,a_n$がすべて多項式$f\in A[X]$の根ならば、$(X-a_1)\cdots(X-a_n)\mid f$である。
  statement_en: If distinct elements a_1, ..., a_n of an integral domain A are all roots of a polynomial f in A[X], then (X - a_1)...(X - a_n) divides f.
  assumptions:
  - $A$は整域
  - $a_1,\dots,a_n\in A$は相異なる
  - $f\in A[X]$、$f(a_i)=0$
  quantifiers:
  - 任意の整域$A$、多項式$f$、相異なる根$a_1,\dots,a_n$
  conclusion: $\prod_i(X-a_i)\mid f$である。
  answer: |
    $A$を整域とする。$n$についての帰納法で示す。$n=0$では空積$1$が$f$を割る。

    $n\geq 1$とする。$f(a_1)=0$と因数定理より$f=(X-a_1)g$と書ける。$i\geq 2$について$0=f(a_i)=(a_i-a_1)g(a_i)$である。$a_i\neq a_1$であり$A$は整域なので$g(a_i)=0$である。よって$a_2,\dots,a_n$は$g$の相異なる根であり、帰納法の仮定より$(X-a_2)\cdots(X-a_n)\mid g$である。両辺に$X-a_1$を掛けて結論を得る。
  strategy: Factor out one root and use the domain property to keep the remaining roots.
  sketch:
  - 'induction: Induct on n; the empty product divides f.'
  - 'derive: The factor theorem gives f = (X - a_1)g.'
  - 'derive: (a_i - a_1)g(a_i) = 0 gives g(a_i) = 0 for i ≥ 2.'
  - 'conclude: The induction hypothesis for g gives the claim.'
  openmath: (forall (A s f) (-> (and (integral_domain A) (finite_set s) (subset s A) (in f (polynomial_ring A)) (forall (a) (-> (in a s) (= (poly_eval f a) 0)))) (dvd (finite_family_product s (lambda (a) (- poly_var (poly_const a)))) f)))
  hard_negative:
    statement: 任意の可換環で、相異なる根$a_1,a_2$をもつ多項式は$(X-a_1)(X-a_2)$で割り切れる。
    reason: $\mathbb{Z}/6\mathbb{Z}$上の$f=3X$は相異なる根$0,2$をもつが、$X(X-2)$はモニックで次数$2$なので、次数$1$の零でない$f$を割り切れない。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] (s : Finset A) (f : Polynomial A), (∀ a ∈ s, f.eval a = 0) → (∏ a ∈ s, (Polynomial.X - Polynomial.C a)) ∣ f
  proof: |
    by
      intro A _ _ s f h
      classical
      induction s using Finset.induction_on generalizing f with
      | empty => simp
      | insert a s ha ih =>
        rw [Finset.prod_insert ha]
        obtain ⟨g, rfl⟩ := Polynomial.dvd_iff_isRoot.mpr (h a (Finset.mem_insert_self a s))
        apply mul_dvd_mul_left
        apply ih
        intro b hb
        have h1 := h b (Finset.mem_insert_of_mem hb)
        have hne : b - a ≠ 0 := sub_ne_zero.mpr (fun hab => ha (hab ▸ hb))
        simpa [hne] using h1
- id: polynomial_coefficients_elementary_symmetric_roots
  kind: textbook
  level: 2
  topic: 環論・根と係数の関係
  statement: 整域$A$上の次数$n$の多項式$f$が重複度込みで$n$個の根$r_1,\dots,r_n\in A$をもつならば、最高次係数を$c$として、$0\leq k\leq n$で$X^k$の係数は$c(-1)^{n-k}e_{n-k}(r_1,\dots,r_n)$である。ここで$e_j$は$j$次基本対称式である。
  statement_en: If a polynomial f of degree n over an integral domain A has n roots r_1, ..., r_n in A counted with multiplicity and leading coefficient c, then for 0 ≤ k ≤ n the coefficient of X^k is c(-1)^(n-k) e_(n-k)(r_1, ..., r_n), where e_j is the j-th elementary symmetric polynomial.
  assumptions:
  - $A$は整域
  - $f\in A[X]$の次数は$n$、最高次係数は$c$
  - $f$の根は重複度込みで$n$個$r_1,\dots,r_n\in A$ある
  - $0\leq k\leq n$
  quantifiers:
  - 任意の整域$A$、多項式$f$、整数$k$
  conclusion: $f$の$X^k$の係数は$c(-1)^{n-k}e_{n-k}(r_1,\dots,r_n)$である。
  answer: |
    $A$を整域、$f\in A[X]$を次数$n$、最高次係数$c$の多項式とし、根を重複度込みで$r_1,\dots,r_n\in A$とする。

    $g=(X-r_1)\cdots(X-r_n)$とおく。$g\mid f$を示す。$X-r\mid uv$なら$u(r)v(r)=0$なので、$A$が整域であることから$u(r)=0$または$v(r)=0$であり、因数定理より$X-r$は$u$または$v$を割る。$r\neq r'$なら$X-r'$は$X-r$を割らない。よって、$f$の相異なる根$s_1,\dots,s_l$の重複度を$m_1,\dots,m_l$とすると、$f=(X-s_1)^{m_1}f_1$と書いたとき、$(X-s_2)^{m_2}$は$f_1$を割る。実際、$X-s_2$は$(X-s_1)^{m_1}$を割らないので$f_1$を割り、$f_1=(X-s_2)f_2$と書いて$X-s_2$で簡約すると$(X-s_2)^{m_2-1}\mid(X-s_1)^{m_1}f_2$となる。これを$m_2$回繰り返せばよい。$s_3,\dots,s_l$についても同様にして、$g=\prod_j(X-s_j)^{m_j}$は$f$を割る。

    $g$はモニックで次数$n$であり、$f$も次数$n$なので、$f=gh$とすると$\deg h=0$である。最高次係数を比べて$h=c$である。よって$f=cg$である。

    $g$を展開する。積$\prod_i(X-r_i)$の各因子から$X$か$-r_i$を選ぶと、$X^k$の項は$n-k$個の因子から$-r_i$を選ぶことに対応する。よって$X^k$の係数は$(-1)^{n-k}e_{n-k}(r_1,\dots,r_n)$である。$f=cg$より結論を得る。
  strategy: A polynomial with n roots equals c times the product of the X - r_i, and expanding the product gives the elementary symmetric polynomials.
  sketch:
  - 'setup: Let g be the product of the X - r_i.'
  - 'derive: g divides f and has the same degree, so f = cg.'
  - 'derive: Expanding g gives coefficients (-1)^(n-k) e_(n-k).'
  - 'conclude: Multiply by c.'
  openmath: (forall (A f k) (-> (and (integral_domain A) (in f (polynomial_ring A)) (= (size (poly_roots_multiset f)) (poly_degree f)) (in k N) (<= k (poly_degree f))) (= (poly_coeff f k) (* (poly_leading_coeff f) (* (^ (neg 1) (- (poly_degree f) k)) (multiset_esymm (poly_roots_multiset f) (- (poly_degree f) k)))))))
  hard_negative:
    statement: 根の個数が次数より少なくても、$X^k$の係数は$A$の中の根の基本対称式で表される。
    reason: $\mathbb{Q}$上の$f=(X-1)(X^2+1)=X^3-X^2+X-1$の$\mathbb{Q}$での根は$1$だけである。$X$の係数は$1$だが、一つの根から作る$e_2$は$0$である。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] (f : Polynomial A) (k : ℕ), k ≤ f.natDegree → Multiset.card f.roots = f.natDegree → f.coeff k = f.leadingCoeff * (-1) ^ (f.natDegree - k) * f.roots.esymm (f.natDegree - k)
  proof: |
    by
      intro A _ _ f k hk h
      exact Polynomial.coeff_eq_esymm_roots_of_card h hk
- id: polynomial_taylor_coefficient_iterated_derivative
  kind: gap
  level: 3
  topic: 環論・形式微分とテイラー展開
  statement: 可換環$A$上の多項式$f$、$a\in A$、非負整数$k$について、$f(X+a)$の$X^k$の係数を$c_k$とすると、$k!\,c_k=f^{(k)}(a)$である。ここで$f^{(k)}$は$k$階の形式微分である。
  statement_en: For a polynomial f over a commutative ring A, a in A and a nonnegative integer k, if c_k is the coefficient of X^k in f(X + a), then k! c_k equals f^(k)(a), where f^(k) is the k-th formal derivative.
  assumptions:
  - $A$は可換環
  - $f\in A[X]$、$a\in A$、$k$は非負整数
  quantifiers:
  - 任意の可換環$A$、多項式$f$、元$a$、非負整数$k$
  conclusion: $f(X+a)$の$X^k$の係数$c_k$は$k!\,c_k=f^{(k)}(a)$を満たす。
  answer: |
    $A$を可換環、$f\in A[X]$、$a\in A$、$k$を非負整数とする。両辺は$f$について加法的で係数倍を保つので、$f=X^n$の場合に示せばよい。

    二項定理より$(X+a)^n=\sum_{j}\binom{n}{j}a^{n-j}X^j$なので、$c_k=\binom{n}{k}a^{n-k}$である。ただし$k>n$では$c_k=0$である。

    一方$k\leq n$なら$(X^n)^{(k)}=n(n-1)\cdots(n-k+1)X^{n-k}$であり、$f^{(k)}(a)=n(n-1)\cdots(n-k+1)a^{n-k}$である。$k>n$なら$f^{(k)}=0$である。

    $k\leq n$では$k!\binom{n}{k}=n(n-1)\cdots(n-k+1)$なので、両者は等しい。$k>n$ではどちらも$0$である。
  strategy: Check monomials using the binomial theorem and the formula for iterated derivatives.
  sketch:
  - 'setup: Both sides are additive and A-linear in f, so take f = X^n.'
  - 'derive: The binomial theorem gives c_k = binom(n, k) a^(n-k).'
  - 'derive: The k-th derivative at a equals n(n-1)...(n-k+1) a^(n-k).'
  - 'conclude: k! binom(n, k) equals this product, which gives the identity.'
  openmath: (forall (A f a k) (-> (and (comm_ring A) (in f (polynomial_ring A)) (in a A) (in k N)) (= (* (factorial k) (poly_coeff (poly_comp f (+ poly_var (poly_const a))) k)) (poly_eval (poly_iterated_derivative f k) a))))
  hard_negative:
    statement: $f(X+a)$の$X^k$の係数は$f^{(k)}(a)$に等しい。
    reason: $A=\mathbb{Q}$、$f=X^2$、$a=0$、$k=2$とすると、$X^2$の係数は$1$だが$f''(0)=2$である。因子$k!$が必要である。
  target: |
    ∀ (A : Type*) [CommRing A] (f : Polynomial A) (a : A) (k : ℕ), (k.factorial : A) * ((f.comp (Polynomial.X + Polynomial.C a)).coeff k) = ((Polynomial.derivative)^[k] f).eval a
  proof: |
    by
      intro A _ f a k
      rw [← Polynomial.taylor_apply, Polynomial.taylor_coeff, ← Polynomial.factorial_smul_hasseDeriv]
      simp
- id: monic_irreducible_iff_no_monic_factorization
  kind: gap
  level: 3
  topic: 環論・モニック多項式の既約性
  statement: 整域$A$上のモニック多項式$f$が既約であることと、$f\neq 1$であり、$f=gh$となるモニック多項式$g,h$は必ず$g=1$または$h=1$であることは同値である。
  statement_en: A monic polynomial f over an integral domain A is irreducible if and only if f ≠ 1 and every factorization f = gh into monic polynomials has g = 1 or h = 1.
  assumptions:
  - $A$は整域
  - $f\in A[X]$はモニック
  quantifiers:
  - 任意の整域$A$とモニック多項式$f$
  conclusion: $f$が既約であることと、$f\neq 1$かつモニック多項式への分解が自明なものだけであることは同値である。
  answer: |
    $A$を整域、$f\in A[X]$をモニック多項式とする。$A[X]$の単元は$A$の単元である定数である。モニックな単元は$1$だけである。

    $f$が既約とする。$f$は単元でないので$f\neq 1$である。$f=gh$、$g,h$モニックなら、$g$または$h$は単元であり、モニックなので$1$である。

    逆に条件を仮定する。$f$がモニックな単元なら$f=1$なので、$f$は単元でない。$f=gh$とする。$g,h$の最高次係数を$u,v$とすると、最高次係数を比べて$uv=1$である。よって$u,v$は$A$の単元である。$g'=u^{-1}g$、$h'=v^{-1}h$はモニックで、$g'h'=(uv)^{-1}gh=f$である。条件より$g'=1$または$h'=1$であり、$g=u$または$h=v$である。これは$g$または$h$が単元であることを意味する。よって$f$は既約である。
  strategy: In a factorization of a monic polynomial the leading coefficients are units, so the factors can be normalized to be monic.
  sketch:
  - 'derive: The only monic unit of A[X] is 1.'
  - 'derive: Irreducibility directly gives the condition on monic factorizations.'
  - 'setup: Conversely let f = gh with leading coefficients u and v.'
  - 'derive: uv = 1, so u and v are units and g, h can be made monic.'
  - 'conclude: The condition forces g or h to be a unit.'
  openmath: (forall (A f) (-> (and (integral_domain A) (in f (polynomial_ring A)) (monic_polynomial f)) (<-> (irreducible_element f (polynomial_ring A)) (and (!= f 1) (forall (g h) (-> (and (in g (polynomial_ring A)) (in h (polynomial_ring A)) (monic_polynomial g) (monic_polynomial h) (= f (* g h))) (or (= g 1) (= h 1))))))))
  hard_negative:
    statement: 整域上の多項式$f$は、次数が正の多項式の積に分解しなければ既約である。
    reason: $\mathbb{Z}[X]$の$2X$は次数が正の多項式の積に分解しないが、$2\cdot X$と分解され、$2$も$X$も単元でないので既約でない。モニックでない場合は定数因子も考える必要がある。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] (f : Polynomial A), f.Monic → (Irreducible f ↔ f ≠ 1 ∧ ∀ g h : Polynomial A, g.Monic → h.Monic → f = g * h → g = 1 ∨ h = 1)
  proof: |
    by
      intro A _ _ f hf
      by_cases hf1 : f = 1
      · simp [hf1]
      · rw [Polynomial.irreducible_of_monic hf hf1]
        constructor
        · intro h
          exact ⟨hf1, fun g k hg hk e => h g k hg hk e.symm⟩
        · rintro ⟨_, h⟩ g k hg hk e
          exact h g k hg hk e.symm
- id: add_sub_pow_prime_power_characteristic
  kind: gap
  level: 3
  topic: 環論・標数とフロベニウス
  statement: 標数が素数$p$の可換環の元$x,y$と非負整数$k$について、$(x+y)^{p^k}=x^{p^k}+y^{p^k}$かつ$(x-y)^{p^k}=x^{p^k}-y^{p^k}$である。これは$(x+y)^p=x^p+y^p$の一般形である。
  statement_en: For elements x and y of a commutative ring of prime characteristic p and a nonnegative integer k, (x + y)^(p^k) = x^(p^k) + y^(p^k) and (x - y)^(p^k) = x^(p^k) - y^(p^k); this generalizes (x + y)^p = x^p + y^p.
  assumptions:
  - $A$は標数が素数$p$の可換環
  - $x,y\in A$
  - $k$は非負整数
  quantifiers:
  - 任意の可換環$A$、素数$p$、元$x,y$、非負整数$k$
  conclusion: $(x+y)^{p^k}=x^{p^k}+y^{p^k}$かつ$(x-y)^{p^k}=x^{p^k}-y^{p^k}$である。
  answer: |
    $A$を標数が素数$p$の可換環、$x,y\in A$とする。

    $k=1$の和の場合を示す。二項定理より$(x+y)^p=\sum_{i=0}^{p}\binom{p}{i}x^iy^{p-i}$である。$0<i<p$では$p\mid\binom{p}{i}$であり、$A$では$p\cdot 1=0$なので、この項は$0$である。よって$(x+y)^p=x^p+y^p$である。

    $k$についての帰納法で和の場合を示す。$k=0$では指数が$p^0=1$なので両辺は$x+y$である。$(x+y)^{p^k}=x^{p^k}+y^{p^k}$なら、両辺を$p$乗して$k=1$の場合を用いると、$(x+y)^{p^{k+1}}=(x^{p^k}+y^{p^k})^p=x^{p^{k+1}}+y^{p^{k+1}}$である。

    差の場合を示す。$x=(x-y)+y$に和の場合を適用すると$x^{p^k}=(x-y)^{p^k}+y^{p^k}$である。よって$(x-y)^{p^k}=x^{p^k}-y^{p^k}$である。
  strategy: Middle binomial coefficients vanish for k = 1; induct on k and write x = (x - y) + y for the difference.
  sketch:
  - 'apply_theorem: Expand (x + y)^p by the binomial theorem.'
  - 'derive: The middle coefficients are divisible by p, so they vanish in A.'
  - 'induction: Raising to the p-th power repeatedly gives the formula for p^k.'
  - 'derive: Applying the sum formula to x = (x - y) + y gives the difference formula.'
  openmath: (forall (A p x y k) (-> (and (comm_ring A) (in p P) (ring_characteristic A p) (in x A) (in y A) (in k N)) (and (= (^ (+ x y) (^ p k)) (+ (^ x (^ p k)) (^ y (^ p k)))) (= (^ (- x y) (^ p k)) (- (^ x (^ p k)) (^ y (^ p k)))))))
  hard_negative:
    statement: 標数$p$の可換環で、任意の正の整数$n$について$(x+y)^n=x^n+y^n$である。
    reason: $\mathbb{F}_3$で$x=y=1$、$n=2$とすると、$(x+y)^2=4=1$であり、$x^2+y^2=2$である。指数は$p$の冪でなければならない。
  target: |
    ∀ (A : Type*) [CommRing A] (p : ℕ) [Fact p.Prime] [CharP A p] (x y : A) (k : ℕ), (x + y) ^ p ^ k = x ^ p ^ k + y ^ p ^ k ∧ (x - y) ^ p ^ k = x ^ p ^ k - y ^ p ^ k
  proof: |
    by
      intro A _ p _ _ x y k
      exact ⟨add_pow_char_pow x y p k, sub_pow_char_pow x y k⟩
- id: polynomial_pow_char_frobenius_coefficients
  kind: gap
  level: 3
  topic: 環論・標数とフロベニウス
  statement: 標数が素数$p$の可換環$A$上の多項式$f=\sum_ia_iX^i$について、$f^p=\sum_ia_i^pX^{ip}$である。
  statement_en: For a polynomial f, the sum of a_i X^i, over a commutative ring A of prime characteristic p, one has f^p equal to the sum of a_i^p X^(ip).
  assumptions:
  - $A$は標数が素数$p$の可換環
  - $f=\sum_ia_iX^i\in A[X]$
  quantifiers:
  - 任意の可換環$A$、素数$p$、多項式$f$
  conclusion: $f^p=\sum_ia_i^pX^{ip}$である。
  answer: |
    $A$を標数が素数$p$の可換環、$f=\sum_ia_iX^i\in A[X]$とする。$A[X]$でも$p\cdot 1=0$である。

    可換環で$p\cdot 1=0$なら、二項定理より$(u+v)^p=u^p+v^p$である。これは$0<i<p$で$p\mid\binom{p}{i}$だからである。項の個数についての帰納法で、有限個の元の和の$p$乗は$p$乗の和である。

    これを$A[X]$の元$a_iX^i$に適用すると、$f^p=\sum_i(a_iX^i)^p=\sum_ia_i^pX^{ip}$である。
  strategy: The p-th power map is additive in A[X], so it can be applied term by term.
  sketch:
  - 'setup: A[X] also satisfies p·1 = 0.'
  - 'apply_theorem: In such a ring (u + v)^p = u^p + v^p.'
  - 'induction: The p-th power of a finite sum is the sum of p-th powers.'
  - 'conclude: Apply this to the monomials a_i X^i.'
  openmath: (forall (A p f) (-> (and (comm_ring A) (in p P) (ring_characteristic A p) (in f (polynomial_ring A))) (= (^ f p) (poly_comp (poly_map (ring_frobenius A p) f) (^ poly_var p)))))
  hard_negative:
    statement: 標数$p$の可換環上の多項式について、$f^p=f(X^p)$である。
    reason: $\mathbb{F}_p(t)$上で$f=tX$とすると、$f^p=t^pX^p$であり、$f(X^p)=tX^p$である。係数も$p$乗される。
  target: |
    ∀ (A : Type*) [CommRing A] (p : ℕ) [Fact p.Prime] [CharP A p] (f : Polynomial A), f ^ p = (f.map (frobenius A p)).comp (Polynomial.X ^ p)
  proof: |
    by
      intro A _ p _ _ f
      rw [← Polynomial.expand_eq_comp_X_pow, ← Polynomial.map_expand, Polynomial.map_frobenius_expand]
- id: characteristic_divides_under_ring_hom
  kind: gap
  level: 3
  topic: 環論・標数と環準同型
  statement: 環準同型$f\colon A\to B$（$B$は零環でなく、$f$は1を1に写す）について、$A$の標数を$m$、$B$の標数を$n$とすると、$n\mid m$である。
  statement_en: For a ring homomorphism f from A to B preserving 1, with B nonzero, if A has characteristic m and B has characteristic n, then n divides m.
  assumptions:
  - $A,B$は1をもつ環で、$B$は零環でない
  - $f\colon A\to B$は1を1に写す環準同型
  - $A$の標数は$m$、$B$の標数は$n$
  quantifiers:
  - 任意の環$A,B$と環準同型$f$
  conclusion: $n\mid m$である。
  answer: |
    $A,B$を1をもつ環、$B$を零環でない環、$f\colon A\to B$を1を1に写す環準同型とする。$A$の標数を$m$、$B$の標数を$n$とする。標数の定義より、自然数$k$について、$B$で$k\cdot 1=0$であることと$n\mid k$は同値である。

    $f$は和と1を保つので、$f(m\cdot 1)=m\cdot 1$である。$A$で$m\cdot 1=0$なので、$B$で$m\cdot 1=f(0)=0$である。よって$n\mid m$である。
  strategy: Apply f to the relation m·1 = 0 and use the divisibility characterization of the characteristic of B.
  sketch:
  - 'setup: In B, k·1 = 0 holds exactly when n divides k.'
  - 'derive: f(m·1) = m·1 in B and m·1 = 0 in A.'
  - 'conclude: Therefore m·1 = 0 in B and n divides m.'
  openmath: (forall (A B f m n) (-> (and (is_ring A) (is_ring B) (nontrivial_ring B) (ring_hom f A B) (ring_characteristic A m) (ring_characteristic B n)) (dvd n m)))
  hard_negative:
    statement: 環準同型$f\colon A\to B$があれば、$A$の標数は$B$の標数を割る。
    reason: 射影$\mathbb{Z}/4\mathbb{Z}\to\mathbb{Z}/2\mathbb{Z}$では$A$の標数は$4$、$B$の標数は$2$であり、$4\nmid 2$である。
  target: |
    ∀ (A B : Type*) [Ring A] [Ring B] [Nontrivial B] (f : A →+* B) (m n : ℕ), CharP A m → CharP B n → n ∣ m
  proof: |
    by
      intro A B _ _ _ f m n hm hn
      rw [← CharP.cast_eq_zero_iff B n]
      rw [← map_natCast f, CharP.cast_eq_zero, map_zero]
- id: gcd_domain_principal_intersection_is_lcm
  kind: gap
  level: 3
  topic: 環論・単項イデアルの共通部分
  statement: 最大公約元と最小公倍元が存在する整域（一意分解整域を含む）の元$a,b$について、$(a)\cap(b)=(\mathrm{lcm}(a,b))$である。
  statement_en: For elements a and b of an integral domain having greatest common divisors and least common multiples, including every unique factorization domain, the intersection of (a) and (b) equals (lcm(a, b)).
  assumptions:
  - $A$は最大公約元と最小公倍元が存在する整域
  - $a,b\in A$
  quantifiers:
  - 任意のそのような整域$A$と元$a,b$
  conclusion: $(a)\cap(b)=(\mathrm{lcm}(a,b))$である。
  answer: |
    $A$を最大公約元と最小公倍元が存在する整域、$a,b\in A$とし、$l=\mathrm{lcm}(a,b)$とする。$l$は$a,b$の公倍元であり、$a,b$の公倍元はすべて$l$で割り切れる。

    $x\in A$について、$x\in(a)\cap(b)$は$a\mid x$かつ$b\mid x$と同値である。これは$x$が$a,b$の公倍元であることを意味し、$l\mid x$と同値である。$l\mid x$は$x\in(l)$と同値である。よって$(a)\cap(b)=(l)$である。
  strategy: Translate membership in principal ideals into divisibility and use the defining property of the least common multiple.
  sketch:
  - 'setup: Let l = lcm(a, b).'
  - 'translate: x lies in (a) ∩ (b) exactly when x is a common multiple of a and b.'
  - 'derive: This holds exactly when l divides x.'
  - 'conclude: So (a) ∩ (b) = (l).'
  openmath: (forall (A a b) (-> (and (gcd_domain A) (in a A) (in b A)) (= (inter (principal_ideal a) (principal_ideal b)) (principal_ideal (lcm a b)))))
  hard_negative:
    statement: 同じ整域で$(a)+(b)=(\gcd(a,b))$がいつも成り立つ。
    reason: $\mathbb{Z}[X]$で$a=2$、$b=X$とすると$\gcd(a,b)=1$だが、$(2)+(X)=(2,X)$は$1$を含まない。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] [GCDMonoid A] (a b : A), Ideal.span {a} ⊓ Ideal.span {b} = Ideal.span {lcm a b}
  proof: |
    by
      intro A _ _ _ a b
      ext x
      simp only [Ideal.mem_inf, Ideal.mem_span_singleton, lcm_dvd_iff]
- id: principal_ring_prime_ideal_classification
  kind: gap
  level: 3
  topic: 環論・単項イデアル環の素イデアル
  statement: すべてのイデアルが単項である可換環の素イデアルは、零イデアルか、素元$p$による$(p)$である。
  statement_en: A prime ideal of a commutative ring in which every ideal is principal is either the zero ideal or of the form (p) with p a prime element.
  assumptions:
  - $A$はすべてのイデアルが単項である可換環
  - $P$は$A$の素イデアル
  quantifiers:
  - 任意のそのような環$A$と素イデアル$P$
  conclusion: $P=0$であるか、$P=(p)$となる素元$p$が存在する。
  answer: |
    $A$をすべてのイデアルが単項である可換環、$P$を素イデアルとする。$P=(p)$と書ける。$p=0$なら$P=0$である。

    $p\neq 0$とする。$P$は全体でないので$p$は単元でない。$p\mid ab$なら$ab\in P$であり、$P$が素イデアルなので$a\in P$または$b\in P$、すなわち$p\mid a$または$p\mid b$である。よって$p$は素元である。
  strategy: Write the ideal as (p) and read off the prime element condition from the prime ideal condition.
  sketch:
  - 'setup: Write P = (p).'
  - 'case_split: If p = 0, then P is the zero ideal.'
  - 'derive: Otherwise p is a nonunit because P is proper.'
  - 'derive: p | ab means ab in P, so p | a or p | b.'
  - 'conclude: Thus p is a prime element.'
  openmath: (forall (A M) (-> (and (comm_ring A) (forall (J) (-> (ideal_of J A) (ideal_is_principal J))) (prime_ideal M A)) (or (= M (zero_ideal A)) (exists (p) (and (prime_element p A) (= M (principal_ideal p)))))))
  hard_negative:
    statement: 一意分解整域の素イデアルは、零イデアルか素元で生成される単項イデアルである。
    reason: $\mathbb{Z}[X]$は一意分解整域だが、素イデアル$(2,X)$は単項でない。
  target: |
    ∀ (A : Type*) [CommRing A] [IsPrincipalIdealRing A] (M : Ideal A), M.IsPrime → M = ⊥ ∨ ∃ p : A, Prime p ∧ M = Ideal.span {p}
  proof: |
    by
      intro A _ _ M hM
      obtain ⟨⟨p, hp⟩⟩ := IsPrincipalIdealRing.principal M
      have hp' : M = Ideal.span {p} := hp
      by_cases h0 : p = 0
      · left; rw [hp', h0]; simp
      · right
        refine ⟨p, ?_, hp'⟩
        rw [hp'] at hM
        exact (Ideal.span_singleton_prime h0).mp hM
- id: principal_ring_ascending_chain_stabilizes
  kind: gap
  level: 3
  topic: 環論・単項イデアル環の昇鎖条件
  statement: すべてのイデアルが単項である可換環のイデアルの昇鎖$I_0\subseteq I_1\subseteq\cdots$は、ある番号から先で一定である。
  statement_en: Every ascending chain I_0 ⊆ I_1 ⊆ ... of ideals of a commutative ring in which every ideal is principal is eventually constant.
  assumptions:
  - $A$はすべてのイデアルが単項である可換環
  - $I_0\subseteq I_1\subseteq\cdots$は$A$のイデアルの昇鎖
  quantifiers:
  - 任意のそのような環$A$とイデアルの昇鎖$(I_n)$
  conclusion: ある$N$があり、$n\geq N$で$I_n=I_N$である。
  answer: |
    $A$をすべてのイデアルが単項である可換環、$I_0\subseteq I_1\subseteq\cdots$をイデアルの昇鎖とする。

    和集合$U=\bigcup_nI_n$はイデアルである。実際$x\in I_m$、$y\in I_n$なら$x,y\in I_{\max(m,n)}$なので$x+y\in U$であり、$U$の元の倍元も$U$に属する。仮定より$U=(a)$と書ける。

    $a\in U$なので、ある$N$で$a\in I_N$である。$n\geq N$なら$U=(a)\subseteq I_N\subseteq I_n\subseteq U$である。よって$I_n=I_N$である。
  strategy: The union of the chain is principal, and its generator already lies in some member of the chain.
  sketch:
  - 'derive: The union U of the chain is an ideal.'
  - 'setup: Write U = (a) and choose N with a in I_N.'
  - 'derive: For n ≥ N, U ⊆ I_N ⊆ I_n ⊆ U.'
  - 'conclude: The chain is constant from N on.'
  openmath: (forall (A I) (-> (and (comm_ring A) (forall (J) (-> (ideal_of J A) (ideal_is_principal J))) (forall (n) (-> (in n N) (and (ideal_of (ideal_sequence_term I n) A) (subset (ideal_sequence_term I n) (ideal_sequence_term I (+ n 1))))))) (exists (m) (and (in m N) (forall (n) (-> (and (in n N) (>= n m)) (= (ideal_sequence_term I n) (ideal_sequence_term I m))))))))
  hard_negative:
    statement: すべてのイデアルが単項である可換環のイデアルの降鎖は、ある番号から先で一定である。
    reason: $\mathbb{Z}$の降鎖$(2)\supsetneq(4)\supsetneq(8)\supsetneq\cdots$は一定にならない。
  target: |
    ∀ (A : Type*) [CommRing A] [IsPrincipalIdealRing A] (I : ℕ → Ideal A), Monotone I → ∃ m, ∀ n, m ≤ n → I n = I m
  proof: |
    by
      intro A _ _ I hI
      exact monotone_stabilizes_iff_noetherian.mpr inferInstance ⟨I, hI⟩ |>.imp fun N hN n hn => (hN n hn).symm
- id: pid_relatively_prime_iff_bezout
  kind: gap
  level: 3
  topic: 環論・単項イデアル整域と互いに素
  statement: 単項イデアル整域の元$a,b$について、$a,b$の公約元がすべて単元であることと、$ax+by=1$となる$x,y$が存在することは同値である。
  statement_en: For elements a and b of a principal ideal domain, every common divisor of a and b is a unit if and only if ax + by = 1 for some x and y.
  assumptions:
  - $A$は単項イデアル整域
  - $a,b\in A$
  quantifiers:
  - 任意の単項イデアル整域$A$と元$a,b$
  conclusion: $a,b$の公約元がすべて単元であることと、$ax+by=1$となる$x,y$が存在することは同値である。
  answer: |
    $A$を単項イデアル整域、$a,b\in A$とする。

    $ax+by=1$なら、$a,b$の公約元$c$は$ax+by=1$を割るので単元である。

    逆に$a,b$の公約元がすべて単元であるとする。イデアル$(a,b)$は単項なので$(a,b)=(d)$と書ける。$a,b\in(d)$より$d$は$a,b$の公約元であり、仮定より単元である。よって$(a,b)=A$であり、$1\in(a,b)$である。したがって$ax+by=1$となる$x,y$がある。
  strategy: A generator of (a, b) is a common divisor, hence a unit.
  sketch:
  - 'derive: If ax + by = 1, a common divisor divides 1.'
  - 'setup: Conversely write (a, b) = (d).'
  - 'derive: d is a common divisor, so it is a unit.'
  - 'conclude: Therefore 1 lies in (a, b).'
  openmath: (forall (A a b) (-> (and (principal_ideal_domain A) (in a A) (in b A)) (<-> (relatively_prime_elements a b) (coprime_elements a b))))
  hard_negative:
    statement: 一意分解整域の元$a,b$の公約元がすべて単元なら、$ax+by=1$となる$x,y$が存在する。
    reason: $\mathbb{Z}[X]$で$a=2$、$b=X$の公約元は$\pm 1$だけだが、$2u+Xv$の定数項は偶数なので$1$にならない。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] [IsPrincipalIdealRing A] (a b : A), IsRelPrime a b ↔ IsCoprime a b
  proof: |
    by
      intro A _ _ _ a b
      exact isRelPrime_iff_isCoprime
- id: field_poly_ideal_unique_monic_generator
  kind: gap
  level: 3
  topic: 環論・体上の多項式環のイデアル
  statement: 体$K$上の多項式環$K[X]$の零でないイデアルは、ただ一つのモニック多項式で生成される。
  statement_en: Every nonzero ideal of the polynomial ring K[X] over a field K is generated by exactly one monic polynomial.
  assumptions:
  - $K$は体
  - $I$は$K[X]$の零でないイデアル
  quantifiers:
  - 任意の体$K$と零でないイデアル$I$
  conclusion: $I=(f)$となるモニック多項式$f$がただ一つ存在する。
  answer: |
    $K$を体、$I$を$K[X]$の零でないイデアルとする。

    存在を示す。$I$の零でない元のうち次数が最小のものを$g$とする。$h\in I$を$g$で割り、$h=gq+r$、$\deg r<\deg g$と書く。$r=h-gq\in I$なので、$g$の最小性より$r=0$である。よって$I=(g)$である。$g$の最高次係数を$c$とすると、$f=c^{-1}g$はモニックであり、$c$は単元なので$(f)=(g)=I$である。

    一意性を示す。$f,f'$をモニックで$(f)=(f')=I$とする。$f\mid f'$かつ$f'\mid f$なので、次数は等しく、$f'=uf$となる定数$u$がある。最高次係数を比べて$u=1$である。よって$f=f'$である。
  strategy: Take a nonzero element of minimal degree, divide by it, and normalize; two monic generators differ by a constant equal to 1.
  sketch:
  - 'setup: Choose g nonzero in I of minimal degree.'
  - 'derive: Division with remainder shows I = (g).'
  - 'construct: Scale g to the monic polynomial f.'
  - 'derive: Two monic generators divide each other and so differ by a constant, which must be 1.'
  - 'conclude: The monic generator exists and is unique.'
  openmath: (forall (K I) (-> (and (is_field K) (ideal_of I (polynomial_ring K)) (!= I (zero_ideal (polynomial_ring K)))) (exists (f) (and (monic_polynomial f) (= I (principal_ideal f)) (forall (g) (-> (and (monic_polynomial g) (= I (principal_ideal g))) (= g f)))))))
  hard_negative:
    statement: $\mathbb{Z}[X]$の零でないイデアルは、ただ一つのモニック多項式で生成される。
    reason: $(2)$は$\mathbb{Z}[X]$の零でないイデアルだが、モニック多項式では生成されない。生成元の次数は$0$で、モニックなら$1$となり、$(1)$は全体だからである。
  target: |
    ∀ (K : Type*) [Field K] (I : Ideal (Polynomial K)), I ≠ ⊥ → ∃! f : Polynomial K, f.Monic ∧ I = Ideal.span {f}
  proof: |
    by
      intro K _ I hI
      obtain ⟨⟨g, hg⟩⟩ := IsPrincipalIdealRing.principal I
      have hg' : I = Ideal.span {g} := hg
      have hg0 : g ≠ 0 := by rintro rfl; apply hI; rw [hg']; simp
      refine ⟨g * Polynomial.C g.leadingCoeff⁻¹, ⟨Polynomial.monic_mul_leadingCoeff_inv hg0, ?_⟩, ?_⟩
      · rw [hg']
        have hu : IsUnit (Polynomial.C g.leadingCoeff⁻¹) := Polynomial.isUnit_C.mpr (IsUnit.mk0 _ (inv_ne_zero (Polynomial.leadingCoeff_ne_zero.mpr hg0)))
        exact (Ideal.span_singleton_mul_right_unit hu g).symm
      · rintro f ⟨hf, hfI⟩
        have hm : g * Polynomial.C g.leadingCoeff⁻¹ ∈ Ideal.span {f} := by
          rw [← hfI, hg']; exact Ideal.mul_mem_right _ _ (Ideal.mem_span_singleton_self g)
        have hm2 : f ∈ Ideal.span {g} := by rw [← hg', hfI]; exact Ideal.mem_span_singleton_self f
        have d1 : f ∣ g * Polynomial.C g.leadingCoeff⁻¹ := Ideal.mem_span_singleton.mp hm
        have hu : IsUnit (Polynomial.C g.leadingCoeff⁻¹) := Polynomial.isUnit_C.mpr (IsUnit.mk0 _ (inv_ne_zero (Polynomial.leadingCoeff_ne_zero.mpr hg0)))
        have d2 : g * Polynomial.C g.leadingCoeff⁻¹ ∣ f := by
          have := Ideal.mem_span_singleton.mp hm2
          obtain ⟨w, hw⟩ := this
          obtain ⟨u, hu'⟩ := hu
          refine ⟨↑u⁻¹ * w, ?_⟩
          rw [← hu', mul_assoc, Units.mul_inv_cancel_left, hw]
        exact Polynomial.eq_of_monic_of_associated hf (Polynomial.monic_mul_leadingCoeff_inv hg0) (associated_of_dvd_dvd d1 d2)
- id: ufd_primitive_irreducible_iff_over_fraction_field
  kind: textbook
  level: 3
  topic: 環論・ガウスの補題
  statement: 一意分解整域$A$とその分数体$K$について、原始多項式$f\in A[X]$が$A[X]$で既約であることと、$K[X]$で既約であることは同値である。これは$\mathbb{Z}$と$\mathbb{Q}$の場合の一般形である。
  statement_en: For a unique factorization domain A with fraction field K, a primitive polynomial f in A[X] is irreducible in A[X] if and only if it is irreducible in K[X]; this generalizes the case of Z and Q.
  assumptions:
  - $A$は一意分解整域、$K$はその分数体
  - $f\in A[X]$は原始多項式
  quantifiers:
  - 任意の一意分解整域$A$、分数体$K$、原始多項式$f$
  conclusion: $f$が$A[X]$で既約であることと、$K[X]$で既約であることは同値である。
  answer: |
    $A$を一意分解整域、$K$をその分数体、$f\in A[X]$を原始多項式とする。原始多項式の積は原始多項式であるというガウスの補題を用いる。$K[X]$の単元は零でない定数である。

    $f$が$K[X]$で既約であるとする。$f$は零でも定数でもない。よって$A[X]$の単元でない。$f=gh$（$g,h\in A[X]$）とすると、$K[X]$で$g$または$h$は定数である。$g=c\in A$とすると、$c$は$f$の係数をすべて割る。$f$は原始的なので$c$は$A$の単元である。$h$が定数の場合も同様である。よって$f$は$A[X]$で既約である。

    $f$が$A[X]$で既約であるとする。$\deg f=0$なら$f$は原始的な定数で単元となり、既約性に反するので$\deg f\geq 1$である。よって$f$は$K[X]$の単元でない。$f=gh$（$g,h\in K[X]$、$\deg g,\deg h\geq 1$）と仮定する。分母を払って内容をくくり出すと、$g=\alpha g_0$、$h=\beta h_0$（$\alpha,\beta\in K^\times$、$g_0,h_0\in A[X]$は原始的）と書ける。$\alpha\beta=a/b$（$a,b\in A$、$b\neq 0$）とすると、$bf=ag_0h_0$である。ガウスの補題より$g_0h_0$は原始的である。$f$も原始的なので、両辺の係数の最大公約元を比べて$a,b$は同伴である。よって$f=ug_0h_0$となる$A$の単元$u$がある。$\deg g_0,\deg h_0\geq 1$なので、$ug_0$も$h_0$も$A[X]$の単元でなく、$f$の既約性に反する。したがって$f$は$K[X]$で既約である。
  strategy: A factor constant in K[X] is a unit by primitivity; a nontrivial factorization over K descends to A[X] by Gauss's lemma.
  sketch:
  - 'derive: Irreducibility over K gives irreducibility over A because constant factors of a primitive polynomial are units.'
  - 'setup: Conversely suppose f = gh over K with both degrees positive.'
  - 'construct: Write g = α g_0 and h = β h_0 with g_0 and h_0 primitive in A[X].'
  - 'apply_theorem: By Gauss''s lemma g_0 h_0 is primitive, so f = u g_0 h_0 with u a unit of A.'
  - 'contradiction: This is a nontrivial factorization of f in A[X].'
  openmath: (forall (A K f) (-> (and (unique_factorization_domain A) (fraction_field_of K A) (in f (polynomial_ring A)) (primitive_polynomial f)) (<-> (irreducible_element f (polynomial_ring A)) (irreducible_element (poly_map (fraction_embedding A K) f) (polynomial_ring K)))))
  hard_negative:
    statement: 原始的とは限らない$f\in A[X]$について、$K[X]$で既約なら$A[X]$でも既約である。
    reason: $A=\mathbb{Z}$、$f=2X$は$\mathbb{Q}[X]$で既約だが、$\mathbb{Z}[X]$では$2\cdot X$と分解し、$2$も$X$も単元でない。
  target: |
    ∀ (A K : Type*) [CommRing A] [IsDomain A] [UniqueFactorizationMonoid A] [Field K] [Algebra A K] [IsFractionRing A K] (f : Polynomial A), f.IsPrimitive → (Irreducible f ↔ Irreducible (f.map (algebraMap A K)))
  proof: |
    by
      intro A K _ _ _ _ _ _ f hf
      classical
      letI : NormalizedGCDMonoid A := Nonempty.some (inferInstance)
      exact hf.irreducible_iff_irreducible_map_fraction_map
- id: irreducible_positive_degree_is_primitive
  kind: gap
  level: 3
  topic: 環論・原始多項式
  statement: 整域$A$上の次数が正の既約多項式は原始多項式である。すなわち、すべての係数を割る$A$の元は単元である。
  statement_en: An irreducible polynomial of positive degree over an integral domain A is primitive, that is, every element of A dividing all coefficients is a unit.
  assumptions:
  - $A$は整域
  - $f\in A[X]$は既約で$\deg f\geq 1$
  quantifiers:
  - 任意の整域$A$と次数が正の既約多項式$f$
  conclusion: $f$の係数をすべて割る$A$の元は単元である。
  answer: |
    $A$を整域、$f\in A[X]$を次数が正の既約多項式とする。$c\in A$が$f$のすべての係数を割るとする。$f=cg$となる$g\in A[X]$がある。

    $f$は既約なので、$c$または$g$は$A[X]$の単元である。$A$は整域なので、$A[X]$の単元は$A$の単元である定数である。$g$が単元なら$g$は定数であり、$\deg f=0$となって仮定に反する。よって$c$が$A[X]$の単元であり、$A$の単元である。
  strategy: Factor out the common divisor; the cofactor cannot be a unit because the degree is positive.
  sketch:
  - 'setup: Suppose c divides all coefficients and write f = cg.'
  - 'derive: Irreducibility makes c or g a unit of A[X].'
  - 'derive: Units of A[X] are constants, so g is not a unit since deg f > 0.'
  - 'conclude: Therefore c is a unit of A.'
  openmath: (forall (A f) (-> (and (integral_domain A) (in f (polynomial_ring A)) (irreducible_element f (polynomial_ring A)) (> (poly_degree f) 0)) (primitive_polynomial f)))
  hard_negative:
    statement: 整域上の既約多項式はすべて原始多項式である。
    reason: $\mathbb{Z}[X]$の定数$2$は既約だが、すべての係数を$2$が割るので原始的でない。次数が正という仮定が必要である。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] (f : Polynomial A), Irreducible f → f.natDegree ≠ 0 → f.IsPrimitive
  proof: |
    by
      intro A _ _ f h hd
      exact h.isPrimitive hd
- id: polynomial_content_primitive_decomposition
  kind: gap
  level: 3
  topic: 環論・内容と原始多項式
  statement: 最大公約元が存在する整域（一意分解整域を含む）上の多項式$f$は、$c$をある元、$g$を原始多項式として$f=cg$と書ける。
  statement_en: Every polynomial f over an integral domain with greatest common divisors, including every unique factorization domain, can be written as f = cg with c an element of the domain and g a primitive polynomial.
  assumptions:
  - $A$は最大公約元が存在する整域
  - $f\in A[X]$
  quantifiers:
  - 任意のそのような整域$A$と多項式$f$
  conclusion: $f=cg$となる$c\in A$と原始多項式$g\in A[X]$が存在する。
  answer: |
    $A$を最大公約元が存在する整域、$f\in A[X]$とする。$f=0$なら$c=0$、$g=1$とすればよい。

    $f\neq 0$とし、$f=\sum_ia_iX^i$の係数の最大公約元を$c$とする。$c\neq 0$である。$a_i=cb_i$と書き、$g=\sum_ib_iX^i$とおくと$f=cg$である。

    $g$が原始的であることを示す。$d\in A$が$b_i$をすべて割るなら、$cd$は$a_i$をすべて割る。$c$は最大公約元なので$cd\mid c$である。$c\neq 0$であり$A$は整域なので、$d\mid 1$である。よって$d$は単元である。
  strategy: Factor out the greatest common divisor of the coefficients and use cancellation in the domain.
  sketch:
  - 'case_split: For f = 0 take c = 0 and g = 1.'
  - 'setup: Otherwise let c be a greatest common divisor of the coefficients of f.'
  - 'construct: Write a_i = c b_i and put g equal to the sum of b_i X^i.'
  - 'derive: If d divides all b_i, then cd divides c, so d is a unit.'
  - 'conclude: g is primitive and f = cg.'
  openmath: (forall (A f) (-> (and (gcd_domain A) (in f (polynomial_ring A))) (exists (c g) (and (in c A) (in g (polynomial_ring A)) (primitive_polynomial g) (= f (* (poly_const c) g))))))
  hard_negative:
    statement: 原始多項式$g$への分解$f=cg$で、$c$は$f$によって一意に決まる。
    reason: $\mathbb{Z}[X]$で$2X=2\cdot X=(-2)\cdot(-X)$であり、$c$は単元倍を除いてしか決まらない。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] [GCDMonoid A] (f : Polynomial A), ∃ (c : A) (g : Polynomial A), g.IsPrimitive ∧ f = Polynomial.C c * g
  proof: |
    by
      intro A _ _ _ f
      classical
      by_cases hf : f = 0
      · exact ⟨0, 1, Polynomial.isPrimitive_one, by simp [hf]⟩
      · have key : ∀ s : Finset ℕ, ∃ d : A, (∀ i ∈ s, d ∣ f.coeff i) ∧ ∀ e : A, (∀ i ∈ s, e ∣ f.coeff i) → e ∣ d := by
          intro s
          induction s using Finset.induction_on with
          | empty => exact ⟨0, by simp, fun e _ => dvd_zero e⟩
          | insert i s _ ih =>
            obtain ⟨d, hd, hd'⟩ := ih
            refine ⟨gcd (f.coeff i) d, ?_, ?_⟩
            · intro j hj
              rcases Finset.mem_insert.mp hj with rfl | hj
              · exact gcd_dvd_left _ _
              · exact (gcd_dvd_right _ _).trans (hd j hj)
            · intro e he
              exact dvd_gcd (he i (Finset.mem_insert_self i s)) (hd' e fun j hj => he j (Finset.mem_insert_of_mem hj))
        obtain ⟨c, hc, hc'⟩ := key f.support
        have hall : ∀ n, c ∣ f.coeff n := by
          intro n
          by_cases hn : n ∈ f.support
          · exact hc n hn
          · rw [Polynomial.notMem_support_iff.mp hn]
            exact dvd_zero c
        obtain ⟨g, hg⟩ := (Polynomial.C_dvd_iff_dvd_coeff c f).mpr hall
        have hc0 : c ≠ 0 := by
          rintro rfl
          apply hf
          simpa using hg
        refine ⟨c, g, ?_, hg⟩
        intro r hr
        obtain ⟨h, hh⟩ := hr
        have hdvd : c * r ∣ c := by
          refine hc' (c * r) fun i _ => ?_
          have hfc : f = Polynomial.C (c * r) * h := by
            rw [hg, hh, Polynomial.C_mul, mul_assoc]
          rw [hfc, Polynomial.coeff_C_mul]
          exact dvd_mul_right _ _
        have hone : c * r ∣ c * 1 := by simpa using hdvd
        exact isUnit_of_dvd_one ((mul_dvd_mul_iff_left hc0).mp hone)

- id: fraction_field_polynomial_clear_denominators
  kind: gap
  level: 3
  topic: 環論・分数体上の多項式
  statement: 整域$A$の分数体$K$上の多項式$f$に対し、零でない$b\in A$と$g\in A[X]$で$bf=g$となるものが存在する。
  statement_en: For a polynomial f over the fraction field K of an integral domain A, there are a nonzero b in A and g in A[X] with bf = g.
  assumptions:
  - $A$は整域、$K$はその分数体
  - $f\in K[X]$
  quantifiers:
  - 任意の整域$A$、分数体$K$、多項式$f$
  conclusion: $bf=g$となる$b\in A\setminus\{0\}$と$g\in A[X]$が存在する。
  answer: |
    $A$を整域、$K$をその分数体、$f=\sum_{i=0}^{n}c_iX^i\in K[X]$とする。各係数を$c_i=a_i/b_i$（$a_i,b_i\in A$、$b_i\neq 0$）と書く。

    $b=b_0b_1\cdots b_n$とおく。$A$は整域なので$b\neq 0$である。$b_i'=\prod_{j\neq i}b_j\in A$とすると、$bc_i=a_ib_i'\in A$である。よって$g=\sum_ia_ib_i'X^i\in A[X]$とおくと、$K[X]$で$bf=g$である。
  strategy: Multiply by the product of the denominators of the coefficients.
  sketch:
  - 'setup: Write each coefficient of f as a_i/b_i.'
  - 'construct: Let b be the product of the b_i, which is nonzero in a domain.'
  - 'derive: Each b c_i lies in A.'
  - 'conclude: So bf comes from a polynomial g in A[X].'
  openmath: (forall (A K f) (-> (and (integral_domain A) (fraction_field_of K A) (in f (polynomial_ring K))) (exists (b g) (and (in b A) (!= b 0) (in g (polynomial_ring A)) (= (poly_map (fraction_embedding A K) g) (* (poly_const (fn_value (fraction_embedding A K) b)) f))))))
  hard_negative:
    statement: 分数体$K$上の多項式$f$は、$b$を掛けなくても$A[X]$の元である。
    reason: $A=\mathbb{Z}$、$K=\mathbb{Q}$、$f=X/2$は$\mathbb{Z}[X]$に属さない。
  target: |
    ∀ (A K : Type*) [CommRing A] [IsDomain A] [Field K] [Algebra A K] [IsFractionRing A K] (f : Polynomial K), ∃ (b : A) (g : Polynomial A), b ≠ 0 ∧ g.map (algebraMap A K) = Polynomial.C (algebraMap A K b) * f
  proof: |
    by
      intro A K _ _ _ _ _ f
      obtain ⟨b, hbm, hb⟩ := IsLocalization.integerNormalization_spec (nonZeroDivisors A) f
      refine ⟨b, IsLocalization.integerNormalization (nonZeroDivisors A) f, nonZeroDivisors.ne_zero hbm, ?_⟩
      rw [hb, Algebra.smul_def, Polynomial.algebraMap_apply]
- id: span_singleton_prime_iff_prime_element
  kind: gap
  level: 3
  topic: 環論・素元と素イデアル
  statement: 可換環の零でない元$a$について、$(a)$が素イデアルであることと、$a$が素元であることは同値である。
  statement_en: For a nonzero element a of a commutative ring, the ideal (a) is prime if and only if a is a prime element.
  assumptions:
  - $A$は可換環
  - $a\in A$、$a\neq 0$
  quantifiers:
  - 任意の可換環$A$と零でない元$a$
  conclusion: $(a)$が素イデアルであることと、$a$が素元であることは同値である。
  answer: |
    $A$を可換環、$a\in A$を零でない元とする。素元とは、零でも単元でもなく、$a\mid xy$なら$a\mid x$または$a\mid y$を満たす元である。

    $x\in(a)$は$a\mid x$と同値である。$(a)\neq A$は$a$が単元でないことと同値である。また$xy\in(a)$は$a\mid xy$と同値である。

    これらを素イデアルの定義に当てはめると、$(a)$が素イデアルであることは、$a$が単元でなく、$a\mid xy$なら$a\mid x$または$a\mid y$であることと同値である。$a\neq 0$なので、これは$a$が素元であることと同値である。
  strategy: Translate the definition of a prime ideal through x in (a) if and only if a divides x.
  sketch:
  - 'translate: x lies in (a) exactly when a divides x.'
  - 'translate: (a) is proper exactly when a is not a unit.'
  - 'derive: The prime ideal condition becomes the prime element condition.'
  - 'conclude: Since a is nonzero, the two notions coincide.'
  openmath: (forall (A a) (-> (and (comm_ring A) (in a A) (!= a 0)) (<-> (prime_ideal (principal_ideal a) A) (prime_element a A))))
  hard_negative:
    statement: 整域の任意の元$a$について、$(a)$が素イデアルなら$a$は素元である。
    reason: $a=0$なら$(a)$は素イデアルだが、素元は零でないと定めるので$0$は素元でない。
  target: |
    ∀ (A : Type*) [CommRing A] (a : A), a ≠ 0 → ((Ideal.span {a}).IsPrime ↔ Prime a)
  proof: |
    by
      intro A _ a h
      exact Ideal.span_singleton_prime h
- id: irreducible_iff_maximal_among_principal
  kind: gap
  level: 3
  topic: 環論・既約元と単項イデアル
  statement: 整域の零でない元$a$について、$a$が既約であることと、$(a)$が全体でなく、$(a)\subseteq(b)$となる単項イデアル$(b)$は全体か$(a)$に限ることは同値である。これは単項イデアル整域での「既約元と極大イデアルの対応」の一般形である。
  statement_en: For a nonzero element a of an integral domain, a is irreducible if and only if (a) is proper and every principal ideal (b) containing (a) is the whole ring or (a); this generalizes the correspondence of irreducible elements with maximal ideals in a principal ideal domain.
  assumptions:
  - $A$は整域
  - $a\in A$、$a\neq 0$
  quantifiers:
  - 任意の整域$A$と零でない元$a$
  conclusion: $a$が既約であることと、$(a)$が真の単項イデアルの中で極大であることは同値である。
  answer: |
    $A$を整域、$a\in A$を零でない元とする。$(a)\neq A$は$a$が単元でないことと同値であり、$(a)\subseteq(b)$は$b\mid a$と同値である。

    $a$が既約であるとする。$(a)\subseteq(b)$なら$a=bc$と書ける。既約性より$b$または$c$は単元である。$b$が単元なら$(b)=A$である。$c$が単元なら$b=ac^{-1}$なので$(b)=(a)$である。

    逆に条件を仮定する。$a$は単元でない。$a=bc$とすると$(a)\subseteq(b)$である。$(b)=A$なら$b$は単元である。$(b)=(a)$なら$b=au$と書ける。$a=auc$であり、$a\neq 0$と整域であることから$uc=1$である。よって$c$は単元である。したがって$a$は既約である。
  strategy: Translate containment of principal ideals into divisibility and use cancellation in the domain.
  sketch:
  - 'translate: (a) ⊆ (b) means b divides a, and (a) proper means a is a nonunit.'
  - 'derive: If a = bc is irreducible, then b is a unit, or c is a unit and (b) = (a).'
  - 'setup: Conversely take a factorization a = bc.'
  - 'derive: If (b) = (a), cancellation shows that c is a unit.'
  - 'conclude: Thus a is irreducible.'
  openmath: (forall (A a) (-> (and (integral_domain A) (in a A) (!= a 0)) (<-> (irreducible_element a A) (and (!= (principal_ideal a) (unit_ideal A)) (forall (b) (-> (and (in b A) (subset (principal_ideal a) (principal_ideal b))) (or (= (principal_ideal b) (unit_ideal A)) (= (principal_ideal b) (principal_ideal a)))))))))
  hard_negative:
    statement: 整域の既約元$a$について、$(a)$は極大イデアルである。
    reason: $\mathbb{Z}[X]$で$X$は既約だが、$(X)$は$(2,X)$に真に含まれ、$(2,X)$は全体でない。極大なのは単項イデアルの中だけである。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] (a : A), a ≠ 0 → (Irreducible a ↔ (Ideal.span {a} ≠ ⊤ ∧ ∀ b : A, Ideal.span {a} ≤ Ideal.span {b} → Ideal.span {b} = ⊤ ∨ Ideal.span {b} = Ideal.span {a}))
  proof: |
    by
      intro A _ _ a h0
      simp only [Ideal.span_singleton_le_span_singleton, Ne, Ideal.span_singleton_eq_top]
      constructor
      · intro h
        refine ⟨h.1, fun b hb => ?_⟩
        obtain ⟨c, rfl⟩ := hb
        rcases h.2 rfl with hu | hu
        · exact Or.inl hu
        · right
          exact Ideal.span_singleton_eq_span_singleton.mpr (associated_mul_unit_left _ _ hu).symm
      · rintro ⟨h1, h2⟩
        refine ⟨h1, ?_⟩
        rintro x y rfl
        rcases h2 x (Dvd.intro _ rfl) with hx | hx
        · exact Or.inl hx
        · right
          obtain ⟨u, hu⟩ := Ideal.span_singleton_eq_span_singleton.mp hx
          have hx0 : x ≠ 0 := by rintro rfl; simp at h0
          rw [← mul_left_cancel₀ hx0 hu]
          exact u.isUnit
- id: gcd_domain_coprime_product_power
  kind: gap
  level: 3
  topic: 環論・最大公約元と冪
  statement: 最大公約元が存在する整域（一意分解整域を含む）で、$\gcd(a,b)$が単元であり$ab=c^k$（$k$は非負整数）ならば、$a$はある元の$k$乗と同伴である。
  statement_en: In an integral domain with greatest common divisors, including every unique factorization domain, if gcd(a, b) is a unit and ab = c^k with k a nonnegative integer, then a is associated to a k-th power.
  assumptions:
  - $A$は最大公約元が存在する整域
  - $a,b,c\in A$、$\gcd(a,b)$は単元
  - $k$は非負整数、$ab=c^k$
  quantifiers:
  - 任意のそのような整域$A$、元$a,b,c$、非負整数$k$
  conclusion: $d^k$が$a$と同伴となる$d\in A$が存在する。
  answer: |
    $A$を最大公約元が存在する整域、$a,b,c\in A$を$\gcd(a,b)$が単元で$ab=c^k$を満たす元とする。同伴を$\sim$で表す。最大公約元について次の標準的な性質を用いる。$\gcd(xy,xz)\sim x\gcd(y,z)$である。$\gcd(x,y)^k\sim\gcd(x^k,y^k)$である。$\gcd(x,y)$と$\gcd(x,z)$が単元なら$\gcd(x,yz)$も単元である。

    $k=0$なら$ab=1$なので$a$は単元であり、$a\sim 1=d^0$である。

    $k\geq 1$とし、$d=\gcd(a,c)$とおく。$d^k\sim\gcd(a^k,c^k)=\gcd(a^k,ab)\sim a\gcd(a^{k-1},b)$である。$\gcd(a,b)$が単元なので、第3の性質を繰り返して$\gcd(a^{k-1},b)$も単元である。よって$d^k\sim a$である。
  strategy: Show that gcd(a, c)^k is associated to a by comparing gcd(a^k, c^k) with gcd(a^k, ab).
  sketch:
  - 'case_split: If k = 0, then a is a unit.'
  - 'construct: Otherwise put d = gcd(a, c).'
  - 'derive: d^k ~ gcd(a^k, c^k) = gcd(a^k, ab) ~ a gcd(a^(k-1), b).'
  - 'derive: gcd(a^(k-1), b) is a unit since gcd(a, b) is.'
  - 'conclude: Hence d^k is associated to a.'
  openmath: (forall (A a b c k) (-> (and (gcd_domain A) (in a A) (in b A) (in c A) (in k N) (unit_element (gcd a b) A) (= (* a b) (^ c k))) (exists (d) (and (in d A) (associated_elements (^ d k) a)))))
  hard_negative:
    statement: 同じ仮定のもとで、$a$は単元倍なしにある元の$k$乗に等しい。
    reason: $\mathbb{Z}$で$a=b=-1$、$c=1$、$k=2$とすると$ab=1=c^2$で$\gcd(a,b)=1$だが、$-1$は整数の平方でない。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A] [GCDMonoid A] (a b c : A) (k : ℕ), IsUnit (gcd a b) → a * b = c ^ k → ∃ d : A, Associated (d ^ k) a
  proof: |
    by
      intro A _ _ _ a b c k hab h
      exact exists_associated_pow_of_mul_eq_pow hab h
- id: ufd_rational_root_general
  kind: textbook
  level: 3
  topic: 環論・分数体と有理根
  statement: 一意分解整域$A$上の多項式$f$と、公約元がすべて単元である$a,b\in A$（$b\neq 0$）について、分数体で$a/b$が$f$の根ならば、$a$は$f$の定数項を割り、$b$は$f$の最高次係数を割る。これは整数係数の有理根定理の一般形である。
  statement_en: For a polynomial f over a unique factorization domain A and elements a, b of A with b nonzero whose common divisors are all units, if a/b is a root of f in the fraction field, then a divides the constant term of f and b divides its leading coefficient; this generalizes the rational root theorem for integer polynomials.
  assumptions:
  - $A$は一意分解整域、$K$はその分数体
  - $f\in A[X]$
  - $a,b\in A$、$b\neq 0$、$a,b$の公約元はすべて単元
  - $K$で$f(a/b)=0$
  quantifiers:
  - 任意の一意分解整域$A$、分数体$K$、多項式$f$、元$a,b$
  conclusion: $a$は$f$の定数項を割り、$b$は$f$の最高次係数を割る。
  answer: |
    $A$を一意分解整域、$K$をその分数体、$f=\sum_{i=0}^{n}c_iX^i\in A[X]$とする。$a,b\in A$を$b\neq 0$で公約元がすべて単元である元とし、$f(a/b)=0$とする。$f=0$なら定数項と最高次係数はどちらも$0$で、結論は成り立つ。$f\neq 0$とし、$c_n\neq 0$とする。

    $f(a/b)=0$の両辺に$b^n$を掛けると、$\sum_{i=0}^{n}c_ia^ib^{n-i}=0$である。

    $a=0$のとき、この式は$c_0b^n=0$となるので$c_0=0$であり、$a\mid c_0$である。また$b$は$a,b$の公約元なので単元であり、$b\mid c_n$である。以下$a\neq 0$とする。

    $i\geq 1$の項はすべて$a$で割り切れるので、$a\mid c_0b^n$である。一意分解整域で$a,b$の公約元が単元だけなら、$a$と$b^n$の公約元も単元だけであり、$a\mid c_0b^n$から$a\mid c_0$が従う。これは素因数分解を比べると分かる。

    $i\leq n-1$の項はすべて$b$で割り切れるので、$b\mid c_na^n$である。同様に$b\mid c_n$である。
  strategy: Clear denominators in f(a/b) = 0 and use that a and b have no common prime factors.
  sketch:
  - 'setup: Multiply f(a/b) = 0 by b^n.'
  - 'derive: Terms with i ≥ 1 are divisible by a, so a | c_0 b^n.'
  - 'derive: Unique factorization and coprimality give a | c_0.'
  - 'derive: Terms with i ≤ n - 1 are divisible by b, so b | c_n a^n and b | c_n.'
  openmath: (forall (A K f a b) (-> (and (unique_factorization_domain A) (fraction_field_of K A) (in f (polynomial_ring A)) (in a A) (in b A) (!= b 0) (relatively_prime_elements a b) (= (poly_eval (poly_map (fraction_embedding A K) f) (/ (fn_value (fraction_embedding A K) a) (fn_value (fraction_embedding A K) b))) 0)) (and (dvd a (poly_coeff f 0)) (dvd b (poly_leading_coeff f)))))
  hard_negative:
    statement: 既約分数の仮定なしに、$f(a/b)=0$なら$a$は$f$の定数項を割る。
    reason: $A=\mathbb{Z}$、$f=X-1$、$a=b=2$とすると$f(a/b)=0$だが、$2$は定数項$-1$を割らない。
  target: |
    ∀ (A K : Type*) [CommRing A] [IsDomain A] [UniqueFactorizationMonoid A] [Field K] [Algebra A K] [IsFractionRing A K] (f : Polynomial A) (a b : A), IsRelPrime a b → b ≠ 0 → Polynomial.aeval (algebraMap A K a / algebraMap A K b) f = 0 → a ∣ f.coeff 0 ∧ b ∣ f.leadingCoeff
  proof: |
    by
      intro A K _ _ _ _ _ _ f a b hab hb h
      have hb' : b ∈ nonZeroDivisors A := mem_nonZeroDivisors_of_ne_zero hb
      have hu := IsFractionRing.num_den_unique (A := A) (algebraMap A K a / algebraMap A K b) a ⟨b, hb'⟩ hab (IsFractionRing.mk'_eq_div ⟨b, hb'⟩)
      exact ⟨hu.1.symm.dvd.trans (num_dvd_of_is_root h), hu.2.symm.dvd.trans (den_dvd_of_is_root h)⟩
- id: ufd_x_pow_sub_irreducible_by_eisenstein
  kind: gap
  level: 3
  topic: 環論・アイゼンシュタインの判定法
  statement: 一意分解整域$A$の素元$p$と元$a$が$p\mid a$、$p^2\nmid a$を満たすならば、正の整数$n$について$X^n-a$は$A$の分数体$K$上で既約である。
  statement_en: If a prime element p and an element a of a unique factorization domain A satisfy p | a and p^2 ∤ a, then X^n - a is irreducible over the fraction field K of A for every positive integer n.
  assumptions:
  - $A$は一意分解整域、$K$はその分数体
  - $p\in A$は素元、$a\in A$
  - $p\mid a$、$p^2\nmid a$
  - $n$は正の整数
  quantifiers:
  - 任意の一意分解整域$A$、分数体$K$、素元$p$、元$a$、正の整数$n$
  conclusion: $X^n-a$は$K[X]$で既約である。
  answer: |
    $A$を一意分解整域、$K$をその分数体、$p$を素元、$a\in A$を$p\mid a$、$p^2\nmid a$を満たす元、$n$を正の整数とする。$f=X^n-a$とおく。

    $f$はモニックなので原始的である。$(p)$は$A$の素イデアルである。最高次係数$1$は$(p)$に属さない。$X^i$の係数は$0<i<n$で$0$、$i=0$で$-a$なので、$X^n$以外の係数はすべて$(p)$に属する。定数項$-a$は$(p)^2=(p^2)$に属さない。

    アイゼンシュタインの判定法より、$f$は$A[X]$で既約である。$f$は原始的なので、ガウスの補題から$K[X]$でも既約である。
  strategy: Check the Eisenstein conditions at the prime p and pass to the fraction field by Gauss's lemma.
  sketch:
  - 'setup: f = X^n - a is monic, hence primitive.'
  - 'derive: The lower coefficients lie in (p), and the constant term is not in (p^2).'
  - 'apply_theorem: Eisenstein''s criterion gives irreducibility in A[X].'
  - 'apply_theorem: Gauss''s lemma transfers irreducibility to K[X].'
  openmath: (forall (A K p a n) (-> (and (unique_factorization_domain A) (fraction_field_of K A) (prime_element p A) (in a A) (dvd p a) (not (dvd (^ p 2) a)) (in n N) (> n 0)) (irreducible_element (poly_map (fraction_embedding A K) (- (^ poly_var n) (poly_const a))) (polynomial_ring K))))
  hard_negative:
    statement: $p\mid a$だけを仮定しても$X^n-a$は分数体上で既約である。
    reason: $A=\mathbb{Z}$、$p=2$、$a=4$、$n=2$とすると、$X^2-4=(X-2)(X+2)$は既約でない。
  target: |
    ∀ (A K : Type*) [CommRing A] [IsDomain A] [UniqueFactorizationMonoid A] [Field K] [Algebra A K] [IsFractionRing A K] (p a : A) (n : ℕ), Prime p → 0 < n → p ∣ a → ¬ p ^ 2 ∣ a → Irreducible ((Polynomial.X ^ n - Polynomial.C a : Polynomial A).map (algebraMap A K))
  proof: |
    by
      intro A K _ _ _ _ _ _ p a n hp hn hpa hp2
      have hm : (Polynomial.X ^ n - Polynomial.C a : Polynomial A).Monic := Polynomial.monic_X_pow_sub_C a hn.ne'
      rw [← hm.irreducible_iff_irreducible_map_fraction_map]
      have hP : (Ideal.span {p}).IsPrime := (Ideal.span_singleton_prime hp.ne_zero).mpr hp
      have hd : (Polynomial.X ^ n - Polynomial.C a : Polynomial A).natDegree = n := Polynomial.natDegree_X_pow_sub_C
      refine Polynomial.irreducible_of_eisenstein_criterion hP ?_ ?_ ?_ ?_ hm.isPrimitive
      · rw [hm.leadingCoeff, Ideal.mem_span_singleton]
        exact hp.not_unit ∘ isUnit_of_dvd_one
      · intro k hk
        rw [Ideal.mem_span_singleton]
        have hk' : k < n := by
          rw [Polynomial.degree_eq_natDegree hm.ne_zero, hd] at hk
          exact_mod_cast hk
        rw [Polynomial.coeff_sub, Polynomial.coeff_X_pow, if_neg hk'.ne, Polynomial.coeff_C]
        split_ifs <;> simp [hpa]
      · rw [Polynomial.degree_eq_natDegree hm.ne_zero, hd]
        exact_mod_cast hn
      · rw [Ideal.span_singleton_pow, Ideal.mem_span_singleton, Polynomial.coeff_sub, Polynomial.coeff_X_pow, if_neg hn.ne, Polynomial.coeff_C_zero, zero_sub, dvd_neg]
        exact hp2
- id: sqrt_ring_norm_multiplicative_and_conjugate
  kind: gap
  level: 3
  topic: 環論・2次整数環のノルム
  statement: 整数$d$と$\mathbb{Z}[\sqrt{d}]$の元$x,y$について、ノルム$N(a+b\sqrt{d})=a^2-db^2$は$N(xy)=N(x)N(y)$を満たし、共役$\bar{x}$について$N(x)=x\bar{x}$である。ここで$\mathbb{Z}[\sqrt{d}]$は$(a,b)$の組に$\sqrt{d}^2=d$で積を定めた環であり、$d$は平方数でもよい。
  statement_en: For an integer d and elements x, y of Z[sqrt d], the norm N(a + b sqrt d) = a^2 - d b^2 satisfies N(xy) = N(x)N(y), and N(x) equals x times its conjugate; here Z[sqrt d] is the ring of pairs (a, b) with sqrt(d)^2 = d, and d may be a square.
  assumptions:
  - $d$は整数
  - $\mathbb{Z}[\sqrt{d}]$は整数の組$(a,b)$を$a+b\sqrt{d}$と書き、$\sqrt{d}^2=d$で積を定めた環
  - $\overline{a+b\sqrt{d}}=a-b\sqrt{d}$
  - $x,y\in\mathbb{Z}[\sqrt{d}]$
  quantifiers:
  - 任意の整数$d$と元$x,y$
  conclusion: $N(xy)=N(x)N(y)$であり、$\mathbb{Z}[\sqrt{d}]$で$N(x)=x\bar{x}$である。
  answer: |
    $d$を整数、$x=a+b\sqrt{d}$、$y=u+v\sqrt{d}$を$\mathbb{Z}[\sqrt{d}]$の元とする。

    $x\bar{x}=(a+b\sqrt{d})(a-b\sqrt{d})=a^2-db^2=N(x)$である。

    $xy=(au+dbv)+(av+bu)\sqrt{d}$なので、$N(xy)=(au+dbv)^2-d(av+bu)^2$である。展開すると$2aubdv$の項と$-2davbu$の項が打ち消し合い、$a^2u^2+d^2b^2v^2-da^2v^2-db^2u^2$となる。これは$(a^2-db^2)(u^2-dv^2)=N(x)N(y)$に等しい。
  strategy: Direct computation in coordinates.
  sketch:
  - 'setup: Write x = a + b sqrt d and y = u + v sqrt d.'
  - 'derive: x times its conjugate equals a^2 - d b^2.'
  - 'derive: Expanding N(xy) in coordinates gives (a^2 - d b^2)(u^2 - d v^2).'
  openmath: (forall (d x y) (-> (and (in d Z) (in x (int_adjoin_sqrt d)) (in y (int_adjoin_sqrt d))) (and (= (sqrt_ring_norm (* x y)) (* (sqrt_ring_norm x) (sqrt_ring_norm y))) (= (sqrt_ring_norm x) (* x (sqrt_ring_conj x))))))
  hard_negative:
    statement: ノルムは加法的であり、$N(x+y)=N(x)+N(y)$である。
    reason: $d=-1$、$x=y=1$とすると、$N(x+y)=N(2)=4$であり、$N(x)+N(y)=2$である。
  target: |
    ∀ (d : ℤ) (x y : Zsqrtd d), (x * y).norm = x.norm * y.norm ∧ ((x.norm : ℤ) : Zsqrtd d) = x * star x
  proof: |
    by
      intro d x y
      exact ⟨Zsqrtd.norm_mul x y, Zsqrtd.norm_eq_mul_conj x⟩
- id: sqrt_ring_unit_iff_norm_plus_minus_one
  kind: gap
  level: 3
  topic: 環論・2次整数環の単元
  statement: 整数$d$と$x\in\mathbb{Z}[\sqrt{d}]$について、$x$が単元であることと$|N(x)|=1$であることは同値である。ここで$N(a+b\sqrt{d})=a^2-db^2$であり、$\mathbb{Z}[\sqrt{d}]$は整数の組$(a,b)$を$a+b\sqrt{d}$と書き、$\sqrt{d}^2=d$で積を定めた環である。$d$は平方数でもよい。
  statement_en: For an integer d and x in Z[sqrt d], x is a unit if and only if |N(x)| = 1, where N(a + b sqrt d) = a^2 - d b^2; here Z[sqrt d] is the ring of pairs (a, b) with sqrt(d)^2 = d, and d may be a square.
  assumptions:
  - $d$は整数
  - $x\in\mathbb{Z}[\sqrt{d}]$
  quantifiers:
  - 任意の整数$d$と元$x$
  conclusion: $x$が単元であることと$|N(x)|=1$であることは同値である。
  answer: |
    $d$を整数、$x\in\mathbb{Z}[\sqrt{d}]$とする。ノルムは乗法的で、$N(1)=1$であり、$N(x)=x\bar{x}$である。

    $x$が単元で$xy=1$なら、$N(x)N(y)=1$であり、これらは整数なので$N(x)=\pm 1$である。

    逆に$N(x)=\pm 1$なら、$x\bar{x}=\pm 1$なので、$x\cdot(\pm\bar{x})=1$である。可換環なので$x$は単元である。
  strategy: Multiplicativity sends units to units of Z; conversely the conjugate gives an inverse.
  sketch:
  - 'derive: If xy = 1, then N(x)N(y) = 1 in the integers, so N(x) = ±1.'
  - 'derive: If N(x) = ±1, then x times ± its conjugate is 1.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (d x) (-> (and (in d Z) (in x (int_adjoin_sqrt d))) (<-> (unit_element x (int_adjoin_sqrt d)) (= (abs (sqrt_ring_norm x)) 1))))
  hard_negative:
    statement: $\mathbb{Z}[\sqrt{d}]$の単元は$\pm 1$だけである。
    reason: $d=2$では$(1+\sqrt{2})(-1+\sqrt{2})=1$なので、$1+\sqrt{2}$も単元である。
  target: |
    ∀ (d : ℤ) (x : Zsqrtd d), IsUnit x ↔ |x.norm| = 1
  proof: |
    by
      intro d x
      rw [← Zsqrtd.norm_eq_one_iff, Int.abs_eq_natAbs]
      norm_cast
- id: sqrt_ring_prime_norm_is_irreducible
  kind: gap
  level: 3
  topic: 環論・2次整数環の既約元
  statement: 整数$d$と$x\in\mathbb{Z}[\sqrt{d}]$について、$|N(x)|$が素数ならば$x$は既約である。ここで$N(a+b\sqrt{d})=a^2-db^2$であり、$\mathbb{Z}[\sqrt{d}]$は整数の組$(a,b)$を$a+b\sqrt{d}$と書き、$\sqrt{d}^2=d$で積を定めた環である。$d$は平方数でもよい。
  statement_en: For an integer d and x in Z[sqrt d], if |N(x)| is a prime number, then x is irreducible, where N(a + b sqrt d) = a^2 - d b^2; here Z[sqrt d] is the ring of pairs (a, b) with sqrt(d)^2 = d, and d may be a square.
  assumptions:
  - $d$は整数
  - $x\in\mathbb{Z}[\sqrt{d}]$
  - $|N(x)|$は素数
  quantifiers:
  - 任意の整数$d$と元$x$
  conclusion: $x$は既約である。
  answer: |
    $d$を整数、$x\in\mathbb{Z}[\sqrt{d}]$を$|N(x)|$が素数である元とする。$y\in\mathbb{Z}[\sqrt{d}]$が単元であることと$|N(y)|=1$であることは同値である。これはノルムの乗法性と$N(y)=y\bar{y}$から従う。

    $|N(x)|\neq 1$なので$x$は単元でない。$x=yz$とすると、$|N(y)|\cdot|N(z)|=|N(x)|$は素数である。よって$|N(y)|=1$または$|N(z)|=1$であり、$y$または$z$は単元である。したがって$x$は既約である。
  strategy: A factorization of x factors the prime |N(x)| in the integers.
  sketch:
  - 'setup: Units of Z[sqrt d] are the elements of norm ±1.'
  - 'derive: x is not a unit, since |N(x)| is prime.'
  - 'derive: x = yz gives |N(y)| |N(z)| = |N(x)|.'
  - 'conclude: One factor has norm ±1, so it is a unit.'
  openmath: (forall (d x) (-> (and (in d Z) (in x (int_adjoin_sqrt d)) (in (abs (sqrt_ring_norm x)) P)) (irreducible_element x (int_adjoin_sqrt d))))
  hard_negative:
    statement: $\mathbb{Z}[\sqrt{d}]$の既約元のノルムの絶対値は素数である。
    reason: $d=-5$で$2$は既約だが、$N(2)=4$である。
  target: |
    ∀ (d : ℤ) (x : Zsqrtd d), Nat.Prime x.norm.natAbs → Irreducible x
  proof: |
    by
      intro d x hx
      refine ⟨fun hu => ?_, ?_⟩
      · rw [← Zsqrtd.norm_eq_one_iff] at hu
        rw [hu] at hx
        exact Nat.not_prime_one hx
      · rintro a b rfl
        rw [Zsqrtd.norm_mul, Int.natAbs_mul] at hx
        rcases Nat.prime_mul_iff.mp hx with ⟨_, hb⟩ | ⟨_, ha⟩
        · right; exact Zsqrtd.norm_eq_one_iff.mp hb
        · left; exact Zsqrtd.norm_eq_one_iff.mp ha
- id: gaussian_integer_units_classification
  kind: textbook
  level: 3
  topic: 環論・ガウス整数の単元
  statement: ガウス整数環$\mathbb{Z}[i]$の単元は$1,-1,i,-i$の4個である。
  statement_en: The units of the ring of Gaussian integers Z[i] are exactly 1, -1, i and -i.
  assumptions:
  - $x\in\mathbb{Z}[i]$
  quantifiers:
  - 任意のガウス整数$x$
  conclusion: $x$が単元であることと、$x\in\{1,-1,i,-i\}$であることは同値である。
  answer: |
    $x=a+bi$をガウス整数とし、$N(x)=a^2+b^2$とおく。$N$は乗法的で$N(1)=1$である。

    $x$が単元で$xy=1$なら、$N(x)N(y)=1$であり、$N(x),N(y)$は非負整数なので$N(x)=1$である。$a^2+b^2=1$を満たす整数の組は$(a,b)=(\pm 1,0),(0,\pm 1)$だけである。よって$x\in\{1,-1,i,-i\}$である。

    逆に$1\cdot 1=1$、$(-1)(-1)=1$、$i(-i)=1$なので、これらは単元である。
  strategy: Units have norm 1, and a^2 + b^2 = 1 has only four integer solutions.
  sketch:
  - 'setup: Use the multiplicative norm N(a + bi) = a^2 + b^2.'
  - 'derive: A unit has norm 1.'
  - 'derive: a^2 + b^2 = 1 forces x to be 1, -1, i or -i.'
  - 'conclude: These four elements are indeed units.'
  openmath: (forall (x) (-> (in x gaussian_int) (<-> (unit_element x gaussian_int) (or (= x 1) (= x (neg 1)) (= x complex_i) (= x (neg complex_i))))))
  hard_negative:
    statement: 虚2次整数環$\mathbb{Z}[\sqrt{-d}]$（$d>0$）の単元はいつも$\pm 1,\pm\sqrt{-d}$である。
    reason: $d=2$では$\sqrt{-2}$のノルムは$2$なので単元でない。$d\geq 2$では単元は$\pm 1$だけである。
  target: |
    ∀ (x : GaussianInt), IsUnit x ↔ x = 1 ∨ x = -1 ∨ x = ⟨0, 1⟩ ∨ x = ⟨0, -1⟩
  proof: |
    by
      intro x
      rw [← Zsqrtd.norm_eq_one_iff' (by norm_num), Zsqrtd.norm_def]
      constructor
      · intro h
        have h1 : x.re * x.re + x.im * x.im = 1 := by linarith
        have hre : x.re ^ 2 ≤ 1 := by nlinarith [sq_nonneg x.im]
        have him : x.im ^ 2 ≤ 1 := by nlinarith [sq_nonneg x.re]
        have hre1 : -1 ≤ x.re ∧ x.re ≤ 1 := abs_le.mp (by simpa using abs_le_of_sq_le_sq' (a := x.re) (b := 1) (by simpa using hre) (by norm_num) |> fun h => abs_le.mpr h)
        have him1 : -1 ≤ x.im ∧ x.im ≤ 1 := abs_le.mp (by simpa using abs_le_of_sq_le_sq' (a := x.im) (b := 1) (by simpa using him) (by norm_num) |> fun h => abs_le.mpr h)
        obtain ⟨a, b⟩ := x
        simp only at h1 hre1 him1
        have ha : a = -1 ∨ a = 0 ∨ a = 1 := by omega
        have hb : b = -1 ∨ b = 0 ∨ b = 1 := by omega
        rcases ha with rfl | rfl | rfl <;> rcases hb with rfl | rfl | rfl <;> simp_all [Zsqrtd.ext_iff]
      · rintro (rfl | rfl | rfl | rfl) <;> simp
- id: sqrt_neg_d_two_irreducible_not_prime_not_ufd
  kind: textbook
  level: 3
  topic: 環論・2次整数環と一意分解
  statement: 整数$d\geq 3$について、$\mathbb{Z}[\sqrt{-d}]$で$2$は既約だが素元でなく、したがって$\mathbb{Z}[\sqrt{-d}]$は一意分解整域でない。これは$d=5$の場合の一般形である。
  statement_en: For an integer d ≥ 3, the element 2 of Z[sqrt(-d)] is irreducible but not prime, so Z[sqrt(-d)] is not a unique factorization domain; this generalizes the case d = 5.
  assumptions:
  - $d$は$3$以上の整数
  quantifiers:
  - 任意の整数$d\geq 3$
  conclusion: $\mathbb{Z}[\sqrt{-d}]$で$2$は既約だが素元でなく、$\mathbb{Z}[\sqrt{-d}]$は一意分解整域でない。
  answer: |
    $d\geq 3$を整数とする。$x=a+b\sqrt{-d}$に対し$N(x)=a^2+db^2\geq 0$とおく。$N$は乗法的で、$x$が単元であることと$N(x)=1$は同値である。

    $N(x)=2$となる$x$はない。実際$b\neq 0$なら$N(x)\geq d\geq 3$であり、$b=0$なら$a^2=2$となるが、これを満たす整数はない。

    $2$が既約であることを示す。$N(2)=4$なので$2$は単元でない。$2=xy$なら$N(x)N(y)=4$である。$N(x)=2$は起こらないので、$N(x)=1$または$N(y)=1$であり、$x$または$y$は単元である。

    $2$が素元でないことを示す。$2\mid a+b\sqrt{-d}$なら$b$は偶数である。$d$が偶数なら$\sqrt{-d}\cdot\sqrt{-d}=-d$は$2$で割り切れるが、$\sqrt{-d}$は$2$で割り切れない。$d$が奇数なら$(1+\sqrt{-d})(1-\sqrt{-d})=1+d$は$2$で割り切れるが、$1\pm\sqrt{-d}$は$2$で割り切れない。

    一意分解整域では既約元は素元である。$2$は既約だが素元でないので、$\mathbb{Z}[\sqrt{-d}]$は一意分解整域でない。
  strategy: The norm has no value 2 when d ≥ 3, which gives irreducibility; an explicit product divisible by 2 depending on the parity of d shows that 2 is not prime.
  sketch:
  - 'setup: Use the norm N(a + b sqrt(-d)) = a^2 + d b^2.'
  - 'derive: The value 2 is not attained because d ≥ 3.'
  - 'derive: Hence 2, of norm 4, is irreducible.'
  - 'case_split: For even d use sqrt(-d)^2; for odd d use (1 + sqrt(-d))(1 - sqrt(-d)).'
  - 'derive: 2 divides these products but not the factors, so it is not prime.'
  - 'conclude: Irreducibles are prime in a unique factorization domain, so the ring is not one.'
  openmath: (forall (d) (-> (and (in d Z) (>= d 3)) (and (irreducible_element 2 (int_adjoin_sqrt (neg d))) (not (prime_element 2 (int_adjoin_sqrt (neg d)))) (not (unique_factorization_domain (int_adjoin_sqrt (neg d)))))))
  hard_negative:
    statement: $d=1$や$d=2$でも$\mathbb{Z}[\sqrt{-d}]$で$2$は既約である。
    reason: $d=1$では$2=(1+i)(1-i)$であり、$d=2$では$2=-(\sqrt{-2})^2$である。どちらの因子も単元でない。
  target: |
    ∀ d : ℤ, 3 ≤ d → Irreducible (2 : Zsqrtd (-d)) ∧ ¬ Prime (2 : Zsqrtd (-d)) ∧ ¬ UniqueFactorizationMonoid (Zsqrtd (-d))
  proof: |
    by
      intro d hd
      have hdneg : -d ≤ 0 := by omega
      have hnorm : ∀ x : Zsqrtd (-d), x.norm = x.re * x.re + d * (x.im * x.im) := by
        intro x; rw [Zsqrtd.norm_def]; ring
      have hirr : Irreducible (2 : Zsqrtd (-d)) := by
        refine ⟨?_, ?_⟩
        · intro hu
          have := (Zsqrtd.norm_eq_one_iff' hdneg _).mpr hu
          rw [hnorm] at this
          simp at this
        · intro a b hab
          have h4 : a.norm * b.norm = 4 := by
            rw [← Zsqrtd.norm_mul, ← hab, hnorm]; simp
          have hane : 0 ≤ a.norm := Zsqrtd.norm_nonneg hdneg a
          have hno2 : ∀ x : Zsqrtd (-d), x.norm ≠ 2 := by
            intro x hx
            rw [hnorm] at hx
            by_cases him : x.im = 0
            · rw [him] at hx
              have h5 : x.re * x.re = 2 := by simpa using hx
              have h6 : x.re ≤ 1 ∨ 2 ≤ x.re := by omega
              have h7 : -1 ≤ x.re ∨ x.re ≤ -2 := by omega
              rcases h6 with h6 | h6 <;> rcases h7 with h7 | h7 <;> nlinarith
            · have h8 : 1 ≤ x.im * x.im := by
                have := mul_self_pos.mpr him
                omega
              nlinarith [mul_self_nonneg x.re]
          have h3 : a.norm = 1 ∨ b.norm = 1 := by
            have ha4 : a.norm ∣ 4 := ⟨_, h4.symm⟩
            have hle : a.norm ≤ 4 := Int.le_of_dvd (by norm_num) ha4
            have hpos : 0 < a.norm := by
              rcases hane.lt_or_eq with h | h
              · exact h
              · rw [← h] at h4; simp at h4
            have hc : a.norm = 1 ∨ a.norm = 2 ∨ a.norm = 3 ∨ a.norm = 4 := by omega
            rcases hc with h | h | h | h
            · exact Or.inl h
            · exact absurd h (hno2 a)
            · rw [h] at h4; omega
            · right; rw [h] at h4; omega
          rcases h3 with h | h
          · left; exact (Zsqrtd.norm_eq_one_iff' hdneg _).mp h
          · right; exact (Zsqrtd.norm_eq_one_iff' hdneg _).mp h
      have hnp : ¬ Prime (2 : Zsqrtd (-d)) := by
        intro hp
        have dvdiff : ∀ x : Zsqrtd (-d), (2 : Zsqrtd (-d)) ∣ x → (2 : ℤ) ∣ x.im := by
          rintro x ⟨c, rfl⟩
          exact ⟨c.im, by simp [Zsqrtd.im_mul]⟩
        obtain ⟨k, hk | hk⟩ := Int.even_or_odd' d
        · have : (2 : Zsqrtd (-d)) ∣ (⟨0, 1⟩ : Zsqrtd (-d)) * ⟨0, 1⟩ := by
            refine ⟨⟨-k, 0⟩, ?_⟩
            ext <;> simp [hk]
          rcases hp.2.2 _ _ this with h | h <;> exact absurd (dvdiff _ h) (by simp)
        · have : (2 : Zsqrtd (-d)) ∣ (⟨1, 1⟩ : Zsqrtd (-d)) * ⟨1, -1⟩ := by
            refine ⟨⟨k + 1, 0⟩, ?_⟩
            ext <;> simp [hk] <;> ring
          rcases hp.2.2 _ _ this with h | h <;> exact absurd (dvdiff _ h) (by simp)
      refine ⟨hirr, hnp, ?_⟩
      intro hu
      exact hnp ((UniqueFactorizationMonoid.irreducible_iff_prime).mp hirr)
- id: gaussian_quotient_field_prime_three_mod_four
  kind: gap
  level: 3
  topic: 環論・ガウス整数の剰余環
  statement: $4$で割って$3$余る素数$p$について、$\mathbb{Z}[i]/(p)$は体である。
  statement_en: For a prime number p congruent to 3 modulo 4, the quotient Z[i]/(p) is a field.
  assumptions:
  - $p$は素数で$p\equiv 3\pmod 4$
  quantifiers:
  - $4$で割って$3$余る任意の素数$p$
  conclusion: $\mathbb{Z}[i]/(p)$は体である。
  answer: |
    $p$を$4$で割って$3$余る素数とする。$N(a+bi)=a^2+b^2$は乗法的であり、$x$が$\mathbb{Z}[i]$の単元であることと$N(x)=1$は同値である。

    $p$が$\mathbb{Z}[i]$で既約であることを示す。$N(p)=p^2\neq 1$なので$p$は単元でない。$p=xy$とする。$N(x)N(y)=p^2$である。$x,y$がともに単元でないなら$N(x)=N(y)=p$であり、$p=a^2+b^2$となる整数$a,b$がある。平方数は$4$を法として$0$か$1$なので、$a^2+b^2$は$4$で割って$3$余らない。これは矛盾である。よって$x$または$y$は単元である。

    $\mathbb{Z}[i]$はノルムによるユークリッド整域なので、単項イデアル整域である。単項イデアル整域では、既約元で生成されるイデアルは極大である。よって$(p)$は極大イデアルであり、$\mathbb{Z}[i]/(p)$は体である。
  strategy: The congruence shows that p is not a sum of two squares, so p is irreducible in the principal ideal domain Z[i].
  sketch:
  - 'derive: p is not a unit, because N(p) = p^2.'
  - 'contradiction: A proper factorization gives p = a^2 + b^2, impossible modulo 4.'
  - 'apply_theorem: Z[i] is Euclidean, hence a principal ideal domain.'
  - 'derive: An irreducible element generates a maximal ideal.'
  - 'conclude: Therefore Z[i]/(p) is a field.'
  openmath: (forall (p) (-> (and (in p P) (= (nat_mod p 4) 3)) (is_field (quotient_ring gaussian_int (principal_ideal p)))))
  hard_negative:
    statement: すべての素数$p$について$\mathbb{Z}[i]/(p)$は体である。
    reason: $p=5$では$5=(2+i)(2-i)$なので、$\mathbb{Z}[i]/(5)$で$2+i$と$2-i$の類は零でなく、積が零である。
  target: |
    ∀ p : ℕ, p.Prime → p % 4 = 3 → IsField (GaussianInt ⧸ Ideal.span {(p : GaussianInt)})
  proof: |
    by
      intro p hp h
      haveI := Fact.mk hp
      have hprime : Prime (p : GaussianInt) := (GaussianInt.prime_iff_mod_four_eq_three_of_nat_prime p).mpr h
      have := PrincipalIdealRing.isMaximal_of_irreducible hprime.irreducible
      exact Ideal.Quotient.maximal_ideal_iff_isField_quotient _ |>.mp this
- id: power_series_over_domain_is_domain_x_prime
  kind: gap
  level: 2
  topic: 環論・形式的冪級数環
  statement: 整域$A$上の形式的冪級数環$A[[X]]$は整域であり、$X$はその素元である。
  statement_en: The ring A[[X]] of formal power series over an integral domain A is an integral domain, and X is a prime element of it.
  assumptions:
  - $A$は整域
  quantifiers:
  - 任意の整域$A$
  conclusion: $A[[X]]$は整域であり、$X$は素元である。
  answer: |
    $A$を整域とする。$A$は$A[[X]]$の定数として含まれるので、$A[[X]]$は零環でない。

    $f,g\in A[[X]]$を零でない元とする。$f$の零でない係数の最小の番号を$m$、$g$のそれを$n$とする。$fg$の$X^{m+n}$の係数は、$i+j=m+n$となる$f_ig_j$の和である。$i<m$または$j<n$の項は$0$であり、$i>m$なら$j<n$である。よって残るのは$f_mg_n$だけであり、$A$が整域なので零でない。したがって$fg\neq 0$であり、$A[[X]]$は整域である。

    $X$が素元であることを示す。$f\in A[[X]]$について、$X\mid f$は$f$の定数項が$0$であることと同値である。$X$の定数項は$0$で$1$でないので、$X$は零でも単元でもない。$X\mid fg$なら$f(0)g(0)=0$なので、$f(0)=0$または$g(0)=0$であり、$X\mid f$または$X\mid g$である。
  strategy: Compute the lowest coefficient of a product; divisibility by X is vanishing of the constant term.
  sketch:
  - 'setup: Let m and n be the orders of nonzero f and g.'
  - 'derive: The coefficient of X^(m+n) in fg is f_m g_n, which is nonzero.'
  - 'translate: X | f means that the constant term of f vanishes.'
  - 'conclude: Since A is a domain, X | fg gives X | f or X | g.'
  openmath: (forall (A) (-> (integral_domain A) (and (integral_domain (power_series_ring A)) (prime_element power_series_x (power_series_ring A)))))
  hard_negative:
    statement: 任意の可換環$A$について、$A[[X]]$の$X$は素元である。
    reason: $A=\mathbb{Z}/6\mathbb{Z}$では定数$2,3$について$X\mid 2\cdot 3=0$だが、$X\nmid 2$かつ$X\nmid 3$なので、$X$は素元でない。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A], IsDomain (PowerSeries A) ∧ Prime (PowerSeries.X : PowerSeries A)
  proof: |
    by
      intro A _ _
      exact ⟨inferInstance, PowerSeries.X_prime⟩
- id: field_power_series_ideals_are_x_powers
  kind: textbook
  level: 3
  topic: 環論・形式的冪級数環のイデアル
  statement: 体$K$上の形式的冪級数環$K[[X]]$のイデアルは、零イデアルか、ある非負整数$n$による$(X^n)$である。
  statement_en: Every ideal of the ring K[[X]] of formal power series over a field K is the zero ideal or (X^n) for some nonnegative integer n.
  assumptions:
  - $K$は体
  - $I$は$K[[X]]$のイデアル
  quantifiers:
  - 任意の体$K$とイデアル$I$
  conclusion: $I=0$であるか、$I=(X^n)$となる非負整数$n$が存在する。
  answer: |
    $K$を体、$I$を$K[[X]]$のイデアルとする。定数項が零でない冪級数は単元である。零でない$f\in K[[X]]$の零でない係数の最小の番号を$k$とすると、$f=X^ku$と書け、$u$の定数項は零でないので$u$は単元である。

    $I\neq 0$とする。$I$の零でない元$f=X^ku$をとると、$X^k=u^{-1}f\in I$である。よって$X^k\in I$となる非負整数$k$が存在する。その最小値を$n$とする。

    $(X^n)\subseteq I$である。逆に$g\in I$をとる。$g=0$なら$g\in(X^n)$である。$g\neq 0$なら$g=X^mv$、$v$は単元と書け、$X^m=v^{-1}g\in I$である。$n$の最小性より$m\geq n$であり、$g\in(X^n)$である。よって$I=(X^n)$である。
  strategy: Every nonzero series is X^k times a unit, so an ideal is determined by the smallest power of X it contains.
  sketch:
  - 'derive: A nonzero series has the form X^k u with u a unit.'
  - 'setup: For I ≠ 0 let n be the least k with X^k in I.'
  - 'derive: Any nonzero g = X^m v in I gives X^m in I, so m ≥ n.'
  - 'conclude: Hence I = (X^n).'
  openmath: (forall (K I) (-> (and (is_field K) (ideal_of I (power_series_ring K))) (or (= I (zero_ideal (power_series_ring K))) (exists (n) (and (in n N) (= I (principal_ideal (^ power_series_x n))))))))
  hard_negative:
    statement: 体$K$上の多項式環$K[X]$のイデアルは、零イデアルか$(X^n)$である。
    reason: $K=\mathbb{Q}$で$(X-1)$は$K[X]$のイデアルだが、$X^n$の単元倍で生成されない。$1-X$は$K[[X]]$では単元だが、$K[X]$では単元でない。
  target: |
    ∀ (K : Type*) [Field K] (I : Ideal (PowerSeries K)), I = ⊥ ∨ ∃ n : ℕ, I = Ideal.span {PowerSeries.X ^ n}
  proof: |
    by
      intro K _ I
      have dec : ∀ f : PowerSeries K, f ≠ 0 → ∃ (n : ℕ) (u : PowerSeries K), IsUnit u ∧ f = PowerSeries.X ^ n * u := by
        intro f hf
        refine ⟨f.order.toNat, PowerSeries.Unit_of_divided_by_X_pow_order f, Units.isUnit _, ?_⟩
        rw [PowerSeries.Unit_of_divided_by_X_pow_order_nonzero hf, PowerSeries.X_pow_order_mul_divXPowOrder]
      by_cases hI : I = ⊥
      · exact Or.inl hI
      right
      have hmem : ∀ (n : ℕ) (u : PowerSeries K), IsUnit u → PowerSeries.X ^ n * u ∈ I → PowerSeries.X ^ n ∈ I := by
        intro n u hu h
        obtain ⟨v, rfl⟩ := hu
        have h3 := I.mul_mem_right ((v⁻¹ : (PowerSeries K)ˣ) : PowerSeries K) h
        rwa [mul_assoc, Units.mul_inv, mul_one] at h3
      have hex : ∃ k : ℕ, PowerSeries.X ^ k ∈ I := by
        obtain ⟨f, hf, hf0⟩ := Submodule.exists_mem_ne_zero_of_ne_bot hI
        obtain ⟨n, u, hu, rfl⟩ := dec f hf0
        exact ⟨n, hmem n u hu hf⟩
      classical
      refine ⟨Nat.find hex, le_antisymm ?_ ?_⟩
      · intro g hg
        rw [Ideal.mem_span_singleton]
        by_cases hg0 : g = 0
        · simp [hg0]
        obtain ⟨m, u, hu, rfl⟩ := dec g hg0
        exact Dvd.dvd.mul_right (pow_dvd_pow _ (Nat.find_min' hex (hmem m u hu hg))) _
      · rw [Ideal.span_singleton_le_iff_mem]
        exact Nat.find_spec hex
- id: power_series_determined_by_derivative_and_constant
  kind: gap
  level: 2
  topic: 環論・形式的冪級数の微分
  statement: 正の整数倍が単射である可換環$A$上の形式的冪級数$f,g$について、形式微分が$f'=g'$を満たし定数項が等しいならば、$f=g$である。
  statement_en: For formal power series f and g over a commutative ring A on which multiplication by each positive integer is injective, if the formal derivatives satisfy f' = g' and the constant terms agree, then f = g.
  assumptions:
  - $A$は可換環で、正の整数$n$と$a\in A$について$na=0$なら$a=0$
  - $f,g\in A[[X]]$
  - $f'=g'$、$f(0)=g(0)$
  quantifiers:
  - 任意のそのような環$A$と冪級数$f,g$
  conclusion: $f=g$である。
  answer: |
    $A$を仮定のとおりとし、$f=\sum_nf_nX^n$、$g=\sum_ng_nX^n$とする。

    $f'=\sum_{n\geq 0}(n+1)f_{n+1}X^n$である。$f'=g'$より、すべての$n\geq 0$で$(n+1)f_{n+1}=(n+1)g_{n+1}$である。すなわち$(n+1)(f_{n+1}-g_{n+1})=0$であり、仮定より$f_{n+1}=g_{n+1}$である。定数項は$f_0=g_0$なので、すべての係数が等しく、$f=g$である。
  strategy: Compare coefficients of the derivatives and use injectivity of multiplication by positive integers.
  sketch:
  - 'setup: Write f and g with coefficients f_n and g_n.'
  - 'derive: f'' = g'' gives (n + 1)(f_(n+1) - g_(n+1)) = 0.'
  - 'derive: Injectivity gives f_(n+1) = g_(n+1).'
  - 'conclude: With f_0 = g_0 all coefficients agree.'
  openmath: (forall (A f g) (-> (and (comm_ring A) (forall (n a) (-> (and (in n N) (> n 0) (in a A) (= (* (ring_nat_cast n A) a) 0)) (= a 0))) (in f (power_series_ring A)) (in g (power_series_ring A)) (= (power_series_derivative f) (power_series_derivative g)) (= (power_series_coeff f 0) (power_series_coeff g 0))) (= f g)))
  hard_negative:
    statement: 任意の可換環上で、$f'=g'$かつ定数項が等しければ$f=g$である。
    reason: $A=\mathbb{F}_2$で$f=X^2$、$g=0$とすると、$f'=2X=0=g'$で定数項も等しいが、$f\neq g$である。
  target: |
    ∀ (A : Type*) [CommRing A] [IsAddTorsionFree A] (f g : PowerSeries A), PowerSeries.derivative A f = PowerSeries.derivative A g → PowerSeries.constantCoeff f = PowerSeries.constantCoeff g → f = g
  proof: |
    by
      intro A _ _ f g h1 h2
      exact PowerSeries.derivative.ext h1 h2
- id: power_series_exp_times_exp_neg
  kind: gap
  level: 2
  topic: 環論・形式的冪級数の指数関数
  statement: 有理数体上の可換多元環$A$上の形式的冪級数$E=\sum_{n\geq 0}X^n/n!$について、$E(X)E(-X)=1$である。
  statement_en: For the formal power series E, the sum of X^n/n! over n ≥ 0, over a commutative algebra A over the rationals, one has E(X)E(-X) = 1.
  assumptions:
  - $A$は$\mathbb{Q}$上の可換多元環
  - $E=\sum_{n\geq 0}X^n/n!\in A[[X]]$
  quantifiers:
  - 任意の$\mathbb{Q}$上の可換多元環$A$
  conclusion: $E(X)E(-X)=1$である。
  answer: |
    $A$を$\mathbb{Q}$上の可換多元環とする。$E(X)E(-X)$の$X^n$の係数は、
    $\sum_{i+j=n}\frac{1}{i!}\cdot\frac{(-1)^j}{j!}=\frac{1}{n!}\sum_{j=0}^{n}\binom{n}{j}(-1)^j=\frac{(1-1)^n}{n!}$である。

    これは$n=0$で$1$、$n\geq 1$で$0$である。よって$E(X)E(-X)=1$である。
  strategy: Compute the coefficients of the product with the binomial theorem applied to (1 - 1)^n.
  sketch:
  - 'setup: Write the coefficient of X^n as a sum over i + j = n.'
  - 'derive: The sum equals (1 - 1)^n / n! by the binomial theorem.'
  - 'conclude: It is 1 for n = 0 and 0 otherwise.'
  openmath: (forall (A) (-> (and (comm_ring A) (exists (f) (ring_hom f Q A))) (= (* (power_series_exp A) (power_series_eval_neg (power_series_exp A))) 1)))
  hard_negative:
    statement: $E(X)E(X)=1$である。
    reason: $E(X)^2$の$X$の係数は$2$であり、$1$の$X$の係数$0$と異なる。
  target: |
    ∀ (A : Type*) [CommRing A] [Algebra ℚ A], PowerSeries.exp A * PowerSeries.evalNegHom (PowerSeries.exp A) = 1
  proof: |
    by
      intro A _ _
      exact PowerSeries.exp_mul_exp_neg_eq_one
- id: power_series_jacobson_iff_constant_coeff
  kind: gap
  level: 4
  topic: 環論・形式的冪級数環のジャコブソン根基
  statement: 可換環$A$上の形式的冪級数$f$が$A[[X]]$のジャコブソン根基に属することと、$f$の定数項が$A$のジャコブソン根基に属することは同値である。
  statement_en: A formal power series f over a commutative ring A lies in the Jacobson radical of A[[X]] if and only if its constant term lies in the Jacobson radical of A.
  assumptions:
  - $A$は可換環
  - $f\in A[[X]]$
  quantifiers:
  - 任意の可換環$A$と冪級数$f$
  conclusion: $f\in J(A[[X]])$であることと、$f(0)\in J(A)$であることは同値である。
  answer: |
    $A$を可換環、$f\in A[[X]]$とする。可換環$B$の元$x$がジャコブソン根基に属することと、すべての$y\in B$で$1+xy$が単元であることは同値である。また冪級数が単元であることと、定数項が単元であることは同値である。

    $f\in J(A[[X]])$とする。$y\in A$をとると、$1+fy$は単元なので、その定数項$1+f(0)y$は$A$の単元である。よって$f(0)\in J(A)$である。

    $f(0)\in J(A)$とする。$g\in A[[X]]$をとる。$1+fg$の定数項は$1+f(0)g(0)$であり、$A$の単元である。よって$1+fg$は単元である。したがって$f\in J(A[[X]])$である。
  strategy: Combine the criterion that 1 + xy is a unit for all y with the fact that power series are units exactly when their constant terms are.
  sketch:
  - 'setup: x lies in the Jacobson radical exactly when 1 + xy is a unit for all y.'
  - 'setup: A power series is a unit exactly when its constant term is a unit.'
  - 'derive: Constant multipliers y give f(0) in J(A).'
  - 'derive: The constant term of 1 + fg is 1 + f(0)g(0), a unit.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (A f) (-> (and (comm_ring A) (in f (power_series_ring A))) (<-> (in f (jacobson_radical (power_series_ring A))) (in (power_series_coeff f 0) (jacobson_radical A)))))
  hard_negative:
    statement: 多項式環についても、$f\in J(A[X])$であることと$f(0)\in J(A)$であることは同値である。
    reason: $A=\mathbb{Q}$、$f=X$では$f(0)=0\in J(A)$だが、$1+X$は$\mathbb{Q}[X]$の単元でないので$X\notin J(A[X])$である。
  target: |
    ∀ (A : Type*) [CommRing A] (f : PowerSeries A), f ∈ Ring.jacobson (PowerSeries A) ↔ PowerSeries.constantCoeff f ∈ Ring.jacobson A
  proof: |
    by
      intro A _ f
      rw [← Ideal.jacobson_bot, ← Ideal.jacobson_bot, Ideal.mem_jacobson_bot, Ideal.mem_jacobson_bot]
      constructor
      · intro h y
        have := h (PowerSeries.C y)
        rw [PowerSeries.isUnit_iff_constantCoeff] at this
        simpa using this
      · intro h y
        rw [PowerSeries.isUnit_iff_constantCoeff]
        simpa using h (PowerSeries.constantCoeff y)
- id: fraction_fields_isomorphic_over_domain
  kind: textbook
  level: 3
  topic: 環論・分数体
  statement: 整域$A$の二つの分数体$K,L$の間には、$A$の元を固定する体同型$K\to L$が存在する。
  statement_en: For two fraction fields K and L of an integral domain A, there is a field isomorphism from K to L fixing the elements of A.
  assumptions:
  - $A$は整域
  - $K,L$は$A$の分数体
  quantifiers:
  - 任意の整域$A$と分数体$K,L$
  conclusion: $A$の元を固定する体同型$K\to L$が存在する。
  answer: |
    $A$を整域、$K,L$をその分数体とし、$A$を$K,L$の部分環とみなす。分数体の普遍性より、体への単射環準同型$A\to L$は、環準同型$K\to L$に一意的に延長される。

    包含$A\to L$の延長を$\varphi\colon K\to L$、包含$A\to K$の延長を$\psi\colon L\to K$とする。$\psi\circ\varphi\colon K\to K$は$A$の元を固定する環準同型である。恒等写像も同じ条件を満たすので、普遍性の一意性より$\psi\circ\varphi$は恒等写像である。同様に$\varphi\circ\psi$も恒等写像である。よって$\varphi$は$A$の元を固定する体同型である。
  strategy: Extend the two inclusions by the universal property and use uniqueness to see that the composites are identities.
  sketch:
  - 'apply_theorem: The inclusions extend to φ from K to L and ψ from L to K.'
  - 'derive: ψφ and the identity of K agree on A.'
  - 'derive: Uniqueness gives ψφ = id, and similarly φψ = id.'
  - 'conclude: φ is an isomorphism fixing A.'
  openmath: (forall (A K L) (-> (and (integral_domain A) (fraction_field_of K A) (fraction_field_of L A)) (exists (e) (and (ring_iso e K L) (forall (a) (-> (in a A) (= (fn_value e (fn_value (fraction_embedding A K) a)) (fn_value (fraction_embedding A L) a))))))))
  hard_negative:
    statement: 整域$A$を含む任意の二つの体は$A$上同型である。
    reason: $\mathbb{Z}$を含む体$\mathbb{Q}$と$\mathbb{R}$は同型でない。$\mathbb{R}$は$\mathbb{Z}$の分数体でない。
  target: |
    ∀ (A K L : Type*) [CommRing A] [IsDomain A] [Field K] [Field L] [Algebra A K] [Algebra A L] [IsFractionRing A K] [IsFractionRing A L], ∃ e : K ≃+* L, ∀ a : A, e (algebraMap A K a) = algebraMap A L a
  proof: |
    by
      intro A K L _ _ _ _ _ _ _ _
      let e := IsLocalization.algEquiv (nonZeroDivisors A) K L
      exact ⟨e.toRingEquiv, fun a => e.commutes a⟩
- id: ufd_fraction_in_lowest_terms
  kind: gap
  level: 3
  topic: 環論・分数体と既約分数
  statement: 一意分解整域$A$の分数体の零でない元は、公約元がすべて単元である零でない$a,b\in A$により$a/b$と書ける。
  statement_en: Every nonzero element of the fraction field of a unique factorization domain A can be written as a/b with nonzero a and b in A whose common divisors are all units.
  assumptions:
  - $A$は一意分解整域、$K$はその分数体
  - $x\in K$、$x\neq 0$
  quantifiers:
  - 任意の一意分解整域$A$、分数体$K$、零でない元$x$
  conclusion: $x=a/b$となり、公約元がすべて単元である零でない$a,b\in A$が存在する。
  answer: |
    $A$を一意分解整域、$K$をその分数体、$x\in K$を零でない元とする。分数体の定義より、$x=a_0/b_0$（$a_0,b_0\in A$、$b_0\neq 0$）と書ける。$x\neq 0$より$a_0\neq 0$である。

    一意分解整域では最大公約元が存在するので、$d=\gcd(a_0,b_0)$とおき、$a_0=da$、$b_0=db$と書く。$d\neq 0$なので$x=a/b$であり、$a,b\neq 0$である。

    $c$が$a,b$の公約元なら、$dc$は$a_0,b_0$の公約元なので$dc\mid d$である。$A$は整域で$d\neq 0$なので$c\mid 1$であり、$c$は単元である。
  strategy: Divide numerator and denominator by a greatest common divisor.
  sketch:
  - 'setup: Write x = a_0 / b_0 with a_0 and b_0 nonzero.'
  - 'construct: Let d = gcd(a_0, b_0), a_0 = da and b_0 = db.'
  - 'derive: A common divisor c of a and b gives dc | d, so c is a unit.'
  - 'conclude: x = a/b is in lowest terms.'
  openmath: (forall (A K x) (-> (and (unique_factorization_domain A) (fraction_field_of K A) (in x K) (!= x 0)) (exists (a b) (and (in a A) (in b A) (!= a 0) (!= b 0) (relatively_prime_elements a b) (= x (/ (fn_value (fraction_embedding A K) a) (fn_value (fraction_embedding A K) b)))))))
  hard_negative:
    statement: 既約な表し方$x=a/b$で、$a,b$は$x$から一意に決まる。
    reason: $\mathbb{Q}$で$1/2=(-1)/(-2)$であり、単元倍の違いが残る。
  target: |
    ∀ (A K : Type*) [CommRing A] [IsDomain A] [UniqueFactorizationMonoid A] [Field K] [Algebra A K] [IsFractionRing A K] (x : K), x ≠ 0 → ∃ a b : A, a ≠ 0 ∧ b ≠ 0 ∧ IsRelPrime a b ∧ x = algebraMap A K a / algebraMap A K b
  proof: |
    by
      intro A K _ _ _ _ _ _ x hx
      obtain ⟨a, ⟨b, hb⟩, hab, hx'⟩ := IsFractionRing.exists_reduced_fraction (A := A) x
      have hb0 : b ≠ 0 := nonZeroDivisors.ne_zero hb
      have ha0 : a ≠ 0 := by
        rintro rfl
        apply hx
        rw [← hx']
        simp
      refine ⟨a, b, ha0, hb0, hab, ?_⟩
      rw [← hx']
      exact IsFractionRing.mk'_eq_div ⟨b, hb⟩
- id: matrix_units_multiplication_rule
  kind: gap
  level: 2
  topic: 環論・行列環と行列単位
  statement: 1をもつ環$A$上の正方行列環で、$(i,j)$成分が$a$で他が$0$の行列を$aE_{ij}$と書くと、$(aE_{ij})(bE_{kl})$は$j=k$のとき$(ab)E_{il}$、$j\neq k$のとき$0$である。
  statement_en: In the square matrix ring over a ring A with identity, writing aE_ij for the matrix with entry a at position (i, j) and zeros elsewhere, the product (aE_ij)(bE_kl) equals (ab)E_il if j = k and 0 if j ≠ k.
  assumptions:
  - $A$は1をもつ環（可換とは限らない）
  - $M_n(A)$は有限集合を添字とする正方行列環
  - $a,b\in A$、$i,j,k,l$は添字
  quantifiers:
  - 任意の環$A$、添字$i,j,k,l$、元$a,b$
  conclusion: $(aE_{ij})(bE_{kl})$は$j=k$なら$(ab)E_{il}$であり、$j\neq k$なら$0$である。
  answer: |
    $A$を1をもつ環とし、$P=aE_{ij}$、$Q=bE_{kl}$とおく。積$PQ$の$(r,s)$成分は$\sum_tP_{rt}Q_{ts}$である。

    $P_{rt}$が零でないのは$(r,t)=(i,j)$のときだけであり、$Q_{ts}$が零でないのは$(t,s)=(k,l)$のときだけである。よって$t=j=k$、$r=i$、$s=l$のときにだけ項が残りうる。

    $j\neq k$ならすべての項が$0$であり、$PQ=0$である。$j=k$なら$(i,l)$成分は$ab$であり、他の成分は$0$である。よって$PQ=(ab)E_{il}$である。
  strategy: Compute the entries of the product from the definition.
  sketch:
  - 'setup: The (r, s) entry of the product is a sum over t.'
  - 'derive: A term survives only if t = j = k, r = i and s = l.'
  - 'conclude: This gives (ab)E_il when j = k and 0 otherwise.'
  openmath: (forall (A a b i j k l) (-> (and (is_ring A) (in a A) (in b A)) (and (-> (= j k) (= (* (matrix_unit i j a) (matrix_unit k l b)) (matrix_unit i l (* a b)))) (-> (!= j k) (= (* (matrix_unit i j a) (matrix_unit k l b)) 0)))))
  hard_negative:
    statement: 行列単位について$E_{ij}E_{kl}=E_{kl}E_{ij}$である。
    reason: $E_{12}E_{21}=E_{11}$であり、$E_{21}E_{12}=E_{22}$である。
  target: |
    ∀ (A : Type*) [Ring A] (n : Type*) [Fintype n] [DecidableEq n] (i j k l : n) (a b : A), Matrix.single i j a * Matrix.single k l b = if j = k then Matrix.single i l (a * b) else 0
  proof: |
    by
      intro A _ n _ _ i j k l a b
      split_ifs with h
      · subst h; exact Matrix.single_mul_single_same a i j l b
      · exact Matrix.single_mul_single_of_ne a i j k h b
- id: matrix_commuting_with_all_is_scalar
  kind: textbook
  level: 2
  topic: 環論・行列環の中心
  statement: 可換環$A$上の正方行列環（添字集合は空でない有限集合）で、すべての行列と可換な行列はスカラー行列$rI$である。逆にスカラー行列はすべての行列と可換である。
  statement_en: In the square matrix ring over a commutative ring A, indexed by a nonempty finite set, a matrix commutes with every matrix if and only if it is a scalar matrix rI.
  assumptions:
  - $A$は可換環
  - 添字集合は空でない有限集合
  - $P\in M_n(A)$
  quantifiers:
  - 任意の可換環$A$、添字集合、行列$P$
  conclusion: $P$がすべての行列と可換であることと、$P=rI$となる$r\in A$が存在することは同値である。
  answer: |
    $A$を可換環、$P\in M_n(A)$とする。$E_{ij}$を$(i,j)$成分が$1$で他が$0$の行列とする。

    $P$がすべての行列と可換であるとする。$PE_{ij}$の$(i,j)$成分は$P_{ii}$であり、$E_{ij}P$の$(i,j)$成分は$P_{jj}$である。よって$P_{ii}=P_{jj}$である。

    $i\neq j$とする。$PE_{jj}$の$(i,j)$成分は$P_{ij}$である。$E_{jj}P$の第$i$行は$0$なので、その$(i,j)$成分は$0$である。よって$P_{ij}=0$である。

    したがって$P$は対角成分がすべて等しい対角行列であり、その値を$r$とすると$P=rI$である。

    逆に$P=rI$なら、$A$が可換なので、任意の行列$Q$について$(rI)Q=rQ=Qr=Q(rI)$である。
  strategy: Commuting with matrix units forces the off-diagonal entries to vanish and the diagonal entries to agree.
  sketch:
  - 'setup: Compare PE_ij and E_ij P at position (i, j).'
  - 'derive: This gives P_ii = P_jj.'
  - 'derive: Comparing PE_jj and E_jj P at (i, j) with i ≠ j gives P_ij = 0.'
  - 'conclude: So P = rI, and scalar matrices commute with everything because A is commutative.'
  openmath: (forall (A n C1) (-> (and (comm_ring A) (in C1 (matrix_ring n A))) (<-> (forall (B) (-> (in B (matrix_ring n A)) (= (* C1 B) (* B C1)))) (exists (r) (and (in r A) (= C1 (scalar_matrix r)))))))
  hard_negative:
    statement: 非可換環$A$上でもスカラー行列$rI$はすべての行列と可換である。
    reason: $A$が非可換で$rs\neq sr$なら、$(rI)(sI)=(rs)I$と$(sI)(rI)=(sr)I$は異なる。中心の元$r$でなければならない。
  target: |
    ∀ (A : Type*) [CommRing A] (n : Type*) [Fintype n] [DecidableEq n] [Nonempty n] (P : Matrix n n A), (∀ Q : Matrix n n A, P * Q = Q * P) ↔ ∃ r : A, P = Matrix.scalar n r
  proof: |
    by
      intro A _ n _ _ _ P
      constructor
      · intro h
        obtain ⟨i0⟩ := ‹Nonempty n›
        refine ⟨P i0 i0, ?_⟩
        have hdiag : ∀ i j : n, P i i = P j j := by
          intro i j
          have h1 := congrFun (congrFun (h (Matrix.single i j (1 : A))) i) j
          rw [Matrix.mul_single_apply_same, Matrix.single_mul_apply_same] at h1
          simpa using h1
        have hoff : ∀ i j : n, i ≠ j → P i j = 0 := by
          intro i j hij
          have h1 := congrFun (congrFun (h (Matrix.single j j (1 : A))) i) j
          rw [Matrix.mul_single_apply_same, Matrix.single_mul_apply_of_ne (1 : A) j j i j hij P] at h1
          simpa using h1
        ext i j
        by_cases hij : i = j
        · subst hij
          simp [Matrix.scalar_apply, hdiag i i0]
        · simp [Matrix.scalar_apply, hij, hoff i j hij]
      · rintro ⟨r, rfl⟩ Q
        exact Matrix.scalar_commute r (fun _ => mul_comm _ _) Q
- id: matrix_ring_over_field_is_simple
  kind: textbook
  level: 3
  topic: 環論・行列環と単純環
  statement: 体$K$上の正方行列環（添字集合は空でない有限集合）は単純環である。すなわち零環でなく、両側イデアルは$0$と全体だけである。
  statement_en: The square matrix ring over a field K, indexed by a nonempty finite set, is a simple ring, that is, it is nonzero and its only two-sided ideals are 0 and the whole ring.
  assumptions:
  - $K$は体
  - 添字集合は空でない有限集合
  quantifiers:
  - 任意の体$K$と添字集合
  conclusion: $M_n(K)$は単純環である。
  answer: |
    $K$を体とし、$M_n(K)$を添字集合が空でない有限集合の正方行列環とする。単位行列は零でないので、$M_n(K)$は零環でない。

    $I$を零でない両側イデアルとする。零でない$P\in I$をとり、$P_{ij}\neq 0$とする。行列単位$E_{pq}$について、$E_{pi}PE_{jq}=P_{ij}E_{pq}$である。$P_{ij}$は$K$で可逆なので、スカラー倍して$E_{pq}\in I$が任意の$p,q$で成り立つ。

    単位行列は$\sum_pE_{pp}$なので$I$に属する。よって$I=M_n(K)$である。
  strategy: Multiply a nonzero matrix on both sides by matrix units to produce all matrix units in the ideal.
  sketch:
  - 'setup: Take a nonzero P in a two-sided ideal I with P_ij ≠ 0.'
  - 'derive: E_pi P E_jq = P_ij E_pq.'
  - 'derive: Since P_ij is invertible, every E_pq lies in I.'
  - 'conclude: The identity is the sum of the E_pp, so I is the whole ring.'
  openmath: (forall (K n) (-> (and (is_field K) (finite_set n) (!= n emptyset)) (simple_ring (matrix_ring n K))))
  hard_negative:
    statement: $M_n(K)$には左イデアルも$0$と全体しかない。
    reason: $n\geq 2$なら、第1列が$0$である行列全体は$0$でも全体でもない左イデアルである。
  target: |
    ∀ (K : Type*) [Field K] (n : Type*) [Fintype n] [DecidableEq n] [Nonempty n], IsSimpleRing (Matrix n n K)
  proof: |
    by
      intro K _ n _ _ _
      infer_instance
- id: matrix_column_left_ideal_not_right_ideal
  kind: gap
  level: 3
  topic: 環論・非可換環の左右イデアル
  statement: 体$K$上の正方行列環（添字は2個以上）で、添字$j$を固定すると、第$j$列がすべて$0$である行列全体は左イデアルであるが、右イデアルではない。
  statement_en: In the square matrix ring over a field K with at least two indices, for a fixed index j, the set of matrices whose j-th column vanishes is a left ideal but not a right ideal.
  assumptions:
  - $K$は体
  - 添字集合は2個以上の元をもつ有限集合
  - $j$は添字
  quantifiers:
  - 任意の体$K$、添字集合、添字$j$
  conclusion: 第$j$列が$0$の行列全体$L$は左イデアルであり、$P\in L$と行列$Q$で$PQ\notin L$となるものが存在する。
  answer: |
    $K$を体、$j$を添字とし、$L$を第$j$列がすべて$0$である行列全体とする。$L$は和で閉じ、零行列を含む。

    $P\in L$と行列$Q$について、$(QP)_{ij}=\sum_tQ_{it}P_{tj}=0$である。よって$QP\in L$であり、$L$は左イデアルである。

    添字は2個以上あるので、$k\neq j$をとる。$P=E_{kk}$とすると、第$j$列は$0$なので$P\in L$である。$Q=E_{kj}$とすると$PQ=E_{kk}E_{kj}=E_{kj}$であり、その$(k,j)$成分は$1$である。よって$PQ\notin L$であり、$L$は右イデアルでない。
  strategy: Left multiplication acts on columns, so a zero column stays zero; a matrix unit shows that right multiplication can move entries into column j.
  sketch:
  - 'derive: (QP)_ij is a combination of the entries P_tj, so L is a left ideal.'
  - 'setup: Pick k ≠ j.'
  - 'construct: Take P = E_kk in L and Q = E_kj.'
  - 'conclude: PQ = E_kj is not in L, so L is not a right ideal.'
  openmath: (forall (K n j) (-> (and (is_field K) (finite_set n) (in j n) (exists (k) (and (in k n) (!= k j)))) (exists (L) (and (left_ideal_of L (matrix_ring n K)) (forall (B) (-> (in B (matrix_ring n K)) (<-> (in B L) (forall (i) (= (matrix_entry B i j) 0))))) (exists (B D) (and (in B L) (in D (matrix_ring n K)) (notin (* B D) L)))))))
  hard_negative:
    statement: 第$j$行が$0$である行列全体は左イデアルである。
    reason: $k\neq j$として$P=E_{kk}$は第$j$行が$0$だが、$Q=E_{jk}$とすると$QP=E_{jk}$の第$j$行は零でない。行で定めると右イデアルになる。
  target: |
    ∀ (K : Type*) [Field K] (n : Type*) [Fintype n] [DecidableEq n] [Nontrivial n] (j : n), ∃ L : Ideal (Matrix n n K), (∀ P : Matrix n n K, P ∈ L ↔ ∀ i, P i j = 0) ∧ ∃ P ∈ L, ∃ Q : Matrix n n K, P * Q ∉ L
  proof: |
    by
      intro K _ n _ _ _ j
      obtain ⟨k, hk⟩ := exists_ne j
      refine ⟨{ carrier := {P | ∀ i, P i j = 0}, add_mem' := ?_, zero_mem' := ?_, smul_mem' := ?_ }, fun P => Iff.rfl, ?_⟩
      · intro a b ha hb i
        simp [ha i, hb i]
      · intro i; rfl
      · intro c x hx i
        have hx' : ∀ i, x i j = 0 := hx
        simp [Matrix.mul_apply, hx']
      · refine ⟨Matrix.single k k 1, ?_, Matrix.single k j 1, ?_⟩
        · intro i
          simp [Matrix.single]
          exact fun _ => hk
        · intro h
          have := h k
          rw [Matrix.single_mul_single_same] at this
          simp at this
- id: ring_left_ideals_trivial_iff_division_ring
  kind: gap
  level: 3
  topic: 環論・斜体と左イデアル
  statement: 零環でない1をもつ環（可換とは限らない）について、左イデアルが$0$と全体だけであることと、零でない元がすべて単元である（斜体である）ことは同値である。
  statement_en: For a nonzero ring with identity, not necessarily commutative, the only left ideals are 0 and the whole ring if and only if every nonzero element is a unit, that is, the ring is a division ring.
  assumptions:
  - $A$は零環でない1をもつ環（可換とは限らない）
  quantifiers:
  - 任意の零環でない環$A$
  conclusion: $A$の左イデアルが$0$と$A$だけであることと、$A$の零でない元がすべて単元であることは同値である。
  answer: |
    $A$を零環でない1をもつ環とする。

    零でない元がすべて単元であるとする。$I$を零でない左イデアルとし、$0\neq a\in I$をとる。$1=a^{-1}a\in I$なので$I=A$である。

    逆に左イデアルが$0$と$A$だけであるとする。$x\neq 0$なら、左イデアル$Ax$は$x$を含むので零でなく、$Ax=A$である。よって$yx=1$となる$y$がある。つまり零でない元は左逆元をもつ。

    $a\neq 0$とし、$ba=1$となる$b$をとる。$b=0$なら$1=0$となり矛盾するので$b\neq 0$である。よって$cb=1$となる$c$がある。$c=c(ba)=(cb)a=a$である。したがって$ab=1$であり、$b$は$a$の両側の逆元である。
  strategy: The left ideal Ax gives a left inverse of each nonzero x; applying this to the left inverse shows it is two-sided.
  sketch:
  - 'derive: In a division ring a nonzero left ideal contains 1.'
  - 'setup: Conversely Ax = A for nonzero x gives yx = 1.'
  - 'derive: For a ≠ 0 take ba = 1 and cb = 1.'
  - 'derive: c = c(ba) = (cb)a = a, so ab = 1.'
  - 'conclude: Every nonzero element is a unit.'
  openmath: (forall (A) (-> (and (is_ring A) (nontrivial_ring A)) (<-> (forall (J) (-> (left_ideal_of J A) (or (= J (zero_ideal A)) (= J (unit_ideal A))))) (forall (a) (-> (and (in a A) (!= a 0)) (unit_element a A))))))
  hard_negative:
    statement: 零環でない環の両側イデアルが$0$と全体だけならば、その環は斜体である。
    reason: $M_2(\mathbb{Q})$の両側イデアルは$0$と全体だけだが、$E_{11}$は零でも単元でもない。
  target: |
    ∀ (A : Type*) [Ring A] [Nontrivial A], (∀ J : Ideal A, J = ⊥ ∨ J = ⊤) ↔ ∀ a : A, a ≠ 0 → IsUnit a
  proof: |
    by
      intro A _ _
      constructor
      · intro h a ha
        have key : ∀ x : A, x ≠ 0 → ∃ y : A, y * x = 1 := by
          intro x hx
          rcases h (Ideal.span {x}) with h1 | h1
          · exfalso; apply hx
            rw [Ideal.span_singleton_eq_bot] at h1
            exact h1
          · have : (1 : A) ∈ Ideal.span {x} := by rw [h1]; trivial
            exact Ideal.mem_span_singleton'.mp this
        obtain ⟨b, hb⟩ := key a ha
        have hb0 : b ≠ 0 := by rintro rfl; simp at hb
        obtain ⟨c, hc⟩ := key b hb0
        have hca : c = a := by
          calc c = c * (b * a) := by rw [hb, mul_one]
            _ = (c * b) * a := by rw [mul_assoc]
            _ = a := by rw [hc, one_mul]
        exact ⟨⟨a, b, by rw [← hca]; exact hc, hb⟩, rfl⟩
      · intro h J
        by_cases hJ : J = ⊥
        · exact Or.inl hJ
        · right
          obtain ⟨a, ha, ha0⟩ := Submodule.exists_mem_ne_zero_of_ne_bot hJ
          exact Ideal.eq_top_of_isUnit_mem J ha (h a ha0)
- id: little_wedderburn_finite_division_ring_commutative
  kind: named
  level: 3
  topic: 環論・斜体
  statement: ウェダーバーンの小定理。有限斜体は可換であり、体である。
  statement_en: Wedderburn's little theorem. Every finite division ring is commutative, hence a field.
  assumptions:
  - $D$は有限斜体
  quantifiers:
  - 任意の有限斜体$D$
  conclusion: すべての$x,y\in D$で$xy=yx$である。
  answer: |
    $D$を有限斜体、$Z$をその中心とする。$Z$は体であり、$q=|Z|\geq 2$とする。$D$は$Z$上の有限次ベクトル空間なので、次元を$n$とすると$|D|=q^n$である。$n=1$を示せばよい。

    $x\in D^\times$の中心化群を$C(x)^\times$とする。$C(x)=\{y\mid xy=yx\}$は$Z$を含む部分斜体なので、$|C(x)|=q^{d}$と書ける。$D$は$C(x)$上の左ベクトル空間なので、次元の積公式より$d\mid n$である。

    群$D^\times$の類等式は$q^n-1=(q-1)+\sum_x\frac{q^n-1}{q^{d_x}-1}$である。和は中心に属さない元の共役類の代表についてとり、$d_x<n$かつ$d_x\mid n$である。

    $n\geq 2$と仮定する。$\Phi_n$を$n$次円分多項式とする。$\Phi_n$は整数係数モニックで、$X^n-1=\prod_{d\mid n}\Phi_d$である。$d\mid n$、$d<n$なら$\Phi_n$は$(X^n-1)/(X^d-1)$を割り、商は整数係数である。よって整数$\Phi_n(q)$は$q^n-1$と和の各項を割る。類等式より$\Phi_n(q)\mid q-1$である。

    一方$\Phi_n(q)=\prod_\zeta(q-\zeta)$で、$\zeta$は1の原始$n$乗根全体を動く。$n\geq 2$なので$\zeta\neq 1$であり、$|q-\zeta|>q-1\geq 1$である。よって$|\Phi_n(q)|>q-1$となり、$\Phi_n(q)\mid q-1$かつ$q-1>0$に反する。したがって$n=1$であり、$D=Z$は可換である。
  strategy: Apply the class equation of the unit group and compare with the value of a cyclotomic polynomial at q.
  sketch:
  - 'setup: Let Z be the center with q elements and n the dimension of D over Z.'
  - 'derive: Centralizers have size q^d with d | n.'
  - 'apply_theorem: The class equation reads q^n - 1 = q - 1 + sum (q^n - 1)/(q^d - 1).'
  - 'derive: For n ≥ 2 the integer Φ_n(q) divides every other term, hence q - 1.'
  - 'contradiction: But |Φ_n(q)| > q - 1, since |q - ζ| > q - 1 for each primitive n-th root ζ.'
  - 'conclude: Hence n = 1 and D = Z is commutative.'
  openmath: (forall (D) (-> (and (division_ring D) (finite_ring D)) (forall (x y) (-> (and (in x D) (in y D)) (= (* x y) (* y x))))))
  hard_negative:
    statement: 無限斜体も可換である。
    reason: ハミルトンの四元数環は無限斜体だが、$ij=k$、$ji=-k$なので可換でない。
  target: |
    ∀ (D : Type*) [DivisionRing D] [Finite D], ∀ x y : D, x * y = y * x
  proof: |
    by
      intro D _ _ x y
      letI := littleWedderburn D
      exact mul_comm x y
- id: quaternions_noncommutative_division_ring
  kind: textbook
  level: 2
  topic: 環論・斜体と四元数
  statement: 実四元数環$\mathbb{H}$の零でない元はすべて両側の逆元をもち、$\mathbb{H}$は可換でない。したがって$\mathbb{H}$は体でない斜体である。
  statement_en: Every nonzero element of the ring H of real quaternions has a two-sided inverse, and H is not commutative; hence H is a division ring that is not a field.
  assumptions:
  - $\mathbb{H}$は$\mathbb{R}$上の四元数環
  quantifiers:
  - 任意の零でない$x\in\mathbb{H}$
  conclusion: $xy=yx=1$となる$y$が存在し、$\mathbb{H}$には$xy\neq yx$となる元がある。
  answer: |
    $x=a+bi+cj+dk\in\mathbb{H}$を零でない元とする。$\bar{x}=a-bi-cj-dk$、$N=a^2+b^2+c^2+d^2$とおく。$a,b,c,d$のどれかは零でないので$N>0$である。

    定義に従って展開すると、$x\bar{x}=\bar{x}x=N$である。$N$は実数であり、$\mathbb{H}$のすべての元と可換である。よって$y=N^{-1}\bar{x}$とすると$xy=yx=1$である。

    また$ij=k$、$ji=-k$であり、$k\neq -k$なので、$ij\neq ji$である。よって$\mathbb{H}$は可換でない。
  strategy: The conjugate divided by the norm gives the inverse; i and j do not commute.
  sketch:
  - 'setup: For x ≠ 0 put N = a^2 + b^2 + c^2 + d^2 > 0.'
  - 'derive: x times its conjugate equals N on both sides.'
  - 'construct: Take y equal to the conjugate of x divided by N.'
  - 'derive: ij = k and ji = -k differ.'
  - 'conclude: H is a noncommutative division ring.'
  openmath: (and (forall (x) (-> (and (in x real_quaternions) (!= x 0)) (exists (y) (and (in y real_quaternions) (= (* x y) 1) (= (* y x) 1))))) (exists (x y) (and (in x real_quaternions) (in y real_quaternions) (!= (* x y) (* y x)))))
  hard_negative:
    statement: 有理数係数の四元数環$\mathbb{Q}+\mathbb{Q}i+\mathbb{Q}j+\mathbb{Q}k$で$i^2=j^2=-1$、$ij=-ji=k$と定めたものは可換である。
    reason: 同じ計算で$ij=k$、$ji=-k$であり、$k\neq -k$なので可換でない。
  target: |
    (∀ x : Quaternion ℝ, x ≠ 0 → ∃ y : Quaternion ℝ, x * y = 1 ∧ y * x = 1) ∧ ∃ x y : Quaternion ℝ, x * y ≠ y * x
  proof: |
    by
      refine ⟨fun x hx => ⟨x⁻¹, mul_inv_cancel₀ hx, inv_mul_cancel₀ hx⟩, ⟨⟨0, 1, 0, 0⟩, ⟨0, 0, 1, 0⟩, ?_⟩⟩
      intro h
      have := congrArg (fun q : Quaternion ℝ => q.imK) h
      simp at this
      norm_num at this
- id: quaternion_square_equals_minus_one
  kind: gap
  level: 2
  topic: 環論・斜体と四元数
  statement: 実四元数$x=a+bi+cj+dk$について、$x^2=-1$であることと、$a=0$かつ$b^2+c^2+d^2=1$であることは同値である。とくに$x^2=-1$は$\mathbb{H}$で無限個の解をもつ。
  statement_en: For a real quaternion x = a + bi + cj + dk, one has x^2 = -1 if and only if a = 0 and b^2 + c^2 + d^2 = 1; in particular x^2 = -1 has infinitely many solutions in H.
  assumptions:
  - $x=a+bi+cj+dk\in\mathbb{H}$、$a,b,c,d\in\mathbb{R}$
  quantifiers:
  - 任意の実四元数$x$
  conclusion: $x^2=-1$であることと、$a=0$かつ$b^2+c^2+d^2=1$であることは同値であり、$x^2=-1$の解は無限個ある。
  answer: |
    $x=a+bi+cj+dk$を実四元数とする。積を展開すると、$i,j,k$の間の交差項は打ち消し合い、$x^2=(a^2-b^2-c^2-d^2)+2a(bi+cj+dk)$である。

    $x^2=-1$とする。成分を比べると、$a^2-b^2-c^2-d^2=-1$かつ$ab=ac=ad=0$である。$a\neq 0$なら$b=c=d=0$となり、$a^2=-1$となって矛盾する。よって$a=0$であり、$b^2+c^2+d^2=1$である。

    逆に$a=0$、$b^2+c^2+d^2=1$なら、上の式より$x^2=-1$である。

    単位球面$b^2+c^2+d^2=1$は無限集合なので、$x^2=-1$は無限個の解をもつ。
  strategy: Compute x^2 in coordinates and compare components.
  sketch:
  - 'derive: x^2 = (a^2 - b^2 - c^2 - d^2) + 2a(bi + cj + dk).'
  - 'case_split: If a ≠ 0, then b = c = d = 0 and a^2 = -1, which is impossible.'
  - 'derive: So a = 0 and b^2 + c^2 + d^2 = 1.'
  - 'conclude: The converse is the same formula, and the unit sphere is infinite.'
  openmath: (forall (x) (-> (in x real_quaternions) (<-> (= (* x x) (neg 1)) (and (= (quaternion_re x) 0) (= (+ (+ (^ (quaternion_im_i x) 2) (^ (quaternion_im_j x) 2)) (^ (quaternion_im_k x) 2)) 1)))))
  hard_negative:
    statement: 斜体上の次数$n$の多項式の根は高々$n$個である。
    reason: $\mathbb{H}$で$X^2+1$の根は、$b^2+c^2+d^2=1$を満たす$bi+cj+dk$全体であり、無限個ある。根の個数の評価には可換性が必要である。
  target: |
    (∀ (x : Quaternion ℝ), x * x = -1 ↔ x.re = 0 ∧ x.imI ^ 2 + x.imJ ^ 2 + x.imK ^ 2 = 1) ∧ {x : Quaternion ℝ | x * x = -1}.Infinite
  proof: |
    by
      have key : ∀ (x : Quaternion ℝ), x * x = -1 ↔ x.re = 0 ∧ x.imI ^ 2 + x.imJ ^ 2 + x.imK ^ 2 = 1 := by
        intro x
        constructor
        · intro h
          have h0 := congrArg (fun q : Quaternion ℝ => q.re) h
          have h1 := congrArg (fun q : Quaternion ℝ => q.imI) h
          have h2 := congrArg (fun q : Quaternion ℝ => q.imJ) h
          have h3 := congrArg (fun q : Quaternion ℝ => q.imK) h
          simp only [Quaternion.re_mul, Quaternion.imI_mul, Quaternion.imJ_mul, Quaternion.imK_mul, Quaternion.re_neg, Quaternion.re_one, Quaternion.imI_neg, Quaternion.imJ_neg, Quaternion.imK_neg, Quaternion.imI_one, Quaternion.imJ_one, Quaternion.imK_one] at h0 h1 h2 h3
          have hre : x.re = 0 := by
            by_contra hne
            have hi : x.imI = 0 := by
              have : x.re * x.imI = 0 := by nlinarith
              exact (mul_eq_zero.mp this).resolve_left hne
            have hj : x.imJ = 0 := by
              have : x.re * x.imJ = 0 := by nlinarith
              exact (mul_eq_zero.mp this).resolve_left hne
            have hk : x.imK = 0 := by
              have : x.re * x.imK = 0 := by nlinarith
              exact (mul_eq_zero.mp this).resolve_left hne
            rw [hi, hj, hk] at h0
            nlinarith [mul_self_nonneg x.re]
          refine ⟨hre, ?_⟩
          rw [hre] at h0
          nlinarith
        · rintro ⟨h0, h1⟩
          apply Quaternion.ext <;> simp only [Quaternion.re_mul, Quaternion.imI_mul, Quaternion.imJ_mul, Quaternion.imK_mul, Quaternion.re_neg, Quaternion.re_one, Quaternion.imI_neg, Quaternion.imJ_neg, Quaternion.imK_neg, Quaternion.imI_one, Quaternion.imJ_one, Quaternion.imK_one, h0] <;> nlinarith
      refine ⟨key, ?_⟩
      refine Set.infinite_of_injective_forall_mem (f := fun n : ℕ => (⟨0, 1 / ((n : ℝ) + 1), Real.sqrt (1 - (1 / ((n : ℝ) + 1)) ^ 2), 0⟩ : Quaternion ℝ)) ?_ ?_
      · intro m n h
        have h1 : 1 / ((m : ℝ) + 1) = 1 / ((n : ℝ) + 1) := congrArg (fun q : Quaternion ℝ => q.imI) h
        have hm : ((m : ℝ) + 1) ≠ 0 := by positivity
        have hn : ((n : ℝ) + 1) ≠ 0 := by positivity
        have h2 : (m : ℝ) + 1 = (n : ℝ) + 1 := by
          field_simp at h1
          linarith
        exact_mod_cast add_right_cancel h2
      · intro n
        have hpos : (1 : ℝ) ≤ (n : ℝ) + 1 := by
          have : (0 : ℝ) ≤ (n : ℝ) := Nat.cast_nonneg n
          linarith
        have hle : (1 / ((n : ℝ) + 1)) ^ 2 ≤ 1 := by
          have h0 : 0 ≤ 1 / ((n : ℝ) + 1) := by positivity
          have h1 : 1 / ((n : ℝ) + 1) ≤ 1 := by
            rw [div_le_one (by linarith)]
            exact hpos
          nlinarith
        refine (key _).mpr ⟨rfl, ?_⟩
        show (1 / ((n : ℝ) + 1)) ^ 2 + (Real.sqrt (1 - (1 / ((n : ℝ) + 1)) ^ 2)) ^ 2 + (0 : ℝ) ^ 2 = 1
        rw [Real.sq_sqrt (by linarith)]
        ring

- id: jacobson_radical_left_invertible_criterion
  kind: gap
  level: 4
  topic: 環論・ジャコブソン根基
  statement: 1をもつ環$A$（可換とは限らない）のジャコブソン根基$J$を極大左イデアル全体の共通部分とする。$x\in J$であることと、すべての$y\in A$で$1+yx$が左逆元をもつことは同値である。これは可換環の場合の判定法の一般形である。
  statement_en: Let J be the Jacobson radical of a ring A with identity, not necessarily commutative, defined as the intersection of all maximal left ideals. An element x lies in J if and only if 1 + yx has a left inverse for every y in A; this generalizes the criterion for commutative rings.
  assumptions:
  - $A$は1をもつ環（可換とは限らない）
  - $J$は$A$の極大左イデアル全体の共通部分
  - $x\in A$
  quantifiers:
  - 任意の環$A$と元$x$
  conclusion: $x\in J$であることと、すべての$y$で$z(1+yx)=1$となる$z$が存在することは同値である。
  answer: |
    $A$を1をもつ環、$J$を極大左イデアル全体の共通部分、$x\in A$とする。

    $x\in J$とし、$y\in A$をとる。$1+yx$が左逆元をもたないと仮定する。左イデアル$A(1+yx)$は$1$を含まないので全体でなく、ツォルンの補題よりある極大左イデアル$M$に含まれる。$x\in J\subseteq M$なので$yx\in M$である。$1+yx\in M$と合わせて$1\in M$となり、矛盾する。よって$1+yx$は左逆元をもつ。

    逆に、すべての$y$で$1+yx$が左逆元をもつとする。$M$を極大左イデアルとし、$x\notin M$と仮定する。$M+Ax$は$M$を真に含む左イデアルなので全体であり、$1=m+tx$となる$m\in M$、$t\in A$がある。$m=1+(-t)x$は仮定より左逆元$z$をもつので、$1=zm\in M$となり矛盾する。よって$x\in M$であり、$x\in J$である。
  strategy: A proper left ideal containing 1 + yx lies in a maximal left ideal; conversely M + Ax = A produces an invertible element of M.
  sketch:
  - 'setup: Suppose x lies in J and 1 + yx has no left inverse.'
  - 'contradiction: A(1 + yx) lies in a maximal left ideal M containing yx, so 1 lies in M.'
  - 'setup: Conversely suppose x is not in a maximal left ideal M.'
  - 'derive: M + Ax = A gives m = 1 - tx in M.'
  - 'contradiction: m has a left inverse, so 1 lies in M.'
  openmath: (forall (A x) (-> (and (is_ring A) (in x A)) (<-> (in x (ring_jacobson_radical A)) (forall (y) (-> (in y A) (exists (z) (and (in z A) (= (* z (+ 1 (* y x))) 1))))))))
  hard_negative:
    statement: $x\in J$であることと、すべての$y$で$1+x+y$が単元であることは同値である。
    reason: $y=-1-x$とすると$1+x+y=0$であり、零環でなければ単元でない。掛ける形$yx$でなければならない。
  target: |
    ∀ (A : Type*) [Ring A] (x : A), x ∈ Ring.jacobson A ↔ ∀ y : A, ∃ z : A, z * (1 + y * x) = 1
  proof: |
    by
      intro A _ x
      rw [← Ideal.jacobson_bot, Ideal.mem_jacobson_iff]
      refine forall_congr' fun y => exists_congr fun z => ?_
      rw [Ideal.mem_bot, mul_add, mul_one, sub_eq_zero, add_comm, mul_assoc]
- id: nil_left_ideal_contained_in_jacobson
  kind: gap
  level: 4
  topic: 環論・ジャコブソン根基と冪零元
  statement: 1をもつ環（可換とは限らない）の左イデアル$I$の元がすべて冪零ならば、$I$はジャコブソン根基（極大左イデアル全体の共通部分）に含まれる。
  statement_en: If every element of a left ideal I of a ring with identity, not necessarily commutative, is nilpotent, then I is contained in the Jacobson radical, the intersection of all maximal left ideals.
  assumptions:
  - $A$は1をもつ環（可換とは限らない）
  - $I$は$A$の左イデアル
  - $I$の元はすべて冪零
  quantifiers:
  - 任意の環$A$と左イデアル$I$
  conclusion: $I\subseteq J(A)$である。
  answer: |
    $A$を1をもつ環、$I$を元がすべて冪零である左イデアルとする。$J(A)$は、すべての$y$で$1+yx$が左逆元をもつ元$x$の全体である。

    $x\in I$、$y\in A$をとる。$I$は左イデアルなので$yx\in I$であり、$yx$は冪零である。$(yx)^n=0$とすると、$(-yx)^n$も$0$である。$1-(-yx)$の逆元は$\sum_{i=0}^{n-1}(-yx)^i$である。よって$1+yx$は左逆元をもち、$x\in J(A)$である。
  strategy: For x in I the element yx is nilpotent, so 1 + yx is invertible by the geometric series.
  sketch:
  - 'setup: x lies in J(A) when 1 + yx has a left inverse for all y.'
  - 'derive: For x in I, yx lies in I and is nilpotent.'
  - 'derive: The geometric sum gives an inverse of 1 + yx.'
  - 'conclude: Thus I ⊆ J(A).'
  openmath: (forall (A I) (-> (and (is_ring A) (left_ideal_of I A) (forall (x) (-> (in x I) (nilpotent_element x A)))) (subset I (ring_jacobson_radical A))))
  hard_negative:
    statement: 1をもつ環の冪零元はすべてジャコブソン根基に属する。
    reason: $M_2(\mathbb{Q})$は単純環で$J=0$だが、$E_{12}$は零でない冪零元である。冪零元全体は左イデアルをなすとは限らない。
  target: |
    ∀ (A : Type*) [Ring A] (I : Ideal A), (∀ x ∈ I, IsNilpotent x) → I ≤ Ring.jacobson A
  proof: |
    by
      intro A _ I hn x hx
      rw [← Ideal.jacobson_bot, Ideal.mem_jacobson_iff]
      intro y
      have hu : IsUnit (1 + y * x) := (hn _ (I.mul_mem_left y hx)).isUnit_one_add
      obtain ⟨u, hu⟩ := hu
      refine ⟨↑u⁻¹, ?_⟩
      have h1 : (↑u⁻¹ : A) * (1 + y * x) = 1 := by rw [← hu]; simp
      rw [Ideal.mem_bot, mul_assoc]
      rw [mul_add, mul_one] at h1
      rw [add_comm, h1, sub_self]
- id: polynomial_over_domain_jacobson_radical_zero
  kind: gap
  level: 4
  topic: 環論・多項式環のジャコブソン根基
  statement: 整域$A$上の多項式環$A[X]$のジャコブソン根基は$0$である。
  statement_en: The Jacobson radical of the polynomial ring A[X] over an integral domain A is zero.
  assumptions:
  - $A$は整域
  quantifiers:
  - 任意の整域$A$
  conclusion: $J(A[X])=0$である。
  answer: |
    $A$を整域とする。可換環で$f$がジャコブソン根基に属することと、すべての$g$で$1+fg$が単元であることは同値である。

    $f\in J(A[X])$かつ$f\neq 0$と仮定する。$g=X$とすると$1+Xf$は単元である。$A$は整域なので、$A[X]$の単元は定数である。しかし$f\neq 0$なので$\deg(1+Xf)=\deg f+1\geq 1$であり、$1+Xf$は定数でない。これは矛盾である。よって$J(A[X])=0$である。
  strategy: For nonzero f the polynomial 1 + Xf has positive degree, so it is not a unit.
  sketch:
  - 'setup: f in the radical makes 1 + fg a unit for every g.'
  - 'derive: Units of A[X] over a domain are constants.'
  - 'contradiction: For f ≠ 0 the polynomial 1 + Xf has degree deg f + 1 ≥ 1.'
  - 'conclude: Hence the radical is zero.'
  openmath: (forall (A) (-> (integral_domain A) (= (jacobson_radical (polynomial_ring A)) (zero_ideal (polynomial_ring A)))))
  hard_negative:
    statement: 形式的冪級数環についても、整域$A$なら$J(A[[X]])=0$である。
    reason: $1+Xg$の定数項は$1$なので、$1+Xg$は$A[[X]]$の単元である。よって$X\in J(A[[X]])$である。
  target: |
    ∀ (A : Type*) [CommRing A] [IsDomain A], Ring.jacobson (Polynomial A) = ⊥
  proof: |
    by
      intro A _ _
      rw [eq_bot_iff]
      intro f hf
      rw [← Ideal.jacobson_bot, Ideal.mem_jacobson_bot] at hf
      by_contra hf0
      have hf0' : f ≠ 0 := by simpa using hf0
      have := hf Polynomial.X
      have hd := Polynomial.natDegree_eq_zero_of_isUnit this
      have h1 : (f * Polynomial.X + 1).natDegree = f.natDegree + 1 := by
        rw [Polynomial.natDegree_add_eq_left_of_natDegree_lt]
        · rw [Polynomial.natDegree_mul_X hf0']
        · rw [Polynomial.natDegree_mul_X hf0']; simp
      omega
- id: nilradical_contained_in_jacobson_radical
  kind: gap
  level: 4
  topic: 環論・ジャコブソン根基と冪零根基
  statement: 可換環の冪零根基はジャコブソン根基に含まれる。
  statement_en: The nilradical of a commutative ring is contained in its Jacobson radical.
  assumptions:
  - $A$は可換環
  quantifiers:
  - 任意の可換環$A$
  conclusion: 冪零元はすべてジャコブソン根基に属する。
  answer: |
    $A$を可換環、$x\in A$を冪零元とし、$x^n=0$とする。$M$を極大イデアルとする。$M$は素イデアルであり、$x^n=0\in M$なので$x\in M$である。よって$x$はすべての極大イデアルに属し、ジャコブソン根基に属する。
  strategy: Maximal ideals are prime, and a prime ideal containing x^n contains x.
  sketch:
  - 'setup: Let x^n = 0 and let M be a maximal ideal.'
  - 'derive: M is prime and contains x^n, so it contains x.'
  - 'conclude: x lies in the intersection of all maximal ideals.'
  openmath: (forall (A) (-> (comm_ring A) (subset (nilradical_of A) (jacobson_radical A))))
  hard_negative:
    statement: 可換環の冪零根基とジャコブソン根基は等しい。
    reason: 局所環$\mathbb{Z}_{(2)}$は整域なので冪零根基は$0$だが、ジャコブソン根基は$(2)$である。
  target: |
    ∀ (A : Type*) [CommRing A], nilradical A ≤ Ring.jacobson A
  proof: |
    by
      intro A _
      exact nilradical_le_jacobson A
- id: artinian_ring_jacobson_radical_nilpotent
  kind: textbook
  level: 4
  topic: 環論・アルティン環とジャコブソン根基
  statement: 左アルティン環（1をもち可換とは限らない）のジャコブソン根基は冪零イデアルである。
  statement_en: The Jacobson radical of a left Artinian ring with identity, not necessarily commutative, is a nilpotent ideal.
  assumptions:
  - $A$は1をもつ左アルティン環（可換とは限らない）
  - $J$は$A$のジャコブソン根基
  quantifiers:
  - 任意の左アルティン環$A$
  conclusion: $J^n=0$となる$n$が存在する。
  answer: |
    $A$を1をもつ左アルティン環、$J$をジャコブソン根基とする。$J$は両側イデアルであり、$x\in J$なら$1-x$は左逆元をもつ。

    降鎖$J\supseteq J^2\supseteq\cdots$は止まるので、$J^n=J^{n+1}=\cdots$となる$n$がある。$I=J^n$とおくと$I^2=I$である。$I\neq 0$と仮定する。

    $IL\neq 0$となる左イデアル$L$の全体は$I$自身を含むので空でない。左アルティン性より、その中に極小元$L$がある。$IL\neq 0$なので、$Ia\neq 0$となる$a\in L$がある。$Ia$は$L$に含まれる左イデアルである。$I(Ia)=I^2a=Ia\neq 0$なので、極小性より$Ia=L$である。

    $a\in L=Ia$より、$a=xa$となる$x\in I\subseteq J$がある。$(1-x)a=0$である。$1-x$は左逆元をもつので$a=0$となり、$Ia\neq 0$に反する。よって$I=0$であり、$J^n=0$である。
  strategy: A stable power I of J with I^2 = I would admit a minimal left ideal L with IL ≠ 0, and then a = xa contradicts the invertibility of 1 - x.
  sketch:
  - 'setup: The chain of powers of J stabilizes at I = J^n with I^2 = I.'
  - 'setup: If I ≠ 0, choose a minimal left ideal L with IL ≠ 0.'
  - 'derive: Choose a in L with Ia ≠ 0; minimality gives Ia = L.'
  - 'derive: Hence a = xa with x in J.'
  - 'contradiction: 1 - x has a left inverse, so a = 0.'
  openmath: (forall (A) (-> (and (is_ring A) (left_artinian_ring A)) (exists (n) (and (in n N) (= (ideal_power (ring_jacobson_radical A) n) (zero_ideal A))))))
  hard_negative:
    statement: ネーター環のジャコブソン根基は冪零である。
    reason: 局所環$\mathbb{Z}_{(2)}$はネーター環だが、ジャコブソン根基$(2)$の冪は零にならない。
  target: |
    ∀ (A : Type*) [Ring A] [IsArtinianRing A], IsNilpotent (Ring.jacobson A)
  proof: |
    by
      intro A _ _
      exact IsSemiprimaryRing.isNilpotent
- id: artinian_semisimple_iff_jacobson_zero
  kind: textbook
  level: 4
  topic: 環論・半単純環とジャコブソン根基
  statement: 左アルティン環（1をもち可換とは限らない）が半単純であることと、ジャコブソン根基が$0$であることは同値である。ここで半単純とは、左加群として単純加群の和であることをいう。
  statement_en: A left Artinian ring with identity, not necessarily commutative, is semisimple if and only if its Jacobson radical is zero, where semisimple means that it is a sum of simple modules as a left module over itself.
  assumptions:
  - $A$は1をもつ左アルティン環（可換とは限らない）
  - 半単純とは、$A$が左$A$加群として単純部分加群の和であること
  quantifiers:
  - 任意の左アルティン環$A$
  conclusion: $A$が半単純であることと、$J(A)=0$であることは同値である。
  answer: |
    $A$を1をもつ左アルティン環、$J$をジャコブソン根基とする。

    $A$が半単純であるとする。$S$を単純左イデアル、$0\neq s\in S$とする。写像$A\to S$、$a\mapsto as$は全射な左加群の準同型で、核は$S$の単純性より極大左イデアルである。$J$はその核に含まれるので$Js=0$である。よって$JS=0$である。$A$は単純左イデアルの和なので、$1$はその有限和に属し、$J\cdot 1=0$である。したがって$J=0$である。

    $J=0$とする。$J$は極大左イデアル全体の共通部分である。有限個の極大左イデアルの共通部分全体を考えると、左アルティン性より極小元$M_1\cap\cdots\cap M_k$がある。任意の極大左イデアル$M$について$M\cap M_1\cap\cdots\cap M_k=M_1\cap\cdots\cap M_k$なので、これは$M$に含まれる。よって$M_1\cap\cdots\cap M_k=J=0$である。

    左加群の準同型$A\to\bigoplus_iA/M_i$は単射である。$A/M_i$は単純なので、右辺は半単純加群である。半単純加群の部分加群は半単純なので、$A$は半単純である。
  strategy: The radical kills every simple left ideal; conversely finitely many maximal left ideals intersect in 0, which embeds A into a sum of simple modules.
  sketch:
  - 'derive: J annihilates each simple left ideal, because J lies in the kernel of a ↦ as.'
  - 'derive: Since 1 lies in a finite sum of simples, J = 0.'
  - 'setup: Conversely take a minimal finite intersection of maximal left ideals.'
  - 'derive: It equals J = 0.'
  - 'apply_theorem: A embeds in a semisimple module, and submodules of semisimple modules are semisimple.'
  openmath: (forall (A) (-> (and (is_ring A) (left_artinian_ring A)) (<-> (semisimple_ring A) (= (ring_jacobson_radical A) (zero_ideal A)))))
  hard_negative:
    statement: アルティン性なしに、ジャコブソン根基が$0$である環は半単純である。
    reason: $\mathbb{Z}$のジャコブソン根基は$0$だが、$\mathbb{Z}$には単純イデアルがないので半単純でない。
  target: |
    ∀ (A : Type*) [Ring A] [IsArtinianRing A], IsSemisimpleRing A ↔ Ring.jacobson A = ⊥
  proof: |
    by
      intro A _ _
      exact IsArtinianRing.isSemisimpleRing_iff_jacobson
- id: hopkins_levitzki_artinian_implies_noetherian
  kind: named
  level: 4
  topic: 環論・アルティン環とネーター環
  statement: ホプキンス・レヴィツキの定理。左アルティン環（1をもち可換とは限らない）は左ネーター環である。
  statement_en: The Hopkins-Levitzki theorem. A left Artinian ring with identity, not necessarily commutative, is left Noetherian.
  assumptions:
  - $A$は1をもつ左アルティン環（可換とは限らない）
  quantifiers:
  - 任意の左アルティン環$A$
  conclusion: $A$は左ネーター環である。
  answer: |
    $A$を1をもつ左アルティン環、$J$をジャコブソン根基とする。左アルティン環のジャコブソン根基は冪零なので、$J^n=0$となる$n$がある。また$A/J$は左アルティン環でジャコブソン根基が$0$なので、半単純環である。

    降鎖$A\supseteq J\supseteq J^2\supseteq\cdots\supseteq J^n=0$を考える。各$J^i/J^{i+1}$は$J$で消えるので$A/J$加群である。半単純環上の加群は半単純である。また$J^i/J^{i+1}$は$A$の部分加群の商なので左アルティン加群である。

    左アルティンな半単純加群は、有限個の単純加群の直和である。実際、単純部分加群の無限直和があれば、部分和の真の降鎖が作れてしまう。単純加群はネーター加群であり、有限直和もネーター加群である。よって各$J^i/J^{i+1}$は左ネーター加群である。

    部分加群と商がネーター加群なら全体もネーター加群である。降鎖を下から順にたどると、$J^{n-1},J^{n-2},\dots,J^0=A$がネーター加群である。したがって$A$は左ネーター環である。
  strategy: Filter A by powers of its nilpotent radical; each layer is a semisimple Artinian module, hence of finite length.
  sketch:
  - 'apply_theorem: J is nilpotent and A/J is semisimple.'
  - 'derive: Each J^i / J^(i+1) is a semisimple Artinian module.'
  - 'derive: Such a module is a finite direct sum of simples, hence Noetherian.'
  - 'induction: Extensions of Noetherian modules are Noetherian.'
  - 'conclude: A is left Noetherian.'
  openmath: (forall (A) (-> (and (is_ring A) (left_artinian_ring A)) (left_noetherian_ring A)))
  hard_negative:
    statement: 左ネーター環は左アルティン環である。
    reason: $\mathbb{Z}$はネーター環だが、降鎖$(2)\supsetneq(4)\supsetneq\cdots$が止まらないのでアルティン環でない。
  target: |
    ∀ (A : Type*) [Ring A] [IsArtinianRing A], IsNoetherianRing A
  proof: |
    by
      intro A _ _
      infer_instance
- id: semisimple_ring_left_ideal_generated_by_idempotent
  kind: gap
  level: 3
  topic: 環論・半単純環の左イデアル
  statement: 半単純環（1をもち可換とは限らず、左加群として単純加群の和である環）の左イデアル$I$は、ある冪等元$e$により$I=Ae$と書ける。
  statement_en: Every left ideal I of a semisimple ring A with identity, not necessarily commutative and a sum of simple modules as a left module, has the form I = Ae for an idempotent e.
  assumptions:
  - $A$は1をもつ半単純環（可換とは限らない）
  - $I$は$A$の左イデアル
  quantifiers:
  - 任意の半単純環$A$と左イデアル$I$
  conclusion: $e^2=e$かつ$I=Ae$となる$e\in A$が存在する。
  answer: |
    $A$を1をもつ半単純環、$I$を左イデアルとする。半単純加群の部分加群は補加群をもつので、左イデアル$L$で$A=I\oplus L$となるものがある。$1=e+f$（$e\in I$、$f\in L$）と書く。

    $x\in I$をとる。$x=x\cdot 1=xe+xf$である。$xe\in I$なので、$xf=x-xe\in I$である。一方$f\in L$なので$xf\in L$である。$I\cap L=0$より$xf=0$であり、$x=xe$である。

    よって$I\subseteq Ae$である。$e\in I$より$Ae\subseteq I$なので、$I=Ae$である。また$x=e$とすると$e=e^2$である。
  strategy: Decompose 1 along a complement of I; the I-component is the required idempotent.
  sketch:
  - 'apply_theorem: I has a complement L, so A = I ⊕ L.'
  - 'setup: Write 1 = e + f with e in I and f in L.'
  - 'derive: For x in I, xf lies in I ∩ L = 0, so x = xe.'
  - 'conclude: Hence I = Ae and e is idempotent.'
  openmath: (forall (A I) (-> (and (is_ring A) (semisimple_ring A) (left_ideal_of I A)) (exists (e) (and (idempotent_element e A) (= I (left_principal_ideal e))))))
  hard_negative:
    statement: 任意の環の左イデアルは冪等元で生成される。
    reason: $\mathbb{Z}$の冪等元は$0,1$だけで、$(2)$はそのどちらでも生成されない。
  target: |
    ∀ (A : Type*) [Ring A] [IsSemisimpleRing A] (I : Ideal A), ∃ e : A, e * e = e ∧ I = Ideal.span {e}
  proof: |
    by
      intro A _ _ I
      obtain ⟨e, h1, h2⟩ := IsSemisimpleRing.ideal_eq_span_idempotent I
      exact ⟨e, h1, h2⟩
- id: simple_ring_center_is_field
  kind: gap
  level: 3
  topic: 環論・単純環の中心
  statement: 単純環（1をもち零環でなく、両側イデアルが$0$と全体だけである環）の中心は体である。
  statement_en: The center of a simple ring, a nonzero ring with identity whose only two-sided ideals are 0 and the whole ring, is a field.
  assumptions:
  - $A$は単純環
  quantifiers:
  - 任意の単純環$A$
  conclusion: $A$の中心は体である。
  answer: |
    $A$を単純環、$Z$をその中心とする。$Z$は$1$を含む可換な部分環であり、$A$は零環でないので$Z$も零環でない。

    $z\in Z$を零でない元とする。$z$は中心の元なので$Az=zA$であり、これは零でない両側イデアルである。よって$Az=A$であり、$yz=zy=1$となる$y\in A$がある。

    $y\in Z$を示す。$a\in A$をとる。$az=za$なので、$ya=ya(zy)=y(az)y=y(za)y=(yz)ay=ay$である。よって$y\in Z$であり、$z$は$Z$で可逆である。したがって$Z$は体である。
  strategy: A nonzero central element generates a nonzero two-sided ideal, so it is invertible, and its inverse is central.
  sketch:
  - 'setup: Let z be a nonzero central element.'
  - 'derive: Az is a nonzero two-sided ideal, so Az = A.'
  - 'derive: Thus z has an inverse y in A.'
  - 'derive: ya = y(az)y = y(za)y = ay shows that y is central.'
  - 'conclude: The center is a field.'
  openmath: (forall (A) (-> (and (is_ring A) (simple_ring A)) (is_field (ring_center A))))
  hard_negative:
    statement: 単純環は可換である。
    reason: $M_2(\mathbb{Q})$は単純環だが可換でない。中心はスカラー行列全体で$\mathbb{Q}$に同型である。
  target: |
    ∀ (A : Type*) [Ring A] [IsSimpleRing A], IsField (Subring.center A)
  proof: |
    by
      intro A _ _
      exact IsSimpleRing.isField_center A
- id: wedderburn_artin_semisimple_product_of_matrix_rings
  kind: named
  level: 4
  topic: 環論・ウェダーバーン・アルティンの定理
  statement: ウェダーバーン・アルティンの定理。半単純環（1をもち可換とは限らず、左加群として単純加群の和である環）は、斜体上の行列環の有限個の直積と環同型である。
  statement_en: The Wedderburn-Artin theorem. A semisimple ring with identity, not necessarily commutative and a sum of simple modules as a left module, is isomorphic to a finite product of matrix rings over division rings.
  assumptions:
  - $A$は1をもつ半単純環（可換とは限らない）
  quantifiers:
  - 任意の半単純環$A$
  conclusion: 斜体$D_1,\dots,D_k$と正の整数$d_1,\dots,d_k$で$A\cong\prod_iM_{d_i}(D_i)$となるものが存在する。
  answer: |
    $A$を1をもつ半単純環とする。$A$は左加群として単純左イデアルの和である。$1$は有限和に属するので、$A$は有限個の単純左イデアルの直和である。同型類ごとにまとめて、$A\cong S_1^{d_1}\oplus\cdots\oplus S_k^{d_k}$と書く。ここで$S_i$は互いに同型でない単純加群、$d_i\geq 1$である。

    シューアの補題より、$D_i'=\mathrm{End}_A(S_i)$は斜体であり、$i\neq j$なら$\mathrm{Hom}_A(S_i,S_j)=0$である。よって直和の準同型を成分で表すと、$\mathrm{End}_A(A)\cong\prod_iM_{d_i}(D_i')$である。

    右からの掛け算により、$\mathrm{End}_A(A)$は反対環$A^{\mathrm{op}}$と環同型である。実際、左$A$線形写像$\varphi$は$\varphi(1)$で決まり、$\varphi(x)=x\varphi(1)$である。

    したがって$A^{\mathrm{op}}\cong\prod_iM_{d_i}(D_i')$である。反対環をとると、転置により$M_d(D')^{\mathrm{op}}\cong M_d(D'^{\mathrm{op}})$なので、$D_i=D_i'^{\mathrm{op}}$とおいて$A\cong\prod_iM_{d_i}(D_i)$である。斜体の反対環は斜体である。
  strategy: Decompose A into isotypic pieces and compute End(A) = A^op with Schur's lemma.
  sketch:
  - 'setup: A is a finite direct sum of simple left ideals, grouped into isomorphism classes.'
  - 'apply_theorem: Schur''s lemma gives division rings D_i'' and vanishing Hom between different classes.'
  - 'derive: End(A) is the product of the matrix rings M_(d_i)(D_i'').'
  - 'derive: End(A) is isomorphic to the opposite ring of A.'
  - 'conclude: Taking opposites and transposes gives the product of matrix rings over division rings.'
  openmath: (forall (A) (-> (and (is_ring A) (semisimple_ring A)) (exists (k D d) (and (in k N) (forall (i) (-> (in i (natural_range k)) (and (division_ring (fn_value D i)) (> (fn_value d i) 0)))) (ring_isomorphic A (matrix_ring_family_product k D d))))))
  hard_negative:
    statement: 半単純環は体の有限直積と環同型である。
    reason: $M_2(\mathbb{Q})$は半単純環だが可換でないので、体の直積と同型でない。
  target: |
    ∀ (A : Type u_1) [Ring A] [IsSemisimpleRing A], ∃ (k : ℕ) (D : Fin k → Type u_1) (d : Fin k → ℕ) (_ : ∀ i, DivisionRing (D i)), (∀ i, NeZero (d i)) ∧ Nonempty (A ≃+* Π i, Matrix (Fin (d i)) (Fin (d i)) (D i))
  proof: |
    by
      intro A _ _
      exact IsSemisimpleRing.exists_ringEquiv_pi_matrix_divisionRing A
- id: wedderburn_artin_simple_artinian_matrix_ring
  kind: named
  level: 4
  topic: 環論・ウェダーバーン・アルティンの定理
  statement: ウェダーバーン・アルティンの定理の単純環版。左アルティンな単純環は、斜体上の行列環と環同型である。
  statement_en: The Wedderburn-Artin theorem for simple rings. A left Artinian simple ring is isomorphic to a matrix ring over a division ring.
  assumptions:
  - $A$は1をもつ左アルティン環
  - $A$は単純環（零環でなく、両側イデアルは$0$と全体だけ）
  quantifiers:
  - 任意の左アルティン単純環$A$
  conclusion: 斜体$D$と正の整数$d$で$A\cong M_d(D)$となるものが存在する。
  answer: |
    $A$を左アルティンな単純環とする。ジャコブソン根基$J$は両側イデアルである。$A$は零環でないので極大左イデアルをもち、$J\neq A$である。$A$は単純なので$J=0$である。左アルティン環でジャコブソン根基が$0$なら半単純なので、$A$は半単純環である。

    ウェダーバーン・アルティンの定理より、$A\cong\prod_{i=1}^{k}M_{d_i}(D_i)$である。各因子$M_{d_i}(D_i)$は零環でない。$k\geq 2$なら、第1因子の全体を第1成分とし他の成分を$0$とする部分は、$0$でも全体でもない両側イデアルである。これは$A$の単純性に反する。$A$は零環でないので$k\neq 0$である。よって$k=1$であり、$A\cong M_{d_1}(D_1)$である。
  strategy: A simple Artinian ring has zero Jacobson radical, so it is semisimple, and simplicity leaves only one factor.
  sketch:
  - 'derive: J is a proper two-sided ideal, so J = 0.'
  - 'apply_theorem: An Artinian ring with J = 0 is semisimple.'
  - 'apply_theorem: The Wedderburn-Artin theorem gives a product of matrix rings.'
  - 'derive: Two or more factors would yield a proper nonzero two-sided ideal.'
  - 'conclude: Therefore A is a single matrix ring.'
  openmath: (forall (A) (-> (and (is_ring A) (left_artinian_ring A) (simple_ring A)) (exists (n D) (and (in n N) (> n 0) (division_ring D) (ring_isomorphic A (matrix_ring n D))))))
  hard_negative:
    statement: アルティン性なしに、単純環は斜体上の行列環と同型である。
    reason: 第一ワイル代数$\mathbb{Q}\langle x,y\rangle/(xy-yx-1)$は単純環で零因子をもたない。行列環なら$d=1$で斜体になるはずだが、$x$は可逆でないので斜体でない。
  target: |
    ∀ (A : Type u_1) [Ring A] [IsArtinianRing A] [IsSimpleRing A], ∃ (n : ℕ) (_ : NeZero n) (D : Type u_1) (_ : DivisionRing D), Nonempty (A ≃+* Matrix (Fin n) (Fin n) D)
  proof: |
    by
      intro A _ _ _
      exact IsSimpleRing.exists_ringEquiv_matrix_divisionRing A
- id: group_algebra_semisimple_nonmodular
  kind: textbook
  level: 4
  topic: 環論・群環の半単純性
  statement: 体$k$と有限群$G$について、$|G|$が$k$で零でないならば、群環$k[G]$は半単純環である。これはマシュケの定理の環の形である。
  statement_en: For a field k and a finite group G with |G| nonzero in k, the group algebra k[G] is a semisimple ring; this is Maschke's theorem in ring form.
  assumptions:
  - $k$は体、$G$は有限群
  - $|G|$は$k$で零でない
  quantifiers:
  - 任意の体$k$と有限群$G$
  conclusion: $k[G]$は半単純環である。
  answer: |
    $k$を体、$G$を$|G|$が$k$で零でない有限群とし、$A=k[G]$とする。$A$の左イデアルがすべて左イデアルの補をもつことを示せばよい。実際、単純左イデアル全体の和を$S$とし、$S$の補$T$が零でないとする。$A$は有限次元なので$T$は極小な零でない左イデアルを含み、それは単純左イデアルなので$S$に含まれ、$S\cap T=0$に反する。よって$S=A$である。

    $L$を$A$の左イデアルとする。$L$は$k$部分空間なので、$k$線形な射影$\pi\colon A\to L$がある。$\pi'(x)=|G|^{-1}\sum_{g\in G}g\pi(g^{-1}x)$と定める。$L$は左イデアルなので$\pi'(A)\subseteq L$である。$x\in L$なら$g^{-1}x\in L$なので$\pi(g^{-1}x)=g^{-1}x$であり、$\pi'(x)=x$である。よって$\pi'$は$L$への射影である。

    $h\in G$について$\pi'(hx)=|G|^{-1}\sum_gg\pi(g^{-1}hx)$である。$g=hg'$と置き換えると$h\pi'(x)$に等しい。よって$\pi'$は左$A$線形である。したがって$\ker\pi'$は左イデアルであり、$A=L\oplus\ker\pi'$である。
  strategy: Average a k-linear projection onto a left ideal over the group to make it A-linear.
  sketch:
  - 'setup: Let L be a left ideal and π a k-linear projection of A onto L.'
  - 'construct: Put π''(x) = |G|^{-1} sum over g of g π(g^{-1} x).'
  - 'derive: π'' is a projection onto L.'
  - 'derive: Reindexing the sum shows that π'' is A-linear.'
  - 'conclude: The kernel of π'' is a complementary left ideal, so A is semisimple.'
  openmath: (forall (k G) (-> (and (is_field k) (finite_group G) (!= (ring_nat_cast (size G) k) 0)) (semisimple_ring (group_algebra k G))))
  hard_negative:
    statement: 体$k$と有限群$G$について、$k[G]$はいつも半単純である。
    reason: $k=\mathbb{F}_2$、$G$を位数$2$の巡回群、生成元を$g$とすると、$(1+g)^2=0$である。$1+g$は零でない冪零元で、$k[G]$は可換なのでジャコブソン根基に属し、半単純でない。
  target: |
    ∀ (k G : Type*) [Field k] [Group G] [Finite G], (Nat.card G : k) ≠ 0 → IsSemisimpleRing (MonoidAlgebra k G)
  proof: |
    by
      intro k G _ _ _ h
      haveI : NeZero (Nat.card G : k) := ⟨h⟩
      infer_instance
