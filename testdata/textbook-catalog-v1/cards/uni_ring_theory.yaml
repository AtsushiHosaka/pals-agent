  topic: 環論・冪等元
  statement: 1をもつ環（可換とは限らない）の冪等元$e$について、$1-e$も冪等元であり、$e(1-e)=(1-e)e=0$である。
  statement_en: If e is an idempotent of a ring with identity, not necessarily commutative, then 1 - e is idempotent and e(1 - e) = (1 - e)e = 0.
  assumptions:
  - $A$は1をもつ環（可換とは限らない）
