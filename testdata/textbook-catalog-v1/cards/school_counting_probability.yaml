- id: prob_uniform_range
  kind: gap
  level: middle
  topic: 確率・確率の範囲
  statement: 有限で空でない標本空間$\Omega$の各根元事象が同様に確からしいとき、事象$A$の確率$P(A)=|A|/|\Omega|$は$0\leq P(A)\leq 1$を満たす。
  statement_en: For a finite nonempty sample space Ω with equally likely outcomes and an event A, the probability P(A) = |A|/|Ω| satisfies 0 ≤ P(A) ≤ 1.
  assumptions:
  - $\Omega$は有限で空でない標本空間
  - $A\subseteq\Omega$
  quantifiers:
  - 任意の事象$A$
  conclusion: $0\leq P(A)\leq 1$である。
  answer: 有限で空でない集合$\Omega$を標本空間とし、各根元事象が同様に確からしいとして、事象$A\subseteq\Omega$の確率を$P(A)=|A|/|\Omega|$と定める。$A\subseteq\Omega$より$0\leq|A|\leq|\Omega|$であり、$|\Omega|>0$である。各辺を$|\Omega|$で割ると$0\leq|A|/|\Omega|\leq1$となる。よって$0\leq P(A)\leq1$である。
  strategy: Divide the inequality 0 ≤ |A| ≤ |Ω| by the positive number |Ω|.
  sketch:
  - 'setup: Note that |Ω| > 0 and that A is a subset of Ω.'
  - 'derive: Hence 0 ≤ |A| ≤ |Ω|.'
  - 'conclude: Dividing by |Ω| gives 0 ≤ P(A) ≤ 1.'
  openmath: (forall (O A) (-> (and (in (size O) N) (> (size O) 0) (subset A O)) (and (<= 0 (/ (size A) (size O))) (<= (/ (size A) (size O)) 1))))
  hard_negative:
    statement: どの事象$A$についても$0<P(A)<1$である。
    reason: $A=\emptyset$なら$P(A)=0$、$A=\Omega$なら$P(A)=1$となり、等号は実際に起こる。
  target: |
    ∀ (Ω : Type*) [Fintype Ω] [Nonempty Ω] (A : Finset Ω), 0 ≤ (A.card : ℝ) / Fintype.card Ω ∧ (A.card : ℝ) / Fintype.card Ω ≤ 1
  proof: |
    by
      intro Ω _ _ A
      have h : (0 : ℝ) < Fintype.card Ω := by exact_mod_cast Fintype.card_pos
      have hA : (A.card : ℝ) ≤ Fintype.card Ω := by exact_mod_cast Finset.card_le_univ A
      exact ⟨by positivity, (div_le_one h).mpr hA⟩
- id: prob_uniform_compl
  kind: gap
  level: middle
  topic: 確率・余事象
  statement: 有限で空でない標本空間$\Omega$の各根元事象が同様に確からしいとき、事象$A$の余事象$\overline{A}$について$P(\overline{A})=1-P(A)$が成り立つ。
  statement_en: For a finite nonempty sample space Ω with equally likely outcomes and an event A, the complement satisfies P(Aᶜ) = 1 - P(A), where P(E) = |E|/|Ω|.
  assumptions:
  - $\Omega$は有限で空でない標本空間
  - $A\subseteq\Omega$
  - $\overline{A}=\Omega\setminus A$
  quantifiers:
  - 任意の事象$A$
  conclusion: $P(\overline{A})=1-P(A)$である。
  answer: 有限で空でない集合$\Omega$を標本空間とし、各根元事象が同様に確からしいとして、事象$A\subseteq\Omega$の確率を$P(A)=|A|/|\Omega|$と定める。$\overline{A}=\Omega\setminus A$とする。$\Omega$は$A$と$\overline{A}$に重なりなく分かれるので$|\overline{A}|+|A|=|\Omega|$である。両辺を$|\Omega|$で割ると$P(\overline{A})+P(A)=1$となり、$P(\overline{A})=1-P(A)$を得る。
  strategy: Split Ω into A and its complement and divide the count by |Ω|.
  sketch:
  - 'setup: Write Aᶜ = Ω \ A.'
  - 'derive: A and Aᶜ partition Ω, so |Aᶜ| + |A| = |Ω|.'
  - 'conclude: Dividing by |Ω| gives P(Aᶜ) = 1 - P(A).'
  openmath: (forall (O A) (-> (and (in (size O) N) (> (size O) 0) (subset A O)) (= (/ (size (setdiff O A)) (size O)) (- 1 (/ (size A) (size O))))))
  hard_negative:
    statement: $P(A)+P(B)=1$なら$B$は$A$の余事象である。
    reason: サイコロで$A=\{1,2,3\}$、$B=\{1,4,5\}$とすると和は$1$だが、$B$は$A$の余事象ではない。確率の和だけでは事象は定まらない。
  target: |
    ∀ (Ω : Type*) [Fintype Ω] [DecidableEq Ω] [Nonempty Ω] (A : Finset Ω), (Aᶜ.card : ℝ) / Fintype.card Ω = 1 - (A.card : ℝ) / Fintype.card Ω
  proof: |
    by
      intro Ω _ _ _ A
      have h : (Fintype.card Ω : ℝ) ≠ 0 := by exact_mod_cast Fintype.card_ne_zero
      have hc : (Aᶜ.card : ℝ) + A.card = Fintype.card Ω := by exact_mod_cast Finset.card_compl_add_card A
      field_simp
      linarith
- id: prob_uniform_union_add_inter
  kind: textbook
  level: high
  topic: 確率・加法定理
  statement: 有限で空でない標本空間$\Omega$の各根元事象が同様に確からしいとき、事象$A,B$について$P(A\cup B)=P(A)+P(B)-P(A\cap B)$が成り立つ。排反でない場合も含む一般形である。
  statement_en: For a finite nonempty sample space Ω with equally likely outcomes and events A, B, P(A ∪ B) = P(A) + P(B) - P(A ∩ B), where P(E) = |E|/|Ω|. This is the general form, without assuming disjointness.
  assumptions:
  - $\Omega$は有限で空でない標本空間
  - $A,B\subseteq\Omega$
  quantifiers:
  - 任意の事象$A,B$
  conclusion: $P(A\cup B)=P(A)+P(B)-P(A\cap B)$である。
  answer: 有限で空でない集合$\Omega$を標本空間とし、各根元事象が同様に確からしいとして、事象$A\subseteq\Omega$の確率を$P(A)=|A|/|\Omega|$と定める。$B$を事象とする。$|A|+|B|$を数えると$A\cap B$の要素だけが$2$回数えられるので、$|A\cup B|+|A\cap B|=|A|+|B|$である。これを$|\Omega|$で割ると$P(A\cup B)+P(A\cap B)=P(A)+P(B)$となり、移項して結論を得る。
  strategy: Count |A ∪ B| by correcting the double count of A ∩ B, then divide by |Ω|.
  sketch:
  - 'setup: Compare |A| + |B| with |A ∪ B|: only the elements of A ∩ B are counted twice.'
  - 'derive: So |A ∪ B| + |A ∩ B| = |A| + |B|.'
  - 'translate: Divide both sides by |Ω|.'
  - 'conclude: Rearranging gives P(A ∪ B) = P(A) + P(B) - P(A ∩ B).'
  openmath: (forall (O A B) (-> (and (in (size O) N) (> (size O) 0) (subset A O) (subset B O)) (= (/ (size (union A B)) (size O)) (- (+ (/ (size A) (size O)) (/ (size B) (size O))) (/ (size (inter A B)) (size O))))))
  hard_negative:
    statement: 任意の事象$A,B$について$P(A\cup B)=P(A)+P(B)$である。
    reason: $A=B\neq\emptyset$なら左辺は$P(A)$、右辺は$2P(A)$で一致しない。この式が成り立つのは$P(A\cap B)=0$のとき、一様な確率では$A,B$が排反のときに限る。
  target: |
    ∀ (Ω : Type*) [Fintype Ω] [DecidableEq Ω] [Nonempty Ω] (A B : Finset Ω), ((A ∪ B).card : ℝ) / Fintype.card Ω = (A.card : ℝ) / Fintype.card Ω + (B.card : ℝ) / Fintype.card Ω - ((A ∩ B).card : ℝ) / Fintype.card Ω
  proof: |
    by
      intro Ω _ _ _ A B
      have h : ((A ∪ B).card : ℝ) + (A ∩ B).card = A.card + B.card := by exact_mod_cast Finset.card_union_add_card_inter A B
      rw [← add_div, ← sub_div]
      congr 1
      linarith
- id: prob_uniform_union_three
  kind: textbook
  level: high
  topic: 確率・3事象の加法定理
  statement: 有限で空でない標本空間$\Omega$の各根元事象が同様に確からしいとき、事象$A,B,C$について$P(A\cup B\cup C)=P(A)+P(B)+P(C)-P(A\cap B)-P(B\cap C)-P(C\cap A)+P(A\cap B\cap C)$が成り立つ。
  statement_en: For a finite nonempty sample space Ω with equally likely outcomes and events A, B, C, P(A ∪ B ∪ C) = P(A) + P(B) + P(C) - P(A ∩ B) - P(B ∩ C) - P(C ∩ A) + P(A ∩ B ∩ C), where P(E) = |E|/|Ω|.
  assumptions:
  - $\Omega$は有限で空でない標本空間
  - $A,B,C\subseteq\Omega$
  quantifiers:
  - 任意の事象$A,B,C$
  conclusion: 3事象の和事象の確率は、上の包除の式で与えられる。
  answer: 有限で空でない集合$\Omega$を標本空間とし、各根元事象が同様に確からしいとして、事象$A\subseteq\Omega$の確率を$P(A)=|A|/|\Omega|$と定める。$B,C$を事象とする。一般に$|X\cup Y|+|X\cap Y|=|X|+|Y|$である。$X=A\cup B$、$Y=C$とすると$|A\cup B\cup C|+|(A\cup B)\cap C|=|A\cup B|+|C|$である。ここで$(A\cup B)\cap C=(C\cap A)\cup(B\cap C)$であり、$(C\cap A)\cap(B\cap C)=A\cap B\cap C$だから、同じ等式より$|(A\cup B)\cap C|=|C\cap A|+|B\cap C|-|A\cap B\cap C|$である。また$|A\cup B|=|A|+|B|-|A\cap B|$である。これらを代入すると$|A\cup B\cup C|=|A|+|B|+|C|-|A\cap B|-|B\cap C|-|C\cap A|+|A\cap B\cap C|$となり、$|\Omega|$で割って結論を得る。
  strategy: Apply the two-set counting identity to (A ∪ B, C), to (A, B), and to (C ∩ A, B ∩ C), then divide by |Ω|.
  sketch:
  - 'setup: Use |X ∪ Y| + |X ∩ Y| = |X| + |Y| with X = A ∪ B and Y = C.'
  - 'derive: Rewrite (A ∪ B) ∩ C as (C ∩ A) ∪ (B ∩ C) and apply the identity to this union.'
  - 'derive: The intersection of C ∩ A and B ∩ C is A ∩ B ∩ C.'
  - 'derive: Apply the identity to A and B as well.'
  - 'conclude: Combine the counts and divide by |Ω|.'
  openmath: (forall (O A B D) (-> (and (in (size O) N) (> (size O) 0) (subset A O) (subset B O) (subset D O)) (= (/ (size (union (union A B) D)) (size O)) (+ (- (+ (/ (size A) (size O)) (+ (/ (size B) (size O)) (/ (size D) (size O)))) (+ (/ (size (inter A B)) (size O)) (+ (/ (size (inter B D)) (size O)) (/ (size (inter D A)) (size O))))) (/ (size (inter (inter A B) D)) (size O))))))
  hard_negative:
    statement: $P(A\cup B\cup C)=P(A)+P(B)+P(C)-P(A\cap B)-P(B\cap C)-P(C\cap A)$である。
    reason: $A=B=C\neq\emptyset$のとき左辺は$P(A)$、右辺は$0$となる。3つの共通部分を足し戻す項は省けない。
  target: |
    ∀ (Ω : Type*) [Fintype Ω] [DecidableEq Ω] [Nonempty Ω] (A B C : Finset Ω), ((A ∪ B ∪ C).card : ℝ) / Fintype.card Ω = (A.card : ℝ) / Fintype.card Ω + (B.card : ℝ) / Fintype.card Ω + (C.card : ℝ) / Fintype.card Ω - ((A ∩ B).card : ℝ) / Fintype.card Ω - ((B ∩ C).card : ℝ) / Fintype.card Ω - ((C ∩ A).card : ℝ) / Fintype.card Ω + ((A ∩ B ∩ C).card : ℝ) / Fintype.card Ω
  proof: |
    by
      intro Ω _ _ _ A B C
      have h1 : ((A ∪ B ∪ C).card : ℝ) + ((A ∪ B) ∩ C).card = (A ∪ B).card + C.card := by exact_mod_cast Finset.card_union_add_card_inter (A ∪ B) C
      have h2 : ((A ∪ B).card : ℝ) + (A ∩ B).card = A.card + B.card := by exact_mod_cast Finset.card_union_add_card_inter A B
      have h3 : (((C ∩ A) ∪ (B ∩ C)).card : ℝ) + ((C ∩ A) ∩ (B ∩ C)).card = (C ∩ A).card + (B ∩ C).card := by exact_mod_cast Finset.card_union_add_card_inter (C ∩ A) (B ∩ C)
      have e1 : (A ∪ B) ∩ C = (C ∩ A) ∪ (B ∩ C) := by
        ext x; simp only [Finset.mem_inter, Finset.mem_union]; tauto
      have e2 : (C ∩ A) ∩ (B ∩ C) = A ∩ B ∩ C := by
        ext x; simp only [Finset.mem_inter]; tauto
      rw [e1] at h1
      rw [e2] at h3
      rw [← add_div, ← add_div, ← sub_div, ← sub_div, ← sub_div, ← add_div]
      congr 1
      linarith
- id: prob_uniform_at_least_one_family
  kind: gap
  level: high
  topic: 確率・少なくとも1つ
  statement: 有限で空でない標本空間$\Omega$の各根元事象が同様に確からしいとき、有限個の事象$A_i\ (i\in I)$について、少なくとも1つが起こる確率は$1$からどれも起こらない確率を引いた値に等しい。
  statement_en: For a finite nonempty sample space Ω with equally likely outcomes and a finite family of events A_i (i in I), the probability that at least one A_i occurs equals 1 minus the probability that no A_i occurs.
  assumptions:
  - $\Omega$は有限で空でない標本空間
  - $I$は有限集合
  - 各$i\in I$で$A_i\subseteq\Omega$
  quantifiers:
  - 任意の有限な事象の族$(A_i)_{i\in I}$
  conclusion: $P\left(\bigcup_{i\in I}A_i\right)=1-P\left(\bigcap_{i\in I}\overline{A_i}\right)$である。
  answer: 有限で空でない集合$\Omega$を標本空間とし、各根元事象が同様に確からしいとして、事象$A\subseteq\Omega$の確率を$P(A)=|A|/|\Omega|$と定める。$I$を有限集合、$A_i\ (i\in I)$を事象とする。根元事象$\omega$について、「ある$i\in I$で$\omega\in A_i$」の否定は「すべての$i\in I$で$\omega\notin A_i$」である。したがって、前者を満たす$\omega$全体と後者を満たす$\omega$全体は$\Omega$を重なりなく分ける。要素数を数えて$|\Omega|$で割ると、両者の確率の和は$1$である。よって少なくとも1つが起こる確率は、どれも起こらない確率を$1$から引いた値に等しい。
  strategy: The event that some A_i occurs and the event that none occurs are complementary, so their counts add up to |Ω|.
  sketch:
  - 'setup: Let E be the set of outcomes in some A_i and F the set of outcomes in no A_i.'
  - 'translate: By negating the quantifier, F is the complement of E in Ω.'
  - 'derive: Hence |E| + |F| = |Ω|.'
  - 'conclude: Dividing by |Ω| gives P(E) = 1 - P(F).'
  openmath: (forall (O I A) (-> (and (in (size O) N) (> (size O) 0) (in (size I) N) (forall (i) (-> (in i I) (subset (family_value A i) O)))) (= (/ (size (indexed_union_over I A)) (size O)) (- 1 (/ (size (suchthat O (lambda (w) (forall (i) (-> (in i I) (notin w (family_value A i))))))) (size O))))))
  hard_negative:
    statement: 少なくとも1つが起こる確率は$1-\prod_{i\in I}(1-P(A_i))$である。
    reason: この積の形は事象が独立なら成り立つが、一般には成り立たない。$A_1=A_2=A$で$0<P(A)<1$なら、左辺は$P(A)$、右辺は$1-(1-P(A))^2$で異なる。
  target: |
    ∀ (Ω ι : Type*) [Fintype Ω] [DecidableEq Ω] [Nonempty Ω] (I : Finset ι) (A : ι → Finset Ω), ((Finset.univ.filter (fun ω => ∃ i ∈ I, ω ∈ A i)).card : ℝ) / Fintype.card Ω = 1 - ((Finset.univ.filter (fun ω => ∀ i ∈ I, ω ∉ A i)).card : ℝ) / Fintype.card Ω
  proof: |
    by
      classical
      intro Ω ι _ _ _ I A
      have h : (Fintype.card Ω : ℝ) ≠ 0 := by exact_mod_cast Fintype.card_ne_zero
      have e : (Finset.univ.filter (fun ω => ∀ i ∈ I, ω ∉ A i)) = (Finset.univ.filter (fun ω => ¬ ∃ i ∈ I, ω ∈ A i)) := by
        ext ω; simp
      have hc : ((Finset.univ.filter (fun ω => ∃ i ∈ I, ω ∈ A i)).card : ℝ) + (Finset.univ.filter (fun ω => ¬ ∃ i ∈ I, ω ∈ A i)).card = Fintype.card Ω := by
        exact_mod_cast Finset.card_filter_add_card_filter_not (s := Finset.univ) (fun ω => ∃ i ∈ I, ω ∈ A i)
      rw [e]
      field_simp
      linarith
- id: prob_uniform_exactly_one_of_two
  kind: gap
  level: high
  topic: 確率・一方だけが起こる確率
  statement: 有限で空でない標本空間$\Omega$の各根元事象が同様に確からしいとき、事象$A,B$のうちちょうど一方が起こる確率は$P(A)+P(B)-2P(A\cap B)$である。
  statement_en: For a finite nonempty sample space Ω with equally likely outcomes and events A, B, the probability that exactly one of A and B occurs is P(A) + P(B) - 2P(A ∩ B), where P(E) = |E|/|Ω|.
  assumptions:
  - $\Omega$は有限で空でない標本空間
  - $A,B\subseteq\Omega$
  quantifiers:
  - 任意の事象$A,B$
  conclusion: $P((A\setminus B)\cup(B\setminus A))=P(A)+P(B)-2P(A\cap B)$である。
  answer: 有限で空でない集合$\Omega$を標本空間とし、各根元事象が同様に確からしいとして、事象$A\subseteq\Omega$の確率を$P(A)=|A|/|\Omega|$と定める。$B$を事象とする。ちょうど一方が起こる事象は$(A\setminus B)\cup(B\setminus A)$であり、$A\setminus B$と$B\setminus A$は共通部分をもたない。また$A$は$A\setminus B$と$A\cap B$に重なりなく分かれるので$|A\setminus B|=|A|-|A\cap B|$であり、同様に$|B\setminus A|=|B|-|A\cap B|$である。よって求める事象の要素数は$|A|+|B|-2|A\cap B|$である。これを$|\Omega|$で割って結論を得る。
  strategy: Write the event as the disjoint union of A \ B and B \ A and count each part.
  sketch:
  - 'setup: The event is (A \ B) ∪ (B \ A), and the two parts are disjoint.'
  - 'derive: |A \ B| = |A| - |A ∩ B|.'
  - 'derive: |B \ A| = |B| - |A ∩ B|.'
  - 'conclude: Add the counts and divide by |Ω|.'
  openmath: (forall (O A B) (-> (and (in (size O) N) (> (size O) 0) (subset A O) (subset B O)) (= (/ (size (union (setdiff A B) (setdiff B A))) (size O)) (- (+ (/ (size A) (size O)) (/ (size B) (size O))) (* 2 (/ (size (inter A B)) (size O)))))))
  hard_negative:
    statement: $A,B$のうちちょうど一方が起こる確率は$P(A)+P(B)-P(A\cap B)$である。
    reason: これは少なくとも一方が起こる確率である。$A=B\neq\emptyset$なら、ちょうど一方が起こる確率は$0$だが、この式は$P(A)$を与える。
  target: |
    ∀ (Ω : Type*) [Fintype Ω] [DecidableEq Ω] [Nonempty Ω] (A B : Finset Ω), (((A \ B) ∪ (B \ A)).card : ℝ) / Fintype.card Ω = (A.card : ℝ) / Fintype.card Ω + (B.card : ℝ) / Fintype.card Ω - 2 * (((A ∩ B).card : ℝ) / Fintype.card Ω)
  proof: |
    by
      intro Ω _ _ _ A B
      have hd : Disjoint (A \ B) (B \ A) := by
        rw [Finset.disjoint_left]; intro x hx hx'; simp only [Finset.mem_sdiff] at hx hx'; exact hx.2 hx'.1
      have h0 : (((A \ B) ∪ (B \ A)).card : ℝ) = (A \ B).card + (B \ A).card := by exact_mod_cast Finset.card_union_of_disjoint hd
      have h1 : ((A \ B).card : ℝ) + (A ∩ B).card = A.card := by exact_mod_cast Finset.card_sdiff_add_card_inter A B
      have h2 : ((B \ A).card : ℝ) + (B ∩ A).card = B.card := by exact_mod_cast Finset.card_sdiff_add_card_inter B A
      rw [Finset.inter_comm] at h2
      rw [mul_div_assoc', ← add_div, ← sub_div]
      congr 1
      linarith
- id: prob_uniform_inter_lower_bound
  kind: gap
  level: high
  topic: 確率・積事象の下界
  statement: 有限で空でない標本空間$\Omega$の各根元事象が同様に確からしいとき、事象$A,B$について$P(A\cap B)\geq P(A)+P(B)-1$が成り立つ。
  statement_en: For a finite nonempty sample space Ω with equally likely outcomes and events A, B, P(A ∩ B) ≥ P(A) + P(B) - 1, where P(E) = |E|/|Ω|.
  assumptions:
  - $\Omega$は有限で空でない標本空間
  - $A,B\subseteq\Omega$
  quantifiers:
  - 任意の事象$A,B$
  conclusion: $P(A\cap B)\geq P(A)+P(B)-1$である。
  answer: 有限で空でない集合$\Omega$を標本空間とし、各根元事象が同様に確からしいとして、事象$A\subseteq\Omega$の確率を$P(A)=|A|/|\Omega|$と定める。$B$を事象とする。$|A\cup B|+|A\cap B|=|A|+|B|$であり、$A\cup B\subseteq\Omega$より$|A\cup B|\leq|\Omega|$である。したがって$|A\cap B|\geq|A|+|B|-|\Omega|$である。$|\Omega|>0$で割ると$P(A\cap B)\geq P(A)+P(B)-1$を得る。
  strategy: Combine the counting identity for A and B with |A ∪ B| ≤ |Ω|.
  sketch:
  - 'setup: Start from |A ∪ B| + |A ∩ B| = |A| + |B|.'
  - 'derive: Since A ∪ B is a subset of Ω, |A ∪ B| ≤ |Ω|.'
  - 'derive: So |A ∩ B| ≥ |A| + |B| - |Ω|.'
  - 'conclude: Divide by |Ω|.'
  openmath: (forall (O A B) (-> (and (in (size O) N) (> (size O) 0) (subset A O) (subset B O)) (<= (- (+ (/ (size A) (size O)) (/ (size B) (size O))) 1) (/ (size (inter A B)) (size O)))))
  hard_negative:
    statement: $P(A\cap B)\geq P(A)P(B)$が常に成り立つ。
    reason: $A,B$が排反で$P(A),P(B)>0$なら左辺は$0$、右辺は正となり成り立たない。
  target: |
    ∀ (Ω : Type*) [Fintype Ω] [DecidableEq Ω] [Nonempty Ω] (A B : Finset Ω), (A.card : ℝ) / Fintype.card Ω + (B.card : ℝ) / Fintype.card Ω - 1 ≤ ((A ∩ B).card : ℝ) / Fintype.card Ω
