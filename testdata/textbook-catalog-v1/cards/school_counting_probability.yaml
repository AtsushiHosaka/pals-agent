    statement: 事象の族全体の共通部分が空なら$P\left(\bigcup_{i\in I}A_i\right)=\sum_{i\in I}P(A_i)$である。
    reason: 必要なのはどの2つも排反という条件である。3事象で$A_1=A_2$、$A_3$が$A_1$と排反のとき全体の共通部分は空だが、$A_1\neq\emptyset$なら和は和事象の確率より$P(A_1)$だけ大きい。
  target: |
    ∀ (Ω ι : Type*) [Fintype Ω] [DecidableEq Ω] [Nonempty Ω] (I : Finset ι) (A : ι → Finset Ω), (∀ i ∈ I, ∀ j ∈ I, i ≠ j → Disjoint (A i) (A j)) → ((I.biUnion A).card : ℝ) / Fintype.card Ω = ∑ i ∈ I, ((A i).card : ℝ) / Fintype.card Ω
  proof: |
    by
      classical
      intro Ω ι _ _ _ I A hd
      rw [Finset.card_biUnion hd, Nat.cast_sum, Finset.sum_div]
- id: cond_prob_uniform_ratio
  kind: gap
  level: high
  topic: 確率・条件付き確率の定義
  statement: 有限で空でない標本空間$\Omega$の各根元事象が同様に確からしく、$A$が空でないとき、要素数の比で定めた条件付き確率$P_A(B)=|A\cap B|/|A|$は$P(A\cap B)/P(A)$に等しい。
  statement_en: For a finite nonempty sample space Ω with equally likely outcomes and a nonempty event A, the conditional probability defined by counting, |A ∩ B|/|A|, equals P(A ∩ B)/P(A), where P(E) = |E|/|Ω|.
  assumptions:
  - $\Omega$は有限で空でない標本空間
  - $A,B\subseteq\Omega$
  - $A\neq\emptyset$
  quantifiers:
  - 任意の事象$A,B$
  conclusion: $|A\cap B|/|A|=P(A\cap B)/P(A)$である。
  answer: 有限で空でない集合$\Omega$を標本空間とし、各根元事象が同様に確からしいとして、事象$A\subseteq\Omega$の確率を$P(A)=|A|/|\Omega|$と定める。$A$は空でないとし、$B$を事象とする。$|\Omega|>0$かつ$|A|>0$なので$P(A)\neq0$であり、$\dfrac{P(A\cap B)}{P(A)}=\dfrac{|A\cap B|/|\Omega|}{|A|/|\Omega|}=\dfrac{|A\cap B|}{|A|}$となる。
  strategy: Cancel the common denominator |Ω| in the ratio of probabilities.
  sketch:
  - 'setup: Note that |Ω| and |A| are positive.'
  - 'derive: Write both probabilities as counts over |Ω|.'
  - 'conclude: Cancelling |Ω| gives |A ∩ B|/|A|.'
  openmath: (forall (O A B) (-> (and (in (size O) N) (> (size O) 0) (subset A O) (subset B O) (> (size A) 0)) (= (/ (size (inter A B)) (size A)) (/ (/ (size (inter A B)) (size O)) (/ (size A) (size O))))))
  hard_negative:
    statement: $P_A(B)=P(B)/P(A)$である。
    reason: 分子は$B$ではなく$A\cap B$である。$A,B$が排反で空でないなら$P_A(B)=0$だが、$P(B)/P(A)>0$となる。
  target: |
    ∀ (Ω : Type*) [Fintype Ω] [DecidableEq Ω] [Nonempty Ω] (A B : Finset Ω), A.Nonempty → ((A ∩ B).card : ℝ) / A.card = (((A ∩ B).card : ℝ) / Fintype.card Ω) / ((A.card : ℝ) / Fintype.card Ω)
  proof: |
    by
      intro Ω _ _ _ A B hA
      have h : (Fintype.card Ω : ℝ) ≠ 0 := by exact_mod_cast Fintype.card_ne_zero
      have ha : (A.card : ℝ) ≠ 0 := by exact_mod_cast hA.card_ne_zero
      field_simp
- id: cond_prob_uniform_mul
  kind: textbook
  level: high
  topic: 確率・乗法定理
  statement: 有限で空でない標本空間$\Omega$の各根元事象が同様に確からしく、$A$が空でないとき、乗法定理$P(A\cap B)=P(A)P_A(B)$が成り立つ。ここで$P_A(B)=|A\cap B|/|A|$である。
  statement_en: For a finite nonempty sample space Ω with equally likely outcomes and a nonempty event A, the multiplication rule P(A ∩ B) = P(A) P_A(B) holds, where P_A(B) = |A ∩ B|/|A|.
  assumptions:
  - $\Omega$は有限で空でない標本空間
  - $A,B\subseteq\Omega$
  - $A\neq\emptyset$
  quantifiers:
  - 任意の事象$A,B$
  conclusion: $P(A\cap B)=P(A)P_A(B)$である。
  answer: 有限で空でない集合$\Omega$を標本空間とし、各根元事象が同様に確からしいとして、事象$A\subseteq\Omega$の確率を$P(A)=|A|/|\Omega|$と定める。$A$は空でないとし、$B$を事象とする。$P_A(B)=|A\cap B|/|A|$と定める。$|A|>0$なので$P(A)P_A(B)=\dfrac{|A|}{|\Omega|}\cdot\dfrac{|A\cap B|}{|A|}=\dfrac{|A\cap B|}{|\Omega|}=P(A\cap B)$である。
  strategy: Multiply the two count ratios and cancel |A|.
  sketch:
  - 'setup: Write P(A) = |A|/|Ω| and P_A(B) = |A ∩ B|/|A|.'
  - 'derive: Their product has |A| in the numerator and in the denominator.'
  - 'conclude: Cancelling |A| leaves |A ∩ B|/|Ω| = P(A ∩ B).'
  openmath: (forall (O A B) (-> (and (in (size O) N) (> (size O) 0) (subset A O) (subset B O) (> (size A) 0)) (= (/ (size (inter A B)) (size O)) (* (/ (size A) (size O)) (/ (size (inter A B)) (size A))))))
  hard_negative:
    statement: $P(A\cap B)=P(A)P(B)$が常に成り立つ。
    reason: これは独立な場合に限る。$A=B$で$0<P(A)<1$なら左辺は$P(A)$、右辺は$P(A)^2$で異なる。
  target: |
    ∀ (Ω : Type*) [Fintype Ω] [DecidableEq Ω] [Nonempty Ω] (A B : Finset Ω), A.Nonempty → ((A ∩ B).card : ℝ) / Fintype.card Ω = ((A.card : ℝ) / Fintype.card Ω) * (((A ∩ B).card : ℝ) / A.card)
  proof: |
    by
      intro Ω _ _ _ A B hA
      have ha : (A.card : ℝ) ≠ 0 := by exact_mod_cast hA.card_ne_zero
      have h : (Fintype.card Ω : ℝ) ≠ 0 := by exact_mod_cast Fintype.card_ne_zero
      field_simp
- id: cond_prob_uniform_chain
  kind: gap
  level: high
  topic: 確率・3事象の乗法定理
  statement: 有限で空でない標本空間$\Omega$の各根元事象が同様に確からしく、$A\cap B$が空でないとき、$P(A\cap B\cap C)=P(A)\,P_A(B)\,P_{A\cap B}(C)$が成り立つ。
  statement_en: For a finite nonempty sample space Ω with equally likely outcomes and events with A ∩ B nonempty, P(A ∩ B ∩ C) = P(A) P_A(B) P_{A∩B}(C), where P_X(Y) = |X ∩ Y|/|X|.
  assumptions:
  - $\Omega$は有限で空でない標本空間
  - $A,B,C\subseteq\Omega$
  - $A\cap B\neq\emptyset$
  - 事象$E$の確率は$P(E)=|E|/|\Omega|$、空でない事象$X$について$P_X(Y)=|X\cap Y|/|X|$と定める
  quantifiers:
  - 任意の事象$A,B,C$
  conclusion: $P(A\cap B\cap C)=P(A)P_A(B)P_{A\cap B}(C)$である。
  answer: 有限で空でない集合$\Omega$を標本空間とし、各根元事象が同様に確からしいとして、事象$A\subseteq\Omega$の確率を$P(A)=|A|/|\Omega|$と定める。$B,C$を事象とし、$A\cap B\neq\emptyset$とする。$P_X(Y)=|X\cap Y|/|X|$と定める。$A\cap B\neq\emptyset$より$|A\cap B|>0$であり、$A\cap B\subseteq A$より$|A|>0$である。よって$P(A)P_A(B)P_{A\cap B}(C)=\dfrac{|A|}{|\Omega|}\cdot\dfrac{|A\cap B|}{|A|}\cdot\dfrac{|A\cap B\cap C|}{|A\cap B|}=\dfrac{|A\cap B\cap C|}{|\Omega|}$であり、これは$P(A\cap B\cap C)$に等しい。
  strategy: Multiply the three count ratios; the product telescopes.
  sketch:
  - 'setup: From A ∩ B nonempty, both |A ∩ B| and |A| are positive.'
  - 'derive: Write each factor as a ratio of counts.'
  - 'conclude: The product telescopes to |A ∩ B ∩ C|/|Ω|.'
  openmath: (forall (O A B D) (-> (and (in (size O) N) (> (size O) 0) (subset A O) (subset B O) (subset D O) (> (size (inter A B)) 0)) (= (/ (size (inter (inter A B) D)) (size O)) (* (* (/ (size A) (size O)) (/ (size (inter A B)) (size A))) (/ (size (inter (inter A B) D)) (size (inter A B)))))))
  hard_negative:
    statement: $P(A\cap B\cap C)=P(A)\,P_A(B)\,P_B(C)$である。
    reason: 最後の因子の条件は$B$ではなく$A\cap B$である。$A,C$が排反で、$A\cap B$と$B\cap C$がともに空でないとき、左辺は$0$だが右辺は正である。
  target: |
    ∀ (Ω : Type*) [Fintype Ω] [DecidableEq Ω] [Nonempty Ω] (A B C : Finset Ω), (A ∩ B).Nonempty → ((A ∩ B ∩ C).card : ℝ) / Fintype.card Ω = ((A.card : ℝ) / Fintype.card Ω) * (((A ∩ B).card : ℝ) / A.card) * (((A ∩ B ∩ C).card : ℝ) / (A ∩ B).card)
  proof: |
