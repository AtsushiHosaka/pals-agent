      have h : (0 : ℝ) < Fintype.card Ω := by exact_mod_cast Fintype.card_pos
      have h1 : ((A ∪ B).card : ℝ) + (A ∩ B).card = A.card + B.card := by exact_mod_cast Finset.card_union_add_card_inter A B
      have h2 : ((A ∪ B).card : ℝ) ≤ Fintype.card Ω := by exact_mod_cast Finset.card_le_univ (A ∪ B)
      rw [le_div_iff₀ h, sub_mul, add_mul, div_mul_cancel₀ _ h.ne', div_mul_cancel₀ _ h.ne']
      linarith
- id: prob_uniform_disjoint_family_sum
  kind: gap
  level: high
  topic: 確率・排反事象の和
  statement: 有限で空でない標本空間$\Omega$の各根元事象が同様に確からしいとき、どの2つも排反な有限個の事象$A_i\ (i\in I)$について$P\left(\bigcup_{i\in I}A_i\right)=\sum_{i\in I}P(A_i)$が成り立つ。
  statement_en: For a finite nonempty sample space Ω with equally likely outcomes and a finite family of pairwise disjoint events A_i (i in I), the probability of the union is the sum of the probabilities P(A_i).
  assumptions:
  - $\Omega$は有限で空でない標本空間
  - $I$は有限集合
  - $i\neq j$なら$A_i\cap A_j=\emptyset$
  quantifiers:
  - 任意のどの2つも排反な事象の族$(A_i)_{i\in I}$
  conclusion: $P\left(\bigcup_{i\in I}A_i\right)=\sum_{i\in I}P(A_i)$である。
  answer: 有限で空でない集合$\Omega$を標本空間とし、各根元事象が同様に確からしいとして、事象$A\subseteq\Omega$の確率を$P(A)=|A|/|\Omega|$と定める。$I$を有限集合とし、事象$A_i\ (i\in I)$はどの2つも排反であるとする。和集合$\bigcup_{i\in I}A_i$の各要素は、ちょうど1つの$A_i$に属する。したがって$\left|\bigcup_{i\in I}A_i\right|=\sum_{i\in I}|A_i|$である。両辺を$|\Omega|$で割ると結論を得る。
  strategy: Pairwise disjointness makes the counts add up; divide by |Ω|.
  sketch:
  - 'setup: Each element of the union lies in exactly one A_i by pairwise disjointness.'
  - 'derive: Hence the size of the union is the sum of the sizes |A_i|.'
  - 'conclude: Dividing by |Ω| gives the claim.'
  openmath: (forall (O I A) (-> (and (in (size O) N) (> (size O) 0) (in (size I) N) (forall (i j) (-> (and (in i I) (in j I) (!= i j)) (= (inter (family_value A i) (family_value A j)) emptyset)))) (= (/ (size (indexed_union_over I A)) (size O)) (sum I (lambda (i) (/ (size (family_value A i)) (size O)))))))
