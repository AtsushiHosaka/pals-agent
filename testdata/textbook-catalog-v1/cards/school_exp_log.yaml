    $a>1$、$x,y>0$とする。$\log$を自然対数とし、$\log_au=\dfrac{\log u}{\log a}$とする。$a>1$より$\log a>0$なので、$\log_ax<\log_ay$は$\log x<\log y$と同値である。$\log$は正の数の上で狭義増加なので、これは$x<y$と同値である。
