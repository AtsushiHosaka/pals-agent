  - "construct: For the forward direction take t = log_a x."
  - "derive: Then t^2 + pt + q = 0 and x = a^t."
  - "conclude: For the converse, x = a^t gives log_a x = t, so the quadratic holds."
  openmath: (forall (a p q x) (-> (and (in a R) (in p R) (in q R) (in x R) (> a 0) (!= a 1) (> x 0)) (<-> (= (+ (+ (^ (/ (ln x) (ln a)) 2) (* p (/ (ln x) (ln a)))) q) 0) (exists (t) (and (in t R) (= (+ (+ (^ t 2) (* p t)) q) 0) (= x (^ a t)))))))
