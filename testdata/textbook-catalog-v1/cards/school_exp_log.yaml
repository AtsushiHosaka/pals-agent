- id: rpow_add_exponent_law
  kind: textbook
  level: high
  topic: 指数・指数法則
  statement: $a>0$のとき、任意の実数$x,y$について$a^{x+y}=a^xa^y$である。
  statement_en: If a > 0, then a^(x+y) = a^x a^y for all real x and y.
  assumptions:
  - $a>0$
  - $x,y$は実数
  quantifiers:
  - 任意の正の実数$a$と実数$x,y$
  conclusion: $a^{x+y}=a^xa^y$である。
  answer: |
    $a>0$とし、$x,y$を実数とする。実数指数を$a^t=e^{t\log a}$で定める。ここで$\log$は自然対数である。指数関数の加法法則$e^{u+v}=e^ue^v$を$u=x\log a$、$v=y\log a$に用いると、$a^{x+y}=e^{x\log a+y\log a}=e^{x\log a}e^{y\log a}=a^xa^y$である。
  strategy: Write real powers through the exponential function and use its addition law.
  sketch:
  - "translate: Write a^t = exp(t log a), which is meaningful because a > 0."
  - "apply_theorem: Use exp(u+v) = exp(u) exp(v) with u = x log a and v = y log a."
  - "conclude: This is a^(x+y) = a^x a^y."
  openmath: (forall (a x y) (-> (and (in a R) (in x R) (in y R) (> a 0)) (= (^ a (+ x y)) (* (^ a x) (^ a y)))))
  hard_negative:
    statement: $a<0$でも、任意の実数$x,y$について$a^{x+y}=a^xa^y$が成り立つ。
    reason: $a=-1$、$x=y=\dfrac{1}{2}$のとき$(-1)^{1/2}$は実数にならない。実数指数の底は正に限る。
  target: |
    ∀ (a x y : ℝ), 0 < a → a ^ (x + y) = a ^ x * a ^ y
  proof: |
    by
      intro a x y ha
      exact Real.rpow_add ha x y
- id: rpow_mul_exponent_law
  kind: textbook
  level: high
  topic: 指数・指数法則
  statement: $a>0$のとき、任意の実数$x,y$について$(a^x)^y=a^{xy}$である。
  statement_en: If a > 0, then (a^x)^y = a^(xy) for all real x and y.
  assumptions:
  - $a>0$
  - $x,y$は実数
  quantifiers:
  - 任意の正の実数$a$と実数$x,y$
  conclusion: $(a^x)^y=a^{xy}$である。
  answer: |
    $a>0$とし、$x,y$を実数とする。実数指数を$c^t=e^{t\log c}$（$c>0$）で定める。ここで$\log$は自然対数である。$a^x=e^{x\log a}>0$であり、$\log a^x=x\log a$である。よって$(a^x)^y=e^{y\log a^x}=e^{yx\log a}=a^{xy}$である。
  strategy: Compute the logarithm of a^x and substitute it into the definition of the outer power.
  sketch:
  - "translate: Write c^t = exp(t log c) for c > 0."
  - "derive: a^x is positive and log(a^x) = x log a."
  - "conclude: (a^x)^y = exp(y x log a) = a^(xy)."
  openmath: (forall (a x y) (-> (and (in a R) (in x R) (in y R) (> a 0)) (= (^ (^ a x) y) (^ a (* x y)))))
  hard_negative:
    statement: $a<0$でも、任意の実数$x,y$について$(a^x)^y=a^{xy}$が成り立つ。
    reason: $a=-1$、$x=2$、$y=\dfrac{1}{2}$のとき左辺は$1$で、右辺は$-1$である。
  target: |
    ∀ (a x y : ℝ), 0 < a → (a ^ x) ^ y = a ^ (x * y)
  proof: |
    by
      intro a x y ha
      exact (Real.rpow_mul ha.le x y).symm
- id: mul_rpow_base_law
  kind: textbook
  level: high
  topic: 指数・指数法則
  statement: $a,b>0$のとき、任意の実数$x$について$(ab)^x=a^xb^x$である。
  statement_en: If a, b > 0, then (ab)^x = a^x b^x for every real x.
  assumptions:
  - $a>0$
  - $b>0$
  - $x$は実数
  quantifiers:
  - 任意の正の実数$a,b$と実数$x$
  conclusion: $(ab)^x=a^xb^x$である。
  answer: |
    $a,b>0$とし、$x$を実数とする。実数指数を$c^t=e^{t\log c}$（$c>0$）で定める。ここで$\log$は自然対数である。$\log(ab)=\log a+\log b$なので、$(ab)^x=e^{x\log a+x\log b}=e^{x\log a}e^{x\log b}=a^xb^x$である。
  strategy: Use log(ab) = log a + log b inside the exponential definition of the power.
  sketch:
  - "translate: Write (ab)^x = exp(x log(ab))."
  - "apply_theorem: Split log(ab) = log a + log b for positive a and b."
  - "conclude: The addition law of exp gives a^x b^x."
  openmath: (forall (a b x) (-> (and (in a R) (in b R) (in x R) (> a 0) (> b 0)) (= (^ (* a b) x) (* (^ a x) (^ b x)))))
  hard_negative:
    statement: $a,b<0$でも、任意の実数$x$について$(ab)^x=a^xb^x$が成り立つ。
    reason: $a=b=-1$、$x=\dfrac{1}{2}$のとき左辺は$1$だが、$(-1)^{1/2}$は実数にならない。
  target: |
    ∀ (a b x : ℝ), 0 < a → 0 < b → (a * b) ^ x = a ^ x * b ^ x
  proof: |
    by
      intro a b x ha hb
      exact Real.mul_rpow ha.le hb.le
- id: nth_root_unique_nonneg_solution
  kind: textbook
  level: high
  topic: 指数・累乗根
  statement: $a\geq 0$、$n$を正の整数とする。$x\geq 0$について、$x^n=a$であることと$x=\sqrt[n]{a}$であることは同値である。ここで$\sqrt[n]{a}=a^{1/n}$である。
  statement_en: Let a ≥ 0 and let n be a positive integer. For x ≥ 0, x^n = a holds if and only if x = a^(1/n), the n-th root of a.
  assumptions:
  - $a\geq 0$
  - $x\geq 0$
  - $n$は正の整数
  quantifiers:
  - 任意の非負実数$a,x$と正の整数$n$
  conclusion: $x^n=a$と$x=\sqrt[n]{a}$は同値である。
  answer: |
    $a\geq 0$、$x\geq 0$とし、$n$を正の整数とする。$y=a^{1/n}$とおくと$y\geq 0$である。まず$y^n=a$を示す。$a=0$のときは$y=0$なので成り立つ。$a>0$のときは$y^n=(a^{1/n})^n=a^{(1/n)\cdot n}=a$である。したがって$x=y$なら$x^n=a$である。逆に$x^n=a$なら$x^n=y^n$である。$t\geq 0$の範囲で$t^n$は狭義増加なので、$x=y$である。
  strategy: Show that a^(1/n) is a nonnegative solution, then use strict monotonicity of t^n on t ≥ 0 for uniqueness.
  sketch:
  - "setup: Put y = a^(1/n), which is nonnegative."
  - "case_split: For a = 0 we have y = 0; for a > 0 the exponent law gives y^n = a."
  - "derive: Hence x = y implies x^n = a."
  - "apply_theorem: If x^n = a = y^n, strict monotonicity of t^n on t ≥ 0 gives x = y."
  openmath: (forall (a x n) (-> (and (in a R) (in x R) (in n N) (>= a 0) (>= x 0) (>= n 1)) (<-> (= (^ x n) a) (= x (root a n)))))
  hard_negative:
    statement: $x$の符号を問わず、$x^n=a$と$x=\sqrt[n]{a}$は同値である。
    reason: $n=2$、$a=1$、$x=-1$のとき$x^n=a$だが$\sqrt[n]{a}=1$である。累乗根は非負の解だけを指す。
  target: |
    ∀ (a x : ℝ) (n : ℕ), 0 ≤ a → 0 ≤ x → 1 ≤ n → (x ^ n = a ↔ x = a ^ (1 / (n : ℝ)))
  proof: |
    by
      intro a x n ha hx hn
      have hn0 : n ≠ 0 := by omega
      rw [one_div]
      constructor
      · intro h
        rw [← h]
        exact (Real.pow_rpow_inv_natCast hx hn0).symm
      · intro h
        rw [h]
        exact Real.rpow_inv_natCast_pow ha hn0
- id: even_root_of_even_power_abs
  kind: gap
  level: high
  topic: 指数・累乗根
  statement: 指数が偶数の場合に限った形として、任意の実数$a$と正の整数$n$について$\sqrt[2n]{a^{2n}}=|a|$である。
  statement_en: Special even-exponent form. For every real a and positive integer n, the 2n-th root of a^(2n) equals |a|.
  assumptions:
  - $a$は実数
  - $n$は正の整数
  quantifiers:
  - 任意の実数$a$と正の整数$n$
  conclusion: $\sqrt[2n]{a^{2n}}=|a|$である。
  answer: |
    $a$を実数、$n$を正の整数とする。$2n$は偶数なので$a^{2n}=|a|^{2n}$であり、$|a|\geq 0$である。一方、$\sqrt[2n]{a^{2n}}$も$0$以上で、$2n$乗すると$a^{2n}$になる。$t\geq 0$の範囲で$t^{2n}$は狭義増加なので、$t^{2n}=a^{2n}$をみたす$t\geq 0$はただ一つである。よって$\sqrt[2n]{a^{2n}}=|a|$である。
  strategy: Rewrite the even power with |a| and use that a nonnegative 2n-th root is unique.
  sketch:
  - "derive: Since 2n is even, a^(2n) = |a|^(2n)."
  - "setup: Both |a| and the 2n-th root of a^(2n) are nonnegative solutions of t^(2n) = a^(2n)."
  - "apply_theorem: t^(2n) is strictly increasing on t ≥ 0, so the nonnegative solution is unique."
  - "conclude: The root equals |a|."
  openmath: (forall (a n) (-> (and (in a R) (in n N) (>= n 1)) (= (root (^ a (* 2 n)) (* 2 n)) (abs a))))
  hard_negative:
    statement: 任意の実数$a$と正の整数$n$について$\sqrt[2n]{a^{2n}}=a$である。
    reason: $a=-1$、$n=1$のとき左辺は$1$で右辺は$-1$である。$a$が負のときは絶対値が必要である。
  target: |
    ∀ (a : ℝ) (n : ℕ), 1 ≤ n → (a ^ (2 * n)) ^ (1 / ((2 * n : ℕ) : ℝ)) = |a|
  proof: |
    by
      intro a n hn
      have h : 2 * n ≠ 0 := by omega
      have he : a ^ (2 * n) = |a| ^ (2 * n) := ((even_two_mul n).pow_abs a).symm
      rw [he, one_div]
      exact Real.pow_rpow_inv_natCast (abs_nonneg a) h
- id: rational_exponent_as_root_of_power
  kind: gap
  level: high
  topic: 指数・有理数の指数
  statement: $a>0$、$m$を整数、$n$を正の整数とする。このとき$a^{m/n}=(\sqrt[n]{a})^m=\sqrt[n]{a^m}$である。
  statement_en: Let a > 0, let m be an integer and n a positive integer. Then a^(m/n) = (a^(1/n))^m = (a^m)^(1/n).
  assumptions:
  - $a>0$
  - $m$は整数
  - $n$は正の整数
  quantifiers:
  - 任意の正の実数$a$、整数$m$、正の整数$n$
  conclusion: $a^{m/n}=(\sqrt[n]{a})^m=\sqrt[n]{a^m}$である。
  answer: |
    $a>0$、$m$を整数、$n$を正の整数とする。正の底について成り立つ指数法則$(a^s)^t=a^{st}$を用いる。$s=\dfrac{1}{n}$、$t=m$とすると$(a^{1/n})^m=a^{m/n}$である。$s=m$、$t=\dfrac{1}{n}$とすると$(a^m)^{1/n}=a^{m/n}$である。$\sqrt[n]{c}=c^{1/n}$なので、これが示すべき等式である。
  strategy: Apply the exponent law (a^s)^t = a^(st) in both orders of the factors 1/n and m.
  sketch:
  - "setup: Identify the n-th root with the exponent 1/n."
  - "apply_theorem: Use (a^s)^t = a^(st) with s = 1/n and t = m."
  - "apply_theorem: Use the same law with s = m and t = 1/n."
  - "conclude: Both expressions equal a^(m/n)."
  openmath: (forall (a m n) (-> (and (in a R) (in m Z) (in n N) (> a 0) (>= n 1)) (and (= (^ a (/ m n)) (^ (root a n) m)) (= (^ a (/ m n)) (root (^ a m) n)))))
  hard_negative:
    statement: $a<0$でも$a^{m/n}=\sqrt[n]{a^m}$である。
    reason: $a=-1$、$m=n=2$のとき、$\dfrac{m}{n}=1$より左辺を$-1$と読むことになるが、右辺は$1$である。底が負だと分数の表し方で値が変わる。
  target: |
    ∀ (a : ℝ) (m : ℤ) (n : ℕ), 0 < a → 1 ≤ n → a ^ ((m : ℝ) / (n : ℝ)) = (a ^ (1 / (n : ℝ))) ^ m ∧ a ^ ((m : ℝ) / (n : ℝ)) = (a ^ m) ^ (1 / (n : ℝ))
  proof: |
    by
      intro a m n ha hn
      constructor
      · rw [← Real.rpow_intCast, ← Real.rpow_mul ha.le]
        congr 1
        ring
      · rw [← Real.rpow_intCast, ← Real.rpow_mul ha.le]
        congr 1
        ring
- id: power_function_lt_iff_positive_exponent
  kind: gap
  level: high
  topic: 指数・累乗の大小
  statement: $a,b\geq 0$、$p>0$のとき、$a^p<b^p$であることと$a<b$であることは同値である。$p=\dfrac{1}{n}$とすれば累乗根の大小比較になる。
  statement_en: If a, b ≥ 0 and p > 0, then a^p < b^p if and only if a < b; the case p = 1/n compares n-th roots.
  assumptions:
  - $a,b\geq 0$
  - $p>0$
  quantifiers:
  - 任意の非負実数$a,b$と正の実数$p$
  conclusion: $a^p<b^p$と$a<b$は同値である。
  answer: |
    $a,b\geq 0$、$p>0$とする。$p>0$なので$0^p=0$であり、$c>0$なら$c^p>0$である。$b=0$のときは$a^p<0$も$a<0$も成り立たない。$a=0$、$b>0$のときは$a^p=0<b^p$かつ$a<b$である。$a,b>0$のときは$c^p=e^{p\log c}$であり、$\log$と指数関数は狭義増加で$p>0$なので、$a^p<b^p$と$\log a<\log b$と$a<b$は同値である。
  strategy: Treat a zero base separately, then use monotonicity of log and exp for positive bases.
  sketch:
  - "setup: For p > 0, 0^p = 0 and c^p > 0 when c > 0."
  - "case_split: Check the cases b = 0 and a = 0 < b directly."
  - "translate: For a, b > 0 write c^p = exp(p log c)."
  - "apply_theorem: Since p > 0, exp and log are strictly increasing, so the order is preserved in both directions."
  openmath: (forall (a b p) (-> (and (in a R) (in b R) (in p R) (>= a 0) (>= b 0) (> p 0)) (<-> (< (^ a p) (^ b p)) (< a b))))
  hard_negative:
    statement: $a,b>0$、$p<0$のときも、$a^p<b^p$と$a<b$は同値である。
    reason: $a=1$、$b=2$、$p=-1$のとき$a<b$だが$a^p=1>\dfrac{1}{2}=b^p$である。指数が負なら向きが逆になる。
  target: |
    ∀ (a b p : ℝ), 0 ≤ a → 0 ≤ b → 0 < p → (a ^ p < b ^ p ↔ a < b)
  proof: |
    by
      intro a b p ha hb hp
      exact Real.rpow_lt_rpow_iff ha hb hp
- id: exp_lt_iff_base_gt_one
  kind: textbook
  level: high
  topic: 指数関数・単調性
  statement: $a>1$のとき、任意の実数$x,y$について、$a^x<a^y$であることと$x<y$であることは同値である。
  statement_en: If a > 1, then a^x < a^y if and only if x < y.
  assumptions:
  - $a>1$
  - $x,y$は実数
  quantifiers:
  - 任意の$a>1$と実数$x,y$
  conclusion: $a^x<a^y$と$x<y$は同値である。
  answer: |
    $a>1$とし、$x,y$を実数とする。$a^t=e^{t\log a}$であり、$a>1$より$\log a>0$である。自然対数の底の指数関数は狭義増加なので、$a^x<a^y$は$x\log a<y\log a$と同値である。$\log a>0$で両辺を割ると、これは$x<y$と同値である。
  strategy: Reduce to the strictly increasing function exp using log a > 0.
  sketch:
  - "translate: Write a^t = exp(t log a)."
  - "derive: a > 1 gives log a > 0."
  - "apply_theorem: exp is strictly increasing, so a^x < a^y is x log a < y log a."
  - "conclude: Dividing by log a > 0 gives x < y."
  openmath: (forall (a x y) (-> (and (in a R) (in x R) (in y R) (> a 1)) (<-> (< (^ a x) (^ a y)) (< x y))))
  hard_negative:
    statement: $0<a<1$のときも、$a^x<a^y$と$x<y$は同値である。
    reason: $a=\dfrac{1}{2}$、$x=0$、$y=1$のとき$x<y$だが$a^x=1>\dfrac{1}{2}=a^y$である。
  target: |
    ∀ (a x y : ℝ), 1 < a → (a ^ x < a ^ y ↔ x < y)
  proof: |
    by
      intro a x y ha
      exact Real.rpow_lt_rpow_left_iff ha
- id: exp_lt_iff_base_lt_one
  kind: textbook
  level: high
  topic: 指数関数・単調性
  statement: $0<a<1$のとき、任意の実数$x,y$について、$a^x<a^y$であることと$y<x$であることは同値である。
  statement_en: If 0 < a < 1, then a^x < a^y if and only if y < x.
  assumptions:
  - $0<a<1$
  - $x,y$は実数
  quantifiers:
  - 任意の$0<a<1$と実数$x,y$
  conclusion: $a^x<a^y$と$y<x$は同値である。
  answer: |
    $0<a<1$とし、$x,y$を実数とする。$a^t=e^{t\log a}$であり、$0<a<1$より$\log a<0$である。自然対数の底の指数関数は狭義増加なので、$a^x<a^y$は$x\log a<y\log a$と同値である。負の数$\log a$で両辺を割ると不等号の向きが変わるので、これは$y<x$と同値である。
  strategy: Reduce to exp and divide by the negative number log a, which reverses the inequality.
  sketch:
  - "translate: Write a^t = exp(t log a)."
  - "derive: 0 < a < 1 gives log a < 0."
  - "apply_theorem: exp is strictly increasing, so a^x < a^y is x log a < y log a."
  - "conclude: Dividing by log a < 0 gives y < x."
  openmath: (forall (a x y) (-> (and (in a R) (in x R) (in y R) (> a 0) (< a 1)) (<-> (< (^ a x) (^ a y)) (< y x))))
  hard_negative:
    statement: $a>1$のときも、$a^x<a^y$と$y<x$は同値である。
    reason: $a=2$、$x=0$、$y=1$のとき$a^x<a^y$だが$y<x$ではない。向きが逆になるのは底が$1$より小さいときだけである。
  target: |
    ∀ (a x y : ℝ), 0 < a → a < 1 → (a ^ x < a ^ y ↔ y < x)
  proof: |
    by
      intro a x y ha0 ha1
      exact Real.rpow_lt_rpow_left_iff_of_base_lt_one ha0 ha1
- id: exp_eq_iff_exponent_eq
  kind: gap
  level: high
  topic: 指数方程式・底をそろえる
  statement: $a>0$、$a\neq 1$のとき、実数$x,y$について、$a^x=a^y$であることと$x=y$であることは同値である。
  statement_en: If a > 0 and a ≠ 1, then for real x and y, a^x = a^y if and only if x = y.
  assumptions:
  - $a>0$
  - $a\neq 1$
  - $x,y$は実数
  quantifiers:
  - 任意の$a>0$、$a\neq 1$と実数$x,y$
  conclusion: $a^x=a^y$と$x=y$は同値である。
  answer: |
    $a>0$、$a\neq 1$とし、$x,y$を実数とする。$x=y$なら$a^x=a^y$である。逆に$a^x=a^y$とする。両辺の自然対数をとると$x\log a=y\log a$である。$a\neq 1$より$\log a\neq 0$なので、$x=y$である。
  strategy: Take natural logarithms and cancel the nonzero factor log a.
  sketch:
  - "setup: The direction from x = y is immediate."
  - "translate: Taking log of a^x = a^y gives x log a = y log a."
  - "derive: a ≠ 1 gives log a ≠ 0."
  - "conclude: Cancelling log a gives x = y."
  openmath: (forall (a x y) (-> (and (in a R) (in x R) (in y R) (> a 0) (!= a 1)) (<-> (= (^ a x) (^ a y)) (= x y))))
  hard_negative:
    statement: $a>0$なら、$a=1$の場合も含めて$a^x=a^y$と$x=y$は同値である。
    reason: $a=1$のときは任意の$x,y$で$a^x=a^y=1$となる。
  target: |
    ∀ (a x y : ℝ), 0 < a → a ≠ 1 → (a ^ x = a ^ y ↔ x = y)
  proof: |
    by
      intro a x y ha ha1
      constructor
      · intro h
        have hl : x * Real.log a = y * Real.log a := by
          rw [← Real.log_rpow ha, ← Real.log_rpow ha, h]
        have hne : Real.log a ≠ 0 := Real.log_ne_zero_of_pos_of_ne_one ha ha1
        exact mul_right_cancel₀ hne hl
      · intro h
        rw [h]
- id: exp_eq_positive_has_unique_solution
  kind: textbook
  level: high
  topic: 指数関数・値域と対数の存在
  statement: $a>0$、$a\neq 1$、$y>0$のとき、$a^x=y$をみたす実数$x$はただ一つ存在する。
  statement_en: If a > 0, a ≠ 1 and y > 0, there is exactly one real x with a^x = y.
  assumptions:
  - $a>0$
  - $a\neq 1$
  - $y>0$
  quantifiers:
  - 任意の$a>0$、$a\neq 1$と$y>0$
