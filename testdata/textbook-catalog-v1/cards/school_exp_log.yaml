    ∀ (a b c x y : ℝ), 1 < c → 0 < a → 0 < b → (a ^ x < b ^ y ↔ x * Real.logb c a < y * Real.logb c b)
  proof: |
    by
      intro a b c x y hc ha hb
      rw [← Real.logb_rpow_eq_mul_logb_of_pos ha, ← Real.logb_rpow_eq_mul_logb_of_pos hb]
