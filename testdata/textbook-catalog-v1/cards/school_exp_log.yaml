  assumptions:
  - $N,m$は正の整数
  - $k$は$0$以上の整数
  quantifiers:
  - 任意の正の整数$N,m$と$0$以上の整数$k$
  conclusion: $m\cdot 10^k\leq N<(m+1)\cdot 10^k$と$\log_{10}m\leq\log_{10}N-k<\log_{10}(m+1)$は同値である。
  answer: |
    $N,m$を正の整数、$k$を$0$以上の整数とする。関数$u\mapsto\log_{10}u$は$u>0$で狭義増加なので、$m\cdot 10^k\leq N<(m+1)\cdot 10^k$は$\log_{10}(m\cdot 10^k)\leq\log_{10}N<\log_{10}((m+1)\cdot 10^k)$と同値である。積の対数の公式と$\log_{10}10^k=k$より、これは$\log_{10}m+k\leq\log_{10}N<\log_{10}(m+1)+k$と同じである。各辺から$k$を引くと示すべき不等式を得る。なお、$m\cdot 10^k\leq N<(m+1)\cdot 10^k$は$N$を$10^k$で割った商が$m$であることと同じである。$1\leq m\leq 9$のとき、これは$N$が$k+1$桁で最高位の数字が$m$であることを表す。
  strategy: Apply log_10 to the bounds, split the logarithm of each product, and subtract k.
  sketch:
  - "apply_theorem: log_10 is strictly increasing on positive numbers."
  - "derive: log_10(m 10^k) = log_10 m + k, and likewise for m + 1."
  - "conclude: Subtracting k gives log_10 m ≤ log_10 N - k < log_10(m+1)."
  openmath: (forall (K m k) (-> (and (in K N) (in m N) (in k N) (>= K 1) (>= m 1)) (<-> (and (<= (* m (^ 10 k)) K) (< K (* (+ m 1) (^ 10 k)))) (and (<= (/ (ln m) (ln 10)) (- (/ (ln K) (ln 10)) k)) (< (- (/ (ln K) (ln 10)) k) (/ (ln (+ m 1)) (ln 10)))))))
  hard_negative:
    statement: 上の同値で上端の$\log_{10}(m+1)$を$\log_{10}m+1$に置き換えてもよい。
    reason: $N=25$、$m=1$、$k=1$のとき$\log_{10}N-k<\log_{10}m+1=1$をみたすが、$N<(m+1)\cdot 10^k=20$はみたさない。
  target: |
    ∀ (N m k : ℕ), 1 ≤ N → 1 ≤ m → (((m : ℝ) * 10 ^ k ≤ (N : ℝ) ∧ (N : ℝ) < ((m : ℝ) + 1) * 10 ^ k) ↔ (Real.logb 10 (m : ℝ) ≤ Real.logb 10 (N : ℝ) - (k : ℝ) ∧ Real.logb 10 (N : ℝ) - (k : ℝ) < Real.logb 10 ((m : ℝ) + 1)))
  proof: |
    by
      intro N m k hN hm
      have h10 : (1 : ℝ) < 10 := by norm_num
      have hNr : (0 : ℝ) < (N : ℝ) := by exact_mod_cast hN
      have hmr : (0 : ℝ) < (m : ℝ) := by exact_mod_cast hm
      have hm1 : (0 : ℝ) < (m : ℝ) + 1 := by linarith
