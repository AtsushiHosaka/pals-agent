  conclusion: $\log_bx<\log_ax$である。
  answer: |
    $1<a<b$、$x>1$とする。$\log$を自然対数とすると、$\log$は狭義増加なので$0<\log a<\log b$であり、$\log x>0$である。分子が正で等しい分数は分母が大きいほど小さいので、$\log_bx=\dfrac{\log x}{\log b}<\dfrac{\log x}{\log a}=\log_ax$である。
  strategy: Change to natural logarithms and compare fractions with the same positive numerator.
  sketch:
  - "translate: Write both logarithms as quotients of natural logarithms."
  - "derive: 0 < log a < log b and log x > 0."
  - "conclude: The fraction with the larger denominator is smaller."
  openmath: (forall (a b x) (-> (and (in a R) (in b R) (in x R) (> a 1) (< a b) (> x 1)) (< (/ (ln x) (ln b)) (/ (ln x) (ln a)))))
  hard_negative:
    statement: $1<a<b$、$0<x<1$のときも$\log_bx<\log_ax$である。
    reason: $a=2$、$b=4$、$x=\dfrac{1}{2}$のとき$\log_bx=-\dfrac{1}{2}>-1=\log_ax$である。真数が$1$より小さいと向きが逆になる。
