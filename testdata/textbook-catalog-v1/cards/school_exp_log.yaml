  - $k\neq 1$
  - $a^x=k$
  - $b^y=k$
  quantifiers:
  - 条件をみたす任意の実数$a,b,k,x,y$
  conclusion: $\dfrac{1}{x}+\dfrac{1}{y}=\log_k(ab)$である。
  answer: |
    $a,b,k>0$、$k\neq 1$とし、実数$x,y$は$a^x=k$、$b^y=k$をみたすとする。$\log$を自然対数とし、$\log_ku=\dfrac{\log u}{\log k}$とする。$k\neq 1$より$\log k\neq 0$である。$a^x=k$の自然対数をとると$x\log a=\log k$である。右辺が$0$でないので$x\neq 0$であり、$\log a=\dfrac{\log k}{x}$である。同様に$y\neq 0$で$\log b=\dfrac{\log k}{y}$である。よって$\log_k(ab)=\dfrac{\log a+\log b}{\log k}=\dfrac{1}{x}+\dfrac{1}{y}$である。
  strategy: Take logarithms of both equations; k ≠ 1 forces x, y ≠ 0, then add the expressions for log a and log b.
  sketch:
  - "translate: Taking log gives x log a = log k and y log b = log k."
  - "derive: k ≠ 1 gives log k ≠ 0, hence x ≠ 0 and y ≠ 0."
  - "derive: So log a = log k / x and log b = log k / y."
  - "conclude: log_k(ab) = (log a + log b) / log k = 1/x + 1/y."
  openmath: (forall (a b k x y) (-> (and (in a R) (in b R) (in k R) (in x R) (in y R) (> a 0) (> b 0) (> k 0) (!= k 1) (= (^ a x) k) (= (^ b y) k)) (= (+ (/ 1 x) (/ 1 y)) (/ (ln (* a b)) (ln k)))))
  hard_negative:
    statement: $a,b,k>0$で$a^x=b^y=k$なら、$k=1$でも$\dfrac{1}{x}+\dfrac{1}{y}=\log_k(ab)$である。
    reason: $k=1$では$x=y=0$がありうるうえ、$\log_1$は定義されない。条件$k\neq 1$が$x,y\neq 0$を保証している。
  target: |
    ∀ (a b k x y : ℝ), 0 < a → 0 < b → 0 < k → k ≠ 1 → a ^ x = k → b ^ y = k → 1 / x + 1 / y = Real.logb k (a * b)
  proof: |
    by
      intro a b k x y ha hb hk hk1 hx hy
      have hL : Real.log k ≠ 0 := Real.log_ne_zero_of_pos_of_ne_one hk hk1
      have h1 : x * Real.log a = Real.log k := by rw [← Real.log_rpow ha, hx]
      have h2 : y * Real.log b = Real.log k := by rw [← Real.log_rpow hb, hy]
      have hx0 : x ≠ 0 := by
        rintro rfl
        apply hL
        rw [← h1, zero_mul]
      have hy0 : y ≠ 0 := by
        rintro rfl
        apply hL
        rw [← h2, zero_mul]
      rw [Real.logb, Real.log_mul ha.ne' hb.ne']
      have ea : Real.log a = Real.log k / x := by field_simp; linarith
      have eb : Real.log b = Real.log k / y := by field_simp; linarith
      rw [ea, eb]
      field_simp
