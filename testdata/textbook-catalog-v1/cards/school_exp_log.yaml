  strategy: Apply the strictly increasing function log_c to both powers and use the power rule.
  sketch:
  - "setup: The powers a^x and b^y are positive."
  - "apply_theorem: c > 1 makes log_c strictly increasing on positive numbers."
  - "derive: The power rule gives log_c(a^x) = x log_c a and log_c(b^y) = y log_c b."
  - "conclude: The two inequalities are equivalent."
  openmath: (forall (a b c x y) (-> (and (in a R) (in b R) (in c R) (in x R) (in y R) (> c 1) (> a 0) (> b 0)) (<-> (< (^ a x) (^ b y)) (< (* x (/ (ln a) (ln c))) (* y (/ (ln b) (ln c)))))))
