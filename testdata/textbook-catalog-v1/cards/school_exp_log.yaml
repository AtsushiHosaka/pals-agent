  statement: $a>0$、$a\neq 1$、$b>0$とし、$m$を$0$でない実数とするとき、任意の実数$n$について$\log_{a^m}(b^n)=\dfrac{n}{m}\log_ab$である。
  statement_en: If a > 0, a ≠ 1, b > 0 and m is a nonzero real, then log_(a^m)(b^n) = (n/m) log_a b for every real n.
  assumptions:
