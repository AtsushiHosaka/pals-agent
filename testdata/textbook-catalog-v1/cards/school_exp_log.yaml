- id: digit_count_iff_common_log_bounds
  kind: gap
  level: high
  topic: 常用対数・桁数
  statement: 正の整数$N$と$0$以上の整数$d$について、$N$の十進表記が$d+1$桁であることと$d\leq\log_{10}N<d+1$であることは同値である。
  statement_en: For a positive integer N and a nonnegative integer d, the decimal expansion of N has d + 1 digits if and only if d ≤ log_10 N < d + 1.
  assumptions:
  - $N$は正の整数
  - $d$は$0$以上の整数
  quantifiers:
  - 任意の正の整数$N$と$0$以上の整数$d$
  conclusion: $N$が$d+1$桁であることと$d\leq\log_{10}N<d+1$は同値である。
  answer: |
    $N$を正の整数、$d$を$0$以上の整数とする。十進表記の最高位の数字は$0$でないので、$N$が$d+1$桁であることは$10^d\leq N<10^{d+1}$と同値である。関数$u\mapsto\log_{10}u$は$u>0$で狭義増加であり、$\log_{10}10^t=t$である。したがってこの不等式は$d\leq\log_{10}N<d+1$と同値である。
  strategy: Translate the digit count into bounds between powers of ten and apply the increasing function log_10.
  sketch:
  - "translate: N has d + 1 digits exactly when 10^d ≤ N < 10^(d+1)."
  - "apply_theorem: log_10 is strictly increasing on positive numbers."
  - "conclude: The bounds are equivalent to d ≤ log_10 N < d + 1."
  openmath: (forall (K d) (-> (and (in K N) (in d N) (>= K 1)) (<-> (= (decimal_digit_count K) (+ d 1)) (and (<= d (/ (ln K) (ln 10))) (< (/ (ln K) (ln 10)) (+ d 1))))))
  hard_negative:
    statement: $N$が$d+1$桁であることと$d<\log_{10}N\leq d+1$は同値である。
    reason: $N=10$は$2$桁で$d=1$だが、$\log_{10}N=1$なので$d<\log_{10}N$をみたさない。
  target: |
    ∀ (N d : ℕ), 1 ≤ N → ((Nat.digits 10 N).length = d + 1 ↔ (d : ℝ) ≤ Real.logb 10 (N : ℝ) ∧ Real.logb 10 (N : ℝ) < (d : ℝ) + 1)
  proof: |
    by
      intro N d hN
      have hN0 : N ≠ 0 := by omega
      have hNr : (0 : ℝ) < (N : ℝ) := by exact_mod_cast hN
      have h10 : (1 : ℝ) < 10 := by norm_num
      rw [Nat.length_digits 10 N (by norm_num) hN0, Nat.add_right_cancel_iff,
        Nat.log_eq_iff (Or.inr ⟨by norm_num, hN0⟩)]
      rw [Real.le_logb_iff_rpow_le h10 hNr, Real.logb_lt_iff_lt_rpow h10 hNr]
      have e1 : (10 : ℝ) ^ (d : ℝ) = ((10 ^ d : ℕ) : ℝ) := by
        rw [Real.rpow_natCast]; norm_cast
      have e2 : (10 : ℝ) ^ ((d : ℝ) + 1) = ((10 ^ (d + 1) : ℕ) : ℝ) := by
        have : ((d : ℝ) + 1) = ((d + 1 : ℕ) : ℝ) := by push_cast; ring
        rw [this, Real.rpow_natCast]; norm_cast
      rw [e1, e2, Nat.cast_le, Nat.cast_lt]
- id: digit_count_of_power_floor_formula
  kind: gap
  level: high
  topic: 常用対数・累乗の桁数
  statement: 正の整数$a$と$0$以上の整数$n$について、$a^n$の十進表記の桁数は$\lfloor n\log_{10}a\rfloor+1$である。
  statement_en: For a positive integer a and a nonnegative integer n, the decimal expansion of a^n has ⌊n log_10 a⌋ + 1 digits.
  assumptions:
  - $a$は正の整数
  - $n$は$0$以上の整数
  quantifiers:
  - 任意の正の整数$a$と$0$以上の整数$n$
  conclusion: $a^n$の桁数は$\lfloor n\log_{10}a\rfloor+1$である。
  answer: |
    $a$を正の整数、$n$を$0$以上の整数とする。$\ell=\lfloor n\log_{10}a\rfloor$とおく。$a\geq 1$より$n\log_{10}a\geq 0$なので、$\ell$は$0$以上の整数である。$\log_{10}(a^n)=n\log_{10}a$なので$\ell\leq\log_{10}(a^n)<\ell+1$である。関数$u\mapsto 10^u$は狭義増加なので、$10^\ell\leq a^n<10^{\ell+1}$である。十進表記の最高位の数字は$0$でないから、この不等式は$a^n$が$\ell+1$桁であることを意味する。
  strategy: Take the floor of n log_10 a, then exponentiate the resulting bounds to read off the digit count.
  sketch:
  - "setup: Put l = floor(n log_10 a), a nonnegative integer since a ≥ 1."
  - "derive: The power rule gives l ≤ log_10(a^n) < l + 1."
  - "apply_theorem: Exponentiating gives 10^l ≤ a^n < 10^(l+1)."
  - "conclude: These bounds mean that a^n has l + 1 digits."
  openmath: (forall (a n) (-> (and (in a N) (in n N) (>= a 1)) (= (decimal_digit_count (^ a n)) (+ (floor (* n (/ (ln a) (ln 10)))) 1))))
  hard_negative:
    statement: $a^n$の桁数は、$n\log_{10}a$以上の最小の整数に等しい。
    reason: $a=10$、$n=1$のとき$n\log_{10}a=1$なのでその値は$1$だが、$a^n=10$は$2$桁である。
  target: |
    ∀ (a n : ℕ), 1 ≤ a → (Nat.digits 10 (a ^ n)).length = ⌊(n : ℝ) * Real.logb 10 (a : ℝ)⌋₊ + 1
  proof: |
    by
      intro a n ha
      have hp : a ^ n ≠ 0 := by positivity
      rw [Nat.length_digits 10 _ (by norm_num) hp, ← Real.natFloor_logb_natCast]
      push_cast
      rw [Real.logb_pow]
- id: leading_digit_iff_common_log_bounds
  kind: gap
  level: high
  topic: 常用対数・最高位の数字
  statement: 正の整数$N,m$と$0$以上の整数$k$について、$m\cdot 10^k\leq N<(m+1)\cdot 10^k$であることと$\log_{10}m\leq\log_{10}N-k<\log_{10}(m+1)$であることは同値である。$1\leq m\leq 9$のとき、前者は$N$が$k+1$桁で最高位の数字が$m$であることを表す。
