  - "apply_theorem: log is strictly increasing on positive numbers, so this is x < y."
  openmath: (forall (a x y) (-> (and (in a R) (in x R) (in y R) (> a 1) (> x 0) (> y 0)) (<-> (< (/ (ln x) (ln a)) (/ (ln y) (ln a))) (< x y))))
