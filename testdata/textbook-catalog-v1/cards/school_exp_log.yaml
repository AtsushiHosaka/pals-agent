  kind: gap
  level: high
  topic: 対数・累乗の大小比較
  statement: $c>1$、$a,b>0$のとき、実数$x,y$について、$a^x<b^y$であることと$x\log_ca<y\log_cb$であることは同値である。
  statement_en: If c > 1 and a, b > 0, then a^x < b^y if and only if x log_c a < y log_c b.
  assumptions:
  - $c>1$
  - $a,b>0$
