- id: exp_factored_quadratic_inequality
  kind: gap
  level: high
  topic: 指数不等式・置き換え
  statement: $a>1$、$0<\alpha<\beta$のとき、実数$x$について、$(a^x-\alpha)(a^x-\beta)<0$であることと$\log_a\alpha<x<\log_a\beta$であることは同値である。
  statement_en: If a > 1 and 0 < α < β, then for real x, (a^x - α)(a^x - β) < 0 if and only if log_a α < x < log_a β.
  assumptions:
  - $a>1$
  - $0<\alpha<\beta$
  - $x$は実数
  quantifiers:
  - 任意の$a>1$、$0<\alpha<\beta$と実数$x$
  conclusion: $(a^x-\alpha)(a^x-\beta)<0$と$\log_a\alpha<x<\log_a\beta$は同値である。
  answer: |
    $a>1$、$0<\alpha<\beta$とし、$x$を実数とする。$\alpha<\beta$なので、$t=a^x$について$(t-\alpha)(t-\beta)<0$は$\alpha<t<\beta$と同値である。$a>1$より関数$u\mapsto\log_au$は$u>0$で狭義増加であり、$\log_aa^x=x$である。$\alpha,\beta,a^x$はすべて正なので、$\alpha<a^x<\beta$は$\log_a\alpha<x<\log_a\beta$と同値である。
  strategy: Solve the quadratic inequality in t = a^x, then apply the increasing function log_a.
  sketch:
  - "setup: Put t = a^x."
  - "derive: Since α < β, the product is negative exactly when α < t < β."
  - "apply_theorem: log_a is strictly increasing on positive numbers because a > 1."
  - "conclude: α < a^x < β is equivalent to log_a α < x < log_a β."
  openmath: (forall (a alpha beta x) (-> (and (in a R) (in alpha R) (in beta R) (in x R) (> a 1) (> alpha 0) (< alpha beta)) (<-> (< (* (- (^ a x) alpha) (- (^ a x) beta)) 0) (and (< (/ (ln alpha) (ln a)) x) (< x (/ (ln beta) (ln a)))))))
  hard_negative:
    statement: $a>1$、$\alpha<\beta$なら、$\alpha\leq 0$でも$(a^x-\alpha)(a^x-\beta)<0$は$\log_a\alpha<x<\log_a\beta$と同値である。
    reason: $\alpha\leq 0$では$\log_a\alpha$が定義されない。$\beta>0$なら$a^x>0\geq\alpha$はつねに成り立つので、解は$x<\log_a\beta$だけになる。
  target: |
    ∀ (a α β x : ℝ), 1 < a → 0 < α → α < β → ((a ^ x - α) * (a ^ x - β) < 0 ↔ Real.logb a α < x ∧ x < Real.logb a β)
  proof: |
    by
      intro a α β x ha hα hαβ
      have hβ : 0 < β := hα.trans hαβ
      have h1 : Real.logb a α < x ↔ α < a ^ x := Real.logb_lt_iff_lt_rpow ha hα
      have h2 : x < Real.logb a β ↔ a ^ x < β := Real.lt_logb_iff_rpow_lt ha hβ
      rw [h1, h2]
      constructor
      · intro h
        constructor
        · by_contra h3
          have h4 := not_lt.1 h3
          nlinarith [mul_nonneg (sub_nonneg.2 h4) (sub_nonneg.2 (h4.trans hαβ.le))]
        · by_contra h3
          have h4 := not_lt.1 h3
          nlinarith [mul_nonneg (sub_nonneg.2 (hαβ.le.trans h4)) (sub_nonneg.2 h4)]
      · rintro ⟨h3, h4⟩
        exact mul_neg_of_pos_of_neg (sub_pos.2 h3) (sub_neg.2 h4)
- id: reciprocal_exponent_sum_common_value
  kind: gap
  level: high
  topic: 指数と対数・共通の値でおく
  statement: $a,b,k>0$、$k\neq 1$とし、実数$x,y$が$a^x=b^y=k$をみたすとき、$\dfrac{1}{x}+\dfrac{1}{y}=\log_k(ab)$である。
