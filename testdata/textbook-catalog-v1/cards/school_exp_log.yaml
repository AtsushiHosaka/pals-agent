  conclusion: $10^{-k}\leq x<10^{1-k}$と$-k\leq\log_{10}x<1-k$は同値である。
  answer: |
    $x>0$とし、$k$を正の整数とする。関数$u\mapsto\log_{10}u$は$u>0$で狭義増加であり、実数$t$について$\log_{10}10^t=t$である。不等式$10^{-k}\leq x<10^{1-k}$の各辺に$\log_{10}$を適用すると、これは$-k\leq\log_{10}x<1-k$と同値である。なお、$10^{-k}\leq x<10^{1-k}$は、$x$の整数部分と小数第$k-1$位までの数字がすべて$0$で、小数第$k$位の数字が$0$でないことを表す。
  strategy: Apply the increasing function log_10 to the bounds between powers of ten.
  sketch:
  - "setup: The bounds 10^(-k) and 10^(1-k) are powers of ten."
  - "apply_theorem: log_10 is strictly increasing on positive numbers and log_10(10^t) = t."
  - "conclude: The bounds on x are equivalent to the bounds on log_10 x."
  openmath: (forall (x k) (-> (and (in x R) (in k N) (> x 0) (>= k 1)) (<-> (and (<= (^ 10 (neg k)) x) (< x (^ 10 (- 1 k)))) (and (<= (neg k) (/ (ln x) (ln 10))) (< (/ (ln x) (ln 10)) (- 1 k))))))
  hard_negative:
    statement: $x$の小数第$k$位に初めて$0$でない数字が現れることと$-k<\log_{10}x\leq 1-k$は同値である。
    reason: $x=10^{-k}$は小数第$k$位に初めて$0$でない数字$1$が現れるが、$\log_{10}x=-k$なので左側の不等式をみたさない。
  target: |
    ∀ (x : ℝ) (k : ℕ), 0 < x → 1 ≤ k → (((10 : ℝ) ^ (-(k : ℝ)) ≤ x ∧ x < (10 : ℝ) ^ (1 - (k : ℝ))) ↔ (-(k : ℝ) ≤ Real.logb 10 x ∧ Real.logb 10 x < 1 - (k : ℝ)))
  proof: |
    by
      intro x k hx _
      have h10 : (1 : ℝ) < 10 := by norm_num
      rw [Real.le_logb_iff_rpow_le h10 hx, Real.logb_lt_iff_lt_rpow h10 hx]
- id: digit_count_iff_log_bounds_any_base
  kind: gap
  level: high
  topic: 対数・b進法の桁数
  statement: $2$以上の整数$b$、正の整数$N$、$0$以上の整数$d$について、$N$を$b$進法で表すと$d+1$桁であることと、$d\leq\log_b N<d+1$であることは同値である。
  statement_en: For an integer b ≥ 2, a positive integer N and a nonnegative integer d, N has d+1 digits in base b if and only if d ≤ log_b N < d+1.
  assumptions:
  - $b$は$2$以上の整数
  - $N$は正の整数
  - $d$は$0$以上の整数
  quantifiers:
  - 任意の$2$以上の整数$b$
  - 任意の正の整数$N$
  - 任意の$0$以上の整数$d$
  conclusion: $N$が$b$進法で$d+1$桁であることと$d\leq\log_b N<d+1$は同値である。
  answer: |
    $b\geq 2$、$N\geq 1$、$d\geq 0$を整数とする。$N$が$b$進法で$d+1$桁であることは、最高位が$b^d$の位にあること、すなわち$b^d\leq N<b^{d+1}$と同値である。
    底$b$は$1$より大きいので$\log_b$は狭義単調増加である。よって$b^d\leq N$は$d\leq\log_b N$と同値であり、$N<b^{d+1}$は$\log_b N<d+1$と同値である。
  strategy: Translate the digit count into power bounds, then apply the increasing function log_b.
  sketch:
  - "setup: Fix b ≥ 2, N ≥ 1 and d ≥ 0."
  - "derive: N has d+1 digits in base b exactly when b^d ≤ N < b^(d+1)."
  - "conclude: Applying the strictly increasing log_b gives d ≤ log_b N < d+1."
  openmath: (forall (b K d) (-> (and (in b N) (in K N) (in d N) (>= b 2) (>= K 1)) (<-> (= (digit_length b K) (+ d 1)) (and (<= d (/ (ln K) (ln b))) (< (/ (ln K) (ln b)) (+ d 1))))))
  hard_negative:
    statement: $2$以上の整数$b$、正の整数$N$、$0$以上の整数$d$について、$N$を$b$進法で表すと$d+1$桁であることと、$d<\log_b N\leq d+1$であることは同値である。
    reason: $N=b^d$は$d+1$桁だが$\log_b N=d$なので$d<\log_b N$を満たさない。等号の位置が逆である。
  target: |
    ∀ (b N d : ℕ), 1 < b → 1 ≤ N → ((Nat.digits b N).length = d + 1 ↔ (d : ℝ) ≤ Real.logb b (N : ℝ) ∧ Real.logb b (N : ℝ) < (d : ℝ) + 1)
  proof: |
    by
      intro b N d hb hN
      have hN0 : N ≠ 0 := by omega
      have hNr : (0 : ℝ) < (N : ℝ) := by exact_mod_cast hN
      have hbr : (1 : ℝ) < (b : ℝ) := by exact_mod_cast hb
      rw [Nat.length_digits b N hb hN0, Nat.add_right_cancel_iff,
        Nat.log_eq_iff (Or.inr ⟨hb, hN0⟩)]
      rw [Real.le_logb_iff_rpow_le hbr hNr, Real.logb_lt_iff_lt_rpow hbr hNr]
      have e1 : (b : ℝ) ^ (d : ℝ) = ((b ^ d : ℕ) : ℝ) := by
        rw [Real.rpow_natCast]; norm_cast
      have e2 : (b : ℝ) ^ ((d : ℝ) + 1) = ((b ^ (d + 1) : ℕ) : ℝ) := by
        have : ((d : ℝ) + 1) = ((d + 1 : ℕ) : ℝ) := by push_cast; ring
        rw [this, Real.rpow_natCast]; norm_cast
      rw [e1, e2, Nat.cast_le, Nat.cast_lt]
- id: digit_count_of_power_floor_any_base
  kind: gap
  level: high
  topic: 対数・累乗のb進法の桁数
  statement: $2$以上の整数$b$、正の整数$a$、$0$以上の整数$n$について、$a^n$を$b$進法で表したときの桁数は$\lfloor n\log_b a\rfloor+1$である。
  statement_en: For an integer b ≥ 2, a positive integer a and a nonnegative integer n, the number of base-b digits of a^n is the floor of n log_b a plus 1.
  assumptions:
  - $b$は$2$以上の整数
  - $a$は正の整数
  - $n$は$0$以上の整数
  quantifiers:
  - 任意の$2$以上の整数$b$
  - 任意の正の整数$a$
  - 任意の$0$以上の整数$n$
  conclusion: $a^n$の$b$進法の桁数は$\lfloor n\log_b a\rfloor+1$である。
  answer: |
    $b\geq 2$、$a\geq 1$、$n\geq 0$を整数とする。$a^n$は正の整数なので、$b$進法の桁数を$L\geq 1$とおくと$b^{L-1}\leq a^n<b^L$である。
    底$b$は$1$より大きいので、$\log_b$をとると$L-1\leq n\log_b a<L$である。$L-1$は整数なので、これは$\lfloor n\log_b a\rfloor=L-1$を意味する。よって$L=\lfloor n\log_b a\rfloor+1$である。
  strategy: Bound a^n between consecutive powers of b and take logarithms.
  sketch:
  - "setup: Let L be the number of base-b digits of a^n."
  - "derive: b^(L-1) ≤ a^n < b^L."
  - "derive: Taking log_b gives L-1 ≤ n log_b a < L."
  - "conclude: The floor of n log_b a is L-1."
  openmath: (forall (a b n) (-> (and (in a N) (in b N) (in n N) (>= a 1) (>= b 2)) (= (digit_length b (^ a n)) (+ (floor (* n (/ (ln a) (ln b)))) 1))))
  hard_negative:
    statement: $2$以上の整数$b$、正の整数$a$、正の整数$n$について、$a^n$を$b$進法で表したときの桁数は$\lceil n\log_b a\rceil$である。
    reason: $a=b$、$n=1$のとき$a^n=b$は$b$進法で$2$桁だが、$\lceil\log_b b\rceil=1$である。$a^n$が$b$の累乗のとき食い違う。
  target: |
    ∀ (a b n : ℕ), 1 < b → 1 ≤ a → (Nat.digits b (a ^ n)).length = ⌊(n : ℝ) * Real.logb b (a : ℝ)⌋₊ + 1
  proof: |
    by
      intro a b n hb ha
      have hp : a ^ n ≠ 0 := by positivity
      rw [Nat.length_digits b _ hb hp, ← Real.natFloor_logb_natCast]
      push_cast
      rw [Real.logb_pow]
