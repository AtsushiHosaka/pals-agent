- id: logb_change_of_base
  kind: named
  level: high
  topic: 対数・底の変換公式
  statement: 底の変換公式。$a,c>0$、$a\neq 1$、$c\neq 1$、$b>0$のとき、$\log_ab=\dfrac{\log_cb}{\log_ca}$である。
  statement_en: Change of base formula. If a, c > 0, a ≠ 1, c ≠ 1 and b > 0, then log_a b = log_c b / log_c a.
  assumptions:
  - $a,c>0$
  - $a\neq 1$
  - $c\neq 1$
  - $b>0$
  quantifiers:
  - 条件をみたす任意の実数$a,b,c$
  conclusion: $\log_ab=\dfrac{\log_cb}{\log_ca}$である。
  answer: |
    $a,c>0$、$a\neq 1$、$c\neq 1$、$b>0$とする。$p=\log_ab$とおくと$a^p=b$である。両辺の$c$を底とする対数をとると$p\log_ca=\log_cb$である。$a\neq 1$より$\log_ca\neq 0$なので、$p=\dfrac{\log_cb}{\log_ca}$である。
  strategy: Apply log_c to a^p = b and divide by log_c a, which is nonzero because a ≠ 1.
  sketch:
  - "setup: Put p = log_a b, so a^p = b."
  - "translate: Applying log_c gives p log_c a = log_c b."
  - "derive: a ≠ 1 gives log_c a ≠ 0."
  - "conclude: Dividing gives p = log_c b / log_c a."
  openmath: (forall (a b c) (-> (and (in a R) (in b R) (in c R) (> a 0) (!= a 1) (> b 0) (> c 0) (!= c 1)) (= (/ (ln b) (ln a)) (/ (/ (ln b) (ln c)) (/ (ln a) (ln c))))))
  hard_negative:
    statement: $c>0$、$c\neq 1$、$b>0$なら、$a=1$でも$\log_ab=\dfrac{\log_cb}{\log_ca}$である。
    reason: $a=1$では$\log_1b$が定義されず、右辺の分母$\log_c1$は$0$である。
  target: |
    ∀ (a b c : ℝ), 0 < a → a ≠ 1 → 0 < b → 0 < c → c ≠ 1 → Real.logb a b = Real.logb c b / Real.logb c a
  proof: |
    by
      intro a b c ha ha1 _ hc hc1
      have h1 : Real.log a ≠ 0 := Real.log_ne_zero_of_pos_of_ne_one ha ha1
      have h2 : Real.log c ≠ 0 := Real.log_ne_zero_of_pos_of_ne_one hc hc1
      simp only [Real.logb]
      field_simp
