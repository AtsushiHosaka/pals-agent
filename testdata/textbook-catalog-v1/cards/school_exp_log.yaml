    ∀ (a x y : ℝ), 1 < a → 0 < x → 0 < y → (Real.logb a x < Real.logb a y ↔ x < y)
  proof: |
    by
      intro a x y ha hx hy
      exact Real.logb_lt_logb_iff ha hx hy
