      intro a b x ha hab hx
      have h1 : 0 < Real.log a := Real.log_pos ha
      have h2 : Real.log a < Real.log b := Real.log_lt_log (by linarith) hab
      have h3 : 0 < Real.log x := Real.log_pos hx
