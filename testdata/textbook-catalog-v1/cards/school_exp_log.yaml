  sketch:
  - "derive: a ≠ 1 and m ≠ 0 give a^m ≠ 1, so a^m is a valid base."
  - "apply_theorem: Change base to a."
  - "derive: log_a(b^n) = n log_a b and log_a(a^m) = m."
  - "conclude: The quotient is (n/m) log_a b."
  openmath: (forall (a b m n) (-> (and (in a R) (in b R) (in m R) (in n R) (> a 0) (!= a 1) (> b 0) (!= m 0)) (= (/ (ln (^ b n)) (ln (^ a m))) (* (/ n m) (/ (ln b) (ln a))))))
