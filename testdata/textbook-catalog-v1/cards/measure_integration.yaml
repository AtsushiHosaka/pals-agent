  - $\mu$は可測集合による下限で任意の部分集合に拡張する
  - 全ての$n$で$\mu(s_n)=0$
  quantifiers:
  - 任意の測度$\mu$と部分集合の列$(s_n)$
  conclusion: $\mu(\bigcup_ns_n)=0$である。
  answer: |
    $\alpha$を可測空間、$\mu$を$\alpha$上の測度とし、部分集合$S$については$S$を含む可測集合の測度の下限を$\mu(S)$とする。$(s_n)$を全ての$n$で$\mu(s_n)=0$を満たす部分集合の列とする。

    拡張された$\mu$は可算劣加法的なので、$\mu(\bigcup_ns_n)\leq\sum_n\mu(s_n)=0$である。$\mu$の値は非負なので、$\mu(\bigcup_ns_n)=0$である。
  strategy: Apply countable subadditivity and nonnegativity.
  sketch:
  - 'apply_theorem: Countable subadditivity gives μ(⋃ s_n) ≤ Σ μ(s_n).'
  - 'conclude: The sum vanishes, so the union is null.'
