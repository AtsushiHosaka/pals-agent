  hard_negative:
    statement: 測度0の集合の任意個の和は測度0である。
    reason: '[0,1]は一点集合の非可算和だが測度1である。'
  target: |
    ∀ (α : Type*) [MeasurableSpace α] (μ : MeasureTheory.Measure α) (s : ℕ → Set α), (∀ n, μ (s n) = 0) → μ (⋃ n, s n) = 0
  proof: |
