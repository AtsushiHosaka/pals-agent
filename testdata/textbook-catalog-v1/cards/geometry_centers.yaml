  - $A,B,C$は同一直線上にない3点
  - $H$は垂心
  - $E$は$B$から直線$CA$への垂線の足
  - $F$は$C$から直線$AB$への垂線の足
  quantifiers: *id001
  conclusion: $B,C,E,F$と$A,H,E,F$はそれぞれ同一円周（球面）上にある。
  answer: |
    $A,B,C$を同一直線上にない3点、$H$を垂心、$E,F$を上のとおりとする。まず、$\overrightarrow{ZX}\cdot\overrightarrow{ZY}=0$なら$Z$は線分$XY$の中点$N$から距離$\frac{XY}{2}$にあることを示す。$\overrightarrow{NZ}=-\frac{1}{2}(\overrightarrow{ZX}+\overrightarrow{ZY})$であり、内積が$0$なので$|\overrightarrow{ZX}+\overrightarrow{ZY}|=|\overrightarrow{ZX}-\overrightarrow{ZY}|=XY$となるからである。$E$は直線$CA$上にあるので$\overrightarrow{EC}$は$\overrightarrow{CA}$の実数倍であり、$\overrightarrow{EB}\cdot\overrightarrow{CA}=0$から$\overrightarrow{EB}\cdot\overrightarrow{EC}=0$である。同様に$\overrightarrow{FC}\cdot\overrightarrow{FB}=0$である。よって$E,F$は$BC$の中点から距離$\frac{BC}{2}$にあり、$B,C$も同じ距離にある。次に$\overrightarrow{BH}\perp\overrightarrow{CA}$と$\overrightarrow{BE}\perp\overrightarrow{CA}$から$\overrightarrow{EH}=\overrightarrow{EB}+\overrightarrow{BH}$は$\overrightarrow{CA}$に垂直である。$\overrightarrow{EA}$は$\overrightarrow{CA}$の実数倍なので$\overrightarrow{EA}\cdot\overrightarrow{EH}=0$である。同様に$\overrightarrow{FA}\cdot\overrightarrow{FH}=0$である。よって$E,F$は$AH$の中点から距離$\frac{AH}{2}$にあり、$A,H$も同じ距離にある。
  strategy: Each foot sees a segment at a right angle, so it lies on the circle with that segment as diameter.
  sketch:
  - 'derive: If ZX·ZY = 0, then Z is at distance XY/2 from the midpoint of XY.'
  - 'derive: EB·EC = 0 and FC·FB = 0 because E and F lie on lines CA and AB.'
  - 'conclude: B, C, E, F lie on the circle with diameter BC.'
  - 'derive: EH ⟂ CA since BH ⟂ CA and BE ⟂ CA, so EA·EH = 0; likewise FA·FH = 0.'
  - 'conclude: A, H, E, F lie on the circle with diameter AH.'
  openmath: (forall (a b c x y) (-> (and (not (collinear_points a b c)) (on_line x c a) (= (inner_product (- b x) (- a c)) 0) (on_line y a b) (= (inner_product (- c y) (- b a)) 0)) (and (cospherical_points (set b c x y)) (cospherical_points (set a (orthocenter_of a b c) x y)))))
  hard_negative:
    statement: $A,B,E,F$は常に同一円周上にある。
    reason: $E,F$は$BC$を直径とする円と$AH$を直径とする円の上にある。$A$と$B$と$F$は同一直線$AB$上にあり、$F$が$A,B$と異なれば3点を通る円は存在しない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (t : Affine.Triangle ℝ P) (i j k : Fin 3) (E F : P), i ≠ j → i ≠ k → j ≠ k → E ∈ line[ℝ, t.points k, t.points i] → inner ℝ (t.points j -ᵥ E) (t.points i -ᵥ t.points k) = 0 → F ∈ line[ℝ, t.points i, t.points j] → inner ℝ (t.points k -ᵥ F) (t.points j -ᵥ t.points i) = 0 → EuclideanGeometry.Cospherical ({t.points j, t.points k, E, F} : Set P) ∧ EuclideanGeometry.Cospherical ({t.points i, t.orthocenter, E, F} : Set P)
  proof: |
    by
      intro V P _ _ _ _ t i j k E F hij hik hjk
      have hu : ∀ (l m n : Fin 3), l ≠ m → l ≠ n → m ≠ n → (Finset.univ : Finset (Fin 3)) = {l, m, n} := by decide
      intro hE hpE hF hpF
      have orth : ∀ l m n : Fin 3, l ≠ m → l ≠ n → m ≠ n → inner ℝ (t.orthocenter -ᵥ t.points l) (t.points m -ᵥ t.points n) = 0 := by
        intro l m n hlm hln hmn
        have h := t.orthocenter_vsub_circumcenter_eq_sum_vsub
        rw [hu l m n hlm hln hmn, Finset.sum_insert (by simp [hlm, hln]), Finset.sum_insert (by simp [hmn]), Finset.sum_singleton] at h
        have hj := t.dist_circumcenter_eq_circumradius m
        have hk := t.dist_circumcenter_eq_circumradius n
        rw [dist_eq_norm_vsub V] at hj hk
        have e1 : t.orthocenter -ᵥ t.points l = (t.points m -ᵥ t.circumcenter) + (t.points n -ᵥ t.circumcenter) := by
          rw [← vsub_sub_vsub_cancel_right t.orthocenter (t.points l) t.circumcenter, h]; abel
        have e2 : t.points m -ᵥ t.points n = (t.points m -ᵥ t.circumcenter) - (t.points n -ᵥ t.circumcenter) :=
          (vsub_sub_vsub_cancel_right _ _ _).symm
        rw [e1, e2, inner_add_left, inner_sub_right, inner_sub_right, real_inner_self_eq_norm_sq,
          real_inner_self_eq_norm_sq, real_inner_comm, hj, hk]
        ring
      have thales : ∀ X Y Z : P, inner ℝ (X -ᵥ Z) (Y -ᵥ Z) = 0 → dist Z (midpoint ℝ X Y) = dist X Y / 2 := by
        intro X Y Z h
        have e : Z -ᵥ midpoint ℝ X Y = (-(1 / 2) : ℝ) • ((X -ᵥ Z) + (Y -ᵥ Z)) := by
          rw [← neg_vsub_eq_vsub_rev, midpoint_vsub, invOf_eq_inv]
          module
        have e2 : X -ᵥ Y = (X -ᵥ Z) - (Y -ᵥ Z) := (vsub_sub_vsub_cancel_right _ _ _).symm
        have n1 : ‖(X -ᵥ Z) + (Y -ᵥ Z)‖ = ‖(X -ᵥ Z) - (Y -ᵥ Z)‖ := by
          rw [← sq_eq_sq₀ (norm_nonneg _) (norm_nonneg _), norm_add_sq_real, norm_sub_sq_real, h]
          ring
        rw [dist_eq_norm_vsub V Z, e, norm_smul, n1, ← e2, ← dist_eq_norm_vsub]
        norm_num
        ring
      obtain ⟨r, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hE
      obtain ⟨s, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hF
      have eE1 : t.points k -ᵥ AffineMap.lineMap (t.points k) (t.points i) r = (-r) • (t.points i -ᵥ t.points k) := by
        rw [AffineMap.lineMap_apply, vsub_vadd_eq_vsub_sub, vsub_self, zero_sub, neg_smul]
      have eE2 : t.points i -ᵥ AffineMap.lineMap (t.points k) (t.points i) r = (1 - r) • (t.points i -ᵥ t.points k) := by
        rw [AffineMap.lineMap_apply, vsub_vadd_eq_vsub_sub, sub_smul, one_smul]
      have eF1 : t.points i -ᵥ AffineMap.lineMap (t.points i) (t.points j) s = (-s) • (t.points j -ᵥ t.points i) := by
        rw [AffineMap.lineMap_apply, vsub_vadd_eq_vsub_sub, vsub_self, zero_sub, neg_smul]
      have eF2 : t.points j -ᵥ AffineMap.lineMap (t.points i) (t.points j) s = (1 - s) • (t.points j -ᵥ t.points i) := by
        rw [AffineMap.lineMap_apply, vsub_vadd_eq_vsub_sub, sub_smul, one_smul]
      constructor
      · refine ⟨midpoint ℝ (t.points j) (t.points k), dist (t.points j) (t.points k) / 2, ?_⟩
        intro x hx
        simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hx
        rcases hx with rfl | rfl | rfl | rfl
        · rw [dist_left_midpoint]; norm_num; ring
        · rw [dist_right_midpoint]; norm_num; ring
        · apply thales
          rw [eE1, inner_smul_right, hpE, mul_zero]
        · apply thales
          rw [real_inner_comm, eF2, inner_smul_right, hpF, mul_zero]
      · refine ⟨midpoint ℝ (t.points i) t.orthocenter, dist (t.points i) t.orthocenter / 2, ?_⟩
        intro x hx
        simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hx
        rcases hx with rfl | rfl | rfl | rfl
        · rw [dist_left_midpoint]; norm_num; ring
        · rw [dist_right_midpoint]; norm_num; ring
        · apply thales
          have e : t.orthocenter -ᵥ AffineMap.lineMap (t.points k) (t.points i) r = (t.orthocenter -ᵥ t.points j) + (t.points j -ᵥ AffineMap.lineMap (t.points k) (t.points i) r) := (vsub_add_vsub_cancel _ _ _).symm
          rw [eE2, e, inner_smul_left, inner_add_right, real_inner_comm (t.orthocenter -ᵥ t.points j), real_inner_comm (t.points j -ᵥ _), orth j i k hij.symm hjk hik, hpE]
          simp
        · apply thales
          have e : t.orthocenter -ᵥ AffineMap.lineMap (t.points i) (t.points j) s = (t.orthocenter -ᵥ t.points k) + (t.points k -ᵥ AffineMap.lineMap (t.points i) (t.points j) s) := (vsub_add_vsub_cancel _ _ _).symm
          rw [eF1, e, inner_smul_left, inner_add_right, real_inner_comm (t.orthocenter -ᵥ t.points k), real_inner_comm (t.points k -ᵥ _), orth k j i hjk.symm hik.symm hij.symm, hpF]
          simp
- id: euler_line
  kind: named
  level: high
  topic: 三角形の五心・オイラー線
  statement: 'オイラー線: 三角形の外心を$O$、重心を$G$、垂心を$H$とすると、$\overrightarrow{OH}=3\overrightarrow{OG}$である。したがって$G$は線分$OH$を$O$の側から$1:2$に内分し、$GH=2OG$である。'
  statement_en: 'Euler line: for a triangle with circumcenter O, centroid G and orthocenter H, OH = 3 OG as vectors, G = O + (1/3)(H - O), and GH = 2 OG.'
  assumptions:
  - $A,B,C$は同一直線上にない3点
  - $O,G,H$は外心、重心、垂心
  quantifiers: *id001
  conclusion: $\overrightarrow{OH}=3\overrightarrow{OG}$であり、$G$は$OH$を$1:2$に内分し、$GH=2OG$である。
  answer: |
    $A,B,C$を同一直線上にない3点、$O$を外心、$R$を外接円の半径、$G$を重心、$H$を垂心とする。外心$O$を始点とするベクトルを$\vec a=\overrightarrow{OA}$、$\vec b=\overrightarrow{OB}$、$\vec c=\overrightarrow{OC}$とおくと$|\vec a|=|\vec b|=|\vec c|=R$である。$\overrightarrow{OH'}=\vec a+\vec b+\vec c$で平面$ABC$上の点$H'$を定めると、$\overrightarrow{AH'}\cdot\overrightarrow{BC}=(\vec b+\vec c)\cdot(\vec c-\vec b)=|\vec c|^2-|\vec b|^2=0$となり、同様に$\overrightarrow{BH'}\perp\overrightarrow{CA}$である。$H'$は2本の垂線の交点だから垂心$H$と一致し、$\overrightarrow{OH}=\vec a+\vec b+\vec c$である。重心は$\overrightarrow{OG}=\frac{1}{3}(\vec a+\vec b+\vec c)$を満たすので$\overrightarrow{OH}=3\overrightarrow{OG}$である。よって$\overrightarrow{OG}=\frac{1}{3}\overrightarrow{OH}$であり、$\overrightarrow{GH}=\overrightarrow{OH}-\overrightarrow{OG}=2\overrightarrow{OG}$である。長さをとると$GH=2OG$を得る。
  strategy: Both G and H are multiples of the sum of the vertex vectors from O.
  sketch:
  - 'derive: OH = OA + OB + OC.'
  - 'derive: OG = (OA + OB + OC)/3.'
  - 'conclude: OH = 3 OG, so GH = 2 OG.'
  openmath: (forall (a b c) (-> (not (collinear_points a b c)) (and (= (- (orthocenter_of a b c) (circumcenter_of a b c)) (smul 3 (- (centroid_of a b c) (circumcenter_of a b c)))) (= (dist_of (centroid_of a b c) (orthocenter_of a b c)) (* 2 (dist_of (circumcenter_of a b c) (centroid_of a b c)))))))
  hard_negative:
    statement: 内心もオイラー線の上にある。
    reason: 内心は一般にオイラー線上にない。二等辺でない三角形では内心はオイラー線から外れ、例えば3辺$3,4,5$の直角三角形では$O=(2,\frac{3}{2})$、$H=(0,0)$、内心は$(1,1)$で共線でない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (t : Affine.Triangle ℝ P), t.orthocenter -ᵥ t.circumcenter = (3 : ℝ) • (t.centroid -ᵥ t.circumcenter) ∧ t.centroid = AffineMap.lineMap t.circumcenter t.orthocenter (1 / 3 : ℝ) ∧ dist t.centroid t.orthocenter = 2 * dist t.circumcenter t.centroid
  proof: |
    by
      intro V P _ _ _ _ t
      have h : t.orthocenter -ᵥ t.circumcenter = (3 : ℝ) • (t.centroid -ᵥ t.circumcenter) := by
        conv_lhs => rw [t.orthocenter_eq_smul_vsub_vadd_circumcenter, vadd_vsub]
      have hG : t.centroid = AffineMap.lineMap t.circumcenter t.orthocenter (1 / 3 : ℝ) := by
        rw [AffineMap.lineMap_apply, h, smul_smul]
        norm_num
      refine ⟨h, hG, ?_⟩
      rw [hG, dist_lineMap_right, dist_left_lineMap]
      norm_num
      ring
- id: euler_distance_circumcenter_orthocenter
  kind: gap
  level: high
  topic: 三角形の五心・外心と垂心の距離
  statement: 三角形$ABC$の外心を$O$、垂心を$H$、外接円の半径を$R$とすると、$OH^2=9R^2-(AB^2+BC^2+CA^2)$である。
  statement_en: For a triangle ABC with circumcenter O, orthocenter H and circumradius R, OH² = 9R² - (AB² + BC² + CA²).
  assumptions:
  - $A,B,C$は同一直線上にない3点
  - $O$は外心、$H$は垂心、$R$は外接円の半径
  quantifiers: *id001
  conclusion: $OH^2=9R^2-(AB^2+BC^2+CA^2)$である。
  answer: |
    $A,B,C$を同一直線上にない3点、$O$を外心、$H$を垂心、$R$を外接円の半径とする。外心$O$を始点とするベクトルを$\vec a=\overrightarrow{OA}$、$\vec b=\overrightarrow{OB}$、$\vec c=\overrightarrow{OC}$とおくと$|\vec a|=|\vec b|=|\vec c|=R$である。$\overrightarrow{OH'}=\vec a+\vec b+\vec c$で平面$ABC$上の点$H'$を定めると、$\overrightarrow{AH'}\cdot\overrightarrow{BC}=(\vec b+\vec c)\cdot(\vec c-\vec b)=|\vec c|^2-|\vec b|^2=0$となり、同様に$\overrightarrow{BH'}\perp\overrightarrow{CA}$である。$H'$は2本の垂線の交点だから垂心$H$と一致し、$\overrightarrow{OH}=\vec a+\vec b+\vec c$である。$AB^2=|\vec a-\vec b|^2=2R^2-2\vec a\cdot\vec b$であり、$BC^2$、$CA^2$も同様である。また$OH^2=|\vec a+\vec b+\vec c|^2=3R^2+2(\vec a\cdot\vec b+\vec b\cdot\vec c+\vec c\cdot\vec a)$である。辺の式を加えると$2(\vec a\cdot\vec b+\vec b\cdot\vec c+\vec c\cdot\vec a)=6R^2-(AB^2+BC^2+CA^2)$となる。代入すれば$OH^2=9R^2-(AB^2+BC^2+CA^2)$を得る。
  strategy: Expand |a + b + c|² and eliminate the inner products with the side lengths.
  sketch:
  - 'derive: OH = a + b + c with |a| = |b| = |c| = R.'
  - 'derive: AB² = 2R² - 2 a·b, and cyclically.'
  - 'derive: OH² = 3R² + 2(a·b + b·c + c·a).'
  - 'conclude: Eliminating the inner products gives the identity.'
  openmath: (forall (a b c) (-> (not (collinear_points a b c)) (= (^ (dist_of (circumcenter_of a b c) (orthocenter_of a b c)) 2) (- (* 9 (^ (circumradius_of a b c) 2)) (+ (+ (^ (dist_of a b) 2) (^ (dist_of b c) 2)) (^ (dist_of c a) 2))))))
  hard_negative:
    statement: $OH^2=R^2-(AB^2+BC^2+CA^2)$である。
    reason: 係数は$9$である。正三角形では$O=H$、辺の長さ$s$で$R^2=\frac{s^2}{3}$なので、$9R^2-3s^2=0$は成り立つが、$R^2-3s^2<0$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (t : Affine.Triangle ℝ P) (i j k : Fin 3), i ≠ j → i ≠ k → j ≠ k → dist t.circumcenter t.orthocenter ^ 2 = 9 * t.circumradius ^ 2 - (dist (t.points i) (t.points j) ^ 2 + dist (t.points j) (t.points k) ^ 2 + dist (t.points k) (t.points i) ^ 2)
  proof: |
    by
      intro V P _ _ _ _ t i j k hij hik hjk
      have hu : (Finset.univ : Finset (Fin 3)) = {i, j, k} := by decide +revert
      have hH : t.orthocenter -ᵥ t.circumcenter = (t.points i -ᵥ t.circumcenter) + (t.points j -ᵥ t.circumcenter) + (t.points k -ᵥ t.circumcenter) := by
        rw [t.orthocenter_vsub_circumcenter_eq_sum_vsub, hu, Finset.sum_insert (by simp [hij, hik]), Finset.sum_insert (by simp [hjk]), Finset.sum_singleton, add_assoc]
      have hn : ∀ l, ‖t.points l -ᵥ t.circumcenter‖ = t.circumradius := by
        intro l; rw [← dist_eq_norm_vsub]; exact t.dist_circumcenter_eq_circumradius l
      have d : ∀ l m, dist (t.points l) (t.points m) ^ 2 = 2 * t.circumradius ^ 2 - 2 * inner ℝ (t.points l -ᵥ t.circumcenter) (t.points m -ᵥ t.circumcenter) := by
        intro l m
        rw [dist_eq_norm_vsub V (t.points l) (t.points m), ← vsub_sub_vsub_cancel_right (t.points l) (t.points m) t.circumcenter, norm_sub_sq_real, hn, hn]
        ring
      rw [d, d, d, dist_comm, dist_eq_norm_vsub V t.orthocenter, hH, norm_add_sq_real, norm_add_sq_real, hn, hn, hn, inner_add_left, real_inner_comm (t.points k -ᵥ t.circumcenter) (t.points i -ᵥ t.circumcenter)]
      ring
- id: nine_point_circle
  kind: named
  level: high
  topic: 三角形の五心・九点円
  statement: '九点円: 三角形$ABC$の外心を$O$、垂心を$H$、外接円の半径を$R$とする。$OH$の中点を中心とする半径$\frac{R}{2}$の円は、各辺の中点、各頂点から対辺への垂線の足、$H$と各頂点を結ぶ線分の中点を通る。'
  statement_en: 'Nine-point circle: for a triangle with circumcenter O, orthocenter H and circumradius R, the circle centred at the midpoint of OH with radius R/2 passes through the midpoint of each side, the foot of each altitude, and the midpoint of the segment from H to each vertex.'
  assumptions:
  - $A,B,C$は同一直線上にない3点
  - $O,H,R$は外心、垂心、外接円の半径
  quantifiers: *id001
  conclusion: 9点はすべて、$OH$の中点を中心とする半径$\frac{R}{2}$の円の上にある。
  answer: |
    $A,B,C$を同一直線上にない3点、$O$を外心、$R$を外接円の半径、$H$を垂心とする。外心$O$を始点とするベクトルを$\vec a=\overrightarrow{OA}$、$\vec b=\overrightarrow{OB}$、$\vec c=\overrightarrow{OC}$とおくと$|\vec a|=|\vec b|=|\vec c|=R$である。$\overrightarrow{OH'}=\vec a+\vec b+\vec c$で平面$ABC$上の点$H'$を定めると、$\overrightarrow{AH'}\cdot\overrightarrow{BC}=(\vec b+\vec c)\cdot(\vec c-\vec b)=|\vec c|^2-|\vec b|^2=0$となり、同様に$\overrightarrow{BH'}\perp\overrightarrow{CA}$である。$H'$は2本の垂線の交点だから垂心$H$と一致し、$\overrightarrow{OH}=\vec a+\vec b+\vec c$である。$OH$の中点$N$は$\overrightarrow{ON}=\frac{1}{2}(\vec a+\vec b+\vec c)$を満たす。辺$BC$の中点$M$について$\overrightarrow{NM}=-\frac{1}{2}\vec a$なので$NM=\frac{R}{2}$である。線分$AH$の中点$K$について$\overrightarrow{OK}=\vec a+\frac{1}{2}(\vec b+\vec c)$なので$\overrightarrow{NK}=\frac{1}{2}\vec a$であり、$NK=\frac{R}{2}$である。したがって$M$と$K$は$N$に関して対称で、$MK$はこの円の直径である。$A$から$BC$に下ろした垂線の足を$D$とする。$K$は直線$AD$上にあるので$\overrightarrow{DK}\perp\overrightarrow{BC}$であり、$M,D$は直線$BC$上にあるので$\overrightarrow{DM}$は$\overrightarrow{BC}$の実数倍である。よって$\overrightarrow{DK}\cdot\overrightarrow{DM}=0$となり、$D$は$MK$を直径とする円の上にある。頂点の役割を入れ替えれば残りの点についても同じである。
  strategy: Compute the side midpoint and the vertex-orthocenter midpoint from O; the feet follow from the right angle on the diameter.
  sketch:
  - 'derive: ON = (OA + OB + OC)/2.'
  - 'derive: NM = -OA/2 and NK = OA/2, so M and K lie on the circle and are antipodal.'
  - 'derive: DK ⟂ BC and DM is parallel to BC, so DK·DM = 0.'
  - 'apply_theorem: Thales'' theorem puts D on the circle with diameter MK.'
  - 'conclude: Permute the vertices for all nine points.'
  openmath: (forall (a b c) (-> (not (collinear_points a b c)) (and (on_circle (midpoint_of b c) (midpoint_of (circumcenter_of a b c) (orthocenter_of a b c)) (/ (circumradius_of a b c) 2)) (on_circle (altitude_foot a b c) (midpoint_of (circumcenter_of a b c) (orthocenter_of a b c)) (/ (circumradius_of a b c) 2)) (on_circle (midpoint_of (orthocenter_of a b c) a) (midpoint_of (circumcenter_of a b c) (orthocenter_of a b c)) (/ (circumradius_of a b c) 2)))))
  hard_negative:
    statement: 九点円の半径は外接円の半径に等しい。
    reason: 九点円の半径は$\frac{R}{2}$である。辺の中点$M$と$AH$の中点$K$の距離が直径で、その値は$|\vec a|=R$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (t : Affine.Triangle ℝ P) (i j k : Fin 3), i ≠ j → i ≠ k → j ≠ k → dist (midpoint ℝ (t.points j) (t.points k)) (midpoint ℝ t.circumcenter t.orthocenter) = t.circumradius / 2 ∧ dist (t.altitudeFoot i) (midpoint ℝ t.circumcenter t.orthocenter) = t.circumradius / 2 ∧ dist (midpoint ℝ t.orthocenter (t.points i)) (midpoint ℝ t.circumcenter t.orthocenter) = t.circumradius / 2
  proof: |
    by
      intro V P _ _ _ _ t i j k hij hik hjk
      have hu : (Finset.univ : Finset (Fin 3)) = {i, j, k} := by decide +revert
      have hc : t.ninePointCircle.center = midpoint ℝ t.circumcenter t.orthocenter := by
        apply vsub_left_injective t.circumcenter |>.eq_iff.mp
        rw [t.ninePointCircle_center, vadd_vsub, midpoint_vsub]
        have : t.orthocenter -ᵥ t.circumcenter = (3 : ℝ) • (t.centroid -ᵥ t.circumcenter) := by
          conv_lhs => rw [t.orthocenter_eq_smul_vsub_vadd_circumcenter, vadd_vsub]
        rw [this, vsub_self, smul_zero, zero_add, smul_smul]
        norm_num
      have hr : t.ninePointCircle.radius = t.circumradius / 2 := by
        rw [t.ninePointCircle_radius]
        norm_num
      have key : ∀ x : P, x ∈ t.ninePointCircle → dist x (midpoint ℝ t.circumcenter t.orthocenter) = t.circumradius / 2 := by
        intro x hx
        rw [← hc, ← hr]
        exact EuclideanGeometry.mem_sphere.mp hx
      refine ⟨key _ ?_, key _ (t.altitudeFoot_mem_ninePointCircle i), key _ ?_⟩
      · have hF := t.faceOppositeCentroid_mem_ninePointCircle i
        have hF2 : t.faceOppositeCentroid i = midpoint ℝ (t.points j) (t.points k) := by
          have h := t.faceOppositeCentroid_eq_sum_vsub_vadd i
          rw [hu, Finset.sum_insert (by simp [hij, hik]), Finset.sum_insert (by simp [hjk]), Finset.sum_singleton, vsub_self, zero_add] at h
          rw [h]
          apply vsub_left_injective (t.points i) |>.eq_iff.mp
          rw [vadd_vsub, midpoint_vsub]
          simp only [invOf_eq_inv]
          norm_num
        rwa [hF2] at hF
      · rw [← Affine.Triangle.eulerPoint_eq_midpoint]
        exact t.eulerPoint_mem_ninePointCircle i
- id: nine_point_center_and_radius
  kind: gap
  level: high
  topic: 三角形の五心・九点円の中心と半径
  statement: 三角形$ABC$の平面上に中心をもち、3辺の中点を通る円は、中心が外心$O$と垂心$H$を結ぶ線分の中点で、半径が外接円の半径$R$の$\frac{1}{2}$である（九点円の中心と半径）。
  statement_en: Let S be a sphere (circle in the plane) whose centre lies in the plane of triangle ABC and which passes through the midpoints of the three sides. Then its centre is the midpoint of the circumcenter O and the orthocenter H, and its radius is R/2 where R is the circumradius.
  assumptions:
  - $A,B,C$は同一直線上にない3点
  - 円（球面）$S$の中心は平面$ABC$上にある
  - $S$は3辺$BC,CA,AB$の中点を通る
  - $O,H,R$は外心、垂心、外接円の半径
  quantifiers:
  - 任意の三角形$ABC$と、3辺の中点を通り中心が平面$ABC$上にある円$S$
  conclusion: $S$の中心は$OH$の中点で、半径は$\frac{R}{2}$である。
  answer: |
    $A,B,C$を同一直線上にない3点、$O$を外心、$R$を外接円の半径、$H$を垂心とする。外心$O$を始点とするベクトルを$\vec a=\overrightarrow{OA}$、$\vec b=\overrightarrow{OB}$、$\vec c=\overrightarrow{OC}$とおくと$|\vec a|=|\vec b|=|\vec c|=R$である。$\overrightarrow{OH'}=\vec a+\vec b+\vec c$で平面$ABC$上の点$H'$を定めると、$\overrightarrow{AH'}\cdot\overrightarrow{BC}=(\vec b+\vec c)\cdot(\vec c-\vec b)=|\vec c|^2-|\vec b|^2=0$となり、同様に$\overrightarrow{BH'}\perp\overrightarrow{CA}$である。$H'$は2本の垂線の交点だから垂心$H$と一致し、$\overrightarrow{OH}=\vec a+\vec b+\vec c$である。$OH$の中点$N$は$\overrightarrow{ON}=\frac{1}{2}(\vec a+\vec b+\vec c)$を満たす。辺$BC$の中点$M$について$\overrightarrow{NM}=\frac{1}{2}(\vec b+\vec c)-\overrightarrow{ON}=-\frac{1}{2}\vec a$なので$NM=\frac{R}{2}$であり、他の2辺の中点でも同じである。$N$は平面$ABC$上にある。3辺の中点は同一直線上になく、同じ平面上でこの3点から等距離にある点はただ1つなので、3点を通る円の中心は$N$で、半径は$\frac{R}{2}$である。
  strategy: Check that the midpoint of OH is at distance R/2 from each side midpoint, then use uniqueness of the circle.
  sketch:
  - 'derive: ON = (OA + OB + OC)/2.'
  - 'derive: The side midpoint opposite A satisfies NM = -OA/2, so NM = R/2.'
  - 'derive: The same holds for the other side midpoints.'
  - 'conclude: N is in the plane of the triangle and is the unique centre of the circle through the three midpoints.'
  openmath: (forall (a b c o r) (-> (and (not (collinear_points a b c)) (on_plane o a b c) (on_circle (midpoint_of b c) o r) (on_circle (midpoint_of c a) o r) (on_circle (midpoint_of a b) o r)) (and (= o (midpoint_of (circumcenter_of a b c) (orthocenter_of a b c))) (= r (/ (circumradius_of a b c) 2)))))
  hard_negative:
    statement: 九点円の中心は重心である。
    reason: 中心は$OH$の中点で、$\overrightarrow{OG}=\frac{1}{3}\overrightarrow{OH}$なので、$O\neq H$なら重心とは異なる。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (t : Affine.Triangle ℝ P) (S : EuclideanGeometry.Sphere P), S.center ∈ affineSpan ℝ (Set.range t.points) → (∀ j k : Fin 3, j ≠ k → midpoint ℝ (t.points j) (t.points k) ∈ S) → S.center = midpoint ℝ t.circumcenter t.orthocenter ∧ S.radius = t.circumradius / 2
  proof: |
    by
      intro V P _ _ _ _ t S hc hm
      have hmid : ∀ i j k : Fin 3, i ≠ j → i ≠ k → j ≠ k → t.faceOppositeCentroid i = midpoint ℝ (t.points j) (t.points k) := by
        intro i j k hij hik hjk
        rw [Affine.Simplex.faceOppositeCentroid_eq_affineCombination]
        have hs : ({i}ᶜ : Finset (Fin 3)) = {j, k} := by
          fin_cases i <;> fin_cases j <;> fin_cases k <;> simp_all <;> decide
        rw [hs, Finset.affineCombination_eq_weightedVSubOfPoint_vadd_of_sum_eq_one _ _ _ (by rw [Finset.sum_pair hjk]; norm_num) (t.points j), Finset.weightedVSubOfPoint_apply, Finset.sum_pair hjk]
        simp [midpoint, AffineMap.lineMap_apply]
      have hS : S = t.medial.circumsphere := by
        apply (t.medial.circumsphere_unique_dist_eq).2 S
        constructor
        · rw [Affine.Simplex.affineSpan_range_medial]; exact hc
        · rw [Set.range_subset_iff]
          intro i
          rw [Affine.Simplex.medial_points]
          have hi : i = 0 ∨ i = 1 ∨ i = 2 := by fin_cases i <;> simp
          rcases hi with rfl | rfl | rfl
          · rw [hmid 0 1 2 (by decide) (by decide) (by decide)]; exact hm 1 2 (by decide)
          · rw [hmid 1 0 2 (by decide) (by decide) (by decide)]; exact hm 0 2 (by decide)
          · rw [hmid 2 0 1 (by decide) (by decide) (by decide)]; exact hm 0 1 (by decide)
      have hN : S = t.ninePointCircle := by
        rw [hS, ← Affine.Simplex.ninePointCircle_eq_circumsphere_medial]
      rw [hN]
      constructor
      · rw [Affine.Simplex.ninePointCircle_center, Affine.Triangle.orthocenter_eq_smul_vsub_vadd_circumcenter]
        rw [midpoint, AffineMap.lineMap_apply]
        simp [Affine.Simplex.centroid]
        rw [smul_smul]
        congr 1
        norm_num
      · rw [Affine.Simplex.ninePointCircle_radius]; norm_num
- id: menelaus_theorem
  kind: named
  level: high
  topic: 共点と共線・メネラウスの定理
  statement: 'メネラウスの定理（符号付き）: 三角形$ABC$に対し、実数$r,s,t$で$D=(1-r)B+rC$、$E=(1-s)C+sA$、$F=(1-t)A+tB$と定める。$D,E,F$が同一直線上にあるなら$rst=-(1-r)(1-s)(1-t)$である。'
  statement_en: 'Menelaus'' theorem in signed form: for a triangle ABC and real r, s, t, if D = (1-r)B + rC, E = (1-s)C + sA and F = (1-t)A + tB are collinear, then rst = -(1-r)(1-s)(1-t).'
  assumptions:
  - $A,B,C$は同一直線上にない3点
  - $D,E,F$は上の式で定まる直線$BC,CA,AB$上の点
  - $D,E,F$は同一直線上にある
  quantifiers:
  - 実内積空間に付随する任意のアフィン空間内の任意の三角形$ABC$
  - 任意の実数$r,s,t$
  conclusion: $rst=-(1-r)(1-s)(1-t)$である。
  answer: |
    $A,B,C$を同一直線上にない3点、$r,s,t$を実数とし、$D=(1-r)B+rC$、$E=(1-s)C+sA$、$F=(1-t)A+tB$が同一直線上にあるとする。$\vec u=\overrightarrow{AB}$、$\vec w=\overrightarrow{AC}$とおくと、$A,B,C$が同一直線上にないので$\vec u,\vec w$は1次独立である。$\overrightarrow{AD}=(1-r)\vec u+r\vec w$、$\overrightarrow{AE}=(1-s)\vec w$、$\overrightarrow{AF}=t\vec u$である。よって$\overrightarrow{FD}=(1-r-t)\vec u+r\vec w$、$\overrightarrow{FE}=-t\vec u+(1-s)\vec w$である。3点が同一直線上にあるので、あるベクトル$\vec v$と実数$p,q$で$\overrightarrow{FD}=p\vec v$、$\overrightarrow{FE}=q\vec v$と書ける。すると$q\overrightarrow{FD}-p\overrightarrow{FE}=\vec 0$であり、1次独立性から$q(1-r-t)+pt=0$、$qr-p(1-s)=0$である。$p=q=0$なら$\overrightarrow{FD}=\overrightarrow{FE}=\vec 0$なので$t=0$かつ$1-r-t=0$かつ$r=0$となり矛盾する。$q\neq 0$または$p\neq 0$なので、この2式から$(1-r-t)(1-s)+rt=0$を得る。展開して整理すると$rst+(1-r)(1-s)(1-t)=0$である。
  strategy: Express the points in the basis AB, AC and turn collinearity into a vanishing determinant.
  sketch:
  - 'setup: Let u = AB and w = AC, which are linearly independent.'
  - 'derive: FD = (1-r-t)u + r w and FE = -t u + (1-s) w.'
  - 'translate: Collinearity gives FD = p v and FE = q v, hence two scalar equations.'
  - 'derive: Not both p and q vanish, so (1-r-t)(1-s) + rt = 0.'
  - 'conclude: Expanding gives rst + (1-r)(1-s)(1-t) = 0.'
  openmath: (forall (a b c r s t) (-> (and (not (collinear_points a b c)) (collinear_points (division_point b c r) (division_point c a s) (division_point a b t))) (= (* (* r s) t) (neg (* (* (- 1 r) (- 1 s)) (- 1 t))))))
  hard_negative:
    statement: $D,E,F$が同一直線上にあるなら$rst=(1-r)(1-s)(1-t)$である。
    reason: 符号が逆で、その式はチェバの定理の形である。$r=2$、$s=\frac{1}{2}$、$t=\frac{1}{3}$では$rst=-(1-r)(1-s)(1-t)$が成り立つので$D,E,F$は同一直線上にあるが、$rst=\frac{1}{3}$、$(1-r)(1-s)(1-t)=-\frac{1}{3}$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P) (r s t : ℝ), ¬Collinear ℝ ({A, B, C} : Set P) → Collinear ℝ ({AffineMap.lineMap B C r, AffineMap.lineMap C A s, AffineMap.lineMap A B t} : Set P) → r * s * t = -((1 - r) * (1 - s) * (1 - t))
  proof: |
    by
      intro V P _ _ _ _ A B C r s t hABC hcol
      have hli : ∀ a b : ℝ, a • (B -ᵥ A) + b • (C -ᵥ A) = (0 : V) → a = 0 ∧ b = 0 := by
        intro a b h
        by_contra hab
        apply hABC
        rcases not_and_or.mp hab with ha | hb
        · have hB : B -ᵥ A = (-b / a) • (C -ᵥ A) := by
            have h2 : a • (B -ᵥ A) = (-b) • (C -ᵥ A) := by
              rw [neg_smul]; exact eq_neg_of_add_eq_zero_left h
            rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ ha, one_smul]
          have h3 := AffineMap.lineMap_mem_affineSpan_pair (-b / a) A C
          rw [AffineMap.lineMap_apply, ← hB, vsub_vadd] at h3
          have h4 := collinear_insert_of_mem_affineSpan_pair h3
          rwa [Set.insert_comm] at h4
        · have hC : C -ᵥ A = (-a / b) • (B -ᵥ A) := by
            have h2 : b • (C -ᵥ A) = (-a) • (B -ᵥ A) := by
              rw [neg_smul]; exact eq_neg_of_add_eq_zero_right h
            rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ hb, one_smul]
          have h3 := AffineMap.lineMap_mem_affineSpan_pair (-a / b) A B
          rw [AffineMap.lineMap_apply, ← hC, vsub_vadd] at h3
          have h4 := collinear_insert_of_mem_affineSpan_pair h3
          rwa [Set.insert_comm, Set.pair_comm] at h4
      set D := AffineMap.lineMap B C r with hD
      set E := AffineMap.lineMap C A s with hE
      set F := AffineMap.lineMap A B t with hF
      set u : V := B -ᵥ A with hu
      set w : V := C -ᵥ A with hw
      have hCB : C -ᵥ B = w - u := (vsub_sub_vsub_cancel_right C B A).symm
      have hAC : A -ᵥ C = -w := (neg_vsub_eq_vsub_rev C A).symm
      have eD : D -ᵥ A = (1 - r) • u + r • w := by
        rw [hD, AffineMap.lineMap_apply, vadd_vsub_assoc, hCB, ← hu]; module
      have eE : E -ᵥ A = (1 - s) • w := by
        rw [hE, AffineMap.lineMap_apply, vadd_vsub_assoc, hAC, ← hw]; module
      have eF : F -ᵥ A = t • u := by
        rw [hF, AffineMap.lineMap_apply, vadd_vsub_assoc, vsub_self, add_zero]
      have eX : D -ᵥ F = (1 - r - t) • u + r • w := by
        rw [← vsub_sub_vsub_cancel_right D F A, eD, eF]; module
      have eY : E -ᵥ F = (-t) • u + (1 - s) • w := by
        rw [← vsub_sub_vsub_cancel_right E F A, eE, eF]; module
      obtain ⟨v, hv⟩ := (collinear_iff_of_mem (p₀ := F) (by simp)).mp hcol
      obtain ⟨a, ha⟩ := hv D (by simp)
      obtain ⟨b, hb⟩ := hv E (by simp)
      have ha' : D -ᵥ F = a • v := by rw [ha, vadd_vsub]
      have hb' : E -ᵥ F = b • v := by rw [hb, vadd_vsub]
      have h0 : (b * (1 - r - t) + a * t) • u + (b * r - a * (1 - s)) • w = (0 : V) := by
        have : b • (D -ᵥ F) - a • (E -ᵥ F) = (0 : V) := by rw [ha', hb', smul_smul, smul_smul, mul_comm, sub_self]
        rw [eX, eY] at this
        rw [← this]; module
      obtain ⟨H1, H2⟩ := hli _ _ h0
      have goal' : r * s * t + (1 - r) * (1 - s) * (1 - t) = 0 := by
        by_cases ha0 : a = 0
        · by_cases hb0 : b = 0
          · exfalso
            rw [ha0, zero_smul] at ha'
            rw [hb0, zero_smul] at hb'
            rw [eX] at ha'
            rw [eY] at hb'
            obtain ⟨h1, h2⟩ := hli _ _ ha'
            obtain ⟨h3, -⟩ := hli _ _ hb'
            linarith
          · apply mul_left_cancel₀ hb0
            linear_combination (1 - s) * H1 + t * H2
        · apply mul_left_cancel₀ ha0
          linear_combination r * H1 - (1 - r - t) * H2
      linear_combination goal'
- id: menelaus_converse
  kind: textbook
  level: high
  topic: 共点と共線・メネラウスの定理の逆
  statement: 'メネラウスの定理の逆（符号付き）: 3点$A,B,C$と実数$r,s,t$について$rst=-(1-r)(1-s)(1-t)$なら、$D=(1-r)B+rC$、$E=(1-s)C+sA$、$F=(1-t)A+tB$は同一直線上にある。'
  statement_en: 'Converse of Menelaus in signed form: for points A, B, C and real r, s, t with rst = -(1-r)(1-s)(1-t), the points D = (1-r)B + rC, E = (1-s)C + sA and F = (1-t)A + tB are collinear.'
  assumptions:
  - $A,B,C$は任意の3点
  - $rst=-(1-r)(1-s)(1-t)$
  quantifiers:
  - 実内積空間に付随する任意のアフィン空間内の任意の3点$A,B,C$
  - 任意の実数$r,s,t$
  conclusion: $D,E,F$は同一直線上にある。
  answer: |
    $A,B,C$を3点、$r,s,t$を$rst=-(1-r)(1-s)(1-t)$を満たす実数とし、$D,E,F$を上の式で定める。$\vec u=\overrightarrow{AB}$、$\vec w=\overrightarrow{AC}$とおくと$\overrightarrow{FD}=(1-r-t)\vec u+r\vec w$、$\overrightarrow{FE}=-t\vec u+(1-s)\vec w$である。仮定を展開して整理すると$(1-r-t)(1-s)+rt=0$である。$t\neq 0$なら$c=-\frac{1-r-t}{t}$とおくと$c(1-s)=r$なので$\overrightarrow{FD}=c\overrightarrow{FE}$である。$t=0$かつ$s=1$なら$\overrightarrow{FE}=\vec 0$なので$E=F$である。$t=0$かつ$s\neq 1$なら$1-r=0$となり、$\overrightarrow{FD}=\vec w$、$\overrightarrow{FE}=(1-s)\vec w$である。いずれの場合も$\overrightarrow{FD}$と$\overrightarrow{FE}$は1つのベクトルの実数倍なので、$D,E,F$は同一直線上にある。
  strategy: Rewrite the hypothesis as a vanishing determinant and exhibit the proportionality case by case.
  sketch:
  - 'setup: Compute FD and FE in terms of u = AB and w = AC.'
  - 'translate: The hypothesis is (1-r-t)(1-s) + rt = 0.'
  - 'case_split: Treat t ≠ 0, then t = 0 with s = 1, then t = 0 with s ≠ 1.'
  - 'derive: In each case FD and FE are multiples of one vector.'
  - 'conclude: D, E, F are collinear.'
  openmath: (forall (a b c r s t) (-> (= (* (* r s) t) (neg (* (* (- 1 r) (- 1 s)) (- 1 t)))) (collinear_points (division_point b c r) (division_point c a s) (division_point a b t))))
  hard_negative:
    statement: 符号なしの比で$\frac{BD}{DC}\cdot\frac{CE}{EA}\cdot\frac{AF}{FB}=1$なら$D,E,F$は同一直線上にある。
    reason: 長さの比では符号の情報が失われる。3辺の中点ではこの積が$1$だが、3点は同一直線上にない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P) (r s t : ℝ), r * s * t = -((1 - r) * (1 - s) * (1 - t)) → Collinear ℝ ({AffineMap.lineMap B C r, AffineMap.lineMap C A s, AffineMap.lineMap A B t} : Set P)
  proof: |
    by
      intro V P _ _ _ _ A B C r s t hδ
      set D := AffineMap.lineMap B C r with hD
      set E := AffineMap.lineMap C A s with hE
      set F := AffineMap.lineMap A B t with hF
      set u : V := B -ᵥ A with hu
      set w : V := C -ᵥ A with hw
      have hCB : C -ᵥ B = w - u := (vsub_sub_vsub_cancel_right C B A).symm
      have hAC : A -ᵥ C = -w := (neg_vsub_eq_vsub_rev C A).symm
      have eD : D -ᵥ A = (1 - r) • u + r • w := by
        rw [hD, AffineMap.lineMap_apply, vadd_vsub_assoc, hCB, ← hu]; module
      have eE : E -ᵥ A = (1 - s) • w := by
        rw [hE, AffineMap.lineMap_apply, vadd_vsub_assoc, hAC, ← hw]; module
      have eF : F -ᵥ A = t • u := by
        rw [hF, AffineMap.lineMap_apply, vadd_vsub_assoc, vsub_self, add_zero]
      have eX : D -ᵥ F = (1 - r - t) • u + r • w := by
        rw [← vsub_sub_vsub_cancel_right D F A, eD, eF]; module
      have eY : E -ᵥ F = (-t) • u + (1 - s) • w := by
        rw [← vsub_sub_vsub_cancel_right E F A, eE, eF]; module
      have hδ' : (1 - r - t) * (1 - s) + t * r = 0 := by linear_combination hδ
      have hcase : ∃ c : ℝ, (D -ᵥ F = c • (E -ᵥ F)) ∨ (E = F) := by
        by_cases ht : t = 0
        · by_cases hs : 1 - s = 0
          · refine ⟨0, Or.inr ?_⟩
            exact eq_of_vsub_eq_zero (by rw [eY, ht, hs]; simp)
          · have hr : 1 - r - t = 0 := by
              have : (1 - r - t) * (1 - s) = 0 := by rw [ht] at hδ' ⊢; linarith
              exact (mul_eq_zero.mp this).resolve_right hs
            refine ⟨r / (1 - s), Or.inl ?_⟩
            rw [eX, eY, hr, ht, smul_add, smul_smul, smul_smul, div_mul_cancel₀ _ hs]
            simp
        · refine ⟨-(1 - r - t) / t, Or.inl ?_⟩
          have hc : -(1 - r - t) / t * (1 - s) = r := by
            field_simp
            linear_combination -hδ'
          rw [eX, eY, smul_add, smul_smul, smul_smul, hc]
          congr 1
          congr 1
          field_simp
      rw [collinear_iff_of_mem (p₀ := F) (by simp)]
      obtain ⟨c, hc | hc⟩ := hcase
      · refine ⟨E -ᵥ F, ?_⟩
        intro p hp
        simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hp
        rcases hp with rfl | rfl | rfl
        · exact ⟨c, by rw [← hc, vsub_vadd]⟩
        · exact ⟨1, by rw [one_smul, vsub_vadd]⟩
        · exact ⟨0, by simp⟩
      · refine ⟨D -ᵥ F, ?_⟩
        intro p hp
        simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hp
        rcases hp with rfl | rfl | rfl
        · exact ⟨1, by rw [one_smul, vsub_vadd]⟩
        · exact ⟨0, by simpa using hc⟩
        · exact ⟨0, by simp⟩
- id: menelaus_unsigned_ratio_form
  kind: gap
  level: high
  topic: 共点と共線・メネラウスの定理の比の形
  statement: 三角形$ABC$の直線$BC,CA,AB$上の点$D,E,F$が同一直線上にあり、$D\neq C$、$E\neq A$、$F\neq B$なら、長さの比について$\frac{BD}{DC}\cdot\frac{CE}{EA}\cdot\frac{AF}{FB}=1$である。
  statement_en: If points D, E, F on lines BC, CA, AB of a triangle ABC are collinear with D ≠ C, E ≠ A, F ≠ B, then (BD/DC)(CE/EA)(AF/FB) = 1 for lengths.
  assumptions:
  - $A,B,C$は同一直線上にない3点
  - $D,E,F$は直線$BC,CA,AB$上の点
  - $D\neq C$、$E\neq A$、$F\neq B$
  - $D,E,F$は同一直線上にある
  quantifiers:
  - 実内積空間に付随する任意のアフィン空間内の任意の三角形$ABC$
  - 任意の点$D,E,F$
  conclusion: $\frac{BD}{DC}\cdot\frac{CE}{EA}\cdot\frac{AF}{FB}=1$である。
  answer: |
    $A,B,C$を同一直線上にない3点、$D,E,F$を直線$BC,CA,AB$上の同一直線上にある点とし、$D\neq C$、$E\neq A$、$F\neq B$とする。$D=(1-r)B+rC$、$E=(1-s)C+sA$、$F=(1-t)A+tB$となる実数$r,s,t$をとると、$r\neq 1$、$s\neq 1$、$t\neq 1$である。$BD=|r|BC$、$DC=|1-r|BC$であり、$BC>0$なので$\frac{BD}{DC}=\frac{|r|}{|1-r|}$である。他の2つも同様である。符号付きのメネラウスの定理「$D,E,F$が同一直線上にあれば$rst=-(1-r)(1-s)(1-t)$」の両辺の絶対値をとると$|r||s||t|=|1-r||1-s||1-t|$となる。両辺を$|1-r||1-s||1-t|\neq 0$で割れば結論を得る。
  strategy: Convert the signed Menelaus identity to lengths by taking absolute values.
  sketch:
  - 'setup: Parametrise D, E, F by r, s, t, none equal to 1.'
  - 'derive: BD/DC = |r|/|1-r|, and likewise for the other two ratios.'
  - 'apply_theorem: Signed Menelaus gives rst = -(1-r)(1-s)(1-t).'
  - 'conclude: Taking absolute values and dividing gives the product 1.'
  openmath: (forall (a b c x y z) (-> (and (not (collinear_points a b c)) (on_line x b c) (on_line y c a) (on_line z a b) (!= x c) (!= y a) (!= z b) (collinear_points x y z)) (= (* (* (/ (dist_of b x) (dist_of x c)) (/ (dist_of c y) (dist_of y a))) (/ (dist_of a z) (dist_of z b))) 1)))
  hard_negative:
    statement: $D,E,F$が同一直線上になくても、3点が各辺上にあれば長さの比の積は$1$である。
    reason: 辺$BC$の中点、辺$CA$の中点と、$AB$を$1:2$に内分する点では積は$\frac{1}{2}$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D E F : P), ¬Collinear ℝ ({A, B, C} : Set P) → D ∈ line[ℝ, B, C] → E ∈ line[ℝ, C, A] → F ∈ line[ℝ, A, B] → D ≠ C → E ≠ A → F ≠ B → Collinear ℝ ({D, E, F} : Set P) → dist B D / dist D C * (dist C E / dist E A) * (dist A F / dist F B) = 1
  proof: |
    by
      intro V P _ _ _ _ A B C D E F hABC hD hE hF hDC hEA hFB hcol
      obtain ⟨r, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hD
      obtain ⟨s, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hE
      obtain ⟨t, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hF
      have hli : ∀ a b : ℝ, a • (B -ᵥ A) + b • (C -ᵥ A) = (0 : V) → a = 0 ∧ b = 0 := by
        intro a b h
        by_contra hab
        apply hABC
        rcases not_and_or.mp hab with ha | hb
        · have hB : B -ᵥ A = (-b / a) • (C -ᵥ A) := by
            have h2 : a • (B -ᵥ A) = (-b) • (C -ᵥ A) := by
              rw [neg_smul]; exact eq_neg_of_add_eq_zero_left h
            rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ ha, one_smul]
          have h3 := AffineMap.lineMap_mem_affineSpan_pair (-b / a) A C
          rw [AffineMap.lineMap_apply, ← hB, vsub_vadd] at h3
          have h4 := collinear_insert_of_mem_affineSpan_pair h3
          rwa [Set.insert_comm] at h4
        · have hC : C -ᵥ A = (-a / b) • (B -ᵥ A) := by
            have h2 : b • (C -ᵥ A) = (-a) • (B -ᵥ A) := by
              rw [neg_smul]; exact eq_neg_of_add_eq_zero_right h
            rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ hb, one_smul]
          have h3 := AffineMap.lineMap_mem_affineSpan_pair (-a / b) A B
          rw [AffineMap.lineMap_apply, ← hC, vsub_vadd] at h3
          have h4 := collinear_insert_of_mem_affineSpan_pair h3
          rwa [Set.insert_comm, Set.pair_comm] at h4
      have men : r * s * t = -((1 - r) * (1 - s) * (1 - t)) := by
        set D := AffineMap.lineMap B C r with hD
        set E := AffineMap.lineMap C A s with hE
        set F := AffineMap.lineMap A B t with hF
        set u : V := B -ᵥ A with hu
        set w : V := C -ᵥ A with hw
        have hCB : C -ᵥ B = w - u := (vsub_sub_vsub_cancel_right C B A).symm
        have hAC : A -ᵥ C = -w := (neg_vsub_eq_vsub_rev C A).symm
        have eD : D -ᵥ A = (1 - r) • u + r • w := by
          rw [hD, AffineMap.lineMap_apply, vadd_vsub_assoc, hCB, ← hu]; module
        have eE : E -ᵥ A = (1 - s) • w := by
          rw [hE, AffineMap.lineMap_apply, vadd_vsub_assoc, hAC, ← hw]; module
        have eF : F -ᵥ A = t • u := by
          rw [hF, AffineMap.lineMap_apply, vadd_vsub_assoc, vsub_self, add_zero]
        have eX : D -ᵥ F = (1 - r - t) • u + r • w := by
          rw [← vsub_sub_vsub_cancel_right D F A, eD, eF]; module
        have eY : E -ᵥ F = (-t) • u + (1 - s) • w := by
          rw [← vsub_sub_vsub_cancel_right E F A, eE, eF]; module
        obtain ⟨v, hv⟩ := (collinear_iff_of_mem (p₀ := F) (by simp)).mp hcol
        obtain ⟨a, ha⟩ := hv D (by simp)
        obtain ⟨b, hb⟩ := hv E (by simp)
        have ha' : D -ᵥ F = a • v := by rw [ha, vadd_vsub]
        have hb' : E -ᵥ F = b • v := by rw [hb, vadd_vsub]
        have h0 : (b * (1 - r - t) + a * t) • u + (b * r - a * (1 - s)) • w = (0 : V) := by
          have : b • (D -ᵥ F) - a • (E -ᵥ F) = (0 : V) := by rw [ha', hb', smul_smul, smul_smul, mul_comm, sub_self]
          rw [eX, eY] at this
          rw [← this]; module
        obtain ⟨H1, H2⟩ := hli _ _ h0
        have goal' : r * s * t + (1 - r) * (1 - s) * (1 - t) = 0 := by
          by_cases ha0 : a = 0
          · by_cases hb0 : b = 0
            · exfalso
              rw [ha0, zero_smul] at ha'
              rw [hb0, zero_smul] at hb'
              rw [eX] at ha'
              rw [eY] at hb'
              obtain ⟨h1, h2⟩ := hli _ _ ha'
              obtain ⟨h3, -⟩ := hli _ _ hb'
              linarith
            · apply mul_left_cancel₀ hb0
              linear_combination (1 - s) * H1 + t * H2
          · apply mul_left_cancel₀ ha0
            linear_combination r * H1 - (1 - r - t) * H2
        linear_combination goal'
      have hBC : dist B C ≠ 0 := by
        intro h; rw [dist_eq_zero] at h; subst h; apply hABC; simpa using collinear_pair ℝ A B
      have hCA : dist C A ≠ 0 := by
        intro h; rw [dist_eq_zero] at h; subst h; apply hABC
        rw [Set.insert_comm]; simpa using collinear_pair ℝ B C
      have hAB : dist A B ≠ 0 := by
        intro h; rw [dist_eq_zero] at h; subst h; apply hABC; simpa using collinear_pair ℝ A C
      have hr1 : 1 - r ≠ 0 := by
        intro h
        apply hDC
        have : r = 1 := by linarith
        simp [this]
      have hs1 : 1 - s ≠ 0 := by
        intro h
        apply hEA
        have : s = 1 := by linarith
        simp [this]
      have ht1 : 1 - t ≠ 0 := by
        intro h
        apply hFB
        have : t = 1 := by linarith
        simp [this]
      rw [dist_left_lineMap, dist_lineMap_right, dist_left_lineMap, dist_lineMap_right, dist_left_lineMap, dist_lineMap_right]
      simp only [Real.norm_eq_abs]
      have hab : |r| * |s| * |t| = |1 - r| * |1 - s| * |1 - t| := by
        rw [← abs_mul, ← abs_mul, ← abs_mul, ← abs_mul, men, abs_neg]
      have h1 : |1 - r| ≠ 0 := abs_ne_zero.mpr hr1
      have h2 : |1 - s| ≠ 0 := abs_ne_zero.mpr hs1
      have h3 : |1 - t| ≠ 0 := abs_ne_zero.mpr ht1
      field_simp
      linarith
- id: ceva_theorem
  kind: named
  level: high
  topic: 共点と共線・チェバの定理
  statement: 'チェバの定理（符号付き）: 三角形$ABC$に対し、$0$でない実数$r,s,t$で$D=(1-r)B+rC$、$E=(1-s)C+sA$、$F=(1-t)A+tB$と定める。点$p$が直線$AD,BE,CF$のすべての上にあるなら$\frac{r}{1-r}\cdot\frac{s}{1-s}\cdot\frac{t}{1-t}=1$であり、このとき分母は$0$でない。'
  statement_en: 'Ceva''s theorem in signed form: for a triangle ABC, nonzero r, s, t and D = (1-r)B + rC, E = (1-s)C + sA, F = (1-t)A + tB, if p lies on lines AD, BE and CF, then (r/(1-r))(s/(1-s))(t/(1-t)) = 1.'
  assumptions:
  - $A,B,C$は同一直線上にない3点
  - $r,s,t$は$0$でない実数
  - $D,E,F$は上の式で定まる点
  - $p$は直線$AD,BE,CF$の上にある
  quantifiers:
  - 実内積空間に付随する任意のアフィン空間内の任意の三角形$ABC$
  - 任意の実数$r,s,t$と点$p$
  conclusion: $\frac{r}{1-r}\cdot\frac{s}{1-s}\cdot\frac{t}{1-t}=1$である。
  answer: |
    $A,B,C$を同一直線上にない3点、$r,s,t$を$0$でない実数、$D,E,F$を上の式で定まる点、$p$を3直線の共有点とする。$p=\lambda A+\alpha B+\gamma C$（$\lambda+\alpha+\gamma=1$）と表すと、この係数は$p$から一意に定まる。$p$が直線$AD$上にあることから$\alpha r=\gamma(1-r)$、直線$BE$上にあることから$\lambda(1-s)=\gamma s$、直線$CF$上にあることから$\lambda t=\alpha(1-t)$を得る。$\alpha=0$とすると第3式から$\lambda=0$なので$\gamma=1$であり、第2式から$s=0$となって矛盾する。$\gamma=0$とすると第1式から$\alpha=0$なので$\lambda=1$であり、第3式から$t=0$となって矛盾する。$\lambda=0$とすると第2式から$\gamma=0$なので$\alpha=1$であり、第1式から$r=0$となって矛盾する。よって$\lambda,\alpha,\gamma$はどれも$0$でない。第1式で$r=1$なら$\gamma\cdot 0=\alpha$となり矛盾するので$r\neq 1$であり、同様に$s\neq 1$、$t\neq 1$である。3式を掛けて$\lambda\alpha\gamma$で割ると$rst=(1-r)(1-s)(1-t)$となり、結論を得る。
  strategy: Use barycentric coordinates of p, turn each incidence into an equation, and multiply.
  sketch:
  - 'setup: Write p = λA + αB + γC with λ + α + γ = 1.'
  - 'translate: The three incidences give αr = γ(1-r), λ(1-s) = γs, λt = α(1-t).'
  - 'contradiction: If any of λ, α, γ vanishes, then one of r, s, t vanishes.'
  - 'derive: Hence none of r, s, t equals 1.'
  - 'conclude: Multiplying and cancelling λαγ gives the product 1.'
  openmath: (forall (a b c p r s t) (-> (and (not (collinear_points a b c)) (!= r 0) (!= s 0) (!= t 0) (on_line p a (division_point b c r)) (on_line p b (division_point c a s)) (on_line p c (division_point a b t))) (= (* (* (/ r (- 1 r)) (/ s (- 1 s))) (/ t (- 1 t))) 1)))
  hard_negative:
    statement: チェバの定理の積は$\frac{r}{1-r}\cdot\frac{s}{1-s}\cdot\frac{t}{1-t}=-1$である（メネラウスの定理の符号）。
    reason: $r=s=t=\frac{1}{2}$（$D,E,F$が各辺の中点）では3直線$AD,BE,CF$は重心で交わり、各因子は$1$なので積は$1$であって$-1$ではない。$-1$になるのは$D,E,F$が同一直線上にあるときである。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C p : P) (r s t : ℝ), ¬Collinear ℝ ({A, B, C} : Set P) → r ≠ 0 → s ≠ 0 → t ≠ 0 → p ∈ line[ℝ, A, AffineMap.lineMap B C r] → p ∈ line[ℝ, B, AffineMap.lineMap C A s] → p ∈ line[ℝ, C, AffineMap.lineMap A B t] → r / (1 - r) * (s / (1 - s)) * (t / (1 - t)) = 1
  proof: |
    by
      intro V P _ _ _ _ A B C p r s t hABC hr hs ht h1 h2 h3
      let T : Affine.Triangle ℝ P := ⟨![A, B, C], affineIndependent_iff_not_collinear_set.mpr hABC⟩
      let R : Fin 3 → ℝ := ![r, s, t]
      have hR : ∀ i, R i ≠ 0 := by
        intro i; fin_cases i
        exacts [hr, hs, ht]
      have hp : ∀ i : Fin 3, p ∈ line[ℝ, T.points i, AffineMap.lineMap (T.points (i + 1)) (T.points (i + 2)) (R i)] := by
        intro i; fin_cases i
        exacts [h1, h2, h3]
      have := Affine.Triangle.prod_div_one_sub_eq_one_of_mem_line_point_lineMap hR hp
      rw [Fin.prod_univ_three] at this
      exact this
- id: ceva_converse
  kind: textbook
  level: high
  topic: 共点と共線・チェバの定理の逆
  statement: 'チェバの定理の逆（符号付き）: 三角形$ABC$と実数$r,s,t$で$\frac{r}{1-r}\cdot\frac{s}{1-s}\cdot\frac{t}{1-t}=1$（分母は$0$でないものとする）とし、$D=(1-r)B+rC$、$E=(1-s)C+sA$、$F=(1-t)A+tB$と定める。点$p$が直線$AD$と直線$BE$の上にあれば、$p$は直線$CF$の上にもある。'
  statement_en: 'Converse of Ceva in signed form: for a triangle ABC and real r, s, t with (r/(1-r))(s/(1-s))(t/(1-t)) = 1, if p lies on lines AD and BE, then p lies on line CF, where D = (1-r)B + rC, E = (1-s)C + sA, F = (1-t)A + tB.'
  assumptions:
  - $A,B,C$は同一直線上にない3点
  - $\frac{r}{1-r}\cdot\frac{s}{1-s}\cdot\frac{t}{1-t}=1$
  - $p$は直線$AD$と直線$BE$の上にある
  quantifiers:
  - 実内積空間に付随する任意のアフィン空間内の任意の三角形$ABC$
  - 任意の実数$r,s,t$と点$p$
  conclusion: $p$は直線$CF$の上にある。
  answer: |
    $A,B,C$を同一直線上にない3点とし、実数$r,s,t$は積の条件を満たすとする。積が$1$なので$r,s,t$は$0$でなく、分母の$1-r,1-s,1-t$も$0$でなく、$rst=(1-r)(1-s)(1-t)$である。$D,E,F$を上の式で定め、$p$は直線$AD,BE$の上にあるとする。$p=\lambda A+\alpha B+\gamma C$（$\lambda+\alpha+\gamma=1$）と表すと、$\alpha r=\gamma(1-r)$、$\lambda(1-s)=\gamma s$である。$\gamma=0$なら第1式から$\alpha=0$、第2式から$\lambda=0$となり、和が$1$であることに反する。よって$\gamma\neq 0$である。$\alpha=\frac{\gamma(1-r)}{r}$、$\lambda=\frac{\gamma s}{1-s}$を代入すると、$rst=(1-r)(1-s)(1-t)$から$\lambda t=\alpha(1-t)$が従う。$\kappa=\lambda+\alpha$とおくと$\lambda=\kappa(1-t)$、$\alpha=\kappa t$なので、$p=\gamma C+\kappa F$かつ$\gamma+\kappa=1$である。よって$p$は直線$CF$の上にある。
  strategy: Use barycentric coordinates of p and show the third incidence equation from the product condition.
  sketch:
  - 'derive: The product condition forces r, s, t and the denominators to be nonzero and rst = (1-r)(1-s)(1-t).'
  - 'setup: Write p = λA + αB + γC with sum 1.'
  - 'translate: The two incidences give αr = γ(1-r) and λ(1-s) = γs.'
  - 'derive: γ ≠ 0, and substitution gives λt = α(1-t).'
  - 'conclude: p = γC + (λ+α)F, so p lies on line CF.'
  openmath: (forall (a b c p r s t) (-> (and (not (collinear_points a b c)) (= (* (* (/ r (- 1 r)) (/ s (- 1 s))) (/ t (- 1 t))) 1) (on_line p a (division_point b c r)) (on_line p b (division_point c a s))) (on_line p c (division_point a b t))))
  hard_negative:
    statement: 長さの比の積が$1$なら、3直線$AD,BE,CF$は1点で交わる。
    reason: 符号の条件が必要である。メネラウスの定理の配置では$D,E,F$が同一直線上にあって長さの比の積が$1$になるが、3直線$AD,BE,CF$は一般に1点で交わらない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C p : P) (r s t : ℝ), ¬Collinear ℝ ({A, B, C} : Set P) → r / (1 - r) * (s / (1 - s)) * (t / (1 - t)) = 1 → p ∈ line[ℝ, A, AffineMap.lineMap B C r] → p ∈ line[ℝ, B, AffineMap.lineMap C A s] → p ∈ line[ℝ, C, AffineMap.lineMap A B t]
  proof: |
    by
      intro V P _ _ _ _ A B C p r s t hABC hprod h1 h2
      have hli : ∀ a b : ℝ, a • (B -ᵥ A) + b • (C -ᵥ A) = (0 : V) → a = 0 ∧ b = 0 := by
        intro a b h
        by_contra hab
        apply hABC
        rcases not_and_or.mp hab with ha | hb
        · have hB : B -ᵥ A = (-b / a) • (C -ᵥ A) := by
            have h2 : a • (B -ᵥ A) = (-b) • (C -ᵥ A) := by
              rw [neg_smul]; exact eq_neg_of_add_eq_zero_left h
            rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ ha, one_smul]
          have h3 := AffineMap.lineMap_mem_affineSpan_pair (-b / a) A C
          rw [AffineMap.lineMap_apply, ← hB, vsub_vadd] at h3
          have h4 := collinear_insert_of_mem_affineSpan_pair h3
          rwa [Set.insert_comm] at h4
        · have hC : C -ᵥ A = (-a / b) • (B -ᵥ A) := by
            have h2 : b • (C -ᵥ A) = (-a) • (B -ᵥ A) := by
              rw [neg_smul]; exact eq_neg_of_add_eq_zero_right h
            rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ hb, one_smul]
          have h3 := AffineMap.lineMap_mem_affineSpan_pair (-a / b) A B
          rw [AffineMap.lineMap_apply, ← hC, vsub_vadd] at h3
          have h4 := collinear_insert_of_mem_affineSpan_pair h3
          rwa [Set.insert_comm, Set.pair_comm] at h4
      have hr1 : 1 - r ≠ 0 := by
        intro h; rw [h] at hprod; simp at hprod
      have hs1 : 1 - s ≠ 0 := by
        intro h; rw [h] at hprod; simp at hprod
      have ht1 : 1 - t ≠ 0 := by
        intro h; rw [h] at hprod; simp at hprod
      have H : r * s * t = (1 - r) * (1 - s) * (1 - t) := by
        field_simp at hprod
        linear_combination hprod
      set u : V := B -ᵥ A with hu
      set w : V := C -ᵥ A with hw
      have hCB : C -ᵥ B = w - u := (vsub_sub_vsub_cancel_right C B A).symm
      have hAC : A -ᵥ C = -w := (neg_vsub_eq_vsub_rev C A).symm
      have eD : AffineMap.lineMap B C r -ᵥ A = (1 - r) • u + r • w := by
        rw [AffineMap.lineMap_apply, vadd_vsub_assoc, hCB, ← hu]; module
      have eE : AffineMap.lineMap C A s -ᵥ A = (1 - s) • w := by
        rw [AffineMap.lineMap_apply, vadd_vsub_assoc, hAC, ← hw]; module
      have eF : AffineMap.lineMap A B t -ᵥ A = t • u := by
        rw [AffineMap.lineMap_apply, vadd_vsub_assoc, vsub_self, add_zero]
      obtain ⟨x, hx⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp h1
      obtain ⟨y, hy⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp h2
      have p1 : p -ᵥ A = (x * (1 - r)) • u + (x * r) • w := by
        rw [← hx, AffineMap.lineMap_apply, vadd_vsub, eD]; module
      have p2 : p -ᵥ A = (1 - y) • u + (y * (1 - s)) • w := by
        have eEB : AffineMap.lineMap C A s -ᵥ B = (1 - s) • w - u := by
          rw [← vsub_sub_vsub_cancel_right _ B A, eE]
        rw [← hy, AffineMap.lineMap_apply, vadd_vsub_assoc, eEB, ← hu]; module
      have h0 : (x * (1 - r) - (1 - y)) • u + (x * r - y * (1 - s)) • w = (0 : V) := by
        have : ((x * (1 - r)) • u + (x * r) • w) - ((1 - y) • u + (y * (1 - s)) • w) = (0 : V) := by
          rw [← p1, ← p2, sub_self]
        rw [← this]; module
      obtain ⟨e1, e2⟩ := hli _ _ h0
      set κ := r + (1 - r) * (1 - s) with hκ
      have hxκ : x * κ = 1 - s := by rw [hκ]; linear_combination e2 + (1 - s) * e1
      have hκ0 : κ ≠ 0 := by
        intro h0; rw [h0, mul_zero] at hxκ; exact hs1 hxκ.symm
      have key : t = x * (t * r + 1 - r) := by
        apply mul_left_cancel₀ hκ0
        rw [hκ] at hxκ ⊢
        linear_combination H - (t * r + 1 - r) * hxκ
      refine mem_affineSpan_pair_iff_exists_lineMap_eq.mpr ⟨1 - x * r, ?_⟩
      apply vsub_left_cancel (p := A)
      rw [p1, AffineMap.lineMap_apply, vadd_vsub_assoc, ← hw]
      have eFC : AffineMap.lineMap A B t -ᵥ C = t • u - w := by
        rw [← vsub_sub_vsub_cancel_right _ C A, eF]
      rw [eFC]
      have c1 : (1 - x * r) * t = x * (1 - r) := by linear_combination key
      have : (1 - x * r) • (t • u - w) + w = ((1 - x * r) * t) • u + (x * r) • w := by module
      rw [this, c1]
- id: ceva_unsigned_ratio_form
  kind: gap
  level: high
  topic: 共点と共線・チェバの定理の比の形
  statement: 三角形$ABC$の直線$BC,CA,AB$上に頂点と異なる点$D,E,F$をとる。直線$AD,BE,CF$が点$p$を共有するなら、長さの比について$\frac{BD}{DC}\cdot\frac{CE}{EA}\cdot\frac{AF}{FB}=1$である。
  statement_en: If D, E, F on lines BC, CA, AB of a triangle ABC differ from the vertices and lines AD, BE, CF share a point p, then (BD/DC)(CE/EA)(AF/FB) = 1 for lengths.
  assumptions:
  - $A,B,C$は同一直線上にない3点
  - $D,E,F$は直線$BC,CA,AB$上の頂点と異なる点
  - $p$は直線$AD,BE,CF$の上にある
  quantifiers:
  - 実内積空間に付随する任意のアフィン空間内の任意の三角形$ABC$
  - 任意の点$D,E,F,p$
  conclusion: $\frac{BD}{DC}\cdot\frac{CE}{EA}\cdot\frac{AF}{FB}=1$である。
  answer: |
    $A,B,C$を同一直線上にない3点、$D,E,F$を直線$BC,CA,AB$上の頂点と異なる点、$p$を直線$AD,BE,CF$の共有点とする。$D=(1-r)B+rC$、$E=(1-s)C+sA$、$F=(1-t)A+tB$となる実数をとると、頂点と異なるので$r,s,t$は$0$でも$1$でもない。$BD=|r|BC$、$DC=|1-r|BC$であり、$BC>0$なので$\frac{BD}{DC}=\left|\frac{r}{1-r}\right|$である。他の2つも同様である。符号付きのチェバの定理「$\frac{r}{1-r}\cdot\frac{s}{1-s}\cdot\frac{t}{1-t}=1$」の両辺の絶対値をとれば結論を得る。
  strategy: Convert the signed Ceva identity to lengths by taking absolute values.
  sketch:
  - 'setup: Parametrise D, E, F by r, s, t, none equal to 0 or 1.'
  - 'derive: BD/DC = |r/(1-r)|, and likewise for the other two ratios.'
  - 'apply_theorem: Signed Ceva gives the product of signed ratios equal to 1.'
  - 'conclude: Taking absolute values gives the product of lengths equal to 1.'
  openmath: (forall (a b c x y z p) (-> (and (not (collinear_points a b c)) (on_line x b c) (on_line y c a) (on_line z a b) (!= x b) (!= x c) (!= y c) (!= y a) (!= z a) (!= z b) (on_line p a x) (on_line p b y) (on_line p c z)) (= (* (* (/ (dist_of b x) (dist_of x c)) (/ (dist_of c y) (dist_of y a))) (/ (dist_of a z) (dist_of z b))) 1)))
  hard_negative:
    statement: 比を$\frac{BD}{DC}\cdot\frac{EA}{CE}\cdot\frac{AF}{FB}=1$と並べても成り立つ。
    reason: $E$の比の向きが逆である。$BD=DC$、$CE:EA=1:2$、$AF:FB=2:1$のとき3直線は1点で交わり、正しい積は$1$だが、並べ替えた積は$4$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D E F p : P), ¬Collinear ℝ ({A, B, C} : Set P) → D ∈ line[ℝ, B, C] → E ∈ line[ℝ, C, A] → F ∈ line[ℝ, A, B] → D ≠ B → D ≠ C → E ≠ C → E ≠ A → F ≠ A → F ≠ B → p ∈ line[ℝ, A, D] → p ∈ line[ℝ, B, E] → p ∈ line[ℝ, C, F] → dist B D / dist D C * (dist C E / dist E A) * (dist A F / dist F B) = 1
  proof: |
    by
      intro V P _ _ _ _ A B C D E F p hABC hD hE hF hDB hDC hEC hEA hFA hFB h1 h2 h3
      obtain ⟨r, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hD
      obtain ⟨s, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hE
      obtain ⟨t, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hF
      have hr : r ≠ 0 := by rintro rfl; simp at hDB
      have hs : s ≠ 0 := by rintro rfl; simp at hEC
      have ht : t ≠ 0 := by rintro rfl; simp at hFA
      have ceva : r / (1 - r) * (s / (1 - s)) * (t / (1 - t)) = 1 := by
        let T : Affine.Triangle ℝ P := ⟨![A, B, C], affineIndependent_iff_not_collinear_set.mpr hABC⟩
        let R : Fin 3 → ℝ := ![r, s, t]
        have hR : ∀ i, R i ≠ 0 := by
          intro i; fin_cases i
          exacts [hr, hs, ht]
        have hp : ∀ i : Fin 3, p ∈ line[ℝ, T.points i, AffineMap.lineMap (T.points (i + 1)) (T.points (i + 2)) (R i)] := by
          intro i; fin_cases i
          exacts [h1, h2, h3]
        have := Affine.Triangle.prod_div_one_sub_eq_one_of_mem_line_point_lineMap hR hp
        rw [Fin.prod_univ_three] at this
        exact this
      have hBC : dist B C ≠ 0 := by
        intro h; rw [dist_eq_zero] at h; subst h; apply hABC; simpa using collinear_pair ℝ A B
      have hCA : dist C A ≠ 0 := by
        intro h; rw [dist_eq_zero] at h; subst h; apply hABC
        rw [Set.insert_comm]; simpa using collinear_pair ℝ B C
      have hAB : dist A B ≠ 0 := by
        intro h; rw [dist_eq_zero] at h; subst h; apply hABC; simpa using collinear_pair ℝ A C
      rw [dist_left_lineMap, dist_lineMap_right, dist_left_lineMap, dist_lineMap_right, dist_left_lineMap, dist_lineMap_right]
      simp only [Real.norm_eq_abs]
      have e1 : |r| * dist B C / (|1 - r| * dist B C) = |r / (1 - r)| := by
        rw [abs_div]; field_simp
      have e2 : |s| * dist C A / (|1 - s| * dist C A) = |s / (1 - s)| := by
        rw [abs_div]; field_simp
      have e3 : |t| * dist A B / (|1 - t| * dist A B) = |t / (1 - t)| := by
        rw [abs_div]; field_simp
      rw [e1, e2, e3, ← abs_mul, ← abs_mul, ceva, abs_one]
- id: simson_line
  kind: named
  level: high
  topic: 共点と共線・シムソン線
  statement: 'シムソン線: 平面上の異なる3点$A,B,C$と点$X$が同一円周上にあるとき、$X$から直線$BC,CA,AB$に下ろした垂線の足$D,E,F$は同一直線上にある。'
  statement_en: 'Simson line: if distinct points A, B, C and a point X of the Euclidean plane lie on a common circle, then the feet D, E, F of the perpendiculars from X to lines BC, CA, AB are collinear.'
  assumptions:
  - 座標平面（ユークリッド平面）の点を考える
  - $A,B,C$は互いに異なる
  - $A,B,C,X$は同一円周上にある
  - $D,E,F$は$X$から直線$BC,CA,AB$への垂線の足
  quantifiers:
  - ユークリッド平面の任意の点$A,B,C,X,D,E,F$
  conclusion: $D,E,F$は同一直線上にある。
  answer: |
    $A,B,C,X$を平面上の同一円周上の点で$A,B,C$は互いに異なるとし、$D,E,F$を$X$から直線$BC,CA,AB$への垂線の足とする。2直線$\ell,m$について、$\ell$から$m$へ測った角を$\pi$を法として$(\ell,m)$と書く（有向角）。共円については次を使う。$R\neq S$で、$P,Q$がどちらも$R,S$と異なるとき、$R,S,P,Q$が同一円周上にあれば$(PR,PS)=(QR,QS)$である（有向角で書いた円周角の定理）。

    $X$が頂点に等しい場合を先に扱う。$X=A$なら$E=F=A$なので、$D,E,F$は高々2点からなり、同一直線上にある。$X=B$、$X=C$でも同じである。

    以下、$X$は$A,B,C$のどれとも異なるとする。直線と円の共有点は高々2個なので、$X$は直線$BC,CA,AB$の上になく、$D,E,F$は$X$と異なる。$D=F$または$D=E$なら、$D,E,F$は高々2点からなり、同一直線上にある。そこで$D\neq F$、$D\neq E$とする。

    $(DF,DX)=(BA,BX)$を示す。$D\neq B$かつ$F\neq B$のとき、$\angle XDB=\angle XFB=\frac{\pi}{2}$なので、$D,F$は$XB$を直径とする円の上にある。$D,B$はどちらも$F,X$と異なるから$(DF,DX)=(BF,BX)$である。$F$は直線$AB$上の$B$と異なる点なので、直線$BF$は直線$BA$であり、$(BF,BX)=(BA,BX)$である。$D=B$のとき、$F\neq B$なので$(DF,DX)=(BF,BX)=(BA,BX)$である。$F=B$のとき、$D\neq B$なので直線$DF$は直線$BC$である。$DX\perp BC$より$(DF,DX)=\frac{\pi}{2}$であり、$F=B$は$BX\perp AB$を意味するので$(BA,BX)=\frac{\pi}{2}$である。

    同じ議論で$B,F$を$C,E$に置き換えると、$(DE,DX)=(CA,CX)$を得る。また$A,X,B,C$は同一円周上にあり、$B,C$はどちらも$A,X$と異なるので、$(BA,BX)=(CA,CX)$である。したがって$(DF,DX)=(DE,DX)$である。直線$DF$と直線$DE$はともに$D$を通り、直線$DX$となす有向角が等しいので一致する。よって$D,E,F$は同一直線上にある。
  strategy: Chase directed angles modulo π through the circles with diameters XB and XC.
  sketch:
  - 'case_split: If X is a vertex, or D = F, or D = E, at most two distinct points remain.'
  - 'setup: Otherwise X lies on no side line, and we measure directed angles between lines modulo π.'
  - 'derive: D and F lie on the circle with diameter XB, so (DF, DX) = (BA, BX); the cases D = B and F = B are checked directly.'
  - 'derive: The same argument at C gives (DE, DX) = (CA, CX).'
  - 'apply_theorem: Since A, X, B, C are concyclic, (BA, BX) = (CA, CX).'
  - 'conclude: Lines DF and DE pass through D and make the same directed angle with DX, so they coincide.'
  openmath: (forall (a b c x p q s) (-> (and euclidean_plane_ambient (cospherical_points (set a b c x)) (!= a b) (!= b c) (!= c a) (on_line p b c) (= (inner_product (- x p) (- c b)) 0) (on_line q c a) (= (inner_product (- x q) (- a c)) 0) (on_line s a b) (= (inner_product (- x s) (- b a)) 0)) (collinear_points p q s)))
  hard_negative:
    statement: 外接円の上にない点$X$についても、垂線の足は同一直線上にある。
    reason: $X$が外心なら足は3辺の中点であり、これは同一直線上にない。
  target: |
    ∀ (A B C X D E F : EuclideanSpace ℝ (Fin 2)), EuclideanGeometry.Cospherical ({A, B, C, X} : Set (EuclideanSpace ℝ (Fin 2))) → A ≠ B → B ≠ C → C ≠ A → D ∈ line[ℝ, B, C] → inner ℝ (X - D) (C - B) = 0 → E ∈ line[ℝ, C, A] → inner ℝ (X - E) (A - C) = 0 → F ∈ line[ℝ, A, B] → inner ℝ (X - F) (B - A) = 0 → Collinear ℝ ({D, E, F} : Set (EuclideanSpace ℝ (Fin 2)))
  proof: |
    by
      intro A B C X D E F hcos hAB hBC hCA hD hpD hE hpE hF hpF
      have men : ∀ (r s t : ℝ), r * s * t = -((1 - r) * (1 - s) * (1 - t)) →
          Collinear ℝ ({AffineMap.lineMap B C r, AffineMap.lineMap C A s, AffineMap.lineMap A B t} : Set (EuclideanSpace ℝ (Fin 2))) := by
        intro r s t hδ
        set D := AffineMap.lineMap B C r with hD
        set E := AffineMap.lineMap C A s with hE
        set F := AffineMap.lineMap A B t with hF
        set u : EuclideanSpace ℝ (Fin 2) := B -ᵥ A with hu
        set w : EuclideanSpace ℝ (Fin 2) := C -ᵥ A with hw
        have hCB : C -ᵥ B = w - u := (vsub_sub_vsub_cancel_right C B A).symm
        have hAC : A -ᵥ C = -w := (neg_vsub_eq_vsub_rev C A).symm
        have eD : D -ᵥ A = (1 - r) • u + r • w := by
          rw [hD, AffineMap.lineMap_apply, vadd_vsub_assoc, hCB, ← hu]; module
        have eE : E -ᵥ A = (1 - s) • w := by
          rw [hE, AffineMap.lineMap_apply, vadd_vsub_assoc, hAC, ← hw]; module
        have eF : F -ᵥ A = t • u := by
          rw [hF, AffineMap.lineMap_apply, vadd_vsub_assoc, vsub_self, add_zero]
        have eX : D -ᵥ F = (1 - r - t) • u + r • w := by
          rw [← vsub_sub_vsub_cancel_right D F A, eD, eF]; module
        have eY : E -ᵥ F = (-t) • u + (1 - s) • w := by
          rw [← vsub_sub_vsub_cancel_right E F A, eE, eF]; module
        have hδ' : (1 - r - t) * (1 - s) + t * r = 0 := by linear_combination hδ
        have hcase : ∃ c : ℝ, (D -ᵥ F = c • (E -ᵥ F)) ∨ (E = F) := by
          by_cases ht : t = 0
          · by_cases hs : 1 - s = 0
            · refine ⟨0, Or.inr ?_⟩
              exact eq_of_vsub_eq_zero (by rw [eY, ht, hs]; simp)
            · have hr : 1 - r - t = 0 := by
                have : (1 - r - t) * (1 - s) = 0 := by rw [ht] at hδ' ⊢; linarith
                exact (mul_eq_zero.mp this).resolve_right hs
              refine ⟨r / (1 - s), Or.inl ?_⟩
              rw [eX, eY, hr, ht, smul_add, smul_smul, smul_smul, div_mul_cancel₀ _ hs]
              simp
          · refine ⟨-(1 - r - t) / t, Or.inl ?_⟩
            have hc : -(1 - r - t) / t * (1 - s) = r := by
              field_simp
              linear_combination -hδ'
            rw [eX, eY, smul_add, smul_smul, smul_smul, hc]
            congr 1
            congr 1
            field_simp
        rw [collinear_iff_of_mem (p₀ := F) (by simp)]
        obtain ⟨c, hc | hc⟩ := hcase
        · refine ⟨E -ᵥ F, ?_⟩
          intro p hp
          simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hp
          rcases hp with rfl | rfl | rfl
          · exact ⟨c, by rw [← hc, vsub_vadd]⟩
          · exact ⟨1, by rw [one_smul, vsub_vadd]⟩
          · exact ⟨0, by simp⟩
        · refine ⟨D -ᵥ F, ?_⟩
          intro p hp
          simp only [Set.mem_insert_iff, Set.mem_singleton_iff] at hp
          rcases hp with rfl | rfl | rfl
          · exact ⟨1, by rw [one_smul, vsub_vadd]⟩
          · exact ⟨0, by simpa using hc⟩
          · exact ⟨0, by simp⟩
      have poly : ∀ a1 a2 b1 b2 c1 c2 o1 o2 r s t d1 d2 d3 : ℝ,
          a1 ^ 2 + a2 ^ 2 = 2 * (a1 * o1 + a2 * o2) → b1 ^ 2 + b2 ^ 2 = 2 * (b1 * o1 + b2 * o2) →
          c1 ^ 2 + c2 ^ 2 = 2 * (c1 * o1 + c2 * o2) →
          r * d1 = b1 * (b1 - c1) + b2 * (b2 - c2) → s * d2 = c1 * (c1 - a1) + c2 * (c2 - a2) →
          t * d3 = a1 * (a1 - b1) + a2 * (a2 - b2) →
          (1 - r) * d1 = c1 * (c1 - b1) + c2 * (c2 - b2) → (1 - s) * d2 = a1 * (a1 - c1) + a2 * (a2 - c2) →
          (1 - t) * d3 = b1 * (b1 - a1) + b2 * (b2 - a2) →
          d1 * d2 * d3 * (r * s * t + (1 - r) * (1 - s) * (1 - t)) = 0 := by
        intro a1 a2 b1 b2 c1 c2 o1 o2 r s t d1 d2 d3 ha hb hc e1 e2 e3 f1 f2 f3
        have hD : (a1 ^ 2 + a2 ^ 2) * (b1 * c2 - b2 * c1) + (b1 ^ 2 + b2 ^ 2) * (c1 * a2 - c2 * a1) + (c1 ^ 2 + c2 ^ 2) * (a1 * b2 - a2 * b1) = 0 := by
          linear_combination (b1 * c2 - b2 * c1) * ha + (c1 * a2 - c2 * a1) * hb + (a1 * b2 - a2 * b1) * hc
        have hE : (b1 * (b1 - c1) + b2 * (b2 - c2)) * (c1 * (c1 - a1) + c2 * (c2 - a2)) * (a1 * (a1 - b1) + a2 * (a2 - b2)) +
            (c1 * (c1 - b1) + c2 * (c2 - b2)) * (a1 * (a1 - c1) + a2 * (a2 - c2)) * (b1 * (b1 - a1) + b2 * (b2 - a2)) = 0 := by
          linear_combination ((b1 * c2 - b2 * c1) + (c1 * a2 - c2 * a1) + (a1 * b2 - a2 * b1)) * hD
        rw [← e1, ← e2, ← e3, ← f1, ← f2, ← f3] at hE
        linear_combination hE
      have inn : ∀ U W : EuclideanSpace ℝ (Fin 2), inner ℝ U W = U 0 * W 0 + U 1 * W 1 := by
        intro U W
        simp [PiLp.inner_apply, Fin.sum_univ_two]
        ring
      have ne0 : ∀ U W : EuclideanSpace ℝ (Fin 2), U ≠ W → (U 0 - W 0) ^ 2 + (U 1 - W 1) ^ 2 ≠ 0 := by
        intro U W h
        have h1 : 0 < ‖U - W‖ ^ 2 := by
          have := norm_pos_iff.mpr (sub_ne_zero.mpr h)
          positivity
        rw [← real_inner_self_eq_norm_sq, inn] at h1
        simp only [PiLp.sub_apply] at h1
        nlinarith
      obtain ⟨O, ρ, hO⟩ := hcos
      have circ : ∀ U : EuclideanSpace ℝ (Fin 2), dist U O = ρ → (U 0 - O 0) ^ 2 + (U 1 - O 1) ^ 2 = ρ ^ 2 := by
        intro U h
        rw [← h, EuclideanSpace.dist_eq, Real.sq_sqrt (by positivity)]
        simp [Fin.sum_univ_two, Real.dist_eq, sq_abs]
      have ha := circ A (hO A (by simp))
      have hb := circ B (hO B (by simp))
      have hc := circ C (hO C (by simp))
      have hp := circ X (hO X (by simp))
      obtain ⟨r, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hD
      obtain ⟨s, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hE
      obtain ⟨t, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hF
      rw [inn] at hpD hpE hpF
      simp only [AffineMap.lineMap_apply, vsub_eq_sub, vadd_eq_add, PiLp.sub_apply, PiLp.add_apply, PiLp.smul_apply, smul_eq_mul] at hpD hpE hpF
      have d1 := ne0 C B hBC.symm
      have d2 := ne0 A C hCA.symm
      have d3 := ne0 B A hAB.symm
      apply men
      have key := poly (A 0 - X 0) (A 1 - X 1) (B 0 - X 0) (B 1 - X 1) (C 0 - X 0) (C 1 - X 1) (O 0 - X 0) (O 1 - X 1) r s t
        ((C 0 - B 0) ^ 2 + (C 1 - B 1) ^ 2) ((A 0 - C 0) ^ 2 + (A 1 - C 1) ^ 2) ((B 0 - A 0) ^ 2 + (B 1 - A 1) ^ 2)
        (by linear_combination ha - hp) (by linear_combination hb - hp) (by linear_combination hc - hp)
        (by linear_combination -hpD) (by linear_combination -hpE) (by linear_combination -hpF)
        (by linear_combination hpD) (by linear_combination hpE) (by linear_combination hpF)
      have goal' := (mul_eq_zero.mp key).resolve_left (mul_ne_zero (mul_ne_zero d1 d2) d3)
      linear_combination goal'
