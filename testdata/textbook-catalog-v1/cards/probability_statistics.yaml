- id: indep_fun_comp
  kind: gap
  level: 2
  topic: 独立性・確率変数の変換
  statement: 確率変数XとYが独立で、φとψが可測写像ならば、φ(X)とψ(Y)も独立である。
  statement_en: If random variables X and Y are independent and φ, ψ are measurable maps, then φ(X) and ψ(Y) are independent.
  assumptions: [Pは確率測度, XとYは独立, φとψは可測]
  quantifiers: [任意の確率空間, 確率変数X, Y, 可測写像φ, ψ]
  conclusion: φ∘Xとψ∘Yは独立である。
  answer: |
    可測集合C,Dに対し、{φ(X)∈C}={X∈φ⁻¹(C)}、{ψ(Y)∈D}={Y∈ψ⁻¹(D)}である。φ⁻¹(C)とψ⁻¹(D)は可測なので、XとYの独立性から両事象の共通部分の確率は積に分解する。これはφ(X)とψ(Y)の独立性そのものである。
  strategy: Pull events back through the measurable maps and use independence of X and Y.
  sketch:
    - "setup: Fix measurable sets C and D in the target spaces."
    - "translate: Rewrite the events through the preimages under φ and ψ."
    - "apply_theorem: Apply independence of X and Y to those measurable preimages."
    - "conclude: The product formula is exactly independence of φ(X) and ψ(Y)."
  openmath: (forall (P X Y f g) (-> (and (probability_measure P) (indep_rv P X Y) (measurable_map f) (measurable_map g)) (indep_rv P (map_compose f X) (map_compose g Y))))
  hard_negative:
    statement: φ(X)とψ(Y)が独立ならXとYも独立である。
