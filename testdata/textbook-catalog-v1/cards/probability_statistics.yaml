- id: prob_compl
  kind: gap
  level: 2
  topic: 確率測度・余事象
  statement: 確率測度$P$と可測な事象$A$について、$P(A^c)=1-P(A)$が成り立つ。
  statement_en: For a probability measure P and a measurable event A, P(Aᶜ) = 1 - P(A).
  assumptions:
  - $P$は標本空間$\Omega$上の確率測度
  - $A$は可測な事象
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の事象$A\in\mathcal{F}$
  conclusion: $P(A^c)=1-P(A)$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$A\in\mathcal{F}$を事象とする。$A$と$A^c$は互いに素で、和集合は$\Omega$である。有限加法性より$P(A)+P(A^c)=P(\Omega)=1$となる。移項すると$P(A^c)=1-P(A)$を得る。
  strategy: Split the whole space into A and its complement and use additivity.
  sketch:
  - 'setup: Note that A and Aᶜ are disjoint with union Ω.'
  - 'apply_theorem: Additivity gives P(A) + P(Aᶜ) = P(Ω) = 1.'
  - 'conclude: Rearrange to obtain P(Aᶜ) = 1 - P(A).'
  openmath: (forall (P A) (-> (and (probability_measure P) (measurable_event A)) (= (prob P (set_compl A)) (- 1 (prob P A)))))
  hard_negative:
    statement: 確率測度でない有限測度μでもμ(Aᶜ)=1-μ(A)が成り立つ。
    reason: 全測度が1とは限らず、正しくはμ(Aᶜ)=μ(Ω)-μ(A)である。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (A : Set Ω), MeasurableSet A → μ.real Aᶜ = 1 - μ.real A
  proof: |
    by
      intro Ω _ μ _ A hA
      have h := MeasureTheory.probReal_add_probReal_compl (μ := μ) hA
      linarith
- id: prob_union_add_inter
  kind: gap
  level: 2
  topic: 確率測度・包除原理
  statement: 確率測度$P$と可測な事象$A,B$について、$P(A\cup B)=P(A)+P(B)-P(A\cap B)$が成り立つ。
  statement_en: For measurable events A and B, P(A ∪ B) = P(A) + P(B) - P(A ∩ B).
  assumptions:
  - $P$は標本空間$\Omega$上の確率測度
  - $A$と$B$は可測な事象
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の事象$A,B\in\mathcal{F}$
  conclusion: $P(A\cup B)=P(A)+P(B)-P(A\cap B)$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$A,B\in\mathcal{F}$を事象とする。$A\cup B$は$A$と$B\setminus A$の互いに素な和なので、$P(A\cup B)=P(A)+P(B\setminus A)$である。また$B$は$A\cap B$と$B\setminus A$の互いに素な和なので、$P(B)=P(A\cap B)+P(B\setminus A)$である。二つの式から$P(B\setminus A)$を消去すると、$P(A\cup B)=P(A)+P(B)-P(A\cap B)$を得る。
  strategy: Use two disjoint decompositions sharing the piece B \ A.
  sketch:
  - 'setup: Decompose A ∪ B = A ⊔ (B \ A) and B = (A ∩ B) ⊔ (B \ A).'
  - 'apply_theorem: Apply additivity to both decompositions.'
  - 'derive: Eliminate P(B \ A) between the two equations.'
  - 'conclude: This yields P(A ∪ B) = P(A) + P(B) - P(A ∩ B).'
  openmath: (forall (P A B) (-> (and (probability_measure P) (measurable_event A) (measurable_event B)) (= (prob P (union A B)) (- (+ (prob P A) (prob P B)) (prob P (inter A B))))))
  hard_negative:
    statement: 任意の事象A,BについてP(A∪B)=P(A)+P(B)である。
    reason: これはAとBが互いに素な場合などP(A∩B)=0のときに限る。A=Bで確率が正なら成り立たない。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (A B : Set Ω), MeasurableSet A → MeasurableSet B → μ.real (A ∪ B) = μ.real A + μ.real B - μ.real (A ∩ B)
  proof: |
    by
      intro Ω _ μ _ A B _ hB
      have h := MeasureTheory.measureReal_union_add_inter (μ := μ) (s := A) hB
      linarith
- id: prob_union_bound_finite
  kind: gap
  level: 2
  topic: 確率測度・和集合の上界
  statement: 確率測度$P$と集合の有限族$(A_i)_{i\in s}$について、$P\left(\bigcup_{i\in s}A_i\right)\leq\sum_{i\in s}P(A_i)$が成り立つ。$A_i$は可測でなくてもよく、その場合の$P$は外測度の値を表す。
  statement_en: For a finite family of sets A_i, P(⋃_i A_i) ≤ Σ_i P(A_i).
  assumptions:
  - $P$は標本空間$\Omega$上の確率測度
  - $s$は有限な添字集合
  - 各$A_i$は$\Omega$の部分集合（可測とは限らない）
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の有限集合$s$
  - 任意の集合族$(A_i)_{i\in s}$
  conclusion: $P\left(\bigcup_{i\in s}A_i\right)\leq\sum_{i\in s}P(A_i)$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$s$を有限集合、$(A_i)_{i\in s}$を$\Omega$の部分集合の族とする。可測とは限らない集合$S$に対しては$P(S)=\inf\{P(T):T\in\mathcal{F},\ S\subseteq T\}$と読む。この値は包含について単調であり、可測な$S$では元の$P(S)$に一致する。

    まず二つの集合$B,C\subseteq\Omega$について$P(B\cup C)\leq P(B)+P(C)$を示す。$\varepsilon>0$に対して、可測な$T\supseteq B$と$U\supseteq C$を$P(T)\leq P(B)+\varepsilon$、$P(U)\leq P(C)+\varepsilon$となるようにとる。$T\cup U$は$T$と$U\setminus T$の互いに素な和なので、$P(B\cup C)\leq P(T\cup U)\leq P(T)+P(U)\leq P(B)+P(C)+2\varepsilon$である。$\varepsilon$は任意なので不等式が従う。

    次に$s$の要素数に関する帰納法を用いる。$s$が空なら両辺とも$0$である。$s=s'\cup\{j\}$（$j\notin s'$）のときは、二集合の不等式と帰納法の仮定から$P\left(\bigcup_{i\in s}A_i\right)\leq P\left(\bigcup_{i\in s'}A_i\right)+P(A_j)\leq\sum_{i\in s}P(A_i)$を得る。
  strategy: Induct on the finite index set using subadditivity for two sets.
  sketch:
  - 'induction: Induct on the finite set s.'
  - 'setup: The empty union has probability 0, which settles the base case.'
  - 'apply_theorem: For the step, use P(B ∪ C) ≤ P(B) + P(C).'
  - 'conclude: Combine with the induction hypothesis.'
  openmath: (forall (P s A) (-> (and (probability_measure P) (finite_set s)) (<= (prob P (union_over s A)) (sum s (lambda (i) (prob P (seq_value A i)))))))
  hard_negative:
    statement: 有限族についてP(⋃A_i)=ΣP(A_i)が常に成り立つ。
    reason: 等号には互いに素であることなどが必要で、共通部分が正の確率をもつと右辺の方が大きくなる。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (ι : Type*) (s : Finset ι) (A : ι → Set Ω), μ.real (⋃ i ∈ s, A i) ≤ ∑ i ∈ s, μ.real (A i)
  proof: |
    by
      intro Ω _ μ _ ι s A
      exact MeasureTheory.measureReal_biUnion_finset_le s A
- id: cond_mul_rule
  kind: gap
  level: 2
  topic: 条件付き確率・乗法公式
  statement: 確率測度$P$、$P(A)>0$である可測な事象$A$、集合$B$について、$P(B\mid A)P(A)=P(A\cap B)$が成り立つ。$B$は可測でなくてもよく、その場合の$P$は外測度の値を表す。
  statement_en: If the event A has positive probability, then P(B|A) P(A) = P(A ∩ B).
  assumptions:
  - $P$は標本空間$\Omega$上の確率測度
  - $A$は可測な事象
  - $P(A)>0$
  - $B$は$\Omega$の部分集合（可測とは限らない）
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の事象$A\in\mathcal{F}$
  - 任意の集合$B\subseteq\Omega$
  conclusion: $P(B\mid A)P(A)=P(A\cap B)$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$A\in\mathcal{F}$を$P(A)>0$である事象、$B\subseteq\Omega$を集合とする。条件付き確率は$P(B\mid A)=P(A\cap B)/P(A)$で定まる。$B$が可測でない場合も、$P(A\cap B)$を外測度の値としてこの式で読む。$P(A)>0$なので、両辺に$P(A)$を掛けると$P(B\mid A)P(A)=P(A\cap B)$を得る。
  strategy: Clear the denominator in the definition of conditional probability.
  sketch:
  - 'translate: Write P(B|A) = P(A ∩ B) / P(A).'
  - 'derive: Multiply by P(A), which is nonzero.'
  - 'conclude: This gives P(B|A) P(A) = P(A ∩ B).'
  openmath: (forall (P A B) (-> (and (probability_measure P) (measurable_event A) (> (prob P A) 0)) (= (* (cond_prob P B A) (prob P A)) (prob P (inter A B)))))
  hard_negative:
    statement: P(B|A)P(A)=P(B)が成り立つ。
    reason: 左辺はP(A∩B)であり、P(B)に等しいのはP(B\A)=0のときに限られる。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (A B : Set Ω), MeasurableSet A → 0 < μ.real A → (ProbabilityTheory.cond μ A).real B * μ.real A = μ.real (A ∩ B)
  proof: |
    by
      intro Ω _ μ _ A B hA _
      simp only [MeasureTheory.Measure.real]
      rw [← ENNReal.toReal_mul, ProbabilityTheory.cond_mul_eq_inter hA B μ]
- id: total_probability_two
  kind: gap
  level: 2
  topic: 条件付き確率・全確率の公式
  statement: 確率測度$P$と可測な事象$A,B$について、$P(A)>0$かつ$P(A^c)>0$ならば、$P(B)=P(B\mid A)P(A)+P(B\mid A^c)P(A^c)$が成り立つ。
  statement_en: If A and Aᶜ both have positive probability, then for an event B, P(B) = P(B|A) P(A) + P(B|Aᶜ) P(Aᶜ).
  assumptions:
  - $P$は標本空間$\Omega$上の確率測度
  - $A$と$B$は可測な事象
  - $P(A)>0$かつ$P(A^c)>0$
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の事象$A,B\in\mathcal{F}$
  conclusion: $P(B)=P(B\mid A)P(A)+P(B\mid A^c)P(A^c)$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$A,B\in\mathcal{F}$を$P(A)>0$、$P(A^c)>0$を満たす事象とする。$B$は$A\cap B$と$A^c\cap B$の互いに素な和なので、$P(B)=P(A\cap B)+P(A^c\cap B)$である。条件付き確率の定義より、$P(A\cap B)=P(B\mid A)P(A)$、$P(A^c\cap B)=P(B\mid A^c)P(A^c)$である。これらを代入すると$P(B)=P(B\mid A)P(A)+P(B\mid A^c)P(A^c)$を得る。
  strategy: Split B along A and Aᶜ, then apply the multiplication rule to each piece.
  sketch:
  - 'case_split: Decompose B into B ∩ A and B ∩ Aᶜ.'
  - 'apply_theorem: Use additivity for the disjoint union.'
  - 'derive: Rewrite each piece with the multiplication rule.'
  - 'conclude: Sum the two terms.'
  openmath: (forall (P A B) (-> (and (probability_measure P) (measurable_event A) (measurable_event B) (> (prob P A) 0) (> (prob P (set_compl A)) 0)) (= (prob P B) (+ (* (cond_prob P B A) (prob P A)) (* (cond_prob P B (set_compl A)) (prob P (set_compl A)))))))
  hard_negative:
    statement: P(B)=P(B|A)+P(B|Aᶜ)が成り立つ。
    reason: 重みP(A),P(Aᶜ)が抜けている。B=Ωなら左辺は1だが右辺は2になる。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (A B : Set Ω), MeasurableSet A → MeasurableSet B → 0 < μ.real A → 0 < μ.real Aᶜ → μ.real B = (ProbabilityTheory.cond μ A).real B * μ.real A + (ProbabilityTheory.cond μ Aᶜ).real B * μ.real Aᶜ
  proof: |
    by
      intro Ω _ μ _ A B hA _ _ _
      simp only [MeasureTheory.Measure.real]
      rw [← ENNReal.toReal_mul, ← ENNReal.toReal_mul,
        ← ENNReal.toReal_add (ENNReal.mul_ne_top (MeasureTheory.measure_ne_top _ _) (MeasureTheory.measure_ne_top _ _))
          (ENNReal.mul_ne_top (MeasureTheory.measure_ne_top _ _) (MeasureTheory.measure_ne_top _ _)),
        ProbabilityTheory.cond_add_cond_compl_eq hA μ]
- id: total_probability_partition
  kind: textbook
  level: 2
  topic: 条件付き確率・全確率の公式
  statement: 確率測度$P$について、可測な事象の有限族$(A_i)_{i\in I}$が$\Omega$の分割で各$P(A_i)$が正ならば、可測な事象$B$について$P(B)=\sum_{i\in I}P(B\mid A_i)P(A_i)$が成り立つ。
  statement_en: If the finitely many measurable events A_i partition the sample space and each has positive probability, then P(B) = Σ_i P(B|A_i) P(A_i) for every event B.
  assumptions:
  - $P$は標本空間$\Omega$上の確率測度
  - $I$は有限集合
  - 各$A_i$は可測で、$A_i$は互いに素
  - $\bigcup_{i\in I}A_i=\Omega$
  - 各$i$で$P(A_i)>0$
  - $B$は可測な事象
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の有限集合$I$
  - 任意の分割$(A_i)_{i\in I}$
  - 任意の事象$B\in\mathcal{F}$
  conclusion: $P(B)=\sum_{i\in I}P(B\mid A_i)P(A_i)$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$I$を有限集合とする。$(A_i)_{i\in I}$を互いに素な事象の族で、$\bigcup_{i\in I}A_i=\Omega$と$P(A_i)>0$を満たすものとし、$B\in\mathcal{F}$を事象とする。$A_i$が$\Omega$を覆うので$B=\bigcup_{i\in I}(A_i\cap B)$である。$A_i$が互いに素なので$A_i\cap B$も互いに素で、加法性から$P(B)=\sum_{i\in I}P(A_i\cap B)$となる。条件付き確率の定義より$P(A_i\cap B)=P(B\mid A_i)P(A_i)$なので、これを各項に代入すると$P(B)=\sum_{i\in I}P(B\mid A_i)P(A_i)$を得る。
  strategy: Intersect B with the partition, add up, and apply the multiplication rule termwise.
  sketch:
  - 'setup: Write B as the union of the sets A_i ∩ B.'
  - 'derive: These sets are measurable and pairwise disjoint because the A_i are.'
  - 'apply_theorem: Finite additivity gives P(B) = Σ P(A_i ∩ B).'
  - 'apply_theorem: The multiplication rule rewrites each term as P(B|A_i) P(A_i).'
  - 'conclude: Summing the rewritten terms gives the formula.'
  openmath: (forall (P I A B) (-> (and (probability_measure P) (event_partition A I) (measurable_event B) (forall (i) (-> (in i I) (> (prob P (seq_value A i)) 0)))) (= (prob P B) (sum I (lambda (i) (* (cond_prob P B (seq_value A i)) (prob P (seq_value A i))))))))
  hard_negative:
    statement: A_iが全事象を覆えば、互いに素でなくても同じ公式が成り立つ。
    reason: 重なりがあると二重に数える。A_1=A_2=ΩならB=Ωで右辺は2になる。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (ι : Type*) [Fintype ι] (A : ι → Set Ω) (B : Set Ω), (∀ i, MeasurableSet (A i)) → Pairwise (fun i j => Disjoint (A i) (A j)) → (⋃ i, A i) = Set.univ → MeasurableSet B → (∀ i, 0 < μ.real (A i)) → μ.real B = ∑ i, (ProbabilityTheory.cond μ (A i)).real B * μ.real (A i)
  proof: |
    by
      intro Ω _ μ _ ι _ A B hA hd hu hB _
      have hmul : ∀ i, (ProbabilityTheory.cond μ (A i)).real B * μ.real (A i) = μ.real (A i ∩ B) := by
        intro i
        simp only [MeasureTheory.Measure.real]
        rw [← ENNReal.toReal_mul, ProbabilityTheory.cond_mul_eq_inter (hA i) B μ]
      simp_rw [hmul]
      have hB' : (⋃ i, A i ∩ B) = B := by
        rw [← Set.iUnion_inter, hu, Set.univ_inter]
      have hsum : μ (⋃ i, A i ∩ B) = ∑' i, μ (A i ∩ B) :=
        MeasureTheory.measure_iUnion
          (fun i j hij => (hd hij).mono Set.inter_subset_left Set.inter_subset_left)
          (fun i => (hA i).inter hB)
      rw [hB', tsum_fintype] at hsum
      simp only [MeasureTheory.Measure.real]
      rw [hsum, ENNReal.toReal_sum (fun _ _ => MeasureTheory.measure_ne_top _ _)]
- id: bayes_theorem
  kind: named
  level: 2
  topic: 条件付き確率・ベイズの定理
  statement: ベイズの定理。確率測度$P$と可測な事象$A,B$について、$P(A)>0$かつ$P(B)>0$ならば、$P(B\mid A)=P(A\mid B)P(B)/P(A)$が成り立つ。
  statement_en: 'Bayes'' theorem: if the events A and B have positive probability, then P(B|A) = P(A|B) P(B) / P(A).'
  assumptions:
  - $P$は標本空間$\Omega$上の確率測度
  - $A$と$B$は可測な事象
  - $P(A)>0$
  - $P(B)>0$
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の事象$A,B\in\mathcal{F}$
  conclusion: $P(B\mid A)=P(A\mid B)P(B)/P(A)$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$A,B\in\mathcal{F}$を$P(A)>0$、$P(B)>0$を満たす事象とする。条件付き確率の定義より、$P(B\mid A)P(A)=P(A\cap B)$、$P(A\mid B)P(B)=P(B\cap A)$である。$A\cap B=B\cap A$なので、$P(B\mid A)P(A)=P(A\mid B)P(B)$となる。$P(A)>0$で割ると$P(B\mid A)=P(A\mid B)P(B)/P(A)$を得る。
  strategy: Express the same intersection in two ways by the multiplication rule.
  sketch:
  - 'apply_theorem: Write P(A ∩ B) = P(B|A) P(A).'
  - 'apply_theorem: Write P(B ∩ A) = P(A|B) P(B).'
  - 'derive: Equate the right-hand sides since A ∩ B = B ∩ A.'
  - 'conclude: Divide by P(A) > 0.'
  openmath: (forall (P A B) (-> (and (probability_measure P) (measurable_event A) (measurable_event B) (> (prob P A) 0) (> (prob P B) 0)) (= (cond_prob P B A) (/ (* (cond_prob P A B) (prob P B)) (prob P A)))))
  hard_negative:
    statement: 常にP(B|A)=P(A|B)である。
    reason: 両者の比はP(B)/P(A)であり、P(A)≠P(B)かつP(A∩B)>0なら等しくない。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (A B : Set Ω), MeasurableSet A → MeasurableSet B → 0 < μ.real A → 0 < μ.real B → (ProbabilityTheory.cond μ A).real B = (ProbabilityTheory.cond μ B).real A * μ.real B / μ.real A
  proof: |
    by
      intro Ω _ μ _ A B hA hB hPA _
      have h1 : (ProbabilityTheory.cond μ A).real B * μ.real A = μ.real (A ∩ B) := by
        simp only [MeasureTheory.Measure.real]
        rw [← ENNReal.toReal_mul, ProbabilityTheory.cond_mul_eq_inter hA B μ]
      have h2 : (ProbabilityTheory.cond μ B).real A * μ.real B = μ.real (B ∩ A) := by
        simp only [MeasureTheory.Measure.real]
        rw [← ENNReal.toReal_mul, ProbabilityTheory.cond_mul_eq_inter hB A μ]
      rw [eq_div_iff hPA.ne', h1, h2, Set.inter_comm]
- id: indep_set_iff_mul
  kind: gap
  level: 2
  topic: 独立性・事象の独立
  statement: 確率測度$P$と可測な事象$A,B$について、$A$と$B$が生成する$\sigma$加法族が独立であることと、$P(A\cap B)=P(A)P(B)$は同値である。
  statement_en: Measurable events A and B are independent if and only if P(A ∩ B) = P(A) P(B).
  assumptions:
  - $P$は標本空間$\Omega$上の確率測度
  - $A$と$B$は可測な事象
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の事象$A,B\in\mathcal{F}$
  conclusion: $\sigma(A)$と$\sigma(B)$が独立であることと$P(A\cap B)=P(A)P(B)$は同値である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$A,B\in\mathcal{F}$を事象とする。$A$が生成する$\sigma$加法族は$\sigma(A)=\{\emptyset,A,A^c,\Omega\}$である。事象$A,B$の独立とは、任意の$C\in\sigma(A)$、$D\in\sigma(B)$で$P(C\cap D)=P(C)P(D)$が成り立つことをいう。

    独立なら、$C=A$、$D=B$とおいて$P(A\cap B)=P(A)P(B)$を得る。

    逆に$P(A\cap B)=P(A)P(B)$を仮定する。$C$または$D$が$\emptyset$なら両辺とも$0$であり、$C$または$D$が$\Omega$なら両辺とももう一方の確率に等しい。残りは$A,A^c$と$B,B^c$の組である。加法性から$P(A\cap B^c)=P(A)-P(A\cap B)=P(A)-P(A)P(B)=P(A)P(B^c)$となる。$A$と$B$を入れ替えると$P(A^c\cap B)=P(A^c)P(B)$も得られる。さらに$P(A^c\cap B^c)=P(A^c)-P(A^c\cap B)=P(A^c)-P(A^c)P(B)=P(A^c)P(B^c)$である。よって$\sigma(A)$と$\sigma(B)$は独立である。
  strategy: Use the pi-lambda theorem to pass between generators and generated sigma-algebras.
  sketch:
  - 'translate: Interpret independence of events through the sigma-algebras they generate.'
  - 'derive: The forward direction specializes to A and B.'
  - 'apply_theorem: The backward direction uses that singletons are pi-systems and the pi-lambda theorem.'
  - 'conclude: Hence the two conditions are equivalent.'
  openmath: (forall (P A B) (-> (and (probability_measure P) (measurable_event A) (measurable_event B)) (<-> (indep_events P A B) (= (prob P (inter A B)) (* (prob P A) (prob P B))))))
  hard_negative:
    statement: 互いに素な事象は独立である。
    reason: P(A),P(B)>0で互いに素ならP(A∩B)=0≠P(A)P(B)なので独立でない。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (A B : Set Ω), MeasurableSet A → MeasurableSet B → (ProbabilityTheory.IndepSet A B μ ↔ μ.real (A ∩ B) = μ.real A * μ.real B)
  proof: |
    by
      intro Ω _ μ _ A B hA hB
      rw [ProbabilityTheory.indepSet_iff_measure_inter_eq_mul hA hB μ]
      constructor
      · intro h
        simp only [MeasureTheory.Measure.real]
        rw [h, ENNReal.toReal_mul]
      · intro h
        simp only [MeasureTheory.Measure.real] at h
        rw [← ENNReal.toReal_mul] at h
        exact (ENNReal.toReal_eq_toReal_iff' (MeasureTheory.measure_ne_top _ _)
          (ENNReal.mul_ne_top (MeasureTheory.measure_ne_top _ _) (MeasureTheory.measure_ne_top _ _))).mp h
- id: indep_event_compl
  kind: gap
  level: 2
  topic: 独立性・余事象
  statement: 確率測度$P$について、可測な事象$A$と$B$が独立ならば、$A$と$B^c$も独立である。
  statement_en: If the measurable events A and B are independent, then A and Bᶜ are independent.
  assumptions:
  - $P$は標本空間$\Omega$上の確率測度
  - $A$と$B$は可測な事象
  - $A$と$B$は独立
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の事象$A,B\in\mathcal{F}$
  conclusion: $A$と$B^c$は独立である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$A,B\in\mathcal{F}$を独立な事象とする。可測な事象の独立は積の等式と同値なので、$P(A\cap B)=P(A)P(B)$である。$A$は$A\cap B$と$A\cap B^c$の互いに素な和なので、$P(A\cap B^c)=P(A)-P(A\cap B)$である。したがって$P(A\cap B^c)=P(A)-P(A)P(B)=P(A)(1-P(B))=P(A)P(B^c)$となる。同じ同値性から、$A$と$B^c$は独立である。
  strategy: Subtract the independent intersection from P(A) and factor.
  sketch:
  - 'setup: Decompose A into A ∩ B and A ∩ Bᶜ.'
  - 'derive: Additivity gives P(A ∩ Bᶜ) = P(A) - P(A ∩ B).'
  - 'apply_theorem: Independence turns this into P(A)(1 - P(B)).'
  - 'conclude: Since 1 - P(B) = P(Bᶜ), the events A and Bᶜ are independent.'
  openmath: (forall (P A B) (-> (and (probability_measure P) (measurable_event A) (measurable_event B) (indep_events P A B)) (indep_events P A (set_compl B))))
  hard_negative:
    statement: AとB、AとCがそれぞれ独立ならば、AとB∩Cも独立である。
    reason: 対ごとの独立だけでは足りない。2枚のコインでA=「表裏が一致」、B=「1枚目が表」、C=「2枚目が表」とすると反例になる。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (A B : Set Ω), MeasurableSet A → MeasurableSet B → ProbabilityTheory.IndepSet A B μ → ProbabilityTheory.IndepSet A Bᶜ μ
  proof: |
    by
      intro Ω _ μ _ A B _ _ h
      rw [ProbabilityTheory.IndepSet_iff_Indep] at h ⊢
      refine ProbabilityTheory.indep_of_indep_of_le_right h ?_
      apply MeasurableSpace.generateFrom_le
      intro t ht
      rw [Set.mem_singleton_iff] at ht
      rw [ht]
      exact (MeasurableSpace.measurableSet_generateFrom (Set.mem_singleton B)).compl
- id: indep_event_cond_eq
  kind: gap
  level: 2
  topic: 独立性・条件付き確率
  statement: 確率測度$P$について、可測な事象$A$と$B$が独立で$P(A)>0$ならば、$P(B\mid A)=P(B)$である。
  statement_en: If the measurable events A and B are independent and P(A) > 0, then P(B|A) = P(B).
  assumptions:
  - $P$は標本空間$\Omega$上の確率測度
  - $A$と$B$は可測な事象
  - $A$と$B$は独立
  - $P(A)>0$
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の事象$A,B\in\mathcal{F}$
  conclusion: $P(B\mid A)=P(B)$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$A,B\in\mathcal{F}$を独立な事象とし、$P(A)>0$とする。条件付き確率の定義と独立性から$P(B\mid A)=P(A\cap B)/P(A)=P(A)P(B)/P(A)$である。$P(A)>0$なので約分でき、$P(B\mid A)=P(B)$を得る。
  strategy: Substitute the product formula into the definition of conditional probability.
  sketch:
  - 'translate: Write P(B|A) P(A) = P(A ∩ B).'
  - 'apply_theorem: Independence gives P(A ∩ B) = P(B) P(A).'
  - 'conclude: Cancel P(A) > 0.'
  openmath: (forall (P A B) (-> (and (probability_measure P) (measurable_event A) (measurable_event B) (indep_events P A B) (> (prob P A) 0)) (= (cond_prob P B A) (prob P B))))
  hard_negative:
    statement: 互いに素な事象A,BについてP(A)>0ならP(B|A)=P(B)である。
    reason: 互いに素ならP(B|A)=0であり、P(B)>0のときP(B)と異なる。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (A B : Set Ω), MeasurableSet A → MeasurableSet B → ProbabilityTheory.IndepSet A B μ → 0 < μ.real A → (ProbabilityTheory.cond μ A).real B = μ.real B
  proof: |
    by
      intro Ω _ μ _ A B hA _ h hPA
      have h1 : (ProbabilityTheory.cond μ A).real B * μ.real A = μ.real (A ∩ B) := by
        simp only [MeasureTheory.Measure.real]
        rw [← ENNReal.toReal_mul, ProbabilityTheory.cond_mul_eq_inter hA B μ]
      have h2 : μ.real (A ∩ B) = μ.real A * μ.real B := by
        simp only [MeasureTheory.Measure.real]
        rw [h.measure_inter_eq_mul, ENNReal.toReal_mul]
      have h3 : (ProbabilityTheory.cond μ A).real B * μ.real A = μ.real B * μ.real A := by
        rw [h1, h2, mul_comm]
      exact mul_right_cancel₀ hPA.ne' h3
- id: indep_fun_comp
  kind: gap
  level: 2
  topic: 独立性・確率変数の変換
  statement: 確率変数$X$と$Y$が独立で、$\varphi$と$\psi$が可測写像ならば、$\varphi\circ X$と$\psi\circ Y$も独立である。
  statement_en: If random variables X and Y are independent and φ, ψ are measurable maps, then φ(X) and ψ(Y) are independent.
  assumptions:
  - $P$は標本空間$\Omega$上の確率測度
  - $X:\Omega\to E$と$Y:\Omega\to E'$は独立
  - $\varphi:E\to F$と$\psi:E'\to F'$は可測
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の可測空間$E,E',F,F'$
  - 任意の確率変数$X,Y$
  - 任意の可測写像$\varphi,\psi$
  conclusion: $\varphi\circ X$と$\psi\circ Y$は独立である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$E,E',F,F'$を可測空間とする。$X:\Omega\to E$と$Y:\Omega\to E'$を独立な確率変数、$\varphi:E\to F$と$\psi:E'\to F'$を可測写像とする。

    可測集合$C\subseteq F$、$D\subseteq F'$をとる。このとき$\{\varphi\circ X\in C\}=\{X\in\varphi^{-1}(C)\}$、$\{\psi\circ Y\in D\}=\{Y\in\psi^{-1}(D)\}$である。$\varphi^{-1}(C)$と$\psi^{-1}(D)$は可測なので、$X$と$Y$の独立性から$P(\varphi\circ X\in C,\ \psi\circ Y\in D)=P(\varphi\circ X\in C)P(\psi\circ Y\in D)$を得る。$C,D$は任意なので、$\varphi\circ X$と$\psi\circ Y$は独立である。
  strategy: Pull events back through the measurable maps and use independence of X and Y.
  sketch:
  - 'setup: Fix measurable sets C and D in the target spaces.'
  - 'translate: Rewrite the events through the preimages under φ and ψ.'
  - 'apply_theorem: Apply independence of X and Y to those measurable preimages.'
  - 'conclude: The product formula is exactly independence of φ(X) and ψ(Y).'
  openmath: (forall (P X Y f g) (-> (and (probability_measure P) (indep_rv P X Y) (measurable_map f) (measurable_map g)) (indep_rv P (map_compose f X) (map_compose g Y))))
  hard_negative:
    statement: φ(X)とψ(Y)が独立ならXとYも独立である。
    reason: φとψが定数写像なら像は常に独立だが、XとYは任意である。
  target: |
    ∀ (Ω β β' γ γ' : Type*) [MeasurableSpace Ω] [MeasurableSpace β] [MeasurableSpace β'] [MeasurableSpace γ] [MeasurableSpace γ'] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (X : Ω → β) (Y : Ω → β') (φ : β → γ) (ψ : β' → γ'), ProbabilityTheory.IndepFun X Y μ → Measurable φ → Measurable ψ → ProbabilityTheory.IndepFun (φ ∘ X) (ψ ∘ Y) μ
  proof: |
    by
      intro Ω β β' γ γ' _ _ _ _ _ μ _ X Y φ ψ h hφ hψ
      exact h.comp hφ hψ
- id: expectation_linear
  kind: gap
  level: 2
  topic: 期待値・線形性
  statement: 可積分な実確率変数$X,Y$と実数$a,b$について、$E[aX+bY]=aE[X]+bE[Y]$が成り立つ。
  statement_en: For integrable random variables X, Y and real numbers a, b, E[aX + bY] = a E[X] + b E[Y].
  assumptions:
  - $P$は確率測度
  - $X$と$Y$は可積分
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の実確率変数$X,Y$
  - 任意の実数$a,b$
  conclusion: $E[aX+bY]=aE[X]+bE[Y]$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$X,Y$を可積分な実確率変数、$a,b\in\mathbb{R}$とする。$X,Y$が可積分なので、$aX$と$bY$も可積分である。積分の加法性と定数倍の性質から、$E[aX+bY]=E[aX]+E[bY]=aE[X]+bE[Y]$となる。この議論に独立性は現れない。
  strategy: Apply additivity and homogeneity of the integral.
  sketch:
  - 'setup: Note that aX and bY are integrable.'
  - 'apply_theorem: Additivity of the integral splits the sum.'
  - 'conclude: Homogeneity pulls out the constants a and b.'
  openmath: (forall (P X Y a b) (-> (and (probability_measure P) (integrable_rv X P) (integrable_rv Y P)) (= (expectation P (+ (* a X) (* b Y))) (+ (* a (expectation P X)) (* b (expectation P Y))))))
  hard_negative:
    statement: 可積分なX,YについてE[XY]=E[X]E[Y]が常に成り立つ。
    reason: 線形性と違い積の公式には独立性などが要る。X=Yが非定数ならE[X²]>E[X]²である。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (X Y : Ω → ℝ) (a b : ℝ), MeasureTheory.Integrable X μ → MeasureTheory.Integrable Y μ → ∫ ω, (a * X ω + b * Y ω) ∂μ = a * ∫ ω, X ω ∂μ + b * ∫ ω, Y ω ∂μ
  proof: |
    by
      intro Ω _ μ _ X Y a b hX hY
      rw [MeasureTheory.integral_add (hX.const_mul a) (hY.const_mul b),
        MeasureTheory.integral_const_mul, MeasureTheory.integral_const_mul]
- id: expectation_mono_ae
  kind: gap
  level: 2
  topic: 期待値・単調性
  statement: 可積分な実確率変数$X,Y$がほとんど確実に$X\leq Y$を満たすならば、$E[X]\leq E[Y]$である。
  statement_en: If integrable random variables satisfy X ≤ Y almost surely, then E[X] ≤ E[Y].
  assumptions:
  - $P$は確率測度
  - $X$と$Y$は可積分
  - ほとんど確実に$X\leq Y$
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の実確率変数$X,Y$
  conclusion: $E[X]\leq E[Y]$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$X,Y$を可積分な実確率変数とし、ほとんど確実に$X\leq Y$とする。$Y-X$は可積分で、ほとんど確実に非負である。ほとんど確実に非負な関数の積分は非負なので、$0\leq E[Y-X]$である。線形性から$E[Y-X]=E[Y]-E[X]$なので、$E[X]\leq E[Y]$を得る。
  strategy: Reduce to nonnegativity of the integral of Y - X.
  sketch:
  - 'setup: Consider Y - X, which is integrable and almost surely nonnegative.'
  - 'apply_theorem: The integral of an almost surely nonnegative function is nonnegative.'
  - 'conclude: Linearity gives E[Y] - E[X] ≥ 0.'
  openmath: (forall (P X Y) (-> (and (probability_measure P) (integrable_rv X P) (integrable_rv Y P) (ae_le P X Y)) (<= (expectation P X) (expectation P Y))))
  hard_negative:
    statement: E[X]≤E[Y]ならばほとんど確実にX≤Yである。
    reason: Xが±1を等確率でとり、Y=0ならE[X]=E[Y]だが、確率1/2でX>Yとなる。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (X Y : Ω → ℝ), MeasureTheory.Integrable X μ → MeasureTheory.Integrable Y μ → (∀ᵐ ω ∂μ, X ω ≤ Y ω) → ∫ ω, X ω ∂μ ≤ ∫ ω, Y ω ∂μ
  proof: |
    by
      intro Ω _ μ _ X Y hX hY h
      exact MeasureTheory.integral_mono_ae hX hY h
- id: expectation_indicator
  kind: gap
  level: 2
  topic: 期待値・指示関数
  statement: 確率測度$P$と可測な事象$A$の指示関数$1_A$について、$E[1_A]=P(A)$が成り立つ。
  statement_en: For a measurable event A, the expectation of its indicator function equals P(A).
  assumptions:
  - $P$は標本空間$\Omega$上の確率測度
  - $A$は可測な事象
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の事象$A\in\mathcal{F}$
  conclusion: $E[1_A]=P(A)$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$A\in\mathcal{F}$を事象とする。指示関数$1_A$は$A$上で$1$、$A^c$上で$0$をとる単関数である。単関数の積分の定義から、$E[1_A]=1\cdot P(A)+0\cdot P(A^c)=P(A)$である。
  strategy: Compute the integral of a two-valued simple function.
  sketch:
  - 'translate: View the indicator as a simple function with values 1 and 0.'
  - 'derive: Its integral is 1·P(A) + 0·P(Aᶜ).'
  - 'conclude: This equals P(A).'
  openmath: (forall (P A) (-> (and (probability_measure P) (measurable_event A)) (= (expectation P (indicator_of A)) (prob P A))))
  hard_negative:
    statement: E[1_A 1_B]=P(A)P(B)が常に成り立つ。
    reason: 左辺はP(A∩B)であり、積に等しいのはAとBが独立なときである。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (A : Set Ω), MeasurableSet A → ∫ ω, A.indicator (1 : Ω → ℝ) ω ∂μ = μ.real A
  proof: |
    by
      intro Ω _ μ _ A hA
      exact MeasureTheory.integral_indicator_one hA
- id: expectation_indep_mul
  kind: textbook
  level: 2
  topic: 期待値・独立な確率変数の積
  statement: 可積分な実確率変数$X$と$Y$が独立ならば、$XY$も可積分で$E[XY]=E[X]E[Y]$である。
  statement_en: If integrable random variables X and Y are independent, then XY is integrable and E[XY] = E[X] E[Y].
  assumptions:
  - $P$は確率測度
  - $X$と$Y$は可積分
  - $X$と$Y$は独立
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の実確率変数$X,Y$
  conclusion: $XY$は可積分で$E[XY]=E[X]E[Y]$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$X,Y$を可積分で独立な実確率変数とする。まず$\mathbb{R}$上の非負可測関数$f,g$について、$[0,\infty]$の値で$E[f(X)g(Y)]=E[f(X)]E[g(Y)]$を示す。

    $f=1_C$、$g=1_D$（$C,D$は可測集合）のとき、この等式は$P(X\in C,\ Y\in D)=P(X\in C)P(Y\in D)$であり、独立性そのものである。両辺は$f$と$g$のそれぞれについて線形なので、非負単関数でも成り立つ。一般の$f,g$には、各点で単調に収束する非負単関数の列$f_n\uparrow f$、$g_n\uparrow g$をとる。このとき$f_n(X)g_n(Y)\uparrow f(X)g(Y)$なので、単調収束定理により極限でも等式が成り立つ。

    $f=g=|\cdot|$とおくと$E[|XY|]=E[|X|]E[|Y|]<\infty$となり、$XY$は可積分である。次に$X=X^+-X^-$、$Y=Y^+-Y^-$と正部分と負部分に分ける。$X^\pm,Y^\pm$は$X,Y$の非負可測関数で、いずれも可積分である。したがって$E[X^{\pm}Y^{\pm}]=E[X^{\pm}]E[Y^{\pm}]$が符号の4通りすべてで成り立つ。$XY=X^+Y^+-X^+Y^--X^-Y^++X^-Y^-$の期待値を線形性で展開すると、$E[XY]=(E[X^+]-E[X^-])(E[Y^+]-E[Y^-])=E[X]E[Y]$を得る。
  strategy: Run the standard machine from indicators to integrable functions.
  sketch:
  - 'setup: For indicators of events the identity is the definition of independence.'
  - 'derive: Extend to simple functions by bilinearity.'
  - 'apply_theorem: Extend to nonnegative measurable functions by monotone convergence.'
  - 'derive: Applying this to |X| and |Y| gives integrability of XY.'
  - 'conclude: Split into positive and negative parts to finish.'
  openmath: (forall (P X Y) (-> (and (probability_measure P) (integrable_rv X P) (integrable_rv Y P) (indep_rv P X Y)) (and (integrable_rv (* X Y) P) (= (expectation P (* X Y)) (* (expectation P X) (expectation P Y))))))
  hard_negative:
    statement: E[XY]=E[X]E[Y]ならばXとYは独立である。
    reason: Xが-1,0,1を等確率でとりY=X²なら積の等式は成り立つが、YはXで決まるので独立でない。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (X Y : Ω → ℝ), MeasureTheory.Integrable X μ → MeasureTheory.Integrable Y μ → ProbabilityTheory.IndepFun X Y μ → MeasureTheory.Integrable (fun ω => X ω * Y ω) μ ∧ ∫ ω, X ω * Y ω ∂μ = (∫ ω, X ω ∂μ) * ∫ ω, Y ω ∂μ
  proof: |
    by
      intro Ω _ μ _ X Y hX hY h
      exact ⟨h.integrable_mul hX hY, h.integral_fun_mul_eq_mul_integral hX.1 hY.1⟩
- id: variance_eq_sub
  kind: gap
  level: 2
  topic: 分散・基本公式
  statement: 2乗可積分な実確率変数$X$について、$V[X]=E[X^2]-E[X]^2$が成り立つ。
  statement_en: For a square-integrable random variable X, Var(X) = E[X²] - E[X]².
  assumptions:
  - $P$は確率測度
  - $X$は2乗可積分
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の実確率変数$X$
  conclusion: $V[X]=E[X^2]-E[X]^2$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$X$を2乗可積分な実確率変数とする。$|X|\leq(1+X^2)/2$なので$X$は可積分である。$m=E[X]$とおくと、$V[X]=E[(X-m)^2]$で、$(X-m)^2=X^2-2mX+m^2$である。各項は可積分なので、線形性から$V[X]=E[X^2]-2m\cdot m+m^2=E[X^2]-m^2$となる。$m=E[X]$なので結論を得る。
  strategy: Expand the square in the definition and apply linearity.
  sketch:
  - 'setup: Put m = E[X].'
  - 'derive: Expand (X - m)² = X² - 2mX + m².'
  - 'apply_theorem: Take expectations with linearity.'
  - 'conclude: Simplify to E[X²] - m².'
  openmath: (forall (P X) (-> (and (probability_measure P) (square_integrable_rv X P)) (= (variance P X) (- (expectation P (^ X 2)) (^ (expectation P X) 2)))))
  hard_negative:
    statement: V[X]=E[X²]が常に成り立つ。
    reason: これはE[X]=0のときに限る。定数X=1ならV[X]=0だがE[X²]=1である。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (X : Ω → ℝ), MeasureTheory.MemLp X 2 μ → ProbabilityTheory.variance X μ = ∫ ω, X ω ^ 2 ∂μ - (∫ ω, X ω ∂μ) ^ 2
  proof: |
    by
      intro Ω _ μ _ X hX
      exact ProbabilityTheory.variance_eq_sub hX
- id: variance_affine
  kind: gap
  level: 2
  topic: 分散・一次変換
  statement: 2乗可積分な実確率変数$X$と実数$a,b$について、$V[aX+b]=a^2V[X]$が成り立つ。
  statement_en: For a square-integrable random variable X and real numbers a, b, Var(aX + b) = a² Var(X).
  assumptions:
  - $P$は確率測度
  - $X$は2乗可積分
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の実確率変数$X$
  - 任意の実数$a,b$
  conclusion: $V[aX+b]=a^2V[X]$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$X$を2乗可積分な実確率変数、$a,b\in\mathbb{R}$とする。$X$は可積分なので、$E[aX+b]=aE[X]+b$である。したがって$(aX+b)-E[aX+b]=a(X-E[X])$となる。両辺を2乗して期待値をとると、$V[aX+b]=a^2E[(X-E[X])^2]=a^2V[X]$を得る。
  strategy: The shift cancels when centering, and the scale factor comes out squared.
  sketch:
  - 'derive: Compute E[aX + b] = a E[X] + b.'
  - 'derive: Hence the centered variable is a (X - E[X]).'
  - 'conclude: Squaring and taking expectations gives a² Var(X).'
  openmath: (forall (P X a b) (-> (and (probability_measure P) (square_integrable_rv X P)) (= (variance P (+ (* a X) b)) (* (^ a 2) (variance P X)))))
  hard_negative:
    statement: V[aX+b]=aV[X]+bが成り立つ。
    reason: 定数は分散に影響せず係数は2乗で効く。a=2,b=0でV[2X]=4V[X]である。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (X : Ω → ℝ) (a b : ℝ), MeasureTheory.MemLp X 2 μ → ProbabilityTheory.variance (fun ω => a * X ω + b) μ = a ^ 2 * ProbabilityTheory.variance X μ
  proof: |
    by
      intro Ω _ μ _ X a b hX
      rw [ProbabilityTheory.variance_add_const (hX.1.const_mul a) b]
      exact ProbabilityTheory.variance_const_mul a X μ
- id: variance_add_covariance
  kind: gap
  level: 2
  topic: 分散・共分散との関係
  statement: 2乗可積分な実確率変数$X,Y$について、$V[X+Y]=V[X]+2\operatorname{Cov}(X,Y)+V[Y]$が成り立つ。
  statement_en: For square-integrable random variables X and Y, Var(X + Y) = Var(X) + 2 Cov(X, Y) + Var(Y).
  assumptions:
  - $P$は確率測度
  - $X$と$Y$は2乗可積分
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の実確率変数$X,Y$
  conclusion: $V[X+Y]=V[X]+2\operatorname{Cov}(X,Y)+V[Y]$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$X,Y$を2乗可積分な実確率変数とする。$U=X-E[X]$、$W=Y-E[Y]$とおくと、$(X+Y)-E[X+Y]=U+W$である。$|UW|\leq(U^2+W^2)/2$なので$UW$は可積分である。$(U+W)^2=U^2+2UW+W^2$の期待値をとると、$E[U^2]=V[X]$、$E[W^2]=V[Y]$、$E[UW]=\operatorname{Cov}(X,Y)$から$V[X+Y]=V[X]+2\operatorname{Cov}(X,Y)+V[Y]$を得る。
  strategy: Center both variables and expand the square of the sum.
  sketch:
  - 'setup: Center X and Y to get U and W.'
  - 'derive: The centered sum is U + W.'
  - 'derive: Expand (U + W)² and take expectations.'
  - 'conclude: Identify the terms as the variances and the covariance.'
  openmath: (forall (P X Y) (-> (and (probability_measure P) (square_integrable_rv X P) (square_integrable_rv Y P)) (= (variance P (+ X Y)) (+ (variance P X) (* 2 (covariance P X Y)) (variance P Y)))))
  hard_negative:
    statement: 任意のX,YでV[X+Y]=V[X]+V[Y]である。
    reason: 無相関でないと成り立たない。Y=XならV[2X]=4V[X]で、右辺の2V[X]と異なる。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (X Y : Ω → ℝ), MeasureTheory.MemLp X 2 μ → MeasureTheory.MemLp Y 2 μ → ProbabilityTheory.variance (fun ω => X ω + Y ω) μ = ProbabilityTheory.variance X μ + 2 * ProbabilityTheory.covariance X Y μ + ProbabilityTheory.variance Y μ
  proof: |
    by
      intro Ω _ μ _ X Y hX hY
      exact ProbabilityTheory.variance_fun_add hX hY
- id: variance_indep_sum
  kind: textbook
  level: 2
  topic: 分散・独立な和
  statement: 対ごとに独立で2乗可積分な実確率変数の有限族$(X_i)_{i\in s}$について、$V\left[\sum_{i\in s}X_i\right]=\sum_{i\in s}V[X_i]$が成り立つ。
  statement_en: The variance of a finite sum of pairwise independent square-integrable random variables equals the sum of their variances.
  assumptions:
  - $P$は確率測度
  - $s$は有限な添字集合
  - 各$X_i$は2乗可積分
  - $(X_i)_{i\in s}$は対ごとに独立
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の有限集合$s$
  - 任意の実確率変数の族$(X_i)_{i\in s}$
  conclusion: $V\left[\sum_{i\in s}X_i\right]=\sum_{i\in s}V[X_i]$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$s$を有限集合とし、$(X_i)_{i\in s}$を対ごとに独立で2乗可積分な実確率変数の族とする。$U_i=X_i-E[X_i]$とおくと、$\sum_{i\in s}X_i$から期待値を引いたものは$\sum_{i\in s}U_i$である。2乗を展開すると、$V\left[\sum_{i\in s}X_i\right]=\sum_{i\in s}E[U_i^2]+\sum_{i\neq j}E[U_iU_j]$となる。

    $i\neq j$のとき、$U_i$と$U_j$はそれぞれ$X_i$と$X_j$の可測関数なので独立で、どちらも可積分である。独立な可積分確率変数の積の期待値は期待値の積なので、$E[U_iU_j]=E[U_i]E[U_j]=0$である。よって残るのは$\sum_{i\in s}E[U_i^2]=\sum_{i\in s}V[X_i]$である。
  strategy: Expand the square of the centered sum; independence kills the cross terms.
  sketch:
  - 'setup: Center each variable as U_i = X_i - E[X_i].'
  - 'derive: Expand the square of the sum into diagonal and off-diagonal terms.'
  - 'apply_theorem: Pairwise independence gives E[U_i U_j] = 0 for i ≠ j.'
  - 'conclude: Only the diagonal terms remain, which are the variances.'
  openmath: (forall (P s X) (-> (and (probability_measure P) (finite_set s) (forall (i) (-> (in i s) (square_integrable_rv (seq_value X i) P))) (pairwise_indep_rv P X)) (= (variance P (sum s (lambda (i) (seq_value X i)))) (sum s (lambda (i) (variance P (seq_value X i)))))))
  hard_negative:
    statement: 独立性なしで分散は和について加法的である。
    reason: 交差項が残る。X_2=-X_1なら和は0で分散0だが、右辺は2V[X_1]である。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (ι : Type*) (s : Finset ι) (X : ι → Ω → ℝ), (∀ i ∈ s, MeasureTheory.MemLp (X i) 2 μ) → Set.Pairwise (↑s : Set ι) (fun i j => ProbabilityTheory.IndepFun (X i) (X j) μ) → ProbabilityTheory.variance (fun ω => ∑ i ∈ s, X i ω) μ = ∑ i ∈ s, ProbabilityTheory.variance (X i) μ
  proof: |
    by
      intro Ω _ μ _ ι s X hX h
      have e : (fun ω => ∑ i ∈ s, X i ω) = ∑ i ∈ s, X i := by
        ext ω
        simp [Finset.sum_apply]
      rw [e]
      exact ProbabilityTheory.IndepFun.variance_sum hX h
- id: variance_zero_ae_const
  kind: gap
