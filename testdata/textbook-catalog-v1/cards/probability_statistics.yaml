      intro Ω _ μ _ X a b hX
      rw [ProbabilityTheory.variance_add_const (hX.1.const_mul a) b]
      exact ProbabilityTheory.variance_const_mul a X μ
- id: variance_add_covariance
  kind: gap
  level: 2
  topic: 分散・共分散との関係
  statement: 2乗可積分なX,Yについて、V[X+Y]=V[X]+2Cov(X,Y)+V[Y]が成り立つ。
  statement_en: For square-integrable random variables X and Y, Var(X + Y) = Var(X) + 2 Cov(X, Y) + Var(Y).
  assumptions: [Pは確率測度, XとYは2乗可積分]
  quantifiers: [任意の確率空間と確率変数X, Y]
  conclusion: V[X+Y]=V[X]+2Cov(X,Y)+V[Y]である。
  answer: |
    U=X-E[X]、W=Y-E[Y]とおくと、X+Yの中心化はU+Wである。(U+W)²=U²+2UW+W²の期待値をとると、E[U²]=V[X]、E[W²]=V[Y]、E[UW]=Cov(X,Y)から結論を得る。
  strategy: Center both variables and expand the square of the sum.
  sketch:
    - "setup: Center X and Y to get U and W."
    - "derive: The centered sum is U + W."
    - "derive: Expand (U + W)² and take expectations."
    - "conclude: Identify the terms as the variances and the covariance."
  openmath: (forall (P X Y) (-> (and (probability_measure P) (square_integrable_rv X P) (square_integrable_rv Y P)) (= (variance P (+ X Y)) (+ (variance P X) (* 2 (covariance P X Y)) (variance P Y)))))
  hard_negative:
    statement: 任意のX,YでV[X+Y]=V[X]+V[Y]である。
    reason: 無相関でないと成り立たない。Y=XならV[2X]=4V[X]で、右辺の2V[X]と異なる。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (X Y : Ω → ℝ), MeasureTheory.MemLp X 2 μ → MeasureTheory.MemLp Y 2 μ → ProbabilityTheory.variance (fun ω => X ω + Y ω) μ = ProbabilityTheory.variance X μ + 2 * ProbabilityTheory.covariance X Y μ + ProbabilityTheory.variance Y μ
  proof: |
    by
      intro Ω _ μ _ X Y hX hY
      exact ProbabilityTheory.variance_fun_add hX hY
- id: variance_indep_sum
  kind: textbook
  level: 2
  topic: 分散・独立な和
  statement: 対ごとに独立で2乗可積分な確率変数の有限和の分散は、各分散の和に等しい。
  statement_en: The variance of a finite sum of pairwise independent square-integrable random variables equals the sum of their variances.
  assumptions: [Pは確率測度, 各X_iは2乗可積分, X_iは対ごとに独立]
  quantifiers: [任意の確率空間, 有限な添字集合s, 確率変数族X]
  conclusion: V[Σ_{i∈s}X_i]=Σ_{i∈s}V[X_i]である。
  answer: |
    Σ_iX_iの中心化はΣ_iU_i（U_i=X_i-E[X_i]）である。2乗を展開するとV[Σ_iX_i]=Σ_iE[U_i²]+Σ_{i≠j}E[U_iU_j]となる。i≠jではX_iとX_jが独立なのでE[U_iU_j]=E[U_i]E[U_j]=0である。よって残るのは各分散の和である。
  strategy: Expand the square of the centered sum; independence kills the cross terms.
  sketch:
    - "setup: Center each variable as U_i = X_i - E[X_i]."
    - "derive: Expand the square of the sum into diagonal and off-diagonal terms."
    - "apply_theorem: Pairwise independence gives E[U_i U_j] = 0 for i ≠ j."
    - "conclude: Only the diagonal terms remain, which are the variances."
  openmath: (forall (P s X) (-> (and (probability_measure P) (finite_set s) (forall (i) (-> (in i s) (square_integrable_rv (seq_value X i) P))) (pairwise_indep_rv P X)) (= (variance P (sum s (lambda (i) (seq_value X i)))) (sum s (lambda (i) (variance P (seq_value X i)))))))
  hard_negative:
    statement: 独立性なしで分散は和について加法的である。
    reason: 交差項が残る。X_2=-X_1なら和は0で分散0だが、右辺は2V[X_1]である。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (ι : Type*) (s : Finset ι) (X : ι → Ω → ℝ), (∀ i ∈ s, MeasureTheory.MemLp (X i) 2 μ) → Set.Pairwise (↑s : Set ι) (fun i j => ProbabilityTheory.IndepFun (X i) (X j) μ) → ProbabilityTheory.variance (fun ω => ∑ i ∈ s, X i ω) μ = ∑ i ∈ s, ProbabilityTheory.variance (X i) μ
  proof: |
    by
      intro Ω _ μ _ ι s X hX h
      have e : (fun ω => ∑ i ∈ s, X i ω) = ∑ i ∈ s, X i := by
        ext ω
        simp [Finset.sum_apply]
      rw [e]
      exact ProbabilityTheory.IndepFun.variance_sum hX h
