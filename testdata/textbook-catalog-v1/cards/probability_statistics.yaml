  topic: 分散・退化
  statement: 2乗可積分な実確率変数$X$の分散が$0$ならば、ほとんど確実に$X=E[X]$である。
  statement_en: If a square-integrable random variable X has variance 0, then X = E[X] almost surely.
  assumptions:
  - $P$は確率測度
  - $X$は2乗可積分
  - $V[X]=0$
  quantifiers:
  - 任意の確率空間$(\Omega,\mathcal{F},P)$
  - 任意の実確率変数$X$
  conclusion: ほとんど確実に$X=E[X]$である。
  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$X$を$V[X]=0$である2乗可積分な実確率変数とする。このとき$E[(X-E[X])^2]=0$で、$(X-E[X])^2$は非負である。非負可測関数の積分が$0$ならその関数はほとんど至るところ$0$なので、ほとんど確実に$X=E[X]$である。
  strategy: A nonnegative function with zero integral vanishes almost everywhere.
  sketch:
  - 'translate: Write the hypothesis as E[(X - E[X])²] = 0.'
  - 'apply_theorem: A nonnegative function with zero integral is zero almost everywhere.'
  - 'conclude: Therefore X = E[X] almost surely.'
