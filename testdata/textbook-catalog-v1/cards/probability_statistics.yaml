  target: |
    ∀ (Ω β β' γ γ' : Type*) [MeasurableSpace Ω] [MeasurableSpace β] [MeasurableSpace β'] [MeasurableSpace γ] [MeasurableSpace γ'] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (X : Ω → β) (Y : Ω → β') (φ : β → γ) (ψ : β' → γ'), ProbabilityTheory.IndepFun X Y μ → Measurable φ → Measurable ψ → ProbabilityTheory.IndepFun (φ ∘ X) (ψ ∘ Y) μ
  proof: |
