  kind: gap
  level: 2
  topic: 分散・一次変換
  statement: 2乗可積分なXと実数a,bについて、V[aX+b]=a²V[X]が成り立つ。
  statement_en: For a square-integrable random variable X and real numbers a, b, Var(aX + b) = a² Var(X).
  assumptions: [Pは確率測度, Xは2乗可積分]
  quantifiers: [任意の確率空間, 確率変数X, 実数a, b]
  conclusion: V[aX+b]=a²V[X]である。
  answer: |
    E[aX+b]=aE[X]+bなので、(aX+b)-E[aX+b]=a(X-E[X])である。両辺を2乗して期待値をとるとV[aX+b]=a²E[(X-E[X])²]=a²V[X]となる。
  strategy: The shift cancels when centering, and the scale factor comes out squared.
  sketch:
    - "derive: Compute E[aX + b] = a E[X] + b."
    - "derive: Hence the centered variable is a (X - E[X])."
    - "conclude: Squaring and taking expectations gives a² Var(X)."
  openmath: (forall (P X a b) (-> (and (probability_measure P) (square_integrable_rv X P)) (= (variance P (+ (* a X) b)) (* (^ a 2) (variance P X)))))
  hard_negative:
    statement: V[aX+b]=aV[X]+bが成り立つ。
