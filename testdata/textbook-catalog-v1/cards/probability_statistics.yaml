  hard_negative:
    statement: V[X]=E[X²]が常に成り立つ。
    reason: これはE[X]=0のときに限る。定数X=1ならV[X]=0だがE[X²]=1である。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (X : Ω → ℝ), MeasureTheory.MemLp X 2 μ → ProbabilityTheory.variance X μ = ∫ ω, X ω ^ 2 ∂μ - (∫ ω, X ω ∂μ) ^ 2
  proof: |
    by
      intro Ω _ μ _ X hX
      exact ProbabilityTheory.variance_eq_sub hX
