  answer: |
    $(\Omega,\mathcal{F},P)$を確率空間、$X,Y$を独立で2乗可積分な実確率変数とする。このとき$X,Y$は可積分で、$\operatorname{Cov}(X,Y)=E[XY]-E[X]E[Y]$である。独立な可積分確率変数の積の期待値は期待値の積なので、$E[XY]=E[X]E[Y]$となる。よって$\operatorname{Cov}(X,Y)=0$である。
