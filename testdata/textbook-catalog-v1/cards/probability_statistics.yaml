- id: expectation_linear
  kind: gap
  level: 2
  topic: 期待値・線形性
  statement: 可積分な確率変数X,Yと実数a,bについて、E[aX+bY]=aE[X]+bE[Y]が成り立つ。
  statement_en: For integrable random variables X, Y and real numbers a, b, E[aX + bY] = a E[X] + b E[Y].
  assumptions: [Pは確率測度, XとYは可積分]
  quantifiers: [任意の確率空間, 確率変数X, Y, 実数a, b]
  conclusion: E[aX+bY]=aE[X]+bE[Y]である。
  answer: |
    XとYが可積分なのでaXとbYも可積分である。積分の加法性と定数倍の性質からE[aX+bY]=E[aX]+E[bY]=aE[X]+bE[Y]となる。独立性はこの議論に現れない。
  strategy: Apply additivity and homogeneity of the integral.
  sketch:
    - "setup: Note that aX and bY are integrable."
    - "apply_theorem: Additivity of the integral splits the sum."
    - "conclude: Homogeneity pulls out the constants a and b."
  openmath: (forall (P X Y a b) (-> (and (probability_measure P) (integrable_rv X P) (integrable_rv Y P)) (= (expectation P (+ (* a X) (* b Y))) (+ (* a (expectation P X)) (* b (expectation P Y))))))
  hard_negative:
    statement: 可積分なX,YについてE[XY]=E[X]E[Y]が常に成り立つ。
    reason: 線形性と違い積の公式には独立性などが要る。X=Yが非定数ならE[X²]>E[X]²である。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (X Y : Ω → ℝ) (a b : ℝ), MeasureTheory.Integrable X μ → MeasureTheory.Integrable Y μ → ∫ ω, (a * X ω + b * Y ω) ∂μ = a * ∫ ω, X ω ∂μ + b * ∫ ω, Y ω ∂μ
  proof: |
    by
      intro Ω _ μ _ X Y a b hX hY
      rw [MeasureTheory.integral_add (hX.const_mul a) (hY.const_mul b),
        MeasureTheory.integral_const_mul, MeasureTheory.integral_const_mul]
- id: expectation_mono_ae
  kind: gap
  level: 2
  topic: 期待値・単調性
  statement: 可積分なX,Yがほとんど確実にX≤Yを満たすならば、E[X]≤E[Y]である。
  statement_en: If integrable random variables satisfy X ≤ Y almost surely, then E[X] ≤ E[Y].
  assumptions: [Pは確率測度, XとYは可積分, ほとんど確実にX≤Y]
  quantifiers: [任意の確率空間と確率変数X, Y]
  conclusion: E[X]≤E[Y]である。
  answer: |
    Y-Xは可積分で、ほとんど確実に非負である。ほとんど確実に非負な関数の積分は非負なので0≤E[Y-X]である。線形性からE[Y-X]=E[Y]-E[X]となり、E[X]≤E[Y]を得る。
  strategy: Reduce to nonnegativity of the integral of Y - X.
  sketch:
    - "setup: Consider Y - X, which is integrable and almost surely nonnegative."
    - "apply_theorem: The integral of an almost surely nonnegative function is nonnegative."
    - "conclude: Linearity gives E[Y] - E[X] ≥ 0."
  openmath: (forall (P X Y) (-> (and (probability_measure P) (integrable_rv X P) (integrable_rv Y P) (ae_le P X Y)) (<= (expectation P X) (expectation P Y))))
  hard_negative:
    statement: E[X]≤E[Y]ならばほとんど確実にX≤Yである。
    reason: Xが±1を等確率でとり、Y=0ならE[X]=E[Y]だが、確率1/2でX>Yとなる。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (X Y : Ω → ℝ), MeasureTheory.Integrable X μ → MeasureTheory.Integrable Y μ → (∀ᵐ ω ∂μ, X ω ≤ Y ω) → ∫ ω, X ω ∂μ ≤ ∫ ω, Y ω ∂μ
  proof: |
    by
      intro Ω _ μ _ X Y hX hY h
      exact MeasureTheory.integral_mono_ae hX hY h
- id: expectation_indicator
  kind: gap
  level: 2
  topic: 期待値・指示関数
  statement: 事象Aの指示関数1_Aについて、E[1_A]=P(A)が成り立つ。
  statement_en: For a measurable event A, the expectation of its indicator function equals P(A).
  assumptions: [Pは確率測度, Aは可測な事象]
  quantifiers: [任意の確率空間と事象A]
  conclusion: E[1_A]=P(A)である。
  answer: |
    1_AはA上で1、Aの外で0をとる単関数である。単関数の積分の定義から、その積分は1·P(A)+0·P(Aᶜ)=P(A)である。
  strategy: Compute the integral of a two-valued simple function.
  sketch:
    - "translate: View the indicator as a simple function with values 1 and 0."
    - "derive: Its integral is 1·P(A) + 0·P(Aᶜ)."
    - "conclude: This equals P(A)."
  openmath: (forall (P A) (-> (and (probability_measure P) (measurable_event A)) (= (expectation P (indicator_of A)) (prob P A))))
  hard_negative:
    statement: E[1_A 1_B]=P(A)P(B)が常に成り立つ。
    reason: 左辺はP(A∩B)であり、積に等しいのはAとBが独立なときである。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (A : Set Ω), MeasurableSet A → ∫ ω, A.indicator (1 : Ω → ℝ) ω ∂μ = μ.real A
  proof: |
    by
      intro Ω _ μ _ A hA
      exact MeasureTheory.integral_indicator_one hA
- id: expectation_indep_mul
  kind: textbook
  level: 2
  topic: 期待値・独立な確率変数の積
  statement: 可積分な確率変数XとYが独立ならば、XYも可積分でE[XY]=E[X]E[Y]である。
  statement_en: If integrable random variables X and Y are independent, then XY is integrable and E[XY] = E[X] E[Y].
  assumptions: [Pは確率測度, XとYは可積分, XとYは独立]
  quantifiers: [任意の確率空間と確率変数X, Y]
  conclusion: XYは可積分でE[XY]=E[X]E[Y]である。
  answer: |
    指示関数の場合は独立性の定義そのものである。線形性から単関数に、単調収束定理から非負可測関数に広がる。これを|X|,|Y|に適用するとE[|XY|]=E[|X|]E[|Y|]<∞なのでXYは可積分である。正部分と負部分に分けて線形性を使うと、一般のXとYでE[XY]=E[X]E[Y]を得る。
  strategy: Run the standard machine from indicators to integrable functions.
  sketch:
    - "setup: For indicators of events the identity is the definition of independence."
    - "derive: Extend to simple functions by bilinearity."
    - "apply_theorem: Extend to nonnegative measurable functions by monotone convergence."
    - "derive: Applying this to |X| and |Y| gives integrability of XY."
    - "conclude: Split into positive and negative parts to finish."
  openmath: (forall (P X Y) (-> (and (probability_measure P) (integrable_rv X P) (integrable_rv Y P) (indep_rv P X Y)) (and (integrable_rv (* X Y) P) (= (expectation P (* X Y)) (* (expectation P X) (expectation P Y))))))
  hard_negative:
    statement: E[XY]=E[X]E[Y]ならばXとYは独立である。
    reason: Xが-1,0,1を等確率でとりY=X²なら積の等式は成り立つが、YはXで決まるので独立でない。
  target: |
    ∀ (Ω : Type*) [MeasurableSpace Ω] (μ : MeasureTheory.Measure Ω) [MeasureTheory.IsProbabilityMeasure μ] (X Y : Ω → ℝ), MeasureTheory.Integrable X μ → MeasureTheory.Integrable Y μ → ProbabilityTheory.IndepFun X Y μ → MeasureTheory.Integrable (fun ω => X ω * Y ω) μ ∧ ∫ ω, X ω * Y ω ∂μ = (∫ ω, X ω ∂μ) * ∫ ω, Y ω ∂μ
  proof: |
    by
      intro Ω _ μ _ X Y hX hY h
      exact ⟨h.integrable_mul hX hY, h.integral_fun_mul_eq_mul_integral hX.1 hY.1⟩
- id: variance_eq_sub
  kind: gap
  level: 2
  topic: 分散・基本公式
  statement: 2乗可積分な確率変数Xについて、V[X]=E[X²]-E[X]²が成り立つ。
  statement_en: For a square-integrable random variable X, Var(X) = E[X²] - E[X]².
  assumptions: [Pは確率測度, Xは2乗可積分]
  quantifiers: [任意の確率空間と確率変数X]
  conclusion: V[X]=E[X²]-E[X]²である。
  answer: |
    m=E[X]とおくと(X-m)²=X²-2mX+m²である。両辺の期待値をとり線形性を使うとV[X]=E[X²]-2m·m+m²=E[X²]-m²を得る。
  strategy: Expand the square in the definition and apply linearity.
  sketch:
    - "setup: Put m = E[X]."
    - "derive: Expand (X - m)² = X² - 2mX + m²."
    - "apply_theorem: Take expectations with linearity."
    - "conclude: Simplify to E[X²] - m²."
