- id: continuous_iff_components
  kind: gap
  level: 1
  topic: 多変数関数・連続性と成分
  statement: 写像$f:\mathbb{R}^n\to\mathbb{R}^m$が連続であることと、$f$の各成分関数が連続であることは同値である。
  statement_en: A map f from R^n to R^m is continuous if and only if each of its component functions is continuous.
  assumptions:
  - $f:\mathbb{R}^n\to\mathbb{R}^m$
  quantifiers:
  - 任意の$n,m\in\mathbb{N}$と写像$f:\mathbb{R}^n\to\mathbb{R}^m$
  conclusion: $f$が連続であることと、全ての$i$で$f_i$が連続であることは同値である。
  answer: |
    $n,m\in\mathbb{N}$とし、$f:\mathbb{R}^n\to\mathbb{R}^m$の成分関数を$f_1,\ldots,f_m$とする。$\mathbb{R}^m$のノルムはユークリッドノルムとする。

    各点$x,a\in\mathbb{R}^n$と各$i$について、$|f_i(x)-f_i(a)|\leq\|f(x)-f(a)\|\leq\sum_j|f_j(x)-f_j(a)|$が成り立つ。左の不等式から、$f$が$a$で連続なら各$f_i$は$a$で連続である。右の不等式から、全ての$f_j$が$a$で連続なら$f$は$a$で連続である。$a$は任意なので同値性が従う。
  strategy: Compare the Euclidean norm of the difference with the absolute values of its coordinates.
  sketch:
  - 'setup: Fix points x and a and write out the coordinates of f(x)-f(a).'
  - 'derive: Each coordinate is bounded by the norm, and the norm is bounded by the sum of the coordinates.'
  - 'conclude: The two bounds transfer continuity in each direction.'
  openmath: (forall (n m f) (-> (map_between f (euclidean_space n) (euclidean_space m)) (<-> (continuous_map f) (forall (i) (continuous_map (component_fn f i))))))
  hard_negative:
    statement: f:R^2→Rが各変数を固定するごとに他方の変数について連続なら、fは連続である。
    reason: f(x,y)=xy/(x^2+y^2), f(0,0)=0は各変数ごとに連続だが、直線y=x上で値が1/2なので原点で連続でない。
  target: |
    ∀ (n m : ℕ) (f : EuclideanSpace ℝ (Fin n) → EuclideanSpace ℝ (Fin m)), Continuous f ↔ ∀ i : Fin m, Continuous (fun x => f x i)
  proof: |
    by
      intro n m f
      constructor
      · intro hf i
        exact (PiLp.continuous_apply 2 (fun _ : Fin m => ℝ) i).comp hf
      · intro hf
        have h : Continuous (fun x => WithLp.toLp 2 (fun i => f x i)) :=
          (PiLp.continuous_toLp 2 (fun _ : Fin m => ℝ)).comp (continuous_pi hf)
        exact h
- id: fderiv_little_o
  kind: gap
  level: 2
  topic: 多変数関数・全微分の定義
  statement: 実ノルム空間の間の写像$f:E\to F$と有界線形写像$L:E\to F$について、$f$の$a$での微分が$L$であることは、$h\to0$で$f(a+h)-f(a)-L(h)=o(\|h\|)$となることと同値である。
  statement_en: For a map f between real normed spaces and a bounded linear map L, f has Fréchet derivative L at a if and only if f(a+h)-f(a)-L(h) is little-o of h as h tends to 0.
  assumptions:
  - $E,F$は実ノルム空間
  - $f:E\to F$は写像
  - $L:E\to F$は有界線形写像
  quantifiers:
  - 任意の$f:E\to F$、$L$、$a\in E$
  conclusion: $f$の$a$での微分が$L$であることと、$h\to0$で$f(a+h)-f(a)-L(h)=o(\|h\|)$となることは同値である。
  answer: |
    $E,F$を実ノルム空間、$f:E\to F$を写像、$L:E\to F$を有界線形写像、$a\in E$とする。

    $f$の$a$での微分が$L$であるとは、任意の$\varepsilon>0$に対して$\delta>0$があり、$\|x-a\|<\delta$なら$\|f(x)-f(a)-L(x-a)\|\leq\varepsilon\|x-a\|$となることである。$x=a+h$とおくと、$\|x-a\|<\delta$は$\|h\|<\delta$と同じであり、$x-a=h$である。よってこの条件は、$\|h\|<\delta$なら$\|f(a+h)-f(a)-L(h)\|\leq\varepsilon\|h\|$となること、すなわち$h\to0$で$f(a+h)-f(a)-L(h)=o(\|h\|)$であることと同値である。
  strategy: Substitute x = a + h in the definition of the Fréchet derivative.
  sketch:
  - 'setup: Recall that the derivative is defined by a little-o condition as x tends to a.'
  - 'translate: Put x = a + h, so that x tends to a exactly when h tends to 0.'
  - 'conclude: The two little-o conditions coincide.'
  openmath: (forall (E F f L a) (-> (and (normed_space E) (normed_space F) (map_between f E F) (continuous_linear_map L)) (<-> (has_fderiv_at f L a) (little_o_at (lambda (h) (- (- (fn_value f (+ a h)) (fn_value f a)) (fn_value L h))) (lambda (h) h) 0))))
  hard_negative:
    statement: 全ての方向vでaにおける方向微分係数がL(v)に等しければ、fはaで微分可能で微分はLである。
    reason: f(x,y)=x^3y/(x^6+y^2), f(0,0)=0は原点の全方向微分係数が0だが、曲線y=x^3上で値が1/2なので原点で連続ですらない。
  target: |
    ∀ (E F : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] [NormedAddCommGroup F] [NormedSpace ℝ F] (f : E → F) (L : E →L[ℝ] F) (a : E), HasFDerivAt f L a ↔ Asymptotics.IsLittleO (nhds (0 : E)) (fun h : E => f (a + h) - f a - L h) (fun h : E => h)
  proof: |
    by
      intro E F _ _ _ _ f L a
      exact hasFDerivAt_iff_isLittleO_nhds_zero
- id: differentiable_implies_continuous
  kind: textbook
  level: 1
  topic: 多変数関数・微分可能性と連続性
  statement: 実ノルム空間の間の写像$f$が点$a$で微分可能ならば、$f$は$a$で連続である。
  statement_en: If a map f between real normed spaces is Fréchet differentiable at a, then f is continuous at a.
  assumptions:
  - $E,F$は実ノルム空間
  - $f$は$a$で微分可能
  quantifiers:
  - 任意の$f:E\to F$と$a\in E$
  conclusion: $f$は$a$で連続である。
  answer: |
    $E,F$を実ノルム空間とし、$f:E\to F$が$a\in E$で微分可能であるとする。$L$を$a$での微分とする。

    微分の定義で$\varepsilon=1$とすると、$\delta>0$があり、$\|x-a\|<\delta$なら$\|f(x)-f(a)-L(x-a)\|\leq\|x-a\|$である。このとき$\|f(x)-f(a)\|\leq\|L(x-a)\|+\|x-a\|\leq(\|L\|+1)\|x-a\|$である。右辺は$x\to a$で$0$に収束するので、$f(x)\to f(a)$である。
  strategy: Bound the increment by the operator norm of the derivative plus the little-o remainder.
  sketch:
  - 'setup: Let L be the derivative of f at a.'
  - 'derive: Write f(x)-f(a) as L(x-a) plus a little-o remainder.'
  - 'derive: Boundedness of L makes L(x-a) tend to 0.'
  - 'conclude: The increment tends to 0, so f is continuous at a.'
  openmath: (forall (E F f a) (-> (and (normed_space E) (normed_space F) (map_between f E F) (differentiable_at f a)) (continuous_map_at f a)))
  hard_negative:
    statement: f:R^2→Rの偏微分係数が点aで全て存在すれば、fはaで連続である。
    reason: f(x,y)=xy/(x^2+y^2), f(0,0)=0は原点で両方の偏微分係数が0だが、原点で連続でない。
  target: |
    ∀ (E F : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] [NormedAddCommGroup F] [NormedSpace ℝ F] (f : E → F) (a : E), DifferentiableAt ℝ f a → ContinuousAt f a
  proof: |
    by
      intro E F _ _ _ _ f a hf
      exact hf.continuousAt
- id: product_rule
  kind: textbook
  level: 1
  topic: 多変数関数・積の微分法則
  statement: 実ノルム空間$E$上の実数値関数$f,g$の点$a$での微分がそれぞれ$L,M$ならば、積$fg$も$a$で微分可能で、微分は$f(a)M+g(a)L$である。
  statement_en: If real-valued functions f and g on a real normed space have derivatives L and M at a, then the product fg has derivative f(a)M + g(a)L at a.
  assumptions:
  - $E$は実ノルム空間
  - $f,g:E\to\mathbb{R}$の$a$での微分はそれぞれ$L,M$
  quantifiers:
  - 任意の$f,g:E\to\mathbb{R}$、有界線形写像$L,M:E\to\mathbb{R}$、$a\in E$
  conclusion: $fg$の$a$での微分は$f(a)M+g(a)L$である。
  answer: |
    $E$を実ノルム空間とし、$f,g:E\to\mathbb{R}$の$a\in E$での微分をそれぞれ$L,M$とする。$r(h)=f(a+h)-f(a)-L(h)$、$s(h)=g(a+h)-g(a)-M(h)$とおくと、$h\to0$で$r(h)=o(\|h\|)$、$s(h)=o(\|h\|)$である。

    $f(a+h)=f(a)+L(h)+r(h)$と$g(a+h)=g(a)+M(h)+s(h)$を掛けると、$f(a+h)g(a+h)-f(a)g(a)-f(a)M(h)-g(a)L(h)$は次の和に等しい。$f(a)s(h)+g(a)r(h)+L(h)M(h)+L(h)s(h)+r(h)M(h)+r(h)s(h)$。

    これらの項はすべて$o(\|h\|)$である。実際、$f(a)s(h)$と$g(a)r(h)$は定数倍なので$o(\|h\|)$である。$|L(h)M(h)|\leq\|L\|\|M\|\|h\|^2$である。$L(h)$、$M(h)$、$r(h)$は$h\to0$で$0$に収束するので、$L(h)s(h)$、$r(h)M(h)$、$r(h)s(h)$も$o(\|h\|)$である。よって$fg$の$a$での微分は$f(a)M+g(a)L$である。
  strategy: Multiply the first-order expansions of f and g and collect the terms of order o(h).
  sketch:
  - 'setup: Write the first-order expansions of f and g at a.'
  - 'derive: Multiply them and isolate f(a)g(a) + f(a)M(h) + g(a)L(h).'
  - 'derive: Bound every remaining term by a constant times the square of the norm of h or by a little-o term.'
  - 'conclude: The linear part is f(a)M + g(a)L.'
  openmath: (forall (E f g L M a) (-> (and (normed_space E) (has_fderiv_at f L a) (has_fderiv_at g M a)) (has_fderiv_at (pointwise_product f g) (operator_add (scalar_multiple (fn_value f a) M) (scalar_multiple (fn_value g a) L)) a)))
  hard_negative:
    statement: fgのaでの微分はL·M(同じ方向の値どうしの積h↦L(h)M(h))である。
    reason: h↦L(h)M(h)は線形でなく2次である。f=g=xではfgの微分は2x h(xは点)であり、h^2ではない。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] (f g : E → ℝ) (L M : E →L[ℝ] ℝ) (a : E), HasFDerivAt f L a → HasFDerivAt g M a → HasFDerivAt (fun x => f x * g x) (f a • M + g a • L) a
  proof: |
    by
      intro E _ _ f g L M a hf hg
      exact hf.mul hg
- id: chain_rule
  kind: textbook
  level: 1
  topic: 多変数関数・連鎖律
  statement: $f$の点$a$での微分が$L$、$g$の点$f(a)$での微分が$M$ならば、合成$g\circ f$は$a$で微分可能で、微分は$M\circ L$である。
  statement_en: If f has derivative L at a and g has derivative M at f(a), then the composite g∘f has derivative M∘L at a.
  assumptions:
  - $E,F,G$は実ノルム空間
  - $f:E\to F$の$a$での微分は$L$
  - $g:F\to G$の$f(a)$での微分は$M$
  quantifiers:
  - 任意の$f:E\to F$、$g:F\to G$、有界線形写像$L,M$、$a\in E$
  conclusion: $g\circ f$の$a$での微分は$M\circ L$である。
  answer: |
    $E,F,G$を実ノルム空間とし、$f:E\to F$の$a\in E$での微分を$L$、$g:F\to G$の$f(a)$での微分を$M$とする。$r(h)=f(a+h)-f(a)-L(h)$、$t(k)=g(f(a)+k)-g(f(a))-M(k)$とおくと、$r(h)=o(\|h\|)$、$t(k)=o(\|k\|)$である。

    $k(h)=f(a+h)-f(a)=L(h)+r(h)$とおく。$h$が十分小さいとき$\|r(h)\|\leq\|h\|$なので、$\|k(h)\|\leq C\|h\|$である。ここで$C=\|L\|+1$である。特に$h\to0$で$k(h)\to0$である。さらに次の等式が成り立つ。$g(f(a+h))-g(f(a))-M(L(h))=M(r(h))+t(k(h))$。

    右辺の評価を行う。まず$\|M(r(h))\|\leq\|M\|\|r(h)\|$なので、$M(r(h))=o(\|h\|)$である。次に$\varepsilon>0$に対して$\delta>0$があり、$\|k\|<\delta$なら$\|t(k)\|\leq\varepsilon\|k\|$である。$h$が十分小さければ$\|k(h)\|<\delta$なので、$\|t(k(h))\|\leq\varepsilon C\|h\|$である。よって$t(k(h))=o(\|h\|)$である。したがって$g\circ f$の$a$での微分は$M\circ L$である。
  strategy: Substitute the expansion of f into the expansion of g and absorb the remainders using the Lipschitz bound on the increment of f.
  sketch:
  - 'setup: Put k = f(a+h) - f(a) and expand it as L(h) plus a little-o term.'
  - 'derive: Near 0 the norm of k is at most a constant times the norm of h.'
  - 'apply_theorem: Expand g at f(a) and evaluate at k.'
  - 'derive: Boundedness of M and the bound on k turn every remainder into o(h).'
  - 'conclude: The linear part of the composite is M∘L.'
  openmath: (forall (E F G f g L M a) (-> (and (normed_space E) (normed_space F) (normed_space G) (has_fderiv_at f L a) (has_fderiv_at g M (fn_value f a))) (has_fderiv_at (function_compose_map g f) (operator_comp M L) a)))
  hard_negative:
    statement: g∘fがaで微分可能でfがaで微分可能なら、gはf(a)で微分可能である。
    reason: f≡0, g(y)=|y|では合成は恒等的に0で微分可能だが、gは0で微分可能でない。
  target: |
    ∀ (E F G : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] [NormedAddCommGroup F] [NormedSpace ℝ F] [NormedAddCommGroup G] [NormedSpace ℝ G] (f : E → F) (g : F → G) (L : E →L[ℝ] F) (M : F →L[ℝ] G) (a : E), HasFDerivAt f L a → HasFDerivAt g M (f a) → HasFDerivAt (fun x => g (f x)) (M.comp L) a
  proof: |
    by
      intro E F G _ _ _ _ _ _ f g L M a hf hg
      exact hg.comp a hf
- id: curve_chain_rule
  kind: gap
  level: 1
  topic: 多変数関数・曲線に沿う微分
  statement: 曲線$\gamma$の$t$での微分係数が$v$、実数値関数$f$の点$\gamma(t)$での微分が$L$ならば、関数$s\mapsto f(\gamma(s))$は$t$で微分可能で、微分係数は$L(v)$である。
  statement_en: If a curve γ has velocity v at t and a real-valued function f has derivative L at γ(t), then s ↦ f(γ(s)) has derivative L(v) at t.
  assumptions:
  - $E$は実ノルム空間
  - $\gamma:\mathbb{R}\to E$の$t$での微分係数は$v$
  - $f:E\to\mathbb{R}$の$\gamma(t)$での微分は$L$
  quantifiers:
  - 任意の$f:E\to\mathbb{R}$、$\gamma:\mathbb{R}\to E$、有界線形写像$L$、$v\in E$、$t\in\mathbb{R}$
  conclusion: $s\mapsto f(\gamma(s))$の$t$での微分係数は$L(v)$である。
  answer: |
    $E$を実ノルム空間とし、$\gamma:\mathbb{R}\to E$の$t\in\mathbb{R}$での微分係数を$v\in E$、$f:E\to\mathbb{R}$の$\gamma(t)$での微分を$L$とする。

    $\gamma$の微分係数が$v$であることは、$\gamma$の$t$での微分が有界線形写像$h\mapsto hv$であることを意味する。連鎖律より、$f\circ\gamma$の$t$での微分は$h\mapsto L(hv)=hL(v)$である。実数上の線形写像$h\mapsto hL(v)$に対応する微分係数は$L(v)$である。
  strategy: Apply the chain rule, viewing the velocity as the linear map h ↦ hv.
  sketch:
  - 'translate: View the velocity v as the derivative h ↦ hv of γ at t.'
  - 'apply_theorem: Apply the chain rule to f∘γ.'
  - 'conclude: The resulting linear map h ↦ hL(v) corresponds to the derivative L(v).'
  openmath: (forall (E f gamma L v t) (-> (and (normed_space E) (has_deriv_at (lambda (s) (fn_value gamma s)) v t) (has_fderiv_at f L (fn_value gamma t))) (has_deriv_at (lambda (s) (fn_value f (fn_value gamma s))) (fn_value L v) t)))
  hard_negative:
    statement: fの偏微分係数が点γ(t)に存在してγが微分可能なら、f(γ(s))のtでの微分係数は偏微分係数と速度の成分の積の和である。
    reason: f(x,y)=xy/(x^2+y^2), f(0,0)=0, γ(s)=(s,s)では、偏微分係数は0だがf(γ(s))はs=0で不連続である。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] (f : E → ℝ) (γ : ℝ → E) (L : E →L[ℝ] ℝ) (v : E) (t : ℝ), HasDerivAt γ v t → HasFDerivAt f L (γ t) → HasDerivAt (fun s => f (γ s)) (L v) t
  proof: |
    by
      intro E _ _ f γ L v t hγ hf
      exact hf.comp_hasDerivAt t hγ
- id: fderiv_iff_components
  kind: gap
  level: 1
  topic: 多変数関数・ベクトル値写像の成分
  statement: 写像$f:E\to\mathbb{R}^m$の$a$での微分が$L$であることと、全ての$i$について$f_i$の$a$での微分が$L$の第$i$成分$L_i$であることは同値である。
  statement_en: A map f from a real normed space to R^m has derivative L at a if and only if for every i the component f_i has as derivative at a the i-th component of L.
  assumptions:
  - $E$は実ノルム空間
  - $f:E\to\mathbb{R}^m$
  - $L:E\to\mathbb{R}^m$は有界線形写像
  quantifiers:
  - 任意の$m\in\mathbb{N}$、$f:E\to\mathbb{R}^m$、$L$、$a\in E$
  conclusion: $f$の$a$での微分が$L$であることと、各$i$で$f_i$の$a$での微分が$L_i$であることは同値である。
  answer: |
    $E$を実ノルム空間、$m\in\mathbb{N}$、$f:E\to\mathbb{R}^m$を写像、$L:E\to\mathbb{R}^m$を有界線形写像、$a\in E$とする。$\mathbb{R}^m$のノルムは最大値ノルムとする。$r(h)=f(a+h)-f(a)-L(h)$とおくと、$r$の第$i$成分は$r_i(h)=f_i(a+h)-f_i(a)-L_i(h)$である。

    全ての$i$で$|r_i(h)|\leq\|r(h)\|=\max_j|r_j(h)|$である。

    $r(h)=o(\|h\|)$とする。左の不等式から、各$i$で$r_i(h)=o(\|h\|)$である。

    逆に、全ての$i$で$r_i(h)=o(\|h\|)$とする。$\varepsilon>0$に対し、各$i$について$\delta_i>0$があり、$\|h\|<\delta_i$なら$|r_i(h)|\leq\varepsilon\|h\|$である。添字は有限個なので$\delta=\min_i\delta_i>0$をとれる（$m=0$なら$r=0$であり、示すことはない）。$\|h\|<\delta$なら$\|r(h)\|\leq\varepsilon\|h\|$である。よって$r(h)=o(\|h\|)$である。
  strategy: Apply the definition of the derivative to the remainder coordinate by coordinate.
  sketch:
  - 'setup: Define the remainder r(h) = f(a+h) - f(a) - L(h).'
  - 'translate: The i-th coordinate of r is the remainder for f_i and L_i.'
  - 'derive: Finitely many coordinates are little-o exactly when the vector is little-o.'
  - 'conclude: Hence the two differentiability statements are equivalent.'
  openmath: (forall (E m f L a) (-> (and (normed_space E) (map_between f E (euclidean_space m))) (<-> (has_fderiv_at f L a) (forall (i) (has_fderiv_at (component_fn f i) (component_fn L i) a)))))
  hard_negative:
    statement: 実数値関数f:R^2→Rの偏微分係数が全て存在すれば、fは全微分可能である。
    reason: ここでの成分は値域の成分であり、定義域の座標方向の偏微分ではない。xy/(x^2+y^2)は偏微分係数が存在するが全微分可能でない。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] (m : ℕ) (f : E → Fin m → ℝ) (L : E →L[ℝ] (Fin m → ℝ)) (a : E), HasFDerivAt f L a ↔ ∀ i, HasFDerivAt (fun x => f x i) ((ContinuousLinearMap.proj i).comp L) a
  proof: |
    by
      intro E _ _ m f L a
      exact hasFDerivAt_pi'
- id: directional_derivative
  kind: gap
  level: 1
  topic: 多変数関数・方向微分
  statement: $f$の点$a$での微分が$L$ならば、任意のベクトル$v$について、$t\mapsto f(a+tv)$は$t=0$で微分可能で、微分係数は$L(v)$である。
  statement_en: If f has derivative L at a, then for every vector v the function t ↦ f(a+tv) has derivative L(v) at t=0.
  assumptions:
  - $E,F$は実ノルム空間
  - $f:E\to F$の$a$での微分は$L$
  quantifiers:
  - 任意の$f:E\to F$、有界線形写像$L$、$a,v\in E$
  conclusion: $t\mapsto f(a+tv)$の$t=0$での微分係数は$L(v)$である。
  answer: |
    $E,F$を実ノルム空間とし、$f:E\to F$の$a\in E$での微分を$L$、$v\in E$とする。$r(h)=f(a+h)-f(a)-L(h)$とおくと、$r(h)=o(\|h\|)$である。

    $\varepsilon>0$に対して$\delta>0$をとり、$\|h\|<\delta$なら$\|r(h)\|\leq\varepsilon\|h\|$とする。$t\neq0$かつ$|t|\|v\|<\delta$なら、$L(tv)=tL(v)$より$\|(f(a+tv)-f(a))/t-L(v)\|=\|r(tv)\|/|t|\leq\varepsilon\|v\|$である。$\varepsilon$は任意なので、$t\to0$で$(f(a+tv)-f(a))/t\to L(v)$である。
  strategy: Evaluate the first-order expansion along the line through a in direction v.
  sketch:
  - 'setup: Apply the definition of the derivative at the increment h = tv.'
  - 'derive: Linearity gives L(tv) = tL(v), and the remainder is o(|t|).'
  - 'conclude: Dividing by t and letting t tend to 0 gives L(v).'
  openmath: (forall (E F f L a v) (-> (and (normed_space E) (normed_space F) (has_fderiv_at f L a)) (has_deriv_at (lambda (t) (fn_value f (+ a (scalar_multiple t v)))) (fn_value L v) 0)))
  hard_negative:
    statement: 方向微分係数が全ての方向vに存在すれば、v↦(方向微分係数)は線形である。
    reason: f(x,y)=x^2y/(x^2+y^2), f(0,0)=0では原点の方向(v,w)の微分係数はv^2w/(v^2+w^2)で、これは線形でない。
  target: |
    ∀ (E F : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] [NormedAddCommGroup F] [NormedSpace ℝ F] (f : E → F) (L : E →L[ℝ] F) (a v : E), HasFDerivAt f L a → HasDerivAt (fun t : ℝ => f (a + t • v)) (L v) 0
  proof: |
    by
      intro E F _ _ _ _ f L a v hf
      exact hf.hasLineDerivAt v
- id: partials_from_total_derivative
  kind: gap
  level: 1
  topic: 多変数関数・偏微分と全微分
  statement: $f:\mathbb{R}^2\to\mathbb{R}$の点$(a,b)$での微分が$L$ならば、$x$についての偏微分係数は$L(1,0)$、$y$についての偏微分係数は$L(0,1)$である。
  statement_en: If f from R^2 to R has derivative L at (a,b), then its partial derivatives at (a,b) with respect to x and y are L(1,0) and L(0,1).
  assumptions:
  - $f:\mathbb{R}^2\to\mathbb{R}$の$(a,b)$での微分は$L$
  quantifiers:
  - 任意の$f:\mathbb{R}^2\to\mathbb{R}$、有界線形写像$L$、$a,b\in\mathbb{R}$
  conclusion: $x\mapsto f(x,b)$の$a$での微分係数は$L(1,0)$、$y\mapsto f(a,y)$の$b$での微分係数は$L(0,1)$である。
  answer: |
    $f:\mathbb{R}^2\to\mathbb{R}$の$(a,b)\in\mathbb{R}^2$での微分を$L$とする。

    曲線$x\mapsto(x,b)$は$x=a$で$(a,b)$を通り、微分係数は$(1,0)$である。$f$との合成に連鎖律を使うと、$x\mapsto f(x,b)$の$a$での微分係数は$L(1,0)$である。同様に、曲線$y\mapsto(a,y)$は$y=b$で$(a,b)$を通り、微分係数は$(0,1)$である。よって$y\mapsto f(a,y)$の$b$での微分係数は$L(0,1)$である。
  strategy: Compose f with the two coordinate lines through (a,b) and use the chain rule.
  sketch:
  - 'construct: Parametrize the coordinate lines x ↦ (x,b) and y ↦ (a,y).'
  - 'derive: Their velocities are (1,0) and (0,1).'
  - 'apply_theorem: The chain rule along each line gives the values of L.'
  - 'conclude: These values are the partial derivatives.'
  openmath: (forall (f L a b) (-> (has_fderiv_at f L (ordered_pair a b)) (and (has_deriv_at (lambda (x) (fn_value f (ordered_pair x b))) (fn_value L (ordered_pair 1 0)) a) (has_deriv_at (lambda (y) (fn_value f (ordered_pair a y))) (fn_value L (ordered_pair 0 1)) b))))
  hard_negative:
    statement: 両方の偏微分係数が(a,b)で存在すれば、fは(a,b)で微分可能で、Lは偏微分係数で定まる。
    reason: xy/(x^2+y^2)は原点で偏微分係数が0だが連続でなく、微分可能でない。
  target: |
    ∀ (f : ℝ × ℝ → ℝ) (L : ℝ × ℝ →L[ℝ] ℝ) (a b : ℝ), HasFDerivAt f L (a, b) → HasDerivAt (fun x : ℝ => f (x, b)) (L (1, 0)) a ∧ HasDerivAt (fun y : ℝ => f (a, y)) (L (0, 1)) b
  proof: |
    by
      intro f L a b hf
      constructor
      · have h : HasDerivAt (fun x : ℝ => (x, b)) ((1 : ℝ), (0 : ℝ)) a :=
          (hasDerivAt_id a).prodMk (hasDerivAt_const a b)
        exact HasFDerivAt.comp_hasDerivAt a hf h
      · have h : HasDerivAt (fun y : ℝ => (a, y)) ((0 : ℝ), (1 : ℝ)) b :=
          (hasDerivAt_const b a).prodMk (hasDerivAt_id b)
        exact HasFDerivAt.comp_hasDerivAt b hf h
- id: total_differential_formula
  kind: gap
  level: 1
  topic: 多変数関数・全微分の公式
  statement: $f:\mathbb{R}^n\to\mathbb{R}$の点$a$での微分が$L$で、第$i$座標方向の偏微分係数が$p_i$ならば、全てのベクトル$v$について$L(v)=\sum_i v_ip_i$である。
  statement_en: If f from R^n to R has derivative L at a and partial derivatives p_i at a, then L(v) equals the sum of v_i p_i for every vector v.
  assumptions:
  - $f:\mathbb{R}^n\to\mathbb{R}$の$a$での微分は$L$
  - $t\mapsto f(a+te_i)$の$t=0$での微分係数は$p_i$
  quantifiers:
  - 任意の$n\in\mathbb{N}$、$f:\mathbb{R}^n\to\mathbb{R}$、有界線形写像$L$、$a,p,v\in\mathbb{R}^n$
  conclusion: $L(v)=\sum_i v_ip_i$である。
  answer: |
    $n\in\mathbb{N}$とし、$f:\mathbb{R}^n\to\mathbb{R}$の$a\in\mathbb{R}^n$での微分を$L$とする。$e_i$を標準基底とし、$t\mapsto f(a+te_i)$の$t=0$での微分係数を$p_i$とする。

    方向微分の公式（$f$の$a$での微分が$L$なら、$t\mapsto f(a+tv)$の$t=0$での微分係数は$L(v)$である）より、$t\mapsto f(a+te_i)$の$t=0$での微分係数は$L(e_i)$である。微分係数は一意なので$p_i=L(e_i)$である。$v\in\mathbb{R}^n$を$v=\sum_i v_ie_i$と書くと、$L$の線形性から$L(v)=\sum_i v_iL(e_i)=\sum_i v_ip_i$である。
  strategy: Identify each partial derivative with L on a basis vector and expand v in the standard basis.
  sketch:
  - 'apply_theorem: The directional derivative along e_i is L(e_i).'
  - 'derive: Uniqueness of the derivative gives p_i = L(e_i).'
  - 'setup: Expand v in the standard basis.'
  - 'conclude: Linearity of L gives the sum formula.'
  openmath: (forall (n f L a p v) (-> (and (has_fderiv_at f L a) (forall (i) (has_deriv_at (lambda (t) (fn_value f (+ a (scalar_multiple t (basis_vector i))))) (fn_value p i) 0))) (= (fn_value L v) (sum (index_set n) (lambda (i) (* (coordinate_of v i) (fn_value p i)))))))
  hard_negative:
    statement: 偏微分係数p_iが全て存在すれば、全ての方向vの方向微分係数はΣ_i v_i p_iである。
    reason: 微分可能性がないと成り立たない。x^2y/(x^2+y^2)は原点でp=0だが、方向(1,1)の微分係数は1/2である。
  target: |
    ∀ (n : ℕ) (f : (Fin n → ℝ) → ℝ) (L : (Fin n → ℝ) →L[ℝ] ℝ) (a p : Fin n → ℝ), HasFDerivAt f L a → (∀ i, HasDerivAt (fun t : ℝ => f (a + t • (Pi.single i (1 : ℝ) : Fin n → ℝ))) (p i) 0) → ∀ v : Fin n → ℝ, L v = ∑ i, v i * p i
  proof: |
    by
      intro n f L a p hL hp v
      have hv : v = ∑ i, v i • (Pi.single i (1 : ℝ) : Fin n → ℝ) := by
        ext j
        simp [Finset.sum_apply, Pi.single_apply]
      have hpi : ∀ i, p i = L (Pi.single i (1 : ℝ)) := fun i =>
        (hp i).unique (hL.hasLineDerivAt _)
      calc L v = L (∑ i, v i • (Pi.single i (1 : ℝ) : Fin n → ℝ)) := congrArg L hv
        _ = ∑ i, v i * p i := by simp [map_sum, hpi]
- id: partials_exist_not_continuous
  kind: gap
  level: 1
  topic: 多変数関数・偏微分可能だが不連続な例
  statement: $f:\mathbb{R}^2\to\mathbb{R}$が$f(0,0)=0$かつ$(x,y)\neq(0,0)$で$f(x,y)=xy/(x^2+y^2)$を満たすとき、$f$は原点で両方の偏微分係数が$0$であるが、原点で連続でない。
  statement_en: 'If f : R^2 -> R satisfies f(0,0) = 0 and f(x,y) = xy/(x^2+y^2) for (x,y) ≠ (0,0), then both partial derivatives of f at the origin equal 0, but f is not continuous at the origin.'
  assumptions:
  - $f(0,0)=0$
  - $(x,y)\neq(0,0)$で$f(x,y)=xy/(x^2+y^2)$
  quantifiers:
  - 任意の$f:\mathbb{R}^2\to\mathbb{R}$
  conclusion: 原点で$f_x=f_y=0$であり、$f$は原点で連続でない。
  answer: |
    $f:\mathbb{R}^2\to\mathbb{R}$が$f(0,0)=0$を満たし、$(x,y)\neq(0,0)$では$f(x,y)=xy/(x^2+y^2)$を満たすとする。

    全ての$x$で$f(x,0)=0$、全ての$y$で$f(0,y)=0$である。これらの$1$変数関数は定数なので、原点での偏微分係数はどちらも$0$である。

    一方、$t\neq0$では$f(t,t)=t^2/(2t^2)=1/2$である。$t\to0$で$(t,t)$は原点に近づくが、$f(t,t)$は$1/2$のままであり、$f(0,0)=0$に収束しない。したがって$f$は原点で連続でない。
  strategy: The function vanishes on both axes but is constant 1/2 on the diagonal away from the origin.
  sketch:
  - 'derive: On each coordinate axis f vanishes identically, so both partial derivatives are 0.'
  - 'derive: For t different from 0, f(t,t) = 1/2.'
  - 'contradiction: Continuity at the origin would force the limit along the diagonal to be f(0,0) = 0.'
  - 'conclude: Hence f is not continuous at the origin.'
  openmath: (forall (f) (-> (and (= (fn_value f (ordered_pair 0 0)) 0) (forall (x y) (-> (or (!= x 0) (!= y 0)) (= (fn_value f (ordered_pair x y)) (/ (* x y) (+ (^ x 2) (^ y 2))))))) (and (has_deriv_at (lambda (x) (fn_value f (ordered_pair x 0))) 0 0) (has_deriv_at (lambda (y) (fn_value f (ordered_pair 0 y))) 0 0) (not (continuous_map_at f (ordered_pair 0 0))))))
  hard_negative:
    statement: この関数は原点の近くで偏導関数が連続である。
    reason: x≠0でf_y(x,0)=1/xなのでf_yは原点の近くで有界でない。連続な偏導関数を持てば微分可能で連続になるので、結論にも矛盾する。
  target: '∀ (f : ℝ × ℝ → ℝ), f (0, 0) = 0 → (∀ x y : ℝ, (x ≠ 0 ∨ y ≠ 0) → f (x, y) = x * y / (x ^ 2 + y ^ 2)) → HasDerivAt (fun x : ℝ => f (x, 0)) 0 0 ∧ HasDerivAt (fun y : ℝ => f (0, y)) 0 0 ∧ ¬ ContinuousAt f (0, 0)'
  proof: |
    by
      intro f h0 h
      have hx : ∀ x : ℝ, f (x, 0) = 0 := by
        intro x
        by_cases hx : x = 0
        · subst hx; exact h0
        · rw [h x 0 (Or.inl hx)]; simp
      have hy : ∀ y : ℝ, f (0, y) = 0 := by
        intro y
        by_cases hy : y = 0
        · subst hy; exact h0
        · rw [h 0 y (Or.inr hy)]; simp
      refine ⟨?_, ?_, ?_⟩
      · have : (fun x : ℝ => f (x, 0)) = fun _ => (0 : ℝ) := funext hx
        rw [this]; exact hasDerivAt_const _ _
      · have : (fun y : ℝ => f (0, y)) = fun _ => (0 : ℝ) := funext hy
        rw [this]; exact hasDerivAt_const _ _
      · intro hc
        have hc' : Filter.Tendsto (fun t : ℝ => (t, t)) (nhdsWithin 0 {0}ᶜ) (nhds ((0 : ℝ), (0 : ℝ))) := by
          have : ContinuousAt (fun t : ℝ => (t, t)) 0 := by fun_prop
          exact this.tendsto.mono_left nhdsWithin_le_nhds
        have h3 := hc.tendsto.comp hc'
        have hev : (fun t : ℝ => (1 / 2 : ℝ)) =ᶠ[nhdsWithin 0 {0}ᶜ] (f ∘ fun t : ℝ => (t, t)) := by
          filter_upwards [self_mem_nhdsWithin] with t ht
          have ht' : t ≠ 0 := ht
          simp only [Function.comp]
          rw [h t t (Or.inl ht')]
          field_simp
          ring
        have h4 := tendsto_nhds_unique (h3.congr' hev.symm) tendsto_const_nhds
        rw [h0] at h4
        norm_num at h4
- id: gradient_inner_fderiv
  kind: gap
  level: 1
  topic: 多変数関数・勾配と方向微分
  statement: 完備な実内積空間上の実数値関数$f$が点$a$で微分可能ならば、全てのベクトル$v$について$\langle\nabla f(a),v\rangle=df(a)(v)$である。
  statement_en: If a real-valued function f on a real Hilbert space is differentiable at a, then the inner product of the gradient at a with v equals the derivative of f at a applied to v, for every v.
  assumptions:
  - $E$は完備な実内積空間
  - $f:E\to\mathbb{R}$は$a$で微分可能
  quantifiers:
  - 任意の$f:E\to\mathbb{R}$と$a,v\in E$
  conclusion: $\langle\nabla f(a),v\rangle=df(a)(v)$である。
  answer: |
    $E$を完備な実内積空間とし、$f:E\to\mathbb{R}$が$a\in E$で微分可能であるとする。$df(a)$は$E$上の有界線形汎関数である。リースの表現定理（完備な実内積空間上の有界線形汎関数$\ell$に対し、全ての$v$で$\ell(v)=\langle w,v\rangle$となる$w$がただ一つ存在する）を$\ell=df(a)$に適用する。

    勾配$\nabla f(a)$は、このとき得られるベクトル$w$として定義される。したがって全ての$v\in E$で$\langle\nabla f(a),v\rangle=df(a)(v)$である。
  strategy: Unfold the definition of the gradient as the Riesz representative of the derivative.
  sketch:
  - 'setup: Recall that the gradient is the Riesz representative of the derivative.'
  - 'translate: Riesz representation says the functional is the inner product with this vector.'
  - 'conclude: Evaluating at v gives the formula.'
  openmath: (forall (E f a v) (-> (and (hilbert_space E) (differentiable_at f a)) (= (inner_product (gradient_at f a) v) (fn_value (fderiv_at f a) v))))
  hard_negative:
    statement: fの微分df(a)と勾配∇f(a)は、どの実ノルム空間でも定義され、同じ空間の元である。
    reason: df(a)は双対空間の元であり、勾配を定めるには内積とリースの表現定理が必要である。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [InnerProductSpace ℝ E] [CompleteSpace E] (f : E → ℝ) (a v : E), DifferentiableAt ℝ f a → inner ℝ (gradient f a) v = fderiv ℝ f a v
  proof: |
    by
      intro E _ _ _ f a v _
      exact inner_gradient_left
- id: gradient_components
  kind: gap
  level: 1
  topic: 多変数関数・勾配の成分
  statement: $f:\mathbb{R}^n\to\mathbb{R}$が点$a$で微分可能ならば、勾配$\nabla f(a)$の第$i$成分は$df(a)(e_i)$である。
  statement_en: If f from R^n to R is differentiable at a, then the i-th component of the gradient at a is the partial derivative df(a)(e_i).
  assumptions:
  - $f:\mathbb{R}^n\to\mathbb{R}$は$a$で微分可能
  quantifiers:
  - 任意の$n\in\mathbb{N}$、$f:\mathbb{R}^n\to\mathbb{R}$、$a\in\mathbb{R}^n$、添字$i$
  conclusion: $(\nabla f(a))_i=df(a)(e_i)$である。
  answer: |
    $n\in\mathbb{N}$とし、ユークリッド内積をもつ$\mathbb{R}^n$上の関数$f:\mathbb{R}^n\to\mathbb{R}$が$a\in\mathbb{R}^n$で微分可能であるとする。$e_i$を標準基底とする。

    勾配の定義より、全ての$v$で$df(a)(v)=\langle\nabla f(a),v\rangle$である。$v=e_i$とすると$df(a)(e_i)=\langle\nabla f(a),e_i\rangle$である。標準基底$e_i$との内積はベクトルの第$i$成分を取り出すので、$df(a)(e_i)=(\nabla f(a))_i$である。
  strategy: Take the inner product of the gradient with the standard basis vector.
  sketch:
  - 'apply_theorem: The defining property of the gradient gives df(a)(e_i) as an inner product.'
  - 'derive: The inner product with e_i is the i-th coordinate.'
  - 'conclude: So the component of the gradient is the partial derivative.'
  openmath: (forall (n f a i) (-> (and (map_between f (euclidean_space n) R) (differentiable_at f a)) (= (coordinate_of (gradient_at f a) i) (fn_value (fderiv_at f a) (basis_vector i)))))
  hard_negative:
