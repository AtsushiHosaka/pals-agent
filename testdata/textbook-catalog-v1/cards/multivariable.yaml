    ∀ (E : Type*) [NormedAddCommGroup E] [InnerProductSpace ℝ E] [CompleteSpace E] (f : E → ℝ) (γ : ℝ → E) (v : E) (t : ℝ), DifferentiableAt ℝ f (γ t) → HasDerivAt γ v t → HasDerivAt (fun s => f (γ s)) (inner ℝ (gradient f (γ t)) v) t
