    reason: 微分可能性がなければdf(a)は存在しない。xy/(x^2+y^2)はv=0となるが原点で微分可能でない。
  target: |
    ∀ (n : ℕ) (f : EuclideanSpace ℝ (Fin n) → ℝ) (a : EuclideanSpace ℝ (Fin n)) (i : Fin n), DifferentiableAt ℝ f a → gradient f a i = fderiv ℝ f a (EuclideanSpace.single i (1 : ℝ))
  proof: |
    by
      intro n f a i _
      have h := inner_gradient_left (𝕜 := ℝ) (f := f) (x := a) (y := EuclideanSpace.single i (1 : ℝ))
      rw [← h, EuclideanSpace.inner_single_right]
      simp
