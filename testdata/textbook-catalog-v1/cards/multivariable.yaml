- id: gradient_along_curve
  kind: gap
  level: 2
  topic: 多変数関数・勾配と曲線
  statement: 完備な実内積空間上の実数値関数fが点γ(t)で微分可能で、曲線γのtでの速度がvならば、s↦f(γ(s))のtでの微分係数は⟨∇f(γ(t)),v⟩である。
  statement_en: If a real-valued function f on a real Hilbert space is differentiable at γ(t) and the curve γ has velocity v at t, then s ↦ f(γ(s)) has derivative equal to the inner product of the gradient of f at γ(t) with v.
