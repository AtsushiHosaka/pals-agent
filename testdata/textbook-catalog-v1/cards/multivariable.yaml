    reason: 内積と積は角度の分だけ異なる。f(x,y)=x, γ(s)=(0,s)では、∇f=(1,0), v=(0,1)でノルムの積は1だが、微分係数は0である。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [InnerProductSpace ℝ E] [CompleteSpace E] (f : E → ℝ) (γ : ℝ → E) (v : E) (t : ℝ), DifferentiableAt ℝ f (γ t) → HasDerivAt γ v t → HasDerivAt (fun s => f (γ s)) (inner ℝ (gradient f (γ t)) v) t
  proof: |
    by
      intro E _ _ _ f γ v t hf hγ
      rw [inner_gradient_left]
      exact hf.hasFDerivAt.comp_hasDerivAt t hγ
- id: gradient_steepest_ascent
  kind: textbook
  level: 2
  topic: 多変数関数・勾配と最大増加方向
  statement: 完備な実内積空間上の実数値関数$f$が点$a$で微分可能ならば、単位ベクトル$v$について$df(a)(v)\leq\|\nabla f(a)\|$が成り立つ。さらに$\nabla f(a)\neq0$のとき、$u=\nabla f(a)/\|\nabla f(a)\|$は単位ベクトルで、$df(a)(u)=\|\nabla f(a)\|$となる。
  statement_en: If f is differentiable at a, then df(a)(v) is at most the norm of the gradient for every unit vector v. If the gradient is nonzero, the normalized gradient u is a unit vector with df(a)(u) equal to the norm of the gradient.
  assumptions:
  - $E$は完備な実内積空間
  - $f:E\to\mathbb{R}$は$a$で微分可能
  quantifiers:
  - 任意の$f:E\to\mathbb{R}$と$a\in E$
  conclusion: 単位ベクトル$v$について$df(a)(v)\leq\|\nabla f(a)\|$であり、$\nabla f(a)\neq0$なら勾配方向の単位ベクトルで等号が成り立つ。
  answer: |
    $E$を完備な実内積空間とし、$f:E\to\mathbb{R}$が$a\in E$で微分可能であるとする。

    $v\in E$を単位ベクトルとする。勾配の定義とコーシー・シュワルツの不等式より、$df(a)(v)=\langle\nabla f(a),v\rangle\leq\|\nabla f(a)\|\|v\|=\|\nabla f(a)\|$である。

    $\nabla f(a)\neq0$とし、$u=\nabla f(a)/\|\nabla f(a)\|$とおく。$\|u\|=\|\nabla f(a)\|/\|\nabla f(a)\|=1$である。また$df(a)(u)=\langle\nabla f(a),\nabla f(a)\rangle/\|\nabla f(a)\|=\|\nabla f(a)\|$である。
  strategy: Apply Cauchy-Schwarz to the inner product representation and check equality at the normalized gradient.
  sketch:
  - 'translate: Write df(a)(v) as the inner product of the gradient with v.'
  - 'apply_theorem: Cauchy-Schwarz bounds it by the norm of the gradient for unit v.'
  - 'construct: Assuming the gradient is nonzero, normalize it to get u.'
  - 'derive: Compute the norm of u and the value df(a)(u).'
  - 'conclude: The bound is attained in the gradient direction.'
  openmath: (forall (E f a) (-> (and (hilbert_space E) (differentiable_at f a)) (and (forall (v) (-> (= (norm v) 1) (<= (fn_value (fderiv_at f a) v) (norm (gradient_at f a))))) (-> (!= (gradient_at f a) 0) (and (= (norm (scalar_multiple (/ 1 (norm (gradient_at f a))) (gradient_at f a))) 1) (= (fn_value (fderiv_at f a) (scalar_multiple (/ 1 (norm (gradient_at f a))) (gradient_at f a))) (norm (gradient_at f a))))))))
  hard_negative:
    statement: 方向微分係数が最大となる単位ベクトルは、∇f(a)=0でも一意に定まる。
    reason: ∇f(a)=0なら全ての方向の微分係数が0なので、全ての単位ベクトルが最大を与える。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [InnerProductSpace ℝ E] [CompleteSpace E] (f : E → ℝ) (a : E), DifferentiableAt ℝ f a → (∀ v : E, ‖v‖ = 1 → fderiv ℝ f a v ≤ ‖gradient f a‖) ∧ (gradient f a ≠ 0 → ‖(‖gradient f a‖)⁻¹ • gradient f a‖ = 1 ∧ fderiv ℝ f a ((‖gradient f a‖)⁻¹ • gradient f a) = ‖gradient f a‖)
  proof: |
    by
      intro E _ _ _ f a _
      constructor
      · intro v hv
        rw [← inner_gradient_left]
        calc inner ℝ (gradient f a) v ≤ ‖gradient f a‖ * ‖v‖ := real_inner_le_norm _ _
          _ = ‖gradient f a‖ := by rw [hv, mul_one]
      · intro hne
        have hn : ‖gradient f a‖ ≠ 0 := norm_ne_zero_iff.mpr hne
        constructor
        · rw [norm_smul, norm_inv, norm_norm, inv_mul_cancel₀ hn]
        · rw [← inner_gradient_left, inner_smul_right, real_inner_self_eq_norm_sq]
          field_simp
- id: local_extremum_gradient_zero
  kind: textbook
  level: 1
  topic: 多変数関数・極値と勾配
  statement: 完備な実内積空間上の実数値関数$f$が点$a$で微分可能で、$a$で極大または極小となるならば、$\nabla f(a)=0$である。
  statement_en: If a real-valued function on a real Hilbert space is differentiable at a and has a local maximum or minimum at a, then its gradient at a is 0.
  assumptions:
  - $E$は完備な実内積空間
  - $f:E\to\mathbb{R}$は$a$で微分可能
  - $f$は$a$で極値をとる
  quantifiers:
  - 任意の$f:E\to\mathbb{R}$と$a\in E$
  conclusion: $\nabla f(a)=0$である。
  answer: |
    $E$を完備な実内積空間とし、$f:E\to\mathbb{R}$が$a\in E$で微分可能で、$a$で極大または極小となるとする。

    $v\in E$を任意にとり、$h(t)=f(a+tv)$とおく。$t\mapsto a+tv$は連続で$t=0$で$a$を通るので、$h$は$t=0$で極値をとる。方向微分の公式から、$h$の$t=0$での微分係数は$df(a)(v)$である。$1$変数関数が極値点で微分可能なら微分係数は$0$なので、$df(a)(v)=0$である。

    よって全ての$v$で$\langle\nabla f(a),v\rangle=df(a)(v)=0$である。$v=\nabla f(a)$とすると$\|\nabla f(a)\|^2=0$なので、$\nabla f(a)=0$である。
  strategy: Restrict to lines through a, use the one-variable criterion, then test the gradient against itself.
  sketch:
  - 'setup: Fix a vector v and define g(t) = f(a+tv).'
  - 'apply_theorem: g has a local extremum at 0, so g''(0) = df(a)(v) = 0.'
  - 'derive: Hence the inner product of the gradient with every v vanishes.'
  - 'conclude: Taking v equal to the gradient shows that the gradient is 0.'
  openmath: (forall (E f a) (-> (and (hilbert_space E) (differentiable_at f a) (local_extremum_at f a)) (= (gradient_at f a) 0)))
  hard_negative:
    statement: ∇f(a)=0ならばfはaで極値をとる。
    reason: f(x,y)=x^2-y^2は原点で勾配が0だが、原点は鞍点で極値でない。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [InnerProductSpace ℝ E] [CompleteSpace E] (f : E → ℝ) (a : E), DifferentiableAt ℝ f a → IsLocalExtr f a → gradient f a = 0
  proof: |
    by
      intro E _ _ _ f a _ hx
      simp [gradient, hx.fderiv_eq_zero]
- id: local_extremum_directional_zero
  kind: gap
  level: 1
  topic: 多変数関数・極値と偏微分
  statement: $f$が点$a$で極値をとり、方向$v$の微分係数$p$が存在するならば、$p=0$である。
  statement_en: If f has a local extremum at a and the directional derivative p in direction v exists at a, then p = 0. In particular every existing partial derivative at a vanishes.
  assumptions:
  - $E$は実ノルム空間
  - $f:E\to\mathbb{R}$は$a$で極値をとる
  - $t\mapsto f(a+tv)$の$t=0$での微分係数は$p$
  quantifiers:
  - 任意の$f:E\to\mathbb{R}$、$a,v\in E$、$p\in\mathbb{R}$
  conclusion: $p=0$である。
  answer: |
    $E$を実ノルム空間、$f:E\to\mathbb{R}$を$a\in E$で極値をとる関数とする。$v\in E$とし、$h(t)=f(a+tv)$の$t=0$での微分係数を$p\in\mathbb{R}$とする。

    $t\mapsto a+tv$は連続で$t=0$で$a$を通るので、$h$は$t=0$で極値をとる。$1$変数関数が極値点で微分可能なら微分係数は$0$である。したがって$p=h'(0)=0$である。
  strategy: Reduce to the one-variable extremum criterion along the line through a in direction v.
  sketch:
  - 'construct: Define g(t) = f(a+tv).'
  - 'derive: Continuity of the line implies that g has a local extremum at 0.'
  - 'apply_theorem: The one-variable criterion gives g''(0) = 0.'
  - 'conclude: Therefore p = 0.'
  openmath: (forall (E f a v p) (-> (and (normed_space E) (local_extremum_at f a) (has_deriv_at (lambda (t) (fn_value f (+ a (scalar_multiple t v)))) p 0)) (= p 0)))
  hard_negative:
    statement: 全ての偏微分係数が0である点でfは極値をとる。
    reason: f(x,y)=xyは原点で両方の偏微分係数が0だが、原点の任意の近傍で正負の値をとる。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] (f : E → ℝ) (a v : E) (p : ℝ), IsLocalExtr f a → HasDerivAt (fun t : ℝ => f (a + t • v)) p 0 → p = 0
  proof: |
    by
      intro E _ _ f a v p hx hp
      have hc : ContinuousAt (fun t : ℝ => a + t • v) 0 := by fun_prop
      have hx' : IsLocalExtr f (a + (0 : ℝ) • v) := by simpa using hx
      have h2 := IsLocalExtr.comp_continuous (g := fun t : ℝ => a + t • v) (b := 0) hx' hc
      exact h2.hasDerivAt_eq_zero hp
- id: mean_value_inequality
  kind: textbook
  level: 2
  topic: 多変数関数・平均値の不等式
  statement: 実ノルム空間の凸集合$s$の各点で$f$が微分可能で$\|df(x)\|\leq C$ならば、$s$内の任意の$x,y$について$\|f(y)-f(x)\|\leq C\|y-x\|$である。
  statement_en: If f is differentiable at each point of a convex subset s of a real normed space with operator norm of the derivative at most C, then the norm of f(y)-f(x) is at most C times the norm of y-x for x, y in s.
  assumptions:
  - $E,F$は実ノルム空間
  - $s\subseteq E$は凸集合
  - $f:E\to F$は$s$の各点で微分可能
  - $s$の各点で$\|df(x)\|\leq C$
  quantifiers:
  - 任意の$f:E\to F$、$s\subseteq E$、$C\in\mathbb{R}$、$x,y\in s$
  conclusion: $\|f(y)-f(x)\|\leq C\|y-x\|$である。
  answer: |
    $E,F$を実ノルム空間、$s\subseteq E$を凸集合、$C\in\mathbb{R}$とする。$f:E\to F$は$s$の各点で微分可能で、$\|df(x)\|\leq C$を満たすとする。$x,y\in s$をとる。

    凸性より、線分$x+t(y-x)$（$0\leq t\leq1$）は$s$に含まれる。$g(t)=f(x+t(y-x))$とおく。連鎖律より$g$は$[0,1]$の各点で微分可能で、$g'(t)=df(x+t(y-x))(y-x)$である。よって$\|g'(t)\|\leq\|df(x+t(y-x))\|\|y-x\|\leq C\|y-x\|$である。

    ベクトル値の$1$変数関数についての平均値の不等式（$g:[0,1]\to F$が$[0,1]$の各点で微分可能で$\|g'(t)\|\leq K$なら、$\|g(1)-g(0)\|\leq K$）を$K=C\|y-x\|$で適用する。$g(0)=f(x)$、$g(1)=f(y)$なので、$\|f(y)-f(x)\|\leq C\|y-x\|$である。
  strategy: Restrict f to the segment from x to y and apply the one-variable mean value inequality.
  sketch:
  - 'setup: The segment from x to y lies in s by convexity.'
  - 'construct: Define g(t) = f(x + t(y-x)) on [0,1].'
  - 'derive: The chain rule bounds the norm of g''(t) by C times the norm of y-x.'
  - 'apply_theorem: The one-variable mean value inequality bounds g(1)-g(0).'
  - 'conclude: Since g(1)-g(0) = f(y)-f(x), the inequality follows.'
  openmath: (forall (E F f s C x y) (-> (and (normed_space E) (normed_space F) (convex_set s) (forall (z) (-> (in z s) (and (differentiable_at f z) (<= (norm (fderiv_at f z)) C)))) (in x s) (in y s)) (<= (norm (- (fn_value f y) (fn_value f x))) (* C (norm (- y x))))))
  hard_negative:
    statement: ベクトル値写像f:s→Fについて、ある線分上の点zでf(y)-f(x)=df(z)(y-x)が成り立つ。
    reason: 値域が2次元以上では等式は一般に成り立たない。f(t)=(cos t, sin t)はf(2π)-f(0)=0だが、df(z)(2π)≠0である。
  target: |
    ∀ (E F : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] [NormedAddCommGroup F] [NormedSpace ℝ F] (f : E → F) (s : Set E) (C : ℝ), Convex ℝ s → (∀ x ∈ s, DifferentiableAt ℝ f x) → (∀ x ∈ s, ‖fderiv ℝ f x‖ ≤ C) → ∀ x ∈ s, ∀ y ∈ s, ‖f y - f x‖ ≤ C * ‖y - x‖
  proof: |
    by
      intro E F _ _ _ _ f s C hs hd hb x hx y hy
      exact hs.norm_image_sub_le_of_norm_fderiv_le hd hb hx hy
- id: zero_derivative_constant_on_connected
  kind: gap
  level: 2
  topic: 多変数関数・微分が0の写像
  statement: 実ノルム空間の連結な開集合$s$上で$f$が微分可能で、$s$の全ての点で微分が$0$ならば、$f$は$s$上で定数である。
  statement_en: If f is differentiable on a connected open subset s of a real normed space and its derivative vanishes at each point of s, then f is constant on s.
  assumptions:
  - $E,F$は実ノルム空間
  - $s\subseteq E$は連結な開集合
  - $f:E\to F$は$s$上で微分可能
  - $s$上で$df=0$
  quantifiers:
  - 任意の$f:E\to F$、$s\subseteq E$、$x,y\in s$
  conclusion: $f(x)=f(y)$である。
  answer: |
    $E,F$を実ノルム空間、$s\subseteq E$を連結な開集合とし、$f:E\to F$は$s$上で微分可能で、$s$の全ての点で$df=0$とする。$s$が空なら示すことはない。

    $x_0\in s$を固定し、$A=\{x\in s\mid f(x)=f(x_0)\}$とおく。$x_0\in A$なので$A$は空でない。$f$は$s$上で連続なので、$A$は$s$で閉である。

    $x\in A$とする。$s$は開集合なので、$x$を中心とする開球$B\subseteq s$がとれる。$B$は凸である。平均値の不等式（凸集合の各点で$\|df\|\leq C$なら、その集合の$u,v$について$\|f(u)-f(v)\|\leq C\|u-v\|$）を$C=0$で適用すると、$f$は$B$上で定数である。よって$B\subseteq A$であり、$A$は$s$で開である。

    $s$は連結なので$A=s$である。したがって全ての$x,y\in s$で$f(x)=f(y)$である。
  strategy: Show that a level set of f is open and closed in s, using the mean value inequality on small balls.
  sketch:
  - 'setup: Fix x_0 in s and define A as the set of points of s where f equals f(x_0).'
  - 'derive: Continuity makes A closed in s.'
  - 'apply_theorem: The mean value inequality with C = 0 makes f constant on balls in s, so A is open.'
  - 'derive: A contains x_0, so it is nonempty.'
  - 'conclude: Connectedness of s gives A = s.'
  openmath: (forall (E F f s x y) (-> (and (normed_space E) (normed_space F) (open_set s) (preconnected_in s E) (forall (z) (-> (in z s) (and (differentiable_at f z) (= (fderiv_at f z) 0)))) (in x s) (in y s)) (= (fn_value f x) (fn_value f y))))
  hard_negative:
    statement: 開集合s上でdf=0ならばfはs上で定数である。
    reason: 連結性が必要である。2つの互いに素な開球の和集合上で、球ごとに異なる定数を値とする関数が反例である。
  target: |
    ∀ (E F : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] [NormedAddCommGroup F] [NormedSpace ℝ F] (f : E → F) (s : Set E), IsOpen s → IsPreconnected s → DifferentiableOn ℝ f s → (∀ x ∈ s, fderiv ℝ f x = 0) → ∀ x ∈ s, ∀ y ∈ s, f x = f y
  proof: |
    by
      intro E F _ _ _ _ f s ho hc hd hz x hx y hy
      exact ho.is_const_of_fderiv_eq_zero hc hd (fun z hz' => hz z hz') hx hy
- id: c1_partials_imply_differentiable
  kind: textbook
  level: 2
  topic: 多変数関数・C1級と全微分可能性
  statement: $f:\mathbb{R}^2\to\mathbb{R}$の偏導関数$f_x,f_y$が全ての点に存在し連続ならば、$f$は全ての点$p$で微分可能で、微分は$(h,k)\mapsto f_x(p)h+f_y(p)k$である。
  statement_en: If the partial derivatives f_x and f_y of f from R^2 to R exist everywhere and are continuous, then f is differentiable at each point p with derivative (h,k) ↦ f_x(p)h + f_y(p)k.
  assumptions:
  - $f:\mathbb{R}^2\to\mathbb{R}$
  - $f_x,f_y$は全ての点に存在し連続
  quantifiers:
  - 任意の$f,f_x,f_y:\mathbb{R}^2\to\mathbb{R}$と$p\in\mathbb{R}^2$
  conclusion: $f$は$p$で微分可能で、微分は$(h,k)\mapsto f_x(p)h+f_y(p)k$である。
  answer: |
    $f:\mathbb{R}^2\to\mathbb{R}$の偏導関数$f_x,f_y:\mathbb{R}^2\to\mathbb{R}$が全ての点に存在し連続であるとする。$p=(a,b)$とする。$\mathbb{R}^2$のノルムは$\|(h,k)\|=\max(|h|,|k|)$とする。$\mathbb{R}^2$のノルムはすべて同値なので、微分可能性はノルムの選び方によらない。

    $\varepsilon>0$とする。$f_x,f_y$の$p$での連続性から$\delta>0$があり、$\|q-p\|<\delta$なら$|f_x(q)-f_x(p)|<\varepsilon$かつ$|f_y(q)-f_y(p)|<\varepsilon$である。$\|(h,k)\|<\delta$とする。

    $f(a+h,b+k)-f(a,b)=(f(a+h,b+k)-f(a,b+k))+(f(a,b+k)-f(a,b))$と分ける。$1$変数の平均値の定理より、ある$0<\theta,\theta'<1$で第$1$項は$f_x(a+\theta h,b+k)h$、第$2$項は$f_y(a,b+\theta'k)k$と書ける。点$(a+\theta h,b+k)$と$(a,b+\theta'k)$は$p$から距離$\delta$未満にある。したがって$|f(a+h,b+k)-f(a,b)-f_x(p)h-f_y(p)k|\leq\varepsilon|h|+\varepsilon|k|\leq2\varepsilon\|(h,k)\|$である。

    $\varepsilon$は任意なので、$f$は$p$で微分可能であり、微分は$(h,k)\mapsto f_x(p)h+f_y(p)k$である。
  strategy: Change one variable at a time, apply the one-variable mean value theorem, and use continuity of the partial derivatives.
  sketch:
  - 'setup: Split the increment of f into a change in x followed by a change in y.'
  - 'apply_theorem: The one-variable mean value theorem expresses each piece through a partial derivative at an intermediate point.'
  - 'derive: Continuity of the partial derivatives replaces the intermediate points by p up to o(h,k).'
  - 'conclude: The sum is the claimed linear map plus a little-o remainder.'
  openmath: (forall (f fx fy p) (-> (and (forall (q) (has_deriv_at (lambda (s) (fn_value f (ordered_pair s (second_coord q)))) (fn_value fx q) (first_coord q))) (forall (q) (has_deriv_at (lambda (s) (fn_value f (ordered_pair (first_coord q) s))) (fn_value fy q) (second_coord q))) (continuous_map fx) (continuous_map fy)) (and (differentiable_at f p) (forall (h k) (= (fn_value (fderiv_at f p) (ordered_pair h k)) (+ (* (fn_value fx p) h) (* (fn_value fy p) k)))))))
  hard_negative:
    statement: 偏導関数が全ての点に存在すれば、連続でなくてもfは微分可能である。
    reason: xy/(x^2+y^2), f(0,0)=0は偏導関数が全ての点に存在するが、原点で連続でなく微分可能でない。
  target: |
    ∀ (f fx fy : ℝ × ℝ → ℝ), (∀ p : ℝ × ℝ, HasDerivAt (fun s : ℝ => f (s, p.2)) (fx p) p.1) → (∀ p : ℝ × ℝ, HasDerivAt (fun s : ℝ => f (p.1, s)) (fy p) p.2) → Continuous fx → Continuous fy → ∀ p : ℝ × ℝ, HasFDerivAt f (fx p • ContinuousLinearMap.fst ℝ ℝ ℝ + fy p • ContinuousLinearMap.snd ℝ ℝ ℝ) p
  proof: |
    by
      intro f fx fy hx hy cx cy p
      have hxF : ∀ v : ℝ × ℝ, HasFDerivAt (fun s : ℝ => f (s, v.2)) (fx v • ContinuousLinearMap.id ℝ ℝ) v.1 := fun v => by
        have h := (hx v).hasFDerivAt
        have e : ContinuousLinearMap.toSpanSingleton ℝ (fx v) = fx v • ContinuousLinearMap.id ℝ ℝ := by
          ext
          simp
        rw [e] at h
        exact h
      have hyF : ∀ v : ℝ × ℝ, HasFDerivAt (fun s : ℝ => f (v.1, s)) (fy v • ContinuousLinearMap.id ℝ ℝ) v.2 := fun v => by
        have h := (hy v).hasFDerivAt
        have e : ContinuousLinearMap.toSpanSingleton ℝ (fy v) = fy v • ContinuousLinearMap.id ℝ ℝ := by
          ext
          simp
        rw [e] at h
        exact h
      have ccx : Continuous fun v : ℝ × ℝ => fx v • ContinuousLinearMap.id ℝ ℝ := cx.smul continuous_const
      have ccy : Continuous fun v : ℝ × ℝ => fy v • ContinuousLinearMap.id ℝ ℝ := cy.smul continuous_const
      have key := hasStrictFDerivAt_uncurry_coprod (𝕜 := ℝ) (u := p)
        (f := fun x y => f (x, y))
        (f₁ := fun x y => fx (x, y) • ContinuousLinearMap.id ℝ ℝ)
        (f₂ := fun x y => fy (x, y) • ContinuousLinearMap.id ℝ ℝ)
        (Filter.Eventually.of_forall hxF) (Filter.Eventually.of_forall hyF)
        ccx.continuousAt ccy.continuousAt
      have h : HasFDerivAt f _ p := key.hasFDerivAt
      refine h.congr_fderiv ?_
      ext <;> simp [Function.HasUncurry.uncurry]
- id: schwarz_mixed_partials
  kind: named
  level: 2
  topic: 多変数関数・シュワルツの定理
  statement: （シュワルツの定理）$f:\mathbb{R}^2\to\mathbb{R}$が$C^2$級ならば、全ての点$(a,b)$で$\partial_x\partial_y f(a,b)=\partial_y\partial_x f(a,b)$である。すなわち偏微分の順序を交換できる。
  statement_en: (Schwarz) If f from R^2 to R is of class C^2, then the mixed partial derivatives at each point agree, that is, the order of partial differentiation can be interchanged.
  assumptions:
  - $f:\mathbb{R}^2\to\mathbb{R}$は$C^2$級
  quantifiers:
  - 任意の$f:\mathbb{R}^2\to\mathbb{R}$と$a,b\in\mathbb{R}$
  conclusion: $y$で微分してから$x$で微分した結果と、$x$で微分してから$y$で微分した結果は$(a,b)$で一致する。
  answer: |
    $f:\mathbb{R}^2\to\mathbb{R}$を$C^2$級とし、$(a,b)\in\mathbb{R}^2$とする。$\partial_x\partial_y f$は$y$で微分してから$x$で微分したものを表す。$C^2$級なので、$\partial_x\partial_y f$と$\partial_y\partial_x f$は存在して連続である。

    $h,k\neq0$について$D(h,k)=f(a+h,b+k)-f(a+h,b)-f(a,b+k)+f(a,b)$とおく。

    $\phi(x)=f(x,b+k)-f(x,b)$とおくと$D(h,k)=\phi(a+h)-\phi(a)$である。平均値の定理より、ある$0<\theta<1$で$D(h,k)=\phi'(a+\theta h)h=(\partial_x f(a+\theta h,b+k)-\partial_x f(a+\theta h,b))h$である。さらに$y\mapsto\partial_x f(a+\theta h,y)$に平均値の定理を使うと、ある$0<\theta'<1$で$D(h,k)=\partial_y\partial_x f(a+\theta h,b+\theta'k)hk$である。

    同様に$\psi(y)=f(a+h,y)-f(a,y)$とおくと$D(h,k)=\psi(b+k)-\psi(b)$である。平均値の定理を$y$について、次に$x$について使うと、ある$0<\sigma,\sigma'<1$で$D(h,k)=\partial_x\partial_y f(a+\sigma'h,b+\sigma k)hk$である。

    $hk\neq0$で割ると$\partial_y\partial_x f(a+\theta h,b+\theta'k)=\partial_x\partial_y f(a+\sigma'h,b+\sigma k)$である。$h,k\to0$とすると、両辺の点は$(a,b)$に近づく。二階偏導関数の連続性から$\partial_y\partial_x f(a,b)=\partial_x\partial_y f(a,b)$である。
  strategy: Express the symmetric second difference through both mixed partials using the mean value theorem twice, then pass to the limit by continuity.
  sketch:
  - 'construct: Define the second difference D(h,k) of f around (a,b).'
  - 'apply_theorem: The mean value theorem in x, then in y, expresses D through one mixed partial.'
  - 'apply_theorem: The same argument in the other order expresses D through the other mixed partial.'
  - 'derive: Divide by hk and let h and k tend to 0.'
  - 'conclude: Continuity of the second partial derivatives makes the two limits equal.'
  openmath: (forall (f a b) (-> (cont_diff 2 f) (= (deriv_at_point (lambda (x) (deriv_at_point (lambda (y) (fn_value f (ordered_pair x y))) b)) a) (deriv_at_point (lambda (y) (deriv_at_point (lambda (x) (fn_value f (ordered_pair x y))) a)) b))))
  hard_negative:
    statement: 二階偏導関数f_{xy}, f_{yx}が全ての点に存在すれば、連続でなくてもf_{xy}=f_{yx}である。
    reason: f(x,y)=xy(x^2-y^2)/(x^2+y^2), f(0,0)=0は二階偏導関数が存在するが、f_{xy}(0,0)とf_{yx}(0,0)は符号が異なる±1である。
  target: |
    ∀ (f : ℝ × ℝ → ℝ) (a b : ℝ), ContDiff ℝ 2 f → deriv (fun x : ℝ => deriv (fun y : ℝ => f (x, y)) b) a = deriv (fun y : ℝ => deriv (fun x : ℝ => f (x, y)) a) b
  proof: |
    by
      intro f a b hf
      have hd : Differentiable ℝ f := hf.differentiable two_ne_zero
      have hf' : ContDiff ℝ 1 (fderiv ℝ f) := hf.fderiv_right (by norm_num)
      have hd2 : Differentiable ℝ (fderiv ℝ f) := hf'.differentiable one_ne_zero
      have h1 : ∀ x y : ℝ, deriv (fun s : ℝ => f (x, s)) y = fderiv ℝ f (x, y) (0, 1) := fun x y =>
        (HasFDerivAt.comp_hasDerivAt (f := fun s : ℝ => (x, s)) y (hd (x, y)).hasFDerivAt
          ((hasDerivAt_const y x).prodMk (hasDerivAt_id y))).deriv
      have h2 : ∀ x y : ℝ, deriv (fun s : ℝ => f (s, y)) x = fderiv ℝ f (x, y) (1, 0) := fun x y =>
        (HasFDerivAt.comp_hasDerivAt (f := fun s : ℝ => (s, y)) x (hd (x, y)).hasFDerivAt
          ((hasDerivAt_id x).prodMk (hasDerivAt_const x y))).deriv
      simp only [h1, h2]
      have h3 : HasDerivAt (fun x : ℝ => fderiv ℝ f (x, b)) (fderiv ℝ (fderiv ℝ f) (a, b) (1, 0)) a :=
        HasFDerivAt.comp_hasDerivAt (f := fun s : ℝ => (s, b)) a (hd2 (a, b)).hasFDerivAt
          ((hasDerivAt_id a).prodMk (hasDerivAt_const a b))
      have h4 : HasDerivAt (fun y : ℝ => fderiv ℝ f (a, y)) (fderiv ℝ (fderiv ℝ f) (a, b) (0, 1)) b :=
        HasFDerivAt.comp_hasDerivAt (f := fun s : ℝ => (a, s)) b (hd2 (a, b)).hasFDerivAt
          ((hasDerivAt_const b a).prodMk (hasDerivAt_id b))
      have h5 := (h3.clm_apply (hasDerivAt_const a ((0 : ℝ), (1 : ℝ)))).deriv
      have h6 := (h4.clm_apply (hasDerivAt_const b ((1 : ℝ), (0 : ℝ)))).deriv
      rw [h5, h6]
      simp only [map_zero, add_zero]
      exact hf.contDiffAt.isSymmSndFDerivAt (by simp) _ _
- id: gradient_field_is_curl_free
  kind: gap
  level: 2
  topic: 多変数関数・勾配場の積分可能条件
  statement: $C^2$級関数$f:\mathbb{R}^2\to\mathbb{R}$について、$P=f_x$、$Q=f_y$ならば全ての点で$P_y=Q_x$である。すなわち勾配場は渦なしである。
  statement_en: If f from R^2 to R is of class C^2 with partial derivatives P = f_x and Q = f_y, then P_y = Q_x everywhere, so a gradient field is curl-free.
  assumptions:
  - $f:\mathbb{R}^2\to\mathbb{R}$は$C^2$級
  - $P(q)=df(q)(1,0)$、$Q(q)=df(q)(0,1)$
  quantifiers:
  - 任意の$f,P,Q:\mathbb{R}^2\to\mathbb{R}$と$p\in\mathbb{R}^2$
  conclusion: $dP(p)(0,1)=dQ(p)(1,0)$である。
  answer: |
    $f:\mathbb{R}^2\to\mathbb{R}$を$C^2$級とし、$P,Q:\mathbb{R}^2\to\mathbb{R}$が全ての$q$で$P(q)=df(q)(1,0)$、$Q(q)=df(q)(0,1)$を満たすとする。$p\in\mathbb{R}^2$をとる。

    $P=\partial_x f$、$Q=\partial_y f$であり、$f$が$C^2$級なので$P,Q$は$C^1$級である。よって$dP(p)(0,1)=\partial_y P(p)=\partial_y\partial_x f(p)$、$dQ(p)(1,0)=\partial_x Q(p)=\partial_x\partial_y f(p)$である。シュワルツの定理（$C^2$級関数$f:\mathbb{R}^2\to\mathbb{R}$では全ての点で$\partial_x\partial_y f=\partial_y\partial_x f$）から、両者は等しい。
  strategy: Express P and Q through the first derivative of f and use symmetry of the second derivative.
  sketch:
  - 'translate: Write P(q) = df(q)(1,0) and Q(q) = df(q)(0,1).'
  - 'derive: Differentiating gives dP(p)(v) = d^2f(p)(v)(1,0) and dQ(p)(w) = d^2f(p)(w)(0,1).'
  - 'apply_theorem: The second derivative of a C^2 function is symmetric.'
  - 'conclude: Hence P_y = Q_x.'
  openmath: (forall (f P Q p) (-> (and (cont_diff 2 f) (forall (q) (= (fn_value (fderiv_at f q) (ordered_pair 1 0)) (fn_value P q))) (forall (q) (= (fn_value (fderiv_at f q) (ordered_pair 0 1)) (fn_value Q q)))) (= (fn_value (fderiv_at P p) (ordered_pair 0 1)) (fn_value (fderiv_at Q p) (ordered_pair 1 0)))))
  hard_negative:
    statement: R^2から原点を除いた領域で滑らかな場(P,Q)がP_y=Q_xを満たせば、そこで勾配場である。
    reason: P=-y/(x^2+y^2), Q=x/(x^2+y^2)はP_y=Q_xを満たすが、単位円上の線積分が2πなので勾配場でない。
  target: |
    ∀ (f P Q : ℝ × ℝ → ℝ), ContDiff ℝ 2 f → (∀ q, fderiv ℝ f q (1, 0) = P q) → (∀ q, fderiv ℝ f q (0, 1) = Q q) → ∀ p, fderiv ℝ P p (0, 1) = fderiv ℝ Q p (1, 0)
  proof: |
    by
      intro f P Q hf hP hQ p
      have hf' : ContDiff ℝ 1 (fderiv ℝ f) := hf.fderiv_right (by norm_num)
      have hd2 : DifferentiableAt ℝ (fderiv ℝ f) p := (hf'.differentiable one_ne_zero) p
      have e : ∀ w v : ℝ × ℝ, fderiv ℝ (fun q => fderiv ℝ f q w) p v = fderiv ℝ (fderiv ℝ f) p v w := by
        intro w v
        rw [(hd2.hasFDerivAt.clm_apply (hasFDerivAt_const w p)).fderiv]
        simp
      have eP : P = fun q => fderiv ℝ f q (1, 0) := funext fun q => (hP q).symm
      have eQ : Q = fun q => fderiv ℝ f q (0, 1) := funext fun q => (hQ q).symm
      rw [eP, eQ, e, e]
      exact hf.contDiffAt.isSymmSndFDerivAt (by simp) _ _
- id: euler_homogeneous_function
  kind: gap
  level: 2
  topic: 多変数関数・同次関数
  statement: 実ノルム空間$E$上の実数値関数$f$と実数$k$について、全ての$t>0$と$y\in E$で$f(ty)=t^kf(y)$が成り立ち、$f$の点$x$での微分が$L$ならば、$L(x)=kf(x)$である（オイラーの同次関数定理）。
  statement_en: 'If f : E -> R on a real normed space satisfies f(ty) = t^k f(y) for all t > 0 and y in E, with real k, and f has derivative L at x, then L(x) = k f(x) (Euler''s homogeneous function theorem).'
  assumptions:
  - $E$は実ノルム空間
  - $k\in\mathbb{R}$
  - 全ての$t>0$と$y\in E$で$f(ty)=t^kf(y)$
  - $f$の$x$での微分は$L$
  quantifiers:
  - 任意の$f:E\to\mathbb{R}$、$k\in\mathbb{R}$、$x\in E$、有界線形写像$L$
  conclusion: $L(x)=kf(x)$である。
  answer: |
    $E$を実ノルム空間、$k\in\mathbb{R}$とし、$f:E\to\mathbb{R}$は全ての$t>0$と$y\in E$で$f(ty)=t^kf(y)$を満たすとする（$t>0$に対し$t^k=e^{k\ln t}$）。$x\in E$での$f$の微分を$L$とする。

    $h(t)=f(tx)$とおく。$t\mapsto tx$の$t=1$での微分係数は$x$であり、$t=1$で点$x$を通る。連鎖律より$h'(1)=L(x)$である。一方、$t>0$では$h(t)=t^kf(x)$であり、$t\mapsto t^k$の$t=1$での微分係数は$k$なので、$h'(1)=kf(x)$である。したがって$L(x)=kf(x)$である。
  strategy: Differentiate the identity f(tx) = t^k f(x) at t = 1 in two ways.
  sketch:
  - 'construct: Define g(t) = f(tx) for real t.'
  - 'apply_theorem: The chain rule along the ray gives g''(1) = L(x).'
  - 'derive: Near t = 1 we have g(t) = t^k f(x), so g''(1) = k f(x).'
  - 'conclude: Uniqueness of the derivative gives L(x) = k f(x).'
  openmath: (forall (E f k x L) (-> (and (normed_space E) (in k R) (homogeneous_of_degree f k) (has_fderiv_at f L x)) (= (fn_value L x) (* k (fn_value f x)))))
  hard_negative:
    statement: L(x)=k f(x)が1点xで成り立てばfはk次同次である。
    reason: 同次性は全ての点と全てのtについての条件である。f(y)=y^2+1はx=0, k=0でL(x)=0=k f(x)を満たすが、0次同次でない。
  target: '∀ (E : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] (f : E → ℝ) (k : ℝ) (x : E) (L : E →L[ℝ] ℝ), (∀ t : ℝ, 0 < t → ∀ y : E, f (t • y) = t ^ k * f y) → HasFDerivAt f L x → L x = k * f x'
  proof: |
    by
      intro E _ _ f k x L hom hL
      have h1 : HasDerivAt (fun t : ℝ => t • x) x 1 := by
        simpa using (hasDerivAt_id (1 : ℝ)).smul_const x
      have hL' : HasFDerivAt f L ((1 : ℝ) • x) := by simpa using hL
      have h2 : HasDerivAt (fun t : ℝ => f (t • x)) (L x) 1 := hL'.comp_hasDerivAt 1 h1
      have h3 := (Real.hasDerivAt_rpow_const (x := (1 : ℝ)) (p := k) (Or.inl one_ne_zero)).mul_const (f x)
      have h4 : (fun t : ℝ => f (t • x)) =ᶠ[nhds 1] fun t : ℝ => t ^ k * f x := by
        filter_upwards [lt_mem_nhds (one_pos : (0 : ℝ) < 1)] with t ht
        exact hom t ht x
      have h5 := h2.unique (h3.congr_of_eventuallyEq h4)
      simpa using h5
- id: inverse_function_theorem
  kind: named
  level: 2
  topic: 多変数関数・逆関数定理
  statement: （逆関数定理）バナッハ空間$E$から実ノルム空間$F$への写像$f$が点$a$の近くで$C^1$級で、$a$での微分$L$が連続線形同型ならば、$g(f(a))=a$を満たす$g:F\to E$が存在し、$a$の近くで$g(f(x))=x$、$f(a)$の近くで$f(g(y))=y$を満たす。さらに$g$は$f(a)$の近くで$C^1$級で、$f(a)$での微分は$L^{-1}$である。
  statement_en: (Inverse function theorem) If a C^1 map f between Banach spaces has at a a derivative L with bounded inverse, then there is g with g(f(a)) = a that inverts f near a and near f(a), g is C^1 at f(a), and its derivative there is the inverse of L.
  assumptions:
  - $E$はバナッハ空間、$F$は実ノルム空間
  - $f:E\to F$は$a$の近くで$C^1$級
  - $f$の$a$での微分$L$は連続線形同型
  quantifiers:
  - 任意の$f:E\to F$、連続線形同型$L:E\to F$、$a\in E$
  conclusion: $f$の局所逆写像$g$が存在し、$f(a)$の近くで$C^1$級で、$f(a)$での微分は$L^{-1}$である。
  answer: |
    $E$をバナッハ空間、$F$を実ノルム空間とする。$f:E\to F$は$a\in E$の近くで$C^1$級で、$a$での微分$L$は連続線形同型であるとする。$b=f(a)$、$C=\|L^{-1}\|+1$とおく。バナッハの不動点定理（完備距離空間から自身への縮小写像はただ一つの不動点をもつ）と、平均値の不等式を用いる。

    局所的な縮小性を示す。$df$は$a$の近傍で連続で$df(a)=L$なので、$r>0$があり、閉球$\bar B=\bar B(a,r)$の近傍で$f$は$C^1$級で、$\bar B$上で$\|I-L^{-1}df(x)\|\leq1/2$である。$\phi(x)=x-L^{-1}f(x)$とおくと$d\phi(x)=I-L^{-1}df(x)$である。$\bar B$は凸なので、平均値の不等式より$x,x'\in\bar B$で$\|\phi(x)-\phi(x')\|\leq\|x-x'\|/2$である。これと$x-x'=\phi(x)-\phi(x')+L^{-1}(f(x)-f(x'))$から、$\|x-x'\|\leq2C\|f(x)-f(x')\|$を得る。特に$f$は$\bar B$上で単射である。

    局所逆写像を構成する。$\rho=r/(2C)$とし、$V$を$b$を中心とする半径$\rho$の開球とする。$y\in V$に対して$\Phi_y(x)=x-L^{-1}(f(x)-y)=\phi(x)+L^{-1}y$とおく。$\Phi_y$は$\bar B$上で比$1/2$の縮小である。$x\in\bar B$なら$\|\Phi_y(x)-a\|\leq\|\Phi_y(x)-\Phi_y(a)\|+\|L^{-1}(y-b)\|\leq r/2+C\rho=r$なので、$\Phi_y$は$\bar B$を自身に写す。$\bar B$は完備なので、不動点定理から$\Phi_y(x)=x$となる$x\in\bar B$がただ一つある。$\Phi_y(x)=x$は$f(x)=y$と同値である。この$x$を$g(y)$とし、$y\notin V$では$g(y)=a$と定める。

    すると$V$上で$f(g(y))=y$であり、$a$は$\Phi_b$の不動点なので$g(b)=a$である。$f$は$a$で連続なので、$a$の近傍$W\subseteq\bar B$で$f(W)\subseteq V$となるものがある。$x\in W$なら、不動点の一意性から$g(f(x))=x$である。また$y,y'\in V$で$\|g(y)-g(y')\|\leq2C\|y-y'\|$なので、$g$は$V$上で連続である。

    $g$の微分を求める。$y_0\in V$、$x_0=g(y_0)$、$A=df(x_0)$とする。$\|I-L^{-1}A\|\leq1/2$なので、ノイマン級数により$L^{-1}A$は$E$上の連続線形同型であり、$A$も連続線形同型である。$y\in V$について$k=y-y_0$、$h=g(y)-x_0$とおくと$\|h\|\leq2C\|k\|$である。$k=f(x_0+h)-f(x_0)=Ah+R(h)$、$R(h)=o(\|h\|)$と書ける。よって$h=A^{-1}k-A^{-1}R(h)$であり、$\|A^{-1}R(h)\|=o(\|k\|)$である。したがって$g$は$y_0$で微分可能で、$dg(y_0)=(df(g(y_0)))^{-1}$である。特に$dg(b)=L^{-1}$である。

    最後に、$(df(x))^{-1}=(L^{-1}df(x))^{-1}L^{-1}$であり、$E$上の連続線形同型の逆をとる操作は連続である。$g$と$df$も連続なので、$dg$は$V$上で連続である。よって$g$は$b$の近傍$V$で$C^1$級である。
  strategy: Solve f(x) = y as a fixed point problem and apply the contraction mapping principle near a.
  sketch:
  - 'translate: Rewrite f(x) = y as the fixed point equation x = x - L^{-1}(f(x) - y).'
  - 'derive: Since f is C^1, this map is a contraction on a small closed ball around a.'
  - 'apply_theorem: The contraction mapping principle gives a unique solution for each y near f(a).'
  - 'construct: Let g(y) be this solution, a local inverse of f.'
  - 'derive: Inverting the linear approximation of f gives the derivative of g.'
  - 'conclude: The formula for the derivative shows that g is C^1 at f(a).'
  openmath: (forall (E F f L a) (-> (and (banach_space E) (normed_space F) (cont_diff_at 1 f a) (has_fderiv_at f L a) (linear_iso L)) (exists (g) (and (= (fn_value g (fn_value f a)) a) (local_inverse_of g f a) (has_fderiv_at g (inverse_operator L) (fn_value f a)) (cont_diff_at 1 g (fn_value f a))))))
  hard_negative:
    statement: 全ての点で微分が可逆なC^1級写像は、全体で単射である。
    reason: f(x,y)=(e^x cos y, e^x sin y)はヤコビ行列式e^{2x}が常に正だが、yについて周期2πなので単射でない。
  target: |
    ∀ (E F : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] [CompleteSpace E] [NormedAddCommGroup F] [NormedSpace ℝ F] (f : E → F) (L : E ≃L[ℝ] F) (a : E), ContDiffAt ℝ 1 f a → HasFDerivAt f (L : E →L[ℝ] F) a → ∃ g : F → E, g (f a) = a ∧ (∀ᶠ x in nhds a, g (f x) = x) ∧ (∀ᶠ y in nhds (f a), f (g y) = y) ∧ HasFDerivAt g (L.symm : F →L[ℝ] E) (f a) ∧ ContDiffAt ℝ 1 g (f a)
  proof: |
    by
      intro E F _ _ _ _ _ f L a hf hL
      have hs := hf.hasStrictFDerivAt' hL one_ne_zero
      exact ⟨hf.localInverse hL one_ne_zero, hf.localInverse_apply_image hL one_ne_zero,
        hs.eventually_left_inverse, hs.eventually_right_inverse,
        hs.to_localInverse.hasFDerivAt, hf.to_localInverse hL one_ne_zero⟩
- id: derivative_of_local_inverse
  kind: gap
  level: 2
  topic: 多変数関数・逆写像の微分
  statement: $g$が点$b$で連続で、$b$の近くで$f(g(y))=y$を満たし、$f$の$g(b)$での微分が連続線形同型$L$ならば、$g$は$b$で微分可能で、微分は$L^{-1}$である。
  statement_en: If g is continuous at b, f(g(y)) = y for y near b, and f has at g(b) a derivative L that is a continuous linear isomorphism, then g is differentiable at b with derivative the inverse of L.
  assumptions:
  - $E,F$は実ノルム空間
  - $g:F\to E$は$b$で連続
  - $b$の近くで$f(g(y))=y$
  - $f:E\to F$の$g(b)$での微分は連続線形同型$L$
  quantifiers:
  - 任意の$f:E\to F$、$g:F\to E$、連続線形同型$L:E\to F$、$b\in F$
  conclusion: $g$の$b$での微分は$L^{-1}$である。
  answer: |
    $E,F$を実ノルム空間とし、$f:E\to F$、$g:F\to E$、$b\in F$とする。$g$は$b$で連続で、$b$の近くで$f(g(y))=y$であり、$f$の$g(b)$での微分は連続線形同型$L$であるとする。$C=\|L^{-1}\|+1$とおく。

    $R(h)=f(g(b)+h)-f(g(b))-L(h)$とおくと、$R(h)=o(\|h\|)$である。$y$を$b$の近くにとり、$k=y-b$、$h=g(y)-g(b)$とおく。$f(g(y))=y$かつ$f(g(b))=b$なので、$k=L(h)+R(h)$である。$L^{-1}$を作用させると$h=L^{-1}(k)-L^{-1}(R(h))$である。

    $0<\varepsilon\leq1/(2C)$とする。$\delta>0$があり、$\|h\|<\delta$なら$\|R(h)\|\leq\varepsilon\|h\|$である。$g$の$b$での連続性から、$k$が十分小さければ$\|h\|<\delta$である。このとき$\|h\|\leq C\|k\|+C\varepsilon\|h\|\leq C\|k\|+\|h\|/2$なので、$\|h\|\leq2C\|k\|$である。よって$\|h-L^{-1}(k)\|\leq C\|R(h)\|\leq C\varepsilon\|h\|\leq2C^2\varepsilon\|k\|$である。

    $\varepsilon$はいくらでも小さくとれるので、$g(b+k)-g(b)-L^{-1}(k)=o(\|k\|)$である。すなわち$g$の$b$での微分は$L^{-1}$である。
  strategy: Invert the first-order expansion of f at g(b) and use continuity of g to control the remainder.
  sketch:
  - 'setup: Put k = y - b and h = g(y) - g(b).'
  - 'derive: The expansion of f gives k = L(h) + o(h).'
  - 'derive: Applying the inverse of L gives h = L^{-1}(k) + o(h).'
  - 'derive: Continuity of g and boundedness of the inverse give a bound of h by a constant times k.'
  - 'conclude: Therefore h = L^{-1}(k) + o(k), which is differentiability with the stated derivative.'
  openmath: (forall (E F f g L b) (-> (and (normed_space E) (normed_space F) (continuous_map_at g b) (linear_iso L) (has_fderiv_at f L (fn_value g b)) (right_inverse_near f g b)) (has_fderiv_at g (inverse_operator L) b)))
  hard_negative:
    statement: gがbで連続でf(g(y))=yならば、fの微分が可逆でなくてもgはbで微分可能である。
    reason: f(x)=x^3, g(y)=y^{1/3}はf(g(y))=yで連続だが、f'(0)=0でありgは0で微分可能でない。
  target: |
    ∀ (E F : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] [NormedAddCommGroup F] [NormedSpace ℝ F] (f : E → F) (g : F → E) (L : E ≃L[ℝ] F) (b : F), ContinuousAt g b → HasFDerivAt f (L : E →L[ℝ] F) (g b) → (∀ᶠ y in nhds b, f (g y) = y) → HasFDerivAt g (L.symm : F →L[ℝ] E) b
  proof: |
    by
      intro E F _ _ _ _ f g L b hg hf hfg
      exact HasFDerivAt.of_local_left_inverse hg hf hfg
- id: implicit_function_theorem
  kind: named
  level: 2
  topic: 多変数関数・陰関数定理
  statement: （陰関数定理）$E_1,E_2,F$をバナッハ空間とする。$f:E_1\times E_2\to F$が点$u=(u_1,u_2)$の近くで$C^1$級で、$u$での微分$L$の第$2$変数方向の部分$M=L(0,\cdot)$が有界な逆をもつとする。このとき$\varphi:E_1\to E_2$が存在し、$\varphi(u_1)=u_2$で、$u$の近くの点$v=(v_1,v_2)$について$f(v)=f(u)$は$\varphi(v_1)=v_2$と同値である。さらに$\varphi$は$u_1$で微分可能で、微分は$-M^{-1}\circ L(\cdot,0)$である。
  statement_en: (Implicit function theorem) Let E_1, E_2, F be Banach spaces, f from E_1×E_2 to F be C^1 near u, and suppose the partial derivative M of the derivative L at u in the second variable has a bounded inverse. Then there is φ with φ(u_1) = u_2 such that, for v near u, f(v) = f(u) if and only if φ(v_1) = v_2. Moreover φ is differentiable at u_1 with derivative -M^{-1} composed with the partial derivative of L in the first variable.
  assumptions:
  - $E_1,E_2,F$はバナッハ空間
  - $f:E_1\times E_2\to F$は$u$の近くで$C^1$級で、$u$での微分は$L$
  - $M=L(0,\cdot)$は$E_2$から$F$への有界な逆をもつ
  quantifiers:
  - 任意の$f:E_1\times E_2\to F$、有界線形写像$L$、$u\in E_1\times E_2$
  conclusion: $u$の近くで$f(v)=f(u)$の解は$\varphi$のグラフで与えられ、$d\varphi(u_1)=-M^{-1}\circ L(\cdot,0)$である。
  answer: |
    $E_1,E_2,F$をバナッハ空間とする。$f:E_1\times E_2\to F$は$u=(u_1,u_2)$の近くで$C^1$級で、$u$での微分を$L$とする。$M=L(0,\cdot):E_2\to F$は有界な逆をもつとする。

    $G:E_1\times E_2\to E_1\times F$を$G(x,y)=(x,f(x,y))$で定める。$G$は$u$の近くで$C^1$級で、$dG(u)(h,k)=(h,L(h,0)+Mk)$である。この線形写像は有界な逆$(h,w)\mapsto(h,M^{-1}(w-L(h,0)))$をもつ。$E_1\times E_2$はバナッハ空間なので、逆関数定理を適用できる。よって$H:E_1\times F\to E_1\times E_2$があり、$H(G(u))=u$、$u$の近くで$H(G(v))=v$、$G(u)=(u_1,f(u))$の近くで$G(H(z))=z$を満たす。さらに$H$は$G(u)$で微分可能で、微分は$dG(u)^{-1}$である。

    $H$の第$2$成分を$H_2$とし、$\varphi(x)=H_2(x,f(u))$と定める。$H(G(u))=u$より$\varphi(u_1)=u_2$である。

    $v=(v_1,v_2)$を$u$に十分近くとり、$H(G(v))=v$かつ$G(H(v_1,f(u)))=(v_1,f(u))$が成り立つとする。

    $f(v)=f(u)$とする。$G(v)=(v_1,f(u))$なので$H(v_1,f(u))=H(G(v))=v$であり、第$2$成分を比べて$\varphi(v_1)=v_2$である。

    逆に$\varphi(v_1)=v_2$とする。$G(H(v_1,f(u)))=(v_1,f(u))$の第$1$成分を比べると、$H(v_1,f(u))$の第$1$成分は$v_1$である。よって$H(v_1,f(u))=(v_1,\varphi(v_1))=v$である。したがって$G(v)=(v_1,f(u))$であり、$f(v)=f(u)$である。

    微分を求める。$\varphi$は$x\mapsto(x,f(u))$、$H$、第$2$成分への射影の合成なので、連鎖律より$u_1$で微分可能である。$d\varphi(u_1)(h)$は$dG(u)^{-1}(h,0)=(h,M^{-1}(0-L(h,0)))$の第$2$成分なので、$-M^{-1}(L(h,0))$である。
  strategy: Apply the inverse function theorem to G(x,y) = (x, f(x,y)) and read off the implicit function from its local inverse.
  sketch:
  - 'construct: Define G(x,y) = (x, f(x,y)).'
  - 'derive: The invertibility of M makes the derivative of G at u invertible.'
  - 'apply_theorem: The inverse function theorem gives a local inverse of G.'
  - 'construct: Define φ from the second component of this local inverse at (x, f(u)).'
  - 'derive: Near u the level set of f through u is the graph of φ.'
  - 'conclude: Differentiating f(x, φ(x)) = f(u) by the chain rule gives the derivative of φ.'
  openmath: (forall (E1 E2 F f L u) (-> (and (banach_space E1) (banach_space E2) (banach_space F) (cont_diff_at 1 f u) (has_fderiv_at f L u) (linear_iso (restricted_to_second L))) (exists (phi) (and (= (fn_value phi (first_coord u)) (second_coord u)) (locally_graph_of f phi u) (has_fderiv_at phi (operator_comp (scalar_multiple (neg 1) (inverse_operator (restricted_to_second L))) (restricted_to_first L)) (first_coord u))))))
  hard_negative:
    statement: f(x,y)=0でf_x≠0, f_y=0の点の近くでも、解集合はy=φ(x)の形のグラフで書ける。
    reason: f(x,y)=x-y^2は原点でf_y=0であり、解集合x=y^2は原点の近くでyをxの関数として一価に表せない。
  target: |
    ∀ (E₁ E₂ F : Type*) [NormedAddCommGroup E₁] [NormedSpace ℝ E₁] [CompleteSpace E₁] [NormedAddCommGroup E₂] [NormedSpace ℝ E₂] [CompleteSpace E₂] [NormedAddCommGroup F] [NormedSpace ℝ F] [CompleteSpace F] (f : E₁ × E₂ → F) (L : E₁ × E₂ →L[ℝ] F) (u : E₁ × E₂), ContDiffAt ℝ 1 f u → HasFDerivAt f L u → (L.comp (ContinuousLinearMap.inr ℝ E₁ E₂)).IsInvertible → ∃ φ : E₁ → E₂, φ u.1 = u.2 ∧ (∀ᶠ v in nhds u, f v = f u ↔ φ v.1 = v.2) ∧ HasFDerivAt φ (-((L.comp (ContinuousLinearMap.inr ℝ E₁ E₂)).inverse.comp (L.comp (ContinuousLinearMap.inl ℝ E₁ E₂)))) u.1
  proof: |
    by
      intro E₁ E₂ F _ _ _ _ _ _ _ _ _ f L u hf hL hinv
      have hs : HasStrictFDerivAt f L u := hf.hasStrictFDerivAt' hL one_ne_zero
      have he := hs.eventually_apply_eq_iff_implicitFunctionOfProdDomain hinv
      refine ⟨hs.implicitFunctionOfProdDomain hinv, he.self_of_nhds.mp rfl, he, ?_⟩
      have hd := (hs.hasStrictFDerivAt_implicitFunctionOfProdDomain hinv).hasFDerivAt
      convert hd using 1
- id: lagrange_multiplier
  kind: named
  level: 2
  topic: 多変数関数・ラグランジュの未定乗数法
  statement: （ラグランジュの未定乗数法）バナッハ空間$E$上の実数値関数$\varphi,g$が点$a$で強微分可能で、微分がそれぞれ$\varphi',g'$であり、$g'\neq0$とする。$\varphi$が等高集合$\{x\mid g(x)=g(a)\}$上で$a$において極値をとるならば、$\varphi'=\lambda g'$となる実数$\lambda$が存在する。
  statement_en: (Lagrange multipliers) Let φ and g be real-valued functions on a Banach space, strictly differentiable at a with derivatives φ' and g', and suppose g' is nonzero. If φ restricted to the level set of g through a has a local extremum at a, then φ' = λ g' for some real λ.
  assumptions:
  - $E$はバナッハ空間
  - $\varphi,g:E\to\mathbb{R}$は$a$で強微分可能（$C^1$級ならば成り立つ）
  - $g'\neq0$
  - $\varphi$は$\{x\mid g(x)=g(a)\}$上で$a$において極値をとる
  quantifiers:
  - 任意の$\varphi,g:E\to\mathbb{R}$、有界線形汎関数$\varphi',g'$、$a\in E$
  conclusion: $\varphi'=\lambda g'$となる$\lambda\in\mathbb{R}$が存在する。
  answer: |
    $E$をバナッハ空間、$\varphi,g:E\to\mathbb{R}$を$a\in E$で強微分可能な関数とし、微分をそれぞれ$\varphi',g'$、$g'\neq0$とする。$\varphi$は$\{x\mid g(x)=g(a)\}$上で$a$において極値をとるとする。$g$の強微分可能性とは、任意の$\varepsilon>0$に対して$\delta>0$があり、$\|x-a\|,\|x'-a\|<\delta$なら$|g(x)-g(x')-g'(x-x')|\leq\varepsilon\|x-x'\|$となることである。$\varphi$についても同様である。

    $\varphi'=\lambda g'$となる$\lambda$がないと仮定して矛盾を導く。

    $g'\neq0$より$g'(v_0)=1$となる$v_0$がある。$\psi=\varphi'-\varphi'(v_0)g'$は仮定から$0$でなく、$\psi(v_0)=0$である。$\psi(w_1)=1$となる$w_1$をとる。$w=w_1-g'(w_1)v_0$、$v=v_0-\varphi'(v_0)w$とおく。すると$g'(w)=0$、$\varphi'(w)=\psi(w)=1$であり、$g'(v)=1$、$\varphi'(v)=0$である。

    $\mathbb{R}^2$に最大値ノルムを入れ、$z=(s,t)$に対して$x(z)=a+sv+tw$、$\Psi(z)=(g(x(z)),\varphi(x(z)))$とおく。$K=\|v\|+\|w\|>0$とすると$\|x(z)-x(z')\|\leq K\|z-z'\|$である。$g'(sv+tw)=s$、$\varphi'(sv+tw)=t$なので、$R(z)=\Psi(z)-\Psi(0)-z$の差は$R(z)-R(z')=(g(x(z))-g(x(z'))-g'(x(z)-x(z')),\ \varphi(x(z))-\varphi(x(z'))-\varphi'(x(z)-x(z')))$である。強微分可能性を$\varepsilon=1/(2K)$で使うと、$r>0$があり、$\|z\|,\|z'\|\leq r$なら$\|R(z)-R(z')\|\leq\|z-z'\|/2$である。また$R(0)=0$である。

    $|\eta|\leq r/2$に対して$T(z)=(0,\eta)-R(z)$とおく。$\|z\|\leq r$なら$\|T(z)\|\leq|\eta|+\|z\|/2\leq r$なので、$T$は閉球$\{\|z\|\leq r\}$を自身に写す比$1/2$の縮小写像である。バナッハの不動点定理（完備距離空間から自身への縮小写像はただ一つの不動点をもつ）から不動点$z_\eta$がある。すると$\Psi(z_\eta)=\Psi(0)+(0,\eta)$である。つまり$x_\eta=x(z_\eta)$は$g(x_\eta)=g(a)$、$\varphi(x_\eta)=\varphi(a)+\eta$を満たす。さらに$\|z_\eta\|\leq|\eta|+\|z_\eta\|/2$より$\|z_\eta\|\leq2|\eta|$なので、$\|x_\eta-a\|\leq2K|\eta|$である。

    $\varphi$が$a$で極大なら$\eta>0$を十分小さくとり、極小なら$\eta<0$で$|\eta|$を十分小さくとる。すると$x_\eta$は$a$の近くの等高集合の点であり、$\varphi(x_\eta)=\varphi(a)+\eta$が極値であることに反する。したがって$\varphi'=\lambda g'$となる$\lambda\in\mathbb{R}$が存在する。
  strategy: Show that the pair of derivatives is not surjective onto R^2, obtain a linear dependence, and exclude the vanishing coefficient of φ'.
  sketch:
  - 'construct: Consider the map x ↦ (g(x), φ(x)) and its derivative at a.'
  - 'contradiction: If the derivative were surjective, an open mapping argument would contradict the local extremum on the level set.'
  - 'derive: Hence there is a nonzero pair (p,q) with p g'' + q φ'' = 0.'
  - 'case_split: If q = 0 then p is nonzero and g'' = 0, against the hypothesis.'
  - 'conclude: So q is nonzero and φ'' = (-p/q) g''.'
  openmath: (forall (E phi g dphi dg a) (-> (and (banach_space E) (has_strict_fderiv_at g dg a) (has_strict_fderiv_at phi dphi a) (!= dg 0) (local_extremum_on phi (level_set_through g a) a)) (exists (l) (= dphi (scalar_multiple l dg)))))
  hard_negative:
    statement: g'=0の点でも、制約付き極値点ならφ'=λg'となるλが存在する。
    reason: g(x,y)=y^2-x^3, φ=xでは曲線上の原点で最小値をとるが、g'(0,0)=0, φ'(0,0)≠0なのでλは存在しない。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] [CompleteSpace E] (φ g : E → ℝ) (φ' g' : E →L[ℝ] ℝ) (a : E), IsLocalExtrOn φ {x | g x = g a} a → HasStrictFDerivAt g g' a → HasStrictFDerivAt φ φ' a → g' ≠ 0 → ∃ l : ℝ, φ' = l • g'
  proof: |
    by
      intro E _ _ _ φ g φ' g' a hex hg hφ hne
      obtain ⟨p, q, hpq, h⟩ := hex.exists_multipliers_of_hasStrictFDerivAt_1d hg hφ
      have hq : q ≠ 0 := by
        rintro rfl
        have hp : p ≠ 0 := by
          rintro rfl
          exact hpq rfl
        rw [zero_smul, add_zero] at h
        exact hne ((smul_eq_zero.mp h).resolve_left hp)
      refine ⟨-(p / q), ?_⟩
      ext x
      have hx := congrArg (fun T : E →L[ℝ] ℝ => T x) h
      simp only [ContinuousLinearMap.add_apply, ContinuousLinearMap.smul_apply, smul_eq_mul,
        ContinuousLinearMap.zero_apply] at hx ⊢
      field_simp
      linarith
- id: continuous_on_box_integrable
  kind: gap
  level: 2
  topic: 重積分・連続関数の可積分性
  statement: $\mathbb{R}^n$の閉直方体$[a,b]$上で連続な関数$f$は、$[a,b]$上で可積分である。
  statement_en: A function continuous on a closed box [a,b] in R^n is integrable on [a,b].
  assumptions:
  - $f:\mathbb{R}^n\to\mathbb{R}$は閉直方体$[a,b]$上で連続
  quantifiers:
  - 任意の$n\in\mathbb{N}$、$f:\mathbb{R}^n\to\mathbb{R}$、$a,b\in\mathbb{R}^n$
  conclusion: $f$は$[a,b]$上でルベーグ可積分である。
  answer: |
    $n\in\mathbb{N}$、$a,b\in\mathbb{R}^n$とし、全ての$i$で$a_i\leq x_i\leq b_i$を満たす$x\in\mathbb{R}^n$全体を$[a,b]$とする。$f:\mathbb{R}^n\to\mathbb{R}$は$[a,b]$上で連続であるとする。$[a,b]$が空なら示すことはない。

    $[a,b]$は有界閉集合なのでコンパクトである。コンパクト集合上の連続関数は有界なので、$[a,b]$上で$|f|\leq M$となる$M$がある。$f$は$[a,b]$上で連続なので、$[a,b]$上で可測である。$[a,b]$の体積は有限なので、$\int_{[a,b]}|f|\,dx\leq M\cdot\mathrm{vol}([a,b])<\infty$である。よって$f$は$[a,b]$上で可積分である。
  strategy: Compactness gives boundedness, and a bounded measurable function on a set of finite measure is integrable.
  sketch:
  - 'derive: The closed box is compact.'
  - 'apply_theorem: A continuous function on a compact set is bounded.'
  - 'derive: The box has finite volume, so the integral of the absolute value of f is finite.'
  - 'conclude: Hence f is integrable on the box.'
  openmath: (forall (n f a b) (-> (continuous_on_set f (box_region a b)) (integrable_on_set (lambda (x) (fn_value f x)) (box_region a b))))
  hard_negative:
    statement: 開直方体上で連続な関数は、その開直方体上で可積分である。
    reason: 開区間(0,1)上のf(x)=1/xは連続だが可積分でない。
  target: |
    ∀ (n : ℕ) (f : (Fin n → ℝ) → ℝ) (a b : Fin n → ℝ), ContinuousOn f (Set.Icc a b) → MeasureTheory.IntegrableOn f (Set.Icc a b)
  proof: |
    by
      intro n f a b hf
      exact hf.integrableOn_compact isCompact_Icc
- id: fubini_continuous_on_box
  kind: textbook
  level: 2
  topic: 重積分・フビニの定理
  statement: $f:\mathbb{R}^2\to\mathbb{R}$が長方形$[a,b]\times[c,d]$上で連続ならば、長方形上の重積分は累次積分$\int_{[a,b]}\int_{[c,d]}f(x,y)\,dy\,dx$に等しく、積分の順序を交換した$\int_{[c,d]}\int_{[a,b]}f(x,y)\,dx\,dy$にも等しい。
  statement_en: If f from R^2 to R is continuous on the rectangle [a,b]×[c,d], then its double integral equals the iterated integral in either order.
  assumptions:
  - $f$は$[a,b]\times[c,d]$上で連続
  quantifiers:
  - 任意の$f:\mathbb{R}^2\to\mathbb{R}$と$a,b,c,d\in\mathbb{R}$
  conclusion: 重積分と$2$つの累次積分は全て等しい。
  answer: |
    $a,b,c,d\in\mathbb{R}$とし、$f:\mathbb{R}^2\to\mathbb{R}$は$Q=[a,b]\times[c,d]$上で連続であるとする。$Q$が空なら全ての積分は$0$なので、$Q$は空でないとする。

    $Q$はコンパクトなので$f$は$Q$上で有界である。$f$は$Q$上で可測であり、$Q$の面積は有限なので、$f$は$Q$上で可積分である。$\mathbb{R}^2$のルベーグ測度は$\mathbb{R}$のルベーグ測度の直積である。

    フビニの定理（直積測度空間上の可積分関数の積分は、どちらの順序の累次積分にも等しい）を$[a,b]$と$[c,d]$の直積に適用する。すると$\int_Q f=\int_{[a,b]}\int_{[c,d]}f(x,y)\,dy\,dx=\int_{[c,d]}\int_{[a,b]}f(x,y)\,dx\,dy$である。
  strategy: Establish integrability on the compact rectangle and apply Fubini in both orders.
  sketch:
  - 'derive: The rectangle is compact, so continuous f is bounded and integrable on it.'
  - 'apply_theorem: Fubini expresses the double integral as the iterated integral in x then y.'
  - 'apply_theorem: Fubini also lets the order of the iterated integrals be exchanged.'
  - 'conclude: All three integrals agree.'
  openmath: (forall (f a b c d) (-> (continuous_on_set f (product_set (closed_interval a b) (closed_interval c d))) (and (= (set_integral (product_set (closed_interval a b) (closed_interval c d)) (lambda (z) (fn_value f z))) (set_integral (closed_interval a b) (lambda (x) (set_integral (closed_interval c d) (lambda (y) (fn_value f (ordered_pair x y))))))) (= (set_integral (closed_interval a b) (lambda (x) (set_integral (closed_interval c d) (lambda (y) (fn_value f (ordered_pair x y)))))) (set_integral (closed_interval c d) (lambda (y) (set_integral (closed_interval a b) (lambda (x) (fn_value f (ordered_pair x y))))))))))
  hard_negative:
    statement: 累次積分が両方の順序で存在すれば、2つの累次積分は常に等しい。
    reason: f(x,y)=(x^2-y^2)/(x^2+y^2)^2の[0,1]^2上の累次積分はπ/4と-π/4で異なる。このfは可積分でない。
  target: |
    ∀ (f : ℝ × ℝ → ℝ) (a b c d : ℝ), ContinuousOn f (Set.Icc a b ×ˢ Set.Icc c d) → (∫ z in Set.Icc a b ×ˢ Set.Icc c d, f z) = (∫ x in Set.Icc a b, ∫ y in Set.Icc c d, f (x, y)) ∧ (∫ x in Set.Icc a b, ∫ y in Set.Icc c d, f (x, y)) = ∫ y in Set.Icc c d, ∫ x in Set.Icc a b, f (x, y)
  proof: |
    by
      intro f a b c d hf
      have hi : MeasureTheory.IntegrableOn f (Set.Icc a b ×ˢ Set.Icc c d)
          ((MeasureTheory.volume : MeasureTheory.Measure ℝ).prod MeasureTheory.volume) :=
        hf.integrableOn_compact (isCompact_Icc.prod isCompact_Icc)
      constructor
      · exact MeasureTheory.setIntegral_prod f hi
      · have hi' : MeasureTheory.Integrable (Function.uncurry fun x y => f (x, y))
            (((MeasureTheory.volume : MeasureTheory.Measure ℝ).restrict (Set.Icc a b)).prod
              ((MeasureTheory.volume : MeasureTheory.Measure ℝ).restrict (Set.Icc c d))) := by
          rw [MeasureTheory.Measure.prod_restrict]
          exact hi
        exact MeasureTheory.integral_integral_swap hi'
- id: separated_double_integral
  kind: gap
  level: 2
  topic: 重積分・変数分離型の積分
  statement: $f$が$[a,b]$上で、$g$が$[c,d]$上で連続ならば、$[a,b]\times[c,d]$上の$f(x)g(y)$の重積分は、$\int_{[a,b]}f(x)\,dx$と$\int_{[c,d]}g(y)\,dy$の積に等しい。
  statement_en: If f is continuous on [a,b] and g is continuous on [c,d], then the double integral of f(x)g(y) over [a,b]×[c,d] is the product of the integral of f over [a,b] and the integral of g over [c,d].
  assumptions:
  - $f$は$[a,b]$上で連続
  - $g$は$[c,d]$上で連続
  quantifiers:
  - 任意の$f,g:\mathbb{R}\to\mathbb{R}$と$a,b,c,d\in\mathbb{R}$
  conclusion: 重積分は$\int_{[a,b]}f(x)\,dx\cdot\int_{[c,d]}g(y)\,dy$に等しい。
  answer: |
    $a,b,c,d\in\mathbb{R}$とし、$f:\mathbb{R}\to\mathbb{R}$は$[a,b]$上で、$g:\mathbb{R}\to\mathbb{R}$は$[c,d]$上で連続であるとする。

    $f(x)g(y)$は長方形$[a,b]\times[c,d]$上で連続なので、そこで可積分である。フビニの定理より、重積分は累次積分$\int_{[a,b]}(\int_{[c,d]}f(x)g(y)\,dy)\,dx$に等しい。内側の積分では$f(x)$は定数なので、内側は$f(x)\int_{[c,d]}g(y)\,dy$である。外側の積分で定数$\int_{[c,d]}g(y)\,dy$を外に出すと、$\int_{[a,b]}f(x)\,dx\cdot\int_{[c,d]}g(y)\,dy$を得る。
  strategy: Apply Fubini and pull out the factor that is constant in each inner integral.
  sketch:
  - 'apply_theorem: Fubini rewrites the double integral as an iterated integral.'
  - 'derive: In the inner integral f(x) is constant.'
  - 'derive: The integral of g is a constant in the outer integral.'
  - 'conclude: The result is the product of the two single integrals.'
  openmath: (forall (f g a b c d) (-> (and (continuous_on_set f (closed_interval a b)) (continuous_on_set g (closed_interval c d))) (= (set_integral (product_set (closed_interval a b) (closed_interval c d)) (lambda (z) (* (fn_value f (first_coord z)) (fn_value g (second_coord z))))) (* (set_integral (closed_interval a b) (lambda (x) (fn_value f x))) (set_integral (closed_interval c d) (lambda (y) (fn_value g y)))))))
  hard_negative:
    statement: 一般のh(x,y)について、長方形上の重積分は∫_{[a,b]}h(x,c)dxと∫_{[c,d]}h(a,y)dyの積である。
    reason: h(x,y)=x+yは変数分離型でなく、[0,1]^2上で重積分は1だが、右辺は(1/2)(1/2)=1/4である。
  target: |
    ∀ (f g : ℝ → ℝ) (a b c d : ℝ), ContinuousOn f (Set.Icc a b) → ContinuousOn g (Set.Icc c d) → (∫ z in Set.Icc a b ×ˢ Set.Icc c d, f z.1 * g z.2) = (∫ x in Set.Icc a b, f x) * ∫ y in Set.Icc c d, g y
  proof: |
    by
      intro f g a b c d _ _
      exact MeasureTheory.setIntegral_prod_mul f g (Set.Icc a b) (Set.Icc c d)
- id: change_of_variables
  kind: textbook
  level: 3
  topic: 重積分・変数変換公式
  statement: $s\subseteq\mathbb{R}^n$を可測集合、$f:\mathbb{R}^n\to\mathbb{R}^n$を$s$上で微分可能かつ単射とし、微分を$f'$とする。$g$が$f(s)$上で可積分ならば、$\int_{f(s)}g(y)\,dy=\int_s|\det f'(x)|g(f(x))\,dx$である。
  statement_en: Let s be a measurable subset of R^n and f be differentiable and injective on s with derivative f'. If g is integrable on f(s), then the integral of g over f(s) equals the integral over s of the absolute determinant of f' times g composed with f.
  assumptions:
  - $s\subseteq\mathbb{R}^n$は可測集合
  - $f$は$s$上で微分可能で、微分は$f'$
  - $f$は$s$上で単射
  - $g$は$f(s)$上で可積分
  quantifiers:
  - 任意の$n\in\mathbb{N}$、$s\subseteq\mathbb{R}^n$、$f,f',g$
  conclusion: $\int_{f(s)}g(y)\,dy=\int_s|\det f'(x)|g(f(x))\,dx$である。
  answer: |
    以下は概略であり、次の測度の等式（＊）は引用して証明しない。それ以外の部分は証明する。

    $n\in\mathbb{N}$、$s\subseteq\mathbb{R}^n$を可測集合とする。$f:\mathbb{R}^n\to\mathbb{R}^n$は$s$上で単射で、各$x\in s$で$s$に沿った微分が$f'(x)$であるとする。$g:\mathbb{R}^n\to\mathbb{R}$は$f(s)$上で可積分とする。$\lambda$をルベーグ測度とし、$J(x)=|\det f'(x)|$とおく。

    引用する等式は次のとおりである。可測な$A\subseteq s$について、$f(A)$は可測で$\lambda(f(A))=\int_A J(x)\,dx$である（＊）。これは線形写像$T$について$\lambda(T(A))=|\det T|\lambda(A)$であることと局所線形近似から得られるが、その評価はここでは行わない。

    （＊）から公式を導く。$f$は$s$上で連続なので、ボレル集合$B$について$A=s\cap f^{-1}(B)$は可測である。$f(A)=B\cap f(s)$なので、（＊）は$\int_{f(s)}1_B\,dy=\int_s J(x)1_B(f(x))\,dx$を意味する。線形性からボレル単関数で公式が成り立ち、単調収束定理から非負ボレル関数で成り立つ。

    $g$については、$f(s)$上で$g$とほとんど至るところ一致するボレル関数$g_0$をとり、不一致の点を含むボレル零集合を$N$とする。$A=s\cap f^{-1}(N)$に（＊）を適用すると$\int_A J(x)\,dx=\lambda(f(A))\leq\lambda(N)=0$なので、$A$上でほとんど至るところ$J=0$である。よって$s$上でほとんど至るところ$J\cdot(g\circ f)=J\cdot(g_0\circ f)$である。$g_0$を正部分と負部分に分けると、それぞれの積分は有限である。公式を差し引くと、$\int_{f(s)}g(y)\,dy=\int_s J(x)g(f(x))\,dx$を得る。
  strategy: Approximate f locally by its derivative, deduce the measure formula, and extend from indicator functions to integrable functions.
  sketch:
  - 'apply_theorem: A linear map scales the volume of every set by the absolute value of its determinant.'
  - 'setup: Partition s into small measurable pieces where f is close to its linearization.'
  - 'derive: Summing gives the measure of f(A) as the integral of the absolute determinant over A.'
  - 'derive: This is the integral formula for indicator functions.'
  - 'conclude: Approximation by simple functions extends the formula to integrable g.'
  openmath: (forall (n s f df g) (-> (and (measurable_set s) (forall (x) (-> (in x s) (has_fderiv_within f (fn_value df x) s x))) (injective_on_set f s) (integrable_on_set (lambda (y) (fn_value g y)) (image_of f s))) (= (set_integral (image_of f s) (lambda (y) (fn_value g y))) (set_integral s (lambda (x) (* (abs (linear_det (fn_value df x))) (fn_value g (fn_value f x))))))))
  hard_negative:
    statement: fがs上で単射でなくても、同じ公式が成り立つ。
    reason: f(x)=x^2, s=[-1,1], g=1では左辺はf(s)=[0,1]の長さ1だが、右辺は∫_{-1}^{1}|2x|dx=2である。
  target: |
    ∀ (n : ℕ) (s : Set (Fin n → ℝ)) (f : (Fin n → ℝ) → Fin n → ℝ) (f' : (Fin n → ℝ) → (Fin n → ℝ) →L[ℝ] (Fin n → ℝ)) (g : (Fin n → ℝ) → ℝ), MeasurableSet s → (∀ x ∈ s, HasFDerivWithinAt f (f' x) s x) → Set.InjOn f s → MeasureTheory.IntegrableOn g (f '' s) → (∫ y in f '' s, g y) = ∫ x in s, |(f' x).det| * g (f x)
  proof: |
    by
      intro n s f f' g hs hd hi _
      exact MeasureTheory.integral_image_eq_integral_abs_det_fderiv_smul MeasureTheory.volume hs hd hi g
- id: polar_coordinates_jacobian
  kind: gap
  level: 2
  topic: 重積分・極座標のヤコビアン
  statement: 写像$\Phi(r,\theta)=(r\cos\theta,r\sin\theta)$は全ての点$(r,\theta)$で微分可能で、微分の行列式は$r$である。
  statement_en: The map Φ(r,θ) = (r cos θ, r sin θ) is differentiable at every point (r,θ), and the determinant of its derivative is r.
  assumptions:
  - $\Phi(r,\theta)=(r\cos\theta,r\sin\theta)$
  quantifiers:
  - 任意の点$(r,\theta)\in\mathbb{R}^2$
  conclusion: $\Phi$は$(r,\theta)$で微分可能で、微分の行列式は$r$である。
  answer: |
    $\Phi:\mathbb{R}^2\to\mathbb{R}^2$を$\Phi(r,\theta)=(r\cos\theta,r\sin\theta)$で定め、$(r,\theta)\in\mathbb{R}^2$とする。

    $\Phi$の成分は$C^1$級なので、$\Phi$は$(r,\theta)$で微分可能である。ヤコビ行列は第$1$行が$(\cos\theta,-r\sin\theta)$、第$2$行が$(\sin\theta,r\cos\theta)$である。行列式は$r\cos^2\theta+r\sin^2\theta=r$である。
  strategy: Compute the Jacobian matrix of Φ and its determinant.
  sketch:
  - 'derive: The partial derivatives of the components give the Jacobian matrix.'
  - 'derive: Its determinant is r cos^2 θ + r sin^2 θ.'
  - 'conclude: The identity cos^2 θ + sin^2 θ = 1 reduces the determinant to r.'
  openmath: (forall (r t) (exists (L) (and (has_fderiv_at polar_map L (ordered_pair r t)) (= (linear_det L) r))))
  hard_negative:
    statement: Φの微分の行列式はr^2である。
    reason: r^2は3次元の極座標のヤコビアンに現れる形で、2次元の行列式はrである。r=2, θ=0では行列は対角(1,2)で行列式は2である。
  target: |
    ∀ p : ℝ × ℝ, ∃ L : ℝ × ℝ →L[ℝ] ℝ × ℝ, HasFDerivAt (fun q : ℝ × ℝ => (q.1 * Real.cos q.2, q.1 * Real.sin q.2)) L p ∧ L.det = p.1
  proof: |
    by
      intro p
      exact ⟨fderivPolarCoordSymm p, hasFDerivAt_polarCoord_symm p, det_fderivPolarCoordSymm p⟩
- id: polar_coordinates_integral
  kind: textbook
  level: 2
  topic: 重積分・極座標変換
  statement: $f:\mathbb{R}^2\to\mathbb{R}$が可積分ならば、$\int_{\mathbb{R}^2}f(x,y)\,dx\,dy=\int_{(0,\infty)\times(-\pi,\pi)}rf(r\cos\theta,r\sin\theta)\,dr\,d\theta$である。
  statement_en: If f from R^2 to R is integrable, then its integral over the plane equals the integral over (0,∞)×(-π,π) of r f(r cos θ, r sin θ).
  assumptions:
  - $f:\mathbb{R}^2\to\mathbb{R}$は可積分
  quantifiers:
  - 任意の$f:\mathbb{R}^2\to\mathbb{R}$
  conclusion: $\int_{\mathbb{R}^2}f\,dx\,dy=\int_{(0,\infty)\times(-\pi,\pi)}rf(r\cos\theta,r\sin\theta)\,dr\,d\theta$である。
  answer: |
    $f:\mathbb{R}^2\to\mathbb{R}$を可積分とする。$D=(0,\infty)\times(-\pi,\pi)$、$\Phi(r,\theta)=(r\cos\theta,r\sin\theta)$とおく。

    $\Phi$は$D$上で単射である。$\Phi(r,\theta)=\Phi(r',\theta')$なら$r^2=r'^2$より$r=r'$であり、$\cos\theta=\cos\theta'$、$\sin\theta=\sin\theta'$より$\theta=\theta'$である（$\theta,\theta'\in(-\pi,\pi)$）。

    $\Phi(D)$は平面から半直線$H=\{(x,0)\mid x\leq0\}$を除いた集合である。実際、$(x,y)\notin H$なら$r=\sqrt{x^2+y^2}>0$であり、$x=r\cos\theta$、$y=r\sin\theta$となる$\theta\in(-\pi,\pi]$がある。$\theta=\pi$なら$(x,y)\in H$となるので$\theta\neq\pi$である。逆に$D$の点の像は$H$に属さない。$H$の面積は$0$なので、$\int_{\mathbb{R}^2}f=\int_{\Phi(D)}f$である。

    $\Phi$の微分の行列式は$r$で、$D$上で$r>0$である。変数変換公式（可測集合$s$上で微分可能かつ単射な$\Phi$と、$\Phi(s)$上で可積分な$f$について、$\int_{\Phi(s)}f=\int_s|\det\Phi'|\,f\circ\Phi$）を$s=D$に適用すると、$\int_{\Phi(D)}f=\int_D rf(r\cos\theta,r\sin\theta)\,dr\,d\theta$である。
  strategy: Apply the change of variables formula to polar coordinates and discard a null set.
  sketch:
  - 'setup: Let Φ be the polar map on (0,∞)×(-π,π).'
  - 'derive: Φ is injective there with Jacobian determinant r > 0.'
  - 'derive: Its image is the plane minus a closed half-line, which has measure zero.'
  - 'apply_theorem: The change of variables formula gives the integral of r f(Φ) over the domain.'
  - 'conclude: This equals the integral of f over the plane.'
  openmath: (forall (f) (-> (integrable_on_whole_space f) (= (set_integral polar_domain (lambda (p) (* (first_coord p) (fn_value f (fn_value polar_map p))))) (integral_whole_space (lambda (z) (fn_value f z))))))
  hard_negative:
    statement: ∫_{R^2}f dxdy=∫_{(0,∞)×(-π,π)}f(r cos θ, r sin θ)drdθである(rの因子は不要である)。
    reason: 半径1の円板の定義関数fでは左辺はπだが、右辺は1×2π=2πである。
  target: |
    ∀ f : ℝ × ℝ → ℝ, MeasureTheory.Integrable f → (∫ p in Set.Ioi (0 : ℝ) ×ˢ Set.Ioo (-Real.pi) Real.pi, p.1 * f (p.1 * Real.cos p.2, p.1 * Real.sin p.2)) = ∫ z, f z
  proof: |
    by
      intro f _
      exact integral_comp_polarCoord_symm f
- id: gaussian_integral
  kind: named
  level: 2
  topic: 重積分・ガウス積分
  statement: （ガウス積分）$b>0$ならば、$\int_{-\infty}^{\infty}\exp(-bx^2)\,dx=\sqrt{\pi/b}$である。
  statement_en: (Gaussian integral) For b > 0, the integral of exp(-b x^2) over the real line equals the square root of π/b.
  assumptions:
  - $b>0$
  quantifiers:
  - 任意の$b\in\mathbb{R}$
  conclusion: $\int_{-\infty}^{\infty}\exp(-bx^2)\,dx=\sqrt{\pi/b}$である。
  answer: |
    $b>0$とし、$I=\int_{-\infty}^{\infty}\exp(-bx^2)\,dx$とおく。$\exp(bx^2)\geq1+bx^2$より$0<\exp(-bx^2)\leq1/(1+bx^2)$であり、右辺は$\mathbb{R}$上で可積分である。よって$I$は有限で$I>0$である。

    トネリの定理より$\exp(-bx^2)\exp(-by^2)=\exp(-b(x^2+y^2))$は$\mathbb{R}^2$上で可積分で、その積分は$I^2$である。極座標の積分公式（可積分な$f:\mathbb{R}^2\to\mathbb{R}$について$\int_{\mathbb{R}^2}f=\int_{(0,\infty)\times(-\pi,\pi)}rf(r\cos\theta,r\sin\theta)\,dr\,d\theta$）とフビニの定理から、$I^2=\int_{-\pi}^{\pi}\int_0^\infty r\exp(-br^2)\,dr\,d\theta$である。

    内側の積分は$[-\exp(-br^2)/(2b)]_0^\infty=1/(2b)$である。よって$I^2=2\pi\cdot1/(2b)=\pi/b$である。$I>0$より$I=\sqrt{\pi/b}$である。
  strategy: Square the integral, pass to polar coordinates, and take the positive root.
  sketch:
  - 'setup: Let I be the integral, and note that I is positive.'
  - 'apply_theorem: Fubini writes I^2 as a double integral over the plane.'
  - 'apply_theorem: Polar coordinates turn it into an elementary integral of r exp(-b r^2).'
  - 'derive: Evaluating gives I^2 = π/b.'
  - 'conclude: Positivity of I gives the square root.'
  openmath: (forall (b) (-> (> b 0) (= (integral_real_line (lambda (x) (exp (* (neg b) (^ x 2))))) (root (/ pi b) 2))))
  hard_negative:
    statement: 全ての実数bについて∫exp(-bx^2)dx=√(π/b)が可積分性とともに成り立つ。
    reason: b≤0ではexp(-bx^2)は0に減衰せず、実数全体で可積分でない。
  target: |
    ∀ b : ℝ, 0 < b → (∫ x : ℝ, Real.exp (-b * x ^ 2)) = Real.sqrt (Real.pi / b)
  proof: |
    by
      intro b _
      exact integral_gaussian b
- id: gaussian_integral_plane
  kind: gap
  level: 2
  topic: 重積分・平面上のガウス積分
  statement: $b>0$のとき、$\int_{\mathbb{R}^2}\exp(-b(x^2+y^2))\,dx\,dy=\pi/b$である。
  statement_en: For b > 0, the integral of exp(-b(x^2+y^2)) over the plane equals π/b.
  assumptions:
  - $b>0$
  quantifiers:
  - 任意の$b\in\mathbb{R}$
  conclusion: $\int_{\mathbb{R}^2}\exp(-b(x^2+y^2))\,dx\,dy=\pi/b$である。
  answer: |
    $b>0$とする。$\exp(-b(x^2+y^2))=\exp(-bx^2)\exp(-by^2)$である。$\exp(-bx^2)$は$\mathbb{R}$上で可積分なので、トネリの定理よりこの関数は$\mathbb{R}^2$上で可積分である。

    フビニの定理より、重積分は$(\int_{\mathbb{R}}\exp(-bx^2)\,dx)(\int_{\mathbb{R}}\exp(-by^2)\,dy)$に等しい。ガウス積分の公式（$b>0$なら$\int_{\mathbb{R}}\exp(-bx^2)\,dx=\sqrt{\pi/b}$）より、各因子は$\sqrt{\pi/b}$である。したがって重積分は$\sqrt{\pi/b}\cdot\sqrt{\pi/b}=\pi/b$である。
  strategy: Separate the variables and use the one-dimensional Gaussian integral.
  sketch:
  - 'derive: Factor the integrand as exp(-x^2) exp(-y^2).'
  - 'apply_theorem: The integral of a product of functions of separate variables is the product of the integrals.'
  - 'apply_theorem: Each factor equals the square root of π.'
  - 'conclude: The double integral equals π.'
  openmath: (forall (b) (-> (> b 0) (= (integral_whole_space (lambda (z) (exp (neg (* b (+ (^ (first_coord z) 2) (^ (second_coord z) 2))))))) (/ pi b))))
  hard_negative:
    statement: $b>0$のとき$\int_{\mathbb{R}^2}\exp(-b(x^2+y^2))\,dx\,dy=\sqrt{\pi/b}$である。
    reason: $\sqrt{\pi/b}$は1次元の積分の値である。2次元では2つの1次元積分の積になるので$\pi/b$である。$b=1$では$\pi\neq\sqrt{\pi}$である。
  target: '∀ b : ℝ, 0 < b → (∫ z : ℝ × ℝ, Real.exp (-(b * (z.1 ^ 2 + z.2 ^ 2)))) = Real.pi / b'
  proof: |
    by
      intro b hb
      have h : (fun z : ℝ × ℝ => Real.exp (-(b * (z.1 ^ 2 + z.2 ^ 2)))) =
          fun z : ℝ × ℝ => Real.exp (-b * z.1 ^ 2) * Real.exp (-b * z.2 ^ 2) := by
        funext z
        rw [← Real.exp_add]
        congr 1
        ring
      rw [h, MeasureTheory.Measure.volume_eq_prod]
      rw [MeasureTheory.integral_prod_mul (fun x : ℝ => Real.exp (-b * x ^ 2)) (fun y : ℝ => Real.exp (-b * y ^ 2))]
      rw [integral_gaussian b]
      exact Real.mul_self_sqrt (div_nonneg Real.pi_pos.le hb.le)
- id: green_theorem_rectangle
  kind: textbook
  level: 3
  topic: ベクトル解析・長方形上のグリーンの定理
  statement: $P,Q:\mathbb{R}^2\to\mathbb{R}$が$C^1$級で$a_1\leq b_1$、$a_2\leq b_2$ならば、長方形$[a_1,b_1]\times[a_2,b_2]$上の$Q_x-P_y$の重積分は、長方形の境界を反時計回りに一周する$P\,dx+Q\,dy$の線積分に等しい。すなわち$\int_{a_1}^{b_1}P(x,a_2)\,dx+\int_{a_2}^{b_2}Q(b_1,y)\,dy-\int_{a_1}^{b_1}P(x,b_2)\,dx-\int_{a_2}^{b_2}Q(a_1,y)\,dy$に等しい。
  statement_en: If P and Q from R^2 to R are C^1 and a_1≤b_1, a_2≤b_2, then the double integral of Q_x - P_y over the rectangle equals the counterclockwise boundary line integral of P dx + Q dy.
  assumptions:
  - $P,Q:\mathbb{R}^2\to\mathbb{R}$は$C^1$級
  - $a_1\leq b_1$、$a_2\leq b_2$
  quantifiers:
  - 任意の$P,Q:\mathbb{R}^2\to\mathbb{R}$と$a_1,b_1,a_2,b_2\in\mathbb{R}$
  conclusion: 重積分は境界の$4$つの線積分の符号付き和に等しい。
  answer: |
    $P,Q:\mathbb{R}^2\to\mathbb{R}$を$C^1$級とし、$a_1\leq b_1$、$a_2\leq b_2$、$R=[a_1,b_1]\times[a_2,b_2]$とする。$Q_x(z)=dQ(z)(1,0)$、$P_y(z)=dP(z)(0,1)$は連続なので、コンパクト集合$R$上で可積分である。

    フビニの定理より、$Q_x$の重積分は$\int_{a_2}^{b_2}(\int_{a_1}^{b_1}Q_x(x,y)\,dx)\,dy$である。微積分の基本定理より、これは$\int_{a_2}^{b_2}(Q(b_1,y)-Q(a_1,y))\,dy$である。同様に、$P_y$の重積分は$\int_{a_1}^{b_1}(\int_{a_2}^{b_2}P_y(x,y)\,dy)\,dx=\int_{a_1}^{b_1}(P(x,b_2)-P(x,a_2))\,dx$である。

    差をとると、$\int_R(Q_x-P_y)=\int_{a_1}^{b_1}P(x,a_2)\,dx+\int_{a_2}^{b_2}Q(b_1,y)\,dy-\int_{a_1}^{b_1}P(x,b_2)\,dx-\int_{a_2}^{b_2}Q(a_1,y)\,dy$を得る。
  strategy: Apply Fubini and the fundamental theorem of calculus to Q_x and P_y separately.
  sketch:
  - 'derive: The integrands are continuous on the compact rectangle, so they are integrable.'
  - 'apply_theorem: Fubini integrates Q_x first in x and P_y first in y.'
  - 'apply_theorem: The fundamental theorem of calculus evaluates the inner integrals.'
  - 'conclude: Subtracting gives the four boundary integrals with the stated signs.'
  openmath: (forall (P Q a1 b1 a2 b2) (-> (and (<= a1 b1) (<= a2 b2) (cont_diff 1 P) (cont_diff 1 Q)) (= (set_integral (product_set (closed_interval a1 b1) (closed_interval a2 b2)) (lambda (z) (- (fn_value (fderiv_at Q z) (ordered_pair 1 0)) (fn_value (fderiv_at P z) (ordered_pair 0 1))))) (- (- (+ (interval_integral a1 b1 (lambda (x) (fn_value P (ordered_pair x a2)))) (interval_integral a2 b2 (lambda (y) (fn_value Q (ordered_pair b1 y))))) (interval_integral a1 b1 (lambda (x) (fn_value P (ordered_pair x b2))))) (interval_integral a2 b2 (lambda (y) (fn_value Q (ordered_pair a1 y))))))))
  hard_negative:
    statement: 原点を含む長方形でも、原点を除いて滑らかな場P=-y/(x^2+y^2), Q=x/(x^2+y^2)について同じ等式が成り立つ。
    reason: このときQ_x-P_yは原点以外で0だが、境界の線積分は2πである。原点で滑らかでないので定理の仮定を満たさない。
  target: |
    ∀ (P Q : ℝ × ℝ → ℝ) (a₁ b₁ a₂ b₂ : ℝ), a₁ ≤ b₁ → a₂ ≤ b₂ → ContDiff ℝ 1 P → ContDiff ℝ 1 Q → (∫ z in Set.Icc a₁ b₁ ×ˢ Set.Icc a₂ b₂, (fderiv ℝ Q z (1, 0) - fderiv ℝ P z (0, 1))) = (∫ x in a₁..b₁, P (x, a₂)) + (∫ y in a₂..b₂, Q (b₁, y)) - (∫ x in a₁..b₁, P (x, b₂)) - ∫ y in a₂..b₂, Q (a₁, y)
  proof: |
    by
      intro P Q a₁ b₁ a₂ b₂ h₁ h₂ hP hQ
      have hdP := hP.differentiable one_ne_zero
      have hdQ := hQ.differentiable one_ne_zero
      have cP := hP.continuous_fderiv one_ne_zero
      have cQ := hQ.continuous_fderiv one_ne_zero
      have hc : Continuous (fun z : ℝ × ℝ => fderiv ℝ Q z (1, 0) + (-fderiv ℝ P z) (0, 1)) :=
        (cQ.clm_apply continuous_const).add (cP.neg.clm_apply continuous_const)
      have key := MeasureTheory.integral_divergence_prod_Icc_of_hasFDerivAt_of_le Q (fun z => -P z)
        (fderiv ℝ Q) (fun z => -fderiv ℝ P z) (a₁, a₂) (b₁, b₂) (Prod.mk_le_mk.2 ⟨h₁, h₂⟩)
        hQ.continuous.continuousOn hP.continuous.neg.continuousOn
        (fun x _ => (hdQ x).hasFDerivAt) (fun x _ => (hdP x).hasFDerivAt.neg)
        (hc.continuousOn.integrableOn_compact isCompact_Icc)
      simp only [ContinuousLinearMap.neg_apply, intervalIntegral.integral_neg] at key
      rw [Set.Icc_prod_Icc]
      have e : (fun z : ℝ × ℝ => fderiv ℝ Q z (1, 0) - fderiv ℝ P z (0, 1)) =
          fun z : ℝ × ℝ => fderiv ℝ Q z (1, 0) + -fderiv ℝ P z (0, 1) := by
        funext z
        ring
      rw [e, key]
      ring
- id: divergence_theorem_box
  kind: textbook
  level: 3
  topic: ベクトル解析・直方体上の発散定理
  statement: $F:\mathbb{R}^{n+1}\to\mathbb{R}^{n+1}$が$C^1$級で$a\leq b$ならば、直方体$[a,b]$上の$\operatorname{div}F$の積分は、各座標$i$について、面$x_i=b_i$上の$F_i$の積分から面$x_i=a_i$上の$F_i$の積分を引いたものの総和に等しい。
  statement_en: If F from R^{n+1} to R^{n+1} is C^1 and a≤b, then the integral of div F over the box [a,b] equals the sum over the coordinates i of the integral of F_i over the face x_i = b_i minus the integral of F_i over the face x_i = a_i.
  assumptions:
  - $F:\mathbb{R}^{n+1}\to\mathbb{R}^{n+1}$は$C^1$級
  - 各成分で$a_i\leq b_i$
  quantifiers:
  - 任意の$n\in\mathbb{N}$、$F:\mathbb{R}^{n+1}\to\mathbb{R}^{n+1}$、$a,b\in\mathbb{R}^{n+1}$
  conclusion: $\int_{[a,b]}\operatorname{div}F\,dx=\sum_i(\int_{x_i=b_i}F_i-\int_{x_i=a_i}F_i)$である。
  answer: |
    $n\in\mathbb{N}$とし、$F:\mathbb{R}^{n+1}\to\mathbb{R}^{n+1}$を$C^1$級、$a,b\in\mathbb{R}^{n+1}$は各成分で$a_i\leq b_i$を満たすとする。$\operatorname{div}F=\sum_i\partial_iF_i$である。

    $i$を固定する。$B_i=\prod_{j\neq i}[a_j,b_j]\subset\mathbb{R}^n$とし、$x'\in\mathbb{R}^n$の第$i$番目の位置に$t$を挿入した点を$\iota_i(t,x')$と書く。$\partial_iF_i$は連続なので、コンパクト集合$[a,b]$上で可積分である。$[a,b]$を$[a_i,b_i]\times B_i$と同一視してフビニの定理を使うと、$x_i$を最初に積分でき、$\int_{[a,b]}\partial_iF_i\,dx=\int_{B_i}(\int_{a_i}^{b_i}\partial_iF_i(\iota_i(t,x'))\,dt)\,dx'$である。

    微積分の基本定理より、内側の積分は$F_i(\iota_i(b_i,x'))-F_i(\iota_i(a_i,x'))$である。これらは$B_i$上で連続なので、積分を分けられる。よって$\int_{[a,b]}\partial_iF_i\,dx=\int_{B_i}F_i(\iota_i(b_i,x'))\,dx'-\int_{B_i}F_i(\iota_i(a_i,x'))\,dx'$である。$i$について足すと主張が得られる。
  strategy: For each coordinate, integrate the i-th partial derivative first in x_i using Fubini and the fundamental theorem of calculus.
  sketch:
  - 'setup: Write the divergence as the sum of the i-th partial derivatives of F_i.'
  - 'derive: Continuity on the compact box gives integrability.'
  - 'apply_theorem: Fubini lets x_i be integrated first.'
  - 'apply_theorem: The fundamental theorem of calculus turns this into the difference of F_i on the two faces.'
  - 'conclude: Summing over i gives the boundary expression.'
  openmath: (forall (n F a b) (-> (and (cont_diff 1 F) (forall (i) (<= (coordinate_of a i) (coordinate_of b i)))) (= (set_integral (box_region a b) (lambda (x) (divergence_at F x))) (box_boundary_flux F a b))))
  hard_negative:
    statement: 面$x_i=a_i$上の積分を引かずに足しても成り立つ。すなわち$\int_{[a,b]}\operatorname{div}F=\sum_i\bigl(\int_{x_i=b_i}F_i+\int_{x_i=a_i}F_i\bigr)$である。
    reason: 向かい合う面の寄与は引き算でなければならない。$n=0$、$[0,1]$上で$F\equiv1$（$\operatorname{div}F=0$）では左辺$0$、右辺$F(1)+F(0)=2$で偽である。
  target: |
    ∀ (n : ℕ) (F : (Fin (n + 1) → ℝ) → Fin (n + 1) → ℝ) (a b : Fin (n + 1) → ℝ), a ≤ b → ContDiff ℝ 1 F → (∫ x in Set.Icc a b, ∑ i, fderiv ℝ F x (Pi.single i 1) i) = ∑ i : Fin (n + 1), ((∫ x in Set.Icc (a ∘ Fin.succAbove i) (b ∘ Fin.succAbove i), F (Fin.insertNth i (b i) x) i) - ∫ x in Set.Icc (a ∘ Fin.succAbove i) (b ∘ Fin.succAbove i), F (Fin.insertNth i (a i) x) i)
  proof: |
    by
      intro n F a b hab hF
      have cF := hF.continuous_fderiv one_ne_zero
      have hc : Continuous (fun x => ∑ i, fderiv ℝ F x (Pi.single i 1) i) :=
        continuous_finset_sum _ fun i _ =>
          (continuous_apply i).comp (cF.clm_apply continuous_const)
      exact MeasureTheory.integral_divergence_of_hasFDerivAt_off_countable a b hab F (fderiv ℝ F) ∅
        Set.countable_empty hF.continuous.continuousOn
        (fun x _ => ((hF.differentiable one_ne_zero) x).hasFDerivAt)
        (hc.continuousOn.integrableOn_compact isCompact_Icc)
- id: gradient_line_integral
  kind: gap
  level: 2
  topic: ベクトル解析・勾配場の線積分
  statement: $C^1$級の$f:E\to\mathbb{R}$と$C^1$級の曲線$\gamma:\mathbb{R}\to E$について、$\int_a^b df(\gamma(t))(\gamma'(t))\,dt=f(\gamma(b))-f(\gamma(a))$である。
  statement_en: If f from a real normed space E to R is C^1 and γ from R to E is a C^1 curve, then the integral from a to b of df(γ(t))(γ'(t)) equals f(γ(b)) - f(γ(a)).
  assumptions:
  - $E$は実ノルム空間
  - $f:E\to\mathbb{R}$は$C^1$級
  - $\gamma:\mathbb{R}\to E$は$C^1$級
  quantifiers:
  - 任意の$f:E\to\mathbb{R}$、$\gamma:\mathbb{R}\to E$、$a,b\in\mathbb{R}$
  conclusion: 勾配場の線積分は端点での$f$の値の差に等しい。
  answer: |
    $E$を実ノルム空間とし、$f:E\to\mathbb{R}$と$\gamma:\mathbb{R}\to E$を$C^1$級、$a,b\in\mathbb{R}$とする。

    $h(t)=f(\gamma(t))$とおくと、連鎖律より$h'(t)=df(\gamma(t))(\gamma'(t))$である。$df,\gamma,\gamma'$は連続なので、$h'$も連続である。微積分の基本定理より、$\int_a^b h'(t)\,dt=h(b)-h(a)=f(\gamma(b))-f(\gamma(a))$である。
  strategy: Apply the chain rule to f∘γ and then the fundamental theorem of calculus.
  sketch:
  - 'construct: Define h(t) = f(γ(t)).'
  - 'apply_theorem: The chain rule gives h''(t) = df(γ(t))(γ''(t)).'
  - 'derive: Continuity of df, γ and γ'' makes h'' continuous.'
  - 'conclude: The fundamental theorem of calculus gives h(b) - h(a).'
  openmath: (forall (E f gamma a b) (-> (and (normed_space E) (cont_diff 1 f) (cont_diff 1 gamma)) (= (interval_integral a b (lambda (t) (fn_value (fderiv_at f (fn_value gamma t)) (deriv_at_point (lambda (s) (fn_value gamma s)) t)))) (- (fn_value f (fn_value gamma b)) (fn_value f (fn_value gamma a))))))
  hard_negative:
    statement: 一般のベクトル場の線積分は、端点が同じなら曲線の取り方によらない。
    reason: 勾配場でなければ成り立たない。(P,Q)=(-y,x)の線積分は単位円の上半分と下半分で値がπと-πになる。
  target: |
    ∀ (E : Type*) [NormedAddCommGroup E] [NormedSpace ℝ E] (f : E → ℝ) (γ : ℝ → E) (a b : ℝ), ContDiff ℝ 1 f → ContDiff ℝ 1 γ → (∫ t in a..b, fderiv ℝ f (γ t) (deriv γ t)) = f (γ b) - f (γ a)
  proof: |
    by
      intro E _ _ f γ a b hf hγ
      apply intervalIntegral.integral_eq_sub_of_hasDerivAt (f := fun t => f (γ t))
      · intro t _
        exact ((hf.differentiable one_ne_zero) (γ t)).hasFDerivAt.comp_hasDerivAt t
          ((hγ.differentiable one_ne_zero) t).hasDerivAt
      · apply Continuous.intervalIntegrable
        exact ((hf.continuous_fderiv one_ne_zero).comp hγ.continuous).clm_apply
          (hγ.continuous_deriv le_rfl)
