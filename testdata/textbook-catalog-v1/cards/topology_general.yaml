- id: open_finite_inter
  kind: gap
  level: 2
  topic: 位相空間・開集合
  statement: 位相空間において、有限個の開集合の共通部分は開集合である。
  statement_en: In a topological space, the intersection of a finite family of open sets is open.
  assumptions: ["Xは位相空間", "sは添字の有限集合", "各i∈sに対しU_iはXの開集合"]
  quantifiers: ["任意の位相空間X", "任意の有限添字集合s", "任意の集合族U"]
  conclusion: ⋂_{i∈s} U_i はXの開集合である。
  answer: |
    添字集合の要素数についての帰納法で示す。空の共通部分は全体集合Xであり、これは開集合である。要素を1つ加えるときは、それまでの共通部分と新しい開集合の共通部分をとる。開集合の公理より2つの開集合の共通部分は開集合なので、帰納法が進む。
  strategy: Induct on the finite index set using the binary intersection axiom.
  sketch:
    - "setup: Fix the finite index set s and the open sets U_i."
    - "induction: The empty intersection is X, which is open."
    - "derive: Adding one index intersects the previous open set with one more open set."
    - "conclude: The binary intersection axiom keeps the result open."
  openmath: (forall (X s U) (-> (and (finite_set s) (forall (i) (-> (in i s) (open_in X (fn_value U i))))) (open_in X (family_inter s U))))
  hard_negative:
    statement: 位相空間において、無限個の開集合の共通部分も開集合である。
    reason: ℝで開区間(-1/n, 1/n)全体の共通部分は{0}であり、開集合ではない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (ι : Type*) (s : Finset ι) (U : ι → Set X), (∀ i ∈ s, IsOpen (U i)) → IsOpen (⋂ i ∈ s, U i)
  proof: |
    by
      intro X _ ι s U hU
      exact isOpen_biInter_finset hU
- id: open_iff_local_open_nbhd
  kind: gap
  level: 2
  topic: 位相空間・開集合の判定
  statement: 位相空間の部分集合Sが開集合であることと、Sの各点xに対しxを含みSに含まれる開集合が存在することは同値である。
  statement_en: A subset S of a topological space is open if and only if every point of S lies in an open set contained in S.
  assumptions: ["Xは位相空間", "SはXの部分集合"]
  quantifiers: ["任意の位相空間X", "任意の部分集合S"]
  conclusion: Sが開であることと、各x∈Sがある開集合Uについてx∈U⊆Sを満たすことは同値である。
  answer: |
    Sが開ならば、各点に対してU=Sをとればよい。逆に各x∈Sに対しx∈U_x⊆Sとなる開集合U_xがあるとする。このときSはU_x全体の和集合に等しい。開集合の和集合は開集合なので、Sは開である。
  strategy: Write S as the union of the local open sets.
  sketch:
    - "case_split: Prove the two implications separately."
    - "derive: If S is open, take U = S for each point."
    - "construct: Otherwise pick U_x for each x in S and form their union."
    - "conclude: The union equals S and is open."
  openmath: (forall (X S) (<-> (open_in X S) (forall (x) (-> (in x S) (exists (U) (and (open_in X U) (in x U) (subset U S)))))))
  hard_negative:
    statement: Sの各点xに対し、xを含みSに含まれる閉集合があればSは開集合である。
    reason: T1空間では一点集合{x}が閉なのでどの集合でもこの条件が成り立つが、ℝの閉区間は開集合ではない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (S : Set X), IsOpen S ↔ ∀ x ∈ S, ∃ U, U ⊆ S ∧ IsOpen U ∧ x ∈ U
  proof: |
    by
      intro X _ S
      exact isOpen_iff_forall_mem_open
- id: metric_closed_iff_seq_limits
  kind: textbook
  level: 2
  topic: 距離空間・閉集合と点列
  statement: 距離空間の部分集合Cが閉集合であることと、Cの点からなる点列の極限が常にCに属することは同値である。
  statement_en: A subset C of a metric space is closed if and only if the limit of every convergent sequence of points of C belongs to C.
  assumptions: ["Xは距離空間", "CはXの部分集合"]
  quantifiers: ["任意の距離空間X", "任意の部分集合C"]
  conclusion: Cが閉であることと、C内の点列a_nがaに収束すればa∈Cであることは同値である。
  answer: |
    Cが閉で、C内の点列がaに収束するとする。a∉Cなら、開集合C^cがaを含むので十分大きなnでa_n∈C^cとなり矛盾する。逆に点列の条件を仮定し、aをCの閉包の点とする。各nで球B(a,1/(n+1))はCと交わるので、そこから点a_nをとると、a_nはaに収束する。条件よりa∈Cとなるので、C自身が閉包に等しく閉である。
  strategy: Use the open complement in one direction and balls of radius 1/(n+1) in the other.
  sketch:
    - "case_split: Prove the two implications separately."
    - "contradiction: A limit outside C would have an open neighborhood missing C."
    - "construct: For a closure point a, choose a_n in C within distance 1/(n+1) of a."
    - "derive: The sequence converges to a, so a lies in C."
    - "conclude: The closure of C equals C, so C is closed."
  openmath: (forall (X C) (-> (metric_space X) (<-> (closed_in X C) (forall (a L) (-> (and (forall (n) (in (seq_value a n) C)) (seq_tends_to a L)) (in L C))))))
  hard_negative:
    statement: 一般の位相空間で、点列の極限について閉じている部分集合は常に閉集合である。
    reason: ℝに補可算位相を入れると収束列は有限個を除いて定数列になる。そのため任意の部分集合が点列の極限について閉じるが、(0,1)は閉集合ではない。
  target: |
    ∀ (X : Type*) [MetricSpace X] (C : Set X), IsClosed C ↔ ∀ (a : ℕ → X) (L : X), (∀ n, a n ∈ C) → Filter.Tendsto a Filter.atTop (nhds L) → L ∈ C
  proof: |
    by
      intro X _ C
      constructor
      · intro hC a L ha hL
        exact hC.mem_of_tendsto hL (Filter.Eventually.of_forall ha)
      · intro h
        apply IsSeqClosed.isClosed
        intro a L ha hL
        exact h a L ha hL
- id: closure_smallest_closed
  kind: gap
  level: 2
  topic: 位相空間・閉包
  statement: Sを含む閉集合Cは、Sの閉包を含む。すなわち閉包はSを含む最小の閉集合である。
  statement_en: If a closed set C contains S, then C contains the closure of S.
  assumptions: ["Xは位相空間", "S⊆C", "CはXの閉集合"]
  quantifiers: ["任意の位相空間X", "任意の部分集合S, C"]
  conclusion: Sの閉包はCに含まれる。
  answer: |
    閉包はSを含む閉集合すべての共通部分として定義される。CはSを含む閉集合の1つなので、この共通部分はCに含まれる。
  strategy: Use the definition of closure as the intersection of closed supersets.
  sketch:
    - "translate: The closure of S is the intersection of all closed supersets of S."
    - "derive: C is one member of this family."
    - "conclude: The intersection is contained in C."
  openmath: (forall (X S C) (-> (and (subset S C) (closed_in X C)) (subset (closure_in X S) C)))
  hard_negative:
    statement: Sを含む開集合は必ずSの閉包を含む。
    reason: S=(0,1)⊂ℝはそれ自身がSを含む開集合だが、閉包[0,1]を含まない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (S C : Set X), S ⊆ C → IsClosed C → closure S ⊆ C
  proof: |
    by
      intro X _ S C hS hC
      exact closure_minimal hS hC
- id: mem_closure_iff_open_meets
  kind: gap
  level: 2
  topic: 位相空間・閉包
  statement: 点xがSの閉包に属することと、xを含む任意の開集合がSと交わることは同値である。
  statement_en: A point x lies in the closure of S if and only if every open set containing x meets S.
  assumptions: ["Xは位相空間", "SはXの部分集合", "xはXの点"]
  quantifiers: ["任意の位相空間X", "任意の部分集合S", "任意の点x"]
  conclusion: x∈cl(S)と、xを含む任意の開集合UについてU∩Sが空でないことは同値である。
  answer: |
    xを含む開集合UでU∩Sが空のものがあるとする。このときU^cはSを含む閉集合でxを含まないので、xは閉包に属さない。逆にxが閉包に属さないとする。Sを含む閉集合Cでxを含まないものがあり、U=C^cはxを含む開集合でSと交わらない。対偶により同値が示された。
  strategy: Prove both contrapositives using the complement of a separating set.
  sketch:
    - "translate: Work with contrapositives of both implications."
    - "derive: An open U missing S gives the closed superset U^c excluding x."
    - "derive: A closed superset C excluding x gives the open set C^c missing S."
    - "conclude: The two conditions are equivalent."
  openmath: (forall (X S x) (<-> (in x (closure_in X S)) (forall (U) (-> (and (open_in X U) (in x U)) (!= (inter U S) emptyset)))))
  hard_negative:
    statement: xがSの閉包に属することと、xを含む任意の閉集合がSと交わることは同値である。
    reason: ℝでS=(0,1), x=1とするとx∈cl(S)だが、xを含む閉集合{1}はSと交わらない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (S : Set X) (x : X), x ∈ closure S ↔ ∀ U : Set X, IsOpen U → x ∈ U → (U ∩ S).Nonempty
  proof: |
    by
      intro X _ S x
      exact mem_closure_iff.trans (forall_congr' fun U => by tauto)
- id: closure_union_eq
  kind: gap
  level: 2
  topic: 位相空間・閉包
  statement: 2つの部分集合の和集合の閉包は、それぞれの閉包の和集合に等しい。
  statement_en: The closure of a union of two subsets equals the union of their closures.
  assumptions: ["Xは位相空間", "S, TはXの部分集合"]
  quantifiers: ["任意の位相空間X", "任意の部分集合S, T"]
  conclusion: cl(S∪T)=cl(S)∪cl(T)が成り立つ。
  answer: |
    S⊆S∪Tなので閉包の単調性からcl(S)⊆cl(S∪T)であり、Tも同様なので右辺は左辺に含まれる。逆に、cl(S)∪cl(T)は閉集合2つの和集合なので閉であり、S∪Tを含む。閉包はこれを含む最小の閉集合なので、左辺は右辺に含まれる。
  strategy: Use monotonicity for one inclusion and minimality of the closure for the other.
  sketch:
    - "derive: Monotonicity gives cl(S) ∪ cl(T) ⊆ cl(S ∪ T)."
    - "derive: cl(S) ∪ cl(T) is a closed set containing S ∪ T."
    - "apply_theorem: Minimality of the closure gives the reverse inclusion."
    - "conclude: Both inclusions yield equality."
  openmath: (forall (X S T) (= (closure_in X (union S T)) (union (closure_in X S) (closure_in X T))))
  hard_negative:
    statement: 任意個の部分集合の和集合の閉包は、各閉包の和集合に等しい。
    reason: ℝの一点集合{q}をq∈ℚ全体で合併すると閉包はℝだが、各閉包の和集合はℚである。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (S T : Set X), closure (S ∪ T) = closure S ∪ closure T
  proof: |
    by
      intro X _ S T
      exact closure_union
- id: interior_compl_eq
  kind: gap
  level: 2
  topic: 位相空間・内部と閉包
  statement: 部分集合Sの補集合の内部は、Sの閉包の補集合に等しい。
  statement_en: The interior of the complement of S equals the complement of the closure of S.
  assumptions: ["Xは位相空間", "SはXの部分集合"]
  quantifiers: ["任意の位相空間X", "任意の部分集合S"]
  conclusion: int(S^c)=cl(S)^cが成り立つ。
  answer: |
    Uが開でU⊆S^cであることと、U^cが閉でS⊆U^cであることは同値である。したがってS^cに含まれる開集合の和集合の補集合は、Sを含む閉集合の共通部分である。前者がint(S^c)、後者がcl(S)なので、結論を得る。
  strategy: Dualize the definitions of interior and closure through complements.
  sketch:
    - "translate: Open subsets of S^c correspond to closed supersets of S by complement."
    - "derive: The complement of the union of the former is the intersection of the latter."
    - "conclude: Hence int(S^c) is the complement of cl(S)."
  openmath: (forall (X S) (= (interior_in X (setdiff X S)) (setdiff X (closure_in X S))))
  hard_negative:
    statement: Sの補集合の内部は、Sの内部の補集合に等しい。
    reason: S=(0,1)⊂ℝではint(S^c)=(-∞,0)∪(1,∞)だが、int(S)^c=(-∞,0]∪[1,∞)である。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (S : Set X), interior Sᶜ = (closure S)ᶜ
  proof: |
    by
      intro X _ S
      exact interior_compl
- id: closed_iff_closure_eq
  kind: gap
  level: 2
  topic: 位相空間・閉包
  statement: 部分集合Sが閉集合であることと、Sの閉包がS自身に等しいことは同値である。
  statement_en: A subset S is closed if and only if its closure equals S.
  assumptions: ["Xは位相空間", "SはXの部分集合"]
  quantifiers: ["任意の位相空間X", "任意の部分集合S"]
  conclusion: Sが閉であることとcl(S)=Sは同値である。
  answer: |
    Sが閉なら、SはSを含む閉集合なので閉包の最小性からcl(S)⊆Sである。S⊆cl(S)は常に成り立つのでcl(S)=Sとなる。逆にcl(S)=Sなら、閉包は閉集合なのでSは閉である。
  strategy: Combine minimality of the closure with the fact that closures are closed.
  sketch:
    - "derive: If S is closed, minimality gives cl(S) ⊆ S."
    - "derive: S ⊆ cl(S) always holds, so they are equal."
    - "conclude: Conversely S = cl(S) is closed because closures are closed."
  openmath: (forall (X S) (<-> (closed_in X S) (= (closure_in X S) S)))
  hard_negative:
    statement: Sが閉集合であることと、Sの内部がSに等しいことは同値である。
    reason: Sの内部がSに等しいのはSが開集合のときである。[0,1]⊂ℝは閉だが内部は(0,1)である。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (S : Set X), IsClosed S ↔ closure S = S
  proof: |
    by
      intro X _ S
      exact closure_eq_iff_isClosed.symm
- id: frontier_eq_closure_inter
  kind: gap
  level: 2
  topic: 位相空間・境界
  statement: 部分集合Sの境界は、Sの閉包とSの補集合の閉包の共通部分に等しい。
  statement_en: The boundary of S equals the intersection of the closure of S with the closure of its complement.
  assumptions: ["Xは位相空間", "SはXの部分集合"]
  quantifiers: ["任意の位相空間X", "任意の部分集合S"]
  conclusion: ∂S=cl(S)∩cl(S^c)が成り立つ。
  answer: |
    境界はcl(S)\int(S)と定義される。int(S)の補集合はcl(S^c)に等しいので、cl(S)\int(S)=cl(S)∩int(S)^c=cl(S)∩cl(S^c)となる。
  strategy: Rewrite the complement of the interior as the closure of the complement.
  sketch:
    - "translate: The boundary is cl(S) minus int(S)."
    - "derive: The complement of int(S) equals cl(S^c)."
    - "conclude: Substituting gives cl(S) ∩ cl(S^c)."
  openmath: (forall (X S) (= (frontier_in X S) (inter (closure_in X S) (closure_in X (setdiff X S)))))
  hard_negative:
    statement: 部分集合Sの境界は常に空でない。
    reason: 開かつ閉な集合の境界は空である。例えばS=Xのとき境界は空集合になる。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (S : Set X), frontier S = closure S ∩ closure Sᶜ
  proof: |
    by
      intro X _ S
      exact frontier_eq_closure_inter_closure
- id: continuous_iff_preimage_closed
  kind: textbook
  level: 2
  topic: 位相空間・連続写像
  statement: 写像f:X→Yが連続であることと、Yの任意の閉集合の逆像がXの閉集合であることは同値である。
  statement_en: A map f from X to Y is continuous if and only if the preimage of every closed subset of Y is closed in X.
  assumptions: ["X, Yは位相空間", "f:X→Yは写像"]
  quantifiers: ["任意の位相空間X, Y", "任意の写像f"]
  conclusion: fが連続であることと、任意の閉集合C⊆Yについてf^{-1}(C)が閉であることは同値である。
  answer: |
    連続性は開集合の逆像が開であることで定義される。逆像は補集合と両立し、f^{-1}(C^c)=f^{-1}(C)^cが成り立つ。Cが閉であることとC^cが開であることは同値なので、開集合についての条件と閉集合についての条件は互いに言い換えられる。
  strategy: Translate between open and closed sets through complements of preimages.
  sketch:
    - "translate: Continuity means preimages of open sets are open."
    - "derive: Preimages commute with complements."
    - "conclude: The open-set and closed-set conditions are equivalent."
  openmath: (forall (X Y f) (<-> (continuous_between X Y f) (forall (C) (-> (closed_in Y C) (closed_in X (preimage_of f C))))))
  hard_negative:
    statement: fが連続であることと、Xの任意の閉集合の像がYの閉集合であることは同値である。
    reason: 像についての条件は閉写像の定義である。x↦e^xは連続だが閉集合ℝの像(0,∞)は閉でない。
  target: |
    ∀ (X Y : Type*) [TopologicalSpace X] [TopologicalSpace Y] (f : X → Y), Continuous f ↔ ∀ C : Set Y, IsClosed C → IsClosed (f ⁻¹' C)
  proof: |
    by
      intro X Y _ _ f
      exact continuous_iff_isClosed
- id: continuous_iff_image_closure
  kind: gap
  level: 2
  topic: 位相空間・連続写像と閉包
  statement: 写像fが連続であることと、任意の部分集合Sについてf(cl(S))⊆cl(f(S))が成り立つことは同値である。
  statement_en: A map f is continuous if and only if f(cl S) is contained in cl(f(S)) for every subset S.
  assumptions: ["X, Yは位相空間", "f:X→Yは写像"]
  quantifiers: ["任意の位相空間X, Y", "任意の写像f"]
  conclusion: fの連続性と、任意のSに対するf(cl(S))⊆cl(f(S))は同値である。
  answer: |
    fが連続なら、f^{-1}(cl(f(S)))はSを含む閉集合なのでcl(S)を含み、これは包含f(cl(S))⊆cl(f(S))を意味する。逆に包含を仮定し、CをYの閉集合、S=f^{-1}(C)とする。f(cl(S))⊆cl(f(S))⊆cl(C)=Cよりcl(S)⊆Sとなる。よって閉集合の逆像は閉であり、fは連続である。
  strategy: Use the closed preimage of cl(f(S)) forward, and test on S = f^{-1}(C) backward.
  sketch:
    - "case_split: Prove the two implications separately."
    - "derive: If f is continuous, the preimage of cl(f(S)) is closed and contains S."
    - "apply_theorem: Minimality of the closure gives f(cl S) ⊆ cl(f S)."
    - "construct: Conversely set S = f^{-1}(C) for a closed set C."
    - "conclude: Then cl(S) ⊆ S, so preimages of closed sets are closed."
  openmath: (forall (X Y f) (<-> (continuous_between X Y f) (forall (S) (subset (image_of f (closure_in X S)) (closure_in Y (image_of f S))))))
  hard_negative:
    statement: fが連続なら、任意のSについてf(cl(S))=cl(f(S))が成り立つ。
    reason: x↦e^xでS=ℝとするとf(cl(S))=(0,∞)だが、cl(f(S))=[0,∞)である。
  target: |
    ∀ (X Y : Type*) [TopologicalSpace X] [TopologicalSpace Y] (f : X → Y), Continuous f ↔ ∀ S : Set X, f '' closure S ⊆ closure (f '' S)
  proof: |
    by
      intro X Y _ _ f
      exact continuous_iff_image_closure_subset_closure_image
- id: metric_continuous_iff_seq
  kind: textbook
  level: 2
  topic: 距離空間・連続性と点列
  statement: 距離空間の間の写像fが連続であることと、aに収束する任意の点列a_nについてf(a_n)がf(a)に収束することは同値である。
  statement_en: A map between metric spaces is continuous if and only if it sends every sequence converging to a to a sequence converging to f(a).
  assumptions: ["X, Yは距離空間", "f:X→Yは写像"]
  quantifiers: ["任意の距離空間X, Y", "任意の写像f"]
  conclusion: fの連続性と、点列についての収束の保存は同値である。
  answer: |
    fが連続でa_n→aとする。f(a)の任意の近傍Vについてf^{-1}(V)はaの近傍なので、十分大きなnでf(a_n)∈Vとなる。逆にfがある点aで連続でないとする。あるε>0が存在し、各nに対しd(x,a)<1/(n+1)かつd(f(x),f(a))≥εとなるx=a_nがとれる。するとa_n→aだがf(a_n)はf(a)に収束せず、点列についての条件に反する。
  strategy: Forward by neighborhoods; backward by choosing a witness sequence from the failure of epsilon-delta.
  sketch:
    - "case_split: Prove the two implications separately."
    - "derive: Continuity pulls a neighborhood of f(a) back to a neighborhood of a."
    - "contradiction: Assume f is discontinuous at a with witness ε."
    - "construct: Choose a_n within 1/(n+1) of a with d(f(a_n), f(a)) ≥ ε."
    - "conclude: The sequence converges to a but its image does not converge to f(a)."
  openmath: (forall (X Y f) (-> (and (metric_space X) (metric_space Y)) (<-> (continuous_between X Y f) (forall (a L) (-> (seq_tends_to a L) (seq_tends_to (function_compose_map f a) (fn_value f L)))))))
  hard_negative:
    statement: 一般の位相空間の間でも、点列の収束を保つ写像は連続である。
    reason: ℝの補可算位相から通常位相への恒等写像は収束列を保つが、連続ではない。
  target: |
    ∀ (X Y : Type*) [MetricSpace X] [MetricSpace Y] (f : X → Y), Continuous f ↔ ∀ (a : ℕ → X) (L : X), Filter.Tendsto a Filter.atTop (nhds L) → Filter.Tendsto (fun n => f (a n)) Filter.atTop (nhds (f L))
  proof: |
    by
      intro X Y _ _ f
      constructor
      · intro hf a L ha
        exact (hf.tendsto L).comp ha
      · intro h
        apply SeqContinuous.continuous
        intro a L ha
        exact h a L ha
- id: metric_continuous_epsilon_delta
  kind: textbook
  level: 2
  topic: 距離空間・連続性
  statement: 距離空間の間の写像fが連続であることと、任意の点bと任意のε>0に対しあるδ>0が存在してd(a,b)<δならd(f(a),f(b))<εとなることは同値である。
  statement_en: A map between metric spaces is continuous if and only if it satisfies the epsilon-delta condition at every point.
  assumptions: ["X, Yは距離空間", "f:X→Yは写像"]
  quantifiers: ["任意の距離空間X, Y", "任意の写像f"]
  conclusion: 開集合による連続性とε-δ条件は同値である。
  answer: |
    fが連続なら、球B(f(b),ε)の逆像はbを含む開集合なので、ある球B(b,δ)を含む。このδが条件を満たす。逆にε-δ条件を仮定し、VをYの開集合、b∈f^{-1}(V)とする。B(f(b),ε)⊆Vとなるεをとると、対応するδについてB(b,δ)⊆f^{-1}(V)である。よってf^{-1}(V)は開である。
  strategy: Translate preimages of balls into balls contained in preimages.
  sketch:
    - "derive: The preimage of an ε-ball at f(b) is open and contains a δ-ball at b."
    - "setup: Conversely fix an open set V and a point b of its preimage."
    - "derive: Choose ε with the ε-ball inside V and take the matching δ."
    - "conclude: The δ-ball lies in the preimage, so the preimage is open."
  openmath: (forall (X Y f) (-> (and (metric_space X) (metric_space Y)) (<-> (continuous_between X Y f) (forall (b e) (-> (> e 0) (exists (d) (and (> d 0) (forall (a) (-> (< (dist_of a b) d) (< (dist_of (fn_value f a) (fn_value f b)) e))))))))))
  hard_negative:
    statement: fが連続なら、δはbに依存せずεだけから選べる。
    reason: これは一様連続性であり、ℝ上のx↦x²は連続だが一様連続ではない。
  target: |
    ∀ (X Y : Type*) [MetricSpace X] [MetricSpace Y] (f : X → Y), Continuous f ↔ ∀ (b : X) (ε : ℝ), 0 < ε → ∃ δ : ℝ, 0 < δ ∧ ∀ a : X, dist a b < δ → dist (f a) (f b) < ε
  proof: |
    by
      intro X Y _ _ f
      exact Metric.continuous_iff
- id: continuous_ext_on_dense
  kind: gap
  level: 2
  topic: ハウスドルフ空間・稠密集合
  statement: 値域がハウスドルフ空間のとき、稠密な部分集合上で一致する2つの連続写像は全体で一致する。
  statement_en: Two continuous maps into a Hausdorff space that agree on a dense subset are equal.
  assumptions: ["Xは位相空間", "Yはハウスドルフ空間", "f, g:X→Yは連続", "SはXの稠密部分集合", "S上でf=g"]
  quantifiers: ["任意の位相空間X, Y", "任意の連続写像f, g", "任意の稠密部分集合S"]
  conclusion: f=gである。
  answer: |
    fとgが一致する点全体Eは、値域がハウスドルフなので閉集合である。仮定よりEはSを含むので、Sの閉包を含む。Sは稠密なのでその閉包はXであり、E=Xとなる。
  strategy: The agreement set is closed and contains a dense set.
  sketch:
    - "apply_theorem: The agreement set E of f and g is closed since Y is Hausdorff."
    - "derive: E contains S, hence contains the closure of S."
    - "conclude: The closure of S is X, so f = g."
  openmath: (forall (X Y f g S) (-> (and (hausdorff_space Y) (continuous_between X Y f) (continuous_between X Y g) (dense_in X S) (forall (x) (-> (in x S) (= (fn_value f x) (fn_value g x))))) (= f g)))
  hard_negative:
    statement: 値域がハウスドルフなら、稠密部分集合上で一致する写像は連続でなくても等しい。
    reason: ℝ上で0とディリクレ関数(ℚで0、それ以外で1)は稠密なℚ上で一致するが異なる。
  target: |
    ∀ (X Y : Type*) [TopologicalSpace X] [TopologicalSpace Y] [T2Space Y] (f g : X → Y) (S : Set X), Continuous f → Continuous g → Dense S → (∀ x ∈ S, f x = g x) → f = g
  proof: |
    by
      intro X Y _ _ _ f g S hf hg hS h
      exact Continuous.ext_on hS hf hg h
- id: homeomorph_image_open_iff
  kind: gap
  level: 2
  topic: 位相空間・同相写像
  statement: 同相写像hによる像h(U)が開集合であることと、Uが開集合であることは同値である。
  statement_en: For a homeomorphism h, the image h(U) is open if and only if U is open.
  assumptions: ["X, Yは位相空間", "h:X→Yは同相写像", "UはXの部分集合"]
  quantifiers: ["任意の位相空間X, Y", "任意の同相写像h", "任意の部分集合U"]
  conclusion: h(U)が開であることとUが開であることは同値である。
  answer: |
    hは全単射なのでh(U)=(h^{-1})^{-1}(U)である。Uが開なら、h^{-1}の連続性よりh(U)は開である。逆にh(U)が開なら、U=h^{-1}(h(U))であり、hの連続性よりUは開である。
  strategy: Express the image as a preimage under the inverse map.
  sketch:
    - "translate: The image h(U) is the preimage of U under the inverse of h."
    - "derive: Continuity of the inverse gives one implication."
    - "derive: U = h^{-1}(h(U)) and continuity of h give the other."
    - "conclude: The two conditions are equivalent."
  openmath: (forall (X Y h U) (-> (homeomorphism X Y h) (<-> (open_in Y (image_of h U)) (open_in X U))))
  hard_negative:
    statement: 連続な全単射hについて、Uが開ならh(U)も開である。
    reason: 離散位相のℝから通常位相のℝへの恒等写像は連続な全単射だが、開集合{0}の像は開でない。
  target: |
    ∀ (X Y : Type*) [TopologicalSpace X] [TopologicalSpace Y] (h : X ≃ₜ Y) (U : Set X), IsOpen (h '' U) ↔ IsOpen U
  proof: |
    by
      intro X Y _ _ h U
      exact h.isOpen_image
- id: compact_to_hausdorff_homeomorphism
  kind: textbook
  level: 3
  topic: コンパクト空間・同相写像
  statement: コンパクト空間からハウスドルフ空間への連続な全単射は同相写像である。
  statement_en: A continuous bijection from a compact space to a Hausdorff space is a homeomorphism.
  assumptions: ["Xはコンパクト空間", "Yはハウスドルフ空間", "f:X→Yは連続な全単射"]
  quantifiers: ["任意の位相空間X, Y", "任意の写像f"]
  conclusion: fは同相写像である。
  answer: |
    逆写像の連続性を示せばよく、そのためにはfが閉写像であることを示せばよい。CをXの閉集合とする。CはコンパクトなXの閉部分集合なのでコンパクトであり、その像f(C)もコンパクトである。Yはハウスドルフなのでf(C)は閉である。よってfは閉写像であり、f^{-1}は連続である。
  strategy: Show f is a closed map via closed subset, continuous image and compact-in-Hausdorff.
  sketch:
    - "translate: It suffices that f sends closed sets to closed sets."
    - "derive: A closed subset C of the compact space X is compact."
    - "derive: f(C) is compact as a continuous image."
    - "apply_theorem: A compact subset of a Hausdorff space is closed."
    - "conclude: f is a closed bijection, so its inverse is continuous."
  openmath: (forall (X Y f) (-> (and (compact_space X) (hausdorff_space Y) (continuous_between X Y f) (bijection_between X Y f)) (homeomorphism X Y f)))
  hard_negative:
    statement: Xがコンパクトでなくても、ハウスドルフ空間への連続な全単射は同相写像である。
    reason: 半開区間[0,2π)から円周へのt↦e^{it}は連続な全単射だが、逆写像はt=0に対応する点で連続でない。
  target: |
    ∀ (X Y : Type*) [TopologicalSpace X] [TopologicalSpace Y] [CompactSpace X] [T2Space Y] (f : X → Y), Continuous f → Function.Bijective f → IsHomeomorph f
  proof: |
    by
      intro X Y _ _ _ _ f hf hb
      exact isHomeomorph_iff_continuous_bijective.mpr ⟨hf, hb⟩
- id: basis_open_iff
  kind: gap
  level: 2
  topic: 位相空間・開基
  statement: Bが開基のとき、Sが開集合であることと、Sの各点aに対しa∈t⊆Sとなるt∈Bが存在することは同値である。
  statement_en: If B is a basis, a set S is open if and only if every point a of S lies in some member t of B with t contained in S.
  assumptions: ["Xは位相空間", "BはXの開基", "SはXの部分集合"]
  quantifiers: ["任意の位相空間X", "任意の開基B", "任意の部分集合S"]
  conclusion: Sが開であることと、各a∈Sに対しa∈t⊆Sなるt∈Bが存在することは同値である。
  answer: |
    Sが開なら、開基の定義よりSはBの要素の和集合であり、各点aはその和の1つの要素tに属する。逆に条件を仮定すると、Sは条件で得られるtすべての和集合である。Bの要素は開なので、Sは開である。
  strategy: Use the description of open sets as unions of basis members.
  sketch:
    - "derive: An open S is a union of basis members, which gives t for each point."
    - "derive: Conversely S is the union of the members t chosen for its points."
    - "conclude: Unions of open sets are open."
  openmath: (forall (X B S) (-> (topological_basis X B) (<-> (open_in X S) (forall (a) (-> (in a S) (exists (t) (and (in t B) (in a t) (subset t S))))))))
  hard_negative:
    statement: Bが開基なら、すべての開集合はBの要素である。
    reason: ℝの開区間全体は開基だが、開集合(0,1)∪(2,3)は開区間ではない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (B : Set (Set X)), TopologicalSpace.IsTopologicalBasis B → ∀ S : Set X, IsOpen S ↔ ∀ a ∈ S, ∃ t ∈ B, a ∈ t ∧ t ⊆ S
  proof: |
    by
      intro X _ B hB S
      exact hB.isOpen_iff
- id: second_countable_separable
  kind: textbook
  level: 2
  topic: 可算公理・可分性
  statement: 第二可算空間は可分である。すなわち可算な稠密部分集合をもつ。
  statement_en: A second countable space has a countable dense subset.
  assumptions: ["Xは第二可算空間"]
  quantifiers: ["任意の位相空間X"]
  conclusion: Xは可算な稠密部分集合をもつ。
  answer: |
    Xの可算開基をとり、その空でない各要素から1点ずつ選ぶ。選んだ点の集合Dは可算である。Xの空でない開集合は空でない開基要素を含むので、Dの点を含む。したがってDは稠密である。
  strategy: Choose one point from each nonempty member of a countable basis.
  sketch:
    - "setup: Fix a countable basis of X."
    - "construct: Pick one point from each nonempty basis member to form D."
    - "derive: Each nonempty open set contains a nonempty basis member, hence a point of D."
    - "conclude: D is countable and dense."
  openmath: (forall (X) (-> (second_countable_space X) (exists (D) (and (countable_set D) (dense_in X D)))))
  hard_negative:
    statement: 可分な位相空間は第二可算である。
    reason: ゾルゲンフライ直線は可分だが第二可算ではない。距離空間では逆も成り立つ。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] [SecondCountableTopology X], ∃ D : Set X, D.Countable ∧ Dense D
  proof: |
    by
      intro X _ _
      exact TopologicalSpace.exists_countable_dense X
- id: separable_metric_second_countable
  kind: textbook
  level: 3
  topic: 可算公理・距離空間
  statement: 可分な距離空間は第二可算である。
  statement_en: A separable metric space is second countable.
  assumptions: ["Xは距離空間", "Xは可分"]
  quantifiers: ["任意の距離空間X"]
  conclusion: Xは第二可算である。
  answer: |
    Dを可算な稠密部分集合とし、中心がDの点で半径が正の有理数である開球全体Bを考える。Bは可算である。Uを開集合、x∈Uとし、B(x,2r)⊆Uとなる有理数r>0をとる。d(x,c)<rとなるc∈Dをとると、x∈B(c,r)⊆Uとなる。よってBは開基である。
  strategy: Use rational balls centered on a countable dense subset.
  sketch:
    - "setup: Take a countable dense subset D of X."
    - "construct: Let B be the balls with center in D and positive rational radius."
    - "derive: B is countable."
    - "derive: For x in open U choose rational r with B(x,2r) ⊆ U and c in D near x."
    - "conclude: x ∈ B(c,r) ⊆ U, so B is a basis."
  openmath: (forall (X) (-> (and (metric_space X) (separable_space X)) (second_countable_space X)))
  hard_negative:
    statement: 距離空間は常に第二可算である。
    reason: 非可算集合上の離散距離空間は第二可算ではない。各一点集合が開であり、開基に必ず含まれるためである。
  target: |
    ∀ (X : Type*) [MetricSpace X], TopologicalSpace.SeparableSpace X → SecondCountableTopology X
  proof: |
    by
      intro X _ _
      exact UniformSpace.secondCountable_of_separable X
- id: lindelof_second_countable
  kind: textbook
  level: 3
  topic: 可算公理・リンデレーフ性
  statement: 第二可算空間では、開集合族の和集合はその可算部分族の和集合と一致する。
  statement_en: In a second countable space, every family of open sets has a countable subfamily with the same union.
  assumptions: ["Xは第二可算空間", "各iに対しU_iはXの開集合"]
  quantifiers: ["任意の位相空間X", "任意の添字集合I", "任意の開集合族U"]
  conclusion: 可算な添字部分集合Tが存在して⋃_{i∈T} U_i=⋃_i U_iとなる。
  answer: |
    可算開基Bをとる。あるU_iに含まれるBの要素全体B'は可算である。各t∈B'に対しt⊆U_iとなるiを1つ選び、選んだi全体をTとする。Tは可算である。x∈U_iならx∈t⊆U_iとなるt∈B'があるので、xはTに対応するU_jの1つに属する。
  strategy: Index the subfamily by the countable basis members lying inside some U_i.
  sketch:
    - "setup: Fix a countable basis B."
    - "construct: Let B' be the members of B contained in some U_i and pick one such i for each."
    - "derive: The chosen index set T is countable."
    - "derive: Each point of the union lies in a member of B' and so in some U_j with j in T."
    - "conclude: The two unions agree."
  openmath: (forall (X I U) (-> (and (second_countable_space X) (forall (i) (-> (in i I) (open_in X (fn_value U i))))) (exists (T) (and (subset T I) (countable_set T) (= (family_union T U) (family_union I U))))))
  hard_negative:
    statement: 第二可算空間では、任意の開被覆が有限部分被覆をもつ。
    reason: ℝは第二可算だが、開被覆{(-n,n)}は有限部分被覆をもたない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] [SecondCountableTopology X] (ι : Type*) (U : ι → Set X), (∀ i, IsOpen (U i)) → ∃ T : Set ι, T.Countable ∧ ⋃ i ∈ T, U i = ⋃ i, U i
  proof: |
    by
      intro X _ _ ι U hU
      exact TopologicalSpace.isOpen_iUnion_countable U hU
- id: subspace_open_iff
  kind: gap
  level: 2
  topic: 位相空間・部分空間位相
  statement: 部分空間Aの部分集合Vが開であることと、Xの開集合Uがあって、V=U∩Aと書けることは同値である。
  statement_en: A subset V of a subspace A of X is open in A if and only if V is the trace on A of an open subset of X.
  assumptions: ["Xは位相空間", "AはXの部分集合で部分空間位相をもつ", "VはAの部分集合"]
  quantifiers: ["任意の位相空間X", "任意の部分集合A", "任意のV⊆A"]
  conclusion: VがAで開であることと、ある開集合U⊆XについてV=U∩Aであることは同値である。
  answer: |
    部分空間位相は包含写像を連続にする最弱の位相であり、その開集合は包含写像によるXの開集合の逆像そのものである。包含写像によるUの逆像はU∩Aである。よってVの開性とこの表示は同値である。
  strategy: Unfold the subspace topology as the topology induced by the inclusion.
  sketch:
    - "translate: The subspace topology is induced by the inclusion map."
    - "derive: The preimage of U under the inclusion is U ∩ A."
    - "conclude: Open sets of A are exactly the traces of open sets of X."
  openmath: (forall (X A V) (-> (subset V A) (<-> (open_in (subspace_topology_on X A) V) (exists (U) (and (open_in X U) (= V (inter U A)))))))
  hard_negative:
    statement: 部分空間Aで開な集合はXでも開である。
    reason: A=[0,1]⊂ℝでは(1/2,1]はAで開だがℝでは開ではない。Aが開集合なら成り立つ。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (A : Set X) (V : Set A), IsOpen V ↔ ∃ U : Set X, IsOpen U ∧ Subtype.val ⁻¹' U = V
  proof: |
    by
      intro X _ A V
      exact isOpen_induced_iff
- id: product_map_continuous_iff
  kind: gap
  level: 2
  topic: 位相空間・積位相
  statement: 積空間への写像が連続であることと、その2つの成分が連続であることは同値である。
  statement_en: A map into a product of two spaces is continuous if and only if both components are continuous.
  assumptions: ["Z, X, Yは位相空間", "f:Z→X×Yは写像"]
  quantifiers: ["任意の位相空間Z, X, Y", "任意の写像f"]
  conclusion: fの連続性と、2つの成分写像の連続性は同値である。
  answer: |
    射影は連続なのでfが連続なら成分も連続である。逆に成分f_1, f_2が連続とする。積位相の開基U×Vについてf^{-1}(U×V)=f_1^{-1}(U)∩f_2^{-1}(V)は開である。開基の要素の逆像が開なので、fは連続である。
  strategy: Check continuity on the product basis.
  sketch:
    - "derive: Composing with continuous projections gives continuous components."
    - "setup: Conversely consider a basic open set U × V."
    - "derive: Its preimage is the intersection of the component preimages."
    - "conclude: Preimages of basis members are open, so f is continuous."
  openmath: (forall (Z X Y f) (<-> (continuous_between Z (product_space X Y) f) (and (continuous_between Z X (function_compose_map (projection_first X Y) f)) (continuous_between Z Y (function_compose_map (projection_second X Y) f)))))
  hard_negative:
    statement: 積空間X×Y上の写像f:X×Y→Zは、各変数ごとに連続なら連続である。
    reason: f(x,y)=xy/(x²+y²)((x,y)≠(0,0))、f(0,0)=0は各変数ごとに連続だが原点で連続でない。
  target: |
    ∀ (Z X Y : Type*) [TopologicalSpace Z] [TopologicalSpace X] [TopologicalSpace Y] (f : Z → X × Y), Continuous f ↔ Continuous (fun z => (f z).1) ∧ Continuous (fun z => (f z).2)
  proof: |
    by
      intro Z X Y _ _ _ f
      constructor
      · intro hf
        exact ⟨continuous_fst.comp hf, continuous_snd.comp hf⟩
      · rintro ⟨h1, h2⟩
        exact h1.prodMk h2
- id: closure_of_product
  kind: gap
  level: 2
  topic: 位相空間・積位相と閉包
  statement: 積集合の閉包は閉包の積に等しい。
  statement_en: The closure of a product set equals the product of the closures.
  assumptions: ["X, Yは位相空間", "S⊆X", "T⊆Y"]
  quantifiers: ["任意の位相空間X, Y", "任意の部分集合S, T"]
  conclusion: cl(S×T)=cl(S)×cl(T)が成り立つ。
  answer: |
    点(x,y)の基本近傍はU×Vの形である。(U×V)∩(S×T)=(U∩S)×(V∩T)であり、これが空でないことはU∩SとV∩Tがともに空でないことと同値である。よって(x,y)がcl(S×T)に属することは、x∈cl(S)かつy∈cl(T)と同値である。
  strategy: Test membership in the closure on basic neighborhoods U × V.
  sketch:
    - "translate: Use the characterization of closure by basic neighborhoods U × V."
    - "derive: (U × V) ∩ (S × T) equals (U ∩ S) × (V ∩ T)."
    - "derive: This set is nonempty exactly when both factors are nonempty."
    - "conclude: Hence (x,y) ∈ cl(S × T) iff x ∈ cl(S) and y ∈ cl(T)."
  openmath: (forall (X Y S T) (= (closure_in (product_space X Y) (product_set S T)) (product_set (closure_in X S) (closure_in Y T))))
  hard_negative:
    statement: 積空間の任意の部分集合Wについて、cl(W)は射影の閉包の積に等しい。
    reason: ℝ²の対角線は閉であるが、各射影の閉包の積はℝ²全体である。
  target: |
    ∀ (X Y : Type*) [TopologicalSpace X] [TopologicalSpace Y] (S : Set X) (T : Set Y), closure (S ×ˢ T) = closure S ×ˢ closure T
  proof: |
    by
      intro X Y _ _ S T
      exact closure_prod_eq
- id: quotient_map_universal_property
  kind: textbook
  level: 2
  topic: 位相空間・商位相
  statement: q:X→Yが商写像のとき、写像g:Y→Zが連続であることとg∘qが連続であることは同値である。
  statement_en: If q from X to Y is a quotient map, then g from Y to Z is continuous if and only if g composed with q is continuous.
  assumptions: ["X, Y, Zは位相空間", "q:X→Yは商写像", "g:Y→Zは写像"]
  quantifiers: ["任意の位相空間X, Y, Z", "任意の商写像q", "任意の写像g"]
  conclusion: gの連続性とg∘qの連続性は同値である。
  answer: |
    qは連続なのでgが連続ならg∘qも連続である。逆にg∘qが連続とし、VをZの開集合とする。q^{-1}(g^{-1}(V))=(g∘q)^{-1}(V)はXで開である。商位相の定義より、g^{-1}(V)はYで開である。
  strategy: Use the defining property of quotient maps on preimages.
  sketch:
    - "derive: Composition with the continuous map q gives one direction."
    - "setup: Conversely fix an open set V of Z."
    - "derive: The preimage of g^{-1}(V) under q is the preimage of V under the composite."
    - "conclude: By definition of the quotient topology g^{-1}(V) is open."
  openmath: (forall (X Y Z q g) (-> (topological_quotient_map X Y q) (<-> (continuous_between Y Z g) (continuous_between X Z (function_compose_map g q)))))
  hard_negative:
    statement: 任意の連続全射qについて、g∘qが連続ならgも連続である。
    reason: 離散位相のℝから通常位相のℝへの恒等写像をqとすると、任意のgでg∘qは連続だがgは連続とは限らない。
  target: |
    ∀ (X Y Z : Type*) [TopologicalSpace X] [TopologicalSpace Y] [TopologicalSpace Z] (q : X → Y) (g : Y → Z), Topology.IsQuotientMap q → (Continuous g ↔ Continuous (g ∘ q))
  proof: |
    by
      intro X Y Z _ _ _ q g hq
      exact hq.continuous_iff
- id: compact_open_cover_finite
  kind: gap
  level: 2
  topic: コンパクト性・開被覆
  statement: コンパクト部分集合Kの開被覆は有限部分被覆をもつ。
  statement_en: Every open cover of a compact subset K has a finite subcover.
  assumptions: ["Xは位相空間", "KはXのコンパクト部分集合", "各U_iは開で、Kは⋃U_iに含まれる"]
  quantifiers: ["任意の位相空間X", "任意の部分集合K", "任意の開集合族U"]
  conclusion: 添字の有限集合tが存在してK⊆⋃_{i∈t} U_iとなる。
  answer: |
    コンパクト性の定義から直ちに従う。KはXの開集合族で覆われているので、部分空間Kの開被覆が定まり、その有限部分被覆を選ぶと対応するU_iの有限個がKを覆う。
  strategy: Apply the definition of compactness to the given cover.
  sketch:
    - "setup: Regard the family as an open cover of K."
    - "conclude: Compactness extracts a finite subfamily still covering K."
  openmath: (forall (X K I U) (-> (and (compact_in X K) (forall (i) (-> (in i I) (open_in X (fn_value U i)))) (subset K (family_union I U))) (exists (t) (and (subset t I) (finite_set t) (subset K (family_union t U))))))
  hard_negative:
    statement: コンパクト部分集合Kの閉集合による被覆は有限部分被覆をもつ。
    reason: 閉区間[0,1]を一点集合{x}全体で覆うと、すべて閉集合だが有限部分被覆はない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (K : Set X) (ι : Type*) (U : ι → Set X), IsCompact K → (∀ i, IsOpen (U i)) → K ⊆ ⋃ i, U i → ∃ t : Finset ι, K ⊆ ⋃ i ∈ t, U i
  proof: |
    by
      intro X _ K ι U hK hU hc
      exact hK.elim_finite_subcover U hU hc
- id: compact_closed_subset
  kind: gap
  level: 2
  topic: コンパクト性・閉部分集合
  statement: コンパクト集合Kに含まれる閉集合Cはコンパクトである。
  statement_en: A closed subset of a compact set is compact.
  assumptions: ["Xは位相空間", "KはXのコンパクト部分集合", "CはXの閉集合", "C⊆K"]
  quantifiers: ["任意の位相空間X", "任意の部分集合K, C"]
  conclusion: Cはコンパクトである。
  answer: |
    Cの開被覆に開集合C^cを加えると、Kの開被覆になる。Kはコンパクトなので有限部分被覆がとれる。そこからC^cを除いたものは、もとの被覆の有限部分族でCを覆う。
  strategy: Add the complement of C to the cover and use compactness of K.
  sketch:
    - "setup: Fix an open cover of C."
    - "construct: Add the open set C^c to get an open cover of K."
    - "apply_theorem: Extract a finite subcover of K."
    - "conclude: Removing C^c leaves a finite subcover of C."
  openmath: (forall (X K C) (-> (and (compact_in X K) (closed_in X C) (subset C K)) (compact_in X C)))
  hard_negative:
    statement: コンパクト集合Kの任意の部分集合はコンパクトである。
    reason: (0,1)は[0,1]に含まれるがコンパクトではない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (K C : Set X), IsCompact K → IsClosed C → C ⊆ K → IsCompact C
  proof: |
    by
      intro X _ K C hK hC hsub
      exact hK.of_isClosed_subset hC hsub
- id: compact_continuous_image
  kind: gap
  level: 2
  topic: コンパクト性・連続写像
  statement: コンパクト集合の連続写像による像はコンパクトである。
  statement_en: The image of a compact set under a continuous map is compact.
  assumptions: ["X, Yは位相空間", "KはXのコンパクト部分集合", "f:X→Yは連続"]
  quantifiers: ["任意の位相空間X, Y", "任意の部分集合K", "任意の連続写像f"]
  conclusion: f(K)はYのコンパクト部分集合である。
  answer: |
    f(K)の開被覆{V_i}をとる。fは連続なのでf^{-1}(V_i)は開で、これらはKを覆う。Kの有限部分被覆f^{-1}(V_{i_1}),…,f^{-1}(V_{i_m})をとると、V_{i_1},…,V_{i_m}はf(K)を覆う。
  strategy: Pull the cover back, extract a finite subcover and push it forward.
  sketch:
    - "setup: Fix an open cover of f(K)."
    - "derive: The preimages form an open cover of K."
    - "apply_theorem: Compactness of K gives a finite subcover of preimages."
    - "conclude: The corresponding open sets cover f(K)."
  openmath: (forall (X Y K f) (-> (and (compact_in X K) (continuous_between X Y f)) (compact_in Y (image_of f K))))
  hard_negative:
    statement: コンパクト集合の連続写像による逆像はコンパクトである。
    reason: ℝからℝへの定値写像0で、{0}の逆像はℝでありコンパクトではない。
  target: |
    ∀ (X Y : Type*) [TopologicalSpace X] [TopologicalSpace Y] (K : Set X) (f : X → Y), IsCompact K → Continuous f → IsCompact (f '' K)
  proof: |
    by
      intro X Y _ _ K f hK hf
      exact hK.image hf
- id: compact_in_hausdorff_closed
  kind: gap
  level: 2
  topic: コンパクト性・ハウスドルフ空間
  statement: ハウスドルフ空間のコンパクト部分集合は閉集合である。
  statement_en: A compact subset of a Hausdorff space is closed.
  assumptions: ["Xはハウスドルフ空間", "KはXのコンパクト部分集合"]
  quantifiers: ["任意の位相空間X", "任意の部分集合K"]
  conclusion: KはXの閉集合である。
  answer: |
    x∉Kとする。各y∈Kについてxとyの交わらない開近傍U_y∋x, V_y∋yをとる。{V_y}はKを覆うので有限個V_{y_1},…,V_{y_m}で覆える。U_{y_1}∩…∩U_{y_m}はxの開近傍で、Kと交わらない。よってK^cは開である。
  strategy: Separate x from each point of K and use a finite subcover.
  sketch:
    - "setup: Fix x outside K."
    - "apply_theorem: For each y in K choose disjoint open U_y ∋ x and V_y ∋ y."
    - "derive: Finitely many V_y cover K by compactness."
    - "derive: The finite intersection of the corresponding U_y is an open neighborhood of x missing K."
    - "conclude: The complement of K is open."
  openmath: (forall (X K) (-> (and (hausdorff_space X) (compact_in X K)) (closed_in X K)))
  hard_negative:
    statement: 任意の位相空間でコンパクト部分集合は閉集合である。
    reason: 2点以上の密着位相空間では一点集合はコンパクトだが閉ではない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] [T2Space X] (K : Set X), IsCompact K → IsClosed K
  proof: |
    by
      intro X _ _ K hK
      exact hK.isClosed
- id: extreme_value_theorem
  kind: named
  level: 2
  topic: コンパクト性・最大値定理
  statement: 最大値・最小値の定理。空でないコンパクト集合上の連続な実数値関数は最大値と最小値をとる。
  statement_en: A continuous real-valued function on a nonempty compact set attains its maximum and minimum.
  assumptions: ["Xは位相空間", "KはXの空でないコンパクト部分集合", "f:X→ℝはK上で連続"]
  quantifiers: ["任意の位相空間X", "任意の部分集合K", "任意の関数f"]
  conclusion: あるc, d∈Kが存在し、任意のx∈Kについてf(d)≤f(x)≤f(c)となる。
  answer: |
    f(K)はℝのコンパクト集合なので有界閉集合である。空でない有界集合なので上限sと下限iが存在し、f(K)が閉なのでs, iはf(K)に属する。よってf(c)=s, f(d)=iとなるc, d∈Kがある。
  strategy: The image is compact in ℝ, so it contains its supremum and infimum.
  sketch:
    - "derive: f(K) is a nonempty compact subset of ℝ."
    - "apply_theorem: Compact subsets of ℝ are closed and bounded."
    - "derive: The supremum and infimum exist and lie in f(K)."
    - "conclude: Points of K attaining them give the maximum and minimum."
  openmath: (forall (X K f) (-> (and (compact_in X K) (!= K emptyset) (continuous_between (subspace_topology_on X K) R f)) (and (exists (c) (and (in c K) (forall (x) (-> (in x K) (<= (fn_value f x) (fn_value f c)))))) (exists (d) (and (in d K) (forall (x) (-> (in x K) (<= (fn_value f d) (fn_value f x)))))))))
  hard_negative:
    statement: 有界な集合上の連続関数は最大値をとる。
    reason: (0,1)上のf(x)=xは有界な集合上で連続だが最大値をとらない。コンパクト性が必要である。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (K : Set X) (f : X → ℝ), IsCompact K → K.Nonempty → ContinuousOn f K → (∃ c ∈ K, ∀ x ∈ K, f x ≤ f c) ∧ (∃ d ∈ K, ∀ x ∈ K, f d ≤ f x)
  proof: |
    by
      intro X _ K f hK hne hf
      obtain ⟨c, hc, hmax⟩ := hK.exists_isMaxOn hne hf
      obtain ⟨d, hd, hmin⟩ := hK.exists_isMinOn hne hf
      exact ⟨⟨c, hc, fun x hx => isMaxOn_iff.mp hmax x hx⟩, ⟨d, hd, fun x hx => isMinOn_iff.mp hmin x hx⟩⟩
- id: tychonoff_theorem
  kind: named
  level: 3
  topic: コンパクト性・チコノフの定理
  statement: チコノフの定理。任意個のコンパクト空間の積空間はコンパクトである。
  statement_en: The product of an arbitrary family of compact spaces is compact in the product topology.
  assumptions: ["Iは任意の添字集合", "各i∈Iに対しX_iはコンパクト空間"]
  quantifiers: ["任意の添字集合I", "任意の空間族X"]
  conclusion: 積空間∏_i X_iはコンパクトである。
  answer: |
    概略を述べる。コンパクト性は、任意の超フィルターが収束することと同値である。積空間上の超フィルターFをとると、各射影による像F_iはX_i上の超フィルターであり、X_iのコンパクト性より極限x_iをもつ。選択公理で各x_iを選ぶと、点x=(x_i)に対しFはxに収束する。積位相の収束は成分ごとの収束だからである。
  strategy: Use ultrafilters and componentwise convergence (outline).
  sketch:
    - "translate: Compactness is equivalent to convergence of every ultrafilter."
    - "setup: Take an ultrafilter F on the product."
    - "derive: Each projection of F is an ultrafilter on X_i and has a limit x_i."
    - "construct: Choose the limits to form a point x of the product."
    - "conclude: Componentwise convergence gives F converging to x."
  openmath: (forall (I X) (-> (forall (i) (-> (in i I) (compact_space (fn_value X i)))) (compact_space (product_family I X))))
  hard_negative:
    statement: 任意個のコンパクト空間の積は箱型位相でもコンパクトである。
    reason: 2点離散空間の無限個の積は箱型位相では無限離散空間となり、コンパクトではない。
  target: |
    ∀ (ι : Type*) (X : ι → Type*) [∀ i, TopologicalSpace (X i)] [∀ i, CompactSpace (X i)], CompactSpace (∀ i, X i)
  proof: |
    by
      intro ι X _ _
      infer_instance
- id: compact_finite_intersection_property
  kind: textbook
  level: 2
  topic: コンパクト性・有限交叉性
  statement: コンパクト集合Kと閉集合族{C_i}について、任意の有限部分族とKの共通部分が空でないならば、全体の共通部分とKの共通部分も空でない。
  statement_en: If K is compact and {C_i} is a family of closed sets such that K meets every finite intersection of them, then K meets the whole intersection.
  assumptions: ["Xは位相空間", "KはXのコンパクト部分集合", "各C_iは閉", "任意の有限な添字集合uについてK∩⋂_{i∈u} C_iは空でない"]
  quantifiers: ["任意の位相空間X", "任意の部分集合K", "任意の閉集合族C"]
  conclusion: K∩⋂_i C_iは空でない。
  answer: |
    K∩⋂_i C_iが空であると仮定する。このとき開集合族{C_i^c}はKを覆う。Kのコンパクト性より有限個の添字の集合uがあり、{C_i^c}_{i∈u}がKを覆う。これはK∩⋂_{i∈u} C_iが空であることを意味し、仮定に反する。
  strategy: Take complements to obtain an open cover and argue by contradiction.
  sketch:
    - "contradiction: Assume the full intersection with K is empty."
    - "translate: The complements of the C_i form an open cover of K."
    - "apply_theorem: Extract a finite subcover."
    - "conclude: A finite intersection with K is empty, contradicting the hypothesis."
  openmath: (forall (X K I C) (-> (and (compact_in X K) (forall (i) (-> (in i I) (closed_in X (fn_value C i)))) (forall (u) (-> (and (subset u I) (finite_set u)) (!= (inter K (family_inter u C)) emptyset)))) (!= (inter K (family_inter I C)) emptyset)))
  hard_negative:
    statement: 閉集合の減少列は、各項が空でなければ共通部分も空でない。
    reason: ℝの閉集合[n,∞)の共通部分は空である。コンパクト性が必要である。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (K : Set X) (ι : Type*) (C : ι → Set X), IsCompact K → (∀ i, IsClosed (C i)) → (∀ u : Finset ι, (K ∩ ⋂ i ∈ u, C i).Nonempty) → (K ∩ ⋂ i, C i).Nonempty
  proof: |
    by
      intro X _ K ι C hK hC h
      exact hK.inter_iInter_nonempty C hC h
- id: metric_compact_closed_bounded
  kind: gap
  level: 2
  topic: 距離空間・コンパクト性
  statement: 距離空間のコンパクト部分集合は有界閉集合である。
  statement_en: A compact subset of a metric space is closed and bounded.
  assumptions: ["Xは距離空間", "KはXのコンパクト部分集合"]
  quantifiers: ["任意の距離空間X", "任意の部分集合K"]
  conclusion: KはXの閉集合であり、有界である。
  answer: |
    距離空間はハウスドルフなのでコンパクト集合Kは閉である。Kが空でないとしてa∈Kを1つとる。開球B(a,n)全体はKを覆うので有限個で覆え、最大の半径をRとするとK⊆B(a,R)である。空集合なら明らかに有界である。
  strategy: Hausdorffness gives closedness; a cover by balls gives boundedness.
  sketch:
    - "apply_theorem: Metric spaces are Hausdorff, so K is closed."
    - "construct: Cover K by the balls B(a,n) centered at a point a."
    - "derive: Finitely many balls suffice, so K lies in one ball."
    - "conclude: K is bounded."
  openmath: (forall (X K) (-> (and (metric_space X) (compact_in X K)) (and (closed_in X K) (bounded_in X K))))
  hard_negative:
    statement: 距離空間の有界閉集合はコンパクトである。
    reason: 無限集合上の離散距離では全体が有界閉だがコンパクトではない。有界閉がコンパクトと同値なのはℝ^nなどの場合である。
  target: |
    ∀ (X : Type*) [MetricSpace X] (K : Set X), IsCompact K → IsClosed K ∧ Bornology.IsBounded K
  proof: |
    by
      intro X _ K hK
      exact ⟨hK.isClosed, hK.isBounded⟩
- id: compact_hausdorff_normal
  kind: textbook
  level: 3
  topic: 分離公理・コンパクト空間
  statement: コンパクトなハウスドルフ空間は正規空間である。
  statement_en: A compact Hausdorff space is normal.
  assumptions: ["Xはコンパクトなハウスドルフ空間"]
  quantifiers: ["任意の位相空間X"]
  conclusion: Xの交わらない2つの閉集合は交わらない開集合で分離できる。
  answer: |
    A, BをXの交わらない閉集合とする。Xはコンパクトなので、A, Bはコンパクトである。ハウスドルフ空間の交わらないコンパクト集合は交わらない開集合で分離できるので、Xは正規である。
  strategy: Closed subsets are compact, then separate disjoint compact sets.
  sketch:
    - "setup: Take disjoint closed sets A and B."
    - "derive: They are compact as closed subsets of a compact space."
    - "apply_theorem: Disjoint compact sets in a Hausdorff space are separated by open sets."
    - "conclude: X is normal."
  openmath: (forall (X) (-> (and (compact_space X) (hausdorff_space X)) (normal_space X)))
  hard_negative:
    statement: コンパクト空間は常に正規空間である。
    reason: 無限集合に補有限位相を入れるとコンパクトでT1だが、異なる2点は交わらない開集合で分離できない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] [CompactSpace X] [T2Space X], NormalSpace X
  proof: |
    by
      intro X _ _ _
      infer_instance
- id: heine_cantor_metric
  kind: textbook
  level: 3
  topic: 距離空間・一様連続性
  statement: コンパクト距離空間から距離空間への連続写像は一様連続である。
  statement_en: A continuous map from a compact metric space to a metric space is uniformly continuous.
  assumptions: ["Xはコンパクト距離空間", "Yは距離空間", "f:X→Yは連続"]
  quantifiers: ["任意の距離空間X, Y", "任意の連続写像f"]
  conclusion: fは一様連続である。
  answer: |
    ε>0を固定する。各x∈Xでd(y,x)<2δ_xならd(f(y),f(x))<ε/2となるδ_x>0をとる。開球B(x,δ_x)全体はXを覆うので有限個B(x_i,δ_{x_i})で覆え、δをδ_{x_i}の最小値とする。d(y,z)<δとし、y∈B(x_i,δ_{x_i})とする。このときd(z,x_i)<2δ_{x_i}なので、三角不等式よりd(f(y),f(z))<εである。
  strategy: Use a finite subcover to take a uniform δ.
  sketch:
    - "setup: Fix ε > 0 and pick δ_x from continuity at each point x."
    - "apply_theorem: Compactness gives a finite subcover by the balls B(x, δ_x)."
    - "construct: Let δ be the minimum of the finitely many δ_{x_i}."
    - "derive: Points within δ both lie within 2δ_{x_i} of a common center x_i."
    - "conclude: The triangle inequality gives d(f(y), f(z)) < ε."
  openmath: (forall (X Y f) (-> (and (metric_space X) (compact_space X) (metric_space Y) (continuous_between X Y f)) (uniformly_continuous_map X Y f)))
  hard_negative:
    statement: 有界な距離空間上の連続関数は一様連続である。
    reason: (0,1)上のf(x)=1/xは有界な定義域上で連続だが一様連続ではない。
  target: |
    ∀ (X Y : Type*) [MetricSpace X] [CompactSpace X] [MetricSpace Y] (f : X → Y), Continuous f → UniformContinuous f
  proof: |
    by
      intro X Y _ _ _ f hf
      exact CompactSpace.uniformContinuous_of_continuous hf
- id: compact_closed_positive_distance
  kind: gap
  level: 3
  topic: 距離空間・コンパクト集合と閉集合の距離
  statement: 距離空間で交わらないコンパクト集合Kと閉集合Cの間には正の距離がある。
  statement_en: A compact set K and a disjoint closed set C in a metric space are at positive distance from each other.
  assumptions: ["Xは距離空間", "KはXのコンパクト部分集合", "CはXの閉集合", "K∩Cは空"]
  quantifiers: ["任意の距離空間X", "任意の部分集合K, C"]
  conclusion: r>0が存在し、任意のx∈K, y∈Cについてd(x,y)≥rとなる。
  answer: |
    Cが空なら明らかなので空でないとする。関数x↦d(x,C)は連続であり、Cが閉なのでx∉Cでは正である。Kが空でなければKのコンパクト性より最小値mをとり、m>0である。m=rとすれば、x∈K, y∈Cについてd(x,y)≥d(x,C)≥rである。Kが空なら任意のrでよい。
  strategy: Minimize the continuous positive function x ↦ d(x,C) on K.
  sketch:
    - "setup: Dispose of the trivial cases where K or C is empty."
    - "derive: x ↦ d(x,C) is continuous and positive on K since C is closed and disjoint from K."
    - "apply_theorem: The extreme value theorem gives a positive minimum r on K."
    - "conclude: Hence d(x,y) ≥ d(x,C) ≥ r for x in K and y in C."
  openmath: (forall (X K C) (-> (and (metric_space X) (compact_in X K) (closed_in X C) (= (inter K C) emptyset)) (exists (r) (and (> r 0) (forall (x y) (-> (and (in x K) (in y C)) (>= (dist_of x y) r)))))))
  hard_negative:
    statement: 距離空間の交わらない2つの閉集合の間には常に正の距離がある。
    reason: ℝ²で{(x,0)}と{(x,1/x) | x>0}は交わらない閉集合だが、距離の下限は0である。
  target: |
    ∀ (X : Type*) [MetricSpace X] (K C : Set X), IsCompact K → IsClosed C → Disjoint K C → ∃ r : ℝ, 0 < r ∧ ∀ x ∈ K, ∀ y ∈ C, r ≤ dist x y
  proof: |
    by
      intro X _ K C hK hC hd
      obtain ⟨r, hr, h⟩ := Metric.exists_pos_forall_lt_edist hK hC hd
      refine ⟨r, by exact_mod_cast hr, fun x hx y hy => ?_⟩
      have hlt := h x hx y hy
      rw [edist_nndist, ENNReal.coe_lt_coe] at hlt
      rw [dist_nndist]
      exact_mod_cast hlt.le
- id: metric_compact_iff_sequentially_compact
  kind: textbook
  level: 3
  topic: 距離空間・点列コンパクト性
  statement: 距離空間の部分集合Kについて、Kがコンパクトであることと点列コンパクトであることは同値である。
  statement_en: A subset K of a metric space is compact if and only if every sequence in K has a subsequence converging to a point of K.
  assumptions: ["Xは距離空間", "KはXの部分集合"]
  quantifiers: ["任意の距離空間X", "任意の部分集合K"]
  conclusion: Kのコンパクト性と、K内の任意の点列がKの点に収束する部分列をもつことは同値である。
  answer: |
    概略を述べる。Kがコンパクトのとき、Kの点に収束する部分列をもたない点列があれば、Kの各点の小さな球は点列の項を有限個しか含まず、有限被覆と矛盾する。逆にKが点列コンパクトとする。まずKが全有界であることを示す。有限のε網がなければ、距離ε以上離れた点列がとれ、収束部分列をもたない。次にルベーグ数の議論で、開被覆に対するδをとり、δ網の有限個の球を被覆の要素に含めることで有限部分被覆を得る。
  strategy: Compactness gives cluster points; conversely use total boundedness and a Lebesgue number (outline).
  sketch:
    - "contradiction: A sequence without convergent subsequence contradicts a finite cover by small balls."
    - "derive: Sequential compactness implies total boundedness via ε-separated sequences."
    - "derive: Sequential compactness gives a Lebesgue number for any open cover."
    - "construct: Take a finite δ-net for the Lebesgue number δ."
    - "conclude: Each ball of the net lies in a cover member, giving a finite subcover."
  openmath: (forall (X K) (-> (metric_space X) (<-> (compact_in X K) (sequentially_compact_in X K))))
  hard_negative:
    statement: 任意の位相空間でコンパクトであることと点列コンパクトであることは同値である。
    reason: 一般の位相空間では同値でない。積空間[0,1]^{[0,1]}はチコノフの定理によりコンパクトだが点列コンパクトではない。
  target: |
    ∀ (X : Type*) [MetricSpace X] (K : Set X), IsCompact K ↔ ∀ a : ℕ → X, (∀ n, a n ∈ K) → ∃ x ∈ K, ∃ φ : ℕ → ℕ, StrictMono φ ∧ Filter.Tendsto (a ∘ φ) Filter.atTop (nhds x)
  proof: |
    by
      intro X _ K
      exact UniformSpace.isCompact_iff_isSeqCompact
- id: heine_borel_euclidean
  kind: named
  level: 2
  topic: ユークリッド空間・ハイネ・ボレルの定理
  statement: ハイネ・ボレルの定理。ℝ^nの部分集合がコンパクトであることと、有界閉集合であることは同値である。
  statement_en: A subset of Euclidean space ℝ^n is compact if and only if it is closed and bounded.
  assumptions: ["nは自然数", "Kはℝ^nの部分集合"]
  quantifiers: ["任意の自然数n", "任意の部分集合K"]
  conclusion: Kのコンパクト性と、Kが有界閉であることは同値である。
  answer: |
    コンパクトならば有界閉であることは、距離空間で一般に成り立つ。逆にKを有界閉とする。Kは立方体[-R,R]^nに含まれる。閉区間[-R,R]は区間縮小法によりコンパクトであり、コンパクト集合の有限積としてこの立方体もコンパクトである。Kはその閉部分集合なのでコンパクトである。
  strategy: Enclose K in a cube, which is a finite product of compact intervals.
  sketch:
    - "derive: Compact implies closed and bounded in any metric space."
    - "setup: Conversely enclose a closed bounded K in a cube [-R,R]^n."
    - "apply_theorem: Closed intervals are compact and finite products of compact sets are compact."
    - "conclude: K is a closed subset of a compact set, so it is compact."
  openmath: (forall (n K) (<-> (compact_in (euclidean_space n) K) (and (closed_in (euclidean_space n) K) (bounded_in (euclidean_space n) K))))
  hard_negative:
    statement: 任意の距離空間で、有界閉集合はコンパクトである。
    reason: 無限次元ヒルベルト空間の閉単位球は有界閉だがコンパクトではない。
  target: |
    ∀ (n : ℕ) (K : Set (EuclideanSpace ℝ (Fin n))), IsCompact K ↔ IsClosed K ∧ Bornology.IsBounded K
  proof: |
    by
      intro n K
      exact Metric.isCompact_iff_isClosed_bounded
- id: lebesgue_number_lemma_metric
  kind: named
  level: 3
  topic: 距離空間・ルベーグ数
  statement: ルベーグの数の補題。距離空間のコンパクト集合Kの開被覆{U_i}に対し、δ>0が存在して、各x∈Kについて球B(x,δ)はあるU_iに含まれる。
  statement_en: For an open cover of a compact subset K of a metric space, there is δ > 0 such that for every x in K the ball B(x,δ) lies in some member of the cover.
  assumptions: ["Xは距離空間", "KはXのコンパクト部分集合", "各U_iは開で、Kは⋃U_iに含まれる"]
  quantifiers: ["任意の距離空間X", "任意の部分集合K", "任意の開集合族U"]
  conclusion: δ>0が存在し、任意のx∈Kに対しB(x,δ)⊆U_iとなるiがある。
  answer: |
    各x∈KについてB(x,2r_x)⊆U_iとなるr_x>0とiをとる。球B(x,r_x)全体はKを覆うので、有限個B(x_1,r_1),…,B(x_m,r_m)で覆える。δをr_1,…,r_mの最小値とする。x∈Kを任意にとるとd(x,x_j)<r_jとなるjがあり、B(x,δ)⊆B(x_j,2r_j)が三角不等式から従う。後者はあるU_iに含まれる。
  strategy: Take a finite subcover by half-radius balls and the minimum radius.
  sketch:
    - "setup: For each x in K choose r_x with B(x,2r_x) inside a cover member."
    - "apply_theorem: Finitely many balls B(x_j,r_j) cover K."
    - "construct: Let δ be the minimum of the radii r_j."
    - "derive: For x in B(x_j,r_j) the triangle inequality gives B(x,δ) ⊆ B(x_j,2r_j)."
    - "conclude: Hence B(x,δ) lies in a cover member."
  openmath: (forall (X K I U) (-> (and (metric_space X) (compact_in X K) (forall (i) (-> (in i I) (open_in X (fn_value U i)))) (subset K (family_union I U))) (exists (d) (and (> d 0) (forall (x) (-> (in x K) (exists (i) (and (in i I) (subset (open_ball x d) (fn_value U i))))))))))
  hard_negative:
    statement: 距離空間の任意の開被覆にルベーグ数が存在する。
    reason: X=(0,1)の開被覆{(1/n,1)}には共通のδがない。x<δならB(x,δ)は0に近い点を含み、どの要素にも含まれない。
  target: |
    ∀ (X : Type*) [MetricSpace X] (K : Set X) (ι : Type*) (U : ι → Set X), IsCompact K → (∀ i, IsOpen (U i)) → K ⊆ ⋃ i, U i → ∃ δ : ℝ, 0 < δ ∧ ∀ x ∈ K, ∃ i, Metric.ball x δ ⊆ U i
  proof: |
    by
      intro X _ K ι U hK hU hc
      exact lebesgue_number_lemma_of_metric hK hU hc
- id: connected_continuous_image
  kind: gap
  level: 2
  topic: 連結性・連続写像
  statement: 連結集合の連続写像による像は連結である。
  statement_en: The image of a connected set under a continuous map is connected.
  assumptions: ["X, Yは位相空間", "SはXの空でない連結部分集合", "f:X→Yは連続"]
  quantifiers: ["任意の位相空間X, Y", "任意の部分集合S", "任意の連続写像f"]
  conclusion: f(S)はYの空でない連結部分集合である。
  answer: |
    f(S)が交わらない開集合U, Vで分割されたとする。すなわちf(S)⊆U∪Vで、U∩f(S)とV∩f(S)は空でなく、交わらない。するとf^{-1}(U), f^{-1}(V)はSを同様に分割し、Sの連結性に反する。Sが空でないのでf(S)も空でない。
  strategy: Pull back a separation of the image.
  sketch:
    - "contradiction: Assume open U and V separate f(S)."
    - "derive: Their preimages are open by continuity and separate S."
    - "conclude: This contradicts connectedness of S, so f(S) is connected."
  openmath: (forall (X Y S f) (-> (and (connected_in X S) (continuous_between X Y f)) (connected_in Y (image_of f S))))
  hard_negative:
    statement: 連続写像による連結集合の逆像は連結である。
    reason: x↦x²で連結集合{1}の逆像は{-1,1}であり連結ではない。
  target: |
    ∀ (X Y : Type*) [TopologicalSpace X] [TopologicalSpace Y] (S : Set X) (f : X → Y), IsConnected S → Continuous f → IsConnected (f '' S)
  proof: |
    by
      intro X Y _ _ S f hS hf
      exact hS.image f hf.continuousOn
- id: connected_union_common_point
  kind: gap
  level: 2
  topic: 連結性・和集合
  statement: 共通の点xをもつ連結集合の空でない族の和集合は連結である。
  statement_en: The union of a nonempty family of connected sets sharing a common point is connected.
  assumptions: ["Xは位相空間", "添字集合は空でない", "各S_iは連結", "xは全てのS_iに属する"]
  quantifiers: ["任意の位相空間X", "任意の空でない集合族S", "任意の点x"]
  conclusion: ⋃_i S_iは空でない連結集合である。
  answer: |
    添字集合が空でないので和集合はxを含み、空でない。開集合U, Vが和集合を分割するとし、x∈Uとする。和集合に属するVの点yがあれば、yはあるS_iに属する。このときS_iはxとyを含むので、U, VによってS_iが分割され、S_iの連結性に反する。よってVは和集合と交わらない。
  strategy: A separation of the union would separate the member containing a second point.
  sketch:
    - "contradiction: Assume open U and V separate the union, with x in U."
    - "setup: Take a point y of the union in V and a member S_i containing it."
    - "derive: S_i contains x and y, so U and V separate S_i."
    - "conclude: This contradicts connectedness of S_i."
  openmath: (forall (X I S x) (-> (and (!= I emptyset) (forall (i) (-> (in i I) (and (connected_in X (fn_value S i)) (in x (fn_value S i)))))) (connected_in X (family_union I S))))
  hard_negative:
    statement: 連結集合の和集合は常に連結である。
    reason: ℝの(0,1)と(2,3)は連結だが、和集合は連結ではない。共通点が必要である。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (ι : Type*) [Nonempty ι] (S : ι → Set X) (x : X), (∀ i, x ∈ S i) → (∀ i, IsConnected (S i)) → IsConnected (⋃ i, S i)
  proof: |
    by
      intro X _ ι _ S x hx hS
      exact ⟨⟨x, Set.mem_iUnion.2 ⟨Classical.arbitrary ι, hx _⟩⟩, isPreconnected_iUnion ⟨x, Set.mem_iInter.mpr hx⟩ fun i => (hS i).isPreconnected⟩
- id: connected_between_closure
  kind: gap
  level: 2
  topic: 連結性・閉包
  statement: Sが空でない連結集合でS⊆T⊆cl(S)ならばTも連結である。特に空でない連結集合の閉包は連結である。
  statement_en: If S is nonempty and connected and S ⊆ T ⊆ cl(S), then T is nonempty and connected; in particular closures of nonempty connected sets are connected.
  assumptions: ["Xは位相空間", "SはXの空でない連結部分集合", "S⊆T⊆cl(S)"]
  quantifiers: ["任意の位相空間X", "任意の部分集合S, T"]
  conclusion: Tは空でない連結集合である。
  answer: |
    TはSを含むので空でない。開集合U, VがTを分割するとする。TのUの点はSの閉包の点なのでUはSと交わり、同様にVもSと交わる。するとU, VはSを分割し、Sの連結性に反する。よってTは連結である。
  strategy: Each part of a separation of T must meet S because T lies in the closure of S.
  sketch:
    - "contradiction: Assume open U and V separate T."
    - "derive: Points of T in U are closure points of S, so U meets S; likewise V."
    - "conclude: U and V then separate S, a contradiction."
  openmath: (forall (X S T) (-> (and (connected_in X S) (subset S T) (subset T (closure_in X S))) (connected_in X T)))
  hard_negative:
    statement: 連結集合の内部は連結である。
    reason: ℝ²の2つの閉円板が1点で接する和集合は連結だが、その内部は2つの開円板の和であり連結ではない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (S T : Set X), IsConnected S → S ⊆ T → T ⊆ closure S → IsConnected T
  proof: |
    by
      intro X _ S T hS hST hT
      exact hS.subset_closure hST hT
- id: connected_product_two
  kind: gap
  level: 2
  topic: 連結性・積
  statement: 空でない連結集合S, Tの積S×Tは積空間で連結である。
  statement_en: The product of two nonempty connected sets is connected in the product space.
  assumptions: ["X, Yは位相空間", "S⊆X, T⊆Yは空でない連結集合"]
  quantifiers: ["任意の位相空間X, Y", "任意の部分集合S, T"]
  conclusion: S×TはX×Yの空でない連結部分集合である。
  answer: |
    (a,b)∈S×Tを固定する。各(x,y)∈S×Tについて、{x}×T∪S×{b}は、共通点(x,b)をもつ2つの連結集合の和なので連結で、(a,b)と(x,y)を含む。これらの集合は全て(a,b)を共有するので、和集合S×Tは連結である。
  strategy: Cover the product by connected crosses through a fixed point.
  sketch:
    - "setup: Fix (a,b) in S × T."
    - "construct: For each (x,y) form the cross {x} × T ∪ S × {b}."
    - "derive: Each cross is connected as a union of two connected sets sharing (x,b)."
    - "conclude: All crosses contain (a,b), so their union S × T is connected."
  openmath: (forall (X Y S T) (-> (and (connected_in X S) (connected_in Y T)) (connected_in (product_space X Y) (product_set S T))))
  hard_negative:
    statement: Sが連結ならば、任意の空でない集合Tについて積S×Tは連結である。
    reason: S=ℝ, T={0,1}⊂ℝとすると、S×Tは交わらない2本の直線の和であり連結ではない。Tの連結性も必要である。
  target: |
    ∀ (X Y : Type*) [TopologicalSpace X] [TopologicalSpace Y] (S : Set X) (T : Set Y), IsConnected S → IsConnected T → IsConnected (S ×ˢ T)
  proof: |
    by
      intro X Y _ _ S T hS hT
      exact hS.prod hT
- id: real_connected_iff_interval
  kind: textbook
  level: 2
  topic: 連結性・実数直線
  statement: ℝの空でない部分集合Sが連結であることと、Sの2点の間の点が常にSに属すること(Sが区間であること)は同値である。
  statement_en: A nonempty subset S of ℝ is connected if and only if it contains every point between any two of its points.
  assumptions: ["Sはℝの空でない部分集合"]
  quantifiers: ["任意の空でない部分集合S"]
  conclusion: Sの連結性と、x, y∈S, x≤z≤yならばz∈Sであることは同値である。
  answer: |
    x<z<yでx, y∈S, z∉Sなら、(-∞,z)と(z,∞)がSを分割するのでSは連結でない。逆にSが区間の条件を満たすとし、開集合U, VがSを分割するとする。x∈U∩S, y∈V∩Sをとり、必要ならU, Vを入れ替えてx<yとし、zを[x,y]∩Uの上限とする。区間の条件より[x,y]⊆Sなのでzはどちらかに属するが、いずれの場合も開集合であることから上限の性質に矛盾する。
  strategy: A missing point separates; otherwise use a supremum argument.
  sketch:
    - "derive: A gap z gives the separation (-∞,z) and (z,∞)."
    - "contradiction: Otherwise assume open U and V separate S with x in U and y in V."
    - "construct: Let z be the supremum of [x,y] ∩ U."
    - "case_split: z lies in U or in V."
    - "conclude: Either case contradicts the supremum since U and V are open."
  openmath: (forall (S) (-> (and (subset S R) (!= S emptyset)) (<-> (connected_in R S) (interval_like S))))
  hard_negative:
    statement: ℝの開集合はすべて連結である。
    reason: (0,1)∪(2,3)は開集合だが連結ではない。
  target: |
    ∀ S : Set ℝ, S.Nonempty → (IsConnected S ↔ ∀ x ∈ S, ∀ y ∈ S, ∀ z, x ≤ z → z ≤ y → z ∈ S)
  proof: |
    by
      intro S hne
      have h0 : IsConnected S ↔ IsPreconnected S := ⟨fun h => h.isPreconnected, fun h => ⟨hne, h⟩⟩
      rw [h0, isPreconnected_iff_ordConnected, Set.ordConnected_def]
      constructor
      · intro h x hx y hy z h1 h2
        exact h hx hy ⟨h1, h2⟩
      · intro h x hx y hy z hz
        exact h x hx y hy z hz.1 hz.2
- id: path_connected_is_connected
  kind: gap
  level: 2
  topic: 弧状連結性
  statement: 弧状連結な集合は連結である。
  statement_en: A path-connected set is connected.
  assumptions: ["Xは位相空間", "SはXの弧状連結部分集合"]
  quantifiers: ["任意の位相空間X", "任意の部分集合S"]
  conclusion: SはXの連結部分集合である。
  answer: |
    a∈Sを固定する。各x∈Sについてaとxを結ぶS内の道をとると、その像は閉区間の連続像なので連結である。これらの像はaを共有し、和集合はSなので、Sは連結である。
  strategy: Write S as a union of connected path images through a fixed point.
  sketch:
    - "setup: Fix a point a in S."
    - "derive: Each path from a to x has connected image since [0,1] is connected."
    - "conclude: The images share a and their union is S, so S is connected."
  openmath: (forall (X S) (-> (path_connected_in X S) (connected_in X S)))
  hard_negative:
    statement: 連結な集合は弧状連結である。
    reason: 位相幾何学者の正弦曲線の閉包は連結だが弧状連結ではない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] (S : Set X), IsPathConnected S → IsConnected S
  proof: |
    by
      intro X _ S hS
      exact hS.isConnected
- id: path_connected_continuous_image
  kind: gap
  level: 2
  topic: 弧状連結性・連続写像
  statement: 弧状連結な集合の連続写像による像は弧状連結である。
  statement_en: The image of a path-connected set under a continuous map is path-connected.
  assumptions: ["X, Yは位相空間", "SはXの弧状連結部分集合", "f:X→Yは連続"]
  quantifiers: ["任意の位相空間X, Y", "任意の部分集合S", "任意の連続写像f"]
  conclusion: f(S)は弧状連結である。
  answer: |
    f(S)の2点f(a), f(b)をa, b∈Sでとる。aとbを結ぶS内の道γをとる。f∘γは連続で、f(a)とf(b)を結ぶf(S)内の道である。
  strategy: Compose a path with f.
  sketch:
    - "setup: Take two image points f(a) and f(b) with a and b in S."
    - "derive: A path in S from a to b exists."
    - "conclude: Composing with f gives a path in f(S)."
  openmath: (forall (X Y S f) (-> (and (path_connected_in X S) (continuous_between X Y f)) (path_connected_in Y (image_of f S))))
  hard_negative:
    statement: 弧状連結な集合の閉包は弧状連結である。
    reason: 正弦曲線{(x, sin(1/x)) | x>0}は弧状連結だが、その閉包は弧状連結ではない。
  target: |
    ∀ (X Y : Type*) [TopologicalSpace X] [TopologicalSpace Y] (S : Set X) (f : X → Y), IsPathConnected S → Continuous f → IsPathConnected (f '' S)
  proof: |
    by
      intro X Y _ _ S f hS hf
      exact hS.image hf
- id: clopen_in_connected
  kind: gap
  level: 2
  topic: 連結性・開かつ閉な集合
  statement: 連結空間の空でない開かつ閉な部分集合は全体に一致する。
  statement_en: A nonempty subset of a connected space that is both open and closed is the whole space.
  assumptions: ["Xは連結空間", "Sは開かつ閉", "Sは空でない"]
  quantifiers: ["任意の位相空間X", "任意の部分集合S"]
  conclusion: S=Xである。
  answer: |
    SとS^cはともに開で、交わらず、和はXである。Xは連結なので一方は空である。Sは空でないのでS^cが空であり、S=Xとなる。
  strategy: S and its complement form an open partition of X.
  sketch:
    - "derive: S and S^c are disjoint open sets covering X."
    - "apply_theorem: Connectedness forces one of them to be empty."
    - "conclude: Since S is nonempty, S^c is empty and S = X."
  openmath: (forall (X S) (-> (and (preconnected_in X X) (open_in X S) (closed_in X S) (!= S emptyset)) (= S X)))
  hard_negative:
    statement: 連結空間の空でない開集合は全体に一致する。
    reason: ℝは連結だが(0,1)は空でない開集合で全体ではない。閉であることも必要である。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] [PreconnectedSpace X] (S : Set X), IsOpen S → IsClosed S → S.Nonempty → S = Set.univ
  proof: |
    by
      intro X _ _ S ho hc hne
      exact IsClopen.eq_univ ⟨hc, ho⟩ hne
- id: hausdorff_sequence_limit_unique
  kind: gap
  level: 2
  topic: 分離公理・極限の一意性
  statement: ハウスドルフ空間で点列の極限は高々1つである。
  statement_en: A sequence in a Hausdorff space has at most one limit.
  assumptions: ["Xはハウスドルフ空間", "aはXの点列", "aはLとMに収束する"]
  quantifiers: ["任意の位相空間X", "任意の点列a", "任意の点L, M"]
  conclusion: L=Mである。
  answer: |
    L≠Mと仮定すると、交わらない開近傍U∋L, V∋Mがある。収束より、十分大きなnでa_n∈Uかつa_n∈Vとなる。これはU∩Vが空であることに反する。
  strategy: Separate the two limits and use eventual membership.
  sketch:
    - "contradiction: Assume L ≠ M."
    - "apply_theorem: Hausdorffness gives disjoint open neighborhoods."
    - "derive: For large n the term a_n lies in both."
    - "conclude: This contradicts disjointness."
  openmath: (forall (X a L M) (-> (and (hausdorff_space X) (seq_tends_to a L) (seq_tends_to a M)) (= L M)))
  hard_negative:
    statement: 任意の位相空間で点列の極限は一意である。
    reason: 2点以上の密着位相空間では、任意の点列が任意の点に収束する。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] [T2Space X] (a : ℕ → X) (L M : X), Filter.Tendsto a Filter.atTop (nhds L) → Filter.Tendsto a Filter.atTop (nhds M) → L = M
  proof: |
    by
      intro X _ _ a L M hL hM
      exact tendsto_nhds_unique hL hM
- id: t1_iff_singleton_closed
  kind: gap
  level: 2
  topic: 分離公理・T1空間
  statement: 位相空間がT1空間であることと、すべての一点集合が閉であることは同値である。
  statement_en: A topological space is T1 if and only if every singleton is closed.
  assumptions: ["Xは位相空間"]
  quantifiers: ["任意の位相空間X"]
  conclusion: XがT1であることと、任意のxについて{x}が閉であることは同値である。
  answer: |
    T1とは異なる2点x, yに対しxを含みyを含まない開集合があることである。T1なら、任意のyに対しy≠xからyの開近傍で{x}と交わらないものがあるので{x}^cは開である。逆に{x}^cが開なら、これは異なる点yを含み、xを含まない開集合である。よって2点の役割を入れ替えてT1を得る。
  strategy: Identify the complement of a singleton with the separating open sets.
  sketch:
    - "translate: T1 means each point y ≠ x has an open neighborhood excluding x."
    - "derive: Then the complement of {x} is a union of open sets."
    - "derive: Conversely the complement of {x} itself is such a neighborhood of y."
    - "conclude: The two conditions are equivalent."
  openmath: (forall (X) (<-> (t1_space X) (forall (x) (-> (in x X) (closed_in X (singleton_set x))))))
  hard_negative:
    statement: T1空間はハウスドルフ空間である。
    reason: 無限集合上の補有限位相はT1だが、任意の2つの空でない開集合が交わるのでハウスドルフではない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X], T1Space X ↔ ∀ x : X, IsClosed ({x} : Set X)
  proof: |
    by
      intro X _
      constructor
      · intro _ x
        exact isClosed_singleton
      · intro h
        exact ⟨h⟩
- id: metric_space_normal
  kind: gap
  level: 2
  topic: 分離公理・距離空間
  statement: 距離空間は正規空間である。
  statement_en: Every metric space is normal.
  assumptions: ["Xは距離空間"]
  quantifiers: ["任意の距離空間X"]
  conclusion: Xの交わらない閉集合は交わらない開集合で分離できる。
  answer: |
    A, Bを交わらない閉集合とする。空なら明らかなので空でないとする。関数d(x,A)とd(x,B)は連続であり、閉集合なのでd(x,A)=0はx∈Aと同値である。U={x | d(x,A)<d(x,B)}とV={x | d(x,B)<d(x,A)}はともに開で交わらず、それぞれAとBを含む。
  strategy: Compare the distance functions to the two closed sets.
  sketch:
    - "setup: Take disjoint nonempty closed sets A and B."
    - "construct: Let U and V be the sets where d(x,A) < d(x,B) and d(x,B) < d(x,A)."
    - "derive: Continuity of distance makes U and V open, and they are disjoint."
    - "derive: Closedness gives A ⊆ U and B ⊆ V."
    - "conclude: X is normal."
  openmath: (forall (X) (-> (metric_space X) (normal_space X)))
  hard_negative:
    statement: ハウスドルフ空間は正規空間である。
    reason: ゾルゲンフライ平面はハウスドルフ(さらに正則)だが正規ではない。
  target: |
    ∀ (X : Type*) [MetricSpace X], NormalSpace X
  proof: |
    by
      intro X _
      infer_instance
- id: urysohn_lemma
  kind: named
  level: 3
  topic: 分離公理・ウリゾーンの補題
  statement: ウリゾーンの補題。正規空間の交わらない閉集合A, Bに対し、A上で0、B上で1、値域が[0,1]の連続関数が存在する。
  statement_en: For disjoint closed sets A and B in a normal space, there is a continuous function to [0,1] equal to 0 on A and 1 on B.
  assumptions: ["Xは正規空間", "A, BはXの閉集合", "A∩Bは空"]
  quantifiers: ["任意の位相空間X", "任意の部分集合A, B"]
  conclusion: 連続関数f:X→ℝで、f|_A=0, f|_B=1, 0≤f≤1となるものが存在する。
  answer: |
    概略を述べる。正規性を繰り返し使い、2進有理数rごとに開集合U_rをとる。ここでA⊆U_r、U_rはBと交わらず、r<sならcl(U_r)⊆U_sとなるように構成する。次にf(x)をx∈U_rとなるrの下限(なければ1)と定義する。fの連続性は包含関係cl(U_r)⊆U_sから示される。f=0がA上で、f=1がB上で成り立つ。
  strategy: Build a dyadic chain of open sets by normality and read f off the chain (outline).
  sketch:
    - "construct: Use normality to build open sets U_r indexed by dyadic rationals with cl(U_r) ⊆ U_s for r < s."
    - "setup: Arrange A ⊆ U_r and U_r disjoint from B."
    - "construct: Define f(x) as the infimum of r with x in U_r, or 1 if none."
    - "derive: The nesting of U_r gives continuity of f."
    - "conclude: f is 0 on A, 1 on B and takes values in [0,1]."
  openmath: (forall (X A B) (-> (and (normal_space X) (closed_in X A) (closed_in X B) (= (inter A B) emptyset)) (exists (f) (and (continuous_between X R f) (forall (x) (-> (in x A) (= (fn_value f x) 0))) (forall (x) (-> (in x B) (= (fn_value f x) 1))) (forall (x) (and (<= 0 (fn_value f x)) (<= (fn_value f x) 1)))))))
  hard_negative:
    statement: ハウスドルフ空間の交わらない閉集合は連続関数で分離できる。
    reason: 連続関数で分離できれば開集合で分離できるので正規性が従う。正規でないハウスドルフ空間では成り立たない。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] [NormalSpace X] (A B : Set X), IsClosed A → IsClosed B → Disjoint A B → ∃ f : X → ℝ, Continuous f ∧ (∀ x ∈ A, f x = 0) ∧ (∀ x ∈ B, f x = 1) ∧ ∀ x, 0 ≤ f x ∧ f x ≤ 1
  proof: |
    by
      intro X _ _ A B hA hB hd
      obtain ⟨f, h0, h1, h⟩ := exists_continuous_zero_one_of_isClosed hA hB hd
      exact ⟨f, f.continuous, fun x hx => h0 hx, fun x hx => h1 hx, fun x => h x⟩
- id: tietze_extension
  kind: named
  level: 3
  topic: 分離公理・ティーツェの拡張定理
  statement: ティーツェの拡張定理。正規空間の閉集合C上の連続な実数値関数は、空間全体の連続関数に拡張できる。
  statement_en: A continuous real-valued function on a closed subset of a normal space extends to a continuous function on the whole space.
  assumptions: ["Xは正規空間", "CはXの閉集合", "f:C→ℝは連続"]
  quantifiers: ["任意の位相空間X", "任意の部分集合C", "任意の連続関数f"]
  conclusion: 連続関数g:X→ℝでC上f=gとなるものが存在する。
  answer: |
    概略を述べる。まず|f|≤1の場合を扱う。{f≤-1/3}と{f≥1/3}にウリゾーンの補題を適用すると、|g_1|≤1/3で|f-g_1|≤2/3をC上で満たす連続関数g_1がX上に得られる。これを繰り返すと、一様収束する級数Σg_nが得られ、その和が拡張になる。非有界な場合は、ℝと(-1,1)の同相で有界な場合に帰着する。
  strategy: Approximate by Urysohn functions and sum a uniformly convergent series (outline).
  sketch:
    - "setup: Reduce to a bounded function with |f| ≤ 1."
    - "apply_theorem: Urysohn's lemma on {f ≤ -1/3} and {f ≥ 1/3} gives a first approximation g_1."
    - "induction: Repeat on the remainder, shrinking by 2/3 at each step."
    - "derive: The series of approximations converges uniformly to a continuous function."
    - "conclude: Its sum extends f; the unbounded case follows through a homeomorphism of ℝ with (-1,1)."
  openmath: (forall (X C f) (-> (and (normal_space X) (closed_in X C) (continuous_between (subspace_topology_on X C) R f)) (exists (g) (and (continuous_between X R g) (forall (x) (-> (in x C) (= (fn_value g x) (fn_value f x))))))))
  hard_negative:
    statement: 正規空間の任意の部分集合上の連続な実数値関数は全体に拡張できる。
    reason: 開区間(0,1)⊂ℝ上の1/xは連続だが、ℝ上の連続関数に拡張できない。閉集合の仮定が必要である。
  target: |
    ∀ (X : Type*) [TopologicalSpace X] [NormalSpace X] (C : Set X) (f : C → ℝ), IsClosed C → Continuous f → ∃ g : X → ℝ, Continuous g ∧ ∀ x : C, g x = f x
  proof: |
    by
      intro X _ _ C f hC hf
      obtain ⟨g, hg⟩ := ContinuousMap.exists_restrict_eq hC (⟨f, hf⟩ : C(C, ℝ))
      exact ⟨g, g.continuous, fun x => DFunLike.congr_fun hg x⟩
- id: metric_balls_open_closed
  kind: gap
  level: 2
  topic: 距離空間・開球と閉球
  statement: 距離空間で開球は開集合であり、閉球は閉集合である。
  statement_en: In a metric space, open balls are open and closed balls are closed.
  assumptions: ["Xは距離空間", "xはXの点", "rは実数"]
  quantifiers: ["任意の距離空間X", "任意の点x", "任意の実数r"]
  conclusion: B(x,r)は開集合であり、閉球は閉集合である。
  answer: |
    y∈B(x,r)とし、s=r-d(x,y)>0とおく。三角不等式よりB(y,s)⊆B(x,r)なので開球は開である。閉球の補集合の点yについてs=d(x,y)-r>0とおくと、B(y,s)は閉球と交わらない。よって閉球は閉である。
  strategy: Use the triangle inequality with the margin r - d(x,y).
  sketch:
    - "setup: Take y in the ball and let s = r - d(x,y)."
    - "derive: The triangle inequality gives B(y,s) ⊆ B(x,r)."
    - "derive: For y outside the closed ball, s = d(x,y) - r gives a ball missing it."
    - "conclude: Open balls are open and closed balls are closed."
  openmath: (forall (X x r) (-> (metric_space X) (and (open_in X (open_ball x r)) (closed_in X (closed_ball x r)))))
  hard_negative:
    statement: 開球の閉包は常に同じ中心と半径の閉球に等しい。
    reason: 2点以上の離散距離空間でB(x,1)={x}の閉包は{x}だが、閉球は全体である。
  target: |
    ∀ (X : Type*) [MetricSpace X] (x : X) (r : ℝ), IsOpen (Metric.ball x r) ∧ IsClosed (Metric.closedBall x r)
  proof: |
    by
      intro X _ x r
      exact ⟨Metric.isOpen_ball, Metric.isClosed_closedBall⟩
- id: cauchy_convergent_subsequence
  kind: gap
  level: 2
  topic: 距離空間・コーシー列
  statement: コーシー列が収束する部分列をもつならば、もとの点列も同じ極限に収束する。
  statement_en: A Cauchy sequence with a convergent subsequence converges to the same limit.
  assumptions: ["Xは距離空間", "aはコーシー列", "φは狭義単調増加", "a∘φはLに収束する"]
  quantifiers: ["任意の距離空間X", "任意の点列a", "任意の部分列φ", "任意の点L"]
  conclusion: aはLに収束する。
  answer: |
    ε>0をとる。コーシー性からNがあり、m, n≥Nでd(a_m,a_n)<ε/2となる。部分列の収束から、φ(k)≥Nかつd(a_{φ(k)},L)<ε/2となるkがとれる。n≥Nなら三角不等式よりd(a_n,L)≤d(a_n,a_{φ(k)})+d(a_{φ(k)},L)<εである。
  strategy: Combine Cauchy estimates with one far term of the subsequence.
  sketch:
    - "setup: Fix ε > 0 and N from the Cauchy condition at ε/2."
    - "derive: Choose k with φ(k) ≥ N and a_{φ(k)} within ε/2 of L."
    - "conclude: The triangle inequality gives d(a_n, L) < ε for n ≥ N."
  openmath: (forall (X a p L) (-> (and (metric_space X) (cauchy_seq X a) (strictly_increasing_index p) (seq_tends_to (function_compose_map a p) L)) (seq_tends_to a L)))
  hard_negative:
    statement: 収束する部分列をもつ点列は収束する。
    reason: (-1)^nは定数の部分列をもつが収束しない。コーシー性が必要である。
  target: |
    ∀ (X : Type*) [MetricSpace X] (a : ℕ → X) (φ : ℕ → ℕ) (L : X), CauchySeq a → StrictMono φ → Filter.Tendsto (a ∘ φ) Filter.atTop (nhds L) → Filter.Tendsto a Filter.atTop (nhds L)
  proof: |
    by
      intro X _ a φ L ha hφ hL
      exact tendsto_nhds_of_cauchySeq_of_subseq ha hφ.tendsto_atTop hL
- id: closed_subset_of_complete
  kind: textbook
  level: 2
  topic: 距離空間・完備性
  statement: 完備距離空間の閉部分集合は、部分空間として完備である。
  statement_en: A closed subset of a complete metric space is complete as a subspace.
  assumptions: ["Xは完備距離空間", "CはXの閉集合"]
  quantifiers: ["任意の距離空間X", "任意の部分集合C"]
  conclusion: 部分空間Cは完備である。
  answer: |
    C内のコーシー列a_nをとる。Xで距離は同じなので、これはXのコーシー列であり、Xの完備性からある点Lに収束する。Cは閉であり全項がCに属するので、L∈Cである。よってa_nはCで収束する。
  strategy: Take the limit in X and use closedness to stay in C.
  sketch:
    - "setup: Take a Cauchy sequence in C."
    - "derive: It is Cauchy in X, so it converges in X by completeness."
    - "derive: Closedness of C puts the limit in C."
    - "conclude: The subspace C is complete."
  openmath: (forall (X C) (-> (and (complete_space X) (closed_in X C)) (complete_space (subspace_topology_on X C))))
  hard_negative:
    statement: 完備距離空間の任意の部分空間は完備である。
    reason: ℝの部分空間(0,1)では1/(n+2)がコーシー列だが極限を含まない。
  target: |
    ∀ (X : Type*) [MetricSpace X] [CompleteSpace X] (C : Set X), IsClosed C → CompleteSpace C
  proof: |
    by
      intro X _ _ C hC
      exact hC.completeSpace_coe
- id: complete_subset_is_closed
  kind: gap
  level: 2
  topic: 距離空間・完備性
  statement: 距離空間の完備な部分集合は閉集合である。
  statement_en: A complete subset of a metric space is closed.
  assumptions: ["Xは距離空間", "SはXの完備な部分集合"]
  quantifiers: ["任意の距離空間X", "任意の部分集合S"]
  conclusion: SはXの閉集合である。
  answer: |
    S内の点列a_nがL∈Xに収束するとする。収束列なのでコーシー列であり、Sの完備性からa_nはSのある点L'に収束する。極限の一意性よりL=L'∈Sである。距離空間では、これはSが閉であることを意味する。
  strategy: Use the limit in S and uniqueness of limits.
  sketch:
    - "setup: Take a sequence in S converging to L in X."
    - "derive: The sequence is Cauchy, so it converges to some L' in S."
    - "apply_theorem: Limits in a metric space are unique, so L = L'."
    - "conclude: S contains the limits of its sequences, so it is closed."
  openmath: (forall (X S) (-> (and (metric_space X) (complete_subset X S)) (closed_in X S)))
  hard_negative:
    statement: 距離空間の閉部分集合は完備である。
    reason: 空間自身は閉だが、ℚは完備ではない。全体が完備という仮定が必要である。
  target: |
    ∀ (X : Type*) [MetricSpace X] (S : Set X), IsComplete S → IsClosed S
  proof: |
    by
      intro X _ S hS
      exact hS.isClosed
- id: uniform_limit_continuous
  kind: gap
  level: 2
  topic: 距離空間・一様収束
  statement: 位相空間から距離空間への連続写像の列が一様収束するとき、極限写像は連続である。
  statement_en: A uniform limit of continuous maps from a topological space into a metric space is continuous.
  assumptions: ["Xは位相空間", "Yは距離空間", "各F_nは連続", "F_nはfに一様収束する"]
  quantifiers: ["任意の位相空間X", "任意の距離空間Y", "任意の写像列F", "任意の写像f"]
  conclusion: fは連続である。
  answer: |
    a∈Xとε>0をとる。一様収束より、nが存在して全てのxでd(F_n(x),f(x))<ε/3となる。F_nの連続性より、aの近傍Uでx∈Uならd(F_n(x),F_n(a))<ε/3となる。三角不等式より、x∈Uでd(f(x),f(a))<εである。
  strategy: The ε/3 argument.
  sketch:
    - "setup: Fix a point a and ε > 0."
    - "derive: Choose n with F_n uniformly within ε/3 of f."
    - "derive: Continuity of F_n gives a neighborhood of a with variation below ε/3."
    - "conclude: The triangle inequality gives d(f(x), f(a)) < ε on it."
  openmath: (forall (X Y F f) (-> (and (metric_space Y) (forall (n) (continuous_between X Y (seq_value F n))) (tends_uniformly F f)) (continuous_between X Y f)))
  hard_negative:
    statement: 連続関数列が各点収束すれば、極限関数は連続である。
    reason: 閉区間[0,1]上のx^nの各点極限はx=1でのみ1で、連続ではない。
  target: |
    ∀ (X Y : Type*) [TopologicalSpace X] [MetricSpace Y] (F : ℕ → X → Y) (f : X → Y), (∀ n, Continuous (F n)) → TendstoUniformly F f Filter.atTop → Continuous f
  proof: |
    by
      intro X Y _ _ F f hF h
      exact h.continuous (Filter.Frequently.of_forall hF)
- id: banach_fixed_point
  kind: named
  level: 3
  topic: 完備距離空間・バナッハの不動点定理
  statement: バナッハの不動点定理。空でない完備距離空間上の縮小写像はただ1つの不動点をもち、任意の点からの反復列はその不動点に収束する。
  statement_en: A contraction on a nonempty complete metric space has a unique fixed point, and every iteration sequence converges to it.
  assumptions: ["Xは空でない完備距離空間", "0≤K<1", "任意のx, yについてd(f(x),f(y))≤K d(x,y)"]
  quantifiers: ["任意の距離空間X", "任意の写像f", "任意の実数K"]
  conclusion: f(x)=xとなる点xがただ1つ存在し、任意のzについてf^n(z)はxに収束する。
  answer: |
    点zをとり、a_n=f^n(z)とおく。d(a_{n+1},a_n)≤K^n d(a_1,a_0)と等比級数の評価からa_nはコーシー列であり、完備性より点xに収束する。fは連続なので、f(x)=lim f(a_n)=xである。f(y)=yならd(x,y)=d(f(x),f(y))≤K d(x,y)でK<1なのでx=yとなる。zは任意であり、不動点は一意なので、全ての反復列は同じxに収束する。
  strategy: Show iterates are Cauchy by a geometric estimate; contraction gives uniqueness.
  sketch:
    - "construct: Fix z and define the iterates a_n = f^n(z)."
    - "derive: d(a_{n+1}, a_n) ≤ K^n d(a_1, a_0) makes the sequence Cauchy."
    - "apply_theorem: Completeness gives a limit x."
    - "derive: Continuity of f gives f(x) = x."
    - "derive: Two fixed points satisfy d(x,y) ≤ K d(x,y), so x = y."
    - "conclude: Iteration from any point converges to the unique fixed point."
  openmath: (forall (X f K) (-> (and (complete_space X) (!= X emptyset) (<= 0 K) (< K 1) (forall (x y) (<= (dist_of (fn_value f x) (fn_value f y)) (* K (dist_of x y))))) (exists (p) (and (= (fn_value f p) p) (forall (q) (-> (= (fn_value f q) q) (= q p))) (forall (z) (seq_tends_to (iterate_sequence f z) p))))))
  hard_negative:
    statement: 完備距離空間上で、任意のx≠yについてd(f(x),f(y))<d(x,y)を満たす写像は不動点をもつ。
    reason: 区間[1,∞)上のf(x)=x+1/xはこの条件を満たすが不動点をもたない。一様なK<1が必要である。
  target: |
    ∀ (X : Type*) [MetricSpace X] [CompleteSpace X] [Nonempty X] (f : X → X) (K : ℝ), 0 ≤ K → K < 1 → (∀ x y, dist (f x) (f y) ≤ K * dist x y) → ∃ p, f p = p ∧ (∀ q, f q = q → q = p) ∧ ∀ z, Filter.Tendsto (fun n => f^[n] z) Filter.atTop (nhds p)
  proof: |
    by
      intro X _ _ _ f K hK0 hK1 h
      let K' : NNReal := ⟨K, hK0⟩
      have hlt : K' < 1 := by
        rw [← NNReal.coe_lt_coe]
        exact hK1
      have hc : ContractingWith K' f := ⟨hlt, LipschitzWith.of_dist_le_mul (fun x y => h x y)⟩
      exact ⟨ContractingWith.fixedPoint f hc, hc.fixedPoint_isFixedPt, fun q hq => hc.fixedPoint_unique hq, fun z => hc.tendsto_iterate_fixedPoint z⟩
- id: baire_category_theorem
  kind: named
  level: 3
  topic: 完備距離空間・ベールの範疇定理
  statement: ベールの範疇定理。完備距離空間で可算個の稠密な開集合の共通部分は稠密である。
  statement_en: In a complete metric space, a countable intersection of dense open sets is dense.
  assumptions: ["Xは完備距離空間", "各U_nは開かつ稠密"]
  quantifiers: ["任意の距離空間X", "任意の開集合列U"]
  conclusion: ⋂_n U_nはXで稠密である。
  answer: |
    空でない開集合Vをとる。U_0の稠密性から閉球B_0⊆V∩U_0をとり、順にB_{n+1}⊆int(B_n)∩U_{n+1}で半径が1/(n+2)未満の閉球をとる。中心の列はコーシー列であり、完備性より収束する。その極限は全てのB_nに属するので、V∩⋂_n U_nに属する。よって共通部分は稠密である。
  strategy: Build nested closed balls with radii shrinking to zero.
  sketch:
    - "setup: Fix a nonempty open set V."
    - "construct: Choose nested closed balls B_n with B_n ⊆ U_n and radii tending to 0."
    - "derive: The centers form a Cauchy sequence."
    - "apply_theorem: Completeness gives a limit point."
    - "derive: The limit lies in every B_n, so in V and every U_n."
    - "conclude: The intersection meets every nonempty open set."
  openmath: (forall (X U) (-> (and (complete_space X) (forall (n) (and (open_in X (seq_value U n)) (dense_in X (seq_value U n))))) (dense_in X (family_inter N U))))
  hard_negative:
    statement: 完備距離空間で非可算個の稠密な開集合の共通部分は稠密である。
    reason: ℝで全ての点xについてℝ\{x}は稠密な開集合だが、その共通部分は空である。
  target: |
    ∀ (X : Type*) [MetricSpace X] [CompleteSpace X] (U : ℕ → Set X), (∀ n, IsOpen (U n)) → (∀ n, Dense (U n)) → Dense (⋂ n, U n)
  proof: |
    by
      intro X _ _ U hU hd
      exact dense_iInter_of_isOpen_nat hU hd
- id: baire_closed_cover_interior
  kind: gap
  level: 3
  topic: 完備距離空間・ベールの範疇定理の応用
  statement: 空でない完備距離空間が可算個の閉集合の和で表されるならば、そのうちの1つは空でない内部をもつ。
  statement_en: If a nonempty complete metric space is a countable union of closed sets, then one of them has nonempty interior.
  assumptions: ["Xは空でない完備距離空間", "各C_nは閉", "⋃_n C_n=X"]
  quantifiers: ["任意の距離空間X", "任意の閉集合列C"]
  conclusion: あるnについてC_nの内部は空でない。
  answer: |
    全てのC_nの内部が空と仮定する。このとき補集合C_n^cは開かつ稠密である。ベールの範疇定理より、それらの共通部分は稠密であり、Xが空でないので空でない。しかしその共通部分は⋃C_nの補集合であり空である。これは矛盾である。
  strategy: Apply Baire to the complements.
  sketch:
    - "contradiction: Assume every C_n has empty interior."
    - "derive: The complements are open and dense."
    - "apply_theorem: The Baire category theorem makes their intersection dense."
    - "conclude: A dense subset of a nonempty space is nonempty, contradicting the cover."
  openmath: (forall (X C) (-> (and (complete_space X) (!= X emptyset) (forall (n) (closed_in X (seq_value C n))) (= (family_union N C) X)) (exists (n) (!= (interior_in X (seq_value C n)) emptyset))))
  hard_negative:
    statement: 任意の距離空間が可算個の閉集合の和なら、そのうちの1つは空でない内部をもつ。
    reason: ℚは一点集合の可算和だが、各一点集合の内部は空である。完備性が必要である。
  target: |
    ∀ (X : Type*) [MetricSpace X] [CompleteSpace X] [Nonempty X] (C : ℕ → Set X), (∀ n, IsClosed (C n)) → ⋃ n, C n = Set.univ → ∃ n, (interior (C n)).Nonempty
  proof: |
    by
      intro X _ _ _ C hC hU
      exact nonempty_interior_of_iUnion_of_closed hC hU
- id: metric_totally_bounded_iff
  kind: gap
  level: 3
  topic: 距離空間・全有界性
  statement: 距離空間の部分集合が全有界であることと、任意のε>0について半径εの開球有限個で覆えることは同値である。
  statement_en: A subset of a metric space is totally bounded if and only if for every ε > 0 it is covered by finitely many open balls of radius ε.
  assumptions: ["Xは距離空間", "SはXの部分集合"]
  quantifiers: ["任意の距離空間X", "任意の部分集合S"]
  conclusion: Sの全有界性と、有限のε網の存在は同値である。
  answer: |
    距離空間の一様構造は集合{(x,y) | d(x,y)<ε}で生成される。全有界性は、一様構造の各要素の大きさで有限個の被覆が存在することと定義される。この定義をε近縁で読むと、半径εの開球による有限被覆そのものになる。よって2つの条件は同値である。
  strategy: Read the uniform definition of total boundedness on the distance basis.
  sketch:
    - "translate: The uniformity of a metric space has basis the sets d(x,y) < ε."
    - "derive: Covers at each entourage scale correspond to covers by ε-balls."
    - "conclude: Total boundedness is equivalent to finite ε-nets."
  openmath: (forall (X S) (-> (metric_space X) (<-> (totally_bounded_in X S) (forall (e) (-> (> e 0) (exists (t) (and (finite_set t) (forall (y) (-> (in y S) (exists (c) (and (in c t) (< (dist_of y c) e))))))))))))
  hard_negative:
    statement: 距離空間の有界な部分集合は全有界である。
    reason: 無限集合上の離散距離は有界だが、半径1/2の開球有限個では覆えない。
  target: |
    ∀ (X : Type*) [MetricSpace X] (S : Set X), TotallyBounded S ↔ ∀ ε : ℝ, 0 < ε → ∃ t : Set X, t.Finite ∧ S ⊆ ⋃ y ∈ t, Metric.ball y ε
  proof: |
    by
      intro X _ S
      exact Metric.totallyBounded_iff
- id: compact_iff_totally_bounded_complete
  kind: textbook
  level: 3
  topic: 距離空間・コンパクト性の特徴付け
  statement: 距離空間の部分集合がコンパクトであることと、全有界かつ完備であることは同値である。
  statement_en: A subset of a metric space is compact if and only if it is totally bounded and complete.
  assumptions: ["Xは距離空間", "KはXの部分集合"]
  quantifiers: ["任意の距離空間X", "任意の部分集合K"]
  conclusion: Kのコンパクト性と、Kが全有界かつ完備であることは同値である。
  answer: |
    Kがコンパクトなら、半径εの球の開被覆の有限部分被覆から全有界である。またK内のコーシー列は点列コンパクト性より収束部分列をもち、コーシー列なのでその極限に収束するから、Kは完備である。逆にKが全有界かつ完備とする。K内の点列について、有限被覆を半径1/kごとに使って対角線論法を行うと、コーシーな部分列がとれる。完備性よりこれは収束するので、Kは点列コンパクトであり、距離空間なのでコンパクトである。
  strategy: Forward via covers and sequential compactness; backward by a diagonal Cauchy subsequence.
  sketch:
    - "derive: A finite subcover of ε-balls shows total boundedness."
    - "derive: A Cauchy sequence has a convergent subsequence, so it converges in K."
    - "construct: Conversely use finite 1/k-covers and a diagonal argument to extract a Cauchy subsequence."
    - "apply_theorem: Completeness gives its limit in K."
    - "conclude: K is sequentially compact, hence compact in a metric space."
  openmath: (forall (X K) (-> (metric_space X) (<-> (compact_in X K) (and (totally_bounded_in X K) (complete_subset X K)))))
  hard_negative:
    statement: 距離空間の有界かつ完備な部分集合はコンパクトである。
    reason: 無限集合上の離散距離空間は有界かつ完備だがコンパクトではない。全有界性が必要である。
  target: |
    ∀ (X : Type*) [MetricSpace X] (K : Set X), IsCompact K ↔ TotallyBounded K ∧ IsComplete K
  proof: |
    by
      intro X _ K
      exact isCompact_iff_totallyBounded_isComplete
