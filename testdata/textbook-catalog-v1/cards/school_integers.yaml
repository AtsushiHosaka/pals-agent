  - 'conclude: a² = 8s + 1.'
  openmath: (forall (a) (-> (and (in a Z) (exists (k) (and (in k Z) (= a (+ (* 2 k) 1))))) (exists (s) (and (in s Z) (= (^ a 2) (+ (* 8 s) 1))))))
  hard_negative:
    statement: 整数$a$について、$a^2$を$8$で割った余りは$0$か$1$である。
    reason: 偶数を含めると成り立たない。$a=2$では$a^2=4$であり、余りは$4$である。
  target: |
    ∀ (a : ℤ), Odd a → a ^ 2 % 8 = 1
  proof: |
