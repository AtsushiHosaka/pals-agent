- id: three_dvd_sum_of_squares
  kind: gap
  level: high
  topic: 整数の性質・平方数の和と3の倍数
  statement: 整数$a,b$について、$a^2+b^2$が$3$の倍数ならば、$a,b$はともに$3$の倍数である。
  statement_en: If integers a and b are such that a² + b² is divisible by 3, then both a and b are divisible by 3.
  assumptions:
  - $a,b$は整数
  - $a^2+b^2$は$3$の倍数
  quantifiers:
  - 任意の整数$a,b$
  conclusion: $a,b$はともに$3$の倍数である。
  answer: |
    $a,b$を整数とし、$a^2+b^2$は$3$の倍数とする。整数$z$について、$z=3k$なら$z^2$の余りは$0$であり、$z=3k\pm 1$なら$z^2=3(3k^2\pm 2k)+1$の余りは$1$である。
    $a$が$3$の倍数でないとすると$a^2$の余りは$1$であり、$b^2$の余りは$0$か$1$なので、$a^2+b^2$の余りは$1$か$2$となって仮定に反する。よって$a$は$3$の倍数である。$b$についても同様である。
  strategy: Compare squares modulo 3 in each case.
  sketch:
  - 'derive: A square leaves remainder 0 exactly for multiples of 3 and remainder 1 otherwise.'
  - 'contradiction: If a is not a multiple of 3 the sum leaves remainder 1 or 2.'
  - 'conclude: The same argument applies to b.'
  openmath: (forall (a b) (-> (and (in a Z) (in b Z) (exists (k) (and (in k Z) (= (+ (^ a 2) (^ b 2)) (* 3 k))))) (and (exists (s) (and (in s Z) (= a (* 3 s)))) (exists (t) (and (in t Z) (= b (* 3 t)))))))
  hard_negative:
    statement: 整数$a,b$について、$a^2+b^2$が$5$の倍数ならば、$a,b$はともに$5$の倍数である。
    reason: $a=1,\ b=2$では$a^2+b^2=5$だが、$a,b$は$5$の倍数でない。$5$を法とすると$-1$が平方数の余りになるためである。
  target: |
    ∀ (a b : ℤ), (3 : ℤ) ∣ a ^ 2 + b ^ 2 → (3 : ℤ) ∣ a ∧ (3 : ℤ) ∣ b
  proof: |
    by
      intro a b h
      have key : ∀ z : ℤ, (z % 3 = 0 ∧ z ^ 2 % 3 = 0) ∨ (z % 3 ≠ 0 ∧ z ^ 2 % 3 = 1) := by
        intro z
        have hz : z % 3 = 0 ∨ z % 3 = 1 ∨ z % 3 = 2 := by omega
        rcases hz with hz | hz | hz
        · left
          exact ⟨hz, by simp [pow_two, Int.mul_emod, hz]⟩
        · right
          exact ⟨by omega, by simp [pow_two, Int.mul_emod, hz]⟩
        · right
          exact ⟨by omega, by simp [pow_two, Int.mul_emod, hz]⟩
      have ha := key a
      have hb := key b
      omega
- id: no_square_between_consecutive_squares
  kind: gap
  level: high
  topic: 整数の性質・隣り合う平方数
  statement: $0$以上の整数$m,n$について、$m^2<n<(m+1)^2$ならば、$n$は平方数でない。
  statement_en: For natural numbers m and n, if m² < n < (m + 1)², then n is not a perfect square.
  assumptions:
  - $m,n$は$0$以上の整数
  - $m^2<n<(m+1)^2$
  quantifiers:
  - 任意の$0$以上の整数$m,n$
  conclusion: $n$は平方数でない。
  answer: |
    $m,n$を$0$以上の整数とし、$m^2<n<(m+1)^2$とする。$n=k^2$となる$0$以上の整数$k$があると仮定する。$0$以上の数では平方の大小と元の数の大小が一致するので、$m^2<k^2$から$m<k$、$k^2<(m+1)^2$から$k<m+1$を得る。$m<k<m+1$を満たす整数$k$はないので矛盾である。
  strategy: Compare square roots using monotonicity of squaring.
  sketch:
  - 'setup: Assume n = k².'
  - 'derive: Monotonicity gives m < k < m + 1.'
  - 'contradiction: No integer lies strictly between m and m + 1.'
  openmath: (forall (m n) (-> (and (in m N) (in n N) (< (^ m 2) n) (< n (^ (+ m 1) 2))) (not (exists (k) (and (in k N) (= n (^ k 2)))))))
  hard_negative:
    statement: $m^2\leq n\leq(m+1)^2$ならば、$n$は平方数でない。
    reason: 端点を含むと成り立たない。$n=m^2$は平方数である。
  target: |
    ∀ (m n : ℕ), m ^ 2 < n → n < (m + 1) ^ 2 → ¬ ∃ k : ℕ, n = k ^ 2
  proof: |
    by
      rintro m n h1 h2 ⟨k, rfl⟩
      have h3 : m < k := lt_of_pow_lt_pow_left₀ 2 (Nat.zero_le k) h1
      have h4 : k < m + 1 := lt_of_pow_lt_pow_left₀ 2 (Nat.zero_le _) h2
      omega
- id: coprime_mul_eq_square
  kind: gap
  level: high
  topic: 整数の性質・互いに素な積と平方数
  statement: 互いに素な$0$以上の整数$a,b$の積が平方数$c^2$であるならば、$a,b$はともに平方数である。
  statement_en: If coprime natural numbers a and b satisfy ab = c² for a natural number c, then a and b are both perfect squares.
  assumptions:
  - $a,b,c$は$0$以上の整数
  - $\gcd(a,b)=1$
  - $ab=c^2$
  quantifiers:
  - 任意の$0$以上の整数$a,b,c$
  conclusion: $a=s^2,\ b=t^2$となる$0$以上の整数$s,t$が存在する。
  answer: |
    $a,b,c$を$0$以上の整数とし、$\gcd(a,b)=1,\ ab=c^2$とする。$a=0$ならば$\gcd(0,b)=b=1$なので$a=0^2,\ b=1^2$である。$b=0$の場合も同様である。
    $a,b$がともに正のとき、素数$p$が$a$を割り切るとする。$\gcd(a,b)=1$なので$p$は$b$を割り切らない。よって$a$における$p$の指数は$ab=c^2$における指数に等しく、これは偶数である。$a$のすべての素因数の指数が偶数なので$a$は平方数である。$b$についても同様である。
  strategy: Compare prime exponents, using that a prime divides only one of a and b.
  sketch:
  - 'case_split: If a = 0 then b = 1, and symmetrically.'
  - 'derive: A prime dividing a does not divide b.'
  - 'derive: Its exponent in a equals its exponent in c², which is even.'
  - 'conclude: All exponents in a and b are even, so both are squares.'
  openmath: (forall (a b c) (-> (and (in a N) (in b N) (in c N) (= (gcd a b) 1) (= (* a b) (^ c 2))) (and (exists (s) (and (in s N) (= a (^ s 2)))) (exists (t) (and (in t N) (= b (^ t 2)))))))
  hard_negative:
    statement: $0$以上の整数$a,b$の積が平方数ならば、$a,b$はともに平方数である。
    reason: 互いに素の仮定を外すと成り立たない。$a=2,\ b=8$では$ab=16$だが、$2$は平方数でない。
  target: |
    ∀ (a b c : ℕ), Nat.Coprime a b → a * b = c ^ 2 → (∃ s : ℕ, a = s ^ 2) ∧ (∃ t : ℕ, b = t ^ 2)
  proof: |
    by
      intro a b c h habc
      have h2 : b * a = c ^ 2 := by rw [Nat.mul_comm]; exact habc
      have hu : IsUnit (gcd a b) := by
        rw [gcd_eq_nat_gcd, Nat.isUnit_iff]
        exact h
      have hu2 : IsUnit (gcd b a) := by
        rw [gcd_eq_nat_gcd, Nat.isUnit_iff]
        exact h.symm
      obtain ⟨s, hs⟩ := exists_eq_pow_of_mul_eq_pow hu habc
      obtain ⟨t, ht⟩ := exists_eq_pow_of_mul_eq_pow hu2 h2
      exact ⟨⟨s, hs⟩, ⟨t, ht⟩⟩
- id: prime_three_mod_four_dvd_sum_of_squares
  kind: gap
  level: high
  topic: 整数の性質・平方数の和と素数
  statement: $4$で割って$3$余る素数$p$と整数$a,b$について、$p$が$a^2+b^2$を割り切るならば、$p$は$a$と$b$の両方を割り切る。
  statement_en: For a prime p with p ≡ 3 mod 4 and integers a, b, if p divides a^2 + b^2 then p divides both a and b.
  assumptions:
  - $p$は$4$で割って$3$余る素数
  - $a,b$は整数
  - $p$は$a^2+b^2$を割り切る
  quantifiers:
  - 任意の$4$で割って$3$余る素数$p$
  - 任意の整数$a,b$
  conclusion: $p$は$a$と$b$の両方を割り切る。
  answer: |
    $p$を$4$で割って$3$余る素数、$a,b$を整数とし、$a^2+b^2\equiv 0\pmod p$とする。
    $p$が$b$を割り切らないと仮定する。$bc\equiv 1\pmod p$となる整数$c$をとり、$t=ac$とおくと、$a^2\equiv -b^2$の両辺に$c^2$を掛けて$t^2\equiv -1\pmod p$である。特に$p$は$t$を割り切らない。
    $p=4k+3$とおくと$\dfrac{p-1}{2}=2k+1$は奇数である。よって$t^{p-1}=(t^2)^{2k+1}\equiv(-1)^{2k+1}=-1\pmod p$である。一方、フェルマーの小定理より$t^{p-1}\equiv 1\pmod p$である。したがって$p$は$2$を割り切るが、$p\geq 3$なので矛盾する。
    ゆえに$p$は$b$を割り切る。すると$p$は$a^2$を割り切り、$p$は素数なので$a$を割り切る。
  strategy: If p does not divide b, then -1 is a square mod p, which contradicts Fermat since (p-1)/2 is odd.
  sketch:
  - "setup: Assume p ≡ 3 mod 4 divides a^2 + b^2."
  - "contradiction: If p does not divide b, some t satisfies t^2 ≡ -1 mod p."
  - "derive: Since (p-1)/2 is odd, t^(p-1) ≡ -1, contradicting Fermat."
  - "conclude: So p divides b, then a^2, then a."
  openmath: (forall (p a b) (-> (and (in p P) (in a Z) (in b Z) (exists (q) (and (in q N) (= p (+ (* 4 q) 3)))) (exists (k) (and (in k Z) (= (+ (^ a 2) (^ b 2)) (* p k))))) (and (exists (s) (and (in s Z) (= a (* p s)))) (exists (t) (and (in t Z) (= b (* p t)))))))
  hard_negative:
    statement: 奇素数$p$と整数$a,b$について、$p$が$a^2+b^2$を割り切るならば、$p$は$a$と$b$の両方を割り切る。
    reason: $p=5$、$a=1$、$b=2$のとき$p$は$a^2+b^2=5$を割り切るが$a$を割り切らない。$p$を$4$で割った余りの条件が要る。
  target: |
    ∀ (p : ℕ) (a b : ℤ), p.Prime → p % 4 = 3 → (p : ℤ) ∣ a ^ 2 + b ^ 2 → (p : ℤ) ∣ a ∧ (p : ℤ) ∣ b
  proof: |
    by
      intro p a b hp h4 hd
      haveI : Fact p.Prime := ⟨hp⟩
      have hz : ((a : ZMod p)) ^ 2 + (b : ZMod p) ^ 2 = 0 := by
        have := (ZMod.intCast_zmod_eq_zero_iff_dvd (a ^ 2 + b ^ 2) p).2 hd
        simpa using this
      have hb : (b : ZMod p) = 0 := by
        by_contra hb
        exact ZMod.mod_four_ne_three_of_sq_eq_neg_sq' hb (eq_neg_of_add_eq_zero_left hz) h4
      have ha : (a : ZMod p) = 0 := by
        rw [hb] at hz
        simpa using hz
      exact ⟨(ZMod.intCast_zmod_eq_zero_iff_dvd a p).1 ha, (ZMod.intCast_zmod_eq_zero_iff_dvd b p).1 hb⟩
