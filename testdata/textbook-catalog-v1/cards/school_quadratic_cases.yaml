- id: tangent_line_difference_and_unique_contact
  kind: gap
  level: high
  topic: 放物線と接線・差の式
  statement: $f(x)=ax^2+bx+c$の$x=p$における接線を$L(x)=f(p)+(2ap+b)(x-p)$とすると、$f(x)-L(x)=a(x-p)^2$である。特に$a\neq 0$のとき、$f(x)=L(x)$は$x=p$と同値である。
