  - "conclude: The other two follow by negation."
  openmath: (forall (a p q x) (-> (and (< a 0) (< p q)) (and (<-> (> (* a (- x p) (- x q)) 0) (and (< p x) (< x q))) (<-> (>= (* a (- x p) (- x q)) 0) (and (<= p x) (<= x q))) (<-> (< (* a (- x p) (- x q)) 0) (or (< x p) (< q x))) (<-> (<= (* a (- x p) (- x q)) 0) (or (<= x p) (<= q x))))))
