  level: high
  topic: 二次不等式・常に正（文字係数）
  statement: 実数$a,b,c$について、すべての実数$x$で$ax^2+bx+c>0$であることは、「$a=b=0$かつ$c>0$」または「$a>0$かつ$b^2-4ac<0$」と同値である。ここで$a=0$の場合も含む。
