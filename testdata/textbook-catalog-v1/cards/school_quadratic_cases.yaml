  statement: $a\neq 0$のとき、すべての実数$x$で$ax^2+bx+c<0$であることは$a<0$かつ$b^2-4ac<0$と同値であり、すべての実数$x$で$ax^2+bx+c\leq 0$であることは$a<0$かつ$b^2-4ac\leq 0$と同値である。
