- id: both_roots_greater_than_iff_any_leading
  kind: textbook
  level: high
  topic: 二次方程式・解の配置（係数の符号によらない形）
  statement: $a\neq 0$のとき、すべての実数$x$で$ax^2+bx+c=a(x-p)(x-q)$となる実数$p,q$で、ともに$k$より大きいものが存在することは、$b^2-4ac\geq 0$、$k<-\dfrac{b}{2a}$、$a(ak^2+bk+c)>0$がすべて成り立つことと同値である。
  statement_en: "For a ≠ 0: real p, q > k with ax²+bx+c = a(x−p)(x−q) for all x exist if and only if b²−4ac ≥ 0, k < −b/(2a) and a(ak²+bk+c) > 0."
  assumptions:
  - $a,b,c,k$は実数
  - $a\neq 0$
  quantifiers:
  - 任意の実数$a,b,c,k$
  conclusion: 2つの解がともに$k$より大きいことと、判別式・軸・$af(k)$の3条件は同値である。
  answer: |
    $a,b,c,k$を実数とし、$a\neq 0$、$f(x)=ax^2+bx+c$とする。
    $k$より大きい実数$p,q$があって、すべての実数$x$で$f(x)=a(x-p)(x-q)$となるとする。係数を比べて$b=-a(p+q)$、$c=apq$である。よって$b^2-4ac=a^2(p-q)^2\geq 0$であり、$-\dfrac{b}{2a}=\dfrac{p+q}{2}$である。$k<p$、$k<q$なら$-\dfrac{b}{2a}>k$である。また$af(k)=a^2(p-k)(q-k)>0$である。
    逆に$b^2-4ac\geq 0$、$k<-\dfrac{b}{2a}$、$af(k)>0$を仮定する。$v=-\dfrac{b}{2a}$、$t=\left|\dfrac{\sqrt{b^2-4ac}}{2a}\right|\geq 0$とおくと、$b=-2av$、$c=a(v^2-t^2)$なので$f(x)=a\{x-(v-t)\}\{x-(v+t)\}$である。また$af(x)=a^2\{(x-v)^2-t^2\}$である。$af(k)>0$と$a^2>0$より$(k-v)^2>t^2$である。$v>k$なので$v+t>k$である。$v-t\leq k$と仮定すると$0\leq v-k\leq t$となり、$(k-v)^2\leq t^2$に矛盾する。よって$p=v-t$、$q=v+t$はともに$k$より大きい。
  strategy: Compare coefficients forward; for the converse write the roots as v ± t and use the sign of a f(k).
  sketch:
  - "derive: A factorization gives b = −a(p+q) and c = apq."
  - "derive: The conditions follow from a²(p−q)² ≥ 0, (p+q)/2 > k and a²(p−k)(q−k) > 0."
  - "construct: For the converse write f(x) = a(x−(v−t))(x−(v+t))."
  - "contradiction: If v−t ≤ k then (k−v)² ≤ t², contrary to a f(k) > 0."
  openmath: (forall (a b c k) (-> (!= a 0) (<-> (exists (p q) (and (forall (x) (= (+ (* a (^ x 2)) (* b x) c) (* a (- x p) (- x q)))) (< k p) (< k q))) (and (>= (- (^ b 2) (* 4 a c)) 0) (< k (/ (neg b) (* 2 a))) (> (* a (+ (* a (^ k 2)) (* b k) c)) 0)))))
  hard_negative:
    statement: $a\neq 0$のとき、すべての実数$x$で$ax^2+bx+c=a(x-p)(x-q)$となる実数$p,q$で、ともに$k$より大きいものが存在することは、$b^2-4ac\geq 0$、$k<-\dfrac{b}{2a}$、$ak^2+bk+c>0$がすべて成り立つことと同値である。
    reason: $a=-1$、$b=5$、$c=-6$、$k=1$のとき解は$2,3$で$1$より大きいが、$f(1)=-2<0$である。$a<0$では$f(k)$の符号が逆になるので、$af(k)$で書く必要がある。
  target: |
    ∀ (a b c k : ℝ), a ≠ 0 → ((∃ p q : ℝ, (∀ x : ℝ, a * x ^ 2 + b * x + c = a * (x - p) * (x - q)) ∧ k < p ∧ k < q) ↔ 0 ≤ b ^ 2 - 4 * a * c ∧ k < -b / (2 * a) ∧ 0 < a * (a * k ^ 2 + b * k + c))
  proof: |
    by
      intro a b c k ha
      have ha2 : 0 < a ^ 2 := by positivity
      constructor
      · rintro ⟨p, q, h, hp, hq⟩
        have h0 := h 0
        have h1 := h 1
        have h2 := h (-1)
        have hb : b = -a * (p + q) := by linear_combination (1 / 2) * h1 - (1 / 2) * h2
        have hc : c = a * p * q := by linear_combination h0
        subst hb hc
        refine ⟨?_, ?_, ?_⟩
        · have e : (-a * (p + q)) ^ 2 - 4 * a * (a * p * q) = (a * (p - q)) ^ 2 := by ring
          rw [e]
          exact sq_nonneg _
        · have e : -(-a * (p + q)) / (2 * a) = (p + q) / 2 := by
            field_simp
          rw [e]
          linarith
        · have e : a * (a * k ^ 2 + -a * (p + q) * k + a * p * q) = a ^ 2 * ((p - k) * (q - k)) := by ring
          rw [e]
          exact mul_pos ha2 (mul_pos (sub_pos.2 hp) (sub_pos.2 hq))
      · rintro ⟨hD, hk, hf⟩
        obtain ⟨v, t, ht, hb, hc, hv⟩ : ∃ v t : ℝ, 0 ≤ t ∧ b = -2 * a * v ∧ c = a * (v ^ 2 - t ^ 2) ∧ v = -b / (2 * a) := by
          have hs2 := Real.sq_sqrt hD
          refine ⟨-b / (2 * a), |Real.sqrt (b ^ 2 - 4 * a * c) / (2 * a)|, abs_nonneg _, by field_simp, ?_, rfl⟩
          rw [sq_abs, div_pow, div_pow, hs2]
          field_simp
          ring
        rw [← hv] at hk
        clear hv hD
        subst hb hc
        have e : a * (a * k ^ 2 + -2 * a * v * k + a * (v ^ 2 - t ^ 2)) = a ^ 2 * ((k - v) ^ 2 - t ^ 2) := by ring
        rw [e] at hf
        have hg : 0 < (k - v) ^ 2 - t ^ 2 := (mul_pos_iff_of_pos_left ha2).1 hf
        refine ⟨v - t, v + t, fun x => by ring, ?_, by linarith⟩
        by_contra hcon
        push_neg at hcon
        nlinarith [mul_nonneg (by linarith : 0 ≤ t - (v - k)) (by linarith : 0 ≤ t + (v - k))]
