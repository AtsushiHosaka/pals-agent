  answer: |
    $a,b,c$を実数とし、$a\neq 0$、$f(x)=ax^2+bx+c$とする。
    負の実数$p,q$があって、すべての実数$x$で$f(x)=a(x-p)(x-q)$となるとする。係数を比べて$b=-a(p+q)$、$c=apq$である。よって$b^2-4ac=a^2(p-q)^2\geq 0$、$-\dfrac{b}{a}=p+q<0$、$\dfrac{c}{a}=pq>0$である。
