    $af(k)<0$とする。$4af(k)=(2ak+b)^2-(b^2-4ac)$より$b^2-4ac>0$である。$v=-\dfrac{b}{2a}$、$t=\left|\dfrac{\sqrt{b^2-4ac}}{2a}\right|\geq 0$とおくと、$b=-2av$、$c=a(v^2-t^2)$なので$f(x)=a\{x-(v-t)\}\{x-(v+t)\}$である。また$af(x)=a^2\{(x-v)^2-t^2\}$である。$af(k)<0$と$a^2>0$より$(k-v)^2<t^2$なので$|k-v|<t$である。よって$v-t<k<v+t$であり、$p=v-t$、$q=v+t$が求めるものである。
    逆に、実数$p,q$が$p<k<q$を満たし、すべての実数$x$で$f(x)=a(x-p)(x-q)$なら、$af(k)=a^2(k-p)(k-q)<0$である。
  strategy: Use a f(x) = a²((x−v)²−t²) for the forward direction and factor at k for the converse.
  sketch:
  - "derive: a f(k) < 0 forces b²−4ac > 0."
  - "construct: Write f(x) = a(x−(v−t))(x−(v+t))."
  - "derive: a f(k) = a²((k−v)²−t²) < 0 gives v−t < k < v+t."
  - "conclude: Conversely a f(k) = a²(k−p)(k−q) < 0."
  openmath: (forall (a b c k) (-> (!= a 0) (<-> (< (* a (+ (* a (^ k 2)) (* b k) c)) 0) (exists (p q) (and (forall (x) (= (+ (* a (^ x 2)) (* b x) c) (* a (- x p) (- x q)))) (< p k) (< k q))))))
  hard_negative:
