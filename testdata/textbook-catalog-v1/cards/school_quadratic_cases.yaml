    ∀ (a b c : ℝ), a ≠ 0 → ((∃ p q : ℝ, (∀ x : ℝ, a * x ^ 2 + b * x + c = a * (x - p) * (x - q)) ∧ p < 0 ∧ q < 0) ↔ 0 ≤ b ^ 2 - 4 * a * c ∧ -b / a < 0 ∧ 0 < c / a)
