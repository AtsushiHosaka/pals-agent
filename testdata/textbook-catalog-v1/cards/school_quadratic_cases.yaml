  strategy: Read the sum and product of the roots; the two factors have equal sign and a negative sum.
  sketch:
  - "derive: A factorization gives −b/a = p+q and c/a = pq."
  - "construct: For the converse write the roots as v ± t."
  - "derive: Their product is positive, so they have the same sign."
  - "conclude: Their sum 2v is negative, so both are negative."
  openmath: (forall (a b c) (-> (!= a 0) (<-> (exists (p q) (and (forall (x) (= (+ (* a (^ x 2)) (* b x) c) (* a (- x p) (- x q)))) (< p 0) (< q 0))) (and (>= (- (^ b 2) (* 4 a c)) 0) (< (/ (neg b) a) 0) (> (/ c a) 0)))))
