- id: roots_straddle_iff_any_leading
  kind: gap
  level: high
  topic: 二次方程式・解の配置（両側）
  statement: $a\neq 0$のとき、$a(ak^2+bk+c)<0$であることと、すべての実数$x$で$ax^2+bx+c=a(x-p)(x-q)$となる実数$p,q$で$p<k<q$となるものが存在することは同値である。
  statement_en: "For a ≠ 0: a(ak²+bk+c) < 0 if and only if real p < k < q with ax²+bx+c = a(x−p)(x−q) for all x exist."
  assumptions:
  - $a,b,c,k$は実数
  - $a\neq 0$
  quantifiers:
  - 任意の実数$a,b,c,k$
  conclusion: $k$が2解の間にあることと$af(k)<0$は同値である。
  answer: |
