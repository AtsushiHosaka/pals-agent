  assumptions:
  - $a,b,c,p,x$は実数
  quantifiers:
  - 任意の実数$a,b,c,p,x$
  conclusion: $f(x)$と接線の差は$a(x-p)^2$であり、$a\neq 0$のとき共有点は接点だけである。
  answer: |
    $a,b,c,p,x$を実数とし、$f(x)=ax^2+bx+c$、$L(x)=f(p)+(2ap+b)(x-p)$とする。$f(x)-f(p)=a(x^2-p^2)+b(x-p)$なので、$f(x)-L(x)=a(x^2-p^2)-2ap(x-p)=a(x^2-2px+p^2)=a(x-p)^2$である。
    $a\neq 0$とする。$f(x)=L(x)$は$a(x-p)^2=0$と同値であり、これは$x=p$と同値である。
  strategy: Expand the difference; a ≠ 0 gives the unique contact.
  sketch:
  - "derive: f(x) − L(x) = a(x−p)²."
  - "conclude: For a ≠ 0 the difference vanishes exactly at x = p."
  openmath: (forall (a b c p x) (and (= (- (+ (* a (^ x 2)) (* b x) c) (+ (+ (* a (^ p 2)) (* b p) c) (* (+ (* 2 a p) b) (- x p)))) (* a (^ (- x p) 2))) (-> (!= a 0) (<-> (= (+ (* a (^ x 2)) (* b x) c) (+ (+ (* a (^ p 2)) (* b p) c) (* (+ (* 2 a p) b) (- x p)))) (= x p)))))
  hard_negative:
    statement: 放物線$y=ax^2+bx+c$は$x=p$における接線より常に上側にある。
    reason: $a=-1$、$b=c=0$、$p=1$のとき、接線は$y=-2x+1$であり、$x=0$で放物線の値$0$は接線の値$1$より小さい。$a<0$では下側にある。
  target: |
    ∀ (a b c p x : ℝ), (a * x ^ 2 + b * x + c) - ((a * p ^ 2 + b * p + c) + (2 * a * p + b) * (x - p)) = a * (x - p) ^ 2 ∧ (a ≠ 0 → (a * x ^ 2 + b * x + c = (a * p ^ 2 + b * p + c) + (2 * a * p + b) * (x - p) ↔ x = p))
  proof: |
    by
      intro a b c p x
      have e : (a * x ^ 2 + b * x + c) - ((a * p ^ 2 + b * p + c) + (2 * a * p + b) * (x - p)) = a * (x - p) ^ 2 := by ring
