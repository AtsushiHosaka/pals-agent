- id: trig_derivatives_sin_cos
  kind: gap
  level: 1
  topic: 微分法・三角関数
  statement: 任意の$x\in\mathbb{R}$で、$\sin$の$x$での微分係数は$\cos x$であり、$\cos$の$x$での微分係数は$-\sin x$である。
  statement_en: For every real x, sin has derivative cos x at x and cos has derivative -sin x at x.
  assumptions:
  - $x\in\mathbb{R}$
  quantifiers:
  - 任意の$x\in\mathbb{R}$
  conclusion: $(\sin x)'=\cos x$かつ$(\cos x)'=-\sin x$である。
  answer: |
    $x\in\mathbb{R}$とする。加法定理と、標準的な極限$\lim_{h\to0}\sin h/h=1$を用いる。
    まず倍角の公式より$\cos h-1=-2\sin^2(h/2)$なので、$h\neq0$で
    $\dfrac{\cos h-1}{h}=-\sin\dfrac{h}{2}\cdot\dfrac{\sin(h/2)}{h/2}$
    である。$h\to0$で第1因子は$0$に、第2因子は$1$に収束するので、$(\cos h-1)/h\to0$である。
    加法定理より、$h\neq0$で
    $\dfrac{\sin(x+h)-\sin x}{h}=\sin x\cdot\dfrac{\cos h-1}{h}+\cos x\cdot\dfrac{\sin h}{h}$
    であり、$h\to0$で右辺は$\cos x$に収束する。同様に
    $\dfrac{\cos(x+h)-\cos x}{h}=\cos x\cdot\dfrac{\cos h-1}{h}-\sin x\cdot\dfrac{\sin h}{h}$
    であり、右辺は$-\sin x$に収束する。
  strategy: Expand with the addition formulas and use the standard limits at zero.
  sketch:
  - 'derive: Expand sin(x+h) and cos(x+h) with the addition formulas.'
  - 'apply_theorem: Use sin h / h → 1 and (cos h - 1)/h → 0.'
  - 'conclude: The difference quotients tend to cos x and -sin x.'
  openmath: (forall (x) (and (has_deriv_at (lambda (y) (sin y)) (cos x) x) (has_deriv_at (lambda (y) (cos y)) (neg (sin x)) x)))
  hard_negative:
    statement: 度数法でのsinの導関数もcosに等しい。
    reason: 度数法ではsin(πx/180)を微分することになり、導関数に係数π/180が現れる。
  target: |
    ∀ x : ℝ, HasDerivAt Real.sin (Real.cos x) x ∧ HasDerivAt Real.cos (-Real.sin x) x
  proof: |
    by
      intro x
      exact ⟨Real.hasDerivAt_sin x, Real.hasDerivAt_cos x⟩
- id: arctan_derivative
  kind: gap
  level: 1
  topic: 微分法・逆三角関数
  statement: 任意の$x\in\mathbb{R}$で、$\arctan$の$x$での微分係数は$1/(1+x^2)$である。
  statement_en: For every real x, arctan has derivative 1/(1+x²) at x.
  assumptions:
  - $x\in\mathbb{R}$
  quantifiers:
  - 任意の$x\in\mathbb{R}$
  conclusion: $\arctan$の$x$での微分係数は$1/(1+x^2)$である。
  answer: |
    $x\in\mathbb{R}$とする。$\tan:(-\pi/2,\pi/2)\to\mathbb{R}$は微分可能な全単射で、導関数$1/\cos^2y$は$0$にならない。$\arctan$はその逆関数である。
    $y=\arctan x\in(-\pi/2,\pi/2)$とおくと$\tan y=x$である。逆関数の微分の公式より、$\arctan$の$x$での微分係数は$1/(1/\cos^2y)=\cos^2y$である。$1+\tan^2y=1/\cos^2y$より$\cos^2y=1/(1+x^2)$なので、結論を得る。
  strategy: Differentiate the inverse of tan and rewrite with 1 + tan² = 1/cos².
  sketch:
  - 'setup: Let y = arctan x so tan y = x and cos y ≠ 0.'
  - 'apply_theorem: The inverse function rule gives derivative cos² y.'
  - 'conclude: Using 1 + tan² y = 1/cos² y this is 1/(1+x²).'
  openmath: (forall (x) (has_deriv_at (lambda (y) (arctan_value y)) (/ 1 (+ 1 (^ x 2))) x))
  hard_negative:
    statement: arctanの微分係数は1/cos^2 xである。
    reason: それはtanの導関数である。x=0では一致するが、x=1で1/2と1/cos^2 1は異なる。
  target: |
    ∀ x : ℝ, HasDerivAt Real.arctan (1 / (1 + x ^ 2)) x
  proof: |
    by
      intro x
      exact Real.hasDerivAt_arctan x
- id: rolle_theorem
  kind: named
  level: 1
  topic: 平均値の定理・ロルの定理
  statement: ロルの定理。$a<b$とし、$f:\mathbb{R}\to\mathbb{R}$が$[a,b]$で連続、$(a,b)$の各点$x$で微分可能で微分係数が$g(x)$、$f(a)=f(b)$ならば、$g(c)=0$となる$c\in(a,b)$が存在する。
  statement_en: Rolle's theorem. If a < b, f is continuous on [a,b], differentiable on (a,b) with derivative g, and f(a) = f(b), then g(c) = 0 for some c in (a,b).
  assumptions:
  - $a<b$
  - $f$は$[a,b]$で連続
  - $f$は$(a,b)$の各点$x$で微分可能で微分係数は$g(x)$
  - $f(a)=f(b)$
  quantifiers:
  - 任意の$f,g:\mathbb{R}\to\mathbb{R}$と$a,b\in\mathbb{R}$
  - ある$c\in(a,b)$
  conclusion: $g(c)=0$となる$c\in(a,b)$が存在する。
  answer: |
    $a<b$とし、$f,g:\mathbb{R}\to\mathbb{R}$について、$f$は$[a,b]$で連続、$(a,b)$の各点$x$で微分可能で微分係数が$g(x)$、$f(a)=f(b)$であるとする。最大値・最小値の定理より、$f$は$[a,b]$で最大値$M$と最小値$m$をとる。
    $M=m$なら$f$は$[a,b]$で定数なので、$c=(a+b)/2$で$g(c)=0$である。
    $M\neq m$なら、$M,m$の少なくとも一方は$f(a)=f(b)$と異なるので、その値は内点$c\in(a,b)$でとられる。$c$で最大値をとる場合、小さい$h>0$で$(f(c+h)-f(c))/h\leq0$なので$h\to0$として$g(c)\leq0$を得る。小さい$h<0$では$(f(c+h)-f(c))/h\geq0$なので$g(c)\geq0$を得る。よって$g(c)=0$である。最小値の場合は$-f$に同じ議論を適用する。
  strategy: The extreme value theorem gives an interior extremum unless f is constant.
  sketch:
  - 'apply_theorem: f attains its maximum and minimum on [a,b].'
  - 'case_split: If they coincide, f is constant and the derivative vanishes everywhere.'
  - 'derive: Otherwise f(a) = f(b) forces one extremum at an interior point c.'
  - 'apply_theorem: The derivative at an interior extremum is zero.'
  - 'conclude: Hence g(c) = 0.'
  openmath: (forall (f g a b) (-> (and (< a b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (= (fn_value f a) (fn_value f b)) (forall (x) (-> (in x (open_interval a b)) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value g x) x)))) (exists (c) (and (in c (open_interval a b)) (= (fn_value g c) 0)))))
  hard_negative:
    statement: fが(a,b)の点で微分可能でなくても、連続でf(a)=f(b)ならば、f'(c)=0となる点がある。
    reason: f(x)=1-|x|を[-1,1]で考えると、f(-1)=f(1)だが、微分可能な点での微分係数は±1であり0にならない。
  target: |
    ∀ (f g : ℝ → ℝ) (a b : ℝ), a < b → ContinuousOn f (Set.Icc a b) → f a = f b → (∀ x ∈ Set.Ioo a b, HasDerivAt f (g x) x) → ∃ c ∈ Set.Ioo a b, g c = 0
  proof: |
    by
      intro f g a b hab hc he hd
      exact exists_hasDerivAt_eq_zero hab hc he hd
- id: mean_value_theorem
  kind: named
  level: 1
  topic: 平均値の定理
  statement: 平均値の定理。$a<b$とし、$f:\mathbb{R}\to\mathbb{R}$が$[a,b]$で連続、$(a,b)$の各点$x$で微分可能で微分係数が$g(x)$ならば、$f(b)-f(a)=g(c)(b-a)$となる$c\in(a,b)$が存在する。
  statement_en: Mean value theorem. If a < b, f is continuous on [a,b] and differentiable on (a,b) with derivative g, then f(b) - f(a) = g(c)(b-a) for some c in (a,b).
  assumptions:
  - $a<b$
  - $f$は$[a,b]$で連続
  - $f$は$(a,b)$の各点$x$で微分可能で微分係数は$g(x)$
  quantifiers:
  - 任意の$f,g:\mathbb{R}\to\mathbb{R}$と$a,b\in\mathbb{R}$
  - ある$c\in(a,b)$
  conclusion: $f(b)-f(a)=g(c)(b-a)$となる$c\in(a,b)$が存在する。
  answer: |
    $a<b$とし、$f,g:\mathbb{R}\to\mathbb{R}$について、$f$は$[a,b]$で連続、$(a,b)$の各点$x$で微分可能で微分係数が$g(x)$であるとする。
    $h(x)=f(x)-\dfrac{f(b)-f(a)}{b-a}(x-a)$とおく。$h$は$[a,b]$で連続、$(a,b)$で微分可能で、$h'(x)=g(x)-\dfrac{f(b)-f(a)}{b-a}$である。また$h(a)=h(b)=f(a)$である。ロルの定理より$h'(c)=0$となる$c\in(a,b)$が存在し、これを整理すると$f(b)-f(a)=g(c)(b-a)$を得る。
  strategy: Subtract the secant line and apply Rolle's theorem.
  sketch:
  - 'construct: Let h(x) = f(x) - (f(b)-f(a))(x-a)/(b-a).'
  - 'derive: h(a) = h(b) and h is differentiable on (a,b).'
  - 'apply_theorem: Rolle''s theorem gives c with h''(c) = 0.'
  - 'conclude: Rearranging gives f(b)-f(a) = g(c)(b-a).'
  openmath: (forall (f g a b) (-> (and (< a b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (forall (x) (-> (in x (open_interval a b)) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value g x) x)))) (exists (c) (and (in c (open_interval a b)) (= (- (fn_value f b) (fn_value f a)) (* (fn_value g c) (- b a)))))))
  hard_negative:
    statement: 連続性を仮定しなくても、(a,b)で微分可能なら同じ結論が成り立つ。
    reason: 区間[0,1)で0、f(1)=1の関数は(0,1)で微分係数0だが、f(1)-f(0)=1である。
  target: |
    ∀ (f g : ℝ → ℝ) (a b : ℝ), a < b → ContinuousOn f (Set.Icc a b) → (∀ x ∈ Set.Ioo a b, HasDerivAt f (g x) x) → ∃ c ∈ Set.Ioo a b, f b - f a = g c * (b - a)
  proof: |
    by
      intro f g a b hab hc hd
      obtain ⟨c, hc', e⟩ := exists_hasDerivAt_eq_slope f g hab hc hd
      refine ⟨c, hc', ?_⟩
      rw [e, div_mul_cancel₀ _ (sub_ne_zero.mpr hab.ne')]
- id: local_extremum_derivative_zero
  kind: textbook
  level: 1
  topic: 微分法・極値の必要条件
  statement: $f:\mathbb{R}\to\mathbb{R}$が$a$で極大または極小をとり、$a$での微分係数が$u$ならば、$u=0$である。
  statement_en: If f has a local extremum at a and has derivative u at a, then u = 0.
  assumptions:
  - $f$は$a$で極大または極小をとる
  - $f$の$a$での微分係数は$u$
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$と$a,u\in\mathbb{R}$
  conclusion: $u=0$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$、$a,u\in\mathbb{R}$とし、$f$は$a$で極大または極小をとり、$a$での微分係数が$u$であるとする。
    極大の場合を示す。ある$\delta>0$があって$|h|<\delta$で$f(a+h)\leq f(a)$である。$0<h<\delta$では$(f(a+h)-f(a))/h\leq0$なので、$h\to+0$として$u\leq0$を得る。$-\delta<h<0$では$(f(a+h)-f(a))/h\geq0$なので、$h\to-0$として$u\geq0$を得る。よって$u=0$である。
    極小の場合は、$-f$が$a$で極大をとり微分係数が$-u$なので、$-u=0$となる。
  strategy: Compare the signs of the right and left difference quotients.
  sketch:
  - 'setup: Treat a local maximum; the minimum follows from -f.'
  - 'derive: The right difference quotient is at most 0, so u ≤ 0.'
  - 'derive: The left difference quotient is at least 0, so u ≥ 0.'
  - 'conclude: Therefore u = 0.'
  openmath: (forall (f a u) (-> (and (or (local_max_at (lambda (x) (fn_value f x)) a) (local_min_at (lambda (x) (fn_value f x)) a)) (has_deriv_at (lambda (x) (fn_value f x)) u a)) (= u 0)))
  hard_negative:
    statement: aでの微分係数が0ならば、fはaで極値をとる。
    reason: f(x)=x^3はx=0で微分係数0だが、極値をとらない。
  target: |
    ∀ (f : ℝ → ℝ) (a u : ℝ), IsLocalExtr f a → HasDerivAt f u a → u = 0
  proof: |
    by
      intro f a u he hd
      exact he.hasDerivAt_eq_zero hd
- id: nonnegative_derivative_monotone
  kind: textbook
  level: 1
  topic: 平均値の定理・単調性
  statement: $f:\mathbb{R}\to\mathbb{R}$が$[a,b]$で連続、$(a,b)$の各点$x$で微分係数$g(x)\geq0$をもつならば、$x\leq y$を満たす$x,y\in[a,b]$で$f(x)\leq f(y)$である。
  statement_en: If f is continuous on [a,b] and differentiable on (a,b) with nonnegative derivative, then f is nondecreasing on [a,b].
  assumptions:
  - $f$は$[a,b]$で連続
  - $f$は$(a,b)$の各点$x$で微分可能で微分係数は$g(x)$
  - $x\in(a,b)$で$g(x)\geq0$
  quantifiers:
  - 任意の$f,g:\mathbb{R}\to\mathbb{R}$と$a,b\in\mathbb{R}$
  conclusion: $f$は$[a,b]$で単調増加である。すなわち$x,y\in[a,b]$、$x\leq y$ならば$f(x)\leq f(y)$である。
  answer: |
    $f,g:\mathbb{R}\to\mathbb{R}$、$a,b\in\mathbb{R}$とし、$f$は$[a,b]$で連続、$(a,b)$の各点$x$で微分係数$g(x)$をもち、$g(x)\geq0$であるとする。
    $x,y\in[a,b]$、$x\leq y$とする。$x=y$なら$f(x)=f(y)$である。$x<y$なら、$f$は$[x,y]$で連続、$(x,y)\subset(a,b)$で微分可能である。平均値の定理より、$f(y)-f(x)=g(c)(y-x)$となる$c\in(x,y)$が存在する。$c\in(a,b)$より$g(c)\geq0$であり、$y-x>0$なので$f(x)\leq f(y)$である。
  strategy: Apply the mean value theorem on an arbitrary subinterval.
  sketch:
  - 'setup: Take x < y in [a,b].'
  - 'apply_theorem: The mean value theorem gives c in (x,y) with f(y)-f(x) = g(c)(y-x).'
  - 'conclude: Since g(c) ≥ 0 and y-x > 0, f(x) ≤ f(y).'
  openmath: (forall (f g a b) (-> (and (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (forall (x) (-> (in x (open_interval a b)) (and (has_deriv_at (lambda (t) (fn_value f t)) (fn_value g x) x) (>= (fn_value g x) 0))))) (fn_monotone_on (lambda (x) (fn_value f x)) (closed_interval a b))))
  hard_negative:
    statement: 区間とは限らない定義域で導関数が非負なら、fはその定義域で単調増加である。
    reason: 定義域が{x≠0}のとき、f(x)=-1/xの導関数は正だが、f(-1)=1>f(1)=-1である。
  target: |
    ∀ (f g : ℝ → ℝ) (a b : ℝ), ContinuousOn f (Set.Icc a b) → (∀ x ∈ Set.Ioo a b, HasDerivAt f (g x) x) → (∀ x ∈ Set.Ioo a b, 0 ≤ g x) → MonotoneOn f (Set.Icc a b)
  proof: |
    by
      intro f g a b hc hd hn
      refine monotoneOn_of_deriv_nonneg (convex_Icc a b) hc ?_ ?_
      · rw [interior_Icc]
        exact fun x hx => (hd x hx).differentiableAt.differentiableWithinAt
      · rw [interior_Icc]
        intro x hx
        rw [(hd x hx).deriv]
        exact hn x hx
- id: zero_derivative_constant
  kind: gap
  level: 1
  topic: 平均値の定理・定数関数
  statement: $f:\mathbb{R}\to\mathbb{R}$が$[a,b]$で連続で、$(a,b)$の各点で微分係数が$0$ならば、全ての$x\in[a,b]$で$f(x)=f(a)$である。
  statement_en: If f is continuous on [a,b] and has derivative 0 at every point of (a,b), then f(x) = f(a) for all x in [a,b].
  assumptions:
  - $f$は$[a,b]$で連続
  - $x\in(a,b)$で$f$の微分係数は$0$
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$と$a,b\in\mathbb{R}$
  - 任意の$x\in[a,b]$
  conclusion: $f(x)=f(a)$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$、$a,b\in\mathbb{R}$とし、$f$は$[a,b]$で連続で、$(a,b)$の各点で微分係数が$0$であるとする。$x\in[a,b]$をとる。
    $x=a$なら明らかである。$a<x\leq b$なら、$f$は$[a,x]$で連続、$(a,x)\subset(a,b)$で微分可能である。平均値の定理より、$c\in(a,x)$が存在して$f(x)-f(a)$は$c$での微分係数と$x-a$の積に等しい。$c$での微分係数は$0$なので、$f(x)=f(a)$である。
  strategy: Apply the mean value theorem on [a,x].
  sketch:
  - 'case_split: The case x = a is immediate.'
  - 'apply_theorem: For a < x use the mean value theorem on [a,x].'
  - 'derive: The intermediate derivative vanishes because c lies in (a,b).'
  - 'conclude: Hence f(x) = f(a).'
  openmath: (forall (f a b x) (-> (and (fn_continuous_on (lambda (t) (fn_value f t)) (closed_interval a b)) (forall (y) (-> (in y (open_interval a b)) (has_deriv_at (lambda (t) (fn_value f t)) 0 y))) (in x (closed_interval a b))) (= (fn_value f x) (fn_value f a))))
  hard_negative:
    statement: 定義域が区間でなくても、導関数が0ならfは定数である。
    reason: 定義域が{x≠0}のとき、f(x)=x/|x|は導関数が0だが定数でない。
  target: |
    ∀ (f : ℝ → ℝ) (a b : ℝ), ContinuousOn f (Set.Icc a b) → (∀ x ∈ Set.Ioo a b, HasDerivAt f 0 x) → ∀ x ∈ Set.Icc a b, f x = f a
  proof: |
    by
      intro f a b hc hd x hx
      rcases eq_or_lt_of_le hx.1 with rfl | h
      · rfl
      · obtain ⟨c, _, e⟩ := exists_hasDerivAt_eq_slope f (fun _ => (0 : ℝ)) h (hc.mono (Set.Icc_subset_Icc_right hx.2)) (fun y hy => hd y ⟨hy.1, hy.2.trans_le hx.2⟩)
        have hne : x - a ≠ 0 := sub_ne_zero.mpr h.ne'
        have h0 : f x - f a = 0 := by
          have := (eq_div_iff hne).mp e
          linarith
        linarith
- id: same_derivative_differ_by_constant
  kind: gap
  level: 1
  topic: 平均値の定理・原始関数
  statement: $f,g:\mathbb{R}\to\mathbb{R}$の各点$x$での微分係数がともに$h(x)$ならば、ある定数$C$について全ての$x$で$f(x)=g(x)+C$である。
  statement_en: If f and g are differentiable on the reals with the same derivative h, then f(x) = g(x) + C for a constant C and all x.
  assumptions:
  - 全ての$x$で$f$の微分係数は$h(x)$
  - 全ての$x$で$g$の微分係数は$h(x)$
  quantifiers:
  - 任意の$f,g,h:\mathbb{R}\to\mathbb{R}$
  - ある$C\in\mathbb{R}$
  - 任意の$x\in\mathbb{R}$
  conclusion: $f(x)=g(x)+C$である。
  answer: |
    $f,g,h:\mathbb{R}\to\mathbb{R}$とし、全ての$x$で$f,g$の微分係数がともに$h(x)$であるとする。$k=f-g$とおくと、$k$は全実数で微分可能で導関数は$0$である。
    $x\neq0$とする。$0$と$x$を端点とする閉区間で平均値の定理を用いると、$k(x)-k(0)$は$0$と$x$の間の点での微分係数と$x$の積に等しいので、$0$である。よって全ての$x$で$k(x)=k(0)$である。$C=f(0)-g(0)$とおくと$f(x)=g(x)+C$となる。
  strategy: The difference has zero derivative everywhere, so it is constant.
  sketch:
  - 'derive: The difference f - g has derivative 0 everywhere.'
  - 'apply_theorem: A function with zero derivative on the reals is constant.'
  - 'conclude: Take C = f(0) - g(0).'
  openmath: (forall (f g h) (-> (and (forall (x) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value h x) x)) (forall (x) (has_deriv_at (lambda (t) (fn_value g t)) (fn_value h x) x))) (exists (C) (forall (x) (= (fn_value f x) (+ (fn_value g x) C))))))
  hard_negative:
    statement: 導関数の差が定数ならば、f-gは定数である。
    reason: f(x)=x, g(x)=0では導関数の差は定数1だが、f-g=xは定数でない。
  target: |
    ∀ (f g h : ℝ → ℝ), (∀ x, HasDerivAt f (h x) x) → (∀ x, HasDerivAt g (h x) x) → ∃ C, ∀ x, f x = g x + C
  proof: |
    by
      intro f g h hf hg
      have hd : ∀ x, HasDerivAt (fun y => f y - g y) 0 x := by
        intro x
        have h1 := (hf x).sub (hg x)
        rw [sub_self] at h1
        exact h1
      have hconst := is_const_of_deriv_eq_zero (f := fun y => f y - g y) (fun x => (hd x).differentiableAt) (fun x => (hd x).deriv)
      refine ⟨f 0 - g 0, fun x => ?_⟩
      have h1 : f x - g x = f 0 - g 0 := hconst x 0
      linarith
- id: lipschitz_from_derivative_bound
  kind: gap
  level: 1
  topic: 平均値の定理・リプシッツ評価
  statement: $f:\mathbb{R}\to\mathbb{R}$の各点$t$での微分係数が$g(t)$で、全ての$t$で$|g(t)|\leq C$ならば、任意の$x,y\in\mathbb{R}$で$|f(y)-f(x)|\leq C|y-x|$である。
  statement_en: If f is differentiable on the reals with |f'| ≤ C, then |f(y)-f(x)| ≤ C|y-x| for all x, y.
  assumptions:
  - 全ての$t$で$f$の微分係数は$g(t)$
  - 全ての$t$で$|g(t)|\leq C$
  quantifiers:
  - 任意の$f,g:\mathbb{R}\to\mathbb{R}$と$C,x,y\in\mathbb{R}$
  conclusion: $|f(y)-f(x)|\leq C|y-x|$である。
  answer: |
    $f,g:\mathbb{R}\to\mathbb{R}$、$C,x,y\in\mathbb{R}$とし、全ての$t$で$f$の微分係数が$g(t)$、$|g(t)|\leq C$であるとする。
    $x=y$なら両辺は$0$である。$x\neq y$なら、$x$と$y$を端点とする閉区間で平均値の定理を用いて、$f(y)-f(x)=g(c)(y-x)$となる$c$がとれる。両辺の絶対値をとると$|f(y)-f(x)|=|g(c)||y-x|\leq C|y-x|$である。
  strategy: Apply the mean value theorem and bound the intermediate derivative.
  sketch:
  - 'case_split: The case x = y is trivial.'
  - 'apply_theorem: For x ≠ y the mean value theorem gives c with f(y)-f(x) = g(c)(y-x).'
  - 'conclude: Taking absolute values and using |g(c)| ≤ C gives the bound.'
  openmath: (forall (f g C x y) (-> (and (forall (t) (has_deriv_at (lambda (s) (fn_value f s)) (fn_value g t) t)) (forall (t) (<= (abs (fn_value g t)) C))) (<= (abs (- (fn_value f y) (fn_value f x))) (* C (abs (- y x))))))
  hard_negative:
    statement: fが有界ならば、fはあるCで|f(y)-f(x)|≤C|y-x|を満たす。
    reason: sin(x^2)は有界だが導関数が非有界で、この評価を満たすCは存在しない。
  target: |
    ∀ (f g : ℝ → ℝ) (C x y : ℝ), (∀ t, HasDerivAt f (g t) t) → (∀ t, |g t| ≤ C) → |f y - f x| ≤ C * |y - x|
  proof: |
    by
      intro f g C x y hd hb
      have := Convex.norm_image_sub_le_of_norm_hasDerivWithin_le (s := Set.univ) (C := C) (f := f) (f' := g) (x := x) (y := y) (fun t _ => (hd t).hasDerivWithinAt) (fun t _ => by simpa only [Real.norm_eq_abs] using hb t) convex_univ (Set.mem_univ _) (Set.mem_univ _)
      simpa only [Real.norm_eq_abs] using this
- id: first_derivative_test_minimum
  kind: textbook
  level: 1
  topic: 微分法・第1次導関数判定
  statement: $\delta>0$とし、$f:\mathbb{R}\to\mathbb{R}$が$a$で連続、$0<|x-a|<\delta$の各点$x$で微分係数$g(x)$をもつとする。$(a-\delta,a)$で$g\leq0$、$(a,a+\delta)$で$g\geq0$ならば、$f$は$a$で極小をとる。
  statement_en: If f is continuous at a, differentiable on a punctured neighborhood of a, with f' ≤ 0 on the left of a and f' ≥ 0 on the right, then f has a local minimum at a.
  assumptions:
  - $\delta>0$
  - $f$は$a$で連続
  - $0<|x-a|<\delta$で$f$の微分係数は$g(x)$
  - $x\in(a-\delta,a)$で$g(x)\leq0$
  - $x\in(a,a+\delta)$で$g(x)\geq0$
  quantifiers:
  - 任意の$f,g:\mathbb{R}\to\mathbb{R}$と$a,\delta\in\mathbb{R}$
  conclusion: $f$は$a$で極小をとる。
  answer: |
    $f,g:\mathbb{R}\to\mathbb{R}$、$a\in\mathbb{R}$、$\delta>0$とする。$f$は$a$で連続、$0<|x-a|<\delta$の各点$x$で微分係数$g(x)$をもち、$(a-\delta,a)$で$g\leq0$、$(a,a+\delta)$で$g\geq0$であるとする。
    $x\in(a-\delta,a)$をとる。$[x,a)$の各点で$f$は微分可能なので連続であり、$a$でも連続なので、$f$は$[x,a]$で連続である。平均値の定理より$f(a)-f(x)=g(c)(a-x)$となる$c\in(x,a)$があり、$g(c)\leq0$より$f(x)\geq f(a)$である。
    $x\in(a,a+\delta)$なら、同様に$f(x)-f(a)=g(c)(x-a)$となる$c\in(a,x)$があり、$g(c)\geq0$より$f(x)\geq f(a)$である。
    したがって$|x-a|<\delta$で$f(x)\geq f(a)$であり、$f$は$a$で極小をとる。
  strategy: Apply monotonicity from the sign of the derivative separately on each side.
  sketch:
  - 'derive: On the left of a, f is nonincreasing, so f(x) ≥ f(a).'
  - 'derive: On the right of a, f is nondecreasing, so f(x) ≥ f(a).'
  - 'conclude: Both sides give f(x) ≥ f(a) near a, so a is a local minimum.'
  openmath: (forall (f g a d) (-> (and (> d 0) (fn_continuous_at (lambda (x) (fn_value f x)) a) (forall (x) (-> (and (!= x a) (< (abs (- x a)) d)) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value g x) x))) (forall (x) (-> (in x (open_interval (- a d) a)) (<= (fn_value g x) 0))) (forall (x) (-> (in x (open_interval a (+ a d))) (>= (fn_value g x) 0)))) (local_min_at (lambda (x) (fn_value f x)) a)))
  hard_negative:
    statement: 連続性を仮定しなくても、左側でf'≤0、右側でf'≥0ならばaは極小点である。
    reason: x≠0でf(x)=x^2, f(0)=1とすると符号の条件は満たすが、0は極小点でない。
  target: |
    ∀ (f g : ℝ → ℝ) (a δ : ℝ), 0 < δ → ContinuousAt f a → (∀ x, x ≠ a → |x - a| < δ → HasDerivAt f (g x) x) → (∀ x ∈ Set.Ioo (a - δ) a, g x ≤ 0) → (∀ x ∈ Set.Ioo a (a + δ), 0 ≤ g x) → IsLocalMin f a
  proof: |
    by
      intro f g a δ hδ hc hd hl hr
      have hnear : ∀ x ∈ Set.Ioo (a - δ) a, HasDerivAt f (g x) x := fun x hx =>
        hd x hx.2.ne (by rw [abs_lt]; constructor <;> linarith [hx.1, hx.2])
      have hnear' : ∀ x ∈ Set.Ioo a (a + δ), HasDerivAt f (g x) x := fun x hx =>
        hd x hx.1.ne' (by rw [abs_lt]; constructor <;> linarith [hx.1, hx.2])
      refine isLocalMin_of_deriv hc ?_ ?_ ?_
      · refine eventually_nhdsWithin_iff.mpr (Metric.eventually_nhds_iff.mpr ⟨δ, hδ, fun x hx hne => ?_⟩)
        exact (hd x hne (by rwa [Real.dist_eq] at hx)).differentiableAt
      · filter_upwards [Ioo_mem_nhdsLT (show a - δ < a by linarith)] with x hx
        rw [(hnear x hx).deriv]
        exact hl x hx
      · filter_upwards [Ioo_mem_nhdsGT (show a < a + δ by linarith)] with x hx
        rw [(hnear' x hx).deriv]
        exact hr x hx
- id: second_derivative_test_maximum
  kind: textbook
  level: 1
  topic: 微分法・第2次導関数判定
  statement: $\delta>0$とし、$f,g:\mathbb{R}\to\mathbb{R}$について、$|x-a|<\delta$の各点$x$で$f$の微分係数が$g(x)$であり、$g(a)=0$で、$g$の$a$での微分係数$u$が負ならば、$f$は$a$で極大をとる。
  statement_en: If δ > 0, f has derivative g(x) at every x with |x-a| < δ, g(a) = 0, and g has derivative u < 0 at a, then f has a local maximum at a.
  assumptions:
  - $\delta>0$
  - $|x-a|<\delta$の各点$x$で$f$の微分係数は$g(x)$
  - $g(a)=0$
  - $g$の$a$での微分係数は$u$
  - $u<0$
  quantifiers:
  - 任意の$f,g:\mathbb{R}\to\mathbb{R}$と$a,u,\delta\in\mathbb{R}$
  conclusion: $f$は$a$で極大をとる。
  answer: |
    $\delta>0$とし、$f,g:\mathbb{R}\to\mathbb{R}$、$a,u\in\mathbb{R}$とする。$|x-a|<\delta$の各点$x$で$f$の微分係数は$g(x)$であり、$g(a)=0$、$g$の$a$での微分係数は$u<0$であるとする。
    $g(a)=0$より、$x\to a$で$g(x)/(x-a)=(g(x)-g(a))/(x-a)\to u<0$である。よってある$\delta'\in(0,\delta]$があって、$0<|x-a|<\delta'$で$g(x)/(x-a)<0$となる。すなわち$(a-\delta',a)$で$g>0$、$(a,a+\delta')$で$g<0$である。
    $x\in(a-\delta',a)$なら、$f$は$[x,a]$で微分可能なので連続であり、平均値の定理より$f(a)-f(x)=g(c)(a-x)$となる$c\in(x,a)$がある。$g(c)>0$より$f(x)<f(a)$である。$x\in(a,a+\delta')$なら、同様に$f(x)-f(a)=g(c)(x-a)$となる$c\in(a,x)$があり、$g(c)<0$より$f(x)<f(a)$である。よって$f$は$a$で極大をとる。
  strategy: The sign of the second derivative determines the sign of f' on each side.
  sketch:
  - 'derive: Since f''(a) = 0 and u < 0, f''(x)/(x-a) is negative near a.'
  - 'derive: So f'' is positive on the left of a and negative on the right.'
  - 'apply_theorem: The first derivative test applies.'
  - 'conclude: Thus a is a local maximum.'
  openmath: (forall (f g a u d) (-> (and (> d 0) (forall (x) (-> (< (abs (- x a)) d) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value g x) x))) (= (fn_value g a) 0) (has_deriv_at (lambda (x) (fn_value g x)) u a) (< u 0)) (local_max_at (lambda (x) (fn_value f x)) a)))
  hard_negative:
    statement: f'(a)=0かつf''(a)≤0ならば、fはaで極大をとる。
    reason: f(x)=x^3は a=0でf'(0)=f''(0)=0だが、極大をとらない。
  target: '∀ (f g : ℝ → ℝ) (a u δ : ℝ), 0 < δ → (∀ x : ℝ, |x - a| < δ → HasDerivAt f (g x) x) → g a = 0 → HasDerivAt g u a → u < 0 → IsLocalMax f a'
  proof: |
    by
      intro f g a u δ hδ hf hg0 hg hu
      have hnear : ∀ x : ℝ, |x - a| < δ → deriv f x = g x := fun x hx => (hf x hx).deriv
      have hev : deriv f =ᶠ[nhds a] g := by
        have : ∀ᶠ x in nhds a, |x - a| < δ := by
          have : Metric.ball a δ ∈ nhds a := Metric.ball_mem_nhds a hδ
          filter_upwards [this] with x hx
          simpa [Real.dist_eq] using hx
        filter_upwards [this] with x hx using hnear x hx
      have h2 : HasDerivAt (deriv f) u a := hg.congr_of_eventuallyEq hev
      have h0 : deriv f a = 0 := by rw [hnear a (by simpa using hδ), hg0]
      have hca : ContinuousAt f a := (hf a (by simpa using hδ)).continuousAt
      exact isLocalMax_of_deriv_deriv_neg (by rw [h2.deriv]; exact hu) h0 hca
- id: taylor_lagrange_remainder
  kind: named
  level: 2
  topic: テイラーの定理・ラグランジュの剰余
  statement: テイラーの定理。$a\neq x$、$n\in\mathbb{N}$とし、$I$を$a$と$x$を端点とする閉区間、$J$をその内部とする。$f:\mathbb{R}\to\mathbb{R}$が$I$で$C^n$級で、$I$内で考えた$n$階導関数$f^{(n)}$が$J$で微分可能ならば、ある$c\in J$について$f(x)=\sum_{k=0}^n\frac{f^{(k)}(a)}{k!}(x-a)^k+\frac{f^{(n+1)}(c)}{(n+1)!}(x-a)^{n+1}$である。導関数は全て$I$内で考えたものとする。
  statement_en: Taylor's theorem with Lagrange remainder. If a ≠ x, f is C^n on the closed interval between a and x, and the n-th derivative within that interval is differentiable on the open interval, then for some c in the open interval, f(x) = sum_{k≤n} f^(k)(a)(x-a)^k/k! + f^(n+1)(c)(x-a)^(n+1)/(n+1)!, with derivatives taken within the closed interval.
  assumptions:
  - $a\neq x$
  - $f$は$a$と$x$を端点とする閉区間$I$で$C^n$級
  - $I$内で考えた$f^{(n)}$は$I$の内部で微分可能
  quantifiers:
  - 任意の$f:\mathbb{R}\to\mathbb{R}$、$a,x\in\mathbb{R}$、$n\in\mathbb{N}$
  - $I$の内部のある$c$
  conclusion: $f(x)=\sum_{k=0}^n\frac{f^{(k)}(a)}{k!}(x-a)^k+\frac{f^{(n+1)}(c)}{(n+1)!}(x-a)^{n+1}$である。
  answer: |
    $f:\mathbb{R}\to\mathbb{R}$、$a,x\in\mathbb{R}$、$a\neq x$、$n\in\mathbb{N}$（$0$を含む）とする。$I$を$a$と$x$を端点とする閉区間、$J$をその内部とし、$f^{(k)}$は$I$内で考えた$k$階導関数を表す。$f$は$I$で$C^n$級で、$f^{(n)}$は$J$で微分可能であるとする。
    $t\in I$に対し$F(t)=\sum_{k=0}^n\frac{f^{(k)}(t)}{k!}(x-t)^k$、$G(t)=(x-t)^{n+1}$とおく。ただし$(x-t)^0=1$である。$F,G$は$I$で連続、$J$で微分可能である。$t\in J$で$F$を項別に微分すると、$k\geq1$の項の導関数は$\frac{f^{(k+1)}(t)}{k!}(x-t)^k-\frac{f^{(k)}(t)}{(k-1)!}(x-t)^{k-1}$であり、$k=0$の項の導関数は$f'(t)$である。和をとると打ち消し合い、$F'(t)=\frac{f^{(n+1)}(t)}{n!}(x-t)^n$となる。また$G'(t)=-(n+1)(x-t)^n$である。
    コーシーの平均値の定理（$F,G$が閉区間で連続、内部で微分可能ならば、内部のある点$c$で$(F(x)-F(a))G'(c)=(G(x)-G(a))F'(c)$）を用いる。$F(x)=f(x)$、$G(x)=0$、$G(a)=(x-a)^{n+1}$なので
    $-(n+1)(x-c)^n(f(x)-F(a))=-(x-a)^{n+1}\frac{f^{(n+1)}(c)}{n!}(x-c)^n$
    である。$c\in J$より$x-c\neq0$なので、$(n+1)(x-c)^n$で割ると$f(x)-F(a)=\frac{f^{(n+1)}(c)}{(n+1)!}(x-a)^{n+1}$を得る。$F(a)$はテイラー多項式の$x$での値なので、これが結論である。
  strategy: Apply Cauchy's mean value theorem to the remainder as a function of the expansion point and to (x-t)^(n+1).
  sketch:
  - 'construct: Let F(t) = f(x) - sum_{k≤n} f^(k)(t)(x-t)^k/k!.'
  - 'derive: The derivative telescopes to F''(t) = -f^(n+1)(t)(x-t)^n/n!.'
  - 'construct: Let G(t) = (x-t)^(n+1), so G(x) = 0 = F(x).'
  - 'apply_theorem: Cauchy''s mean value theorem gives c with F(a)/G(a) = F''(c)/G''(c).'
  - 'derive: The quotient on the right equals f^(n+1)(c)/(n+1)!.'
  - 'conclude: Rearranging gives the Lagrange form.'
  openmath: (forall (f a x n) (-> (and (!= a x) (in n N) (cont_diff_on (lambda (t) (fn_value f t)) n (closed_interval_between a x)) (differentiable_on (lambda (t) (iterated_deriv_within (lambda (s) (fn_value f s)) n (closed_interval_between a x) t)) (open_interval_between a x))) (exists (c) (and (in c (open_interval_between a x)) (= (fn_value f x) (+ (sum (natural_range (+ n 1)) (lambda (k) (* (/ (iterated_deriv_within (lambda (s) (fn_value f s)) k (closed_interval_between a x) a) (factorial k)) (^ (- x a) k)))) (/ (* (iterated_deriv_within (lambda (s) (fn_value f s)) (+ n 1) (closed_interval_between a x) c) (^ (- x a) (+ n 1))) (factorial (+ n 1)))))))))
  hard_negative:
    statement: C^∞級の関数はテイラー級数の和に常に等しい。
    reason: x≠0でexp(-1/x^2), f(0)=0はC^∞級で、0でのテイラー級数は恒等的に0だが、関数は0でない。
  target: |
    ∀ (f : ℝ → ℝ) (a x : ℝ) (n : ℕ), a ≠ x → ContDiffOn ℝ n f (Set.uIcc a x) → DifferentiableOn ℝ (iteratedDerivWithin n f (Set.uIcc a x)) (Set.uIoo a x) → ∃ c ∈ Set.uIoo a x, f x = ∑ k ∈ Finset.range (n + 1), iteratedDerivWithin k f (Set.uIcc a x) a / (k.factorial : ℝ) * (x - a) ^ k + iteratedDerivWithin (n + 1) f (Set.uIcc a x) c * (x - a) ^ (n + 1) / ((n + 1).factorial : ℝ)
  proof: |
    by
      intro f a x n hax hf hd
      obtain ⟨c, hc, e⟩ := taylor_mean_remainder_lagrange hax hf hd
      refine ⟨c, hc, ?_⟩
      rw [taylor_within_apply] at e
      have hs : ∑ k ∈ Finset.range (n + 1), iteratedDerivWithin k f (Set.uIcc a x) a / (k.factorial : ℝ) * (x - a) ^ k = ∑ k ∈ Finset.range (n + 1), ((k.factorial : ℝ)⁻¹ * (x - a) ^ k) • iteratedDerivWithin k f (Set.uIcc a x) a := by
        refine Finset.sum_congr rfl fun k _ => ?_
        rw [smul_eq_mul]
        ring
      rw [hs, ← e]
      ring
- id: taylor_second_order
  kind: gap
  level: 1
  topic: テイラーの定理・2次の展開
  statement: $a<b$とし、$f,f_1,f_2:\mathbb{R}\to\mathbb{R}$について、全ての$x$で$f$の微分係数が$f_1(x)$、$f_1$の微分係数が$f_2(x)$ならば、ある$c\in(a,b)$で$f(b)=f(a)+f_1(a)(b-a)+f_2(c)(b-a)^2/2$である。
