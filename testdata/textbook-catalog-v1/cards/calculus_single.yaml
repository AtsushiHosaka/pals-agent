- id: limit_epsilon_delta
  kind: textbook
  level: 1
  topic: 関数の極限・ε-δ論法
  statement: 関数fについて、x→aでf(x)→Lであることは、任意のε>0に対しあるδ>0が存在して、0<|x-a|<δならば|f(x)-L|<εとなることと同値である。
  statement_en: For f on the reals, f(x) tends to L as x tends to a with x different from a if and only if for every ε > 0 there is δ > 0 such that x ≠ a and |x-a| < δ imply |f(x)-L| < ε.
  assumptions: ["fは実数上の実数値関数"]
  quantifiers: ["任意の関数fと実数a, L"]
  conclusion: 除外近傍での極限はε-δ条件と同値である。
  answer: |
    極限の定義は、Lの任意の近傍の逆像がaの除外近傍を含むことである。実数の距離は絶対値の差で与えられ、Lの近傍の基本系は開区間(L-ε,L+ε)である。aの除外近傍の基本系は{x | x≠a, |x-a|<δ}である。この基本系で定義を書き換えると、ε-δ条件そのものが得られる。
  strategy: Rewrite the punctured-neighborhood limit in the metric basis of neighborhoods.
  sketch:
    - "translate: Express the filter limit using balls around L and punctured balls around a."
    - "derive: Replace dist by the absolute value of the difference."
    - "conclude: The resulting condition is the ε-δ condition."
  openmath: (forall (f a L) (<-> (fn_limit_at (lambda (x) (fn_value f x)) a L) (forall (e) (-> (> e 0) (exists (d) (and (> d 0) (forall (x) (-> (and (!= x a) (< (abs (- x a)) d)) (< (abs (- (fn_value f x) L)) e)))))))))
  hard_negative:
    statement: 極限の定義で量化子を入れ替え、あるδ>0が全てのε>0に対して同時に条件を満たすとしても同値である。
    reason: その条件はaの除外近傍でf=Lとなることを意味する。f(x)=x, a=0, L=0は極限の定義を満たすが、この条件を満たさない。
  target: |
    ∀ (f : ℝ → ℝ) (a L : ℝ), Filter.Tendsto f (nhdsWithin a {a}ᶜ) (nhds L) ↔ ∀ ε > 0, ∃ δ > 0, ∀ x, x ≠ a → |x - a| < δ → |f x - L| < ε
  proof: |
    by
      intro f a L
      simp only [Metric.tendsto_nhdsWithin_nhds, Real.dist_eq, Set.mem_compl_iff, Set.mem_singleton_iff]

- id: limit_unique
  kind: gap
  level: 1
  topic: 関数の極限・一意性
  statement: x→aでの関数fの極限は、存在すれば一意である。
  statement_en: If f(x) tends to L and to M as x tends to a with x ≠ a, then L = M.
  assumptions: ["x→aでf(x)→L", "x→aでf(x)→M"]
  quantifiers: ["任意の関数fと実数a, L, M"]
  conclusion: L=Mである。
  answer: |
    L≠Mと仮定し、ε=|L-M|/2とする。十分aに近いx≠aでは|f(x)-L|<εかつ|f(x)-M|<εである。そのようなxはaの任意の近くに存在する。三角不等式より|L-M|<2ε=|L-M|となり矛盾する。
  strategy: Separate two distinct limits by disjoint neighborhoods and use that the punctured neighborhood is nonempty.
  sketch:
    - "contradiction: Suppose L ≠ M and put ε = |L-M|/2."
    - "derive: Choose x ≠ a close to a so that f(x) is within ε of both L and M."
    - "derive: The triangle inequality gives |L-M| < 2ε."
    - "conclude: This contradicts the choice of ε."
  openmath: (forall (f a L M) (-> (and (fn_limit_at (lambda (x) (fn_value f x)) a L) (fn_limit_at (lambda (x) (fn_value f x)) a M)) (= L M)))
  hard_negative:
    statement: fの定義域がaの近くに点をもたない場合でも、極限の一意性は同じ定義のもとで成り立つ。
    reason: aの近くに定義域の点がなければ条件は空虚に満たされ、任意の値が極限の条件を満たしてしまう。
  target: |
    ∀ (f : ℝ → ℝ) (a L M : ℝ), Filter.Tendsto f (nhdsWithin a {a}ᶜ) (nhds L) → Filter.Tendsto f (nhdsWithin a {a}ᶜ) (nhds M) → L = M
  proof: |
    by
      intro f a L M hL hM
      exact tendsto_nhds_unique hL hM

- id: limit_preserves_weak_order
  kind: gap
  level: 1
  topic: 関数の極限・大小関係
  statement: a以外の全てのxでf(x)≤g(x)であり、x→aでf(x)→L、g(x)→Mならば、L≤Mである。
  statement_en: If f(x) ≤ g(x) for all x ≠ a, and f → L and g → M as x → a, then L ≤ M.
  assumptions: ["x≠aでf(x)≤g(x)", "x→aでf(x)→L", "x→aでg(x)→M"]
  quantifiers: ["任意の関数f, gと実数a, L, M"]
  conclusion: L≤Mである。
  answer: |
    L>Mと仮定し、ε=(L-M)/2とする。十分aに近いx≠aではf(x)>L-εかつg(x)<M+εである。L-ε=M+εなのでg(x)<f(x)となり、仮定に反する。
  strategy: Argue by contradiction with a band of half the gap.
  sketch:
    - "contradiction: Assume L > M and set ε = (L-M)/2."
    - "derive: Near a, f(x) > L-ε and g(x) < M+ε."
    - "conclude: Since L-ε = M+ε this gives g(x) < f(x), a contradiction."
  openmath: (forall (f g a L M) (-> (and (forall (x) (-> (!= x a) (<= (fn_value f x) (fn_value g x)))) (fn_limit_at (lambda (x) (fn_value f x)) a L) (fn_limit_at (lambda (x) (fn_value g x)) a M)) (<= L M)))
  hard_negative:
    statement: x≠aでf(x)<g(x)ならば、極限についてもL<Mが成り立つ。
    reason: f(x)=0, g(x)=x^2, a=0とするとx≠aでf(x)<g(x)だが、極限はともに0である。
  target: |
    ∀ (f g : ℝ → ℝ) (a L M : ℝ), (∀ x, x ≠ a → f x ≤ g x) → Filter.Tendsto f (nhdsWithin a {a}ᶜ) (nhds L) → Filter.Tendsto g (nhdsWithin a {a}ᶜ) (nhds M) → L ≤ M
  proof: |
    by
      intro f g a L M h hf hg
      refine le_of_tendsto_of_tendsto hf hg ?_
      filter_upwards [self_mem_nhdsWithin] with x hx
      exact h x hx

- id: limit_sequential_criterion
  kind: textbook
  level: 1
  topic: 関数の極限・点列による特徴づけ
  statement: x→aでf(x)→Lであることは、aと異なる値をとりaに収束する任意の実数列(x_n)に対してf(x_n)→Lとなることと同値である。
  statement_en: f(x) → L as x → a with x ≠ a if and only if f(x_n) → L for every real sequence (x_n) with x_n ≠ a for all n and x_n → a.
  assumptions: ["fは実数上の実数値関数"]
  quantifiers: ["任意の関数fと実数a, L", "aと異なる値をとる任意の実数列(x_n)"]
  conclusion: 関数の極限は点列による条件と同値である。
  answer: |
    極限があるとする。x_n→aかつx_n≠aならば、十分大きなnで0<|x_n-a|<δとなるので、f(x_n)→Lである。逆に極限がLでないとすると、あるε>0が存在して、各nに対し0<|x_n-a|<1/(n+1)かつ|f(x_n)-L|≥εを満たすx_nがとれる。この点列はaに収束するが、f(x_n)はLに収束せず、仮定に反する。
  strategy: Use first countability of the punctured neighborhood filter; shift indices to meet the everywhere-different condition.
  sketch:
    - "derive: The forward direction composes the limit with a sequence tending to a inside the punctured neighborhood."
    - "contradiction: If the limit fails, some ε > 0 has witnesses in each shrinking punctured ball."
    - "construct: The witnesses form a sequence x_n ≠ a with x_n → a."
    - "conclude: Then f(x_n) stays ε away from L, contradicting the hypothesis."
  openmath: (forall (f a L) (<-> (fn_limit_at (lambda (t) (fn_value f t)) a L) (forall (x) (-> (and (forall (n) (!= (seq_value x n) a)) (seq_tends_to x a)) (seq_tends_to (seq_map f x) L)))))
  hard_negative:
    statement: aと異なる値をとりaに収束するある実数列(x_n)についてf(x_n)→Lならば、x→aでf(x)→Lである。
    reason: f(x)=sin(1/x), a=0, x_n=1/(nπ+π)とするとf(x_n)=0→0だが、fはx→0で収束しない。
  target: |
    ∀ (f : ℝ → ℝ) (a L : ℝ), Filter.Tendsto f (nhdsWithin a {a}ᶜ) (nhds L) ↔ ∀ x : ℕ → ℝ, (∀ n, x n ≠ a) → Filter.Tendsto x Filter.atTop (nhds a) → Filter.Tendsto (fun n => f (x n)) Filter.atTop (nhds L)
  proof: |
    by
      intro f a L
      constructor
      · intro h x hx hxa
        exact h.comp (tendsto_nhdsWithin_iff.mpr ⟨hxa, Filter.Eventually.of_forall hx⟩)
      · intro h
        rw [Filter.tendsto_iff_seq_tendsto]
        intro x hx
        obtain ⟨hx1, hx2⟩ := tendsto_nhdsWithin_iff.mp hx
        obtain ⟨N, hN⟩ := Filter.eventually_atTop.mp hx2
        have h2 := h (fun n => x (n + N)) (fun n => hN _ (Nat.le_add_left _ _)) ((Filter.tendsto_add_atTop_iff_nat N).mpr hx1)
        exact (Filter.tendsto_add_atTop_iff_nat (f := f ∘ x) N).mp h2

- id: continuity_epsilon_delta
  kind: textbook
  level: 1
  topic: 連続性・ε-δ論法
  statement: fがaで連続であることは、任意のε>0に対しあるδ>0が存在して、|x-a|<δならば|f(x)-f(a)|<εとなることと同値である。
  statement_en: f is continuous at a if and only if for every ε > 0 there is δ > 0 such that |x-a| < δ implies |f(x)-f(a)| < ε.
  assumptions: ["fは実数上の実数値関数"]
  quantifiers: ["任意の関数fと実数a"]
  conclusion: 点aでの連続性はε-δ条件と同値である。
  answer: |
    点aでの連続性は、f(a)の任意の近傍の逆像がaの近傍であることを意味する。実数では近傍の基本系は開区間で与えられ、距離は絶対値の差である。この基本系で書き換えると、述べられた条件が得られる。
  strategy: Rewrite continuity at a point in the metric neighborhood basis.
  sketch:
    - "translate: Express continuity at a with balls around a and f(a)."
    - "conclude: Replacing dist by |x-a| gives the ε-δ condition."
  openmath: (forall (f a) (<-> (fn_continuous_at (lambda (x) (fn_value f x)) a) (forall (e) (-> (> e 0) (exists (d) (and (> d 0) (forall (x) (-> (< (abs (- x a)) d) (< (abs (- (fn_value f x) (fn_value f a))) e)))))))))
  hard_negative:
    statement: δをxごとに選べる形にした条件、すなわち任意のε>0と任意のxに対しあるδ>0が存在して|x-a|<δならば|f(x)-f(a)|<εという条件は、連続性と同値である。
    reason: x≠aならδ=|x-a|とすると|x-a|<δは成り立たず、条件は空虚に満たされる。x=aでは|f(a)-f(a)|=0<εである。よって不連続な関数でもこの条件は成り立つ。
  target: |
    ∀ (f : ℝ → ℝ) (a : ℝ), ContinuousAt f a ↔ ∀ ε > 0, ∃ δ > 0, ∀ x, |x - a| < δ → |f x - f a| < ε
  proof: |
    by
      intro f a
      simp only [Metric.continuousAt_iff, Real.dist_eq]

- id: continuity_iff_one_sided_limits
  kind: gap
  level: 1
  topic: 片側極限・連続性
  statement: fがaで連続であることは、x→a-とx→a+での片側極限がともにf(a)であることと同値である。
  statement_en: f is continuous at a if and only if both the left limit and the right limit of f at a exist and equal f(a).
  assumptions: ["fは実数上の実数値関数"]
  quantifiers: ["任意の関数fと実数a"]
  conclusion: 連続性は左右の片側極限がf(a)に一致することと同値である。
  answer: |
    連続なら、片側に制限しても極限はf(a)である。逆に左右の極限がともにf(a)であるとする。ε>0に対し、左側で有効なδ_1と右側で有効なδ_2をとる。δ=min(δ_1,δ_2)とすれば、x=aの場合も含めて|x-a|<δのとき|f(x)-f(a)|<εとなるので、fはaで連続である。
  strategy: Split the neighborhood of a into the left part, the point a, and the right part.
  sketch:
    - "derive: Continuity restricts to each side, giving both one-sided limits."
    - "setup: Conversely fix ε > 0 and take δ₁ on the left and δ₂ on the right."
    - "derive: With δ = min(δ₁, δ₂) the bound holds on both sides and trivially at x = a."
    - "conclude: Hence f is continuous at a."
  openmath: (forall (f a) (<-> (fn_continuous_at (lambda (x) (fn_value f x)) a) (and (fn_left_limit_at (lambda (x) (fn_value f x)) a (fn_value f a)) (fn_right_limit_at (lambda (x) (fn_value f x)) a (fn_value f a)))))
  hard_negative:
    statement: 左右の片側極限が存在して互いに等しければ、fはaで連続である。
    reason: 片側極限が等しくてもf(a)と異なれば不連続である。x≠0でf(x)=0, f(0)=1がその例である。
  target: |
    ∀ (f : ℝ → ℝ) (a : ℝ), ContinuousAt f a ↔ Filter.Tendsto f (nhdsWithin a (Set.Iio a)) (nhds (f a)) ∧ Filter.Tendsto f (nhdsWithin a (Set.Ioi a)) (nhds (f a))
  proof: |
    by
      intro f a
      exact continuousAt_iff_continuous_left'_right'

- id: monotone_right_limit_exists
  kind: textbook
  level: 2
  topic: 片側極限・単調関数
  statement: 実数全体で単調増加な関数fは各点aで右極限をもち、その値はx>aでのf(x)の下限である。
  statement_en: If f is nondecreasing on the reals, then at each a the right limit of f exists and equals the infimum of f(x) over x > a.
  assumptions: ["fは実数全体で単調増加"]
  quantifiers: ["任意の単調増加関数fと実数a"]
  conclusion: x→a+でf(x)→inf{f(x) | x>a}である。
  answer: |
    x>aではf(a)≤f(x)なので、集合{f(x) | x>a}は下に有界で、下限mが存在する。ε>0に対し、下限の定義よりf(y)<m+εとなるy>aがとれる。a<x<yならば単調性からm≤f(x)≤f(y)<m+εである。したがってx→a+でf(x)→mである。
  strategy: Show the infimum exists from the bound f(a), then use monotonicity on (a, y).
  sketch:
    - "derive: The set of values for x > a is bounded below by f(a), so its infimum m exists."
    - "construct: For ε > 0 pick y > a with f(y) < m + ε."
    - "derive: For a < x < y monotonicity gives m ≤ f(x) < m + ε."
    - "conclude: Therefore the right limit is m."
  openmath: (forall (f a) (-> (fn_monotone (lambda (x) (fn_value f x))) (fn_right_limit_at (lambda (x) (fn_value f x)) a (infimum_on_right (lambda (x) (fn_value f x)) a))))
  hard_negative:
    statement: 単調増加関数の右極限は常にf(a)に等しい。
    reason: x≤0でf(x)=0, x>0でf(x)=1とすると単調増加だが、0での右極限は1でf(0)=0と異なる。
  target: |
    ∀ (f : ℝ → ℝ) (a : ℝ), Monotone f → Filter.Tendsto f (nhdsWithin a (Set.Ioi a)) (nhds (sInf (f '' Set.Ioi a)))
  proof: |
    by
      intro f a hf
      exact hf.tendsto_nhdsGT a

- id: monotone_bounded_limit_at_infinity
  kind: gap
  level: 1
  topic: 無限遠での極限・単調有界
  statement: 実数全体で単調増加かつ上に有界な関数fは、x→+∞で収束する。
  statement_en: A nondecreasing function on the reals that is bounded above converges as x tends to +∞.
  assumptions: ["fは単調増加", "ある実数Mで全てのxについてf(x)≤M"]
  quantifiers: ["任意の関数f", "ある実数L"]
  conclusion: x→+∞でf(x)はある実数Lに収束する。
  answer: |
    値域は上に有界なので上限Lが存在する。ε>0に対し、上限の定義よりf(y)>L-εとなるyがとれる。x≥yならば単調性からL-ε<f(y)≤f(x)≤Lである。よってf(x)→Lである。
  strategy: Take the supremum of the range and use monotonicity past a near-supremum point.
  sketch:
    - "derive: The range is bounded above, so it has a supremum L."
    - "construct: For ε > 0 pick y with f(y) > L - ε."
    - "conclude: For x ≥ y, L - ε < f(x) ≤ L, so f(x) → L."
  openmath: (forall (f) (-> (and (fn_monotone (lambda (x) (fn_value f x))) (exists (M) (forall (x) (<= (fn_value f x) M)))) (exists (L) (fn_limit_at_top (lambda (x) (fn_value f x)) L))))
  hard_negative:
    statement: 上に有界な関数はx→+∞で収束する。
    reason: sin xは有界だが、x→+∞で収束しない。単調性が必要である。
  target: |
    ∀ (f : ℝ → ℝ), Monotone f → (∃ M, ∀ x, f x ≤ M) → ∃ L, Filter.Tendsto f Filter.atTop (nhds L)
  proof: |
    by
      rintro f hf ⟨M, hM⟩
      exact ⟨_, tendsto_atTop_ciSup hf ⟨M, by rintro _ ⟨x, rfl⟩; exact hM x⟩⟩

- id: intermediate_value_theorem
  kind: named
  level: 1
  topic: 連続性・中間値の定理
  statement: 中間値の定理。fが閉区間[a,b]で連続で、uがf(a)とf(b)の間の値ならば、f(c)=uとなるc∈[a,b]が存在する。
  statement_en: Intermediate value theorem. If f is continuous on [a,b] with a ≤ b and u lies between f(a) and f(b), then f(c) = u for some c in [a,b].
  assumptions: ["a≤b", "fは[a,b]で連続", "uはf(a)とf(b)の間の値"]
  quantifiers: ["任意の関数fと実数a, b, u", "あるc∈[a,b]"]
  conclusion: f(c)=uとなるc∈[a,b]が存在する。
  answer: |
    f(a)≤u≤f(b)の場合を示す。逆向きの場合は-fと-uに同じ議論を適用すればよい。S={x∈[a,b] | f(x)≤u}はaを含み上に有界なので、c=sup Sが存在する。Sの点列でcに近づくものをとると、連続性よりf(c)≤uである。c<bでf(c)<uなら、連続性によりcより少し大きい点もSに入り、cが上限であることに反する。c=bならf(b)≥uとf(c)≤uからf(c)=uである。よってどの場合もf(c)=uとなる。
  strategy: Take the supremum of the sublevel set and rule out strict inequality by continuity.
  sketch:
    - "setup: Reduce to f(a) ≤ u ≤ f(b) by replacing f with -f if needed."
    - "construct: Let c be the supremum of {x in [a,b] : f(x) ≤ u}."
    - "derive: Continuity gives f(c) ≤ u."
    - "contradiction: If f(c) < u and c < b, points just right of c also lie in the set."
    - "conclude: Thus f(c) = u."
  openmath: (forall (f a b u) (-> (and (<= a b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (or (and (<= (fn_value f a) u) (<= u (fn_value f b))) (and (<= (fn_value f b) u) (<= u (fn_value f a))))) (exists (c) (and (in c (closed_interval a b)) (= (fn_value f c) u)))))
  hard_negative:
    statement: fが[a,b]で各点の左右の極限をもつだけで、f(a)とf(b)の間の値はすべてとられる。
    reason: x<0で-1、x≥0で1の関数は片側極限をもつが、0という値をとらない。
  target: |
    ∀ (f : ℝ → ℝ) (a b u : ℝ), a ≤ b → ContinuousOn f (Set.Icc a b) → ((f a ≤ u ∧ u ≤ f b) ∨ (f b ≤ u ∧ u ≤ f a)) → ∃ c ∈ Set.Icc a b, f c = u
  proof: |
    by
      intro f a b u hab hf hu
      rcases hu with h | h
      · obtain ⟨c, hc, e⟩ := intermediate_value_Icc hab hf h
        exact ⟨c, hc, e⟩
      · obtain ⟨c, hc, e⟩ := intermediate_value_Icc' hab hf h
        exact ⟨c, hc, e⟩

- id: extreme_value_theorem
  kind: named
  level: 1
  topic: 連続性・最大値最小値の定理
  statement: 最大値・最小値の定理。閉区間[a,b]（a≤b）で連続な関数fは、[a,b]上で最大値と最小値をとる。
  statement_en: Extreme value theorem. A function continuous on a closed interval [a,b] with a ≤ b attains a minimum and a maximum on [a,b].
  assumptions: ["a≤b", "fは[a,b]で連続"]
  quantifiers: ["任意の関数fと実数a, b", "あるx, y∈[a,b]"]
  conclusion: 全てのt∈[a,b]でf(x)≤f(t)≤f(y)となるx, yが存在する。
  answer: |
    最大値の場合を示す。最小値は-fに適用すれば得られる。まず値域が上に有界でないとすると、f(x_n)>nとなる点列x_n∈[a,b]がとれる。ボルツァーノ・ワイエルシュトラスの定理より収束部分列x_{n_k}→c∈[a,b]があり、連続性からf(x_{n_k})→f(c)となって矛盾する。よって上限Mが存在する。f(y_n)→Mとなる点列y_n∈[a,b]の収束部分列の極限をyとすると、連続性からf(y)=Mである。
  strategy: Use sequential compactness of [a,b] first for boundedness and then to attain the supremum.
  sketch:
    - "contradiction: An unbounded f gives points x_n with f(x_n) > n."
    - "apply_theorem: Bolzano-Weierstrass gives a convergent subsequence in [a,b]."
    - "derive: Continuity makes f(x_{n_k}) convergent, contradicting unboundedness."
    - "construct: Take a sequence with f(y_n) → sup f and a convergent subsequence with limit y."
    - "conclude: Continuity gives f(y) = sup f; apply the same to -f for the minimum."
  openmath: (forall (f a b) (-> (and (<= a b) (fn_continuous_on (lambda (t) (fn_value f t)) (closed_interval a b))) (exists (x y) (and (in x (closed_interval a b)) (in y (closed_interval a b)) (forall (t) (-> (in t (closed_interval a b)) (and (<= (fn_value f x) (fn_value f t)) (<= (fn_value f t) (fn_value f y)))))))))
  hard_negative:
    statement: 開区間(a,b)で連続な関数は(a,b)上で最大値をとる。
    reason: (0,1)上のf(x)=1/xは連続だが上に有界でなく、最大値をとらない。
  target: |
    ∀ (f : ℝ → ℝ) (a b : ℝ), a ≤ b → ContinuousOn f (Set.Icc a b) → ∃ x ∈ Set.Icc a b, ∃ y ∈ Set.Icc a b, ∀ t ∈ Set.Icc a b, f x ≤ f t ∧ f t ≤ f y
  proof: |
    by
      intro f a b hab hf
      have hne : (Set.Icc a b).Nonempty := Set.nonempty_Icc.mpr hab
      obtain ⟨x, hx, hxm⟩ := isCompact_Icc.exists_isMinOn hne hf
      obtain ⟨y, hy, hym⟩ := isCompact_Icc.exists_isMaxOn hne hf
      exact ⟨x, hx, y, hy, fun t ht => ⟨isMinOn_iff.mp hxm t ht, isMaxOn_iff.mp hym t ht⟩⟩

- id: continuous_bounded_on_closed_interval
  kind: gap
  level: 1
  topic: 連続性・有界性
  statement: 閉区間[a,b]で連続な関数は、[a,b]上で有界である。
  statement_en: A function continuous on a closed interval [a,b] is bounded on [a,b].
  assumptions: ["fは[a,b]で連続"]
  quantifiers: ["任意の関数fと実数a, b", "ある実数C"]
  conclusion: 全てのx∈[a,b]で|f(x)|≤Cとなる実数Cが存在する。
  answer: |
    有界でないとすると、|f(x_n)|>nとなる点列x_n∈[a,b]がとれる。ボルツァーノ・ワイエルシュトラスの定理より収束部分列をとると、その極限cは[a,b]に属する。連続性からf(x_{n_k})→f(c)となり、これは|f(x_{n_k})|→∞に矛盾する。
  strategy: A sequence violating boundedness has a convergent subsequence, contradicting continuity.
  sketch:
    - "contradiction: Suppose |f(x_n)| > n for points x_n in [a,b]."
    - "apply_theorem: Extract a subsequence converging to some c in [a,b]."
    - "conclude: Continuity forces f along the subsequence to converge, a contradiction."
  openmath: (forall (f a b) (-> (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (exists (C) (forall (x) (-> (in x (closed_interval a b)) (<= (abs (fn_value f x)) C))))))
  hard_negative:
    statement: 半開区間(a,b]で連続な関数は有界である。
    reason: (0,1]上のf(x)=1/xは連続だが有界でない。
  target: |
    ∀ (f : ℝ → ℝ) (a b : ℝ), ContinuousOn f (Set.Icc a b) → ∃ C, ∀ x ∈ Set.Icc a b, |f x| ≤ C
  proof: |
    by
      intro f a b hf
      simpa only [Real.norm_eq_abs] using isCompact_Icc.exists_bound_of_continuousOn hf

- id: fixed_point_unit_interval
  kind: gap
  level: 1
  topic: 連続性・不動点
  statement: fが[0,1]で連続で[0,1]を[0,1]の中へ写すならば、f(c)=cとなるc∈[0,1]が存在する。
  statement_en: If f is continuous on [0,1] and maps [0,1] into itself, then f has a fixed point c in [0,1].
  assumptions: ["fは[0,1]で連続", "x∈[0,1]ならばf(x)∈[0,1]"]
  quantifiers: ["任意の関数f", "あるc∈[0,1]"]
  conclusion: f(c)=cとなるc∈[0,1]が存在する。
  answer: |
    g(x)=f(x)-xとおくと、gは[0,1]で連続である。f(0)≥0よりg(0)≥0であり、f(1)≤1よりg(1)≤0である。中間値の定理より、g(c)=0となるc∈[0,1]が存在する。このcがf(c)=cを満たす。
  strategy: Apply the intermediate value theorem to f(x) - x.
  sketch:
    - "construct: Define g(x) = f(x) - x, continuous on [0,1]."
    - "derive: g(0) ≥ 0 and g(1) ≤ 0 since f maps into [0,1]."
    - "apply_theorem: The intermediate value theorem yields c with g(c) = 0."
    - "conclude: Then f(c) = c."
  openmath: (forall (f) (-> (and (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval 0 1)) (forall (x) (-> (in x (closed_interval 0 1)) (in (fn_value f x) (closed_interval 0 1))))) (exists (c) (and (in c (closed_interval 0 1)) (= (fn_value f c) c)))))
  hard_negative:
    statement: fが開区間(0,1)で連続で(0,1)を(0,1)の中へ写すならば不動点をもつ。
    reason: f(x)=x/2は(0,1)を(0,1)の中へ写す連続関数だが、(0,1)に不動点をもたない。
  target: |
    ∀ (f : ℝ → ℝ), ContinuousOn f (Set.Icc 0 1) → (∀ x ∈ Set.Icc (0 : ℝ) 1, f x ∈ Set.Icc (0 : ℝ) 1) → ∃ c ∈ Set.Icc (0 : ℝ) 1, f c = c
  proof: |
    by
      intro f hf hm
      have hg : ContinuousOn (fun x => f x - x) (Set.Icc (0 : ℝ) 1) := hf.sub continuousOn_id
      have h0 := (hm 0 (Set.left_mem_Icc.mpr zero_le_one)).1
      have h1 := (hm 1 (Set.right_mem_Icc.mpr zero_le_one)).2
      obtain ⟨c, hc, e⟩ := intermediate_value_Icc' (zero_le_one' ℝ) hg (show (0 : ℝ) ∈ Set.Icc (f 1 - 1) (f 0 - 0) from ⟨by linarith, by linarith⟩)
      exact ⟨c, hc, by simpa [sub_eq_zero] using e⟩

- id: continuous_injective_strictly_monotone
  kind: textbook
  level: 1
  topic: 連続性・単射と単調性
  statement: 実数全体で連続かつ単射な関数は、狭義単調増加または狭義単調減少である。
  statement_en: A continuous injective function on the reals is strictly increasing or strictly decreasing.
  assumptions: ["fは実数全体で連続", "fは単射"]
  quantifiers: ["任意の関数f"]
  conclusion: fは狭義単調増加または狭義単調減少である。
  answer: |
    T={(x,y) | x<y}は平面の凸集合である。g(x,y)=f(y)-f(x)はT上で連続で、単射性からT上で0にならない。Tの2点を結ぶ線分はTに含まれるので、線分上で中間値の定理を用いると、gの符号はT上で一定である。正ならfは狭義単調増加であり、負なら狭義単調減少である。
  strategy: The difference f(y) - f(x) is continuous and nonvanishing on the convex set of pairs x < y, so it has constant sign.
  sketch:
    - "construct: Let T be the convex set of pairs (x, y) with x < y and put g(x, y) = f(y) - f(x)."
    - "derive: g is continuous on T and has no zero because f is injective."
    - "apply_theorem: The intermediate value theorem on segments in T shows that g has constant sign."
    - "conclude: A positive sign means f is strictly increasing, a negative sign strictly decreasing."
  openmath: (forall (f) (-> (and (fn_continuous (lambda (x) (fn_value f x))) (fn_injective (lambda (x) (fn_value f x)))) (or (fn_strict_mono (lambda (x) (fn_value f x))) (fn_strict_anti (lambda (x) (fn_value f x))))))
  hard_negative:
    statement: 実数全体で単射な関数は、連続でなくても単調である。
    reason: f(0)=1, f(1)=0で他の点ではf(x)=xとすると単射だが単調ではない。
  target: |
    ∀ (f : ℝ → ℝ), Continuous f → Function.Injective f → StrictMono f ∨ StrictAnti f
  proof: |
    by
      intro f hf hi
      exact hf.strictMono_of_inj hi

- id: differentiable_implies_continuous
  kind: gap
  level: 1
  topic: 微分・連続性との関係
  statement: fがaで微分可能ならば、fはaで連続である。
  statement_en: If f has derivative u at a, then f is continuous at a.
  assumptions: ["fはaで微分可能で微分係数はu"]
  quantifiers: ["任意の関数fと実数a, u"]
  conclusion: fはaで連続である。
  answer: |
    x≠aのときf(x)-f(a)=((f(x)-f(a))/(x-a))(x-a)と書ける。x→aで第1因子はuに、第2因子は0に収束するので、積は0に収束する。よってf(x)→f(a)であり、fはaで連続である。
  strategy: Write the increment as the difference quotient times x - a.
  sketch:
    - "derive: f(x)-f(a) equals the difference quotient times (x-a) for x ≠ a."
    - "derive: The product tends to u · 0 = 0 as x → a."
    - "conclude: Hence f(x) → f(a)."
  openmath: (forall (f a u) (-> (has_deriv_at (lambda (x) (fn_value f x)) u a) (fn_continuous_at (lambda (x) (fn_value f x)) a)))
  hard_negative:
    statement: fがaで連続ならば、fはaで微分可能である。
    reason: f(x)=|x|は0で連続だが、0で微分可能でない。
  target: |
    ∀ (f : ℝ → ℝ) (a u : ℝ), HasDerivAt f u a → ContinuousAt f a
  proof: |
    by
      intro f a u hf
      exact hf.continuousAt

- id: chain_rule
  kind: textbook
  level: 1
  topic: 微分法・合成関数の微分
  statement: fがaで微分可能で微分係数がu、gがf(a)で微分可能で微分係数がvならば、g∘fはaで微分可能で微分係数はvuである。
  statement_en: If f has derivative u at a and g has derivative v at f(a), then g ∘ f has derivative v·u at a.
  assumptions: ["fはaで微分可能で微分係数はu", "gはf(a)で微分可能で微分係数はv"]
  quantifiers: ["任意の関数f, gと実数a, u, v"]
  conclusion: g∘fのaでの微分係数はvuである。
  answer: |
    g(y)-g(f(a))=(v+ε(y))(y-f(a))とおく。ここでε(f(a))=0とすれば、εはf(a)で連続である。y=f(x)を代入してx-aで割ると、x≠aで(g(f(x))-g(f(a)))/(x-a)=(v+ε(f(x)))(f(x)-f(a))/(x-a)となる。fはaで連続なのでε(f(x))→0であり、右辺はvuに収束する。
  strategy: Use the Carathéodory form of differentiability of g to avoid dividing by f(x)-f(a).
  sketch:
    - "construct: Write g(y)-g(f(a)) = (v+ε(y))(y-f(a)) with ε continuous at f(a) and ε(f(a)) = 0."
    - "derive: Substitute y = f(x) and divide by x-a."
    - "derive: Continuity of f at a gives ε(f(x)) → 0."
    - "conclude: The quotient tends to v·u."
  openmath: (forall (f g a u v) (-> (and (has_deriv_at (lambda (x) (fn_value f x)) u a) (has_deriv_at (lambda (y) (fn_value g y)) v (fn_value f a))) (has_deriv_at (lambda (x) (fn_value g (fn_value f x))) (* v u) a)))
  hard_negative:
    statement: g∘fがaで微分可能ならば、gはf(a)で微分可能である。
    reason: fが定数関数ならg∘fは常に微分可能だが、gには何も条件が課されない。
  target: |
    ∀ (f g : ℝ → ℝ) (a u v : ℝ), HasDerivAt f u a → HasDerivAt g v (f a) → HasDerivAt (fun x => g (f x)) (v * u) a
  proof: |
    by
      intro f g a u v hf hg
      exact hg.comp a hf

- id: product_rule
  kind: textbook
  level: 1
  topic: 微分法・積の微分
  statement: f, gがaで微分可能で微分係数がそれぞれu, vならば、積fgのaでの微分係数はug(a)+f(a)vである。
  statement_en: If f and g have derivatives u and v at a, then fg has derivative u·g(a) + f(a)·v at a.
  assumptions: ["fのaでの微分係数はu", "gのaでの微分係数はv"]
  quantifiers: ["任意の関数f, gと実数a, u, v"]
  conclusion: fgのaでの微分係数はug(a)+f(a)vである。
  answer: |
    f(x)g(x)-f(a)g(a)=(f(x)-f(a))g(x)+f(a)(g(x)-g(a))と分解してx-aで割る。微分可能な関数は連続なのでg(x)→g(a)である。よって差分商はug(a)+f(a)vに収束する。
  strategy: Add and subtract f(a)g(x) in the difference quotient.
  sketch:
    - "derive: Decompose the increment as (f(x)-f(a))g(x) + f(a)(g(x)-g(a))."
    - "apply_theorem: g is continuous at a because it is differentiable there."
    - "conclude: Passing to the limit gives u·g(a) + f(a)·v."
  openmath: (forall (f g a u v) (-> (and (has_deriv_at (lambda (x) (fn_value f x)) u a) (has_deriv_at (lambda (x) (fn_value g x)) v a)) (has_deriv_at (lambda (x) (* (fn_value f x) (fn_value g x))) (+ (* u (fn_value g a)) (* (fn_value f a) v)) a)))
  hard_negative:
    statement: 積fgの微分係数は常にuvである。
    reason: f(x)=g(x)=x, a=1では(x^2)'=2だが、uv=1である。
  target: |
    ∀ (f g : ℝ → ℝ) (a u v : ℝ), HasDerivAt f u a → HasDerivAt g v a → HasDerivAt (fun x => f x * g x) (u * g a + f a * v) a
  proof: |
    by
      intro f g a u v hf hg
      exact hf.mul hg

- id: quotient_rule
  kind: textbook
  level: 1
  topic: 微分法・商の微分
  statement: f, gがaで微分可能で微分係数がそれぞれu, vであり、g(a)≠0ならば、f/gのaでの微分係数は(ug(a)-f(a)v)/g(a)^2である。
  statement_en: If f and g have derivatives u and v at a and g(a) ≠ 0, then f/g has derivative (u·g(a) - f(a)·v)/g(a)² at a.
  assumptions: ["fのaでの微分係数はu", "gのaでの微分係数はv", "g(a)≠0"]
  quantifiers: ["任意の関数f, gと実数a, u, v"]
  conclusion: f/gのaでの微分係数は(ug(a)-f(a)v)/g(a)^2である。
  answer: |
    gはaで連続でg(a)≠0なので、aの近くでg(x)≠0である。このときf(x)/g(x)-f(a)/g(a)=((f(x)-f(a))g(a)-f(a)(g(x)-g(a)))/(g(x)g(a))となる。x-aで割ってx→aとすると、g(x)→g(a)より(ug(a)-f(a)v)/g(a)^2に収束する。
  strategy: Put the difference of quotients over a common denominator and pass to the limit.
  sketch:
    - "derive: Near a, g(x) ≠ 0 by continuity."
    - "derive: Combine f(x)/g(x) - f(a)/g(a) over the denominator g(x)g(a)."
    - "derive: Divide by x-a and split the numerator into the two difference quotients."
    - "conclude: The limit is (u·g(a) - f(a)·v)/g(a)²."
  openmath: (forall (f g a u v) (-> (and (has_deriv_at (lambda (x) (fn_value f x)) u a) (has_deriv_at (lambda (x) (fn_value g x)) v a) (!= (fn_value g a) 0)) (has_deriv_at (lambda (x) (/ (fn_value f x) (fn_value g x))) (/ (- (* u (fn_value g a)) (* (fn_value f a) v)) (^ (fn_value g a) 2)) a)))
  hard_negative:
    statement: 商の微分係数の分子はug(a)+f(a)vである。
    reason: f(x)=1, g(x)=x, a=1では(1/x)'=-1だが、その式では(0·1+1·1)/1=1となる。
  target: |
    ∀ (f g : ℝ → ℝ) (a u v : ℝ), HasDerivAt f u a → HasDerivAt g v a → g a ≠ 0 → HasDerivAt (fun x => f x / g x) ((u * g a - f a * v) / g a ^ 2) a
  proof: |
    by
      intro f g a u v hf hg hne
      exact hf.div hg hne

- id: power_rule_natural
  kind: gap
  level: 1
  topic: 微分法・べき関数
  statement: 自然数nに対し、x^(n+1)の導関数は(n+1)x^nである。
  statement_en: For a natural number n, the derivative of x^(n+1) at x is (n+1)x^n.
  assumptions: ["nは自然数"]
  quantifiers: ["任意の自然数nと実数x"]
  conclusion: y↦y^(n+1)のxでの微分係数は(n+1)x^nである。
  answer: |
    nに関する帰納法で示す。n=0では(y)'=1である。nで成り立つとすると、y^(n+2)=y^(n+1)·yに積の微分を用いて、(n+1)x^n·x+x^(n+1)=(n+2)x^(n+1)を得る。
  strategy: Induct on n with the product rule.
  sketch:
    - "induction: The base case is the derivative of y, which is 1."
    - "apply_theorem: Write y^(n+2) = y^(n+1)·y and use the product rule."
    - "conclude: The result simplifies to (n+2)x^(n+1)."
  openmath: (forall (n x) (-> (in n N) (has_deriv_at (lambda (y) (^ y (+ n 1))) (* (+ n 1) (^ x n)) x)))
  hard_negative:
    statement: 実数の指数pについて、x<0でも y^p の微分係数は常にpx^(p-1)である。
    reason: p=1/2ならx<0で実数値のy^pは定義されず、微分係数の式は意味をもたない。
  target: |
    ∀ (n : ℕ) (x : ℝ), HasDerivAt (fun y : ℝ => y ^ (n + 1)) (((n : ℝ) + 1) * x ^ n) x
  proof: |
    by
      intro n x
      simpa using hasDerivAt_pow (n + 1) x

- id: real_power_derivative
  kind: gap
  level: 1
  topic: 微分法・実数べき
  statement: x>0と実数pに対し、y^pのxでの微分係数はpx^(p-1)である。
  statement_en: For x > 0 and real p, the function y^p has derivative p·x^(p-1) at x.
  assumptions: ["x>0"]
  quantifiers: ["任意の実数x, p"]
  conclusion: y^pのxでの微分係数はpx^(p-1)である。
  answer: |
    y>0ではy^p=exp(p log y)である。合成関数の微分より、微分係数はexp(p log x)·p/x=x^p·p/xである。x^p/x=x^(p-1)なので、px^(p-1)となる。
  strategy: Write y^p as exp(p log y) and use the chain rule.
  sketch:
    - "translate: For y > 0, y^p = exp(p log y)."
    - "apply_theorem: The chain rule gives exp(p log x)·p/x."
    - "conclude: This equals p·x^(p-1)."
  openmath: (forall (x p) (-> (> x 0) (has_deriv_at (lambda (y) (^ y p)) (* p (^ x (- p 1))) x)))
  hard_negative:
    statement: 0<p<1のときも、y^pはx=0で微分係数px^(p-1)をもつ。
    reason: p=1/2では差分商は1/√hとなり、h→0+で発散する。
  target: |
    ∀ (x p : ℝ), 0 < x → HasDerivAt (fun y : ℝ => y ^ p) (p * x ^ (p - 1)) x
  proof: |
    by
      intro x p hx
      exact Real.hasDerivAt_rpow_const (Or.inl hx.ne')

- id: exp_composite_derivative
  kind: gap
  level: 1
  topic: 微分法・指数関数との合成
  statement: fのaでの微分係数がuならば、exp(f(x))のaでの微分係数はexp(f(a))uである。
  statement_en: If f has derivative u at a, then exp(f(x)) has derivative exp(f(a))·u at a.
  assumptions: ["fのaでの微分係数はu"]
  quantifiers: ["任意の関数fと実数a, u"]
  conclusion: exp(f(x))のaでの微分係数はexp(f(a))uである。
  answer: |
    指数関数の導関数は指数関数自身である。合成関数の微分により、exp(f(x))のaでの微分係数はexp(f(a))·uである。
  strategy: Apply the chain rule to exp and f.
  sketch:
    - "apply_theorem: exp has derivative exp(f(a)) at f(a)."
    - "conclude: The chain rule gives exp(f(a))·u."
  openmath: (forall (f a u) (-> (has_deriv_at (lambda (x) (fn_value f x)) u a) (has_deriv_at (lambda (x) (exp (fn_value f x))) (* (exp (fn_value f a)) u) a)))
  hard_negative:
    statement: exp(f(x))のaでの微分係数はexp(u)である。
    reason: f(x)=x, a=1ではu=1で両者は一致するが、f(x)=2x, a=0では微分係数は2でexp(2)と異なる。
  target: |
    ∀ (f : ℝ → ℝ) (a u : ℝ), HasDerivAt f u a → HasDerivAt (fun x => Real.exp (f x)) (Real.exp (f a) * u) a
  proof: |
    by
      intro f a u hf
      exact hf.exp

- id: log_composite_derivative
  kind: gap
  level: 1
  topic: 微分法・対数微分
  statement: fのaでの微分係数がuでf(a)>0ならば、log f(x)のaでの微分係数はu/f(a)である。
  statement_en: If f has derivative u at a and f(a) > 0, then log f(x) has derivative u/f(a) at a.
  assumptions: ["fのaでの微分係数はu", "f(a)>0"]
  quantifiers: ["任意の関数fと実数a, u"]
  conclusion: log f(x)のaでの微分係数はu/f(a)である。
  answer: |
    対数関数はf(a)>0で微分可能で、その微分係数は1/f(a)である。合成関数の微分により、log f(x)のaでの微分係数はu/f(a)である。
  strategy: Apply the chain rule to log and f.
  sketch:
    - "apply_theorem: log has derivative 1/f(a) at f(a) > 0."
    - "conclude: The chain rule gives u/f(a)."
  openmath: (forall (f a u) (-> (and (has_deriv_at (lambda (x) (fn_value f x)) u a) (> (fn_value f a) 0)) (has_deriv_at (lambda (x) (ln (fn_value f x))) (/ u (fn_value f a)) a)))
  hard_negative:
    statement: f(a)<0でも通常の実対数のlog f(x)はaで微分可能である。
    reason: 実対数は正の数にしか定義されないので、f(a)<0ではaの近くでlog f(x)が定義されない。log|f(x)|なら別の主張である。
  target: |
    ∀ (f : ℝ → ℝ) (a u : ℝ), HasDerivAt f u a → 0 < f a → HasDerivAt (fun x => Real.log (f x)) (u / f a) a
  proof: |
    by
      intro f a u hf hpos
      exact hf.log hpos.ne'

- id: trig_derivatives_sin_cos
  kind: gap
  level: 1
  topic: 微分法・三角関数
  statement: 任意の実数xで、sinのxでの微分係数はcos xであり、cosのxでの微分係数は-sin xである。
  statement_en: For every real x, sin has derivative cos x at x and cos has derivative -sin x at x.
  assumptions: ["xは実数"]
  quantifiers: ["任意の実数x"]
  conclusion: (sin x)'=cos x かつ (cos x)'=-sin x である。
  answer: |
    加法定理よりsin(x+h)-sin x=sin x(cos h-1)+cos x sin hである。h→0でsin h/h→1, (cos h-1)/h→0なので、差分商はcos xに収束する。cosも同様にcos(x+h)-cos x=cos x(cos h-1)-sin x sin hから-sin xを得る。
  strategy: Expand with the addition formulas and use the standard limits at zero.
  sketch:
    - "derive: Expand sin(x+h) and cos(x+h) with the addition formulas."
    - "apply_theorem: Use sin h / h → 1 and (cos h - 1)/h → 0."
    - "conclude: The difference quotients tend to cos x and -sin x."
  openmath: (forall (x) (and (has_deriv_at (lambda (y) (sin y)) (cos x) x) (has_deriv_at (lambda (y) (cos y)) (neg (sin x)) x)))
  hard_negative:
    statement: 度数法でのsinの導関数もcosに等しい。
    reason: 度数法ではsin(πx/180)を微分することになり、導関数に係数π/180が現れる。
  target: |
    ∀ x : ℝ, HasDerivAt Real.sin (Real.cos x) x ∧ HasDerivAt Real.cos (-Real.sin x) x
  proof: |
    by
      intro x
      exact ⟨Real.hasDerivAt_sin x, Real.hasDerivAt_cos x⟩

- id: arctan_derivative
  kind: gap
  level: 1
  topic: 微分法・逆三角関数
  statement: 任意の実数xで、arctanのxでの微分係数は1/(1+x^2)である。
  statement_en: For every real x, arctan has derivative 1/(1+x²) at x.
  assumptions: ["xは実数"]
  quantifiers: ["任意の実数x"]
  conclusion: arctanのxでの微分係数は1/(1+x^2)である。
  answer: |
    y=arctan xとおくとtan y=xであり、cos y≠0である。逆関数の微分より、微分係数は1/(1/cos^2 y)=cos^2 yである。1+tan^2 y=1/cos^2 yなので、cos^2 y=1/(1+x^2)となる。
  strategy: Differentiate the inverse of tan and rewrite with 1 + tan² = 1/cos².
  sketch:
    - "setup: Let y = arctan x so tan y = x and cos y ≠ 0."
    - "apply_theorem: The inverse function rule gives derivative cos² y."
    - "conclude: Using 1 + tan² y = 1/cos² y this is 1/(1+x²)."
  openmath: (forall (x) (has_deriv_at (lambda (y) (arctan_value y)) (/ 1 (+ 1 (^ x 2))) x))
  hard_negative:
    statement: arctanの微分係数は1/cos^2 xである。
    reason: それはtanの導関数である。x=0では一致するが、x=1で1/2と1/cos^2 1は異なる。
  target: |
    ∀ x : ℝ, HasDerivAt Real.arctan (1 / (1 + x ^ 2)) x
  proof: |
