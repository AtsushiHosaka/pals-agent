  answer: |
    $a<b$とし、$f,f_1,f_2:\mathbb{R}\to\mathbb{R}$について、全ての$x$で$f$の微分係数が$f_1(x)$、$f_1$の微分係数が$f_2(x)$であるとする。
    定数$K$を$f(b)=f(a)+f_1(a)(b-a)+K(b-a)^2/2$となるように定め、$g(x)=f(x)-f(a)-f_1(a)(x-a)-K(x-a)^2/2$とおく。$g(a)=g(b)=0$なので、ロルの定理より$g'(c_1)=0$となる$c_1\in(a,b)$が存在する。
    $g'(x)=f_1(x)-f_1(a)-K(x-a)$は$g'(a)=0=g'(c_1)$を満たす。$g'$は微分可能で$(g')'(x)=f_2(x)-K$なので、再びロルの定理より$f_2(c)-K=0$となる$c\in(a,c_1)\subset(a,b)$が存在する。この$c$について$K=f_2(c)$であり、$K$の定義式が結論を与える。
  strategy: Choose the constant making the error vanish at b, then apply Rolle's theorem twice.
  sketch:
  - 'construct: Choose K with f(b) = f(a) + f1(a)(b-a) + K(b-a)²/2.'
  - 'construct: Define g(x) = f(x) - f(a) - f1(a)(x-a) - K(x-a)²/2, so g(a) = g(b) = 0.'
  - 'apply_theorem: Rolle''s theorem gives c1 in (a,b) with g''(c1) = 0.'
  - 'derive: Also g''(a) = 0, so Rolle''s theorem applied to g'' gives c in (a,c1) with g''''(c) = 0.'
  - 'conclude: Since g''''(c) = f2(c) - K, we get K = f2(c).'
  openmath: (forall (f f1 f2 a b) (-> (and (< a b) (forall (x) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value f1 x) x)) (forall (x) (has_deriv_at (lambda (t) (fn_value f1 t)) (fn_value f2 x) x))) (exists (c) (and (in c (open_interval a b)) (= (fn_value f b) (+ (fn_value f a) (* (fn_value f1 a) (- b a)) (/ (* (fn_value f2 c) (^ (- b a) 2)) 2)))))))
  hard_negative:
