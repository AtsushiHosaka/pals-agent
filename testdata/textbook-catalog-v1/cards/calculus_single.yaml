- id: add_one_le_exp
  kind: gap
  level: 1
  topic: 指数関数・基本不等式
  statement: 任意の$x\in\mathbb{R}$に対して$1+x\leq e^x$である。
  statement_en: For every real x, 1 + x ≤ e^x.
  assumptions:
  - $x\in\mathbb{R}$
  quantifiers:
  - 任意の$x\in\mathbb{R}$
  conclusion: $1+x\leq e^x$である。
  answer: |
    $x\in\mathbb{R}$とする。$g(t)=e^t-1-t$とおくと、$g(0)=0$、$g'(t)=e^t-1$である。$x\neq0$なら、平均値の定理より$g(x)=g(x)-g(0)=(e^c-1)x$となる$c$が$0$と$x$の間に存在する。$x>0$なら$c>0$なので$e^c-1>0$、$x<0$なら$c<0$なので$e^c-1<0$であり、どちらの場合も$(e^c-1)x>0$である。$x=0$なら$g(0)=0$である。よって$g(x)\geq0$、すなわち$1+x\leq e^x$である。
  strategy: Minimize e^x - 1 - x using the sign of its derivative.
  sketch:
  - 'construct: Let g(x) = e^x - 1 - x.'
  - 'derive: g''(x) = e^x - 1 is negative for x < 0 and positive for x > 0.'
  - 'conclude: g attains its minimum g(0) = 0, so g ≥ 0.'
  openmath: (forall (x) (<= (+ 1 x) (exp x)))
  hard_negative:
    statement: 任意の実数xに対して1+x+x^2/2≤e^xである。
    reason: x=-1で左辺は1/2だが、右辺はe^(-1)≈0.37である。この不等式が成り立つのはx≥0のときである。
  target: |
    ∀ x : ℝ, 1 + x ≤ Real.exp x
  proof: |
    by
      intro x
      linarith [Real.add_one_le_exp x]
