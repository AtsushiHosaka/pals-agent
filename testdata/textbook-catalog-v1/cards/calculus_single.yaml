  assumptions: ["xは実数"]
  quantifiers: ["任意の実数x"]
  conclusion: 不等式|sin x|≤|x|が成り立つ。
  answer: |
    x=0なら両辺は0である。x≠0なら、平均値の定理によりsin x-sin 0=x cos cとなるcが0とxの間に存在する。|cos c|≤1なので、|sin x|=|x||cos c|≤|x|である。
  strategy: Apply the mean value theorem to sin on the interval between 0 and x.
  sketch:
    - "case_split: The case x = 0 is immediate."
    - "apply_theorem: The mean value theorem gives sin x = x cos c."
    - "conclude: Since |cos c| ≤ 1, |sin x| ≤ |x|."
  openmath: (forall (x) (<= (abs (sin x)) (abs x)))
  hard_negative:
    statement: 任意の実数xに対して|sin x|≥|x|/2である。
    reason: x=πでは左辺は0だが、右辺はπ/2である。
  target: |
