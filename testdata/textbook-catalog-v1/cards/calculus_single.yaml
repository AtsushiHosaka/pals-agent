- id: sin_cos_addition
  kind: gap
  level: 1
  topic: 三角関数・加法定理
  statement: 任意の実数x, yに対してsin(x+y)=sin x cos y+cos x sin yかつcos(x+y)=cos x cos y-sin x sin yである。
  statement_en: For all real x, y, sin(x+y) = sin x cos y + cos x sin y and cos(x+y) = cos x cos y - sin x sin y.
  assumptions: ["x, yは実数"]
  quantifiers: ["任意の実数x, y"]
  conclusion: sinとcosの加法定理が成り立つ。
  answer: |
    sin, cosを冪級数で定義し、項別微分で(sin x)'=cos x, (cos x)'=-sin xを得ているものとする。yを固定して、S(x)=sin(x+y)-sin x cos y-cos x sin y、C(x)=cos(x+y)-cos x cos y+sin x sin yとおく。微分するとS'=C、C'=-Sなので、S^2+C^2の導関数は0である。x=0でS=C=0だから、全てのxでS^2+C^2=0であり、S=C=0である。
  strategy: Show that the squared error of both formulas has zero derivative and vanishes at x = 0.
  sketch:
    - "setup: Define sin and cos by power series, so their derivatives are known without the addition formulas."
    - "construct: Fix y and define the errors S(x) and C(x)."
    - "derive: S' = C and C' = -S, so S² + C² has zero derivative."
    - "derive: S(0) = C(0) = 0, so S² + C² vanishes identically."
    - "conclude: Hence S = C = 0."
  openmath: (forall (x y) (and (= (sin (+ x y)) (+ (* (sin x) (cos y)) (* (cos x) (sin y)))) (= (cos (+ x y)) (- (* (cos x) (cos y)) (* (sin x) (sin y))))))
  hard_negative:
    statement: 任意の実数x, yに対してsin(x+y)=sin x+sin yである。
    reason: x=y=π/2では左辺は0だが、右辺は2である。
  target: |
    ∀ x y : ℝ, Real.sin (x + y) = Real.sin x * Real.cos y + Real.cos x * Real.sin y ∧ Real.cos (x + y) = Real.cos x * Real.cos y - Real.sin x * Real.sin y
  proof: |
    by
      intro x y
      exact ⟨Real.sin_add x y, Real.cos_add x y⟩

- id: limit_sin_over_x
  kind: gap
  level: 1
  topic: 標準的な極限・三角関数
  statement: x→0でsin x/x→1である。
  statement_en: sin x / x tends to 1 as x tends to 0 with x ≠ 0.
  assumptions: ["x≠0で考える"]
  quantifiers: ["0と異なる実数x"]
  conclusion: x→0でsin x/x→1である。
  answer: |
    0<x<π/2とする。単位円で中心角xの扇形の面積x/2は、2つの三角形の面積(sin x)/2と(tan x)/2の間にあるので、sin x<x<tan xである。sin xで割って逆数をとると、cos x<sin x/x<1である。cos xとsin x/xは偶関数なので、この不等式は-π/2<x<0でも成り立つ。x→0でcos x→1なので、はさみうちによりsin x/x→1である。
  strategy: Squeeze sin x / x between cos x and 1 by comparing areas on the unit circle.
  sketch:
    - "derive: For 0 < x < π/2, comparing areas on the unit circle gives sin x < x < tan x."
    - "derive: Dividing by sin x and inverting gives cos x < sin x / x < 1."
    - "derive: Both bounds are even in x, so they also hold for -π/2 < x < 0."
    - "conclude: Since cos x → 1 as x → 0, the squeeze theorem gives the limit 1."
  openmath: (fn_limit_at (lambda (x) (/ (sin x) x)) 0 1)
  hard_negative:
    statement: x→+∞でもsin x/x→1である。
    reason: 不等式|sin x/x|≤1/xより、x→+∞での極限は0である。
  target: |
    Filter.Tendsto (fun x : ℝ => Real.sin x / x) (nhdsWithin 0 {0}ᶜ) (nhds 1)
  proof: |
    by
      have h := hasDerivAt_iff_tendsto_slope.mp (Real.hasDerivAt_sin 0)
      rw [Real.cos_zero] at h
      refine h.congr fun x => ?_
      simp [slope_def_field]

- id: limit_one_add_div_rpow
  kind: textbook
  level: 1
  topic: 標準的な極限・指数関数
  statement: 任意の実数tに対し、x→+∞で(1+t/x)^x→e^tである。
  statement_en: For every real t, (1 + t/x)^x tends to e^t as x tends to +∞.
  assumptions: ["tは実数"]
  quantifiers: ["任意の実数t"]
  conclusion: x→+∞で(1+t/x)^x→e^tである。
  answer: |
    十分大きなxでは1+t/x>0であり、(1+t/x)^x=exp(x log(1+t/x))である。t=0なら明らかなので、t≠0とする。h=t/xとおくと、x log(1+t/x)=t·log(1+h)/hである。h→0でlog(1+h)/h→1なので、指数部はtに収束する。指数関数は連続なので結論を得る。
  strategy: Write the power as an exponential and reduce the exponent to the derivative of log at 1.
  sketch:
    - "translate: For large x, (1+t/x)^x = exp(x log(1+t/x))."
    - "derive: With h = t/x, the exponent equals t·log(1+h)/h."
    - "apply_theorem: log(1+h)/h → 1 as h → 0 because log has derivative 1 at 1."
    - "conclude: Continuity of exp gives the limit e^t."
  openmath: (forall (t) (fn_limit_at_top (lambda (x) (^ (+ 1 (/ t x)) x)) (exp t)))
  hard_negative:
    statement: x→+∞で(1+t/x)^(x^2)→e^tである。
    reason: t=1では指数部がx^2 log(1+1/x)となり、これはおよそxなので発散する。
  target: |
    ∀ t : ℝ, Filter.Tendsto (fun x : ℝ => (1 + t / x) ^ x) Filter.atTop (nhds (Real.exp t))
  proof: |
    by
      intro t
      exact Real.tendsto_one_add_div_rpow_exp t

- id: limit_x_log_x_at_zero
  kind: gap
  level: 1
  topic: 標準的な極限・対数関数
  statement: x→0+でx log x→0である。
  statement_en: x log x tends to 0 as x tends to 0 from the right.
  assumptions: ["x>0で考える"]
  quantifiers: ["正の実数x"]
  conclusion: x→0+でx log x→0である。
  answer: |
    y=-log xとおくと、x→0+のときy→+∞であり、x log x=-y e^(-y)である。y≥0でe^y≥1+y+y^2/2≥y^2/2なので、0≤y e^(-y)≤2/yである。右辺は0に収束するので、はさみうちによりx log x→0である。
  strategy: Substitute y = -log x and use that the exponential dominates y.
  sketch:
    - "translate: With y = -log x, x log x = -y e^(-y) and y → +∞."
    - "derive: e^y ≥ y²/2 for y ≥ 0, so 0 ≤ y e^(-y) ≤ 2/y."
    - "conclude: The squeeze theorem gives the limit 0."
  openmath: (fn_right_limit_at (lambda (x) (* x (ln x))) 0 0)
  hard_negative:
    statement: x→0+でlog x/x→0である。
    reason: x→0+でlog x→-∞かつ1/x→+∞なので、log x/x→-∞である。
  target: |
    Filter.Tendsto (fun x : ℝ => x * Real.log x) (nhdsWithin 0 (Set.Ioi 0)) (nhds 0)
  proof: |
    by
      have h := tendsto_log_mul_rpow_nhdsGT_zero (r := 1) zero_lt_one
      refine h.congr fun x => ?_
      rw [Real.rpow_one, mul_comm]

- id: fundamental_theorem_first
  kind: named
  level: 1
  topic: 微分積分学の基本定理
  statement: 微分積分学の基本定理（第1形）。fが実数全体で連続ならば、F(x)=∫_a^x f(t)dtはbで微分可能で、F'(b)=f(b)である。
  statement_en: Fundamental theorem of calculus, first form. If f is continuous on the reals, then F(x) = ∫_a^x f(t) dt has derivative f(b) at b.
  assumptions: ["fは実数全体で連続"]
  quantifiers: ["任意の関数fと実数a, b"]
  conclusion: F(x)=∫_a^x f(t)dtのbでの微分係数はf(b)である。
  answer: |
    h≠0に対し(F(b+h)-F(b))/h-f(b)=(1/h)∫_b^(b+h)(f(t)-f(b))dtである。ε>0に対し、fの連続性より、あるδ>0が存在して|t-b|<δのとき|f(t)-f(b)|<εである。|h|<δならば右辺の絶対値はε以下である。したがって差分商はf(b)に収束する。
  strategy: Express the difference quotient minus f(b) as an average of f(t) - f(b) and use continuity at b.
  sketch:
    - "derive: Additivity gives F(b+h)-F(b) = ∫_b^(b+h) f(t) dt."
    - "derive: Subtracting f(b) writes the error as (1/h)∫_b^(b+h)(f(t)-f(b)) dt."
    - "apply_theorem: Continuity at b bounds the integrand by ε for small h."
    - "conclude: The difference quotient tends to f(b)."
  openmath: (forall (f a b) (-> (fn_continuous (lambda (x) (fn_value f x))) (has_deriv_at (lambda (x) (interval_integral a x (lambda (t) (fn_value f t)))) (fn_value f b) b)))
  hard_negative:
    statement: fが積分可能なだけで、全ての点でF'(b)=f(b)である。
    reason: x≠0でf(x)=0, f(0)=1とするとF=0なので、F'(0)=0≠f(0)である。
  target: |
    ∀ (f : ℝ → ℝ) (a b : ℝ), Continuous f → HasDerivAt (fun x => ∫ t in a..x, f t) (f b) b
  proof: |
    by
      intro f a b hf
      exact intervalIntegral.integral_hasDerivAt_right (hf.intervalIntegrable _ _) (hf.stronglyMeasurableAtFilter _ _) hf.continuousAt

- id: fundamental_theorem_second
  kind: named
  level: 1
  topic: 微分積分学の基本定理
  statement: 微分積分学の基本定理（第2形）。aとbを端点とする閉区間でFが微分可能でF'=fが連続ならば、∫_a^b f(x)dx=F(b)-F(a)である。
  statement_en: Fundamental theorem of calculus, second form. If F has derivative f at each point of the closed interval between a and b and f is continuous there, then ∫_a^b f(x) dx = F(b) - F(a).
  assumptions: ["aとbを端点とする閉区間の各点でFの微分係数はf(x)", "fはその閉区間で連続"]
  quantifiers: ["任意の関数F, fと実数a, b"]
  conclusion: ∫_a^b f(x)dx=F(b)-F(a)である。
  answer: |
    a≤bの場合を考える。b<aの場合は積分の向きを変えれば同じである。G(x)=∫_a^x f(t)dtとおくと、第1形と同じ議論により区間の内点でG'=fであり、Gは閉区間で連続である。F-Gは閉区間で連続で内点での導関数が0なので、平均値の定理により定数である。よってF(b)-F(a)=G(b)-G(a)=∫_a^b f(x)dxである。
  strategy: Compare F with the indefinite integral; their difference has zero derivative.
  sketch:
    - "construct: Let G(x) = ∫_a^x f(t) dt."
    - "apply_theorem: The argument of the first form gives G' = f at interior points, and G is continuous on the interval."
    - "derive: F - G has zero derivative at interior points, hence is constant on the interval."
    - "conclude: F(b) - F(a) = G(b) - G(a) = ∫_a^b f(x) dx."
  openmath: (forall (F f a b) (-> (and (forall (x) (-> (in x (closed_interval_between a b)) (has_deriv_at (lambda (t) (fn_value F t)) (fn_value f x) x))) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval_between a b))) (= (interval_integral a b (lambda (x) (fn_value f x))) (- (fn_value F b) (fn_value F a)))))
  hard_negative:
    statement: Fが1点を除いて微分可能でF'=fならば、∫_a^b f(x)dx=F(b)-F(a)である。
    reason: x<0でF=0、x≥0でF=1とすると、[-1,1]の0以外でF'=0だが、F(1)-F(-1)=1である。
  target: |
    ∀ (F f : ℝ → ℝ) (a b : ℝ), (∀ x ∈ Set.uIcc a b, HasDerivAt F (f x) x) → ContinuousOn f (Set.uIcc a b) → ∫ x in a..b, f x = F b - F a
  proof: |
    by
      intro F f a b hd hc
      exact intervalIntegral.integral_eq_sub_of_hasDerivAt hd hc.intervalIntegrable

- id: integral_monotone
  kind: gap
  level: 1
  topic: 定積分・不等式
  statement: a≤bでf, gが[a,b]で積分可能かつ[a,b]でf≤gならば、∫_a^b f≤∫_a^b gである。
  statement_en: If a ≤ b, f and g are integrable on [a,b], and f ≤ g on [a,b], then ∫_a^b f ≤ ∫_a^b g.
  assumptions: ["a≤b", "f, gは[a,b]で積分可能", "x∈[a,b]でf(x)≤g(x)"]
  quantifiers: ["任意の関数f, gと実数a, b"]
  conclusion: ∫_a^b f≤∫_a^b gである。
  answer: |
    g-fは[a,b]で非負かつ積分可能である。非負の関数の積分は非負なので、∫_a^b(g-f)≥0である。積分の線形性より、∫_a^b g-∫_a^b f≥0である。
  strategy: Reduce to nonnegativity of the integral of g - f.
  sketch:
    - "derive: g - f is nonnegative and integrable on [a,b]."
    - "apply_theorem: The integral of a nonnegative function is nonnegative."
    - "conclude: Linearity gives ∫f ≤ ∫g."
  openmath: (forall (f g a b) (-> (and (<= a b) (interval_integrable (lambda (x) (fn_value f x)) a b) (interval_integrable (lambda (x) (fn_value g x)) a b) (forall (x) (-> (in x (closed_interval a b)) (<= (fn_value f x) (fn_value g x))))) (<= (interval_integral a b (lambda (x) (fn_value f x))) (interval_integral a b (lambda (x) (fn_value g x))))))
  hard_negative:
    statement: ∫_a^b f≤∫_a^b gならば、[a,b]の全ての点でf≤gである。
    reason: 区間[-1,1]でf(x)=x, g(x)=0とすると積分はともに0だが、x=1でf>gである。
  target: |
    ∀ (f g : ℝ → ℝ) (a b : ℝ), a ≤ b → IntervalIntegrable f MeasureTheory.volume a b → IntervalIntegrable g MeasureTheory.volume a b → (∀ x ∈ Set.Icc a b, f x ≤ g x) → (∫ x in a..b, f x) ≤ ∫ x in a..b, g x
  proof: |
    by
      intro f g a b hab hf hg h
      exact intervalIntegral.integral_mono_on hab hf hg h

- id: integral_two_sided_bound
  kind: gap
  level: 1
  topic: 定積分・不等式
  statement: a≤bでfが[a,b]で連続かつm≤f≤Mならば、m(b-a)≤∫_a^b f≤M(b-a)である。
  statement_en: If a ≤ b, f is continuous on [a,b], and m ≤ f ≤ M on [a,b], then m(b-a) ≤ ∫_a^b f ≤ M(b-a).
  assumptions: ["a≤b", "fは[a,b]で連続", "x∈[a,b]でm≤f(x)≤M"]
  quantifiers: ["任意の関数fと実数a, b, m, M"]
  conclusion: m(b-a)≤∫_a^b f≤M(b-a)である。
  answer: |
    連続関数fは[a,b]で積分可能である。定数関数m, Mとfに積分の単調性を用いると、∫_a^b m≤∫_a^b f≤∫_a^b Mである。定数の積分はそれぞれm(b-a), M(b-a)である。
  strategy: Compare f with the constant functions m and M.
  sketch:
    - "derive: f is integrable because it is continuous on [a,b]."
    - "apply_theorem: Monotonicity of the integral gives ∫m ≤ ∫f ≤ ∫M."
    - "conclude: The constant integrals equal m(b-a) and M(b-a)."
  openmath: (forall (f a b m M) (-> (and (<= a b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (forall (x) (-> (in x (closed_interval a b)) (and (<= m (fn_value f x)) (<= (fn_value f x) M))))) (and (<= (* m (- b a)) (interval_integral a b (lambda (x) (fn_value f x)))) (<= (interval_integral a b (lambda (x) (fn_value f x))) (* M (- b a))))))
  hard_negative:
    statement: b<aでもm(b-a)≤∫_a^b f≤M(b-a)である。
    reason: a=1, b=0, f=1, m=0, M=2とすると、∫_a^b f=-1だが、m(b-a)=0である。
  target: |
    ∀ (f : ℝ → ℝ) (a b m M : ℝ), a ≤ b → ContinuousOn f (Set.Icc a b) → (∀ x ∈ Set.Icc a b, m ≤ f x ∧ f x ≤ M) → m * (b - a) ≤ ∫ x in a..b, f x ∧ (∫ x in a..b, f x) ≤ M * (b - a)
  proof: |
    by
      intro f a b m M hab hf h
      have hI : IntervalIntegrable f MeasureTheory.volume a b := hf.intervalIntegrable_of_Icc hab
      have hm : IntervalIntegrable (fun _ : ℝ => m) MeasureTheory.volume a b := intervalIntegrable_const
      have hM : IntervalIntegrable (fun _ : ℝ => M) MeasureTheory.volume a b := intervalIntegrable_const
      constructor
      · have h1 := intervalIntegral.integral_mono_on hab hm hI (fun x hx => (h x hx).1)
        rw [intervalIntegral.integral_const, smul_eq_mul, mul_comm] at h1
        exact h1
      · have h1 := intervalIntegral.integral_mono_on hab hI hM (fun x hx => (h x hx).2)
        rw [intervalIntegral.integral_const, smul_eq_mul, mul_comm (b - a)] at h1
        exact h1

- id: integral_logarithmic_derivative
  kind: gap
  level: 1
  topic: 定積分・対数微分型の積分
  statement: aとbを端点とする閉区間でfが正かつ微分可能で導関数gが連続ならば、∫_a^b g(x)/f(x)dx=log f(b)-log f(a)である。
  statement_en: If f is positive and differentiable with continuous derivative g on the closed interval between a and b, then ∫_a^b g(x)/f(x) dx = log f(b) - log f(a).
  assumptions: ["閉区間の各点でfの微分係数はg(x)", "gは閉区間で連続", "閉区間でf(x)>0"]
  quantifiers: ["任意の関数f, gと実数a, b"]
  conclusion: ∫_a^b g/f=log f(b)-log f(a)である。
  answer: |
    合成関数の微分より、log f(x)の微分係数はg(x)/f(x)である。fは微分可能なので連続で、正なので、g/fはこの閉区間で連続である。微分積分学の基本定理より、∫_a^b g(x)/f(x)dx=log f(b)-log f(a)である。
  strategy: Recognize g/f as the derivative of log f and apply the fundamental theorem.
  sketch:
    - "apply_theorem: The chain rule gives (log f)' = g/f on the interval."
    - "derive: g/f is continuous because f is continuous and positive."
    - "apply_theorem: The fundamental theorem of calculus applies."
    - "conclude: The integral equals log f(b) - log f(a)."
  openmath: (forall (f g a b) (-> (and (forall (x) (-> (in x (closed_interval_between a b)) (and (has_deriv_at (lambda (t) (fn_value f t)) (fn_value g x) x) (> (fn_value f x) 0)))) (fn_continuous_on (lambda (x) (fn_value g x)) (closed_interval_between a b))) (= (interval_integral a b (lambda (x) (/ (fn_value g x) (fn_value f x)))) (- (ln (fn_value f b)) (ln (fn_value f a))))))
  hard_negative:
    statement: fが閉区間内で0になっても同じ公式が成り立つ。
    reason: f(x)=x, g(x)=1, a=-1, b=1では1/xが0の近くで積分可能でないので、公式は意味をもたない。
  target: |
    ∀ (f g : ℝ → ℝ) (a b : ℝ), (∀ x ∈ Set.uIcc a b, HasDerivAt f (g x) x) → ContinuousOn g (Set.uIcc a b) → (∀ x ∈ Set.uIcc a b, 0 < f x) → ∫ x in a..b, g x / f x = Real.log (f b) - Real.log (f a)
  proof: |
    by
      intro f g a b hd hg hp
      have hcf : ContinuousOn f (Set.uIcc a b) := fun x hx => (hd x hx).continuousAt.continuousWithinAt
      exact intervalIntegral.integral_eq_sub_of_hasDerivAt (f := fun x => Real.log (f x)) (fun x hx => (hd x hx).log (hp x hx).ne') (ContinuousOn.intervalIntegrable (hg.div hcf fun x hx => (hp x hx).ne'))

- id: improper_integral_exp_neg
  kind: textbook
  level: 1
  topic: 広義積分・指数関数
  statement: e^(-x)は(0,∞)で積分可能で、∫_0^∞ e^(-x)dx=1であり、t→+∞で∫_0^t e^(-x)dx→1である。
  statement_en: e^(-x) is integrable on (0,∞), ∫_0^∞ e^(-x) dx = 1, and ∫_0^t e^(-x) dx tends to 1 as t tends to +∞.
  assumptions: ["積分区間は(0,∞)"]
  quantifiers: ["t→+∞"]
  conclusion: 広義積分は収束し、値は1である。
  answer: |
    t>0に対し、基本定理より∫_0^t e^(-x)dx=1-e^(-t)である。t→+∞でe^(-t)→0なので、この積分は1に収束する。被積分関数は正なので、これは(0,∞)での積分可能性も意味し、その値は1である。
  strategy: Compute the proper integral on [0,t] and let t tend to infinity.
  sketch:
    - "apply_theorem: The fundamental theorem gives ∫_0^t e^(-x) dx = 1 - e^(-t)."
    - "derive: e^(-t) → 0 as t → +∞."
    - "derive: Positivity of the integrand turns convergence into integrability."
    - "conclude: The improper integral equals 1."
  openmath: (and (integrable_on_ioi (lambda (x) (exp (neg x))) 0) (= (integral_ioi 0 (lambda (x) (exp (neg x)))) 1) (fn_limit_at_top (lambda (t) (interval_integral 0 t (lambda (x) (exp (neg x))))) 1))
  hard_negative:
    statement: e^xも(0,∞)で積分可能で、∫_0^∞ e^x dx=-1である。
    reason: ∫_0^t e^x dx=e^t-1はt→+∞で発散する。
  target: |
    MeasureTheory.IntegrableOn (fun x : ℝ => Real.exp (-x)) (Set.Ioi 0) ∧ (∫ x in Set.Ioi (0 : ℝ), Real.exp (-x)) = 1 ∧ Filter.Tendsto (fun t : ℝ => ∫ x in (0 : ℝ)..t, Real.exp (-x)) Filter.atTop (nhds 1)
  proof: |
    by
      refine ⟨integrableOn_exp_neg_Ioi 0, integral_exp_neg_Ioi_zero, ?_⟩
      have h := MeasureTheory.intervalIntegral_tendsto_integral_Ioi 0 (integrableOn_exp_neg_Ioi 0) Filter.tendsto_id
      rwa [integral_exp_neg_Ioi_zero] at h

- id: improper_integral_power_at_infinity
  kind: textbook
  level: 1
  topic: 広義積分・べき関数（無限区間）
  statement: p>1ならばx^(-p)は(1,∞)で積分可能で、∫_1^∞ x^(-p)dx=1/(p-1)である。
  statement_en: If p > 1, then x^(-p) is integrable on (1,∞) and ∫_1^∞ x^(-p) dx = 1/(p-1).
  assumptions: ["p>1"]
  quantifiers: ["任意の実数p"]
  conclusion: 広義積分は収束し、値は1/(p-1)である。
  answer: |
    t>1に対し、基本定理より∫_1^t x^(-p)dx=(1-t^(1-p))/(p-1)である。p>1よりt→+∞でt^(1-p)→0なので、この積分は1/(p-1)に収束する。被積分関数は正なので、(1,∞)で積分可能であり、値は1/(p-1)である。
  strategy: Integrate on [1,t] with the power rule and let t tend to infinity.
  sketch:
    - "apply_theorem: The fundamental theorem gives ∫_1^t x^(-p) dx = (1 - t^(1-p))/(p-1)."
    - "derive: Since p > 1, t^(1-p) → 0."
    - "derive: Positivity of the integrand gives integrability."
    - "conclude: The value is 1/(p-1)."
  openmath: (forall (p) (-> (> p 1) (and (integrable_on_ioi (lambda (x) (^ x (neg p))) 1) (= (integral_ioi 1 (lambda (x) (^ x (neg p)))) (/ 1 (- p 1))))))
  hard_negative:
    statement: p=1でもx^(-p)は(1,∞)で積分可能である。
    reason: ∫_1^t x^(-1)dx=log tはt→+∞で発散する。
  target: |
    ∀ p : ℝ, 1 < p → MeasureTheory.IntegrableOn (fun x : ℝ => x ^ (-p)) (Set.Ioi 1) ∧ (∫ x in Set.Ioi (1 : ℝ), x ^ (-p)) = 1 / (p - 1)
  proof: |
    by
      intro p hp
      have h : -p < -1 := by linarith
      refine ⟨integrableOn_Ioi_rpow_of_lt h one_pos, ?_⟩
      rw [integral_Ioi_rpow_of_lt h one_pos, Real.one_rpow]
      have h1 : p - 1 ≠ 0 := by linarith
      have h2 : -p + 1 ≠ 0 := by linarith
      field_simp
      ring

- id: improper_integral_power_at_zero
  kind: textbook
  level: 1
  topic: 広義積分・べき関数（端点の特異性）
  statement: p<1ならばx^(-p)は区間(0,1]で積分可能で、∫_0^1 x^(-p)dx=1/(1-p)である。
  statement_en: If p < 1, then x^(-p) is integrable on (0,1] and ∫_0^1 x^(-p) dx = 1/(1-p).
  assumptions: ["p<1"]
  quantifiers: ["任意の実数p"]
  conclusion: 広義積分は収束し、値は1/(1-p)である。
  answer: |
    0<s<1に対し、基本定理より∫_s^1 x^(-p)dx=(1-s^(1-p))/(1-p)である。p<1よりs→0+でs^(1-p)→0なので、この積分は1/(1-p)に収束する。被積分関数は(0,1]で正なので、積分可能であり、値は1/(1-p)である。
  strategy: Integrate on [s,1] and let s tend to 0 from the right.
  sketch:
    - "apply_theorem: The fundamental theorem gives ∫_s^1 x^(-p) dx = (1 - s^(1-p))/(1-p)."
    - "derive: Since p < 1, s^(1-p) → 0 as s → 0+."
    - "derive: Positivity of the integrand gives integrability."
    - "conclude: The value is 1/(1-p)."
  openmath: (forall (p) (-> (< p 1) (and (interval_integrable (lambda (x) (^ x (neg p))) 0 1) (= (interval_integral 0 1 (lambda (x) (^ x (neg p)))) (/ 1 (- 1 p))))))
  hard_negative:
    statement: p>1でも∫_0^1 x^(-p)dx=1/(1-p)である。
    reason: p=2では∫_s^1 x^(-2)dx=1/s-1がs→0+で発散する。公式の値-1は負で、正の関数の積分として不合理である。
  target: |
    ∀ p : ℝ, p < 1 → IntervalIntegrable (fun x : ℝ => x ^ (-p)) MeasureTheory.volume 0 1 ∧ (∫ x in (0 : ℝ)..1, x ^ (-p)) = 1 / (1 - p)
  proof: |
    by
      intro p hp
      have h : -1 < -p := by linarith
      refine ⟨intervalIntegral.intervalIntegrable_rpow' h, ?_⟩
      rw [integral_rpow (Or.inl h), Real.one_rpow, Real.zero_rpow (by linarith)]
      have h1 : 1 - p ≠ 0 := by linarith
      have h2 : -p + 1 ≠ 0 := by linarith
      field_simp
      ring

- id: improper_power_diverges_at_infinity
  kind: gap
  level: 1
  topic: 広義積分・発散
  statement: p≤1ならばx^(-p)は(1,∞)で積分可能でない。
  statement_en: If p ≤ 1, then x^(-p) is not integrable on (1,∞).
  assumptions: ["p≤1"]
  quantifiers: ["任意の実数p"]
  conclusion: x^(-p)は(1,∞)で積分可能でない。
  answer: |
    x≥1とp≤1よりx^(-p)≥x^(-1)である。t>1で∫_1^t x^(-p)dx≥∫_1^t x^(-1)dx=log tであり、t→+∞で右辺は発散する。被積分関数は正なので、x^(-p)は(1,∞)で積分可能でない。
  strategy: Compare with 1/x, whose integral is log t.
  sketch:
    - "derive: For x ≥ 1 and p ≤ 1, x^(-p) ≥ x^(-1)."
    - "derive: Therefore ∫_1^t x^(-p) dx ≥ log t."
    - "conclude: Since log t → +∞, the positive integrand is not integrable."
  openmath: (forall (p) (-> (<= p 1) (not (integrable_on_ioi (lambda (x) (^ x (neg p))) 1))))
  hard_negative:
    statement: p≤2ならばx^(-p)は(1,∞)で積分可能でない。
    reason: p=2では∫_1^∞ x^(-2)dx=1であり、積分可能である。
  target: |
    ∀ p : ℝ, p ≤ 1 → ¬ MeasureTheory.IntegrableOn (fun x : ℝ => x ^ (-p)) (Set.Ioi 1)
  proof: |
    by
      intro p hp h
      have h1 := (integrableOn_Ioi_rpow_iff zero_lt_one).mp h
      linarith

- id: improper_comparison_test
  kind: gap
  level: 1
  topic: 広義積分・比較判定法
  statement: fが(a,∞)で連続で|f|≤gかつgが(a,∞)で積分可能ならば、fも(a,∞)で積分可能である。
  statement_en: If f is continuous on (a,∞), |f| ≤ g there, and g is integrable on (a,∞), then f is integrable on (a,∞).
  assumptions: ["fは(a,∞)で連続", "x>aで|f(x)|≤g(x)", "gは(a,∞)で積分可能"]
  quantifiers: ["任意の関数f, gと実数a"]
  conclusion: fは(a,∞)で積分可能である。
  answer: |
    fは連続なので可測である。|f|≤gより∫_a^∞|f|≤∫_a^∞ g<∞である。したがってfは(a,∞)で絶対可積分である。
  strategy: Dominate |f| by the integrable function g.
  sketch:
    - "derive: Continuity of f gives measurability on (a,∞)."
    - "derive: The bound |f| ≤ g gives a finite integral of |f|."
    - "conclude: Thus f is integrable on (a,∞)."
  openmath: (forall (f g a) (-> (and (fn_continuous_on (lambda (x) (fn_value f x)) (open_half_line_right a)) (forall (x) (-> (> x a) (<= (abs (fn_value f x)) (fn_value g x)))) (integrable_on_ioi (lambda (x) (fn_value g x)) a)) (integrable_on_ioi (lambda (x) (fn_value f x)) a)))
  hard_negative:
    statement: 不等式|f|≤gが成り立ちfが積分可能ならば、gも積分可能である。
    reason: f=0, g=1は(a,∞)で|f|≤gを満たし、fは積分可能だが、gは積分可能でない。
  target: |
    ∀ (f g : ℝ → ℝ) (a : ℝ), ContinuousOn f (Set.Ioi a) → (∀ x ∈ Set.Ioi a, |f x| ≤ g x) → MeasureTheory.IntegrableOn g (Set.Ioi a) → MeasureTheory.IntegrableOn f (Set.Ioi a)
  proof: |
    by
      intro f g a hf h hg
      refine MeasureTheory.Integrable.mono' hg (hf.aestronglyMeasurable measurableSet_Ioi) ?_
      exact MeasureTheory.ae_restrict_of_forall_mem measurableSet_Ioi fun x hx => by simpa only [Real.norm_eq_abs] using h x hx

- id: riemann_sum_convergence
  kind: textbook
  level: 1
  topic: 定積分・リーマン和
  statement: a≤bでfが[a,b]で連続ならば、[a,b]をn+1等分した左端点のリーマン和はn→∞で∫_a^b f(x)dxに収束する。
  statement_en: If a ≤ b and f is continuous on [a,b], the left-endpoint Riemann sums for the partition of [a,b] into n+1 equal parts converge to ∫_a^b f(x) dx as n → ∞.
  assumptions: ["a≤b", "fは[a,b]で連続"]
  quantifiers: ["任意の関数fと実数a, b", "h=(b-a)/(n+1)とする"]
  conclusion: hΣ_{k=0}^n f(a+kh)→∫_a^b f(x)dxである。
  answer: |
    fは[a,b]で一様連続なので、ε>0に対しあるδ>0が存在して、|s-t|<δのとき|f(s)-f(t)|<ε/(b-a+1)である。h<δとなるnをとり、x_k=a+khとおく。積分を小区間に分けると、各小区間でhf(x_k)と∫_{x_k}^{x_{k+1}}f(t)dtの差の絶対値はεh/(b-a+1)以下である。n+1個の小区間で和をとると、リーマン和と積分の差の絶対値はε(b-a)/(b-a+1)以下であり、これはεより小さい。
  strategy: Use uniform continuity to bound the error on each subinterval and sum the bounds.
  sketch:
    - "apply_theorem: f is uniformly continuous on [a,b]."
    - "setup: Fix ε > 0, take the matching δ, and choose n with h = (b-a)/(n+1) < δ."
    - "derive: Split the integral into n+1 subintervals by additivity."
    - "derive: On each subinterval, |h f(x_k) - ∫ f| ≤ εh/(b-a+1)."
    - "conclude: Summing gives a total error below ε."
  openmath: (forall (f a b) (-> (and (<= a b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b))) (seq_limit_of (lambda (n) (* (/ (- b a) (+ n 1)) (sum (natural_range (+ n 1)) (lambda (k) (fn_value f (+ a (* k (/ (- b a) (+ n 1))))))))) (interval_integral a b (lambda (x) (fn_value f x))))))
  hard_negative:
    statement: fが[a,b]で有界であれば、等分のリーマン和は常に積分に収束する。
    reason: ディリクレ関数は有界だが、有理数の分点をとる和は1で、無理数の分点をとる和は0となり、リーマン積分可能でない。
  target: |
    ∀ (f : ℝ → ℝ) (a b : ℝ), a ≤ b → ContinuousOn f (Set.Icc a b) → Filter.Tendsto (fun n : ℕ => (b - a) / ((n : ℝ) + 1) * ∑ k ∈ Finset.range (n + 1), f (a + (k : ℝ) * ((b - a) / ((n : ℝ) + 1)))) Filter.atTop (nhds (∫ x in a..b, f x))
  proof: |
    by
        intro f a b hab hf
        rw [Metric.tendsto_atTop]
        intro ε hε
        have huc := isCompact_Icc.uniformContinuousOn_of_continuous hf
        have hL : 0 ≤ b - a := sub_nonneg.2 hab
        have hL1 : 0 < b - a + 1 := by linarith
        have hε' : 0 < ε / (b - a + 1) := div_pos hε hL1
        obtain ⟨δ, hδ, hu⟩ := Metric.uniformContinuousOn_iff.mp huc _ hε'
        obtain ⟨N, hN⟩ := exists_nat_gt ((b - a) / δ)
        refine ⟨N, fun n hn => ?_⟩
        have hn1 : (0 : ℝ) < (n : ℝ) + 1 := by positivity
        obtain ⟨h, hh⟩ : ∃ h, h = (b - a) / ((n : ℝ) + 1) := ⟨_, rfl⟩
        rw [← hh]
        have hhn : ((n : ℝ) + 1) * h = b - a := by rw [hh]; field_simp
        have hh0 : 0 ≤ h := by rw [hh]; exact div_nonneg hL hn1.le
        have hhδ : h < δ := by
          have h1 : (N : ℝ) ≤ n := by exact_mod_cast hn
          have h2 : (b - a) / δ < (n : ℝ) + 1 := by linarith
          rw [div_lt_iff₀ hδ] at h2
          rw [hh, div_lt_iff₀ hn1]
          linarith
        have hmem : ∀ k : ℕ, k ≤ n + 1 → a + (k : ℝ) * h ∈ Set.Icc a b := by
          intro k hk
          have h1 : (k : ℝ) ≤ (n : ℝ) + 1 := by exact_mod_cast hk
          have h2 : (k : ℝ) * h ≤ ((n : ℝ) + 1) * h := mul_le_mul_of_nonneg_right h1 hh0
          have h3 : 0 ≤ (k : ℝ) * h := mul_nonneg (Nat.cast_nonneg k) hh0
          exact ⟨by linarith, by linarith⟩
        have hsucc : ∀ k : ℕ, a + ((k + 1 : ℕ) : ℝ) * h = a + (k : ℝ) * h + h := by
          intro k
          push_cast
          ring
        have hsub : ∀ k : ℕ, k < n + 1 → Set.uIcc (a + (k : ℝ) * h) (a + ((k + 1 : ℕ) : ℝ) * h) ⊆ Set.Icc a b := by
          intro k hk
          exact Set.OrdConnected.uIcc_subset inferInstance (hmem k hk.le) (hmem (k + 1) hk)
        have hint : ∀ k < n + 1, IntervalIntegrable f MeasureTheory.volume (a + (k : ℝ) * h) (a + ((k + 1 : ℕ) : ℝ) * h) := fun k hk =>
          ContinuousOn.intervalIntegrable (hf.mono (hsub k hk))
        have hsum := intervalIntegral.sum_integral_adjacent_intervals (a := fun k : ℕ => a + (k : ℝ) * h) hint
        have h0 : a + ((0 : ℕ) : ℝ) * h = a := by simp
        have hend : a + ((n + 1 : ℕ) : ℝ) * h = b := by
          push_cast
          linarith
        simp only [h0, hend] at hsum
        have key : ∀ k ∈ Finset.range (n + 1), |h * f (a + (k : ℝ) * h) - ∫ t in (a + (k : ℝ) * h)..(a + ((k + 1 : ℕ) : ℝ) * h), f t| ≤ ε / (b - a + 1) * h := by
          intro k hk
          have hk' := Finset.mem_range.mp hk
          have hI := hint k hk'
          have e1 : (∫ t in (a + (k : ℝ) * h)..(a + ((k + 1 : ℕ) : ℝ) * h), (f t - f (a + (k : ℝ) * h))) = (∫ t in (a + (k : ℝ) * h)..(a + ((k + 1 : ℕ) : ℝ) * h), f t) - h * f (a + (k : ℝ) * h) := by
            rw [intervalIntegral.integral_sub hI intervalIntegrable_const, intervalIntegral.integral_const, hsucc k, smul_eq_mul]
            ring_nf
          have e2 := intervalIntegral.norm_integral_le_of_norm_le_const (a := a + (k : ℝ) * h) (b := a + ((k + 1 : ℕ) : ℝ) * h) (C := ε / (b - a + 1)) (f := fun t => f t - f (a + (k : ℝ) * h)) (by
            intro t ht
            rw [hsucc k, Set.uIoc_of_le (by linarith)] at ht
            have hts : t ∈ Set.Icc a b := hsub k hk' (by
              rw [hsucc k, Set.uIcc_of_le (by linarith)]
              exact ⟨ht.1.le, ht.2⟩)
            have hd : dist t (a + (k : ℝ) * h) < δ := by
              rw [Real.dist_eq, abs_of_pos (by linarith [ht.1])]
              linarith [ht.2]
            have := hu t hts _ (hmem k hk'.le) hd
            rw [Real.dist_eq] at this
            rw [Real.norm_eq_abs]
            exact this.le)
          rw [e1, Real.norm_eq_abs, hsucc k] at e2
          have e3 : |a + (k : ℝ) * h + h - (a + (k : ℝ) * h)| = h := by
            rw [add_sub_cancel_left, abs_of_nonneg hh0]
          rw [e3, abs_sub_comm, ← hsucc k] at e2
          exact e2
        rw [Real.dist_eq, ← hsum, Finset.mul_sum, ← Finset.sum_sub_distrib]
        calc _ ≤ ∑ k ∈ Finset.range (n + 1), |h * f (a + (k : ℝ) * h) - ∫ t in (a + (k : ℝ) * h)..(a + ((k + 1 : ℕ) : ℝ) * h), f t| := Finset.abs_sum_le_sum_abs _ _
          _ ≤ ∑ _k ∈ Finset.range (n + 1), ε / (b - a + 1) * h := Finset.sum_le_sum key
          _ = ε / (b - a + 1) * (b - a) := by
            rw [Finset.sum_const, Finset.card_range, nsmul_eq_mul]
            push_cast
            rw [← hhn]
            ring
          _ < ε := by
            rw [div_mul_eq_mul_div, div_lt_iff₀ hL1]
            nlinarith
