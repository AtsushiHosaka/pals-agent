      intro x
      exact Real.hasDerivAt_arctan x

- id: rolle_theorem
  kind: named
  level: 1
  topic: 平均値の定理・ロルの定理
  statement: ロルの定理。a<bでfが[a,b]で連続、(a,b)で微分可能、f(a)=f(b)ならば、f'(c)=0となるc∈(a,b)が存在する。
  statement_en: Rolle's theorem. If a < b, f is continuous on [a,b], differentiable on (a,b) with derivative g, and f(a) = f(b), then g(c) = 0 for some c in (a,b).
  assumptions: ["a<b", "fは[a,b]で連続", "fは(a,b)の各点で微分可能で微分係数はg(x)", "f(a)=f(b)"]
  quantifiers: ["任意の関数f, gと実数a, b", "あるc∈(a,b)"]
  conclusion: g(c)=0となるc∈(a,b)が存在する。
  answer: |
    最大値・最小値の定理より、fは[a,b]で最大値と最小値をとる。両者が等しければfは定数なので、(a,b)の任意の点でg=0である。等しくなければ、f(a)=f(b)より最大値か最小値の一方は内点cでとられる。内点での極値では微分係数が0なので、g(c)=0である。
  strategy: The extreme value theorem gives an interior extremum unless f is constant.
  sketch:
    - "apply_theorem: f attains its maximum and minimum on [a,b]."
    - "case_split: If they coincide, f is constant and the derivative vanishes everywhere."
    - "derive: Otherwise f(a) = f(b) forces one extremum at an interior point c."
    - "apply_theorem: The derivative at an interior extremum is zero."
    - "conclude: Hence g(c) = 0."
  openmath: (forall (f g a b) (-> (and (< a b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (= (fn_value f a) (fn_value f b)) (forall (x) (-> (in x (open_interval a b)) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value g x) x)))) (exists (c) (and (in c (open_interval a b)) (= (fn_value g c) 0)))))
  hard_negative:
    statement: fが(a,b)の点で微分可能でなくても、連続でf(a)=f(b)ならば、f'(c)=0となる点がある。
    reason: f(x)=1-|x|を[-1,1]で考えると、f(-1)=f(1)だが、微分可能な点での微分係数は±1であり0にならない。
  target: |
    ∀ (f g : ℝ → ℝ) (a b : ℝ), a < b → ContinuousOn f (Set.Icc a b) → f a = f b → (∀ x ∈ Set.Ioo a b, HasDerivAt f (g x) x) → ∃ c ∈ Set.Ioo a b, g c = 0
  proof: |
    by
      intro f g a b hab hc he hd
      exact exists_hasDerivAt_eq_zero hab hc he hd

- id: mean_value_theorem
  kind: named
  level: 1
  topic: 平均値の定理
  statement: 平均値の定理。a<bでfが[a,b]で連続、(a,b)で微分可能ならば、f(b)-f(a)=f'(c)(b-a)となるc∈(a,b)が存在する。
  statement_en: Mean value theorem. If a < b, f is continuous on [a,b] and differentiable on (a,b) with derivative g, then f(b) - f(a) = g(c)(b-a) for some c in (a,b).
  assumptions: ["a<b", "fは[a,b]で連続", "fは(a,b)の各点で微分可能で微分係数はg(x)"]
  quantifiers: ["任意の関数f, gと実数a, b", "あるc∈(a,b)"]
  conclusion: f(b)-f(a)=g(c)(b-a)となるc∈(a,b)が存在する。
  answer: |
    h(x)=f(x)-(f(b)-f(a))(x-a)/(b-a)とおく。hは[a,b]で連続、(a,b)で微分可能であり、h(a)=h(b)=f(a)である。ロルの定理より、h'(c)=0となるc∈(a,b)が存在する。h'(c)=g(c)-(f(b)-f(a))/(b-a)なので、結論を得る。
  strategy: Subtract the secant line and apply Rolle's theorem.
  sketch:
    - "construct: Let h(x) = f(x) - (f(b)-f(a))(x-a)/(b-a)."
    - "derive: h(a) = h(b) and h is differentiable on (a,b)."
    - "apply_theorem: Rolle's theorem gives c with h'(c) = 0."
    - "conclude: Rearranging gives f(b)-f(a) = g(c)(b-a)."
  openmath: (forall (f g a b) (-> (and (< a b) (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (forall (x) (-> (in x (open_interval a b)) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value g x) x)))) (exists (c) (and (in c (open_interval a b)) (= (- (fn_value f b) (fn_value f a)) (* (fn_value g c) (- b a)))))))
  hard_negative:
    statement: 連続性を仮定しなくても、(a,b)で微分可能なら同じ結論が成り立つ。
    reason: 区間[0,1)で0、f(1)=1の関数は(0,1)で微分係数0だが、f(1)-f(0)=1である。
  target: |
    ∀ (f g : ℝ → ℝ) (a b : ℝ), a < b → ContinuousOn f (Set.Icc a b) → (∀ x ∈ Set.Ioo a b, HasDerivAt f (g x) x) → ∃ c ∈ Set.Ioo a b, f b - f a = g c * (b - a)
  proof: |
    by
      intro f g a b hab hc hd
      obtain ⟨c, hc', e⟩ := exists_hasDerivAt_eq_slope f g hab hc hd
      refine ⟨c, hc', ?_⟩
      rw [e, div_mul_cancel₀ _ (sub_ne_zero.mpr hab.ne')]

- id: local_extremum_derivative_zero
  kind: textbook
  level: 1
  topic: 微分法・極値の必要条件
  statement: fがaで極大または極小をとり、aで微分可能ならば、aでの微分係数は0である。
  statement_en: If f has a local extremum at a and has derivative u at a, then u = 0.
  assumptions: ["fはaで極大または極小", "fのaでの微分係数はu"]
  quantifiers: ["任意の関数fと実数a, u"]
  conclusion: u=0である。
  answer: |
    aで極大とする。十分小さいh>0では(f(a+h)-f(a))/h≤0であり、h→0+でu≤0を得る。h<0では(f(a+h)-f(a))/h≥0であり、h→0-でu≥0を得る。よってu=0である。極小の場合は-fに同じ議論を適用する。
  strategy: Compare the signs of the right and left difference quotients.
  sketch:
    - "setup: Treat a local maximum; the minimum follows from -f."
    - "derive: The right difference quotient is at most 0, so u ≤ 0."
    - "derive: The left difference quotient is at least 0, so u ≥ 0."
    - "conclude: Therefore u = 0."
  openmath: (forall (f a u) (-> (and (or (local_max_at (lambda (x) (fn_value f x)) a) (local_min_at (lambda (x) (fn_value f x)) a)) (has_deriv_at (lambda (x) (fn_value f x)) u a)) (= u 0)))
  hard_negative:
    statement: aでの微分係数が0ならば、fはaで極値をとる。
    reason: f(x)=x^3はx=0で微分係数0だが、極値をとらない。
  target: |
    ∀ (f : ℝ → ℝ) (a u : ℝ), IsLocalExtr f a → HasDerivAt f u a → u = 0
  proof: |
    by
      intro f a u he hd
      exact he.hasDerivAt_eq_zero hd

- id: nonnegative_derivative_monotone
  kind: textbook
  level: 1
  topic: 平均値の定理・単調性
  statement: fが[a,b]で連続、(a,b)で微分可能で導関数が非負ならば、fは[a,b]で単調増加である。
  statement_en: If f is continuous on [a,b] and differentiable on (a,b) with nonnegative derivative, then f is nondecreasing on [a,b].
  assumptions: ["fは[a,b]で連続", "fは(a,b)の各点で微分可能で微分係数はg(x)", "x∈(a,b)でg(x)≥0"]
  quantifiers: ["任意の関数f, gと実数a, b"]
  conclusion: fは[a,b]で単調増加である。
  answer: |
    x<yを[a,b]の2点とする。平均値の定理より、f(y)-f(x)=g(c)(y-x)となるc∈(x,y)が存在する。cは(a,b)に属するのでg(c)≥0であり、y-x>0である。よってf(x)≤f(y)である。
  strategy: Apply the mean value theorem on an arbitrary subinterval.
  sketch:
    - "setup: Take x < y in [a,b]."
    - "apply_theorem: The mean value theorem gives c in (x,y) with f(y)-f(x) = g(c)(y-x)."
    - "conclude: Since g(c) ≥ 0 and y-x > 0, f(x) ≤ f(y)."
  openmath: (forall (f g a b) (-> (and (fn_continuous_on (lambda (x) (fn_value f x)) (closed_interval a b)) (forall (x) (-> (in x (open_interval a b)) (and (has_deriv_at (lambda (t) (fn_value f t)) (fn_value g x) x) (>= (fn_value g x) 0))))) (fn_monotone_on (lambda (x) (fn_value f x)) (closed_interval a b))))
  hard_negative:
    statement: 区間とは限らない定義域で導関数が非負なら、fはその定義域で単調増加である。
    reason: 定義域が{x≠0}のとき、f(x)=-1/xの導関数は正だが、f(-1)=1>f(1)=-1である。
  target: |
    ∀ (f g : ℝ → ℝ) (a b : ℝ), ContinuousOn f (Set.Icc a b) → (∀ x ∈ Set.Ioo a b, HasDerivAt f (g x) x) → (∀ x ∈ Set.Ioo a b, 0 ≤ g x) → MonotoneOn f (Set.Icc a b)
  proof: |
    by
      intro f g a b hc hd hn
      refine monotoneOn_of_deriv_nonneg (convex_Icc a b) hc ?_ ?_
      · rw [interior_Icc]
        exact fun x hx => (hd x hx).differentiableAt.differentiableWithinAt
      · rw [interior_Icc]
        intro x hx
        rw [(hd x hx).deriv]
        exact hn x hx

- id: zero_derivative_constant
  kind: gap
  level: 1
  topic: 平均値の定理・定数関数
  statement: fが[a,b]で連続で(a,b)の各点で微分係数が0ならば、fは[a,b]上で定数f(a)に等しい。
  statement_en: If f is continuous on [a,b] and has derivative 0 at every point of (a,b), then f(x) = f(a) for all x in [a,b].
  assumptions: ["fは[a,b]で連続", "x∈(a,b)でfの微分係数は0"]
  quantifiers: ["任意の関数fと実数a, b", "任意のx∈[a,b]"]
  conclusion: f(x)=f(a)である。
  answer: |
    x=aなら明らかである。a<x≤bとする。[a,x]で平均値の定理を用いると、f(x)-f(a)=g(c)(x-a)となるc∈(a,x)が存在し、ここでg(c)はcでの微分係数である。cは(a,b)に属するのでg(c)=0であり、f(x)=f(a)を得る。
  strategy: Apply the mean value theorem on [a,x].
  sketch:
    - "case_split: The case x = a is immediate."
    - "apply_theorem: For a < x use the mean value theorem on [a,x]."
    - "derive: The intermediate derivative vanishes because c lies in (a,b)."
    - "conclude: Hence f(x) = f(a)."
  openmath: (forall (f a b x) (-> (and (fn_continuous_on (lambda (t) (fn_value f t)) (closed_interval a b)) (forall (y) (-> (in y (open_interval a b)) (has_deriv_at (lambda (t) (fn_value f t)) 0 y))) (in x (closed_interval a b))) (= (fn_value f x) (fn_value f a))))
  hard_negative:
    statement: 定義域が区間でなくても、導関数が0ならfは定数である。
    reason: 定義域が{x≠0}のとき、f(x)=x/|x|は導関数が0だが定数でない。
  target: |
    ∀ (f : ℝ → ℝ) (a b : ℝ), ContinuousOn f (Set.Icc a b) → (∀ x ∈ Set.Ioo a b, HasDerivAt f 0 x) → ∀ x ∈ Set.Icc a b, f x = f a
  proof: |
    by
      intro f a b hc hd x hx
      rcases eq_or_lt_of_le hx.1 with rfl | h
      · rfl
      · obtain ⟨c, _, e⟩ := exists_hasDerivAt_eq_slope f (fun _ => (0 : ℝ)) h (hc.mono (Set.Icc_subset_Icc_right hx.2)) (fun y hy => hd y ⟨hy.1, hy.2.trans_le hx.2⟩)
        have hne : x - a ≠ 0 := sub_ne_zero.mpr h.ne'
        have h0 : f x - f a = 0 := by
          have := (eq_div_iff hne).mp e
          linarith
        linarith

- id: same_derivative_differ_by_constant
  kind: gap
  level: 1
  topic: 平均値の定理・原始関数
  statement: f, gが実数全体で微分可能で導関数が等しいならば、ある定数Cについて全てのxでf(x)=g(x)+Cである。
  statement_en: If f and g are differentiable on the reals with the same derivative h, then f(x) = g(x) + C for a constant C and all x.
  assumptions: ["全てのxでfの微分係数はh(x)", "全てのxでgの微分係数はh(x)"]
  quantifiers: ["任意の関数f, g, h", "ある実数C", "任意の実数x"]
  conclusion: f(x)=g(x)+Cである。
  answer: |
    f-gの導関数は0である。平均値の定理より、任意のxでf(x)-g(x)=f(0)-g(0)である。C=f(0)-g(0)とおけばよい。
  strategy: The difference has zero derivative everywhere, so it is constant.
  sketch:
    - "derive: The difference f - g has derivative 0 everywhere."
    - "apply_theorem: A function with zero derivative on the reals is constant."
    - "conclude: Take C = f(0) - g(0)."
  openmath: (forall (f g h) (-> (and (forall (x) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value h x) x)) (forall (x) (has_deriv_at (lambda (t) (fn_value g t)) (fn_value h x) x))) (exists (C) (forall (x) (= (fn_value f x) (+ (fn_value g x) C))))))
  hard_negative:
    statement: 導関数の差が定数ならば、f-gは定数である。
    reason: f(x)=x, g(x)=0では導関数の差は定数1だが、f-g=xは定数でない。
  target: |
    ∀ (f g h : ℝ → ℝ), (∀ x, HasDerivAt f (h x) x) → (∀ x, HasDerivAt g (h x) x) → ∃ C, ∀ x, f x = g x + C
  proof: |
    by
      intro f g h hf hg
      have hd : ∀ x, HasDerivAt (fun y => f y - g y) 0 x := by
        intro x
        have h1 := (hf x).sub (hg x)
        rw [sub_self] at h1
        exact h1
      have hconst := is_const_of_deriv_eq_zero (f := fun y => f y - g y) (fun x => (hd x).differentiableAt) (fun x => (hd x).deriv)
      refine ⟨f 0 - g 0, fun x => ?_⟩
      have h1 : f x - g x = f 0 - g 0 := hconst x 0
      linarith

- id: lipschitz_from_derivative_bound
  kind: gap
  level: 1
  topic: 平均値の定理・リプシッツ評価
  statement: fが実数全体で微分可能で導関数の絶対値がC以下ならば、任意のx, yで|f(y)-f(x)|≤C|y-x|である。
  statement_en: If f is differentiable on the reals with |f'| ≤ C, then |f(y)-f(x)| ≤ C|y-x| for all x, y.
  assumptions: ["全てのxでfの微分係数はg(x)", "全てのxで|g(x)|≤C"]
  quantifiers: ["任意の関数f, gと実数C, x, y"]
  conclusion: 不等式|f(y)-f(x)|≤C|y-x|が成り立つ。
  answer: |
    x=yなら自明である。x≠yなら、平均値の定理によりf(y)-f(x)=g(c)(y-x)となるcがxとyの間に存在する。両辺の絶対値をとると、|f(y)-f(x)|=|g(c)||y-x|≤C|y-x|である。
  strategy: Apply the mean value theorem and bound the intermediate derivative.
  sketch:
    - "case_split: The case x = y is trivial."
    - "apply_theorem: For x ≠ y the mean value theorem gives c with f(y)-f(x) = g(c)(y-x)."
    - "conclude: Taking absolute values and using |g(c)| ≤ C gives the bound."
  openmath: (forall (f g C x y) (-> (and (forall (t) (has_deriv_at (lambda (s) (fn_value f s)) (fn_value g t) t)) (forall (t) (<= (abs (fn_value g t)) C))) (<= (abs (- (fn_value f y) (fn_value f x))) (* C (abs (- y x))))))
  hard_negative:
    statement: fが有界ならば、fはあるCで|f(y)-f(x)|≤C|y-x|を満たす。
    reason: sin(x^2)は有界だが導関数が非有界で、この評価を満たすCは存在しない。
  target: |
    ∀ (f g : ℝ → ℝ) (C x y : ℝ), (∀ t, HasDerivAt f (g t) t) → (∀ t, |g t| ≤ C) → |f y - f x| ≤ C * |y - x|
  proof: |
    by
      intro f g C x y hd hb
      have := Convex.norm_image_sub_le_of_norm_hasDerivWithin_le (s := Set.univ) (C := C) (f := f) (f' := g) (x := x) (y := y) (fun t _ => (hd t).hasDerivWithinAt) (fun t _ => by simpa only [Real.norm_eq_abs] using hb t) convex_univ (Set.mem_univ _) (Set.mem_univ _)
      simpa only [Real.norm_eq_abs] using this

- id: first_derivative_test_minimum
  kind: textbook
  level: 1
  topic: 微分法・第1次導関数判定
  statement: fがaで連続でaの除外近傍で微分可能であり、aの左側でf'≤0、右側でf'≥0ならば、fはaで極小をとる。
  statement_en: If f is continuous at a, differentiable on a punctured neighborhood of a, with f' ≤ 0 on the left of a and f' ≥ 0 on the right, then f has a local minimum at a.
  assumptions: ["δ>0", "fはaで連続", "0<|x-a|<δでfは微分可能", "a-δ<x<aでf'(x)≤0", "a<x<a+δでf'(x)≥0"]
  quantifiers: ["任意の関数fと実数a, δ"]
  conclusion: fはaで極小をとる。
  answer: |
    fは[a-δ/2,a]で連続で、その内部で導関数が非正なので単調減少である。よってa-δ/2≤x≤aでf(x)≥f(a)である。同様に[a,a+δ/2]では単調増加なので、f(x)≥f(a)である。したがってaの近傍でf(x)≥f(a)であり、aは極小点である。
  strategy: Apply monotonicity from the sign of the derivative separately on each side.
  sketch:
    - "derive: On the left of a, f is nonincreasing, so f(x) ≥ f(a)."
    - "derive: On the right of a, f is nondecreasing, so f(x) ≥ f(a)."
    - "conclude: Both sides give f(x) ≥ f(a) near a, so a is a local minimum."
  openmath: (forall (f g a d) (-> (and (> d 0) (fn_continuous_at (lambda (x) (fn_value f x)) a) (forall (x) (-> (and (!= x a) (< (abs (- x a)) d)) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value g x) x))) (forall (x) (-> (in x (open_interval (- a d) a)) (<= (fn_value g x) 0))) (forall (x) (-> (in x (open_interval a (+ a d))) (>= (fn_value g x) 0)))) (local_min_at (lambda (x) (fn_value f x)) a)))
  hard_negative:
    statement: 連続性を仮定しなくても、左側でf'≤0、右側でf'≥0ならばaは極小点である。
    reason: x≠0でf(x)=x^2, f(0)=1とすると符号の条件は満たすが、0は極小点でない。
  target: |
    ∀ (f g : ℝ → ℝ) (a δ : ℝ), 0 < δ → ContinuousAt f a → (∀ x, x ≠ a → |x - a| < δ → HasDerivAt f (g x) x) → (∀ x ∈ Set.Ioo (a - δ) a, g x ≤ 0) → (∀ x ∈ Set.Ioo a (a + δ), 0 ≤ g x) → IsLocalMin f a
  proof: |
    by
      intro f g a δ hδ hc hd hl hr
      have hnear : ∀ x ∈ Set.Ioo (a - δ) a, HasDerivAt f (g x) x := fun x hx =>
        hd x hx.2.ne (by rw [abs_lt]; constructor <;> linarith [hx.1, hx.2])
      have hnear' : ∀ x ∈ Set.Ioo a (a + δ), HasDerivAt f (g x) x := fun x hx =>
        hd x hx.1.ne' (by rw [abs_lt]; constructor <;> linarith [hx.1, hx.2])
      refine isLocalMin_of_deriv hc ?_ ?_ ?_
      · refine eventually_nhdsWithin_iff.mpr (Metric.eventually_nhds_iff.mpr ⟨δ, hδ, fun x hx hne => ?_⟩)
        exact (hd x hne (by rwa [Real.dist_eq] at hx)).differentiableAt
      · filter_upwards [Ioo_mem_nhdsLT (show a - δ < a by linarith)] with x hx
        rw [(hnear x hx).deriv]
        exact hl x hx
      · filter_upwards [Ioo_mem_nhdsGT (show a < a + δ by linarith)] with x hx
        rw [(hnear' x hx).deriv]
        exact hr x hx

- id: second_derivative_test_maximum
  kind: textbook
  level: 1
  topic: 微分法・第2次導関数判定
  statement: fのaでの微分係数が0で、導関数のaでの微分係数が負ならば、fはaで極大をとる。
  statement_en: If f has derivative 0 at a and the derivative of f has a negative derivative at a, then f has a local maximum at a.
  assumptions: ["fのaでの微分係数は0", "導関数f'のaでの微分係数はu", "u<0"]
  quantifiers: ["任意の関数fと実数a, u"]
  conclusion: fはaで極大をとる。
  answer: |
    f'(a)=0かつf''(a)=u<0なので、aに十分近いxではf'(x)/(x-a)<0である。よってaの左側でf'>0、右側でf'<0となる。fはaの左側で増加し右側で減少するので、aで極大をとる。
  strategy: The sign of the second derivative determines the sign of f' on each side.
  sketch:
    - "derive: Since f'(a) = 0 and u < 0, f'(x)/(x-a) is negative near a."
    - "derive: So f' is positive on the left of a and negative on the right."
    - "apply_theorem: The first derivative test applies."
    - "conclude: Thus a is a local maximum."
  openmath: (forall (f a u) (-> (and (has_deriv_at (lambda (x) (fn_value f x)) 0 a) (has_deriv_at (lambda (x) (deriv_value f x)) u a) (< u 0)) (local_max_at (lambda (x) (fn_value f x)) a)))
  hard_negative:
    statement: f'(a)=0かつf''(a)≤0ならば、fはaで極大をとる。
    reason: f(x)=x^3は a=0でf'(0)=f''(0)=0だが、極大をとらない。
  target: |
    ∀ (f : ℝ → ℝ) (a u : ℝ), HasDerivAt f 0 a → HasDerivAt (deriv f) u a → u < 0 → IsLocalMax f a
  proof: |
    by
      intro f a u hf h2 hu
      exact isLocalMax_of_deriv_deriv_neg (by rw [h2.deriv]; exact hu) hf.deriv hf.continuousAt

- id: taylor_lagrange_remainder
  kind: named
  level: 2
  topic: テイラーの定理・ラグランジュの剰余
  statement: テイラーの定理。a≠xでfがaとxを端点とする閉区間でC^n級、そのn階導関数が開区間で微分可能ならば、開区間のある点cについてf(x)=Σ_{k=0}^n f^(k)(a)(x-a)^k/k!+f^(n+1)(c)(x-a)^(n+1)/(n+1)!である。導関数はこの閉区間内での導関数とする。
  statement_en: Taylor's theorem with Lagrange remainder. If a ≠ x, f is C^n on the closed interval between a and x, and the n-th derivative within that interval is differentiable on the open interval, then for some c in the open interval, f(x) = sum_{k≤n} f^(k)(a)(x-a)^k/k! + f^(n+1)(c)(x-a)^(n+1)/(n+1)!, with derivatives taken within the closed interval.
  assumptions: ["a≠x", "fはaとxを端点とする閉区間Iで C^n級", "n階導関数は開区間で微分可能"]
  quantifiers: ["任意の関数f、実数a, x、自然数n", "aとxの間のあるc"]
  conclusion: f(x)はn次のテイラー多項式の値とラグランジュの剰余の和に等しい。
  answer: |
    F(t)=f(x)-Σ_{k=0}^n f^(k)(t)(x-t)^k/k!とおく。項別に微分すると和が打ち消し合い、F'(t)=-f^(n+1)(t)(x-t)^n/n!となる。G(t)=(x-t)^(n+1)とおき、aとxを端点とする区間でFとGにコーシーの平均値の定理を用いる。F(x)=G(x)=0より、F(a)/G(a)=F'(c)/G'(c)=f^(n+1)(c)/(n+1)!となるcが存在する。F(a)はテイラー多項式の剰余なので、これを整理すると結論を得る。
  strategy: Apply Cauchy's mean value theorem to the remainder as a function of the expansion point and to (x-t)^(n+1).
  sketch:
    - "construct: Let F(t) = f(x) - sum_{k≤n} f^(k)(t)(x-t)^k/k!."
    - "derive: The derivative telescopes to F'(t) = -f^(n+1)(t)(x-t)^n/n!."
    - "construct: Let G(t) = (x-t)^(n+1), so G(x) = 0 = F(x)."
    - "apply_theorem: Cauchy's mean value theorem gives c with F(a)/G(a) = F'(c)/G'(c)."
    - "derive: The quotient on the right equals f^(n+1)(c)/(n+1)!."
    - "conclude: Rearranging gives the Lagrange form."
  openmath: (forall (f a x n) (-> (and (!= a x) (in n N) (cont_diff_on (lambda (t) (fn_value f t)) n (closed_interval_between a x)) (differentiable_on (lambda (t) (iterated_deriv_within (lambda (s) (fn_value f s)) n (closed_interval_between a x) t)) (open_interval_between a x))) (exists (c) (and (in c (open_interval_between a x)) (= (fn_value f x) (+ (sum (natural_range (+ n 1)) (lambda (k) (* (/ (iterated_deriv_within (lambda (s) (fn_value f s)) k (closed_interval_between a x) a) (factorial k)) (^ (- x a) k)))) (/ (* (iterated_deriv_within (lambda (s) (fn_value f s)) (+ n 1) (closed_interval_between a x) c) (^ (- x a) (+ n 1))) (factorial (+ n 1)))))))))
  hard_negative:
    statement: C^∞級の関数はテイラー級数の和に常に等しい。
    reason: x≠0でexp(-1/x^2), f(0)=0はC^∞級で、0でのテイラー級数は恒等的に0だが、関数は0でない。
  target: |
    ∀ (f : ℝ → ℝ) (a x : ℝ) (n : ℕ), a ≠ x → ContDiffOn ℝ n f (Set.uIcc a x) → DifferentiableOn ℝ (iteratedDerivWithin n f (Set.uIcc a x)) (Set.uIoo a x) → ∃ c ∈ Set.uIoo a x, f x = ∑ k ∈ Finset.range (n + 1), iteratedDerivWithin k f (Set.uIcc a x) a / (k.factorial : ℝ) * (x - a) ^ k + iteratedDerivWithin (n + 1) f (Set.uIcc a x) c * (x - a) ^ (n + 1) / ((n + 1).factorial : ℝ)
  proof: |
    by
      intro f a x n hax hf hd
      obtain ⟨c, hc, e⟩ := taylor_mean_remainder_lagrange hax hf hd
      refine ⟨c, hc, ?_⟩
      rw [taylor_within_apply] at e
      have hs : ∑ k ∈ Finset.range (n + 1), iteratedDerivWithin k f (Set.uIcc a x) a / (k.factorial : ℝ) * (x - a) ^ k = ∑ k ∈ Finset.range (n + 1), ((k.factorial : ℝ)⁻¹ * (x - a) ^ k) • iteratedDerivWithin k f (Set.uIcc a x) a := by
        refine Finset.sum_congr rfl fun k _ => ?_
        rw [smul_eq_mul]
        ring
      rw [hs, ← e]
      ring

- id: taylor_second_order
  kind: gap
  level: 1
  topic: テイラーの定理・2次の展開
  statement: fが実数全体で2回微分可能で、a<bならば、あるc∈(a,b)についてf(b)=f(a)+f'(a)(b-a)+f''(c)(b-a)^2/2である。
  statement_en: If f is twice differentiable on the reals with first derivative f1 and second derivative f2, and a < b, then f(b) = f(a) + f1(a)(b-a) + f2(c)(b-a)²/2 for some c in (a,b).
  assumptions: ["a<b", "全てのxでfの微分係数はf_1(x)", "全てのxでf_1の微分係数はf_2(x)"]
  quantifiers: ["任意の関数f, f_1, f_2と実数a, b", "あるc∈(a,b)"]
  conclusion: f(b)=f(a)+f_1(a)(b-a)+f_2(c)(b-a)^2/2となるc∈(a,b)が存在する。
  answer: |
    定数Kをf(b)=f(a)+f_1(a)(b-a)+K(b-a)^2/2となるように定める。g(x)=f(x)-f(a)-f_1(a)(x-a)-K(x-a)^2/2とおくと、g(a)=g(b)=0である。ロルの定理より、g'(c_1)=0となるc_1∈(a,b)が存在する。g'(x)=f_1(x)-f_1(a)-K(x-a)はg'(a)=0を満たすので、再びロルの定理より、g''(c)=f_2(c)-K=0となるc∈(a,c_1)が存在する。このcについてK=f_2(c)である。
  strategy: Choose the constant making the error vanish at b, then apply Rolle's theorem twice.
  sketch:
    - "construct: Choose K with f(b) = f(a) + f1(a)(b-a) + K(b-a)²/2."
    - "construct: Define g(x) = f(x) - f(a) - f1(a)(x-a) - K(x-a)²/2, so g(a) = g(b) = 0."
    - "apply_theorem: Rolle's theorem gives c1 in (a,b) with g'(c1) = 0."
    - "derive: Also g'(a) = 0, so Rolle's theorem applied to g' gives c in (a,c1) with g''(c) = 0."
    - "conclude: Since g''(c) = f2(c) - K, we get K = f2(c)."
  openmath: (forall (f f1 f2 a b) (-> (and (< a b) (forall (x) (has_deriv_at (lambda (t) (fn_value f t)) (fn_value f1 x) x)) (forall (x) (has_deriv_at (lambda (t) (fn_value f1 t)) (fn_value f2 x) x))) (exists (c) (and (in c (open_interval a b)) (= (fn_value f b) (+ (fn_value f a) (* (fn_value f1 a) (- b a)) (/ (* (fn_value f2 c) (^ (- b a) 2)) 2)))))))
  hard_negative:
    statement: 上の等式でcをaに取り替えても成り立つ。
    reason: f(x)=x^3, a=0, b=1ではf_2(0)=0となり、右辺は0だが左辺は1である。
  target: |
    ∀ (f f1 f2 : ℝ → ℝ) (a b : ℝ), a < b → (∀ x, HasDerivAt f (f1 x) x) → (∀ x, HasDerivAt f1 (f2 x) x) → ∃ c ∈ Set.Ioo a b, f b = f a + f1 a * (b - a) + f2 c * (b - a) ^ 2 / 2
  proof: |
    by
      intro f f1 f2 a b hab hf hf1
      have hba : b - a ≠ 0 := sub_ne_zero.mpr hab.ne'
      obtain ⟨K, hK⟩ : ∃ K : ℝ, K * (b - a) ^ 2 / 2 = f b - f a - f1 a * (b - a) :=
        ⟨(f b - f a - f1 a * (b - a)) * 2 / (b - a) ^ 2, by field_simp⟩
      have hg : ∀ x, HasDerivAt (fun y => f y - f a - f1 a * (y - a) - K * (y - a) ^ 2 / 2) (f1 x - f1 a - K * (x - a)) x := by
        intro x
        have h1 := (hf x).sub_const (f a)
        have h2 : HasDerivAt (fun y => f1 a * (y - a)) (f1 a) x := by
          simpa using ((hasDerivAt_id x).sub_const a).const_mul (f1 a)
        have h3 : HasDerivAt (fun y => K * (y - a) ^ 2 / 2) (K * (x - a)) x := by
          have h4 := (((hasDerivAt_id' x).sub_const a).pow 2).const_mul K |>.div_const 2
          exact h4.congr_deriv (by norm_num; ring)
        exact (h1.sub h2).sub h3
      obtain ⟨c1, hc1, e1⟩ := exists_hasDerivAt_eq_zero hab (fun x _ => (hg x).continuousAt.continuousWithinAt) (by simp; linarith) (fun x _ => hg x)
      have hg2 : ∀ x, HasDerivAt (fun y => f1 y - f1 a - K * (y - a)) (f2 x - K) x := by
        intro x
        have h1 := (hf1 x).sub_const (f1 a)
        have h2 : HasDerivAt (fun y => K * (y - a)) K x := by
          simpa using ((hasDerivAt_id x).sub_const a).const_mul K
        exact h1.sub h2
      obtain ⟨c, hc, e2⟩ := exists_hasDerivAt_eq_zero hc1.1 (fun x _ => (hg2 x).continuousAt.continuousWithinAt) (by simp; linarith) (fun x _ => hg2 x)
      refine ⟨c, ⟨hc.1, hc.2.trans hc1.2⟩, ?_⟩
      have hKc : f2 c = K := by linarith
      rw [hKc]
      linarith

- id: add_one_le_exp
  kind: gap
  level: 1
  topic: 指数関数・基本不等式
  statement: 任意の実数xに対して1+x≤e^xである。
  statement_en: For every real x, 1 + x ≤ e^x.
  assumptions: ["xは実数"]
  quantifiers: ["任意の実数x"]
  conclusion: 1+x≤e^xである。
  answer: |
    g(x)=e^x-1-xとおくと、g'(x)=e^x-1である。g'はx<0で負、x>0で正なので、gはx=0で最小値をとる。g(0)=0より、全てのxでg(x)≥0である。
  strategy: Minimize e^x - 1 - x using the sign of its derivative.
  sketch:
    - "construct: Let g(x) = e^x - 1 - x."
    - "derive: g'(x) = e^x - 1 is negative for x < 0 and positive for x > 0."
    - "conclude: g attains its minimum g(0) = 0, so g ≥ 0."
  openmath: (forall (x) (<= (+ 1 x) (exp x)))
  hard_negative:
    statement: 任意の実数xに対して1+x+x^2/2≤e^xである。
    reason: x=-1で左辺は1/2だが、右辺はe^(-1)≈0.37である。この不等式が成り立つのはx≥0のときである。
  target: |
    ∀ x : ℝ, 1 + x ≤ Real.exp x
  proof: |
    by
      intro x
      linarith [Real.add_one_le_exp x]

- id: log_le_sub_one
  kind: gap
  level: 1
  topic: 対数関数・基本不等式
  statement: 任意のx>0に対してlog x≤x-1である。
