  topic: コーシー・シュワルツの不等式・等号条件
  statement: 実数$a,b,c,x,y,z$について、$(ax+by+cz)^2=(a^2+b^2+c^2)(x^2+y^2+z^2)$と、$ay=bx$、$bz=cy$、$az=cx$がすべて成り立つことは同値である。
  statement_en: For real a, b, c, x, y, z, (ax+by+cz)^2 = (a^2+b^2+c^2)(x^2+y^2+z^2) if and only if ay = bx, bz = cy and az = cx.
  assumptions:
  - $a,b,c,x,y,z$は実数
  quantifiers:
  - 任意の実数$a,b,c,x,y,z$
  conclusion: 等式が成り立つことと、$ay=bx$、$bz=cy$、$az=cx$がすべて成り立つことは同値である。
  answer: |
    $a,b,c,x,y,z$を実数とする。$(a^2+b^2+c^2)(x^2+y^2+z^2)-(ax+by+cz)^2=(ay-bx)^2+(bz-cy)^2+(az-cx)^2$である。平方の和が$0$であることと各平方が$0$であることは同値なので、等式が成り立つことと$ay=bx$、$bz=cy$、$az=cx$がすべて成り立つことは同値である。
  strategy: Use the three-square identity for the difference of the two sides.
  sketch:
  - 'derive: The difference equals (ay-bx)^2 + (bz-cy)^2 + (az-cx)^2.'
  - 'derive: A sum of squares vanishes exactly when every square vanishes.'
  - 'conclude: The equality condition is ay = bx, bz = cy, az = cx.'
  openmath: (forall (a b c x y z) (<-> (= (^ (+ (+ (* a x) (* b y)) (* c z)) 2) (* (+ (+ (^ a 2) (^ b 2)) (^ c 2)) (+ (+ (^ x 2) (^ y 2)) (^ z 2)))) (and (= (* a y) (* b x)) (= (* b z) (* c y)) (= (* a z) (* c x)))))
  hard_negative:
    statement: 等号が成り立つのは、$x,y,z$が$0$でなく$\dfrac{a}{x}=\dfrac{b}{y}=\dfrac{c}{z}$であるときに限る。
    reason: $a=b=c=1$、$x=y=z=0$のとき両辺は$0$で等号が成り立つが、比は定義されない。$x,y,z$に$0$を含む場合があるので、比ではなく積で書く必要がある。
  target: |
    ∀ a b c x y z : ℝ, (a * x + b * y + c * z) ^ 2 = (a ^ 2 + b ^ 2 + c ^ 2) * (x ^ 2 + y ^ 2 + z ^ 2) ↔ (a * y = b * x ∧ b * z = c * y ∧ a * z = c * x)
  proof: |
    by
      intro a b c x y z
      have key : (a ^ 2 + b ^ 2 + c ^ 2) * (x ^ 2 + y ^ 2 + z ^ 2) - (a * x + b * y + c * z) ^ 2 = (a * y - b * x) ^ 2 + (b * z - c * y) ^ 2 + (a * z - c * x) ^ 2 := by
        ring
      have h1 := sq_nonneg (a * y - b * x)
      have h2 := sq_nonneg (b * z - c * y)
      have h3 := sq_nonneg (a * z - c * x)
      constructor
      · intro h
        have e1 : (a * y - b * x) ^ 2 = 0 := by linarith
        have e2 : (b * z - c * y) ^ 2 = 0 := by linarith
        have e3 : (a * z - c * x) ^ 2 = 0 := by linarith
        have f1 : a * y - b * x = 0 := (pow_eq_zero_iff (by norm_num)).1 e1
        have f2 : b * z - c * y = 0 := (pow_eq_zero_iff (by norm_num)).1 e2
        have f3 : a * z - c * x = 0 := (pow_eq_zero_iff (by norm_num)).1 e3
        exact ⟨by linarith, by linarith, by linarith⟩
      · rintro ⟨g1, g2, g3⟩
        rw [sub_eq_zero.2 g1, sub_eq_zero.2 g2, sub_eq_zero.2 g3] at key
        linarith
- id: titu_three_terms
  kind: gap
  level: high
  topic: コーシー・シュワルツの不等式・分数の和
  statement: 実数$a,b,c$と正の実数$x,y,z$について、$\dfrac{a^2}{x}+\dfrac{b^2}{y}+\dfrac{c^2}{z}\geq\dfrac{(a+b+c)^2}{x+y+z}$である。
  statement_en: For real a, b, c and positive x, y, z, a^2/x + b^2/y + c^2/z ≥ (a+b+c)^2/(x+y+z).
  assumptions:
  - $a,b,c$は実数
  - $x,y,z$は正の実数
  quantifiers:
  - 任意の実数$a,b,c$
  - 任意の正の実数$x,y,z$
  conclusion: $\dfrac{a^2}{x}+\dfrac{b^2}{y}+\dfrac{c^2}{z}\geq\dfrac{(a+b+c)^2}{x+y+z}$である。
  answer: |
    $a,b,c$を実数、$x,y,z$を正の実数とする。分母を払った形を示せばよい。展開して組ごとにまとめると
    $\left(\dfrac{a^2}{x}+\dfrac{b^2}{y}+\dfrac{c^2}{z}\right)(x+y+z)-(a+b+c)^2=\dfrac{(ay-bx)^2}{xy}+\dfrac{(bz-cy)^2}{yz}+\dfrac{(cx-az)^2}{zx}$
    である。右辺は$0$以上なので、$x+y+z>0$で割ると結論を得る。
  strategy: Clear the denominator x+y+z and write the difference as a sum of nonnegative fractions.
  sketch:
  - 'translate: Multiply by the positive number x + y + z.'
  - 'derive: The difference is (ay-bx)^2/(xy) + (bz-cy)^2/(yz) + (cx-az)^2/(zx).'
  - 'derive: Each term is nonnegative.'
  - 'conclude: Dividing by x + y + z gives the claim.'
  openmath: (forall (a b c x y z) (-> (and (> x 0) (> y 0) (> z 0)) (>= (+ (+ (/ (^ a 2) x) (/ (^ b 2) y)) (/ (^ c 2) z)) (/ (^ (+ (+ a b) c) 2) (+ (+ x y) z)))))
  hard_negative:
    statement: $x,y,z$が$0$でなければ、符号によらず$\dfrac{a^2}{x}+\dfrac{b^2}{y}+\dfrac{c^2}{z}\geq\dfrac{(a+b+c)^2}{x+y+z}$である。
    reason: $a=1,b=c=0,x=-1,y=z=2$のとき左辺は$-1$、右辺は$\dfrac{1}{3}$である。分母の正の仮定は外せない。
  target: |
    ∀ a b c x y z : ℝ, 0 < x → 0 < y → 0 < z → (a + b + c) ^ 2 / (x + y + z) ≤ a ^ 2 / x + b ^ 2 / y + c ^ 2 / z
  proof: |
    by
      intro a b c x y z hx hy hz
      rw [div_le_iff₀ (by positivity)]
      have key : (a ^ 2 / x + b ^ 2 / y + c ^ 2 / z) * (x + y + z) - (a + b + c) ^ 2 = (a * y - b * x) ^ 2 / (x * y) + (b * z - c * y) ^ 2 / (y * z) + (c * x - a * z) ^ 2 / (z * x) := by
        field_simp
        ring
      have h : 0 ≤ (a * y - b * x) ^ 2 / (x * y) + (b * z - c * y) ^ 2 / (y * z) + (c * x - a * z) ^ 2 / (z * x) := by
        positivity
      linarith
- id: nesbitt_inequality
  kind: named
  level: high
  topic: 不等式・分数の和
  statement: ネスビットの不等式。正の実数$a,b,c$について、$\dfrac{a}{b+c}+\dfrac{b}{c+a}+\dfrac{c}{a+b}\geq\dfrac{3}{2}$である。
  statement_en: Nesbitt's inequality. For positive reals a, b, c, a/(b+c) + b/(c+a) + c/(a+b) ≥ 3/2.
  assumptions:
  - $a,b,c$は正の実数
  quantifiers:
  - 任意の正の実数$a,b,c$
  conclusion: $\dfrac{a}{b+c}+\dfrac{b}{c+a}+\dfrac{c}{a+b}\geq\dfrac{3}{2}$である。
  answer: |
    $a,b,c$を正の実数とする。通分して整理すると
    $\dfrac{a}{b+c}+\dfrac{b}{c+a}+\dfrac{c}{a+b}-\dfrac{3}{2}=\dfrac{(a+b)(a-b)^2+(b+c)(b-c)^2+(c+a)(c-a)^2}{2(b+c)(c+a)(a+b)}$
    である。分母は正で分子は$0$以上なので、結論を得る。
  strategy: Put everything over a common positive denominator and express the numerator as a sum of nonnegative terms.
  sketch:
  - 'setup: The denominators b+c, c+a, a+b are positive.'
  - 'derive: The difference from 3/2 has numerator (a+b)(a-b)^2 + (b+c)(b-c)^2 + (c+a)(c-a)^2.'
  - 'derive: This numerator is nonnegative and the denominator is positive.'
  - 'conclude: The inequality follows.'
  openmath: (forall (a b c) (-> (and (> a 0) (> b 0) (> c 0)) (>= (+ (+ (/ a (+ b c)) (/ b (+ c a))) (/ c (+ a b))) (/ 3 2))))
  hard_negative:
    statement: 正の実数$a,b,c$について、$\dfrac{a}{b+c}+\dfrac{b}{c+a}+\dfrac{c}{a+b}\leq 2$である。
    reason: $a=10,b=c=1$のとき左辺は$5+\dfrac{2}{11}$である。この式に上限はない。
  target: |
    ∀ a b c : ℝ, 0 < a → 0 < b → 0 < c → 3 / 2 ≤ a / (b + c) + b / (c + a) + c / (a + b)
  proof: |
    by
      intro a b c ha hb hc
      have key : a / (b + c) + b / (c + a) + c / (a + b) - 3 / 2 = ((a + b) * (a - b) ^ 2 + (b + c) * (b - c) ^ 2 + (c + a) * (c - a) ^ 2) / (2 * (b + c) * (c + a) * (a + b)) := by
        field_simp
        ring
      have h : 0 ≤ ((a + b) * (a - b) ^ 2 + (b + c) * (b - c) ^ 2 + (c + a) * (c - a) ^ 2) / (2 * (b + c) * (c + a) * (a + b)) := by
        positivity
      linarith
- id: rearrangement_two_pairs
  kind: gap
  level: high
  topic: 並べ替えの不等式・2項
  statement: 並べ替えの不等式の$2$項の場合の等号条件つきの形。実数$a\leq b$、$x\leq y$について、$ay+bx\leq ax+by$であり、等号が成り立つことと「$a=b$または$x=y$」は同値である。
  statement_en: For reals a ≤ b and x ≤ y, ay + bx ≤ ax + by, with equality if and only if a = b or x = y.
  assumptions:
  - $a,b,x,y$は実数
  - $a\leq b$
  - $x\leq y$
  quantifiers:
  - 任意の実数$a,b,x,y$
  conclusion: $ay+bx\leq ax+by$であり、等号が成り立つことと「$a=b$または$x=y$」は同値である。
  answer: |
    $a,b,x,y$を実数とし、$a\leq b$、$x\leq y$とする。$(ax+by)-(ay+bx)=(b-a)(y-x)$であり、$2$つの因数はどちらも$0$以上なので、不等式が成り立つ。等号が成り立つことは$(b-a)(y-x)=0$、すなわち$a=b$または$x=y$と同値である。
  strategy: Factor the difference as (b-a)(y-x).
  sketch:
  - 'derive: (ax+by) - (ay+bx) = (b-a)(y-x).'
  - 'derive: Both factors are nonnegative.'
  - 'conclude: The bound and the equality condition follow from the factorization.'
  openmath: (forall (a b x y) (-> (and (<= a b) (<= x y)) (and (<= (+ (* a y) (* b x)) (+ (* a x) (* b y))) (<-> (= (+ (* a y) (* b x)) (+ (* a x) (* b y))) (or (= a b) (= x y))))))
  hard_negative:
    statement: 実数$a,b,x,y$について、順序によらず$ay+bx\leq ax+by$である。
    reason: $a=0,b=1,x=1,y=0$のとき左辺は$1$、右辺は$0$である。$2$組が同じ順序に並んでいる必要がある。
  target: |
    ∀ a b x y : ℝ, a ≤ b → x ≤ y → a * y + b * x ≤ a * x + b * y ∧ (a * y + b * x = a * x + b * y ↔ (a = b ∨ x = y))
  proof: |
    by
      intro a b x y hab hxy
      have key : (a * x + b * y) - (a * y + b * x) = (b - a) * (y - x) := by ring
      have h := mul_nonneg (sub_nonneg.2 hab) (sub_nonneg.2 hxy)
      refine ⟨by linarith, ⟨fun e => ?_, ?_⟩⟩
      · have h0 : (b - a) * (y - x) = 0 := by linarith
        rcases mul_eq_zero.1 h0 with h1 | h1
        · left
          linarith
        · right
          linarith
      · rintro (rfl | rfl) <;> ring
- id: rearrangement_three_terms
  kind: textbook
  level: high
  topic: 並べ替えの不等式・3項
  statement: 並べ替えの不等式の$3$項の場合。実数$a\leq b\leq c$、$x_1\leq x_2\leq x_3$と$\{1,2,3\}$の置換$\sigma$について、$ax_3+bx_2+cx_1\leq ax_{\sigma(1)}+bx_{\sigma(2)}+cx_{\sigma(3)}\leq ax_1+bx_2+cx_3$である。
  statement_en: For reals a ≤ b ≤ c and x_1 ≤ x_2 ≤ x_3 and a permutation σ of {1,2,3}, a x_3 + b x_2 + c x_1 ≤ a x_σ(1) + b x_σ(2) + c x_σ(3) ≤ a x_1 + b x_2 + c x_3.
  assumptions:
  - $a,b,c,x_1,x_2,x_3$は実数
  - $a\leq b\leq c$
  - $x_1\leq x_2\leq x_3$
  - $\sigma$は$\{1,2,3\}$の置換
  quantifiers:
  - 任意の実数$a,b,c,x_1,x_2,x_3$
  - 任意の置換$\sigma$
  conclusion: $ax_3+bx_2+cx_1\leq ax_{\sigma(1)}+bx_{\sigma(2)}+cx_{\sigma(3)}\leq ax_1+bx_2+cx_3$である。
  answer: |
    $a\leq b\leq c$、$x_1\leq x_2\leq x_3$を満たす実数と$\{1,2,3\}$の置換$\sigma$をとる。$a_1=a$、$a_2=b$、$a_3=c$と書く。
    隣り合う$i,i+1$で$\sigma(i)>\sigma(i+1)$なら、$\sigma(i)$と$\sigma(i+1)$を入れ替えると、和は$(a_{i+1}-a_i)(x_{\sigma(i)}-x_{\sigma(i+1)})\geq 0$だけ増える。この入れ替えは大小が逆の組の数を$1$つ減らすので、繰り返すと恒等置換に達する。よって和は$ax_1+bx_2+cx_3$以下である。
    逆に$\sigma(i)<\sigma(i+1)$の組を入れ替えると和は増えない。これを繰り返すと$\sigma(1)=3$、$\sigma(2)=2$、$\sigma(3)=1$の配置に達するので、和は$ax_3+bx_2+cx_1$以上である。
  strategy: Swap adjacent out-of-order positions; each swap changes the sum by a product of nonnegative differences.
  sketch:
  - 'derive: Swapping adjacent values of σ changes the sum by (a_(i+1) - a_i)(x_σ(i) - x_σ(i+1)).'
  - 'derive: Removing an inversion never decreases the sum.'
  - 'induction: Repeated swaps reach the identity arrangement, which gives the upper bound.'
  - 'derive: Adding an inversion never increases the sum.'
  - 'conclude: Repeated swaps reach the reversed arrangement, which gives the lower bound.'
  openmath: (forall (a b c v s) (-> (and (<= a b) (<= b c) (<= (seq_value v 0) (seq_value v 1)) (<= (seq_value v 1) (seq_value v 2)) (in s (permutation_set (natural_range 3)))) (and (<= (+ (+ (* a (seq_value v 2)) (* b (seq_value v 1))) (* c (seq_value v 0))) (+ (+ (* a (seq_value v (fn_value s 0))) (* b (seq_value v (fn_value s 1)))) (* c (seq_value v (fn_value s 2))))) (<= (+ (+ (* a (seq_value v (fn_value s 0))) (* b (seq_value v (fn_value s 1)))) (* c (seq_value v (fn_value s 2)))) (+ (+ (* a (seq_value v 0)) (* b (seq_value v 1))) (* c (seq_value v 2)))))))
  hard_negative:
    statement: $a\leq b\leq c$、$x_1\leq x_2\leq x_3$なら、$ax_1+bx_2+cx_3\leq ax_2+bx_3+cx_1$である。
    reason: $a=x_1=0,b=x_2=1,c=x_3=2$のとき左辺は$5$、右辺は$2$である。同じ順序の組合せが最大で、巡回させると和は増えない。
  target: |
    ∀ (a b c x y z : ℝ) (σ : Equiv.Perm (Fin 3)), a ≤ b → b ≤ c → x ≤ y → y ≤ z → a * z + b * y + c * x ≤ a * ![x, y, z] (σ 0) + b * ![x, y, z] (σ 1) + c * ![x, y, z] (σ 2) ∧ a * ![x, y, z] (σ 0) + b * ![x, y, z] (σ 1) + c * ![x, y, z] (σ 2) ≤ a * x + b * y + c * z
  proof: |
    by
      intro a b c x y z σ hab hbc hxy hyz
      have hf : Monotone ![a, b, c] := by
        rw [Fin.monotone_iff_le_succ]
        intro i
        fin_cases i <;> simp [*]
      have hg : Monotone ![x, y, z] := by
        rw [Fin.monotone_iff_le_succ]
        intro i
        fin_cases i <;> simp [*]
      have hup := (hf.monovary hg).sum_mul_comp_perm_le_sum_mul (σ := σ)
      have hanti : Antivary ![a, b, c] (fun i => ![x, y, z] (Fin.rev i)) :=
        hf.antivary (hg.comp_antitone Fin.rev_anti)
      have hdown := hanti.sum_mul_le_sum_mul_comp_perm (σ := σ.trans Fin.revPerm)
      have r0 : Fin.rev (0 : Fin 3) = 2 := rfl
      have r1 : Fin.rev (1 : Fin 3) = 1 := rfl
      have r2 : Fin.rev (2 : Fin 3) = 0 := rfl
      simp only [Fin.sum_univ_three, Equiv.trans_apply, Fin.revPerm_apply, Fin.rev_rev, r0, r1, r2] at hup hdown
      exact ⟨by simpa using hdown, by simpa using hup⟩
- id: rearrangement_finite
  kind: named
  level: high
  topic: 並べ替えの不等式・有限個
  statement: 並べ替えの不等式。単調増加な実数列$a_1\leq\cdots\leq a_n$、$x_1\leq\cdots\leq x_n$と$\{1,\ldots,n\}$の置換$\sigma$について、$\sum_{i=1}^n a_ix_{n+1-i}\leq\sum_{i=1}^n a_ix_{\sigma(i)}\leq\sum_{i=1}^n a_ix_i$である。
  statement_en: Rearrangement inequality. For nondecreasing reals a_1 ≤ ... ≤ a_n and x_1 ≤ ... ≤ x_n and a permutation σ of {1,...,n}, Σ a_i x_(n+1-i) ≤ Σ a_i x_σ(i) ≤ Σ a_i x_i.
  assumptions:
  - $n$は$0$以上の整数
  - $a_1\leq\cdots\leq a_n$は実数
  - $x_1\leq\cdots\leq x_n$は実数
  - $\sigma$は$\{1,\ldots,n\}$の置換
  quantifiers:
  - 任意の$n$
  - 任意の単調増加な実数列$a_i,x_i$
  - 任意の置換$\sigma$
  conclusion: $\sum_{i=1}^n a_ix_{n+1-i}\leq\sum_{i=1}^n a_ix_{\sigma(i)}\leq\sum_{i=1}^n a_ix_i$である。
  answer: |
    $a_1\leq\cdots\leq a_n$、$x_1\leq\cdots\leq x_n$を実数、$\sigma$を$\{1,\ldots,n\}$の置換とする。
    右の不等式を示す。$\sigma$が恒等置換でなければ、$\sigma(i)>\sigma(i+1)$となる$i$がある。$\sigma(i)$と$\sigma(i+1)$を入れ替えると、和は$(a_{i+1}-a_i)(x_{\sigma(i)}-x_{\sigma(i+1)})\geq 0$だけ増え、大小が逆の組の数は$1$つ減る。これを繰り返すと恒等置換に達するので、右の不等式を得る。
    左の不等式を示す。$y_i=-x_{n+1-i}$とおくと$y_1\leq\cdots\leq y_n$である。$\tau(i)=n+1-\sigma(i)$は置換であり、$y_{\tau(i)}=-x_{\sigma(i)}$である。右の不等式を$y$と$\tau$に適用すると$-\sum_i a_ix_{\sigma(i)}\leq-\sum_i a_ix_{n+1-i}$となり、左の不等式を得る。
  strategy: Remove inversions by adjacent swaps for the upper bound, then negate and reverse the sequence for the lower bound.
  sketch:
  - 'setup: Compare the sum for σ with the sum after swapping an adjacent inversion.'
  - 'derive: The swap increases the sum by a product of nonnegative differences.'
  - 'induction: The number of inversions drops by one, so the identity is reached.'
  - 'construct: Apply the upper bound to y_i = -x_(n+1-i) and τ(i) = n+1-σ(i).'
  - 'conclude: Multiplying by -1 gives the lower bound.'
  openmath: (forall (n a x s) (-> (and (in n N) (forall (i j) (-> (and (in i (natural_range n)) (in j (natural_range n)) (<= i j)) (and (<= (seq_value a i) (seq_value a j)) (<= (seq_value x i) (seq_value x j))))) (in s (permutation_set (natural_range n)))) (and (<= (sum (natural_range n) (lambda (i) (* (seq_value a i) (seq_value x (- (- n 1) i))))) (sum (natural_range n) (lambda (i) (* (seq_value a i) (seq_value x (fn_value s i)))))) (<= (sum (natural_range n) (lambda (i) (* (seq_value a i) (seq_value x (fn_value s i))))) (sum (natural_range n) (lambda (i) (* (seq_value a i) (seq_value x i))))))))
  hard_negative:
    statement: 実数列$a_i$と$x_i$の順序によらず、$\sum_i a_ix_{\sigma(i)}\leq\sum_i a_ix_i$である。
    reason: $n=2$、$a=(0,1)$、$x=(1,0)$、$\sigma$を入れ替えとすると左辺は$0\cdot 0+1\cdot 1=1$、右辺は$0$である。$2$つの列が同じ順序に並ぶことが要る。
  target: |
    ∀ (n : ℕ) (a x : Fin n → ℝ) (σ : Equiv.Perm (Fin n)), Monotone a → Monotone x → ∑ i, a i * x (Fin.rev i) ≤ ∑ i, a i * x (σ i) ∧ ∑ i, a i * x (σ i) ≤ ∑ i, a i * x i
  proof: |
    by
      intro n a x σ ha hx
      have hanti : Antivary a (fun i => x (Fin.rev i)) :=
        ha.antivary (hx.comp_antitone Fin.rev_anti)
      have hdown := hanti.sum_mul_le_sum_mul_comp_perm (σ := σ.trans Fin.revPerm)
      simp only [Equiv.trans_apply, Fin.revPerm_apply, Fin.rev_rev] at hdown
      exact ⟨hdown, (ha.monovary hx).sum_mul_comp_perm_le_sum_mul⟩
- id: chebyshev_three_terms
  kind: textbook
  level: high
  topic: チェビシェフの不等式・3項
  statement: チェビシェフの和の不等式の$3$項で同順の場合。実数$a\leq b\leq c$、$x\leq y\leq z$について、$(a+b+c)(x+y+z)\leq 3(ax+by+cz)$である。
  statement_en: For reals a ≤ b ≤ c and x ≤ y ≤ z, (a+b+c)(x+y+z) ≤ 3(ax+by+cz).
  assumptions:
  - $a,b,c,x,y,z$は実数
  - $a\leq b\leq c$
  - $x\leq y\leq z$
  quantifiers:
  - 任意の実数$a,b,c,x,y,z$
