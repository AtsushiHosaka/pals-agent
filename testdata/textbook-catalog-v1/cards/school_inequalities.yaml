    reason: $(a,b,c)=(0,1,2)$、$(x,y,z)=(2,1,0)$のとき左辺は$9$、右辺は$3$である。逆順では不等号が反転する。
  target: |
    ∀ a b c x y z : ℝ, a ≤ b → b ≤ c → x ≤ y → y ≤ z → (a + b + c) * (x + y + z) ≤ 3 * (a * x + b * y + c * z)
