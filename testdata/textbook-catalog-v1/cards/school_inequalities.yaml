  conclusion: $a^2+b^2\geq 2ab$であり、等号が成り立つことと$a=b$は同値である。
  answer: |
    $a,b$を実数とする。$a^2+b^2-2ab=(a-b)^2\geq 0$なので、$a^2+b^2\geq 2ab$である。等号が成り立つことは$(a-b)^2=0$、すなわち$a=b$と同値である。
  strategy: Write the difference as the square of a - b.
  sketch:
  - 'derive: a^2 + b^2 - 2ab = (a-b)^2 ≥ 0.'
  - 'derive: Equality means (a-b)^2 = 0.'
  - 'conclude: This is equivalent to a = b.'
  openmath: (forall (a b) (and (>= (+ (^ a 2) (^ b 2)) (* (* 2 a) b)) (<-> (= (+ (^ a 2) (^ b 2)) (* (* 2 a) b)) (= a b))))
  hard_negative:
