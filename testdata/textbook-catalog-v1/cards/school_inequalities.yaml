  - 'apply_theorem: Three-term Cauchy-Schwarz gives (ax+by+cz)^2 ≤ (rs)^2.'
  - 'derive: Since rs > 0, ax+by+cz ≤ rs.'
  - 'construct: Take x = ra/s, y = rb/s, z = rc/s.'
  - 'conclude: This point lies on the sphere and gives the value rs.'
  openmath: (forall (a b c r) (-> (and (> (+ (+ (^ a 2) (^ b 2)) (^ c 2)) 0) (> r 0)) (and (forall (x y z) (-> (= (+ (+ (^ x 2) (^ y 2)) (^ z 2)) (^ r 2)) (<= (+ (+ (* a x) (* b y)) (* c z)) (* r (root (+ (+ (^ a 2) (^ b 2)) (^ c 2)) 2))))) (exists (x y z) (and (= (+ (+ (^ x 2) (^ y 2)) (^ z 2)) (^ r 2)) (= (+ (+ (* a x) (* b y)) (* c z)) (* r (root (+ (+ (^ a 2) (^ b 2)) (^ c 2)) 2))))))))
