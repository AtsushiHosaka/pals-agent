  strategy: Apply three-term Cauchy-Schwarz for the bound and take (x,y,z) proportional to (a,b,c) for attainment.
  sketch:
  - 'setup: Put S = a^2 + b^2 + c^2 > 0.'
  - 'apply_theorem: Three-term Cauchy-Schwarz gives d^2 ≤ S(x^2+y^2+z^2).'
  - 'construct: Take x = ad/S, y = bd/S, z = cd/S.'
  - 'derive: This point satisfies the constraint and gives the value d^2/S.'
  - 'conclude: The minimum is d^2/S.'
  openmath: (forall (a b c d) (-> (> (+ (+ (^ a 2) (^ b 2)) (^ c 2)) 0) (and (forall (x y z) (-> (= (+ (+ (* a x) (* b y)) (* c z)) d) (<= (/ (^ d 2) (+ (+ (^ a 2) (^ b 2)) (^ c 2))) (+ (+ (^ x 2) (^ y 2)) (^ z 2))))) (exists (x y z) (and (= (+ (+ (* a x) (* b y)) (* c z)) d) (= (+ (+ (^ x 2) (^ y 2)) (^ z 2)) (/ (^ d 2) (+ (+ (^ a 2) (^ b 2)) (^ c 2)))))))))
