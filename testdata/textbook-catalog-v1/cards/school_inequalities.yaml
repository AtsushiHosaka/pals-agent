- id: chebyshev_finite
  kind: named
  level: high
  topic: チェビシェフの不等式・有限個
  statement: チェビシェフの和の不等式。単調増加な実数列$a_1\leq\cdots\leq a_n$と実数列$x_1,\ldots,x_n$について、$x_i$が単調増加なら$\left(\sum_i a_i\right)\left(\sum_i x_i\right)\leq n\sum_i a_ix_i$であり、$x_i$が単調減少なら$n\sum_i a_ix_i\leq\left(\sum_i a_i\right)\left(\sum_i x_i\right)$である。
  statement_en: Chebyshev's sum inequality. For nondecreasing reals a_1 ≤ ... ≤ a_n and reals x_1, ..., x_n, if x is nondecreasing then (Σ a_i)(Σ x_i) ≤ n Σ a_i x_i, and if x is nonincreasing then n Σ a_i x_i ≤ (Σ a_i)(Σ x_i).
  assumptions:
  - $n$は$0$以上の整数
  - $a_1\leq\cdots\leq a_n$は実数
  - $x_1,\ldots,x_n$は実数
  quantifiers:
  - 任意の$n$
  - 任意の実数列$a_i,x_i$
  conclusion: $x_i$が単調増加なら$\left(\sum_i a_i\right)\left(\sum_i x_i\right)\leq n\sum_i a_ix_i$であり、$x_i$が単調減少なら逆向きの不等式が成り立つ。
  answer: |
    $a_1\leq\cdots\leq a_n$、$x_1,\ldots,x_n$を実数とする。二重和を展開すると
    $\sum_{i=1}^n\sum_{j=1}^n(a_i-a_j)(x_i-x_j)=2\left(n\sum_i a_ix_i-\left(\sum_i a_i\right)\left(\sum_i x_i\right)\right)$
    である。$x_i$が単調増加なら、$a_i-a_j$と$x_i-x_j$の符号は同じか一方が$0$なので、各項は$0$以上である。よって第$1$の不等式を得る。$x_i$が単調減少なら各項は$0$以下なので、第$2$の不等式を得る。
  strategy: Expand a double sum of products of differences.
  sketch:
  - 'derive: The double sum of (a_i-a_j)(x_i-x_j) equals 2(n Σ a_i x_i - (Σ a_i)(Σ x_i)).'
  - 'case_split: If x is nondecreasing each term is nonnegative.'
  - 'case_split: If x is nonincreasing each term is nonpositive.'
  - 'conclude: The two inequalities follow.'
  openmath: (forall (n a x) (-> (and (in n N) (forall (i j) (-> (and (in i (natural_range n)) (in j (natural_range n)) (<= i j)) (<= (seq_value a i) (seq_value a j))))) (and (-> (forall (i j) (-> (and (in i (natural_range n)) (in j (natural_range n)) (<= i j)) (<= (seq_value x i) (seq_value x j)))) (<= (* (sum (natural_range n) (lambda (i) (seq_value a i))) (sum (natural_range n) (lambda (i) (seq_value x i)))) (* n (sum (natural_range n) (lambda (i) (* (seq_value a i) (seq_value x i))))))) (-> (forall (i j) (-> (and (in i (natural_range n)) (in j (natural_range n)) (<= i j)) (>= (seq_value x i) (seq_value x j)))) (<= (* n (sum (natural_range n) (lambda (i) (* (seq_value a i) (seq_value x i))))) (* (sum (natural_range n) (lambda (i) (seq_value a i))) (sum (natural_range n) (lambda (i) (seq_value x i)))))))))
  hard_negative:
    statement: 実数列$a_i,x_i$の順序によらず、$\left(\sum_i a_i\right)\left(\sum_i x_i\right)\leq n\sum_i a_ix_i$である。
    reason: $n=2$、$a=(0,1)$、$x=(1,0)$のとき左辺は$1$、右辺は$0$である。同じ順序に並ぶという仮定は外せない。
  target: |
    ∀ (n : ℕ) (a x : Fin n → ℝ), Monotone a → (Monotone x → (∑ i, a i) * (∑ i, x i) ≤ (n : ℝ) * ∑ i, a i * x i) ∧ (Antitone x → (n : ℝ) * ∑ i, a i * x i ≤ (∑ i, a i) * (∑ i, x i))
  proof: |
    by
      intro n a x ha
      constructor
      · intro hx
        simpa using (ha.monovary hx).sum_mul_sum_le_card_mul_sum
      · intro hx
        simpa using (ha.antivary hx).card_mul_sum_le_sum_mul_sum
- id: min_linear_plus_reciprocal
  kind: gap
  level: high
  topic: 最小値・相加平均と相乗平均
  statement: 正の実数$a,b$について、$x>0$の範囲で$ax+\dfrac{b}{x}$の最小値は$2\sqrt{ab}$である。
  statement_en: For positive reals a and b, the minimum of ax + b/x over x > 0 is 2 sqrt(ab).
  assumptions:
  - $a,b$は正の実数
  - $x>0$
  quantifiers:
  - 任意の正の実数$a,b$
  conclusion: $x>0$の範囲で$ax+\dfrac{b}{x}$の最小値は$2\sqrt{ab}$である。
  answer: |
    $a,b$を正の実数とし、$x>0$とする。$u=ax$、$v=\dfrac{b}{x}$とおくと、$u,v>0$、$uv=ab$である。$(u+v)^2-4uv=(u-v)^2\geq 0$であり、$u+v>0$なので、$u+v\geq 2\sqrt{uv}=2\sqrt{ab}$である。
    $x=\dfrac{\sqrt{ab}}{a}$とおくと$x>0$であり、$ax=\sqrt{ab}$、$\dfrac{b}{x}=\dfrac{ab}{\sqrt{ab}}=\sqrt{ab}$なので、和は$2\sqrt{ab}$に等しい。よって最小値は$2\sqrt{ab}$である。
  strategy: Apply AM-GM to ax and b/x and exhibit the point where equality holds.
  sketch:
  - 'setup: Put u = ax and v = b/x, so uv = ab.'
  - 'derive: (u+v)^2 - 4uv = (u-v)^2 ≥ 0 gives u + v ≥ 2 sqrt(ab).'
  - 'construct: Take x = sqrt(ab)/a, which makes u = v = sqrt(ab).'
  - 'conclude: The lower bound is attained, so it is the minimum.'
  openmath: (forall (a b) (-> (and (> a 0) (> b 0)) (and (forall (x) (-> (> x 0) (<= (* 2 (root (* a b) 2)) (+ (* a x) (/ b x))))) (exists (x) (and (> x 0) (= (+ (* a x) (/ b x)) (* 2 (root (* a b) 2))))))))
  hard_negative:
    statement: 正の実数$a,b$について、$x\geq 1$の範囲でも$ax+\dfrac{b}{x}$の最小値は$2\sqrt{ab}$である。
    reason: $a=b=1$なら$x=1$で達するが、$a=4,b=1$では等号を与える$x=\dfrac{1}{2}$が範囲の外にあり、最小値は$x=1$での$5$である。下界が最小値になるのは等号が範囲内で成り立つときだけである。
  target: |
    ∀ a b : ℝ, 0 < a → 0 < b → IsLeast {y : ℝ | ∃ x : ℝ, 0 < x ∧ y = a * x + b / x} (2 * Real.sqrt (a * b))
  proof: |
    by
      intro a b ha hb
      have hab : 0 < a * b := mul_pos ha hb
      have hs : 0 < Real.sqrt (a * b) := Real.sqrt_pos.2 hab
      have hss : Real.sqrt (a * b) ^ 2 = a * b := Real.sq_sqrt hab.le
      constructor
      · generalize Real.sqrt (a * b) = s at hs hss
        refine ⟨s / a, div_pos hs ha, ?_⟩
        have e1 : a * (s / a) = s := by field_simp
        have e2 : b / (s / a) = s := by
          field_simp
          linarith
        rw [e1, e2]
        ring
      · rintro y ⟨x, hx, rfl⟩
        have huv : (a * x) * (b / x) = a * b := by field_simp
        have hu : 0 < a * x := mul_pos ha hx
        have hv : 0 < b / x := div_pos hb hx
        have h : Real.sqrt (a * b) ≤ (a * x + b / x) / 2 :=
          Real.sqrt_le_iff.2 ⟨by positivity, by nlinarith [sq_nonneg (a * x - b / x)]⟩
        linarith
- id: min_x_plus_inv_on_ray
  kind: gap
  level: high
  topic: 最小値・等号が成り立たない場合
  statement: 正の実数$k$と$c\geq\sqrt{k}$を満たす実数$c$について、$x\geq c$の範囲で$x+\dfrac{k}{x}$の最小値は$c+\dfrac{k}{c}$である。$k=1$のとき$c\geq 1$の場合に当たる。
  statement_en: For positive real k and real c ≥ √k, the minimum of x + k/x over x ≥ c is c + k/c. The case k = 1 is c ≥ 1.
  assumptions:
  - $k$は正の実数
  - $c$は実数で$c\geq\sqrt{k}$
  - $x\geq c$
  quantifiers:
  - 任意の正の実数$k$と$c\geq\sqrt{k}$
  conclusion: $x\geq c$の範囲で$x+\dfrac{k}{x}$の最小値は$c+\dfrac{k}{c}$である。
  answer: $k$を正の実数、$c$を$c\geq\sqrt{k}$を満たす実数とし、$x\geq c$とする。$c\geq\sqrt{k}>0$なので$c>0$、$x>0$であり、$c^2\geq k$である。$x+\dfrac{k}{x}-\left(c+\dfrac{k}{c}\right)=\dfrac{(x-c)(xc-k)}{xc}$が成り立つ。$x-c\geq 0$であり、$xc\geq c^2\geq k$より$xc-k\geq 0$なので、右辺は$0$以上である。また$x=c$のとき値は$c+\dfrac{k}{c}$に等しい。よって最小値は$c+\dfrac{k}{c}$である。
  strategy: Factor the difference from the value at x = c, because the AM-GM equality point may lie outside the range.
  sketch:
  - 'setup: For x ≥ c ≥ 1 both x and c are positive.'
  - 'derive: x + 1/x - (c + 1/c) = (x-c)(xc-1)/(xc).'
  - 'derive: The numerator and denominator are nonnegative and positive.'
  - 'conclude: The value at x = c is the minimum.'
  openmath: (forall (k c) (-> (and (> k 0) (>= c (root k 2))) (and (forall (x) (-> (>= x c) (<= (+ c (/ k c)) (+ x (/ k x))))) (exists (x) (and (>= x c) (= (+ x (/ k x)) (+ c (/ k c))))))))
  hard_negative:
    statement: $k>0$、$c\geq\sqrt{k}$のとき、$x\geq c$の範囲で$x+\dfrac{k}{x}$の最小値は$2\sqrt{k}$である。
    reason: $2\sqrt{k}$を与える$x=\sqrt{k}$は$c>\sqrt{k}$なら範囲の外にある。$k=1$、$c=2$では$x\geq 2$で$x+\frac{1}{x}\geq\frac{5}{2}>2$である。
  target: '∀ k c : ℝ, 0 < k → Real.sqrt k ≤ c → IsLeast {y : ℝ | ∃ x : ℝ, c ≤ x ∧ y = x + k / x} (c + k / c)'
  proof: |-
    by
      intro k c hk hc
      have hs : 0 < Real.sqrt k := Real.sqrt_pos.mpr hk
      have hc0 : 0 < c := lt_of_lt_of_le hs hc
      have hkc : k ≤ c * c := by
        have := Real.sq_sqrt hk.le
        nlinarith
      constructor
      · exact ⟨c, le_rfl, rfl⟩
      · rintro y ⟨x, hx, rfl⟩
        have hx0 : 0 < x := by linarith
        have key : x + k / x - (c + k / c) = (x - c) * (x * c - k) / (x * c) := by
          field_simp
          ring
        have h1 : 0 ≤ x * c - k := by nlinarith
        have h2 : 0 ≤ (x - c) * (x * c - k) / (x * c) :=
          div_nonneg (mul_nonneg (sub_nonneg.2 hx) h1) (mul_pos hx0 hc0).le
        linarith
- id: min_square_plus_split_reciprocal
  kind: gap
  level: high
  topic: 最小値・3変数の相加相乗
  statement: 正の実数$k$について、$x>0$の範囲で$x^2+\dfrac{2k^3}{x}$の最小値は$3k^2$である。これは$\dfrac{2k^3}{x}$を$2$つの等しい項に分けて$3$変数の相加相乗を使う形である。
  statement_en: For a positive real k, the minimum of x^2 + 2k^3/x over x > 0 is 3k^2. This is the form solved by splitting 2k^3/x into two equal terms for three-variable AM-GM.
  assumptions:
  - $k$は正の実数
  - $x>0$
  quantifiers:
  - 任意の正の実数$k$
  conclusion: $x>0$の範囲で$x^2+\dfrac{2k^3}{x}$の最小値は$3k^2$である。
  answer: |
    $k$を正の実数とし、$x>0$とする。$x^2+\dfrac{2k^3}{x}-3k^2=\dfrac{x^3-3k^2x+2k^3}{x}=\dfrac{(x-k)^2(x+2k)}{x}\geq 0$である。また$x=k$のとき値は$k^2+2k^2=3k^2$である。よって最小値は$3k^2$である。
    この値は、$x^2$、$\dfrac{k^3}{x}$、$\dfrac{k^3}{x}$の$3$項に相加相乗を使うと積が$k^6$で一定となることから見つかり、等号条件が$x^2=\dfrac{k^3}{x}$、すなわち$x=k$である。
  strategy: Factor the difference from 3k^2; the three-term AM-GM split explains the factorization.
  sketch:
  - 'derive: The difference from 3k^2 equals (x-k)^2 (x+2k)/x.'
  - 'derive: This is nonnegative for x > 0.'
  - 'construct: At x = k the value is exactly 3k^2.'
  - 'conclude: The minimum is 3k^2.'
  openmath: (forall (k) (-> (> k 0) (and (forall (x) (-> (> x 0) (<= (* 3 (^ k 2)) (+ (^ x 2) (/ (* 2 (^ k 3)) x))))) (exists (x) (and (> x 0) (= (+ (^ x 2) (/ (* 2 (^ k 3)) x)) (* 3 (^ k 2))))))))
  hard_negative:
    statement: $x^2+\dfrac{2k^3}{x}$に$2$項の相加相乗を使うと$2\sqrt{2k^3x}$となるので、これが最小値である。
    reason: $2\sqrt{2k^3x}$は$x$を含むので定数の下界ではない。積が定数になるように$\dfrac{2k^3}{x}$を$2$つに分ける必要がある。
  target: |
    ∀ k : ℝ, 0 < k → IsLeast {y : ℝ | ∃ x : ℝ, 0 < x ∧ y = x ^ 2 + 2 * k ^ 3 / x} (3 * k ^ 2)
