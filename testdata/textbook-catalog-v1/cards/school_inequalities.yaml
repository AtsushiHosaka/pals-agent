  - $a^2+b^2+c^2>0$
  - $x,y,z$は$ax+by+cz=d$を満たす実数
  quantifiers:
  - 任意の実数$a,b,c,d$
  conclusion: $x^2+y^2+z^2$の最小値は$\dfrac{d^2}{a^2+b^2+c^2}$である。
  answer: |
    $a,b,c,d$を実数とし、$S=a^2+b^2+c^2>0$とする。$x,y,z$が$ax+by+cz=d$を満たすとする。$S(x^2+y^2+z^2)-(ax+by+cz)^2=(ay-bx)^2+(bz-cy)^2+(az-cx)^2\geq 0$なので、$d^2\leq S(x^2+y^2+z^2)$であり、$x^2+y^2+z^2\geq\dfrac{d^2}{S}$である。
