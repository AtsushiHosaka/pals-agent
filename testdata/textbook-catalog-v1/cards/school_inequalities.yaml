    $3(ax+by+cz)-(a+b+c)(x+y+z)=(b-a)(y-x)+(c-b)(z-y)+(c-a)(z-x)$
    である。仮定から各因数は$0$以上なので、右辺は$0$以上である。よって結論を得る。
  strategy: Write the difference as a sum of products of same-direction differences.
  sketch:
  - 'derive: The difference equals (b-a)(y-x) + (c-b)(z-y) + (c-a)(z-x).'
  - 'derive: All differences are nonnegative by the ordering.'
  - 'conclude: The inequality follows.'
  openmath: (forall (a b c x y z) (-> (and (<= a b) (<= b c) (<= x y) (<= y z)) (<= (* (+ (+ a b) c) (+ (+ x y) z)) (* 3 (+ (+ (* a x) (* b y)) (* c z))))))
