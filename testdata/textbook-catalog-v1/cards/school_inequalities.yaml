            ring
          rw [e, ← hss]
          field_simp
        · have e : a * (r * a / s) + b * (r * b / s) + c * (r * c / s) = r * (a ^ 2 + b ^ 2 + c ^ 2) / s := by
            ring
          rw [e, ← hss]
          field_simp
      · rintro t ⟨x, y, z, h, rfl⟩
        have cs : (a * x + b * y + c * z) ^ 2 ≤ (a ^ 2 + b ^ 2 + c ^ 2) * (x ^ 2 + y ^ 2 + z ^ 2) := by
          nlinarith [sq_nonneg (a * y - b * x), sq_nonneg (b * z - c * y), sq_nonneg (a * z - c * x)]
        rw [h, ← hss] at cs
        by_contra hc
        have hc' : r * s < a * x + b * y + c * z := not_le.1 hc
        have hrs : 0 < r * s := mul_pos hr hs
        nlinarith
- id: sum_mul_sum_reciprocal_ge_count_sq
  kind: gap
  level: high
  topic: 不等式・n個の和と逆数の和
  statement: 正の実数$a_1,\dots,a_n$について、$\left(\displaystyle\sum_{i=1}^n a_i\right)\left(\displaystyle\sum_{i=1}^n\dfrac{1}{a_i}\right)\geq n^2$である。
  statement_en: For positive reals a_1, ..., a_n, (sum a_i)(sum 1/a_i) ≥ n^2.
  assumptions:
  - $n$は$0$以上の整数
  - $a_1,\dots,a_n$は正の実数
  quantifiers:
  - 任意の$0$以上の整数$n$
  - 任意の正の実数$a_1,\dots,a_n$
  conclusion: $\left(\displaystyle\sum_{i=1}^n a_i\right)\left(\displaystyle\sum_{i=1}^n\dfrac{1}{a_i}\right)\geq n^2$である。
  answer: |
    $n$を$0$以上の整数、$a_1,\dots,a_n$を正の実数とする。$n=0$のときは両辺とも$0$である。
    積を展開すると$\displaystyle\sum_{i=1}^n\sum_{j=1}^n\dfrac{a_i}{a_j}$である。$i=j$の項は$n$個あり、どれも$1$である。
    $i<j$の組ごとに2項をまとめると$\dfrac{a_i}{a_j}+\dfrac{a_j}{a_i}-2=\dfrac{(a_i-a_j)^2}{a_ia_j}\geq 0$である。組は$\dfrac{n(n-1)}{2}$個あるので、積は$n+2\cdot\dfrac{n(n-1)}{2}=n^2$以上である。
  strategy: Expand the double sum and pair the terms a_i/a_j and a_j/a_i.
  sketch:
  - 'setup: Fix positive reals a_1, ..., a_n.'
  - 'derive: The product equals the double sum of a_i/a_j, whose n diagonal terms equal 1.'
  - 'derive: Each pair i<j contributes at least 2.'
  - 'conclude: The total is at least n + n(n-1) = n^2.'
  openmath: (forall (n a) (-> (and (in n N) (forall (i) (-> (in i (natural_range n)) (> (seq_value a i) 0)))) (>= (* (sum (natural_range n) (lambda (i) (seq_value a i))) (sum (natural_range n) (lambda (i) (/ 1 (seq_value a i))))) (^ n 2))))
  hard_negative:
    statement: $0$でない実数$a_1,\dots,a_n$について、$\left(\displaystyle\sum_{i=1}^n a_i\right)\left(\displaystyle\sum_{i=1}^n\dfrac{1}{a_i}\right)\geq n^2$である。
    reason: $n=2$、$a_1=1$、$a_2=-1$のとき積は$0$であり、$n^2=4$より小さい。すべて正という仮定が要る。
  target: |
    ∀ (n : ℕ) (a : Fin n → ℝ), (∀ i, 0 < a i) → (n : ℝ) ^ 2 ≤ (∑ i, a i) * ∑ i, 1 / a i
  proof: |
    by
      intro n a ha
      rcases Nat.eq_zero_or_pos n with rfl | hn
      · simp
      haveI : Nonempty (Fin n) := ⟨⟨0, hn⟩⟩
      have hs : 0 < ∑ i, a i := Finset.sum_pos (fun i _ => ha i) Finset.univ_nonempty
      have h := Finset.sq_sum_div_le_sum_sq_div (Finset.univ : Finset (Fin n)) (fun _ => (1 : ℝ)) (fun i _ => ha i)
      simp only [Finset.sum_const, Finset.card_univ, Fintype.card_fin, nsmul_eq_mul, mul_one, one_pow] at h
      rw [div_le_iff₀ hs] at h
      linarith
