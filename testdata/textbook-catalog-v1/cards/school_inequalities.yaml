    reason: $a=b=c=r=1$のとき$\sqrt{3}$が最大値で、$3$には届かない。$r(|a|+|b|+|c|)$は上界だが、$a,b,c$のうち$0$でないものが$2$つ以上あれば、この値には達しない。
  target: |
