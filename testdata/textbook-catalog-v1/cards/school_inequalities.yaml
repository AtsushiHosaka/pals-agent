  - 'derive: The difference factors as (a+b+c)((a-b)^2+(b-c)^2+(c-a)^2)/2.'
  - 'case_split: If a + b + c = 0, nonnegativity gives a = b = c = 0.'
  - 'case_split: If the sum of squares vanishes, each square vanishes.'
  - 'conclude: The equivalence holds.'
  openmath: (forall (a b c) (-> (and (>= a 0) (>= b 0) (>= c 0)) (<-> (= (+ (+ (^ a 3) (^ b 3)) (^ c 3)) (* (* (* 3 a) b) c)) (and (= a b) (= b c)))))
  hard_negative:
    statement: 任意の実数$a,b,c$について、$a^3+b^3+c^3=3abc$なら$a=b=c$である。
    reason: $a=b=1$、$c=-2$のとき両辺は$-6$で等しいが$a,b,c$は等しくない。$a+b+c=0$のときも等式が成り立つ。
  target: |
    ∀ a b c : ℝ, 0 ≤ a → 0 ≤ b → 0 ≤ c → (a ^ 3 + b ^ 3 + c ^ 3 = 3 * a * b * c ↔ a = b ∧ b = c)
  proof: |
