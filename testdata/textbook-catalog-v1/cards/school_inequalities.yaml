  topic: 最小値・コーシー・シュワルツの不等式
  statement: 実数$a,b,c,d$が$a^2+b^2+c^2>0$を満たすとき、$ax+by+cz=d$を満たす実数$x,y,z$についての$x^2+y^2+z^2$の最小値は$\dfrac{d^2}{a^2+b^2+c^2}$である。
  statement_en: For real a, b, c, d with a^2+b^2+c^2 > 0, the minimum of x^2+y^2+z^2 subject to ax+by+cz = d is d^2/(a^2+b^2+c^2).
  assumptions:
