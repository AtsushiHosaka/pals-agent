- id: ineq_mul_sign_rule
  kind: gap
  level: middle
  topic: 不等式・基本性質
  statement: 実数$a,b,c$について、$c>0$なら$a<b$と$ca<cb$は同値であり、$c<0$なら$a<b$と$cb<ca$は同値である。
  statement_en: For real a, b, c, if c > 0 then a < b is equivalent to ca < cb, and if c < 0 then a < b is equivalent to cb < ca.
  assumptions:
  - $a,b,c$は実数
  quantifiers:
  - 任意の実数$a,b,c$
  conclusion: $c>0$なら$a<b$と$ca<cb$は同値であり、$c<0$なら$a<b$と$cb<ca$は同値である。
  answer: |
    $a,b,c$を実数とする。$cb-ca=c(b-a)$である。
    $c>0$のとき、$c(b-a)>0$と$b-a>0$は同値なので、$ca<cb$と$a<b$は同値である。
    $c<0$のとき、$c(b-a)<0$と$b-a>0$は同値なので、$cb<ca$と$a<b$は同値である。
  strategy: Factor the difference cb - ca as c(b - a) and read off its sign.
  sketch:
  - 'setup: Write cb - ca = c(b - a).'
  - 'case_split: If c > 0 the sign of c(b - a) equals the sign of b - a.'
  - 'case_split: If c < 0 the sign of c(b - a) is opposite to the sign of b - a.'
  - 'conclude: Both equivalences follow.'
  openmath: (forall (a b c) (and (-> (> c 0) (<-> (< a b) (< (* c a) (* c b)))) (-> (< c 0) (<-> (< a b) (< (* c b) (* c a))))))
  hard_negative:
    statement: $a<b$なら、任意の実数$c$について$ca<cb$である。
    reason: $c=-1$では$-a>-b$となり不等号が逆向きになり、$c=0$では両辺が等しい。
  target: |
    ∀ a b c : ℝ, (0 < c → (a < b ↔ c * a < c * b)) ∧ (c < 0 → (a < b ↔ c * b < c * a))
  proof: |
    by
      intro a b c
      refine ⟨fun hc => ⟨fun h => by nlinarith, fun h => by nlinarith⟩, fun hc => ⟨fun h => by nlinarith, fun h => by nlinarith⟩⟩
- id: range_of_sum_and_difference
  kind: gap
  level: middle
  topic: 不等式・式の値の範囲
  statement: 実数$a,b,c,d,x,y$が$a<x<b$、$c<y<d$を満たすとき、$a+c<x+y<b+d$かつ$a-d<x-y<b-c$である。
  statement_en: If real numbers satisfy a < x < b and c < y < d, then a + c < x + y < b + d and a - d < x - y < b - c.
  assumptions:
  - $a,b,c,d,x,y$は実数
  - $a<x<b$
  - $c<y<d$
  quantifiers:
  - 任意の実数$a,b,c,d,x,y$
  conclusion: $a+c<x+y<b+d$かつ$a-d<x-y<b-c$である。
  answer: |
    $a,b,c,d,x,y$を実数とし、$a<x<b$、$c<y<d$とする。この$2$つの不等式を辺ごとに足すと$a+c<x+y<b+d$を得る。
    差については、$c<y<d$に$-1$を掛けて$-d<-y<-c$とする。これを$a<x<b$と辺ごとに足すと、$a-d<x-y<b-c$を得る。
  strategy: Add the two chains, negating the second chain first for the difference.
  sketch:
  - 'derive: Adding a < x < b and c < y < d gives the range of x + y.'
  - 'derive: Multiplying c < y < d by -1 gives -d < -y < -c.'
  - 'derive: Adding this to a < x < b gives a - d < x - y < b - c.'
  - 'conclude: Both ranges hold.'
  openmath: (forall (a b c d x y) (-> (and (< a x) (< x b) (< c y) (< y d)) (and (< (+ a c) (+ x y)) (< (+ x y) (+ b d)) (< (- a d) (- x y)) (< (- x y) (- b c)))))
  hard_negative:
    statement: $a<x<b$、$c<y<d$なら$a-c<x-y<b-d$である。
    reason: $a=0,x=1,b=2,c=0,y=5,d=10$のとき$x-y=-4$だが$a-c=0$なので左の不等式が成り立たない。差の範囲では$y$の上端と下端が入れ替わる。
  target: |
    ∀ a b c d x y : ℝ, a < x → x < b → c < y → y < d → (a + c < x + y ∧ x + y < b + d) ∧ (a - d < x - y ∧ x - y < b - c)
  proof: |
    by
      intro a b c d x y h1 h2 h3 h4
      exact ⟨⟨by linarith, by linarith⟩, ⟨by linarith, by linarith⟩⟩
- id: ineq_mul_nonneg_bounds
  kind: gap
  level: high
  topic: 不等式・基本性質
  statement: 実数$a,b,c,d$が$0\leq a\leq b$、$0\leq c\leq d$を満たすとき、$ac\leq bd$である。
  statement_en: If real numbers satisfy 0 ≤ a ≤ b and 0 ≤ c ≤ d, then ac ≤ bd.
  assumptions:
  - $a,b,c,d$は実数
  - $0\leq a\leq b$
  - $0\leq c\leq d$
  quantifiers:
  - 任意の実数$a,b,c,d$
  conclusion: $ac\leq bd$である。
  answer: |
    $a,b,c,d$を実数とし、$0\leq a\leq b$、$0\leq c\leq d$とする。$c\geq 0$なので$a\leq b$の両辺に$c$を掛けて$ac\leq bc$を得る。また$b\geq a\geq 0$なので$c\leq d$の両辺に$b$を掛けて$bc\leq bd$を得る。よって$ac\leq bc\leq bd$である。
  strategy: Multiply one inequality at a time by a nonnegative factor and chain the results.
  sketch:
  - 'derive: Since c ≥ 0, a ≤ b gives ac ≤ bc.'
  - 'derive: Since b ≥ 0, c ≤ d gives bc ≤ bd.'
  - 'conclude: Chain the two inequalities.'
  openmath: (forall (a b c d) (-> (and (<= 0 a) (<= a b) (<= 0 c) (<= c d)) (<= (* a c) (* b d))))
  hard_negative:
    statement: 実数$a,b,c,d$が$a\leq b$、$c\leq d$を満たせば$ac\leq bd$である。
    reason: $a=c=-3$、$b=d=-1$のとき$ac=9$、$bd=1$である。辺ごとに掛けるには各辺が$0$以上である必要がある。
  target: |
    ∀ a b c d : ℝ, 0 ≤ a → a ≤ b → 0 ≤ c → c ≤ d → a * c ≤ b * d
  proof: |
    by
      intro a b c d ha hab hc hcd
      exact mul_le_mul hab hcd hc (ha.trans hab)
- id: ineq_reciprocal_same_sign
  kind: gap
  level: high
  topic: 不等式・逆数の大小
  statement: 実数$a,b$が$ab>0$を満たすとき、$a<b$と$\dfrac{1}{b}<\dfrac{1}{a}$は同値である。
  statement_en: If real numbers a and b satisfy ab > 0, then a < b is equivalent to 1/b < 1/a.
  assumptions:
  - $a,b$は実数
  - $ab>0$
  quantifiers:
  - 任意の実数$a,b$
  conclusion: $a<b$と$\dfrac{1}{b}<\dfrac{1}{a}$は同値である。
  answer: |
    $a,b$を$ab>0$を満たす実数とする。このとき$a\neq 0$、$b\neq 0$であり、$\dfrac{1}{a}-\dfrac{1}{b}=\dfrac{b-a}{ab}$が成り立つ。$ab>0$なので、右辺が正であることと$b-a>0$は同値である。したがって$\dfrac{1}{b}<\dfrac{1}{a}$と$a<b$は同値である。
  strategy: Compute the difference of reciprocals over the positive denominator ab.
  sketch:
  - 'setup: From ab > 0, both a and b are nonzero.'
  - 'derive: 1/a - 1/b = (b - a)/(ab).'
  - 'derive: Since ab > 0 the quotient has the sign of b - a.'
  - 'conclude: 1/b < 1/a holds exactly when a < b.'
  openmath: (forall (a b) (-> (> (* a b) 0) (<-> (< a b) (< (/ 1 b) (/ 1 a)))))
  hard_negative:
    statement: $0$でない実数$a,b$について、$a<b$なら$\dfrac{1}{b}<\dfrac{1}{a}$である。
    reason: $a=-1$、$b=1$のとき$\dfrac{1}{b}=1$、$\dfrac{1}{a}=-1$である。$a,b$の符号が異なると逆数の大小は反転しない。
  target: |
    ∀ a b : ℝ, 0 < a * b → (a < b ↔ 1 / b < 1 / a)
  proof: |
    by
      intro a b hab
      have ha : a ≠ 0 := left_ne_zero_of_mul hab.ne'
      have hb : b ≠ 0 := right_ne_zero_of_mul hab.ne'
      have key : 1 / a - 1 / b = (b - a) / (a * b) := by
        field_simp
      constructor
      · intro h
        have h2 := div_pos (sub_pos.2 h) hab
        linarith
      · intro h
        have h2 : 0 < (b - a) / (a * b) := by
          rw [← key]
          linarith
        have h3 := (div_pos_iff_of_pos_right hab).1 h2
        linarith
- id: compare_abs_squares
  kind: gap
  level: high
  topic: 大小比較・平方の比較
  statement: 実数$a,b$について、$|a|\leq|b|$と$a^2\leq b^2$は同値である。
  statement_en: For real numbers a and b, |a| ≤ |b| is equivalent to a^2 ≤ b^2.
  assumptions:
  - $a,b$は実数
  quantifiers:
  - 任意の実数$a,b$
  conclusion: $|a|\leq|b|$と$a^2\leq b^2$は同値である。
  answer: |
    $a,b$を実数とする。$a^2=|a|^2$、$b^2=|b|^2$であり、$|b|^2-|a|^2=(|b|-|a|)(|b|+|a|)$である。
    $|a|\leq|b|$なら右辺の$2$つの因数はどちらも$0$以上なので、$a^2\leq b^2$である。
    逆に$|a|>|b|$なら$|b|-|a|<0$かつ$|b|+|a|>0$なので$b^2<a^2$である。対偶をとると、$a^2\leq b^2$から$|a|\leq|b|$が従う。
  strategy: Factor the difference of the squares of the absolute values.
  sketch:
  - 'setup: Replace a^2 and b^2 by |a|^2 and |b|^2.'
  - 'derive: |b|^2 - |a|^2 = (|b| - |a|)(|b| + |a|).'
  - 'case_split: If |a| ≤ |b| the product is nonnegative.'
  - 'contradiction: If |a| > |b| the product is negative, so a^2 > b^2.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (a b) (<-> (<= (abs a) (abs b)) (<= (^ a 2) (^ b 2))))
  hard_negative:
    statement: 実数$a,b$について、$a\leq b$と$a^2\leq b^2$は同値である。
    reason: $a=-3$、$b=1$のとき$a\leq b$だが$a^2=9>1=b^2$である。絶対値を外すには$a,b\geq 0$が要る。
  target: |
    ∀ a b : ℝ, |a| ≤ |b| ↔ a ^ 2 ≤ b ^ 2
  proof: |
    by
      intro a b
      exact sq_le_sq.symm
- id: compare_powers_nonneg
  kind: gap
  level: high
  topic: 大小比較・累乗の比較
  statement: 正の整数$n$と$0$以上の実数$a,b$について、$a\leq b$と$a^n\leq b^n$は同値である。
  statement_en: For a positive integer n and nonnegative reals a and b, a ≤ b is equivalent to a^n ≤ b^n.
  assumptions:
  - $n$は正の整数
  - $a,b$は$0$以上の実数
  quantifiers:
  - 任意の正の整数$n$
  - 任意の$0$以上の実数$a,b$
  conclusion: $a\leq b$と$a^n\leq b^n$は同値である。
  answer: |
    $n$を正の整数、$a,b$を$0$以上の実数とする。$b^n-a^n=(b-a)\left(b^{n-1}+b^{n-2}a+\cdots+a^{n-1}\right)$である。
    $a\leq b$なら右辺の$2$つの因数はどちらも$0$以上なので、$a^n\leq b^n$である。
    逆に$a>b$とする。このとき$a>0$であり、第$2$の因数は正の項$a^{n-1}$を含み他の項も$0$以上なので正である。よって$b^n-a^n<0$である。対偶をとると、$a^n\leq b^n$から$a\leq b$が従う。
  strategy: Factor b^n - a^n and use nonnegativity of the second factor.
  sketch:
  - 'setup: Factor b^n - a^n as (b - a) times a sum of nonnegative monomials.'
  - 'derive: If a ≤ b the product is nonnegative.'
  - 'contradiction: If a > b then a > 0, the sum is positive, and the product is negative.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (n a b) (-> (and (in n N) (>= n 1) (>= a 0) (>= b 0)) (<-> (<= a b) (<= (^ a n) (^ b n)))))
  hard_negative:
    statement: 正の整数$n$と実数$a,b$について、$a\leq b$と$a^n\leq b^n$は同値である。
    reason: $n=2$、$a=-3$、$b=1$のとき$a\leq b$だが$a^2>b^2$である。$a,b\geq 0$の仮定は外せない。
  target: |
    ∀ (n : ℕ) (a b : ℝ), 1 ≤ n → 0 ≤ a → 0 ≤ b → (a ≤ b ↔ a ^ n ≤ b ^ n)
  proof: |
    by
      intro n a b hn ha hb
      exact (pow_le_pow_iff_left₀ ha hb (by omega)).symm
- id: compare_fractions_cross_multiply
  kind: gap
  level: high
  topic: 大小比較・分数の比較
  statement: 実数$a,c$と正の実数$b,d$について、$\dfrac{a}{b}\leq\dfrac{c}{d}$と$ad\leq cb$は同値である。
  statement_en: For real a, c and positive real b, d, a/b ≤ c/d is equivalent to ad ≤ cb.
  assumptions:
  - $a,c$は実数
  - $b,d$は正の実数
  quantifiers:
  - 任意の実数$a,c$
  - 任意の正の実数$b,d$
  conclusion: $\dfrac{a}{b}\leq\dfrac{c}{d}$と$ad\leq cb$は同値である。
  answer: |
    $a,c$を実数、$b,d$を正の実数とする。$bd>0$なので、$\dfrac{a}{b}\leq\dfrac{c}{d}$の両辺に$bd$を掛けても不等号の向きは変わらず、$ad\leq cb$と同値である。
  strategy: Multiply both sides by the positive number bd.
  sketch:
  - 'setup: bd is positive.'
  - 'derive: Multiplying a/b ≤ c/d by bd gives ad ≤ cb, and dividing reverses the step.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (a b c d) (-> (and (> b 0) (> d 0)) (<-> (<= (/ a b) (/ c d)) (<= (* a d) (* c b)))))
  hard_negative:
    statement: $0$でない実数$b,d$と実数$a,c$について、$\dfrac{a}{b}\leq\dfrac{c}{d}$と$ad\leq cb$は同値である。
    reason: $a=1,b=-1,c=1,d=1$のとき$\dfrac{a}{b}=-1\leq 1=\dfrac{c}{d}$だが、$ad=1$、$cb=-1$である。分母の積が負だと向きが反転する。
  target: |
    ∀ a b c d : ℝ, 0 < b → 0 < d → (a / b ≤ c / d ↔ a * d ≤ c * b)
  proof: |
    by
      intro a b c d hb hd
      exact div_le_div_iff₀ hb hd
- id: mediant_between
  kind: gap
  level: high
  topic: 大小比較・分数の比較
  statement: 実数$a,c$と正の実数$b,d$が$\dfrac{a}{b}<\dfrac{c}{d}$を満たすとき、$\dfrac{a}{b}<\dfrac{a+c}{b+d}<\dfrac{c}{d}$である。
  statement_en: If a, c are real, b, d are positive and a/b < c/d, then a/b < (a+c)/(b+d) < c/d.
  assumptions:
  - $a,c$は実数
  - $b,d$は正の実数
  - $\dfrac{a}{b}<\dfrac{c}{d}$
  quantifiers:
  - 任意の実数$a,c$
  - 任意の正の実数$b,d$
  conclusion: $\dfrac{a}{b}<\dfrac{a+c}{b+d}<\dfrac{c}{d}$である。
  answer: |
    $a,c$を実数、$b,d$を正の実数とし、$\dfrac{a}{b}<\dfrac{c}{d}$とする。両辺に$bd>0$を掛けて$cb-ad>0$を得る。
    このとき$\dfrac{a+c}{b+d}-\dfrac{a}{b}=\dfrac{cb-ad}{b(b+d)}>0$であり、$\dfrac{c}{d}-\dfrac{a+c}{b+d}=\dfrac{cb-ad}{d(b+d)}>0$である。よって結論が成り立つ。
  strategy: Compute both differences over positive denominators, each with numerator cb - ad.
  sketch:
  - 'translate: The hypothesis is equivalent to cb - ad > 0.'
  - 'derive: (a+c)/(b+d) - a/b = (cb - ad)/(b(b+d)) > 0.'
  - 'derive: c/d - (a+c)/(b+d) = (cb - ad)/(d(b+d)) > 0.'
  - 'conclude: The mediant lies strictly between the two fractions.'
  openmath: (forall (a b c d) (-> (and (> b 0) (> d 0) (< (/ a b) (/ c d))) (and (< (/ a b) (/ (+ a c) (+ b d))) (< (/ (+ a c) (+ b d)) (/ c d)))))
  hard_negative:
    statement: $b,d$の符号を問わず、$\dfrac{a}{b}<\dfrac{c}{d}$かつ$b+d\neq 0$なら$\dfrac{a+c}{b+d}$は$\dfrac{a}{b}$と$\dfrac{c}{d}$の間にある。
    reason: $a=-1,b=1,c=1,d=-2$のとき$\dfrac{a}{b}=-1<-\dfrac{1}{2}=\dfrac{c}{d}$だが、$\dfrac{a+c}{b+d}=0$は間にない。
  target: |
    ∀ a b c d : ℝ, 0 < b → 0 < d → a / b < c / d → a / b < (a + c) / (b + d) ∧ (a + c) / (b + d) < c / d
  proof: |
    by
      intro a b c d hb hd h
      rw [div_lt_div_iff₀ hb hd] at h
      have hs : 0 < b + d := by linarith
      constructor
      · rw [div_lt_div_iff₀ hb hs]
        nlinarith
      · rw [div_lt_div_iff₀ hs hd]
        nlinarith
- id: means_chain_two
  kind: textbook
  level: high
  topic: 大小比較・平均の大小
  statement: 正の実数$a,b$について、調和平均、相乗平均、相加平均、$2$乗平均の順に$\dfrac{2ab}{a+b}\leq\sqrt{ab}\leq\dfrac{a+b}{2}\leq\sqrt{\dfrac{a^2+b^2}{2}}$が成り立つ。
  statement_en: For positive reals a and b, 2ab/(a+b) ≤ sqrt(ab) ≤ (a+b)/2 ≤ sqrt((a^2+b^2)/2).
  assumptions:
  - $a,b$は正の実数
  quantifiers:
  - 任意の正の実数$a,b$
  conclusion: $\dfrac{2ab}{a+b}\leq\sqrt{ab}\leq\dfrac{a+b}{2}\leq\sqrt{\dfrac{a^2+b^2}{2}}$が成り立つ。
  answer: |
    $a,b$を正の実数とし、$g=\sqrt{ab}$とおく。$g>0$、$g^2=ab$である。
    中央の不等式を示す。$\left(\dfrac{a+b}{2}\right)^2-g^2=\dfrac{(a-b)^2}{4}\geq 0$であり、$\dfrac{a+b}{2}$と$g$はどちらも正なので、$g\leq\dfrac{a+b}{2}$である。
    左の不等式を示す。$\dfrac{2ab}{a+b}=g\cdot\dfrac{2g}{a+b}$であり、中央の不等式から$\dfrac{2g}{a+b}\leq 1$なので、$\dfrac{2ab}{a+b}\leq g$である。
    右の不等式を示す。$\dfrac{a^2+b^2}{2}-\left(\dfrac{a+b}{2}\right)^2=\dfrac{(a-b)^2}{4}\geq 0$である。$\dfrac{a+b}{2}$は正なので、平方根をとって$\dfrac{a+b}{2}\leq\sqrt{\dfrac{a^2+b^2}{2}}$を得る。
  strategy: Reduce each comparison to the nonnegativity of (a-b)^2 by squaring.
  sketch:
  - 'setup: Put g = sqrt(ab), so g > 0 and g^2 = ab.'
  - 'derive: ((a+b)/2)^2 - g^2 = (a-b)^2/4 ≥ 0 gives g ≤ (a+b)/2.'
  - 'derive: 2ab/(a+b) = g · 2g/(a+b) ≤ g by the previous step.'
  - 'derive: (a^2+b^2)/2 - ((a+b)/2)^2 = (a-b)^2/4 ≥ 0.'
  - 'conclude: Taking square roots gives the last inequality.'
  openmath: (forall (a b) (-> (and (> a 0) (> b 0)) (and (<= (/ (* (* 2 a) b) (+ a b)) (root (* a b) 2)) (<= (root (* a b) 2) (/ (+ a b) 2)) (<= (/ (+ a b) 2) (root (/ (+ (^ a 2) (^ b 2)) 2) 2)))))
  hard_negative:
    statement: 負の実数$a,b$についても$\dfrac{a+b}{2}\geq\sqrt{ab}$である。
    reason: $a=b=-1$のとき左辺は$-1$、右辺は$1$である。相加平均と相乗平均の比較には$a,b\geq 0$が要る。
  target: |
    ∀ a b : ℝ, 0 < a → 0 < b → 2 * a * b / (a + b) ≤ Real.sqrt (a * b) ∧ Real.sqrt (a * b) ≤ (a + b) / 2 ∧ (a + b) / 2 ≤ Real.sqrt ((a ^ 2 + b ^ 2) / 2)
  proof: |
    by
      intro a b ha hb
      have hab : 0 < a * b := mul_pos ha hb
      have hs : 0 < a + b := by linarith
      have hg : 0 < Real.sqrt (a * b) := Real.sqrt_pos.2 hab
      have hgg : Real.sqrt (a * b) ^ 2 = a * b := Real.sq_sqrt hab.le
      have hmid : Real.sqrt (a * b) ≤ (a + b) / 2 :=
        Real.sqrt_le_iff.2 ⟨by positivity, by nlinarith [sq_nonneg (a - b)]⟩
      refine ⟨?_, hmid, ?_⟩
      · rw [div_le_iff₀ hs]
        nlinarith
      · exact (Real.le_sqrt' (by positivity)).2 (by nlinarith [sq_nonneg (a - b)])
- id: linear_ineq_by_coeff_sign
  kind: textbook
  level: middle
  topic: 一次不等式・係数の符号
  statement: 実数$a,b,c,x$について、$a>0$なら$ax+b<c$と$x<\dfrac{c-b}{a}$は同値であり、$a<0$なら$ax+b<c$と$\dfrac{c-b}{a}<x$は同値である。
  statement_en: For real a, b, c, x, if a > 0 then ax + b < c is equivalent to x < (c-b)/a, and if a < 0 then ax + b < c is equivalent to (c-b)/a < x.
  assumptions:
  - $a,b,c,x$は実数
  quantifiers:
  - 任意の実数$a,b,c,x$
  conclusion: $a>0$なら$ax+b<c$と$x<\dfrac{c-b}{a}$は同値であり、$a<0$なら$ax+b<c$と$\dfrac{c-b}{a}<x$は同値である。
  answer: |
    $a,b,c,x$を実数とする。$ax+b<c$は、$b$を移項した$ax<c-b$と同値である。
    $a>0$なら、両辺を$a$で割っても向きは変わらないので、$x<\dfrac{c-b}{a}$と同値である。
    $a<0$なら、両辺を$a$で割ると向きが逆になるので、$\dfrac{c-b}{a}<x$と同値である。
  strategy: Move b across and divide by a, tracking the sign of a.
  sketch:
  - 'translate: ax + b < c is equivalent to ax < c - b.'
  - 'case_split: For a > 0 dividing by a keeps the direction.'
  - 'case_split: For a < 0 dividing by a reverses the direction.'
  - 'conclude: Both equivalences follow.'
  openmath: (forall (a b c x) (and (-> (> a 0) (<-> (< (+ (* a x) b) c) (< x (/ (- c b) a)))) (-> (< a 0) (<-> (< (+ (* a x) b) c) (< (/ (- c b) a) x)))))
  hard_negative:
    statement: $a\neq 0$なら、$ax+b<c$と$x<\dfrac{c-b}{a}$は同値である。
    reason: $a=-1,b=0,c=0,x=1$のとき$ax+b<c$は成り立つが、$x<\dfrac{c-b}{a}=0$は成り立たない。
  target: |
    ∀ a b c x : ℝ, (0 < a → (a * x + b < c ↔ x < (c - b) / a)) ∧ (a < 0 → (a * x + b < c ↔ (c - b) / a < x))
  proof: |
    by
      intro a b c x
      refine ⟨fun ha => ?_, fun ha => ?_⟩
      · rw [lt_div_iff₀ ha]
        constructor <;> intro h <;> linarith
      · rw [div_lt_iff_of_neg ha]
        constructor <;> intro h <;> linarith
- id: linear_ineq_degenerate_coeff
  kind: gap
  level: high
  topic: 一次不等式・文字係数
  statement: 実数$a,b,c$について、不等式$ax+b<c$の解がすべての実数であることと$a=0$かつ$b<c$は同値であり、解がないことと$a=0$かつ$c\leq b$は同値である。
  statement_en: For real a, b, c, the inequality ax + b < c holds for every real x if and only if a = 0 and b < c, and it has no real solution if and only if a = 0 and c ≤ b.
  assumptions:
  - $a,b,c$は実数
  quantifiers:
  - 任意の実数$a,b,c$
  conclusion: 解がすべての実数であることと$a=0$かつ$b<c$は同値であり、解がないことと$a=0$かつ$c\leq b$は同値である。
  answer: |
    $a,b,c$を実数とする。
    $a\neq 0$とする。$x=\dfrac{c-b}{a}$では$ax+b=c$なので不等式は成り立たず、$x=\dfrac{c-b-1}{a}$では$ax+b=c-1<c$なので成り立つ。つまり解はすべての実数ではなく、解がないこともない。したがって、どちらの条件でも$a=0$が必要である。
    $a=0$のとき、不等式は$x$によらず$b<c$となる。よって$b<c$ならすべての実数が解であり、$c\leq b$なら解はない。以上で$2$つの同値が示された。
  strategy: Exhibit a failing and a satisfying value of x when a is nonzero, then reduce to b < c when a is zero.
  sketch:
  - 'case_split: Assume a ≠ 0.'
  - 'construct: x = (c-b)/a violates the inequality and x = (c-b-1)/a satisfies it.'
  - 'derive: So both conditions force a = 0.'
  - 'case_split: If a = 0 the inequality reads b < c for every x.'
  - 'conclude: Both equivalences follow.'
  openmath: (forall (a b c) (and (<-> (forall (x) (< (+ (* a x) b) c)) (and (= a 0) (< b c))) (<-> (not (exists (x) (< (+ (* a x) b) c))) (and (= a 0) (<= c b)))))
  hard_negative:
    statement: 不等式$ax+b<c$に解がないことと、$a=0$であることは同値である。
    reason: $a=0,b=0,c=1$のとき不等式は$0<1$となり、すべての実数が解である。$a=0$だけでは解の有無は決まらない。
  target: |
    ∀ a b c : ℝ, ((∀ x : ℝ, a * x + b < c) ↔ (a = 0 ∧ b < c)) ∧ ((¬ ∃ x : ℝ, a * x + b < c) ↔ (a = 0 ∧ c ≤ b))
  proof: |
    by
      intro a b c
      constructor
      · constructor
        · intro h
          have ha : a = 0 := by
            by_contra ha
            have h1 := h ((c - b) / a)
            have e : a * ((c - b) / a) = c - b := by field_simp
            rw [e] at h1
            linarith
          have h0 := h 0
          exact ⟨ha, by linarith⟩
        · rintro ⟨rfl, hb⟩ x
          linarith
      · constructor
        · intro h
          have ha : a = 0 := by
            by_contra ha
            have e : a * ((c - b - 1) / a) = c - b - 1 := by field_simp
            exact h ⟨(c - b - 1) / a, by rw [e]; linarith⟩
          refine ⟨ha, ?_⟩
          by_contra hc
          exact h ⟨0, by linarith [not_le.1 hc]⟩
        · rintro ⟨rfl, hb⟩ ⟨x, hx⟩
          linarith
- id: linear_system_solvable_iff
  kind: gap
  level: high
  topic: 連立不等式・解の存在
  statement: 実数$a,b,c,d$について、連立不等式$a<x<b$、$c<x<d$を満たす実数$x$が存在することと、$a<b$、$c<d$、$a<d$、$c<b$がすべて成り立つことは同値である。
  statement_en: For real a, b, c, d, there is a real x with a < x < b and c < x < d if and only if a < b, c < d, a < d and c < b.
  assumptions:
  - $a,b,c,d$は実数
  quantifiers:
  - 任意の実数$a,b,c,d$
  conclusion: 解が存在することと、$a<b$、$c<d$、$a<d$、$c<b$がすべて成り立つことは同値である。
  answer: |
    $a,b,c,d$を実数とする。
    解$x$が存在するなら、$a<x<b$から$a<b$、$c<x<d$から$c<d$、$a<x<d$から$a<d$、$c<x<b$から$c<b$を得る。
    逆に$4$つの不等式が成り立つとする。$a,c$の大きい方を$p$、$b,d$の小さい方を$q$とおく。$p$は$a$か$c$、$q$は$b$か$d$であり、$4$つの不等式のどの組合せでも$p<q$である。$x=\dfrac{p+q}{2}$とおくと$p<x<q$なので、$a\leq p<x<q\leq b$かつ$c\leq p<x<q\leq d$となり、$x$は解である。
  strategy: Take the midpoint between the larger lower bound and the smaller upper bound.
  sketch:
  - 'derive: A solution x gives all four inequalities by transitivity.'
  - 'setup: Let p be the larger of a, c and q the smaller of b, d.'
  - 'derive: The four inequalities give p < q.'
  - 'construct: The midpoint of p and q satisfies both chains.'
  - 'conclude: The equivalence holds.'
  openmath: (forall (a b c d) (<-> (exists (x) (and (< a x) (< x b) (< c x) (< x d))) (and (< a b) (< c d) (< a d) (< c b))))
  hard_negative:
    statement: $a<b$かつ$c<d$なら、連立不等式$a<x<b$、$c<x<d$は解をもつ。
    reason: $a=0,b=1,c=2,d=3$のとき$2$つの区間は交わらない。$a<d$と$c<b$も必要である。
  target: |
    ∀ a b c d : ℝ, (∃ x : ℝ, a < x ∧ x < b ∧ c < x ∧ x < d) ↔ (a < b ∧ c < d ∧ a < d ∧ c < b)
  proof: |
    by
      intro a b c d
      constructor
      · rintro ⟨x, h1, h2, h3, h4⟩
        exact ⟨by linarith, by linarith, by linarith, by linarith⟩
      · rintro ⟨h1, h2, h3, h4⟩
        have hpq : max a c < min b d := max_lt (lt_min h1 h3) (lt_min h4 h2)
        have hp1 := le_max_left a c
        have hp2 := le_max_right a c
        have hq1 := min_le_left b d
        have hq2 := min_le_right b d
        exact ⟨(max a c + min b d) / 2, by linarith, by linarith, by linarith, by linarith⟩
- id: natural_solutions_count_range
  kind: gap
  level: high
  topic: 一次不等式・整数解の個数
  statement: 実数$a$と正の整数$n$について、不等式$k<a$を満たす正の整数$k$がちょうど$1,2,\ldots,n$であることと$n<a\leq n+1$は同値である。
  statement_en: For a real a and a positive integer n, the positive integers k with k < a are exactly 1, ..., n if and only if n < a ≤ n + 1.
  assumptions:
  - $a$は実数
  - $n$は正の整数
  quantifiers:
  - 任意の実数$a$
  - 任意の正の整数$n$
  conclusion: $k<a$を満たす正の整数$k$がちょうど$1,2,\ldots,n$であることと$n<a\leq n+1$は同値である。
  answer: |
    $a$を実数、$n$を正の整数とする。
    $k<a$を満たす正の整数がちょうど$1,\ldots,n$であるとする。$k=n$は条件を満たすので$n<a$である。$k=n+1$は条件を満たさないので$a\leq n+1$である。
    逆に$n<a\leq n+1$とする。$1\leq k\leq n$なら$k\leq n<a$である。$k\geq n+1$なら$a\leq n+1\leq k$なので$k<a$は成り立たない。よって$k<a$を満たす正の整数はちょうど$1,\ldots,n$である。
  strategy: Test k = n and k = n + 1 for one direction and compare k with n for the other.
  sketch:
  - 'derive: k = n satisfies k < a, so n < a.'
  - 'derive: k = n + 1 fails, so a ≤ n + 1.'
  - 'case_split: Conversely, k ≤ n gives k < a, and k ≥ n + 1 gives a ≤ k.'
  - 'conclude: The solution set is exactly 1, ..., n.'
  openmath: (forall (a n) (-> (and (in a R) (in n N) (>= n 1)) (<-> (forall (k) (-> (and (in k N) (>= k 1)) (<-> (< k a) (<= k n)))) (and (< n a) (<= a (+ n 1))))))
  hard_negative:
    statement: $k<a$を満たす正の整数がちょうど$1,\ldots,n$であることと$n<a<n+1$は同値である。
    reason: $a=n+1$のときも$k<a$を満たす正の整数は$1,\ldots,n$である。右端の等号を落とすと同値でなくなる。
  target: |
    ∀ (a : ℝ) (n : ℕ), 1 ≤ n → ((∀ k : ℕ, 1 ≤ k → ((k : ℝ) < a ↔ k ≤ n)) ↔ ((n : ℝ) < a ∧ a ≤ (n : ℝ) + 1))
  proof: |
    by
      intro a n hn
      constructor
      · intro h
        refine ⟨(h n hn).2 le_rfl, ?_⟩
        by_contra hc
        have hc' : ((n + 1 : ℕ) : ℝ) < a := by
          push_cast
          exact not_le.1 hc
        have := (h (n + 1) (by omega)).1 hc'
        omega
      · rintro ⟨h1, h2⟩ k _
        constructor
        · intro hk
          have h3 : (k : ℝ) < (n : ℝ) + 1 := by linarith
          have h4 : k < n + 1 := by exact_mod_cast h3
          omega
        · intro hk
          have h3 : (k : ℝ) ≤ n := by exact_mod_cast hk
          linarith
- id: abs_closer_to_left_point
  kind: gap
  level: high
  topic: 絶対値を含む不等式・2点からの距離
  statement: 実数$a<b$と実数$x$について、$|x-a|<|x-b|$と$x<\dfrac{a+b}{2}$は同値である。
  statement_en: For reals a < b and real x, |x - a| < |x - b| is equivalent to x < (a+b)/2.
  assumptions:
  - $a,b,x$は実数
  - $a<b$
  quantifiers:
  - 任意の実数$a,b,x$
  conclusion: $|x-a|<|x-b|$と$x<\dfrac{a+b}{2}$は同値である。
  answer: |
    $a,b,x$を実数とし、$a<b$とする。両辺は$0$以上なので、$|x-a|<|x-b|$は$(x-a)^2<(x-b)^2$と同値である。$(x-b)^2-(x-a)^2=(a-b)(2x-a-b)$であり、$a-b<0$なので、この値が正であることと$2x-a-b<0$は同値である。これは$x<\dfrac{a+b}{2}$と同じである。
  strategy: Square both sides and factor the difference of squares.
  sketch:
  - 'translate: Both sides are nonnegative, so compare squares.'
  - 'derive: (x-b)^2 - (x-a)^2 = (a-b)(2x-a-b).'
  - 'derive: Since a - b < 0 the product is positive exactly when 2x < a + b.'
  - 'conclude: The equivalence holds.'
  openmath: (forall (a b x) (-> (< a b) (<-> (< (abs (- x a)) (abs (- x b))) (< x (/ (+ a b) 2)))))
  hard_negative:
    statement: 任意の実数$a,b,x$について、$|x-a|<|x-b|$と$x<\dfrac{a+b}{2}$は同値である。
    reason: $a=1,b=0,x=1$のとき$|x-a|=0<1=|x-b|$だが、$x<\dfrac{1}{2}$は成り立たない。$a>b$では向きが反転する。
  target: |
    ∀ a b x : ℝ, a < b → (|x - a| < |x - b| ↔ x < (a + b) / 2)
  proof: |
    by
      intro a b x hab
      rw [← sq_lt_sq]
      constructor
      · intro h
        by_contra hc
        have hc' : (a + b) / 2 ≤ x := not_lt.1 hc
        nlinarith [mul_nonneg (sub_pos.2 hab).le (sub_nonneg.2 hc')]
      · intro h
        nlinarith [mul_pos (sub_pos.2 hab) (sub_pos.2 h)]
- id: abs_sum_three_points_median
  kind: gap
  level: high
  topic: 絶対値を含む不等式・距離の和の最小
  statement: 実数$a\leq b\leq c$と実数$x$について、$|x-a|+|x-b|+|x-c|\geq c-a$であり、等号が成り立つことと$x=b$は同値である。
  statement_en: For reals a ≤ b ≤ c and real x, |x - a| + |x - b| + |x - c| ≥ c - a, with equality if and only if x = b.
  assumptions:
  - $a,b,c,x$は実数
  - $a\leq b\leq c$
  quantifiers:
  - 任意の実数$a,b,c,x$
  conclusion: $|x-a|+|x-b|+|x-c|\geq c-a$であり、等号が成り立つことと$x=b$は同値である。
  answer: |
    $a,b,c,x$を実数とし、$a\leq b\leq c$とする。$(x-a)+(c-x)=c-a$なので、$|x-a|+|x-c|\geq c-a$である。これに$|x-b|\geq 0$を足すと、求める不等式を得る。
    等号が成り立つとする。$|x-a|+|x-c|\geq c-a$なので$|x-b|\leq 0$となり、$x=b$である。
    逆に$x=b$とする。$a\leq b\leq c$より$|x-a|=b-a$、$|x-c|=c-b$、$|x-b|=0$なので、和は$c-a$に等しい。
  strategy: Bound the two outer terms by c - a and force the middle term to vanish at equality.
  sketch:
  - 'derive: |x-a| + |x-c| ≥ (x-a) + (c-x) = c - a.'
  - 'derive: Adding |x-b| ≥ 0 gives the bound.'
  - 'derive: Equality forces |x-b| ≤ 0, so x = b.'
  - 'derive: At x = b the sum is (b-a) + (c-b) = c - a.'
  - 'conclude: The equality condition follows.'
  openmath: (forall (a b c x) (-> (and (<= a b) (<= b c)) (and (>= (+ (+ (abs (- x a)) (abs (- x b))) (abs (- x c))) (- c a)) (<-> (= (+ (+ (abs (- x a)) (abs (- x b))) (abs (- x c))) (- c a)) (= x b)))))
  hard_negative:
    statement: $a\leq b\leq c$のとき、$|x-a|+|x-b|+|x-c|$を最小にする$x$は平均$\dfrac{a+b+c}{3}$である。
    reason: $a=b=0,c=3,x=1$のとき和は$1+1+2=4$で、$x=0$のときの和$3$より大きい。最小を与えるのは平均ではなく中央値である。
  target: |
    ∀ a b c x : ℝ, a ≤ b → b ≤ c → c - a ≤ |x - a| + |x - b| + |x - c| ∧ (|x - a| + |x - b| + |x - c| = c - a ↔ x = b)
  proof: |
    by
      intro a b c x hab hbc
      rcases abs_cases (x - a) with ⟨h1, h1'⟩ | ⟨h1, h1'⟩ <;>
        rcases abs_cases (x - b) with ⟨h2, h2'⟩ | ⟨h2, h2'⟩ <;>
        rcases abs_cases (x - c) with ⟨h3, h3'⟩ | ⟨h3, h3'⟩ <;>
        rw [h1, h2, h3] <;>
        exact ⟨by linarith, ⟨fun h => by linarith, fun h => by linarith⟩⟩
- id: abs_add_lt_one_add_mul
  kind: gap
  level: high
  topic: 絶対値を含む不等式・大小比較
  statement: 実数$a,b$が$|a|<1$、$|b|<1$を満たすとき、$|a+b|<1+ab$である。
  statement_en: If real numbers a and b satisfy |a| < 1 and |b| < 1, then |a + b| < 1 + ab.
  assumptions:
  - $a,b$は実数
  - $|a|<1$
  - $|b|<1$
  quantifiers:
  - 任意の実数$a,b$
  conclusion: $|a+b|<1+ab$である。
  answer: |
    $a,b$を実数とし、$|a|<1$、$|b|<1$とする。このとき$1-a,1-b,1+a,1+b$はすべて正である。
    $(1+ab)-(a+b)=(1-a)(1-b)>0$なので$a+b<1+ab$である。また$(1+ab)+(a+b)=(1+a)(1+b)>0$なので$-(1+ab)<a+b$である。よって$|a+b|<1+ab$である。
