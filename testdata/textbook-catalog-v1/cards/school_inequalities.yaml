    reason: $a=1$、$b=-1$のとき等号が成り立つが$a\neq b$である。絶対値をつけると等号条件は$|a|=|b|$に広がる。
  target: |
    ∀ a b : ℝ, 2 * a * b ≤ a ^ 2 + b ^ 2 ∧ (a ^ 2 + b ^ 2 = 2 * a * b ↔ a = b)
  proof: |
    by
      intro a b
      refine ⟨by nlinarith [sq_nonneg (a - b)], ⟨fun h => ?_, fun h => ?_⟩⟩
      · have h2 : (a - b) ^ 2 = 0 := by linarith [sq_nonneg (a - b)]
        have h3 : a - b = 0 := (pow_eq_zero_iff (by norm_num)).1 h2
        linarith
      · rw [h]
        ring
- id: ratio_sum_ge_two
  kind: gap
  level: high
  topic: 不等式・相加平均と相乗平均
  statement: 実数$a,b$が$ab>0$を満たすとき、$\dfrac{a}{b}+\dfrac{b}{a}\geq 2$であり、等号が成り立つことと$a=b$は同値である。
  statement_en: If real numbers a and b satisfy ab > 0, then a/b + b/a ≥ 2, with equality if and only if a = b.
  assumptions:
  - $a,b$は実数
  - $ab>0$
  quantifiers:
  - 任意の実数$a,b$
  conclusion: $\dfrac{a}{b}+\dfrac{b}{a}\geq 2$であり、等号が成り立つことと$a=b$は同値である。
  answer: |
    $a,b$を$ab>0$を満たす実数とする。このとき$a\neq 0$、$b\neq 0$であり、$\dfrac{a}{b}+\dfrac{b}{a}-2=\dfrac{(a-b)^2}{ab}\geq 0$である。よって不等式が成り立つ。$ab>0$なので、右辺が$0$であることと$(a-b)^2=0$、すなわち$a=b$は同値である。
  strategy: Write the difference from 2 as (a-b)^2 over the positive number ab.
  sketch:
  - 'setup: From ab > 0, both a and b are nonzero.'
  - 'derive: a/b + b/a - 2 = (a-b)^2/(ab) ≥ 0.'
  - 'derive: The quotient vanishes exactly when (a-b)^2 = 0.'
  - 'conclude: Equality holds if and only if a = b.'
  openmath: (forall (a b) (-> (> (* a b) 0) (and (>= (+ (/ a b) (/ b a)) 2) (<-> (= (+ (/ a b) (/ b a)) 2) (= a b)))))
  hard_negative:
    statement: $0$でない実数$a,b$について、$\dfrac{a}{b}+\dfrac{b}{a}\geq 2$である。
    reason: $a=1$、$b=-1$のとき左辺は$-2$である。$a,b$が異符号なら左辺は$-2$以下になる。
  target: |
    ∀ a b : ℝ, 0 < a * b → 2 ≤ a / b + b / a ∧ (a / b + b / a = 2 ↔ a = b)
  proof: |
    by
      intro a b hab
      have ha : a ≠ 0 := left_ne_zero_of_mul hab.ne'
      have hb : b ≠ 0 := right_ne_zero_of_mul hab.ne'
      have key : a / b + b / a - 2 = (a - b) ^ 2 / (a * b) := by
        field_simp
        ring
      refine ⟨?_, ⟨fun h => ?_, fun h => ?_⟩⟩
      · have h1 := div_nonneg (sq_nonneg (a - b)) hab.le
        linarith
      · have h0 : (a - b) ^ 2 / (a * b) = 0 := by
          rw [← key]
          linarith
        have h1 : (a - b) ^ 2 = 0 := by
          rcases div_eq_zero_iff.1 h0 with h1 | h1
          · exact h1
          · exact absurd h1 hab.ne'
        have h2 : a - b = 0 := (pow_eq_zero_iff (by norm_num)).1 h1
        linarith
      · subst h
        field_simp
        norm_num
- id: amgm_three_cube_form
  kind: gap
  level: high
  topic: 相加平均と相乗平均・3変数
  statement: $0$以上の実数$a,b,c$について、$a^3+b^3+c^3\geq 3abc$である。これは$3$変数の相加相乗の$3$乗形である。
  statement_en: For nonnegative reals a, b, c, a^3 + b^3 + c^3 ≥ 3abc. This is the cube form of three-variable AM-GM.
  assumptions:
  - $a,b,c$は$0$以上の実数
  quantifiers:
  - 任意の$0$以上の実数$a,b,c$
  conclusion: $a^3+b^3+c^3\geq 3abc$である。
  answer: |
    $a,b,c$を$0$以上の実数とする。$a^3+b^3+c^3-3abc=\dfrac{1}{2}(a+b+c)\left((a-b)^2+(b-c)^2+(c-a)^2\right)$である。右辺の因数はどれも$0$以上なので、$a^3+b^3+c^3\geq 3abc$である。
  strategy: Factor the difference into a + b + c times half a sum of squares.
  sketch:
  - 'derive: a^3+b^3+c^3-3abc = (a+b+c)((a-b)^2+(b-c)^2+(c-a)^2)/2.'
  - 'derive: Each factor is nonnegative because a, b, c are nonnegative.'
  - 'conclude: The inequality follows.'
  openmath: (forall (a b c) (-> (and (>= a 0) (>= b 0) (>= c 0)) (>= (+ (+ (^ a 3) (^ b 3)) (^ c 3)) (* (* (* 3 a) b) c))))
  hard_negative:
    statement: 任意の実数$a,b,c$について、$a^3+b^3+c^3\geq 3abc$である。
    reason: $a=b=c=-1$では等号だが、$a=-2$、$b=c=-1$のとき左辺は$-10$、右辺は$-6$である。$a+b+c\geq 0$にあたる条件が要る。
  target: |
    ∀ a b c : ℝ, 0 ≤ a → 0 ≤ b → 0 ≤ c → 3 * a * b * c ≤ a ^ 3 + b ^ 3 + c ^ 3
  proof: |
    by
      intro a b c ha hb hc
      have key : a ^ 3 + b ^ 3 + c ^ 3 - 3 * a * b * c = (a + b + c) * ((a - b) ^ 2 + (b - c) ^ 2 + (c - a) ^ 2) / 2 := by
        ring
      have h : 0 ≤ (a + b + c) * ((a - b) ^ 2 + (b - c) ^ 2 + (c - a) ^ 2) / 2 := by positivity
      linarith
- id: amgm_three_product_form
  kind: named
  level: high
  topic: 相加平均と相乗平均・3変数
  statement: 相加平均と相乗平均の不等式の$3$変数の積の形。$0$以上の実数$a,b,c$について、$abc\leq\left(\dfrac{a+b+c}{3}\right)^3$である。
  statement_en: Three-variable AM-GM in product form. For nonnegative reals a, b, c, abc ≤ ((a+b+c)/3)^3.
  assumptions:
  - $a,b,c$は$0$以上の実数
  quantifiers:
  - 任意の$0$以上の実数$a,b,c$
  conclusion: $abc\leq\left(\dfrac{a+b+c}{3}\right)^3$である。
  answer: |
    $a,b,c$を$0$以上の実数とする。展開して整理すると
    $(a+b+c)^3-27abc=\left(a^3+b^3+c^3-3abc\right)+3\left(a(b-c)^2+b(c-a)^2+c(a-b)^2\right)$
    である。$a^3+b^3+c^3-3abc=\dfrac{1}{2}(a+b+c)\left((a-b)^2+(b-c)^2+(c-a)^2\right)\geq 0$であり、第$2$の括弧も$0$以上の項の和である。よって$27abc\leq(a+b+c)^3$であり、両辺を$27$で割ると結論を得る。
  strategy: Decompose (a+b+c)^3 - 27abc into a sum of visibly nonnegative terms.
  sketch:
  - 'derive: (a+b+c)^3 - 27abc equals the cube-form difference plus 3 times a sum of terms a(b-c)^2.'
  - 'derive: The cube-form difference is half of (a+b+c) times a sum of squares.'
  - 'derive: All terms are nonnegative because a, b, c are nonnegative.'
  - 'conclude: Dividing by 27 gives the claim.'
  openmath: (forall (a b c) (-> (and (>= a 0) (>= b 0) (>= c 0)) (<= (* (* a b) c) (^ (/ (+ (+ a b) c) 3) 3))))
  hard_negative:
    statement: 任意の実数$a,b,c$について、$abc\leq\left(\dfrac{a+b+c}{3}\right)^3$である。
    reason: $a=b=-1$、$c=1$のとき左辺は$1$、右辺は$-\dfrac{1}{27}$である。$0$以上の仮定は外せない。
  target: |
    ∀ a b c : ℝ, 0 ≤ a → 0 ≤ b → 0 ≤ c → a * b * c ≤ ((a + b + c) / 3) ^ 3
  proof: |
    by
      intro a b c ha hb hc
      have key : ((a + b + c) / 3) ^ 3 - a * b * c = ((a + b + c) * ((a - b) ^ 2 + (b - c) ^ 2 + (c - a) ^ 2) / 2 + 3 * (a * (b - c) ^ 2 + b * (c - a) ^ 2 + c * (a - b) ^ 2)) / 27 := by
        ring
      have h : 0 ≤ ((a + b + c) * ((a - b) ^ 2 + (b - c) ^ 2 + (c - a) ^ 2) / 2 + 3 * (a * (b - c) ^ 2 + b * (c - a) ^ 2 + c * (a - b) ^ 2)) / 27 := by
        positivity
      linarith
