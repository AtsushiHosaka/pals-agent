  statement: 実数$a,b$について、$a^2+b^2\geq 2ab$であり、等号が成り立つことと$a=b$は同値である。
  statement_en: For real numbers a and b, a^2 + b^2 ≥ 2ab, with equality if and only if a = b.
  assumptions:
