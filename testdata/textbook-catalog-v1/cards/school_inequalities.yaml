        field_simp
        ring
      · rintro y ⟨x, hx, rfl⟩
        have key : x ^ 2 + 2 * k ^ 3 / x - 3 * k ^ 2 = (x - k) ^ 2 * (x + 2 * k) / x := by
          field_simp
          ring
        have h : 0 ≤ (x - k) ^ 2 * (x + 2 * k) / x := by positivity
        linarith
- id: min_sum_squares_on_plane
  kind: gap
