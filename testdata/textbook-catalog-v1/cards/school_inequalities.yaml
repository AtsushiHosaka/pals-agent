- id: abs_ratio_subadditive
  kind: gap
  level: high
  topic: 絶対値を含む不等式・大小比較
  statement: 実数$a,b$について、$\dfrac{|a+b|}{1+|a+b|}\leq\dfrac{|a|}{1+|a|}+\dfrac{|b|}{1+|b|}$である。
  statement_en: For real numbers a and b, |a+b|/(1+|a+b|) ≤ |a|/(1+|a|) + |b|/(1+|b|).
  assumptions:
  - $a,b$は実数
  quantifiers:
  - 任意の実数$a,b$
  conclusion: $\dfrac{|a+b|}{1+|a+b|}\leq\dfrac{|a|}{1+|a|}+\dfrac{|b|}{1+|b|}$である。
  answer: |
    $a,b$を実数とし、$p=|a|$、$q=|b|$、$r=|a+b|$とおく。三角不等式より$0\leq r\leq p+q$である。
    $\dfrac{p+q}{1+p+q}-\dfrac{r}{1+r}=\dfrac{p+q-r}{(1+p+q)(1+r)}\geq 0$なので、$\dfrac{r}{1+r}\leq\dfrac{p+q}{1+p+q}$である。
    また、分母を小さくすると値は小さくならないので、$\dfrac{p}{1+p+q}\leq\dfrac{p}{1+p}$、$\dfrac{q}{1+p+q}\leq\dfrac{q}{1+q}$である。これらを足すと$\dfrac{p+q}{1+p+q}\leq\dfrac{p}{1+p}+\dfrac{q}{1+q}$となり、結論を得る。
  strategy: Use the triangle inequality, the monotonicity of t/(1+t) and a smaller denominator on each term.
  sketch:
  - 'setup: Put p = |a|, q = |b|, r = |a+b|, so r ≤ p + q.'
  - 'derive: t/(1+t) increases, so r/(1+r) ≤ (p+q)/(1+p+q).'
  - 'derive: p/(1+p+q) ≤ p/(1+p) and q/(1+p+q) ≤ q/(1+q).'
  - 'conclude: Adding the two bounds gives the claim.'
  openmath: (forall (a b) (<= (/ (abs (+ a b)) (+ 1 (abs (+ a b)))) (+ (/ (abs a) (+ 1 (abs a))) (/ (abs b) (+ 1 (abs b))))))
  hard_negative:
    statement: 実数$a,b$について、$\dfrac{|a+b|}{1+|a+b|}=\dfrac{|a|}{1+|a|}+\dfrac{|b|}{1+|b|}$である。
    reason: $a=b=1$のとき左辺は$\dfrac{2}{3}$、右辺は$1$である。成り立つのは等号ではなく不等号である。
  target: |
    ∀ a b : ℝ, |a + b| / (1 + |a + b|) ≤ |a| / (1 + |a|) + |b| / (1 + |b|)
  proof: |
    by
      intro a b
      have hp := abs_nonneg a
      have hq := abs_nonneg b
      have hr := abs_nonneg (a + b)
      have ht := abs_add_le a b
      generalize |a + b| = r at *
      generalize |a| = p at *
      generalize |b| = q at *
      have h1 : r / (1 + r) ≤ (p + q) / (1 + (p + q)) := by
