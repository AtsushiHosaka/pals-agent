    逆に$a^3+b^3+c^3=3abc$とする。$a^3+b^3+c^3-3abc=\dfrac{1}{2}(a+b+c)\left((a-b)^2+(b-c)^2+(c-a)^2\right)$なので、$a+b+c=0$または$(a-b)^2+(b-c)^2+(c-a)^2=0$である。
