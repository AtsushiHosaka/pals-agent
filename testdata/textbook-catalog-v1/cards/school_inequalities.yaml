  sketch:
  - 'setup: From the hypotheses, 1-a, 1-b, 1+a and 1+b are positive.'
  - 'derive: (1+ab) - (a+b) = (1-a)(1-b) > 0.'
  - 'derive: (1+ab) + (a+b) = (1+a)(1+b) > 0.'
  - 'conclude: Hence -(1+ab) < a+b < 1+ab.'
  openmath: (forall (a b) (-> (and (< (abs a) 1) (< (abs b) 1)) (< (abs (+ a b)) (+ 1 (* a b)))))
  hard_negative:
    statement: 任意の実数$a,b$について、$|a+b|<1+ab$である。
    reason: $a=2$、$b=0$のとき左辺は$2$、右辺は$1$である。$|a|<1$と$|b|<1$の両方が要る。
  target: |
    ∀ a b : ℝ, |a| < 1 → |b| < 1 → |a + b| < 1 + a * b
  proof: |
    by
      intro a b ha hb
      obtain ⟨ha1, ha2⟩ := abs_lt.1 ha
      obtain ⟨hb1, hb2⟩ := abs_lt.1 hb
      rw [abs_lt]
      constructor
      · nlinarith [mul_pos (by linarith : 0 < 1 + a) (by linarith : 0 < 1 + b)]
