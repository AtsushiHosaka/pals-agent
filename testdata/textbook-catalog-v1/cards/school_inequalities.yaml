    reason: $a=1,b=c=d=0$のとき条件は$x=0$であり、$y$を大きくすると$x^2+y^2+z^2$はいくらでも大きくなる。最大値はなく、この値は最小値である。
  target: |
    ∀ a b c d : ℝ, 0 < a ^ 2 + b ^ 2 + c ^ 2 → IsLeast {t : ℝ | ∃ x y z : ℝ, a * x + b * y + c * z = d ∧ t = x ^ 2 + y ^ 2 + z ^ 2} (d ^ 2 / (a ^ 2 + b ^ 2 + c ^ 2))
  proof: |
    by
      intro a b c d hS
      have hne : a ^ 2 + b ^ 2 + c ^ 2 ≠ 0 := hS.ne'
      constructor
      · refine ⟨a * d / (a ^ 2 + b ^ 2 + c ^ 2), b * d / (a ^ 2 + b ^ 2 + c ^ 2), c * d / (a ^ 2 + b ^ 2 + c ^ 2), ?_, ?_⟩
        · field_simp
        · field_simp
      · rintro t ⟨x, y, z, h, rfl⟩
        rw [div_le_iff₀ hS, ← h]
        nlinarith [sq_nonneg (a * y - b * x), sq_nonneg (b * z - c * y), sq_nonneg (a * z - c * x)]
- id: max_linear_on_sphere
  kind: gap
  level: high
  topic: 最大値・コーシー・シュワルツの不等式
  statement: 実数$a,b,c$が$a^2+b^2+c^2>0$を満たし、$r>0$のとき、$x^2+y^2+z^2=r^2$を満たす実数$x,y,z$についての$ax+by+cz$の最大値は$r\sqrt{a^2+b^2+c^2}$である。
  statement_en: For real a, b, c with a^2+b^2+c^2 > 0 and r > 0, the maximum of ax+by+cz subject to x^2+y^2+z^2 = r^2 is r sqrt(a^2+b^2+c^2).
