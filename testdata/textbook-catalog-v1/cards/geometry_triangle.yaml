  openmath: (forall (a b c d) (-> (and (not (collinear_points a b c)) (strictly_between b c d)) (and (< (euclid_angle a b c) (euclid_angle a c d)) (< (euclid_angle b a c) (euclid_angle a c d)))))
  hard_negative:
    statement: $A,B,C$が同一直線上にあっても、外角は隣り合わない内角より真に大きい。
    reason: $B=0$、$C=1$、$D=2$、$A=3$の数直線上では$\angle ABC=0$、$\angle ACD=0$で等しい。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), ¬Collinear ℝ ({A, B, C} : Set P) → Sbtw ℝ B C D → EuclideanGeometry.angle A B C < EuclideanGeometry.angle A C D ∧ EuclideanGeometry.angle B A C < EuclideanGeometry.angle A C D
  proof: |
    by
      intro V P _ _ _ _ A B C D hABC h
      have e : EuclideanGeometry.angle A C D = EuclideanGeometry.angle A B C + EuclideanGeometry.angle B A C := by
        linarith [EuclideanGeometry.exterior_angle_eq_angle_add_angle (p₃ := A) D h.symm, EuclideanGeometry.angle_comm C A B]
      have p1 : 0 < EuclideanGeometry.angle A B C := EuclideanGeometry.angle_pos_of_not_collinear hABC
      have p2 : 0 < EuclideanGeometry.angle B A C :=
        EuclideanGeometry.angle_pos_of_not_collinear (by rwa [Set.insert_comm])
      constructor <;> linarith
- id: triangle_nonacute_angle_others_acute
  kind: gap
  level: middle
  topic: 三角形・内角の和
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）で$\angle ABC\geq\pi/2$ならば、残りの2つの角$\angle BCA,\angle CAB$はともに$\pi/2$より小さい。
  statement_en: If A, B, C are not collinear and ∠ABC ≥ π/2, then ∠BCA < π/2 and ∠CAB < π/2.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $\angle ABC\geq\pi/2$
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $\angle BCA<\pi/2$かつ$\angle CAB<\pi/2$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の、同一直線上にない点とし、$\angle ABC\geq\pi/2$とする。
    内角の和より$\angle BCA+\angle CAB=\pi-\angle ABC\leq\pi/2$である。$A,B,C$は同一直線上にないので$\angle BCA>0$、$\angle CAB>0$である。よって一方の角は$\pi/2$から正の数を引いた値以下であり、どちらも$\pi/2$より小さい。
  strategy: The other two positive angles sum to at most π/2.
  sketch:
  - 'apply_theorem: The angle sum gives ∠BCA + ∠CAB ≤ π/2.'
  - 'derive: Non-collinearity makes both angles positive.'
  - 'conclude: Each is below π/2.'
  openmath: (forall (a b c) (-> (and (not (collinear_points a b c)) (<= (/ pi 2) (euclid_angle a b c))) (and (< (euclid_angle b c a) (/ pi 2)) (< (euclid_angle c a b) (/ pi 2)))))
  hard_negative:
    statement: $\angle ABC<\pi/2$ならば残りの2つの角も$\pi/2$より小さい。
    reason: 角が$\pi/6,\pi/6,2\pi/3$の三角形で、$\angle ABC=\pi/6$とすれば残りの一方は鈍角である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), ¬Collinear ℝ ({A, B, C} : Set P) → Real.pi / 2 ≤ EuclideanGeometry.angle A B C → EuclideanGeometry.angle B C A < Real.pi / 2 ∧ EuclideanGeometry.angle C A B < Real.pi / 2
  proof: |
    by
      intro V P _ _ _ _ A B C hABC h
      have hs := EuclideanGeometry.angle_add_angle_add_angle_eq_pi C (ne₁₂_of_not_collinear hABC).symm
      have p1 : 0 < EuclideanGeometry.angle B C A :=
        EuclideanGeometry.angle_pos_of_not_collinear (by rwa [show ({B, C, A} : Set P) = {A, B, C} by ext x; simp; tauto])
      have p2 : 0 < EuclideanGeometry.angle C A B :=
        EuclideanGeometry.angle_pos_of_not_collinear (by rwa [show ({C, A, B} : Set P) = {A, B, C} by ext x; simp; tauto])
      constructor <;> linarith
- id: triangle_side_lt_iff_opposite_angle_lt
  kind: textbook
  level: middle
  topic: 三角形・辺と角の大小
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）について、$AB<AC$であることと、それぞれの対角について$\angle ACB<\angle ABC$であることは同値である。
  statement_en: For non-collinear A, B, C, AB < AC if and only if ∠ACB < ∠ABC.
  assumptions:
  - $A,B,C$は同一直線上にない
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $AB<AC$と$\angle ACB<\angle ABC$は同値である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の、同一直線上にない点とする。$\beta=\angle ABC$、$\gamma=\angle ACB$とおく。
    余弦定理の式から、$AB<AC$と$\cos\gamma>\cos\beta$が同値であることを示す。$\cos\beta=(AB^2+BC^2-AC^2)/(2AB\cdot BC)$、$\cos\gamma=(AC^2+BC^2-AB^2)/(2AC\cdot BC)$なので、$2AB\cdot AC\cdot BC(\cos\gamma-\cos\beta)=AB(AC^2+BC^2-AB^2)-AC(AB^2+BC^2-AC^2)$である。右辺を整理すると$(AC-AB)\bigl((AB+AC)^2-BC^2\bigr)$である。三角不等式より$AB+AC>BC$なので第2の因子は正である。
    よって$AB<AC$は$\cos\gamma>\cos\beta$と同値である。余弦は$0$以上$\pi$以下で狭義減少なので、これは$\gamma<\beta$と同値である。
  strategy: Compare the cosines of the two angles through the law of cosines; the difference factors with a positive factor from the triangle inequality.
  sketch:
  - 'setup: Put β = ∠ABC and γ = ∠ACB.'
  - 'apply_theorem: The law of cosines expresses both cosines through the sides.'
  - 'derive: The difference of cosines has the sign of AC - AB, since (AB+AC)² - BC² > 0.'
  - 'conclude: Cosine is strictly decreasing on [0, π], so the order of angles matches.'
  openmath: (forall (a b c) (-> (not (collinear_points a b c)) (<-> (< (dist_of a b) (dist_of a c)) (< (euclid_angle a c b) (euclid_angle a b c)))))
  hard_negative:
    statement: $A,B,C$が同一直線上にあっても、$AB<AC$ならば$\angle ACB<\angle ABC$である。
    reason: 数直線上で$A=0$、$B=1$、$C=-3$とすると$AB<AC$であるが、$\angle ACB=\angle ABC=0$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), ¬Collinear ℝ ({A, B, C} : Set P) → (dist A B < dist A C ↔ EuclideanGeometry.angle A C B < EuclideanGeometry.angle A B C)
  proof: |
    by
      intro V P _ _ _ _ A B C h
      exact (EuclideanGeometry.angle_lt_iff_dist_lt h).symm
- id: side_opposite_nonacute_angle_is_longest
  kind: gap
  level: middle
  topic: 三角形・辺と角の大小
  statement: $A\neq B$、$C\neq B$、$\angle ABC\geq\pi/2$ならば、$\angle B$の対辺$AC$は他の2辺$AB,CB$より長い。直角三角形の斜辺と鈍角の対辺がこの場合である。
  statement_en: If A ≠ B, C ≠ B and ∠ABC ≥ π/2, then AB < AC and CB < AC.
  assumptions:
  - $A\neq B$
  - $C\neq B$
  - $\angle ABC\geq\pi/2$
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $AB<AC$かつ$CB<AC$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の点とし、$A\neq B$、$C\neq B$、$\angle ABC\geq\pi/2$とする。
    $\pi/2\leq\angle ABC\leq\pi$なので$\cos\angle ABC\leq0$である。余弦定理より$AC^2=AB^2+CB^2-2\,AB\cdot CB\cos\angle ABC\geq AB^2+CB^2$である。$CB>0$、$AB>0$なので$AC^2>AB^2$、$AC^2>CB^2$である。長さは$0$以上なので$AC>AB$、$AC>CB$である。
  strategy: Nonpositive cosine makes AC² at least AB² + CB² in the law of cosines.
  sketch:
  - 'derive: The angle range gives cos∠ABC ≤ 0.'
  - 'apply_theorem: The law of cosines gives AC² ≥ AB² + CB².'
  - 'derive: Positivity of AB and CB makes the inequalities strict.'
  - 'conclude: Comparing squares of nonnegative lengths gives the result.'
  openmath: (forall (a b c) (-> (and (!= a b) (!= c b) (<= (/ pi 2) (euclid_angle a b c))) (and (< (dist_of a b) (dist_of a c)) (< (dist_of c b) (dist_of a c)))))
  hard_negative:
    statement: $\angle ABC<\pi/2$でも、対辺$AC$は他の2辺より長い。
    reason: 頂角が$\pi/6$の二等辺三角形で$B$を頂点とすると、対辺$AC$は他の2辺より短い。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), A ≠ B → C ≠ B → Real.pi / 2 ≤ EuclideanGeometry.angle A B C → dist A B < dist A C ∧ dist C B < dist A C
  proof: |
    by
      intro V P _ _ _ _ A B C hA hC h
      have e := EuclideanGeometry.law_cos A B C
      have hc : Real.cos (EuclideanGeometry.angle A B C) ≤ 0 :=
        Real.cos_nonpos_of_pi_div_two_le_of_le h (by linarith [EuclideanGeometry.angle_le_pi A B C, Real.pi_pos])
      have p1 : 0 < dist A B := dist_pos.mpr hA
      have p2 : 0 < dist C B := dist_pos.mpr hC
      have hge : dist A B * dist A B + dist C B * dist C B ≤ dist A C * dist A C := by
        rw [e]; nlinarith [mul_pos p1 p2]
      have p3 : 0 ≤ dist A C := dist_nonneg
      constructor <;> nlinarith
- id: perpendicular_is_shortest_to_line
  kind: gap
  level: middle
  topic: 三角形・垂線の長さ
  statement: 直線$BC$上の点$H$で$A-H$と$C-B$の内積が$0$であるとき（$H$は$A$からの垂線の足）、直線$BC$上の任意の点$X$について$AH\leq AX$である。
  statement_en: If H lies on line BC with ⟨A-H, C-B⟩ = 0, then AH ≤ AX for every point X on line BC.
  assumptions:
  - $H$は直線$BC$上の点
  - $\langle A-H,C-B\rangle=0$
  - $X$は直線$BC$上の点
  quantifiers:
  - 任意の5点$A,B,C,H,X$
  conclusion: $AH\leq AX$である。
  answer: |
    $A,B,C,H,X$を実内積空間上のアフィン空間の点とする。$H,X$は直線$BC$上にあり、$\langle A-H,C-B\rangle=0$とする。
    実数$s,t$により$H-B=s(C-B)$、$X-B=t(C-B)$と書くと、$H-X=(s-t)(C-B)$である。$h=A-H$、$v=H-X$とおくと$A-X=h+v$であり、$\langle h,v\rangle=(s-t)\langle h,C-B\rangle=0$である。よって$AX^2=\|h\|^2+\|v\|^2\geq\|h\|^2=AH^2$である。長さは$0$以上なので$AH\leq AX$である。
  strategy: Split A-X into the perpendicular part and a part along the line, then apply the Pythagorean identity.
  sketch:
  - 'setup: Write H and X on the line, so H - X is a multiple of C - B.'
  - 'derive: A - H is orthogonal to H - X.'
  - 'derive: AX² = AH² + HX² ≥ AH².'
  - 'conclude: Compare the nonnegative lengths.'
  openmath: (forall (a b c h x) (-> (and (on_line h b c) (perpendicular_lines a h b c) (on_line x b c)) (<= (dist_of a h) (dist_of a x))))
  hard_negative:
    statement: 直線$BC$上のすべての点$X$について$AH<AX$である。
    reason: $X=H$では等号が成り立つ。真に大きいのは$X\neq H$の点に限る。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C H X : P), H ∈ line[ℝ, B, C] → inner ℝ (A -ᵥ H) (C -ᵥ B) = 0 → X ∈ line[ℝ, B, C] → dist A H ≤ dist A X
  proof: |
    by
      intro V P _ _ _ _ A B C H X hH hperp hX
      obtain ⟨s, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hH
      obtain ⟨t, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hX
      have e : A -ᵥ AffineMap.lineMap B C t = (A -ᵥ AffineMap.lineMap B C s) + (s - t) • (C -ᵥ B) := by
        rw [← vsub_add_vsub_cancel A (AffineMap.lineMap B C s) (AffineMap.lineMap B C t)]
        simp only [AffineMap.lineMap_apply, vadd_vsub_vadd_cancel_right, sub_smul]
      rw [dist_eq_norm_vsub V A, dist_eq_norm_vsub V A, e]
      refine abs_le_of_sq_le_sq' ?_ (by positivity) |>.2
      rw [norm_add_sq_real, real_inner_smul_right, hperp]
      nlinarith [sq_nonneg ‖(s - t) • (C -ᵥ B)‖]
- id: triangle_strict_inequality
  kind: gap
  level: middle
  topic: 三角形・三角形の成立条件
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）では、$AC<AB+BC$かつ$|AB-BC|<AC$である。2辺の和は第3辺より長く、2辺の差は第3辺より短い。
  statement_en: If A, B, C are not collinear, then AC < AB + BC and |AB - BC| < AC.
  assumptions:
  - $A,B,C$は同一直線上にない
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $AC<AB+BC$かつ$|AB-BC|<AC$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の、同一直線上にない点とする。
    実内積空間では、$XZ=XY+YZ$が成り立つのは$Y$が線分$XZ$上にあるときに限る。$A,B,C$は同一直線上にないので、$B$は線分$AC$上になく、$A$は線分$BC$上になく、$C$は線分$AB$上にない。三角不等式と合わせると、$AC<AB+BC$、$BC<BA+AC$、$AB<AC+CB$である。
    第2式から$-AC<AB-BC$、第3式から$AB-BC<AC$であり、合わせて$|AB-BC|<AC$である。
  strategy: Equality in the triangle inequality forces betweenness, which non-collinearity excludes.
  sketch:
  - 'apply_theorem: Equality XZ = XY + YZ holds only when Y lies on segment XZ.'
  - 'derive: Non-collinearity gives all three strict triangle inequalities.'
  - 'conclude: Two of them combine into |AB - BC| < AC.'
  openmath: (forall (a b c) (-> (not (collinear_points a b c)) (and (< (dist_of a c) (+ (dist_of a b) (dist_of b c))) (< (abs (- (dist_of a b) (dist_of b c))) (dist_of a c)))))
  hard_negative:
    statement: $A,B,C$が同一直線上にあっても、$AC<AB+BC$である。
    reason: $B$が線分$AC$上にあれば$AC=AB+BC$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), ¬Collinear ℝ ({A, B, C} : Set P) → dist A C < dist A B + dist B C ∧ |dist A B - dist B C| < dist A C
  proof: |
    by
      intro V P _ _ _ _ A B C h
      have h1 : dist A C < dist A B + dist B C :=
        dist_lt_dist_add_dist_iff.mpr fun hw => h hw.collinear
      have h2 : dist B C < dist B A + dist A C :=
        dist_lt_dist_add_dist_iff.mpr fun hw => h (by have := hw.collinear; rwa [Set.insert_comm] at this)
      have h3 : dist A B < dist A C + dist C B :=
        dist_lt_dist_add_dist_iff.mpr fun hw => h (by have := hw.collinear; rwa [Set.pair_comm] at this)
      rw [dist_comm B A] at h2
      rw [dist_comm C B] at h3
      refine ⟨h1, abs_lt.mpr ⟨by linarith, by linarith⟩⟩
- id: triangle_exists_iff_three_inequalities
  kind: textbook
  level: middle
  topic: 三角形・三角形の成立条件
  statement: 実数$a,b,c$について、平面上に同一直線上にない3点$A,B,C$で$BC=a$、$CA=b$、$AB=c$となるものがあることと、$a<b+c$、$b<c+a$、$c<a+b$がすべて成り立つことは同値である。
  statement_en: For real a, b, c, there exist non-collinear points A, B, C of the Euclidean plane with BC = a, CA = b, AB = c if and only if a < b + c, b < c + a and c < a + b.
  assumptions:
  - $a,b,c$は実数
  - 平面は$\mathbb{R}^2$
  quantifiers:
  - 任意の実数$a,b,c$
  conclusion: 3辺が$a,b,c$の三角形が平面上に存在することと、3つの不等式が成り立つことは同値である。
  answer: |
    $a,b,c$を実数とする。平面は$\mathbb{R}^2$である。
    三角形が存在するとする。$A,B,C$は同一直線上にないので、三角不等式の等号は成り立たず、$BC<BA+AC$、$CA<CB+BA$、$AB<AC+CB$である。これらは$a<b+c$、$b<c+a$、$c<a+b$である。
    逆に3つの不等式を仮定する。2式を足すと$a,b,c$はすべて正である。$x=(a^2+c^2-b^2)/(2a)$とおく。
    $(2a)^2(c^2-x^2)=(b+a-c)(b-a+c)\bigl((a+c)^2-b^2\bigr)$であり、仮定より右辺の3つの因子は正である。よって$c^2-x^2>0$であり、$y=\sqrt{c^2-x^2}$とおける。$B=(0,0)$、$C=(a,0)$、$A=(x,y)$とすると、$BC=a$、$AB=\sqrt{x^2+y^2}=c$である。また$2ax=a^2+c^2-b^2$より$(a-x)^2+y^2=a^2-2ax+c^2=b^2$なので、$CA=b$である。
    $A,B,C$が同一直線上にあれば、3点のうち1点が他の2点の間にあり、$a=b+c$、$b=c+a$、$c=a+b$のいずれかが成り立つ。これは仮定に反する。
  strategy: Forward uses strict triangle inequalities; backward places B and C on an axis and solves for A, with non-collinearity from the strict inequalities.
  sketch:
  - 'apply_theorem: Non-collinear points satisfy the three strict triangle inequalities.'
  - 'derive: Conversely, adding two inequalities shows a, b, c > 0.'
  - 'construct: Put x = (a²+c²-b²)/(2a) and y = √(c²-x²), which is defined by a factorization.'
  - 'construct: Take B = (0,0), C = (a,0), A = (x,y).'
  - 'derive: Direct computation gives BC = a, CA = b, AB = c.'
  - 'contradiction: Collinearity would force one side to equal the sum of the other two.'
  openmath: (forall (a b c) (<-> (exists (x y z) (and (not (collinear_points x y z)) (= (dist_of y z) a) (= (dist_of z x) b) (= (dist_of x y) c))) (and (< a (+ b c)) (< b (+ c a)) (< c (+ a b)))))
  hard_negative:
    statement: 正の数$a,b,c$が$c<a+b$だけを満たせば、3辺が$a,b,c$の三角形がある。
    reason: $a=5$、$b=c=1$では$c<a+b$であるが、$a>b+c$なので三角形はない。
  target: |
    ∀ (a b c : ℝ), (∃ A B C : EuclideanSpace ℝ (Fin 2), ¬Collinear ℝ ({A, B, C} : Set (EuclideanSpace ℝ (Fin 2))) ∧ dist B C = a ∧ dist C A = b ∧ dist A B = c) ↔ a < b + c ∧ b < c + a ∧ c < a + b
  proof: |
    by
      intro a b c
      constructor
      · rintro ⟨A, B, C, hcol, rfl, rfl, rfl⟩
        have h1 : dist B C < dist B A + dist A C := dist_lt_dist_add_dist_iff.mpr fun hw => hcol (by
          have := hw.collinear
          rwa [show ({B, A, C} : Set (EuclideanSpace ℝ (Fin 2))) = {A, B, C} by ext x; simp; tauto] at this)
        have h2 : dist C A < dist C B + dist B A := dist_lt_dist_add_dist_iff.mpr fun hw => hcol (by
          have := hw.collinear
          rwa [show ({C, B, A} : Set (EuclideanSpace ℝ (Fin 2))) = {A, B, C} by ext x; simp; tauto] at this)
        have h3 : dist A B < dist A C + dist C B := dist_lt_dist_add_dist_iff.mpr fun hw => hcol (by
          have := hw.collinear
          rwa [show ({A, C, B} : Set (EuclideanSpace ℝ (Fin 2))) = {A, B, C} by ext x; simp; tauto] at this)
        rw [dist_comm B A, dist_comm A C] at h1
        rw [dist_comm C B, dist_comm B A] at h2
        rw [dist_comm A C, dist_comm C B] at h3
        refine ⟨by linarith, by linarith, by linarith⟩
      · rintro ⟨h1, h2, h3⟩
        have ha : 0 < a := by linarith
        have hb : 0 < b := by linarith
        have hc : 0 < c := by linarith
        set x : ℝ := (a ^ 2 + c ^ 2 - b ^ 2) / (2 * a) with hx
        have hxa : 2 * a * x = a ^ 2 + c ^ 2 - b ^ 2 := by rw [hx]; field_simp
        have hpos : 0 ≤ c ^ 2 - x ^ 2 := by
          have h4 : 0 ≤ (2 * a) ^ 2 * (c ^ 2 - x ^ 2) := by
            have : (2 * a) ^ 2 * (c ^ 2 - x ^ 2) = (b + a - c) * (b - a + c) * ((a + c) ^ 2 - b ^ 2) := by
              have : (2 * a) ^ 2 * x ^ 2 = (a ^ 2 + c ^ 2 - b ^ 2) ^ 2 := by rw [← hxa]; ring
              linear_combination -this
            rw [this]
            have u1 : 0 < b + a - c := by linarith
            have u2 : 0 < b - a + c := by linarith
            have u3 : 0 < (a + c) ^ 2 - b ^ 2 := by nlinarith
            positivity
          exact nonneg_of_mul_nonneg_right h4 (by positivity)
        set y : ℝ := Real.sqrt (c ^ 2 - x ^ 2) with hy
        have hy2 : y ^ 2 = c ^ 2 - x ^ 2 := Real.sq_sqrt hpos
        have dBC : dist (!₂[0, 0] : EuclideanSpace ℝ (Fin 2)) !₂[a, 0] = a := by
          rw [EuclideanSpace.dist_eq]
          simp [Fin.sum_univ_two, Real.dist_eq, Real.sqrt_sq_eq_abs, abs_of_pos ha]
        have dCA : dist (!₂[a, 0] : EuclideanSpace ℝ (Fin 2)) !₂[x, y] = b := by
          rw [EuclideanSpace.dist_eq]
          simp only [Fin.sum_univ_two, Real.dist_eq, sq_abs]
          simp
          rw [show (a - x) ^ 2 + y ^ 2 = b ^ 2 by rw [hy2]; linear_combination -hxa]
