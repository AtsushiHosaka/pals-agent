  strategy: The law of cosines relates the sign of AB² + BC² - AC² to the sign of cos θ.
  sketch:
  - 'apply_theorem: The law of cosines gives AB² + BC² - AC² = 2·AB·BC·cosθ.'
  - 'derive: The factor 2·AB·BC is positive, so the signs agree.'
  - 'case_split: On [0, π], cosθ > 0 iff θ < π/2 and cosθ < 0 iff θ > π/2.'
  - 'conclude: Both equivalences follow.'
  openmath: (forall (a b c) (-> (and (!= a b) (!= c b)) (and (<-> (< (euclid_angle a b c) (/ pi 2)) (< (^ (dist_of a c) 2) (+ (^ (dist_of a b) 2) (^ (dist_of b c) 2)))) (<-> (< (/ pi 2) (euclid_angle a b c)) (< (+ (^ (dist_of a b) 2) (^ (dist_of b c) 2)) (^ (dist_of a c) 2))))))
  hard_negative:
    statement: $AC^2<AB^2+BC^2$ならば三角形$ABC$は鋭角三角形である。
    reason: この不等式が示すのは$\angle ABC$が鋭角であることだけである。$AB=3$、$BC=4$、$AC=2$では$AC^2<AB^2+BC^2$であるが、$BC^2>AB^2+AC^2$なので$\angle BAC$は鈍角である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), A ≠ B → C ≠ B → (EuclideanGeometry.angle A B C < Real.pi / 2 ↔ dist A C ^ 2 < dist A B ^ 2 + dist B C ^ 2) ∧ (Real.pi / 2 < EuclideanGeometry.angle A B C ↔ dist A B ^ 2 + dist B C ^ 2 < dist A C ^ 2)
  proof: |
    by
      intro V P _ _ _ _ A B C hA hC
      have e := EuclideanGeometry.law_cos A B C
      rw [dist_comm C B] at e
      have p1 : 0 < dist A B := dist_pos.mpr hA
      have p2 : 0 < dist B C := by rw [dist_comm]; exact dist_pos.mpr hC
      have pp : 0 < 2 * dist A B * dist B C := by positivity
      have nn := EuclideanGeometry.angle_nonneg A B C
      have le := EuclideanGeometry.angle_le_pi A B C
      have hpi := Real.pi_pos
      constructor
      · constructor
        · intro h
          have hc : 0 < Real.cos (EuclideanGeometry.angle A B C) :=
            Real.cos_pos_of_mem_Ioo ⟨by linarith, h⟩
          nlinarith [mul_pos pp hc]
        · intro h
          by_contra hn
          have hc : Real.cos (EuclideanGeometry.angle A B C) ≤ 0 :=
            Real.cos_nonpos_of_pi_div_two_le_of_le (not_lt.mp hn) (by linarith)
          nlinarith [mul_nonneg pp.le (neg_nonneg.mpr hc)]
      · constructor
        · intro h
          have hc : Real.cos (EuclideanGeometry.angle A B C) < 0 :=
            Real.cos_neg_of_pi_div_two_lt_of_lt h (by linarith)
          nlinarith [mul_pos pp (neg_pos.mpr hc)]
        · intro h
          by_contra hn
          have hc : 0 ≤ Real.cos (EuclideanGeometry.angle A B C) :=
            Real.cos_nonneg_of_mem_Icc ⟨by linarith, not_lt.mp hn⟩
          nlinarith [mul_nonneg pp.le hc]
- id: cos_angle_from_three_sides
  kind: gap
  level: high
  topic: 三角形・余弦定理
  statement: $A\neq B$、$C\neq B$のとき、余弦定理を角について解いた形$\cos\angle ABC=\dfrac{AB^2+CB^2-AC^2}{2\,AB\cdot CB}$が成り立つ。
  statement_en: If A ≠ B and C ≠ B, then cos∠ABC = (AB² + CB² - AC²)/(2·AB·CB).
  assumptions:
  - $A\neq B$
  - $C\neq B$
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $\cos\angle ABC=\dfrac{AB^2+CB^2-AC^2}{2\,AB\cdot CB}$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の点とし、$A\neq B$、$C\neq B$とする。$AB>0$、$CB>0$なので分母は$0$でない。
    余弦定理より$AC^2=AB^2+CB^2-2\,AB\cdot CB\cos\angle ABC$である。これを$\cos\angle ABC$について解くと主張の式になる。
  strategy: Solve the law of cosines for the cosine.
  sketch:
  - 'setup: The hypotheses make the denominator nonzero.'
  - 'apply_theorem: The law of cosines at B.'
  - 'conclude: Rearranging gives the formula.'
  openmath: (forall (a b c) (-> (and (!= a b) (!= c b)) (= (cos (euclid_angle a b c)) (/ (- (+ (^ (dist_of a b) 2) (^ (dist_of c b) 2)) (^ (dist_of a c) 2)) (* 2 (dist_of a b) (dist_of c b))))))
  hard_negative:
    statement: $\cos\angle ABC=\dfrac{AC^2-AB^2-CB^2}{2\,AB\cdot CB}$である。
    reason: 符号が逆である。正三角形では$\cos\angle ABC=\frac12$であるが、右辺は$-\frac12$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), A ≠ B → C ≠ B → Real.cos (EuclideanGeometry.angle A B C) = (dist A B ^ 2 + dist C B ^ 2 - dist A C ^ 2) / (2 * dist A B * dist C B)
  proof: |
    by
      intro V P _ _ _ _ A B C hA hC
      have p1 : dist A B ≠ 0 := dist_ne_zero.mpr hA
      have p2 : dist C B ≠ 0 := dist_ne_zero.mpr hC
      have e := EuclideanGeometry.law_cos A B C
      rw [eq_div_iff (by positivity)]
      linear_combination e
- id: law_of_sines_ratio
  kind: named
  level: high
  topic: 三角形・正弦定理
  statement: 正弦定理。三角形$ABC$（$A,B,C$は同一直線上にない）では$\dfrac{BC}{\sin\angle BAC}=\dfrac{CA}{\sin\angle ABC}=\dfrac{AB}{\sin\angle BCA}$である。
  statement_en: Law of sines. If A, B, C are not collinear, then BC/sin∠BAC = CA/sin∠ABC = AB/sin∠BCA.
  assumptions:
  - $A,B,C$は同一直線上にない
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $\dfrac{BC}{\sin\angle BAC}=\dfrac{CA}{\sin\angle ABC}=\dfrac{AB}{\sin\angle BCA}$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の、同一直線上にない点とする。3つの角は$0$より大きく$\pi$より小さいので、正弦はすべて正である。
    $u=B-A$、$w=C-A$とおく。$\sin\angle BAC=\sqrt{1-\cos^2\angle BAC}$より、$\Delta=\|u\|\|w\|\sin\angle BAC=\sqrt{\|u\|^2\|w\|^2-\langle u,w\rangle^2}$である。頂点$B$でのベクトル$A-B=-u$、$C-B=w-u$についても、同じ計算で$\|u\|\|w-u\|\sin\angle ABC=\sqrt{\|u\|^2\|w-u\|^2-\langle u,w-u\rangle^2}$である。根号の中を展開すると$\|u\|^2\|w\|^2-\langle u,w\rangle^2$に等しい。したがって$AB\cdot AC\sin\angle BAC=AB\cdot BC\sin\angle ABC$である。
    同様に頂点$C$でも$CA\cdot CB\sin\angle BCA$が同じ値$\Delta$になる。$\Delta>0$なので、3つの比はいずれも$AB\cdot BC\cdot CA/\Delta$に等しい。
  strategy: All three products of two sides and the sine of the included angle equal the same Gram determinant square root.
  sketch:
  - 'setup: Non-collinearity makes all sines positive.'
  - 'derive: AB·AC·sin∠BAC equals √(‖u‖²‖w‖² - ⟨u,w⟩²).'
  - 'derive: The same expression arises at B and at C by expanding.'
  - 'conclude: Dividing by AB·BC·CA gives the equal ratios.'
  openmath: (forall (a b c) (-> (not (collinear_points a b c)) (and (= (/ (dist_of b c) (sin (euclid_angle b a c))) (/ (dist_of c a) (sin (euclid_angle a b c)))) (= (/ (dist_of c a) (sin (euclid_angle a b c))) (/ (dist_of a b) (sin (euclid_angle b c a)))))))
  hard_negative:
    statement: $\dfrac{BC}{\sin\angle ABC}=\dfrac{CA}{\sin\angle BAC}$である。
    reason: 辺と対角の対応が崩れている。$BC=3$、$CA=4$、$AB=5$の直角三角形では左辺が$15/4$、右辺が$20/3$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), ¬Collinear ℝ ({A, B, C} : Set P) → dist B C / Real.sin (EuclideanGeometry.angle B A C) = dist C A / Real.sin (EuclideanGeometry.angle A B C) ∧ dist C A / Real.sin (EuclideanGeometry.angle A B C) = dist A B / Real.sin (EuclideanGeometry.angle B C A)
  proof: |
    by
      intro V P _ _ _ _ A B C h
      have sA : 0 < Real.sin (EuclideanGeometry.angle B A C) :=
        EuclideanGeometry.sin_pos_of_not_collinear (by rwa [Set.insert_comm])
      have sB : 0 < Real.sin (EuclideanGeometry.angle A B C) := EuclideanGeometry.sin_pos_of_not_collinear h
      have sC : 0 < Real.sin (EuclideanGeometry.angle B C A) :=
        EuclideanGeometry.sin_pos_of_not_collinear (by rwa [show ({B, C, A} : Set P) = {A, B, C} by ext x; simp; tauto])
      have l1 := EuclideanGeometry.sin_angle_mul_dist_eq_sin_angle_mul_dist A B C
      have l2 := EuclideanGeometry.sin_angle_mul_dist_eq_sin_angle_mul_dist B C A
      rw [EuclideanGeometry.angle_comm C A B] at l1
      constructor
      · rw [div_eq_div_iff sA.ne' sB.ne']; linarith
      · rw [div_eq_div_iff sB.ne' sC.ne']; linarith
- id: triangle_projection_formula
  kind: gap
  level: high
  topic: 三角形・余弦定理
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）では、第一余弦定理$BC=AB\cos\angle ABC+AC\cos\angle ACB$が成り立つ。
  statement_en: If A, B, C are not collinear, then BC = AB·cos∠ABC + AC·cos∠ACB.
  assumptions:
  - $A,B,C$は同一直線上にない
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $BC=AB\cos\angle ABC+AC\cos\angle ACB$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の、同一直線上にない点とする。$B\neq C$なので$BC>0$である。
    余弦定理より$AC^2=AB^2+BC^2-2\,AB\cdot BC\cos\angle ABC$、$AB^2=AC^2+BC^2-2\,AC\cdot BC\cos\angle ACB$である。2式を足して整理すると$2BC^2=2BC(AB\cos\angle ABC+AC\cos\angle ACB)$である。$2BC$で割ると主張の等式である。
  strategy: Add the law of cosines at B and at C, then cancel 2·BC.
  sketch:
  - 'apply_theorem: Write the law of cosines at B and at C.'
  - 'derive: Adding gives 2BC² = 2BC(AB·cos∠ABC + AC·cos∠ACB).'
  - 'conclude: Cancel 2·BC > 0.'
  openmath: (forall (a b c) (-> (not (collinear_points a b c)) (= (dist_of b c) (+ (* (dist_of a b) (cos (euclid_angle a b c))) (* (dist_of a c) (cos (euclid_angle a c b)))))))
  hard_negative:
    statement: $BC=AB\cos\angle ACB+AC\cos\angle ABC$である。
    reason: 辺と角の対応が逆である。$AB=3$、$AC=4$、$BC=5$では正しい式の値は$5$だが、この式の値は$24/5$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), ¬Collinear ℝ ({A, B, C} : Set P) → dist B C = dist A B * Real.cos (EuclideanGeometry.angle A B C) + dist A C * Real.cos (EuclideanGeometry.angle A C B)
  proof: |
    by
      intro V P _ _ _ _ A B C h
      have hBC : B ≠ C := ne₂₃_of_not_collinear h
      have e1 := EuclideanGeometry.law_cos A B C
      have e2 := EuclideanGeometry.law_cos A C B
      rw [dist_comm C B] at e1
      have hp : dist B C ≠ 0 := dist_ne_zero.mpr hBC
      apply mul_left_cancel₀ hp
      linear_combination (-1 / 2) * e1 + (-1 / 2) * e2
- id: median_theorem_apollonius
  kind: named
  level: high
  topic: 三角形・中線定理
  statement: 中線定理（アポロニウスの定理）。点$A,B,C$と線分$BC$の中点$M$について$AB^2+AC^2=2(AM^2+BM^2)$である。
  statement_en: Median theorem. For points A, B, C with M the midpoint of BC, AB² + AC² = 2(AM² + BM²).
  assumptions:
  - $M$は$B$と$C$の中点
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $AB^2+AC^2=2(AM^2+BM^2)$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の点とし、$M$を$B$と$C$の中点とする。$h=A-M$、$v=B-M$とおくと、$C-M=-v$である。
    $A-B=h-v$、$A-C=h+v$なので、内積を展開すると$AB^2=\|h\|^2-2\langle h,v\rangle+\|v\|^2$、$AC^2=\|h\|^2+2\langle h,v\rangle+\|v\|^2$である。足すと$AB^2+AC^2=2\|h\|^2+2\|v\|^2=2(AM^2+BM^2)$である。
  strategy: Expand with vectors from the midpoint; the cross terms cancel.
  sketch:
  - 'setup: Put h = A-M and v = B-M, so C-M = -v.'
  - 'derive: Expanding the squared norms gives opposite cross terms.'
  - 'conclude: Adding gives 2‖h‖² + 2‖v‖².'
  openmath: (forall (a b c) (= (+ (^ (dist_of a b) 2) (^ (dist_of a c) 2)) (* 2 (+ (^ (dist_of a (midpoint_of b c)) 2) (^ (dist_of b (midpoint_of b c)) 2)))))
  hard_negative:
    statement: $AB^2+AC^2=2AM^2+BC^2$である。
    reason: 正しくは$2BM^2=\frac12BC^2$である。1辺$1$の正三角形では左辺が$2$、右辺が$\frac32+1$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), dist A B ^ 2 + dist A C ^ 2 = 2 * (dist A (midpoint ℝ B C) ^ 2 + dist B (midpoint ℝ B C) ^ 2)
  proof: |
    by
      intro V P _ _ _ _ A B C
      have h := EuclideanGeometry.dist_sq_add_dist_sq_eq_two_mul_dist_midpoint_sq_add_half_dist_sq A B C
      rw [h, dist_left_midpoint, Real.norm_two]
      ring
- id: stewart_theorem
  kind: named
  level: high
  topic: 三角形・スチュワートの定理
  statement: スチュワートの定理。点$D$が線分$BC$の内部にあるとき$AB^2\cdot DC+AC^2\cdot BD=BC(AD^2+BD\cdot DC)$である。
  statement_en: Stewart's theorem. If D lies strictly between B and C, then AB²·DC + AC²·BD = BC(AD² + BD·DC).
  assumptions:
  - $D$は$B$と$C$の間にあり$B,C$と異なる
  quantifiers:
  - 任意の4点$A,B,C,D$
  conclusion: $AB^2\cdot DC+AC^2\cdot BD=BC(AD^2+BD\cdot DC)$である。
  answer: |
    $A,B,C,D$を実内積空間上のアフィン空間の点とし、$D$は$B$と$C$の間にあって$B,C$と異なるとする。$BC=BD+DC$である。
    $D$での余弦定理より$AB^2=AD^2+BD^2-2AD\cdot BD\cos\angle ADB$、$AC^2=AD^2+DC^2-2AD\cdot DC\cos\angle ADC$である。$B,D,C$がこの順に一直線上にあるので$\angle ADB+\angle ADC=\pi$であり（$A=D$のときは積が$0$なのでこの角は使わない）、$\cos\angle ADC=-\cos\angle ADB$である。
    第1式に$DC$を、第2式に$BD$を掛けて足すと、余弦の項は消え、$AB^2\cdot DC+AC^2\cdot BD=AD^2(DC+BD)+BD\cdot DC(BD+DC)=BC(AD^2+BD\cdot DC)$である。
  strategy: Apply the law of cosines at D in the two triangles; supplementary angles cancel the cosine terms.
  sketch:
  - 'apply_theorem: Write the law of cosines at D for AB² and AC².'
  - 'derive: D between B and C makes the angles at D supplementary.'
  - 'derive: Multiply by DC and BD and add, cancelling the cosine terms.'
  - 'conclude: Use BC = BD + DC.'
  openmath: (forall (a b c d) (-> (strictly_between b d c) (= (+ (* (^ (dist_of a b) 2) (dist_of d c)) (* (^ (dist_of a c) 2) (dist_of b d))) (* (dist_of b c) (+ (^ (dist_of a d) 2) (* (dist_of b d) (dist_of d c)))))))
  hard_negative:
    statement: $AB^2\cdot BD+AC^2\cdot DC=BC(AD^2+BD\cdot DC)$である。
    reason: 掛ける線分の対応が逆である。$AB=0$すなわち$A=B$、$BD=1$、$DC=2$なら、左辺は$AC^2\cdot2=18$、右辺は$3(1+2)=9$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), Sbtw ℝ B D C → dist A B ^ 2 * dist D C + dist A C ^ 2 * dist B D = dist B C * (dist A D ^ 2 + dist B D * dist D C)
  proof: |
    by
      intro V P _ _ _ _ A B C D hD
      have h := EuclideanGeometry.dist_sq_mul_dist_add_dist_sq_mul_dist A B C D hD.angle₁₂₃_eq_pi
      rwa [dist_comm C D] at h
- id: point_on_line_distance_square_formula
  kind: gap
  level: high
  topic: 三角形・スチュワートの定理
  statement: 直線$BC$上の点$D=B+t(C-B)$（$t$は任意の実数）について、$AD^2=(1-t)AB^2+tAC^2-t(1-t)BC^2$である。スチュワートの定理の内分・外分を問わない形である。
  statement_en: For real t and D = B + t(C - B), AD² = (1-t)AB² + t·AC² - t(1-t)BC².
  assumptions:
  - $t$は実数
  - $D=B+t(C-B)$
  quantifiers:
  - 任意の3点$A,B,C$と任意の実数$t$
  conclusion: $AD^2=(1-t)AB^2+tAC^2-t(1-t)BC^2$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の点、$t$を実数とし、$D=B+t(C-B)$とする。$u=B-A$、$w=C-A$とおくと、$D-A=(1-t)u+tw$である。
    内積を展開すると$AD^2=(1-t)^2\|u\|^2+2t(1-t)\langle u,w\rangle+t^2\|w\|^2$である。一方$BC^2=\|w-u\|^2=\|u\|^2+\|w\|^2-2\langle u,w\rangle$である。右辺$(1-t)\|u\|^2+t\|w\|^2-t(1-t)\|w-u\|^2$を展開すると、$\|u\|^2$の係数は$(1-t)-t(1-t)=(1-t)^2$、$\|w\|^2$の係数は$t-t(1-t)=t^2$、$\langle u,w\rangle$の係数は$2t(1-t)$である。よって両辺は等しい。
  strategy: Expand with vectors from A and compare coefficients.
  sketch:
  - 'setup: Put u = B-A and w = C-A, so D-A = (1-t)u + tw.'
  - 'derive: Expand AD² and BC² in ‖u‖², ‖w‖², ⟨u,w⟩.'
  - 'conclude: The coefficients on both sides agree.'
  openmath: (forall (a b c t) (= (^ (dist_of a (line_point_at b c t)) 2) (- (+ (* (- 1 t) (^ (dist_of a b) 2)) (* t (^ (dist_of a c) 2))) (* t (- 1 t) (^ (dist_of b c) 2)))))
  hard_negative:
    statement: $AD^2=(1-t)AB^2+tAC^2+t(1-t)BC^2$である。
    reason: 最後の項の符号が逆である。$A=B$、$BC=1$、$t=\frac12$では$AD^2=\frac14$であるが、右辺は$\frac12+\frac14$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P) (t : ℝ), dist A (AffineMap.lineMap B C t : P) ^ 2 = (1 - t) * dist A B ^ 2 + t * dist A C ^ 2 - t * (1 - t) * dist B C ^ 2
  proof: |
    by
      intro V P _ _ _ _ A B C t
      have hD : (AffineMap.lineMap B C t : P) -ᵥ A = (1 - t) • (B -ᵥ A) + t • (C -ᵥ A) := by
        rw [AffineMap.lineMap_apply, vadd_vsub_assoc, ← vsub_sub_vsub_cancel_right C B A]
        module
      rw [dist_comm A, dist_comm A B, dist_comm A C, dist_comm B C, dist_eq_norm_vsub V _ A, dist_eq_norm_vsub V B A,
        dist_eq_norm_vsub V C A, dist_eq_norm_vsub V C B, hD, ← vsub_sub_vsub_cancel_right C B A,
        norm_add_sq_real, norm_sub_sq_real, norm_smul, norm_smul, real_inner_smul_left, real_inner_smul_right,
        Real.norm_eq_abs, Real.norm_eq_abs, mul_pow, mul_pow, sq_abs, sq_abs, real_inner_comm (B -ᵥ A) (C -ᵥ A)]
      ring
- id: angle_bisector_length_square
  kind: gap
  level: high
  topic: 三角形・角の二等分線の長さ
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）で、線分$BC$の内部の点$D$が$\angle BAD=\angle DAC$を満たすならば、$AD^2=AB\cdot AC-BD\cdot DC$である。
  statement_en: If A, B, C are not collinear, D lies strictly between B and C and ∠BAD = ∠DAC, then AD² = AB·AC - BD·DC.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $D$は$B$と$C$の間にあり$B,C$と異なる
  - $\angle BAD=\angle DAC$
  quantifiers:
  - 任意の4点$A,B,C,D$
  conclusion: $AD^2=AB\cdot AC-BD\cdot DC$である。
  answer: |
    $A,B,C,D$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$D$は$B$と$C$の間にあって$B,C$と異なり、$\angle BAD=\angle DAC$とする。$c=AB$、$b=AC$、$m=BD$、$n=DC$とおくと$BC=m+n>0$である。
    角の二等分線の定理より$c/b=m/n$、すなわち$cn=mb$である。スチュワートの定理より$c^2n+b^2m=(m+n)(AD^2+mn)$である。左辺は$c(cn)+b(bm)=c(mb)+b(cn)=bc(m+n)$に等しい。両辺を$m+n$で割ると$bc=AD^2+mn$である。
  strategy: Substitute the angle bisector theorem into Stewart's theorem.
  sketch:
  - 'setup: Put c = AB, b = AC, m = BD, n = DC.'
  - 'apply_theorem: The angle bisector theorem gives cn = mb.'
  - 'apply_theorem: Stewart''s theorem gives c²n + b²m = (m+n)(AD² + mn).'
  - 'derive: The left side equals bc(m+n).'
  - 'conclude: Cancel m + n > 0.'
  openmath: (forall (a b c d) (-> (and (not (collinear_points a b c)) (strictly_between b d c) (= (euclid_angle b a d) (euclid_angle d a c))) (= (^ (dist_of a d) 2) (- (* (dist_of a b) (dist_of a c)) (* (dist_of b d) (dist_of d c))))))
  hard_negative:
    statement: 線分$BC$の内部の任意の点$D$について$AD^2=AB\cdot AC-BD\cdot DC$である。
    reason: 二等分線の足でなければ一般に成り立たない。$AB=3$、$AC=4$、$BC=5$で$D$を$BC$の中点にすると、左辺は$25/4$、右辺は$12-25/4$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), ¬Collinear ℝ ({A, B, C} : Set P) → Sbtw ℝ B D C → EuclideanGeometry.angle B A D = EuclideanGeometry.angle D A C → dist A D ^ 2 = dist A B * dist A C - dist B D * dist D C
  proof: |
    by
      intro V P _ _ _ _ A B C D hABC hD hang
      have bis : ∀ D : P, Sbtw ℝ B D C → EuclideanGeometry.angle B A D = EuclideanGeometry.angle D A C →
          dist A B / dist A C = dist B D / dist D C := by
        intro D hD hang
        have hDC : D ≠ C := hD.ne_right
        have hAC : A ≠ C := ne₁₃_of_not_collinear hABC
        have hsin : Real.sin (EuclideanGeometry.angle D A C) ≠ 0 := by
          intro h0
          apply hABC
          have hcol : Collinear ℝ ({D, A, C} : Set P) :=
            EuclideanGeometry.collinear_iff_eq_or_eq_or_sin_eq_zero.mpr (Or.inr (Or.inr h0))
          have hA : A ∈ line[ℝ, D, C] := hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hDC
          have hle : line[ℝ, D, C] ≤ line[ℝ, B, C] :=
            affineSpan_pair_le_of_mem_of_mem hD.wbtw.mem_affineSpan (right_mem_affineSpan_pair ℝ B C)
          exact collinear_insert_of_mem_affineSpan_pair (hle hA)
        have l1 := EuclideanGeometry.sin_angle_mul_dist_eq_sin_angle_mul_dist D A B
        have l2 := EuclideanGeometry.sin_angle_mul_dist_eq_sin_angle_mul_dist D A C
        have hpi := EuclideanGeometry.angle_add_angle_eq_pi_of_angle_eq_pi A hD.angle₁₂₃_eq_pi
        have hβ : Real.sin (EuclideanGeometry.angle B D A) = Real.sin (EuclideanGeometry.angle C D A) := by
          rw [EuclideanGeometry.angle_comm B D A, EuclideanGeometry.angle_comm C D A,
            show EuclideanGeometry.angle A D B = Real.pi - EuclideanGeometry.angle A D C by linarith, Real.sin_pi_sub]
        rw [EuclideanGeometry.angle_comm D A B, hang, hβ] at l1
        rw [div_eq_div_iff (dist_ne_zero.mpr hAC) (dist_ne_zero.mpr hDC)]
