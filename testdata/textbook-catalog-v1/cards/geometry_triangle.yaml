- id: angle_bisector_theorem_internal
  kind: named
  level: high
  topic: 三角形・角の二等分線の定理
  statement: 角の二等分線の定理（内角）。三角形$ABC$（$A,B,C$は同一直線上にない）で、線分$BC$の内部の点$D$が$\angle BAD=\angle DAC$を満たすならば、$AB/AC=BD/DC$である。
  statement_en: Internal angle bisector theorem. If A, B, C are not collinear, D lies strictly between B and C and ∠BAD = ∠DAC, then AB/AC = BD/DC.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $D$は$B$と$C$の間にあり$B,C$と異なる
  - $\angle BAD=\angle DAC$
  quantifiers:
  - 任意の4点$A,B,C,D$
  conclusion: $AB/AC=BD/DC$である。
  answer: |
    $A,B,C,D$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$D$は$B$と$C$の間にあって$B,C$と異なり、$\angle BAD=\angle DAC$とする。$AC>0$、$DC>0$である。
    $\theta=\angle BAD=\angle DAC$とおく。$A$は直線$BC$上にないので$D,A,C$は同一直線上になく、$\sin\theta>0$である。$B,D,C$がこの順に一直線上にあるので$\angle ADB+\angle ADC=\pi$であり、$\sin\angle ADB=\sin\angle ADC$である。この値を$s$とおく。
    三角形$ABD$と$ACD$の正弦定理より、$BD\,s=AB\sin\theta$、$DC\,s=AC\sin\theta$である。第1式に$DC$を、第2式に$BD$を掛けて比べると$AB\cdot DC\sin\theta=AC\cdot BD\sin\theta$である。$\sin\theta$で割ると$AB\cdot DC=AC\cdot BD$であり、$AB/AC=BD/DC$である。
  strategy: Apply the law of sines in the two triangles cut by AD, using equal angles at A and supplementary angles at D.
  sketch:
  - 'setup: Put θ for the common angle at A; non-collinearity gives sinθ > 0.'
  - 'derive: The angles at D are supplementary, so they have equal sines.'
  - 'apply_theorem: The law of sines in ABD and ACD.'
  - 'conclude: Eliminating the common sine gives AB·DC = AC·BD.'
  openmath: (forall (a b c d) (-> (and (not (collinear_points a b c)) (strictly_between b d c) (= (euclid_angle b a d) (euclid_angle d a c))) (= (/ (dist_of a b) (dist_of a c)) (/ (dist_of b d) (dist_of d c)))))
