    statement: 同じ仮定のもとで$AB/AC=DC/BD$である。
    reason: 比の向きが逆である。$AB=3$、$AC=4$、$BC=5$では$BD=15/7$、$DC=20/7$であり、$BD/DC=3/4$で$DC/BD=4/3$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), ¬Collinear ℝ ({A, B, C} : Set P) → Sbtw ℝ B D C → EuclideanGeometry.angle B A D = EuclideanGeometry.angle D A C → dist A B / dist A C = dist B D / dist D C
  proof: |
    by
      intro V P _ _ _ _ A B C D hABC hD hang
