- id: angle_bisector_theorem_converse
  kind: textbook
  level: high
  topic: 三角形・角の二等分線の定理
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）で、線分$BC$の内部の点$D$が$AB/AC=BD/DC$を満たすならば、$\angle BAD=\angle DAC$である。
  statement_en: If A, B, C are not collinear, D lies strictly between B and C and AB/AC = BD/DC, then ∠BAD = ∠DAC.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $D$は$B$と$C$の間にあり$B,C$と異なる
  - $AB/AC=BD/DC$
  quantifiers:
  - 任意の4点$A,B,C,D$
  conclusion: $\angle BAD=\angle DAC$である。
  answer: |
    $A,B,C,D$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$D$は$B$と$C$の間にあって$B,C$と異なり、$AB/AC=BD/DC$とする。
    $0\leq t\leq1$により$D=B+t(C-B)$と書くと、$BD=t\,BC$、$DC=(1-t)BC$である。$c=AB$、$b=AC$とおくと、仮定から$c(1-t)=tb$である。$u=B-A$、$w=C-A$、$v=D-A=(1-t)u+tw$、$I=\langle u,w\rangle$とおく。$A$は直線$BC$上にないので$v\neq0$である。
    $\langle u,v\rangle=(1-t)c^2+tI$、$\langle v,w\rangle=(1-t)I+tb^2$である。このとき$b\langle u,v\rangle-c\langle v,w\rangle=(bc-I)\bigl(c(1-t)-tb\bigr)=0$である。よって$\dfrac{\langle u,v\rangle}{c\|v\|}=\dfrac{\langle v,w\rangle}{b\|v\|}$であり、$\cos\angle BAD=\cos\angle DAC$である。角は$0$以上$\pi$以下で余弦はこの範囲で単射なので、$\angle BAD=\angle DAC$である。
  strategy: Parametrize D, translate the ratio to c(1-t) = tb, and compare the cosines of the two angles.
  sketch:
  - 'setup: Write D = B + t(C-B) with t in [0,1], so the ratio gives c(1-t) = tb.'
  - 'translate: Put u = B-A, w = C-A, v = (1-t)u + tw.'
  - 'derive: b⟨u,v⟩ - c⟨v,w⟩ factors with the factor c(1-t) - tb = 0.'
  - 'derive: The two cosines are equal.'
  - 'conclude: Injectivity of cosine on [0, π] gives equal angles.'
  openmath: (forall (a b c d) (-> (and (not (collinear_points a b c)) (strictly_between b d c) (= (/ (dist_of a b) (dist_of a c)) (/ (dist_of b d) (dist_of d c)))) (= (euclid_angle b a d) (euclid_angle d a c))))
  hard_negative:
    statement: $D$が直線$BC$上の点で線分の外にあっても、$AB/AC=BD/DC$ならば$\angle BAD=\angle DAC$である。
    reason: 外分点は外角の二等分線上にある。このとき$\angle BAD$と$\angle DAC$の差は$\angle BAC$であり（$C$が$B,D$の間なら$\angle BAD=\angle BAC+\angle CAD$）、等しくならない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), ¬Collinear ℝ ({A, B, C} : Set P) → Sbtw ℝ B D C → dist A B / dist A C = dist B D / dist D C → EuclideanGeometry.angle B A D = EuclideanGeometry.angle D A C
  proof: |
    by
      intro V P _ _ _ _ A B C D hABC hD hr
      have hAC : dist A C ≠ 0 := dist_ne_zero.mpr (ne₁₃_of_not_collinear hABC)
      have hAB : dist A B ≠ 0 := dist_ne_zero.mpr (ne₁₂_of_not_collinear hABC)
      have hBC : dist B C ≠ 0 := dist_ne_zero.mpr hD.left_ne_right
      have hDC : dist D C ≠ 0 := dist_ne_zero.mpr hD.ne_right
      have cross := (div_eq_div_iff hAC hDC).mp hr
      have hAD : A ≠ D := by
        rintro rfl
        exact hABC (collinear_insert_of_mem_affineSpan_pair hD.wbtw.mem_affineSpan)
      obtain ⟨⟨t, ht, rfl⟩, -, -⟩ := hD
      rw [dist_left_lineMap, dist_lineMap_right, Real.norm_of_nonneg ht.1, Real.norm_of_nonneg (by linarith [ht.2])] at cross
      have key : dist A B * (1 - t) = t * dist A C := by
        apply mul_right_cancel₀ hBC
        linear_combination cross
      have hv : (AffineMap.lineMap B C t : P) -ᵥ A = (1 - t) • (B -ᵥ A) + t • (C -ᵥ A) := by
        rw [AffineMap.lineMap_apply, vadd_vsub_assoc, ← vsub_sub_vsub_cancel_right C B A]
        module
      have hvn : ‖(AffineMap.lineMap B C t : P) -ᵥ A‖ ≠ 0 := by
        rw [norm_ne_zero_iff]; exact vsub_ne_zero.mpr hAD.symm
      have hc : ‖B -ᵥ A‖ = dist A B := by rw [dist_comm, dist_eq_norm_vsub V]
      have hb : ‖C -ᵥ A‖ = dist A C := by rw [dist_comm, dist_eq_norm_vsub V]
      unfold EuclideanGeometry.angle InnerProductGeometry.angle
      congr 1
      rw [hc, hb, div_eq_div_iff (mul_ne_zero hAB hvn) (mul_ne_zero hvn hAC), hv, inner_add_right, inner_add_left,
        real_inner_smul_right, real_inner_smul_right, real_inner_smul_left, real_inner_smul_left,
        real_inner_self_eq_norm_sq, real_inner_self_eq_norm_sq, hc, hb]
      linear_combination ‖(1 - t) • (B -ᵥ A) + t • (C -ᵥ A)‖ * (dist A B * dist A C - inner ℝ (B -ᵥ A) (C -ᵥ A)) * key
- id: right_triangles_common_hypotenuse_equal_angle_iff_equal_leg
  kind: gap
  level: high
  topic: 三角形・角の二等分線と距離
  statement: $A\neq X$、$A\neq H$、$A\neq K$で、$\angle XHA=\angle XKA=\pi/2$（内積が$0$であること）のとき、$\angle HAX=\angle KAX$と$XH=XK$は同値である。角の二辺への垂線の長さが等しいことと、$AX$が角を二等分することに対応する。
  statement_en: If A ≠ X, A ≠ H, A ≠ K and ∠XHA = ∠XKA = π/2, then ∠HAX = ∠KAX if and only if XH = XK.
  assumptions:
  - $A\neq X$
  - $A\neq H$
  - $A\neq K$
  - $\langle X-H,A-H\rangle=0$
  - $\langle X-K,A-K\rangle=0$
  quantifiers:
  - 任意の4点$A,X,H,K$
  conclusion: $\angle HAX=\angle KAX$と$XH=XK$は同値である。
  answer: |
    $A,X,H,K$を実内積空間上のアフィン空間の点とする。$A\neq X$、$A\neq H$、$A\neq K$で、$\langle X-H,A-H\rangle=\langle X-K,A-K\rangle=0$とする。
    $X-A=(X-H)+(H-A)$で2つのベクトルは直交するので、$AX^2=XH^2+HA^2$であり、$\langle H-A,X-A\rangle=HA^2$である。よって$\cos\angle HAX=HA/AX>0$であり、$\angle HAX$は$0$以上$\pi/2$未満である。さらに$\sin^2\angle HAX=1-HA^2/AX^2=XH^2/AX^2$なので、$XH=AX\sin\angle HAX$である。$K$についても同様に$XK=AX\sin\angle KAX$で、$\angle KAX$は$0$以上$\pi/2$未満である。
    $\angle HAX=\angle KAX$なら$XH=XK$である。逆に$XH=XK$なら、$AX>0$より$\sin\angle HAX=\sin\angle KAX$である。$0$以上$\pi/2$未満で正弦は単射なので、$\angle HAX=\angle KAX$である。
  strategy: In each right triangle the leg equals AX times the sine of an acute angle, and sine is injective on acute angles.
  sketch:
  - 'derive: Orthogonality gives AX² = XH² + HA² and ⟨H-A,X-A⟩ = HA².'
  - 'derive: Hence the angle at A is acute and XH = AX·sin∠HAX.'
  - 'derive: The same holds for K.'
  - 'conclude: Equal angles give equal legs; conversely injectivity of sine gives equal angles.'
  openmath: (forall (a x h k) (-> (and (!= a x) (!= a h) (!= a k) (= (euclid_angle x h a) (/ pi 2)) (= (euclid_angle x k a) (/ pi 2))) (<-> (= (euclid_angle h a x) (euclid_angle k a x)) (= (dist_of x h) (dist_of x k)))))
  hard_negative:
    statement: $\angle XHA,\angle XKA$が直角でなくても、$\angle HAX=\angle KAX$ならば$XH=XK$である。
    reason: $H,K$を半直線上で$A$からの距離が異なるようにとれば、$AX$が角を二等分していても$XH\neq XK$となる。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A X H K : P), A ≠ X → A ≠ H → A ≠ K → EuclideanGeometry.angle X H A = Real.pi / 2 → EuclideanGeometry.angle X K A = Real.pi / 2 → (EuclideanGeometry.angle H A X = EuclideanGeometry.angle K A X ↔ dist X H = dist X K)
  proof: |
    by
      intro V P _ _ _ _ A X H K hX hH hK h1 h2
      have s1 := EuclideanGeometry.sin_angle_mul_dist_of_angle_eq_pi_div_two (p₁ := X) (p₂ := H) (p₃ := A) h1
      have s2 := EuclideanGeometry.sin_angle_mul_dist_of_angle_eq_pi_div_two (p₁ := X) (p₂ := K) (p₃ := A) h2
      have l1 := EuclideanGeometry.angle_lt_pi_div_two_of_angle_eq_pi_div_two (p₁ := X) (p₂ := H) (p₃ := A) h1 hH
      have l2 := EuclideanGeometry.angle_lt_pi_div_two_of_angle_eq_pi_div_two (p₁ := X) (p₂ := K) (p₃ := A) h2 hK
      have n1 := EuclideanGeometry.angle_nonneg H A X
      have n2 := EuclideanGeometry.angle_nonneg K A X
      have hd : dist X A ≠ 0 := dist_ne_zero.mpr hX.symm
      have hpi := Real.pi_pos
      constructor
      · intro h
        rw [← s1, ← s2, h]
      · intro h
        rw [← s1, ← s2] at h
        exact Real.injOn_sin ⟨by linarith, l1.le⟩ ⟨by linarith, l2.le⟩ (mul_right_cancel₀ hd h)
- id: midsegment_theorem
  kind: named
  level: middle
  topic: 三角形・中点連結定理
  statement: 中点連結定理。点$A,B,C$について、$AB$の中点と$AC$の中点を結ぶ直線は直線$BC$に平行で（平行は方向が等しいことを指し、直線の一致も含む）、中点間の距離は$BC/2$である。
  statement_en: Midsegment theorem. For points A, B, C, the line through the midpoints of AB and AC is parallel to line BC, where parallel means equal direction and allows coincidence, and the distance between the midpoints is BC/2.
  assumptions:
  - $M$は$A,B$の中点
  - $N$は$A,C$の中点
  - 平行は方向が等しいことを指し、直線の一致も含む
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: 直線$MN$は直線$BC$に平行で、$MN=BC/2$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の点とし、$M$を$A,B$の中点、$N$を$A,C$の中点とする。平行は方向が等しいことを指す。
    $M-A=\frac12(B-A)$、$N-A=\frac12(C-A)$なので、$M-N=\frac12(B-C)$である。$\frac12\neq0$なので、$M-N$の生成する部分空間は$B-C$の生成する部分空間に等しい。よって直線$MN$と直線$BC$は方向が等しく、平行である。また$MN=\|M-N\|=\frac12\|B-C\|=BC/2$である。
  strategy: The vector between the midpoints is half of B - C.
  sketch:
  - 'derive: M - N = (1/2)(B - C).'
  - 'derive: A nonzero scalar keeps the same direction space, so the lines are parallel.'
  - 'conclude: Taking norms gives MN = BC/2.'
  openmath: (forall (a b c) (and (parallel_lines (midpoint_of a b) (midpoint_of a c) b c) (= (dist_of (midpoint_of a b) (midpoint_of a c)) (/ (dist_of b c) 2))))
  hard_negative:
    statement: $M$が$AB$の中点で$N$が線分$AC$上の任意の点なら、直線$MN$は直線$BC$に平行である。
    reason: $N$が中点でないと方向がずれる。$A=(0,0)$、$B=(2,0)$、$C=(0,2)$、$N=(0,\frac12)$では$M-N=(1,-\frac12)$であり、$B-C=(2,-2)$に平行でない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), (line[ℝ, midpoint ℝ A B, midpoint ℝ A C]).Parallel line[ℝ, B, C] ∧ dist (midpoint ℝ A B) (midpoint ℝ A C) = dist B C / 2
  proof: |
    by
      intro V P _ _ _ _ A B C
      have h : midpoint ℝ A B -ᵥ midpoint ℝ A C = (⅟2 : ℝ) • (B -ᵥ C) :=
        midpoint_vsub_midpoint_same_left ℝ A B C
      constructor
      · rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair, vectorSpan_pair, h]
        exact Submodule.span_singleton_smul_eq (IsUnit.mk0 _ (by norm_num)) _
      · rw [dist_eq_norm_vsub V, dist_eq_norm_vsub V B C, h, norm_smul]
        norm_num
        ring
- id: midsegment_converse
  kind: gap
  level: middle
  topic: 三角形・中点連結定理
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）で、直線$AC$上の点$E$について、$AB$の中点と$E$を結ぶ直線が直線$BC$に平行ならば、$E$は$AC$の中点である。
  statement_en: If A, B, C are not collinear, E lies on line AC, and the line through the midpoint of AB and E is parallel to line BC, then E is the midpoint of AC.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $E$は直線$AC$上の点
  - $AB$の中点と$E$を結ぶ直線は直線$BC$に平行
  quantifiers:
  - 任意の4点$A,B,C,E$
  conclusion: $E$は$A,C$の中点である。
  answer: |
    $A,B,C,E$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$E$は直線$AC$上にあり、$A,B$の中点$M$と$E$を結ぶ直線は直線$BC$に平行であるとする。
    $u=B-A$、$w=C-A$は1次独立である。実数$t$により$E-A=tw$と書く。$M-A=\frac12u$である。平行の仮定より、実数$k$があって$E-M=k(C-B)=k(w-u)$である。左辺は$tw-\frac12u$なので、$(k-\frac12)u+(t-k)w=0$である。1次独立性より$k=\frac12$、$t=k=\frac12$である。よって$E$は$A,C$の中点である。
  strategy: Express E and the midpoint in the independent vectors B-A and C-A and compare coefficients.
  sketch:
  - 'setup: Put u = B-A, w = C-A, which are independent.'
  - 'translate: E - A = tw and M - A = u/2.'
  - 'derive: Parallelism gives tw - u/2 = k(w - u).'
  - 'conclude: Comparing coefficients gives t = 1/2.'
  openmath: (forall (a b c e) (-> (and (not (collinear_points a b c)) (on_line e a c) (parallel_lines (midpoint_of a b) e b c)) (= e (midpoint_of a c))))
  hard_negative:
    statement: $A,B,C$が同一直線上にあっても、この条件から$E$は$AC$の中点である。
    reason: $A,B,C$が相異なる同一直線上の点なら、$AB$の中点$M$と異なる直線$AC$上の点$E$はすべて、直線$ME$が直線$BC$と一致するので条件を満たす。$AC$の中点でない$E$もとれる。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C E : P), ¬Collinear ℝ ({A, B, C} : Set P) → E ∈ line[ℝ, A, C] → (line[ℝ, midpoint ℝ A B, E]).Parallel line[ℝ, B, C] → E = midpoint ℝ A C
  proof: |
    by
      intro V P _ _ _ _ A B C E hABC hE hpar
      have core : ∀ s t : ℝ, (line[ℝ, (AffineMap.lineMap A B s : P), (AffineMap.lineMap A C t : P)]).Parallel line[ℝ, B, C] → s = t := by
        intro s t hpar
        have hli : ∀ a b : ℝ, a • (B -ᵥ A) + b • (C -ᵥ A) = (0 : V) → a = 0 ∧ b = 0 := by
          intro a b h
          by_contra hab
          apply hABC
          rcases not_and_or.mp hab with ha | hb
          · have hB : B -ᵥ A = (-b / a) • (C -ᵥ A) := by
              have h2 : a • (B -ᵥ A) = (-b) • (C -ᵥ A) := by
                rw [neg_smul]; exact eq_neg_of_add_eq_zero_left h
              rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ ha, one_smul]
            have h3 := AffineMap.lineMap_mem_affineSpan_pair (-b / a) A C
            rw [AffineMap.lineMap_apply, ← hB, vsub_vadd] at h3
            have h4 := collinear_insert_of_mem_affineSpan_pair h3
            rwa [Set.insert_comm] at h4
          · have hC : C -ᵥ A = (-a / b) • (B -ᵥ A) := by
              have h2 : b • (C -ᵥ A) = (-a) • (B -ᵥ A) := by
                rw [neg_smul]; exact eq_neg_of_add_eq_zero_right h
              rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ hb, one_smul]
            have h3 := AffineMap.lineMap_mem_affineSpan_pair (-a / b) A B
            rw [AffineMap.lineMap_apply, ← hC, vsub_vadd] at h3
            have h4 := collinear_insert_of_mem_affineSpan_pair h3
            rwa [Set.insert_comm, Set.pair_comm] at h4
        rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev] at hpar
        have hmem : (AffineMap.lineMap A C t : P) -ᵥ (AffineMap.lineMap A B s : P) ∈ Submodule.span ℝ {C -ᵥ B} := by
          rw [← hpar]; exact Submodule.mem_span_singleton_self _
        obtain ⟨k, hk⟩ := Submodule.mem_span_singleton.mp hmem
        have hCB : C -ᵥ B = (C -ᵥ A) - (B -ᵥ A) := (vsub_sub_vsub_cancel_right C B A).symm
        simp only [AffineMap.lineMap_apply, vadd_vsub_vadd_cancel_right] at hk
        rw [hCB] at hk
        have h0 : (s - k) • (B -ᵥ A) + (k - t) • (C -ᵥ A) = (0 : V) := by
          have : t • (C -ᵥ A) - s • (B -ᵥ A) - k • ((C -ᵥ A) - (B -ᵥ A)) = (0 : V) := by
            rw [hk]; simp
          rw [← neg_eq_zero, ← this]; module
        obtain ⟨h1, h2⟩ := hli _ _ h0
        linarith
      obtain ⟨t, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hE
      have ht := core (⅟2) t hpar
      subst ht
      rfl
- id: medial_triangle_similar
  kind: gap
  level: middle
  topic: 三角形・中点連結定理
  statement: 点$A,B,C$について、$BC,CA,AB$の中点をそれぞれ$D,E,F$とすると、$D,E,F$と$A,B,C$はこの対応で相似比$\frac12$の相似である。
  statement_en: For points A, B, C with D, E, F the midpoints of BC, CA, AB, the triples D, E, F and A, B, C are similar in this order, with DE = AB/2, EF = BC/2 and FD = CA/2.
  assumptions:
  - $D,E,F$はそれぞれ$BC,CA,AB$の中点
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $D,E,F$と$A,B,C$はこの対応で相似であり、$DE=\frac12AB$、$EF=\frac12BC$、$FD=\frac12CA$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の点とし、$D,E,F$をそれぞれ$BC,CA,AB$の中点とする。
    一般に点$X,Y,Z$について、$X,Y$の中点から$X,Z$の中点を引いた差は$\frac12(Y-Z)$であり、この2つの中点の距離は$\frac12YZ$である。$D,E$は$C$を共有し、$E,F$は$A$を共有し、$F,D$は$B$を共有するので、$DE=\frac12AB$、$EF=\frac12BC$、$FD=\frac12CA$である。対応する2頂点間の距離の比はすべて$\frac12$なので、相似である。
  strategy: Apply the midsegment length three times with ratio 1/2.
  sketch:
  - 'apply_theorem: Two midpoints sharing an endpoint differ by half of the other endpoints'' difference.'
  - 'derive: DE = AB/2, EF = BC/2, FD = CA/2.'
  - 'conclude: All pairwise distances have ratio 1/2.'
  openmath: (forall (a b c) (and (similar_triangles (midpoint_of b c) (midpoint_of c a) (midpoint_of a b) a b c) (= (dist_of (midpoint_of b c) (midpoint_of c a)) (/ (dist_of a b) 2)) (= (dist_of (midpoint_of c a) (midpoint_of a b)) (/ (dist_of b c) 2)) (= (dist_of (midpoint_of a b) (midpoint_of b c)) (/ (dist_of c a) 2))))
  hard_negative:
    statement: $D,E,F$と$A,C,B$がこの対応で相似である。
    reason: 対応が異なる。$DE=\frac12AB$に対して$AC$が対応することになり、$AB\neq AC$の三角形では比が一定にならない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), Similar ![midpoint ℝ B C, midpoint ℝ C A, midpoint ℝ A B] ![A, B, C] ∧ dist (midpoint ℝ B C) (midpoint ℝ C A) = 1 / 2 * dist A B ∧ dist (midpoint ℝ C A) (midpoint ℝ A B) = 1 / 2 * dist B C ∧ dist (midpoint ℝ A B) (midpoint ℝ B C) = 1 / 2 * dist C A
  proof: |
    by
      intro V P _ _ _ _ A B C
      have key : ∀ X Y Z : P, dist (midpoint ℝ X Y) (midpoint ℝ X Z) = (1 / 2) * dist Y Z := by
        intro X Y Z
        rw [dist_eq_norm_vsub V, dist_eq_norm_vsub V Y Z, midpoint_vsub_midpoint_same_left, norm_smul]
        norm_num
      have h1 : dist (midpoint ℝ B C) (midpoint ℝ C A) = (1 / 2) * dist A B := by
        rw [midpoint_comm (R := ℝ) B C, key, dist_comm]
      have h2 : dist (midpoint ℝ C A) (midpoint ℝ A B) = (1 / 2) * dist B C := by
        rw [midpoint_comm (R := ℝ) C A, key, dist_comm]
      have h3 : dist (midpoint ℝ A B) (midpoint ℝ B C) = (1 / 2) * dist C A := by
        rw [midpoint_comm (R := ℝ) A B, key, dist_comm]
      refine ⟨similar_iff_exists_pos_dist_eq.mpr ⟨1 / 2, by norm_num, fun i j => ?_⟩, h1, h2, h3⟩
      fin_cases i <;> fin_cases j <;> simp <;> grind [dist_comm]
- id: parallel_line_proportional_segments
  kind: textbook
  level: middle
  topic: 三角形・平行線と線分の比
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）で、点$D$が直線$AB$上、点$E$が直線$AC$上にあり、直線$DE$が直線$BC$に平行（直線の一致も含む）ならば、$AD/AB=AE/AC$である。
  statement_en: If A, B, C are not collinear, D lies on line AB, E lies on line AC and line DE is parallel to line BC, then AD/AB = AE/AC.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $D$は直線$AB$上の点
  - $E$は直線$AC$上の点
  - 直線$DE$は直線$BC$に平行（直線の一致も含む）
  quantifiers:
  - 任意の5点$A,B,C,D,E$
  conclusion: $AD/AB=AE/AC$である。
  answer: |
    $A,B,C,D,E$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$D$は直線$AB$上、$E$は直線$AC$上にあり、直線$DE$は直線$BC$に平行であるとする。
    $u=B-A$、$w=C-A$は1次独立である。実数$s,t$により$D-A=su$、$E-A=tw$と書く。平行の仮定より、実数$k$があって$E-D=k(C-B)$である。すなわち$tw-su=k(w-u)$であり、1次独立性より$s=k$、$t=k$である。よって$s=t$である。
    $AB>0$、$AC>0$であり、$AD=|s|AB$、$AE=|s|AC$である。したがって$AD/AB=|s|=AE/AC$である。
  strategy: Compare coefficients in the independent vectors B-A and C-A to get the same parameter on both lines.
  sketch:
  - 'setup: Put u = B-A, w = C-A, which are independent.'
  - 'translate: D - A = su and E - A = tw.'
  - 'derive: Parallelism gives tw - su = k(w - u), hence s = t = k.'
  - 'conclude: AD/AB = |s| = AE/AC.'
  openmath: (forall (a b c d e) (-> (and (not (collinear_points a b c)) (on_line d a b) (on_line e a c) (parallel_lines d e b c)) (= (/ (dist_of a d) (dist_of a b)) (/ (dist_of a e) (dist_of a c)))))
  hard_negative:
    statement: 点$D$が直線$AB$上、点$E$が直線$AC$上にあり、$AD/AB=AE/AC$ならば、直線$DE$は直線$BC$に平行である。
    reason: $D,E$が$A$をはさんで互いに反対側にあると比は等しくても平行にならない。$D-A=\frac12(B-A)$、$E-A=-\frac12(C-A)$では$E-D=-\frac12\bigl((B-A)+(C-A)\bigr)$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D E : P), ¬Collinear ℝ ({A, B, C} : Set P) → D ∈ line[ℝ, A, B] → E ∈ line[ℝ, A, C] → (line[ℝ, D, E]).Parallel line[ℝ, B, C] → dist A D / dist A B = dist A E / dist A C
  proof: |
    by
      intro V P _ _ _ _ A B C D E hABC hD hE hpar
      have core : ∀ s t : ℝ, (line[ℝ, (AffineMap.lineMap A B s : P), (AffineMap.lineMap A C t : P)]).Parallel line[ℝ, B, C] → s = t := by
        intro s t hpar
        have hli : ∀ a b : ℝ, a • (B -ᵥ A) + b • (C -ᵥ A) = (0 : V) → a = 0 ∧ b = 0 := by
          intro a b h
          by_contra hab
          apply hABC
          rcases not_and_or.mp hab with ha | hb
          · have hB : B -ᵥ A = (-b / a) • (C -ᵥ A) := by
              have h2 : a • (B -ᵥ A) = (-b) • (C -ᵥ A) := by
                rw [neg_smul]; exact eq_neg_of_add_eq_zero_left h
              rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ ha, one_smul]
            have h3 := AffineMap.lineMap_mem_affineSpan_pair (-b / a) A C
            rw [AffineMap.lineMap_apply, ← hB, vsub_vadd] at h3
            have h4 := collinear_insert_of_mem_affineSpan_pair h3
            rwa [Set.insert_comm] at h4
          · have hC : C -ᵥ A = (-a / b) • (B -ᵥ A) := by
              have h2 : b • (C -ᵥ A) = (-a) • (B -ᵥ A) := by
                rw [neg_smul]; exact eq_neg_of_add_eq_zero_right h
              rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ hb, one_smul]
            have h3 := AffineMap.lineMap_mem_affineSpan_pair (-a / b) A B
            rw [AffineMap.lineMap_apply, ← hC, vsub_vadd] at h3
            have h4 := collinear_insert_of_mem_affineSpan_pair h3
            rwa [Set.insert_comm, Set.pair_comm] at h4
        rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev] at hpar
        have hmem : (AffineMap.lineMap A C t : P) -ᵥ (AffineMap.lineMap A B s : P) ∈ Submodule.span ℝ {C -ᵥ B} := by
          rw [← hpar]; exact Submodule.mem_span_singleton_self _
        obtain ⟨k, hk⟩ := Submodule.mem_span_singleton.mp hmem
        have hCB : C -ᵥ B = (C -ᵥ A) - (B -ᵥ A) := (vsub_sub_vsub_cancel_right C B A).symm
        simp only [AffineMap.lineMap_apply, vadd_vsub_vadd_cancel_right] at hk
        rw [hCB] at hk
        have h0 : (s - k) • (B -ᵥ A) + (k - t) • (C -ᵥ A) = (0 : V) := by
          have : t • (C -ᵥ A) - s • (B -ᵥ A) - k • ((C -ᵥ A) - (B -ᵥ A)) = (0 : V) := by
            rw [hk]; simp
          rw [← neg_eq_zero, ← this]; module
        obtain ⟨h1, h2⟩ := hli _ _ h0
        linarith
      obtain ⟨s, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hD
      obtain ⟨t, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hE
      have hst := core s t hpar
      subst hst
      have hAB : dist A B ≠ 0 := dist_ne_zero.mpr (ne₁₂_of_not_collinear hABC)
      have hAC : dist A C ≠ 0 := dist_ne_zero.mpr (ne₁₃_of_not_collinear hABC)
      rw [dist_left_lineMap, dist_left_lineMap, mul_div_assoc, mul_div_assoc, div_self hAB, div_self hAC]
- id: proportional_segments_imply_parallel
  kind: textbook
  level: middle
  topic: 三角形・平行線と線分の比
  statement: 点$D$が線分$AB$の内部、点$E$が線分$AC$の内部にあり$AD/AB=AE/AC$ならば、直線$DE$は直線$BC$に平行である（平行は方向が等しいことを指し、直線の一致も含む）。
  statement_en: If D lies strictly between A and B, E lies strictly between A and C and AD/AB = AE/AC, then line DE is parallel to line BC, where parallel means equal direction and allows coincidence.
  assumptions:
  - $D$は$A$と$B$の間にあり$A,B$と異なる
  - $E$は$A$と$C$の間にあり$A,C$と異なる
  - $AD/AB=AE/AC$
  - 平行は方向が等しいことを指し、直線の一致も含む
  quantifiers:
  - 任意の5点$A,B,C,D,E$
  conclusion: 直線$DE$は直線$BC$に平行である。
  answer: |
    $A,B,C,D,E$を実内積空間上のアフィン空間の点とする。$D$は$A$と$B$の間にあって$A,B$と異なり、$E$は$A$と$C$の間にあって$A,C$と異なり、$AD/AB=AE/AC$とする。平行は方向が等しいことを指す。
    $0<s<1$、$0<t<1$により$D-A=s(B-A)$、$E-A=t(C-A)$と書くと、$AD/AB=s$、$AE/AC=t$であり、仮定より$s=t$である。よって$E-D=s\bigl((C-A)-(B-A)\bigr)=s(C-B)$である。$s\neq0$なので$E-D$の生成する部分空間は$C-B$の生成する部分空間に等しく、2直線の方向は等しい。
  strategy: The equal ratios give one scalar s with E - D = s(C - B).
  sketch:
  - 'setup: Write D - A = s(B-A) and E - A = t(C-A) with s, t in (0,1).'
  - 'derive: The ratios are s and t, so s = t.'
  - 'derive: E - D = s(C - B).'
  - 'conclude: s ≠ 0 gives equal direction spaces.'
  openmath: (forall (a b c d e) (-> (and (strictly_between a d b) (strictly_between a e c) (= (/ (dist_of a d) (dist_of a b)) (/ (dist_of a e) (dist_of a c)))) (parallel_lines d e b c)))
  hard_negative:
    statement: 点$D,E$が線分の内部にあり$AD/DB=AE/AC$ならば、直線$DE$は直線$BC$に平行である。
    reason: 比の取り方がそろっていない。$AD/DB=\frac12$、$AE/AC=\frac12$は条件を満たすが、$AD/AB=\frac13$と$AE/AC$が異なるので平行でない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D E : P), Sbtw ℝ A D B → Sbtw ℝ A E C → dist A D / dist A B = dist A E / dist A C → (line[ℝ, D, E]).Parallel line[ℝ, B, C]
  proof: |
    by
      intro V P _ _ _ _ A B C D E hD hE hr
      have hAB : dist A B ≠ 0 := dist_ne_zero.mpr hD.left_ne_right
      have hAC : dist A C ≠ 0 := dist_ne_zero.mpr hE.left_ne_right
      have hDA : D ≠ A := hD.ne_left
      obtain ⟨⟨s, hs, rfl⟩, -, -⟩ := hD
      obtain ⟨⟨t, ht, rfl⟩, -, -⟩ := hE
      rw [dist_left_lineMap, dist_left_lineMap, mul_div_assoc, mul_div_assoc, div_self hAB, div_self hAC,
        mul_one, mul_one, Real.norm_of_nonneg hs.1, Real.norm_of_nonneg ht.1] at hr
      subst hr
      have hs0 : s ≠ 0 := by
        rintro rfl; simp at hDA
      rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev]
      have h : AffineMap.lineMap A C s -ᵥ AffineMap.lineMap A B s = s • (C -ᵥ B) := by
        simp only [AffineMap.lineMap_apply, vadd_vsub_vadd_cancel_right]
        rw [← vsub_sub_vsub_cancel_right C B A, smul_sub]
      rw [h]
      exact Submodule.span_singleton_smul_eq (IsUnit.mk0 _ hs0) _
- id: parallel_line_third_side_ratio
  kind: gap
  level: middle
  topic: 三角形・平行線と線分の比
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）で、点$D$が直線$AB$上、点$E$が直線$AC$上にあり、直線$DE$が直線$BC$に平行（直線の一致も含む）ならば、$AD\cdot BC=DE\cdot AB$である。すなわち$AD:AB=DE:BC$である。
  statement_en: If A, B, C are not collinear, D lies on line AB, E lies on line AC and line DE is parallel to line BC, then AD·BC = DE·AB.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $D$は直線$AB$上の点
  - $E$は直線$AC$上の点
  - 直線$DE$は直線$BC$に平行（直線の一致も含む）
  quantifiers:
  - 任意の5点$A,B,C,D,E$
  conclusion: $AD\cdot BC=DE\cdot AB$である。
  answer: |
    $A,B,C,D,E$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$D$は直線$AB$上、$E$は直線$AC$上にあり、直線$DE$は直線$BC$に平行であるとする。
    $u=B-A$、$w=C-A$は1次独立である。$D-A=su$、$E-A=tw$と書くと、平行の仮定から$tw-su=k(w-u)$となる実数$k$があり、1次独立性より$s=t=k$である。
    よって$D-E=s(u-w)=s(B-C)$であり、$DE=|s|BC$である。また$AD=|s|AB$である。したがって$AD\cdot BC=|s|AB\cdot BC=DE\cdot AB$である。
  strategy: The same parameter s scales both AB to AD and BC to DE.
  sketch:
  - 'translate: Write D - A = su and E - A = tw with u, w independent.'
  - 'derive: Parallelism gives s = t.'
  - 'derive: D - E = s(B - C), so DE = |s|·BC, and AD = |s|·AB.'
  - 'conclude: Multiply to get AD·BC = DE·AB.'
  openmath: (forall (a b c d e) (-> (and (not (collinear_points a b c)) (on_line d a b) (on_line e a c) (parallel_lines d e b c)) (= (* (dist_of a d) (dist_of b c)) (* (dist_of d e) (dist_of a b)))))
  hard_negative:
    statement: 同じ仮定のもとで$AD\cdot BC=DE\cdot DB$である。
    reason: 分母が$AB$でなく$DB$になっている。$D$が$AB$の中点なら$AD=DB$なので$BC=DE$となるが、実際は$DE=BC/2$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D E : P), ¬Collinear ℝ ({A, B, C} : Set P) → D ∈ line[ℝ, A, B] → E ∈ line[ℝ, A, C] → (line[ℝ, D, E]).Parallel line[ℝ, B, C] → dist A D * dist B C = dist D E * dist A B
  proof: |
    by
      intro V P _ _ _ _ A B C D E hABC hD hE hpar
      have core : ∀ s t : ℝ, (line[ℝ, (AffineMap.lineMap A B s : P), (AffineMap.lineMap A C t : P)]).Parallel line[ℝ, B, C] → s = t := by
        intro s t hpar
        have hli : ∀ a b : ℝ, a • (B -ᵥ A) + b • (C -ᵥ A) = (0 : V) → a = 0 ∧ b = 0 := by
          intro a b h
          by_contra hab
          apply hABC
          rcases not_and_or.mp hab with ha | hb
          · have hB : B -ᵥ A = (-b / a) • (C -ᵥ A) := by
              have h2 : a • (B -ᵥ A) = (-b) • (C -ᵥ A) := by
                rw [neg_smul]; exact eq_neg_of_add_eq_zero_left h
              rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ ha, one_smul]
            have h3 := AffineMap.lineMap_mem_affineSpan_pair (-b / a) A C
            rw [AffineMap.lineMap_apply, ← hB, vsub_vadd] at h3
            have h4 := collinear_insert_of_mem_affineSpan_pair h3
            rwa [Set.insert_comm] at h4
          · have hC : C -ᵥ A = (-a / b) • (B -ᵥ A) := by
              have h2 : b • (C -ᵥ A) = (-a) • (B -ᵥ A) := by
                rw [neg_smul]; exact eq_neg_of_add_eq_zero_right h
              rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ hb, one_smul]
            have h3 := AffineMap.lineMap_mem_affineSpan_pair (-a / b) A B
            rw [AffineMap.lineMap_apply, ← hC, vsub_vadd] at h3
            have h4 := collinear_insert_of_mem_affineSpan_pair h3
            rwa [Set.insert_comm, Set.pair_comm] at h4
        rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev] at hpar
        have hmem : (AffineMap.lineMap A C t : P) -ᵥ (AffineMap.lineMap A B s : P) ∈ Submodule.span ℝ {C -ᵥ B} := by
          rw [← hpar]; exact Submodule.mem_span_singleton_self _
        obtain ⟨k, hk⟩ := Submodule.mem_span_singleton.mp hmem
        have hCB : C -ᵥ B = (C -ᵥ A) - (B -ᵥ A) := (vsub_sub_vsub_cancel_right C B A).symm
        simp only [AffineMap.lineMap_apply, vadd_vsub_vadd_cancel_right] at hk
        rw [hCB] at hk
        have h0 : (s - k) • (B -ᵥ A) + (k - t) • (C -ᵥ A) = (0 : V) := by
          have : t • (C -ᵥ A) - s • (B -ᵥ A) - k • ((C -ᵥ A) - (B -ᵥ A)) = (0 : V) := by
            rw [hk]; simp
          rw [← neg_eq_zero, ← this]; module
        obtain ⟨h1, h2⟩ := hli _ _ h0
        linarith
      obtain ⟨s, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hD
      obtain ⟨t, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hE
      have hst := core s t hpar
      subst hst
      have hde : (AffineMap.lineMap A B s : P) -ᵥ (AffineMap.lineMap A C s : P) = s • (B -ᵥ C) := by
        simp only [AffineMap.lineMap_apply, vadd_vsub_vadd_cancel_right]
        rw [← vsub_sub_vsub_cancel_right B C A, smul_sub]
      rw [dist_left_lineMap, dist_eq_norm_vsub V (AffineMap.lineMap A B s : P), hde, norm_smul, ← dist_eq_norm_vsub V B C]
      ring
- id: parallel_iff_internal_division_ratio
  kind: gap
  level: middle
  topic: 三角形・平行線と線分の比
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）で点$D$が線分$AB$の内部、点$E$が線分$AC$の内部にあるとき、直線$DE$が直線$BC$に平行であることと$AD/DB=AE/EC$は同値である。
  statement_en: If A, B, C are not collinear, D lies strictly between A and B and E lies strictly between A and C, then line DE is parallel to line BC if and only if AD/DB = AE/EC.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $D$は$A$と$B$の間にあり$A,B$と異なる
  - $E$は$A$と$C$の間にあり$A,C$と異なる
  quantifiers:
  - 任意の5点$A,B,C,D,E$
  conclusion: 直線$DE$が直線$BC$に平行であることと$AD/DB=AE/EC$は同値である。
  answer: |
    $A,B,C,D,E$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$D$は$A$と$B$の間にあって$A,B$と異なり、$E$は$A$と$C$の間にあって$A,C$と異なるとする。
    $u=B-A$、$w=C-A$は1次独立である。$0<s<1$、$0<t<1$により$D-A=su$、$E-A=tw$と書くと、$AD/DB=s/(1-s)$、$AE/EC=t/(1-t)$である。$s/(1-s)=t/(1-t)$は、分母を払うと$s(1-t)=t(1-s)$、すなわち$s=t$と同値である。
    直線$DE$が直線$BC$に平行なら、実数$k$があって$tw-su=k(w-u)$であり、1次独立性より$s=t$である。逆に$s=t$なら$E-D=s(C-B)$で$s\neq0$なので、2直線の方向は等しい。
  strategy: Both conditions are equivalent to equality of the two parameters along AB and AC.
  sketch:
  - 'setup: Write D - A = su and E - A = tw with s, t in (0,1).'
  - 'derive: AD/DB = AE/EC is equivalent to s = t.'
  - 'derive: Parallelism gives s = t by independence of u, w.'
  - 'derive: Conversely s = t gives E - D = s(C - B).'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (a b c d e) (-> (and (not (collinear_points a b c)) (strictly_between a d b) (strictly_between a e c)) (<-> (parallel_lines d e b c) (= (/ (dist_of a d) (dist_of d b)) (/ (dist_of a e) (dist_of e c))))))
  hard_negative:
    statement: $D$が線分$AB$の内部、$E$が辺$AC$の$C$側の延長上にあっても、$AD/DB=AE/EC$なら直線$DE$は直線$BC$に平行である。
    reason: $D-A=\frac23(B-A)$、$E-A=2(C-A)$では$AD/DB=AE/EC=2$であるが、$E-D$は$C-B$の実数倍でない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D E : P), ¬Collinear ℝ ({A, B, C} : Set P) → Sbtw ℝ A D B → Sbtw ℝ A E C → ((line[ℝ, D, E]).Parallel line[ℝ, B, C] ↔ dist A D / dist D B = dist A E / dist E C)
  proof: |
    by
      intro V P _ _ _ _ A B C D E hABC hD hE
      have core : ∀ s t : ℝ, (line[ℝ, (AffineMap.lineMap A B s : P), (AffineMap.lineMap A C t : P)]).Parallel line[ℝ, B, C] → s = t := by
        intro s t hpar
        have hli : ∀ a b : ℝ, a • (B -ᵥ A) + b • (C -ᵥ A) = (0 : V) → a = 0 ∧ b = 0 := by
          intro a b h
          by_contra hab
          apply hABC
          rcases not_and_or.mp hab with ha | hb
          · have hB : B -ᵥ A = (-b / a) • (C -ᵥ A) := by
              have h2 : a • (B -ᵥ A) = (-b) • (C -ᵥ A) := by
                rw [neg_smul]; exact eq_neg_of_add_eq_zero_left h
              rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ ha, one_smul]
            have h3 := AffineMap.lineMap_mem_affineSpan_pair (-b / a) A C
            rw [AffineMap.lineMap_apply, ← hB, vsub_vadd] at h3
            have h4 := collinear_insert_of_mem_affineSpan_pair h3
            rwa [Set.insert_comm] at h4
          · have hC : C -ᵥ A = (-a / b) • (B -ᵥ A) := by
              have h2 : b • (C -ᵥ A) = (-a) • (B -ᵥ A) := by
                rw [neg_smul]; exact eq_neg_of_add_eq_zero_right h
              rw [div_eq_inv_mul, mul_smul, ← h2, smul_smul, inv_mul_cancel₀ hb, one_smul]
            have h3 := AffineMap.lineMap_mem_affineSpan_pair (-a / b) A B
            rw [AffineMap.lineMap_apply, ← hC, vsub_vadd] at h3
            have h4 := collinear_insert_of_mem_affineSpan_pair h3
            rwa [Set.insert_comm, Set.pair_comm] at h4
        rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev] at hpar
        have hmem : (AffineMap.lineMap A C t : P) -ᵥ (AffineMap.lineMap A B s : P) ∈ Submodule.span ℝ {C -ᵥ B} := by
          rw [← hpar]; exact Submodule.mem_span_singleton_self _
        obtain ⟨k, hk⟩ := Submodule.mem_span_singleton.mp hmem
        have hCB : C -ᵥ B = (C -ᵥ A) - (B -ᵥ A) := (vsub_sub_vsub_cancel_right C B A).symm
        simp only [AffineMap.lineMap_apply, vadd_vsub_vadd_cancel_right] at hk
        rw [hCB] at hk
        have h0 : (s - k) • (B -ᵥ A) + (k - t) • (C -ᵥ A) = (0 : V) := by
          have : t • (C -ᵥ A) - s • (B -ᵥ A) - k • ((C -ᵥ A) - (B -ᵥ A)) = (0 : V) := by
            rw [hk]; simp
          rw [← neg_eq_zero, ← this]; module
        obtain ⟨h1, h2⟩ := hli _ _ h0
        linarith
      have hAB : dist A B ≠ 0 := dist_ne_zero.mpr hD.left_ne_right
      have hAC : dist A C ≠ 0 := dist_ne_zero.mpr hE.left_ne_right
      have hDA : D ≠ A := hD.ne_left
      have hDB : D ≠ B := hD.ne_right
      have hEC : E ≠ C := hE.ne_right
      obtain ⟨⟨s, hs, rfl⟩, -, -⟩ := hD
      obtain ⟨⟨t, ht, rfl⟩, -, -⟩ := hE
      have hs1 : s ≠ 1 := by
        rintro rfl; simp at hDB
      have ht1 : t ≠ 1 := by
        rintro rfl; simp at hEC
      have hs0 : s ≠ 0 := by
        rintro rfl; simp at hDA
      have p1 : 1 - s ≠ 0 := sub_ne_zero.mpr hs1.symm
      have p2 : 1 - t ≠ 0 := sub_ne_zero.mpr ht1.symm
      rw [dist_left_lineMap, dist_left_lineMap, dist_lineMap_right, dist_lineMap_right, Real.norm_of_nonneg hs.1,
        Real.norm_of_nonneg ht.1, Real.norm_of_nonneg (by linarith [hs.2]), Real.norm_of_nonneg (by linarith [ht.2]),
        mul_div_mul_right _ _ hAB, mul_div_mul_right _ _ hAC, div_eq_div_iff p1 p2]
      constructor
      · intro hpar
        have hst := core s t hpar
        rw [hst]
      · intro hprod
        have hst : s = t := by linarith
        subst hst
        rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev]
        have h : (AffineMap.lineMap A C s : P) -ᵥ (AffineMap.lineMap A B s : P) = s • (C -ᵥ B) := by
          simp only [AffineMap.lineMap_apply, vadd_vsub_vadd_cancel_right]
          rw [← vsub_sub_vsub_cancel_right C B A, smul_sub]
        rw [h]
        exact Submodule.span_singleton_smul_eq (IsUnit.mk0 _ hs0) _
- id: three_parallel_lines_proportional
  kind: textbook
  level: middle
  topic: 三角形・平行線と線分の比
  statement: 点$B$が直線$AC$上、点$B'$が直線$A'C'$上にあり、$A,C,A'$は同一直線上にないとする。直線$AA'$、$BB'$、$CC'$が平行（直線の一致も含む）ならば、$AB\cdot B'C'=BC\cdot A'B'$である。すなわち平行線は2直線を等しい比に分ける。
  statement_en: If B lies on line AC, B' lies on line A'C', A, C, A' are not collinear, and lines AA', BB', CC' are parallel, then AB·B'C' = BC·A'B'.
  assumptions:
  - $A,C,A'$は同一直線上にない
  - $B$は直線$AC$上の点
  - $B'$は直線$A'C'$上の点
  - 直線$AA'$は直線$BB'$に平行（直線の一致も含む）
  - 直線$AA'$は直線$CC'$に平行（直線の一致も含む）
  quantifiers:
  - 任意の6点$A,B,C,A',B',C'$
  conclusion: $AB\cdot B'C'=BC\cdot A'B'$である。
  answer: |
    $A,B,C,A',B',C'$を実内積空間上のアフィン空間の点とする。$A,C,A'$は同一直線上になく、$B$は直線$AC$上、$B'$は直線$A'C'$上にあり、直線$AA'$は直線$BB'$と直線$CC'$に平行であるとする。
    $g=A'-A$、$u=C-A$、$v=C'-A'$とおく。$g,u$は1次独立である。$B-A=tu$、$B'-A'=t'v$と書く。平行の仮定より実数$k,l$があって$B'-B=kg$、$C'-C=lg$である。$C'-C=v-u+g$、$B'-B=t'v-tu+g$である。
    第1の式から$v=u+(l-1)g$である。これを第2の式に代入すると、$kg=(t'-t)u+\bigl(t'(l-1)+1\bigr)g$となる。$g,u$の1次独立性より$t'=t$である。
    よって$AB=|t|AC$、$BC=|1-t|AC$、$A'B'=|t|A'C'$、$B'C'=|1-t|A'C'$であり、$AB\cdot B'C'=|t||1-t|AC\cdot A'C'=BC\cdot A'B'$である。
  strategy: Parallelism forces the same parameter on the two transversals, by independence of the direction and C - A.
  sketch:
  - 'setup: Put g = A''-A, u = C-A, v = C''-A'', with g, u independent.'
  - 'translate: B - A = tu and B'' - A'' = t''v.'
  - 'derive: Parallelism gives C''-C = lg and B''-B = kg.'
  - 'derive: Eliminating v gives (t''-t)u in the span of g, so t'' = t.'
  - 'conclude: All four lengths are |t| or |1-t| times AC or A''C''.'
  openmath: (forall (a b c a1 b1 c1) (-> (and (not (collinear_points a c a1)) (on_line b a c) (on_line b1 a1 c1) (parallel_lines a a1 b b1) (parallel_lines a a1 c c1)) (= (* (dist_of a b) (dist_of b1 c1)) (* (dist_of b c) (dist_of a1 b1)))))
  hard_negative:
    statement: 直線$AA'$と$BB'$が平行であれば、$CC'$の条件なしで$AB\cdot B'C'=BC\cdot A'B'$である。
    reason: $C'$は直線$A'B'$上で自由に動かせるので、$B'C'$の長さが変わっても$AB,BC,A'B'$は変わらない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C A' B' C' : P), ¬Collinear ℝ ({A, C, A'} : Set P) → B ∈ line[ℝ, A, C] → B' ∈ line[ℝ, A', C'] → (line[ℝ, A, A']).Parallel line[ℝ, B, B'] → (line[ℝ, A, A']).Parallel line[ℝ, C, C'] → dist A B * dist B' C' = dist B C * dist A' B'
  proof: |
    by
      intro V P _ _ _ _ A B C A' B' C' hc hB hB' h1 h2
      obtain ⟨t, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hB
      obtain ⟨t', rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hB'
      rw [AffineSubspace.affineSpan_pair_parallel_iff_vectorSpan_eq, vectorSpan_pair_rev, vectorSpan_pair_rev] at h1 h2
      have m1 : (AffineMap.lineMap A' C' t' : P) -ᵥ (AffineMap.lineMap A C t : P) ∈ Submodule.span ℝ {A' -ᵥ A} := by
        rw [h1]; exact Submodule.mem_span_singleton_self _
      have m2 : C' -ᵥ C ∈ Submodule.span ℝ {A' -ᵥ A} := by
        rw [h2]; exact Submodule.mem_span_singleton_self _
      obtain ⟨k, hk⟩ := Submodule.mem_span_singleton.mp m1
      obtain ⟨l, hl⟩ := Submodule.mem_span_singleton.mp m2
      have e1 : (AffineMap.lineMap A' C' t' : P) -ᵥ (AffineMap.lineMap A C t : P) =
          t' • (C' -ᵥ A') - t • (C -ᵥ A) + (A' -ᵥ A) := by
        rw [AffineMap.lineMap_apply, AffineMap.lineMap_apply, vadd_vsub_assoc, vsub_vadd_eq_vsub_sub]
        abel
      have e2 : C' -ᵥ C = (C' -ᵥ A') - (C -ᵥ A) + (A' -ᵥ A) := by
        rw [← vsub_sub_vsub_cancel_right C' C A, ← vsub_add_vsub_cancel C' A' A]
        abel
      rw [e1] at hk
      rw [e2] at hl
      have hv : C' -ᵥ A' = l • (A' -ᵥ A) + (C -ᵥ A) - (A' -ᵥ A) := by
        rw [hl]; abel
      have hrel : (t' - t) • (C -ᵥ A) = (k - t' * l + t' - 1) • (A' -ᵥ A) := by
        rw [hv] at hk
        have : k • (A' -ᵥ A) - (t' * l - t' + 1) • (A' -ᵥ A) = (t' - t) • (C -ᵥ A) := by
          rw [hk]; module
        rw [← this]; module
      have htt : t' = t := by
        by_contra hne
        apply hc
        have hne' : t' - t ≠ 0 := sub_ne_zero.mpr hne
        have hu : C -ᵥ A = ((k - t' * l + t' - 1) / (t' - t)) • (A' -ᵥ A) := by
          rw [div_eq_inv_mul, mul_smul, ← hrel, smul_smul, inv_mul_cancel₀ hne', one_smul]
        have h3 := AffineMap.lineMap_mem_affineSpan_pair ((k - t' * l + t' - 1) / (t' - t)) A A'
        rw [AffineMap.lineMap_apply, ← hu, vsub_vadd] at h3
        have h4 := collinear_insert_of_mem_affineSpan_pair h3
        rwa [Set.insert_comm] at h4
      subst htt
      rw [dist_left_lineMap, dist_left_lineMap, dist_lineMap_right, dist_lineMap_right]
      ring
- id: right_triangle_altitude_geometric_mean
  kind: textbook
  level: middle
  topic: 三角形・直角三角形の垂線
  statement: $\angle BAC=\pi/2$（内積$\langle B-A,C-A\rangle$が$0$であること）で、$H$が直線$BC$上にあり$A-H$と$C-B$の内積が$0$であるならば（$H$は斜辺への垂線の足）、$AH^2=BH\cdot HC$である。
  statement_en: If ⟨B-A,C-A⟩ = 0, that is ∠BAC = π/2, H lies on line BC and ⟨A-H,C-B⟩ = 0, then AH² = BH·HC.
  assumptions:
  - $\langle B-A,C-A\rangle=0$
  - $H$は直線$BC$上の点
  - $\langle A-H,C-B\rangle=0$
  quantifiers:
  - 任意の4点$A,B,C,H$
  conclusion: $AH^2=BH\cdot HC$である。
  answer: |
    $A,B,C,H$を実内積空間上のアフィン空間の点とする。$\langle B-A,C-A\rangle=0$で、$H$は直線$BC$上にあり、$\langle A-H,C-B\rangle=0$とする。
    $d=C-B$、$h=A-H$とおき、実数$x$により$H-B=xd$と書く。このとき$B-A=-xd-h$、$C-A=(1-x)d-h$であり、$\langle h,d\rangle=0$である。$\langle B-A,C-A\rangle=0$を展開すると$-x(1-x)\|d\|^2+\|h\|^2=0$であり、$AH^2=x(1-x)\|d\|^2$である。
    また$BH=|x|\|d\|$、$HC=|1-x|\|d\|$である。$d=0$なら両辺とも$0$である。$d\neq0$なら$x(1-x)=AH^2/\|d\|^2\geq0$なので$|x||1-x|=x(1-x)$であり、$BH\cdot HC=x(1-x)\|d\|^2=AH^2$である。
  strategy: Parametrize H on the hypotenuse and expand the right-angle condition.
  sketch:
  - 'setup: Put d = C-B, h = A-H, H - B = xd, with h orthogonal to d.'
  - 'derive: The right angle gives ‖h‖² = x(1-x)‖d‖².'
  - 'derive: BH = |x|‖d‖ and HC = |1-x|‖d‖.'
  - 'case_split: If d = 0 both sides vanish.'
  - 'conclude: Otherwise x(1-x) ≥ 0 removes the absolute values.'
  openmath: (forall (a b c h) (-> (and (= (euclid_angle b a c) (/ pi 2)) (on_line h b c) (perpendicular_lines a h b c)) (= (^ (dist_of a h) 2) (* (dist_of b h) (dist_of h c)))))
  hard_negative:
    statement: $\angle BAC$が直角でなくても、$H$が$A$から$BC$への垂線の足ならば$AH^2=BH\cdot HC$である。
    reason: $A=(0,1)$、$B=(-1,0)$、$C=(2,0)$、$H=(0,0)$では$\angle BAC$は直角でなく、$AH^2=1$、$BH\cdot HC=2$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C H : P), EuclideanGeometry.angle B A C = Real.pi / 2 → H ∈ line[ℝ, B, C] → inner ℝ (A -ᵥ H) (C -ᵥ B) = 0 → dist A H ^ 2 = dist B H * dist H C
  proof: |
    by
      intro V P _ _ _ _ A B C H hA hH hperp
      obtain ⟨x, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hH
      set d : V := C -ᵥ B with hd
      set h : V := A -ᵥ AffineMap.lineMap B C x with hh
      have hBH : B -ᵥ AffineMap.lineMap B C x = (-x) • d := by
        rw [AffineMap.lineMap_apply, vsub_vadd_eq_vsub_sub, vsub_self, zero_sub, neg_smul]
      have hCH : C -ᵥ AffineMap.lineMap B C x = (1 - x) • d := by
        rw [AffineMap.lineMap_apply, vsub_vadd_eq_vsub_sub, ← hd, sub_smul, one_smul]
      have hin : inner ℝ (B -ᵥ A) (C -ᵥ A) = 0 := by
        rw [InnerProductGeometry.inner_eq_zero_iff_angle_eq_pi_div_two]; exact hA
      have e1 : B -ᵥ A = (-x) • d - h := by rw [← hBH, hh, vsub_sub_vsub_cancel_right]
      have e2 : C -ᵥ A = (1 - x) • d - h := by rw [← hCH, hh, vsub_sub_vsub_cancel_right]
      have hdh : inner ℝ d h = 0 := by rw [real_inner_comm]; exact hperp
      rw [e1, e2] at hin
      simp only [inner_sub_left, inner_sub_right, real_inner_smul_left, real_inner_smul_right, hperp, hdh,
        real_inner_self_eq_norm_sq] at hin
      have key : ‖h‖ ^ 2 = x * (1 - x) * ‖d‖ ^ 2 := by linear_combination hin
      rw [dist_eq_norm_vsub V A, ← hh, dist_eq_norm_vsub V B, dist_comm, dist_eq_norm_vsub V C, hBH, hCH, norm_smul, norm_smul]
      rw [key, Real.norm_eq_abs, Real.norm_eq_abs, abs_neg]
      by_cases hd0 : ‖d‖ = 0
      · simp [hd0]
      · have hpos : 0 < ‖d‖ ^ 2 := by positivity
        have hnn : 0 ≤ x * (1 - x) := by
          by_contra hc
          nlinarith [sq_nonneg ‖h‖, not_le.mp hc]
        have : |x| * |1 - x| = x * (1 - x) := by rw [← abs_mul, abs_of_nonneg hnn]
        linear_combination (-‖d‖ ^ 2) * this
- id: right_triangle_leg_square_projection
  kind: gap
  level: middle
  topic: 三角形・直角三角形の垂線
  statement: $\angle BAC=\pi/2$（内積$\langle B-A,C-A\rangle$が$0$であること）で、$H$が$A$から直線$BC$への垂線の足（$H$は直線$BC$上、$\langle A-H,C-B\rangle=0$）ならば、$AB^2=BH\cdot BC$である。
  statement_en: If ⟨B-A,C-A⟩ = 0, H lies on line BC and ⟨A-H,C-B⟩ = 0, then AB² = BH·BC.
  assumptions:
  - $\langle B-A,C-A\rangle=0$
  - $H$は直線$BC$上の点
  - $\langle A-H,C-B\rangle=0$
  quantifiers:
  - 任意の4点$A,B,C,H$
  conclusion: $AB^2=BH\cdot BC$である。
  answer: |
    $A,B,C,H$を実内積空間上のアフィン空間の点とする。$\langle B-A,C-A\rangle=0$で、$H$は直線$BC$上にあり、$\langle A-H,C-B\rangle=0$とする。
    $d=C-B$、$h=A-H$とおき、$H-B=xd$と書く。$\langle h,d\rangle=0$であり、$\langle B-A,C-A\rangle=0$を展開すると$\|h\|^2=x(1-x)\|d\|^2$である。$A-B=h+xd$なので、$AB^2=\|h\|^2+x^2\|d\|^2=x\|d\|^2$である。
    $BH=|x|\|d\|$、$BC=\|d\|$である。$d=0$なら両辺とも$0$である。$d\neq0$なら$x=AB^2/\|d\|^2\geq0$なので$BH\cdot BC=x\|d\|^2=AB^2$である。
  strategy: Parametrize H; the right angle gives AB² = x‖d‖² with x ≥ 0.
  sketch:
  - 'setup: Put d = C-B, h = A-H, H - B = xd.'
  - 'derive: The right angle gives ‖h‖² = x(1-x)‖d‖².'
  - 'derive: AB² = ‖h‖² + x²‖d‖² = x‖d‖².'
  - 'conclude: If d ≠ 0 then x ≥ 0, so BH·BC = x‖d‖².'
  openmath: (forall (a b c h) (-> (and (= (euclid_angle b a c) (/ pi 2)) (on_line h b c) (perpendicular_lines a h b c)) (= (^ (dist_of a b) 2) (* (dist_of b h) (dist_of b c)))))
  hard_negative:
    statement: 同じ仮定のもとで$AB^2=BH\cdot HC$である。
    reason: $HC$ではなく$BC$である。$AB^2=BH\cdot BC$であり、$AH^2$の方が$BH\cdot HC$に等しい。$AB=3$、$AC=4$では$BH=9/5$、$HC=16/5$で$BH\cdot HC\neq9$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C H : P), EuclideanGeometry.angle B A C = Real.pi / 2 → H ∈ line[ℝ, B, C] → inner ℝ (A -ᵥ H) (C -ᵥ B) = 0 → dist A B ^ 2 = dist B H * dist B C
  proof: |
    by
      intro V P _ _ _ _ A B C H hA hH hperp
      have core : ∃ x : ℝ, H = AffineMap.lineMap B C x ∧ dist A H ^ 2 = x * (1 - x) * dist B C ^ 2 ∧
          dist A B ^ 2 = x * dist B C ^ 2 ∧ dist A C ^ 2 = (1 - x) * dist B C ^ 2 ∧
          dist B H = |x| * dist B C ∧ dist H C = |1 - x| * dist B C := by
        obtain ⟨x, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hH
        refine ⟨x, rfl, ?_⟩
        have hdBC : dist B C = ‖C -ᵥ B‖ := by rw [dist_comm, dist_eq_norm_vsub V C B]
        rw [hdBC]
        set d : V := C -ᵥ B with hd
        set h : V := A -ᵥ AffineMap.lineMap B C x with hh
        have hBH : B -ᵥ AffineMap.lineMap B C x = (-x) • d := by
          rw [AffineMap.lineMap_apply, vsub_vadd_eq_vsub_sub, vsub_self, zero_sub, neg_smul]
        have hCH : C -ᵥ AffineMap.lineMap B C x = (1 - x) • d := by
          rw [AffineMap.lineMap_apply, vsub_vadd_eq_vsub_sub, ← hd, sub_smul, one_smul]
        have hin : inner ℝ (B -ᵥ A) (C -ᵥ A) = 0 := by
          rw [InnerProductGeometry.inner_eq_zero_iff_angle_eq_pi_div_two]; exact hA
        have e1 : B -ᵥ A = (-x) • d - h := by rw [← hBH, hh, vsub_sub_vsub_cancel_right]
        have e2 : C -ᵥ A = (1 - x) • d - h := by rw [← hCH, hh, vsub_sub_vsub_cancel_right]
        have hdh : inner ℝ d h = 0 := by rw [real_inner_comm]; exact hperp
        rw [e1, e2] at hin
        simp only [inner_sub_left, inner_sub_right, real_inner_smul_left, real_inner_smul_right, hperp, hdh,
          real_inner_self_eq_norm_sq] at hin
        have key : ‖h‖ ^ 2 = x * (1 - x) * ‖d‖ ^ 2 := by linear_combination hin
        have a1 : dist A B ^ 2 = x * ‖d‖ ^ 2 := by
          rw [dist_comm, dist_eq_norm_vsub V B A, e1, norm_sub_sq_real, real_inner_smul_left, hdh, norm_smul, key,
            Real.norm_eq_abs, mul_pow, sq_abs]
          ring
        have a2 : dist A C ^ 2 = (1 - x) * ‖d‖ ^ 2 := by
          rw [dist_comm, dist_eq_norm_vsub V C A, e2, norm_sub_sq_real, real_inner_smul_left, hdh, norm_smul, key,
            Real.norm_eq_abs, mul_pow, sq_abs]
          ring
        refine ⟨?_, a1, a2, ?_, ?_⟩
        · rw [dist_eq_norm_vsub V A, ← hh, key]
        · rw [dist_eq_norm_vsub V B, hBH, norm_smul, Real.norm_eq_abs, abs_neg]
        · rw [dist_comm, dist_eq_norm_vsub V C, hCH, norm_smul, Real.norm_eq_abs]
      obtain ⟨x, -, -, h1, -, h2, -⟩ := core
      rw [h1, h2]
      by_cases h0 : dist B C = 0
      · simp [h0]
      · have hp : 0 < dist B C ^ 2 := by positivity
        have hx : 0 ≤ x := by
          by_contra hn
          nlinarith [sq_nonneg (dist A B), not_le.mp hn]
        rw [abs_of_nonneg hx]
        ring
- id: right_triangle_altitude_hypotenuse_product
  kind: gap
  level: middle
  topic: 三角形・直角三角形の垂線
  statement: $\angle BAC=\pi/2$（内積$\langle B-A,C-A\rangle$が$0$であること）で、$H$が$A$から直線$BC$への垂線の足（$H$は直線$BC$上、$\langle A-H,C-B\rangle=0$）ならば、$AH\cdot BC=AB\cdot AC$である。
