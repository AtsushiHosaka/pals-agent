  sketch:
  - 'derive: C between B and D gives ∠ACB + ∠ACD = π.'
  - 'apply_theorem: The angle sum gives ∠ABC + ∠BCA + ∠CAB = π.'
  - 'conclude: Eliminate ∠ACB.'
  openmath: (forall (a b c d) (-> (and (not (collinear_points a b c)) (strictly_between b c d)) (= (euclid_angle a c d) (+ (euclid_angle a b c) (euclid_angle b a c)))))
  hard_negative:
