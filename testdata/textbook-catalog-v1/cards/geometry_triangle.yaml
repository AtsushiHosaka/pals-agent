  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）で点$C$が線分$BD$の内部にあるとき、$C$における外角$\angle ACD$は、隣り合わない2つの内角の和$\angle ABC+\angle BAC$に等しい。
