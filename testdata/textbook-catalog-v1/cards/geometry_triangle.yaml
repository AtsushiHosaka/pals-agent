        have dAB : dist (!₂[x, y] : EuclideanSpace ℝ (Fin 2)) !₂[0, 0] = c := by
          rw [EuclideanSpace.dist_eq]
          simp only [Fin.sum_univ_two, Real.dist_eq, sq_abs]
          simp
          rw [show x ^ 2 + y ^ 2 = c ^ 2 by rw [hy2]; ring]
          exact Real.sqrt_sq hc.le
        refine ⟨!₂[x, y], !₂[0, 0], !₂[a, 0], ?_, dBC, dCA, dAB⟩
        intro hcol
        rcases hcol.wbtw_or_wbtw_or_wbtw with hw | hw | hw
        · have := hw.dist_add_dist
          rw [dAB, dBC, dist_comm, dCA] at this; linarith
        · have := hw.dist_add_dist
          rw [dBC, dCA, dist_comm, dAB] at this; linarith
        · have := hw.dist_add_dist
          rw [dCA, dAB, dist_comm, dBC] at this; linarith
- id: perpendicular_iff_square_difference
  kind: gap
  level: high
  topic: 三角形・三平方の定理の応用
  statement: 点$A,B,C,H$について、$A-H$と$C-B$の内積が$0$であることと、$AB^2-AC^2=HB^2-HC^2$は同値である。
  statement_en: For points A, B, C, H, ⟨A-H, C-B⟩ = 0 if and only if AB² - AC² = HB² - HC².
  assumptions:
  - $A,B,C,H$は実内積空間上のアフィン空間の点
  quantifiers:
  - 任意の4点$A,B,C,H$
  conclusion: $\langle A-H,C-B\rangle=0$と$AB^2-AC^2=HB^2-HC^2$は同値である。
  answer: |
    $A,B,C,H$を実内積空間上のアフィン空間の点とする。$h=A-H$、$x=B-H$、$y=C-H$とおくと、$A-B=h-x$、$A-C=h-y$、$C-B=y-x$である。
    内積を展開すると$AB^2=\|h\|^2-2\langle h,x\rangle+\|x\|^2$、$AC^2=\|h\|^2-2\langle h,y\rangle+\|y\|^2$である。差をとると、$AB^2-AC^2=\|x\|^2-\|y\|^2+2\langle h,y-x\rangle=HB^2-HC^2+2\langle h,C-B\rangle$である。
    したがって$AB^2-AC^2=HB^2-HC^2$は$\langle A-H,C-B\rangle=0$と同値である。
  strategy: Expand both squared distances from H; the difference is exactly twice the inner product.
  sketch:
  - 'setup: Put h = A-H, x = B-H, y = C-H.'
  - 'derive: Expanding gives AB² - AC² = HB² - HC² + 2⟨h, y-x⟩.'
  - 'conclude: The two conditions are equivalent since y - x = C - B.'
  openmath: (forall (a b c h) (<-> (perpendicular_lines a h b c) (= (- (^ (dist_of a b) 2) (^ (dist_of a c) 2)) (- (^ (dist_of h b) 2) (^ (dist_of h c) 2)))))
  hard_negative:
    statement: $A-H$と$C-B$の内積が$0$であることと、$AB^2+AC^2=HB^2+HC^2$は同値である。
    reason: 和では成り立たない。$H$が$BC$の中点で$AH\perp BC$、$A\neq H$なら、三平方の定理より左辺は右辺より$2AH^2$だけ大きい。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C H : P), inner ℝ (A -ᵥ H) (C -ᵥ B) = 0 ↔ dist A B ^ 2 - dist A C ^ 2 = dist H B ^ 2 - dist H C ^ 2
  proof: |
    by
      intro V P _ _ _ _ A B C H
      have e1 : A -ᵥ B = (A -ᵥ H) - (B -ᵥ H) := (vsub_sub_vsub_cancel_right A B H).symm
      have e2 : A -ᵥ C = (A -ᵥ H) - (C -ᵥ H) := (vsub_sub_vsub_cancel_right A C H).symm
      have e3 : C -ᵥ B = (C -ᵥ H) - (B -ᵥ H) := (vsub_sub_vsub_cancel_right C B H).symm
      rw [dist_eq_norm_vsub V A B, dist_eq_norm_vsub V A C, dist_comm H B, dist_eq_norm_vsub V B H, dist_comm H C,
        dist_eq_norm_vsub V C H, e1, e2, e3, norm_sub_sq_real, norm_sub_sq_real, inner_sub_right]
      constructor <;> intro hh <;> linarith
- id: isosceles_right_triangle_ratio
  kind: textbook
  level: middle
  topic: 三角形・特別な直角三角形
  statement: $A\neq B$、$\angle BAC=\pi/2$、$AB=AC$ならば（直角二等辺三角形）、$BC=\sqrt2\,AB$であり、$\angle ABC=\angle ACB=\pi/4$である。
  statement_en: If A ≠ B, ∠BAC = π/2 and AB = AC, then BC = √2·AB and ∠ABC = ∠ACB = π/4.
  assumptions:
  - $A\neq B$
  - $\angle BAC=\pi/2$
  - $AB=AC$
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $BC=\sqrt2\,AB$かつ$\angle ABC=\angle ACB=\pi/4$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の点とし、$A\neq B$、$\angle BAC=\pi/2$、$AB=AC$とする。
    三平方の定理より$BC^2=AB^2+AC^2=2AB^2$であり、長さは$0$以上なので$BC=\sqrt2\,AB$である。$AB=AC$より底角は等しく、$\angle ABC=\angle ACB$である。$A\neq B$なので内角の和が使え、$2\angle ABC+\pi/2=\pi$である。よって$\angle ABC=\angle ACB=\pi/4$である。
  strategy: The Pythagorean theorem gives the side ratio; equal base angles and the angle sum give π/4.
  sketch:
  - 'apply_theorem: The Pythagorean theorem gives BC² = 2AB².'
  - 'derive: Nonnegativity gives BC = √2·AB.'
  - 'apply_theorem: AB = AC gives equal base angles.'
  - 'conclude: The angle sum gives π/4.'
  openmath: (forall (a b c) (-> (and (!= a b) (= (euclid_angle b a c) (/ pi 2)) (= (dist_of a b) (dist_of a c))) (and (= (dist_of b c) (* (root 2 2) (dist_of a b))) (= (euclid_angle a b c) (/ pi 4)) (= (euclid_angle a c b) (/ pi 4)))))
  hard_negative:
    statement: $AB=AC$だけで$BC=\sqrt2\,AB$である。
    reason: 頂角が直角とは限らない。正三角形では$BC=AB$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), A ≠ B → EuclideanGeometry.angle B A C = Real.pi / 2 → dist A B = dist A C → dist B C = Real.sqrt 2 * dist A B ∧ EuclideanGeometry.angle A B C = Real.pi / 4 ∧ EuclideanGeometry.angle A C B = Real.pi / 4
  proof: |
    by
      intro V P _ _ _ _ A B C hAB h hiso
      have e := (EuclideanGeometry.dist_sq_eq_dist_sq_add_dist_sq_iff_angle_eq_pi_div_two B A C).mpr h
      rw [dist_comm B A, dist_comm C A, ← hiso] at e
      have hb := EuclideanGeometry.angle_eq_angle_of_dist_eq hiso
      have hs := EuclideanGeometry.angle_add_angle_add_angle_eq_pi C hAB.symm
      rw [EuclideanGeometry.angle_comm B C A, ← hb, EuclideanGeometry.angle_comm C A B, h] at hs
      refine ⟨?_, ?_, ?_⟩
      · refine (mul_self_inj dist_nonneg (by positivity)).mp ?_
        have h2 : Real.sqrt 2 * Real.sqrt 2 = 2 := Real.mul_self_sqrt (by norm_num)
        rw [e]
        linear_combination (-(dist A B * dist A B)) * h2
      · linarith
      · linarith
- id: right_triangle_thirty_sixty_ratio
  kind: textbook
  level: middle
  topic: 三角形・特別な直角三角形
  statement: 直角三角形$ABC$（$A,B,C$は同一直線上になく$\angle BCA=\pi/2$）で$\angle CAB=\pi/6$ならば、$AB=2BC$かつ$AC=\sqrt3\,BC$である。
  statement_en: If A, B, C are not collinear, ∠BCA = π/2 and ∠CAB = π/6, then AB = 2·BC and AC = √3·BC.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $\angle BCA=\pi/2$
  - $\angle CAB=\pi/6$
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $AB=2BC$かつ$AC=\sqrt3\,BC$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の、同一直線上にない点とし、$\angle BCA=\pi/2$、$\angle CAB=\pi/6$とする。$A,B,C$は$C$を直角とする直角三角形をなす。
    正弦と余弦の定義より$BC=AB\sin\frac{\pi}{6}=\frac12AB$、$AC=AB\cos\frac{\pi}{6}=\frac{\sqrt3}{2}AB$である。第1式から$AB=2BC$であり、第2式に代入すると$AC=\sqrt3\,BC$である。
  strategy: Use sine and cosine of π/6 in the right triangle.
  sketch:
  - 'apply_theorem: In the right triangle BC = AB·sin(π/6) and AC = AB·cos(π/6).'
  - 'derive: Substitute sin(π/6) = 1/2 and cos(π/6) = √3/2.'
  - 'conclude: Eliminate AB from the second equation.'
  openmath: (forall (a b c) (-> (and (not (collinear_points a b c)) (= (euclid_angle b c a) (/ pi 2)) (= (euclid_angle c a b) (/ pi 6))) (and (= (dist_of a b) (* 2 (dist_of b c))) (= (dist_of a c) (* (root 3 2) (dist_of b c))))))
  hard_negative:
    statement: $\angle BCA=\pi/2$、$\angle CAB=\pi/6$ならば$AB=2AC$である。
    reason: $\pi/6$の対辺は$BC$であり、$AC$ではない。実際は$AB=\frac{2}{\sqrt3}AC$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), ¬Collinear ℝ ({A, B, C} : Set P) → EuclideanGeometry.angle B C A = Real.pi / 2 → EuclideanGeometry.angle C A B = Real.pi / 6 → dist A B = 2 * dist B C ∧ dist A C = Real.sqrt 3 * dist B C
  proof: |
    by
      intro V P _ _ _ _ A B C _ h ha
      have s := EuclideanGeometry.sin_angle_mul_dist_of_angle_eq_pi_div_two (p₁ := B) (p₂ := C) (p₃ := A) h
      have c := EuclideanGeometry.cos_angle_mul_dist_of_angle_eq_pi_div_two (p₁ := B) (p₂ := C) (p₃ := A) h
      rw [ha, Real.sin_pi_div_six, dist_comm B A] at s
      rw [ha, Real.cos_pi_div_six, dist_comm B A] at c
      constructor
      · linarith
      · rw [← c, ← s]; ring
- id: right_triangle_hypotenuse_twice_leg_angles
  kind: gap
  level: middle
  topic: 三角形・特別な直角三角形
  statement: $B\neq C$、$\angle BCA=\pi/2$、$AB=2BC$ならば、$\angle CAB=\pi/6$かつ$\angle ABC=\pi/3$である。斜辺が1辺の2倍である直角三角形についての主張である。
  statement_en: If B ≠ C, ∠BCA = π/2 and AB = 2·BC, then ∠CAB = π/6 and ∠ABC = π/3.
  assumptions:
  - $B\neq C$
  - $\angle BCA=\pi/2$
  - $AB=2BC$
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $\angle CAB=\pi/6$かつ$\angle ABC=\pi/3$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の点とし、$B\neq C$、$\angle BCA=\pi/2$、$AB=2BC$とする。$BC>0$である。$A=C$なら$AB=BC$となり$AB=2BC$に反するので$A\neq C$である。$A=B$なら$AB=0$となり同じく反するので$A\neq B$である。
    直角三角形なので$BC=AB\sin\angle CAB$であり、$AB=2BC$より$\sin\angle CAB=\frac12$である。$\angle C$が直角なので$\angle CAB$は$0$以上$\pi/2$未満である。この範囲で正弦は単射で$\sin\frac{\pi}{6}=\frac12$なので、$\angle CAB=\pi/6$である。内角の和より$\angle ABC=\pi-\pi/2-\pi/6=\pi/3$である。
  strategy: The sine of the angle at A equals 1/2, and it is an acute angle.
  sketch:
  - 'setup: The length equation excludes A = C and A = B.'
  - 'derive: In the right triangle sin∠CAB = BC/AB = 1/2.'
  - 'derive: ∠CAB lies in [0, π/2), so injectivity of sine gives π/6.'
  - 'conclude: The angle sum gives ∠ABC = π/3.'
  openmath: (forall (a b c) (-> (and (!= b c) (= (euclid_angle b c a) (/ pi 2)) (= (dist_of a b) (* 2 (dist_of b c)))) (and (= (euclid_angle c a b) (/ pi 6)) (= (euclid_angle a b c) (/ pi 3)))))
  hard_negative:
    statement: 直角の仮定を外しても、$AB=2BC$ならば$\angle CAB=\pi/6$である。
    reason: $\angle CAB$は定まらない。$B=(0,0)$、$C=(1,0)$、$A=(2,0)$では$AB=2BC$であるが、$\angle CAB=0$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), B ≠ C → EuclideanGeometry.angle B C A = Real.pi / 2 → dist A B = 2 * dist B C → EuclideanGeometry.angle C A B = Real.pi / 6 ∧ EuclideanGeometry.angle A B C = Real.pi / 3
  proof: |
    by
      intro V P _ _ _ _ A B C hBC h hd
      have hpos : 0 < dist B C := dist_pos.mpr hBC
      have hAC : A ≠ C := by
        rintro rfl
        rw [dist_comm] at hd
        linarith
      have hAB : A ≠ B := by
        rintro rfl
        rw [dist_self] at hd
        linarith
      have s := EuclideanGeometry.sin_angle_mul_dist_of_angle_eq_pi_div_two (p₁ := B) (p₂ := C) (p₃ := A) h
      rw [dist_comm B A, hd] at s
      have hs : Real.sin (EuclideanGeometry.angle C A B) = Real.sin (Real.pi / 6) := by
        rw [Real.sin_pi_div_six]
        apply mul_right_cancel₀ hpos.ne'
        linarith
      have lt := EuclideanGeometry.angle_lt_pi_div_two_of_angle_eq_pi_div_two (p₁ := B) (p₂ := C) (p₃ := A) h hAC
      have nn := EuclideanGeometry.angle_nonneg C A B
      have hA : EuclideanGeometry.angle C A B = Real.pi / 6 :=
        Real.injOn_sin ⟨by linarith [Real.pi_pos], lt.le⟩ ⟨by linarith [Real.pi_pos], by linarith [Real.pi_pos]⟩ hs
      have sum := EuclideanGeometry.angle_add_angle_add_angle_eq_pi C hAB.symm
      exact ⟨hA, by linarith⟩
- id: right_angle_iff_median_half_hypotenuse
  kind: gap
  level: high
  topic: 三角形・中線と直角
  statement: 点$A,B,C$と線分$BC$の中点$M$について、$\angle BAC=\pi/2$（内積$\langle B-A,C-A\rangle$が$0$であること）と$AM=BC/2$は同値である。
  statement_en: For points A, B, C with M the midpoint of BC, ∠BAC = π/2, meaning ⟨B-A,C-A⟩ = 0, if and only if AM = BC/2.
  assumptions:
  - $M$は$B$と$C$の中点
  - $\angle BAC=\pi/2$は$\langle B-A,C-A\rangle=0$を意味する
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $\angle BAC=\pi/2$と$AM=BC/2$は同値である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の点とし、$M$を$B$と$C$の中点とする。$\angle BAC=\pi/2$は$\langle B-A,C-A\rangle=0$を意味し、$B-C=(B-A)-(C-A)$の展開により$BC^2=AB^2+AC^2$と同値である。
    中線定理より$AB^2+AC^2=2AM^2+\frac12BC^2$である。したがって$BC^2=AB^2+AC^2$は$\frac12BC^2=2AM^2$、すなわち$AM^2=(BC/2)^2$と同値である。長さは$0$以上なので、これは$AM=BC/2$と同値である。
  strategy: Combine the Pythagorean criterion with the median theorem.
  sketch:
  - 'apply_theorem: ∠BAC = π/2 is equivalent to BC² = AB² + AC².'
  - 'apply_theorem: The median theorem gives AB² + AC² = 2AM² + BC²/2.'
  - 'derive: The criterion becomes AM² = (BC/2)².'
  - 'conclude: Nonnegativity gives AM = BC/2.'
