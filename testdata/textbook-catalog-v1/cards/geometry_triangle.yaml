- id: triangle_congruent_sss
  kind: textbook
  level: middle
  topic: 三角形・合同条件
  statement: 3点$A,B,C$と3点$A',B',C'$について、$AB=A'B'$、$BC=B'C'$、$CA=C'A'$ならば、この頂点の対応で2つの図形は合同である。ここで合同とは、対応する2頂点間の距離がすべて等しいことをいう。3点が同一直線上にあってもよい。
  statement_en: For points A, B, C and A', B', C' with AB = A'B', BC = B'C' and CA = C'A', the triples are congruent in this vertex order, congruence meaning that all corresponding pairwise distances agree. Collinear triples are allowed.
  assumptions:
  - $A,B,C,A',B',C'$は実内積空間上のアフィン空間の点
  - $AB=A'B'$
  - $BC=B'C'$
  - $CA=C'A'$
  quantifiers:
  - 任意の6点$A,B,C,A',B',C'$
  conclusion: $A,B,C$と$A',B',C'$はこの対応で合同である。
  answer: |
    $A,B,C,A',B',C'$を実内積空間上のアフィン空間の点とし、$AB=A'B'$、$BC=B'C'$、$CA=C'A'$とする。合同とは、対応する2頂点間の距離がすべて等しいことである。
    確かめる組は、同じ頂点どうしの組と、異なる頂点の組である。同じ頂点どうしの距離はどちらも$0$である。異なる頂点の組は仮定の3つの等式で与えられ、$BA=AB$のように順序を入れ替えても距離は変わらない。したがって対応する距離はすべて等しく、2つの図形は合同である。
  strategy: Congruence is defined by pairwise distances, so check every index pair using symmetry of distance.
  sketch:
  - 'setup: Unfold congruence as equality of all corresponding pairwise distances.'
  - 'derive: Pairs of equal indices give distance 0 on both sides.'
  - 'conclude: The remaining pairs are the hypotheses up to symmetry of distance.'
  openmath: (forall (a b c a1 b1 c1) (-> (and (= (dist_of a b) (dist_of a1 b1)) (= (dist_of b c) (dist_of b1 c1)) (= (dist_of c a) (dist_of c1 a1))) (congruent_triangles a b c a1 b1 c1)))
  hard_negative:
    statement: $AB=A'B'$と$BC=B'C'$だけで、$A,B,C$と$A',B',C'$は合同である。
    reason: 2辺だけでは第3辺が決まらない。直角をはさむ長さ$1,1$の直角三角形と、頂角が$\pi/3$で等辺が$1$の正三角形は反例である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C A' B' C' : P), dist A B = dist A' B' → dist B C = dist B' C' → dist C A = dist C' A' → Congruent ![A, B, C] ![A', B', C']
  proof: |
    by
      intro V P _ _ _ _ A B C A' B' C' h1 h2 h3
      exact EuclideanGeometry.side_side_side h1 h2 h3
- id: triangle_congruent_sas
  kind: textbook
  level: middle
  topic: 三角形・合同条件
  statement: 三角形$ABC$と三角形$A'B'C'$（それぞれ3点は同一直線上にない）について、2辺とその間の角が等しければ、すなわち$\angle ABC=\angle A'B'C'$、$AB=A'B'$、$BC=B'C'$ならば、この頂点の対応で合同である。
  statement_en: If A, B, C are not collinear, A', B', C' are not collinear, ∠ABC = ∠A'B'C', AB = A'B' and BC = B'C', then A, B, C and A', B', C' are congruent in this order.
  assumptions:
  - $A,B,C,A',B',C'$は実内積空間上のアフィン空間の点
  - $A,B,C$は同一直線上にない
  - $A',B',C'$は同一直線上にない
  - $\angle ABC=\angle A'B'C'$
  - $AB=A'B'$
  - $BC=B'C'$
  quantifiers:
  - 任意の6点$A,B,C,A',B',C'$
  conclusion: $A,B,C$と$A',B',C'$はこの対応で合同である。
  answer: |
    $A,B,C,A',B',C'$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$A',B',C'$も同一直線上になく、$\angle ABC=\angle A'B'C'$、$AB=A'B'$、$BC=B'C'$とする。合同とは対応する2頂点間の距離がすべて等しいことなので、$CA=C'A'$を示せば十分である。
    余弦定理より$AC^2=AB^2+BC^2-2\,AB\cdot BC\cos\angle ABC$である。$A',B',C'$についても同じ等式が成り立ち、右辺に現れる量は仮定によりすべて等しい。よって$AC^2=A'C'^2$であり、長さは$0$以上なので$AC=A'C'$である。
  strategy: Reduce to the third side, which the law of cosines determines from the two sides and the included angle.
  sketch:
  - 'setup: Only CA = C''A'' remains, since congruence means equal pairwise distances.'
  - 'apply_theorem: Write AC² and A''C''² by the law of cosines at B and B''.'
  - 'derive: The right sides agree by hypothesis, so AC² = A''C''².'
  - 'conclude: Nonnegativity gives AC = A''C'', hence congruence.'
  openmath: (forall (a b c a1 b1 c1) (-> (and (not (collinear_points a b c)) (not (collinear_points a1 b1 c1)) (= (euclid_angle a b c) (euclid_angle a1 b1 c1)) (= (dist_of a b) (dist_of a1 b1)) (= (dist_of b c) (dist_of b1 c1))) (congruent_triangles a b c a1 b1 c1)))
  hard_negative:
    statement: $\angle ACB=\angle A'C'B'$、$AB=A'B'$、$BC=B'C'$ならば、$A,B,C$と$A',B',C'$は合同である。
    reason: 等しい角が2辺の間にない。$\angle C$が鋭角なら、$B$を中心とする半径$AB$の円が半直線$CA$と2点で交わることがあり、第3辺が2通りに定まる。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C A' B' C' : P), ¬Collinear ℝ ({A, B, C} : Set P) → ¬Collinear ℝ ({A', B', C'} : Set P) → EuclideanGeometry.angle A B C = EuclideanGeometry.angle A' B' C' → dist A B = dist A' B' → dist B C = dist B' C' → Congruent ![A, B, C] ![A', B', C']
  proof: |
    by
      intro V P _ _ _ _ A B C A' B' C' _ _ h h1 h2
      exact EuclideanGeometry.side_angle_side h h1 h2
- id: triangle_congruent_asa
  kind: textbook
  level: middle
  topic: 三角形・合同条件
  statement: 三角形$ABC$と三角形$A'B'C'$（それぞれ3点は同一直線上にない）について、1辺とその両端の角が等しければ、すなわち$\angle ABC=\angle A'B'C'$、$BC=B'C'$、$\angle BCA=\angle B'C'A'$ならば、この頂点の対応で合同である。
  statement_en: If A, B, C are not collinear, A', B', C' are not collinear, ∠ABC = ∠A'B'C', BC = B'C', ∠BCA = ∠B'C'A', then A, B, C and A', B', C' are congruent in this order.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $A',B',C'$は同一直線上にない
  - $\angle ABC=\angle A'B'C'$
  - $BC=B'C'$
  - $\angle BCA=\angle B'C'A'$
  quantifiers:
  - 任意の6点$A,B,C,A',B',C'$
  conclusion: $A,B,C$と$A',B',C'$はこの対応で合同である。
  answer: |
    $A,B,C,A',B',C'$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$A',B',C'$も同一直線上になく、$\angle ABC=\angle A'B'C'$、$BC=B'C'$、$\angle BCA=\angle B'C'A'$とする。
    内角の和より$\angle CAB=\pi-\angle ABC-\angle BCA=\angle C'A'B'$である。3点は同一直線上にないので角はすべて$0$より大きく$\pi$より小さく、正弦は正である。正弦定理より$AB=BC\sin\angle BCA/\sin\angle CAB$であり、$A'B'$も同じ式で表されるので、$AB=A'B'$である。したがって2辺$AB,BC$とその間の角が等しいので、余弦定理から$CA=C'A'$となり、対応する距離はすべて等しい。
  strategy: Get the third angle from the angle sum, then a second side by the law of sines, and finish with two sides and the included angle.
  sketch:
  - 'setup: Both triples are non-collinear, so all angles lie in (0,π).'
  - 'derive: The angle sum gives ∠CAB = ∠C''A''B''.'
  - 'apply_theorem: The law of sines gives AB = A''B''.'
  - 'apply_theorem: The law of cosines gives CA = C''A''.'
  - 'conclude: All corresponding distances agree.'
  openmath: (forall (a b c a1 b1 c1) (-> (and (not (collinear_points a b c)) (not (collinear_points a1 b1 c1)) (= (euclid_angle a b c) (euclid_angle a1 b1 c1)) (= (dist_of b c) (dist_of b1 c1)) (= (euclid_angle b c a) (euclid_angle b1 c1 a1))) (congruent_triangles a b c a1 b1 c1)))
  hard_negative:
    statement: $A,B,C$と$A',B',C'$が同一直線上にあっても、$\angle ABC=\angle A'B'C'$、$BC=B'C'$、$\angle BCA=\angle B'C'A'$ならば合同である。
    reason: 数直線上で$B=0$、$C=1$とし、$A=2$と$A'=3$（$B'=B$、$C'=C$）をとると、角はともに$\angle ABC=0$、$\angle BCA=\pi$で$BC$も等しいが、$CA=1$、$C'A'=2$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C A' B' C' : P), ¬Collinear ℝ ({A, B, C} : Set P) → ¬Collinear ℝ ({A', B', C'} : Set P) → EuclideanGeometry.angle A B C = EuclideanGeometry.angle A' B' C' → dist B C = dist B' C' → EuclideanGeometry.angle B C A = EuclideanGeometry.angle B' C' A' → Congruent ![A, B, C] ![A', B', C']
  proof: |
    by
      intro V P _ _ _ _ A B C A' B' C' h _ h1 h2 h3
      exact EuclideanGeometry.angle_side_angle h h1 h2 h3
- id: triangle_congruent_aas
  kind: textbook
  level: middle
  topic: 三角形・合同条件
  statement: 三角形$ABC$と三角形$A'B'C'$（それぞれ3点は同一直線上にない）について、2つの角とその間にない1辺が等しければ、すなわち$\angle ABC=\angle A'B'C'$、$\angle BCA=\angle B'C'A'$、$CA=C'A'$ならば、この頂点の対応で合同である。
  statement_en: If A, B, C are not collinear, A', B', C' are not collinear, ∠ABC = ∠A'B'C', ∠BCA = ∠B'C'A', CA = C'A', then A, B, C and A', B', C' are congruent in this order.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $A',B',C'$は同一直線上にない
  - $\angle ABC=\angle A'B'C'$
  - $\angle BCA=\angle B'C'A'$
  - $CA=C'A'$
  quantifiers:
  - 任意の6点$A,B,C,A',B',C'$
  conclusion: $A,B,C$と$A',B',C'$はこの対応で合同である。
  answer: |
    $A,B,C,A',B',C'$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$A',B',C'$も同一直線上になく、$\angle ABC=\angle A'B'C'$、$\angle BCA=\angle B'C'A'$、$CA=C'A'$とする。
    内角の和より$\angle CAB=\pi-\angle ABC-\angle BCA=\angle C'A'B'$である。3点は同一直線上にないので角はすべて$0$より大きく$\pi$より小さく、正弦は正である。正弦定理より$BC=CA\sin\angle CAB/\sin\angle ABC$であり、$B'C'$も同じ式で表されるので、$BC=B'C'$である。同様に$AB=CA\sin\angle BCA/\sin\angle ABC=A'B'$である。したがって3辺が等しく、対応する距離はすべて等しい。
  strategy: The third angles agree by the angle sum, and the law of sines recovers the other two sides from CA.
  sketch:
  - 'setup: Both triples are non-collinear, so all angles lie in (0,π).'
  - 'derive: The angle sum gives ∠CAB = ∠C''A''B''.'
  - 'apply_theorem: The law of sines expresses BC and AB through CA and the three angles.'
  - 'conclude: All three sides agree, so the triples are congruent.'
  openmath: (forall (a b c a1 b1 c1) (-> (and (not (collinear_points a b c)) (not (collinear_points a1 b1 c1)) (= (euclid_angle a b c) (euclid_angle a1 b1 c1)) (= (euclid_angle b c a) (euclid_angle b1 c1 a1)) (= (dist_of c a) (dist_of c1 a1))) (congruent_triangles a b c a1 b1 c1)))
  hard_negative:
    statement: $\angle ABC=\angle A'B'C'$、$\angle BCA=\angle B'C'A'$、$CA=A'B'$ならば合同である。
    reason: 等しい辺が対応していない。$AB=3$、$BC=4$、$CA=5$の直角三角形を$5/3$倍した$A',B',C'$では、角が等しく$A'B'=5=CA$であるが、合同ではない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C A' B' C' : P), ¬Collinear ℝ ({A, B, C} : Set P) → ¬Collinear ℝ ({A', B', C'} : Set P) → EuclideanGeometry.angle A B C = EuclideanGeometry.angle A' B' C' → EuclideanGeometry.angle B C A = EuclideanGeometry.angle B' C' A' → dist C A = dist C' A' → Congruent ![A, B, C] ![A', B', C']
  proof: |
    by
      intro V P _ _ _ _ A B C A' B' C' h _ h1 h2 h3
      exact EuclideanGeometry.angle_angle_side h h1 h2 h3
- id: congruent_triangles_corresponding_parts
  kind: gap
  level: middle
  topic: 三角形・合同の性質
  statement: 三角形$ABC$と三角形$A'B'C'$（それぞれ3点は同一直線上にない）がこの頂点の対応で合同（対応する2頂点間の距離がすべて等しい）ならば、対応する3辺と3つの角はそれぞれ等しい。
  statement_en: If A, B, C are not collinear, A', B', C' are not collinear, and A, B, C and A', B', C' are congruent in this order, then AB = A'B', BC = B'C', CA = C'A', ∠ABC = ∠A'B'C', ∠BCA = ∠B'C'A' and ∠CAB = ∠C'A'B'.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $A',B',C'$は同一直線上にない
  - $A,B,C$と$A',B',C'$はこの対応で合同
  quantifiers:
  - 任意の6点$A,B,C,A',B',C'$
  conclusion: $AB=A'B'$、$BC=B'C'$、$CA=C'A'$、$\angle ABC=\angle A'B'C'$、$\angle BCA=\angle B'C'A'$、$\angle CAB=\angle C'A'B'$である。
  answer: |
    $A,B,C,A',B',C'$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$A',B',C'$も同一直線上になく、対応する2頂点間の距離がすべて等しいとする。辺の等式は仮定そのものである。
    $\angle ABC=\angle A'B'C'$を示す。3点は同一直線上にないので各三角形の頂点は相異なり、余弦定理より$\cos\angle ABC=(AB^2+BC^2-CA^2)/(2AB\cdot BC)$である。$\cos\angle A'B'C'$も同じ式の値に等しい。角は$0$以上$\pi$以下で、この範囲で余弦は単射なので、2つの角は等しい。残りの2つの角も、頂点を入れ替えた同じ議論で等しい。
  strategy: Sides are the definition; each angle is determined by the three sides through the cosine formula, and cosine is injective on [0, π].
  sketch:
  - 'setup: The side equalities are instances of the definition.'
  - 'derive: Non-collinearity makes the vertices of each triple distinct.'
  - 'apply_theorem: The law of cosines gives the same cosine for corresponding angles.'
  - 'conclude: Injectivity of cosine on [0, π] gives equal angles.'
  openmath: (forall (a b c a1 b1 c1) (-> (and (not (collinear_points a b c)) (not (collinear_points a1 b1 c1)) (congruent_triangles a b c a1 b1 c1)) (and (= (dist_of a b) (dist_of a1 b1)) (= (dist_of b c) (dist_of b1 c1)) (= (dist_of c a) (dist_of c1 a1)) (= (euclid_angle a b c) (euclid_angle a1 b1 c1)) (= (euclid_angle b c a) (euclid_angle b1 c1 a1)) (= (euclid_angle c a b) (euclid_angle c1 a1 b1)))))
  hard_negative:
    statement: 対応する3つの角がすべて等しければ、$A,B,C$と$A',B',C'$は合同である。
    reason: 角だけでは大きさが決まらない。正三角形でも1辺の長さが異なれば合同ではなく、相似にとどまる。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C A' B' C' : P), ¬Collinear ℝ ({A, B, C} : Set P) → ¬Collinear ℝ ({A', B', C'} : Set P) → Congruent ![A, B, C] ![A', B', C'] → dist A B = dist A' B' ∧ dist B C = dist B' C' ∧ dist C A = dist C' A' ∧ EuclideanGeometry.angle A B C = EuclideanGeometry.angle A' B' C' ∧ EuclideanGeometry.angle B C A = EuclideanGeometry.angle B' C' A' ∧ EuclideanGeometry.angle C A B = EuclideanGeometry.angle C' A' B'
  proof: |
    by
      intro V P _ _ _ _ A B C A' B' C' _ _ h
      exact ⟨h.dist_eq 0 1, h.dist_eq 1 2, h.dist_eq 2 0, EuclideanGeometry.angle_eq_of_congruent h 0 1 2,
        EuclideanGeometry.angle_eq_of_congruent h 1 2 0, EuclideanGeometry.angle_eq_of_congruent h 2 0 1⟩
- id: right_triangle_congruent_hypotenuse_leg
  kind: gap
  level: middle
  topic: 三角形・直角三角形の合同
  statement: $\angle ABC=\angle A'B'C'=\pi/2$（内積$\langle A-B,C-B\rangle$と$\langle A'-B',C'-B'\rangle$が$0$であること）のとき、斜辺と他の1辺が等しければ、すなわち$CA=C'A'$、$AB=A'B'$ならば、$A,B,C$と$A',B',C'$はこの対応で合同である。
  statement_en: If the inner products ⟨A-B,C-B⟩ and ⟨A'-B',C'-B'⟩ vanish, that is ∠ABC = ∠A'B'C' = π/2, and CA = C'A', AB = A'B', then A, B, C and A', B', C' are congruent in this order.
  assumptions:
  - $\langle A-B,C-B\rangle=0$
  - $\langle A'-B',C'-B'\rangle=0$
  - $CA=C'A'$
  - $AB=A'B'$
  quantifiers:
  - 任意の6点$A,B,C,A',B',C'$
  conclusion: $A,B,C$と$A',B',C'$はこの対応で合同である。
  answer: |
    $A,B,C,A',B',C'$を実内積空間上のアフィン空間の点とし、$\langle A-B,C-B\rangle=\langle A'-B',C'-B'\rangle=0$、$CA=C'A'$、$AB=A'B'$とする。
    $A-C=(A-B)-(C-B)$で内積が$0$なので、$CA^2=AB^2+BC^2$である。同様に$C'A'^2=A'B'^2+B'C'^2$である。仮定から$BC^2=CA^2-AB^2=C'A'^2-A'B'^2=B'C'^2$であり、長さは$0$以上なので$BC=B'C'$である。3辺が等しいので、対応する2頂点間の距離はすべて等しい。
  strategy: The Pythagorean theorem recovers the third side, then all pairwise distances agree.
  sketch:
  - 'apply_theorem: The vanishing inner products give CA² = AB² + BC² and C''A''² = A''B''² + B''C''².'
  - 'derive: Subtracting with the hypotheses gives BC² = B''C''².'
  - 'derive: Nonnegativity gives BC = B''C''.'
  - 'conclude: Three equal sides give congruence.'
  openmath: (forall (a b c a1 b1 c1) (-> (and (= (euclid_angle a b c) (/ pi 2)) (= (euclid_angle a1 b1 c1) (/ pi 2)) (= (dist_of c a) (dist_of c1 a1)) (= (dist_of a b) (dist_of a1 b1))) (congruent_triangles a b c a1 b1 c1)))
  hard_negative:
    statement: $\angle ABC=\angle A'B'C'$が直角でなく等しい鋭角のときも、$CA=C'A'$、$AB=A'B'$なら合同である。
    reason: 角が2辺の間にない条件になる。鋭角$\angle ABC$のもとで$A$を中心とする半径$CA$の円が半直線$BC$と2点で交わると、第3辺が2通りに定まる。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C A' B' C' : P), EuclideanGeometry.angle A B C = Real.pi / 2 → EuclideanGeometry.angle A' B' C' = Real.pi / 2 → dist C A = dist C' A' → dist A B = dist A' B' → Congruent ![A, B, C] ![A', B', C']
  proof: |
    by
      intro V P _ _ _ _ A B C A' B' C' h1 h2 hyp leg
      have e1 := (EuclideanGeometry.dist_sq_eq_dist_sq_add_dist_sq_iff_angle_eq_pi_div_two A B C).mpr h1
      have e2 := (EuclideanGeometry.dist_sq_eq_dist_sq_add_dist_sq_iff_angle_eq_pi_div_two A' B' C').mpr h2
      rw [dist_comm A C, hyp, leg] at e1
      rw [dist_comm A' C'] at e2
      have hBC : dist B C = dist B' C' := by
        rw [dist_comm B C, dist_comm B' C']
        exact (mul_self_inj dist_nonneg dist_nonneg).mp (by linarith)
      exact EuclideanGeometry.side_side_side leg hBC hyp
- id: right_triangle_congruent_hypotenuse_acute
  kind: gap
  level: middle
  topic: 三角形・直角三角形の合同
  statement: 直角三角形$ABC$と直角三角形$A'B'C'$（それぞれ3点は同一直線上にない）で$\angle ABC=\angle A'B'C'=\pi/2$のとき、斜辺と1つの鋭角が等しければ、すなわち$\angle BCA=\angle B'C'A'$、$CA=C'A'$ならば、この頂点の対応で合同である。
  statement_en: If A, B, C are not collinear, A', B', C' are not collinear, ∠ABC = ∠A'B'C' = π/2, ∠BCA = ∠B'C'A' and CA = C'A', then A, B, C and A', B', C' are congruent in this order.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $A',B',C'$は同一直線上にない
  - $\angle ABC=\angle A'B'C'=\pi/2$
  - $\angle BCA=\angle B'C'A'$
  - $CA=C'A'$
  quantifiers:
  - 任意の6点$A,B,C,A',B',C'$
  conclusion: $A,B,C$と$A',B',C'$はこの対応で合同である。
  answer: |
    $A,B,C,A',B',C'$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$A',B',C'$も同一直線上になく、$\angle ABC=\angle A'B'C'=\pi/2$、$\angle BCA=\angle B'C'A'$、$CA=C'A'$とする。
    このとき$\angle ABC=\angle A'B'C'$、$\angle BCA=\angle B'C'A'$、$CA=C'A'$なので、2つの角とその間にない1辺が等しい。合同条件（2角とその間にない1辺）より、$A,B,C$と$A',B',C'$はこの対応で合同である。
  strategy: This is the two-angles-and-a-non-included-side condition with one angle equal to π/2.
  sketch:
  - 'setup: Both right angles give ∠ABC = ∠A''B''C''.'
  - 'apply_theorem: Apply the congruence condition for two angles and a non-included side.'
  openmath: (forall (a b c a1 b1 c1) (-> (and (not (collinear_points a b c)) (not (collinear_points a1 b1 c1)) (= (euclid_angle a b c) (/ pi 2)) (= (euclid_angle a1 b1 c1) (/ pi 2)) (= (euclid_angle b c a) (euclid_angle b1 c1 a1)) (= (dist_of c a) (dist_of c1 a1))) (congruent_triangles a b c a1 b1 c1)))
  hard_negative:
    statement: $\angle ABC=\angle A'B'C'=\pi/2$、$\angle BCA=\angle B'C'A'$だけで合同である。
    reason: 斜辺の条件がないと相似までしか言えない。辺の長さが$3,4,5$の直角三角形と$6,8,10$の直角三角形が反例である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C A' B' C' : P), ¬Collinear ℝ ({A, B, C} : Set P) → ¬Collinear ℝ ({A', B', C'} : Set P) → EuclideanGeometry.angle A B C = Real.pi / 2 → EuclideanGeometry.angle A' B' C' = Real.pi / 2 → EuclideanGeometry.angle B C A = EuclideanGeometry.angle B' C' A' → dist C A = dist C' A' → Congruent ![A, B, C] ![A', B', C']
  proof: |
    by
      intro V P _ _ _ _ A B C A' B' C' h _ h1 h2 h3 h4
      exact EuclideanGeometry.angle_angle_side h (h1.trans h2.symm) h3 h4
- id: triangle_similar_aa_ratio
  kind: textbook
  level: middle
  topic: 三角形・相似条件
  statement: 三角形$abc$と三角形$a'b'c'$（それぞれ3点は同一直線上にない）について、2つの角が等しければ、すなわち$\angle abc=\angle a'b'c'$、$\angle bca=\angle b'c'a'$ならば、正の数$r$があって$ab=r\,a'b'$、$bc=r\,b'c'$、$ca=r\,c'a'$となる。
  statement_en: If a, b, c are not collinear, a', b', c' are not collinear, ∠abc = ∠a'b'c' and ∠bca = ∠b'c'a', then there is r > 0 with ab = r·a'b', bc = r·b'c' and ca = r·c'a'.
  assumptions:
  - $a,b,c$は同一直線上にない
  - $a',b',c'$は同一直線上にない
  - $\angle abc=\angle a'b'c'$
  - $\angle bca=\angle b'c'a'$
  quantifiers:
  - 任意の6点$a,b,c,a',b',c'$
  conclusion: ある$r>0$について$ab=r\,a'b'$、$bc=r\,b'c'$、$ca=r\,c'a'$である。
  answer: |
    $a,b,c,a',b',c'$を実内積空間上のアフィン空間の点とする。$a,b,c$は同一直線上になく、$a',b',c'$も同一直線上になく、$\angle abc=\angle a'b'c'$、$\angle bca=\angle b'c'a'$とする。
    $\beta=\angle abc$、$\gamma=\angle bca$とおく。内角の和より$\alpha=\angle cab=\pi-\beta-\gamma=\angle c'a'b'$である。3点は同一直線上にないので角はすべて$0$より大きく$\pi$より小さく、正弦は正である。正弦定理より$ab:bc:ca=\sin\gamma:\sin\alpha:\sin\beta$であり、$a'b':b'c':c'a'$も同じ比である。$r=ab/a'b'>0$とおくと、$ab=r\,a'b'$、$bc=r\,b'c'$、$ca=r\,c'a'$が成り立つ。
  strategy: The angle sum and the law of sines give the same side ratios in both triangles.
  sketch:
  - 'setup: Both triples are non-collinear, so all angles lie in (0,π).'
  - 'derive: The angle sum gives equal third angles.'
  - 'apply_theorem: The law of sines gives ab:bc:ca = sin γ : sin α : sin β in both triangles.'
  - 'construct: Put r = ab/a''b'' > 0.'
  - 'conclude: The proportional sides give the three equalities.'
  openmath: (forall (a b c a1 b1 c1) (-> (and (not (collinear_points a b c)) (not (collinear_points a1 b1 c1)) (= (euclid_angle a b c) (euclid_angle a1 b1 c1)) (= (euclid_angle b c a) (euclid_angle b1 c1 a1))) (exists (r) (and (> r 0) (= (dist_of a b) (* r (dist_of a1 b1))) (= (dist_of b c) (* r (dist_of b1 c1))) (= (dist_of c a) (* r (dist_of c1 a1)))))))
  hard_negative:
    statement: 1つの角$\angle abc=\angle a'b'c'$が等しいだけで、辺の比は等しい。
    reason: $\angle b$を共有していても他の2辺の長さは自由に選べる。頂角が等しい二等辺三角形と不等辺三角形は相似にならない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (a b c a' b' c' : P), ¬Collinear ℝ ({a, b, c} : Set P) → ¬Collinear ℝ ({a', b', c'} : Set P) → EuclideanGeometry.angle a b c = EuclideanGeometry.angle a' b' c' → EuclideanGeometry.angle b c a = EuclideanGeometry.angle b' c' a' → ∃ r : ℝ, 0 < r ∧ dist a b = r * dist a' b' ∧ dist b c = r * dist b' c' ∧ dist c a = r * dist c' a'
  proof: |
    by
      intro V P _ _ _ _ a b c a' b' c' hc _ h1 h2
      have hs := EuclideanGeometry.similar_of_angle_angle hc h1 h2
      obtain ⟨r, hr, h⟩ := similar_iff_exists_pos_dist_eq.mp hs
      exact ⟨r, hr, h 0 1, h 1 2, h 2 0⟩
- id: triangle_similar_sss_ratio
  kind: textbook
  level: middle
  topic: 三角形・相似条件
  statement: 三角形$abc$と三角形$a'b'c'$（それぞれ3点は同一直線上にない）と正の数$r$について、$ab=r\,a'b'$、$bc=r\,b'c'$、$ca=r\,c'a'$ならば、この頂点の対応で相似であり（相似とは、対応する2頂点間の距離の比がすべて同じ正の数であること）、対応する3つの角はそれぞれ等しい。
  statement_en: If a, b, c are not collinear, a', b', c' are not collinear, r > 0 and ab = r·a'b', bc = r·b'c', ca = r·c'a', then a, b, c and a', b', c' are similar in this order, and ∠abc = ∠a'b'c', ∠bca = ∠b'c'a', ∠cab = ∠c'a'b'.
  assumptions:
  - $a,b,c$は同一直線上にない
  - $a',b',c'$は同一直線上にない
  - $r>0$
  - $ab=r\,a'b'$
  - $bc=r\,b'c'$
  - $ca=r\,c'a'$
  quantifiers:
  - 任意の6点$a,b,c,a',b',c'$と任意の実数$r$
  conclusion: $a,b,c$と$a',b',c'$は相似で、$\angle abc=\angle a'b'c'$、$\angle bca=\angle b'c'a'$、$\angle cab=\angle c'a'b'$である。
  answer: |
    $a,b,c,a',b',c'$を実内積空間上のアフィン空間の点とする。$a,b,c$は同一直線上になく、$a',b',c'$も同一直線上になく、$r>0$で、$ab=r\,a'b'$、$bc=r\,b'c'$、$ca=r\,c'a'$とする。
    対応する2頂点間の距離の比はすべて$r$なので（同じ頂点どうしの距離はともに$0$）、相似である。
    $\angle abc=\angle a'b'c'$を示す。3点は同一直線上にないので各三角形の頂点は相異なり、余弦定理より$\cos\angle abc=(ab^2+bc^2-ca^2)/(2ab\cdot bc)$である。$r$を代入して約分すると$\cos\angle a'b'c'$に等しい。角は$0$以上$\pi$以下で余弦はこの範囲で単射なので、2つの角は等しい。残りの2つの角も頂点を入れ替えて同様である。
  strategy: The side ratio gives similarity directly, and the cosine formula is invariant under scaling all sides by r.
  sketch:
  - 'setup: The hypotheses are exactly a common ratio for all pairwise distances.'
  - 'derive: Non-collinearity makes the vertices of each triple distinct.'
  - 'apply_theorem: The law of cosines writes each cosine through the sides.'
  - 'derive: The factor r² cancels, so cosines agree.'
  - 'conclude: Injectivity of cosine on [0, π] gives equal angles.'
  openmath: (forall (a b c a1 b1 c1 r) (-> (and (not (collinear_points a b c)) (not (collinear_points a1 b1 c1)) (> r 0) (= (dist_of a b) (* r (dist_of a1 b1))) (= (dist_of b c) (* r (dist_of b1 c1))) (= (dist_of c a) (* r (dist_of c1 a1)))) (and (similar_triangles a b c a1 b1 c1) (= (euclid_angle a b c) (euclid_angle a1 b1 c1)) (= (euclid_angle b c a) (euclid_angle b1 c1 a1)) (= (euclid_angle c a b) (euclid_angle c1 a1 b1)))))
  hard_negative:
    statement: 各辺の比が等しくなくても、$ab>a'b'$、$bc>b'c'$、$ca>c'a'$ならば対応する角は等しい。
    reason: 辺の大小だけでは形が決まらない。辺$3,4,5$と辺$1,1,1$で3つの不等式は成り立つが、角は異なる。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (a b c a' b' c' : P) (r : ℝ), ¬Collinear ℝ ({a, b, c} : Set P) → ¬Collinear ℝ ({a', b', c'} : Set P) → 0 < r → dist a b = r * dist a' b' → dist b c = r * dist b' c' → dist c a = r * dist c' a' → Similar ![a, b, c] ![a', b', c'] ∧ EuclideanGeometry.angle a b c = EuclideanGeometry.angle a' b' c' ∧ EuclideanGeometry.angle b c a = EuclideanGeometry.angle b' c' a' ∧ EuclideanGeometry.angle c a b = EuclideanGeometry.angle c' a' b'
  proof: |
    by
      intro V P _ _ _ _ a b c a' b' c' r _ _ hr h1 h2 h3
      have hs : Similar ![a, b, c] ![a', b', c'] := by
        refine similar_iff_exists_pos_dist_eq.mpr ⟨r, hr, fun i j => ?_⟩
        fin_cases i <;> fin_cases j <;> simp <;> grind [dist_comm]
      exact ⟨hs, hs.angle_eq_all⟩
- id: triangle_similar_sas_ratio
  kind: textbook
  level: middle
  topic: 三角形・相似条件
  statement: 三角形$ABC$と三角形$A'B'C'$（それぞれ3点は同一直線上にない）と正の数$r$について、2組の辺の比とその間の角が等しければ、すなわち$AB=r\,A'B'$、$CB=r\,C'B'$、$\angle ABC=\angle A'B'C'$ならば、この頂点の対応で相似である。
  statement_en: If A, B, C are not collinear, A', B', C' are not collinear, r > 0, AB = r·A'B', CB = r·C'B' and ∠ABC = ∠A'B'C', then A, B, C and A', B', C' are similar in this order.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $A',B',C'$は同一直線上にない
  - $r>0$
  - $AB=r\,A'B'$
  - $CB=r\,C'B'$
  - $\angle ABC=\angle A'B'C'$
  quantifiers:
  - 任意の6点$A,B,C,A',B',C'$と任意の実数$r$
  conclusion: $A,B,C$と$A',B',C'$はこの対応で相似である。
  answer: |
    $A,B,C,A',B',C'$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$A',B',C'$も同一直線上になく、$r>0$で、$AB=r\,A'B'$、$CB=r\,C'B'$、$\angle ABC=\angle A'B'C'$とする。
    余弦定理より$AC^2=AB^2+CB^2-2\,AB\cdot CB\cos\angle ABC$である。同じ等式が$A',B',C'$でも成り立つ。仮定を代入すると
    $AC^2=r^2(A'B'^2+C'B'^2-2\,A'B'\cdot C'B'\cos\angle A'B'C')=r^2A'C'^2$である。長さと$r$は$0$以上なので$AC=r\,A'C'$である。対応する2頂点間の距離の比がすべて$r$なので、相似である。
  strategy: The law of cosines scales by r², so the third side also has ratio r.
  sketch:
  - 'apply_theorem: Write AC² and A''C''² by the law of cosines at B and B''.'
  - 'derive: Substituting the hypotheses gives AC² = r²A''C''².'
  - 'derive: Nonnegativity gives AC = r·A''C''.'
  - 'conclude: All pairwise distances have ratio r.'
  openmath: (forall (a b c a1 b1 c1 r) (-> (and (not (collinear_points a b c)) (not (collinear_points a1 b1 c1)) (> r 0) (= (dist_of a b) (* r (dist_of a1 b1))) (= (dist_of c b) (* r (dist_of c1 b1))) (= (euclid_angle a b c) (euclid_angle a1 b1 c1))) (similar_triangles a b c a1 b1 c1)))
  hard_negative:
    statement: $AB=r\,A'B'$、$CB=r\,C'B'$、$\angle BCA=\angle B'C'A'$ならば相似である。
    reason: 等しい角が比をとる2辺の間にない。$C$での角が鋭角のとき、$B$を中心とする円が半直線$CA$と2点で交わる配置があり、第3辺の比が定まらない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C A' B' C' : P) (r : ℝ), ¬Collinear ℝ ({A, B, C} : Set P) → ¬Collinear ℝ ({A', B', C'} : Set P) → 0 < r → dist A B = r * dist A' B' → dist C B = r * dist C' B' → EuclideanGeometry.angle A B C = EuclideanGeometry.angle A' B' C' → Similar ![A, B, C] ![A', B', C']
  proof: |
    by
      intro V P _ _ _ _ A B C A' B' C' r _ _ hr h1 h2 h
      have e := EuclideanGeometry.law_cos A B C
      have e' := EuclideanGeometry.law_cos A' B' C'
      have hAC : dist A C = r * dist A' C' := by
        refine (mul_self_inj dist_nonneg (by positivity)).mp ?_
        rw [e, h1, h2, h]
        linear_combination -(r * r) * e'
      refine similar_iff_exists_pos_dist_eq.mpr ⟨r, hr, fun i j => ?_⟩
      fin_cases i <;> fin_cases j <;> simp <;> grind [dist_comm]
- id: similar_triangles_side_ratio_cross
  kind: gap
  level: middle
  topic: 三角形・相似の性質
  statement: $A,B,C$と$A',B',C'$がこの対応で相似ならば、対応する辺の比を積の形で書いた等式$AB\cdot B'C'=A'B'\cdot BC$、$BC\cdot C'A'=B'C'\cdot CA$、$CA\cdot A'B'=C'A'\cdot AB$が成り立つ。
  statement_en: If A, B, C and A', B', C' are similar in this order, then AB·B'C' = A'B'·BC, BC·C'A' = B'C'·CA and CA·A'B' = C'A'·AB.
  assumptions:
  - $A,B,C$と$A',B',C'$はこの対応で相似
  quantifiers:
  - 任意の6点$A,B,C,A',B',C'$
  conclusion: $AB\cdot B'C'=A'B'\cdot BC$、$BC\cdot C'A'=B'C'\cdot CA$、$CA\cdot A'B'=C'A'\cdot AB$である。
  answer: |
    $A,B,C,A',B',C'$を実内積空間上のアフィン空間の点とし、この対応で相似とする。相似の定義より、正の数$r$があって$AB=r\,A'B'$、$BC=r\,B'C'$、$CA=r\,C'A'$である。
    代入すると$AB\cdot B'C'=r\,A'B'\cdot B'C'=A'B'\cdot BC$である。残りの2つの等式も同じ計算で得られる。
  strategy: Substitute the common ratio into each product.
  sketch:
  - 'setup: Similarity gives r > 0 with the three side equalities.'
  - 'conclude: Substituting makes both sides of each equation identical.'
  openmath: (forall (a b c a1 b1 c1) (-> (similar_triangles a b c a1 b1 c1) (and (= (* (dist_of a b) (dist_of b1 c1)) (* (dist_of a1 b1) (dist_of b c))) (= (* (dist_of b c) (dist_of c1 a1)) (* (dist_of b1 c1) (dist_of c a))) (= (* (dist_of c a) (dist_of a1 b1)) (* (dist_of c1 a1) (dist_of a b))))))
  hard_negative:
    statement: 相似ならば$AB\cdot A'B'=BC\cdot B'C'$である。
    reason: 対応する辺どうしを掛けても等しくならない。$A,B,C$と$A',B',C'$を同じ辺$3,4,5$の三角形にすると、左辺は$9$、右辺は$16$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C A' B' C' : P), Similar ![A, B, C] ![A', B', C'] → dist A B * dist B' C' = dist A' B' * dist B C ∧ dist B C * dist C' A' = dist B' C' * dist C A ∧ dist C A * dist A' B' = dist C' A' * dist A B
  proof: |
    by
      intro V P _ _ _ _ A B C A' B' C' hs
      obtain ⟨r, hr, h⟩ := similar_iff_exists_pos_dist_eq.mp hs
      have h1 : dist A B = r * dist A' B' := h 0 1
      have h2 : dist B C = r * dist B' C' := h 1 2
      have h3 : dist C A = r * dist C' A' := h 2 0
      rw [h1, h2, h3]
      refine ⟨?_, ?_, ?_⟩ <;> ring
- id: similar_triangles_area_ratio_sine_form
  kind: gap
  level: middle
  topic: 三角形・相似比と面積比
  statement: 三角形$ABC$と三角形$A'B'C'$（それぞれ3点は同一直線上にない）と正の数$r$について、$AB=r\,A'B'$、$BC=r\,B'C'$、$CA=r\,C'A'$ならば、2辺とその間の角の正弦で表した面積の式について$\frac12AB\cdot BC\sin\angle ABC=r^2\cdot\frac12A'B'\cdot B'C'\sin\angle A'B'C'$が成り立つ。面積比は相似比の2乗である。
  statement_en: If A, B, C are not collinear, A', B', C' are not collinear, r > 0 and AB = r·A'B', BC = r·B'C', CA = r·C'A', then (1/2)AB·BC·sin∠ABC = r²·(1/2)A'B'·B'C'·sin∠A'B'C'.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $A',B',C'$は同一直線上にない
  - $r>0$
  - $AB=r\,A'B'$
  - $BC=r\,B'C'$
  - $CA=r\,C'A'$
  quantifiers:
  - 任意の6点$A,B,C,A',B',C'$と任意の実数$r$
  conclusion: $\frac12AB\cdot BC\sin\angle ABC=r^2\cdot\frac12A'B'\cdot B'C'\sin\angle A'B'C'$である。
  answer: |
    $A,B,C,A',B',C'$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$A',B',C'$も同一直線上になく、$r>0$で、$AB=r\,A'B'$、$BC=r\,B'C'$、$CA=r\,C'A'$とする。
    3辺の比が等しいので対応する角は等しい。実際、3点は同一直線上にないので各三角形の頂点は相異なり、余弦定理より$\cos\angle ABC=(AB^2+BC^2-CA^2)/(2AB\cdot BC)$である。$r$を代入して約分すると$\cos\angle A'B'C'$に等しい。角は$0$以上$\pi$以下で余弦はこの範囲で単射なので、$\angle ABC=\angle A'B'C'$である。
    これと$AB=r\,A'B'$、$BC=r\,B'C'$を左辺に代入すると、$\frac12(r\,A'B')(r\,B'C')\sin\angle A'B'C'=r^2\cdot\frac12A'B'\cdot B'C'\sin\angle A'B'C'$となる。
  strategy: Equal ratios force equal angles, and two side factors contribute r².
  sketch:
  - 'apply_theorem: The side ratios give ∠ABC = ∠A''B''C'' by the cosine formula.'
  - 'derive: Substitute AB = r·A''B'' and BC = r·B''C'' into the left side.'
  - 'conclude: Collecting r·r gives the factor r².'
  openmath: (forall (a b c a1 b1 c1 r) (-> (and (not (collinear_points a b c)) (not (collinear_points a1 b1 c1)) (> r 0) (= (dist_of a b) (* r (dist_of a1 b1))) (= (dist_of b c) (* r (dist_of b1 c1))) (= (dist_of c a) (* r (dist_of c1 a1)))) (= (* (/ 1 2) (dist_of a b) (dist_of b c) (sin (euclid_angle a b c))) (* (^ r 2) (* (/ 1 2) (dist_of a1 b1) (dist_of b1 c1) (sin (euclid_angle a1 b1 c1)))))))
  hard_negative:
    statement: 相似比が$r$のとき、面積比も$r$である。
    reason: 面積の式には長さが2つ掛かるので比は$r^2$である。$r=2$なら面積は$4$倍になる。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C A' B' C' : P) (r : ℝ), ¬Collinear ℝ ({A, B, C} : Set P) → ¬Collinear ℝ ({A', B', C'} : Set P) → 0 < r → dist A B = r * dist A' B' → dist B C = r * dist B' C' → dist C A = r * dist C' A' → 1 / 2 * dist A B * dist B C * Real.sin (EuclideanGeometry.angle A B C) = r ^ 2 * (1 / 2 * dist A' B' * dist B' C' * Real.sin (EuclideanGeometry.angle A' B' C'))
  proof: |
    by
      intro V P _ _ _ _ A B C A' B' C' r _ _ hr h1 h2 h3
      have hs : Similar ![A, B, C] ![A', B', C'] := by
        refine similar_iff_exists_pos_dist_eq.mpr ⟨r, hr, fun i j => ?_⟩
        fin_cases i <;> fin_cases j <;> simp <;> grind [dist_comm]
      rw [hs.angle_eq, h1, h2]
      ring
- id: triangles_common_angle_product_similar
  kind: gap
  level: middle
  topic: 三角形・相似条件
  statement: 点$D$が線分$AB$の内部、点$E$が線分$AC$の内部にあり$AD\cdot AB=AE\cdot AC$ならば、$A,D,E$と$A,C,B$はこの対応で相似である。$D$は$C$に、$E$は$B$に対応する。
  statement_en: If D lies strictly between A and B, E lies strictly between A and C, and AD·AB = AE·AC, then A, D, E and A, C, B are similar in this order.
  assumptions:
  - $D$は$A$と$B$の間にあり$A,B$と異なる
  - $E$は$A$と$C$の間にあり$A,C$と異なる
  - $AD\cdot AB=AE\cdot AC$
  quantifiers:
  - 任意の5点$A,B,C,D,E$
  conclusion: $A,D,E$と$A,C,B$はこの対応で相似である。
  answer: |
    $A,B,C,D,E$を実内積空間上のアフィン空間の点とする。$D$は$A$と$B$の間にあって$A,B$と異なり、$E$は$A$と$C$の間にあって$A,C$と異なり、$AD\cdot AB=AE\cdot AC$とする。
    $r=AD/AC>0$とおくと$AD=r\,AC$であり、等式を$AC$で割ると$AE=r\,AB$である。$D$は半直線$AB$上、$E$は半直線$AC$上にあるので$\angle DAE=\angle CAB$である。
    余弦定理より$DE^2=AD^2+AE^2-2\,AD\cdot AE\cos\angle DAE$であり、代入すると$DE^2=r^2(AC^2+AB^2-2\,AC\cdot AB\cos\angle CAB)=r^2CB^2$である。よって$DE=r\,CB$である。対応する2頂点間の距離の比がすべて$r$なので、相似である。
  strategy: The product condition gives common ratio r on the two sides at A; the shared angle and the law of cosines give the third side.
  sketch:
  - 'construct: Put r = AD/AC, so AD = r·AC and AE = r·AB.'
  - 'derive: D and E lie on rays AB and AC, so ∠DAE = ∠CAB.'
  - 'apply_theorem: The law of cosines at A gives DE² = r²CB².'
  - 'conclude: All pairwise distances have ratio r.'
  openmath: (forall (a b c d e) (-> (and (strictly_between a d b) (strictly_between a e c) (= (* (dist_of a d) (dist_of a b)) (* (dist_of a e) (dist_of a c)))) (similar_triangles a d e a c b)))
  hard_negative:
    statement: $AD\cdot AB=AE\cdot AC$ならば直線$DE$と直線$BC$は平行である。
    reason: 平行に対応するのは$AD/AB=AE/AC$である。$AB=2$、$AC=1$、$AD=1/4$、$AE=1/2$は積の条件を満たすが、$AD/AB=1/8$、$AE/AC=1/2$なので平行でない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D E : P), Sbtw ℝ A D B → Sbtw ℝ A E C → dist A D * dist A B = dist A E * dist A C → Similar ![A, D, E] ![A, C, B]
  proof: |
    by
      intro V P _ _ _ _ A B C D E hD hE hprod
      have hAC : dist A C ≠ 0 := dist_ne_zero.mpr hE.left_ne_right
      have hAB : dist A B ≠ 0 := dist_ne_zero.mpr hD.left_ne_right
      have hAD : 0 < dist A D := dist_pos.mpr hD.left_ne
      have hang : EuclideanGeometry.angle D A E = EuclideanGeometry.angle C A B := by
        rw [hD.angle_eq_left E, EuclideanGeometry.angle_comm B A E, hE.angle_eq_left B]
      set r : ℝ := dist A D / dist A C with hr
      have hrpos : 0 < r := div_pos hAD (lt_of_le_of_ne dist_nonneg hAC.symm)
      have h1 : dist A D = r * dist A C := by rw [hr]; field_simp
      have h2 : dist A E = r * dist A B := by
        rw [hr]; field_simp; linarith
      have e := EuclideanGeometry.law_cos D A E
      have e' := EuclideanGeometry.law_cos C A B
      have h3 : dist D E = r * dist C B := by
        refine (mul_self_inj dist_nonneg (by positivity)).mp ?_
        have hDA : dist D A = r * dist C A := by rw [dist_comm D A, dist_comm C A]; exact h1
        have hEA : dist E A = r * dist B A := by rw [dist_comm E A, dist_comm B A]; exact h2
        rw [e, hang, hDA, hEA]
        linear_combination -(r * r) * e'
      refine similar_iff_exists_pos_dist_eq.mpr ⟨r, hrpos, fun i j => ?_⟩
      fin_cases i <;> fin_cases j <;> simp <;> grind [dist_comm]
- id: isosceles_iff_equal_base_angles
  kind: textbook
  level: middle
  topic: 三角形・二等辺三角形
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）について、$AB=AC$であることと底角が等しいこと$\angle ABC=\angle ACB$は同値である。
  statement_en: For non-collinear A, B, C, AB = AC if and only if ∠ABC = ∠ACB.
  assumptions:
  - $A,B,C$は同一直線上にない
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $AB=AC$と$\angle ABC=\angle ACB$は同値である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の点とし、同一直線上にないとする。
    $AB=AC$なら、余弦定理より$\cos\angle ABC=(AB^2+BC^2-AC^2)/(2AB\cdot BC)=BC/(2AB)$であり、$\cos\angle ACB$も同じ値である。角は$0$以上$\pi$以下で余弦はこの範囲で単射なので、$\angle ABC=\angle ACB$である。
    逆に$\angle ABC=\angle ACB$とする。正弦定理より$AB\sin\angle ABC=AC\sin\angle ACB$である。$A,B,C$は同一直線上にないので$\angle ABC$は$0$より大きく$\pi$より小さく、正弦は正である。両辺をこの正弦で割ると$AB=AC$である。
  strategy: Forward uses the cosine formula, converse uses the law of sines with positive sine.
  sketch:
  - 'apply_theorem: If AB = AC, the cosine formula gives equal cosines of the base angles.'
  - 'derive: Injectivity of cosine on [0, π] gives equal base angles.'
  - 'apply_theorem: Conversely the law of sines gives AB·sin∠ABC = AC·sin∠ACB.'
  - 'conclude: Non-collinearity makes the sine positive, so AB = AC.'
  openmath: (forall (a b c) (-> (not (collinear_points a b c)) (<-> (= (dist_of a b) (dist_of a c)) (= (euclid_angle a b c) (euclid_angle a c b)))))
  hard_negative:
    statement: $A,B,C$が同一直線上にあっても、$\angle ABC=\angle ACB$ならば$AB=AC$である。
    reason: 数直線上で$A=0$、$B=-1$、$C=2$とすると$\angle ABC=\angle ACB=0$であるが、$AB=1$、$AC=2$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), ¬Collinear ℝ ({A, B, C} : Set P) → (dist A B = dist A C ↔ EuclideanGeometry.angle A B C = EuclideanGeometry.angle A C B)
  proof: |
    by
      intro V P _ _ _ _ A B C h
      refine ⟨EuclideanGeometry.angle_eq_angle_of_dist_eq, fun ha => ?_⟩
      refine EuclideanGeometry.dist_eq_of_angle_eq_angle_of_angle_ne_pi ha fun hpi => h ?_
      have := EuclideanGeometry.collinear_of_angle_eq_pi hpi
      rwa [Set.insert_comm] at this
- id: isosceles_iff_median_perpendicular
  kind: gap
  level: middle
  topic: 三角形・二等辺三角形
  statement: 点$A,B,C$と線分$BC$の中点$M$について、$AB=AC$であることと、ベクトル$A-M$と$C-B$の内積が$0$であること（中線$AM$が$BC$に垂直であること）は同値である。
  statement_en: For points A, B, C with M the midpoint of BC, AB = AC if and only if ⟨A-M, C-B⟩ = 0.
  assumptions:
  - $M$は$B$と$C$の中点
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $AB=AC$と$\langle A-M,C-B\rangle=0$は同値である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の点とし、$M$を$B$と$C$の中点とする。$h=A-M$、$d=C-B$とおく。
    $M-B=\frac12d$、$M-C=-\frac12d$なので、$A-B=h+\frac12d$、$A-C=h-\frac12d$である。内積を展開すると$AB^2-AC^2=\|h+\frac12d\|^2-\|h-\frac12d\|^2=2\langle h,d\rangle$である。
    長さは$0$以上なので、$AB=AC$は$AB^2=AC^2$と同値であり、これは$\langle h,d\rangle=0$と同値である。
  strategy: Write A-B and A-C through A-M and half of C-B and subtract the squared norms.
  sketch:
  - 'setup: Put h = A-M and d = C-B, so A-B = h + d/2 and A-C = h - d/2.'
  - 'derive: Expanding gives AB² - AC² = 2⟨h,d⟩.'
  - 'conclude: AB = AC iff the squares agree iff ⟨h,d⟩ = 0.'
  openmath: (forall (a b c) (<-> (= (dist_of a b) (dist_of a c)) (perpendicular_lines a (midpoint_of b c) b c)))
  hard_negative:
    statement: 直線$BC$上の点$H$で$AH$が$BC$に垂直なら、$H$が中点でなくても$AB=AC$である。
    reason: 垂線の足が中点のときに限る。$B=(0,0)$、$C=(4,0)$、$A=(1,1)$、$H=(1,0)$では$AB=\sqrt2$、$AC=\sqrt{10}$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), dist A B = dist A C ↔ inner ℝ (A -ᵥ midpoint ℝ B C) (C -ᵥ B) = 0
  proof: |
    by
      intro V P _ _ _ _ A B C
      set d : V := C -ᵥ B with hd
      set h : V := A -ᵥ midpoint ℝ B C with hh
      have e1 : A -ᵥ B = h + (1 / 2 : ℝ) • d := by
        rw [hh, hd, ← vsub_add_vsub_cancel A (midpoint ℝ B C) B, midpoint_vsub_left, invOf_eq_inv, one_div]
      have e2 : A -ᵥ C = h - (1 / 2 : ℝ) • d := by
        rw [hh, hd, ← vsub_add_vsub_cancel A (midpoint ℝ B C) C, sub_eq_add_neg, ← neg_vsub_eq_vsub_rev C,
          right_vsub_midpoint, invOf_eq_inv, one_div]
      rw [← sq_eq_sq₀ dist_nonneg dist_nonneg, dist_eq_norm_vsub V A B, dist_eq_norm_vsub V A C, e1, e2,
        norm_add_sq_real, norm_sub_sq_real, real_inner_smul_right]
      constructor <;> intro hx <;> linarith
- id: median_bisects_apex_implies_isosceles
  kind: gap
  level: middle
  topic: 三角形・二等辺三角形
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）で、$BC$の中点$M$について中線$AM$が頂角を二等分する、すなわち$\angle BAM=\angle MAC$ならば、$AB=AC$である。
  statement_en: If A, B, C are not collinear and the median AM to BC bisects the angle at A, meaning ∠BAM = ∠MAC, then AB = AC.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $M$は$B$と$C$の中点
  - $\angle BAM=\angle MAC$
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $AB=AC$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の、同一直線上にない点とし、$M$を$B$と$C$の中点として$\angle BAM=\angle MAC$とする。$\theta=\angle BAM$とおく。
    $M$は直線$BC$上で$B,C$の間にあり、$A$はこの直線上にない。よって$\angle AMB+\angle AMC=\pi$であり、$\sin\angle AMB=\sin\angle AMC$である。また$0<\theta<\pi$なので$\sin\theta>0$である。
    三角形$ABM$と$ACM$の正弦定理より$BM\sin\angle AMB=AB\sin\theta$、$CM\sin\angle AMC=AC\sin\theta$である。$BM=CM$なので左辺どうしは等しく、$\sin\theta$で割ると$AB=AC$である。
  strategy: Apply the law of sines in the two triangles cut by the median, using supplementary angles at M.
  sketch:
  - 'setup: M lies strictly between B and C and A is off line BC.'
  - 'derive: The angles at M are supplementary, so they have equal sines.'
  - 'apply_theorem: The law of sines gives BM·sin∠AMB = AB·sinθ and CM·sin∠AMC = AC·sinθ.'
  - 'conclude: BM = CM and sinθ > 0 give AB = AC.'
  openmath: (forall (a b c) (-> (and (not (collinear_points a b c)) (= (euclid_angle b a (midpoint_of b c)) (euclid_angle (midpoint_of b c) a c))) (= (dist_of a b) (dist_of a c))))
  hard_negative:
    statement: 線分$BC$の内部の任意の点$D$について、$\angle BAD=\angle DAC$ならば$AB=AC$である。
    reason: 一般の点$D$では角の二等分線の定理で$AB:AC=BD:DC$となるだけである。$AB\neq AC$の三角形でも頂角の二等分線は$BC$と交わる。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), ¬Collinear ℝ ({A, B, C} : Set P) → EuclideanGeometry.angle B A (midpoint ℝ B C) = EuclideanGeometry.angle (midpoint ℝ B C) A C → dist A B = dist A C
  proof: |
    by
      intro V P _ _ _ _ A B C hABC hang
      have bis : ∀ D : P, Sbtw ℝ B D C → EuclideanGeometry.angle B A D = EuclideanGeometry.angle D A C →
          dist A B / dist A C = dist B D / dist D C := by
        intro D hD hang
        have hDC : D ≠ C := hD.ne_right
        have hAC : A ≠ C := ne₁₃_of_not_collinear hABC
        have hsin : Real.sin (EuclideanGeometry.angle D A C) ≠ 0 := by
          intro h0
          apply hABC
          have hcol : Collinear ℝ ({D, A, C} : Set P) :=
            EuclideanGeometry.collinear_iff_eq_or_eq_or_sin_eq_zero.mpr (Or.inr (Or.inr h0))
          have hA : A ∈ line[ℝ, D, C] := hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hDC
          have hle : line[ℝ, D, C] ≤ line[ℝ, B, C] :=
            affineSpan_pair_le_of_mem_of_mem hD.wbtw.mem_affineSpan (right_mem_affineSpan_pair ℝ B C)
          exact collinear_insert_of_mem_affineSpan_pair (hle hA)
        have l1 := EuclideanGeometry.sin_angle_mul_dist_eq_sin_angle_mul_dist D A B
        have l2 := EuclideanGeometry.sin_angle_mul_dist_eq_sin_angle_mul_dist D A C
        have hpi := EuclideanGeometry.angle_add_angle_eq_pi_of_angle_eq_pi A hD.angle₁₂₃_eq_pi
        have hβ : Real.sin (EuclideanGeometry.angle B D A) = Real.sin (EuclideanGeometry.angle C D A) := by
          rw [EuclideanGeometry.angle_comm B D A, EuclideanGeometry.angle_comm C D A,
            show EuclideanGeometry.angle A D B = Real.pi - EuclideanGeometry.angle A D C by linarith, Real.sin_pi_sub]
        rw [EuclideanGeometry.angle_comm D A B, hang, hβ] at l1
        rw [div_eq_div_iff (dist_ne_zero.mpr hAC) (dist_ne_zero.mpr hDC)]
        apply mul_left_cancel₀ hsin
        rw [dist_comm C D] at l2
        linear_combination (dist D C) * l1 - (dist B D) * l2
      have hBC : B ≠ C := ne₂₃_of_not_collinear hABC
      have hS : Sbtw ℝ B (midpoint ℝ B C) C := sbtw_midpoint_of_ne ℝ hBC
      have h := bis _ hS hang
      have hAC : dist A C ≠ 0 := dist_ne_zero.mpr (ne₁₃_of_not_collinear hABC)
      have hm : dist (midpoint ℝ B C) C ≠ 0 := dist_ne_zero.mpr hS.ne_right
      rw [dist_left_midpoint, dist_midpoint_right, div_self (by simpa using dist_ne_zero.mpr hBC),
        div_eq_one_iff_eq hAC] at h
      exact h
- id: isosceles_apex_bisector_foot_is_midpoint
  kind: gap
  level: middle
  topic: 三角形・二等辺三角形
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）で$AB=AC$のとき、線分$BC$の内部の点$D$が$\angle BAD=\angle DAC$を満たすならば、$D$は$BC$の中点である。
  statement_en: If A, B, C are not collinear, AB = AC, D lies strictly between B and C, and ∠BAD = ∠DAC, then D is the midpoint of BC.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $AB=AC$
  - $D$は$B$と$C$の間にあり$B,C$と異なる
  - $\angle BAD=\angle DAC$
  quantifiers:
  - 任意の4点$A,B,C,D$
  conclusion: $D$は$B$と$C$の中点である。
  answer: |
    $A,B,C,D$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$AB=AC$で、$D$は$B$と$C$の間にあって$B,C$と異なり、$\angle BAD=\angle DAC$とする。
    角の二等分線の定理より$AB/AC=BD/DC$であり、左辺は$1$なので$BD=DC$である。$D$は線分$BC$上にあるので$BD+DC=BC$であり、$BD=DC=BC/2$である。線分$BC$上で$B$からの距離が$BC/2$の点は中点だけなので、$D$は$BC$の中点である。
  strategy: The angle bisector theorem gives BD = DC, and a point of the segment at half distance is the midpoint.
  sketch:
  - 'apply_theorem: The angle bisector theorem gives AB/AC = BD/DC.'
  - 'derive: AB = AC forces BD = DC.'
  - 'derive: BD + DC = BC gives BD = DC = BC/2.'
  - 'conclude: D is the midpoint.'
  openmath: (forall (a b c d) (-> (and (not (collinear_points a b c)) (= (dist_of a b) (dist_of a c)) (strictly_between b d c) (= (euclid_angle b a d) (euclid_angle d a c))) (= d (midpoint_of b c))))
  hard_negative:
    statement: $AB\neq AC$でも、頂角の二等分線と$BC$の交点は$BC$の中点である。
    reason: 交点は$BD:DC=AB:AC$に分けるので、$AB\neq AC$なら中点ではない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), ¬Collinear ℝ ({A, B, C} : Set P) → dist A B = dist A C → Sbtw ℝ B D C → EuclideanGeometry.angle B A D = EuclideanGeometry.angle D A C → D = midpoint ℝ B C
  proof: |
    by
      intro V P _ _ _ _ A B C D hABC hiso hD hang
      have bis : ∀ D : P, Sbtw ℝ B D C → EuclideanGeometry.angle B A D = EuclideanGeometry.angle D A C →
          dist A B / dist A C = dist B D / dist D C := by
        intro D hD hang
        have hDC : D ≠ C := hD.ne_right
        have hAC : A ≠ C := ne₁₃_of_not_collinear hABC
        have hsin : Real.sin (EuclideanGeometry.angle D A C) ≠ 0 := by
          intro h0
          apply hABC
          have hcol : Collinear ℝ ({D, A, C} : Set P) :=
            EuclideanGeometry.collinear_iff_eq_or_eq_or_sin_eq_zero.mpr (Or.inr (Or.inr h0))
          have hA : A ∈ line[ℝ, D, C] := hcol.mem_affineSpan_of_mem_of_ne (by simp) (by simp) (by simp) hDC
          have hle : line[ℝ, D, C] ≤ line[ℝ, B, C] :=
            affineSpan_pair_le_of_mem_of_mem hD.wbtw.mem_affineSpan (right_mem_affineSpan_pair ℝ B C)
          exact collinear_insert_of_mem_affineSpan_pair (hle hA)
        have l1 := EuclideanGeometry.sin_angle_mul_dist_eq_sin_angle_mul_dist D A B
        have l2 := EuclideanGeometry.sin_angle_mul_dist_eq_sin_angle_mul_dist D A C
        have hpi := EuclideanGeometry.angle_add_angle_eq_pi_of_angle_eq_pi A hD.angle₁₂₃_eq_pi
        have hβ : Real.sin (EuclideanGeometry.angle B D A) = Real.sin (EuclideanGeometry.angle C D A) := by
          rw [EuclideanGeometry.angle_comm B D A, EuclideanGeometry.angle_comm C D A,
            show EuclideanGeometry.angle A D B = Real.pi - EuclideanGeometry.angle A D C by linarith, Real.sin_pi_sub]
        rw [EuclideanGeometry.angle_comm D A B, hang, hβ] at l1
        rw [div_eq_div_iff (dist_ne_zero.mpr hAC) (dist_ne_zero.mpr hDC)]
        apply mul_left_cancel₀ hsin
        rw [dist_comm C D] at l2
        linear_combination (dist D C) * l1 - (dist B D) * l2
      have h := bis D hD hang
      have hAC : dist A C ≠ 0 := dist_ne_zero.mpr (ne₁₃_of_not_collinear hABC)
      have hDC : dist D C ≠ 0 := dist_ne_zero.mpr hD.ne_right
      rw [hiso, div_self hAC, eq_comm, div_eq_one_iff_eq hDC] at h
      have hs := hD.wbtw.dist_add_dist
      exact eq_midpoint_of_dist_eq_half (by linarith) (by rw [dist_comm B D] at *; linarith [dist_comm C D, dist_comm D B])
- id: isosceles_altitude_foot_is_midpoint
  kind: gap
  level: middle
  topic: 三角形・二等辺三角形
  statement: $B\neq C$、$AB=AC$のとき、直線$BC$上の点$H$で$A-H$と$C-B$の内積が$0$であるもの（$A$から$BC$への垂線の足）は$BC$の中点である。
  statement_en: If B ≠ C, AB = AC, H lies on line BC and ⟨A-H, C-B⟩ = 0, then H is the midpoint of BC.
  assumptions:
  - $B\neq C$
  - $AB=AC$
  - $H$は直線$BC$上の点
  - $\langle A-H,C-B\rangle=0$
  quantifiers:
  - 任意の4点$A,B,C,H$
  conclusion: $H$は$B$と$C$の中点である。
  answer: |
    $A,B,C,H$を実内積空間上のアフィン空間の点とする。$B\neq C$、$AB=AC$で、$H$は直線$BC$上にあり、$\langle A-H,C-B\rangle=0$とする。
    $d=C-B\neq0$、$h=A-H$とおき、実数$x$を用いて$H-B=xd$と書く。このとき$H-C=(x-1)d$であり、$A-B=h+xd$、$A-C=h+(x-1)d$である。
    $\langle h,d\rangle=0$なので$AB^2=\|h\|^2+x^2\|d\|^2$、$AC^2=\|h\|^2+(x-1)^2\|d\|^2$である。$AB=AC$と$\|d\|\neq0$より$x^2=(x-1)^2$であり、$x=\frac12$である。よって$H$は$BC$の中点である。
  strategy: Parametrize H on line BC and compare AB² and AC² using orthogonality.
  sketch:
  - 'setup: Write H - B = x·d with d = C - B and h = A - H orthogonal to d.'
  - 'derive: AB² = ‖h‖² + x²‖d‖² and AC² = ‖h‖² + (x-1)²‖d‖².'
  - 'derive: AB = AC and d ≠ 0 give x² = (x-1)².'
  - 'conclude: x = 1/2, so H is the midpoint.'
  openmath: (forall (a b c h) (-> (and (!= b c) (= (dist_of a b) (dist_of a c)) (on_line h b c) (perpendicular_lines a h b c)) (= h (midpoint_of b c))))
  hard_negative:
    statement: $AB\neq AC$でも、$A$から$BC$への垂線の足は$BC$の中点である。
    reason: $B=(0,0)$、$C=(4,0)$、$A=(1,1)$では垂線の足は$(1,0)$であり、中点$(2,0)$ではない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C H : P), B ≠ C → dist A B = dist A C → H ∈ line[ℝ, B, C] → inner ℝ (A -ᵥ H) (C -ᵥ B) = 0 → H = midpoint ℝ B C
  proof: |
    by
      intro V P _ _ _ _ A B C H hBC hiso hH hperp
      obtain ⟨x, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hH
      have hd0 : ‖C -ᵥ B‖ ≠ 0 := by
        rw [norm_ne_zero_iff]; exact vsub_ne_zero.mpr hBC.symm
      set d : V := C -ᵥ B with hd
      set h : V := A -ᵥ AffineMap.lineMap B C x with hh
      have hBH : AffineMap.lineMap B C x -ᵥ B = x • d := by
        rw [AffineMap.lineMap_apply, vadd_vsub]
      have hHC : AffineMap.lineMap B C x -ᵥ C = (x - 1) • d := by
        rw [AffineMap.lineMap_apply, vadd_vsub_assoc, sub_smul, one_smul, hd, ← neg_vsub_eq_vsub_rev C B]
        abel
      have e1 : A -ᵥ B = h + x • d := by rw [← hBH, hh, vsub_add_vsub_cancel]
      have e2 : A -ᵥ C = h + (x - 1) • d := by rw [← hHC, hh, vsub_add_vsub_cancel]
      have hsq := congrArg (· ^ 2) hiso
      simp only [dist_eq_norm_vsub V A B, dist_eq_norm_vsub V A C, e1, e2, norm_add_sq_real, real_inner_smul_right, hperp,
        norm_smul, Real.norm_eq_abs, mul_pow, sq_abs] at hsq
      have hx : x = 1 / 2 := by
        have hpos : ‖d‖ ^ 2 ≠ 0 := pow_ne_zero 2 hd0
        apply mul_left_cancel₀ hpos
        linear_combination (1 / 2) * hsq
      rw [hx, show (1 / 2 : ℝ) = ⅟2 by norm_num]
      rfl
- id: isosceles_base_angle_acute
  kind: gap
  level: middle
  topic: 三角形・二等辺三角形
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）で$AB=AC$ならば、底角$\angle ABC$は$\pi/2$より小さく、頂角は$\angle BAC=\pi-2\angle ABC$である。
  statement_en: If A, B, C are not collinear and AB = AC, then ∠ABC < π/2 and ∠BAC = π - 2∠ABC.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $AB=AC$
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $\angle ABC<\pi/2$かつ$\angle BAC=\pi-2\angle ABC$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の、同一直線上にない点とし、$AB=AC$とする。
    二等辺三角形の底角は等しいので$\angle ABC=\angle ACB$である。内角の和より$\angle BAC+2\angle ABC=\pi$であり、これが頂角の式である。$A,B,C$は同一直線上にないので$\angle BAC>0$であり、$2\angle ABC<\pi$、すなわち$\angle ABC<\pi/2$である。
  strategy: Combine equal base angles with the angle sum and positivity of the apex angle.
  sketch:
  - 'apply_theorem: AB = AC gives equal base angles.'
  - 'apply_theorem: The angle sum gives ∠BAC + 2∠ABC = π.'
  - 'conclude: Non-collinearity gives ∠BAC > 0, hence ∠ABC < π/2.'
  openmath: (forall (a b c) (-> (and (not (collinear_points a b c)) (= (dist_of a b) (dist_of a c))) (and (< (euclid_angle a b c) (/ pi 2)) (= (euclid_angle b a c) (- pi (* 2 (euclid_angle a b c)))))))
  hard_negative:
    statement: $AB=AC$ならば頂角$\angle BAC$も$\pi/2$より小さい。
    reason: 頂角は鈍角になりうる。底角が$\pi/6$なら頂角は$2\pi/3$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), ¬Collinear ℝ ({A, B, C} : Set P) → dist A B = dist A C → EuclideanGeometry.angle A B C < Real.pi / 2 ∧ EuclideanGeometry.angle B A C = Real.pi - 2 * EuclideanGeometry.angle A B C
  proof: |
    by
      intro V P _ _ _ _ A B C hABC hiso
      have hb := EuclideanGeometry.angle_eq_angle_of_dist_eq hiso
      have hs := EuclideanGeometry.angle_add_angle_add_angle_eq_pi C (ne₁₂_of_not_collinear hABC).symm
      have hp : 0 < EuclideanGeometry.angle B A C :=
        EuclideanGeometry.angle_pos_of_not_collinear (by rwa [Set.insert_comm])
      rw [EuclideanGeometry.angle_comm B C A, ← hb, EuclideanGeometry.angle_comm C A B] at hs
      constructor <;> linarith
- id: equilateral_triangle_angles_pi_div_three
  kind: textbook
  level: middle
  topic: 三角形・正三角形
  statement: $A\neq B$かつ$AB=BC=CA$ならば、3つの角はすべて$\pi/3$である。
  statement_en: If A ≠ B and AB = BC = CA, then ∠ABC = ∠BCA = ∠CAB = π/3.
  assumptions:
  - $A\neq B$
  - $AB=BC$
  - $BC=CA$
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $\angle ABC=\angle BCA=\angle CAB=\pi/3$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の点とし、$A\neq B$、$AB=BC=CA$とする。
    $BA=BC$より二等辺三角形の底角として$\angle BAC=\angle BCA$である。$CA=CB$より同様に$\angle CAB=\angle CBA$である。したがって3つの角は等しい。$A\neq B$なので3辺の長さは正で3点は相異なり、内角の和は$\pi$である。よって各角は$\pi/3$である。
  strategy: Two applications of the base-angle theorem make all angles equal, then use the angle sum.
  sketch:
  - 'apply_theorem: BA = BC gives ∠BAC = ∠BCA.'
  - 'apply_theorem: CA = CB gives ∠CAB = ∠CBA.'
  - 'derive: The three angles are equal.'
  - 'conclude: The angle sum π gives each angle π/3.'
  openmath: (forall (a b c) (-> (and (!= a b) (= (dist_of a b) (dist_of b c)) (= (dist_of b c) (dist_of c a))) (and (= (euclid_angle a b c) (/ pi 3)) (= (euclid_angle b c a) (/ pi 3)) (= (euclid_angle c a b) (/ pi 3)))))
  hard_negative:
    statement: $A\neq B$を外しても、$AB=BC=CA$なら各角は$\pi/3$である。
    reason: $A=B=C$でも$AB=BC=CA=0$であるが、3点が一致すれば三角形にならず、角は定まらない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), A ≠ B → dist A B = dist B C → dist B C = dist C A → EuclideanGeometry.angle A B C = Real.pi / 3 ∧ EuclideanGeometry.angle B C A = Real.pi / 3 ∧ EuclideanGeometry.angle C A B = Real.pi / 3
  proof: |
    by
      intro V P _ _ _ _ A B C hAB h1 h2
      have ha := EuclideanGeometry.angle_eq_angle_of_dist_eq (p₁ := B) (p₂ := A) (p₃ := C) (by rw [dist_comm B A]; exact h1)
      have hb := EuclideanGeometry.angle_eq_angle_of_dist_eq (p₁ := C) (p₂ := A) (p₃ := B) (by rw [dist_comm C B]; exact h2.symm)
      have hs := EuclideanGeometry.angle_add_angle_add_angle_eq_pi C hAB.symm
      rw [EuclideanGeometry.angle_comm C B A] at hb
      rw [EuclideanGeometry.angle_comm B A C] at ha
      rw [EuclideanGeometry.angle_comm B C A] at *
      refine ⟨?_, ?_, ?_⟩ <;> linarith
- id: equiangular_triangle_is_equilateral
  kind: gap
  level: middle
  topic: 三角形・正三角形
  statement: 三角形$ABC$（$A,B,C$は同一直線上にない）で3つの角が等しい、すなわち$\angle ABC=\angle BCA=\angle CAB$ならば、$AB=BC=CA$である。
  statement_en: If A, B, C are not collinear and ∠ABC = ∠BCA = ∠CAB, then AB = BC = CA.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $\angle ABC=\angle BCA$
  - $\angle BCA=\angle CAB$
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $AB=BC=CA$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の、同一直線上にない点とし、3つの角が等しいとする。
    $\angle ABC=\angle ACB$なので、底角が等しい三角形は二等辺であることから$AB=AC$である。$\angle BCA=\angle BAC$なので同様に$BC=BA$である。よって$AB=BC=CA$である。
  strategy: Apply the converse of the base-angle theorem at two vertices.
  sketch:
  - 'apply_theorem: ∠ABC = ∠ACB gives AB = AC.'
  - 'apply_theorem: ∠BCA = ∠BAC gives BC = BA.'
  - 'conclude: All three sides are equal.'
  openmath: (forall (a b c) (-> (and (not (collinear_points a b c)) (= (euclid_angle a b c) (euclid_angle b c a)) (= (euclid_angle b c a) (euclid_angle c a b))) (and (= (dist_of a b) (dist_of b c)) (= (dist_of b c) (dist_of c a)))))
  hard_negative:
    statement: $\angle ABC=\angle BCA$だけで$AB=BC=CA$である。
    reason: 2つの角が等しいと二等辺になるだけである。角が$\pi/4,\pi/4,\pi/2$の直角二等辺三角形は正三角形ではない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), ¬Collinear ℝ ({A, B, C} : Set P) → EuclideanGeometry.angle A B C = EuclideanGeometry.angle B C A → EuclideanGeometry.angle B C A = EuclideanGeometry.angle C A B → dist A B = dist B C ∧ dist B C = dist C A
  proof: |
    by
      intro V P _ _ _ _ A B C hABC h1 h2
      have hAC : dist A B = dist A C := by
        refine EuclideanGeometry.dist_eq_of_angle_eq_angle_of_angle_ne_pi
          (by rw [h1, EuclideanGeometry.angle_comm]) ?_
        exact (EuclideanGeometry.angle_lt_pi_of_not_collinear (by rwa [Set.insert_comm])).ne
      have hBA : dist B C = dist B A := by
        refine EuclideanGeometry.dist_eq_of_angle_eq_angle_of_angle_ne_pi
          (by rw [h2, EuclideanGeometry.angle_comm]) ?_
        rw [EuclideanGeometry.angle_comm]
        exact (EuclideanGeometry.angle_lt_pi_of_not_collinear hABC).ne
      constructor
      · rw [hBA, dist_comm]
      · rw [hBA, dist_comm B A, hAC, dist_comm]
- id: isosceles_apex_pi_div_three_is_equilateral
  kind: gap
  level: middle
  topic: 三角形・正三角形
  statement: $AB=AC$かつ頂角$\angle BAC=\pi/3$ならば、$AB=BC=CA$である。
  statement_en: If AB = AC and ∠BAC = π/3, then AB = BC = CA.
  assumptions:
  - $AB=AC$
  - $\angle BAC=\pi/3$
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $AB=BC=CA$である。
  answer: |
    $A,B,C$を実内積空間上のアフィン空間の点とし、$AB=AC$、$\angle BAC=\pi/3$とする。
    余弦定理より$BC^2=AB^2+AC^2-2\,AB\cdot AC\cos\frac{\pi}{3}$である。$AB=AC$と$\cos\frac{\pi}{3}=\frac12$を代入すると$BC^2=AB^2$であり、長さは$0$以上なので$BC=AB$である。これと$AB=AC$より$AB=BC=CA$である。
  strategy: The law of cosines with cos(π/3) = 1/2 gives BC = AB.
  sketch:
  - 'apply_theorem: Write BC² by the law of cosines at A.'
  - 'derive: Substituting AB = AC and cos(π/3) = 1/2 gives BC² = AB².'
  - 'conclude: Nonnegativity gives BC = AB.'
  openmath: (forall (a b c) (-> (and (= (dist_of a b) (dist_of a c)) (= (euclid_angle b a c) (/ pi 3))) (and (= (dist_of a b) (dist_of b c)) (= (dist_of b c) (dist_of c a)))))
  hard_negative:
    statement: $AB\neq AC$でも、$\angle BAC=\pi/3$ならば正三角形である。
    reason: $AB=1$、$AC=2$、$\angle BAC=\pi/3$では$BC=\sqrt3$であり、3辺は等しくない。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), dist A B = dist A C → EuclideanGeometry.angle B A C = Real.pi / 3 → dist A B = dist B C ∧ dist B C = dist C A
  proof: |
    by
      intro V P _ _ _ _ A B C hiso hang
      have e := EuclideanGeometry.law_cos B A C
      rw [hang, Real.cos_pi_div_three, dist_comm B A, dist_comm C A, ← hiso] at e
      have h : dist A B = dist B C := (mul_self_inj dist_nonneg dist_nonneg).mp (by linarith)
      exact ⟨h, by rw [← h, hiso, dist_comm]⟩
- id: isosceles_cevian_square_difference
  kind: gap
  level: high
  topic: 三角形・二等辺三角形と線分の関係
  statement: $AB=AC$で、点$D$が線分$BC$の内部にあるならば、$AB^2-AD^2=BD\cdot DC$である。
  statement_en: If AB = AC and D lies strictly between B and C, then AB² - AD² = BD·DC.
  assumptions:
  - $AB=AC$
  - $D$は$B$と$C$の間にあり$B,C$と異なる
  quantifiers:
  - 任意の4点$A,B,C,D$
  conclusion: $AB^2-AD^2=BD\cdot DC$である。
  answer: |
    $A,B,C,D$を実内積空間上のアフィン空間の点とし、$AB=AC$で、$D$は$B$と$C$の間にあって$B,C$と異なるとする。$BC=BD+DC>0$である。
    スチュワートの定理より$AB^2\cdot DC+AC^2\cdot BD=BC(AD^2+BD\cdot DC)$である。$AC=AB$を代入すると左辺は$AB^2(DC+BD)=AB^2\cdot BC$である。両辺を$BC$で割ると$AB^2=AD^2+BD\cdot DC$である。
  strategy: Specialize Stewart's theorem to equal sides and cancel BC.
  sketch:
  - 'apply_theorem: Stewart''s theorem for D on BC.'
  - 'derive: AB = AC makes the left side AB²·BC.'
  - 'conclude: Cancel BC > 0.'
  openmath: (forall (a b c d) (-> (and (= (dist_of a b) (dist_of a c)) (strictly_between b d c)) (= (- (^ (dist_of a b) 2) (^ (dist_of a d) 2)) (* (dist_of b d) (dist_of d c)))))
  hard_negative:
    statement: $D$が線分$BC$の外にあるときも$AB^2-AD^2=BD\cdot DC$である。
    reason: 外にある点では$AD>AB$となり左辺が負で右辺は正である。正しくは$AD^2-AB^2=BD\cdot DC$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), dist A B = dist A C → Sbtw ℝ B D C → dist A B ^ 2 - dist A D ^ 2 = dist B D * dist D C
  proof: |
    by
      intro V P _ _ _ _ A B C D hiso hD
      have stew : ∀ D : P, Sbtw ℝ B D C → dist A B ^ 2 * dist D C + dist A C ^ 2 * dist B D =
          dist B C * (dist A D ^ 2 + dist B D * dist D C) := by
        intro D hD
        have h := EuclideanGeometry.dist_sq_mul_dist_add_dist_sq_mul_dist A B C D hD.angle₁₂₃_eq_pi
        rwa [dist_comm C D] at h
      have h := stew D hD
      have hs := hD.wbtw.dist_add_dist
      have hBC : dist B C ≠ 0 := dist_ne_zero.mpr hD.left_ne_right
      apply mul_left_cancel₀ hBC
      rw [← hiso] at h
      rw [← hs] at h ⊢
      linear_combination h
