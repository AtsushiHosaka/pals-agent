    reason: このとき$D$は半直線$CB$上にあり$\angle ACD=\angle ACB$は内角である。正三角形では左辺が$\pi/3$、右辺が$2\pi/3$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C D : P), ¬Collinear ℝ ({A, B, C} : Set P) → Sbtw ℝ B C D → EuclideanGeometry.angle A C D = EuclideanGeometry.angle A B C + EuclideanGeometry.angle B A C
  proof: |
    by
      intro V P _ _ _ _ A B C D _ h
      linarith [EuclideanGeometry.exterior_angle_eq_angle_add_angle (p₃ := A) D h.symm, EuclideanGeometry.angle_comm C A B]
