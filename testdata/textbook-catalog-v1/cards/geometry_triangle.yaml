        have hin : inner ℝ (B -ᵥ A) (C -ᵥ A) = 0 := by
          rw [InnerProductGeometry.inner_eq_zero_iff_angle_eq_pi_div_two]; exact hA
        have e1 : B -ᵥ A = (-x) • d - h := by rw [← hBH, hh, vsub_sub_vsub_cancel_right]
        have e2 : C -ᵥ A = (1 - x) • d - h := by rw [← hCH, hh, vsub_sub_vsub_cancel_right]
        have hdh : inner ℝ d h = 0 := by rw [real_inner_comm]; exact hperp
        rw [e1, e2] at hin
        simp only [inner_sub_left, inner_sub_right, real_inner_smul_left, real_inner_smul_right, hperp, hdh,
          real_inner_self_eq_norm_sq] at hin
        have key : ‖h‖ ^ 2 = x * (1 - x) * ‖d‖ ^ 2 := by linear_combination hin
        have a1 : dist A B ^ 2 = x * ‖d‖ ^ 2 := by
          rw [dist_comm, dist_eq_norm_vsub V B A, e1, norm_sub_sq_real, real_inner_smul_left, hdh, norm_smul, key,
            Real.norm_eq_abs, mul_pow, sq_abs]
          ring
        have a2 : dist A C ^ 2 = (1 - x) * ‖d‖ ^ 2 := by
          rw [dist_comm, dist_eq_norm_vsub V C A, e2, norm_sub_sq_real, real_inner_smul_left, hdh, norm_smul, key,
            Real.norm_eq_abs, mul_pow, sq_abs]
          ring
        refine ⟨?_, a1, a2, ?_, ?_⟩
        · rw [dist_eq_norm_vsub V A, ← hh, key]
        · rw [dist_eq_norm_vsub V B, hBH, norm_smul, Real.norm_eq_abs, abs_neg]
        · rw [dist_comm, dist_eq_norm_vsub V C, hCH, norm_smul, Real.norm_eq_abs]
      obtain ⟨x, -, h0, h1, h2, -, -⟩ := core
      refine (sq_eq_sq₀ (by positivity) (by positivity)).mp ?_
      rw [mul_pow, mul_pow, h0, h1, h2]
      ring
- id: right_triangle_altitude_similar_triangles
  kind: gap
  level: middle
  topic: 三角形・直角三角形の垂線
  statement: 直角三角形$ABC$（$A,B,C$は同一直線上になく$\angle BAC=\pi/2$）で、$H$が$A$から直線$BC$への垂線の足（$H$は直線$BC$上、$\langle A-H,C-B\rangle=0$）ならば、$H,B,A$と$A,B,C$、$H,A,C$と$A,B,C$はそれぞれこの対応で相似である。
  statement_en: If A, B, C are not collinear, ∠BAC = π/2, H lies on line BC and ⟨A-H,C-B⟩ = 0, then H, B, A is similar to A, B, C and H, A, C is similar to A, B, C, in these orders.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $\angle BAC=\pi/2$
  - $H$は直線$BC$上の点
  - $\langle A-H,C-B\rangle=0$
  quantifiers:
  - 任意の4点$A,B,C,H$
  conclusion: $H,B,A$と$A,B,C$は相似であり、$H,A,C$と$A,B,C$も相似である。
  answer: |
    $A,B,C,H$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$\angle BAC=\pi/2$で、$H$は直線$BC$上にあり、$\langle A-H,C-B\rangle=0$とする。$a=BC$、$b=AC$、$c=AB$とおくと、これらは正である。
    $d=C-B$、$h=A-H$、$H-B=xd$とおく。$\angle BAC=\pi/2$と$\langle h,d\rangle=0$から、$AH^2=x(1-x)a^2$、$c^2=xa^2$、$b^2=(1-x)a^2$である。よって$0<x<1$であり、$BH=xa=c^2/a$、$HC=(1-x)a=b^2/a$である。また$(AH\cdot a)^2=x(1-x)a^4=(bc)^2$より$AH=bc/a$である。
    $r=c/a$とおくと、$HB=c^2/a=r\,AB$、$BA=c=r\,BC$、$AH=bc/a=r\,CA$である。よって$H,B,A$と$A,B,C$は相似である。$r=b/a$とおくと、$HA=bc/a=r\,AB$、$AC=b=r\,BC$、$CH=b^2/a=r\,CA$である。よって$H,A,C$と$A,B,C$は相似である。
  strategy: Compute all lengths through x, then read off the common ratios c/a and b/a.
  sketch:
  - 'setup: Put d = C-B, h = A-H, H - B = xd.'
  - 'derive: AH² = x(1-x)a², c² = xa², b² = (1-x)a², so 0 < x < 1.'
  - 'derive: BH = c²/a, HC = b²/a, AH = bc/a.'
  - 'construct: The ratio c/a works for H, B, A against A, B, C.'
  - 'construct: The ratio b/a works for H, A, C against A, B, C.'
  openmath: (forall (a b c h) (-> (and (not (collinear_points a b c)) (= (euclid_angle b a c) (/ pi 2)) (on_line h b c) (perpendicular_lines a h b c)) (and (similar_triangles h b a a b c) (similar_triangles h a c a b c))))
  hard_negative:
    statement: $H,B,A$と$A,C,B$がこの対応で相似である。
    reason: $B$は$B$自身に対応する。$H,B,A$と$A,C,B$の対応では$HB:AC=BA:CB$が必要だが、$AB=3$、$AC=4$、$BC=5$では$HB/AC=9/20$、$BA/CB=3/5$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C H : P), ¬Collinear ℝ ({A, B, C} : Set P) → EuclideanGeometry.angle B A C = Real.pi / 2 → H ∈ line[ℝ, B, C] → inner ℝ (A -ᵥ H) (C -ᵥ B) = 0 → Similar ![H, B, A] ![A, B, C] ∧ Similar ![H, A, C] ![A, B, C]
  proof: |
    by
      intro V P _ _ _ _ A B C H hABC hA hH hperp
      have core : ∃ x : ℝ, H = AffineMap.lineMap B C x ∧ dist A H ^ 2 = x * (1 - x) * dist B C ^ 2 ∧
          dist A B ^ 2 = x * dist B C ^ 2 ∧ dist A C ^ 2 = (1 - x) * dist B C ^ 2 ∧
          dist B H = |x| * dist B C ∧ dist H C = |1 - x| * dist B C := by
        obtain ⟨x, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hH
        refine ⟨x, rfl, ?_⟩
        have hdBC : dist B C = ‖C -ᵥ B‖ := by rw [dist_comm, dist_eq_norm_vsub V C B]
        rw [hdBC]
        set d : V := C -ᵥ B with hd
        set h : V := A -ᵥ AffineMap.lineMap B C x with hh
        have hBH : B -ᵥ AffineMap.lineMap B C x = (-x) • d := by
          rw [AffineMap.lineMap_apply, vsub_vadd_eq_vsub_sub, vsub_self, zero_sub, neg_smul]
        have hCH : C -ᵥ AffineMap.lineMap B C x = (1 - x) • d := by
          rw [AffineMap.lineMap_apply, vsub_vadd_eq_vsub_sub, ← hd, sub_smul, one_smul]
        have hin : inner ℝ (B -ᵥ A) (C -ᵥ A) = 0 := by
          rw [InnerProductGeometry.inner_eq_zero_iff_angle_eq_pi_div_two]; exact hA
        have e1 : B -ᵥ A = (-x) • d - h := by rw [← hBH, hh, vsub_sub_vsub_cancel_right]
        have e2 : C -ᵥ A = (1 - x) • d - h := by rw [← hCH, hh, vsub_sub_vsub_cancel_right]
        have hdh : inner ℝ d h = 0 := by rw [real_inner_comm]; exact hperp
        rw [e1, e2] at hin
        simp only [inner_sub_left, inner_sub_right, real_inner_smul_left, real_inner_smul_right, hperp, hdh,
          real_inner_self_eq_norm_sq] at hin
        have key : ‖h‖ ^ 2 = x * (1 - x) * ‖d‖ ^ 2 := by linear_combination hin
        have a1 : dist A B ^ 2 = x * ‖d‖ ^ 2 := by
          rw [dist_comm, dist_eq_norm_vsub V B A, e1, norm_sub_sq_real, real_inner_smul_left, hdh, norm_smul, key,
            Real.norm_eq_abs, mul_pow, sq_abs]
          ring
        have a2 : dist A C ^ 2 = (1 - x) * ‖d‖ ^ 2 := by
          rw [dist_comm, dist_eq_norm_vsub V C A, e2, norm_sub_sq_real, real_inner_smul_left, hdh, norm_smul, key,
            Real.norm_eq_abs, mul_pow, sq_abs]
          ring
        refine ⟨?_, a1, a2, ?_, ?_⟩
        · rw [dist_eq_norm_vsub V A, ← hh, key]
        · rw [dist_eq_norm_vsub V B, hBH, norm_smul, Real.norm_eq_abs, abs_neg]
        · rw [dist_comm, dist_eq_norm_vsub V C, hCH, norm_smul, Real.norm_eq_abs]
      obtain ⟨x, -, h0, h1, h2, h3, h4⟩ := core
      have pa : 0 < dist B C := dist_pos.mpr (ne₂₃_of_not_collinear hABC)
      have pc : 0 < dist A B := dist_pos.mpr (ne₁₂_of_not_collinear hABC)
      have pb : 0 < dist A C := dist_pos.mpr (ne₁₃_of_not_collinear hABC)
      have hp : 0 < dist B C ^ 2 := by positivity
      have hx : 0 < x := by
        by_contra hn
        nlinarith [pow_pos pc 2, not_lt.mp hn]
      have hx1 : 0 < 1 - x := by
        by_contra hn
        nlinarith [pow_pos pb 2, not_lt.mp hn]
      rw [abs_of_pos hx] at h3
      rw [abs_of_pos hx1] at h4
      have hprod : dist A H * dist B C = dist A B * dist A C := by
        refine (sq_eq_sq₀ (by positivity) (by positivity)).mp ?_
        rw [mul_pow, mul_pow, h0, h1, h2]
        ring
      constructor
      · refine similar_iff_exists_pos_dist_eq.mpr ⟨dist A B / dist B C, by positivity, fun i j => ?_⟩
        have a1 : dist H B = dist A B / dist B C * dist A B := by
          rw [dist_comm, h3]; field_simp; linarith
        have a2 : dist B A = dist A B / dist B C * dist B C := by
          rw [dist_comm]; field_simp
        have a3 : dist A H = dist A B / dist B C * dist C A := by
          rw [dist_comm C A]; field_simp; linarith
        fin_cases i <;> fin_cases j <;> simp <;> grind [dist_comm]
      · refine similar_iff_exists_pos_dist_eq.mpr ⟨dist A C / dist B C, by positivity, fun i j => ?_⟩
        have a1 : dist H A = dist A C / dist B C * dist A B := by
          rw [dist_comm]; field_simp; linarith
        have a2 : dist A C = dist A C / dist B C * dist B C := by
          field_simp
        have a3 : dist C H = dist A C / dist B C * dist C A := by
          rw [dist_comm, dist_comm C A, h4]; field_simp; linarith
        fin_cases i <;> fin_cases j <;> simp <;> grind [dist_comm]
- id: right_triangle_altitude_foot_between
  kind: gap
  level: middle
  topic: 三角形・直角三角形の垂線
  statement: 直角三角形$ABC$（$A,B,C$は同一直線上になく$\angle BAC=\pi/2$）で、$A$から直線$BC$への垂線の足$H$（$H$は直線$BC$上、$\langle A-H,C-B\rangle=0$）は、線分$BC$の内部にある。
  statement_en: If A, B, C are not collinear, ∠BAC = π/2, H lies on line BC and ⟨A-H,C-B⟩ = 0, then H lies strictly between B and C.
  assumptions:
  - $A,B,C$は同一直線上にない
  - $\angle BAC=\pi/2$
  - $H$は直線$BC$上の点
  - $\langle A-H,C-B\rangle=0$
  quantifiers:
  - 任意の4点$A,B,C,H$
  conclusion: $H$は$B$と$C$の間にあり$B,C$と異なる。
  answer: |
    $A,B,C,H$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$\angle BAC=\pi/2$で、$H$は直線$BC$上にあり、$\langle A-H,C-B\rangle=0$とする。
    $d=C-B\neq0$、$h=A-H$とおき、$H-B=xd$と書く。$\langle h,d\rangle=0$と$\langle B-A,C-A\rangle=0$の展開から$\|h\|^2=x(1-x)\|d\|^2$である。$A-B=h+xd$、$A-C=h-(1-x)d$より$AB^2=x\|d\|^2$、$AC^2=(1-x)\|d\|^2$である。$AB>0$、$AC>0$なので$x>0$かつ$1-x>0$である。したがって$0<x<1$であり、$H$は線分$BC$の内部にある。
  strategy: The parameter of H equals AB²/BC² and 1 minus it equals AC²/BC², both positive.
  sketch:
  - 'setup: Put d = C-B, h = A-H, H - B = xd.'
  - 'derive: AB² = x‖d‖² and AC² = (1-x)‖d‖².'
  - 'derive: Positivity of AB and AC gives 0 < x < 1.'
  - 'conclude: H lies strictly between B and C.'
  openmath: (forall (a b c h) (-> (and (not (collinear_points a b c)) (= (euclid_angle b a c) (/ pi 2)) (on_line h b c) (perpendicular_lines a h b c)) (strictly_between b h c)))
  hard_negative:
    statement: 任意の三角形$ABC$で、$A$から直線$BC$への垂線の足は線分$BC$の内部にある。
    reason: $\angle ABC$が鈍角なら足は$B$の外側にある。$A=(-1,1)$、$B=(0,0)$、$C=(2,0)$では足は$(-1,0)$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C H : P), ¬Collinear ℝ ({A, B, C} : Set P) → EuclideanGeometry.angle B A C = Real.pi / 2 → H ∈ line[ℝ, B, C] → inner ℝ (A -ᵥ H) (C -ᵥ B) = 0 → Sbtw ℝ B H C
  proof: |
    by
      intro V P _ _ _ _ A B C H hABC hA hH hperp
      have core : ∃ x : ℝ, H = AffineMap.lineMap B C x ∧ dist A H ^ 2 = x * (1 - x) * dist B C ^ 2 ∧
          dist A B ^ 2 = x * dist B C ^ 2 ∧ dist A C ^ 2 = (1 - x) * dist B C ^ 2 ∧
          dist B H = |x| * dist B C ∧ dist H C = |1 - x| * dist B C := by
        obtain ⟨x, rfl⟩ := mem_affineSpan_pair_iff_exists_lineMap_eq.mp hH
        refine ⟨x, rfl, ?_⟩
        have hdBC : dist B C = ‖C -ᵥ B‖ := by rw [dist_comm, dist_eq_norm_vsub V C B]
        rw [hdBC]
        set d : V := C -ᵥ B with hd
        set h : V := A -ᵥ AffineMap.lineMap B C x with hh
        have hBH : B -ᵥ AffineMap.lineMap B C x = (-x) • d := by
          rw [AffineMap.lineMap_apply, vsub_vadd_eq_vsub_sub, vsub_self, zero_sub, neg_smul]
        have hCH : C -ᵥ AffineMap.lineMap B C x = (1 - x) • d := by
          rw [AffineMap.lineMap_apply, vsub_vadd_eq_vsub_sub, ← hd, sub_smul, one_smul]
        have hin : inner ℝ (B -ᵥ A) (C -ᵥ A) = 0 := by
          rw [InnerProductGeometry.inner_eq_zero_iff_angle_eq_pi_div_two]; exact hA
        have e1 : B -ᵥ A = (-x) • d - h := by rw [← hBH, hh, vsub_sub_vsub_cancel_right]
        have e2 : C -ᵥ A = (1 - x) • d - h := by rw [← hCH, hh, vsub_sub_vsub_cancel_right]
        have hdh : inner ℝ d h = 0 := by rw [real_inner_comm]; exact hperp
        rw [e1, e2] at hin
        simp only [inner_sub_left, inner_sub_right, real_inner_smul_left, real_inner_smul_right, hperp, hdh,
          real_inner_self_eq_norm_sq] at hin
        have key : ‖h‖ ^ 2 = x * (1 - x) * ‖d‖ ^ 2 := by linear_combination hin
        have a1 : dist A B ^ 2 = x * ‖d‖ ^ 2 := by
          rw [dist_comm, dist_eq_norm_vsub V B A, e1, norm_sub_sq_real, real_inner_smul_left, hdh, norm_smul, key,
            Real.norm_eq_abs, mul_pow, sq_abs]
          ring
        have a2 : dist A C ^ 2 = (1 - x) * ‖d‖ ^ 2 := by
          rw [dist_comm, dist_eq_norm_vsub V C A, e2, norm_sub_sq_real, real_inner_smul_left, hdh, norm_smul, key,
            Real.norm_eq_abs, mul_pow, sq_abs]
          ring
        refine ⟨?_, a1, a2, ?_, ?_⟩
        · rw [dist_eq_norm_vsub V A, ← hh, key]
        · rw [dist_eq_norm_vsub V B, hBH, norm_smul, Real.norm_eq_abs, abs_neg]
        · rw [dist_comm, dist_eq_norm_vsub V C, hCH, norm_smul, Real.norm_eq_abs]
      obtain ⟨x, rfl, -, h1, h2, -, -⟩ := core
      have hBC : B ≠ C := ne₂₃_of_not_collinear hABC
      have pa : 0 < dist B C := dist_pos.mpr hBC
      have pc : 0 < dist A B := dist_pos.mpr (ne₁₂_of_not_collinear hABC)
      have pb : 0 < dist A C := dist_pos.mpr (ne₁₃_of_not_collinear hABC)
      have hp : 0 < dist B C ^ 2 := by positivity
      have hx : 0 < x := by
        by_contra hn
        nlinarith [pow_pos pc 2, not_lt.mp hn]
      have hx1 : x < 1 := by
        by_contra hn
        nlinarith [pow_pos pb 2, not_lt.mp hn]
      exact sbtw_lineMap_iff.mpr ⟨hBC, hx, hx1⟩
