  assumptions:
  - $A,B,C$は同一直線上にない
  - $C$は$B$と$D$の間にあり$B,D$と異なる
  quantifiers:
  - 任意の4点$A,B,C,D$
  conclusion: $\angle ACD=\angle ABC+\angle BAC$である。
  answer: |
    $A,B,C,D$を実内積空間上のアフィン空間の点とする。$A,B,C$は同一直線上になく、$C$は$B$と$D$の間にあって$B,D$と異なるとする。
    $B,C,D$がこの順に一直線上にあるので$\angle ACB+\angle ACD=\pi$である。内角の和より$\angle ABC+\angle BCA+\angle CAB=\pi$である。2式から$\angle ACB$を消去すると$\angle ACD=\angle ABC+\angle BAC$である。
