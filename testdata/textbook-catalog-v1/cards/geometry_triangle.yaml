  hard_negative:
    statement: $\angle BAC<\pi/2$ならば$AM<BC/2$である。
    reason: 不等号が逆である。中線定理より$\angle BAC<\pi/2$のとき$AM>BC/2$となる。正三角形では$AM=\frac{\sqrt3}{2}BC$である。
  target: |
    ∀ (V P : Type*) [NormedAddCommGroup V] [InnerProductSpace ℝ V] [MetricSpace P] [NormedAddTorsor V P] (A B C : P), EuclideanGeometry.angle B A C = Real.pi / 2 ↔ dist A (midpoint ℝ B C) = dist B C / 2
  proof: |
    by
      intro V P _ _ _ _ A B C
      have ap := EuclideanGeometry.dist_sq_add_dist_sq_eq_two_mul_dist_midpoint_sq_add_half_dist_sq A B C
      rw [← EuclideanGeometry.dist_sq_eq_dist_sq_add_dist_sq_iff_angle_eq_pi_div_two B A C, dist_comm B A, dist_comm C A]
      constructor
      · intro e
        refine (mul_self_inj dist_nonneg (by positivity)).mp ?_
        nlinarith
      · intro e
        rw [e] at ap
        nlinarith
- id: angle_acute_obtuse_iff_side_squares
  kind: gap
  level: high
  topic: 三角形・鋭角と鈍角の判定
  statement: $A\neq B$、$C\neq B$のとき、$\angle ABC<\pi/2$と$AC^2<AB^2+BC^2$は同値であり、$\angle ABC>\pi/2$と$AC^2>AB^2+BC^2$も同値である。
  statement_en: If A ≠ B and C ≠ B, then ∠ABC < π/2 iff AC² < AB² + BC², and ∠ABC > π/2 iff AC² > AB² + BC².
  assumptions:
  - $A\neq B$
  - $C\neq B$
  quantifiers:
  - 任意の3点$A,B,C$
  conclusion: $\angle ABC<\pi/2$と$AC^2<AB^2+BC^2$は同値であり、$\angle ABC>\pi/2$と$AC^2>AB^2+BC^2$は同値である。
  answer: |
