- id: stabilizer_of_translated_point
  kind: gap
  level: 2
  topic: 群作用・固定部分群の共役
  statement: 群$G$が集合$X$に作用するとき、$g,h\in G$と$x\in X$について、$h$が$gx$を固定することと$g^{-1}hg$が$x$を固定することは同値である。つまり$\mathrm{Stab}(gx)=g\,\mathrm{Stab}(x)\,g^{-1}$である。
  statement_en: For a group G acting on a set X, elements g, h of G and a point x, h fixes gx if and only if g⁻¹hg fixes x; hence Stab(gx) = g Stab(x) g⁻¹.
  assumptions:
  - $G$は群
  - $G$は集合$X$に作用する
  quantifiers:
  - 任意の$g,h\in G$
  - 任意の$x\in X$
  conclusion: $h\in\mathrm{Stab}(gx)$と$g^{-1}hg\in\mathrm{Stab}(x)$は同値である。
  answer: |
    $G$を群、$X$を$G$が作用する集合とし、$g,h\in G$、$x\in X$とする。等式$h(gx)=gx$の両辺に左から$g^{-1}$を作用させると$g^{-1}(h(gx))=x$を得る。作用の結合律より左辺は$(g^{-1}hg)x$に等しい。逆に$(g^{-1}hg)x=x$の両辺に$g$を作用させると$h(gx)=gx$に戻る。したがって$h\in\mathrm{Stab}(gx)$と$g^{-1}hg\in\mathrm{Stab}(x)$は同値であり、$\mathrm{Stab}(gx)=g\,\mathrm{Stab}(x)\,g^{-1}$である。
  strategy: Act on the fixing equation by g⁻¹ and use compatibility of the action.
  sketch:
  - 'setup: Write the condition h(gx) = gx.'
  - 'derive: Apply g⁻¹ to both sides and use compatibility to get (g⁻¹hg)x = x.'
  - 'conclude: Applying g reverses the step, so the two conditions are equivalent.'
  openmath: (forall (G X g h x) (-> (group_action G X) (<-> (in h (action_stabilizer G (group_act g x))) (in (group_mul (group_mul (group_inv g) h) g) (action_stabilizer G x)))))
  hard_negative:
    statement: 同じ軌道の2点$x,gx$の固定部分群はつねに等しい。
    reason: $S_3$の$\{1,2,3\}$への作用で、$1$の固定部分群は$\{1,(2\ 3)\}$、$2$の固定部分群は$\{1,(1\ 3)\}$であり異なる。一般には共役になるだけである。
  target: |
    ∀ (G X : Type*) [Group G] [MulAction G X] (g h : G) (x : X), h ∈ MulAction.stabilizer G (g • x) ↔ g⁻¹ * h * g ∈ MulAction.stabilizer G x
  proof: |
    by
      intro G X _ _ g h x
      rw [MulAction.mem_stabilizer_iff, MulAction.mem_stabilizer_iff, mul_smul, mul_smul, inv_smul_eq_iff]
- id: action_kernel_is_intersection_of_stabilizers
  kind: gap
  level: 2
  topic: 群作用・作用の核
  statement: 群$G$の集合$X$への作用が定める準同型$G\to\mathrm{Sym}(X)$の核は、全ての点の固定部分群の共通部分に等しい。
  statement_en: The kernel of the homomorphism from G to Sym(X) given by an action of G on X is the intersection of the stabilizers of all points of X.
  assumptions:
  - $G$は群
  - $G$は集合$X$に作用する
  quantifiers:
  - 任意の$g\in G$
  conclusion: $g$が核に入ることと、全ての$x\in X$で$g\in\mathrm{Stab}(x)$であることは同値である。
  answer: |
    $G$を群、$X$を$G$が作用する集合とし、$\rho\colon G\to\mathrm{Sym}(X)$を$\rho(g)(x)=gx$で定まる準同型とする。$g\in G$が核に入るのは、$\rho(g)$が恒等置換であるとき、すなわち全ての$x\in X$で$gx=x$であるときである。$gx=x$は$g\in\mathrm{Stab}(x)$と同じ条件である。よって$\ker\rho=\bigcap_{x\in X}\mathrm{Stab}(x)$である。
  strategy: Unfold membership in the kernel as pointwise equality of permutations.
  sketch:
  - 'translate: g is in the kernel exactly when the permutation of g is the identity.'
  - 'derive: Equality of permutations means gx = x for every x.'
  - 'conclude: This is membership in every stabilizer.'
  openmath: (forall (G X g) (-> (group_action G X) (<-> (in g (action_kernel G X)) (forall (x) (-> (in x X) (in g (action_stabilizer G x)))))))
  hard_negative:
    statement: 作用の核は1つの点の固定部分群に等しい。
    reason: $S_3$の$\{1,2,3\}$への作用では核は自明だが、$1$の固定部分群は位数$2$である。
  target: |
    ∀ (G X : Type*) [Group G] [MulAction G X] (g : G), g ∈ (MulAction.toPermHom G X).ker ↔ ∀ x : X, g ∈ MulAction.stabilizer G x
  proof: |
    by
      intro G X _ _ g
      rw [MonoidHom.mem_ker, Equiv.ext_iff]
      simp [MulAction.mem_stabilizer_iff]
- id: p_group_action_fixed_points_congruent
  kind: textbook
  level: 3
  topic: 群作用・p群の不動点
  statement: 素数$p$と自然数$n$について、位数$p^n$の群$G$が有限集合$X$に作用するとき、$|X|\equiv|X^G|\pmod p$である。ここで$X^G$は$G$の全ての元で固定される点の集合である。
  statement_en: If a group G of order p^n, with p prime, acts on a finite set X, then |X| ≡ |X^G| modulo p, where X^G is the set of points fixed by all of G.
  assumptions:
  - $p$は素数
  - $G$は位数$p^n$の群
  - $G$は有限集合$X$に作用する
  quantifiers:
  - 任意の素数$p$と自然数$n$
  conclusion: $|X|\equiv|X^G|\pmod p$である。
  answer: |
    $p$を素数、$n$を自然数、$G$を位数$p^n$の群とし、$G$が有限集合$X$に作用するとする。$X$は軌道の非交和であるから、$|X|$は軌道の大きさの和である。軌道固定部分群定理より各軌道の大きさは$|G|=p^n$の約数なので、$p$の冪である。大きさが$1$の軌道は$X^G$の点と1対1に対応し、それ以外の軌道の大きさは$p$で割り切れる。よって$|X|$から$|X^G|$を引いた値は$p$の倍数であり、$|X|\equiv|X^G|\pmod p$が成り立つ。
  strategy: Split X into orbits and observe that non-singleton orbits have size divisible by p.
  sketch:
  - 'setup: Write |X| as the sum of the orbit sizes.'
  - 'apply_theorem: By orbit-stabilizer every orbit size divides p^n.'
  - 'derive: Orbits of size 1 are exactly the points of X^G.'
  - 'derive: Every other orbit has size divisible by p.'
  - 'conclude: Reducing modulo p gives |X| ≡ |X^G|.'
  openmath: (forall (G X p n) (-> (and (group_action G X) (finite_set X) (in p P) (= (size G) (^ p n))) (= (nat_mod (size X) p) (nat_mod (size (action_common_fixed_points G X)) p))))
  hard_negative:
    statement: 位数が$p$の冪でない群の作用でも、$|X|\equiv|X^G|\pmod p$が成り立つ。
    reason: 位数$3$の巡回群が$3$点の集合に回転で作用すると不動点はなく、$p=2$で$3\not\equiv0$となる。
  target: |
    ∀ (G X : Type*) [Group G] [MulAction G X] (p n : ℕ) [Fact p.Prime] [Finite X], Nat.card G = p ^ n → Nat.card X ≡ Nat.card (MulAction.fixedPoints G X) [MOD p]
  proof: |
    by
      intro G X _ _ p n _ _ hcard
      have hG : IsPGroup p G := IsPGroup.of_card hcard
      exact hG.card_modEq_card_fixedPoints X
- id: card_eq_sum_of_orbit_sizes
  kind: gap
  level: 2
  topic: 群作用・軌道分解
  statement: 群$G$が有限集合$X$に作用するとき、$|X|$は全ての軌道の大きさの和に等しい。
  statement_en: If a group G acts on a finite set X, then |X| is the sum of the sizes of the orbits.
  assumptions:
  - $G$は群
  - $G$は有限集合$X$に作用する
  quantifiers:
  - 任意の群$G$と有限集合$X$
  conclusion: $|X|=\sum_{\omega\in X/G}|\omega|$である。
  answer: |
    $G$を群、$X$を$G$が作用する有限集合とし、$X/G$を軌道全体の集合とする。$x,y\in X$について「$y=gx$となる$g\in G$がある」という関係は、単位元、逆元、積の存在から同値関係である。その同値類が軌道なので、軌道全体は$X$の分割をなす。有限集合を互いに交わらない部分集合に分けると元の個数は各部分の個数の和になるから、$|X|=\sum_{\omega\in X/G}|\omega|$である。
  strategy: Orbits are the classes of an equivalence relation, so they partition X.
  sketch:
  - 'setup: Define x ~ y when y lies in the orbit of x.'
  - 'derive: The group axioms make this an equivalence relation whose classes are the orbits.'
  - 'conclude: Counting a partition gives the sum of the orbit sizes.'
  openmath: (forall (G X) (-> (and (group_action G X) (finite_set X)) (= (size X) (finset_sum (action_orbit_set G X) (lambda (w) (size w))))))
  hard_negative:
    statement: 群$G$が有限集合$X$に作用するとき、$|X|$は軌道の個数と$|G|$の積に等しい。
    reason: 各軌道の大きさは$|G|$とは限らない。$S_3$の$\{1,2,3\}$への作用は軌道が$1$個で$|G|=6$だが$|X|=3$である。
  target: |
    ∀ (G X : Type*) [Group G] [MulAction G X] [Fintype X] [Fintype (MulAction.orbitRel.Quotient G X)], Nat.card X = ∑ ω : MulAction.orbitRel.Quotient G X, Nat.card ω.orbit
  proof: |
    by
      intro G X _ _ _ _
      rw [Nat.card_congr (MulAction.selfEquivSigmaOrbits' G X), Nat.card_sigma]
- id: normal_core_index_dvd_factorial
  kind: textbook
  level: 3
  topic: 群作用・剰余類への作用と正規核
  statement: 群$G$の部分群$H$の指数$n$が有限なら、$H$に含まれる$G$の正規部分群$N$で、指数$[G:N]$が$n!$を割り切るものが存在する。
  statement_en: If a subgroup H of a group G has finite index n, then H contains a normal subgroup N of G whose index [G:N] divides n!.
  assumptions:
  - $G$は群
  - $H$は$G$の部分群
  - $[G:H]=n$は有限
  quantifiers:
  - 任意の群$G$とその有限指数部分群$H$
  conclusion: $N\subseteq H$かつ$[G:N]\mid n!$を満たす正規部分群$N$が存在する。
  answer: |
    $G$を群、$H$を指数$n$が有限の部分群とする。$G$は左剰余類の集合$G/H$に左からの積で作用し、準同型$\rho\colon G\to\mathrm{Sym}(G/H)$を定める。$|G/H|=n$なので$|\mathrm{Sym}(G/H)|=n!$である。$N=\ker\rho$とおくと$N$は$G$の正規部分群である。$g\in N$は剰余類$H$を固定するから$gH=H$となり、$g\in H$である。よって$N\subseteq H$である。第一同型定理より$[G:N]=|\mathrm{im}\,\rho|$であり、ラグランジュの定理より$|\mathrm{im}\,\rho|$は$n!$を割り切る。
  strategy: Take the kernel of the left multiplication action on the cosets of H.
  sketch:
  - 'construct: Let G act on the n left cosets of H, giving a homomorphism to a symmetric group of order n!.'
  - 'setup: Let N be the kernel, which is normal.'
  - 'derive: An element of N fixes the coset H, so it lies in H.'
  - 'apply_theorem: The first isomorphism theorem gives [G:N] = |im|.'
  - 'conclude: Lagrange shows that |im| divides n!.'
  openmath: (forall (G H n) (-> (and (group G) (subgroup_of H G) (= (subgroup_index H G) n) (!= n 0)) (exists (U) (and (normal_subgroup U G) (subset U H) (dvd (subgroup_index U G) (factorial n))))))
  hard_negative:
    statement: 指数$n$が有限の部分群$H$はそれ自身が正規であり、$[G:H]\mid n!$を満たす。
    reason: $S_3$の部分群$\{1,(1\ 2)\}$は指数$3$だが正規でない。正規になるのは$H$に含まれる核のほうである。
  target: |
    ∀ (G : Type*) [Group G] (H : Subgroup G) (n : ℕ), H.index = n → n ≠ 0 → ∃ N : Subgroup G, N.Normal ∧ N ≤ H ∧ N.index ∣ n.factorial
  proof: |
    by
      intro G _ H n hn hn0
      refine ⟨H.normalCore, inferInstance, H.normalCore_le, ?_⟩
      have : Finite (G ⧸ H) := by
        apply Nat.finite_of_card_ne_zero
        rw [← Subgroup.index_eq_card, hn]; exact hn0
      rw [Subgroup.normalCore_eq_ker, Subgroup.index_ker]
      have h1 := Subgroup.card_subgroup_dvd_card (MulAction.toPermHom G (G ⧸ H)).range
      rwa [Nat.card_perm, ← Subgroup.index_eq_card, hn] at h1
- id: subgroup_of_smallest_prime_index_normal
  kind: textbook
  level: 3
  topic: 群作用・最小素数指数の部分群
  statement: 有限群$G$の位数を割る最小の素数を$p$とする。指数が$p$である$G$の部分群は正規である。
  statement_en: Let p be the smallest prime dividing the order of a finite group G. Every subgroup of G of index p is normal.
  assumptions:
  - $G$は有限群
  - $p$は$|G|$を割る最小の素数
  - $H$は指数$p$の部分群
  quantifiers:
  - 任意の有限群$G$とその部分群$H$
  conclusion: $H$は$G$の正規部分群である。
  answer: |
    $G$を有限群、$p$を$|G|$を割る最小の素数、$H$を指数$p$の部分群とする。$G$の$G/H$への左からの作用の核を$N$とすると、$N$は正規部分群で$N\subseteq H$であり、$[G:N]$は$|\mathrm{Sym}(G/H)|=p!$を割り切る。$k=[H:N]$とおくと$[G:N]=pk$なので、$pk\mid p!$より$k\mid(p-1)!$である。$k>1$とし、$k$の素因数を$q$とする。$q\mid(p-1)!$より$q<p$である。一方で$k$は$|G|$を割るから$q\mid|G|$であり、$p$の最小性に反する。よって$k=1$であり、$H=N$は正規である。
  strategy: Compare the prime factors of [H:N] with p for the kernel N of the action on cosets.
  sketch:
  - 'construct: Let N be the kernel of the action of G on the p cosets of H.'
  - 'derive: Then [G:N] divides p!, and writing [G:N] = pk gives k | (p-1)!.'
  - 'contradiction: A prime factor q of k would satisfy q < p and q | |G|, against minimality of p.'
  - 'conclude: So k = 1, H = N, and H is normal.'
  openmath: (forall (G H p) (-> (and (finite_group G) (subgroup_of H G) (in p P) (dvd p (size G)) (forall (q) (-> (and (in q P) (dvd q (size G))) (<= p q))) (= (subgroup_index H G) p)) (normal_subgroup H G)))
  hard_negative:
    statement: 有限群で指数が素数である部分群は全て正規である。
    reason: $S_3$の部分群$\{1,(1\ 2)\}$の指数は素数$3$だが正規でない。$3$は$|S_3|$の最小の素因数ではない。
  target: |
    ∀ (G : Type*) [Group G] [Finite G] (H : Subgroup G) (p : ℕ), p.Prime → p ∣ Nat.card G → (∀ q : ℕ, q.Prime → q ∣ Nat.card G → p ≤ q) → H.index = p → H.Normal
  proof: |
    by
      intro G _ _ H p hp hdvd hmin hH
      have hne : Nat.card G ≠ 1 := by
        intro h; rw [h] at hdvd; exact hp.one_lt.ne' (Nat.dvd_one.mp hdvd)
      have hfac : p = (Nat.card G).minFac :=
        le_antisymm (hmin _ (Nat.minFac_prime hne) (Nat.minFac_dvd _)) (Nat.minFac_le_of_dvd hp.two_le hdvd)
      exact Subgroup.normal_of_index_eq_minFac_card (hH.trans hfac)
- id: order_of_conjugate_and_swapped_product
  kind: gap
  level: 2
  topic: 群論・元の位数と共役
  statement: 群$G$の元$a,b$について、$bab^{-1}$と$a$の位数は等しく、$ab$と$ba$の位数も等しい。どちらの等式も無限位数の場合を含む。
  statement_en: For elements a, b of a group, bab⁻¹ and a have the same order, and ab and ba have the same order, including the case of infinite order.
  assumptions:
  - $G$は群
  - $a,b\in G$
  quantifiers:
  - 任意の$a,b\in G$
  conclusion: $\mathrm{ord}(bab^{-1})=\mathrm{ord}(a)$かつ$\mathrm{ord}(ab)=\mathrm{ord}(ba)$である。
  answer: |
    $G$を群、$a,b\in G$とする。正の整数$n$について$(bab^{-1})^n=ba^nb^{-1}$であり、これが単位元になるのは$a^n=1$のときに限る。したがって$(bab^{-1})^n=1$となる$n$の集合と$a^n=1$となる$n$の集合は一致し、両者の位数は等しい。その集合が空なら両者とも無限位数である。次に$ab=a(ba)a^{-1}$であるから、$ab$は$ba$の共役である。前半を適用すると$ab$と$ba$の位数は等しい。
  strategy: Conjugation preserves the set of exponents killing an element, and ab is a conjugate of ba.
  sketch:
  - 'derive: Compute (bab⁻¹)^n = b a^n b⁻¹.'
  - 'translate: So the exponents n killing bab⁻¹ and a coincide.'
  - 'derive: Write ab = a(ba)a⁻¹.'
  - 'conclude: Apply the conjugation claim to ba.'
  openmath: (forall (G a b) (-> (and (group G) (in a G) (in b G)) (and (= (element_order (group_mul (group_mul b a) (group_inv b))) (element_order a)) (= (element_order (group_mul a b)) (element_order (group_mul b a))))))
  hard_negative:
    statement: 群の元$a,b$について、$ab$の位数は$a$の位数と$b$の位数の積である。
    reason: 位数$2$の巡回群の生成元$a$で$b=a$とすると、$ab$は単位元で位数$1$だが、位数の積は$4$である。
  target: |
    ∀ (G : Type*) [Group G] (a b : G), orderOf (b * a * b⁻¹) = orderOf a ∧ orderOf (a * b) = orderOf (b * a)
  proof: |
    by
      intro G _ a b
      have key : ∀ x y : G, orderOf (y * x * y⁻¹) = orderOf x := by
        intro x y
        have := orderOf_injective (MulAut.conj y).toMonoidHom (MulAut.conj y).injective x
        simpa [MulAut.conj_apply] using this
      refine ⟨key a b, ?_⟩
      have := key (b * a) a
      rw [show a * (b * a) * a⁻¹ = a * b by group] at this
      exact this
- id: order_of_hom_image_dvd
  kind: gap
  level: 2
  topic: 群論・準同型と元の位数
  statement: 群準同型$f\colon G\to H$と有限位数の元$g\in G$について、$f(g)$の位数は$g$の位数を割り切る。
  statement_en: For a group homomorphism f from G to H and an element g of finite order, the order of f(g) divides the order of g.
  assumptions:
  - $f\colon G\to H$は群準同型
  - $g\in G$の位数は有限
  quantifiers:
  - 任意の群準同型$f$と有限位数の元$g$
  conclusion: $\mathrm{ord}(f(g))\mid\mathrm{ord}(g)$である。
  answer: |
    $f\colon G\to H$を群準同型、$g\in G$を位数$m$が有限の元とする。$f$は積を保つから$f(g)^m=f(g^m)=f(1)=1$である。位数$k$の元$x$で$x^m=1$なら、$m$を$k$で割った余りを$r$として$x^r=1$、$0\leq r<k$となり、位数の最小性から$r=0$である。これを$x=f(g)$に適用すると、$f(g)$の位数は$m$を割り切る。
  strategy: A homomorphism sends the relation g^m = 1 to f(g)^m = 1.
  sketch:
  - 'derive: f(g)^m = f(g^m) = 1 for m the order of g.'
  - 'derive: Division with remainder shows the order of any element killing by m divides m.'
  - 'conclude: Hence the order of f(g) divides m.'
  openmath: (forall (G H f g) (-> (and (group_hom f G H) (in g G) (finite_order_element g)) (dvd (element_order (fn_value f g)) (element_order g))))
  hard_negative:
    statement: 群準同型$f$について、$f(g)$の位数は$g$の位数に等しい。
    reason: $f$が全ての元を単位元に送るとき、位数$2$の元の像の位数は$1$である。等号には単射性が必要である。
  target: |
    ∀ (G H : Type*) [Group G] [Group H] (f : G →* H) (g : G), IsOfFinOrder g → orderOf (f g) ∣ orderOf g
  proof: |
    by
      intro G H _ _ f g _
      exact orderOf_map_dvd f g
- id: order_eq_prime_power_criterion
  kind: gap
  level: 2
  topic: 群論・素数冪の位数判定
  statement: 素数$p$と自然数$n$と群の元$g$について、$g^{p^{n+1}}=1$かつ$g^{p^n}\neq1$なら、$g$の位数は$p^{n+1}$である。
  statement_en: For a prime p, a natural number n and a group element g, if g^(p^(n+1)) = 1 and g^(p^n) ≠ 1, then g has order p^(n+1).
  assumptions:
  - $p$は素数
  - $g^{p^{n+1}}=1$
  - $g^{p^n}\neq1$
  quantifiers:
  - 任意の素数$p$、自然数$n$、群の元$g$
  conclusion: $\mathrm{ord}(g)=p^{n+1}$である。
  answer: |
    $p$を素数、$n$を自然数、$g$を群の元とし、$g^{p^{n+1}}=1$かつ$g^{p^n}\neq1$とする。第1の式より$g$の位数は有限で$p^{n+1}$を割り切るから、ある$0\leq k\leq n+1$で$p^k$と書ける。$k\leq n$なら$p^k\mid p^n$なので$g^{p^n}=1$となり、第2の式に反する。よって$k=n+1$であり、$g$の位数は$p^{n+1}$である。
  strategy: The order divides a prime power, so it is a smaller prime power unless the top exponent occurs.
  sketch:
  - 'derive: The order divides p^(n+1), so it equals p^k with k ≤ n+1.'
  - 'contradiction: If k ≤ n, then g^(p^n) = 1, against the hypothesis.'
  - 'conclude: So k = n+1.'
  openmath: (forall (G g p n) (-> (and (group G) (in g G) (in p P) (= (group_pow g (^ p (+ n 1))) (group_identity G)) (!= (group_pow g (^ p n)) (group_identity G))) (= (element_order g) (^ p (+ n 1)))))
  hard_negative:
    statement: $g^{p^{n+1}}=1$かつ$g\neq1$なら、$g$の位数は$p^{n+1}$である。
    reason: 位数$p$の元$g$と$n=1$では$g^{p^2}=1$かつ$g\neq1$だが、位数は$p^2$でない。$g^{p^n}\neq1$が必要である。
  target: |
    ∀ (G : Type*) [Group G] (g : G) (p n : ℕ), p.Prime → g ^ p ^ (n + 1) = 1 → g ^ p ^ n ≠ 1 → orderOf g = p ^ (n + 1)
  proof: |
    by
      intro G _ g p n hp h1 h2
      have : Fact p.Prime := ⟨hp⟩
      exact orderOf_eq_prime_pow h2 h1
- id: order_in_direct_product_is_lcm
  kind: gap
  level: 2
  topic: 群論・直積の元の位数
  statement: 群$G,H$の有限位数の元$a,b$について、直積$G\times H$の元$(a,b)$の位数は$a$の位数と$b$の位数の最小公倍数である。
  statement_en: For elements a and b of finite order in groups G and H, the order of (a, b) in G × H is the least common multiple of the orders of a and b.
  assumptions:
  - $G,H$は群
  - $a\in G$と$b\in H$の位数は有限
  quantifiers:
  - 任意の有限位数の元$a,b$
  conclusion: $\mathrm{ord}((a,b))=\mathrm{lcm}(\mathrm{ord}(a),\mathrm{ord}(b))$である。
  answer: |
    $G,H$を群、$a\in G$、$b\in H$を位数有限の元とする。正の整数$n$について$(a,b)^n=(a^n,b^n)$であるから、$(a,b)^n$が単位元になるのは$a^n=1$かつ$b^n=1$のとき、すなわち$\mathrm{ord}(a)\mid n$かつ$\mathrm{ord}(b)\mid n$のときである。これは$\mathrm{lcm}(\mathrm{ord}(a),\mathrm{ord}(b))\mid n$と同値である。そのような正の$n$の最小値は最小公倍数そのものなので、主張が従う。
  strategy: Powers are computed componentwise, and common multiples are the multiples of the lcm.
  sketch:
  - 'derive: (a,b)^n = (a^n, b^n).'
  - 'translate: This is the identity exactly when both orders divide n.'
  - 'conclude: The least such positive n is the lcm of the orders.'
  openmath: (forall (G H a b) (-> (and (group G) (group H) (in a G) (in b H) (finite_order_element a) (finite_order_element b)) (= (element_order (ordered_pair a b)) (lcm (element_order a) (element_order b)))))
  hard_negative:
    statement: 直積の元$(a,b)$の位数は$a$の位数と$b$の位数の積である。
    reason: 位数$2$の巡回群の生成元$a$について、$(a,a)$の位数は$2$であり積の$4$ではない。積と一致するのは位数が互いに素なときである。
  target: |
    ∀ (G H : Type*) [Group G] [Group H] (a : G) (b : H), IsOfFinOrder a → IsOfFinOrder b → orderOf (a, b) = Nat.lcm (orderOf a) (orderOf b)
  proof: |
    by
      intro G H _ _ a b _ _
      exact Prod.orderOf (a, b)
- id: finite_abelian_element_order_divisible_by_all
  kind: textbook
  level: 3
  topic: 群論・有限アーベル群の位数最大の元
  statement: 有限アーベル群$G$には、全ての元$h$の位数を割り切る位数をもつ元$g$が存在する。
  statement_en: A finite abelian group G has an element g whose order is divisible by the order of every element h of G.
  assumptions:
  - $G$は有限アーベル群
  quantifiers:
  - 任意の有限アーベル群$G$
  conclusion: 全ての$h\in G$で$\mathrm{ord}(h)\mid\mathrm{ord}(g)$となる$g\in G$が存在する。
  answer: |
    $G$を有限アーベル群とし、$g$を位数$m$が最大の元とする。ある$h\in G$の位数$k$が$m$を割り切らないと仮定する。ある素数$q$が存在して、$k$における$q$の指数$b$は$m$における$q$の指数$a$より大きい。$m=q^am'$、$k=q^bk'$（$q\nmid m'$、$q\nmid k'$）と書く。$g^{q^a}$の位数は$m'$であり、$h^{k'}$の位数は$q^b$である。この2つの位数は互いに素で、$G$はアーベル群だから2元は可換であり、積の位数は$m'q^b$になる。$b>a$より$m'q^b>m$となり、$m$の最大性に反する。よって全ての元の位数は$m$を割り切る。
  strategy: If a maximal order fails to absorb some order, build a larger order from coprime parts.
  sketch:
  - 'setup: Take g of maximal order m and suppose ord(h) = k does not divide m.'
  - 'derive: Choose a prime q with larger exponent b in k than exponent a in m.'
  - 'construct: Form g^(q^a) of order m'' and h^(k'') of order q^b, which are coprime.'
  - 'apply_theorem: Commuting elements of coprime orders have product of order m''q^b.'
  - 'contradiction: m''q^b exceeds m.'
  openmath: (forall (G) (-> (and (finite_group G) (abelian_group G)) (exists (g) (and (in g G) (forall (h) (-> (in h G) (dvd (element_order h) (element_order g))))))))
  hard_negative:
    statement: 有限群には全ての元の位数で割り切れる位数の元が存在する。
    reason: $S_3$の元の位数は$1,2,3$であり、位数$6$の元がない。アーベル性が必要である。
  target: |
    ∀ (G : Type*) [CommGroup G] [Finite G], ∃ g : G, ∀ h : G, orderOf h ∣ orderOf g
  proof: |
    by
      intro G _ _
      obtain ⟨g, hg⟩ := Monoid.exists_orderOf_eq_exponent (G := G) (Monoid.ExponentExists.of_finite)
      exact ⟨g, fun h => hg ▸ Monoid.order_dvd_exponent h⟩
- id: finite_group_cyclic_of_few_roots
  kind: textbook
  level: 3
  topic: 群論・巡回群の判定
  statement: 有限群$G$で、全ての正の整数$n$について$x^n=1$の解が$G$に高々$n$個しかないなら、$G$は巡回群である。
  statement_en: If a finite group G has at most n solutions of x^n = 1 for every positive integer n, then G is cyclic.
  assumptions:
  - $G$は有限群
  - 全ての正の整数$n$で$|\{x\in G\mid x^n=1\}|\leq n$
  quantifiers:
  - 任意の有限群$G$
  conclusion: $G$は巡回群である。
  answer: |
    $G$を有限群とし、全ての正の整数$n$で$x^n=1$の解が高々$n$個であるとする。$N=|G|$とおき、$d\mid N$について位数$d$の元の個数を$\psi(d)$とする。位数$d$の元$a$が存在すれば、$\langle a\rangle$の$d$個の元は全て$x^d=1$を満たすから、仮定より$x^d=1$の解は$\langle a\rangle$の元に限る。位数$d$の元は$\langle a\rangle$の生成元であるから$\psi(d)=\varphi(d)$である。よって各$d$で$\psi(d)\leq\varphi(d)$である。ラグランジュの定理より全ての元の位数は$N$の約数なので$\sum_{d\mid N}\psi(d)=N$であり、$\sum_{d\mid N}\varphi(d)=N$と比べると全ての$d$で$\psi(d)=\varphi(d)$である。特に$\psi(N)=\varphi(N)\geq1$であり、位数$N$の元が$G$を生成する。
  strategy: Count elements by order and compare with the totient sum over divisors.
  sketch:
  - 'setup: Let ψ(d) be the number of elements of order d for d dividing N = |G|.'
  - 'derive: If an element a of order d exists, the solutions of x^d = 1 are exactly ⟨a⟩, so ψ(d) = φ(d).'
  - 'derive: Thus ψ(d) ≤ φ(d) for every d.'
  - 'apply_theorem: The sums of ψ and of φ over divisors of N both equal N.'
  - 'conclude: ψ(N) = φ(N) ≥ 1 gives a generator.'
  openmath: (forall (G) (-> (and (finite_group G) (forall (n) (-> (> n 0) (<= (size (power_root_set G n)) n)))) (cyclic_group G)))
  hard_negative:
    statement: 有限群で$x^2=1$の解が高々$2$個なら巡回群である。
    reason: 位数$3$の巡回群2個の直積では$x^2=1$の解は単位元だけだが、巡回群でない。全ての$n$で条件が必要である。
  target: |
    ∀ (G : Type*) [Group G] [Fintype G] [DecidableEq G], (∀ n : ℕ, 0 < n → (Finset.univ.filter fun x : G => x ^ n = 1).card ≤ n) → IsCyclic G
  proof: |
    by
      intro G _ _ _ h
      exact isCyclic_of_card_pow_eq_one_le h
- id: conjugate_of_transposition
  kind: gap
  level: 2
  topic: 置換・互換の共役
  statement: 集合$X$の置換$\sigma$と$a,b\in X$について、$\sigma\,(a\ b)\,\sigma^{-1}=(\sigma(a)\ \sigma(b))$である。ここで$(a\ a)$は恒等置換とする。
  statement_en: For a permutation σ of a set X and points a, b of X, σ (a b) σ⁻¹ = (σ(a) σ(b)), where (a a) denotes the identity.
  assumptions:
  - $\sigma$は集合$X$の置換
  - $a,b\in X$
  quantifiers:
  - 任意の置換$\sigma$と$a,b\in X$
  conclusion: $\sigma\,(a\ b)\,\sigma^{-1}=(\sigma(a)\ \sigma(b))$である。
  answer: |
    $X$を集合、$\sigma$を$X$の置換、$a,b\in X$とする。$\tau=\sigma\,(a\ b)\,\sigma^{-1}$の$x\in X$での値を調べる。$x=\sigma(a)$なら$\tau(x)=\sigma((a\ b)(a))=\sigma(b)$であり、同様に$x=\sigma(b)$なら$\tau(x)=\sigma(a)$である。$x$がそのどちらでもないとき、$\sigma^{-1}(x)$は$a$とも$b$とも異なるので$(a\ b)$で固定され、$\tau(x)=\sigma(\sigma^{-1}(x))=x$である。これは$(\sigma(a)\ \sigma(b))$の作用と一致する。
  strategy: Compare both permutations pointwise, separating σ(a), σ(b) and the other points.
  sketch:
  - 'case_split: Treat x = σ(a), x = σ(b) and the remaining points.'
  - 'derive: On the first two, the conjugate exchanges σ(a) and σ(b).'
  - 'derive: Otherwise σ⁻¹(x) is fixed by (a b), so x is fixed.'
  - 'conclude: The two permutations agree everywhere.'
  openmath: (forall (X s a b) (-> (and (in s (permutation_set X)) (in a X) (in b X)) (= (group_mul (group_mul s (transposition_of a b)) (group_inv s)) (transposition_of (fn_value s a) (fn_value s b)))))
  hard_negative:
    statement: 置換$\sigma$による共役で互換は変わらない。つまり$\sigma\,(a\ b)\,\sigma^{-1}=(a\ b)$である。
    reason: $\sigma=(1\ 3)$、$(a\ b)=(1\ 2)$なら共役は$(3\ 2)$である。
  target: |
    ∀ (X : Type*) [DecidableEq X] (σ : Equiv.Perm X) (a b : X), σ * Equiv.swap a b * σ⁻¹ = Equiv.swap (σ a) (σ b)
  proof: |
    by
      intro X _ σ a b
      ext x
      simp only [Equiv.Perm.mul_apply]
      by_cases h1 : x = σ a
      · subst h1; simp
      by_cases h2 : x = σ b
      · subst h2; simp
      have h3 : σ⁻¹ x ≠ a := fun h => h1 (by rw [← h]; simp)
      have h4 : σ⁻¹ x ≠ b := fun h => h2 (by rw [← h]; simp)
      rw [Equiv.swap_apply_of_ne_of_ne h3 h4, Equiv.swap_apply_of_ne_of_ne h1 h2]
      simp
- id: transposition_count_parity_invariant
  kind: gap
  level: 2
  topic: 置換・互換の個数の偶奇
  statement: 有限集合の置換を互換の積に2通りに表すと、互換の個数の偶奇は一致する。
  statement_en: If a permutation of a finite set is written in two ways as a product of transpositions, the numbers of transpositions have the same parity.
  assumptions:
  - $X$は有限集合
  - $l,m$は$X$の互換の列
  - $l$の積と$m$の積は等しい
  quantifiers:
  - 任意の互換の列$l,m$
  conclusion: 列の長さについて$|l|\equiv|m|\pmod 2$である。
  answer: |
    $X$を有限集合とし、$l,m$を$X$の互換の列で積が等しいものとする。互換とは$X$の相異なる2点を入れ替える置換である。$|X|\leq1$なら互換はなく、$l,m$はともに空なので$|l|=|m|=0$である。以下$|X|\geq2$とし、$X=\{1,\dots,n\}$と番号を付ける。置換$\sigma$に対して有理数$\varepsilon(\sigma)=\prod_{\{i,j\}}\frac{\sigma(i)-\sigma(j)}{i-j}$を定める。積は相異なる2点の組$\{i,j\}$全体にわたり、各因子は$i,j$を入れ替えても変わらない。置換$\sigma,\rho$について$\varepsilon(\sigma\rho)=\prod_{\{i,j\}}\frac{\sigma(\rho(i))-\sigma(\rho(j))}{\rho(i)-\rho(j)}\cdot\prod_{\{i,j\}}\frac{\rho(i)-\rho(j)}{i-j}$である。$\rho$は組$\{i,j\}$全体を並べ替えるから第1の積は$\varepsilon(\sigma)$に等しく、$\varepsilon(\sigma\rho)=\varepsilon(\sigma)\varepsilon(\rho)$が成り立つ。

    次に$\varepsilon((1\ 2))=-1$を示す。組$\{1,2\}$の因子は$\frac{2-1}{1-2}=-1$である。$k\geq3$について組$\{1,k\},\{2,k\}$の因子の積は$\frac{2-k}{1-k}\cdot\frac{1-k}{2-k}=1$である。残りの組の因子は$1$である。互換$(a\ b)$については$\rho(1)=a$、$\rho(2)=b$を満たす置換$\rho$をとると$(a\ b)=\rho\,(1\ 2)\,\rho^{-1}$であるから、$\varepsilon((a\ b))=\varepsilon(\rho)\cdot(-1)\cdot\varepsilon(\rho^{-1})=-\varepsilon(\rho\rho^{-1})=-1$である。

    よって$l$の積の$\varepsilon$の値は$(-1)^{|l|}$、$m$の積の値は$(-1)^{|m|}$である。積が等しいので$(-1)^{|l|}=(-1)^{|m|}$であり、$|l|$と$|m|$の偶奇は一致する。
  strategy: Define the sign as a product over unordered pairs, show it is multiplicative with value -1 on transpositions, and apply it to both products.
  sketch:
  - 'construct: Number X and let ε(σ) be the product of (σ(i)-σ(j))/(i-j) over unordered pairs {i,j}.'
  - 'derive: Each permutation permutes the pairs, so ε(σρ) = ε(σ)ε(ρ).'
  - 'derive: A direct computation gives ε((1 2)) = -1.'
  - 'derive: Every transposition is a conjugate of (1 2), so ε takes the value -1 on it.'
  - 'conclude: The two products have values (-1)^|l| and (-1)^|m|, so equal products force equal parity.'
  openmath: (forall (X l m) (-> (and (finite_set X) (list_of_transpositions l X) (list_of_transpositions m X) (= (list_product l) (list_product m))) (= (nat_mod (list_length l) 2) (nat_mod (list_length m) 2))))
  hard_negative:
    statement: 同じ置換を互換の積に表すとき、互換の個数そのものは表し方によらない。
    reason: 恒等置換は空の積でも$(1\ 2)(1\ 2)$でも表せて、個数は$0$と$2$である。保たれるのは偶奇だけである。
  target: |
    ∀ (X : Type*) [DecidableEq X] [Fintype X] (l m : List (Equiv.Perm X)), (∀ g ∈ l, g.IsSwap) → (∀ g ∈ m, g.IsSwap) → l.prod = m.prod → (l.length ≡ m.length [MOD 2])
  proof: |
    by
      intro X _ _ l m hl hm h
      have h1 := Equiv.Perm.sign_prod_list_swap hl
      have h2 := Equiv.Perm.sign_prod_list_swap hm
      rw [h, h2] at h1
      rcases Nat.even_or_odd l.length with hE | hO <;> rcases Nat.even_or_odd m.length with hE' | hO'
      · exact (Nat.even_iff.mp hE).trans (Nat.even_iff.mp hE').symm
      · rw [hE.neg_one_pow, hO'.neg_one_pow] at h1; exact absurd h1 (by decide)
      · rw [hO.neg_one_pow, hE'.neg_one_pow] at h1; exact absurd h1 (by decide)
      · exact (Nat.odd_iff.mp hO).trans (Nat.odd_iff.mp hO').symm
- id: perm_conjugate_iff_same_cycle_type
  kind: textbook
  level: 2
  topic: 置換・共役と巡回型
  statement: 有限集合の置換$\sigma,\tau$について、$\tau=\rho\sigma\rho^{-1}$となる置換$\rho$が存在することと、$\sigma,\tau$の巡回型が等しいことは同値である。巡回型とは互いに素な巡回置換への分解に現れる長さ$2$以上の巡回置換の長さの多重集合である。
  statement_en: Permutations σ and τ of a finite set are conjugate if and only if they have the same cycle type, the multiset of lengths at least 2 of the cycles in the disjoint cycle decomposition.
  assumptions:
  - $X$は有限集合
  - $\sigma,\tau$は$X$の置換
  quantifiers:
  - 任意の置換$\sigma,\tau$
  conclusion: $\sigma$と$\tau$が共役であることと巡回型が等しいことは同値である。
  answer: |
    $X$を有限集合、$\sigma,\tau$を$X$の置換とする。まず$\tau=\rho\sigma\rho^{-1}$とする。巡回置換$(a_1\ \dots\ a_k)$について$\rho(a_1\ \dots\ a_k)\rho^{-1}=(\rho(a_1)\ \dots\ \rho(a_k))$である。実際、点$\rho(a_i)$での左辺の値は$\rho(a_{i+1})$（添字は$k$を法とする）であり、どの$\rho(a_i)$でもない点$x$では$\rho^{-1}(x)$が巡回置換で固定されるので値は$x$である。これを$\sigma$の分解の各因子に適用すると、互いに素な巡回置換の分解で長さが同じものが得られるから、巡回型は等しい。逆に巡回型が等しいとする。$\sigma,\tau$の不動点は長さ$1$の巡回置換とみなす。$|X|$が共通なので不動点の個数も等しく、$\sigma$の巡回置換と$\tau$の巡回置換を長さが同じものどうし1対1に対応させられる。対応する巡回置換$(a_1\ \dots\ a_k)$と$(b_1\ \dots\ b_k)$について$\rho(a_i)=b_i$と定めると、$\rho$は$X$の置換であり、上の公式から$\rho\sigma\rho^{-1}=\tau$となる。
  strategy: Conjugation relabels the entries of cycles, and a matching of equal-length cycles defines the conjugator.
  sketch:
  - 'derive: ρ(a_1 ... a_k)ρ⁻¹ = (ρ(a_1) ... ρ(a_k)).'
  - 'conclude: Conjugate permutations therefore have the same cycle type.'
  - 'setup: Conversely, include fixed points as cycles of length 1 and match cycles of equal length.'
  - 'construct: Define ρ by sending the entries of each cycle of σ to those of the matched cycle of τ.'
  - 'conclude: Then ρσρ⁻¹ = τ.'
  openmath: (forall (X s t) (-> (and (finite_set X) (in s (symmetric_group X)) (in t (symmetric_group X))) (<-> (exists (r) (and (in r (symmetric_group X)) (= t (group_mul (group_mul r s) (group_inv r))))) (= (cycle_type s) (cycle_type t)))))
  hard_negative:
    statement: 有限集合の置換で位数が等しいものは共役である。
    reason: $S_4$の$(1\ 2)$と$(1\ 2)(3\ 4)$は位数$2$だが、巡回型が異なるので共役でない。
  target: |
    ∀ (X : Type*) [DecidableEq X] [Fintype X] (σ τ : Equiv.Perm X), (∃ ρ : Equiv.Perm X, τ = ρ * σ * ρ⁻¹) ↔ σ.cycleType = τ.cycleType
  proof: |
    by
      intro X _ _ σ τ
      rw [← Equiv.Perm.isConj_iff_cycleType_eq, isConj_iff]
      constructor
      · rintro ⟨ρ, rfl⟩; exact ⟨ρ, rfl⟩
      · rintro ⟨ρ, rfl⟩; exact ⟨ρ, rfl⟩
- id: perm_order_is_lcm_of_cycle_lengths
  kind: textbook
  level: 2
  topic: 置換・位数と巡回型
  statement: 有限集合の置換$\sigma$の位数は、$\sigma$の互いに素な巡回置換への分解に現れる巡回置換の長さの最小公倍数である。恒等置換の場合、この値は$1$とする。
  statement_en: The order of a permutation of a finite set is the least common multiple of the lengths of the cycles in its disjoint cycle decomposition, with value 1 for the identity.
  assumptions:
  - $X$は有限集合
  - $\sigma$は$X$の置換
  quantifiers:
  - 任意の置換$\sigma$
  conclusion: $\mathrm{ord}(\sigma)$は巡回置換の長さの最小公倍数である。
  answer: |
    $X$を有限集合、$\sigma$を$X$の置換とし、$\sigma=c_1\cdots c_r$を互いに素な巡回置換への分解、$c_i$の長さを$\ell_i$とする。互いに素な置換は可換だから、$\sigma^n=c_1^n\cdots c_r^n$である。$c_i^n$は$c_i$の台の外の点を固定し、台の中の点を台の中に写す。台は互いに交わらない。よって$\sigma^n=1$は全ての$i$で$c_i^n=1$であることと同値である。長さ$\ell_i$の巡回置換の位数は$\ell_i$だから、これは全ての$i$で$\ell_i\mid n$と同値であり、$\mathrm{lcm}(\ell_1,\dots,\ell_r)\mid n$と同値である。したがって$\sigma$の位数は$\mathrm{lcm}(\ell_1,\dots,\ell_r)$である。$r=0$なら$\sigma$は恒等置換で位数は$1$である。
  strategy: Disjoint cycles commute and act on separate supports, so a power vanishes exactly when each factor does.
  sketch:
  - 'setup: Decompose σ = c_1...c_r into disjoint cycles of lengths ℓ_i.'
  - 'derive: Commutativity gives σ^n = c_1^n...c_r^n.'
  - 'derive: Disjoint supports give σ^n = 1 exactly when each c_i^n = 1.'
  - 'translate: This means ℓ_i divides n for every i.'
  - 'conclude: The order is the lcm of the ℓ_i.'
  openmath: (forall (X s) (-> (and (finite_set X) (in s (symmetric_group X))) (= (element_order s) (multiset_lcm (cycle_type s)))))
  hard_negative:
    statement: 置換の位数は巡回置換の長さの積である。
    reason: $(1\ 2)(3\ 4)$の位数は$2$であり、長さの積は$4$である。
  target: |
    ∀ (X : Type*) [DecidableEq X] [Fintype X] (σ : Equiv.Perm X), orderOf σ = σ.cycleType.lcm
  proof: |
    by
      intro X _ _ σ
      exact (Equiv.Perm.lcm_cycleType σ).symm
- id: perm_disjoint_cycle_decomposition
  kind: textbook
  level: 2
  topic: 置換・巡回置換への分解
  statement: 有限集合の全ての置換は、互いに素な巡回置換の有限個の積である。恒等置換は空の積とする。
  statement_en: Every permutation of a finite set is a finite product of pairwise disjoint cycles, the identity being the empty product.
  assumptions:
  - $X$は有限集合
  - $\sigma$は$X$の置換
  quantifiers:
  - 任意の置換$\sigma$
  conclusion: 積が$\sigma$であり、各因子が巡回置換で、因子どうしが互いに素な列が存在する。
  answer: |
    $X$を有限集合、$\sigma$を$X$の置換とする。$\langle\sigma\rangle$の$X$への作用の軌道で大きさが$2$以上のものを$O_1,\dots,O_r$とする。$a\in O_i$をとると、$\sigma$は有限位数なので$O_i=\{a,\sigma(a),\dots,\sigma^{k-1}(a)\}$（$k=|O_i|$）であり、$\sigma^k(a)=a$である。$O_i$上で$\sigma$と等しく$O_i$の外で恒等である写像を$c_i$とすると、$c_i$は長さ$k$の巡回置換である。軌道は互いに交わらないから$c_1,\dots,c_r$は互いに素である。任意の$x\in X$は高々1つの$O_i$に属し、$O_i$に属さない点は$\sigma$の不動点である。よって$c_1\cdots c_r$は全ての点で$\sigma$と同じ値をとり、$\sigma=c_1\cdots c_r$である。
  strategy: Restrict σ to each nontrivial orbit of the cyclic group it generates.
  sketch:
  - 'setup: Take the orbits of ⟨σ⟩ of size at least 2.'
  - 'derive: Each orbit has the form a, σ(a), ..., σ^(k-1)(a).'
  - 'construct: Let c_i equal σ on the i-th orbit and the identity elsewhere.'
  - 'derive: The c_i are cycles with disjoint supports.'
  - 'conclude: Their product agrees with σ at every point.'
  openmath: (forall (X s) (-> (and (finite_set X) (in s (symmetric_group X))) (exists (l) (and (= (list_product l) s) (list_of_cycles l X) (pairwise_disjoint_permutations l)))))
  hard_negative:
    statement: 互いに素な巡回置換への分解は、因子の順序まで含めて一意である。
    reason: $(1\ 2)(3\ 4)=(3\ 4)(1\ 2)$である。一意なのは因子の集合だけである。
  target: |
    ∀ (X : Type*) [DecidableEq X] [Fintype X] (σ : Equiv.Perm X), ∃ l : List (Equiv.Perm X), l.prod = σ ∧ (∀ g ∈ l, g.IsCycle) ∧ l.Pairwise Equiv.Perm.Disjoint
  proof: |
    by
      intro X _ _ σ
      exact ⟨_, (Equiv.Perm.truncCycleFactors σ).out.2⟩
- id: join_with_normal_subgroup_is_product
  kind: gap
  level: 2
  topic: 群論・正規部分群との積
  statement: 群$G$の部分群$H$と正規部分群$N$について、$H\cup N$が生成する部分群の元は$hn$（$h\in H$、$n\in N$）の形の元に限る。つまり積集合$HN$は部分群である。
  statement_en: For a subgroup H and a normal subgroup N of a group G, an element lies in the subgroup generated by H and N if and only if it has the form hn with h in H and n in N; in other words the product set HN is a subgroup.
  assumptions:
  - $G$は群
  - $H$は$G$の部分群
  - $N$は$G$の正規部分群
  quantifiers:
  - 任意の$x\in G$
  conclusion: $x\in\langle H\cup N\rangle$と、$x=hn$となる$h\in H$、$n\in N$の存在は同値である。
  answer: |
    $G$を群、$H$を部分群、$N$を正規部分群とし、$S=\{hn\mid h\in H,\ n\in N\}$とおく。$1=1\cdot1\in S$である。$h,h'\in H$、$n,n'\in N$について、$(hn)(h'n')=(hh')\bigl((h')^{-1}nh'\bigr)n'$であり、$N$の正規性より$(h')^{-1}nh'\in N$だから積は$S$に入る。また$(hn)^{-1}=n^{-1}h^{-1}=h^{-1}(hn^{-1}h^{-1})$であり、$hn^{-1}h^{-1}\in N$だから逆元も$S$に入る。よって$S$は部分群である。$S$は$H$と$N$を含むので$\langle H\cup N\rangle\subseteq S$である。逆に$hn$は$H$と$N$を含む任意の部分群に入るので、$S\subseteq\langle H\cup N\rangle$である。
  strategy: Check that HN is closed under products and inverses by moving elements of N past elements of H.
  sketch:
  - 'setup: Let S be the set of products hn.'
  - 'derive: (hn)(h''n'') = (hh'')((h'')⁻¹nh'')n'' lies in S because N is normal.'
  - 'derive: (hn)⁻¹ = h⁻¹(hn⁻¹h⁻¹) lies in S for the same reason.'
  - 'derive: So S is a subgroup containing H and N.'
  - 'conclude: Any subgroup containing H and N contains S, so S is the generated subgroup.'
  openmath: (forall (G H U x) (-> (and (subgroup_of H G) (normal_subgroup U G)) (<-> (in x (subgroup_join H U)) (exists (h n) (and (in h H) (in n U) (= (group_mul h n) x))))))
  hard_negative:
    statement: 群の2つの部分群$H,K$の積集合$HK$はつねに部分群である。
    reason: $S_3$で$H=\{1,(1\ 2)\}$、$K=\{1,(1\ 3)\}$とすると$|HK|=4$であり、$4$は$6$を割らないので部分群でない。
  target: |
    ∀ (G : Type*) [Group G] (H N : Subgroup G) [N.Normal] (x : G), x ∈ H ⊔ N ↔ ∃ h ∈ H, ∃ n ∈ N, h * n = x
  proof: |
    by
      intro G _ H N _ x
      rw [← SetLike.mem_coe, Subgroup.mul_normal]
      exact Set.mem_mul
- id: unique_subgroup_of_its_order_is_normal
  kind: gap
  level: 2
  topic: 群論・位数が唯一の部分群
  statement: 有限群$G$の部分群$H$が、その位数をもつ唯一の部分群なら、$H$は正規である。
  statement_en: If a subgroup H of a finite group G is the only subgroup of its order, then H is normal.
  assumptions:
  - $G$は有限群
  - $H$は$G$の部分群
  - 位数が$|H|$の部分群は$H$だけ
  quantifiers:
  - 任意の有限群$G$とその部分群$H$
  conclusion: $H$は$G$の正規部分群である。
  answer: |
    $G$を有限群、$H$をその位数をもつ唯一の部分群とする。$g\in G$をとる。写像$x\mapsto gxg^{-1}$は$G$の自己同型なので、$gHg^{-1}$は$G$の部分群であり、$H$と同じ元の個数をもつ。仮定より$gHg^{-1}=H$である。これが全ての$g\in G$で成り立つので、$H$は正規である。
  strategy: A conjugate of H is a subgroup of the same order.
  sketch:
  - 'derive: Conjugation by g is an automorphism, so gHg⁻¹ is a subgroup with |gHg⁻¹| = |H|.'
  - 'derive: Uniqueness gives gHg⁻¹ = H.'
  - 'conclude: H is normal.'
  openmath: (forall (G H) (-> (and (finite_group G) (subgroup_of H G) (forall (K) (-> (and (subgroup_of K G) (= (size K) (size H))) (= K H)))) (normal_subgroup H G)))
  hard_negative:
    statement: 有限群の部分群は、同じ位数の部分群が複数あっても正規である。
    reason: $S_3$には位数$2$の部分群が$3$個あり、いずれも正規でない。
  target: |
    ∀ (G : Type*) [Group G] [Finite G] (H : Subgroup G), (∀ K : Subgroup G, Nat.card K = Nat.card H → K = H) → H.Normal
  proof: |
    by
      intro G _ _ H hu
      constructor
      intro n hn g
      have hmap : H.map (MulAut.conj g).toMonoidHom = H :=
        hu _ (Nat.card_congr (Subgroup.equivMapOfInjective H _ (MulAut.conj g).injective).symm.toEquiv)
      rw [← hmap]
      exact ⟨n, hn, by simp [MulAut.conj_apply]⟩
- id: power_of_index_lies_in_normal_subgroup
  kind: gap
  level: 2
  topic: 群論・商群と指数乗
  statement: 群$G$の有限指数の正規部分群$N$と$g\in G$について、$g^{[G:N]}\in N$である。
  statement_en: For a normal subgroup N of finite index in a group G and an element g of G, the power g^[G:N] lies in N.
  assumptions:
  - $G$は群
  - $N$は$G$の有限指数の正規部分群
  quantifiers:
  - 任意の$g\in G$
  conclusion: $g^{[G:N]}\in N$である。
  answer: |
    $G$を群、$N$を有限指数の正規部分群、$g\in G$とする。商群$G/N$は位数$[G:N]$の有限群である。有限群の元の位数は群の位数を割り切るので、$(gN)^{[G:N]}$は$G/N$の単位元である。一方で$(gN)^{[G:N]}=g^{[G:N]}N$であるから、$g^{[G:N]}N=N$であり、$g^{[G:N]}\in N$である。
  strategy: Apply the fact that the group order kills every element to the quotient G/N.
  sketch:
  - 'setup: G/N is a finite group of order [G:N].'
  - 'apply_theorem: Hence (gN)^[G:N] is the identity coset.'
  - 'conclude: This says g^[G:N] lies in N.'
  openmath: (forall (G U g) (-> (and (normal_subgroup U G) (finite_index_subgroup U G) (in g G)) (in (group_pow g (subgroup_index U G)) U)))
  hard_negative:
    statement: 正規とは限らない有限指数の部分群$H$でも$g^{[G:H]}\in H$である。
    reason: $S_3$で$H=\{1,(1\ 2)\}$、$g=(1\ 3)$とすると、$[G:H]=3$で$g^3=(1\ 3)\notin H$である。
  target: |
    ∀ (G : Type*) [Group G] (N : Subgroup G) [N.Normal] [N.FiniteIndex] (g : G), g ^ N.index ∈ N
  proof: |
    by
      intro G _ N _ _ g
      exact Subgroup.pow_index_mem N g
- id: card_eq_card_kernel_mul_card_image
  kind: gap
  level: 2
  topic: 群論・核と像の位数
  statement: 有限群$G$からの群準同型$f\colon G\to H$について、$|G|=|\ker f|\cdot|\mathrm{im}\,f|$である。
  statement_en: For a group homomorphism f from a finite group G to a group H, |G| = |ker f|·|im f|.
  assumptions:
  - $G$は有限群
  - $f\colon G\to H$は群準同型
  quantifiers:
  - 任意の有限群$G$、群$H$、準同型$f$
  conclusion: $|G|=|\ker f|\cdot|\mathrm{im}\,f|$である。
  answer: |
    $G$を有限群、$H$を群、$f\colon G\to H$を準同型とする。第一同型定理より$G/\ker f$は$\mathrm{im}\,f$と同型なので、$[G:\ker f]=|\mathrm{im}\,f|$である。ラグランジュの定理より$|G|=|\ker f|\cdot[G:\ker f]$であり、代入すると$|G|=|\ker f|\cdot|\mathrm{im}\,f|$を得る。
  strategy: Combine the first isomorphism theorem with Lagrange's theorem.
  sketch:
  - 'apply_theorem: The first isomorphism theorem gives [G:ker f] = |im f|.'
  - 'apply_theorem: Lagrange gives |G| = |ker f|·[G:ker f].'
  - 'conclude: Substitute.'
  openmath: (forall (G H f) (-> (and (finite_group G) (group_hom f G H)) (= (size G) (* (size (group_kernel f)) (size (group_image f))))))
  hard_negative:
    statement: 有限群の間の準同型$f\colon G\to H$について、$|G|=|\ker f|\cdot|H|$である。
    reason: 位数$2$の群から位数$4$の巡回群への単射では$|G|=2$、$|\ker f|\cdot|H|=4$である。像の位数を用いる必要がある。
  target: |
    ∀ (G H : Type*) [Group G] [Group H] [Finite G] (f : G →* H), Nat.card G = Nat.card f.ker * Nat.card f.range
  proof: |
    by
      intro G H _ _ _ f
      rw [← Subgroup.index_ker, Subgroup.card_mul_index]
- id: quotient_group_universal_property
  kind: gap
  level: 2
  topic: 群論・商群への持ち上げ
  statement: 群$G$の正規部分群$N$と群準同型$f\colon G\to H$が$N\subseteq\ker f$を満たすなら、全ての$g\in G$で$\varphi(gN)=f(g)$となる準同型$\varphi\colon G/N\to H$がただ1つ存在する。
  statement_en: If N is a normal subgroup of G and f from G to H is a group homomorphism with N ⊆ ker f, there is a unique homomorphism φ from G/N to H with φ(gN) = f(g) for all g.
  assumptions:
  - $N$は群$G$の正規部分群
  - $f\colon G\to H$は群準同型
  - $N\subseteq\ker f$
  quantifiers:
  - 任意の$G,H,N,f$
  conclusion: $\varphi(gN)=f(g)$を満たす準同型$\varphi\colon G/N\to H$がただ1つ存在する。
  answer: |
    $G,H$を群、$N$を$G$の正規部分群、$f\colon G\to H$を$N\subseteq\ker f$を満たす準同型とする。$gN=g'N$なら$g^{-1}g'\in N\subseteq\ker f$なので、$f(g)=f(g')$である。よって$\varphi(gN)=f(g)$は$G/N$上の写像を矛盾なく定める。$\varphi(gN\cdot g'N)=\varphi(gg'N)=f(gg')=f(g)f(g')$なので$\varphi$は準同型である。条件を満たす準同型$\psi$があれば、全ての元$gN$で$\psi(gN)=f(g)=\varphi(gN)$となるから$\psi=\varphi$である。
  strategy: Define φ on cosets, check well-definedness with N ⊆ ker f, and note that cosets exhaust G/N.
  sketch:
  - 'construct: Set φ(gN) = f(g).'
  - 'derive: gN = g''N gives g⁻¹g'' in ker f, so φ is well defined.'
  - 'derive: φ is a homomorphism because f is.'
  - 'conclude: Any other such map agrees with φ on every coset.'
  openmath: (forall (G H U f) (-> (and (normal_subgroup U G) (group_hom f G H) (subset U (group_kernel f))) (exists (j) (and (group_hom j (quotient_group G U) H) (forall (g) (-> (in g G) (= (fn_value j (fn_value (quotient_map G U) g)) (fn_value f g)))) (forall (k) (-> (and (group_hom k (quotient_group G U) H) (forall (g) (-> (in g G) (= (fn_value k (fn_value (quotient_map G U) g)) (fn_value f g))))) (= k j)))))))
  hard_negative:
    statement: $N\subseteq\ker f$を仮定しなくても$f$は$G/N$上の準同型を誘導する。
    reason: 位数$2$の群$G$と$N=G$、$f=\mathrm{id}$では、自明群$G/N$の元の行き先が$f(1)$と$f(g)$の両方になり、定まらない。
  target: |
    ∀ (G H : Type*) [Group G] [Group H] (N : Subgroup G) [N.Normal] (f : G →* H), N ≤ f.ker → ∃! φ : G ⧸ N →* H, ∀ g : G, φ (g : G ⧸ N) = f g
  proof: |
    by
      intro G H _ _ N _ f h
      refine ⟨QuotientGroup.lift N f (fun x hx => h hx), fun g => rfl, ?_⟩
      intro ψ hψ
      ext g
      exact hψ g
- id: index_of_intersection_le_product
  kind: gap
  level: 2
  topic: 群論・共通部分の指数
  statement: 群$G$の有限指数の部分群$H,K$について、$H\cap K$も有限指数であり、$[G:H\cap K]\leq[G:H][G:K]$である。
  statement_en: For subgroups H and K of finite index in a group G, the intersection H ∩ K has finite index and [G:H∩K] ≤ [G:H][G:K].
  assumptions:
  - $G$は群
  - $H,K$は$G$の有限指数の部分群
  quantifiers:
  - 任意の有限指数の部分群$H,K$
  conclusion: $H\cap K$は有限指数で$[G:H\cap K]\leq[G:H][G:K]$である。
  answer: |
    $G$を群、$H,K$を有限指数の部分群とする。写像$G/(H\cap K)\to G/H\times G/K$を$g(H\cap K)\mapsto(gH,gK)$で定める。$g(H\cap K)=g'(H\cap K)$なら$g^{-1}g'\in H\cap K$なので、$gH=g'H$かつ$gK=g'K$であり、この写像は矛盾なく定まる。逆に$gH=g'H$かつ$gK=g'K$なら$g^{-1}g'\in H\cap K$となるので、写像は単射である。右辺の集合の元の個数は$[G:H][G:K]$なので、左辺の$H\cap K$の左剰余類の個数は有限で、$[G:H][G:K]$以下である。
  strategy: Inject the cosets of H ∩ K into pairs of cosets of H and of K.
  sketch:
  - 'construct: Send g(H∩K) to the pair (gH, gK).'
  - 'derive: The map is well defined and injective because g⁻¹g'' lies in H∩K exactly when it lies in both.'
  - 'conclude: The target has [G:H][G:K] elements.'
  openmath: (forall (G H K) (-> (and (group G) (finite_index_subgroup H G) (finite_index_subgroup K G)) (and (finite_index_subgroup (inter H K) G) (<= (subgroup_index (inter H K) G) (* (subgroup_index H G) (subgroup_index K G))))))
  hard_negative:
    statement: 有限指数の部分群$H,K$について、$[G:H\cap K]=[G:H][G:K]$がつねに成り立つ。
    reason: 指数$2$の部分群$H$で$K=H$とすると、左辺は$2$で右辺は$4$である。等号には指数が互いに素であることなどの条件が必要である。
  target: |
    ∀ (G : Type*) [Group G] (H K : Subgroup G), H.index ≠ 0 → K.index ≠ 0 → (H ⊓ K).index ≠ 0 ∧ (H ⊓ K).index ≤ H.index * K.index
  proof: |
    by
      intro G _ H K hH hK
      exact ⟨Subgroup.index_inf_ne_zero hH hK, Subgroup.index_inf_le⟩
- id: solvable_subgroup_and_surjective_image
  kind: gap
  level: 3
  topic: 可解群・部分群と全射像
  statement: 可解群$G$の部分群$H$は可解であり、$G$からの全射準同型の像$K$も可解である。
  statement_en: If G is a solvable group, then every subgroup H of G is solvable and the target K of every surjective homomorphism from G is solvable.
  assumptions:
  - $G$は可解群
  - $H$は$G$の部分群
  - $f\colon G\to K$は全射準同型
  quantifiers:
  - 任意の$H$と$f$
  conclusion: $H$と$K$は可解である。
  answer: |
    $G$を可解群、$H$を部分群、$f\colon G\to K$を全射準同型とする。群$A$の導来列を$A^{(0)}=A$、$A^{(i+1)}=[A^{(i)},A^{(i)}]$で定める。可解性より$G^{(m)}=1$となる$m$がある。$H\subseteq G$から帰納法で$H^{(i)}\subseteq G^{(i)}$が従うので、$H^{(m)}=1$である。また$f$は交換子を交換子に送るので、帰納法により$f(G^{(i)})=K^{(i)}$である。$i=0$は全射性そのものであり、$f([A,A])=[f(A),f(A)]$から次の段に進む。よって$K^{(m)}=f(G^{(m)})=1$である。
  strategy: Compare derived series by induction, using inclusion for H and surjectivity for K.
  sketch:
  - 'setup: Choose m with G^(m) trivial.'
  - 'induction: H^(i) is contained in G^(i) for all i.'
  - 'induction: f(G^(i)) = K^(i), using surjectivity at i = 0 and f([A,A]) = [f(A),f(A)].'
  - 'conclude: H^(m) and K^(m) are trivial.'
  openmath: (forall (G K H f) (-> (and (solvable_group G) (subgroup_of H G) (group_hom f G K) (surjective_function f)) (and (solvable_group H) (solvable_group K))))
  hard_negative:
    statement: 正規部分群$N$が可解なら$G$も可解である。
    reason: $G=A_5$、$N=1$では$N$は可解だが$G$は可解でない。$G/N$の可解性も必要である。
  target: |
    ∀ (G K : Type*) [Group G] [Group K] [IsSolvable G] (H : Subgroup G) (f : G →* K), Function.Surjective f → IsSolvable H ∧ IsSolvable K
  proof: |
    by
      intro G K _ _ _ H f hf
      exact ⟨solvable_of_solvable_injective H.subtype_injective, solvable_of_surjective hf⟩
- id: perfect_nontrivial_group_not_solvable
  kind: gap
  level: 3
  topic: 可解群・完全群
  statement: 自明でない群$G$が$[G,G]=G$を満たすなら、$G$は可解でない。
  statement_en: A nontrivial group G with [G,G] = G is not solvable.
  assumptions:
  - $G$は自明でない群
  - $[G,G]=G$
  quantifiers:
  - 任意の群$G$
  conclusion: $G$は可解でない。
  answer: |
    $G$を$[G,G]=G$を満たす自明でない群とする。導来列を$G^{(0)}=G$、$G^{(i+1)}=[G^{(i)},G^{(i)}]$で定める。帰納法で全ての$i$について$G^{(i)}=G$を示す。$i=0$では明らかである。$G^{(i)}=G$なら$G^{(i+1)}=[G,G]=G$である。$G$が可解なら$G^{(m)}=1$となる$m$があるが、$G^{(m)}=G$は自明でないので矛盾する。よって$G$は可解でない。
  strategy: The derived series is constant equal to G, so it never reaches the trivial group.
  sketch:
  - 'induction: G^(i) = G for every i.'
  - 'contradiction: Solvability would give G^(m) = 1, while G is nontrivial.'
  openmath: (forall (G) (-> (and (group G) (!= G (trivial_subgroup G)) (= (commutator_subgroup G) G)) (not (solvable_group G))))
  hard_negative:
    statement: $[G,G]\neq G$なら$G$は可解である。
    reason: $[S_5,S_5]=A_5\neq S_5$だが、$S_5$は可解でない。導来列が途中で止まる場合がある。
  target: |
    ∀ (G : Type*) [Group G] [Nontrivial G], commutator G = ⊤ → ¬ IsSolvable G
  proof: |
    by
      intro G _ _ hc hs
      have key : ∀ n : ℕ, derivedSeries G n = ⊤ := by
        intro n
        induction n with
        | zero => rfl
        | succ n ih =>
          rw [derivedSeries_succ, ih]
          rw [commutator_def] at hc
          exact hc
      obtain ⟨n, hn⟩ := hs.solvable
      rw [key n] at hn
      exact top_ne_bot hn
- id: nilpotent_of_nilpotent_central_quotient
  kind: gap
  level: 3
  topic: 冪零群・中心による商
  statement: 群$G$について、$G/Z(G)$が冪零なら$G$も冪零である。
  statement_en: If the quotient G/Z(G) of a group G by its center is nilpotent, then G is nilpotent.
  assumptions:
  - $G$は群
  - $G/Z(G)$は冪零
  quantifiers:
  - 任意の群$G$
  conclusion: $G$は冪零である。
  answer: |
    $G$を群、$Z=Z(G)$、$\pi\colon G\to G/Z$を標準全射とし、$G/Z$は冪零とする。群$A$の上部中心列を次のように定める。$Z_0(A)=1$とし、全ての$y\in A$で$[x,y]\in Z_i(A)$となる$x\in A$の全体を$Z_{i+1}(A)$とする。$A$が冪零であることは、ある$c$で$Z_c(A)=A$となることである。全ての$i$について、$\pi(x)\in Z_i(G/Z)$なら$x\in Z_{i+1}(G)$であることを帰納法で示す。$i=0$なら$\pi(x)=1$より$x\in Z=Z_1(G)$である。$\pi(x)\in Z_{i+1}(G/Z)$とする。全ての$y\in G$で$\pi([x,y])=[\pi(x),\pi(y)]\in Z_i(G/Z)$であり、帰納法の仮定より$[x,y]\in Z_{i+1}(G)$である。よって$x\in Z_{i+2}(G)$である。$Z_c(G/Z)=G/Z$なら全ての$x\in G$が$Z_{c+1}(G)$に入るので、$G$は冪零である。
  strategy: Pull the upper central series of G/Z(G) back to G, shifted by one step.
  sketch:
  - 'setup: Define the upper central series Z_i and fix c with Z_c(G/Z) = G/Z.'
  - 'induction: π(x) in Z_i(G/Z) implies x in Z_(i+1)(G).'
  - 'derive: The step uses π([x,y]) = [π(x),π(y)].'
  - 'conclude: Z_(c+1)(G) = G.'
  openmath: (forall (G) (-> (and (group G) (nilpotent_group (quotient_group G (group_center G)))) (nilpotent_group G)))
  hard_negative:
    statement: 正規部分群$N$について$G/N$が冪零なら$G$も冪零である。
    reason: $S_3$と$N=A_3$では$G/N$は位数$2$で冪零だが、$S_3$は中心が自明なので冪零でない。$N$は中心に含まれる必要がある。
  target: |
    ∀ (G : Type*) [Group G], Group.IsNilpotent (G ⧸ Subgroup.center G) → Group.IsNilpotent G
  proof: |
    by
      intro G _ h
      exact Group.of_quotient_center_nilpotent h
- id: nilpotent_proper_subgroup_normalizer_grows
  kind: textbook
  level: 3
  topic: 冪零群・正規化群条件
  statement: 冪零群$G$の真部分群$H$について、$H$は正規化群$N_G(H)$に真に含まれる。
  statement_en: A proper subgroup H of a nilpotent group G is properly contained in its normalizer N_G(H).
  assumptions:
  - $G$は冪零群
  - $H$は$G$の真部分群
  quantifiers:
  - 任意の冪零群$G$と真部分群$H$
  conclusion: $H\subsetneq N_G(H)$である。
  answer: |
    $G$を冪零群、$H$を真部分群とする。上部中心列を次のように定める。$Z_0=1$とし、全ての$y\in G$で$[x,y]\in Z_i$となる$x\in G$の全体を$Z_{i+1}$とする。ここで$[x,y]=xyx^{-1}y^{-1}$である。帰納法により各$Z_i$は$G$の正規部分群であり、$Z_{i+1}/Z_i$は$G/Z_i$の中心である。冪零性より$Z_c=G$となる$c$がある。$Z_0\subseteq H$かつ$Z_c\not\subseteq H$なので、$Z_i\subseteq H$かつ$Z_{i+1}\not\subseteq H$となる$i$がある。$x\in Z_{i+1}\setminus H$をとる。$h\in H$について$xhx^{-1}h^{-1}=[x,h]\in Z_i\subseteq H$なので、$xhx^{-1}\in H$である。$x^{-1}\in Z_{i+1}$にも同じ議論を適用すると$x^{-1}hx\in H$である。よって$xHx^{-1}=H$であり、$x\in N_G(H)\setminus H$である。したがって$H\subsetneq N_G(H)$である。
  strategy: Choose an element in the first term of the upper central series outside H; it normalizes H.
  sketch:
  - 'setup: Use the upper central series with Z_c = G.'
  - 'derive: There is i with Z_i inside H and Z_(i+1) not inside H.'
  - 'construct: Take x in Z_(i+1) outside H.'
  - 'derive: [x,h] in Z_i gives xhx⁻¹ in H, and likewise for x⁻¹.'
  - 'conclude: x normalizes H and is not in H.'
  openmath: (forall (G H) (-> (and (nilpotent_group G) (subgroup_of H G) (!= H G)) (prsubset H (subgroup_normalizer H G))))
  hard_negative:
    statement: 可解群の真部分群は正規化群に真に含まれる。
    reason: 可解群$S_3$の部分群$\{1,(1\ 2)\}$の正規化群はそれ自身である。
  target: |
    ∀ (G : Type*) [Group G] [Group.IsNilpotent G] (H : Subgroup G), H ≠ ⊤ → H < Subgroup.normalizer (H : Set G)
  proof: |
    by
      intro G _ _ H hH
      exact Group.normalizerCondition_of_isNilpotent H (lt_top_iff_ne_top.mpr hH)
- id: finite_nilpotent_iff_sylow_subgroups_normal
  kind: textbook
  level: 3
  topic: 冪零群・シロー部分群の正規性
  statement: 有限群$G$が冪零であることと、全ての素数$p$について$G$の全てのシロー$p$部分群が正規であることは同値である。
  statement_en: A finite group G is nilpotent if and only if, for every prime p, every Sylow p-subgroup of G is normal.
  assumptions:
  - $G$は有限群
  quantifiers:
  - 任意の有限群$G$
  conclusion: $G$が冪零であることと全てのシロー部分群が正規であることは同値である。
  answer: |
    $G$を有限群とする。$G$が冪零であるとし、$T$をシロー$p$部分群、$L=N_G(T)$とする。$g\in N_G(L)$なら$gTg^{-1}\subseteq L$は$L$のシロー$p$部分群である。$T$は$L$で正規だから$L$の唯一のシロー$p$部分群であり、$gTg^{-1}=T$、すなわち$g\in L$である。よって$N_G(L)=L$である。冪零群の真部分群は正規化群に真に含まれるから、$L=G$であり、$T$は正規である。逆に全てのシロー部分群が正規とする。$|G|$の相異なる素因数を$p_1,\dots,p_r$とし、シロー$p_i$部分群を$T_i$とする。$i\neq j$なら$|T_i|$と$|T_j|$は互いに素なので$T_i\cap T_j=1$である。$x\in T_i$、$y\in T_j$について、正規性より$xyx^{-1}y^{-1}\in T_i\cap T_j$となるので$xy=yx$である。よって$\mu(x_1,\dots,x_r)=x_1\cdots x_r$は準同型$\mu\colon T_1\times\dots\times T_r\to G$を定める。$x_1\cdots x_r=1$とする。$x_i$は$\prod_{j\neq i}x_j$の逆元であり、その位数は$|T_i|$と$\prod_{j\neq i}|T_j|$をともに割り切るので、$x_i=1$である。よって$\mu$は単射であり、$\prod_i|T_i|=|G|$より全単射である。$G$は$T_1\times\dots\times T_r$と同型である。有限$p$群は冪零であり、冪零群の有限直積は冪零であるから、$G$は冪零である。
  strategy: Use the normalizer condition for one direction and the internal direct product of Sylow subgroups for the other.
  sketch:
  - 'setup: For nilpotent G and a Sylow subgroup T, put L = N_G(T).'
  - 'derive: T is the unique Sylow p-subgroup of L, so any g normalizing L normalizes T, giving N_G(L) = L.'
  - 'apply_theorem: The normalizer condition forces L = G.'
  - 'setup: Conversely, list the normal Sylow subgroups T_1, ..., T_r.'
  - 'derive: Coprime orders make distinct T_i commute, and the product map from their direct product to G is an injective homomorphism between groups of equal order.'
  - 'conclude: Finite p-groups and finite products of nilpotent groups are nilpotent.'
  openmath: (forall (G) (-> (finite_group G) (<-> (nilpotent_group G) (forall (p T) (-> (and (in p P) (sylow_subgroup p T G)) (normal_subgroup T G))))))
  hard_negative:
    statement: 有限群であるシロー部分群が1つでも正規なら、その群は冪零である。
    reason: $S_3$のシロー$3$部分群$A_3$は正規だが、$S_3$は冪零でない。シロー$2$部分群は正規でない。
  target: |
    ∀ (G : Type*) [Group G] [Finite G], Group.IsNilpotent G ↔ ∀ (p : ℕ) (_ : Fact p.Prime) (P : Sylow p G), (P : Subgroup G).Normal
  proof: |
    by
      intro G _ _
      exact (Group.isNilpotent_of_finite_tfae (G := G)).out 0 3
- id: triangular_double_sum_swap
  kind: gap
  level: 2
  topic: 有限和・三角領域の二重和の交換
  statement: 可換モノイドに値をとる$f$と自然数$n$について、$\sum_{i=0}^{n-1}\sum_{j=0}^{i-1}f(i,j)=\sum_{j=0}^{n-1}\sum_{j<i<n}f(i,j)$である。
  statement_en: For f with values in a commutative additive monoid and a natural number n, the sum over i < n of the sum over j < i of f(i,j) equals the sum over j < n of the sum over j < i < n of f(i,j).
  assumptions:
  - $f(i,j)$は可換モノイドの元
  quantifiers:
  - 任意の$f$と自然数$n$
  conclusion: 2つの順序の二重和は等しい。
  answer: |
    $A$を加法についての可換モノイド、$f\colon\mathbb{N}\times\mathbb{N}\to A$、$n$を自然数とする。左辺は$0\leq i<n$かつ$0\leq j<i$を満たす組$(i,j)$全体にわたる$f(i,j)$の和である。この条件は$0\leq j<i<n$と同じであり、$0\leq j<n$かつ$j<i<n$とも同じである。右辺はこの後者の条件を満たす組にわたる和である。添字の集合が等しく、有限和は順序によらないので、両辺は等しい。
  strategy: Describe both iterated ranges as the single set of pairs with j < i < n.
  sketch:
  - 'translate: The left side sums over pairs with 0 ≤ i < n and 0 ≤ j < i.'
  - 'derive: This set equals the set of pairs with 0 ≤ j < n and j < i < n.'
  - 'conclude: Finite sums do not depend on the order of the terms.'
  openmath: (forall (f n) (= (range_sum n (lambda (i) (range_sum i (lambda (j) (fn_value (fn_value f i) j))))) (range_sum n (lambda (j) (finset_sum (nat_open_interval j n) (lambda (i) (fn_value (fn_value f i) j)))))))
  hard_negative:
    statement: $\sum_{i=0}^{n-1}\sum_{j=0}^{i-1}f(i,j)=\sum_{j=0}^{n-1}\sum_{i=0}^{j-1}f(i,j)$である。
    reason: $n=2$で$f(1,0)=1$、$f(0,1)=0$とすると左辺は$1$、右辺は$0$である。交換すると内側の範囲は$j<i<n$に変わる。
  target: |
    ∀ (A : Type*) [AddCommMonoid A] (f : ℕ → ℕ → A) (n : ℕ), ∑ i ∈ Finset.range n, ∑ j ∈ Finset.range i, f i j = ∑ j ∈ Finset.range n, ∑ i ∈ Finset.Ioo j n, f i j
  proof: |
    by
      intro A _ f n
      apply Finset.sum_comm'
      intro x y
      simp only [Finset.mem_range, Finset.mem_Ioo]
      omega
- id: finite_sum_by_fibers
  kind: gap
  level: 2
  topic: 有限和・ファイバーごとの和
  statement: 有限集合$s,t$と写像$\varphi$が全ての$x\in s$で$\varphi(x)\in t$を満たすなら、$\sum_{y\in t}\sum_{x\in s,\,\varphi(x)=y}f(x)=\sum_{x\in s}f(x)$である。
  statement_en: If finite sets s and t and a map φ satisfy φ(x) ∈ t for all x in s, then the sum over y in t of the sum over x in s with φ(x) = y of f(x) equals the sum over x in s of f(x).
  assumptions:
  - $s,t$は有限集合
  - 全ての$x\in s$で$\varphi(x)\in t$
  - $f$は可換モノイドに値をとる
  quantifiers:
  - 任意の$s,t,\varphi,f$
  conclusion: ファイバーごとに足してから$y$について足した値は、$s$全体の和に等しい。
  answer: |
    $s,t$を有限集合、$\varphi$を全ての$x\in s$で$\varphi(x)\in t$を満たす写像、$f$を可換モノイドに値をとる写像とする。$y\in t$について$s_y=\{x\in s\mid\varphi(x)=y\}$とおく。$y\neq y'$なら$s_y$と$s_{y'}$は交わらない。各$x\in s$は$y=\varphi(x)\in t$に対する$s_y$に属する。よって$s$は$(s_y)_{y\in t}$の非交和であり、互いに交わらない有限集合の和集合上の和は各集合上の和の和であるから、主張が従う。
  strategy: The fibers of φ over t partition s.
  sketch:
  - 'setup: Let s_y be the fiber of φ over y in t.'
  - 'derive: The fibers are disjoint, and they cover s because φ maps s into t.'
  - 'conclude: Summing over a disjoint union gives the identity.'
  openmath: (forall (s t g f) (-> (forall (x) (-> (in x s) (in (fn_value g x) t))) (= (finset_sum t (lambda (y) (finset_sum (finset_fiber s g y) (lambda (x) (fn_value f x))))) (finset_sum s (lambda (x) (fn_value f x))))))
  hard_negative:
    statement: $\varphi(x)\in t$を仮定しなくても同じ等式が成り立つ。
    reason: $s=\{a\}$、$t=\emptyset$、$f(a)=1$とすると左辺は$0$、右辺は$1$である。$t$の外に行く元の項が落ちる。
  target: |
    ∀ (ι κ A : Type*) [DecidableEq κ] [AddCommMonoid A] (s : Finset ι) (t : Finset κ) (φ : ι → κ) (f : ι → A), (∀ x ∈ s, φ x ∈ t) → ∑ y ∈ t, ∑ x ∈ s.filter (fun x => φ x = y), f x = ∑ x ∈ s, f x
  proof: |
    by
      intro ι κ A _ _ s t φ f h
      exact Finset.sum_fiberwise_of_maps_to h f
- id: product_of_binomials_expansion
  kind: textbook
  level: 2
  topic: 有限積・和の積の展開
  statement: 可換半環の元$a_i,b_i$と有限集合$s$について、$\prod_{i\in s}(a_i+b_i)=\sum_{t\subseteq s}\bigl(\prod_{i\in t}a_i\bigr)\bigl(\prod_{i\in s\setminus t}b_i\bigr)$である。
  statement_en: For elements a_i, b_i of a commutative semiring and a finite set s, the product over s of (a_i + b_i) equals the sum over subsets t of s of (product over t of a_i)(product over s minus t of b_i).
  assumptions:
  - $a_i,b_i$は可換半環の元
  - $s$は有限集合
  quantifiers:
  - 任意の$a,b,s$
  conclusion: 積は$s$の全ての部分集合にわたる和に展開される。
  answer: |
    $S$を可換半環、$s$を有限集合、$a_i,b_i\in S$（$i\in s$）とし、$|s|$についての帰納法で示す。$s=\emptyset$では両辺とも$1$である。$c\notin s$をとり、$s$で等式が成り立つとする。$\prod_{i\in s\cup\{c\}}(a_i+b_i)=(a_c+b_c)\prod_{i\in s}(a_i+b_i)$に帰納法の仮定を代入し、分配法則で展開する。$a_c$を掛けた項は$c$を含む部分集合$t\cup\{c\}$に対応し、$b_c$を掛けた項は$c$を含まない部分集合$t$に対応する。$s\cup\{c\}$の部分集合はこの2種類に重複なく分かれるので、等式は$s\cup\{c\}$でも成り立つ。
  strategy: Induct on s, splitting subsets of s ∪ {c} by whether they contain c.
  sketch:
  - 'induction: Empty s gives 1 on both sides.'
  - 'setup: For a new index c, multiply the identity for s by a_c + b_c.'
  - 'derive: Terms with a_c correspond to subsets containing c.'
  - 'derive: Terms with b_c correspond to subsets not containing c.'
  - 'conclude: These two kinds exhaust the subsets of s ∪ {c}.'
  openmath: (forall (s a b) (= (finite_family_product s (lambda (i) (+ (fn_value a i) (fn_value b i)))) (finset_sum (powerset s) (lambda (t) (* (finite_family_product t (lambda (i) (fn_value a i))) (finite_family_product (setdiff s t) (lambda (i) (fn_value b i))))))))
  hard_negative:
    statement: $\prod_{i\in s}(a_i+b_i)=\prod_{i\in s}a_i+\prod_{i\in s}b_i$である。
    reason: $s$が$2$元で全ての$a_i,b_i$が$1$なら、左辺は$4$、右辺は$2$である。
  target: |
    ∀ (ι S : Type*) [DecidableEq ι] [CommSemiring S] (s : Finset ι) (a b : ι → S), ∏ i ∈ s, (a i + b i) = ∑ t ∈ s.powerset, (∏ i ∈ t, a i) * ∏ i ∈ s \ t, b i
  proof: |
    by
      intro ι S _ _ s a b
      exact Finset.prod_add a b s
- id: abel_summation_formula
  kind: named
  level: 2
  topic: 有限和・アーベルの総和法
  statement: アーベルの総和法。可換環の列$a,b$と自然数$n$について、$B_k=\sum_{j=0}^{k}b_j$とおくと、$\sum_{i=0}^{n}a_ib_i=a_nB_n-\sum_{i=0}^{n-1}(a_{i+1}-a_i)B_i$である。
  statement_en: Abel summation. For sequences a and b in a commutative ring and a natural number n, with B_k the sum of b_j for j ≤ k, the sum of a_i b_i for i ≤ n equals a_n B_n minus the sum over i < n of (a_(i+1) - a_i) B_i.
  assumptions:
  - $a,b$は可換環の列
  - $B_k=\sum_{j=0}^{k}b_j$
  quantifiers:
  - 任意の列$a,b$と自然数$n$
  conclusion: $\sum_{i=0}^{n}a_ib_i=a_nB_n-\sum_{i=0}^{n-1}(a_{i+1}-a_i)B_i$である。
  answer: |
    $S$を可換環、$a,b$を$S$の列、$B_k=\sum_{j=0}^{k}b_j$とし、$n$についての帰納法で示す。$n=0$では両辺とも$a_0b_0$である。$n$で等式が成り立つとすると、$\sum_{i=0}^{n+1}a_ib_i=a_nB_n-\sum_{i=0}^{n-1}(a_{i+1}-a_i)B_i+a_{n+1}b_{n+1}$である。ここで$B_{n+1}=B_n+b_{n+1}$より$a_{n+1}b_{n+1}=a_{n+1}B_{n+1}-a_{n+1}B_n$である。代入すると$a_{n+1}B_{n+1}-\sum_{i=0}^{n-1}(a_{i+1}-a_i)B_i-(a_{n+1}-a_n)B_n$となり、最後の2項は$\sum_{i=0}^{n}(a_{i+1}-a_i)B_i$にまとまる。よって$n+1$でも成り立つ。
  strategy: Induct on n, rewriting b_(n+1) as B_(n+1) - B_n.
  sketch:
  - 'induction: For n = 0 both sides equal a_0 b_0.'
  - 'setup: Add a_(n+1) b_(n+1) to the identity for n.'
  - 'derive: Replace b_(n+1) by B_(n+1) - B_n.'
  - 'conclude: Collect (a_(n+1) - a_n) B_n into the difference sum.'
  openmath: (forall (a b n) (= (range_sum (+ n 1) (lambda (i) (* (fn_value a i) (fn_value b i)))) (- (* (fn_value a n) (range_sum (+ n 1) (lambda (j) (fn_value b j)))) (range_sum n (lambda (i) (* (- (fn_value a (+ i 1)) (fn_value a i)) (range_sum (+ i 1) (lambda (j) (fn_value b j)))))))))
  hard_negative:
    statement: 境界項を除いた$\sum_{i=0}^{n}a_ib_i=-\sum_{i=0}^{n-1}(a_{i+1}-a_i)B_i$が成り立つ。
    reason: $n=0$、$a_0=b_0=1$とすると左辺は$1$で右辺は$0$である。境界項$a_nB_n$は省けない。
  target: |
    ∀ (S : Type*) [CommRing S] (a b : ℕ → S) (n : ℕ), ∑ i ∈ Finset.range (n + 1), a i * b i = a n * ∑ j ∈ Finset.range (n + 1), b j - ∑ i ∈ Finset.range n, (a (i + 1) - a i) * ∑ j ∈ Finset.range (i + 1), b j
  proof: |
    by
      intro S _ a b n
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_range_succ, ih, Finset.sum_range_succ (fun i => (a (i + 1) - a i) * ∑ j ∈ Finset.range (i + 1), b j) n, Finset.sum_range_succ b (n + 1)]
        ring
- id: sum_vanishes_under_cancelling_involution
  kind: gap
  level: 2
  topic: 有限和・対合による打ち消し
  statement: 有限集合$s$上の写像$\varphi\colon s\to s$が$\varphi\circ\varphi=\mathrm{id}$を満たし、可換モノイドに値をとる$f$が全ての$x\in s$で$f(x)+f(\varphi(x))=0$を満たし、$f(x)\neq0$なら$\varphi(x)\neq x$であるとする。このとき$\sum_{x\in s}f(x)=0$である。
  statement_en: If φ maps a finite set s to itself with φ∘φ = id, and f with values in a commutative additive monoid satisfies f(x) + f(φ(x)) = 0 for all x in s and φ(x) ≠ x whenever f(x) ≠ 0, then the sum of f over s is 0.
  assumptions:
  - $\varphi$は$s$上の対合
  - 全ての$x\in s$で$f(x)+f(\varphi(x))=0$
  - $f(x)\neq0$なら$\varphi(x)\neq x$
  quantifiers:
  - 任意の$s,f,\varphi$
  conclusion: $\sum_{x\in s}f(x)=0$である。
  answer: |
    $A$を加法についての可換モノイド、$s$を有限集合、$f\colon s\to A$とし、$\varphi\colon s\to s$が仮定を満たすとする。$|s|$についての帰納法で示す。全ての$x\in s$で$f(x)=0$なら和は$0$である。$f(c)\neq0$となる$c\in s$があるとする。仮定より$d=\varphi(c)\neq c$である。$s'=s\setminus\{c,d\}$とおく。$x\in s'$で$\varphi(x)=c$なら$x=\varphi(c)=d$となり矛盾し、同様に$\varphi(x)=d$なら$x=c$となり矛盾する。よって$\varphi$は$s'$を$s'$に写し、$s'$上でも仮定が成り立つ。帰納法の仮定より$\sum_{x\in s'}f(x)=0$である。したがって$\sum_{x\in s}f(x)=f(c)+f(d)+\sum_{x\in s'}f(x)=0$である。
  strategy: Remove a pair {c, φ(c)} with f(c) ≠ 0 and induct on the size of s.
  sketch:
  - 'case_split: If f vanishes on s the sum is 0.'
  - 'setup: Otherwise pick c with f(c) ≠ 0 and set d = φ(c), so d ≠ c.'
  - 'derive: φ preserves s minus {c, d} because φ is an involution.'
  - 'induction: The sum over the smaller set is 0.'
  - 'conclude: f(c) + f(d) = 0 finishes the sum.'
  openmath: (forall (s f t) (-> (forall (x) (-> (in x s) (and (in (fn_value t x) s) (= (fn_value t (fn_value t x)) x) (= (+ (fn_value f x) (fn_value f (fn_value t x))) 0) (-> (!= (fn_value f x) 0) (!= (fn_value t x) x))))) (= (finset_sum s (lambda (x) (fn_value f x))) 0)))
  hard_negative:
    statement: $f(x)\neq0$なら$\varphi(x)\neq x$という条件を省いても$\sum_{x\in s}f(x)=0$である。
    reason: 位数$2$の加法群の生成元$u$について、$s=\{c\}$、$\varphi=\mathrm{id}$、$f(c)=u$とすると$f(c)+f(c)=0$だが和は$u\neq0$である。
  target: |
    ∀ (ι A : Type*) [AddCommMonoid A] (s : Finset ι) (f : ι → A) (φ : ι → ι), (∀ x ∈ s, φ x ∈ s) → (∀ x ∈ s, φ (φ x) = x) → (∀ x ∈ s, f x + f (φ x) = 0) → (∀ x ∈ s, f x ≠ 0 → φ x ≠ x) → ∑ x ∈ s, f x = 0
  proof: |
    by
      intro ι A _ s f φ hm hi hf hn
      exact Finset.sum_involution (fun x _ => φ x) hf hn hm hi
- id: span_le_submodule_iff_subset
  kind: gap
  level: 3
  topic: 加群・生成される部分加群
  statement: 環$S$上の加群$M$の部分集合$s$と部分加群$p$について、$s$が生成する部分加群が$p$に含まれることと、$s\subseteq p$は同値である。
  statement_en: For a subset s and a submodule p of a module M over a ring S, the submodule generated by s is contained in p if and only if s ⊆ p.
  assumptions:
  - $M$は環$S$上の加群
  - $s\subseteq M$
  - $p$は$M$の部分加群
  quantifiers:
  - 任意の$s$と$p$
  conclusion: $\langle s\rangle\subseteq p$と$s\subseteq p$は同値である。
  answer: |
    $S$を環、$M$を$S$加群、$s\subseteq M$、$p$を$M$の部分加群とする。$s\subseteq\langle s\rangle$なので、$\langle s\rangle\subseteq p$なら$s\subseteq p$である。逆に$s\subseteq p$とする。$\langle s\rangle$の元は$s$の元の有限個の$S$係数の線形結合である。$p$は和とスカラー倍で閉じているから、その線形結合は$p$に入る。よって$\langle s\rangle\subseteq p$である。
  strategy: One direction uses s ⊆ ⟨s⟩ and the other uses closure of p under linear combinations.
  sketch:
  - 'derive: s lies in the generated submodule, which gives the forward implication.'
  - 'derive: Elements of the generated submodule are finite linear combinations of s.'
  - 'conclude: p is closed under these combinations.'
  openmath: (forall (S M s p) (-> (and (is_ring S) (is_module S M) (subset s M) (is_submodule p M)) (<-> (subset (linear_span s) p) (subset s p))))
  hard_negative:
    statement: $s\subseteq p$なら$s$が生成する部分加群は$p$に等しい。
    reason: $s=\emptyset$、$p=M\neq0$のとき、生成される部分加群は$0$である。含まれるだけで等しいとは限らない。
  target: |
    ∀ (S M : Type*) [Ring S] [AddCommGroup M] [Module S M] (s : Set M) (p : Submodule S M), Submodule.span S s ≤ p ↔ s ⊆ p
  proof: |
    by
      intro S M _ _ _ s p
      exact Submodule.span_le
- id: modular_law_for_submodules
  kind: gap
  level: 3
  topic: 加群・モジュラー律
  statement: 環上の加群$M$の部分加群$p,q,r$が$p\subseteq r$を満たすなら、$(p+q)\cap r=p+(q\cap r)$である。
  statement_en: For submodules p, q, r of a module over a ring with p ⊆ r, one has (p + q) ∩ r = p + (q ∩ r).
  assumptions:
  - $M$は環上の加群
  - $p,q,r$は$M$の部分加群
  - $p\subseteq r$
  quantifiers:
  - 任意の部分加群$p,q,r$
  conclusion: $(p+q)\cap r=p+(q\cap r)$である。
  answer: |
    $M$を環上の加群、$p,q,r$を部分加群とし、$p\subseteq r$とする。$x\in(p+q)\cap r$をとり、$x=y+z$（$y\in p$、$z\in q$）と書く。$y\in p\subseteq r$かつ$x\in r$なので、$z=x-y\in r$である。よって$z\in q\cap r$であり、$x\in p+(q\cap r)$である。逆に$x=y+z$（$y\in p$、$z\in q\cap r$）なら$x\in p+q$である。また$y\in p\subseteq r$と$z\in r$から$x\in r$である。したがって両辺は等しい。
  strategy: Write x = y + z and use p ⊆ r to move z into r.
  sketch:
  - 'setup: Take x = y + z in (p+q) ∩ r with y in p and z in q.'
  - 'derive: z = x - y lies in r because y lies in p ⊆ r.'
  - 'derive: So x lies in p + (q∩r).'
  - 'conclude: The reverse inclusion follows from p ⊆ r directly.'
  openmath: (forall (S M p q r) (-> (and (is_ring S) (is_module S M) (is_submodule p M) (is_submodule q M) (is_submodule r M) (subset p r)) (= (submodule_inter (submodule_sum p q) r) (submodule_sum p (submodule_inter q r)))))
  hard_negative:
    statement: $p\subseteq r$を仮定しなくても$(p+q)\cap r=p+(q\cap r)$である。
    reason: 平面の相異なる3直線$p,q,r$では、$(p+q)\cap r=r$だが$p+(q\cap r)=p$である。
  target: |
    ∀ (S M : Type*) [Ring S] [AddCommGroup M] [Module S M] (p q r : Submodule S M), p ≤ r → (p ⊔ q) ⊓ r = p ⊔ (q ⊓ r)
  proof: |
    by
      intro S M _ _ _ p q r h
      exact sup_inf_assoc_of_le q h
- id: preimage_of_image_is_sum_with_kernel
  kind: gap
  level: 3
  topic: 加群・像の逆像
  statement: 環上の線形写像$f\colon M\to L$と$M$の部分加群$p$について、$f^{-1}(f(p))=p+\ker f$である。
  statement_en: For a linear map f from M to L over a ring and a submodule p of M, f⁻¹(f(p)) = p + ker f.
  assumptions:
  - $f\colon M\to L$は環上の線形写像
  - $p$は$M$の部分加群
  quantifiers:
  - 任意の$f$と$p$
  conclusion: $f^{-1}(f(p))=p+\ker f$である。
  answer: |
    $f\colon M\to L$を環上の線形写像、$p$を$M$の部分加群とする。$x\in f^{-1}(f(p))$なら$f(x)=f(y)$となる$y\in p$がある。$x-y\in\ker f$なので、$x=y+(x-y)\in p+\ker f$である。逆に$x=y+z$（$y\in p$、$z\in\ker f$）なら$f(x)=f(y)\in f(p)$であり、$x\in f^{-1}(f(p))$である。
  strategy: Compare x with a point of p having the same image; the difference lies in the kernel.
  sketch:
  - 'setup: For x with f(x) = f(y), y in p, write x = y + (x - y).'
  - 'derive: x - y lies in ker f.'
  - 'conclude: The reverse inclusion uses that ker f maps to 0.'
  openmath: (forall (S M L f p) (-> (and (is_ring S) (module_hom f S M L) (is_submodule p M)) (= (preimage_submodule f (image_submodule f p)) (submodule_sum p (map_kernel f)))))
  hard_negative:
    statement: 線形写像$f$と部分加群$p$について、$f^{-1}(f(p))=p$である。
    reason: $f=0$、$p=0$、$M\neq0$では左辺は$M$、右辺は$0$である。$\ker f\subseteq p$のときに限り等しい。
  target: |
    ∀ (S M L : Type*) [Ring S] [AddCommGroup M] [AddCommGroup L] [Module S M] [Module S L] (f : M →ₗ[S] L) (p : Submodule S M), Submodule.comap f (Submodule.map f p) = p ⊔ LinearMap.ker f
  proof: |
    by
      intro S M L _ _ _ _ _ f p
      exact Submodule.comap_map_eq f p
- id: direct_sum_universal_property
  kind: textbook
  level: 3
  topic: 加群・直和の普遍性
  statement: 環$S$上の加群の族$(M_i)_{i\in I}$と線形写像の族$\varphi_i\colon M_i\to L$について、全ての$i$と$x\in M_i$で$\psi(\iota_i(x))=\varphi_i(x)$を満たす線形写像$\psi\colon\bigoplus_{i\in I}M_i\to L$がただ1つ存在する。ここで$\iota_i$は第$i$成分への包含である。
  statement_en: For a family of modules M_i over a ring S and linear maps φ_i from M_i to L, there is a unique linear map ψ from the direct sum of the M_i to L with ψ(ι_i(x)) = φ_i(x) for all i and x, where ι_i is the inclusion of the i-th summand.
  assumptions:
  - $S$は環
  - $(M_i)_{i\in I}$は$S$加群の族
  - $L$は$S$加群
  - $\varphi_i\colon M_i\to L$は$S$線形
  quantifiers:
  - 任意の族$(M_i)$と$(\varphi_i)$
  conclusion: 条件を満たす$\psi$がただ1つ存在する。
  answer: |
    $S$を環、$(M_i)_{i\in I}$を$S$加群の族、$L$を$S$加群、$\varphi_i\colon M_i\to L$を線形写像とする。$\bigoplus_{i\in I}M_i$の元$x$は、有限個を除く$i$で成分$x_i$が$0$である族$(x_i)$である。$\psi(x)=\sum_{i\in I}\varphi_i(x_i)$と定める。右辺は$0$でない項が有限個なので定まる。成分ごとの和とスカラー倍に対して$\varphi_i$が線形なので、$\psi$は線形である。$\iota_i(x)$は第$i$成分だけが$x$である族なので、$\psi(\iota_i(x))=\varphi_i(x)$である。線形写像$\psi'$が同じ条件を満たすとする。全ての元は$x=\sum_i\iota_i(x_i)$と書けるので、$\psi'(x)=\sum_i\psi'(\iota_i(x_i))=\sum_i\varphi_i(x_i)=\psi(x)$となり、$\psi'=\psi$である。
  strategy: Define ψ as the finite sum of φ_i on components, and use that the images of the inclusions generate the direct sum.
  sketch:
  - 'construct: Define ψ(x) as the sum of φ_i(x_i), which has finitely many nonzero terms.'
  - 'derive: ψ is linear because each φ_i is.'
  - 'derive: ψ restricted to the i-th summand is φ_i.'
  - 'conclude: Every x is a finite sum of ι_i(x_i), which forces uniqueness.'
  openmath: (forall (S I W L u) (-> (and (is_ring S) (module_family W S I) (is_module S L) (forall (i) (-> (in i I) (module_hom (fn_value u i) S (fn_value W i) L)))) (exists (j) (and (module_hom j S (direct_sum_family W) L) (forall (i x) (-> (and (in i I) (in x (fn_value W i))) (= (fn_value j (fn_value (direct_sum_inclusion W i) x)) (fn_value (fn_value u i) x)))) (forall (k) (-> (and (module_hom k S (direct_sum_family W) L) (forall (i x) (-> (and (in i I) (in x (fn_value W i))) (= (fn_value k (fn_value (direct_sum_inclusion W i) x)) (fn_value (fn_value u i) x))))) (= k j)))))))
  hard_negative:
    statement: 無限個の加群の直積$\prod_{i\in I}M_i$でも、$\varphi_i$を延長する線形写像がただ1つ存在する。
    reason: 体$k$上で$I$を無限集合、全ての$M_i$を$1$次元、$L=k$、$\varphi_i=0$とする。$\prod M_i/\bigoplus M_i$は$0$でないので、$\bigoplus M_i$上で$0$になる$0$でない線形形式があり、零写像とともに条件を満たす。一意性が成り立たない。
  target: |
    ∀ (S ι L : Type*) (M : ι → Type*) [Ring S] [DecidableEq ι] [∀ i, AddCommGroup (M i)] [∀ i, Module S (M i)] [AddCommGroup L] [Module S L] (φ : ∀ i, M i →ₗ[S] L), ∃! ψ : DirectSum ι M →ₗ[S] L, ∀ (i : ι) (x : M i), ψ (DirectSum.lof S ι M i x) = φ i x
  proof: |
    by
      intro S ι L M _ _ _ _ _ _ φ
      refine ⟨DirectSum.toModule S ι L φ, fun i x => DirectSum.toModule_lof S i x, ?_⟩
      intro ψ hψ
      apply DirectSum.linearMap_ext
      intro i
      ext x
      rw [LinearMap.comp_apply, LinearMap.comp_apply, hψ, DirectSum.toModule_lof]
- id: internal_direct_sum_iff_independent_and_spanning
  kind: textbook
  level: 3
  topic: 加群・内部直和の判定
  statement: 環上の加群$M$の部分加群の族$(A_i)_{i\in I}$について、成分を足す写像$\bigoplus_iA_i\to M$が全単射であることは、次の2条件が成り立つことと同値である。各$i$で$A_i\cap\sum_{j\neq i}A_j=0$であり、$\sum_iA_i=M$である。
  statement_en: For a family of submodules A_i of a module M over a ring, the addition map from the direct sum of the A_i to M is bijective if and only if A_i ∩ (sum of A_j for j ≠ i) = 0 for each i and the sum of all A_i is M.
  assumptions:
  - $M$は環上の加群
  - $(A_i)_{i\in I}$は$M$の部分加群の族
  quantifiers:
  - 任意の部分加群の族$(A_i)$
  conclusion: 成分を足す写像が全単射であることと、独立性かつ$\sum_iA_i=M$は同値である。
  answer: |
    $M$を環上の加群、$(A_i)_{i\in I}$を部分加群の族とし、$\alpha\colon\bigoplus_iA_i\to M$を$\alpha((x_i))=\sum_ix_i$で定める。$\alpha$の像は$\sum_iA_i$なので、全射性は$\sum_iA_i=M$と同値である。単射性と独立性の同値を示す。$\alpha$は線形なので、単射性は核が$0$であることと同値である。$\alpha$が単射で、$x\in A_i\cap\sum_{j\neq i}A_j$とする。$x=\sum_{j\neq i}x_j$と書くと、第$i$成分が$x$で第$j$成分が$-x_j$の族は$\alpha$で$0$に写るから、$x=0$である。逆に独立性を仮定し、$\alpha((x_i))=0$で$x_i\neq0$となる$i$があるとする。このとき$x_i=-\sum_{j\neq i}x_j\in A_i\cap\sum_{j\neq i}A_j$となり矛盾する。よって核は$0$である。
  strategy: Surjectivity is the spanning condition, and a kernel element is the same as a relation among the components.
  sketch:
  - 'translate: The image of the addition map is the sum of the A_i, which handles surjectivity.'
  - 'translate: Injectivity means the kernel is 0.'
  - 'derive: An element of A_i ∩ sum of the others gives a kernel element with i-th component x.'
  - 'derive: A nonzero kernel element gives a nonzero element of some A_i ∩ sum of the others.'
  - 'conclude: Injectivity and independence are equivalent.'
  openmath: (forall (S M A) (-> (and (is_ring S) (is_module S M) (submodule_family A M)) (<-> (bijective_map (direct_sum_addition_map A)) (and (independent_submodule_family A) (= (submodule_family_sum A) (whole_submodule M))))))
  hard_negative:
    statement: 全ての$i\neq j$で$A_i\cap A_j=0$かつ$\sum_iA_i=M$なら、$M$は$(A_i)$の内部直和である。
    reason: 平面の相異なる3直線は2つずつ$0$で交わり和は平面全体だが、$1$つの直線は他の2直線の和に含まれるので直和でない。
  target: |
    ∀ (S ι M : Type*) [Ring S] [DecidableEq ι] [AddCommGroup M] [Module S M] (A : ι → Submodule S M), Function.Bijective (DirectSum.coeAddMonoidHom A) ↔ iSupIndep A ∧ ⨆ i, A i = ⊤
  proof: |
    by
      intro S ι M _ _ _ _ A
      exact DirectSum.isInternal_submodule_iff_iSupIndep_and_iSup_eq_top A
- id: complementary_submodules_iff_unique_decomposition
  kind: gap
  level: 3
  topic: 加群・補部分加群と一意分解
  statement: 環上の加群$M$の部分加群$p,q$について、$p\cap q=0$かつ$p+q=M$であることと、全ての$x\in M$が$x=y+z$（$y\in p$、$z\in q$）とただ1通りに書けることは同値である。
  statement_en: For submodules p and q of a module M over a ring, p ∩ q = 0 and p + q = M if and only if every x in M is uniquely of the form y + z with y in p and z in q.
  assumptions:
  - $M$は環上の加群
  - $p,q$は$M$の部分加群
  quantifiers:
  - 任意の部分加群$p,q$
  conclusion: $p,q$が補部分加群であることと、一意分解が成り立つことは同値である。
  answer: |
    $M$を環上の加群、$p,q$を部分加群とする。$p\cap q=0$かつ$p+q=M$とする。$x\in M$は$p+q=M$より$x=y+z$（$y\in p$、$z\in q$）と書ける。$x=y'+z'$も同様の分解なら$y-y'=z'-z\in p\cap q=0$となり、$y=y'$、$z=z'$である。逆に一意分解を仮定する。全ての$x$が分解をもつので$p+q=M$である。$x\in p\cap q$なら$x=x+0=0+x$は2つの分解であり、一意性より$x=0$である。
  strategy: The difference of two decompositions lies in p ∩ q, and an element of p ∩ q has two decompositions.
  sketch:
  - 'setup: Assume p ∩ q = 0 and p + q = M.'
  - 'derive: Two decompositions satisfy y - y'' = z'' - z in p ∩ q, so they agree.'
  - 'setup: Conversely assume unique decompositions.'
  - 'derive: Existence gives p + q = M.'
  - 'conclude: For x in p ∩ q the decompositions x + 0 and 0 + x coincide, so x = 0.'
  openmath: (forall (S M p q) (-> (and (is_ring S) (is_module S M) (is_submodule p M) (is_submodule q M)) (<-> (complementary_submodules p q M) (forall (x) (-> (in x M) (exists (y z) (and (in y p) (in z q) (= (+ y z) x) (forall (u v) (-> (and (in u p) (in v q) (= (+ u v) x)) (and (= u y) (= v z)))))))))))
  hard_negative:
    statement: $p+q=M$だけで全ての$x$の分解は一意である。
    reason: $p=q=M\neq0$なら$x\neq0$について$x=x+0=0+x$である。$p\cap q=0$が必要である。
  target: |
    ∀ (S M : Type*) [Ring S] [AddCommGroup M] [Module S M] (p q : Submodule S M), IsCompl p q ↔ ∀ x : M, ∃! u : p × q, (u.1 : M) + u.2 = x
  proof: |
    by
      intro S M _ _ _ p q
      constructor
      · intro h x
        exact Submodule.existsUnique_add_of_isCompl_prod h x
      · intro h
        refine ⟨?_, ?_⟩
        · rw [Submodule.disjoint_def]
          intro x hp hq
          have e := (h x).unique (y₁ := (⟨x, hp⟩, 0)) (y₂ := (0, ⟨x, hq⟩)) (by simp) (by simp)
          simpa using congrArg (fun u : p × q => (u.1 : M)) e
        · rw [codisjoint_iff, eq_top_iff]
          intro x _
          obtain ⟨u, hu, _⟩ := h x
          exact Submodule.mem_sup.mpr ⟨u.1, u.1.2, u.2, u.2.2, hu⟩
- id: finitely_generated_of_submodule_and_quotient
  kind: textbook
  level: 3
  topic: 加群・有限生成性の拡大
  statement: 環上の加群$M$の部分加群$p$について、$p$と$M/p$がともに有限生成なら、$M$も有限生成である。
  statement_en: If a submodule p of a module M over a ring and the quotient M/p are both finitely generated, then M is finitely generated.
  assumptions:
  - $M$は環上の加群
  - $p$は$M$の部分加群
  - $p$と$M/p$は有限生成
  quantifiers:
  - 任意の$M$と$p$
  conclusion: $M$は有限生成である。
  answer: |
    $S$を環、$M$を$S$加群、$p$を部分加群とする。$y_1,\dots,y_k$を$p$の生成系とし、$M/p$の生成系を$\bar{x}_1,\dots,\bar{x}_l$、その代表元を$x_1,\dots,x_l\in M$とする。$x\in M$をとると、$\bar{x}=\sum_ja_j\bar{x}_j$となる$a_j\in S$がある。$x-\sum_ja_jx_j$は$p$に入るから$\sum_ib_iy_i$と書ける。よって$x=\sum_ja_jx_j+\sum_ib_iy_i$であり、$x_1,\dots,x_l,y_1,\dots,y_k$は$M$を生成する。
  strategy: Lift generators of the quotient and add generators of the submodule.
  sketch:
  - 'setup: Choose generators y_i of p and lifts x_j of generators of M/p.'
  - 'derive: For x in M, subtract a combination of the x_j to land in p.'
  - 'derive: Express the remainder through the y_i.'
  - 'conclude: The x_j and y_i together generate M.'
  openmath: (forall (S M p) (-> (and (is_ring S) (is_module S M) (is_submodule p M) (finitely_generated_module S p) (finitely_generated_module S (quotient_module M p))) (finitely_generated_module S M)))
  hard_negative:
    statement: $M/p$が有限生成なら$M$も有限生成である。
    reason: 体上の無限次元空間$M$と$p=M$では$M/p=0$は有限生成だが、$M$は有限生成でない。
  target: |
    ∀ (S M : Type*) [Ring S] [AddCommGroup M] [Module S M] (p : Submodule S M), Module.Finite S p → Module.Finite S (M ⧸ p) → Module.Finite S M
  proof: |
    by
      intro S M _ _ _ p h1 h2
      exact Module.Finite.of_submodule_quotient p
- id: subgroup_product_set_card_formula
  kind: textbook
  level: 2
  topic: 群論・部分群の積の位数
  statement: 有限群$G$の部分群$H,K$について、積集合$HK=\{hk\mid h\in H,k\in K\}$は$|HK|\cdot|H\cap K|=|H|\cdot|K|$をみたす。$HK$が部分群であることは仮定しない。
  statement_en: For subgroups H and K of a finite group G, the product set HK = {hk} satisfies |HK|·|H∩K| = |H|·|K|, without assuming that HK is a subgroup.
  assumptions:
  - $G$は有限群
  - $H,K$は$G$の部分群
  quantifiers:
  - 任意の有限群$G$と部分群$H,K$
  conclusion: $|HK|\cdot|H\cap K|=|H|\cdot|K|$である。
  answer: |
    $G$を有限群、$H,K$をその部分群とする。写像$\varphi:H\times K\to HK$を$\varphi(h,k)=hk$で定めると全射である。$x=h_0k_0\in HK$を固定する。$hk=h_0k_0$は$h_0^{-1}h=k_0k^{-1}$と同値で、この共通の値$t$は$H$と$K$の両方に属する。逆に$t\in H\cap K$に対して$(h_0t,\ t^{-1}k_0)$は$x$の逆像に入る。よって$t\mapsto(h_0t,t^{-1}k_0)$は$H\cap K$から$\varphi^{-1}(x)$への全単射であり、すべての逆像の大きさは$|H\cap K|$である。したがって$|H|\cdot|K|=|H\times K|=|HK|\cdot|H\cap K|$となる。
  strategy: Count the fibres of the multiplication map from H × K onto HK.
  sketch:
  - 'setup: Define φ from H × K onto HK by φ(h,k) = hk.'
  - 'derive: hk = h₀k₀ holds exactly when h₀⁻¹h = k₀k⁻¹ lies in H ∩ K.'
  - 'construct: The map t ↦ (h₀t, t⁻¹k₀) is a bijection from H ∩ K onto the fibre over h₀k₀.'
  - 'conclude: All fibres have size |H ∩ K|, so |H||K| = |HK||H ∩ K|.'
  openmath: (forall (G H K) (-> (and (finite_group G) (subgroup_of H G) (subgroup_of K G)) (= (* (size (subgroup_product H K)) (size (subgroup_inter H K))) (* (size H) (size K)))))
  hard_negative:
    statement: 有限群の部分群$H,K$について、$|HK|$はつねに$|G|$を割り切る。
    reason: $G=S_3$、$H=\langle(1\ 2)\rangle$、$K=\langle(1\ 3)\rangle$では$|HK|=2\cdot2/1=4$であり、$4$は$6$を割り切らない。このとき$HK$は部分群ではない。
  target: |
    ∀ (G : Type*) [Group G] [Finite G] (H K : Subgroup G), Set.ncard {x : G | ∃ h ∈ H, ∃ k ∈ K, x = h * k} * Nat.card (H ⊓ K : Subgroup G) = Nat.card H * Nat.card K
  proof: |
    by
      intro G _ _ H K
      open Pointwise in
      have h0 : {x : G | ∃ h ∈ H, ∃ k ∈ K, x = h * k} = (H : Set G) * (K : Set G) := by
        ext x
        simp only [Set.mem_setOf_eq, Set.mem_mul, SetLike.mem_coe]
        constructor
        · rintro ⟨h, hh, k, hk, rfl⟩; exact ⟨h, hh, k, hk, rfl⟩
        · rintro ⟨h, hh, k, hk, rfl⟩; exact ⟨h, hh, k, hk, rfl⟩
      have h1 := Subgroup.card_mul_eq_card_subgroup_mul_card_quotient K (H : Set G)
      have h2 := MulAction.index_stabilizer H ((1 : G) : G ⧸ K)
      have hs : ∀ h : H, h • ((1 : G) : G ⧸ K) = (((h : G)) : G ⧸ K) := fun h => by
        change ((((h : G) * 1 : G)) : G ⧸ K) = _
        rw [mul_one]
      have h3 : MulAction.stabilizer H ((1 : G) : G ⧸ K) = K.subgroupOf H := by
        ext h
        rw [MulAction.mem_stabilizer_iff, Subgroup.mem_subgroupOf, hs, QuotientGroup.eq]
        simp [inv_mem_iff]
      have h4 : MulAction.orbit H ((1 : G) : G ⧸ K) = ((↑) : G → G ⧸ K) '' (H : Set G) := by
        ext q
        constructor
        · rintro ⟨h, rfl⟩
          exact ⟨h, h.2, (hs h).symm⟩
        · rintro ⟨h, hh, rfl⟩
          exact ⟨⟨h, hh⟩, hs ⟨h, hh⟩⟩
      have h5 : Nat.card (K.subgroupOf H) = Nat.card (H ⊓ K : Subgroup G) := by
        have := Nat.card_congr (Subgroup.equivMapOfInjective (K.subgroupOf H) H.subtype H.subtype_injective).toEquiv
        rw [this, Subgroup.subgroupOf_map_subtype, inf_comm]
      have h6 := (K.subgroupOf H).card_mul_index
      rw [h3, h4, ← Nat.card_coe_set_eq] at h2
      rw [h0, ← Nat.card_coe_set_eq, h1, ← h2, ← h5, ← h6]
      ring
- id: index_inf_eq_mul_of_coprime_index
  kind: gap
  level: 2
  topic: 群論・指数と共通部分
  statement: 群$G$の有限指数の部分群$H,K$について、指数$[G:H]$と$[G:K]$が互いに素なら$[G:H\cap K]=[G:H][G:K]$である。
  statement_en: If H and K are subgroups of finite index in a group G and the indices [G:H] and [G:K] are coprime, then [G:H∩K] = [G:H][G:K].
  assumptions:
  - $H,K$は群$G$の有限指数の部分群
  - $[G:H]$と$[G:K]$は互いに素
  quantifiers:
  - 任意の群$G$と部分群$H,K$
  conclusion: $[G:H\cap K]=[G:H][G:K]$である。
  answer: |
    $G$を群、$H,K$を有限指数の部分群とし、$[G:H]$と$[G:K]$は互いに素とする。写像$g(H\cap K)\mapsto(gH,gK)$は矛盾なく定まる単射なので$[G:H\cap K]\le[G:H][G:K]$であり、とくに左辺は有限である。$H\cap K\le H\le G$に指数の積公式を使うと$[G:H\cap K]=[G:H][H:H\cap K]$なので、$[G:H]$は$[G:H\cap K]$を割り切る。同様に$[G:K]$も割り切る。両者は互いに素だから積$[G:H][G:K]$が$[G:H\cap K]$を割り切り、$[G:H][G:K]\le[G:H\cap K]$を得る。上の不等式と合わせて等号が成り立つ。
  strategy: Combine the upper bound from the coset pair map with divisibility from the tower law.
  sketch:
  - 'derive: The map g(H∩K) ↦ (gH, gK) is injective, so [G:H∩K] ≤ [G:H][G:K].'
  - 'apply_theorem: The tower law shows that [G:H] and [G:K] divide [G:H∩K].'
  - 'derive: Coprimality makes the product [G:H][G:K] divide [G:H∩K].'
  - 'conclude: The two bounds give equality.'
  openmath: (forall (G H K) (-> (and (group G) (finite_index_subgroup H G) (finite_index_subgroup K G) (= (gcd (subgroup_index H G) (subgroup_index K G)) 1)) (= (subgroup_index (subgroup_inter H K) G) (* (subgroup_index H G) (subgroup_index K G)))))
  hard_negative:
    statement: 有限指数の部分群$H,K$についてつねに$[G:H\cap K]=[G:H][G:K]$である。
    reason: $G=\mathbb{Z}/2\times\mathbb{Z}/2$、$H=K=\mathbb{Z}/2\times0$では左辺が$2$、右辺が$4$である。指数が互いに素という仮定は外せない。
  target: |
    ∀ (G : Type*) [Group G] (H K : Subgroup G), H.index ≠ 0 → K.index ≠ 0 → Nat.Coprime H.index K.index → (H ⊓ K).index = H.index * K.index
  proof: |
    by
      intro G _ H K hH hK hc
      have h0 : (H ⊓ K).index ≠ 0 := Subgroup.index_inf_ne_zero hH hK
      have d1 : H.index ∣ (H ⊓ K).index := Subgroup.index_dvd_of_le inf_le_left
      have d2 : K.index ∣ (H ⊓ K).index := Subgroup.index_dvd_of_le inf_le_right
      exact Nat.le_antisymm Subgroup.index_inf_le (Nat.le_of_dvd (Nat.pos_of_ne_zero h0) (hc.mul_dvd_of_dvd_of_dvd d1 d2))
- id: mul_mem_iff_of_index_two_subgroup
  kind: gap
  level: 2
  topic: 群論・指数2の部分群
  statement: 群$G$の指数$2$の部分群$H$と$a,b\in G$について、$ab\in H$は「$a\in H$と$b\in H$が同値であること」と同値である。
  statement_en: For a subgroup H of index 2 in a group G and elements a, b of G, ab lies in H if and only if a ∈ H is equivalent to b ∈ H.
  assumptions:
  - $H$は群$G$の指数$2$の部分群
  quantifiers:
  - 任意の$a,b\in G$
  conclusion: $ab\in H\iff(a\in H\iff b\in H)$である。
  answer: |
    $G$を群、$H$を指数$2$の部分群とし、$a,b\in G$とする。指数が$2$なので$H$は正規で、$G/H$は位数$2$の群である。$\pi:G\to G/H$を自然な射影とする。$x\in H$は$\pi(x)=1$と同値であり、$x\notin H$は$\pi(x)$が$G/H$の唯一の非単位元$c$であることと同値である。$c^2=1$である。$\pi(ab)=\pi(a)\pi(b)$を$\pi(a),\pi(b)\in\{1,c\}$の4通りで調べると、$\pi(ab)=1$となるのは$\pi(a)=\pi(b)$のときに限る。これは$a\in H\iff b\in H$ということである。
  strategy: Pass to the quotient of order two and check the four cases.
  sketch:
  - 'setup: H is normal and G/H has order 2, with non-identity element c.'
  - 'translate: Membership in H means that the image in G/H is 1.'
  - 'case_split: Compute π(a)π(b) in the four cases using c² = 1.'
  - 'conclude: π(ab) = 1 exactly when π(a) = π(b).'
  openmath: (forall (G H a b) (-> (and (group G) (subgroup_of H G) (= (subgroup_index H G) 2) (in a G) (in b G)) (<-> (in (group_mul a b) H) (<-> (in a H) (in b H)))))
  hard_negative:
    statement: 指数$3$の部分群$H$でも、$a,b\notin H$なら$ab\in H$である。
    reason: $G=\mathbb{Z}/3$、$H=0$、$a=b=1$とすると$a+b=2\notin H$である。
  target: |
    ∀ (G : Type*) [Group G] (H : Subgroup G), H.index = 2 → ∀ a b : G, a * b ∈ H ↔ (a ∈ H ↔ b ∈ H)
  proof: |
    by
      intro G _ H h a b
      exact Subgroup.mul_mem_iff_of_index_two h
- id: prime_index_subgroup_is_maximal
  kind: gap
  level: 2
  topic: 群論・極大部分群
  statement: 群$G$の部分群$H$の指数$[G:H]$が素数なら、$H$は$G$の極大部分群である。すなわち$H\ne G$で、$H\le K\le G$なる部分群$K$は$H$か$G$に限る。
  statement_en: A subgroup H of prime index in a group G is maximal, that is, H ≠ G and any subgroup K with H ≤ K ≤ G equals H or G.
  assumptions:
  - $H$は群$G$の部分群
  - $[G:H]$は素数
  quantifiers:
  - 任意の部分群$K$で$H\le K\le G$をみたすもの
  conclusion: $H\ne G$であり、$K=H$または$K=G$である。
  answer: |
    $G$を群、$H$を指数が素数$p$の部分群とする。$p\ne1$なので$H\ne G$である。$H\le K\le G$とすると指数の積公式から$p=[G:H]=[G:K][K:H]$である。$p$は素数なので、$[G:K]=1$または$[K:H]=1$である。前者なら$K=G$、後者なら$K=H$である。
  strategy: Apply the tower law to the prime index.
  sketch:
  - 'setup: Let H ≤ K ≤ G with [G:H] = p prime.'
  - 'apply_theorem: The tower law gives p = [G:K][K:H].'
  - 'case_split: One of the two factors equals 1.'
  - 'conclude: Hence K = G or K = H.'
  openmath: (forall (G H) (-> (and (group G) (subgroup_of H G) (in (subgroup_index H G) P)) (maximal_subgroup H G)))
  hard_negative:
    statement: 極大部分群の指数はつねに素数である。
    reason: $A_5$の位数$10$の二面体部分群は極大だが、指数は$6$で素数でない。
  target: |
    ∀ (G : Type*) [Group G] (H : Subgroup G), H.index.Prime → IsCoatom H
  proof: |
    by
      intro G _ H hp
      refine ⟨fun h => ?_, fun K hK => ?_⟩
      · rw [h, Subgroup.index_top] at hp
        exact Nat.not_prime_one hp
      · have hd : K.index ∣ H.index := Subgroup.index_dvd_of_le hK.le
        rcases (Nat.dvd_prime hp).1 hd with h1 | h2
        · exact Subgroup.index_eq_one.1 h1
        · exfalso
          have hrel : H.relIndex K * K.index = H.index := Subgroup.relIndex_mul_index hK.le
          rw [h2] at hrel
          have : H.relIndex K = 1 := Nat.eq_of_mul_eq_mul_right hp.pos (by simpa using hrel)
          rw [Subgroup.relIndex_eq_one] at this
          exact hK.ne (le_antisymm hK.le this)
- id: dedekind_modular_law_subgroups
  kind: gap
  level: 2
  topic: 群論・デデキントの法則
  statement: 群$G$の部分群$H,K,L$が$H\le L$をみたすとき、集合として$HK\cap L=H(K\cap L)$である。部分群の正規性は仮定しない。
  statement_en: For subgroups H, K, L of a group G with H ≤ L, the sets HK ∩ L and H(K ∩ L) coincide. No normality is assumed.
  assumptions:
  - $H,K,L$は群$G$の部分群
  - $H\le L$
  quantifiers:
  - 任意の$x\in G$
  conclusion: $x\in HK\cap L\iff x\in H(K\cap L)$である。
  answer: |
    $G$を群、$H,K,L$を部分群で$H\le L$とし、$x\in G$とする。$x\in HK\cap L$なら$x=hk$（$h\in H,k\in K$）と書ける。$h\in H\le L$と$x\in L$より$k=h^{-1}x\in L$なので$k\in K\cap L$であり、$x\in H(K\cap L)$である。逆に$x=hk$（$h\in H,k\in K\cap L$）なら$x\in HK$であり、$h,k\in L$より$x\in L$である。
  strategy: Move the factor h across, using that H lies in L.
  sketch:
  - 'setup: Write x = hk with h in H and k in K, and assume x lies in L.'
  - 'derive: Since h lies in L, the element k = h⁻¹x also lies in L.'
  - 'derive: Conversely hk lies in L when h is in H ≤ L and k is in K ∩ L.'
  - 'conclude: The two sets coincide.'
  openmath: (forall (G H K L) (-> (and (group G) (subgroup_of H G) (subgroup_of K G) (subgroup_of L G) (subset H L)) (= (inter (subgroup_product H K) L) (subgroup_product H (subgroup_inter K L)))))
  hard_negative:
    statement: $H\le L$を仮定しなくても$HK\cap L=H(K\cap L)$である。
    reason: $G=\mathbb{Z}$、$H=2\mathbb{Z}$、$K=3\mathbb{Z}$、$L=5\mathbb{Z}$（加法）では、左辺は$H+K=\mathbb{Z}$と$L$の共通部分で$5\mathbb{Z}$、右辺は$2\mathbb{Z}+15\mathbb{Z}=\mathbb{Z}$である。
  target: |
    ∀ (G : Type*) [Group G] (H K L : Subgroup G), H ≤ L → ∀ x : G, ((∃ h ∈ H, ∃ k ∈ K, x = h * k) ∧ x ∈ L ↔ ∃ h ∈ H, ∃ k ∈ K ⊓ L, x = h * k)
  proof: |
    by
      intro G _ H K L hHL x
      constructor
      · rintro ⟨⟨h, hh, k, hk, rfl⟩, hx⟩
        refine ⟨h, hh, k, ⟨hk, ?_⟩, rfl⟩
        have : k = h⁻¹ * (h * k) := by group
        rw [this]
        exact L.mul_mem (L.inv_mem (hHL hh)) hx
      · rintro ⟨h, hh, k, hk, rfl⟩
        exact ⟨⟨h, hh, k, hk.1, rfl⟩, L.mul_mem (hHL hh) hk.2⟩
- id: conjugacy_class_card_eq_index_centralizer
  kind: textbook
  level: 3
  topic: 群論・共役類と中心化群
  statement: 群$G$の元$g$の共役類が有限集合なら、その大きさは中心化群の指数$[G:C_G(g)]$に等しい。
  statement_en: If the conjugacy class of an element g of a group G is finite, its size equals the index [G:C_G(g)] of the centralizer of g.
  assumptions:
  - $G$は群
  - $g$の共役類は有限集合
  quantifiers:
  - 任意の$g\in G$
  conclusion: $g$の共役類の大きさは$[G:C_G(g)]$である。
  answer: |
    $G$を群、$g\in G$とし、$g$の共役類は有限とする。写像$xC_G(g)\mapsto xgx^{-1}$を考える。$x,y\in G$について$xgx^{-1}=ygy^{-1}$は$y^{-1}x\,g=g\,y^{-1}x$すなわち$y^{-1}x\in C_G(g)$と同値であり、これは$xC_G(g)=yC_G(g)$と同値である。よってこの写像は矛盾なく定まる単射で、共役類の定義から全射でもある。したがって左剰余類の個数$[G:C_G(g)]$は共役類の大きさに等しい。
  strategy: Identify conjugates of g with left cosets of its centralizer.
  sketch:
  - 'setup: Consider xC_G(g) ↦ xgx⁻¹.'
  - 'derive: xgx⁻¹ = ygy⁻¹ holds exactly when y⁻¹x lies in C_G(g).'
  - 'conclude: The map is a bijection from the left cosets onto the conjugacy class.'
  openmath: (forall (G g) (-> (and (group G) (in g G) (finite_set (conjugacy_class G g))) (= (size (conjugacy_class G g)) (subgroup_index (element_centralizer G g) G))))
  hard_negative:
    statement: $g$の共役類の大きさは中心化群の位数$|C_G(g)|$に等しい。
    reason: $G=S_3$、$g=(1\ 2)$では共役類の大きさは$3$、$|C_G(g)|=2$である。正しくは位数ではなく指数である。
  target: |
    ∀ (G : Type*) [Group G] (g : G), {x : G | IsConj g x}.Finite → Set.ncard {x : G | IsConj g x} = (Subgroup.centralizer ({g} : Set G)).index
  proof: |
    by
      intro G _ g _
      have h := MulAction.index_stabilizer (ConjAct G) g
      rw [ConjAct.orbit_eq_carrier_conjClasses, ConjAct.stabilizer_eq_centralizer] at h
      have h2 : (ConjClasses.mk g).carrier = {x : G | IsConj g x} := by
        ext x
        rw [ConjClasses.mem_carrier_iff_mk_eq, ConjClasses.mk_eq_mk_iff_isConj]
        exact isConj_comm
      rw [h2] at h
      exact h.symm
- id: number_of_conjugate_subgroups_eq_index_normalizer
  kind: gap
  level: 3
  topic: 群論・共役部分群の個数
  statement: 群$G$の部分群$H$の共役部分群$gHg^{-1}$全体が有限集合なら、その個数は正規化群の指数$[G:N_G(H)]$に等しい。
  statement_en: If the set of conjugates gHg⁻¹ of a subgroup H of a group G is finite, its size equals the index [G:N_G(H)] of the normalizer of H.
  assumptions:
  - $H$は群$G$の部分群
  - $H$の共役部分群全体は有限集合
  quantifiers:
  - 任意の群$G$と部分群$H$
  conclusion: $H$の共役部分群の個数は$[G:N_G(H)]$である。
  answer: |
    $G$を群、$H$を部分群とし、共役部分群全体は有限とする。$N=N_G(H)=\{x\in G\mid xHx^{-1}=H\}$とおく。$x,y\in G$について$xHx^{-1}=yHy^{-1}$は$(y^{-1}x)H(y^{-1}x)^{-1}=H$すなわち$y^{-1}x\in N$と同値であり、これは$xN=yN$と同値である。よって$xN\mapsto xHx^{-1}$は左剰余類全体から共役部分群全体への矛盾なく定まる全単射である。個数を比べて結論を得る。
  strategy: Identify conjugates of H with left cosets of its normalizer.
  sketch:
  - 'setup: Consider xN ↦ xHx⁻¹ where N is the normalizer of H.'
  - 'derive: xHx⁻¹ = yHy⁻¹ holds exactly when y⁻¹x lies in N.'
  - 'conclude: The map is a bijection, so the number of conjugates is [G:N].'
  openmath: (forall (G H) (-> (and (group G) (subgroup_of H G) (finite_set (conjugate_subgroups G H))) (= (size (conjugate_subgroups G H)) (subgroup_index (subgroup_normalizer H G) G))))
  hard_negative:
    statement: 共役部分群の個数は指数$[G:H]$に等しい。
    reason: $G$がアーベル群で$H$が真部分群なら共役は$H$だけで個数は$1$だが、$[G:H]>1$である。
  target: |
    ∀ (G : Type*) [Group G] (H : Subgroup G), {K : Subgroup G | ∃ g : G, K = H.map (MulAut.conj g).toMonoidHom}.Finite → Set.ncard {K : Subgroup G | ∃ g : G, K = H.map (MulAut.conj g).toMonoidHom} = (Subgroup.normalizer (H : Set G)).index
  proof: |
    by
      intro G _ H _
      open Pointwise in
      letI : MulAction G (Subgroup G) := MulAction.compHom _ (MulAut.conj : G →* MulAut G)
      have hd : ∀ g : G, g • H = H.map (MulAut.conj g).toMonoidHom := fun g => by
        ext x
        change x ∈ (MulAut.conj g) • H ↔ _
        rw [Subgroup.mem_smul_pointwise_iff_exists]
        simp [MulAut.smul_def]
      have h := MulAction.index_stabilizer G H
      have hs : MulAction.stabilizer G H = Subgroup.normalizer (H : Set G) := by
        ext g
        rw [MulAction.mem_stabilizer_iff, hd, Subgroup.mem_normalizer_iff_map_conj_eq]
        exact Iff.rfl
      have ho : MulAction.orbit G H = {K : Subgroup G | ∃ g : G, K = H.map (MulAut.conj g).toMonoidHom} := by
        ext K
        constructor
        · rintro ⟨g, rfl⟩; exact ⟨g, hd g⟩
        · rintro ⟨g, rfl⟩; exact ⟨g, hd g⟩
      rw [hs, ho] at h
      exact h.symm
- id: normal_subgroup_orbits_equinumerous
  kind: gap
  level: 2
  topic: 群作用・正規部分群の軌道
  statement: 群$G$が集合$X$に推移的に作用し$N$が$G$の正規部分群なら、$N$の任意の2つの軌道の間に全単射がある。とくに$N$の軌道はすべて同じ大きさである。
  statement_en: If a group G acts transitively on a set X and N is a normal subgroup of G, then any two N-orbits are in bijection; in particular all N-orbits have the same size.
  assumptions:
  - $G$は集合$X$に推移的に作用する
  - $N$は$G$の正規部分群
  quantifiers:
  - 任意の$x,y\in X$
  conclusion: $Nx$と$Ny$の間に全単射がある。
  answer: |
    $G$を群、$X$を推移的に作用される集合、$N$を正規部分群とし、$x,y\in X$とする。推移性から$y=gx$となる$g\in G$がある。写像$z\mapsto gz$は$X$の全単射である。$n\in N$について$g(nx)=(gng^{-1})(gx)$であり、$gng^{-1}\in N$なので$g(Nx)\subseteq Ny$である。また$n\in N$について$ny=g\bigl((g^{-1}ng)x\bigr)$で$g^{-1}ng\in N$なので$Ny\subseteq g(Nx)$である。よって$z\mapsto gz$は$Nx$から$Ny$への全単射を与える。
  strategy: Translate an orbit by an element of G and use normality.
  sketch:
  - 'setup: Choose g with y = gx.'
  - 'derive: g(nx) = (gng⁻¹)(gx) lies in Ny since N is normal.'
  - 'derive: ny = g((g⁻¹ng)x) shows the reverse inclusion.'
  - 'conclude: Multiplication by g is a bijection from Nx onto Ny.'
  openmath: (forall (G X Nn x y) (-> (and (transitive_action G X) (normal_subgroup Nn G) (in x X) (in y X)) (equinumerous (action_orbit Nn x) (action_orbit Nn y))))
  hard_negative:
    statement: 推移的な作用の部分群$H$の軌道は、$H$が正規でなくてもすべて同じ大きさである。
    reason: $S_3$の$\{1,2,3\}$への作用で$H=\langle(1\ 2)\rangle$の軌道は$\{1,2\}$と$\{3\}$であり、大きさが異なる。
  target: |
    ∀ (G X : Type*) [Group G] [MulAction G X] [MulAction.IsPretransitive G X] (N : Subgroup G), N.Normal → ∀ x y : X, Nonempty (MulAction.orbit N x ≃ MulAction.orbit N y)
  proof: |
    by
      intro G X _ _ _ N hN x y
      obtain ⟨g, rfl⟩ := MulAction.exists_smul_eq G x y
      have hinj : Function.Injective (fun z : X => g • z) := MulAction.injective g
      have himg : (fun z : X => g • z) '' MulAction.orbit N x = MulAction.orbit N (g • x) := by
        ext z
        constructor
        · rintro ⟨_, ⟨n, rfl⟩, rfl⟩
          refine ⟨⟨g * n * g⁻¹, hN.conj_mem _ n.2 g⟩, ?_⟩
          simp [Subgroup.smul_def, mul_smul]
        · rintro ⟨n, rfl⟩
          refine ⟨_, ⟨⟨g⁻¹ * n * g, ?_⟩, rfl⟩, ?_⟩
          · simpa using hN.conj_mem _ n.2 g⁻¹
          · simp [Subgroup.smul_def, mul_smul]
      exact ⟨(Equiv.Set.image _ _ hinj).trans (Equiv.setCongr himg)⟩
- id: subgroup_transitive_iff_mul_stabilizer_eq_top
  kind: gap
  level: 2
  topic: 群作用・部分群の推移性
  statement: 群$G$が集合$X$に推移的に作用するとき、$x\in X$と部分群$H$について、$H$が$X$に推移的に作用することと、$G=H\,\mathrm{Stab}_G(x)$すなわち任意の$g\in G$が$g=hs$（$h\in H$、$s\in\mathrm{Stab}_G(x)$）と書けることは同値である。
  statement_en: If a group G acts transitively on X, x is a point and H a subgroup, then H acts transitively on X if and only if every g in G can be written g = hs with h in H and s in Stab_G(x).
  assumptions:
  - $G$は集合$X$に推移的に作用する
  - $H$は$G$の部分群
  - $x\in X$
  quantifiers:
  - 任意の群$G$、集合$X$、部分群$H$、点$x$
  conclusion: $H$が推移的$\iff G=H\,\mathrm{Stab}_G(x)$である。
  answer: |
    $G$を$X$に推移的に作用する群、$H$を部分群、$x\in X$、$S=\mathrm{Stab}_G(x)$とする。$H$が推移的なら、$g\in G$に対し$hx=gx$となる$h\in H$があり、$s=h^{-1}g$は$sx=x$をみたすので$g=hs$である。逆に$G=HS$とする。$y\in X$に対し、$G$の推移性から$y=gx$となる$g$があり、$g=hs$と書くと$y=h(sx)=hx$である。よって$X$のすべての点は$Hx$に入り、$X=Hx$である。$X$が1つの$H$軌道なので$H$は推移的である。
  strategy: Translate transitivity of H into a factorization through the stabilizer of x.
  sketch:
  - 'derive: If H is transitive, choose h with hx = gx; then h⁻¹g stabilizes x.'
  - 'derive: If G = HS, any y = gx = hsx = hx lies in the orbit Hx.'
  - 'conclude: X is a single H-orbit exactly when G = HS.'
  openmath: (forall (G X H x) (-> (and (transitive_action G X) (subgroup_of H G) (in x X)) (<-> (transitive_action H X) (= G (subgroup_product H (action_stabilizer G x))))))
  hard_negative:
    statement: 部分群$H$が推移的に作用するなら$H\cap\mathrm{Stab}_G(x)=1$である。
    reason: $H=G=S_3$の$\{1,2,3\}$への作用では$H$は推移的だが、$\mathrm{Stab}_G(1)$は位数$2$である。
  target: |
    ∀ (G X : Type*) [Group G] [MulAction G X] [MulAction.IsPretransitive G X] (H : Subgroup G) (x : X), MulAction.IsPretransitive H X ↔ ∀ g : G, ∃ h ∈ H, ∃ s ∈ MulAction.stabilizer G x, g = h * s
  proof: |
    by
      intro G X _ _ _ H x
      constructor
      · intro hH g
        obtain ⟨h, hh⟩ := MulAction.exists_smul_eq H x (g • x)
        refine ⟨h, h.2, (h:G)⁻¹ * g, ?_, by simp⟩
        rw [MulAction.mem_stabilizer_iff, mul_smul, ← hh]
        simp [Subgroup.smul_def]
      · intro h
        refine ⟨fun a b => ?_⟩
        have key : ∀ y : X, ∃ k : H, k • x = y := by
          intro y
          obtain ⟨g, rfl⟩ := MulAction.exists_smul_eq G x y
          obtain ⟨h1, hh1, s, hs, rfl⟩ := h g
          refine ⟨⟨h1, hh1⟩, ?_⟩
          rw [MulAction.mem_stabilizer_iff] at hs
          simp [Subgroup.smul_def, mul_smul, hs]
        obtain ⟨k1, rfl⟩ := key a
        obtain ⟨k2, rfl⟩ := key b
        exact ⟨k2 * k1⁻¹, by simp [mul_smul]⟩
- id: transitive_primitive_iff_stabilizer_maximal
  kind: textbook
  level: 3
  topic: 群作用・原始性
  statement: 群$G$が2点以上の集合$X$に推移的に作用するとき、$x\in X$について、作用が原始的（$G$で保たれる空でないブロックが1点集合と$X$だけ）であることと、$\mathrm{Stab}_G(x)$が$G$の極大部分群であることは同値である。
  statement_en: If a group G acts transitively on a set X with at least two points and x is a point of X, the action is primitive (the only blocks are singletons and X) if and only if Stab_G(x) is a maximal subgroup of G.
  assumptions:
  - $G$は集合$X$に推移的に作用する
  - $X$は2点以上を含む
  - $x\in X$
  quantifiers:
  - 任意の群$G$、集合$X$、点$x$
  conclusion: 作用が原始的$\iff\mathrm{Stab}_G(x)$は極大部分群である。
  answer: |
    $G$を2点以上の集合$X$に推移的に作用する群、$x\in X$、$S=\mathrm{Stab}_G(x)$とする。ブロックとは、任意の$g\in G$について$gB=B$または$gB\cap B=\emptyset$となる部分集合$B$のことである。$S$を含む部分群$K$に$Kx$を対応させ、$x$を含むブロック$B$に$\{g\in G\mid gB=B\}$を対応させる。$Kx$がブロックであることを示す。$gKx\cap Kx\ne\emptyset$なら$gkx=k'x$となる$k,k'\in K$があり、$k'^{-1}gk\in S\le K$より$g\in K$なので$gKx=Kx$である。一方$B$がブロックで$x\in B$のとき、$K_B=\{g\mid gB=B\}$は$S$を含む。$gx\in B$なら$gB\cap B\ne\emptyset$で$gB=B$となるから、$K_Bx=B$である（$\supseteq$は推移性から$y=gx\in B$を選ぶことで得る）。また$K\le K_{Kx}$であり、$g\in K_{Kx}$なら$gx=kx$（$k\in K$）で$k^{-1}g\in S\le K$となるから$K_{Kx}=K$である。よって2つの対応は互いに逆で包含を保つ全単射である。$S$に$\{x\}$が、$G$に$X$が対応する（$X$は2点以上なので$S\ne G$）。したがって$x$を含むブロックが$\{x\}$と$X$だけであることと、$S$を含む部分群が$S$と$G$だけであることは同値である。任意のブロックは推移性により平行移動して$x$を含むようにできるので、前者は原始性と同値である。
  strategy: Set up an inclusion-preserving bijection between subgroups containing the stabilizer and blocks containing x.
  sketch:
  - 'construct: Send K ⊇ S to the orbit Kx and a block B containing x to its setwise stabilizer.'
  - 'derive: Kx is a block, and the setwise stabilizer of B contains S.'
  - 'derive: The two assignments are mutually inverse and preserve inclusion.'
  - 'translate: S corresponds to {x} and G corresponds to X.'
  - 'conclude: Blocks through x are trivial exactly when S is maximal.'
  openmath: (forall (G X x) (-> (and (transitive_action G X) (<= 2 (size X)) (in x X)) (<-> (primitive_action G X) (maximal_subgroup (action_stabilizer G x) G))))
  hard_negative:
    statement: 推移的な作用はつねに原始的である。
    reason: 位数$4$の巡回群が$\mathbb{Z}/4$に平行移動で作用するとき$\{0,2\}$は自明でないブロックである。実際$\mathrm{Stab}=1$は極大でない。
  target: |
    ∀ (G X : Type*) [Group G] [MulAction G X] [MulAction.IsPretransitive G X] [Nontrivial X] (x : X), IsCoatom (MulAction.stabilizer G x) ↔ MulAction.IsPreprimitive G X
  proof: |
    by
      intro G X _ _ _ _ x
      exact MulAction.isCoatom_stabilizer_iff_preprimitive G x
- id: normal_p_subgroup_le_every_sylow
  kind: gap
  level: 3
  topic: 群論・正規p部分群とシロー部分群
  statement: 有限群$G$の正規部分群$N$がすべての元の位数が素数$p$の冪である部分群なら、$N$は$G$のすべてのシロー $p$部分群に含まれる。
  statement_en: If N is a normal subgroup of a finite group G and N is a p-group for a prime p, then N is contained in every Sylow p-subgroup of G.
  assumptions:
  - $G$は有限群
  - $p$は素数
  - $N$は$G$の正規部分群で$p$群
  - $P$は$G$のシロー $p$部分群
  quantifiers:
  - 任意のシロー $p$部分群$P$
  conclusion: $N\le P$である。
  answer: |
    $G$を有限群、$p$を素数、$N$を正規な$p$部分群、$P$をシロー $p$部分群とする。シローの定理より、$p$部分群$N$はあるシロー $p$部分群$Q$に含まれる。シローの第2定理より$P=gQg^{-1}$となる$g\in G$がある。$N$は正規なので$N=gNg^{-1}\le gQg^{-1}=P$である。
  strategy: Put N in one Sylow subgroup, then conjugate.
  sketch:
  - 'apply_theorem: N lies in some Sylow p-subgroup Q.'
  - 'apply_theorem: Sylow subgroups are conjugate, so P = gQg⁻¹.'
  - 'conclude: Normality gives N = gNg⁻¹ ≤ P.'
  openmath: (forall (G Nn Pp p) (-> (and (finite_group G) (normal_subgroup Nn G) (p_group p Nn) (sylow_subgroup p Pp G)) (subset Nn Pp)))
  hard_negative:
    statement: 正規でない$p$部分群も、すべてのシロー $p$部分群に含まれる。
    reason: $S_3$の$\langle(1\ 2)\rangle$はシロー $2$部分群そのものであり、別のシロー $2$部分群$\langle(1\ 3)\rangle$には含まれない。
  target: |
    ∀ (G : Type*) [Group G] [Finite G] (p : ℕ) [Fact p.Prime] (N : Subgroup G) (P : Sylow p G), N.Normal → IsPGroup p N → N ≤ P
  proof: |
    by
      intro G _ _ p _ N P hN hp
      obtain ⟨Q, hQ⟩ := hp.exists_le_sylow
      obtain ⟨g, hg⟩ := MulAction.exists_smul_eq G Q P
      rw [← hg, Sylow.coe_subgroup_smul]
      intro x hx
      rw [Subgroup.mem_smul_pointwise_iff_exists]
      refine ⟨g⁻¹ * x * g, hQ ?_, ?_⟩
      · simpa using hN.conj_mem x hx g⁻¹
      · simp [MulAut.smul_def, MulAut.conj_apply]; group
- id: normal_subgroup_of_order_two_is_central
  kind: gap
  level: 2
  topic: 群論・位数2の正規部分群
  statement: 群$G$の位数$2$の正規部分群は$G$の中心に含まれる。
  statement_en: A normal subgroup of order 2 in a group G is contained in the center of G.
  assumptions:
  - $N$は群$G$の正規部分群
  - $|N|=2$
  quantifiers:
  - 任意の群$G$と部分群$N$
  conclusion: $N\le Z(G)$である。
  answer: |
    $G$を群、$N=\{1,x\}$を位数$2$の正規部分群とする。$g\in G$に対し$gxg^{-1}\in N$である。$x\ne1$より$gxg^{-1}\ne1$なので$gxg^{-1}=x$、すなわち$gx=xg$である。$1$も中心の元だから$N\le Z(G)$である。
  strategy: Conjugation fixes the unique non-identity element of N.
  sketch:
  - 'setup: Write N = {1, x}.'
  - 'derive: gxg⁻¹ lies in N and is not 1, so it equals x.'
  - 'conclude: x commutes with every g, so N lies in the center.'
  openmath: (forall (G Nn) (-> (and (group G) (normal_subgroup Nn G) (= (size Nn) 2)) (subset Nn (group_center G))))
  hard_negative:
    statement: 位数$3$の正規部分群も中心に含まれる。
    reason: $S_3$の$A_3$は位数$3$の正規部分群だが、$(1\ 2)(1\ 2\ 3)(1\ 2)=(1\ 3\ 2)$なので中心に含まれない。
  target: |
    ∀ (G : Type*) [Group G] (N : Subgroup G), N.Normal → Nat.card N = 2 → N ≤ Subgroup.center G
  proof: |
    by
      intro G _ N hN hc x hx
      rw [Subgroup.mem_center_iff]
      intro g
      by_cases h1 : x = 1
      · simp [h1]
      have hconj : g * x * g⁻¹ ∈ N := hN.conj_mem x hx g
      have hne : g * x * g⁻¹ ≠ 1 := by
        intro h
        apply h1
        have : x = g⁻¹ * (g * x * g⁻¹) * g := by group
        rw [this, h]; group
      obtain ⟨z, -, hz⟩ := (Nat.card_eq_two_iff' (1 : N)).1 hc
      have e1 : (⟨g * x * g⁻¹, hconj⟩ : N) = z := hz _ (fun h => hne (congrArg Subtype.val h))
      have e2 : (⟨x, hx⟩ : N) = z := hz _ (fun h => h1 (congrArg Subtype.val h))
      have heq : g * x * g⁻¹ = x := congrArg Subtype.val (e1.trans e2.symm)
      calc g * x = g * x * g⁻¹ * g := by group
        _ = x * g := by rw [heq]
- id: frattini_argument_sylow
  kind: textbook
  level: 3
  topic: 群論・フラッティーニの論法
  statement: 有限群$G$の正規部分群$N$とそのシロー $p$部分群$P$について、$G=N\cdot N_G(P)$である。
  statement_en: Frattini argument. If N is a normal subgroup of a finite group G and P is a Sylow p-subgroup of N, then G = N·N_G(P).
  assumptions:
  - $G$は有限群
  - $N$は$G$の正規部分群
  - $p$は素数
  - $P$は$N$のシロー $p$部分群
  quantifiers:
  - 任意の$N$と$P$
  conclusion: $G=N\cdot N_G(P)$である。
  answer: |
    $G$を有限群、$N$を正規部分群、$P$を$N$のシロー $p$部分群とする。$g\in G$をとる。$N$が正規なので$gPg^{-1}\le N$であり、位数が$|P|$に等しいから$gPg^{-1}$も$N$のシロー $p$部分群である。シローの第2定理を$N$に使うと、$gPg^{-1}=nPn^{-1}$となる$n\in N$がある。このとき$n^{-1}g\in N_G(P)$なので$g=n\cdot n^{-1}g\in N\cdot N_G(P)$である。
  strategy: Conjugate P by g inside N and correct by an element of N.
  sketch:
  - 'setup: For g in G, gPg⁻¹ is again a Sylow p-subgroup of N.'
  - 'apply_theorem: Sylow conjugacy in N gives n in N with gPg⁻¹ = nPn⁻¹.'
  - 'derive: n⁻¹g normalizes P.'
  - 'conclude: g = n(n⁻¹g) lies in N·N_G(P).'
  openmath: (forall (G Nn Pp p) (-> (and (finite_group G) (normal_subgroup Nn G) (sylow_subgroup p Pp Nn)) (= (subgroup_product Nn (subgroup_normalizer Pp G)) G)))
  hard_negative:
    statement: $N$が正規でなくても$G=N\cdot N_G(P)$である。
    reason: $G=S_3$、$N=P=\langle(1\ 2)\rangle$なら$N_G(P)=P$で、$N\cdot N_G(P)=P\ne G$である。
  target: |
    ∀ (G : Type*) [Group G] [Finite G] (p : ℕ) [Fact p.Prime] (N : Subgroup G) (P : Sylow p N), N.Normal → Subgroup.normalizer ((P : Subgroup N).map N.subtype : Set G) ⊔ N = ⊤
  proof: |
    by
      intro G _ _ p _ N P hN
      haveI := hN
      exact Sylow.normalizer_sup_eq_top P
- id: normal_sylow_subgroup_is_characteristic
  kind: gap
  level: 3
  topic: 群論・正規シロー部分群
  statement: 有限群$G$のシロー $p$部分群$P$が正規なら、$G$の任意の自己同型$\varphi$について$\varphi(P)=P$である。
  statement_en: A normal Sylow p-subgroup P of a finite group G is characteristic, that is, φ(P) = P for every automorphism φ of G.
  assumptions:
  - $G$は有限群
  - $P$は$G$の正規なシロー $p$部分群
  - $\varphi$は$G$の自己同型
  quantifiers:
  - 任意の自己同型$\varphi$
  conclusion: $\varphi(P)=P$である。
  answer: |
    $G$を有限群、$P$を正規なシロー $p$部分群、$\varphi$を自己同型とする。$\varphi(P)$は$|P|$と同じ位数の部分群なので、これもシロー $p$部分群である。シローの第2定理より$\varphi(P)=gPg^{-1}$となる$g\in G$があり、$P$が正規なので右辺は$P$に等しい。
  strategy: The image of P is a Sylow subgroup, hence conjugate to P, hence equal to P.
  sketch:
  - 'derive: φ(P) has the same order as P, so it is a Sylow p-subgroup.'
  - 'apply_theorem: Sylow conjugacy gives φ(P) = gPg⁻¹.'
  - 'conclude: Normality gives φ(P) = P.'
  openmath: (forall (G Pp p f) (-> (and (finite_group G) (sylow_subgroup p Pp G) (normal_subgroup Pp G) (group_iso f G G)) (= (subgroup_image f Pp) Pp)))
  hard_negative:
    statement: 有限群の正規部分群はつねに特性部分群である。
    reason: $G=\mathbb{Z}/2\times\mathbb{Z}/2$の$H=\mathbb{Z}/2\times0$は正規だが、成分の入れ替えで$0\times\mathbb{Z}/2$に移るので特性部分群でない。
  target: |
    ∀ (G : Type*) [Group G] [Finite G] (p : ℕ) [Fact p.Prime] (P : Sylow p G), (P : Subgroup G).Normal → ∀ φ : G ≃* G, (P : Subgroup G).map φ.toMonoidHom = P
  proof: |
    by
      intro G _ _ p _ P hP φ
      have := P.characteristic_of_normal hP
      exact Subgroup.characteristic_iff_map_eq.1 this φ
- id: order_pq_group_has_normal_subgroup_of_order_q
  kind: gap
  level: 3
  topic: 群論・位数pqの群
  statement: 素数$p<q$について、位数$pq$の群は位数$q$の正規部分群をもつ。
  statement_en: For primes p < q, every group of order pq has a normal subgroup of order q.
  assumptions:
  - $p,q$は素数で$p<q$
  - $G$は位数$pq$の群
  quantifiers:
  - 任意の素数$p<q$と位数$pq$の群$G$
  conclusion: $|H|=q$なる正規部分群$H$がある。
  answer: |
    $p<q$を素数、$G$を位数$pq$の群とする。コーシーの定理より位数$q$の元があり、それが生成する位数$q$の部分群を$H$とする。指数は$[G:H]=p$で、$p$は$|G|$を割る最小の素数である。有限群で指数が位数の最小素因数に等しい部分群は正規なので、$H$は正規である。
  strategy: Take a subgroup of order q and use the normality of subgroups of smallest prime index.
  sketch:
  - 'apply_theorem: Cauchy gives a subgroup H of order q.'
  - 'derive: H has index p, the smallest prime dividing |G|.'
  - 'apply_theorem: A subgroup of smallest prime index is normal.'
  openmath: (forall (G p q) (-> (and (group G) (in p P) (in q P) (< p q) (= (size G) (* p q))) (exists (H) (and (normal_subgroup H G) (= (size H) q)))))
  hard_negative:
    statement: 位数$pq$の群は位数$p$の正規部分群ももつ。
    reason: $S_3$は$p=2,q=3$の場合で、位数$2$の部分群は$3$個あって互いに共役であり、どれも正規でない。
  target: |
    ∀ (G : Type*) [Group G] (p q : ℕ), p.Prime → q.Prime → p < q → Nat.card G = p * q → ∃ H : Subgroup G, H.Normal ∧ Nat.card H = q
  proof: |
    by
      intro G _ p q hp hq hpq hc
      haveI : Fact q.Prime := ⟨hq⟩
      haveI : Finite G := Nat.finite_of_card_ne_zero (by rw [hc]; exact Nat.mul_ne_zero hp.ne_zero hq.ne_zero)
      obtain ⟨H, hH⟩ := Sylow.exists_subgroup_card_pow_prime (G := G) q (n := 1) (by rw [hc, pow_one]; exact dvd_mul_left q p)
      rw [pow_one] at hH
      refine ⟨H, ?_, hH⟩
      have hi : H.index = p := by
        have := H.card_mul_index
        rw [hH, hc, mul_comm p q] at this
        exact Nat.eq_of_mul_eq_mul_left hq.pos this
      apply Subgroup.normal_of_index_eq_minFac_card
      rw [hi, hc]
      have hne : p * q ≠ 1 := by have := hp.two_le; have := hq.two_le; nlinarith
      have hmp := Nat.minFac_prime hne
      rcases (Nat.Prime.dvd_mul hmp).1 (Nat.minFac_dvd (p * q)) with h | h
      · exact ((Nat.prime_dvd_prime_iff_eq hmp hp).1 h).symm
      · have h1 := (Nat.prime_dvd_prime_iff_eq hmp hq).1 h
        have h2 := Nat.minFac_le_of_dvd hp.two_le (dvd_mul_right p q)
        omega
- id: order_pq_group_cyclic_if_not_congruent
  kind: textbook
  level: 3
  topic: 群論・位数pqの群
  statement: 素数$p<q$が$q\not\equiv1\pmod p$をみたすなら、位数$pq$の群は巡回群である。
  statement_en: If p < q are primes with q ≢ 1 modulo p, then every group of order pq is cyclic.
  assumptions:
  - $p,q$は素数で$p<q$
  - $q\not\equiv1\pmod p$
  - $G$は位数$pq$の群
  quantifiers:
  - 任意の素数$p,q$と位数$pq$の群$G$
  conclusion: $G$は巡回群である。
  answer: |
    $p<q$を素数で$q\not\equiv1\pmod p$とし、$G$を位数$pq$の群とする。シロー $p$部分群の個数$n_p$は$q$を割り$n_p\equiv1\pmod p$をみたす。$n_p=q$は仮定に反するので$n_p=1$であり、位数$p$の部分群$A$は正規である。位数$q$の部分群$B$は、指数$p$が$|G|$の最小素因数なので正規である。$|A|,|B|$は互いに素なので$A\cap B=1$であり、交わりが自明な正規部分群の元どうしは可換である。$A$の生成元$x$（位数$p$）と$B$の生成元$y$（位数$q$）は可換で位数が互いに素なので、$xy$の位数は$pq=|G|$である。よって$G$は$xy$で生成される巡回群である。
  strategy: Show both Sylow subgroups are normal, then multiply commuting generators of coprime order.
  sketch:
  - 'apply_theorem: Sylow counting gives n_p = 1, so the subgroup A of order p is normal.'
  - 'apply_theorem: The subgroup B of order q has smallest prime index, so it is normal.'
  - 'derive: A ∩ B = 1, so elements of A and B commute.'
  - 'derive: Generators x, y have commuting coprime orders, so xy has order pq.'
  - 'conclude: G is cyclic, generated by xy.'
  openmath: (forall (G p q) (-> (and (group G) (in p P) (in q P) (< p q) (!= (nat_mod q p) 1) (= (size G) (* p q))) (cyclic_group G)))
  hard_negative:
    statement: 素数$p<q$なら位数$pq$の群はつねに巡回群である。
    reason: $p=2,q=3$では$q\equiv1\pmod2$であり、位数$6$の$S_3$は巡回群でない。
  target: |
    ∀ (G : Type*) [Group G] (p q : ℕ), p.Prime → q.Prime → p < q → ¬ q ≡ 1 [MOD p] → Nat.card G = p * q → IsCyclic G
  proof: |
    by
      intro G _ p q hp hq hpq hmod hc
      haveI : Fact q.Prime := ⟨hq⟩
      haveI : Fact p.Prime := ⟨hp⟩
      haveI : Finite G := Nat.finite_of_card_ne_zero (by rw [hc]; exact Nat.mul_ne_zero hp.ne_zero hq.ne_zero)
      obtain ⟨A, hA⟩ := Sylow.exists_subgroup_card_pow_prime (G := G) p (n := 1) (by rw [hc, pow_one]; exact dvd_mul_right p q)
      obtain ⟨B, hB⟩ := Sylow.exists_subgroup_card_pow_prime (G := G) q (n := 1) (by rw [hc, pow_one]; exact dvd_mul_left q p)
      rw [pow_one] at hA hB
      have hiA : A.index = q := by
        have := A.card_mul_index
        rw [hA, hc] at this
        exact Nat.eq_of_mul_eq_mul_left hp.pos this
      have hiB : B.index = p := by
        have := B.card_mul_index
        rw [hB, hc, mul_comm p q] at this
        exact Nat.eq_of_mul_eq_mul_left hq.pos this
      have hBn : B.Normal := by
        apply Subgroup.normal_of_index_eq_minFac_card
        rw [hiB, hc]
        have hne : p * q ≠ 1 := by have := hp.two_le; have := hq.two_le; nlinarith
        have hmp := Nat.minFac_prime hne
        rcases (Nat.Prime.dvd_mul hmp).1 (Nat.minFac_dvd (p * q)) with h | h
        · exact ((Nat.prime_dvd_prime_iff_eq hmp hp).1 h).symm
        · have h1 := (Nat.prime_dvd_prime_iff_eq hmp hq).1 h
          have h2 := Nat.minFac_le_of_dvd hp.two_le (dvd_mul_right p q)
          omega
      let P : Sylow p G := Sylow.ofCard A (by rw [hA, hc, Nat.factorization_mul hp.ne_zero hq.ne_zero]; simp [hp.factorization, hq.factorization, hpq.ne'])
      have hcount : Nat.card (Sylow p G) = 1 := by
        have h1 : Nat.card (Sylow p G) ≡ 1 [MOD p] := card_sylow_modEq_one p G
        have h2 : Nat.card (Sylow p G) ∣ q := by
          have := P.card_dvd_index
          rwa [show (P : Subgroup G) = A from rfl, hiA] at this
        rcases (Nat.dvd_prime hq).1 h2 with h | h
        · exact h
        · rw [h] at h1; exact absurd h1 hmod
      have hAn : A.Normal := by
        haveI : Subsingleton (Sylow p G) := (Nat.card_eq_one_iff_unique.1 hcount).1
        exact P.normal_of_subsingleton
      have hdis : Disjoint A B := Subgroup.disjoint_of_coprime_natCard (by rw [hA, hB]; exact (Nat.coprime_primes hp hq).2 hpq.ne)
      obtain ⟨x, hxA⟩ := exists_prime_orderOf_dvd_card' (G := A) p (by rw [hA])
      obtain ⟨y, hyB⟩ := exists_prime_orderOf_dvd_card' (G := B) q (by rw [hB])
      have hcomm : Commute (x : G) (y : G) := Subgroup.commute_of_normal_of_disjoint A B hAn hBn hdis x y x.2 y.2
      have hxo : orderOf (x : G) = p := by rw [Subgroup.orderOf_coe, hxA]
      have hyo : orderOf (y : G) = q := by rw [Subgroup.orderOf_coe, hyB]
      apply isCyclic_of_orderOf_eq_card ((x : G) * (y : G))
      rw [hcomm.orderOf_mul_eq_mul_orderOf_of_coprime (by rw [hxo, hyo]; exact (Nat.coprime_primes hp hq).2 hpq.ne), hxo, hyo, hc]
- id: p_group_simple_iff_prime_order
  kind: gap
  level: 3
  topic: 群論・単純なp群
  statement: 素数$p$と自然数$n$について、位数$p^n$の群が単純群なら$n=1$である。
  statement_en: For a prime p and a natural number n, if a group of order p^n is simple, then n = 1.
  assumptions:
  - $p$は素数
  - $G$は位数$p^n$の単純群
  quantifiers:
  - 任意の素数$p$と自然数$n$
  conclusion: $n=1$である。
  answer: |
    $p$を素数、$G$を位数$p^n$の単純群とする。単純群は非自明なので$n\ge1$である。自明でない$p$群の中心は自明でなく、中心は正規部分群だから、単純性より$Z(G)=G$である。よって$G$はアーベル群である。$1\ne x\in G$をとると$\langle x\rangle$は正規で自明でないから$G=\langle x\rangle$であり、$G$は巡回群である。$n\ge2$なら位数$p^{n-1}$の部分群があって$G$の真の非自明な正規部分群になり単純性に反する。したがって$n=1$である。
  strategy: The nontrivial center forces G to be abelian, and a simple abelian p-group has order p.
  sketch:
  - 'apply_theorem: A nontrivial p-group has nontrivial center.'
  - 'derive: Simplicity gives Z(G) = G, so G is abelian.'
  - 'derive: G is cyclic, and n ≥ 2 would give a proper nontrivial subgroup.'
  - 'conclude: Hence n = 1.'
  openmath: (forall (G p n) (-> (and (simple_group G) (in p P) (in n N) (= (size G) (^ p n))) (= n 1)))
  hard_negative:
    statement: 位数$p^n$の群はどれも単純でない。
    reason: 位数$p$の巡回群（$n=1$）は単純群である。
  target: |
    ∀ (G : Type*) [Group G] [Finite G] (p n : ℕ) [Fact p.Prime], IsSimpleGroup G → Nat.card G = p ^ n → n = 1
  proof: |
    by
      intro G _ _ p n hp hS hc
      have hP : IsPGroup p G := IsPGroup.of_card hc
      have hZ := hP.bot_lt_center
      have hT : Subgroup.center G = ⊤ := (Subgroup.Normal.eq_bot_or_eq_top (inferInstance : (Subgroup.center G).Normal)).resolve_left hZ.ne'
      have hcomm : ∀ a b : G, a * b = b * a := fun a b => by
        have : a ∈ Subgroup.center G := by rw [hT]; trivial
        exact ((Subgroup.mem_center_iff.1 this) b).symm
      letI : CommGroup G := { (inferInstance : Group G) with mul_comm := hcomm }
      have hpr : (Nat.card G).Prime := IsSimpleGroup.prime_card
      rw [hc] at hpr
      rcases n with _ | _ | n
      · simp at hpr; exact absurd hpr Nat.not_prime_one
      · rfl
      · exact absurd hpr (Nat.Prime.not_prime_pow (by omega))
- id: hom_between_coprime_order_groups_trivial
  kind: gap
  level: 2
  topic: 群論・位数が互いに素な群の準同型
  statement: 位数が互いに素な有限群$G,H$の間の群準同型$f:G\to H$は自明である。すなわちすべての$g\in G$で$f(g)=1$である。
  statement_en: A group homomorphism f from G to H between finite groups of coprime orders is trivial, that is, f(g) = 1 for all g.
  assumptions:
  - $G,H$は有限群
  - $|G|$と$|H|$は互いに素
  - $f:G\to H$は群準同型
  quantifiers:
  - 任意の$g\in G$
  conclusion: $f(g)=1$である。
  answer: |
    $G,H$を位数が互いに素な有限群、$f:G\to H$を準同型、$g\in G$とする。$f(g)$の位数は、$f(g)\in H$なので$|H|$を割り切る。また$f(g)^{|G|}=f(g^{|G|})=f(1)=1$なので$|G|$も割り切る。$|G|$と$|H|$は互いに素だから$f(g)$の位数は$1$であり、$f(g)=1$である。
  strategy: The order of f(g) divides both group orders.
  sketch:
  - 'apply_theorem: Lagrange shows that the order of f(g) divides |H|.'
  - 'derive: f(g)^|G| = 1 shows that it divides |G|.'
  - 'conclude: Coprimality forces order 1, so f(g) = 1.'
  openmath: (forall (G H f g) (-> (and (finite_group G) (finite_group H) (= (gcd (size G) (size H)) 1) (group_hom f G H) (in g G)) (= (fn_value f g) (group_identity H))))
  hard_negative:
    statement: 位数が互いに素でない有限群の間の準同型はつねに単射である。
    reason: $\mathbb{Z}/4\to\mathbb{Z}/2$の還元は位数が互いに素でない群の間の準同型だが、$2$を$0$に送るので単射でない。
  target: |
    ∀ (G H : Type*) [Group G] [Group H] [Finite G] [Finite H] (f : G →* H), Nat.Coprime (Nat.card G) (Nat.card H) → ∀ g : G, f g = 1
  proof: |
    by
      intro G H _ _ _ _ f hc g
      have h1 : orderOf (f g) ∣ Nat.card H := orderOf_dvd_natCard _
      have h2 : orderOf (f g) ∣ Nat.card G := (orderOf_map_dvd f g).trans (orderOf_dvd_natCard g)
      have := Nat.Coprime.eq_one_of_dvd (hc.coprime_dvd_left h2) h1
      exact orderOf_eq_one_iff.1 this
- id: normal_hall_subgroup_contains_elements_of_dividing_order
  kind: gap
  level: 2
  topic: 群論・正規Hall部分群
  statement: 有限群$G$の正規部分群$N$について$|N|$と$[G:N]$が互いに素なら、$g^{|N|}=1$をみたす$g\in G$はすべて$N$に属する。
  statement_en: If N is a normal subgroup of a finite group G with |N| and [G:N] coprime, then every g in G with g^|N| = 1 lies in N.
  assumptions:
  - $G$は有限群
  - $N$は$G$の正規部分群
  - $|N|$と$[G:N]$は互いに素
  quantifiers:
  - 任意の$g\in G$で$g^{|N|}=1$をみたすもの
  conclusion: $g\in N$である。
  answer: |
    $G$を有限群、$N$を正規部分群で$|N|$と$[G:N]$は互いに素とし、$g\in G$は$g^{|N|}=1$をみたすとする。剰余類$gN\in G/N$は$(gN)^{|N|}=N$をみたすので、位数は$|N|$を割り切る。ラグランジュの定理より位数は$|G/N|=[G:N]$も割り切る。互いに素なので位数は$1$で、$gN=N$すなわち$g\in N$である。
  strategy: The order of gN in G/N divides both |N| and [G:N].
  sketch:
  - 'derive: (gN)^|N| = N, so the order of gN divides |N|.'
  - 'apply_theorem: Lagrange in G/N shows that it divides [G:N].'
  - 'conclude: Coprimality gives gN = N, so g lies in N.'
  openmath: (forall (G Nn g) (-> (and (finite_group G) (normal_subgroup Nn G) (= (gcd (size Nn) (subgroup_index Nn G)) 1) (in g G) (= (group_pow g (size Nn)) (group_identity G))) (in g Nn)))
  hard_negative:
    statement: 互いに素の仮定がなくても$g^{|N|}=1$なら$g\in N$である。
    reason: $G=\mathbb{Z}/2\times\mathbb{Z}/2$、$N=\mathbb{Z}/2\times0$、$g=(0,1)$では$2g=0$だが$g\notin N$である。
  target: |
    ∀ (G : Type*) [Group G] [Finite G] (N : Subgroup G), N.Normal → Nat.Coprime (Nat.card N) N.index → ∀ g : G, g ^ Nat.card N = 1 → g ∈ N
  proof: |
    by
      intro G _ _ N hN hc g hg
      haveI := hN
      have h1 : orderOf (g : G ⧸ N) ∣ Nat.card N := orderOf_dvd_of_pow_eq_one (by rw [← QuotientGroup.mk_pow, hg]; rfl)
      have h2 : orderOf (g : G ⧸ N) ∣ N.index := orderOf_dvd_natCard _
      have h3 := Nat.eq_one_of_dvd_coprimes hc h1 h2
      rw [orderOf_eq_one_iff] at h3
      exact (QuotientGroup.eq_one_iff g).1 h3
- id: coprime_subgroups_with_product_order_are_complements
  kind: gap
  level: 2
  topic: 群論・補部分群
  statement: 有限群$G$の部分群$H,K$が$|H||K|=|G|$をみたし、$|H|$と$|K|$が互いに素なら、任意の$g\in G$は$g=hk$（$h\in H,k\in K$）とただ一通りに書ける。正規性は仮定しない。
  statement_en: If subgroups H and K of a finite group G satisfy |H||K| = |G| with |H| and |K| coprime, then every g in G is uniquely of the form hk with h in H and k in K. No normality is assumed.
  assumptions:
  - $H,K$は有限群$G$の部分群
  - $|H||K|=|G|$
  - $|H|$と$|K|$は互いに素
  quantifiers:
  - 任意の$g\in G$
  conclusion: $g=hk$となる$(h,k)\in H\times K$がただ1つある。
  answer: |
    $G$を有限群、$H,K$を部分群とし$|H||K|=|G|$、$|H|,|K|$は互いに素とする。$H\cap K$の位数はラグランジュの定理により$|H|$と$|K|$の両方を割るので$1$である。写像$H\times K\to G$、$(h,k)\mapsto hk$を考える。$hk=h'k'$なら$h'^{-1}h=k'k^{-1}\in H\cap K=1$なので$h=h',k=k'$であり、この写像は単射である。両辺の元の個数は$|H||K|=|G|$で等しいから全単射である。これが主張である。
  strategy: The intersection is trivial, so the multiplication map is injective between sets of equal size.
  sketch:
  - 'apply_theorem: Lagrange and coprimality give H ∩ K = 1.'
  - 'derive: hk = h′k′ implies h′⁻¹h = k′k⁻¹ = 1, so multiplication is injective.'
  - 'conclude: Equal cardinalities make it bijective.'
  openmath: (forall (G H K g) (-> (and (finite_group G) (subgroup_of H G) (subgroup_of K G) (= (* (size H) (size K)) (size G)) (= (gcd (size H) (size K)) 1) (in g G)) (exists (h k) (and (in h H) (in k K) (= g (group_mul h k)) (forall (u v) (-> (and (in u H) (in v K) (= g (group_mul u v))) (and (= u h) (= v k))))))))
  hard_negative:
    statement: $|H||K|=|G|$だけで$g=hk$の分解が存在する。
    reason: $G=\mathbb{Z}/4$、$H=K=2\mathbb{Z}/4$では$|H||K|=4$だが、$HK=H\ne G$である。
  target: |
    ∀ (G : Type*) [Group G] [Finite G] (H K : Subgroup G), Nat.card H * Nat.card K = Nat.card G → Nat.Coprime (Nat.card H) (Nat.card K) → ∀ g : G, ∃! p : H × K, (p.1 : G) * (p.2 : G) = g
  proof: |
    by
      intro G _ _ H K h1 h2 g
      have h := Subgroup.isComplement'_of_coprime h1 h2
      exact (Subgroup.isComplement_iff_existsUnique.1 h) g
- id: product_cyclic_iff_cyclic_and_coprime
  kind: textbook
  level: 2
  topic: 群論・巡回群の直積
  statement: 有限群$G,H$について、直積$G\times H$が巡回群であることと、$G,H$がともに巡回群で$|G|,|H|$が互いに素であることは同値である。
  statement_en: For finite groups G and H, the product G × H is cyclic if and only if G and H are both cyclic and |G| and |H| are coprime.
  assumptions:
  - $G,H$は有限群
  quantifiers:
  - 任意の有限群$G,H$
  conclusion: $G\times H$が巡回群$\iff G,H$が巡回群で$\gcd(|G|,|H|)=1$である。
  answer: |
    $G,H$を有限群とする。$G\times H$が$(a,b)$で生成されるとする。射影は全射なので$G=\langle a\rangle$、$H=\langle b\rangle$である。$(a,b)$の位数は$a,b$の位数の最小公倍数$\mathrm{lcm}(|G|,|H|)$であり、これが$|G||H|$に等しいので$\gcd(|G|,|H|)=1$である。逆に$G=\langle a\rangle$、$H=\langle b\rangle$で$\gcd(|G|,|H|)=1$なら、$(a,b)$の位数は$\mathrm{lcm}(|G|,|H|)=|G||H|=|G\times H|$なので、$(a,b)$は$G\times H$を生成する。
  strategy: Compare the order of (a,b), which is the lcm, with the group order.
  sketch:
  - 'derive: Projections of a generator generate G and H.'
  - 'apply_theorem: The order of (a,b) is the lcm of the orders of a and b.'
  - 'derive: The lcm equals |G||H| exactly when the orders are coprime.'
  - 'conclude: Both implications follow by comparing with |G × H|.'
  openmath: (forall (G H) (-> (and (finite_group G) (finite_group H)) (<-> (cyclic_group (direct_product G H)) (and (cyclic_group G) (cyclic_group H) (= (gcd (size G) (size H)) 1)))))
  hard_negative:
    statement: 巡回群の直積はつねに巡回群である。
    reason: $\mathbb{Z}/2\times\mathbb{Z}/2$の元の位数は高々$2$なので、位数$4$の巡回群ではない。
  target: |
    ∀ (G H : Type*) [Group G] [Group H] [Finite G] [Finite H], IsCyclic (G × H) ↔ IsCyclic G ∧ IsCyclic H ∧ Nat.Coprime (Nat.card G) (Nat.card H)
  proof: |
    by
      intro G H _ _ _ _
      rw [Group.isCyclic_prod_iff]
- id: hom_from_zmod_equiv_torsion_elements
  kind: gap
  level: 2
  topic: 群論・巡回群からの準同型
  statement: アーベル群$A$と自然数$n$について、準同型$f:\mathbb{Z}/n\to A$は$nf(1)=0$をみたす。逆に$nx=0$をみたす$x\in A$に対し、$f(1)=x$となる準同型$f:\mathbb{Z}/n\to A$がただ1つある。ここで$\mathbb{Z}/0=\mathbb{Z}$とする。
  statement_en: For an abelian group A and a natural number n, every homomorphism f from Z/n to A satisfies n·f(1) = 0, and for each x in A with n·x = 0 there is a unique homomorphism f from Z/n to A with f(1) = x. Here Z/0 means Z.
  assumptions:
  - $A$はアーベル群
  - $n$は自然数
  quantifiers:
  - 任意の準同型$f:\mathbb{Z}/n\to A$
  - 任意の$x\in A$で$nx=0$をみたすもの
  conclusion: $nf(1)=0$であり、$f(1)=x$となる$f$がただ1つ存在する。
  answer: |
    $A$をアーベル群、$n$を自然数とする。$f:\mathbb{Z}/n\to A$が準同型なら$nf(1)=f(n\cdot1)=f(0)=0$である。逆に$nx=0$とする。準同型$\varphi:\mathbb{Z}\to A$を$\varphi(k)=kx$で定めると$n\mathbb{Z}\subseteq\ker\varphi$なので、$\varphi$は$\mathbb{Z}/n\to A$を誘導し、これは$1$を$x$に送る。一意性は、$f(1)=x$なら$f(k\cdot1)=kf(1)=kx$となり、$\mathbb{Z}/n$の元がすべて$k\cdot1$の形であることから従う。
  strategy: Factor k ↦ kx through the quotient of Z by nZ.
  sketch:
  - 'derive: n·f(1) = f(n·1) = 0.'
  - 'construct: k ↦ kx kills nZ and induces a map from Z/n to A.'
  - 'derive: Any f with f(1) = x satisfies f(k·1) = kx.'
  - 'conclude: Existence and uniqueness hold.'
  openmath: (forall (A n) (-> (and (abelian_group A) (in n N)) (and (forall (f) (-> (group_hom f (zmod_group n) A) (= (group_pow (fn_value f 1) n) (group_identity A)))) (forall (x) (-> (and (in x A) (= (group_pow x n) (group_identity A))) (exists (f) (and (group_hom f (zmod_group n) A) (= (fn_value f 1) x) (forall (u) (-> (and (group_hom u (zmod_group n) A) (= (fn_value u 1) x)) (= u f))))))))))
  hard_negative:
    statement: 任意の$x\in A$に対し$f(1)=x$となる準同型$\mathbb{Z}/n\to A$が存在する。
    reason: $A=\mathbb{Z}$、$n=2$、$x=1$なら$2x\ne0$であり、$\mathbb{Z}/2\to\mathbb{Z}$の準同型は$0$だけである。
  target: |
    ∀ (A : Type*) [AddCommGroup A] (n : ℕ), (∀ f : ZMod n →+ A, n • f 1 = 0) ∧ ∀ x : A, n • x = 0 → ∃! f : ZMod n →+ A, f 1 = x
  proof: |
    by
      intro A _ n
      constructor
      · intro f
        rw [← map_nsmul]
        simp
      · intro x hx
        have h0 : (zmultiplesHom A x) (n : ℤ) = 0 := by simpa [zmultiplesHom] using hx
        have hval : ∀ i : ℤ, (ZMod.lift n ⟨zmultiplesHom A x, h0⟩) (i : ZMod n) = i • x := fun i => by
          have := ZMod.lift_coe n (A := A) ⟨zmultiplesHom A x, h0⟩ i
          simpa using this
        refine ⟨ZMod.lift n ⟨zmultiplesHom A x, h0⟩, ?_, ?_⟩
        · simpa using hval 1
        · intro g hg
          ext k
          obtain ⟨i, rfl⟩ := ZMod.intCast_surjective k
          rw [hval i, ← hg, ← map_zsmul]
          simp
- id: automorphisms_of_cyclic_group_are_units
  kind: textbook
  level: 2
  topic: 群論・巡回群の自己同型群
  statement: 巡回群$G$の自己同型群は、$n=|G|$（$G$が無限なら$n=0$）に対する単数群$(\mathbb{Z}/n)^\times$と同型である。
  statement_en: The automorphism group of a cyclic group G is isomorphic to the unit group (Z/n)^× where n = |G|, with n = 0 when G is infinite.
  assumptions:
  - $G$は巡回群
  - $n=|G|$（無限なら$n=0$）
  quantifiers:
  - 任意の巡回群$G$
  conclusion: $\mathrm{Aut}(G)\cong(\mathbb{Z}/n)^\times$である。
  answer: |
    $G=\langle a\rangle$を巡回群、$n$を上のとおりとする。$G\cong\mathbb{Z}/n$なので$a$の冪$a^k$は$k\bmod n$で定まる。準同型$\varphi:G\to G$は$\varphi(a)=a^k$で決まり、$\varphi(a^j)=a^{kj}$である。逆に任意の$k$に対し$a\mapsto a^k$は矛盾なく準同型$\varphi_k$を定める。$\varphi_k\circ\varphi_l=\varphi_{kl}$であり、$\varphi_1$は恒等写像である。$\varphi_k$が自己同型なら逆写像は$\varphi_l$の形で$kl\equiv1\pmod n$となり、逆に$kl\equiv1\pmod n$なら$\varphi_l$が$\varphi_k$の逆写像である。よって$k\mapsto\varphi_k$は$(\mathbb{Z}/n)^\times$から$\mathrm{Aut}(G)$への同型である。
  strategy: An endomorphism is determined by the power to which it raises a generator.
  sketch:
  - 'setup: Write G = ⟨a⟩ and φ_k(a) = a^k.'
  - 'derive: φ_k φ_l = φ_{kl}, and φ_1 is the identity.'
  - 'derive: φ_k is invertible exactly when k is a unit modulo n.'
  - 'conclude: k ↦ φ_k is an isomorphism from (Z/n)^× onto Aut(G).'
  openmath: (forall (G) (-> (cyclic_group G) (group_isomorphic (automorphism_group G) (zmod_units (group_order_or_zero G)))))
  hard_negative:
    statement: 巡回群の自己同型群はつねに巡回群である。
    reason: $G=\mathbb{Z}/8$では$(\mathbb{Z}/8)^\times\cong\mathbb{Z}/2\times\mathbb{Z}/2$であり巡回群でない。
  target: |
    ∀ (G : Type*) [Group G] [IsCyclic G], Nonempty (MulAut G ≃* (ZMod (Nat.card G))ˣ)
  proof: |
    by
      intro G _ _
      exact ⟨IsCyclic.mulAutMulEquiv G⟩
- id: cyclic_group_classification
  kind: textbook
  level: 2
  topic: 群論・巡回群の分類
  statement: 巡回群$G$は、有限なら$\mathbb{Z}/|G|$に、無限なら$\mathbb{Z}$に同型である。
  statement_en: A cyclic group G is isomorphic to Z/|G| if it is finite, and to Z if it is infinite.
  assumptions:
  - $G$は巡回群
  quantifiers:
  - 任意の巡回群$G$
  conclusion: $G$は有限なら$\mathbb{Z}/|G|$に、無限なら$\mathbb{Z}$に同型である。
  answer: |
    $G=\langle a\rangle$を巡回群とする。$\varphi:\mathbb{Z}\to G$を$\varphi(k)=a^k$で定めると全射準同型である。$\ker\varphi$は$\mathbb{Z}$の部分群なので$n\mathbb{Z}$（$n\ge0$）の形である。準同型定理より$G\cong\mathbb{Z}/n\mathbb{Z}$である。$n=0$なら$G\cong\mathbb{Z}$で$G$は無限である。$n>0$なら$G$は$n$元からなるので$n=|G|$である。よって$G$が有限なら$G\cong\mathbb{Z}/|G|$、無限なら$G\cong\mathbb{Z}$である。
  strategy: Apply the first isomorphism theorem to k ↦ a^k.
  sketch:
  - 'construct: Define a surjection φ from Z to G by φ(k) = a^k.'
  - 'derive: The kernel is nZ for some n ≥ 0.'
  - 'apply_theorem: The first isomorphism theorem gives G ≅ Z/nZ.'
  - 'case_split: n = 0 gives Z; n > 0 gives n = |G|.'
  openmath: (forall (G) (-> (cyclic_group G) (and (-> (finite_set G) (group_isomorphic G (zmod_group (size G)))) (-> (not (finite_set G)) (group_isomorphic G Z)))))
  hard_negative:
    statement: 位数が等しいアーベル群はすべて同型である。
    reason: $\mathbb{Z}/4$と$\mathbb{Z}/2\times\mathbb{Z}/2$は位数が等しいアーベル群だが、後者は巡回群でなく同型でない。
  target: |
    ∀ (G : Type*) [Group G], IsCyclic G → (Finite G → Nonempty (G ≃* Multiplicative (ZMod (Nat.card G)))) ∧ (Infinite G → Nonempty (G ≃* Multiplicative ℤ))
  proof: |
    by
      intro G _ h
      refine ⟨fun _ => ⟨(zmodCyclicMulEquiv h).symm⟩, fun _ => ?_⟩
      exact ⟨(intCyclicMulEquiv).symm⟩
- id: int_subgroup_is_multiples
  kind: gap
  level: 2
  topic: 群論・整数の部分群
  statement: 加法群$\mathbb{Z}$の任意の部分群$H$は、ただ1つの自然数$n$により$H=n\mathbb{Z}$と書ける。
  statement_en: Every subgroup H of the additive group Z equals nZ for a unique natural number n.
  assumptions:
  - $H$は$\mathbb{Z}$の加法部分群
  quantifiers:
  - 任意の部分群$H$
  conclusion: $H=n\mathbb{Z}$となる自然数$n$がただ1つある。
  answer: |
    $H$を$\mathbb{Z}$の部分群とする。$H=0$なら$n=0$とする。$H\ne0$なら、$H$は逆元で閉じているので正の元を含み、その最小のものを$n$とする。$n\mathbb{Z}\subseteq H$は明らかである。$a\in H$を$a=qn+r$（$0\le r<n$）と割ると、$r=a-qn\in H$であり、$n$の最小性から$r=0$である。よって$H=n\mathbb{Z}$である。一意性は、$n\mathbb{Z}=m\mathbb{Z}$（$n,m\ge0$）なら$n\mid m$かつ$m\mid n$なので$n=m$であることから従う。
  strategy: Use division with remainder by the smallest positive element.
  sketch:
  - 'case_split: H = 0 gives n = 0.'
  - 'setup: Otherwise let n be the smallest positive element of H.'
  - 'derive: Division with remainder shows every element of H is a multiple of n.'
  - 'conclude: Mutual divisibility gives uniqueness.'
  openmath: (forall (H) (-> (subgroup_of H Z) (exists (n) (and (in n N) (= H (int_multiples n)) (forall (m) (-> (and (in m N) (= H (int_multiples m))) (= m n)))))))
  hard_negative:
    statement: $\mathbb{Q}$の加法部分群もすべて$r\mathbb{Z}$の形である。
    reason: $\mathbb{Z}[1/2]$は$\mathbb{Q}$の部分群だが、$r\mathbb{Z}$の形ではない。元$1/2^k$がいくらでも小さくなるからである。
  target: |
    ∀ (H : AddSubgroup ℤ), ∃! n : ℕ, H = AddSubgroup.zmultiples (n : ℤ)
  proof: |
    by
      intro H
      obtain ⟨a, ha⟩ := Int.subgroup_cyclic H
      refine ⟨a.natAbs, ?_, ?_⟩
      · rw [ha, ← AddSubgroup.zmultiples_eq_closure]
        rcases Int.natAbs_eq a with h | h
        · rw [← h]
        · rw [show ((a.natAbs : ℕ) : ℤ) = -a by omega, AddSubgroup.zmultiples_neg]
      · intro m hm
        rw [ha, ← AddSubgroup.zmultiples_eq_closure] at hm
        have h1 : m ∣ a.natAbs := by
          have : a ∈ AddSubgroup.zmultiples (m : ℤ) := hm ▸ AddSubgroup.mem_zmultiples a
          exact Int.natCast_dvd.1 (Int.mem_zmultiples_iff.1 this)
        have h2 : a.natAbs ∣ m := by
          have : (m : ℤ) ∈ AddSubgroup.zmultiples a := hm ▸ AddSubgroup.mem_zmultiples (m : ℤ)
          have h3 := Int.natAbs_dvd_natAbs.2 (Int.mem_zmultiples_iff.1 this)
          simpa using h3
        exact Nat.dvd_antisymm h1 h2
- id: inner_automorphism_group_iso_quotient_center
  kind: textbook
  level: 2
  topic: 群論・内部自己同型群
  statement: 群$G$の内部自己同型全体のなす群$\mathrm{Inn}(G)$は$G/Z(G)$と同型である。
  statement_en: The group Inn(G) of inner automorphisms of a group G is isomorphic to G/Z(G).
  assumptions:
  - $G$は群
  quantifiers:
  - 任意の群$G$
  conclusion: $G/Z(G)\cong\mathrm{Inn}(G)$である。
  answer: |
    $G$を群とする。$c_g(x)=gxg^{-1}$とおくと、$c_{gh}=c_g\circ c_h$なので$c:G\to\mathrm{Aut}(G)$、$g\mapsto c_g$は準同型で、像は$\mathrm{Inn}(G)$である。$c_g$が恒等写像であることは、すべての$x$で$gxg^{-1}=x$すなわち$gx=xg$であることと同値だから、$\ker c=Z(G)$である。準同型定理より$G/Z(G)\cong\mathrm{Inn}(G)$である。
  strategy: Apply the first isomorphism theorem to the conjugation homomorphism.
  sketch:
  - 'construct: g ↦ c_g is a homomorphism from G to Aut(G) with image Inn(G).'
  - 'derive: c_g is the identity exactly when g is central.'
  - 'apply_theorem: The first isomorphism theorem gives G/Z(G) ≅ Inn(G).'
  openmath: (forall (G) (-> (group G) (group_isomorphic (quotient_group G (group_center G)) (inner_automorphism_group G))))
  hard_negative:
    statement: 任意の群で$\mathrm{Inn}(G)=\mathrm{Aut}(G)$である。
    reason: $G=\mathbb{Z}/3$では$\mathrm{Inn}(G)$は自明だが、$x\mapsto-x$は恒等写像でない自己同型である。
  target: |
    ∀ (G : Type*) [Group G], Nonempty ((G ⧸ Subgroup.center G) ≃* (MulAut.conj : G →* MulAut G).range)
  proof: |
    by
      intro G _
      have h : (MulAut.conj : G →* MulAut G).ker = Subgroup.center G := by
        ext g
        rw [MonoidHom.mem_ker, Subgroup.mem_center_iff, MulEquiv.ext_iff]
        constructor
        · intro h x
          have := h x
          simp only [MulAut.conj_apply, MulAut.one_apply] at this
          calc x * g = g * x * g⁻¹ * g := by rw [this]
            _ = g * x := by group
        · intro h x
          simp only [MulAut.conj_apply, MulAut.one_apply]
          rw [← h x]; group
      exact ⟨(QuotientGroup.quotientMulEquivOfEq h.symm).trans (QuotientGroup.quotientKerEquivRange MulAut.conj)⟩
- id: characteristic_subgroup_of_normal_is_normal
  kind: gap
  level: 2
  topic: 群論・特性部分群
  statement: 群$G$の正規部分群$N$の特性部分群$K$（$N$のすべての自己同型で保たれる部分群）は、$G$の正規部分群である。
  statement_en: A characteristic subgroup K of a normal subgroup N of a group G is normal in G.
  assumptions:
  - $N$は群$G$の正規部分群
  - $K$は$N$の特性部分群
  quantifiers:
  - 任意の群$G$と部分群$N,K$
  conclusion: $K$は$G$の正規部分群である。
  answer: |
    $G$を群、$N$を正規部分群、$K$を$N$の特性部分群とする。$g\in G$に対し、$N$が正規なので$c_g(x)=gxg^{-1}$は$N$の自己同型を定める。$K$は特性部分群なので$c_g(K)=K$、すなわち$gKg^{-1}=K$である。$g$は任意なので$K$は$G$で正規である。
  strategy: Conjugation by g restricts to an automorphism of N.
  sketch:
  - 'derive: Conjugation by g restricts to an automorphism of N since N is normal.'
  - 'translate: K is preserved by this automorphism because it is characteristic.'
  - 'conclude: gKg⁻¹ = K for every g.'
  openmath: (forall (G Nn K) (-> (and (normal_subgroup Nn G) (characteristic_subgroup K Nn)) (normal_subgroup K G)))
  hard_negative:
    statement: 正規部分群の正規部分群は正規である。
    reason: 位数$8$の二面体群$D_4$の鏡映$s$について、$\langle s\rangle$は$\{1,r^2,s,r^2s\}$の正規部分群であり、後者は$D_4$の正規部分群だが、$\langle s\rangle$は$D_4$で正規でない。
  target: |
    ∀ (G : Type*) [Group G] (N : Subgroup G) (K : Subgroup N), N.Normal → K.Characteristic → (K.map N.subtype).Normal
  proof: |
    by
      intro G _ N K hN hK
      infer_instance
- id: commutator_product_identities
  kind: gap
  level: 2
  topic: 群論・交換子の公式
  statement: 群$G$の元$a,b,c$について、$[x,y]=xyx^{-1}y^{-1}$とおくと、$[a,bc]=[a,b]\cdot b[a,c]b^{-1}$かつ$[ab,c]=a[b,c]a^{-1}\cdot[a,c]$である。
  statement_en: For elements a, b, c of a group, with [x,y] = xyx⁻¹y⁻¹, one has [a,bc] = [a,b]·b[a,c]b⁻¹ and [ab,c] = a[b,c]a⁻¹·[a,c].
  assumptions:
  - $G$は群
  - $[x,y]=xyx^{-1}y^{-1}$
  quantifiers:
  - 任意の$a,b,c\in G$
  conclusion: $[a,bc]=[a,b]\cdot b[a,c]b^{-1}$かつ$[ab,c]=a[b,c]a^{-1}\cdot[a,c]$である。
  answer: |
    $G$を群、$a,b,c\in G$とする。第1式の右辺を展開すると$aba^{-1}b^{-1}\cdot b\,aca^{-1}c^{-1}\,b^{-1}=ab\,c\,a^{-1}c^{-1}b^{-1}=a(bc)a^{-1}(bc)^{-1}$となり、$[a,bc]$に等しい。第2式の右辺は$a\,bcb^{-1}c^{-1}\,a^{-1}\cdot aca^{-1}c^{-1}=abcb^{-1}a^{-1}c^{-1}=(ab)c(ab)^{-1}c^{-1}$となり、$[ab,c]$に等しい。
  strategy: Expand the right-hand sides and cancel adjacent inverse pairs.
  sketch:
  - 'derive: Expanding [a,b]·b[a,c]b⁻¹ and cancelling b⁻¹b and a⁻¹a gives a(bc)a⁻¹(bc)⁻¹.'
  - 'derive: Expanding a[b,c]a⁻¹·[a,c] and cancelling gives (ab)c(ab)⁻¹c⁻¹.'
  openmath: (forall (G a b c) (-> (and (group G) (in a G) (in b G) (in c G)) (and (= (group_commutator a (group_mul b c)) (group_mul (group_commutator a b) (group_mul (group_mul b (group_commutator a c)) (group_inv b)))) (= (group_commutator (group_mul a b) c) (group_mul (group_mul (group_mul a (group_commutator b c)) (group_inv a)) (group_commutator a c))))))
  hard_negative:
    statement: 交換子は双線形で、$[a,bc]=[a,b][a,c]$がつねに成り立つ。
    reason: $S_3$で$a=b=(1\ 2)$、$c=(1\ 2\ 3)$とする。$aca^{-1}=c^{-1}$より$[a,c]=c^{-2}=c$であり、$[a,b]=1$なので右辺は$c$である。一方$bc=(2\ 3)$なので$[a,bc]=((1\ 2)(2\ 3))^2=c^2\ne c$である。正しい式では第2因子を$b$で共役する。
  target: |
    ∀ (G : Type*) [Group G] (a b c : G), a * (b * c) * a⁻¹ * (b * c)⁻¹ = (a * b * a⁻¹ * b⁻¹) * (b * (a * c * a⁻¹ * c⁻¹) * b⁻¹) ∧ (a * b) * c * (a * b)⁻¹ * c⁻¹ = (a * (b * c * b⁻¹ * c⁻¹) * a⁻¹) * (a * c * a⁻¹ * c⁻¹)
  proof: |
    by
      intro G _ a b c
      constructor <;> group
- id: goursat_lemma_subgroups_of_product
  kind: named
  level: 3
  topic: 群論・グルサの補題
  statement: 群$G,H$の直積の部分群$I$に対し、部分群$G'\le G$、$H'\le H$、正規部分群$M\trianglelefteq G'$、$N\trianglelefteq H'$と同型$e:G'/M\to H'/N$があって、$(g,h)\in I$は「$g\in G'$、$h\in H'$かつ$e(gM)=hN$」と同値である。
  statement_en: Goursat's lemma. For a subgroup I of G × H there are subgroups G′ ≤ G and H′ ≤ H, normal subgroups M of G′ and N of H′, and an isomorphism e from G′/M to H′/N such that (g,h) ∈ I if and only if g ∈ G′, h ∈ H′ and e(gM) = hN.
  assumptions:
  - $G,H$は群
  - $I$は$G\times H$の部分群
  quantifiers:
  - 任意の$(g,h)\in G\times H$
  conclusion: $(g,h)\in I\iff g\in G',\ h\in H',\ e(gM)=hN$である。
  answer: |
    $G,H$を群、$I$を$G\times H$の部分群とする。$G',H'$を$I$の第1、第2射影の像とし、$M=\{g\mid(g,1)\in I\}$、$N=\{h\mid(1,h)\in I\}$とおく。$(a,b)\in I$と$g\in M$に対し$(a,b)(g,1)(a,b)^{-1}=(aga^{-1},1)\in I$なので$M\trianglelefteq G'$であり、同様に$N\trianglelefteq H'$である。$(g,h)\in I$に対し$e(gM)=hN$と定める。$(g,h),(gm,h')\in I$（$m\in M$）なら$(gm,h')(m,1)^{-1}(g,h)^{-1}=(1,h'h^{-1})\in I$より$h'N=hN$であり、$e$は矛盾なく定まる。$I$が部分群なので$e$は準同型で、$H'$の定義から全射である。$e(gM)=N$なら$(g,n)\in I$（$n\in N$）で、$(g,n)(1,n)^{-1}=(g,1)\in I$より$g\in M$なので単射である。$(g,h)\in I$なら定義より右辺が成り立つ。逆に$g\in G'$、$h\in H'$、$e(gM)=hN$なら、$(g,h_0)\in I$かつ$h_0N=hN$となる$h_0$があり、$h=h_0n$（$n\in N$）として$(g,h)=(g,h_0)(1,n)\in I$である。
  strategy: Take projections and the two fibres over the identity, and define e from membership in I.
  sketch:
  - 'construct: Let G′, H′ be the projections of I, and M, N the sets of g, h with (g,1), (1,h) in I.'
  - 'derive: Conjugation in I shows that M and N are normal in G′ and H′.'
  - 'construct: Define e(gM) = hN for (g,h) in I and check it is well defined.'
  - 'derive: e is a bijective homomorphism.'
  - 'conclude: (g,h) in I is equivalent to e(gM) = hN.'
  openmath: (forall (G H I) (-> (and (group G) (group H) (subgroup_of I (direct_product G H))) (exists (A B M L e) (and (subgroup_of A G) (subgroup_of B H) (normal_subgroup M A) (normal_subgroup L B) (group_iso e (quotient_group A M) (quotient_group B L)) (forall (g h) (<-> (in (ordered_pair g h) I) (and (in g A) (in h B) (= (fn_value e (quotient_class g M)) (quotient_class h L)))))))))
  hard_negative:
    statement: 直積$G\times H$の部分群はすべて$A\times B$（$A\le G,B\le H$）の形である。
    reason: $\mathbb{Z}/2\times\mathbb{Z}/2$の対角部分群$\{(0,0),(1,1)\}$はこの形でない。グルサの補題では$G'/M\cong H'/N$が自明でない場合にあたる。
  target: |
    ∀ (G H : Type*) [Group G] [Group H] (I : Subgroup (G × H)), ∃ (G' : Subgroup G) (H' : Subgroup H) (M : Subgroup G') (N : Subgroup H') (_ : M.Normal) (_ : N.Normal) (e : G' ⧸ M ≃* H' ⧸ N), ∀ (g : G) (h : H), (g, h) ∈ I ↔ ∃ (hg : g ∈ G') (hh : h ∈ H'), e ((⟨g, hg⟩ : G') : G' ⧸ M) = ((⟨h, hh⟩ : H') : H' ⧸ N)
  proof: |
    by
      intro G H _ _ I
      obtain ⟨G', H', M, N, hM, hN, e, he⟩ := I.goursat
      refine ⟨G', H', M, N, hM, hN, e, fun g h => ?_⟩
      rw [he]
      simp [Subgroup.mem_map, MonoidHom.mem_graph]
- id: semidirect_product_universal_property
  kind: textbook
  level: 3
  topic: 群論・半直積の普遍性
  statement: 作用$\varphi:G\to\mathrm{Aut}(N)$による半直積$N\rtimes_\varphi G$と準同型$a:N\to K$、$b:G\to K$が、すべての$g,n$で$a(\varphi_g(n))=b(g)a(n)b(g)^{-1}$をみたすなら、$F|_N=a$、$F|_G=b$となる準同型$F:N\rtimes_\varphi G\to K$がただ1つある。
  statement_en: Given a semidirect product N ⋊_φ G and homomorphisms a from N to K and b from G to K with a(φ_g(n)) = b(g)a(n)b(g)⁻¹ for all g, n, there is a unique homomorphism F from N ⋊_φ G to K restricting to a on N and b on G.
  assumptions:
  - $\varphi:G\to\mathrm{Aut}(N)$は準同型
  - $a:N\to K$、$b:G\to K$は準同型
  - $a(\varphi_g(n))=b(g)a(n)b(g)^{-1}$
  quantifiers:
  - 任意の群$N,G,K$
  conclusion: $F(n,1)=a(n)$、$F(1,g)=b(g)$をみたす準同型$F$がただ1つある。
  answer: |
    $N,G,K$を群、$\varphi,a,b$を上のとおりとする。半直積の積は$(n,g)(n',g')=(n\varphi_g(n'),gg')$である。$F(n,g)=a(n)b(g)$と定める。$F((n,g)(n',g'))=a(n)a(\varphi_g(n'))b(g)b(g')=a(n)b(g)a(n')b(g)^{-1}b(g)b(g')=F(n,g)F(n',g')$なので$F$は準同型で、$F(n,1)=a(n)$、$F(1,g)=b(g)$である。一意性は$(n,g)=(n,1)(1,g)$から従う。
  strategy: Define F(n,g) = a(n)b(g) and use the compatibility condition.
  sketch:
  - 'construct: Define F(n,g) = a(n)b(g).'
  - 'derive: The compatibility condition makes F multiplicative.'
  - 'conclude: (n,g) = (n,1)(1,g) gives uniqueness.'
  openmath: (forall (Nn G K t a b) (-> (and (group Nn) (group G) (group K) (group_action_by_automorphisms t G Nn) (group_hom a Nn K) (group_hom b G K) (forall (g n) (-> (and (in g G) (in n Nn)) (= (fn_value a (fn_value (fn_value t g) n)) (group_mul (group_mul (fn_value b g) (fn_value a n)) (group_inv (fn_value b g))))))) (exists (F) (and (group_hom F (semidirect_product_by t Nn G) K) (forall (n) (-> (in n Nn) (= (fn_value F (ordered_pair n (group_identity G))) (fn_value a n)))) (forall (g) (-> (in g G) (= (fn_value F (ordered_pair (group_identity Nn) g)) (fn_value b g)))) (forall (u) (-> (and (group_hom u (semidirect_product_by t Nn G) K) (forall (n) (-> (in n Nn) (= (fn_value u (ordered_pair n (group_identity G))) (fn_value a n)))) (forall (g) (-> (in g G) (= (fn_value u (ordered_pair (group_identity Nn) g)) (fn_value b g))))) (= u F)))))))
  hard_negative:
    statement: 互換性の条件がなくても、任意の準同型$a,b$から$F$が作れる。
    reason: $N=A_3$、$G=\langle s\rangle$、$\varphi_s$を逆元写像とする$S_3\cong N\rtimes G$で、$K=\mathbb{Z}/3\times\mathbb{Z}/2$、$a,b$を各因子への単射とする。$S_3$の像はアーベルだから$F$は$A_3$を消さねばならず、$F|_N=a$と矛盾する。
  target: |
    ∀ (N G K : Type*) [Group N] [Group G] [Group K] (φ : G →* MulAut N) (a : N →* K) (b : G →* K), (∀ g n, a (φ g n) = b g * a n * (b g)⁻¹) → ∃! F : SemidirectProduct N G φ →* K, (∀ n, F (SemidirectProduct.inl n) = a n) ∧ ∀ g, F (SemidirectProduct.inr g) = b g
  proof: |
    by
      intro N G K _ _ _ φ a b h
      have hh : ∀ g, a.comp (φ g).toMonoidHom = (MulAut.conj (b g)).toMonoidHom.comp a := fun g => by
        ext n
        simp [h]
      refine ⟨SemidirectProduct.lift a b hh, ⟨fun n => by simp, fun g => by simp⟩, ?_⟩
      rintro F ⟨h1, h2⟩
      apply SemidirectProduct.hom_ext
      · ext n; simp [h1]
      · ext g; simp [h2]
- id: split_surjection_decomposes_group
  kind: gap
  level: 2
  topic: 群論・分裂する全射
  statement: 群準同型$\pi:G\to H$と$s:H\to G$が$\pi\circ s=\mathrm{id}_H$をみたすなら、$\ker\pi\cap s(H)=1$であり、任意の$g\in G$は$g=nt$（$n\in\ker\pi$、$t\in s(H)$）と書ける。
  statement_en: If group homomorphisms π from G to H and s from H to G satisfy π∘s = id, then ker π ∩ s(H) = 1 and every g in G can be written g = nt with n in ker π and t in s(H).
  assumptions:
  - $\pi:G\to H$、$s:H\to G$は群準同型
  - $\pi\circ s=\mathrm{id}_H$
  quantifiers:
  - 任意の$g\in G$
  conclusion: $\ker\pi\cap s(H)=1$であり、$g=nt$（$n\in\ker\pi,t\in s(H)$）と書ける。
  answer: |
    $G,H$を群、$\pi,s$を上のとおりとする。$x=s(h)\in\ker\pi$なら$h=\pi(s(h))=\pi(x)=1$なので$x=s(1)=1$である。$g\in G$に対し$t=s(\pi(g))$、$n=gt^{-1}$とおく。$\pi(n)=\pi(g)\pi(s(\pi(g)))^{-1}=\pi(g)\pi(g)^{-1}=1$なので$n\in\ker\pi$であり、$g=nt$である。
  strategy: Use t = s(π(g)) as the section part of g.
  sketch:
  - 'derive: If s(h) lies in ker π, then h = π(s(h)) = 1.'
  - 'construct: Put t = s(π(g)) and n = gt⁻¹.'
  - 'conclude: π(n) = 1, so g = nt is the required factorization.'
  openmath: (forall (G H f s) (-> (and (group_hom f G H) (group_hom s H G) (forall (h) (-> (in h H) (= (fn_value f (fn_value s h)) h)))) (and (= (subgroup_inter (group_kernel f) (group_image s)) (trivial_subgroup G)) (= (subgroup_product (group_kernel f) (group_image s)) G))))
  hard_negative:
    statement: 全射準同型$\pi:G\to H$にはつねにこのような$s$がある。
    reason: $\mathbb{Z}/4\to\mathbb{Z}/2$の還元に対し、$\mathbb{Z}/2\to\mathbb{Z}/4$の準同型の像は$\{0,2\}$に入り、還元すると$0$になるので$\pi\circ s=\mathrm{id}$とならない。
  target: |
    ∀ (G H : Type*) [Group G] [Group H] (π : G →* H) (s : H →* G), (∀ h, π (s h) = h) → π.ker ⊓ s.range = ⊥ ∧ ∀ g : G, ∃ n ∈ π.ker, ∃ t ∈ s.range, g = n * t
  proof: |
    by
      intro G H _ _ π s hs
      constructor
      · rw [eq_bot_iff]
        rintro x ⟨hk, ⟨h, rfl⟩⟩
        have : h = 1 := by rw [← hs h]; exact hk
        simp [this]
      · intro g
        refine ⟨g * (s (π g))⁻¹, ?_, s (π g), ⟨_, rfl⟩, by group⟩
        rw [MonoidHom.mem_ker, map_mul, map_inv, hs]; group
- id: schur_zassenhaus_complement_exists
  kind: named
  level: 4
  topic: 群論・シューア・ツァッセンハウスの定理
  statement: 有限群$G$の正規部分群$N$について$|N|$と$[G:N]$が互いに素なら、$N$の補部分群、すなわち$N\cap H=1$かつ$NH=G$をみたす部分群$H$が存在する。
  statement_en: Schur–Zassenhaus theorem, existence part. If N is a normal subgroup of a finite group G with |N| and [G:N] coprime, then N has a complement, a subgroup H with N ∩ H = 1 and NH = G.
  assumptions:
  - $G$は有限群
  - $N$は$G$の正規部分群
  - $|N|$と$[G:N]$は互いに素
  quantifiers:
  - 任意の有限群$G$と正規部分群$N$
  conclusion: $N\cap H=1$かつ$NH=G$をみたす部分群$H$がある。
  answer: |
    $G$を有限群、$N$を正規部分群で$m=[G:N]$と$|N|$は互いに素とする。$|G|$に関する帰納法で示す。
    $N$がアーベル群の場合。$N$の各剰余類から1元ずつ選んだ集合を代表系と呼ぶ。代表系$S,T$に対し、$s_q,t_q$を剰余類$q$の代表として$d(S,T)=\prod_q s_qt_q^{-1}\in N$と定める。$N$は可換なので順序によらず、$d(S,T)d(T,U)=d(S,U)$、$d(gS,gT)=gd(S,T)g^{-1}$である。$d(S,T)=1$で定まる同値関係の商を$X$とすると、$G$は$X$に左から作用する。$n\in N$に対し、$nS$の$q$での代表は$ns_q$なので$d(nS,S)=n^m$である。$m$は$|N|$と互いに素なので$n\mapsto n^m$は$N$の全単射であり、$N$は$X$に単純推移的に作用する。$x\in X$の固定部分群を$H$とすると、推移性から$G=NH$、自由性から$N\cap H=1$である。
    一般の場合。$N=1$なら$H=G$とする。$N\ne1$とし、$p$を$|N|$の素因数、$P$を$N$のシロー $p$部分群、$Z=Z(P)\ne1$、$L=N_G(P)$とする。フラッティーニの論法より$G=NL$であり、$L/(L\cap N)\cong G/N$である。$Z$は$P$の特性部分群なので$L$で正規である。$|L/Z|<|G|$であり、$L/Z$の正規部分群$(L\cap N)/Z$の位数は$|N|$を割り指数は$m$なので、帰納法の仮定から補部分群$K/Z$がある。すると$|K|=|Z|m$で、$Z$は$K$のアーベルな正規部分群であり指数$m$は$|Z|$と互いに素である。前段より$K$に位数$m$の部分群$H$がある。$|H|=m$と$|N|$は互いに素なので$N\cap H=1$で、$|NH|=|N|m=|G|$より$NH=G$である。
  strategy: Treat abelian N by an averaging argument on transversals, and reduce the general case by the Frattini argument.
  sketch:
  - 'setup: Induct on |G|, with m = [G:N].'
  - 'construct: For abelian N, define the difference d(S,T) of transversals and the quotient set X.'
  - 'derive: d(nS,S) = n^m, so N acts simply transitively on X; a stabilizer in G is a complement.'
  - 'apply_theorem: For general N, the Frattini argument gives G = N·N_G(P) for a Sylow subgroup P of N.'
  - 'induction: Apply the hypothesis to L/Z(P) to get K with |K| = |Z|m.'
  - 'conclude: The abelian case in K yields H of order m, which complements N.'
  openmath: (forall (G Nn) (-> (and (finite_group G) (normal_subgroup Nn G) (= (gcd (size Nn) (subgroup_index Nn G)) 1)) (exists (H) (and (subgroup_of H G) (= (subgroup_inter Nn H) (trivial_subgroup G)) (= (subgroup_product Nn H) G)))))
  hard_negative:
    statement: 互いに素の仮定がなくても正規部分群には補部分群がある。
    reason: $\mathbb{Z}/4$の部分群$2\mathbb{Z}/4$の補部分群は位数$2$の部分群で$2\mathbb{Z}/4$と交わらないものだが、位数$2$の部分群はそれ自身だけなので存在しない。
  target: |
    ∀ (G : Type*) [Group G] [Finite G] (N : Subgroup G), N.Normal → Nat.Coprime (Nat.card N) N.index → ∃ H : Subgroup G, Subgroup.IsComplement' N H
  proof: |
    by
      intro G _ _ N hN hc
      haveI := hN
      exact Subgroup.exists_right_complement'_of_coprime hc
- id: solvable_of_chain_with_commutators_descending
  kind: gap
  level: 3
  topic: 群論・可解性の判定
  statement: 群$G$の部分群の列$H_0,H_1,\dots$が$H_0=G$、ある$n$で$H_n=1$、すべての$i$で$[H_i,H_i]\le H_{i+1}$をみたすなら、$G$は可解である。
  statement_en: If subgroups H_0, H_1, ... of a group G satisfy H_0 = G, H_n = 1 for some n, and [H_i,H_i] ≤ H_{i+1} for all i, then G is solvable.
  assumptions:
  - $H_i$は群$G$の部分群の列
  - $H_0=G$、$H_n=1$
  - $[H_i,H_i]\le H_{i+1}$
  quantifiers:
  - 任意の部分群の列と自然数$n$
  conclusion: $G$は可解である。
  answer: |
    $G$を群、$H_i$を上の列とする。導来列を$G^{(0)}=G$、$G^{(i+1)}=[G^{(i)},G^{(i)}]$とする。$G^{(i)}\le H_i$を帰納法で示す。$i=0$は$H_0=G$から成り立つ。$G^{(i)}\le H_i$なら$G^{(i+1)}=[G^{(i)},G^{(i)}]\le[H_i,H_i]\le H_{i+1}$である。とくに$G^{(n)}\le H_n=1$なので$G$は可解である。
  strategy: Compare the derived series with the given chain by induction.
  sketch:
  - 'setup: Let G^(i) be the derived series.'
  - 'induction: G^(i) ≤ H_i for all i.'
  - 'conclude: G^(n) ≤ H_n = 1, so G is solvable.'
  openmath: (forall (G s n) (-> (and (group G) (forall (i) (-> (in i N) (subgroup_of (seq_value s i) G))) (= (seq_value s 0) G) (in n N) (= (seq_value s n) (trivial_subgroup G)) (forall (i) (-> (in i N) (subset (subgroup_commutator (seq_value s i) (seq_value s i)) (seq_value s (+ i 1)))))) (solvable_group G)))
  hard_negative:
    statement: 部分群の列で$H_{i+1}\le H_i$が減少して$H_n=1$となるだけで$G$は可解である。
    reason: $A_5>1$は$H_0=A_5$、$H_1=1$の減少列だが、$A_5$は可解でない。$[H_0,H_0]=A_5\not\le H_1$である。
  target: |
    ∀ (G : Type*) [Group G] (H : ℕ → Subgroup G) (n : ℕ), H 0 = ⊤ → H n = ⊥ → (∀ i, ⁅H i, H i⁆ ≤ H (i + 1)) → IsSolvable G
  proof: |
    by
      intro G _ H n h0 hn hstep
      have key : ∀ i, derivedSeries G i ≤ H i := by
        intro i
        induction i with
        | zero => rw [h0]; exact le_top
        | succ i ih => exact (Subgroup.commutator_mono ih ih).trans (hstep i)
      exact (isSolvable_def G).2 ⟨n, le_bot_iff.1 (hn ▸ key n)⟩
- id: minimal_normal_subgroup_of_solvable_is_abelian
  kind: gap
  level: 3
  topic: 群論・可解群の極小正規部分群
  statement: 可解群$G$の極小正規部分群$N$、すなわち自明でない正規部分群で、それに含まれる正規部分群が$1$と$N$だけのものは、アーベル群である。
  statement_en: A minimal normal subgroup N of a solvable group G, that is, a nontrivial normal subgroup containing no normal subgroups of G other than 1 and N, is abelian.
  assumptions:
  - $G$は可解群
  - $N$は$G$の極小正規部分群
  quantifiers:
  - 任意の$a,b\in N$
  conclusion: $ab=ba$である。
  answer: |
    $G$を可解群、$N$を極小正規部分群とする。$[N,N]$は$N$の特性部分群なので$G$で正規であり、$N$に含まれる。極小性より$[N,N]=1$または$[N,N]=N$である。後者とする。導来列を$G^{(i)}$とすると、$N\le G^{(i)}$なら$N=[N,N]\le[G^{(i)},G^{(i)}]=G^{(i+1)}$なので、すべての$i$で$N\le G^{(i)}$である。$G$は可解なのである$G^{(n)}=1$となり、$N=1$となって矛盾する。よって$[N,N]=1$であり、$N$の元は互いに可換である。
  strategy: The commutator of N is normal in G, so it is 1 or N; the second case contradicts solvability.
  sketch:
  - 'derive: [N,N] is normal in G and contained in N.'
  - 'case_split: Minimality gives [N,N] = 1 or [N,N] = N.'
  - 'induction: If [N,N] = N, then N lies in every derived subgroup of G.'
  - 'contradiction: Solvability would force N = 1.'
  - 'conclude: So [N,N] = 1 and N is abelian.'
  openmath: (forall (G K a b) (-> (and (solvable_group G) (minimal_normal_subgroup K G) (in a K) (in b K)) (= (group_mul a b) (group_mul b a))))
  hard_negative:
    statement: 一般の有限群の極小正規部分群もアーベル群である。
    reason: $A_5$は単純なので$A_5$自身が極小正規部分群だが、アーベル群でない。
  target: |
    ∀ (G : Type*) [Group G] [IsSolvable G] (N : Subgroup G), N.Normal → N ≠ ⊥ → (∀ K : Subgroup G, K.Normal → K ≤ N → K = ⊥ ∨ K = N) → ∀ a ∈ N, ∀ b ∈ N, a * b = b * a
  proof: |
    by
      intro G _ _ N hN hne hmin
      haveI := hN
      have hc : ⁅N, N⁆ = ⊥ := by
        rcases hmin ⁅N, N⁆ inferInstance ((Subgroup.commutator_le_inf N N).trans inf_le_left) with h | h
        · exact h
        · exfalso
          obtain ⟨m, hm⟩ := (isSolvable_def G).1 (inferInstance : IsSolvable G)
          have key : ∀ i, N ≤ derivedSeries G i := by
            intro i
            induction i with
            | zero => exact le_top
            | succ i ih => exact h.ge.trans (Subgroup.commutator_mono ih ih)
          exact hne (le_bot_iff.1 (hm ▸ key m))
      intro a ha b hb
      have := Subgroup.commutator_mem_commutator ha hb
      rw [hc, Subgroup.mem_bot] at this
      exact commutatorElement_eq_one_iff_mul_comm.1 this
- id: nonabelian_simple_group_perfect_and_centerless
  kind: gap
  level: 2
  topic: 群論・非可換単純群
  statement: 非可換な単純群$G$では$[G,G]=G$かつ$Z(G)=1$である。
  statement_en: A nonabelian simple group G satisfies [G,G] = G and Z(G) = 1.
  assumptions:
  - $G$は単純群
  - $G$は非可換
  quantifiers:
  - 任意の非可換単純群$G$
  conclusion: $[G,G]=G$かつ$Z(G)=1$である。
  answer: |
    $G$を非可換な単純群とする。$[G,G]$と$Z(G)$はともに正規部分群なので、単純性より$1$か$G$である。$[G,G]=1$なら$G$は可換になり仮定に反するので$[G,G]=G$である。$Z(G)=G$なら$G$は可換になり仮定に反するので$Z(G)=1$である。
  strategy: Both subgroups are normal, and the abelian alternatives are excluded.
  sketch:
  - 'derive: [G,G] and Z(G) are normal, so each is 1 or G.'
  - 'contradiction: [G,G] = 1 or Z(G) = G would make G abelian.'
  - 'conclude: Hence [G,G] = G and Z(G) = 1.'
  openmath: (forall (G) (-> (and (simple_group G) (not (abelian_group G))) (and (= (commutator_subgroup G) G) (= (group_center G) (trivial_subgroup G)))))
  hard_negative:
    statement: 単純群はすべて$[G,G]=G$をみたす。
    reason: 位数$p$の巡回群は単純だが、$[G,G]=1\ne G$である。
  target: |
    ∀ (G : Type*) [Group G] [IsSimpleGroup G], (∃ a b : G, a * b ≠ b * a) → commutator G = ⊤ ∧ Subgroup.center G = ⊥
  proof: |
    by
      intro G _ _ ⟨a, b, hab⟩
      constructor
      · refine (Subgroup.Normal.eq_bot_or_eq_top (inferInstance : (commutator G).Normal)).resolve_left fun h => hab ?_
        have := Subgroup.commutator_mem_commutator (Subgroup.mem_top a) (Subgroup.mem_top b)
        rw [← commutator_def, h, Subgroup.mem_bot] at this
        exact commutatorElement_eq_one_iff_mul_comm.1 this
      · refine (Subgroup.Normal.eq_bot_or_eq_top (inferInstance : (Subgroup.center G).Normal)).resolve_right fun h => hab ?_
        have ha : a ∈ Subgroup.center G := by rw [h]; trivial
        exact ((Subgroup.mem_center_iff.1 ha) b).symm
- id: burnside_normal_p_complement_theorem
  kind: named
  level: 4
  topic: 群論・バーンサイドの転送定理
  statement: 有限群$G$のシロー $p$部分群$P$が$N_G(P)\le C_G(P)$をみたすなら、$P$の正規補部分群、すなわち$K\cap P=1$かつ$KP=G$となる正規部分群$K$が存在する。
  statement_en: Burnside's normal p-complement theorem. If a Sylow p-subgroup P of a finite group G satisfies N_G(P) ≤ C_G(P), then there is a normal subgroup K of G with K ∩ P = 1 and KP = G.
  assumptions:
  - $G$は有限群
  - $P$は$G$のシロー $p$部分群
  - $N_G(P)\le C_G(P)$
  quantifiers:
  - 任意の有限群$G$とシロー $p$部分群$P$
  conclusion: $K\cap P=1$かつ$KP=G$となる正規部分群$K$がある。
  answer: |
    $G,P$を上のとおりとする。$P\le N_G(P)\le C_G(P)$より$P$はアーベル群である。$m=[G:P]$とし、左剰余類の代表$t_1,\dots,t_m$をとる。$g\in G$に対し$gt_i=t_{\sigma(i)}h_i(g)$（$h_i(g)\in P$）と書き、$V(g)=\prod_ih_i(g)$と定める。$h_i(gg')=h_{\sigma'(i)}(g)h_i(g')$と$P$の可換性から$V:G\to P$は準同型である。
    $x\in P$について$V(x)=x^m$を示す。$\langle x\rangle$の$G/P$への作用の軌道を番号で$i_0\to i_1\to\dots\to i_{f-1}\to i_0$（$i_{j+1}=\sigma(i_j)$）と書き、$t=t_{i_0}$とする。$xt_{i_j}=t_{i_{j+1}}h_{i_j}(x)$を順に代入すると$x^ft=t\,h_{i_{f-1}}(x)\cdots h_{i_0}(x)$なので、この軌道の寄与は$z=t^{-1}x^ft\in P$であり、$\sum f=m$である。$y=x^f\in P$とおく。$P$はアーベルなので$P\le C_G(z)$であり、$C_G(y)\ge P$より$t^{-1}Pt\le C_G(z)$である。$P$と$t^{-1}Pt$はともに$C_G(z)$のシロー $p$部分群なので、$c\in C_G(z)$で$c\,t^{-1}Pt\,c^{-1}=P$となるものがある。$w=ct^{-1}\in N_G(P)\le C_G(P)$であり、$wyw^{-1}=czc^{-1}=z$と$y\in P$から$z=y$である。よって$V(x)=\prod x^f=x^m$である。
    $m$は$|P|$と互いに素なので$x\mapsto x^m$は$P$の全単射である。したがって$V$は全射で、$K=\ker V$は正規であり$K\cap P=1$である。$|K|=|G|/|P|$なので$|KP|=|G|$となり$KP=G$である。
  strategy: Construct the transfer to P and show it restricts to the power map x ↦ x^m on P.
  sketch:
  - 'derive: P is abelian because P ≤ N_G(P) ≤ C_G(P).'
  - 'construct: Define the transfer V from G to P using coset representatives.'
  - 'derive: On each ⟨x⟩-orbit, the contribution t⁻¹x^f t equals x^f by Sylow conjugacy in the centralizer.'
  - 'derive: Hence V(x) = x^m for x in P, a bijection of P.'
  - 'conclude: K = ker V is a normal complement of P.'
  openmath: (forall (G S p) (-> (and (finite_group G) (sylow_subgroup p S G) (subset (subgroup_normalizer S G) (subgroup_centralizer S G))) (exists (K) (and (normal_subgroup K G) (= (subgroup_inter K S) (trivial_subgroup G)) (= (subgroup_product K S) G)))))
  hard_negative:
    statement: シロー部分群がアーベル群なら、つねに正規補部分群がある。
    reason: $A_5$のシロー $2$部分群はアーベルだが、$A_5$は単純なので指数$4$の正規部分群をもたない。
  target: |
    ∀ (G : Type*) [Group G] [Finite G] (p : ℕ) [Fact p.Prime] (P : Sylow p G), Subgroup.normalizer (P : Set G) ≤ Subgroup.centralizer (P : Set G) → ∃ K : Subgroup G, K.Normal ∧ Subgroup.IsComplement' K P
  proof: |
    by
      intro G _ _ p _ P h
      exact ⟨(MonoidHom.transferSylow P h).ker, inferInstance, MonoidHom.ker_transferSylow_isComplement' P h⟩
- id: squarefree_order_group_is_solvable
  kind: textbook
  level: 4
  topic: 群論・平方因子をもたない位数の群
  statement: 位数が平方因子をもたない有限群は可解である。
  statement_en: A finite group whose order is squarefree is solvable.
  assumptions:
  - $G$は有限群
  - $|G|$は平方因子をもたない
  quantifiers:
  - 任意の有限群$G$
  conclusion: $G$は可解である。
  answer: |
    $|G|$に関する帰納法で示す。$G$を位数が平方因子をもたない有限群とする。$|G|=1$なら明らかである。$|G|>1$とし、$p$を$|G|$の最小の素因数、$P$をシロー $p$部分群とする。$|P|=p$なので$P$は巡回群で、$P\le C_G(P)$である。$N_G(P)/C_G(P)$は$\mathrm{Aut}(P)$に単射で埋め込まれ、$|\mathrm{Aut}(P)|=p-1$である。この商の位数は$|G|$を割るので素因数はすべて$p$以上であり、一方$p-1$を割るので$p$未満である。よって商は自明で$N_G(P)\le C_G(P)$である。バーンサイドの正規$p$補部分群定理より$K\cap P=1$、$KP=G$なる正規部分群$K$がある。$|K|=|G|/p$は平方因子をもたないので、帰納法の仮定より$K$は可解である。$G/K\cong P$はアーベル群である。正規部分群と商が可解なので$G$は可解である。
  strategy: Use Burnside's theorem at the smallest prime and induct on the order.
  sketch:
  - 'setup: Induct on |G|; let p be the smallest prime factor and P a Sylow p-subgroup.'
  - 'derive: N_G(P)/C_G(P) embeds in Aut(P), of order p-1, and its prime factors are at least p, so it is trivial.'
  - 'apply_theorem: Burnside gives a normal complement K of P.'
  - 'induction: K is solvable, and G/K is abelian.'
  - 'conclude: G is solvable.'
  openmath: (forall (G) (-> (and (finite_group G) (squarefree (size G))) (solvable_group G)))
  hard_negative:
    statement: 位数が平方因子をもたない有限群はアーベル群である。
    reason: $|S_3|=6$は平方因子をもたないが、$S_3$は非可換である。
  target: |
    ∀ (G : Type*) [Group G] [Finite G], Squarefree (Nat.card G) → IsSolvable G
  proof: |
    by
      intro G _ _ h
      haveI := IsZGroup.of_squarefree h
      infer_instance
- id: maximal_subgroup_of_nilpotent_group_is_normal
  kind: gap
  level: 3
  topic: 群論・冪零群の極大部分群
  statement: 冪零群$G$の極大部分群は正規である。
  statement_en: Every maximal subgroup of a nilpotent group G is normal.
  assumptions:
  - $G$は冪零群
  - $H$は$G$の極大部分群
  quantifiers:
  - 任意の極大部分群$H$
  conclusion: $H$は$G$で正規である。
  answer: |
    $G$を冪零群、$H$を極大部分群とする。冪零群の真部分群は正規化群の中で真に大きくなるので$H<N_G(H)$である。$H$の極大性より$N_G(H)=G$であり、$H$は正規である。
  strategy: The normalizer grows, and maximality forces it to be G.
  sketch:
  - 'apply_theorem: In a nilpotent group a proper subgroup is properly contained in its normalizer.'
  - 'conclude: Maximality gives N_G(H) = G, so H is normal.'
  openmath: (forall (G H) (-> (and (nilpotent_group G) (maximal_subgroup H G)) (normal_subgroup H G)))
  hard_negative:
    statement: 有限群の極大部分群はつねに正規である。
    reason: $S_3$の$\langle(1\ 2)\rangle$は極大だが正規でない。
  target: |
    ∀ (G : Type*) [Group G] [Group.IsNilpotent G] (H : Subgroup G), IsCoatom H → H.Normal
  proof: |
    by
      intro G _ _ H hH
      exact Subgroup.NormalizerCondition.normal_of_coatom H Group.normalizerCondition_of_isNilpotent hH
- id: upper_and_lower_central_series_same_length
  kind: textbook
  level: 3
  topic: 群論・昇中心列と降中心列
  statement: 群$G$の降中心列を$\gamma_0=G$、$\gamma_{i+1}=[\gamma_i,G]$、昇中心列を$Z_0=1$、$Z_{i+1}=\{x\mid\forall y,\ [x,y]\in Z_i\}$とする。任意の自然数$n$について、$\gamma_n=1$と$Z_n=G$は同値である。
  statement_en: 'With lower central series γ_0 = G, γ_{i+1} = [γ_i,G] and upper central series Z_0 = 1, Z_{i+1} = {x : [x,y] ∈ Z_i for all y}, for each natural number n one has γ_n = 1 if and only if Z_n = G.'
  assumptions:
  - $G$は群
  - $\gamma_i$は降中心列、$Z_i$は昇中心列
  quantifiers:
  - 任意の自然数$n$
  conclusion: $\gamma_n=1\iff Z_n=G$である。
  answer: |
    $G$を群、$n$を自然数とする。$\gamma_n=1$とし、$0\le i\le n$について$\gamma_{n-i}\le Z_i$を帰納法で示す。$i=0$は仮定である。$\gamma_{n-i}\le Z_i$で$i<n$なら、$x\in\gamma_{n-i-1}$と$y\in G$に対し$[x,y]\in\gamma_{n-i}\le Z_i$なので$x\in Z_{i+1}$である。$i=n$として$G=\gamma_0\le Z_n$を得る。逆に$Z_n=G$とし、$\gamma_i\le Z_{n-i}$を帰納法で示す。$i=0$は仮定である。$\gamma_i\le Z_{n-i}$で$i<n$なら、$x\in\gamma_i$、$y\in G$について$[x,y]\in Z_{n-i-1}$であり、$\gamma_{i+1}$はこれらの交換子で生成されるので$\gamma_{i+1}\le Z_{n-i-1}$である。$i=n$として$\gamma_n\le Z_0=1$を得る。
  strategy: Compare the two series term by term in opposite directions by induction.
  sketch:
  - 'induction: If γ_n = 1, then γ_(n-i) ≤ Z_i for all i ≤ n.'
  - 'derive: Taking i = n gives Z_n = G.'
  - 'induction: If Z_n = G, then γ_i ≤ Z_(n-i) for all i ≤ n.'
  - 'conclude: Taking i = n gives γ_n = 1.'
  openmath: (forall (G n) (-> (and (group G) (in n N)) (<-> (= (lower_central_term G n) (trivial_subgroup G)) (= (upper_central_term G n) G))))
  hard_negative:
    statement: 冪零でない群でも、ある$n$で$\gamma_n=1$または$Z_n=G$のどちらかが成り立つ。
    reason: $S_3$では$\gamma_i=A_3$（$i\ge1$）、$Z_i=1$であり、どちらも成り立たない。
  target: |
    ∀ (G : Type*) [Group G] (n : ℕ), Subgroup.lowerCentralSeries (G := G) ⊤ n = ⊥ ↔ Subgroup.upperCentralSeries G n = ⊤
  proof: |
    by
      intro G _ n
      exact Subgroup.lowerCentralSeries_eq_bot_iff_upperCentralSeries_eq_top
- id: nontrivial_normal_subgroup_of_nilpotent_meets_center
  kind: gap
  level: 3
  topic: 群論・冪零群の正規部分群
  statement: 冪零群$G$の自明でない正規部分群$N$は中心と自明でなく交わる。すなわち$N\cap Z(G)\ne1$である。
  statement_en: A nontrivial normal subgroup N of a nilpotent group G meets the center nontrivially, that is, N ∩ Z(G) ≠ 1.
  assumptions:
  - $G$は冪零群
  - $N$は$G$の自明でない正規部分群
  quantifiers:
  - 任意の正規部分群$N$
  conclusion: $N\cap Z(G)\ne1$である。
  answer: |
    $G$を冪零群、$N$を正規部分群で$N\cap Z(G)=1$とする。$N=1$を示せばよい。昇中心列を$Z_0=1$、$Z_{i+1}=\{x\mid\forall y,\ [x,y]\in Z_i\}$とする。$N\cap Z_i=1$を帰納法で示す。$i=0$は明らかである。$x\in N\cap Z_{i+1}$、$y\in G$とする。$[x,y]\in Z_i$であり、$[x,y]=x\cdot yx^{-1}y^{-1}$と$N$の正規性から$[x,y]\in N$である。帰納法の仮定より$[x,y]=1$なので$x\in Z(G)$であり、$x\in N\cap Z(G)=1$である。$G$は冪零なのである$n$で$Z_n=G$となり、$N=N\cap Z_n=1$である。
  strategy: Show that N meets every term of the upper central series trivially.
  sketch:
  - 'setup: Assume N ∩ Z(G) = 1 and use the upper central series.'
  - 'induction: x in N ∩ Z_(i+1) has [x,y] in N ∩ Z_i = 1, so x is central.'
  - 'conclude: Z_n = G gives N = 1.'
  openmath: (forall (G K) (-> (and (nilpotent_group G) (normal_subgroup K G) (!= K (trivial_subgroup G))) (!= (subgroup_inter K (group_center G)) (trivial_subgroup G))))
  hard_negative:
    statement: 一般の有限群の自明でない正規部分群は中心と自明でなく交わる。
    reason: $S_3$の$A_3$は正規だが、$Z(S_3)=1$である。
  target: |
    ∀ (G : Type*) [Group G] [Group.IsNilpotent G] (N : Subgroup G), N.Normal → N ≠ ⊥ → N ⊓ Subgroup.center G ≠ ⊥
  proof: |
    by
      intro G _ hnil N hN hne hbot
      have key : ∀ n, ∀ x ∈ N, x ∈ Subgroup.upperCentralSeries G n → x = 1 := by
        intro n
        induction n with
        | zero =>
          intro x _ hx
          rw [Subgroup.upperCentralSeries_zero] at hx
          exact hx
        | succ n ih =>
          intro x hxN hx
          have hc : x ∈ Subgroup.center G := by
            rw [Subgroup.mem_center_iff]
            intro y
            have h1 : x * y * x⁻¹ * y⁻¹ ∈ Subgroup.upperCentralSeries G n := Subgroup.mem_upperCentralSeries_succ_iff.1 hx y
            have h2 : x * y * x⁻¹ * y⁻¹ ∈ N := by
              have h3 := hN.conj_mem x⁻¹ (N.inv_mem hxN) y
              have h4 := N.mul_mem hxN h3
              have h5 : x * (y * x⁻¹ * y⁻¹) = x * y * x⁻¹ * y⁻¹ := by group
              rwa [h5] at h4
            have h6 := ih _ h2 h1
            have h7 : x * y = y * x := by
              calc x * y = (x * y * x⁻¹ * y⁻¹) * (y * x) := by group
                _ = y * x := by rw [h6, one_mul]
            exact h7.symm
          have : x ∈ N ⊓ Subgroup.center G := ⟨hxN, hc⟩
          rw [hbot] at this
          exact this
      obtain ⟨n, hn⟩ := hnil.nilpotent
      apply hne
      rw [eq_bot_iff]
      intro x hx
      exact key n x hx (by rw [hn]; trivial)
- id: frattini_subgroup_is_nilpotent
  kind: textbook
  level: 4
  topic: 群論・フラッティーニ部分群
  statement: 有限群$G$の極大部分群すべての共通部分であるフラッティーニ部分群$\Phi(G)$は冪零である。
  statement_en: For a finite group G, the Frattini subgroup Φ(G), the intersection of all maximal subgroups, is nilpotent.
  assumptions:
  - $G$は有限群
  - $\Phi(G)$は極大部分群の共通部分
  quantifiers:
  - 任意の有限群$G$
  conclusion: $\Phi(G)$は冪零である。
  answer: |
    $G$を有限群、$F=\Phi(G)$とする。自己同型は極大部分群を極大部分群に移すので$F$は$G$で正規である。$p$を素数、$P$を$F$のシロー $p$部分群とする。フラッティーニの論法より$G=F\cdot N_G(P)$である。$N_G(P)\ne G$なら、$N_G(P)$を含む極大部分群$M$があり、$F\le M$なので$G=F\cdot N_G(P)\le M$となって矛盾する。よって$N_G(P)=G$で、$P$は$G$で正規、とくに$F$で正規である。$F$のすべてのシロー部分群が正規なので、$F$は冪零である。
  strategy: Apply the Frattini argument to Sylow subgroups of Φ(G) and use that Φ(G) lies in every maximal subgroup.
  sketch:
  - 'derive: Φ(G) is normal in G.'
  - 'apply_theorem: The Frattini argument gives G = Φ(G)·N_G(P) for a Sylow subgroup P of Φ(G).'
  - 'contradiction: If N_G(P) were proper, a maximal subgroup containing it would contain G.'
  - 'apply_theorem: All Sylow subgroups of Φ(G) are normal, so Φ(G) is nilpotent.'
  openmath: (forall (G) (-> (finite_group G) (nilpotent_group (frattini_subgroup G))))
  hard_negative:
    statement: 有限群のフラッティーニ部分群はつねに自明である。
    reason: $\mathbb{Z}/4$の極大部分群は$2\mathbb{Z}/4$だけなので、$\Phi(\mathbb{Z}/4)=2\mathbb{Z}/4\ne0$である。
  target: |
    ∀ (G : Type*) [Group G] [Finite G], Group.IsNilpotent (frattini G)
  proof: |
    by
      intro G _ _
      exact frattini_nilpotent
- id: quotient_simple_iff_maximal_normal
  kind: gap
  level: 2
  topic: 群論・組成列の単純商
  statement: 群$G$の正規部分群$N$について、$G/N$が単純群であることと、$N\ne G$かつ$N$を含む正規部分群が$N$と$G$に限ることは同値である。組成列の各段がこの条件で特徴づけられる。
  statement_en: For a normal subgroup N of a group G, the quotient G/N is simple if and only if N ≠ G and the only normal subgroups containing N are N and G. This characterizes each step of a composition series.
  assumptions:
  - $N$は群$G$の正規部分群
  quantifiers:
  - 任意の群$G$と正規部分群$N$
  conclusion: $G/N$が単純$\iff N\ne G$かつ$N$を含む正規部分群は$N,G$のみである。
  answer: |
    $G$を群、$N$を正規部分群、$\pi:G\to G/N$を射影とする。対応定理より、$K\mapsto\pi(K)$は$N$を含む$G$の部分群と$G/N$の部分群の全単射で、正規性を両方向に保つ。$N$は単位部分群に、$G$は$G/N$に対応する。$G/N$が自明でないことは$N\ne G$と同値である。よって$G/N$の正規部分群が$1$と$G/N$だけであることは、$N$を含む正規部分群が$N$と$G$だけであることと同値である。
  strategy: Transport normal subgroups along the correspondence theorem.
  sketch:
  - 'apply_theorem: The correspondence theorem matches normal subgroups of G containing N with normal subgroups of G/N.'
  - 'translate: N corresponds to 1 and G corresponds to G/N.'
  - 'conclude: Simplicity of G/N is the stated maximality.'
  openmath: (forall (G K) (-> (normal_subgroup K G) (<-> (simple_group (quotient_group G K)) (and (!= K G) (forall (L) (-> (and (normal_subgroup L G) (subset K L)) (or (= L K) (= L G))))))))
  hard_negative:
    statement: $G/N$が単純なら$N$は$G$の極大部分群である。
    reason: $G=A_5$、$N=1$では$G/N$は単純だが、$1$は$A_5$の極大部分群でない。正規部分群の中で極大であるだけである。
  target: |
    ∀ (G : Type*) [Group G] (N : Subgroup G) [N.Normal], IsSimpleGroup (G ⧸ N) ↔ N ≠ ⊤ ∧ ∀ K : Subgroup G, K.Normal → N ≤ K → K = N ∨ K = ⊤
  proof: |
    by
      intro G _ N _
      have hsurj := QuotientGroup.mk'_surjective N
      constructor
      · intro hS
        constructor
        · rintro rfl
          obtain ⟨a, b, hab⟩ := (inferInstance : Nontrivial (G ⧸ (⊤ : Subgroup G)))
          induction a using QuotientGroup.induction_on
          induction b using QuotientGroup.induction_on
          exact hab ((QuotientGroup.eq).2 trivial)
        · intro K hK hNK
          haveI := hK
          rcases (Subgroup.Normal.map hK (QuotientGroup.mk' N) hsurj).eq_bot_or_eq_top with h | h
          · left
            apply le_antisymm _ hNK
            intro x hx
            have : (QuotientGroup.mk' N) x ∈ K.map (QuotientGroup.mk' N) := ⟨x, hx, rfl⟩
            rw [h, Subgroup.mem_bot] at this
            exact (QuotientGroup.eq_one_iff x).1 this
          · right
            rw [eq_top_iff]
            intro x _
            have hx : (QuotientGroup.mk' N) x ∈ K.map (QuotientGroup.mk' N) := by rw [h]; trivial
            obtain ⟨y, hy, hxy⟩ := hx
            have h2 : y⁻¹ * x ∈ N := (QuotientGroup.eq).1 hxy
            have h3 : x = y * (y⁻¹ * x) := by group
            rw [h3]
            exact K.mul_mem hy (hNK h2)
      · rintro ⟨hne, hmax⟩
        have hnt : Nontrivial (G ⧸ N) := by
          obtain ⟨g, hg⟩ : ∃ g, g ∉ N := by
            by_contra hc
            push_neg at hc
            exact hne (eq_top_iff.2 fun x _ => hc x)
          exact ⟨⟨(g : G ⧸ N), 1, fun h => hg ((QuotientGroup.eq_one_iff g).1 h)⟩⟩
        refine ⟨fun L hL => ?_⟩
        have hle : N ≤ L.comap (QuotientGroup.mk' N) := by
          intro x hx
          rw [Subgroup.mem_comap]
          have : (QuotientGroup.mk' N) x = 1 := (QuotientGroup.eq_one_iff x).2 hx
          rw [this]
          exact L.one_mem
        rcases hmax _ (hL.comap _) hle with h | h
        · left
          rw [eq_bot_iff]
          intro q hq
          obtain ⟨y, rfl⟩ := hsurj q
          have : y ∈ N := by rw [← h]; exact hq
          exact (QuotientGroup.eq_one_iff y).2 this
        · right
          rw [eq_top_iff]
          intro q _
          obtain ⟨y, rfl⟩ := hsurj q
          have : y ∈ L.comap (QuotientGroup.mk' N) := by rw [h]; trivial
          exact this
- id: sign_of_permutation_from_cycle_type
  kind: gap
  level: 2
  topic: 対称群・符号と巡回型
  statement: 有限集合の置換$\sigma$の、長さ$2$以上の巡回因子の長さを$l_1,\dots,l_r$とすると、$\mathrm{sgn}(\sigma)=(-1)^{l_1+\dots+l_r+r}$である。
  statement_en: If l_1, ..., l_r are the lengths of the cycles of length at least 2 in the disjoint cycle decomposition of a permutation σ of a finite set, then sgn(σ) = (-1)^(l_1+...+l_r+r).
  assumptions:
  - $\sigma$は有限集合の置換
  - $l_1,\dots,l_r$は長さ$2$以上の巡回因子の長さ
  quantifiers:
  - 任意の置換$\sigma$
  conclusion: $\mathrm{sgn}(\sigma)=(-1)^{l_1+\dots+l_r+r}$である。
  answer: |
    $\sigma$を有限集合の置換とし、$\sigma=c_1\cdots c_r$を長さ$l_i\ge2$の互いに素な巡回置換の積への分解とする。長さ$l$の巡回置換は$l-1$個の互換の積なので符号は$(-1)^{l-1}=(-1)^{l+1}$である。符号は準同型なので$\mathrm{sgn}(\sigma)=\prod_i(-1)^{l_i+1}=(-1)^{l_1+\dots+l_r+r}$である。
  strategy: Multiply the signs of the disjoint cycles.
  sketch:
  - 'setup: Decompose σ into disjoint cycles of lengths l_i.'
  - 'apply_theorem: A cycle of length l has sign (-1)^(l+1).'
  - 'conclude: The sign homomorphism gives the product formula.'
  openmath: (forall (X s) (-> (and (finite_set X) (in s (symmetric_group X))) (= (permutation_sign s) (^ (neg 1) (+ (multiset_sum (cycle_type s)) (multiset_card (cycle_type s)))))))
  hard_negative:
    statement: $\mathrm{sgn}(\sigma)=(-1)^{r}$である。ここで$r$は巡回因子の個数である。
    reason: $\sigma=(1\ 2\ 3)$は$r=1$だが偶置換であり、符号は$+1$である。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (σ : Equiv.Perm α), Equiv.Perm.sign σ = (-1 : ℤˣ) ^ (σ.cycleType.sum + Multiset.card σ.cycleType)
  proof: |
    by
      intro α _ _ σ
      exact Equiv.Perm.sign_of_cycleType σ
- id: surjective_hom_from_symmetric_group_to_sign_is_sign
  kind: gap
  level: 2
  topic: 対称群・符号の一意性
  statement: 有限集合上の対称群から$\{\pm1\}$への全射準同型は符号写像$\mathrm{sgn}$に限る。
  statement_en: The only surjective homomorphism from the symmetric group of a finite set onto {±1} is the sign map.
  assumptions:
  - $X$は有限集合
  - $s:\mathrm{Sym}(X)\to\{\pm1\}$は全射準同型
  quantifiers:
  - 任意の全射準同型$s$
  conclusion: $s=\mathrm{sgn}$である。
  answer: |
    $X$を有限集合、$s:\mathrm{Sym}(X)\to\{\pm1\}$を全射準同型とする。互換はすべて互いに共役であり、値域は可換なので、$s$はすべての互換で同じ値をとる。その値が$1$なら、互換が$\mathrm{Sym}(X)$を生成するので$s$は自明となり、全射性に反する。よって$s$はすべての互換で$-1$をとり、これは$\mathrm{sgn}$の値と一致する。2つの準同型は生成系で一致するので$s=\mathrm{sgn}$である。
  strategy: Transpositions are conjugate and generate, so s is determined by its common value on them.
  sketch:
  - 'derive: s is constant on transpositions because they are conjugate and the target is abelian.'
  - 'contradiction: Value 1 would make s trivial, since transpositions generate.'
  - 'conclude: s and sgn agree on the generators.'
  openmath: (forall (X s) (-> (and (finite_set X) (group_hom s (symmetric_group X) sign_group) (surjective_function s)) (= s (sign_homomorphism X))))
  hard_negative:
    statement: 対称群から$\{\pm1\}$への準同型は符号写像に限る。
    reason: すべてを$1$に送る自明な準同型も準同型である。全射の仮定は外せない。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (s : Equiv.Perm α →* ℤˣ), Function.Surjective s → s = Equiv.Perm.sign
  proof: |
    by
      intro α _ _ s hs
      exact Equiv.Perm.eq_sign_of_surjective_hom hs
- id: disjoint_cycle_decomposition_unique
  kind: textbook
  level: 2
  topic: 対称群・巡回置換分解の一意性
  statement: 有限集合の置換を互いに素な巡回置換（恒等置換は含めない）の積で2通りに表すとき、2つの表示は因子の順序を除いて一致する。
  statement_en: If a permutation of a finite set is written in two ways as a product of pairwise disjoint cycles (excluding the identity), the two expressions agree up to the order of the factors.
  assumptions:
  - $l_1,l_2$は有限集合の巡回置換の列で、どの因子も恒等置換でない
  - 各列の因子は互いに素
  - $l_1,l_2$の積は等しい
  quantifiers:
  - 任意の列$l_1,l_2$
  conclusion: $l_2$は$l_1$の並べ替えである。
  answer: |
    $l_1,l_2$を上の列とし、共通の積を$\sigma$とする。$l_1$の因子$c$を1つとり、$x$を$c$が動かす点とする。因子は互いに素なので、他の因子は$x$や$c$の台を動かさず、$c$の台の上で$\sigma$は$c$に一致する。よって$c$の台は$x$の$\sigma$軌道であり、$c$は台の上で$\sigma$、台の外で恒等写像である。$\sigma(x)=c(x)\ne x$なので、$l_2$にも$x$を動かす因子$c'$がちょうど1つあり、同じ理由で$c'$も同じ記述で定まる。よって$c=c'$である。互いに素で恒等置換でない因子は重複しないから、$c\mapsto c'$は$l_1$の因子と$l_2$の因子の全単射を与え、$l_2$は$l_1$の並べ替えである。
  strategy: Each cycle is recovered from σ as σ restricted to one orbit.
  sketch:
  - 'setup: Let σ be the common product and c a factor moving x.'
  - 'derive: On its support c agrees with σ, and its support is the σ-orbit of x.'
  - 'derive: The factor of the other list moving x has the same description.'
  - 'conclude: Hence the two lists contain the same cycles.'
  openmath: (forall (X a b) (-> (and (finite_set X) (list_of_cycles a X) (list_of_cycles b X) (pairwise_disjoint_permutations a) (pairwise_disjoint_permutations b) (= (list_product a) (list_product b))) (list_permutation a b)))
  hard_negative:
    statement: 巡回置換の積への表示は、互いに素でなくても順序を除いて一意である。
    reason: $(1\ 2\ 3)=(1\ 2)(2\ 3)$は長さの異なる巡回置換の積でも表せる。互いに素の仮定が必要である。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (l₁ l₂ : List (Equiv.Perm α)), l₁.prod = l₂.prod → (∀ σ ∈ l₁, Equiv.Perm.IsCycle σ) → (∀ σ ∈ l₂, Equiv.Perm.IsCycle σ) → l₁.Pairwise Equiv.Perm.Disjoint → l₂.Pairwise Equiv.Perm.Disjoint → l₁.Perm l₂
  proof: |
    by
      intro α _ _ l₁ l₂ h h1 h2 h3 h4
      exact Equiv.Perm.list_cycles_perm_list_cycles h h1 h2 h3 h4
- id: symmetric_group_center_trivial
  kind: gap
  level: 2
  topic: 対称群・中心
  statement: $3$点以上の有限集合上の対称群の中心は自明である。
  statement_en: The center of the symmetric group on a finite set with at least 3 elements is trivial.
  assumptions:
  - $X$は有限集合で$|X|\ge3$
  quantifiers:
  - 任意の$\sigma\in Z(\mathrm{Sym}(X))$
  conclusion: $\sigma=\mathrm{id}$である。
  answer: |
    $X$を$3$点以上の有限集合、$\sigma$を$\mathrm{Sym}(X)$の中心の元とする。$\sigma\ne\mathrm{id}$と仮定すると$\sigma(a)\ne a$となる$a$がある。$|X|\ge3$より$c\notin\{a,\sigma(a)\}$がとれる。$\tau$を$\sigma(a)$と$c$の互換とする。$\tau(a)=a$なので$\sigma\tau(a)=\sigma(a)$であり、$\tau\sigma(a)=c$である。$\sigma\tau=\tau\sigma$より$\sigma(a)=c$となり、$c$の選び方に矛盾する。よって$\sigma=\mathrm{id}$である。
  strategy: A nonidentity permutation fails to commute with a suitable transposition.
  sketch:
  - 'setup: Suppose σ(a) ≠ a and pick c outside {a, σ(a)}.'
  - 'construct: Let τ be the transposition of σ(a) and c.'
  - 'contradiction: στ(a) = σ(a) but τσ(a) = c.'
  - 'conclude: Hence σ is the identity.'
  openmath: (forall (X) (-> (and (finite_set X) (<= 3 (size X))) (= (group_center (symmetric_group X)) (trivial_subgroup (symmetric_group X)))))
  hard_negative:
    statement: すべての有限集合上の対称群の中心は自明である。
    reason: $S_2$は位数$2$のアーベル群で、中心は$S_2$全体である。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α], 3 ≤ Fintype.card α → Subgroup.center (Equiv.Perm α) = ⊥
  proof: |
    by
      intro α _ _ h3
      rw [eq_bot_iff]
      intro σ hσ
      rw [Subgroup.mem_center_iff] at hσ
      rw [Subgroup.mem_bot]
      ext a
      by_contra hne
      simp only [Equiv.Perm.coe_one, id_eq] at hne
      obtain ⟨c, -, hc⟩ := Finset.exists_mem_notMem_of_card_lt_card (s := ({a, σ a} : Finset α)) (t := Finset.univ) (by
        rw [Finset.card_univ]
        exact lt_of_le_of_lt (Finset.card_le_two) (by omega))
      simp only [Finset.mem_insert, Finset.mem_singleton, not_or] at hc
      have h := congrArg (fun f : Equiv.Perm α => f a) (hσ (Equiv.swap (σ a) c))
      simp only [Equiv.Perm.mul_apply] at h
      rw [Equiv.swap_apply_left, Equiv.swap_apply_of_ne_of_ne (Ne.symm hne) (Ne.symm hc.1)] at h
      exact hc.2 h
- id: normal_subgroups_of_symmetric_group
  kind: textbook
  level: 4
  topic: 対称群・正規部分群の決定
  statement: $5$点以上の有限集合$X$について、$\mathrm{Sym}(X)$の正規部分群は$1$、$\mathrm{Alt}(X)$、$\mathrm{Sym}(X)$に限る。
  statement_en: For a finite set X with at least 5 elements, the normal subgroups of Sym(X) are exactly 1, Alt(X) and Sym(X).
  assumptions:
  - $X$は有限集合で$|X|\ge5$
  - $N$は$\mathrm{Sym}(X)$の正規部分群
  quantifiers:
  - 任意の正規部分群$N$
  conclusion: $N=1$、$N=\mathrm{Alt}(X)$、$N=\mathrm{Sym}(X)$のいずれかである。
  answer: |
    $X$を$5$点以上の有限集合、$S=\mathrm{Sym}(X)$、$A=\mathrm{Alt}(X)$、$N$を$S$の正規部分群で$N\ne1$とする。$N\cap A$は単純群$A$の正規部分群なので$1$か$A$である。$N\cap A=1$なら$N$は$S/A$に単射で移るので$|N|=2$である。位数$2$の正規部分群は中心に含まれるが、$3$点以上の対称群の中心は自明なので矛盾する。よって$A\le N$である。$[S:A]=2$なので$[S:N]$は$1$か$2$であり、$N=S$または$N=A$である。
  strategy: Intersect with the simple group Alt(X) and exclude the trivial intersection using the center.
  sketch:
  - 'derive: N ∩ A is 1 or A since A is simple.'
  - 'contradiction: N ∩ A = 1 would give a central subgroup of order 2.'
  - 'derive: So A ≤ N, and [S:A] = 2.'
  - 'conclude: N equals A or S.'
  openmath: (forall (X K) (-> (and (finite_set X) (<= 5 (size X)) (normal_subgroup K (symmetric_group X))) (or (= K (trivial_subgroup (symmetric_group X))) (= K (alternating_group X)) (= K (symmetric_group X)))))
  hard_negative:
    statement: $4$点の場合も$\mathrm{Sym}(X)$の正規部分群は$1,\mathrm{Alt}(X),\mathrm{Sym}(X)$に限る。
    reason: $S_4$にはクラインの四元群$\{1,(1\ 2)(3\ 4),(1\ 3)(2\ 4),(1\ 4)(2\ 3)\}$という正規部分群がある。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (N : Subgroup (Equiv.Perm α)), 5 ≤ Nat.card α → N.Normal → N = ⊥ ∨ N = alternatingGroup α ∨ N = ⊤
  proof: |
    by
      intro α _ _ N h5 hN
      by_cases hb : N = ⊥
      · exact Or.inl hb
      right
      haveI : Nontrivial N := (Subgroup.nontrivial_iff_ne_bot N).2 hb
      have hle : alternatingGroup α ≤ N := Equiv.Perm.alternatingGroup_le_of_normal h5 inferInstance
      haveI : Nontrivial α := Finite.one_lt_card_iff_nontrivial.1 (by have : Finite α := inferInstance; omega)
      have hidx : (alternatingGroup α).index = 2 := alternatingGroup.index_eq_two
      have hd : N.index ∣ 2 := hidx ▸ Subgroup.index_dvd_of_le hle
      rcases (Nat.dvd_prime Nat.prime_two).1 hd with h | h
      · exact Or.inr (Subgroup.index_eq_one.1 h)
      · left
        have hrel := Subgroup.relIndex_mul_index hle
        rw [h, hidx] at hrel
        have h1 : (alternatingGroup α).relIndex N = 1 := by omega
        exact (le_antisymm hle (Subgroup.relIndex_eq_one.1 h1)).symm
- id: free_group_universal_property
  kind: textbook
  level: 3
  topic: 自由群・普遍性
  statement: 集合$\alpha$上の自由群$F(\alpha)$と群$G$、写像$f:\alpha\to G$に対し、すべての$a\in\alpha$で$F(a)=f(a)$をみたす準同型$F:F(\alpha)\to G$がただ1つある。
  statement_en: For the free group F(α) on a set α, a group G and a map f from α to G, there is a unique homomorphism F from F(α) to G with F(a) = f(a) for all a in α.
  assumptions:
  - $F(\alpha)$は集合$\alpha$上の自由群（簡約語の群）
  - $G$は群、$f:\alpha\to G$は写像
  quantifiers:
  - 任意の$\alpha,G,f$
  conclusion: $F(a)=f(a)$をみたす準同型$F$がただ1つある。
  answer: |
    $\alpha$を集合、$G$を群、$f:\alpha\to G$を写像とする。$F(\alpha)$は$\alpha\sqcup\alpha^{-1}$上の語を、隣り合う$aa^{-1},a^{-1}a$の消去と挿入で生成される同値関係で割ったものである。語$a_1^{e_1}\cdots a_k^{e_k}$（$e_i=\pm1$）に$f(a_1)^{e_1}\cdots f(a_k)^{e_k}$を対応させる。隣り合う$aa^{-1}$を消しても$G$での値は変わらないから、これは同値類に対して矛盾なく定まり、連結が積に移るので準同型$F$である。$F(a)=f(a)$は定義から従う。一意性は、$F(\alpha)$が生成元$a$で生成され、準同型の値が生成元で決まることから従う。
  strategy: Evaluate words in G and check invariance under elementary reductions.
  sketch:
  - 'construct: Send a word to the corresponding product of f(a)^(±1) in G.'
  - 'derive: Removing aa⁻¹ does not change the value, so the map is well defined on classes.'
  - 'derive: Concatenation goes to products, so it is a homomorphism.'
  - 'conclude: Generators determine a homomorphism, which gives uniqueness.'
  openmath: (forall (A G f) (-> (group G) (exists (u) (and (group_hom u (free_group_on A) G) (forall (a) (-> (in a A) (= (fn_value u (free_generator a)) (fn_value f a)))) (forall (v) (-> (and (group_hom v (free_group_on A) G) (forall (a) (-> (in a A) (= (fn_value v (free_generator a)) (fn_value f a))))) (= v u)))))))
  hard_negative:
    statement: 自由アーベル群でない任意のアーベル群でも、生成系上の写像は準同型に一意に延びる。
    reason: $\mathbb{Z}/2$の生成系$\{1\}$上で$1\mapsto1\in\mathbb{Z}$とする写像は、$2\cdot1=0$に矛盾するので準同型に延びない。
  target: |
    ∀ (α G : Type*) [Group G] (f : α → G), ∃! F : FreeGroup α →* G, ∀ a, F (FreeGroup.of a) = f a
  proof: |
    by
      intro α G _ f
      refine ⟨FreeGroup.lift f, fun a => FreeGroup.lift_apply_of, fun F hF => ?_⟩
      ext a
      simp [hF]
- id: nielsen_schreier_subgroup_of_free_group_is_free
  kind: named
  level: 4
  topic: 自由群・ニールセン・シュライアーの定理
  statement: 自由群の部分群は自由群である。
  statement_en: Nielsen–Schreier theorem. Every subgroup of a free group is free.
  assumptions:
  - $F(\alpha)$は集合$\alpha$上の自由群
  - $H$は$F(\alpha)$の部分群
  quantifiers:
  - 任意の$\alpha$と部分群$H$
  conclusion: $H$は自由群である。
  answer: |
    $F=F(\alpha)$を集合$\alpha$上の自由群、$H$をその部分群とする。$H$の自由基底を作る。グラフの道で、同じ辺を直後に逆向きにたどらないものを簡約な道と呼び、長さ$0$の道も含める。連結で長さ正の閉じた簡約な道がないグラフを木と呼ぶ。木では2頂点を結ぶ簡約な道はただ1つである。
    頂点集合を$F$とし、各$g\in F$、$a\in\alpha$について$g$から$ga$への向きつき辺を1本置いたグラフを$T$とする。$\alpha$は$F$を生成するので$T$は連結である。$g$から出る簡約な道は簡約語$w$に対応し、終点は$gw$である。長さ正の簡約語は$F$で$1$でないので、$T$は木である。$H$は左からの積で$T$に作用し、辺の向きを保ち、頂点に自由に作用する。
    $T$の部分木で、頂点どうしが異なる$H$軌道に属するものを考える。1頂点からなるものがあり、鎖の和集合も同じ性質をもつので、ツォルンの補題より極大なもの$Y$がある。$W=\bigcup_{h\in H}hY$を頂点の集合とする。$W$が全体でないとすると、$T$の連結性から$W$の頂点$v$と$W$の外の頂点$w$を結ぶ辺がある。$v\in hY$なら$h^{-1}$で移して、$Y$の頂点と$W$の外の頂点$h^{-1}w$を結ぶ辺を得る。$W$は$H$で保たれるので、$h^{-1}w$の軌道は$Y$の頂点を含まない。この辺を$Y$に加えると同じ性質をもつより大きい部分木になり、矛盾する。よって$W$は全体である。$hy=h'y'$（$y,y'\in Y$）なら$y,y'$は同じ軌道にあるので$y=y'$であり、自由性から$h=h'$である。したがって$hY$（$h\in H$）は$T$の頂点集合を分割する。
    有向グラフ$T'$を、頂点集合を$H$とし、どの$hY$にも含まれない$T$の辺を辺として定める。$hY$の頂点から$h'Y$の頂点へ向かう辺を$h$から$h'$への辺と見る。両端が同じ$hY$にある辺は$hY$に含まれる。含まれないなら$hY$の中の道と合わせて$T$に閉じた簡約な道ができるからである。よって$T'$にループはない。$T$が連結なので$T'$も連結である。$T'$に長さ正の閉じた簡約な道があるとする。頂点$h$で続く2辺$e,e'$について、$T$での接続点どうしを$hY$の中の簡約な道で結ぶ。$e\ne e'$であり、挿入した辺は$hY$の辺なので$e,e'$と異なるから、全体は$T$の簡約な道になる。この道の両端は同じ$h_0Y$の頂点だが、道は$h_0Y$に含まれない辺を通る。両端を結ぶ$h_0Y$の中の簡約な道があるので、簡約な道の一意性に反する。よって$T'$は木である。
    $H$は左からの積で$T'$に作用し、辺の向きを保ち、頂点の上で単純推移的である。$S$を、$T'$で$1$から出る辺の終点全体とする。木では同じ2頂点を結ぶ辺は1本以下なので、$T'$の辺は$h\to hs$（$h\in H$、$s\in S$）の形で、組$(h,s)$とちょうど1対1に対応する。ループがないので$1\notin S$である。$s,s^{-1}\in S$なら$1\to s$と$s\to1$が同じ2頂点を結ぶ異なる辺になるので、$S\cap S^{-1}=\emptyset$である。
    $T'$が連結なので$S$は$H$を生成する。$S$上の長さ正の簡約語$w=s_1^{e_1}\cdots s_k^{e_k}$（$e_i=\pm1$）に頂点の列$1,\ s_1^{e_1},\ s_1^{e_1}s_2^{e_2},\dots$を対応させると、$T'$の道が得られる。$S\cap S^{-1}=\emptyset$と辺の対応の一意性から、同じ辺を直後に逆にたどるのは語に$s^{e}s^{-e}$が現れるときに限るので、この道は簡約である。$T'$は木なので終点は$1$でなく、$H$で$w\ne1$である。よって$S$は$H$の自由基底であり、$H$は自由群である。
  strategy: Contract a maximal subtree of the Cayley tree whose vertices lie in distinct H-orbits, so that H acts simply transitively on the vertices of a new tree.
  sketch:
  - 'setup: The Cayley graph T of F is a tree, and H acts freely on its vertices and preserves edge orientation.'
  - 'construct: Zorn gives a maximal subtree Y whose vertices lie in distinct H-orbits; its translates partition the vertices of T.'
  - 'construct: Contracting the translates gives a directed graph T′ with vertex set H.'
  - 'derive: Lifting reduced paths back to T shows that T′ is a tree.'
  - 'derive: The edges of T′ are h → hs for s in a set S with S ∩ S⁻¹ empty.'
  - 'conclude: Reduced words in S give reduced paths in T′, so S is a free basis of H.'
  openmath: (forall (A H) (-> (subgroup_of H (free_group_on A)) (is_free_group H)))
  hard_negative:
    statement: 自由群の部分群の階数は、元の自由群の階数以下である。
    reason: 階数$2$の自由群の交換子部分群は無限階数の自由群である。指数$d$の部分群の階数も$d+1$であり一般に大きくなる。
  target: |
    ∀ (α : Type*) (H : Subgroup (FreeGroup α)), IsFreeGroup H
  proof: |
    by
      intro α H
      infer_instance
- id: von_dyck_presented_group_universal_property
  kind: named
  level: 3
  topic: 群の表示・フォン・ディックの定理
  statement: 生成元$\alpha$と関係式の集合$\mathrm{rels}\subseteq F(\alpha)$で表示される群$P=\langle\alpha\mid\mathrm{rels}\rangle$と写像$f:\alpha\to G$について、$f$の延長$F(\alpha)\to G$がすべての関係式を$1$に送るなら、$\bar f(a)=f(a)$をみたす準同型$\bar f:P\to G$がただ1つある。
  statement_en: von Dyck's theorem. For a presented group P = ⟨α | rels⟩ and a map f from α to a group G whose extension to the free group kills all relators, there is a unique homomorphism from P to G sending each generator a to f(a).
  assumptions:
  - $P=F(\alpha)/\langle\langle\mathrm{rels}\rangle\rangle$
  - $f:\alpha\to G$の延長$\tilde f:F(\alpha)\to G$は$\mathrm{rels}$を$1$に送る
  quantifiers:
  - 任意の$\alpha,\mathrm{rels},G,f$
  conclusion: $\bar f(a)=f(a)$をみたす準同型$\bar f:P\to G$がただ1つある。
  answer: |
    $P=F(\alpha)/R$とする。ここで$R$は$\mathrm{rels}$を含む最小の正規部分群である。$f:\alpha\to G$の自由群への延長を$\tilde f$とする。$\ker\tilde f$は$\mathrm{rels}$を含む正規部分群なので$R\le\ker\tilde f$である。よって$\tilde f$は準同型$\bar f:P\to G$を誘導し、$\bar f(a)=f(a)$である。$P$は生成元$a$の像で生成されるので、この条件をみたす準同型は1つしかない。
  strategy: The kernel of the extension contains the normal closure of the relators.
  sketch:
  - 'setup: Let R be the normal closure of the relators and f̃ the extension of f.'
  - 'derive: ker f̃ is normal and contains the relators, so R ≤ ker f̃.'
  - 'construct: f̃ factors through P.'
  - 'conclude: Images of generators determine the map.'
  openmath: (forall (A S G f) (-> (and (group G) (forall (r) (-> (in r S) (= (fn_value (free_group_lift f) r) (group_identity G))))) (exists (u) (and (group_hom u (presented_group A S) G) (forall (a) (-> (in a A) (= (fn_value u (presented_generator S a)) (fn_value f a)))) (forall (v) (-> (and (group_hom v (presented_group A S) G) (forall (a) (-> (in a A) (= (fn_value v (presented_generator S a)) (fn_value f a))))) (= v u)))))))
  hard_negative:
    statement: 関係式をみたす写像$f$から得られる$\bar f:P\to G$はつねに単射である。
    reason: $P=\langle a\mid a^4\rangle$、$G=\mathbb{Z}/2$、$f(a)=1$なら関係式はみたされるが、$\bar f(a^2)=0$であり単射でない。
  target: |
    ∀ (α G : Type*) [Group G] (rels : Set (FreeGroup α)) (f : α → G), (∀ r ∈ rels, FreeGroup.lift f r = 1) → ∃! F : PresentedGroup rels →* G, ∀ a, F (PresentedGroup.of a) = f a
  proof: |
    by
      intro α G _ rels f h
      refine ⟨PresentedGroup.toGroup h, fun a => PresentedGroup.toGroup.of h, fun F hF => ?_⟩
      apply PresentedGroup.ext
      intro a
      rw [hF, PresentedGroup.toGroup.of]
- id: one_relator_power_presentation_is_cyclic
  kind: gap
  level: 3
  topic: 群の表示・巡回群
  statement: 自然数$n$について、1生成元1関係式の群$\langle a\mid a^n\rangle$は$\mathbb{Z}/n$と同型である。ここで$\mathbb{Z}/0=\mathbb{Z}$とする。
  statement_en: For a natural number n, the presented group ⟨a | a^n⟩ is isomorphic to Z/n, with Z/0 meaning Z.
  assumptions:
  - $n$は自然数
  quantifiers:
  - 任意の自然数$n$
  conclusion: $\langle a\mid a^n\rangle\cong\mathbb{Z}/n$である。
  answer: |
    $n$を自然数、$P=\langle a\mid a^n\rangle$とする。$\mathbb{Z}/n$で$1$の$n$倍は$0$なので、$a\mapsto1$は関係式をみたし、準同型$\varphi:P\to\mathbb{Z}/n$を定める。$P$は$a$で生成されるので、$P$の元は$a^k$（$k\in\mathbb{Z}$）の形であり、$\varphi(a^k)=k\bmod n$である。よって$\varphi$は全射である。$\varphi(a^k)=0$なら$n\mid k$であり、$a^n=1$より$a^k=1$である。よって$\varphi$は単射である。
  strategy: Map the generator to 1 and check bijectivity on powers of a.
  sketch:
  - 'construct: a ↦ 1 respects the relator, giving φ from P to Z/n.'
  - 'derive: Every element of P is a power a^k, and φ(a^k) = k mod n.'
  - 'derive: φ(a^k) = 0 forces n | k, hence a^k = 1.'
  - 'conclude: φ is bijective.'
  openmath: (forall (n) (-> (in n N) (group_isomorphic (cyclic_presentation n) (zmod_group n))))
  hard_negative:
    statement: $\langle a,b\mid a^m,b^n\rangle$は$\mathbb{Z}/m\times\mathbb{Z}/n$と同型である。
    reason: この群は自由積であり、$m,n\ge2$なら$ab\ne ba$である。実際$\langle a,b\mid a^2,b^2\rangle$は無限二面体群である。
  target: |
    ∀ (n : ℕ), Nonempty (PresentedGroup ({FreeGroup.of () ^ n} : Set (FreeGroup Unit)) ≃* Multiplicative (ZMod n))
  proof: |
    by
      intro n
      let rels : Set (FreeGroup Unit) := {FreeGroup.of () ^ n}
      let f : Unit → Multiplicative (ZMod n) := fun _ => Multiplicative.ofAdd 1
      have hr : ∀ r ∈ rels, FreeGroup.lift f r = 1 := by
        rintro r rfl
        rw [map_pow, FreeGroup.lift_apply_of, ← ofAdd_nsmul]
        simp
      let g : PresentedGroup rels := PresentedGroup.of ()
      have hg : g ^ n = 1 := by
        have h := PresentedGroup.one_of_mem (rels := rels) (x := FreeGroup.of () ^ n) rfl
        rw [map_pow] at h
        exact h
      have hz : ∀ x : PresentedGroup rels, ∃ k : ℤ, x = g ^ k := by
        intro x
        have hc : Subgroup.closure ({g} : Set (PresentedGroup rels)) = ⊤ := by
          have := PresentedGroup.closure_range_of rels
          rwa [show Set.range (PresentedGroup.of (rels := rels)) = {g} from by
            ext y
            constructor
            · rintro ⟨⟨⟩, rfl⟩; rfl
            · rintro rfl; exact ⟨(), rfl⟩] at this
        have hx : x ∈ Subgroup.closure ({g} : Set (PresentedGroup rels)) := by rw [hc]; trivial
        obtain ⟨k, hk⟩ := Subgroup.mem_closure_singleton.1 hx
        exact ⟨k, hk.symm⟩
      have hval : ∀ k : ℤ, PresentedGroup.toGroup hr (g ^ k) = Multiplicative.ofAdd ((k : ZMod n)) := by
        intro k
        rw [map_zpow, PresentedGroup.toGroup.of, ← ofAdd_zsmul]
        simp
      refine ⟨MulEquiv.ofBijective (PresentedGroup.toGroup hr) ⟨?_, ?_⟩⟩
      · rw [injective_iff_map_eq_one]
        intro x hx
        obtain ⟨k, rfl⟩ := hz x
        rw [hval] at hx
        have h0 : (k : ZMod n) = 0 := Multiplicative.ofAdd.injective hx
        obtain ⟨c, rfl⟩ := (ZMod.intCast_zmod_eq_zero_iff_dvd k n).1 h0
        rw [zpow_mul, zpow_natCast, hg, one_zpow]
      · intro z
        obtain ⟨k, hk⟩ := ZMod.intCast_surjective (Multiplicative.toAdd z)
        exact ⟨g ^ k, by rw [hval, hk]; rfl⟩
- id: schreier_lemma_finite_index_subgroup_generators
  kind: named
  level: 3
  topic: 群の生成系・シュライアーの補題
  statement: 有限生成群$G$の有限指数部分群$H$は有限生成であり、生成元の最小個数について$\mathrm{rank}(H)\le[G:H]\,\mathrm{rank}(G)$である。
  statement_en: Schreier's lemma. A subgroup H of finite index in a finitely generated group G is finitely generated, and the minimal numbers of generators satisfy rank(H) ≤ [G:H]·rank(G).
  assumptions:
  - $G$は有限生成群
  - $H$は有限指数の部分群
  quantifiers:
  - 任意の$G,H$
  conclusion: $H$は有限生成で$\mathrm{rank}(H)\le[G:H]\,\mathrm{rank}(G)$である。
  answer: |
    $G$を有限生成群、$H$を有限指数の部分群とする。$S$を元の個数が$\mathrm{rank}(G)$の生成系とし、右剰余類$Hg$の代表系$R$を$1\in R$となるようにとる。$g\in G$の代表を$\bar g\in R$と書く。$u(r,s)=rs\,\overline{rs}^{\,-1}\in H$（$r\in R,s\in S$）の生成する部分群を$H'$とする。個数は高々$[G:H]|S|$である。集合$H'R$が右からの$s\in S$の積で閉じることは$rs=u(r,s)\overline{rs}$から分かる。$s^{-1}$については、$r'=\overline{rs^{-1}}$とおくと$\overline{r's}=r$なので$r's=u(r',s)r$であり、$rs^{-1}=u(r',s)^{-1}r'$である。$S$は$G$を生成し$1\in H'R$なので$H'R=G$である。$h\in H$を$h=u'r$（$u'\in H',r\in R$）と書くと$r\in H$なので$r=1$であり、$h\in H'$である。よって$H=H'$である。
  strategy: Show the Schreier generators generate H by proving H′R is stable under right multiplication.
  sketch:
  - 'setup: Take a generating set S and a right transversal R containing 1.'
  - 'construct: Let H′ be generated by u(r,s) = rs·(rs̄)⁻¹.'
  - 'derive: H′R is closed under right multiplication by S and S⁻¹, so H′R = G.'
  - 'derive: For h in H, its representative is 1, so h lies in H′.'
  - 'conclude: H = H′ has at most [G:H]|S| generators.'
  openmath: (forall (G H) (-> (and (finitely_generated_group G) (finite_index_subgroup H G)) (and (finitely_generated_group H) (<= (group_rank H) (* (subgroup_index H G) (group_rank G))))))
  hard_negative:
    statement: 有限生成群の部分群はすべて有限生成である。
    reason: 階数$2$の自由群の交換子部分群は有限生成でない。指数が無限の部分群では成り立たない。
  target: |
    ∀ (G : Type*) [Group G] [Group.FG G] (H : Subgroup G) [H.FiniteIndex], Group.FG H ∧ Group.rank H ≤ H.index * Group.rank G
  proof: |
    by
      intro G _ _ H _
      exact ⟨inferInstance, Subgroup.rank_le_index_mul_rank H⟩
- id: finitely_generated_group_extension
  kind: gap
  level: 2
  topic: 群の生成系・拡大
  statement: 群$G$の正規部分群$N$について、$N$と$G/N$がともに有限生成なら$G$も有限生成である。
  statement_en: If N is a normal subgroup of a group G and both N and G/N are finitely generated, then G is finitely generated.
  assumptions:
  - $N$は群$G$の正規部分群
  - $N$と$G/N$は有限生成
  quantifiers:
  - 任意の$G,N$
  conclusion: $G$は有限生成である。
  answer: |
    $G$を群、$N$を正規部分群とし、$S$を$N$の有限生成系、$T$を$G/N$の有限生成系とする。$T$の各元の$G$での代表を1つずつ選び、その有限集合を$T'$とする。$L=\langle S\cup T'\rangle$とおくと$N\le L$である。$g\in G$をとる。$gN$は$T$の元とその逆元の積なので、対応する$T'$の元の積$l\in L$で$lN=gN$となるものがある。このとき$l^{-1}g\in N\le L$なので$g\in L$である。よって$G=L$は有限生成である。
  strategy: Lift generators of the quotient and add generators of N.
  sketch:
  - 'construct: Let L be generated by S and lifts T′ of the generators of G/N.'
  - 'derive: For g in G there is l in L with lN = gN.'
  - 'conclude: l⁻¹g lies in N ≤ L, so g lies in L.'
  openmath: (forall (G K) (-> (and (normal_subgroup K G) (finitely_generated_group K) (finitely_generated_group (quotient_group G K))) (finitely_generated_group G)))
  hard_negative:
    statement: $G$が有限生成なら、その正規部分群$N$も有限生成である。
    reason: 階数$2$の自由群の交換子部分群は正規だが有限生成でない。
  target: |
    ∀ (G : Type*) [Group G] (N : Subgroup G) [N.Normal], Group.FG N → Group.FG (G ⧸ N) → Group.FG G
  proof: |
    by
      intro G _ N _ h1 h2
      classical
      obtain ⟨S, hS⟩ := h1.out
      obtain ⟨T, hT⟩ := h2.out
      refine ⟨⟨S.image N.subtype ∪ T.image Quotient.out, ?_⟩⟩
      set L := Subgroup.closure ((S.image N.subtype ∪ T.image Quotient.out : Finset G) : Set G) with hL
      have hNL : N ≤ L := by
        intro x hx
        have hm : (⟨x, hx⟩ : N) ∈ Subgroup.closure (S : Set N) := by rw [hS]; trivial
        have key : ∀ y ∈ Subgroup.closure (S : Set N), (y : G) ∈ L := by
          intro y hy
          refine Subgroup.closure_induction (p := fun (y : N) _ => (y : G) ∈ L) ?_ L.one_mem (fun _ _ _ _ h1 h2 => L.mul_mem h1 h2) (fun _ _ h => L.inv_mem h) hy
          intro z hz
          apply Subgroup.subset_closure
          simp only [Finset.coe_union, Finset.coe_image, Set.mem_union, Set.mem_image]
          exact Or.inl ⟨z, hz, rfl⟩
        exact key _ hm
      rw [eq_top_iff]
      intro g _
      have hq : (g : G ⧸ N) ∈ Subgroup.closure (T : Set (G ⧸ N)) := by rw [hT]; trivial
      have key : ∀ q ∈ Subgroup.closure (T : Set (G ⧸ N)), ∃ l ∈ L, (l : G ⧸ N) = q := by
        intro q hq
        refine Subgroup.closure_induction (p := fun y _ => ∃ l ∈ L, (l : G ⧸ N) = y) ?_ ⟨1, L.one_mem, rfl⟩ ?_ ?_ hq
        · intro y hy
          refine ⟨Quotient.out y, Subgroup.subset_closure ?_, QuotientGroup.out_eq' y⟩
          simp only [Finset.coe_union, Finset.coe_image, Set.mem_union, Set.mem_image]
          exact Or.inr ⟨y, hy, rfl⟩
        · rintro _ _ _ _ ⟨a, ha, rfl⟩ ⟨b, hb, rfl⟩
          exact ⟨a * b, L.mul_mem ha hb, rfl⟩
        · rintro _ _ ⟨a, ha, rfl⟩
          exact ⟨a⁻¹, L.inv_mem ha, rfl⟩
      obtain ⟨l, hl, hlg⟩ := key _ hq
      have h3 : l⁻¹ * g ∈ N := (QuotientGroup.eq).1 hlg
      have h4 : g = l * (l⁻¹ * g) := by group
      rw [h4]
      exact L.mul_mem hl (hNL h3)
- id: schur_finite_index_center_finite_commutator
  kind: named
  level: 4
  topic: 群論・シューアの定理
  statement: 群$G$の中心$Z(G)$が有限指数なら、交換子部分群$[G,G]$は有限群である。
  statement_en: Schur's theorem. If the center Z(G) of a group G has finite index, then the commutator subgroup [G,G] is finite.
  assumptions:
  - $G$は群
  - $Z(G)$は有限指数
  quantifiers:
  - 任意の群$G$
  conclusion: $[G,G]$は有限群である。
  answer: |
    $G$を群、$Z=Z(G)$、$m=[G:Z]$とする。$[az,bw]=[a,b]$（$z,w\in Z$）なので、交換子の値は剰余類の組で決まり、交換子全体は$m^2$個以下の有限集合$C$である。$r=|C|$とする。
    $G/Z$は位数$m$の群なので、ラグランジュの定理よりすべての$g\in G$で$g^m\in Z$である。
    $c=[a,b]$に対し、$c^m\in Z$を用いて$c^{m+1}=c^m\,aba^{-1}b^{-1}=a\,c^{m}\,ba^{-1}b^{-1}=a\,c^{m-1}\,aba^{-1}b^{-1}\,ba^{-1}b^{-1}=(ac a^{-1})^{m-1}[a^2,b]$である。共役な交換子は交換子なので、$c^{m+1}$は$m$個の交換子の積である。また$cd=d(d^{-1}cd)$により、交換子の積の中で個数を変えずに同じ交換子を隣り合わせに移せる。よって長さが$mr$を超える交換子の積は、ある交換子が$m+1$回現れるので長さを1つ短くできる。交換子の逆元$[a,b]^{-1}=[b,a]$も交換子なので、$[G,G]$の元は$C$の元の積である。したがって$[G,G]$の元は長さ$mr$以下の$C$の元の積であり、$[G,G]$は有限である。
  strategy: Bound the number of commutators and shorten products using that g^m is central.
  sketch:
  - 'derive: Commutators depend only on cosets of Z, so there are finitely many.'
  - 'apply_theorem: Lagrange in G/Z gives g^m in Z for all g.'
  - 'derive: c^(m+1) is a product of m commutators.'
  - 'derive: Any product of more than mr commutators can be shortened.'
  - 'conclude: [G,G] consists of bounded products of finitely many elements.'
  openmath: (forall (G) (-> (and (group G) (finite_index_subgroup (group_center G) G)) (finite_set (commutator_subgroup G))))
  hard_negative:
    statement: 中心が有限指数なら、$G$自身も有限群である。
    reason: $G=\mathbb{Z}$では中心は$G$全体で指数$1$だが、$G$は無限群である。
  target: |
    ∀ (G : Type*) [Group G], (Subgroup.center G).FiniteIndex → Finite (commutator G)
  proof: |
    by
      intro G _ h
      let Z := Subgroup.center G
      haveI : Finite (G ⧸ Z) := Subgroup.finite_quotient_of_finiteIndex
      have hsub : commutatorSet G ⊆ Set.range (fun p : (G ⧸ Z) × (G ⧸ Z) => p.1.out * p.2.out * p.1.out⁻¹ * p.2.out⁻¹) := by
        rintro _ ⟨a, b, rfl⟩
        refine ⟨((a : G ⧸ Z), (b : G ⧸ Z)), ?_⟩
        obtain ⟨z, hz⟩ : ∃ z ∈ Z, (a : G ⧸ Z).out = a * z := by
          refine ⟨a⁻¹ * (a : G ⧸ Z).out, ?_, by group⟩
          exact (QuotientGroup.eq).1 (QuotientGroup.out_eq' _).symm
        obtain ⟨w, hw⟩ : ∃ w ∈ Z, (b : G ⧸ Z).out = b * w := by
          refine ⟨b⁻¹ * (b : G ⧸ Z).out, ?_, by group⟩
          exact (QuotientGroup.eq).1 (QuotientGroup.out_eq' _).symm
        obtain ⟨hz1, hz2⟩ := hz
        obtain ⟨hw1, hw2⟩ := hw
        have cz := Subgroup.mem_center_iff.1 hz1
        have cw := Subgroup.mem_center_iff.1 hw1
        simp only [hz2, hw2, commutatorElement_def]
        have e1 : a * z * (b * w) * (a * z)⁻¹ * (b * w)⁻¹ = a * (z * b) * (w * z⁻¹) * a⁻¹ * w⁻¹ * b⁻¹ := by group
        have e2 : a * (b * z) * (w * z⁻¹) * a⁻¹ * w⁻¹ * b⁻¹ = a * b * (z * w * z⁻¹) * a⁻¹ * w⁻¹ * b⁻¹ := by group
        have e3 : a * b * (w * z * z⁻¹) * a⁻¹ * w⁻¹ * b⁻¹ = a * b * (w * a⁻¹) * w⁻¹ * b⁻¹ := by group
        have e4 : a * b * (a⁻¹ * w) * w⁻¹ * b⁻¹ = a * b * a⁻¹ * b⁻¹ := by group
        rw [e1, ← cz b, e2, ← cz w, e3, ← cw a⁻¹, e4]
      haveI : Finite (commutatorSet G) := ((Set.finite_range _).subset hsub).to_subtype
      infer_instance
- id: dihedral_group_rotation_reflection_relations
  kind: textbook
  level: 2
  topic: 群論・二面体群
  statement: 正の整数$n$に対し、$r_i,s_i$（$i\in\mathbb{Z}/n$）からなり$r_ir_j=r_{i+j}$、$r_is_j=s_{j-i}$、$s_ir_j=s_{i+j}$、$s_is_j=r_{j-i}$で積を定めた二面体群$D_n$は、位数$2n$であり、$r_1$の位数は$n$、$s_i$の位数は$2$で、$s_ir_js_i=r_{-j}$をみたす。
  statement_en: For a positive integer n, the dihedral group D_n with elements r_i, s_i (i in Z/n) and products r_i r_j = r_(i+j), r_i s_j = s_(j-i), s_i r_j = s_(i+j), s_i s_j = r_(j-i) has order 2n; r_1 has order n, s_i has order 2, and s_i r_j s_i = r_(-j).
  assumptions:
  - $n$は正の整数
  - $D_n$は上の積をもつ群
  quantifiers:
  - 任意の$i,j\in\mathbb{Z}/n$
  conclusion: $|D_n|=2n$、$r_1$の位数は$n$、$s_i$の位数は$2$、$s_ir_js_i=r_{-j}$である。
  answer: |
    $n$を正の整数、$D_n$を上の群とする。元は$r_i$と$s_i$がそれぞれ$n$個で互いに異なるので$|D_n|=2n$である。積の規則から$r_1^k=r_k$であり、これが単位元$r_0$となるのは$n\mid k$のときなので$r_1$の位数は$n$である。$s_is_i=r_{i-i}=r_0$であり、$s_i\ne r_0$なので$s_i$の位数は$2$である。最後に$s_ir_j=s_{i+j}$、$s_{i+j}s_i=r_{i-(i+j)}=r_{-j}$である。
  strategy: Read each claim off the multiplication rules.
  sketch:
  - 'derive: There are n elements r_i and n elements s_i, so the order is 2n.'
  - 'derive: r_1^k = r_k, so r_1 has order n.'
  - 'derive: s_i s_i = r_0 and s_i ≠ r_0.'
  - 'conclude: s_i r_j s_i = s_(i+j) s_i = r_(-j).'
  openmath: (forall (n i j) (-> (and (in n N) (< 0 n) (in i (zmod_group n)) (in j (zmod_group n))) (and (= (size (dihedral_group n)) (* 2 n)) (= (element_order (dihedral_rotation n 1)) n) (= (element_order (dihedral_reflection n i)) 2) (= (group_mul (group_mul (dihedral_reflection n i) (dihedral_rotation n j)) (dihedral_reflection n i)) (dihedral_rotation n (neg j))))))
  hard_negative:
    statement: 二面体群$D_n$の元はすべて位数が$n$の約数である。
    reason: $n=3$のとき$s_0$の位数は$2$で、$3$の約数でない。
  target: |
    ∀ (n : ℕ) (i j : ZMod n), 0 < n → (DihedralGroup.sr i * DihedralGroup.r j * DihedralGroup.sr i = (DihedralGroup.r (-j) : DihedralGroup n)) ∧ orderOf (DihedralGroup.r 1 : DihedralGroup n) = n ∧ orderOf (DihedralGroup.sr i : DihedralGroup n) = 2 ∧ (Nat.card (DihedralGroup n) = 2 * n)
  proof: |
    by
      intro n i j hn
      haveI : NeZero n := ⟨hn.ne'⟩
      refine ⟨?_, DihedralGroup.orderOf_r_one, DihedralGroup.orderOf_sr i, DihedralGroup.nat_card⟩
      simp
- id: generalized_quaternion_group_relations
  kind: gap
  level: 2
  topic: 群論・一般四元数群
  statement: 正の整数$n$に対し、$a_i,x_i$（$i\in\mathbb{Z}/2n$）からなり$a_ia_j=a_{i+j}$、$a_ix_j=x_{j-i}$、$x_ia_j=x_{i+j}$、$x_ix_j=a_{n+j-i}$で積を定めた一般四元数群$Q_{4n}$は位数$4n$であり、$x_i^2=a_n$、$x_i$の位数は$4$、$a_1$の位数は$2n$である。
  statement_en: For a positive integer n, the generalized quaternion group Q_4n with elements a_i, x_i (i in Z/2n) and products a_i a_j = a_(i+j), a_i x_j = x_(j-i), x_i a_j = x_(i+j), x_i x_j = a_(n+j-i) has order 4n; x_i² = a_n, x_i has order 4, and a_1 has order 2n.
  assumptions:
  - $n$は正の整数
  - $Q_{4n}$は上の積をもつ群
  quantifiers:
  - 任意の$i\in\mathbb{Z}/2n$
  conclusion: $|Q_{4n}|=4n$、$x_i^2=a_n$、$x_i$の位数は$4$、$a_1$の位数は$2n$である。
  answer: |
    $n$を正の整数、$Q_{4n}$を上の群とする。元は$a_i$と$x_i$がそれぞれ$2n$個で互いに異なるので$|Q_{4n}|=4n$である。積の規則から$x_i^2=a_{n+i-i}=a_n$である。$\mathbb{Z}/2n$で$n\ne0$かつ$2n=0$なので、$a_n\ne a_0$かつ$a_n^2=a_0$である。単位元は$a_0$なので$x_i^2\ne1$、$x_i^4=1$であり、$x_i$の位数は$4$である。$a_1^k=a_k$が$a_0$となるのは$2n\mid k$のときなので、$a_1$の位数は$2n$である。
  strategy: Compute squares from the multiplication rules in Z/2n.
  sketch:
  - 'derive: The group has 2n + 2n = 4n elements.'
  - 'derive: x_i² = a_n, with a_n ≠ a_0 and a_n² = a_0.'
  - 'derive: So x_i has order 4.'
  - 'conclude: a_1^k = a_k gives order 2n for a_1.'
  openmath: (forall (n i) (-> (and (in n N) (< 0 n) (in i (zmod_group (* 2 n)))) (and (= (size (quaternion_group n)) (* 4 n)) (= (group_pow (quaternion_x n i) 2) (quaternion_a n n)) (= (element_order (quaternion_x n i)) 4) (= (element_order (quaternion_a n 1)) (* 2 n)))))
  hard_negative:
    statement: 一般四元数群は二面体群と同様に位数$2$の元を多数もち、$x_i$の位数は$2$である。
    reason: $n=2$の四元数群$Q_8$で$x_0^2=a_2\ne1$であり、$x_0$の位数は$4$である。位数$2$の元は$a_2$だけである。
  target: |
    ∀ (n : ℕ) [NeZero n] (i : ZMod (2 * n)), (QuaternionGroup.xa i : QuaternionGroup n) ^ 2 = QuaternionGroup.a (n : ZMod (2 * n)) ∧ orderOf (QuaternionGroup.xa i : QuaternionGroup n) = 4 ∧ orderOf (QuaternionGroup.a 1 : QuaternionGroup n) = 2 * n ∧ Nat.card (QuaternionGroup n) = 4 * n
  proof: |
    by
      intro n _ i
      refine ⟨QuaternionGroup.xa_sq i, QuaternionGroup.orderOf_xa i, QuaternionGroup.orderOf_a_one, ?_⟩
      rw [Nat.card_eq_fintype_card, QuaternionGroup.card]
- id: elementary_abelian_group_is_vector_space
  kind: gap
  level: 3
  topic: 加群・基本アーベル群
  statement: アーベル群$A$と自然数$p$がすべての$x\in A$で$px=0$をみたすなら、$A$には$\bar k\cdot x=kx$で$\mathbb{Z}/p$加群の構造が入る。$p$が素数なら$A$は$\mathbb{F}_p$上のベクトル空間である。
  statement_en: If an abelian group A and a natural number p satisfy px = 0 for all x in A, then A carries a Z/p-module structure with k̄·x = kx. For prime p this makes A a vector space over F_p.
  assumptions:
  - $A$はアーベル群
  - $p$は自然数で、すべての$x$で$px=0$
  quantifiers:
  - 任意の$k\in\mathbb{N}$、$x\in A$
  conclusion: $\mathbb{Z}/p$加群の構造で$\bar k\cdot x=kx$となるものがある。
  answer: |
    $A$をアーベル群、$p$を自然数とし、すべての$x$で$px=0$とする。$A$は$\mathbb{Z}$加群なので環準同型$\rho:\mathbb{Z}\to\mathrm{End}(A)$、$\rho(k)(x)=kx$がある。仮定より$\rho(p)=0$なので$p\mathbb{Z}\subseteq\ker\rho$であり、$\rho$は環準同型$\mathbb{Z}/p\to\mathrm{End}(A)$を誘導する。これが$\bar k\cdot x=kx$で定まる$\mathbb{Z}/p$加群の構造である。$p$が素数なら$\mathbb{Z}/p=\mathbb{F}_p$は体なので、$A$はベクトル空間である。
  strategy: Factor the Z-action through Z/p.
  sketch:
  - 'setup: The Z-module structure gives ρ from Z to End(A).'
  - 'derive: ρ(p) = 0, so ρ factors through Z/p.'
  - 'conclude: The factored map is the required module structure.'
  openmath: (forall (A p) (-> (and (abelian_group A) (in p N) (forall (x) (-> (in x A) (= (group_pow x p) (group_identity A))))) (and (is_module (zmod_ring p) A) (forall (k x) (-> (and (in k N) (in x A)) (= (module_smul k x) (group_pow x k)))))))
  hard_negative:
    statement: 位数$p^2$のアーベル群はつねに$\mathbb{F}_p$上のベクトル空間の加法群である。
    reason: $\mathbb{Z}/p^2$では$p\cdot1\ne0$であり、$\mathbb{F}_p$の作用と両立しない。
  target: |
    ∀ (A : Type*) [AddCommGroup A] (p : ℕ), (∀ x : A, p • x = 0) → ∃ _ : Module (ZMod p) A, ∀ (k : ℕ) (x : A), (k : ZMod p) • x = k • x
  proof: |
    by
      intro A _ p h
      letI := AddCommGroup.zmodModule h
      exact ⟨inferInstance, fun k x => Nat.cast_smul_eq_nsmul (ZMod p) k x⟩
- id: hom_contravariant_left_exact
  kind: gap
  level: 3
  topic: 加群・Hom関手の左完全性
  statement: 環$R$上の完全列$A\xrightarrow{f}B\xrightarrow{g}C\to0$と加群$X$について、$0\to\mathrm{Hom}(C,X)\to\mathrm{Hom}(B,X)\to\mathrm{Hom}(A,X)$は完全である。すなわち$u\circ g=0$なら$u=0$であり、$v\circ f=0$なら$v=u\circ g$となる$u$がある。
  statement_en: If A → B → C → 0 is an exact sequence of modules over a ring with maps f and g, then for every module X the sequence 0 → Hom(C,X) → Hom(B,X) → Hom(A,X) is exact; that is, u∘g = 0 implies u = 0, and v∘f = 0 implies v = u∘g for some u.
  assumptions:
  - $A\xrightarrow{f}B\xrightarrow{g}C\to0$は環$R$上の完全列
  - $X$は$R$加群
  quantifiers:
  - 任意の$u:C\to X$と$v:B\to X$
  conclusion: $u\circ g=0\Rightarrow u=0$であり、$v\circ f=0$なら$v=u\circ g$となる$u$がある。
  answer: |
    $R$を環、$A\xrightarrow{f}B\xrightarrow{g}C\to0$を完全列、$X$を$R$加群とする。$u:C\to X$が$u\circ g=0$をみたすとき、$c\in C$は$g$の全射性から$c=g(b)$と書けて$u(c)=u(g(b))=0$である。$v:B\to X$が$v\circ f=0$をみたすとする。完全性より$\ker g=\mathrm{im}\,f\subseteq\ker v$である。$c=g(b)$に対し$u(c)=v(b)$と定めると、$g(b)=g(b')$なら$b-b'\in\ker g\subseteq\ker v$なので矛盾なく定まり、$u$は線形で$u\circ g=v$である。
  strategy: Use surjectivity of g for injectivity and factor v through C for exactness.
  sketch:
  - 'derive: Surjectivity of g shows that u∘g = 0 forces u = 0.'
  - 'derive: v∘f = 0 gives ker g = im f ⊆ ker v.'
  - 'construct: Define u(g(b)) = v(b), which is well defined and linear.'
  - 'conclude: u∘g = v.'
  openmath: (forall (T A B Cc X f g) (-> (and (is_ring T) (module_hom f T A B) (module_hom g T B Cc) (exact_pair f g) (surjective_map g) (is_module T X)) (and (forall (u) (-> (and (module_hom u T Cc X) (= (map_compose u g) (zero_map B X))) (= u (zero_map Cc X)))) (forall (v) (-> (and (module_hom v T B X) (= (map_compose v f) (zero_map A X))) (exists (u) (and (module_hom u T Cc X) (= (map_compose u g) v))))))))
  hard_negative:
    statement: $\mathrm{Hom}(-,X)$は右側も完全で、$\mathrm{Hom}(B,X)\to\mathrm{Hom}(A,X)$はつねに全射である。
    reason: $\mathbb{Z}\xrightarrow{2}\mathbb{Z}$と$X=\mathbb{Z}/2$では、$\mathrm{Hom}(\mathbb{Z},\mathbb{Z}/2)\to\mathrm{Hom}(\mathbb{Z},\mathbb{Z}/2)$は$v\mapsto v\circ2=0$であり全射でない。
  target: |
    ∀ (R A B C X : Type*) [Ring R] [AddCommGroup A] [AddCommGroup B] [AddCommGroup C] [AddCommGroup X] [Module R A] [Module R B] [Module R C] [Module R X] (f : A →ₗ[R] B) (g : B →ₗ[R] C), Function.Exact f g → Function.Surjective g → (∀ u : C →ₗ[R] X, u.comp g = 0 → u = 0) ∧ ∀ v : B →ₗ[R] X, v.comp f = 0 → ∃ u : C →ₗ[R] X, u.comp g = v
  proof: |
    by
      intro R A B C X _ _ _ _ _ _ _ _ _ f g hfg hg
      refine ⟨fun u hu => ?_, fun v hv => ?_⟩
      · ext c
        obtain ⟨b, rfl⟩ := hg c
        exact LinearMap.congr_fun hu b
      · have hker : LinearMap.ker g ≤ LinearMap.ker v := by
          intro b hb
          obtain ⟨a, rfl⟩ := (hfg b).1 hb
          exact LinearMap.congr_fun hv a
        let e := g.quotKerEquivOfSurjective hg
        refine ⟨((LinearMap.ker g).liftQ v hker).comp e.symm.toLinearMap, ?_⟩
        ext b
        have : e.symm (g b) = (LinearMap.ker g).mkQ b := by
          apply e.injective
          simp [e]
        simp [this]
- id: four_lemma_injective_middle
  kind: gap
  level: 3
  topic: 加群・四項補題（単射）
  statement: 環上の加群の可換図式で上下の行が$A_1\to A_2\to A_3\to A_4$、$B_1\to B_2\to B_3\to B_4$であり、$A_2,A_3$と$B_2$で完全で、縦の写像$a,b,c,d$について$a$が全射、$b,d$が単射なら、$c$は単射である。五項補題の単射側を弱い仮定で述べた形である。
  statement_en: Four lemma, injective form. In a commutative diagram of modules with rows A_1→A_2→A_3→A_4 and B_1→B_2→B_3→B_4, exact at A_2, A_3 and B_2, if a is surjective and b, d are injective, then c is injective. This is the injective half of the five lemma under weaker hypotheses.
  assumptions:
  - 図式は可換
  - 上の行は$A_2,A_3$で完全、下の行は$B_2$で完全
  - $a$は全射、$b,d$は単射
  quantifiers:
  - 任意の環上の加群と線形写像
  conclusion: $c$は単射である。
  answer: |
    $R$を環とし、図式を上のとおりとする。行の写像を$f_i:A_i\to A_{i+1}$、$g_i:B_i\to B_{i+1}$とする。$x\in A_3$が$c(x)=0$をみたすとする。$d(f_3(x))=g_3(c(x))=0$で$d$は単射なので$f_3(x)=0$である。$A_3$での完全性より$x=f_2(y)$となる$y\in A_2$がある。$g_2(b(y))=c(f_2(y))=c(x)=0$なので、$B_2$での完全性より$b(y)=g_1(z)$となる$z\in B_1$がある。$a$の全射性より$z=a(w)$とすると、$b(f_1(w))=g_1(a(w))=b(y)$である。$b$は単射なので$y=f_1(w)$であり、$A_2$での完全性より$x=f_2(f_1(w))=0$である。
  strategy: Chase an element of ker c through the diagram.
  sketch:
  - 'derive: c(x) = 0 and injectivity of d give f_3(x) = 0, so x = f_2(y).'
  - 'derive: g_2(b(y)) = 0, so b(y) = g_1(z) with z = a(w).'
  - 'derive: Injectivity of b gives y = f_1(w).'
  - 'conclude: Exactness at A_2 gives x = 0.'
  openmath: (forall (T A1 A2 A3 A4 B1 B2 B3 B4 p q r u v w a b c d) (-> (and (is_ring T) (module_hom p T A1 A2) (module_hom q T A2 A3) (module_hom r T A3 A4) (module_hom u T B1 B2) (module_hom v T B2 B3) (module_hom w T B3 B4) (module_hom a T A1 B1) (module_hom b T A2 B2) (module_hom c T A3 B3) (module_hom d T A4 B4) (= (map_compose u a) (map_compose b p)) (= (map_compose v b) (map_compose c q)) (= (map_compose w c) (map_compose d r)) (exact_pair p q) (exact_pair q r) (exact_pair u v) (surjective_map a) (injective_map b) (injective_map d)) (injective_map c)))
  hard_negative:
    statement: $a$が全射でなくても、$b,d$が単射なら$c$は単射である。
    reason: $A_1=0$、$A_2=A_3=\mathbb{Z}/2$、$A_4=0$、$B_1=B_2=\mathbb{Z}/2$、$B_3=B_4=0$とし、$f_2=\mathrm{id}$、$g_1=\mathrm{id}$、$b=\mathrm{id}$とする。図式は可換で各点は完全であり、$b,d$は単射だが、$a:0\to\mathbb{Z}/2$は全射でなく、$c:\mathbb{Z}/2\to0$は単射でない。
  target: |
    ∀ (R A₁ A₂ A₃ A₄ B₁ B₂ B₃ B₄ : Type*) [Ring R] [AddCommGroup A₁] [AddCommGroup A₂] [AddCommGroup A₃] [AddCommGroup A₄] [AddCommGroup B₁] [AddCommGroup B₂] [AddCommGroup B₃] [AddCommGroup B₄] [Module R A₁] [Module R A₂] [Module R A₃] [Module R A₄] [Module R B₁] [Module R B₂] [Module R B₃] [Module R B₄] (f₁ : A₁ →ₗ[R] A₂) (f₂ : A₂ →ₗ[R] A₃) (f₃ : A₃ →ₗ[R] A₄) (g₁ : B₁ →ₗ[R] B₂) (g₂ : B₂ →ₗ[R] B₃) (g₃ : B₃ →ₗ[R] B₄) (a : A₁ →ₗ[R] B₁) (b : A₂ →ₗ[R] B₂) (c : A₃ →ₗ[R] B₃) (d : A₄ →ₗ[R] B₄), g₁ ∘ₗ a = b ∘ₗ f₁ → g₂ ∘ₗ b = c ∘ₗ f₂ → g₃ ∘ₗ c = d ∘ₗ f₃ → Function.Exact f₁ f₂ → Function.Exact f₂ f₃ → Function.Exact g₁ g₂ → Function.Surjective a → Function.Injective b → Function.Injective d → Function.Injective c
  proof: |
    by
      intro R A₁ A₂ A₃ A₄ B₁ B₂ B₃ B₄ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ f₁ f₂ f₃ g₁ g₂ g₃ a b c d h1 h2 h3 ef1 ef2 eg1 ha hb hd
      rw [injective_iff_map_eq_zero]
      intro x hx
      have h4 : f₃ x = 0 := hd (by
        have := LinearMap.congr_fun h3 x
        simp only [LinearMap.comp_apply] at this
        rw [map_zero, ← this, hx, map_zero])
      obtain ⟨y, rfl⟩ := (ef2 x).1 h4
      have h5 : g₂ (b y) = 0 := by
        have := LinearMap.congr_fun h2 y
        simp only [LinearMap.comp_apply] at this
        rw [this, hx]
      obtain ⟨z, hz⟩ := (eg1 (b y)).1 h5
      obtain ⟨w, rfl⟩ := ha z
      have h6 : b (f₁ w) = b y := by
        have := LinearMap.congr_fun h1 w
        simp only [LinearMap.comp_apply] at this
        rw [← this, hz]
      have h7 : f₁ w = y := hb h6
      rw [← h7]
      exact (ef1 (f₁ w)).2 ⟨w, rfl⟩
- id: four_lemma_surjective_middle
