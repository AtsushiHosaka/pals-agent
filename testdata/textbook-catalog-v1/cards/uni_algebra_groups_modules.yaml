  kind: gap
  level: 3
  topic: 加群・射影加群への全射の分裂
  statement: 環$R$上の射影加群$P$への全射$f:M\to P$には、$f\circ s=\mathrm{id}_P$をみたす線形写像$s:P\to M$があり、$M=\ker f\oplus s(P)$である。
  statement_en: A surjective linear map f from M onto a projective module P has a linear section s with f∘s = id, and M = ker f ⊕ s(P).
  assumptions:
  - $P$は環$R$上の射影加群
  - $f:M\to P$は全射線形写像
  quantifiers:
  - 任意の$M,P,f$
  conclusion: $f\circ s=\mathrm{id}_P$かつ$M=\ker f\oplus s(P)$となる$s$がある。
  answer: |
    $R$を環、$P$を射影加群、$f:M\to P$を全射とする。射影加群の持ち上げの性質を$\mathrm{id}_P$に適用すると、$f\circ s=\mathrm{id}_P$となる線形写像$s:P\to M$がある。$x=s(y)\in\ker f$なら$y=f(s(y))=f(x)=0$なので$x=0$である。$x\in M$は$x=(x-s(f(x)))+s(f(x))$と書け、$f(x-s(f(x)))=f(x)-f(x)=0$である。よって$M=\ker f\oplus s(P)$である。
  strategy: Lift the identity of P through f.
  sketch:
  - 'apply_theorem: The lifting property applied to id_P gives a section s.'
  - 'derive: ker f ∩ s(P) = 0 since y = f(s(y)).'
  - 'conclude: x = (x - s f x) + s f x gives the sum decomposition.'
  openmath: (forall (T M K f) (-> (and (is_ring T) (projective_module T K) (module_hom f T M K) (surjective_map f)) (exists (s) (and (module_hom s T K M) (= (map_compose f s) (identity_map K)) (complementary_submodules (map_kernel f) (map_image s) M)))))
