- id: free_module_universal_property_basis
  kind: gap
  level: 3
  topic: 加群・自由加群の普遍性
  statement: 環$R$上の加群$M$の基底$(b_i)_{i\in\iota}$と加群$N$、写像$f:\iota\to N$に対し、$\varphi(b_i)=f(i)$をみたす$R$線形写像$\varphi:M\to N$がただ1つある。
  statement_en: For a basis (b_i) of a module M over a ring R, a module N and a map f from the index set to N, there is a unique R-linear map φ from M to N with φ(b_i) = f(i).
  assumptions:
  - $(b_i)_{i\in\iota}$は$R$加群$M$の基底
  - $N$は$R$加群、$f:\iota\to N$は写像
  quantifiers:
  - 任意の$M,N,b,f$
  conclusion: $\varphi(b_i)=f(i)$をみたす線形写像$\varphi$がただ1つある。
  answer: |
    $R$を環、$(b_i)$を$M$の基底、$N$を加群、$f:\iota\to N$を写像とする。$x\in M$は有限和$x=\sum_ir_ib_i$とただ一通りに書けるので、$\varphi(x)=\sum_ir_if(i)$と定められる。表示の一意性から$\varphi$は線形で、$\varphi(b_i)=f(i)$である。線形写像$\psi$が$\psi(b_i)=f(i)$をみたせば$\psi(x)=\sum_ir_i\psi(b_i)=\varphi(x)$である。
  strategy: Define φ on the unique expansion in the basis.
  sketch:
  - 'construct: Put φ(Σ r_i b_i) = Σ r_i f(i).'
  - 'derive: Uniqueness of the expansion makes φ well defined and linear.'
  - 'conclude: Linearity forces any other such map to equal φ.'
  openmath: (forall (T M V b f) (-> (and (is_ring T) (is_module T M) (is_module T V) (is_basis_family T M b)) (exists (u) (and (module_hom u T M V) (forall (i) (= (fn_value u (fn_value b i)) (fn_value f i))) (forall (v) (-> (and (module_hom v T M V) (forall (i) (= (fn_value v (fn_value b i)) (fn_value f i)))) (= v u)))))))
  hard_negative:
    statement: 生成系$(g_i)$についても、任意の$f$に対し$\varphi(g_i)=f(i)$となる線形写像がある。
    reason: $\mathbb{Z}/2$の生成系$\{1\}$と$N=\mathbb{Z}$、$f=1$では、線形写像$\mathbb{Z}/2\to\mathbb{Z}$は$0$だけである。
  target: |
    ∀ (R M N ι : Type*) [Ring R] [AddCommGroup M] [AddCommGroup N] [Module R M] [Module R N] (b : Module.Basis ι R M) (f : ι → N), ∃! φ : M →ₗ[R] N, ∀ i, φ (b i) = f i
  proof: |
    by
      intro R M N ι _ _ _ _ _ b f
      refine ⟨b.constr ℤ f, fun i => b.constr_basis ℤ f i, fun φ h => ?_⟩
      apply b.ext
      intro i
      rw [h, b.constr_basis]
- id: free_module_rank_invariant_over_commutative_ring
  kind: textbook
  level: 3
  topic: 加群・自由加群の階数
  statement: 自明でない可換環$R$について、$R^m\cong R^n$（$R$加群として）なら$m=n$である。
  statement_en: For a nontrivial commutative ring R, an isomorphism of R-modules R^m ≅ R^n implies m = n.
  assumptions:
  - $R$は自明でない可換環
  - $R^m\cong R^n$
  quantifiers:
  - 任意の自然数$m,n$
  conclusion: $m=n$である。
  answer: |
    $R$を自明でない可換環とし、$R^m\cong R^n$とする。$R$は自明でないので極大イデアル$\mathfrak m$があり、$K=R/\mathfrak m$は体である。同型は$R^m/\mathfrak mR^m\cong R^n/\mathfrak mR^n$を誘導し、これは$K^m\cong K^n$という$K$線形同型である。ベクトル空間の次元の一意性から$m=n$である。
  strategy: Reduce modulo a maximal ideal and compare dimensions.
  sketch:
  - 'setup: Choose a maximal ideal m and K = R/m.'
  - 'derive: The isomorphism induces K^m ≅ K^n.'
  - 'conclude: Dimension over the field K gives m = n.'
  openmath: (forall (T m n) (-> (and (is_comm_ring T) (nontrivial_ring T) (in m N) (in n N) (module_iso T (free_rank_module T m) (free_rank_module T n))) (= m n)))
  hard_negative:
    statement: 自明でないすべての環で$R^m\cong R^n$なら$m=n$である。
    reason: 無限次元ベクトル空間$V$の自己準同型環$R=\mathrm{End}(V)$では、$V\cong V\oplus V$から$R\cong R^2$（左加群）となる。可換の仮定は外せない。
  target: |
    ∀ (R : Type*) [CommRing R] [Nontrivial R] (m n : ℕ), Nonempty ((Fin m → R) ≃ₗ[R] (Fin n → R)) → m = n
  proof: |
    by
      intro R _ _ m n ⟨e⟩
      exact eq_of_fin_equiv R e
