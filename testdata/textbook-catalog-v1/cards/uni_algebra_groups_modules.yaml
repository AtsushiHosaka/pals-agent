    statement: 任意の加群への全射は分裂する。
    reason: $\mathbb{Z}\to\mathbb{Z}/2$は全射だが、$\mathbb{Z}/2\to\mathbb{Z}$の線形写像は$0$だけなので分裂しない。
  target: |
    ∀ (R M P : Type*) [Ring R] [AddCommGroup M] [AddCommGroup P] [Module R M] [Module R P] [Module.Projective R P] (f : M →ₗ[R] P), Function.Surjective f → ∃ s : P →ₗ[R] M, f.comp s = LinearMap.id ∧ IsCompl (LinearMap.ker f) (LinearMap.range s)
  proof: |
    by
      intro R M P _ _ _ _ _ _ f hf
      obtain ⟨s, hs⟩ := f.exists_rightInverse_of_surjective (LinearMap.range_eq_top.2 hf)
      refine ⟨s, hs, ?_⟩
      constructor
      · rw [Submodule.disjoint_def]
        rintro x hx ⟨y, rfl⟩
        have h1 : y = f (s y) := (LinearMap.congr_fun hs y).symm
        rw [LinearMap.mem_ker] at hx
        rw [h1, hx, map_zero]
      · rw [codisjoint_iff, eq_top_iff]
        intro x _
        have : x = (x - s (f x)) + s (f x) := by abel
        rw [this]
        refine Submodule.add_mem_sup ?_ ⟨_, rfl⟩
        rw [LinearMap.mem_ker, map_sub]
        have h1 : f (s (f x)) = f x := LinearMap.congr_fun hs (f x)
        rw [h1, sub_self]
- id: direct_sum_projective_iff_summands_projective
  kind: gap
  level: 3
  topic: 加群・射影加群の直和
  statement: 環$R$上の加群の族$(A_i)$について、直和$\bigoplus_iA_i$が射影加群であることと、すべての$A_i$が射影加群であることは同値である。
  statement_en: For a family (A_i) of modules over a ring R, the direct sum ⊕A_i is projective if and only if every A_i is projective.
  assumptions:
  - $(A_i)_{i\in\iota}$は環$R$上の加群の族
  quantifiers:
  - 任意の族$(A_i)$
  conclusion: $\bigoplus_iA_i$が射影的$\iff$すべての$A_i$が射影的である。
  answer: |
    $R$を環、$(A_i)$を加群の族、$A=\bigoplus_iA_i$とする。全射$f:M\to N$と線形写像$h$の持ち上げを考える。$A$が射影的とし、$h:A_i\to N$をとる。射影$p_i:A\to A_i$との合成$h\circ p_i$の持ち上げ$k:A\to M$をとると、包含$\iota_i$について$k\circ\iota_i$は$f\circ k\circ\iota_i=h\circ p_i\circ\iota_i=h$をみたす。よって$A_i$は射影的である。逆にすべての$A_i$が射影的とし、$h:A\to N$をとる。各$h\circ\iota_i$の持ち上げ$k_i:A_i\to M$をとる。直和の普遍性から$k\circ\iota_i=k_i$となる$k:A\to M$があり、$f\circ k$と$h$は各$\iota_i$上で一致するので$f\circ k=h$である。
  strategy: Lift summand by summand using the universal property of direct sums.
  sketch:
  - 'derive: If A is projective, lift h∘p_i and restrict to A_i.'
  - 'construct: If every A_i is projective, lift h∘ι_i and glue by the universal property.'
  - 'conclude: Both directions follow from the lifting property.'
  openmath: (forall (T I A) (-> (and (is_ring T) (module_family A T I)) (<-> (projective_module T (direct_sum_family A)) (forall (i) (-> (in i I) (projective_module T (fn_value A i)))))))
  hard_negative:
    statement: 射影加群の無限直積もつねに射影加群である。
    reason: $\mathbb{Z}$の可算無限直積はベール・シュペッカーの定理より自由でなく、単項イデアル整域上の部分加群の議論から射影的でもない。直和と直積は異なる。
  target: |
    ∀ (R ι : Type*) (A : ι → Type*) [Ring R] [∀ i, AddCommGroup (A i)] [∀ i, Module R (A i)] [DecidableEq ι], Module.Projective R (Π₀ i, A i) ↔ ∀ i, Module.Projective R (A i)
  proof: |
    by
      intro R ι A _ _ _ _
      constructor
      · intro h i
        exact Module.Projective.of_split (DFinsupp.lsingle i) (DFinsupp.lapply i) (by ext x; simp)
      · intro h
        infer_instance
- id: baer_criterion_for_injective_modules
  kind: named
  level: 3
  topic: 加群・ベールの判定法
  statement: 環$R$上の加群$Q$について、任意の左イデアル$I$からの線形写像$g:I\to Q$が$R\to Q$に延びるなら、$Q$は入射加群である。
  statement_en: Baer's criterion. If every linear map from a left ideal I of a ring R to a module Q extends to a linear map from R to Q, then Q is an injective module.
  assumptions:
  - $Q$は環$R$上の加群
  - 任意の左イデアル$I$と$g:I\to Q$は$R\to Q$に延びる
  quantifiers:
  - 任意の$R,Q$
  conclusion: $Q$は入射加群である。
  answer: |
    $R$を環、$Q$を上の条件をみたす加群とする。$A\le B$を加群、$f:A\to Q$を線形写像とする（単射$A\to B$は包含と見なせる）。$A\le C\le B$なる$C$と$f$の延長$h:C\to Q$の組全体に、延長関係で順序を入れる。全順序部分集合には和集合で上界があるので、ツォルンの補題より極大元$(C,h)$がある。$C=B$を示す。$b\in B\setminus C$があるとする。$I=\{r\in R\mid rb\in C\}$は左イデアルであり、$g(r)=h(rb)$は線形写像$I\to Q$である。仮定より$g'|_I=g$となる$g':R\to Q$があり、$q=g'(1)$とおくと$r\in I$で$h(rb)=rq$である。$C'=C+Rb$上で$k(c+rb)=h(c)+rq$と定める。$c+rb=c'+r'b$なら$(r-r')b=c'-c\in C$より$r-r'\in I$で、$h(c'-c)=(r-r')q$となるので$k$は矛盾なく定まる。$k$は$h$の真の延長であり、極大性に反する。よって$C=B$である。
  strategy: Take a maximal extension by Zorn and extend by one element using the ideal condition.
  sketch:
  - 'setup: Order partial extensions of f by extension.'
  - 'apply_theorem: Zorn gives a maximal extension (C,h).'
  - 'construct: For b outside C, I = {r : rb in C} and g(r) = h(rb) extend to R, giving q.'
  - 'contradiction: k(c+rb) = h(c)+rq is a proper extension.'
  - 'conclude: C = B.'
  openmath: (forall (T Qq) (-> (and (is_ring T) (is_module T Qq) (forall (I g) (-> (and (left_ideal_of I T) (module_hom g T I Qq)) (exists (u) (and (module_hom u T T Qq) (forall (x) (-> (in x I) (= (fn_value u x) (fn_value g x))))))))) (injective_module T Qq)))
  hard_negative:
    statement: ベールの判定法の条件は、$R$自身からの写像を調べるだけで足りる。
    reason: 任意の$Q$で$R\to Q$の写像は$R$上で定まるので、この条件は何も課さない。$\mathbb{Z}$は$R=\mathbb{Z}$のときこの条件をみたすが、$2\mathbb{Z}\to\mathbb{Z}$、$2\mapsto1$が延びないので入射的でない。
  target: |
    ∀ (R Q : Type*) [Ring R] [AddCommGroup Q] [Module R Q], (∀ (I : Ideal R) (g : I →ₗ[R] Q), ∃ g' : R →ₗ[R] Q, ∀ (x : R) (mem : x ∈ I), g' x = g ⟨x, mem⟩) → Module.Injective R Q
  proof: |
    by
      intro R Q _ _ _ h
      exact Module.Baer.injective h
- id: divisible_abelian_group_is_injective
  kind: gap
  level: 3
  topic: 加群・可除群の入射性
  statement: 可除なアーベル群$A$（$n\ne0$と$x\in A$に対し$ny=x$となる$y$がある）は、$\mathbb{Z}$加群として入射的である。すなわち単射準同型$i:B\to C$と準同型$f:B\to A$に対し$F\circ i=f$となる準同型$F:C\to A$がある。
  statement_en: A divisible abelian group A (for n ≠ 0 and x in A there is y with ny = x) is injective as a Z-module, that is, for an injective homomorphism i from B to C and a homomorphism f from B to A there is a homomorphism F from C to A with F∘i = f.
  assumptions:
  - $A$は可除なアーベル群
  - $i:B\to C$は単射準同型
  - $f:B\to A$は準同型
  quantifiers:
  - 任意の$B,C,i,f$
  conclusion: $F\circ i=f$となる準同型$F:C\to A$がある。
  answer: |
    $A$を可除なアーベル群とする。ベールの判定法を$R=\mathbb{Z}$に使う。$\mathbb{Z}$のイデアルは$n\mathbb{Z}$の形である。$g:n\mathbb{Z}\to A$を準同型とする。$n=0$なら$0$写像が延長である。$n\ne0$なら可除性より$ny=g(n)$となる$y\in A$があり、$g'(k)=ky$は$\mathbb{Z}\to A$の準同型で、$g'(nm)=nmy=mg(n)=g(nm)$をみたす。よって$A$は入射$\mathbb{Z}$加群であり、$F$が存在する。
  strategy: Apply Baer's criterion to the ideals nZ.
  sketch:
  - 'setup: Every ideal of Z has the form nZ.'
  - 'construct: For g from nZ to A, choose y with ny = g(n) and put g′(k) = ky.'
  - 'apply_theorem: Baer gives injectivity over Z.'
  openmath: (forall (A B Cc i f) (-> (and (divisible_group A) (group_hom i B Cc) (injective_function i) (group_hom f B A) (abelian_group B) (abelian_group Cc)) (exists (u) (and (group_hom u Cc A) (forall (b) (-> (in b B) (= (fn_value u (fn_value i b)) (fn_value f b))))))))
  hard_negative:
    statement: $\mathbb{Z}$は入射$\mathbb{Z}$加群である。
    reason: $\mathbb{Z}$は可除でなく、$2\mathbb{Z}\to\mathbb{Z}$、$2\mapsto1$は$\mathbb{Z}\to\mathbb{Z}$に延びない。
  target: |
    ∀ (A : Type*) [AddCommGroup A], (∀ (x : A) (n : ℤ), n ≠ 0 → ∃ y, n • y = x) → ∀ (B C : Type*) [AddCommGroup B] [AddCommGroup C] (i : B →+ C) (f : B →+ A), Function.Injective i → ∃ F : C →+ A, ∀ b, F (i b) = f b
  proof: |
    by
      intro A _ hd B C _ _ i f hi
      classical
      letI : DivisibleBy A ℤ :=
        { div := fun x n => if h : n = 0 then 0 else (hd x n h).choose
          div_zero := fun x => by simp
          div_cancel := fun {n} x hn => by simpa [hn] using (hd x n hn).choose_spec }
      obtain ⟨F, hF⟩ := (Module.Baer.of_divisible A).extension_property_addMonoidHom i hi f
      exact ⟨F, fun b => DFunLike.congr_fun hF b⟩
- id: every_module_embeds_in_injective_module
  kind: textbook
  level: 4
  topic: 加群・入射加群への埋め込み
  statement: 環$R$上の任意の加群$M$は、ある入射$R$加群$I$へ単射線形写像で埋め込める。
  statement_en: Every module M over a ring R admits an injective linear map into an injective R-module I.
  assumptions:
  - $M$は環$R$上の加群
  quantifiers:
  - 任意の$R,M$
  conclusion: 入射加群$I$と単射線形写像$M\to I$がある。
  answer: |
    $R$を環、$M$を左$R$加群とする。アーベル群$X$に対し$D(X)=\mathrm{Hom}_{\mathbb{Z}}(X,\mathbb{Q}/\mathbb{Z})$とおく。$X$が左$R$加群なら$D(X)$は$(\varphi r)(x)=\varphi(rx)$で右$R$加群であり、$X$が右$R$加群なら$D(X)$は$(r\varphi)(x)=\varphi(xr)$で左$R$加群である。$\mathbb{Q}/\mathbb{Z}$は可除なので入射$\mathbb{Z}$加群であり、$D$は完全列を完全列に移す。$x\ne0$に対し、$\mathbb{Z}x\to\mathbb{Q}/\mathbb{Z}$の$0$でない準同型を延ばせば$x$で$0$でない指標が得られるので、自然な$R$線形写像$M\to D(D(M))$は単射である。$R$を右$R$加群と見た$D(R)$は左$R$加群であり、左$R$加群$N$について$f\mapsto(n\mapsto f(n)(1))$は$N$について自然な同型$\mathrm{Hom}_R(N,D(R))\cong D(N)$を与える。よって$\mathrm{Hom}_R(-,D(R))$は$D$と同じく完全であり、$D(R)$は入射$R$加群である。入射加群の直積も入射的である。右$R$加群$D(M)$に対し、自由右$R$加群$F=R^{(J)}$からの全射$F\to D(M)$をとる。$D$を施すと左$R$加群の単射$D(D(M))\to D(F)=D(R)^J$を得る。$I=D(R)^J$は入射的であり、合成$M\to D(D(M))\to I$は単射である。
  strategy: Embed M in its double character dual and then in a product of copies of D(R).
  sketch:
  - 'setup: D(X) = Hom_Z(X, Q/Z), with Q/Z divisible.'
  - 'derive: Characters separate points, so M → D(D(M)) is injective.'
  - 'derive: D(R) is an injective R-module, and products of injectives are injective.'
  - 'construct: A surjection from a free right module onto the right module D(M) dualizes to an injection into D(R)^J.'
  - 'conclude: The composite embeds M into an injective module.'
  openmath: (forall (T M) (-> (and (is_ring T) (is_module T M)) (exists (I f) (and (injective_module T I) (module_hom f T M I) (injective_map f)))))
  hard_negative:
    statement: 任意の加群は自由加群へ単射で埋め込める。
    reason: $\mathbb{Z}/2$は捩れ元をもつので、捩れのない自由$\mathbb{Z}$加群へ単射で埋め込めない。
  target: |
    ∀ (R M : Type) [Ring R] [AddCommGroup M] [Module R M], ∃ (I : Type) (_ : AddCommGroup I) (_ : Module R I), Module.Injective R I ∧ ∃ f : M →ₗ[R] I, Function.Injective f
  proof: |
    by
      intro R M _ _ _
      haveI : CategoryTheory.EnoughInjectives (ModuleCat.{0} R) := inferInstance
      let P := CategoryTheory.EnoughInjectives.presentation (ModuleCat.of R M)
      obtain ⟨P⟩ := CategoryTheory.EnoughInjectives.presentation (ModuleCat.of R M)
      refine ⟨P.J, inferInstance, inferInstance, ?_, P.f.hom, ?_⟩
      · exact (Module.injective_iff_injective_object R P.J).2 P.injective
      · exact (ModuleCat.mono_iff_injective P.f).1 P.mono
- id: flat_module_ideal_criterion
  kind: textbook
  level: 4
  topic: 加群・平坦性のイデアル判定
  statement: 可換環$R$上の加群$M$が平坦であることと、すべてのイデアル$I$について$I\otimes_RM\to R\otimes_RM$が単射であることは同値である。
  statement_en: A module M over a commutative ring R is flat if and only if for every ideal I the map I ⊗ M → R ⊗ M is injective.
  assumptions:
  - $R$は可換環
  - $M$は$R$加群
  quantifiers:
  - 任意のイデアル$I$
  conclusion: $M$が平坦$\iff$すべての$I$で$I\otimes_RM\to R\otimes_RM$が単射である。
  answer: |
    $R$を可換環、$M$を$R$加群とする。平坦なら$I\to R$の単射が保たれるので条件が成り立つ。逆を示す。$D(X)=\mathrm{Hom}_{\mathbb{Z}}(X,\mathbb{Q}/\mathbb{Z})$とおく。$\mathbb{Q}/\mathbb{Z}$は入射$\mathbb{Z}$加群で点を分離するので、準同型$u$が単射であることと$D(u)$が全射であることは同値である。随伴により$D(X\otimes_RM)\cong\mathrm{Hom}_R(X,D(M))$であり、$X$について自然である。よって$I\otimes M\to R\otimes M$が単射であることは$\mathrm{Hom}_R(R,D(M))\to\mathrm{Hom}_R(I,D(M))$が全射であることと同値である。条件がすべての$I$で成り立てば、ベールの判定法より$D(M)$は入射的である。すると任意の単射$X\to Y$について$\mathrm{Hom}_R(Y,D(M))\to\mathrm{Hom}_R(X,D(M))$が全射で、同じ同値から$X\otimes M\to Y\otimes M$は単射である。これは$M$が平坦であることを意味する。
  strategy: Translate injectivity after tensoring into surjectivity of Hom into the character module, then use Baer.
  sketch:
  - 'setup: D(X) = Hom_Z(X, Q/Z) detects injectivity.'
  - 'apply_theorem: Adjunction gives D(X ⊗ M) ≅ Hom_R(X, D(M)).'
  - 'translate: The ideal condition says that maps from I to D(M) extend to R.'
  - 'apply_theorem: Baer shows that D(M) is injective.'
  - 'conclude: Tensoring with M preserves all injections.'
  openmath: (forall (T M) (-> (and (is_comm_ring T) (is_module T M)) (<-> (flat_module T M) (forall (I) (-> (ideal_of I T) (injective_map (ideal_inclusion_tensor I M)))))))
  hard_negative:
    statement: 単項イデアルだけを調べれば、どの可換環でも平坦性を判定できる。
    reason: $R=k[x,y]$、$M=(x,y)$は捩れがないので、単項イデアル$(a)$では$(a)\otimes M\to M$が単射である。しかし$M$は平坦でない。
  target: |
    ∀ (R M : Type*) [CommRing R] [AddCommGroup M] [Module R M], Module.Flat R M ↔ ∀ I : Ideal R, Function.Injective (LinearMap.rTensor M I.subtype)
  proof: |
    by
      intro R M _ _ _
      exact Module.Flat.iff_rTensor_injective'
- id: flat_iff_torsion_free_over_pid
  kind: gap
  level: 4
  topic: 加群・単項イデアル整域上の平坦性
  statement: 単項イデアル整域$R$上の加群$M$が平坦であることと、捩れがないこと（$r\ne0$、$rm=0$なら$m=0$）は同値である。
  statement_en: A module M over a principal ideal domain R is flat if and only if it is torsion-free, meaning that r ≠ 0 and rm = 0 imply m = 0.
  assumptions:
  - $R$は単項イデアル整域
  - $M$は$R$加群
  quantifiers:
  - 任意の$R,M$
  conclusion: $M$が平坦$\iff$$M$は捩れをもたない。
  answer: |
    $R$を単項イデアル整域、$M$を$R$加群とする。$M$が平坦で$r\ne0$とする。$R$は整域なので積$r:R\to R$は単射であり、$M$とのテンソル積をとると積$r:M\to M$は単射である。よって$rm=0$なら$m=0$である。逆に$M$に捩れがないとする。イデアルによる平坦性の判定法を使う。$I=(a)$とする。$a=0$なら$I\otimes M=0$で明らかである。$a\ne0$なら$r\mapsto ra$は$R\cong I$を与え、$I\otimes M\cong M$である。$I\otimes M\to R\otimes M=M$はこの同一視で$m\mapsto am$となり、捩れがないので単射である。よって$M$は平坦である。
  strategy: Use multiplication by r in one direction and the ideal criterion for principal ideals in the other.
  sketch:
  - 'derive: Flatness preserves the injection r from R to R, so M is torsion-free.'
  - 'setup: For the converse, an ideal is I = (a).'
  - 'derive: I ⊗ M → M identifies with multiplication by a.'
  - 'apply_theorem: The ideal criterion gives flatness.'
  openmath: (forall (T M) (-> (and (is_pid T) (is_module T M)) (<-> (flat_module T M) (= (torsion_submodule T M) (zero_submodule M)))))
  hard_negative:
    statement: 整域上の捩れのない加群はつねに平坦である。
    reason: $R=k[x,y]$のイデアル$(x,y)$は捩れがないが平坦でない。$(x,y)\otimes(x,y)\to(x,y)$の核に$x\otimes y-y\otimes x\ne0$がある。
  target: |
    ∀ (R M : Type*) [CommRing R] [IsDomain R] [IsPrincipalIdealRing R] [AddCommGroup M] [Module R M], Module.Flat R M ↔ ∀ (r : R) (m : M), r ≠ 0 → r • m = 0 → m = 0
  proof: |
    by
      intro R M _ _ _ _ _
      rw [Module.Flat.flat_iff_torsion_eq_bot_of_isBezout]
      constructor
      · intro h r m hr hm
        have : m ∈ Submodule.torsion R M := ⟨⟨r, mem_nonZeroDivisors_of_ne_zero hr⟩, hm⟩
        rw [h] at this
        exact this
      · intro h
        rw [eq_bot_iff]
        intro m hm
        obtain ⟨⟨r, hr⟩, hrm⟩ := hm
        exact h r m (nonZeroDivisors.ne_zero hr) hrm
- id: hom_tensor_adjunction
  kind: textbook
  level: 3
  topic: 加群・Homとテンソルの随伴
  statement: 可換環$R$上の加群$M,N,P$について、線形同型$\mathrm{Hom}_R(M\otimes_RN,P)\cong\mathrm{Hom}_R(M,\mathrm{Hom}_R(N,P))$があり、$f$は$m\mapsto(n\mapsto f(m\otimes n))$に対応する。
  statement_en: For modules M, N, P over a commutative ring R there is a linear isomorphism Hom(M ⊗ N, P) ≅ Hom(M, Hom(N, P)) sending f to m ↦ (n ↦ f(m ⊗ n)).
  assumptions:
  - $R$は可換環
  - $M,N,P$は$R$加群
  quantifiers:
  - 任意の$M,N,P$
  conclusion: $e(f)(m)(n)=f(m\otimes n)$となる線形同型$e$がある。
  answer: |
    $R$を可換環、$M,N,P$を$R$加群とする。$f:M\otimes N\to P$に対し$e(f)(m)(n)=f(m\otimes n)$と定めると、テンソルの双線形性から$e(f)\in\mathrm{Hom}(M,\mathrm{Hom}(N,P))$であり、$e$は線形である。$e(f)=0$なら$f$は純テンソルで$0$となり、純テンソルが$M\otimes N$を生成するので$f=0$である。$h\in\mathrm{Hom}(M,\mathrm{Hom}(N,P))$に対し$(m,n)\mapsto h(m)(n)$は双線形なので、テンソル積の普遍性から$f(m\otimes n)=h(m)(n)$となる$f$がある。$e(f)=h$なので$e$は全射である。
  strategy: Identify both sides with bilinear maps through the universal property.
  sketch:
  - 'construct: Define e(f)(m)(n) = f(m ⊗ n).'
  - 'derive: Pure tensors generate, so e is injective.'
  - 'apply_theorem: The universal property turns h into f with f(m ⊗ n) = h(m)(n).'
  - 'conclude: e is a linear isomorphism.'
  openmath: (forall (T M V W) (-> (and (is_comm_ring T) (is_module T M) (is_module T V) (is_module T W)) (module_iso T (module_hom_space T (tensor_product_module T M V) W) (module_hom_space T M (module_hom_space T V W)))))
  hard_negative:
    statement: $\mathrm{Hom}(M\otimes N,P)\cong\mathrm{Hom}(M,P)\otimes\mathrm{Hom}(N,P)$である。
    reason: 体$k$上で$M=N=k$、$P=k^2$とすると、左辺の次元は$2$、右辺の次元は$2\cdot2=4$である。
  target: |
    ∀ (R M N P : Type*) [CommRing R] [AddCommGroup M] [AddCommGroup N] [AddCommGroup P] [Module R M] [Module R N] [Module R P], ∃ e : (TensorProduct R M N →ₗ[R] P) ≃ₗ[R] (M →ₗ[R] N →ₗ[R] P), ∀ (f : TensorProduct R M N →ₗ[R] P) (m : M) (n : N), e f m n = f (m ⊗ₜ[R] n)
  proof: |
    by
      intro R M N P _ _ _ _ _ _ _
      refine ⟨(TensorProduct.lift.equiv (.id R) M N P).symm, fun f m n => ?_⟩
      simp
- id: quotient_tensor_module_is_module_mod_ideal
  kind: gap
  level: 3
  topic: 加群・剰余環とのテンソル積
  statement: 可換環$R$のイデアル$I$と$R$加群$M$について、$(R/I)\otimes_RM\cong M/IM$である。
  statement_en: For an ideal I of a commutative ring R and an R-module M, (R/I) ⊗ M ≅ M/IM.
  assumptions:
  - $R$は可換環、$I$はイデアル
  - $M$は$R$加群
  quantifiers:
  - 任意の$I,M$
  conclusion: $(R/I)\otimes_RM\cong M/IM$である。
  answer: |
    $R$を可換環、$I$をイデアル、$M$を$R$加群とする。完全列$I\to R\to R/I\to0$に$-\otimes M$を施す。テンソル積は右完全なので$I\otimes M\to R\otimes M\to(R/I)\otimes M\to0$は完全である。$R\otimes M\cong M$、$r\otimes m\mapsto rm$により、左の写像の像は$IM$に対応する。よって$(R/I)\otimes M\cong M/IM$である。
  strategy: Tensor the presentation of R/I with M and use right exactness.
  sketch:
  - 'setup: Start from the exact sequence I → R → R/I → 0.'
  - 'apply_theorem: Right exactness of the tensor product applies.'
  - 'translate: Under R ⊗ M ≅ M the image of I ⊗ M is IM.'
  - 'conclude: Hence (R/I) ⊗ M ≅ M/IM.'
  openmath: (forall (T I M) (-> (and (is_comm_ring T) (ideal_of I T) (is_module T M)) (module_iso T (tensor_product_module T (quotient_ring T I) M) (quotient_module M (ideal_smul_submodule I M)))))
  hard_negative:
    statement: $I\otimes_RM\to M$はつねに単射である。
    reason: $R=\mathbb{Z}$、$I=2\mathbb{Z}$、$M=\mathbb{Z}/2$では$I\otimes M\cong\mathbb{Z}/2$から$M$への写像は$0$であり単射でない。
  target: |
    ∀ (R M : Type*) [CommRing R] [AddCommGroup M] [Module R M] (I : Ideal R), Nonempty (TensorProduct R (R ⧸ I) M ≃ₗ[R] M ⧸ (I • (⊤ : Submodule R M)))
  proof: |
    by
      intro R M _ _ _ I
      exact ⟨TensorProduct.quotTensorEquivQuotSMul M I⟩
- id: quotient_tensor_quotient_of_ideals
  kind: gap
  level: 3
  topic: 加群・剰余環どうしのテンソル積
  statement: 可換環$R$のイデアル$I,J$について、$(R/I)\otimes_R(R/J)\cong R/(I+J)$である。
  statement_en: For ideals I and J of a commutative ring R, (R/I) ⊗ (R/J) ≅ R/(I+J).
  assumptions:
  - $R$は可換環
  - $I,J$はイデアル
  quantifiers:
  - 任意の$I,J$
  conclusion: $(R/I)\otimes_R(R/J)\cong R/(I+J)$である。
  answer: |
    $R$を可換環、$I,J$をイデアルとする。$M=R/J$に対し$(R/I)\otimes M\cong M/IM$である。$IM$は$R/J$の中で$(I+J)/J$に等しい。第3同型定理より$(R/J)/((I+J)/J)\cong R/(I+J)$である。
  strategy: Apply the formula (R/I) ⊗ M ≅ M/IM with M = R/J.
  sketch:
  - 'apply_theorem: (R/I) ⊗ (R/J) ≅ (R/J)/I(R/J).'
  - 'derive: I(R/J) = (I+J)/J.'
  - 'apply_theorem: The third isomorphism theorem gives R/(I+J).'
  openmath: (forall (T I J) (-> (and (is_comm_ring T) (ideal_of I T) (ideal_of J T)) (module_iso T (tensor_product_module T (quotient_ring T I) (quotient_ring T J)) (quotient_ring T (ideal_sum I J)))))
  hard_negative:
    statement: $(R/I)\otimes_R(R/J)\cong R/(I\cap J)$である。
    reason: $R=\mathbb{Z}$、$I=2\mathbb{Z}$、$J=3\mathbb{Z}$では左辺は$0$であり、$\mathbb{Z}/6$ではない。
  target: |
    ∀ (R : Type*) [CommRing R] (I J : Ideal R), Nonempty (TensorProduct R (R ⧸ I) (R ⧸ J) ≃ₗ[R] R ⧸ (I ⊔ J))
  proof: |
    by
      intro R _ I J
      have h : I • (⊤ : Submodule R (R ⧸ J)) = Submodule.map J.mkQ I := by
        have h1 : (⊤ : Submodule R (R ⧸ J)) = Submodule.map J.mkQ ⊤ := by
          rw [Submodule.map_top, Submodule.range_mkQ]
        rw [h1, ← Submodule.map_smul'']
        simp
      refine ⟨(TensorProduct.quotTensorEquivQuotSMul (R ⧸ J) I).trans ((Submodule.quotEquivOfEq _ _ h).trans ((Submodule.quotientQuotientEquivQuotientSup J I).trans (Submodule.quotEquivOfEq _ _ (sup_comm J I))))⟩
- id: tensor_of_coprime_annihilators_vanishes
  kind: gap
  level: 3
  topic: 加群・テンソル積の消滅
  statement: 可換環$R$の互いに素な元$a,b$（$ua+vb=1$となる$u,v$がある）について、$aM=0$、$bN=0$をみたす加群$M,N$では$M\otimes_RN=0$である。
  statement_en: If a and b are coprime elements of a commutative ring R (ua + vb = 1 for some u, v) and modules M, N satisfy aM = 0 and bN = 0, then M ⊗ N = 0.
  assumptions:
  - $R$は可換環で$ua+vb=1$
  - $aM=0$、$bN=0$
  quantifiers:
  - 任意の$t\in M\otimes_RN$
  conclusion: $t=0$である。
  answer: |
    $R$を可換環、$ua+vb=1$、$aM=0$、$bN=0$とする。$m\in M,n\in N$について$m\otimes n=(ua+vb)(m\otimes n)=u(am\otimes n)+v(m\otimes bn)=0$である。純テンソルは$M\otimes_RN$を生成するので$M\otimes_RN=0$である。
  strategy: Multiply a pure tensor by 1 = ua + vb.
  sketch:
  - 'derive: m ⊗ n = u(am ⊗ n) + v(m ⊗ bn).'
  - 'derive: Both terms vanish by the annihilator conditions.'
  - 'conclude: Pure tensors generate, so the tensor product is 0.'
  openmath: (forall (T M V a b u v) (-> (and (is_comm_ring T) (is_module T M) (is_module T V) (in a T) (in b T) (in u T) (in v T) (= (+ (* u a) (* v b)) 1) (forall (m) (-> (in m M) (= (module_smul a m) (module_zero M)))) (forall (x) (-> (in x V) (= (module_smul b x) (module_zero V))))) (= (tensor_product_module T M V) zero_module)))
  hard_negative:
    statement: $M,N$が$0$でない捩れ加群なら$M\otimes_RN=0$である。
    reason: $\mathbb{Z}/2\otimes_{\mathbb{Z}}\mathbb{Z}/2\cong\mathbb{Z}/2\ne0$である。消滅には互いに素な零化元が必要である。
  target: |
    ∀ (R M N : Type*) [CommRing R] [AddCommGroup M] [AddCommGroup N] [Module R M] [Module R N] (a b : R), IsCoprime a b → (∀ m : M, a • m = 0) → (∀ n : N, b • n = 0) → ∀ t : TensorProduct R M N, t = 0
  proof: |
    by
      intro R M N _ _ _ _ _ a b hc ha hb t
      induction t using TensorProduct.induction_on with
      | zero => rfl
      | add x y hx hy => rw [hx, hy, add_zero]
      | tmul m n =>
        obtain ⟨u, v, huv⟩ := hc
        calc m ⊗ₜ[R] n = (u * a + v * b) • (m ⊗ₜ[R] n) := by rw [huv, one_smul]
          _ = u • (a • (m ⊗ₜ[R] n)) + v • (b • (m ⊗ₜ[R] n)) := by rw [add_smul, mul_smul, mul_smul]
          _ = 0 := by
            rw [TensorProduct.smul_tmul', ha m, TensorProduct.zero_tmul, ← TensorProduct.tmul_smul, hb n, TensorProduct.tmul_zero]
            simp
- id: tensor_of_torsion_and_divisible_vanishes
  kind: gap
  level: 3
  topic: 加群・テンソル積の消滅
  statement: 整域$R$上の捩れ加群$M$（各$m$に$rm=0$となる$r\ne0$がある）と可除加群$N$（$r\ne0$と$n$に$rn'=n$となる$n'$がある）について、$M\otimes_RN=0$である。
  statement_en: If M is a torsion module and N is a divisible module over a domain R, then M ⊗ N = 0.
  assumptions:
  - $R$は整域
  - $M$は捩れ加群
  - $N$は可除加群
  quantifiers:
  - 任意の$t\in M\otimes_RN$
  conclusion: $t=0$である。
  answer: |
    $R$を整域、$M$を捩れ加群、$N$を可除加群とする。$m\in M$、$n\in N$をとる。$rm=0$となる$r\ne0$があり、可除性から$n=rn'$となる$n'\in N$がある。$m\otimes n=m\otimes rn'=rm\otimes n'=0$である。純テンソルは$M\otimes_RN$を生成するので$M\otimes_RN=0$である。
  strategy: Move the annihilating scalar across the tensor sign.
  sketch:
  - 'setup: Choose r ≠ 0 with rm = 0 and n′ with n = rn′.'
  - 'derive: m ⊗ n = rm ⊗ n′ = 0.'
  - 'conclude: Pure tensors generate.'
  openmath: (forall (T M V) (-> (and (integral_domain T) (is_module T M) (is_module T V) (= (torsion_submodule T M) (whole_submodule M)) (divisible_module T V)) (= (tensor_product_module T M V) zero_module)))
  hard_negative:
    statement: 捩れ加群と捩れのない加群のテンソル積は$0$である。
    reason: $\mathbb{Z}/2\otimes_{\mathbb{Z}}\mathbb{Z}\cong\mathbb{Z}/2\ne0$である。$\mathbb{Z}$は捩れがないが可除でない。
  target: |
    ∀ (R M N : Type*) [CommRing R] [IsDomain R] [AddCommGroup M] [AddCommGroup N] [Module R M] [Module R N], (∀ m : M, ∃ r : R, r ≠ 0 ∧ r • m = 0) → (∀ (n : N) (r : R), r ≠ 0 → ∃ n' : N, r • n' = n) → ∀ t : TensorProduct R M N, t = 0
  proof: |
    by
      intro R M N _ _ _ _ _ _ hT hD t
      induction t using TensorProduct.induction_on with
      | zero => rfl
      | add x y hx hy => rw [hx, hy, add_zero]
      | tmul m n =>
        obtain ⟨r, hr, hm⟩ := hT m
        obtain ⟨n', rfl⟩ := hD n r hr
        rw [TensorProduct.tmul_smul, TensorProduct.smul_tmul', hm, TensorProduct.zero_tmul]
- id: submodule_of_free_over_pid_is_free
  kind: textbook
  level: 3
  topic: 加群・単項イデアル整域上の自由加群の部分加群
  statement: 単項イデアル整域$R$上で有限基底$(b_i)_{i\in\iota}$をもつ加群$M$の部分加群$N$は、$n\le|\iota|$なる$n$個の元からなる基底をもつ。
  statement_en: A submodule N of a module M with a finite basis indexed by ι over a principal ideal domain R has a basis with n ≤ |ι| elements.
  assumptions:
  - $R$は単項イデアル整域
  - $M$は有限基底$(b_i)_{i\in\iota}$をもつ
  - $N$は$M$の部分加群
  quantifiers:
  - 任意の$N$
  conclusion: $n\le|\iota|$個の元からなる$N$の基底がある。
  answer: |
    $R$を単項イデアル整域とし、$k=|\iota|$に関する帰納法で示す。$k=0$なら$N=0$である。$k>0$とする。$\pi:M\to R$を最後の座標への射影、$M'=\ker\pi$とする。$M'$は$k-1$個の元の基底をもち、$N'=N\cap M'$に帰納法の仮定を使うと$N'$は$k-1$個以下の元の基底をもつ。$\pi(N)$は$R$のイデアルなので$(a)$と書ける。$a=0$なら$N=N'$である。$a\ne0$なら$\pi(x)=a$となる$x\in N$をとる。$y\in N$について$\pi(y)=ra$と書くと$y-rx\in N'$なので$N=Rx+N'$である。$rx\in N'$なら$ra=0$より$r=0$なので和は直和で、$rx=0$なら$r=0$である。よって$N'$の基底に$x$を加えれば$N$の基底となり、個数は$k$以下である。
  strategy: Induct on the rank by projecting to the last coordinate and using that the image ideal is principal.
  sketch:
  - 'setup: Induct on k, with π the last coordinate and N′ = N ∩ ker π.'
  - 'derive: π(N) = (a) because R is a PID.'
  - 'case_split: If a = 0, then N = N′.'
  - 'construct: If a ≠ 0, choose x in N with π(x) = a; then N = Rx ⊕ N′.'
  - 'conclude: Adding x to a basis of N′ gives a basis of N.'
  openmath: (forall (T M k W) (-> (and (is_pid T) (is_module T M) (in k N) (free_module_with_rank T M k) (is_submodule W M)) (exists (n) (and (in n N) (<= n k) (free_module_with_rank T W n)))))
  hard_negative:
    statement: 任意の可換環で、自由加群の部分加群は自由である。
    reason: $R=\mathbb{Z}[x]$のイデアル$(2,x)$は$R$の部分加群だが、$2$元生成で単項でなく、自由加群ではない。
  target: |
    ∀ (R M ι : Type*) [CommRing R] [IsDomain R] [IsPrincipalIdealRing R] [AddCommGroup M] [Module R M] [Fintype ι] (b : Module.Basis ι R M) (N : Submodule R M), ∃ n : ℕ, n ≤ Fintype.card ι ∧ Nonempty (Module.Basis (Fin n) R N)
  proof: |
    by
      intro R M ι _ _ _ _ _ _ b N
      obtain ⟨n, ⟨bN⟩⟩ := N.nonempty_basis_of_pid b
      haveI : Module.Free R M := Module.Free.of_basis b
      haveI : Module.Finite R M := Module.Finite.of_basis b
      refine ⟨n, ?_, ⟨bN⟩⟩
      have h1 := Submodule.finrank_le N
      rw [Module.finrank_eq_card_basis bN, Module.finrank_eq_card_basis b] at h1
      simpa using h1
- id: finitely_generated_torsion_free_over_pid_is_free
  kind: textbook
  level: 3
  topic: 加群・単項イデアル整域上の捩れのない加群
  statement: 単項イデアル整域$R$上の有限生成加群$M$に捩れがなければ、$M$は自由加群である。
  statement_en: A finitely generated module M without torsion over a principal ideal domain R is free.
  assumptions:
  - $R$は単項イデアル整域
  - $M$は有限生成
  - $r\ne0$、$rm=0$なら$m=0$
  quantifiers:
  - 任意の$M$
  conclusion: $M$は自由加群である。
  answer: |
    $R$を単項イデアル整域、$M$を捩れのない有限生成加群とし、$s_1,\dots,s_k$を生成元とする。その中で$R$上線形独立な部分集合で極大なものを$x_1,\dots,x_d$とし、$F=\bigoplus_iRx_i$とおく。各$s_j$について極大性から$a_js_j\in F$となる$a_j\ne0$がある。$a=\prod_ja_j\ne0$とすると$aM\subseteq F$である。$m\mapsto am$は捩れがないので単射であり、$M\cong aM$である。$aM$は自由加群$F$の部分加群なので、単項イデアル整域上の部分加群の定理より自由である。よって$M$は自由である。
  strategy: Embed M in a free module by a common denominator.
  sketch:
  - 'setup: Choose a maximal independent subset of the generators and let F be its span.'
  - 'derive: There is a ≠ 0 with aM ⊆ F.'
  - 'derive: m ↦ am is injective because M is torsion-free.'
  - 'apply_theorem: Submodules of free modules over a PID are free.'
  openmath: (forall (T M) (-> (and (is_pid T) (finitely_generated_module T M) (= (torsion_submodule T M) (zero_submodule M))) (free_module T M)))
  hard_negative:
    statement: 単項イデアル整域上の捩れのない加群は有限生成でなくても自由である。
    reason: $\mathbb{Q}$は$\mathbb{Z}$上捩れがないが、任意の2元は線形従属で、$\mathbb{Q}\ne\mathbb{Z}x$なので自由でない。
  target: |
    ∀ (R M : Type*) [CommRing R] [IsDomain R] [IsPrincipalIdealRing R] [AddCommGroup M] [Module R M] [Module.Finite R M], (∀ (r : R) (m : M), r ≠ 0 → r • m = 0 → m = 0) → Module.Free R M
  proof: |
    by
      intro R M _ _ _ _ _ _ h
      have ht : Submodule.torsion R M = ⊥ := by
        rw [eq_bot_iff]
        intro m hm
        obtain ⟨⟨r, hr⟩, hrm⟩ := hm
        exact h r m (nonZeroDivisors.ne_zero hr) hrm
      haveI : Module.IsTorsionFree R M := Submodule.isTorsionFree_iff_torsion_eq_bot.2 ht
      exact Module.free_of_finite_type_torsion_free'
- id: finitely_generated_module_over_pid_splits_off_torsion
  kind: gap
  level: 3
  topic: 加群・捩れ部分の直和因子
  statement: 単項イデアル整域$R$上の有限生成加群$M$では、捩れ部分$T(M)$は直和因子であり、自由な部分加群$F$で$M=T(M)\oplus F$となるものがある。
  statement_en: For a finitely generated module M over a principal ideal domain R, the torsion submodule T(M) is a direct summand; there is a free submodule F with M = T(M) ⊕ F.
  assumptions:
  - $R$は単項イデアル整域
  - $M$は有限生成
  quantifiers:
  - 任意の$M$
  conclusion: $M=T(M)\oplus F$となる自由部分加群$F$がある。
  answer: |
    $R$を単項イデアル整域、$M$を有限生成加群、$T=T(M)$とする。$M/T$は有限生成で捩れがないので自由であり、とくに射影的である。全射$\pi:M\to M/T$には切断$s:M/T\to M$がある。$F=s(M/T)$とおくと、射影加群への全射の分裂より$M=\ker\pi\oplus F=T\oplus F$である。$s$は単射なので$F\cong M/T$は自由である。
  strategy: The torsion-free quotient is free, so the projection splits.
  sketch:
  - 'derive: M/T is finitely generated and torsion-free, hence free.'
  - 'apply_theorem: The surjection onto the projective M/T splits.'
  - 'conclude: M = T ⊕ s(M/T), with the second factor free.'
  openmath: (forall (T M) (-> (and (is_pid T) (finitely_generated_module T M)) (exists (F) (and (is_submodule F M) (free_module T F) (complementary_submodules (torsion_submodule T M) F M)))))
  hard_negative:
    statement: 単項イデアル整域上の任意の加群で捩れ部分は直和因子である。
    reason: $\prod_p\mathbb{Z}/p$の捩れ部分は直和因子でないことが知られている。有限生成の仮定は外せない。
  target: |
    ∀ (R M : Type*) [CommRing R] [IsDomain R] [IsPrincipalIdealRing R] [AddCommGroup M] [Module R M] [Module.Finite R M], ∃ F : Submodule R M, IsCompl (Submodule.torsion R M) F ∧ Module.Free R F
  proof: |
    by
      intro R M _ _ _ _ _ _
      let T := Submodule.torsion R M
      haveI : Module.Free R (M ⧸ T) := by
        haveI : Module.IsTorsionFree R (M ⧸ T) := inferInstance
        exact Module.free_of_finite_type_torsion_free'
      obtain ⟨s, hs⟩ := (T.mkQ).exists_rightInverse_of_surjective (Submodule.range_mkQ T)
      have hinj : Function.Injective s := fun a b h => by
        have := congrArg T.mkQ h
        simpa [← LinearMap.comp_apply, hs] using this
      refine ⟨LinearMap.range s, ?_, Module.Free.of_equiv (LinearEquiv.ofInjective s hinj)⟩
      constructor
      · rw [Submodule.disjoint_def]
        rintro x hx ⟨y, rfl⟩
        have h1 : y = T.mkQ (s y) := (LinearMap.congr_fun hs y).symm
        have h2 : T.mkQ (s y) = 0 := (Submodule.Quotient.mk_eq_zero T).2 hx
        rw [h1, h2, map_zero]
      · rw [codisjoint_iff, eq_top_iff]
        intro x _
        have e : x = (x - s (T.mkQ x)) + s (T.mkQ x) := by abel
        rw [e]
        refine Submodule.add_mem_sup ?_ ⟨_, rfl⟩
        rw [← Submodule.Quotient.mk_eq_zero T]
        have h1 : T.mkQ (s (T.mkQ x)) = T.mkQ x := LinearMap.congr_fun hs _
        change T.mkQ _ = 0
        rw [map_sub, h1, sub_self]
- id: coprime_torsion_decomposition
  kind: gap
  level: 3
  topic: 加群・互いに素な捩れの分解
  statement: 可換環$R$の互いに素な元$a,b$と加群$M$について、$abx=0$をみたす$x\in M$は$x=y+z$（$ay=0$、$bz=0$）とただ一通りに分解される。
  statement_en: For coprime elements a, b of a commutative ring R and a module M, every x in M with abx = 0 is uniquely x = y + z with ay = 0 and bz = 0.
  assumptions:
  - $R$は可換環、$M$は$R$加群
  - $ua+vb=1$となる$u,v$がある
  - $abx=0$
  quantifiers:
  - 任意の$x\in M$で$abx=0$をみたすもの
  conclusion: $x=y+z$、$ay=0$、$bz=0$となる$(y,z)$がただ1つある。
  answer: |
    $R$を可換環、$ua+vb=1$、$x\in M$は$abx=0$をみたすとする。$y=vbx$、$z=uax$とおくと$y+z=(ua+vb)x=x$、$ay=vabx=0$、$bz=uabx=0$である。一意性を示す。$x=y'+z'$、$ay'=0$、$bz'=0$とする。$y'=(ua+vb)y'=vby'=vb(y'+z')=vbx$であり、同様に$z'=uax$である。
  strategy: Use the Bézout identity to write the components explicitly.
  sketch:
  - 'construct: y = vbx and z = uax satisfy the conditions.'
  - 'derive: For any decomposition, y′ = vby′ = vbx.'
  - 'conclude: Similarly z′ = uax.'
  openmath: (forall (T M a b u v x) (-> (and (is_comm_ring T) (is_module T M) (= (+ (* u a) (* v b)) 1) (in x M) (= (module_smul (* a b) x) (module_zero M))) (exists (y z) (and (= (module_smul a y) (module_zero M)) (= (module_smul b z) (module_zero M)) (= x (+ y z)) (forall (s t) (-> (and (= (module_smul a s) (module_zero M)) (= (module_smul b t) (module_zero M)) (= x (+ s t))) (and (= s y) (= t z))))))))
  hard_negative:
    statement: $a,b$が互いに素でなくても同じ分解がある。
    reason: $R=M=\mathbb{Z}/4$、$a=b=2$、$x=1$では$abx=0$だが、$2y=0$なる$y$は$\{0,2\}$に入り、和$y+z$は$1$にならない。
  target: |
    ∀ (R M : Type*) [CommRing R] [AddCommGroup M] [Module R M] (a b : R), IsCoprime a b → ∀ x : M, (a * b) • x = 0 → ∃! p : M × M, a • p.1 = 0 ∧ b • p.2 = 0 ∧ p.1 + p.2 = x
  proof: |
    by
      intro R M _ _ _ a b hc x hx
      obtain ⟨u, v, huv⟩ := hc
      have hone : ∀ y : M, u • a • y + v • b • y = y := fun y => by
        rw [← mul_smul, ← mul_smul, ← add_smul, huv, one_smul]
      refine ⟨(v • b • x, u • a • x), ⟨?_, ?_, ?_⟩, ?_⟩
      · change a • v • b • x = 0
        rw [smul_comm a v, ← mul_smul a b, hx, smul_zero]
      · change b • u • a • x = 0
        rw [smul_comm b u, ← mul_smul b a, mul_comm b a, hx, smul_zero]
      · change v • b • x + u • a • x = x
        rw [add_comm, hone]
      · rintro ⟨y, z⟩ ⟨h1, h2, h3⟩
        change a • y = 0 at h1
        change b • z = 0 at h2
        change y + z = x at h3
        have ey : y = v • b • x := by
          rw [← h3, smul_add, smul_add, h2, smul_zero, add_zero]
          have := hone y
          rw [h1, smul_zero, zero_add] at this
          exact this.symm
        have ez : z = u • a • x := by
          rw [← h3, smul_add, smul_add, h1, smul_zero, zero_add]
          have := hone z
          rw [h2, smul_zero, add_zero] at this
          exact this.symm
        exact Prod.ext ey ez
- id: finitely_generated_abelian_group_structure
  kind: textbook
  level: 3
  topic: 加群・有限生成アーベル群の構造
  statement: 有限生成アーベル群$G$は、自然数$n$、素数$p_i$、自然数$e_i$により$G\cong\mathbb{Z}^n\oplus\bigoplus_i\mathbb{Z}/p_i^{e_i}$と書ける。有限アーベル群の構造定理を有限生成の場合へ一般化した形である。
  statement_en: A finitely generated abelian group G is isomorphic to Z^n ⊕ ⊕_i Z/p_i^(e_i) for a natural number n, primes p_i and natural numbers e_i. This generalizes the structure theorem for finite abelian groups to the finitely generated case.
  assumptions:
  - $G$は有限生成アーベル群
  quantifiers:
  - 任意の有限生成アーベル群$G$
  conclusion: $G\cong\mathbb{Z}^n\oplus\bigoplus_i\mathbb{Z}/p_i^{e_i}$となる$n,p_i,e_i$がある。
  answer: |
    $G$を有限生成アーベル群とし、$\mathbb{Z}$加群と見る。$T$を$G$の捩れ部分とする。$G/T$は有限生成で捩れがないので、単項イデアル整域上の有限生成で捩れのない加群の定理より自由であり、ある自然数$n$で$G/T\cong\mathbb{Z}^n$である。自由加群は射影的なので全射$G\to G/T$は分裂し、$G\cong\mathbb{Z}^n\oplus T$である。$T$はこの直和の射影の像として有限生成であり、生成元はどれも有限位数なので、$T$は有限群である。有限アーベル群の構造定理より$T\cong\bigoplus_i\mathbb{Z}/p_i^{e_i}$（$p_i$は素数）である。よって$G\cong\mathbb{Z}^n\oplus\bigoplus_i\mathbb{Z}/p_i^{e_i}$である。
  strategy: Split off the torsion subgroup, which is finite, and apply the structure theorem for finite abelian groups.
  sketch:
  - 'translate: G/T is a finitely generated torsion-free Z-module, so it is free of some rank n.'
  - 'derive: The surjection onto the free module G/T splits, so G ≅ Z^n ⊕ T.'
  - 'derive: T is finitely generated and torsion, so it is finite.'
  - 'apply_theorem: The structure theorem for finite abelian groups decomposes T.'
  openmath: (forall (G) (-> (and (abelian_group G) (finitely_generated_group G)) (exists (n S p e) (and (in n N) (finite_set S) (forall (i) (-> (in i S) (in (fn_value p i) P))) (group_isomorphic G (direct_product (free_rank_module Z n) (prime_power_cyclic_sum p e)))))))
  hard_negative:
    statement: すべてのアーベル群は$\mathbb{Z}^n\oplus\bigoplus_i\mathbb{Z}/p_i^{e_i}$の形である。
    reason: $\mathbb{Q}$は有限生成でなく、捩れがなく、この形の群と同型でない。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [AddGroup.FG G], ∃ (n : ℕ) (ι : Type) (_ : Fintype ι) (p : ι → ℕ) (_ : ∀ i, (p i).Prime) (e : ι → ℕ), Nonempty (G ≃+ (Fin n →₀ ℤ) × DirectSum ι (fun i => ZMod (p i ^ e i)))
  proof: |
    by
      intro G _ _
      exact AddCommGroup.equiv_free_prod_directSum_zmod G
- id: stacked_bases_for_submodule_over_pid
  kind: gap
  level: 3
  topic: 加群・積み重ね基底
  statement: 単項イデアル整域$R$上で有限基底をもつ加群$M$の部分加群$N\le O$に対し、$O$の基底$(e_1,\dots,e_o)$、$N$の基底$(f_1,\dots,f_n)$（$n\le o$）と$a_i\in R$で、$f_i=a_ie_i$となるものがある。$a_i$の整除関係までは主張しない。
  statement_en: For submodules N ≤ O of a module with a finite basis over a principal ideal domain R, there are a basis (e_1,...,e_o) of O, a basis (f_1,...,f_n) of N with n ≤ o, and a_i in R with f_i = a_i e_i. Divisibility among the a_i is not claimed.
  assumptions:
  - $R$は単項イデアル整域
  - $M$は有限基底をもつ
  - $N\le O\le M$は部分加群
  quantifiers:
  - 任意の$N,O$
  conclusion: $f_i=a_ie_i$となる$O$の基底$(e_i)$と$N$の基底$(f_i)$がある。
  answer: |
    $R$を単項イデアル整域とする。部分加群の定理より$O$は有限階数の自由加群なので、$O$の階数$o$に関する帰納法で示す。$N=0$なら$n=0$でよい。$N\ne0$とする。線形写像$\varphi:O\to R$全体を動かすとイデアル$\varphi(N)$の族が得られ、$R$はネーター環なので極大元$\varphi_0(N)=(a)$がある。基底の座標を考えれば$a\ne0$である。$y\in N$を$\varphi_0(y)=a$となるようにとる。任意の$\psi:O\to R$について$a\mid\psi(y)$を示す。$d$を$a,\psi(y)$の最大公約元、$d=ua+v\psi(y)$とすると、$u\varphi_0+v\psi$の像は$(d)\supseteq(a)$を含むので、極大性から$(d)=(a)$である。$\psi$として座標をとれば$y=ax$（$x\in O$）と書け、$a\varphi_0(x)=a$より$\varphi_0(x)=1$である。よって$O=Rx\oplus\ker\varphi_0$である。また$z\in N$について$\varphi_0(z)\in(a)$なので$\varphi_0(z)=ra$と書くと$z-ry\in N\cap\ker\varphi_0$であり、$N=Ry\oplus(N\cap\ker\varphi_0)$である。$\ker\varphi_0$の階数は$o-1$なので、$N\cap\ker\varphi_0\le\ker\varphi_0$に帰納法の仮定を使い、$x,y$を先頭に加えれば主張を得る。
  strategy: Choose a functional maximizing the image ideal of N and split off one basis vector.
  sketch:
  - 'setup: Induct on the rank of O; choose φ_0 with φ_0(N) = (a) maximal.'
  - 'derive: For every functional ψ and y in N with φ_0(y) = a, a divides ψ(y).'
  - 'construct: Write y = ax, so φ_0(x) = 1 and O = Rx ⊕ ker φ_0.'
  - 'derive: N = Ry ⊕ (N ∩ ker φ_0).'
  - 'induction: Apply the hypothesis to ker φ_0 and adjoin x, y.'
  openmath: (forall (T M k W O) (-> (and (is_pid T) (is_module T M) (in k N) (free_module_with_rank T M k) (is_submodule W O) (is_submodule O M)) (exists (e f g) (stacked_bases e f g O W))))
  hard_negative:
    statement: $O$の任意の基底$(e_i)$について$f_i=a_ie_i$となる$N$の基底がある。
    reason: $O=\mathbb{Z}^2$、$N=\mathbb{Z}(1,1)$で標準基底をとると、$N$の基底$\pm(1,1)$はどの$e_i$の倍数でもない。
  target: |
    ∀ (R M ι : Type*) [CommRing R] [IsDomain R] [IsPrincipalIdealRing R] [AddCommGroup M] [Module R M] [Finite ι] (b : Module.Basis ι R M) (N O : Submodule R M), N ≤ O → ∃ (n o : ℕ) (hno : n ≤ o) (bO : Module.Basis (Fin o) R O) (bN : Module.Basis (Fin n) R N) (a : Fin n → R), ∀ i, (bN i : M) = a i • (bO (Fin.castLE hno i) : M)
  proof: |
    by
      intro R M ι _ _ _ _ _ _ b N O h
      obtain ⟨n, o, hno, bO, bN, a, hh⟩ := N.exists_smith_normal_form_of_le b O h
      exact ⟨n, o, hno, bO, bN, a, hh⟩
- id: hom_from_torsion_to_torsion_free_is_zero
  kind: gap
  level: 3
  topic: 加群・捩れと捩れのなさ
  statement: 整域$R$上の捩れ加群$M$から捩れのない加群$N$への線形写像は$0$である。
  statement_en: A linear map from a torsion module to a torsion-free module over a domain R is zero.
  assumptions:
  - $R$は整域
  - $M$は捩れ加群
  - $N$は捩れのない加群
  quantifiers:
  - 任意の線形写像$f:M\to N$
  conclusion: $f=0$である。
  answer: |
    $R$を整域、$M$を捩れ加群、$N$を捩れのない加群、$f:M\to N$を線形写像とする。$m\in M$について$rm=0$となる$r\ne0$がある。$rf(m)=f(rm)=0$であり、$N$は捩れがないので$f(m)=0$である。
  strategy: The annihilator of m also annihilates f(m).
  sketch:
  - 'setup: Choose r ≠ 0 with rm = 0.'
  - 'derive: rf(m) = f(rm) = 0.'
  - 'conclude: Torsion-freeness gives f(m) = 0.'
  openmath: (forall (T M V f) (-> (and (integral_domain T) (= (torsion_submodule T M) (whole_submodule M)) (= (torsion_submodule T V) (zero_submodule V)) (module_hom f T M V)) (= f (zero_map M V))))
  hard_negative:
    statement: 捩れのない加群から捩れ加群への線形写像も$0$である。
    reason: $\mathbb{Z}\to\mathbb{Z}/2$の還元は$0$でない。
  target: |
    ∀ (R M N : Type*) [CommRing R] [IsDomain R] [AddCommGroup M] [AddCommGroup N] [Module R M] [Module R N] (f : M →ₗ[R] N), (∀ m : M, ∃ r : R, r ≠ 0 ∧ r • m = 0) → (∀ (r : R) (n : N), r ≠ 0 → r • n = 0 → n = 0) → f = 0
  proof: |
    by
      intro R M N _ _ _ _ _ _ f hT hF
      ext m
      obtain ⟨r, hr, hm⟩ := hT m
      exact hF r (f m) hr (by rw [← map_smul, hm, map_zero])
- id: simple_module_iff_quotient_by_maximal_ideal
  kind: textbook
  level: 3
  topic: 加群・単純加群の特徴づけ
  statement: 環$R$上の加群$M$が単純であることと、$R$の極大左イデアル$I$により$M\cong R/I$となることは同値である。
  statement_en: A module M over a ring R is simple if and only if M ≅ R/I for a maximal left ideal I of R.
  assumptions:
  - $R$は環
  - $M$は$R$加群
  quantifiers:
  - 任意の$M$
  conclusion: $M$が単純$\iff M\cong R/I$となる極大左イデアル$I$がある。
  answer: |
    $R$を環、$M$を$R$加群とする。$M$が単純なら、$x\ne0$をとると$Rx$は$0$でない部分加群なので$Rx=M$である。$r\mapsto rx$は全射$R\to M$で、核を$I$とすると$M\cong R/I$である。対応定理より$I$を含む左イデアルは$M$の部分加群に対応するから、$M$が単純であることは$I$が極大であることと同値である。逆に$I$が極大なら、同じ対応から$R/I$の部分加群は$0$と全体だけで、$I\ne R$より$R/I\ne0$なので単純である。
  strategy: Use the map r ↦ rx and the correspondence theorem.
  sketch:
  - 'construct: For x ≠ 0, r ↦ rx is a surjection from R onto M with kernel I.'
  - 'apply_theorem: The correspondence theorem matches submodules of R/I with left ideals containing I.'
  - 'conclude: M is simple exactly when I is maximal.'
  openmath: (forall (T M) (-> (and (is_ring T) (is_module T M)) (<-> (simple_module T M) (exists (I) (and (maximal_left_ideal I T) (module_iso T M (quotient_module T I)))))))
  hard_negative:
    statement: 環の極大左イデアルは1つなので、単純加群は同型を除いて1つである。
    reason: $\mathbb{Z}$では$\mathbb{Z}/2$と$\mathbb{Z}/3$がともに単純で同型でない。
  target: |
    ∀ (R M : Type*) [Ring R] [AddCommGroup M] [Module R M], IsSimpleModule R M ↔ ∃ I : Ideal R, I.IsMaximal ∧ Nonempty (M ≃ₗ[R] R ⧸ I)
  proof: |
    by
      intro R M _ _ _
      exact isSimpleModule_iff_quot_maximal
- id: quotient_module_simple_iff_submodule_maximal
  kind: gap
  level: 3
  topic: 加群・単純な商
  statement: 環$R$上の加群$M$の部分加群$N$について、$M/N$が単純であることと、$N$が$M$の極大部分加群であることは同値である。
  statement_en: For a submodule N of a module M over a ring R, the quotient M/N is simple if and only if N is a maximal submodule of M.
  assumptions:
  - $N$は環$R$上の加群$M$の部分加群
  quantifiers:
  - 任意の$M,N$
  conclusion: $M/N$が単純$\iff N$は極大部分加群である。
  answer: |
    $R$を環、$N$を$M$の部分加群とする。対応定理より、$M/N$の部分加群と$N$を含む$M$の部分加群は包含を保って1対1に対応し、$0$は$N$に、$M/N$は$M$に対応する。$M/N\ne0$は$N\ne M$と同値である。よって$M/N$の部分加群が$0$と全体だけであることは、$N$が$M$と異なり$N$と$M$の間に部分加群がないことと同値である。
  strategy: Apply the correspondence theorem.
  sketch:
  - 'apply_theorem: Submodules of M/N correspond to submodules between N and M.'
  - 'translate: 0 corresponds to N and M/N to M.'
  - 'conclude: Simplicity of M/N is maximality of N.'
  openmath: (forall (T M W) (-> (and (is_ring T) (is_module T M) (is_submodule W M)) (<-> (simple_module T (quotient_module M W)) (maximal_submodule W M))))
  hard_negative:
    statement: 任意の$0$でない加群は極大部分加群をもつ。
    reason: $\mathbb{Q}$は$\mathbb{Z}$加群として極大部分加群をもたない。$\mathbb{Q}/N$が単純なら$\mathbb{Z}/p$に同型だが、可除な$\mathbb{Q}$の商は可除である。
  target: |
    ∀ (R M : Type*) [Ring R] [AddCommGroup M] [Module R M] (N : Submodule R M), IsSimpleModule R (M ⧸ N) ↔ IsCoatom N
  proof: |
    by
      intro R M _ _ _ N
      exact isSimpleModule_iff_isCoatom
- id: semisimple_closed_under_submodule_and_quotient
  kind: gap
  level: 3
  topic: 加群・半単純性の閉性
  statement: 環$R$上の半単純加群$M$（任意の部分加群が補部分加群をもつ）の部分加群と商加群は半単純である。
  statement_en: Submodules and quotient modules of a semisimple module M over a ring R (every submodule has a complement) are semisimple.
  assumptions:
  - $M$は環$R$上の半単純加群
  - $N$は$M$の部分加群
  quantifiers:
  - 任意の部分加群$N$
  conclusion: $N$と$M/N$は半単純である。
  answer: |
    $R$を環、$M$を半単純加群、$N$を部分加群とする。$N'\le N$をとる。$M=N'\oplus C$となる$C$がある。モジュラー律より$N=N'+(C\cap N)$であり、$N'\cap(C\cap N)=0$なので$C\cap N$は$N$での補部分加群である。よって$N$は半単純である。$M=N\oplus C_0$とすると$M/N\cong C_0$であり、$C_0$は$M$の部分加群なので半単純である。
  strategy: Intersect a complement with N, and identify the quotient with a complement.
  sketch:
  - 'derive: For N′ ≤ N with M = N′ ⊕ C, the modular law gives N = N′ ⊕ (C ∩ N).'
  - 'derive: With M = N ⊕ C_0 one has M/N ≅ C_0.'
  - 'conclude: Both are semisimple.'
  openmath: (forall (T M W) (-> (and (is_ring T) (semisimple_module T M) (is_submodule W M)) (and (semisimple_module T W) (semisimple_module T (quotient_module M W)))))
  hard_negative:
    statement: 半単純加群の拡大は半単純である。
    reason: $0\to\mathbb{Z}/2\to\mathbb{Z}/4\to\mathbb{Z}/2\to0$の両端は単純だが、$\mathbb{Z}/4$の部分加群$2\mathbb{Z}/4$には補部分加群がない。
  target: |
    ∀ (R M : Type*) [Ring R] [AddCommGroup M] [Module R M] [IsSemisimpleModule R M] (N : Submodule R M), IsSemisimpleModule R N ∧ IsSemisimpleModule R (M ⧸ N)
  proof: |
    by
      intro R M _ _ _ _ N
      exact ⟨inferInstance, inferInstance⟩
- id: semisimple_module_is_independent_sum_of_simples
  kind: textbook
  level: 3
  topic: 加群・単純加群の直和
  statement: 環$R$上の半単純加群$M$は単純部分加群の直和である。すなわち単純部分加群の独立な族で和が$M$になるものがある。
  statement_en: A semisimple module M over a ring R is a direct sum of simple submodules; there is an independent family of simple submodules whose sum is M.
  assumptions:
  - $M$は環$R$上の半単純加群
  quantifiers:
  - 任意の$M$
  conclusion: 単純部分加群の独立な族で和が$M$となるものがある。
  answer: |
    $R$を環、$M$を半単純加群とする。半単純加群は単純部分加群の和である。単純部分加群からなる独立な部分族全体を包含で順序づけると、全順序部分集合の和集合はまた独立である（独立性は有限個の和で判定される）から、ツォルンの補題より極大な族$\mathcal S$がある。$M'=\sum\mathcal S$とする。単純部分加群$S$が$M'$に含まれないなら、$S\cap M'$は$S$の真部分加群なので$0$であり、$\mathcal S\cup\{S\}$は独立となって極大性に反する。よってすべての単純部分加群は$M'$に含まれ、$M'=M$である。
  strategy: Take a maximal independent family of simple submodules by Zorn.
  sketch:
  - 'apply_theorem: M is the sum of its simple submodules.'
  - 'apply_theorem: Zorn gives a maximal independent family S.'
  - 'derive: A simple submodule outside ΣS meets it in 0, contradicting maximality.'
  - 'conclude: ΣS = M.'
  openmath: (forall (T M) (-> (and (is_ring T) (semisimple_module T M)) (exists (A) (and (submodule_family A M) (independent_submodule_family A) (= (submodule_family_sum A) (whole_submodule M)) (forall (S) (-> (in S A) (simple_module T S)))))))
  hard_negative:
    statement: 単純部分加群の直和への分解は部分加群の集合として一意である。
    reason: $k^2$では$k(1,0)\oplus k(0,1)$と$k(1,0)\oplus k(1,1)$は異なる分解である。
  target: |
    ∀ (R M : Type*) [Ring R] [AddCommGroup M] [Module R M] [IsSemisimpleModule R M], ∃ s : Set (Submodule R M), sSupIndep s ∧ sSup s = ⊤ ∧ ∀ m ∈ s, IsSimpleModule R m
  proof: |
    by
      intro R M _ _ _ _
      exact IsSemisimpleModule.exists_sSupIndep_sSup_simples_eq_top R M
- id: semisimple_module_finiteness_equivalences
  kind: gap
  level: 3
  topic: 加群・半単純加群の有限性
  statement: 環$R$上の半単純加群$M$について、有限生成、ネーター、アルティンの3条件は同値である。
  statement_en: For a semisimple module M over a ring R, being finitely generated, Noetherian and Artinian are equivalent.
  assumptions:
  - $M$は環$R$上の半単純加群
  quantifiers:
  - 任意の$M$
  conclusion: $M$が有限生成$\iff$ネーター$\iff$アルティンである。
  answer: |
    $R$を環、$M$を半単純加群とし、$M=\bigoplus_{i\in J}S_i$を単純加群の直和とする。$J$が有限であることと各条件の同値を示す。$M$が有限生成なら、生成元は有限個の$S_i$の和に入るので$J$は有限である。$J$が無限なら、異なる$i_1,i_2,\dots$をとると$\bigoplus_{k\le n}S_{i_k}$は真の増大列、$\bigoplus_{k>n}S_{i_k}$は真の減少列なので、$M$はネーターでもアルティンでもない。$J$が有限なら、単純加群はネーターかつアルティンであり、これらの性質は拡大で閉じるので$M$はネーターかつアルティンであり、有限生成でもある。ネーター加群は有限生成である。以上で3条件はいずれも$J$の有限性と同値である。
  strategy: Show each condition is equivalent to the index set of a simple decomposition being finite.
  sketch:
  - 'setup: Write M as a direct sum of simple modules over an index set J.'
  - 'derive: Finite generation forces J to be finite.'
  - 'derive: Infinite J gives strictly increasing and decreasing chains.'
  - 'derive: Finite J gives both chain conditions by closure under extensions.'
  - 'conclude: All conditions are equivalent to the finiteness of J.'
  openmath: (forall (T M) (-> (and (is_ring T) (semisimple_module T M)) (and (<-> (finitely_generated_module T M) (noetherian_module T M)) (<-> (noetherian_module T M) (artinian_module T M)))))
  hard_negative:
    statement: 半単純でない加群でもネーターとアルティンは同値である。
    reason: $\mathbb{Z}$は$\mathbb{Z}$上ネーターだが、$2^n\mathbb{Z}$が無限に下るのでアルティンでない。
  target: |
    ∀ (R M : Type*) [Ring R] [AddCommGroup M] [Module R M] [IsSemisimpleModule R M], (Module.Finite R M ↔ IsNoetherian R M) ∧ (IsNoetherian R M ↔ IsArtinian R M)
  proof: |
    by
      intro R M _ _ _ _
      have h := IsSemisimpleModule.finite_tfae (R := R) (M := M)
      exact ⟨h.out 0 1, h.out 1 2⟩
- id: modules_over_semisimple_ring_projective_and_injective
  kind: gap
  level: 3
  topic: 加群・半単純環上の加群
  statement: 半単純環$R$（$R$自身が左$R$加群として半単純）上の任意の加群は射影的かつ入射的である。
  statement_en: Every module over a semisimple ring R (R is semisimple as a left module over itself) is both projective and injective.
  assumptions:
  - $R$は半単純環
  - $M$は$R$加群
  quantifiers:
  - 任意の$M$
  conclusion: $M$は射影的かつ入射的である。
  answer: |
    $R$を半単純環とする。任意の$R$加群$X$は自由加群の商であり、自由加群は半単純な$R$の直和なので単純加群の和である。その商$X$も単純加群の和なので半単純である。$M$を$R$加群とする。全射$g:X\to Y$と$h:M\to Y$に対し、$X=\ker g\oplus C$とすると$g|_C:C\to Y$は同型で、$(g|_C)^{-1}\circ h$が$h$の持ち上げである。よって$M$は射影的である。単射$i:X\to Y$と$f:X\to M$に対し、$Y=i(X)\oplus C$とする。$i(X)$上で$f\circ i^{-1}$、$C$上で$0$とすれば$f$の延長が得られる。よって$M$は入射的である。
  strategy: All modules are semisimple, so the relevant maps split.
  sketch:
  - 'derive: Every module is a quotient of a direct sum of copies of R, hence semisimple.'
  - 'construct: For a surjection g, a complement of ker g gives a section.'
  - 'construct: For an injection i, a complement of i(X) gives an extension.'
  - 'conclude: M is projective and injective.'
  openmath: (forall (T M) (-> (and (is_ring T) (semisimple_module T T) (is_module T M)) (and (projective_module T M) (injective_module T M))))
  hard_negative:
    statement: 体でない可換環上でも、すべての加群は射影的である。
    reason: $\mathbb{Z}/2$は$\mathbb{Z}$上射影的でない。$\mathbb{Z}\to\mathbb{Z}/2$が分裂しないからである。
  target: |
    ∀ (R M : Type*) [Ring R] [IsSemisimpleRing R] [AddCommGroup M] [Module R M], Module.Projective R M ∧ Module.Injective R M
  proof: |
    by
      intro R M _ _ _ _
      exact ⟨Module.projective_of_isSemisimpleRing R M, Module.injective_of_isSemisimpleRing R M⟩
- id: noetherian_module_closed_under_submodule_and_quotient
  kind: gap
  level: 3
  topic: 加群・ネーター性の閉性
  statement: 環$R$上のネーター加群$M$の部分加群$N$と商加群$M/N$はネーター加群である。
  statement_en: A submodule N and the quotient M/N of a Noetherian module M over a ring R are Noetherian.
  assumptions:
  - $M$は環$R$上のネーター加群
  - $N$は$M$の部分加群
  quantifiers:
  - 任意の$N$
  conclusion: $N$と$M/N$はネーター加群である。
  answer: |
    $R$を環、$M$をネーター加群、$N$を部分加群とする。$N$の部分加群の増大列は$M$の部分加群の増大列なので停留する。$\pi:M\to M/N$を射影とする。$M/N$の部分加群の増大列$(U_i)$に対し$\pi^{-1}(U_i)$は$M$の増大列なので停留し、$U_i=\pi(\pi^{-1}(U_i))$より$(U_i)$も停留する。
  strategy: Transport ascending chains to M.
  sketch:
  - 'derive: Chains in N are chains in M.'
  - 'derive: Chains in M/N pull back to chains in M.'
  - 'conclude: U_i = π(π⁻¹(U_i)) gives stabilization.'
  openmath: (forall (T M W) (-> (and (is_ring T) (noetherian_module T M) (is_submodule W M)) (and (noetherian_module T W) (noetherian_module T (quotient_module M W)))))
  hard_negative:
    statement: ネーター加群の部分加群は有限生成とは限らない。
    reason: ネーター加群の定義の1つが「すべての部分加群が有限生成」であり、増大列条件と同値である。無限個の元で生成されていても有限生成で、$\mathbb{Z}$の部分加群$\sum_{n\ge1}2n\mathbb{Z}=2\mathbb{Z}$がその例である。
  target: |
    ∀ (R M : Type*) [Ring R] [AddCommGroup M] [Module R M] [IsNoetherian R M] (N : Submodule R M), IsNoetherian R N ∧ IsNoetherian R (M ⧸ N)
  proof: |
    by
      intro R M _ _ _ _ N
      exact ⟨inferInstance, inferInstance⟩
- id: artinian_module_closed_under_submodule_and_quotient
  kind: gap
  level: 3
  topic: 加群・アルティン性の閉性
  statement: 環$R$上のアルティン加群$M$の部分加群$N$と商加群$M/N$はアルティン加群である。
  statement_en: A submodule N and the quotient M/N of an Artinian module M over a ring R are Artinian.
  assumptions:
  - $M$は環$R$上のアルティン加群
  - $N$は$M$の部分加群
  quantifiers:
  - 任意の$N$
  conclusion: $N$と$M/N$はアルティン加群である。
  answer: |
    $R$を環、$M$をアルティン加群、$N$を部分加群とする。$N$の部分加群の減少列は$M$の部分加群の減少列なので停留する。$\pi:M\to M/N$を射影とする。$M/N$の部分加群の減少列$(U_i)$に対し$\pi^{-1}(U_i)$は$M$の減少列なので停留し、$U_i=\pi(\pi^{-1}(U_i))$より$(U_i)$も停留する。
  strategy: Transport descending chains to M.
  sketch:
  - 'derive: Chains in N are chains in M.'
  - 'derive: Chains in M/N pull back to chains in M.'
  - 'conclude: U_i = π(π⁻¹(U_i)) gives stabilization.'
  openmath: (forall (T M W) (-> (and (is_ring T) (artinian_module T M) (is_submodule W M)) (and (artinian_module T W) (artinian_module T (quotient_module M W)))))
  hard_negative:
    statement: アルティン加群はつねに有限生成である。
    reason: プリューファー群$\mathbb{Z}[1/p]/\mathbb{Z}$は$\mathbb{Z}$上アルティンだが有限生成でない。
  target: |
    ∀ (R M : Type*) [Ring R] [AddCommGroup M] [Module R M] [IsArtinian R M] (N : Submodule R M), IsArtinian R N ∧ IsArtinian R (M ⧸ N)
  proof: |
    by
      intro R M _ _ _ _ N
      exact ⟨inferInstance, inferInstance⟩
- id: artinian_extension
  kind: gap
  level: 3
  topic: 加群・アルティン性の拡大
  statement: 環$R$上の加群の列$M\xrightarrow{f}N\xrightarrow{g}P$が$N$で完全で、$M,P$がアルティン加群なら、$N$もアルティン加群である。
  statement_en: If M → N → P is exact at N for modules over a ring R, and M and P are Artinian, then N is Artinian.
  assumptions:
  - $M\xrightarrow{f}N\xrightarrow{g}P$は$N$で完全
  - $M,P$はアルティン加群
  quantifiers:
  - 任意の$M,N,P,f,g$
  conclusion: $N$はアルティン加群である。
  answer: |
    $R$を環、$f,g$を上のとおりとする。まず$A\le B\le N$で$f^{-1}(A)=f^{-1}(B)$、$g(A)=g(B)$なら$A=B$を示す。$x\in B$に対し$g(x)=g(a)$となる$a\in A$があり、$x-a\in\ker g=\mathrm{im}\,f$なので$x-a=f(y)$と書ける。$f(y)\in B$より$y\in f^{-1}(B)=f^{-1}(A)$であり、$f(y)\in A$なので$x\in A$である。$N$の部分加群の減少列$(N_i)$をとる。$(f^{-1}(N_i))$は$M$の、$(g(N_i))$は$P$の減少列なので、ある番号以降どちらも一定である。前半より$N_i$もそこから一定である。
  strategy: Control a chain in N by its preimage in M and image in P.
  sketch:
  - 'derive: A ≤ B with the same preimage and the same image must be equal.'
  - 'setup: Take a descending chain (N_i).'
  - 'derive: Its preimages in M and images in P stabilize.'
  - 'conclude: The chain (N_i) stabilizes.'
  openmath: (forall (T M V W f g) (-> (and (is_ring T) (module_hom f T M V) (module_hom g T V W) (exact_pair f g) (artinian_module T M) (artinian_module T W)) (artinian_module T V)))
  hard_negative:
    statement: $M\to N\to P$で$N$がアルティンなら、$M$もアルティンである。
    reason: $\mathbb{Z}\to0\to0$では$N=0$はアルティンだが、$\mathbb{Z}$はアルティンでない。$f$の単射性がなければ部分加群に帰着しない。
  target: |
    ∀ (R M N P : Type*) [Ring R] [AddCommGroup M] [AddCommGroup N] [AddCommGroup P] [Module R M] [Module R N] [Module R P] (f : M →ₗ[R] N) (g : N →ₗ[R] P), Function.Exact f g → IsArtinian R M → IsArtinian R P → IsArtinian R N
  proof: |
    by
      intro R M N P _ _ _ _ _ _ _ f g h _ _
      exact isArtinian_of_range_eq_ker f g h.linearMap_ker_eq.symm
- id: finitely_generated_over_noetherian_ring_is_noetherian
  kind: gap
  level: 3
  topic: 加群・ネーター環上の有限生成加群
  statement: 左ネーター環$R$上の有限生成加群はネーター加群である。
  statement_en: A finitely generated module over a left Noetherian ring R is a Noetherian module.
  assumptions:
  - $R$は左ネーター環
  - $M$は有限生成$R$加群
  quantifiers:
  - 任意の$M$
  conclusion: $M$はネーター加群である。
  answer: |
    $R$を左ネーター環、$M$を$n$元で生成される加群とする。$R$は$R$加群としてネーターである。ネーター性は完全列の拡大で閉じるので、$R^k$から$R^{k+1}$への帰納法により$R^n$はネーターである。全射$R^n\to M$があり、$M$は$R^n$の商なのでネーターである。
  strategy: R^n is Noetherian by extensions, and M is a quotient of R^n.
  sketch:
  - 'induction: R^n is Noetherian by closure under extensions.'
  - 'construct: Generators give a surjection from R^n onto M.'
  - 'conclude: Quotients of Noetherian modules are Noetherian.'
  openmath: (forall (T M) (-> (and (is_ring T) (noetherian_module T T) (finitely_generated_module T M)) (noetherian_module T M)))
  hard_negative:
    statement: ネーター環上の加群はすべてネーター加群である。
    reason: $\mathbb{Z}^{(\mathbb{N})}$は$\mathbb{Z}$上有限生成でなく、ネーター加群でない。
  target: |
    ∀ (R M : Type*) [Ring R] [IsNoetherianRing R] [AddCommGroup M] [Module R M] [Module.Finite R M], IsNoetherian R M
  proof: |
    by
      intro R M _ _ _ _ _
      exact isNoetherian_of_isNoetherianRing_of_finite R M
- id: finite_length_iff_noetherian_and_artinian
  kind: textbook
  level: 3
  topic: 加群・有限の長さ
  statement: 環$R$上の加群$M$が有限の長さをもつ（$0$から$M$までの組成列がある）ことと、$M$がネーターかつアルティンであることは同値である。
  statement_en: A module M over a ring R has finite length (a composition series from 0 to M) if and only if it is both Noetherian and Artinian.
  assumptions:
  - $M$は環$R$上の加群
  quantifiers:
  - 任意の$M$
  conclusion: $M$が有限の長さ$\iff$$M$はネーターかつアルティンである。
  answer: |
    $R$を環、$M$を加群とする。組成列$0=M_0<\dots<M_k=M$があるとする。単純加群はネーターかつアルティンであり、これらは拡大で閉じるので、$M_i$について帰納法で$M$はネーターかつアルティンである。逆に$M$がネーターかつアルティンとする。$M\ne0$なら、ネーター性より$M$の真部分加群の中に極大なもの$M_1$があり、$M/M_1$は単純である。同様に$M_1$から$M_2$を作る。アルティン性より減少列$M>M_1>M_2>\cdots$は有限で止まり、止まるのは$0$に達したときである。これが組成列を与える。
  strategy: Use closure under extensions for one direction and build a series from maximal submodules for the other.
  sketch:
  - 'induction: A composition series gives both chain conditions.'
  - 'construct: Noetherianity gives a maximal proper submodule at each step.'
  - 'derive: Artinianity makes the descending chain reach 0.'
  - 'conclude: This chain is a composition series.'
  openmath: (forall (T M) (-> (and (is_ring T) (is_module T M)) (<-> (finite_length_module T M) (and (noetherian_module T M) (artinian_module T M)))))
  hard_negative:
    statement: ネーター加群は有限の長さをもつ。
    reason: $\mathbb{Z}$はネーターだが、$2^n\mathbb{Z}$の無限の減少列があるので有限の長さをもたない。
  target: |
    ∀ (R M : Type*) [Ring R] [AddCommGroup M] [Module R M], IsFiniteLength R M ↔ IsNoetherian R M ∧ IsArtinian R M
  proof: |
    by
      intro R M _ _ _
      exact isFiniteLength_iff_isNoetherian_isArtinian
- id: jordan_holder_for_modules_composition_length
  kind: named
  level: 3
  topic: 加群・ジョルダン・ヘルダーの定理
  statement: 環$R$上の加群$M$の$0$から$M$までの2つの組成列は同値である。すなわち長さが等しく、順序を除いて同型な単純商をもつ。
  statement_en: Jordan–Hölder theorem for modules. Two composition series from 0 to M of a module over a ring R are equivalent; they have the same length and isomorphic simple factors up to permutation.
  assumptions:
  - $M$は環$R$上の加群
  - $s,t$は$0$から$M$までの組成列
  quantifiers:
  - 任意の組成列$s,t$
  conclusion: $s$と$t$は長さが等しく、単純商は順序を除いて同型である。
  answer: |
    $R$を環、$M$を加群とする。組成列$s:0=A_0<\dots<A_k=M$と$t:0=B_0<\dots<B_l=M$について、$k$に関する帰納法で示す。$k=0$なら$M=0$で明らかである。$A=A_{k-1}$、$B=B_{l-1}$とする。$A=B$なら$A$の2つの組成列に帰納法の仮定を使う。$A\ne B$なら、$A,B$は極大なので$A+B=M$であり、$C=A\cap B$について第2同型定理より$M/A\cong B/C$、$M/B\cong A/C$は単純である。$A_i\cap C$の重複を除くと$C$の組成列$D$が得られる。各商は$A_{i+1}/A_i$に単射で入るので$0$か単純だからである。$D$に$A$を加えた列は$A$の組成列なので、帰納法の仮定より$s$の$A$までの部分と同値であり、$D$の長さは$k-2$である。$D$に$B$を加えた列は長さ$k-1$の$B$の組成列なので、帰納法の仮定より$t$の$B$までの部分と同値である。したがって$l=k$で、単純商は$M/A,A/C$と$M/B,B/C$を入れ替えて順序を除き一致する。
  strategy: Induct on the length, comparing the two maximal submodules through their intersection.
  sketch:
  - 'setup: Let A and B be the penultimate terms of the two series.'
  - 'case_split: If A = B, apply induction to A.'
  - 'derive: If A ≠ B, then A + B = M and M/A ≅ B/C, M/B ≅ A/C with C = A ∩ B.'
  - 'construct: Intersecting the series with C gives a composition series of C.'
  - 'induction: Compare both series through the series of C.'
  - 'conclude: Lengths agree and factors match up to permutation.'
  openmath: (forall (T M s u) (-> (and (is_ring T) (is_module T M) (composition_series s M) (composition_series u M)) (equivalent_composition_series s u)))
  hard_negative:
    statement: 組成因子が同じ加群は同型である。
    reason: $\mathbb{Z}/4$と$\mathbb{Z}/2\oplus\mathbb{Z}/2$の組成因子はともに$\mathbb{Z}/2,\mathbb{Z}/2$だが同型でない。
  target: |
    ∀ (R M : Type*) [Ring R] [AddCommGroup M] [Module R M] (s t : CompositionSeries (Submodule R M)), s.head = ⊥ → s.last = ⊤ → t.head = ⊥ → t.last = ⊤ → CompositionSeries.Equivalent s t
  proof: |
    by
      intro R M _ _ _ s t h1 h2 h3 h4
      exact s.jordan_holder t (h1.trans h3.symm) (h2.trans h4.symm)
- id: module_length_additive_in_short_exact_sequences
  kind: gap
  level: 3
  topic: 加群・長さの加法性
  statement: 環$R$上の短完全列$0\to N\to M\to P\to0$について、長さ（$\mathbb{N}\cup\{\infty\}$の値）は$\ell(M)=\ell(N)+\ell(P)$をみたす。
  statement_en: For a short exact sequence 0 → N → M → P → 0 over a ring R, lengths with values in N ∪ {∞} satisfy ℓ(M) = ℓ(N) + ℓ(P).
  assumptions:
  - $0\to N\xrightarrow{f}M\xrightarrow{g}P\to0$は環$R$上の短完全列
  quantifiers:
  - 任意の短完全列
  conclusion: $\ell(M)=\ell(N)+\ell(P)$である。
  answer: |
    $R$を環、短完全列を上のとおりとする。$N,P$が有限の長さをもつとし、組成列$0=N_0<\dots<N_a=N$、$0=P_0<\dots<P_b=P$をとる。$f(N_i)$の後に$g^{-1}(P_j)$を続けると$0$から$M$までの列であり、$g^{-1}(P_{j+1})/g^{-1}(P_j)\cong P_{j+1}/P_j$なので組成列である。ジョルダン・ヘルダーの定理より$\ell(M)=a+b$である。$N$または$P$が有限の長さをもたないとする。$M$が有限の長さをもつならネーターかつアルティンであり、部分加群$f(N)\cong N$と商$M/f(N)\cong P$もそうなので有限の長さをもち、矛盾する。よって両辺とも$\infty$である。
  strategy: Concatenate composition series, and treat infinite length through the chain conditions.
  sketch:
  - 'construct: f(N_i) followed by g⁻¹(P_j) is a composition series of M.'
  - 'apply_theorem: Jordan–Hölder gives ℓ(M) = a + b.'
  - 'contradiction: If M had finite length, so would N and P.'
  - 'conclude: Otherwise both sides are infinite.'
  openmath: (forall (T M V W f g) (-> (and (is_ring T) (module_hom f T V M) (module_hom g T M W) (injective_map f) (surjective_map g) (exact_pair f g)) (= (module_length T M) (+ (module_length T V) (module_length T W)))))
  hard_negative:
    statement: 長さは任意の完全列$N\to M\to P$で加法的である。
    reason: $\mathbb{Z}/2\xrightarrow{0}\mathbb{Z}/2\xrightarrow{\mathrm{id}}\mathbb{Z}/2$は完全だが、$1\ne1+1$である。
  target: |
    ∀ (R M N P : Type*) [Ring R] [AddCommGroup M] [AddCommGroup N] [AddCommGroup P] [Module R M] [Module R N] [Module R P] (f : N →ₗ[R] M) (g : M →ₗ[R] P), Function.Injective f → Function.Surjective g → Function.Exact f g → Module.length R M = Module.length R N + Module.length R P
  proof: |
    by
      intro R M N P _ _ _ _ _ _ _ f g hf hg h
      exact Module.length_eq_add_of_exact f g hf hg h
- id: fitting_lemma_for_finite_length_modules
  kind: named
  level: 3
  topic: 加群・フィッティングの補題
  statement: 可換環$R$上のネーターかつアルティンな加群$M$の自己準同型$f$に対し、$n>0$で$M=\ker f^n\oplus\mathrm{im}\,f^n$となるものがある。有限次元ベクトル空間のフィッティングの補題を有限の長さの加群へ一般化した形である。
  statement_en: Fitting's lemma. For an endomorphism f of a module M over a commutative ring that is both Noetherian and Artinian, there is n > 0 with M = ker f^n ⊕ im f^n. This generalizes Fitting's lemma for finite-dimensional vector spaces to modules of finite length.
  assumptions:
  - $R$は可換環
  - $M$はネーターかつアルティンな$R$加群
  - $f$は$M$の自己準同型
  quantifiers:
  - 任意の$f$
  conclusion: $n>0$で$M=\ker f^n\oplus\mathrm{im}\,f^n$となるものがある。
  answer: |
    $R,M,f$を上のとおりとする。$\ker f^i$は増大列なのでネーター性より停留し、$\mathrm{im}\,f^i$は減少列なのでアルティン性より停留する。両者が停留している$n>0$をとる。$x\in\ker f^n\cap\mathrm{im}\,f^n$なら$x=f^n(y)$で$f^{2n}(y)=0$であり、$\ker f^{2n}=\ker f^n$より$x=f^n(y)=0$である。$x\in M$について$f^n(x)\in\mathrm{im}\,f^n=\mathrm{im}\,f^{2n}$なので$f^n(x)=f^{2n}(y)$となる$y$がある。$x=(x-f^n(y))+f^n(y)$で、$x-f^n(y)\in\ker f^n$である。
  strategy: Choose n where both chains have stabilized.
  sketch:
  - 'derive: ker f^i and im f^i stabilize for large i.'
  - 'derive: ker f^n ∩ im f^n = 0 because ker f^(2n) = ker f^n.'
  - 'derive: im f^n = im f^(2n) gives the sum decomposition.'
  openmath: (forall (T M f) (-> (and (is_comm_ring T) (noetherian_module T M) (artinian_module T M) (module_hom f T M M)) (exists (n) (and (in n N) (< 0 n) (complementary_submodules (map_kernel (map_power f n)) (map_image (map_power f n)) M)))))
  hard_negative:
    statement: ネーター加群だけで同じ分解が得られる。
    reason: $M=\mathbb{Z}$、$f=2$では$\ker f^n=0$、$\mathrm{im}\,f^n=2^n\mathbb{Z}\ne\mathbb{Z}$である。
  target: |
    ∀ (R M : Type*) [CommRing R] [AddCommGroup M] [Module R M] [IsArtinian R M] [IsNoetherian R M] (f : M →ₗ[R] M), ∃ n : ℕ, 0 < n ∧ IsCompl (LinearMap.ker (f ^ n)) (LinearMap.range (f ^ n))
  proof: |
    by
      intro R M _ _ _ _ _ f
      obtain ⟨n, hn⟩ := (f.eventually_isCompl_ker_pow_range_pow.and (Filter.eventually_gt_atTop 0)).exists
      exact ⟨n, hn.2, hn.1⟩
- id: endomorphism_of_indecomposable_nilpotent_or_bijective
  kind: gap
  level: 3
  topic: 加群・直既約加群の自己準同型
  statement: 可換環$R$上のネーターかつアルティンな直既約加群$M$（$M=p\oplus q$なら$p=0$または$q=0$）の自己準同型は、冪零であるか全単射である。
  statement_en: An endomorphism of an indecomposable module M over a commutative ring, with M both Noetherian and Artinian, is either nilpotent or bijective.
  assumptions:
  - $R$は可換環
  - $M$はネーターかつアルティン
  - $M=p\oplus q$なら$p=0$または$q=0$
  quantifiers:
  - 任意の自己準同型$f$
  conclusion: $f$は冪零または全単射である。
  answer: |
    $R,M$を上のとおりとし、$f$を自己準同型とする。フィッティングの補題より$n>0$で$M=\ker f^n\oplus\mathrm{im}\,f^n$となる。直既約性より$\ker f^n=0$または$\mathrm{im}\,f^n=0$である。$\mathrm{im}\,f^n=0$なら$f^n=0$で$f$は冪零である。$\ker f^n=0$なら$\mathrm{im}\,f^n=M$でもある。$f^n$が単射なので$f$は単射であり、$f^n$が全射なので$f$は全射である。
  strategy: Apply Fitting's lemma and indecomposability.
  sketch:
  - 'apply_theorem: Fitting gives M = ker f^n ⊕ im f^n with n > 0.'
  - 'case_split: One of the summands is 0.'
  - 'conclude: im f^n = 0 gives nilpotence, and ker f^n = 0 gives bijectivity.'
  openmath: (forall (T M f) (-> (and (is_comm_ring T) (noetherian_module T M) (artinian_module T M) (indecomposable_module T M) (module_hom f T M M)) (or (exists (n) (and (in n N) (= (map_power f n) (zero_map M M)))) (bijective_map f))))
  hard_negative:
    statement: 直既約なネーター加群の自己準同型は冪零か全単射である。
    reason: $\mathbb{Z}$は直既約なネーター加群だが、$f=2$は冪零でも全単射でもない。アルティン性が必要である。
  target: |
    ∀ (R M : Type*) [CommRing R] [AddCommGroup M] [Module R M] [IsArtinian R M] [IsNoetherian R M], (∀ p q : Submodule R M, IsCompl p q → p = ⊥ ∨ q = ⊥) → ∀ f : M →ₗ[R] M, IsNilpotent f ∨ Function.Bijective f
  proof: |
    by
      intro R M _ _ _ _ _ hind f
      obtain ⟨n, hc, hn⟩ := (f.eventually_isCompl_ker_pow_range_pow.and (Filter.eventually_gt_atTop 0)).exists
      obtain ⟨k, rfl⟩ := Nat.exists_eq_succ_of_ne_zero hn.ne'
      rcases hind _ _ hc with h | h
      · right
        have hr : LinearMap.range (f ^ (k + 1)) = ⊤ := by
          have := hc.sup_eq_top
          rwa [h, bot_sup_eq] at this
        constructor
        · intro x y hxy
          have hk := LinearMap.ker_eq_bot.1 h
          apply hk
          rw [pow_succ, Module.End.mul_apply, Module.End.mul_apply, hxy]
        · intro y
          obtain ⟨x, hx⟩ := LinearMap.range_eq_top.1 hr y
          rw [pow_succ', Module.End.mul_apply] at hx
          exact ⟨_, hx⟩
      · left
        exact ⟨k + 1, LinearMap.range_eq_bot.1 h⟩
- id: ext_zero_is_hom
  kind: gap
  level: 4
  topic: ホモロジー代数・Ext⁰
  statement: 環$R$上の加群$X,Y$について、自然な写像$\mathrm{Hom}_R(X,Y)\to\mathrm{Ext}^0_R(X,Y)$は全単射である。
  statement_en: For modules X and Y over a ring R, the natural map from Hom_R(X,Y) to Ext^0_R(X,Y) is bijective.
  assumptions:
  - $X,Y$は環$R$上の加群
  quantifiers:
  - 任意の$X,Y$
  conclusion: $\mathrm{Hom}_R(X,Y)\to\mathrm{Ext}^0_R(X,Y)$は全単射である。
  answer: |
    $R$を環、$X,Y$を加群とする。$X$の射影分解$P_1\xrightarrow{d}P_0\xrightarrow{\varepsilon}X\to0$をとると$\mathrm{Ext}^0_R(X,Y)$は$\ker(\mathrm{Hom}(P_0,Y)\xrightarrow{d^*}\mathrm{Hom}(P_1,Y))$である。$\mathrm{Hom}(-,Y)$は左完全なので$0\to\mathrm{Hom}(X,Y)\xrightarrow{\varepsilon^*}\mathrm{Hom}(P_0,Y)\xrightarrow{d^*}\mathrm{Hom}(P_1,Y)$は完全である。よって$\varepsilon^*$は$\mathrm{Hom}(X,Y)$から$\ker d^*$への全単射であり、これが自然な写像である。
  strategy: Compute Ext⁰ from a projective resolution and use left exactness of Hom.
  sketch:
  - 'setup: Ext⁰ is the kernel of d* on Hom(P_0,Y).'
  - 'apply_theorem: Left exactness identifies this kernel with Hom(X,Y).'
  openmath: (forall (T X Y) (-> (and (is_ring T) (is_module T X) (is_module T Y)) (bijective_map (ext_of_hom_map X Y))))
  hard_negative:
    statement: $\mathrm{Hom}_R(X,Y)\to\mathrm{Ext}^1_R(X,Y)$も全単射である。
    reason: $R=\mathbb{Z}$、$X=Y=\mathbb{Z}$では$\mathrm{Hom}=\mathbb{Z}$、$\mathrm{Ext}^1=0$である。
  target: |
    ∀ (R : Type) [Ring R] (X Y : ModuleCat.{0} R), Function.Bijective (CategoryTheory.Abelian.Ext.mk₀ : (X ⟶ Y) → CategoryTheory.Abelian.Ext X Y 0)
  proof: |
    by
      intro R _ X Y
      exact CategoryTheory.Abelian.Ext.mk₀_bijective X Y
- id: ext_vanishes_on_projective_first_argument
  kind: gap
  level: 4
  topic: ホモロジー代数・Extの消滅
  statement: 環$R$上の射影加群$P$と加群$Y$、自然数$n$について、$\mathrm{Ext}^{n+1}_R(P,Y)=0$である。
  statement_en: For a projective module P over a ring R, a module Y and a natural number n, Ext^(n+1)_R(P,Y) = 0.
  assumptions:
  - $P$は環$R$上の射影加群
  - $Y$は$R$加群
  quantifiers:
  - 任意の自然数$n$
  conclusion: $\mathrm{Ext}^{n+1}_R(P,Y)=0$である。
  answer: |
    $R$を環、$P$を射影加群、$Y$を加群、$n$を自然数とする。$P$の射影分解として$0\to P\xrightarrow{\mathrm{id}}P\to0$がとれる。$\mathrm{Ext}$は射影分解によらず計算できるので、$\mathrm{Hom}(-,Y)$を施した複体の次数$n+1\ge1$の項は$0$であり、コホモロジーは$0$である。
  strategy: P is its own projective resolution.
  sketch:
  - 'setup: P has the projective resolution 0 → P → P → 0.'
  - 'conclude: The Hom complex vanishes in positive degree.'
  openmath: (forall (T K Y n) (-> (and (is_ring T) (projective_module T K) (is_module T Y) (in n N)) (= (ext_group K Y (+ n 1)) zero_module)))
  hard_negative:
    statement: 射影加群なら$\mathrm{Ext}^0_R(P,Y)=0$である。
    reason: $\mathrm{Ext}^0_R(P,Y)=\mathrm{Hom}_R(P,Y)$であり、$P=Y=R$なら$R\ne0$である。
  target: |
    ∀ (R : Type) [Ring R] (P Y : ModuleCat.{0} R) [CategoryTheory.Projective P] (n : ℕ) (e : CategoryTheory.Abelian.Ext P Y (n + 1)), e = 0
  proof: |
    by
      intro R _ P Y _ n e
      exact CategoryTheory.Abelian.Ext.eq_zero_of_projective e
- id: projective_iff_ext_one_vanishes
  kind: textbook
  level: 4
  topic: ホモロジー代数・射影性とExt¹
  statement: 環$R$上の加群$P$が射影的であることと、すべての加群$Y$で$\mathrm{Ext}^1_R(P,Y)=0$であることは同値である。
  statement_en: A module P over a ring R is projective if and only if Ext^1_R(P,Y) = 0 for every module Y.
  assumptions:
  - $P$は環$R$上の加群
  quantifiers:
  - 任意の加群$Y$
  conclusion: $P$が射影的$\iff$すべての$Y$で$\mathrm{Ext}^1_R(P,Y)=0$である。
  answer: |
    $R$を環、$P$を加群とする。$P$が射影的なら、$P$自身を射影分解として$\mathrm{Ext}^1_R(P,Y)=0$である。逆を示す。全射$g:X\to Z$と核$K$をとると、短完全列$0\to K\to X\to Z\to0$から、$\mathrm{Ext}^0=\mathrm{Hom}$と見た$\mathrm{Ext}$の長完全列$\mathrm{Hom}(P,X)\to\mathrm{Hom}(P,Z)\to\mathrm{Ext}^1(P,K)$が完全である。仮定より右端は$0$なので$\mathrm{Hom}(P,X)\to\mathrm{Hom}(P,Z)$は全射であり、$P$は射影的である。
  strategy: Use the long exact sequence for the kernel of a surjection.
  sketch:
  - 'derive: Projective modules have vanishing Ext¹.'
  - 'setup: For a surjection g with kernel K, use the long exact sequence.'
  - 'conclude: Ext¹(P,K) = 0 makes Hom(P,X) → Hom(P,Z) surjective.'
  openmath: (forall (T K) (-> (and (is_ring T) (is_module T K)) (<-> (projective_module T K) (forall (Y) (-> (is_module T Y) (= (ext_group K Y 1) zero_module))))))
  hard_negative:
    statement: 1つの加群$Y$で$\mathrm{Ext}^1_R(P,Y)=0$なら$P$は射影的である。
    reason: $Y=\mathbb{Q}$は入射$\mathbb{Z}$加群なのですべての$P$で$\mathrm{Ext}^1_{\mathbb{Z}}(P,\mathbb{Q})=0$だが、$\mathbb{Z}/2$は射影的でない。
  target: |
    ∀ (R : Type) [Ring R] (P : ModuleCat.{0} R), CategoryTheory.Projective P ↔ ∀ Y : ModuleCat.{0} R, Subsingleton (CategoryTheory.Abelian.Ext P Y 1)
  proof: |
    by
      intro R _ P
      exact CategoryTheory.projective_iff_subsingleton_ext_one
- id: injective_iff_ext_one_vanishes
  kind: textbook
  level: 4
  topic: ホモロジー代数・入射性とExt¹
  statement: 環$R$上の加群$I$が入射的であることと、すべての加群$X$で$\mathrm{Ext}^1_R(X,I)=0$であることは同値である。
  statement_en: A module I over a ring R is injective if and only if Ext^1_R(X,I) = 0 for every module X.
  assumptions:
  - $I$は環$R$上の加群
  quantifiers:
  - 任意の加群$X$
  conclusion: $I$が入射的$\iff$すべての$X$で$\mathrm{Ext}^1_R(X,I)=0$である。
  answer: |
    $R$を環、$I$を加群とする。$I$が入射的なら、$X$の射影分解$P_\bullet$について$\mathrm{Hom}(-,I)$は完全関手なので、$\mathrm{Hom}(P_\bullet,I)$の正の次数のコホモロジーは$0$であり、$\mathrm{Ext}^1_R(X,I)=0$である。逆を示す。単射$A\to B$と余核$C$をとると、短完全列$0\to A\to B\to C\to0$から、$\mathrm{Ext}^0=\mathrm{Hom}$と見た$\mathrm{Ext}$の長完全列$\mathrm{Hom}(B,I)\to\mathrm{Hom}(A,I)\to\mathrm{Ext}^1(C,I)$が完全である。仮定より右端は$0$なので$\mathrm{Hom}(B,I)\to\mathrm{Hom}(A,I)$は全射であり、$I$は入射的である。
  strategy: Use exactness of Hom(-,I) in one direction and the long exact sequence in the other.
  sketch:
  - 'derive: For injective I, Hom(-,I) is exact, so Ext¹ vanishes.'
  - 'setup: For an injection A → B with cokernel C, use the long exact sequence.'
  - 'conclude: Ext¹(C,I) = 0 makes Hom(B,I) → Hom(A,I) surjective.'
  openmath: (forall (T K) (-> (and (is_ring T) (is_module T K)) (<-> (injective_module T K) (forall (X) (-> (is_module T X) (= (ext_group X K 1) zero_module))))))
  hard_negative:
    statement: すべての$X$で$\mathrm{Ext}^1_R(X,I)=0$なら$I$は射影的である。
    reason: $\mathbb{Q}$は入射$\mathbb{Z}$加群だが、自由でも射影的でもない。
  target: |
    ∀ (R : Type) [Ring R] (I : ModuleCat.{0} R), CategoryTheory.Injective I ↔ ∀ X : ModuleCat.{0} R, Subsingleton (CategoryTheory.Abelian.Ext X I 1)
  proof: |
    by
      intro R _ I
      exact CategoryTheory.injective_iff_subsingleton_ext_one
- id: ext_long_exact_sequence_covariant
  kind: textbook
  level: 4
  topic: ホモロジー代数・Extの長完全列（第2変数）
  statement: 環$R$上の短完全列$0\to S_1\xrightarrow{f}S_2\xrightarrow{g}S_3\to0$と加群$X$について、$\cdots\to\mathrm{Ext}^n(X,S_1)\to\mathrm{Ext}^n(X,S_2)\to\mathrm{Ext}^n(X,S_3)\xrightarrow{\delta}\mathrm{Ext}^{n+1}(X,S_1)\to\mathrm{Ext}^{n+1}(X,S_2)$は完全である。ここで$\delta$は拡大類との合成である。
  statement_en: For a short exact sequence 0 → S_1 → S_2 → S_3 → 0 over a ring R and a module X, the sequence Ext^n(X,S_1) → Ext^n(X,S_2) → Ext^n(X,S_3) → Ext^(n+1)(X,S_1) → Ext^(n+1)(X,S_2) is exact, with connecting map given by composition with the extension class.
  assumptions:
  - $0\to S_1\to S_2\to S_3\to0$は環$R$上の短完全列
  - $X$は$R$加群
  quantifiers:
  - 任意の自然数$n$
  conclusion: $\mathrm{Ext}^n(X,S_2)$、$\mathrm{Ext}^n(X,S_3)$、$\mathrm{Ext}^{n+1}(X,S_1)$で完全である。
  answer: |
    $R$を環、$0\to S_1\xrightarrow{f}S_2\xrightarrow{g}S_3\to0$を短完全列、$X$を$R$加群とする。$A$の射影分解$P_\bullet$により$\mathrm{Ext}^n(A,B)=H^n(\mathrm{Hom}(P_\bullet,B))$と定める。類$[c]\in\mathrm{Ext}^m(A,B)$（$c:P_m\to B$）と類$[e]\in\mathrm{Ext}^n(B,C)$（$e:Q_n\to C$、$Q_\bullet$は$B$の射影分解）の合成は、$c$を$\varepsilon\varphi_0=c$、$d\varphi_k=\varphi_{k-1}d$をみたす写像$\varphi_k:P_{m+k}\to Q_k$に持ち上げて$[e\varphi_n]$と定める。とくに$f,g$は$\mathrm{Ext}^0$の類であり、それらとの合成は$[c]\mapsto[fc]$、$[c]\mapsto[gc]$である。
    短完全列の拡大類を定める。$Q_\bullet$を$S_3$の射影分解とし、$\varepsilon:Q_0\to S_3$を$g\lambda=\varepsilon$となる$\lambda:Q_0\to S_2$に持ち上げる。$g\lambda d_1=\varepsilon d_1=0$と完全性および$f$の単射性から、$\lambda d_1=f\xi_1$となる$\xi_1:Q_1\to S_1$がただ1つある。$f\xi_1d_2=\lambda d_1d_2=0$より$\xi_1d_2=0$であり、$\xi=[\xi_1]\in\mathrm{Ext}^1(S_3,S_1)$が拡大類である。
    $P_\bullet$を$X$の射影分解とする。各$P_i$は射影的なので$\mathrm{Hom}(P_i,-)$は完全であり、複体の短完全列$0\to\mathrm{Hom}(P_\bullet,S_1)\to\mathrm{Hom}(P_\bullet,S_2)\to\mathrm{Hom}(P_\bullet,S_3)\to0$を得る。そのコホモロジー長完全列が$f,g$との合成と連結写像$\delta$の完全列である。
    $\delta$が$\xi$との合成であることを示す。$c:P_n\to S_3$を$cd_{n+1}=0$とする。$\delta$の定義では、$gb=c$となる$b:P_n\to S_2$と$bd_{n+1}=fa$となる$a:P_{n+1}\to S_1$をとり、$\delta[c]=[a]$とする。この値は$b$の選び方によらない。$c$を$\varepsilon\varphi_0=c$、$d_1\varphi_1=\varphi_0d_{n+1}$をみたす$\varphi_0:P_n\to Q_0$、$\varphi_1:P_{n+1}\to Q_1$に持ち上げる。$b=\lambda\varphi_0$とおくと$gb=\varepsilon\varphi_0=c$であり、$bd_{n+1}=\lambda d_1\varphi_1=f\xi_1\varphi_1$なので$a=\xi_1\varphi_1$ととれる。よって$\delta[c]=[\xi_1\varphi_1]=[c]\cdot\xi$である。
  strategy: Apply Hom(P,-) for a projective resolution of X, take the cohomology long exact sequence, and compare the snake construction with a chain lift of the cocycle.
  sketch:
  - 'setup: Define Ext, composition by chain lifts, and the extension cocycle ξ_1 with λd_1 = fξ_1.'
  - 'derive: Hom(P_i,-) is exact, giving a short exact sequence of complexes.'
  - 'apply_theorem: The long exact cohomology sequence gives exactness.'
  - 'construct: Lift a cocycle c to φ_0, φ_1 and take b = λφ_0 in the snake construction.'
  - 'conclude: bd = fξ_1φ_1, so δ[c] = [ξ_1φ_1] = [c]·ξ.'
  openmath: (forall (T X A B Cc f g n) (-> (and (is_ring T) (is_module T X) (module_short_exact T f g A B Cc) (in n N)) (and (exact_pair (ext_postcomp_map X f n) (ext_postcomp_map X g n)) (exact_pair (ext_postcomp_map X g n) (ext_connecting_covariant X f g n)) (exact_pair (ext_connecting_covariant X f g n) (ext_postcomp_map X f (+ n 1))))))
  hard_negative:
    statement: $\mathrm{Ext}^n(X,S_2)\to\mathrm{Ext}^n(X,S_3)$はつねに全射である。
    reason: $n=0$、$X=\mathbb{Z}/2$、$0\to\mathbb{Z}\xrightarrow{2}\mathbb{Z}\to\mathbb{Z}/2\to0$では$\mathrm{Hom}(\mathbb{Z}/2,\mathbb{Z})=0$から$\mathrm{Hom}(\mathbb{Z}/2,\mathbb{Z}/2)=\mathbb{Z}/2$へは全射でない。
  target: |
    ∀ (R : Type) [Ring R] (X : ModuleCat.{0} R) (S : CategoryTheory.ShortComplex (ModuleCat.{0} R)) (hS : S.ShortExact) (n : ℕ), (∀ x₂ : CategoryTheory.Abelian.Ext X S.X₂ n, x₂.comp (CategoryTheory.Abelian.Ext.mk₀ S.g) (add_zero n) = 0 ↔ ∃ x₁ : CategoryTheory.Abelian.Ext X S.X₁ n, x₁.comp (CategoryTheory.Abelian.Ext.mk₀ S.f) (add_zero n) = x₂) ∧ (∀ x₃ : CategoryTheory.Abelian.Ext X S.X₃ n, x₃.comp hS.extClass rfl = 0 ↔ ∃ x₂ : CategoryTheory.Abelian.Ext X S.X₂ n, x₂.comp (CategoryTheory.Abelian.Ext.mk₀ S.g) (add_zero n) = x₃) ∧ (∀ x₁ : CategoryTheory.Abelian.Ext X S.X₁ (n + 1), x₁.comp (CategoryTheory.Abelian.Ext.mk₀ S.f) (add_zero (n + 1)) = 0 ↔ ∃ x₃ : CategoryTheory.Abelian.Ext X S.X₃ n, x₃.comp hS.extClass rfl = x₁)
  proof: |
    by
      intro R _ X S hS n
      refine ⟨fun x => ⟨fun h => CategoryTheory.Abelian.Ext.covariant_sequence_exact₂ X hS x h, ?_⟩, fun x => ⟨fun h => CategoryTheory.Abelian.Ext.covariant_sequence_exact₃ X hS x rfl h, ?_⟩, fun x => ⟨fun h => CategoryTheory.Abelian.Ext.covariant_sequence_exact₁ X hS x h rfl, ?_⟩⟩
      · rintro ⟨x₁, rfl⟩
        rw [CategoryTheory.Abelian.Ext.comp_assoc_of_third_deg_zero, CategoryTheory.Abelian.Ext.mk₀_comp_mk₀, S.zero, CategoryTheory.Abelian.Ext.mk₀_zero, CategoryTheory.Abelian.Ext.comp_zero]
      · rintro ⟨x₂, rfl⟩
        rw [CategoryTheory.Abelian.Ext.comp_assoc_of_second_deg_zero, hS.comp_extClass, CategoryTheory.Abelian.Ext.comp_zero]
      · rintro ⟨x₃, rfl⟩
        rw [CategoryTheory.Abelian.Ext.comp_assoc_of_third_deg_zero, hS.extClass_comp, CategoryTheory.Abelian.Ext.comp_zero]
- id: ext_long_exact_sequence_contravariant
  kind: textbook
  level: 4
  topic: ホモロジー代数・Extの長完全列（第1変数）
  statement: 環$R$上の短完全列$0\to S_1\xrightarrow{f}S_2\xrightarrow{g}S_3\to0$と加群$Y$について、$\mathrm{Ext}^n(S_3,Y)\to\mathrm{Ext}^n(S_2,Y)\to\mathrm{Ext}^n(S_1,Y)\xrightarrow{\delta}\mathrm{Ext}^{n+1}(S_3,Y)\to\mathrm{Ext}^{n+1}(S_2,Y)$は完全である。ここで$\delta$は拡大類との合成である。
  statement_en: For a short exact sequence 0 → S_1 → S_2 → S_3 → 0 over a ring R and a module Y, the sequence Ext^n(S_3,Y) → Ext^n(S_2,Y) → Ext^n(S_1,Y) → Ext^(n+1)(S_3,Y) → Ext^(n+1)(S_2,Y) is exact, with connecting map given by composition with the extension class.
  assumptions:
  - $0\to S_1\to S_2\to S_3\to0$は環$R$上の短完全列
  - $Y$は$R$加群
  quantifiers:
  - 任意の自然数$n$
  conclusion: $\mathrm{Ext}^n(S_2,Y)$、$\mathrm{Ext}^n(S_1,Y)$、$\mathrm{Ext}^{n+1}(S_3,Y)$で完全である。
  answer: |
    $R$を環、$0\to S_1\xrightarrow{f}S_2\xrightarrow{g}S_3\to0$を短完全列、$Y$を$R$加群とする。$A$の射影分解$P_\bullet$により$\mathrm{Ext}^n(A,B)=H^n(\mathrm{Hom}(P_\bullet,B))$と定め、合成は鎖写像への持ち上げで定める。すなわち$[c]\in\mathrm{Ext}^m(A,B)$（$c:P_m\to B$）と$[e]\in\mathrm{Ext}^n(B,C)$（$e:Q_n\to C$）の合成は、$\varepsilon\psi_0=c$、$d\psi_k=\psi_{k-1}d$をみたす$\psi_k:P_{m+k}\to Q_k$により$[e\psi_n]$である。短完全列の拡大類$\xi\in\mathrm{Ext}^1(S_3,S_1)$は、$S_3$の射影分解$Q_\bullet$と$g\lambda=\varepsilon$をみたす$\lambda:Q_0\to S_2$に対し、$\lambda d_1=f\xi_1$で定まる$\xi_1:Q_1\to S_1$の類である。
    $S_1,S_3$の射影分解$P'_\bullet,P''_\bullet$をとり、$\varepsilon':P'_0\to S_1$、$\varepsilon'':P''_0\to S_3$とする。馬蹄補題より$P_n=P'_n\oplus P''_n$を項とする$S_2$の射影分解$P_\bullet$がある。その微分は$\theta_n:P''_n\to P'_{n-1}$により$d(p',p'')=(d'p'+\theta_np'',d''p'')$と書け、$P_0\to S_2$は$g\lambda=\varepsilon''$をみたす$\lambda$により$(p',p'')\mapsto f\varepsilon'(p')+\lambda(p'')$である。包含$P'_\bullet\to P_\bullet$と射影$P_\bullet\to P''_\bullet$は$f,g$を持ち上げる鎖写像である。各次数で分裂するので、$\mathrm{Hom}(-,Y)$を施すと複体の短完全列$0\to\mathrm{Hom}(P''_\bullet,Y)\to\mathrm{Hom}(P_\bullet,Y)\to\mathrm{Hom}(P'_\bullet,Y)\to0$が得られる。そのコホモロジー長完全列が$g,f$との合成と連結写像$\delta'$の完全列である。
    $\delta'$と$\xi$との合成を比べる。$c:P'_n\to Y$を$cd'=0$とする。$(c,0):P_n\to Y$と微分の合成は$(p',p'')\mapsto c(d'p')+c\theta_{n+1}p''=c\theta_{n+1}p''$なので、$\delta'[c]=[c\theta_{n+1}]$である。一方$d^2=0$と$P_0\to S_2$との合成が$0$であることから、$k\ge1$で$d'\theta_{k+1}=-\theta_kd''$であり、$\lambda d''=f(-\varepsilon'\theta_1)$である。よって$\xi_1=-\varepsilon'\theta_1$であり、$\psi_k=(-1)^{k+1}\theta_{k+1}:P''_{k+1}\to P'_k$は$\varepsilon'\psi_0=\xi_1$、$d'\psi_k=\psi_{k-1}d''$をみたす。したがって$\xi\cdot[c]=[c\psi_n]=(-1)^{n+1}\delta'[c]$である。符号は核と像を変えないので、$\delta'$を$\xi$との合成$\delta$に置き換えても列は完全である。
  strategy: Use the horseshoe lemma to get a degreewise split short exact sequence of resolutions, and read the connecting map from the off-diagonal part of the differential.
  sketch:
  - 'apply_theorem: The horseshoe lemma gives a resolution P with differential (d′p′ + θp″, d″p″).'
  - 'derive: The sequence of resolutions splits in each degree, so Hom(-,Y) gives a short exact sequence of complexes.'
  - 'apply_theorem: Its long exact cohomology sequence gives exactness.'
  - 'derive: The connecting map sends [c] to [cθ_(n+1)].'
  - 'derive: ξ_1 = -ε′θ_1, and (-1)^(k+1)θ_(k+1) is a chain lift of ξ_1.'
  - 'conclude: ξ·[c] = (-1)^(n+1)δ′[c], and the sign changes no kernel or image.'
  openmath: (forall (T Y A B Cc f g n) (-> (and (is_ring T) (is_module T Y) (module_short_exact T f g A B Cc) (in n N)) (and (exact_pair (ext_precomp_map g Y n) (ext_precomp_map f Y n)) (exact_pair (ext_precomp_map f Y n) (ext_connecting_contravariant Y f g n)) (exact_pair (ext_connecting_contravariant Y f g n) (ext_precomp_map g Y (+ n 1))))))
  hard_negative:
    statement: $\mathrm{Ext}^n(S_2,Y)\to\mathrm{Ext}^n(S_1,Y)$はつねに全射である。
    reason: $n=0$、$Y=\mathbb{Z}$、$0\to\mathbb{Z}\xrightarrow{2}\mathbb{Z}\to\mathbb{Z}/2\to0$では、$\mathrm{Hom}(\mathbb{Z},\mathbb{Z})\to\mathrm{Hom}(\mathbb{Z},\mathbb{Z})$は$2$倍写像であり全射でない。
  target: |
    ∀ (R : Type) [Ring R] (Y : ModuleCat.{0} R) (S : CategoryTheory.ShortComplex (ModuleCat.{0} R)) (hS : S.ShortExact) (n : ℕ), (∀ x₂ : CategoryTheory.Abelian.Ext S.X₂ Y n, (CategoryTheory.Abelian.Ext.mk₀ S.f).comp x₂ (zero_add n) = 0 ↔ ∃ x₃ : CategoryTheory.Abelian.Ext S.X₃ Y n, (CategoryTheory.Abelian.Ext.mk₀ S.g).comp x₃ (zero_add n) = x₂) ∧ (∀ x₁ : CategoryTheory.Abelian.Ext S.X₁ Y n, hS.extClass.comp x₁ (add_comm 1 n) = 0 ↔ ∃ x₂ : CategoryTheory.Abelian.Ext S.X₂ Y n, (CategoryTheory.Abelian.Ext.mk₀ S.f).comp x₂ (zero_add n) = x₁) ∧ (∀ x₃ : CategoryTheory.Abelian.Ext S.X₃ Y (n + 1), (CategoryTheory.Abelian.Ext.mk₀ S.g).comp x₃ (zero_add (n + 1)) = 0 ↔ ∃ x₁ : CategoryTheory.Abelian.Ext S.X₁ Y n, hS.extClass.comp x₁ (add_comm 1 n) = x₃)
  proof: |
    by
      intro R _ Y S hS n
      refine ⟨fun x => ⟨fun h => CategoryTheory.Abelian.Ext.contravariant_sequence_exact₂ hS Y x h, ?_⟩, fun x => ⟨fun h => CategoryTheory.Abelian.Ext.contravariant_sequence_exact₁ hS Y x (add_comm 1 n) h, ?_⟩, fun x => ⟨fun h => CategoryTheory.Abelian.Ext.contravariant_sequence_exact₃ hS Y x h (add_comm 1 n), ?_⟩⟩
      · rintro ⟨x₃, rfl⟩
        rw [CategoryTheory.Abelian.Ext.mk₀_comp_mk₀_assoc, S.zero, CategoryTheory.Abelian.Ext.mk₀_zero, CategoryTheory.Abelian.Ext.zero_comp]
      · rintro ⟨x₂, rfl⟩
        exact hS.extClass_comp_assoc x₂
      · rintro ⟨x₁, rfl⟩
        exact hS.comp_extClass_assoc x₁ _
- id: extension_class_zero_iff_split
  kind: gap
  level: 4
  topic: ホモロジー代数・拡大類と分裂
  statement: 環$R$上の短完全列$0\to S_1\to S_2\xrightarrow{g}S_3\to0$の拡大類$\xi\in\mathrm{Ext}^1_R(S_3,S_1)$が$0$であることと、$g\circ s=\mathrm{id}_{S_3}$となる線形写像$s:S_3\to S_2$があることは同値である。
  statement_en: The extension class ξ in Ext^1_R(S_3,S_1) of a short exact sequence 0 → S_1 → S_2 → S_3 → 0 over a ring R vanishes if and only if there is a linear map s from S_3 to S_2 with g∘s = id.
  assumptions:
  - $0\to S_1\to S_2\xrightarrow{g}S_3\to0$は環$R$上の短完全列
  - $\xi$はその拡大類
  quantifiers:
  - 任意の短完全列
  conclusion: $\xi=0\iff g\circ s=\mathrm{id}_{S_3}$となる$s$がある。
  answer: |
    $R$を環、短完全列を上のとおりとする。$X=S_3$とし、$\mathrm{Ext}^0=\mathrm{Hom}$と見た$\mathrm{Ext}$の長完全列$\mathrm{Hom}(S_3,S_2)\xrightarrow{g_*}\mathrm{Hom}(S_3,S_3)\xrightarrow{\delta}\mathrm{Ext}^1(S_3,S_1)$を使う。連結写像は拡大類との合成なので$\delta(\mathrm{id})=\xi$である。$\xi=0$なら完全性より$\mathrm{id}=g\circ s$となる$s$がある。逆に$g\circ s=\mathrm{id}$なら、$\xi=\delta(g_*(s))=0$である。
  strategy: Apply the long exact sequence to the identity of S_3.
  sketch:
  - 'setup: The connecting map sends id to the extension class ξ.'
  - 'derive: If ξ = 0, exactness writes id as g∘s.'
  - 'derive: If id = g∘s, then ξ = δ(g∘s) = 0.'
  openmath: (forall (T A B Cc f g) (-> (and (is_ring T) (module_short_exact T f g A B Cc)) (<-> (= (extension_class f g) (ext_zero Cc A 1)) (exists (s) (and (module_hom s T Cc B) (= (map_compose g s) (identity_map Cc)))))))
  hard_negative:
    statement: $\mathrm{Ext}^1_R(S_3,S_1)\ne0$なら、$S_1,S_3$を端とする短完全列は分裂しない。
    reason: $S_1\oplus S_3$を中央とする分裂列は$\mathrm{Ext}^1$の値によらず存在する。その拡大類は$0$である。
  target: |
    ∀ (R : Type) [Ring R] (S : CategoryTheory.ShortComplex (ModuleCat.{0} R)) (hS : S.ShortExact), hS.extClass = 0 ↔ ∃ s : S.X₃ ⟶ S.X₂, CategoryTheory.CategoryStruct.comp s S.g = CategoryTheory.CategoryStruct.id S.X₃
  proof: |
    by
      intro R _ S hS
      constructor
      · intro h
        have h0 : (CategoryTheory.Abelian.Ext.mk₀ (CategoryTheory.CategoryStruct.id S.X₃)).comp hS.extClass (zero_add 1) = 0 := by
          rw [h, CategoryTheory.Abelian.Ext.comp_zero]
        obtain ⟨x₂, hx₂⟩ := CategoryTheory.Abelian.Ext.covariant_sequence_exact₃ S.X₃ hS _ (zero_add 1) h0
        obtain ⟨s, rfl⟩ := (CategoryTheory.Abelian.Ext.mk₀_bijective _ _).2 x₂
        refine ⟨s, (CategoryTheory.Abelian.Ext.mk₀_bijective _ _).1 ?_⟩
        rw [← hx₂, CategoryTheory.Abelian.Ext.mk₀_comp_mk₀]
      · rintro ⟨s, hs⟩
        have h1 := hS.comp_extClass
        have h2 : (CategoryTheory.Abelian.Ext.mk₀ s).comp ((CategoryTheory.Abelian.Ext.mk₀ S.g).comp hS.extClass (zero_add 1)) (zero_add 1) = 0 := by
          rw [h1, CategoryTheory.Abelian.Ext.comp_zero]
        rw [← CategoryTheory.Abelian.Ext.comp_assoc_of_second_deg_zero, CategoryTheory.Abelian.Ext.mk₀_comp_mk₀, hs, CategoryTheory.Abelian.Ext.mk₀_id_comp] at h2
        exact h2
- id: dimension_shift_for_ext_along_projective_middle
  kind: gap
  level: 4
  topic: ホモロジー代数・次元シフト
  statement: 環$R$上の短完全列$0\to S_1\to S_2\to S_3\to0$の中央$S_2$が射影的なら、$\mathrm{Ext}^{n+1}_R(S_3,Y)$の任意の元は、拡大類との合成により$\mathrm{Ext}^n_R(S_1,Y)$の元から得られる。
  statement_en: If the middle term S_2 of a short exact sequence 0 → S_1 → S_2 → S_3 → 0 over a ring R is projective, then every element of Ext^(n+1)_R(S_3,Y) comes from Ext^n_R(S_1,Y) by composition with the extension class.
  assumptions:
  - $0\to S_1\to S_2\to S_3\to0$は環$R$上の短完全列
  - $S_2$は射影的
  - $Y$は$R$加群
  quantifiers:
  - 任意の$x_3\in\mathrm{Ext}^{n+1}_R(S_3,Y)$
  conclusion: $\xi\cdot x_1=x_3$となる$x_1\in\mathrm{Ext}^n_R(S_1,Y)$がある。
  answer: |
    $R$を環、短完全列と$Y$を上のとおりとし、$\xi$を拡大類とする。第1変数の$\mathrm{Ext}$の長完全列$\mathrm{Ext}^n(S_1,Y)\xrightarrow{\delta}\mathrm{Ext}^{n+1}(S_3,Y)\to\mathrm{Ext}^{n+1}(S_2,Y)$は完全で、$\delta$は$\xi$との合成である。$S_2$は射影的なので右端は$0$である。よって$\delta$は全射である。
  strategy: The next term of the long exact sequence vanishes.
  sketch:
  - 'apply_theorem: The long exact sequence in the first variable is exact at Ext^(n+1)(S_3,Y).'
  - 'derive: Ext^(n+1)(S_2,Y) = 0 since S_2 is projective.'
  - 'conclude: The connecting map is surjective.'
  openmath: (forall (T Y A B Cc f g n) (-> (and (is_ring T) (is_module T Y) (module_short_exact T f g A B Cc) (projective_module T B) (in n N)) (surjective_map (ext_connecting_contravariant Y f g n))))
  hard_negative:
    statement: 中央が射影的なら$\mathrm{Ext}^n(S_1,Y)\to\mathrm{Ext}^{n+1}(S_3,Y)$はつねに単射である。
    reason: $n=0$、$0\to\mathbb{Z}\xrightarrow{2}\mathbb{Z}\to\mathbb{Z}/2\to0$、$Y=\mathbb{Z}$では$\mathrm{Hom}(\mathbb{Z},\mathbb{Z})\to\mathrm{Ext}^1(\mathbb{Z}/2,\mathbb{Z})\cong\mathbb{Z}/2$は単射でない。$n\ge1$なら単射である。
  target: |
    ∀ (R : Type) [Ring R] (Y : ModuleCat.{0} R) (S : CategoryTheory.ShortComplex (ModuleCat.{0} R)) (hS : S.ShortExact) (n : ℕ) [CategoryTheory.Projective S.X₂] (x₃ : CategoryTheory.Abelian.Ext S.X₃ Y (n + 1)), ∃ x₁ : CategoryTheory.Abelian.Ext S.X₁ Y n, hS.extClass.comp x₁ (add_comm 1 n) = x₃
  proof: |
    by
      intro R _ Y S hS n _ x₃
      exact CategoryTheory.Abelian.Ext.contravariant_sequence_exact₃ hS Y x₃ (CategoryTheory.Abelian.Ext.eq_zero_of_projective _) (add_comm 1 n)
- id: tor_vanishes_on_projective_second_argument
  kind: gap
  level: 4
  topic: ホモロジー代数・Torの消滅
  statement: 可換環$R$上の加群$X$と射影加群$Y$、自然数$n$について、$\mathrm{Tor}^R_{n+1}(X,Y)=0$である。ここで$\mathrm{Tor}$は第2変数の射影分解で定める。
  statement_en: For a module X and a projective module Y over a commutative ring R and a natural number n, Tor^R_(n+1)(X,Y) = 0, where Tor is defined by a projective resolution of the second variable.
  assumptions:
  - $R$は可換環
  - $X$は$R$加群、$Y$は射影加群
  quantifiers:
  - 任意の自然数$n$
  conclusion: $\mathrm{Tor}^R_{n+1}(X,Y)=0$である。
  answer: |
    $R$を可換環、$X$を加群、$Y$を射影加群、$n$を自然数とする。$\mathrm{Tor}^R_m(X,Y)$は$Y$の射影分解$P_\bullet$により$H_m(X\otimes_RP_\bullet)$で定まり、分解の取り方によらない。$Y$は射影的なので$0\to Y\xrightarrow{\mathrm{id}}Y\to0$が射影分解である。このとき次数$n+1\ge1$の項は$0$なので、ホモロジーも$0$である。
  strategy: Y is its own projective resolution.
  sketch:
  - 'setup: Tor is computed from a projective resolution of Y.'
  - 'derive: Y itself is a resolution, with zero terms in positive degree.'
  - 'conclude: The homology vanishes in degree n + 1.'
  openmath: (forall (T X K n) (-> (and (is_comm_ring T) (is_module T X) (projective_module T K) (in n N)) (= (tor_group T (+ n 1) X K) zero_module)))
  hard_negative:
    statement: $\mathrm{Tor}^R_0(X,Y)$も$Y$が射影的なら$0$である。
    reason: $\mathrm{Tor}^R_0(X,Y)=X\otimes_RY$であり、$X=Y=R$なら$R\ne0$である。
  target: |
    ∀ (R : Type) [CommRing R] (X Y : ModuleCat.{0} R) [CategoryTheory.Projective Y] (n : ℕ), CategoryTheory.Limits.IsZero (((CategoryTheory.Tor (ModuleCat.{0} R) (n + 1)).obj X).obj Y)
  proof: |
    by
      intro R _ X Y _ n
      exact CategoryTheory.isZero_Tor_succ_of_projective (ModuleCat.{0} R) X Y n
