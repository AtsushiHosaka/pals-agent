    reason: コンパクト作用素は連続である。不連続な線形汎関数は値域が1次元だがコンパクトでない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [NormedAddCommGroup F] [NormedSpace 𝕜 F] (T : E →L[𝕜] F), FiniteDimensional 𝕜 (LinearMap.range (T : E →ₗ[𝕜] F)) → IsCompactOperator T
  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ T hT
      let R := LinearMap.range (T : E →ₗ[𝕜] F)
      haveI : ProperSpace R := FiniteDimensional.proper 𝕜 R
      refine ⟨(↑) '' Metric.closedBall (0 : R) ‖T‖, (isCompact_closedBall _ _).image continuous_subtype_val, ?_⟩
      refine Filter.mem_of_superset (Metric.closedBall_mem_nhds (0 : E) one_pos) ?_
      intro x hx
      refine ⟨⟨T x, ⟨x, rfl⟩⟩, ?_, rfl⟩
      have hx' : ‖x‖ ≤ 1 := by simpa using hx
      rw [mem_closedBall_zero_iff]
      show ‖T x‖ ≤ ‖T‖
      calc ‖T x‖ ≤ ‖T‖ * ‖x‖ := T.le_opNorm x
        _ ≤ ‖T‖ * 1 := by gcongr
        _ = ‖T‖ := mul_one _
- id: neumann_series_invertibility
  kind: textbook
  level: 4
  topic: 関数解析・ノイマン級数
  statement: $R$を完備なノルム環、$t\in R$を$\|t\|<1$なる元とする。$\sum_nt^n$は収束し、$(1-t)\sum_nt^n=\sum_nt^n(1-t)=1$である(ノイマン級数)。
  statement_en: Neumann series. If t is an element of a complete normed ring with ‖t‖ < 1, the series of t^n converges and its sum is a two-sided inverse of 1 - t.
  assumptions:
  - $R$は完備なノルム環
  - $t\in R$
  - $\|t\|<1$
  quantifiers:
  - 任意の$R,t$
  conclusion: $\sum_nt^n$は収束し、$(1-t)\sum_nt^n=\sum_nt^n(1-t)=1$である。
  answer: |
    $R$を完備なノルム環、$t\in R$を$\|t\|<1$なる元とする。ノルムは$\|ab\|\leq\|a\|\|b\|$を満たす。

    $n\geq 1$で$\|t^n\|\leq\|t\|^n$なので$\sum_n\|t^n\|<\infty$である。$R$は完備なので$\sum_nt^n$は無条件収束し、和$s$をもつ。部分和$s_n=\sum_{k\leq n}t^k$について$(1-t)s_n=s_n(1-t)=1-t^{n+1}$である。$\|t^{n+1}\|\leq\|t\|^{n+1}\to 0$で、積はノルムについて連続なので、$n\to\infty$とすると$(1-t)s=s(1-t)=1$となる。
  strategy: Absolute convergence from the geometric bound and the telescoping identity for partial sums.
  sketch:
  - 'derive: ‖t^n‖ ≤ ‖t‖^n for n ≥ 1 makes the series absolutely convergent.'
  - 'apply_theorem: Completeness gives a sum S.'
  - 'derive: Partial sums satisfy (1 - t) S_n = S_n (1 - t) = 1 - t^{n+1}.'
  - 'conclude: Since t^{n+1} → 0, taking limits gives (1 - t) S = S (1 - t) = 1.'
  openmath: (forall (R t) (-> (and (banach_algebra R) (in t R) (< (norm t) 1)) (and (series_summable_fn (lambda (n) (^ t n))) (= (* (- (unit_of R) t) (series_sum_fn (lambda (n) (^ t n)))) (unit_of R)) (= (* (series_sum_fn (lambda (n) (^ t n))) (- (unit_of R) t)) (unit_of R)))))
  hard_negative:
    statement: 1-tが可逆であれば、Σt^nは必ず収束してその逆元となる。
    reason: 実数でt=2なら1-t=-1は可逆だがΣ2^nは発散する。
  target: |
    ∀ (R : Type*) [NormedRing R] [CompleteSpace R] (t : R), ‖t‖ < 1 → Summable (fun n : ℕ => t ^ n) ∧ (1 - t) * ∑' n : ℕ, t ^ n = 1 ∧ (∑' n : ℕ, t ^ n) * (1 - t) = 1
  proof: |
    by
      intro R _ _ t h
      exact ⟨summable_geometric_of_norm_lt_one h, mul_neg_geom_series t h, geom_series_mul_neg t h⟩
- id: invertible_operators_open
  kind: gap
  level: 4
  topic: 関数解析・可逆作用素
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$とし、$E$を$\mathbb{K}$上のバナッハ空間、$F$を$\mathbb{K}$上のノルム空間とする。$E$から$F$への有界線形作用素のうち有界な逆をもつものの全体は、作用素ノルムについて開集合である。
  statement_en: The set of bounded linear operators from a Banach space E to a normed space F that have a bounded inverse is open in the operator norm.
  assumptions:
  - $\mathbb{K}$は$\mathbb{R}$または$\mathbb{C}$
  - $E$は$\mathbb{K}$上のバナッハ空間
  - $F$は$\mathbb{K}$上のノルム空間
  quantifiers:
  - 任意の$E,F$
  conclusion: 有界な逆をもつ有界線形作用素の全体は開集合である。
  answer: |
    $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$とし、$E$を$\mathbb{K}$上のバナッハ空間、$F$を$\mathbb{K}$上のノルム空間とする。$T_0:E\to F$を有界な逆$T_0^{-1}$をもつ有界線形作用素とする。

    集合$U=\{T\mid\|T_0^{-1}\|\|T-T_0\|<1\}$は$T_0$を含む開集合である。$T\in U$とすると$t=T_0^{-1}(T_0-T)$は$E$上の有界線形作用素で、$\|t\|\leq\|T_0^{-1}\|\|T_0-T\|<1$である。

    $E$は完備なので、$E$上の有界線形作用素全体は完備なノルム環をなす。ノイマン級数から$1-t=T_0^{-1}T$は有界な両側逆$V$をもつ。$T=T_0(T_0^{-1}T)$は全単射であり、逆は$VT_0^{-1}$で有界である。よって$U$は有界な逆をもつ作用素の全体に含まれ、この全体は開集合である。
  strategy: Factor a nearby operator through T₀ and apply the Neumann series.
  sketch:
  - 'setup: Let T₀ be invertible and T satisfy ‖T - T₀‖ < 1/‖T₀⁻¹‖.'
  - 'translate: Write T = T₀(I - T₀⁻¹(T₀ - T)).'
  - 'apply_theorem: The Neumann series inverts I - T₀⁻¹(T₀ - T).'
  - 'conclude: T is invertible, so a ball about T₀ consists of invertible operators.'
  openmath: (forall (E F) (-> (and (banach_space E) (normed_space F)) (open_set (invertible_operators E F))))
  hard_negative:
    statement: 可逆な有界線形作用素の全体は閉集合である。
    reason: E=F=ℝで1/n·Iは可逆で0に収束するが、0は可逆でない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [NormedAddCommGroup F] [NormedSpace 𝕜 F] [CompleteSpace E], IsOpen (Set.range ((↑) : (E ≃L[𝕜] F) → E →L[𝕜] F))
  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ _
      exact ContinuousLinearEquiv.isOpen
- id: operator_spectrum_iff_not_bijective
  kind: gap
  level: 4
  topic: 関数解析・スペクトル
  statement: $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$とし、$E$を$\mathbb{K}$上のバナッハ空間、$T$を$E$上の有界線形作用素、$\lambda\in\mathbb{K}$とする。$\lambda$が$T$のスペクトルに属することと、$\lambda I-T$が全単射でないことは同値である。
  statement_en: For a bounded linear operator T on a Banach space, λ is in the spectrum of T if and only if λI - T is not bijective.
  assumptions:
  - $\mathbb{K}$は$\mathbb{R}$または$\mathbb{C}$
  - $E$は$\mathbb{K}$上のバナッハ空間
  - $T$は$E$上の有界線形作用素
  quantifiers:
  - 任意の$T$
  - 任意の$\lambda\in\mathbb{K}$
  conclusion: $\lambda\in\sigma(T)$と$\lambda I-T$が全単射でないことは同値である。
  answer: |
    $\mathbb{K}$を$\mathbb{R}$または$\mathbb{C}$とし、$E$を$\mathbb{K}$上のバナッハ空間、$T$を$E$上の有界線形作用素、$\lambda\in\mathbb{K}$とする。スペクトル$\sigma(T)$は、$\lambda I-T$が有界線形作用素の環で可逆でない$\lambda$の全体である。

    $\lambda\notin\sigma(T)$なら$\lambda I-T$は有界な両側逆をもつので全単射である。逆に$\lambda I-T$が全単射なら、有界逆写像定理から逆写像も有界である。この定理は、バナッハ空間の間の全単射な有界線形作用素の逆写像が有界であるという主張である。よって$\lambda I-T$は可逆であり、$\lambda\notin\sigma(T)$となる。対偶をとれば主張を得る。
  strategy: Use the bounded inverse theorem to identify invertibility with bijectivity.
  sketch:
  - 'translate: λ is outside the spectrum when λI - T is invertible in the ring of bounded operators.'
  - 'derive: An invertible operator is bijective.'
  - 'apply_theorem: The bounded inverse theorem gives a bounded inverse for a bijective operator.'
  - 'conclude: Taking the contrapositive gives the stated equivalence.'
  openmath: (forall (E T c) (-> (and (banach_space E) (bounded_operator T E E)) (<-> (in c (spectrum_of T)) (not (bijective_on (- (* c (identity_operator E)) T) E E)))))
  hard_negative:
    statement: λがTのスペクトルに属することと、λがTの固有値であることは同値である。
    reason: ℓ²の右シフトは単射なので0は固有値でないが、全射でないので0はスペクトルに属する。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [CompleteSpace E] (T : E →L[𝕜] E) (c : 𝕜), c ∈ spectrum 𝕜 T ↔ ¬ Function.Bijective (c • (1 : E →L[𝕜] E) - T)
  proof: |
    by
      intro 𝕜 _ E _ _ _ T c
      rw [spectrum.mem_iff, Algebra.algebraMap_eq_smul_one, ContinuousLinearMap.isUnit_iff_bijective]
- id: spectrum_compact_banach_algebra
  kind: gap
  level: 4
  topic: 関数解析・スペクトル
  statement: $A$を複素バナッハ環、$a\in A$とする。$a$のスペクトル$\sigma(a)$はコンパクトである。
  statement_en: The spectrum of an element of a complex Banach algebra is compact.
  assumptions:
  - $A$は複素バナッハ環
  - $a\in A$
  quantifiers:
  - 任意の$A,a$
  conclusion: $\sigma(a)$はコンパクトである。
  answer: |
    $A$を複素バナッハ環、$a\in A$とする。$\sigma(a)$は$z1-a$が可逆でない$z\in\mathbb{C}$の全体である。ノルムは$\|bc\|\leq\|b\|\|c\|$を満たす。ノイマン級数は、$\|t\|<1$なら$1-t$が可逆であることを保証する。

    可逆元の全体は開集合である。実際$u$が可逆で$\|u^{-1}\|\|b-u\|<1$なら、$b=u(1-u^{-1}(u-b))$はノイマン級数から可逆である。$z\mapsto z1-a$は連続なので、$\sigma(a)$の補集合は開集合であり、$\sigma(a)$は閉集合である。

    $|z|>\|a\|$なら$z\neq 0$で$\|a/z\|<1$なので、$z1-a=z(1-a/z)$は可逆である。よって$\sigma(a)$は有界である。$\mathbb{C}$の有界閉集合はコンパクトなので、$\sigma(a)$はコンパクトである。
  strategy: Closedness from openness of the units and boundedness from the Neumann series.
  sketch:
  - 'derive: The resolvent set is the preimage of the open set of units under a continuous map, so σ(a) is closed.'
  - 'apply_theorem: The Neumann series makes z1 - a invertible when |z| is larger than ‖a‖‖1‖.'
  - 'derive: Hence σ(a) is bounded.'
  - 'conclude: A closed bounded subset of ℂ is compact.'
  openmath: (forall (A a) (-> (and (complex_banach_algebra A) (in a A)) (compact_set (spectrum_of a))))
  hard_negative:
    statement: 複素バナッハ環の元のスペクトルは常に有限集合である。
    reason: C[0,1]の元f(t)=tのスペクトルは[0,1]全体である。
  target: |
    ∀ (A : Type*) [NormedRing A] [NormedAlgebra ℂ A] [CompleteSpace A] (a : A), IsCompact (spectrum ℂ a)
  proof: |
    by
      intro A _ _ _ a
      exact spectrum.isCompact a
- id: spectrum_nonempty_banach_algebra
  kind: gap
  level: 4
  topic: 関数解析・スペクトル
  statement: $A$を$0$でない複素バナッハ環、$a\in A$とする。$a$のスペクトル$\sigma(a)$は空でない。
  statement_en: The spectrum of every element of a nontrivial complex Banach algebra is nonempty.
  assumptions:
  - $A$は$A\neq\{0\}$なる複素バナッハ環
  - $a\in A$
  quantifiers:
  - 任意の$A,a$
  conclusion: $\sigma(a)$は空でない。
  answer: |
    $A$を$A\neq\{0\}$なる複素バナッハ環、$a\in A$とする。ノイマン級数は、$\|t\|<1$なら$\sum_kt^k$が絶対収束して$1-t$の両側逆元になることを保証する。$\sigma(a)$が空だと仮定して矛盾を導く。

    このとき全ての$z\in\mathbb{C}$で$z1-a$は可逆である。$R(z)=(z1-a)^{-1}$とおく。$(z+h)1-a=(z1-a)(1+hR(z))$なので、$h$が小さければ$R(z+h)=\sum_k(-h)^kR(z)^{k+1}$である。$\phi$を$A$上の有界線形汎関数とすると、$\phi\circ R$は各点の近傍で収束べき級数をもつので、$\mathbb{C}$全体で正則である。

    $|z|>2\|a\|$かつ$z\neq 0$なら$\|a/z\|<1/2$なので、$\|(1-a/z)^{-1}\|\leq\|1\|+\sum_{k\geq 1}2^{-k}=\|1\|+1$である。よって$\|R(z)\|\leq(\|1\|+1)/|z|$であり、$|z|\to\infty$で$\phi(R(z))\to 0$となる。したがって$\phi\circ R$は有界な整関数であり、リウヴィルの定理から定数である。この定数は$0$である。

    全ての有界線形汎関数$\phi$で$\phi(R(0))=0$である。ハーン・バナッハの定理からは、$0$でない元に$0$でない値をとる有界線形汎関数の存在が従うので、$R(0)=0$となる。ところが$R(0)$は$-a$の逆元なので$1=(-a)R(0)=0$である。これは$A\neq\{0\}$に反する。
  strategy: Apply Liouville's theorem to the resolvent composed with functionals.
  sketch:
  - 'contradiction: Suppose σ(a) is empty, so the resolvent is defined on all of ℂ.'
  - 'derive: The resolvent is entire and tends to 0 at infinity.'
  - 'apply_theorem: By Liouville and Hahn-Banach the resolvent vanishes identically.'
  - 'conclude: An invertible element would be 0, which contradicts nontriviality of A.'
  openmath: (forall (A a) (-> (and (complex_banach_algebra A) (!= (unit_of A) 0) (in a A)) (nonempty_set (spectrum_of a))))
  hard_negative:
    statement: 実バナッハ環の任意の元のスペクトルは空でない。
    reason: 2次実行列の環で90度回転を表す行列は実固有値をもたず、実スペクトルは空である。
  target: |
    ∀ (A : Type*) [NormedRing A] [NormedAlgebra ℂ A] [CompleteSpace A] [Nontrivial A] (a : A), (spectrum ℂ a).Nonempty
  proof: |
    by
      intro A _ _ _ _ a
      exact spectrum.nonempty a
- id: spectrum_and_spectral_radius_norm_bound
  kind: gap
  level: 4
  topic: 関数解析・スペクトル半径
  statement: $A$を$\|1\|=1$なる複素バナッハ環、$a\in A$とする。全ての$\lambda\in\sigma(a)$で$|\lambda|\leq\|a\|$である。特にスペクトル半径$r(a)$は$\|a\|$以下である。
  statement_en: In a complex Banach algebra with ‖1‖ = 1, every λ in the spectrum of a satisfies |λ| ≤ ‖a‖, so the spectral radius of a is at most ‖a‖.
  assumptions:
  - $A$は複素バナッハ環
  - $\|1\|=1$
  - $a\in A$
  quantifiers:
  - 任意の$A,a$
  conclusion: 全ての$\lambda\in\sigma(a)$で$|\lambda|\leq\|a\|$であり、$r(a)\leq\|a\|$である。
  answer: |
    $A$を$\|1\|=1$なる複素バナッハ環、$a\in A$とする。$\sigma(a)$は$\lambda1-a$が可逆でない$\lambda\in\mathbb{C}$の全体であり、$r(a)$は$|\lambda|$ ($\lambda\in\sigma(a)$)の上限である。

    $|\lambda|>\|a\|$とする。$\lambda\neq 0$で$\|a/\lambda\|<1$である。ノイマン級数は、$\|t\|<1$なら$1-t$が可逆であることを保証するので、$1-a/\lambda$は可逆であり、$\lambda1-a=\lambda(1-a/\lambda)$も可逆である。よって$\lambda\notin\sigma(a)$である。対偶をとると、$\lambda\in\sigma(a)$は$|\lambda|\leq\|a\|$を満たす。上限をとれば$r(a)\leq\|a\|$である。
  strategy: Show any λ with |λ| > ‖a‖ lies in the resolvent set via the Neumann series.
  sketch:
  - 'setup: Take |λ| > ‖a‖.'
  - 'apply_theorem: The Neumann series inverts 1 - a/λ because ‖a/λ‖ < 1.'
  - 'derive: Then λ1 - a is invertible, so λ is not in σ(a).'
  - 'conclude: Elements of σ(a) satisfy |λ| ≤ ‖a‖, and the supremum is at most ‖a‖.'
  openmath: (forall (A a) (-> (and (complex_banach_algebra A) (= (norm (unit_of A)) 1) (in a A)) (and (forall (c) (-> (in c (spectrum_of a)) (<= (abs c) (norm a)))) (<= (spectral_radius a) (norm a)))))
  hard_negative:
    statement: スペクトル半径は常に‖a‖に等しい。
    reason: 0でない冪零行列ではスペクトル半径が0で‖a‖は正である。
  target: |
    ∀ (A : Type*) [NormedRing A] [NormedAlgebra ℂ A] [CompleteSpace A] [NormOneClass A] (a : A), (∀ c ∈ spectrum ℂ a, ‖c‖ ≤ ‖a‖) ∧ spectralRadius ℂ a ≤ ‖a‖₊
  proof: |
    by
      intro A _ _ _ _ a
      exact ⟨fun c hc => spectrum.norm_le_norm_of_mem hc, spectrum.spectralRadius_le_nnnorm a⟩
