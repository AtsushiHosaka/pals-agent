    y∈(ran T)⊥は全てのxで⟨y,T x⟩=0であることと同値である。⟨y,T x⟩=⟨T*y,x⟩なので、これは全てのxで⟨T*y,x⟩=0であることと同値である。x=T*yとすればT*y=0と同値であり、y∈ker T*を得る。
