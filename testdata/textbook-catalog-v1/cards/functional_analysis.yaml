  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ _ _ T
      exact T.orthogonal_range
- id: compact_operators_closed_under_norm_limit
  kind: gap
  level: 4
  topic: 関数解析・コンパクト作用素
  statement: バナッハ空間を値域とするコンパクト作用素の列が作用素ノルムで収束すれば、極限もコンパクト作用素である。
  statement_en: If compact operators from a normed space to a Banach space converge in operator norm, then the limit is a compact operator.
  assumptions: [Eはノルム空間, Fはバナッハ空間, T_nはコンパクト作用素, 作用素ノルムでT_n→T]
  quantifiers: [任意の列(T_n), T]
  conclusion: Tはコンパクト作用素である。
  answer: |
    Fは完備なので、T(閉単位球)が全有界であることを示せばよい。ε>0に対しnを‖T_n-T‖<εとなるようにとる。T_nはコンパクトなのでT_n(閉単位球)は有限個のε球で覆われる。‖T x-T_n x‖<εより、同じ中心の2ε球がT(閉単位球)を覆う。よって全有界であり、閉包はコンパクトである。
