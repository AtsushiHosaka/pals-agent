- id: orthogonal_range_eq_kernel_adjoint
  kind: gap
  level: 4
  topic: 関数解析・共役作用素
  statement: ヒルベルト空間の間の有界線形作用素Tについて、Tの値域の直交補空間はT*の核に等しい。
  statement_en: For a bounded linear operator T between Hilbert spaces, the orthogonal complement of the range of T equals the kernel of T*.
  assumptions: [E, Fはヒルベルト空間, TはEからFへの有界線形作用素]
  quantifiers: [任意のT]
