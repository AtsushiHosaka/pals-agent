    - "apply_theorem: Bessel's inequality gives square summable coefficients."
    - "derive: Pythagoras makes the finite partial sums a Cauchy net, so they converge to some y."
    - "derive: Continuity gives ⟨b_j, x - y⟩ = 0 for all j."
    - "conclude: Completeness of the family gives y = x."
  openmath: (forall (E b x) (-> (and (hilbert_space E) (hilbert_basis b E) (in x E)) (and (series_summable_fn (lambda (i) (* (inner_product (fn_value b i) x) (fn_value b i)))) (= (series_sum_fn (lambda (i) (* (inner_product (fn_value b i) x) (fn_value b i)))) x))))
