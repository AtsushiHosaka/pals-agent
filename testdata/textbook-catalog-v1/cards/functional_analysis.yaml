  sketch:
    - "setup: Fix ε and choose n with ‖T_n - T‖ < ε."
    - "apply_theorem: Compactness of T_n covers its image of the unit ball by finitely many ε-balls."
    - "derive: The same centres with radius 2ε cover the image under T."
    - "conclude: Total boundedness and completeness of F give relative compactness."
  openmath: (forall (E F S T) (-> (and (normed_space E) (banach_space F) (forall (n) (compact_operator (fn_value S n))) (operator_tends_to S T)) (compact_operator T)))
  hard_negative:
    statement: コンパクト作用素の列の各点収束極限もコンパクト作用素である。
    reason: ℓ²の座標射影P_nは有限階数でコンパクトだが、各点極限の恒等作用素はコンパクトでない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [NormedAddCommGroup F] [NormedSpace 𝕜 F] [CompleteSpace F] (S : ℕ → E →L[𝕜] F) (T : E →L[𝕜] F), (∀ n, IsCompactOperator (S n)) → Filter.Tendsto S Filter.atTop (nhds T) → IsCompactOperator T
  proof: |
    by
      intro 𝕜 _ E F _ _ _ _ _ S T hS h
      exact isCompactOperator_of_tendsto h (Filter.Eventually.of_forall hS)
- id: compact_operator_composition_with_bounded
  kind: gap
  level: 4
  topic: 関数解析・コンパクト作用素
  statement: 有界線形作用素S,Tの合成S∘Tは、SまたはTがコンパクト作用素ならばコンパクト作用素である。
  statement_en: The composition S∘T of bounded linear operators is compact whenever S or T is compact.
  assumptions: [E, F, Gはノルム空間, TはEからFへ、SはFからGへの有界線形作用素]
  quantifiers: [任意のS, T]
  conclusion: SまたはTがコンパクトならS∘Tはコンパクトである。
  answer: |
    Tがコンパクトなら、T(閉単位球)はコンパクト集合Kに含まれ、連続写像の像S(K)はコンパクトでS∘T(閉単位球)を含む。Sがコンパクトなら、T(閉単位球)は半径‖T‖の球に含まれる。有界集合の像はSにより相対コンパクトになるので、S∘Tもコンパクトである。
  strategy: A continuous image of a compact set is compact, and a bounded operator sends bounded sets to bounded sets.
  sketch:
    - "case_split: Treat compact T and compact S separately."
    - "derive: If T is compact, S maps the compact set containing T(ball) to a compact set."
    - "derive: If S is compact, T(ball) is bounded and S sends it to a relatively compact set."
    - "conclude: In both cases S∘T is compact."
  openmath: (forall (E F G S T) (-> (and (normed_space E) (normed_space F) (normed_space G) (bounded_operator T E F) (bounded_operator S F G) (or (compact_operator S) (compact_operator T))) (compact_operator (operator_comp S T))))
  hard_negative:
    statement: S∘Tがコンパクトならば、SまたはTはコンパクトである。
    reason: ℓ²⊕ℓ²上でTを第1成分への射影、Sを第2成分への射影とするとS∘T=0はコンパクトだが、S,Tはどちらもコンパクトでない。
  target: |
    ∀ (𝕜 : Type*) [RCLike 𝕜] (E F G : Type*) [NormedAddCommGroup E] [NormedSpace 𝕜 E] [NormedAddCommGroup F] [NormedSpace 𝕜 F] [NormedAddCommGroup G] [NormedSpace 𝕜 G] (S : F →L[𝕜] G) (T : E →L[𝕜] F), (IsCompactOperator S ∨ IsCompactOperator T) → IsCompactOperator (S ∘ T)
  proof: |
    by
      intro 𝕜 _ E F G _ _ _ _ _ _ S T h
      rcases h with hS | hT
      · exact hS.comp_clm T
      · exact hT.clm_comp S
