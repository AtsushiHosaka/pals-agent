    完備距離空間では全有界集合の閉包はコンパクトなので、$T(B)$が全有界であることを示せばよい。$\varepsilon>0$に対し$\|S_n-T\|<\varepsilon$となる$n$をとる。$S_n(B)$の閉包はコンパクトなので、$S_n(B)$は有限個の点$y_1,\dots,y_m$を中心とする半径$\varepsilon$の球で覆われる。$x\in B$に対し$\|S_nx-y_j\|<\varepsilon$となる$j$をとると、$\|Tx-y_j\|\leq\|Tx-S_nx\|+\|S_nx-y_j\|<2\varepsilon$である。よって$T(B)$は全有界である。
