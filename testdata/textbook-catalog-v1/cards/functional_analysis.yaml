    $T$がコンパクトなら、$\overline{T(B)}$はコンパクトである。連続写像の像$S(\overline{T(B)})$もコンパクトで、$S(T(B))$を含む。ノルム空間のコンパクト集合は閉なので、$S(T(B))$の閉包はこのコンパクト集合の閉部分集合であり、コンパクトである。

