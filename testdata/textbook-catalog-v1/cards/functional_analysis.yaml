  - 'derive: Hence ‖T*‖ ≤ ‖T‖.'
  - 'apply_theorem: Since T** = T, the same inequality gives ‖T‖ ≤ ‖T*‖.'
  - 'conclude: The norms agree.'
  openmath: (forall (E F T) (-> (and (hilbert_space E) (hilbert_space F) (bounded_operator T E F)) (= (norm (adjoint T)) (norm T))))
