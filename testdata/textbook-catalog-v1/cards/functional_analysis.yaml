  answer: |
    ‖T*T‖≤‖T*‖‖T‖=‖T‖²である。逆に‖T x‖²=⟨T*T x,x⟩≤‖T*T‖‖x‖²である。xについて上限をとると‖T‖²≤‖T*T‖となる。
