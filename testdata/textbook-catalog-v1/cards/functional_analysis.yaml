  topic: 関数解析・共役作用素
  statement: ヒルベルト空間の間の有界線形作用素Tについて‖T*T‖=‖T‖²である。
  statement_en: For a bounded linear operator T between Hilbert spaces, ‖T* T‖ = ‖T‖².
  assumptions: [E, Fはヒルベルト空間, TはEからFへの有界線形作用素]
