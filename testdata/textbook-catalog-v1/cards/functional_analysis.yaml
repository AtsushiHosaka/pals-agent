  topic: 関数解析・コンパクト作用素
  statement: 値域が有限次元である有界線形作用素はコンパクト作用素である。
  statement_en: A bounded linear operator with finite-dimensional range is compact.
  assumptions: [E, Fはノルム空間, TはEからFへの有界線形作用素, Tの値域は有限次元]
