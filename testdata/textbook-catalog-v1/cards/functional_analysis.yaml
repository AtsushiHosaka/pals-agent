    $y\in F$について$\|T^*y\|^2=\langle y,TT^*y\rangle\leq\|y\|\|T\|\|T^*y\|$なので$\|T^*y\|\leq\|T\|\|y\|$であり、$\|T^*\|\leq\|T\|$である。

    $x\in E$について$\|Tx\|^2=\langle Tx,Tx\rangle=\langle T^*Tx,x\rangle\leq\|T^*\|\|Tx\|\|x\|$なので$\|Tx\|\leq\|T^*\|\|x\|$であり、$\|T\|\leq\|T^*\|$である。
  strategy: Estimate ‖T* y‖² by the defining identity and use T** = T for the reverse inequality.
