  topic: 組合せ論・第二種 Stirling 数
  statement: 第二種 Stirling 数$S(n,k)$（$S(n+1,k+1)=(k+1)S(n,k+1)+S(n,k)$で定める）について、$S(n+2,2)+1=2^{n+1}$である。
