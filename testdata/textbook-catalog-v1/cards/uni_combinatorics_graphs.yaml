- id: bell_number_sum_stirling_second
  kind: gap
  level: 2
  topic: 組合せ論・Bell 数と Stirling 数
  statement: $B_0=1$、$B_{n+1}=\sum_{i=0}^n\binom{n}{i}B_{n-i}$で Bell 数を定め、第二種 Stirling 数を$S(n+1,k+1)=(k+1)S(n,k+1)+S(n,k)$で定めると、$\sum_{k=0}^nS(n,k)=B_n$である。
  statement_en: With Bell numbers B_0 = 1, B_{n+1} = sum_i C(n,i) B_{n-i}, and Stirling numbers of the second kind S(n+1,k+1) = (k+1) S(n,k+1) + S(n,k), one has sum_{k=0}^n S(n,k) = B_n.
  assumptions:
  - $B_0=1$、$B_{n+1}=\sum_{i=0}^n\binom{n}{i}B_{n-i}$
  - $S(0,0)=1$、$S(0,k+1)=S(n+1,0)=0$、$S(n+1,k+1)=(k+1)S(n,k+1)+S(n,k)$
  quantifiers:
  - 任意の自然数$n$
  conclusion: $\sum_{k=0}^nS(n,k)=B_n$である。
  answer: |
    $B_0=1$、$B_{n+1}=\sum_{i=0}^n\binom{n}{i}B_{n-i}$で$B_n$を定め、$S(n,k)$を$S(0,0)=1$、$S(0,k+1)=S(n+1,0)=0$、$S(n+1,k+1)=(k+1)S(n,k+1)+S(n,k)$で定める。漸化式と帰納法より、$S(n,k)$は$k>n$で$0$である。まずすべての$n,k$について
    $S(n+1,k+1)=\sum_{j=0}^n\binom{n}{j}S(j,k)$
    を$n$についての帰納法で示す。$n=0$では$S(1,k+1)=S(0,k)$であり、成り立つ。

    $n$で成り立つとする。Pascal の公式より$\sum_{j=0}^{n+1}\binom{n+1}{j}S(j,k)=\sum_{j=0}^n\binom{n}{j}S(j,k)+\sum_{j=0}^n\binom{n}{j}S(j+1,k)$である。帰納法の仮定より第一の和は$S(n+1,k+1)$である。$k=0$なら$S(j+1,0)=0$より第二の和は$0$であり、$S(n+2,1)=S(n+1,1)+S(n+1,0)=S(n+1,1)$と一致する。$k=l+1$なら$S(j+1,l+1)=(l+1)S(j,l+1)+S(j,l)$と帰納法の仮定より第二の和は$(l+1)S(n+1,l+2)+S(n+1,l+1)$である。合計は$(l+2)S(n+1,l+2)+S(n+1,l+1)=S(n+2,l+2)$である。

    次に$T_n=\sum_{k=0}^nS(n,k)$とおき、$T_n=B_n$を$n$についての強い帰納法で示す。$T_0=1=B_0$である。$S(n+1,0)=0$と上の等式より
    $T_{n+1}=\sum_{k=0}^n\sum_{j=0}^n\binom{n}{j}S(j,k)=\sum_{j=0}^n\binom{n}{j}T_j$
    である。ここで$k>j$なら$S(j,k)=0$であることを使った。帰納法の仮定より$T_{n+1}=\sum_{j=0}^n\binom{n}{j}B_j$である。$j=n-i$とおくと$\binom{n}{n-i}=\binom{n}{i}$なので、これは$B_{n+1}$に等しい。
  strategy: Prove the column recurrence S(n+1,k+1) = sum_j C(n,j) S(j,k) by induction, then sum over k and compare with the Bell recurrence.
  sketch:
  - 'setup: Claim S(n+1,k+1) = sum_j C(n,j) S(j,k) for all n and k.'
  - 'induction: Pascal''s rule splits the sum for n+1 into two sums.'
  - 'case_split: Treat k = 0 and k = l + 1 with the Stirling recurrence.'
  - 'derive: Summing over k gives T_{n+1} = sum_j C(n,j) T_j for the row sums T_n.'
  - 'induction: Strong induction and the symmetry of binomial coefficients give T_n = B_n.'
  openmath: (forall (n) (-> (in n N) (= (sum (integer_range 0 n) (lambda (k) (stirling_second n k))) (bell_number n))))
  hard_negative:
    statement: 同じ記号で$\sum_{k=0}^nS(n,k)=2^{n-1}$（$n\ge 1$）である。
    reason: $n=3$では$S(3,1)+S(3,2)+S(3,3)=1+3+1=5$であり、$2^2=4$と異なる。
  target: |
    ∀ n : ℕ, ∑ k ∈ Finset.range (n + 1), Nat.stirlingSecond n k = Nat.bell n
  proof: |
    by
      have key : ∀ (n k : ℕ), Nat.stirlingSecond (n + 1) (k + 1) = ∑ j ∈ Finset.range (n + 1), n.choose j * Nat.stirlingSecond j k := by
        intro n
        induction n with
        | zero =>
          intro k
          cases k with
          | zero => simp [Nat.stirlingSecond]
          | succ k => simp [Nat.stirlingSecond]
        | succ n ih =>
          intro k
          have hp : ∑ j ∈ Finset.range (n + 1 + 1), (n + 1).choose j * Nat.stirlingSecond j k = ∑ j ∈ Finset.range (n + 1), n.choose j * Nat.stirlingSecond j k + ∑ j ∈ Finset.range (n + 1), n.choose j * Nat.stirlingSecond (j + 1) k := by
            rw [Finset.sum_range_succ']
            simp only [Nat.choose_succ_succ, add_mul]
            rw [Finset.sum_add_distrib]
            have h1 : ∑ j ∈ Finset.range (n + 1), n.choose j * Nat.stirlingSecond j k = n.choose 0 * Nat.stirlingSecond 0 k + ∑ j ∈ Finset.range n, n.choose (j + 1) * Nat.stirlingSecond (j + 1) k := by
              rw [Finset.sum_range_succ' _ n, add_comm]
            have h2 : ∑ j ∈ Finset.range (n + 1), n.choose (j + 1) * Nat.stirlingSecond (j + 1) k = ∑ j ∈ Finset.range n, n.choose (j + 1) * Nat.stirlingSecond (j + 1) k := by
              rw [Finset.sum_range_succ _ n, Nat.choose_succ_self]; simp
            rw [h1, h2]
            simp
            ring
          rw [hp, ← ih k, Nat.stirlingSecond_succ_succ]
          cases k with
          | zero =>
            simp [Nat.stirlingSecond_succ_zero]
          | succ k =>
            have h3 : ∑ j ∈ Finset.range (n + 1), n.choose j * Nat.stirlingSecond (j + 1) (k + 1) = (k + 1) * Nat.stirlingSecond (n + 1) (k + 1 + 1) + Nat.stirlingSecond (n + 1) (k + 1) := by
              rw [ih (k + 1), ih k, Finset.mul_sum, ← Finset.sum_add_distrib]
              refine Finset.sum_congr rfl fun j _ => ?_
              rw [Nat.stirlingSecond_succ_succ]; ring
            rw [h3]; ring
      intro n
      induction n using Nat.strong_induction_on with
      | _ n ih =>
        cases n with
        | zero => simp
        | succ n =>
          rw [Finset.sum_range_succ', Nat.stirlingSecond_succ_zero, add_zero]
          simp only [key]
          rw [Finset.sum_comm, Nat.bell_succ']
          rw [Finset.Nat.sum_antidiagonal_eq_sum_range_succ_mk]
          have h4 : ∑ j ∈ Finset.range (n + 1), ∑ k ∈ Finset.range (n + 1), n.choose j * Nat.stirlingSecond j k = ∑ j ∈ Finset.range (n + 1), n.choose j * Nat.bell j := by
            refine Finset.sum_congr rfl fun j hj => ?_
            have hj' : j < n + 1 := Finset.mem_range.mp hj
            rw [← Finset.mul_sum, ← ih j hj']
            congr 1
            refine (Finset.sum_subset (Finset.range_subset_range.mpr (by omega)) ?_).symm
            intro k _ hk
            exact Nat.stirlingSecond_eq_zero_of_lt (by simpa using hk)
          rw [h4, ← Finset.sum_range_reflect]
          refine Finset.sum_congr rfl fun j hj => ?_
          have hj' : j < n + 1 := Finset.mem_range.mp hj
          simp only [add_tsub_cancel_right]
          rw [Nat.choose_symm (by omega)]
- id: bell_egf_derivative_equation
  kind: gap
  level: 2
  topic: 組合せ論・Bell 数の指数型母関数
  statement: Bell 数$B_n$（$B_0=1$、$B_{n+1}=\sum_{i=0}^n\binom{n}{i}B_{n-i}$）の指数型母関数$F=\sum_{n\ge 0}\frac{B_n}{n!}X^n\in\mathbb{Q}[[X]]$は、形式微分について$F'=E\,F$を満たす。ここで$E=\sum_{n\ge 0}\frac{X^n}{n!}$である。
  statement_en: The exponential generating function F of the Bell numbers in Q[[X]] satisfies the formal differential equation F' = E F, where E = sum X^n/n!.
  assumptions:
  - $B_0=1$、$B_{n+1}=\sum_{i=0}^n\binom{n}{i}B_{n-i}$
  - $F=\sum_{n\ge 0}\frac{B_n}{n!}X^n$、$E=\sum_{n\ge 0}\frac{X^n}{n!}$
  - $F'=\sum_{n\ge 0}(n+1)\frac{B_{n+1}}{(n+1)!}X^n$は形式微分
  quantifiers:
  - Bell 数の指数型母関数$F$
  conclusion: $F'=E\,F$である。
  answer: |
    $B_0=1$、$B_{n+1}=\sum_{i=0}^n\binom{n}{i}B_{n-i}$で$B_n$を定め、$F=\sum_{n\ge 0}\frac{B_n}{n!}X^n$、$E=\sum_{n\ge 0}\frac{X^n}{n!}$とする。$X^n$の係数を比べる。

    $F'$の$X^n$の係数は$(n+1)\frac{B_{n+1}}{(n+1)!}=\frac{B_{n+1}}{n!}$である。$EF$の$X^n$の係数は
    $\sum_{i=0}^n\frac{1}{i!}\cdot\frac{B_{n-i}}{(n-i)!}=\frac{1}{n!}\sum_{i=0}^n\binom{n}{i}B_{n-i}$
    であり、漸化式より$\frac{B_{n+1}}{n!}$に等しい。よって$F'=EF$である。
  strategy: Compare coefficients; the Cauchy product with E reproduces the Bell recurrence.
  sketch:
  - 'setup: The coefficient of X^n in F'' is B_{n+1}/n!.'
  - 'derive: The coefficient of X^n in E F is a sum with reciprocal factorials.'
  - 'translate: Rewrite it with C(n,i)/n!.'
  - 'conclude: The Bell recurrence gives equality.'
  openmath: (= (power_series_derivative (formal_power_series_over Q (lambda (n) (/ (bell_number n) (factorial n))))) (* (power_series_exp Q) (formal_power_series_over Q (lambda (n) (/ (bell_number n) (factorial n))))))
  hard_negative:
    statement: 同じ$F$について$F'=F$である。
    reason: $F'=F$なら$B_{n+1}=B_n$となるが、$B_1=1$、$B_2=2$である。
  target: |
    PowerSeries.derivativeFun (PowerSeries.mk (fun n => (Nat.bell n : ℚ) / n.factorial)) = PowerSeries.exp ℚ * PowerSeries.mk (fun n => (Nat.bell n : ℚ) / n.factorial)
  proof: |
    by
      ext n
      rw [PowerSeries.coeff_derivativeFun, PowerSeries.coeff_mk, PowerSeries.coeff_mul, Finset.Nat.sum_antidiagonal_eq_sum_range_succ_mk, Nat.bell_succ]
      have h3 : (n.factorial : ℚ) ≠ 0 := by exact_mod_cast n.factorial_ne_zero
      have h5 : ((n:ℚ) + 1) ≠ 0 := by exact_mod_cast Nat.succ_ne_zero n
      rw [Fin.sum_univ_eq_sum_range (fun i => n.choose i * Nat.bell (n - i)) (n+1), Nat.factorial_succ]
      push_cast
      rw [Finset.sum_div, Finset.sum_mul]
      refine Finset.sum_congr rfl fun i hi => ?_
      have hi' : i ≤ n := Nat.lt_succ_iff.mp (Finset.mem_range.mp hi)
      rw [PowerSeries.coeff_exp, PowerSeries.coeff_mk, Nat.cast_choose ℚ hi']
      have h1 : (i.factorial : ℚ) ≠ 0 := by exact_mod_cast i.factorial_ne_zero
      have h2 : ((n - i).factorial : ℚ) ≠ 0 := by exact_mod_cast (n - i).factorial_ne_zero
      simp
      field_simp
- id: uniform_block_partition_count_formula
  kind: gap
  level: 2
  topic: 組合せ論・同じ大きさのブロックへの分割
  statement: 正の整数$n$と自然数$m$について、$\left(\prod_{p=0}^{m-1}\binom{pn+n-1}{n-1}\right)(n!)^mm!=(mn)!$である。左の積は$mn$元集合を大きさ$n$の$m$個のブロックに分割する方法の数である。
  statement_en: For a positive integer n and natural number m, the product over p < m of C(pn+n-1, n-1), times (n!)^m m!, equals (mn)!. The product counts partitions of an mn-element set into m blocks of size n.
  assumptions:
  - $n\ge 1$
  - $m$は自然数
  quantifiers:
  - 任意の正の整数$n$と自然数$m$
  conclusion: $\left(\prod_{p=0}^{m-1}\binom{pn+n-1}{n-1}\right)(n!)^mm!=(mn)!$である。
  answer: |
    $n\ge 1$とし、$m$についての帰納法で示す。$m=0$では両辺とも$1$である。

    $m$で成り立つとする。$m+1$の場合の左辺は、$m$の場合の左辺に$\binom{mn+n-1}{n-1}\,n!\,(m+1)$を掛けたものである。$N=mn+n-1$とおくと$\binom{N}{n-1}=\frac{N!}{(n-1)!\,(mn)!}$なので
    $\binom{N}{n-1}\,n!\,(m+1)=\frac{N!\,n\,(m+1)}{(mn)!}=\frac{N!\,(N+1)}{(mn)!}=\frac{((m+1)n)!}{(mn)!}$
    である。帰納法の仮定と合わせると、左辺は$((m+1)n)!$である。

    積の意味は次のとおりである。未使用の元が$(p+1)n$個残っているとき、そのうち最小の元と同じブロックに入れる残り$n-1$個の選び方は$\binom{pn+n-1}{n-1}$通りである。$p=m-1,\dots,0$の順に選ぶと分割が一つ定まる。
  strategy: Induct on m and simplify the ratio of consecutive factorials.
  sketch:
  - 'induction: Induct on m, with both sides equal to 1 at m = 0.'
  - 'derive: The new factor is C(N, n-1) n! (m+1) with N = mn + n - 1.'
  - 'derive: Expand the binomial coefficient and use n(m+1) = N + 1.'
  - 'conclude: The factor equals ((m+1)n)!/(mn)!.'
  openmath: (forall (m n) (-> (and (in m N) (in n N) (>= n 1)) (= (* (* (product (finset_range m) (lambda (p) (binom (- (+ (* p n) n) 1) (- n 1)))) (^ (factorial n) m)) (factorial m)) (factorial (* m n)))))
  hard_negative:
    statement: 同じ条件で分割の数は$\frac{(mn)!}{(n!)^m}$である。
    reason: $m=2$、$n=1$では$2$元集合を大きさ$1$のブロック$2$個に分割する方法は$1$通りだが、$\frac{2!}{1}=2$である。ブロックの順序を区別しない分は$m!$で割る必要がある。
  target: |
    ∀ (m n : ℕ), n ≠ 0 → (∏ p ∈ Finset.range m, (p * n + n - 1).choose (n - 1)) * n.factorial ^ m * m.factorial = (m * n).factorial
  proof: |
    by
      intro m n hn
      rw [← Nat.uniformBell_eq, ← Nat.uniformBell_mul_eq m hn]
- id: derangement_two_term_recurrence
  kind: gap
  level: 2
  topic: 組合せ論・撹乱順列
  statement: $n$元集合の撹乱順列（固定点のない置換）の個数を$D_n$とすると、$D_{n+2}=(n+1)(D_n+D_{n+1})$である。
  statement_en: Let D_n be the number of derangements, that is fixed-point-free permutations, of an n-element set. Then D_{n+2} = (n+1)(D_n + D_{n+1}).
  assumptions:
  - $D_n$は$n$元集合の固定点のない置換の個数
  quantifiers:
  - 任意の自然数$n$
  conclusion: $D_{n+2}=(n+1)(D_n+D_{n+1})$である。
  answer: |
    $D_m$を$m$元集合の撹乱順列の個数とする。$n$を自然数、$X$を$n+2$元集合とし、$a\in X$を固定する。$X$の撹乱順列$\sigma$では$\sigma(a)=b\ne a$であり、$b$の選び方は$n+1$通りある。$b$を固定して$\sigma(a)=b$の撹乱順列を数える。

    $\sigma(b)=a$の場合、$\sigma$は$X\setminus\{a,b\}$上の撹乱順列を定め、逆に$X\setminus\{a,b\}$の撹乱順列に$a,b$の互換を合わせると$\sigma$が得られる。個数は$D_n$である。

    $\sigma(b)\ne a$の場合、$\tau:X\setminus\{a\}\to X\setminus\{a\}$を、$\sigma(x)=a$となる$x$では$\tau(x)=b$、それ以外では$\tau(x)=\sigma(x)$と定める。$\sigma(b)\ne a$なので$\tau(b)=\sigma(b)\ne b$であり、$\tau$は固定点を持たない。逆に$X\setminus\{a\}$の撹乱順列$\tau$に対して、$\tau(x)=b$となる$x$で$\sigma(x)=a$とし、$\sigma(a)=b$、他は$\sigma=\tau$と定める。$x\ne b$なので$\sigma(b)\ne a$であり、$\sigma$は条件を満たす。個数は$D_{n+1}$である。

    よって$D_{n+2}=(n+1)(D_n+D_{n+1})$である。
  strategy: Fix the image b of an element a and split on whether b maps back to a.
  sketch:
  - 'setup: Fix a and the image b = σ(a), which has n+1 choices.'
  - 'case_split: Consider σ(b) = a and σ(b) ≠ a.'
  - 'construct: In the first case σ restricts to a derangement of the remaining n elements.'
  - 'construct: In the second case rerouting through b gives a derangement of n+1 elements, bijectively.'
  - 'conclude: Add the two counts and multiply by n+1.'
  openmath: (forall (n) (-> (in n N) (= (derangement_number (+ n 2)) (* (+ n 1) (+ (derangement_number n) (derangement_number (+ n 1)))))))
  hard_negative:
    statement: $D_{n+2}=(n+2)(D_n+D_{n+1})$である。
    reason: $n=0$では$D_2=1$であるが、右辺は$2(D_0+D_1)=2(1+0)=2$である。
  target: |
    ∀ n : ℕ, Fintype.card (derangements (Fin (n + 2))) = (n + 1) * (Fintype.card (derangements (Fin n)) + Fintype.card (derangements (Fin (n + 1))))
  proof: |
    by
      intro n
      rw [card_derangements_fin_add_two]; ring
- id: derangement_one_term_recurrence
  kind: gap
  level: 2
  topic: 組合せ論・撹乱順列
  statement: $n$元集合の撹乱順列の個数$D_n$は、整数の等式$D_{n+1}=(n+1)D_n-(-1)^n$を満たす。
  statement_en: The number D_n of derangements of an n-element set satisfies D_{n+1} = (n+1) D_n - (-1)^n as integers.
  assumptions:
  - $D_n$は$n$元集合の固定点のない置換の個数
  quantifiers:
  - 任意の自然数$n$
  conclusion: $D_{n+1}=(n+1)D_n-(-1)^n$である。
  answer: |
    $D_m$を$m$元集合の固定点のない置換の個数とする。$n$についての帰納法で示す。二項の漸化式$D_{n+2}=(n+1)(D_n+D_{n+1})$を用いる。これは$\sigma(a)=b$を固定して$\sigma(b)=a$か否かで分ける数え上げから得られる。

    $n=0$では$D_0=1$、$D_1=0$なので$D_1=1\cdot 1-1=0$である。

    $n$で成り立つとする。$D_{n+1}=(n+1)D_n-(-1)^n$より$(n+1)D_n=D_{n+1}+(-1)^n$である。したがって
    $D_{n+2}=(n+1)D_n+(n+1)D_{n+1}=D_{n+1}+(-1)^n+(n+1)D_{n+1}=(n+2)D_{n+1}-(-1)^{n+1}$
    である。これは$n+1$の場合の等式である。
  strategy: Induct on n and substitute the inductive hypothesis into the two-term recurrence.
  sketch:
  - 'setup: Recall D_{n+2} = (n+1)(D_n + D_{n+1}).'
  - 'induction: The case n = 0 follows from D_0 = 1 and D_1 = 0.'
  - 'derive: Replace (n+1) D_n with D_{n+1} + (-1)^n.'
  - 'conclude: This gives the identity for n+1.'
  openmath: (forall (n) (-> (in n N) (= (derangement_number (+ n 1)) (- (* (+ n 1) (derangement_number n)) (^ (neg 1) n)))))
  hard_negative:
    statement: $D_{n+1}=(n+1)D_n+(-1)^n$である。
    reason: $n=0$では右辺が$1\cdot 1+1=2$であるが、$D_1=0$である。
  target: |
    ∀ n : ℕ, (Fintype.card (derangements (Fin (n + 1))) : ℤ) = (n + 1) * (Fintype.card (derangements (Fin n)) : ℤ) - (-1) ^ n
  proof: |
    by
      intro n
      rw [card_derangements_fin_eq_numDerangements, card_derangements_fin_eq_numDerangements]
      exact numDerangements_succ n
- id: permutation_count_by_fixed_points
  kind: gap
  level: 2
  topic: 組合せ論・撹乱順列と固定点
  statement: $k$元集合の撹乱順列の個数を$D_k$とすると、自然数$n$について$\sum_{k=0}^n\binom{n}{k}D_k=n!$である。
  statement_en: With D_k the number of derangements of a k-element set, sum_{k=0}^n C(n,k) D_k = n!.
  assumptions:
  - $D_k$は$k$元集合の固定点のない置換の個数
  quantifiers:
  - 任意の自然数$n$
  conclusion: $\sum_{k=0}^n\binom{n}{k}D_k=n!$である。
  answer: |
    $D_k$を$k$元集合の固定点のない置換の個数とする。$n$を自然数、$X$を$n$元集合とする。$X$の置換$\sigma$に対して、固定点でない元の集合を$Y$とする。$\sigma$は$Y$を$Y$に写し、$Y$上の撹乱順列を定める。逆に、部分集合$Y\subseteq X$と$Y$上の撹乱順列を与えると、$X\setminus Y$の元を固定する$X$の置換がただ一つ定まり、その固定点でない元の集合は$Y$である。

    したがって$X$の置換と、組（部分集合$Y$、$Y$上の撹乱順列）は一対一に対応する。$|Y|=k$となる$Y$は$\binom{n}{k}$個あり、それぞれに$D_k$個の撹乱順列がある。置換の総数は$n!$なので$\sum_{k=0}^n\binom{n}{k}D_k=n!$である。
  strategy: Classify permutations by the set of non-fixed points.
  sketch:
  - 'setup: Associate to a permutation its set Y of non-fixed points.'
  - 'derive: The permutation restricts to a derangement of Y.'
  - 'construct: A subset Y and a derangement of Y extend uniquely to a permutation fixing the complement.'
  - 'conclude: Counting by the size of Y gives the identity.'
  openmath: (forall (n) (-> (in n N) (= (sum (integer_range 0 n) (lambda (k) (* (binom n k) (derangement_number k)))) (factorial n))))
  hard_negative:
    statement: $\sum_{k=0}^n D_k=n!$である。
    reason: $n=2$では$D_0+D_1+D_2=2$で一致するが、$n=3$では$1+0+1+2=4$であり$3!=6$と異なる。
  target: |
    ∀ n : ℕ, ∑ k ∈ Finset.range (n + 1), n.choose k * Fintype.card (derangements (Fin k)) = n.factorial
  proof: |
    by
      intro n
      simp only [card_derangements_fin_eq_numDerangements]
      suffices h : (∑ k ∈ Finset.range (n + 1), (n.choose k : ℤ) * (numDerangements k : ℤ)) = n.factorial by exact_mod_cast h
      induction n with
      | zero => simp
      | succ n ih =>
        rw [Finset.sum_range_succ', Nat.factorial_succ]
        have h1 : ∀ k, ((n + 1).choose (k + 1) : ℤ) * (numDerangements (k + 1) : ℤ) = (n + 1) * ((n.choose k : ℤ) * (numDerangements k : ℤ)) + ((n + 1).choose (k + 1) : ℤ) * (-1) ^ (k + 1) := by
          intro k
          have h2 : ((n + 1).choose (k + 1) : ℤ) * (k + 1) = (n + 1) * (n.choose k : ℤ) := by
            exact_mod_cast (Nat.add_one_mul_choose_eq n k).symm
          rw [numDerangements_succ]
          linear_combination (numDerangements k : ℤ) * h2
        simp only [h1]
        rw [Finset.sum_add_distrib, ← Finset.mul_sum, ih]
        have h3 : (∑ k ∈ Finset.range (n + 1), ((n + 1).choose (k + 1) : ℤ) * (-1) ^ (k + 1)) + 1 = 0 := by
          have := Int.alternating_sum_range_choose_of_ne (n := n + 1) (by omega)
          rw [Finset.sum_range_succ'] at this
          simp only [pow_zero, one_mul, Nat.choose_zero_right, Nat.cast_one] at this
          calc _ = _ := ?_
               _ = 0 := this
          refine congrArg (· + 1) (Finset.sum_congr rfl fun k _ => ?_)
          simp [mul_comm]
        simp
        linear_combination h3
- id: derangement_ratio_tends_to_inverse_e
  kind: textbook
  level: 2
  topic: 組合せ論・撹乱順列の割合
  statement: $n$元集合の撹乱順列の個数を$D_n$とすると、$n\to\infty$で$\frac{D_n}{n!}\to e^{-1}$である。
  statement_en: With D_n the number of derangements of an n-element set, D_n/n! tends to e^(-1) as n tends to infinity.
  assumptions:
  - $D_n$は$n$元集合の固定点のない置換の個数
  quantifiers:
  - 自然数$n$についての極限
  conclusion: $\lim_{n\to\infty}\frac{D_n}{n!}=e^{-1}$である。
  answer: |
    $D_n$を$n$元集合の固定点のない置換の個数とする。包除原理により$D_n=\sum_{k=0}^n(-1)^k\frac{n!}{k!}$である。実際、$k$個の指定した元を固定する置換は$(n-k)!$個あり、その選び方は$\binom{n}{k}$通りなので、固定点のない置換は$\sum_{k=0}^n(-1)^k\binom{n}{k}(n-k)!$個である。

    両辺を$n!$で割ると$\frac{D_n}{n!}=\sum_{k=0}^n\frac{(-1)^k}{k!}$である。右辺は指数関数の級数$e^x=\sum_{k\ge 0}\frac{x^k}{k!}$の$x=-1$での部分和なので、$n\to\infty$で$e^{-1}$に収束する。
  strategy: Divide the inclusion-exclusion formula by n! and recognize a partial sum of the exponential series at -1.
  sketch:
  - 'apply_theorem: Inclusion-exclusion gives D_n as an alternating sum.'
  - 'derive: Dividing by n! gives the sum of (-1)^k/k! for k ≤ n.'
  - 'conclude: This is a partial sum of the series for e^(-1), so it converges there.'
  openmath: (tends_to_at_top (lambda (n) (/ (derangement_number n) (factorial n))) (exp (neg 1)))
  hard_negative:
    statement: $\frac{D_n}{n!}$は$\frac12$に収束する。
    reason: 部分和は$e^{-1}\approx 0.3679$に収束し、$\frac12$は$n=2$の値にすぎない。
  target: |
    Filter.Tendsto (fun n : ℕ => (Nat.card (derangements (Fin n)) : ℝ) / n.factorial) Filter.atTop (nhds (Real.exp (-1)))
  proof: |
    by
      have : (fun n : ℕ => (Nat.card (derangements (Fin n)) : ℝ) / n.factorial) = fun n => (numDerangements n : ℝ) / n.factorial := by
        funext n
        rw [Nat.card_eq_fintype_card, card_derangements_fin_eq_numDerangements]
      rw [this]; exact numDerangements_tendsto_inv_e
- id: cycle_count_given_length
  kind: gap
  level: 2
  topic: 組合せ論・巡回置換の個数
  statement: 元の個数が$n$の有限集合の置換のうち、長さ$k$の巡回置換（$2\le k\le n$、それ以外の元は固定する）の個数は$(k-1)!\binom{n}{k}$である。特に$k=n$のとき$(n-1)!$個である。
  statement_en: Among the permutations of an n-element set, the number of cycles of length k, with 2 ≤ k ≤ n and all other points fixed, is (k-1)! C(n,k); in particular there are (n-1)! full cycles.
  assumptions:
  - $A$は元の個数が$n$の有限集合
  - $2\le k\le n$
  quantifiers:
  - 任意の有限集合$A$と整数$k$
  conclusion: 長さ$k$の巡回置換は$(k-1)!\binom{n}{k}$個ある。
  answer: |
    $A$を$n$元集合、$2\le k\le n$とする。長さ$k$の巡回置換は、動かす元の集合$S$（$|S|=k$）と$S$上の巡回の順序で決まる。$S$の選び方は$\binom{n}{k}$通りである。

    $S$を固定する。$S$の元を一列に並べた$k!$通りの列$(s_1,\dots,s_k)$に、$s_1\mapsto s_2\mapsto\dots\mapsto s_k\mapsto s_1$という巡回を対応させる。これは$S$を動かす長さ$k$の巡回をすべて与える。同じ巡回を与える列は、$s_1$をどの元から始めるかで決まる$k$個ずつである。よって$S$上の巡回は$\frac{k!}{k}=(k-1)!$個である。

    合わせて$(k-1)!\binom{n}{k}$個である。$k=n$では$\binom{n}{n}=1$より$(n-1)!$個である。
  strategy: Choose the support and count cyclic orderings of it.
  sketch:
  - 'setup: A cycle is determined by its support and a cyclic order.'
  - 'derive: There are C(n,k) supports.'
  - 'derive: Each of the k! orderings gives a cycle, with exactly k orderings per cycle.'
  - 'conclude: Multiply to get (k-1)! C(n,k).'
  openmath: (forall (A k) (-> (and (in (size A) N) (in k N) (>= k 2) (<= k (size A))) (= (size (perm_of_cycle_type A (set k))) (* (factorial (- k 1)) (binom (size A) k)))))
  hard_negative:
    statement: 同じ条件で長さ$k$の巡回置換は$k!\binom{n}{k}$個ある。
    reason: $n=k=3$では巡回は$(1\ 2\ 3)$と$(1\ 3\ 2)$の$2$個だが、$3!=6$である。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (k : ℕ), 2 ≤ k → k ≤ Fintype.card α → (Finset.univ.filter (fun g : Equiv.Perm α => g.cycleType = {k})).card = (k - 1).factorial * (Fintype.card α).choose k
  proof: |
    by
      intro α _ _ k h1 h2
      exact Equiv.Perm.card_of_cycleType_singleton h1 h2
- id: permutation_count_given_cycle_type
  kind: textbook
  level: 2
  topic: 組合せ論・巡回型の個数
  statement: 元の個数が$n$の有限集合の置換のうち、長さ$2$以上の巡回の長さの多重集合が$m$である置換の個数を$c(m)$とする。$m$の各元が$2$以上で$m$の和が$n$以下なら、$c(m)\cdot(n-|m|_+)!\cdot\prod_{a\in m}a\cdot\prod_i m_i!=n!$である。ここで$|m|_+$は$m$の元の和、$m_i$は$m$における$i$の重複度である。
  statement_en: Let c(m) be the number of permutations of an n-element set whose cycles of length at least 2 have the multiset of lengths m. If all elements of m are at least 2 and their sum s is at most n, then c(m) (n-s)! (product of m) (product over i of m_i!) = n!, where m_i is the multiplicity of i in m.
  assumptions:
  - $A$は元の個数が$n$の有限集合
  - $m$は自然数の多重集合で、各元は$2$以上
  - $m$の元の和$s$は$n$以下
  quantifiers:
  - 任意の有限集合$A$と多重集合$m$
  conclusion: $c(m)\cdot(n-s)!\cdot\prod_{a\in m}a\cdot\prod_im_i!=n!$である。
  answer: |
    $A$を$n$元集合、$m$を各元が$2$以上で和$s\le n$の多重集合とする。$m$の元を$a_1,\dots,a_r$と順に並べ、$A$の元の列$(x_1,\dots,x_n)$の全体を考える。列は$n!$個ある。

    列を前から長さ$a_1,\dots,a_r$の区間に区切り、各区間を巡回として読み、残りの$n-s$個の元を固定する置換を対応させる。この置換の巡回の長さは$m$であり、巡回型が$m$の置換はすべて現れる。

    一つの置換を与える列の個数を数える。残りの$n-s$個の元の並べ方は$(n-s)!$通りある。各巡回はどの元から書き始めても同じなので、長さ$a$の巡回ごとに$a$通り、全体で$\prod_{a\in m}a$通りある。長さが等しい巡回の順序の入れ替えが、値$i$ごとに$m_i!$通り、全体で$\prod_im_i!$通りある。これらは独立に選べるので、列の個数は$(n-s)!\prod_{a\in m}a\prod_im_i!$である。

    よって$c(m)\cdot(n-s)!\prod_{a\in m}a\prod_im_i!=n!$である。
  strategy: Count sequences of all elements that read off a permutation of the given cycle type.
  sketch:
  - 'setup: Fix an order of m and consider all n! sequences of the elements.'
  - 'construct: Cut the sequence into blocks of the lengths in m and read the blocks as cycles.'
  - 'derive: Each permutation of cycle type m arises.'
  - 'derive: The number of sequences per permutation is (n-s)! times the product of m times the product of m_i!.'
  - 'conclude: Double counting gives the identity.'
  openmath: (forall (A m) (-> (and (in (size A) N) (<= (multiset_sum m) (size A)) (forall (a) (-> (multiset_member a m) (>= a 2)))) (= (* (size (perm_of_cycle_type A m)) (* (* (factorial (- (size A) (multiset_sum m))) (multiset_prod m)) (multiset_multiplicity_factorial_prod m))) (factorial (size A)))))
  hard_negative:
    statement: 同じ条件で重複度の因子を除いた等式$c(m)\cdot(n-s)!\cdot\prod_{a\in m}a=n!$が成り立つ。
    reason: $n=4$、$m=\{2,2\}$では$c(m)=3$であり、左辺は$3\cdot 1\cdot 4=12$であるが、$4!=24$である。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (m : Multiset ℕ), m.sum ≤ Fintype.card α → (∀ a ∈ m, 2 ≤ a) → (Finset.univ.filter (fun g : Equiv.Perm α => g.cycleType = m)).card * ((Fintype.card α - m.sum).factorial * m.prod * ∏ i ∈ m.toFinset, (m.count i).factorial) = (Fintype.card α).factorial
  proof: |
    by
      intro α _ _ m h1 h2
      rw [Equiv.Perm.card_of_cycleType_mul_eq, if_pos ⟨h1, h2⟩]
- id: lubell_yamamoto_meshalkin_inequality
  kind: named
  level: 3
  topic: 組合せ論・集合族と LYM 不等式
  statement: Lubell-Yamamoto-Meshalkin の不等式。$n$元集合の部分集合族$\mathcal{A}$が包含について反鎖であるとき、大きさ$r$の元の個数を$a_r$とすると$\sum_{r=0}^n\frac{a_r}{\binom{n}{r}}\le 1$である。
  statement_en: Lubell-Yamamoto-Meshalkin inequality. If a family of subsets of an n-element set is an antichain under inclusion and a_r is the number of its members of size r, then the sum of a_r / C(n,r) over r from 0 to n is at most 1.
  assumptions:
  - $X$は$n$元集合
  - $\mathcal{A}$は$X$の部分集合族で、包含について反鎖
  - $a_r$は$\mathcal{A}$の大きさ$r$の元の個数
  quantifiers:
  - 任意の有限集合$X$と反鎖$\mathcal{A}$
  conclusion: $\sum_{r=0}^n\frac{a_r}{\binom{n}{r}}\le 1$である。
  answer: |
    $X$を$n$元集合、$\mathcal{A}$を$X$の部分集合族で包含について反鎖であるものとし、$a_r$を大きさ$r$の元の個数とする。$X$の元の並べ方$\pi=(x_1,\dots,x_n)$は$n!$通りある。$S\in\mathcal{A}$が$\pi$の接頭辞であるとは、$|S|=r$として$S=\{x_1,\dots,x_r\}$となることとする。

    大きさ$r$の$S$を接頭辞に持つ並べ方は$r!(n-r)!$通りある。一つの並べ方の接頭辞は包含について全順序をなすので、反鎖$\mathcal{A}$の元で接頭辞になるものは高々一つである。

    組$(\pi,S)$を数えると$\sum_ra_rr!(n-r)!\le n!$である。両辺を$n!$で割ると$\sum_{r=0}^n\frac{a_r}{\binom{n}{r}}\le 1$である。
  strategy: Count pairs consisting of an ordering of X and a member of the antichain that is a prefix of the ordering.
  sketch:
  - 'setup: Consider all n! orderings of X and their prefixes.'
  - 'derive: A set of size r is a prefix of exactly r!(n-r)! orderings.'
  - 'derive: Prefixes of one ordering form a chain, so at most one member of the antichain occurs.'
  - 'conclude: Double counting and division by n! give the inequality.'
  openmath: (forall (X F) (-> (and (finite_set X) (subset F (powerset X)) (subset_antichain F X)) (<= (sum (integer_range 0 (size X)) (lambda (r) (/ (size (family_slice F r)) (binom (size X) r)))) 1)))
  hard_negative:
    statement: 反鎖とは限らない部分集合族でも$\sum_r\frac{a_r}{\binom{n}{r}}\le 1$である。
    reason: $n=1$で$\mathcal{A}=\{\emptyset,\{x\}\}$とすると和は$1+1=2$である。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (𝒜 : Finset (Finset α)), IsAntichain (· ⊆ ·) (𝒜 : Set (Finset α)) → ∑ r ∈ Finset.range (Fintype.card α + 1), (((𝒜.filter (fun s => s.card = r)).card : ℚ) / ((Fintype.card α).choose r : ℚ)) ≤ 1
  proof: |
    by
      intro α _ _ 𝒜 h
      exact Finset.lubell_yamamoto_meshalkin_inequality_sum_card_div_choose h
- id: local_lym_shadow_double_count
  kind: gap
  level: 3
  topic: 組合せ論・集合族の影
  statement: 局所 Lubell-Yamamoto-Meshalkin 不等式。$n$元集合の$r$元部分集合からなる族$\mathcal{A}$の影$\partial\mathcal{A}$（$\mathcal{A}$の元から一つ元を除いて得られる集合の族）について、$|\mathcal{A}|\,r\le|\partial\mathcal{A}|\,(n-r+1)$である。$\mathcal{A}$が空でなければ$r\le n$なので、$n-r+1$は自然数である。
  statement_en: Local LYM inequality. For a family A of r-element subsets of an n-element set with shadow ∂A, one has |A| r ≤ |∂A| (n - r + 1).
  assumptions:
  - $X$は$n$元集合
  - $\mathcal{A}$は$X$の$r$元部分集合からなる族
  - $\partial\mathcal{A}$は$\mathcal{A}$の影
  quantifiers:
  - 任意の有限集合$X$、自然数$r$、族$\mathcal{A}$
  conclusion: $|\mathcal{A}|\,r\le|\partial\mathcal{A}|\,(n-r+1)$である。
  answer: |
    $X$を$n$元集合、$\mathcal{A}$を$X$の$r$元部分集合からなる族とする。$\mathcal{A}$が空なら左辺は$0$で成り立つ。空でないとき$r\le n$である。$S\in\mathcal{A}$、$T\in\partial\mathcal{A}$、$T\subset S$を満たす組$(S,T)$を数える。

    $S\in\mathcal{A}$を固定すると、$S$から一つ元を除いた$T$は$r$個あり、すべて$\partial\mathcal{A}$に属する。よって組の個数は$|\mathcal{A}|\,r$である。

    $T\in\partial\mathcal{A}$を固定すると$|T|=r-1$である。$T\subset S$となる$r$元集合$S$は、$X\setminus T$から一つ元を加えて得られるので$n-r+1$個以下である。よって組の個数は$|\partial\mathcal{A}|\,(n-r+1)$以下である。

    二通りの数え方から$|\mathcal{A}|\,r\le|\partial\mathcal{A}|\,(n-r+1)$である。
  strategy: Double count the pairs (S, T) with S in A and T obtained from S by removing an element.
  sketch:
  - 'setup: Count the pairs (S, T) with S in A, T in the shadow and T contained in S.'
  - 'derive: Each S contributes exactly r pairs.'
  - 'derive: Each T has at most n - r + 1 extensions to an r-set.'
  - 'conclude: Comparing the two counts gives the inequality.'
  openmath: (forall (X F r) (-> (and (finite_set X) (subset F (powerset X)) (in r N) (uniform_family F r)) (<= (* (size F) r) (* (size (set_shadow F)) (+ (- (size X) r) 1)))))
  hard_negative:
    statement: 同じ条件で$|\mathcal{A}|\le|\partial\mathcal{A}|$である。
    reason: $n=4$、$r=1$で$\mathcal{A}$を$1$元集合すべてとすると$|\mathcal{A}|=4$であり、$\partial\mathcal{A}=\{\emptyset\}$の大きさは$1$である。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (𝒜 : Finset (Finset α)) (r : ℕ), (∀ s ∈ 𝒜, s.card = r) → 𝒜.card * r ≤ (Finset.shadow 𝒜).card * (Fintype.card α - r + 1)
  proof: |
    by
      intro α _ _ 𝒜 r h
      exact Finset.local_lubell_yamamoto_meshalkin_inequality_mul (fun s hs => h s hs)
- id: kruskal_katona_initial_segment
  kind: named
  level: 3
  topic: 組合せ論・Kruskal-Katona の定理
  statement: Kruskal-Katona の定理。$\{0,\dots,n-1\}$の$r$元部分集合からなる族$\mathcal{A}$と、余辞書式順序の始切片である$r$元部分集合の族$\mathcal{C}$が$|\mathcal{C}|\le|\mathcal{A}|$を満たすなら、影について$|\partial\mathcal{C}|\le|\partial\mathcal{A}|$である。
  statement_en: Kruskal-Katona theorem. If A is a family of r-subsets of {0,...,n-1}, and C is an initial segment of the colexicographic order on r-subsets with |C| ≤ |A|, then |∂C| ≤ |∂A|.
  assumptions:
  - $\mathcal{A}$は$\{0,\dots,n-1\}$の$r$元部分集合からなる族
  - $\mathcal{C}$は$r$元部分集合の余辞書式順序の始切片
  - $|\mathcal{C}|\le|\mathcal{A}|$
  quantifiers:
  - 任意の自然数$n,r$と族$\mathcal{A},\mathcal{C}$
  conclusion: $|\partial\mathcal{C}|\le|\partial\mathcal{A}|$である。
  answer: |
    $\mathcal{A}$を$\{0,\dots,n-1\}$の$r$元部分集合からなる族、$\mathcal{C}$を余辞書式順序の始切片で$|\mathcal{C}|\le|\mathcal{A}|$とする。$\mathcal{A}$の部分族に置き換えても影は大きくならないので、$|\mathcal{C}|=|\mathcal{A}|$としてよい。

    圧縮を定める。$U,V$を大きさの等しい互いに素な集合とする。集合$S$について、$V\subseteq S$かつ$U\cap S=\emptyset$なら$c(S)=(S\cup U)\setminus V$とし、そうでなければ$c(S)=S$とする。族$\mathcal{F}$の$UV$圧縮$C(\mathcal{F})$は、$c(S)\in\mathcal{F}$を満たす$S\in\mathcal{F}$と、$c(S)\notin\mathcal{F}$を満たす$S\in\mathcal{F}$の像$c(S)$を合わせた族である。$c$は動く集合の上で単射なので$|C(\mathcal{F})|=|\mathcal{F}|$であり、元の大きさも変わらない。$C(\mathcal{F})=\mathcal{F}$のとき、$\mathcal{F}$は$(U,V)$で圧縮済みという。これは、$S\in\mathcal{F}$なら$c(S)\in\mathcal{F}$であることと同じである。

    補題1。$U,V$は空でなく、すべての$u\in U$に対して$v\in V$があり、$\mathcal{F}$が$(U\setminus\{u\},V\setminus\{v\})$で圧縮済みであるとする。このとき$\partial C(\mathcal{F})\subseteq C(\partial\mathcal{F})$であり、したがって$|\partial C(\mathcal{F})|\le|\partial\mathcal{F}|$である。

    $B\in\partial C(\mathcal{F})$をとり、$B=D\setminus\{x\}$（$D\in C(\mathcal{F})$、$x\in D$）と書く。

    $B\notin\partial\mathcal{F}$の場合を考える。$D\notin\mathcal{F}$なので、$D=c(S)$となる$S\in\mathcal{F}$（$V\subseteq S$、$U\cap S=\emptyset$）がある。$U\subseteq D$、$D\cap V=\emptyset$である。$x=u\in U$と仮定し、仮定の$v$をとる。圧縮済みであることから$(S\cup(U\setminus\{u\}))\setminus(V\setminus\{v\})=B\cup\{v\}$は$\mathcal{F}$に属する。$v\notin B$なので$B\in\partial\mathcal{F}$となり、矛盾する。よって$x\notin U$であり、$x\in S$である。$T=S\setminus\{x\}$は$\partial\mathcal{F}$に属し、$V\subseteq T$、$U\cap T=\emptyset$、$c(T)=B$を満たす。$B\notin\partial\mathcal{F}$なので$B\in C(\partial\mathcal{F})$である。

    $B\in\partial\mathcal{F}$の場合を考える。$c(B)\in\partial\mathcal{F}$を示せば$B\in C(\partial\mathcal{F})$である。$c(B)=B$なら明らかなので、$V\subseteq B$、$U\cap B=\emptyset$とする。動いた像は$V$と交わらず、$V\subseteq D$なので、$D$は動いた像ではない。よって$D\in\mathcal{F}$かつ$c(D)\in\mathcal{F}$である。$x\notin U$なら$U\cap D=\emptyset$であり、$c(D)=c(B)\cup\{x\}$、$x\notin c(B)$なので$c(B)\in\partial\mathcal{F}$である。$x=u\in U$なら、仮定の$v$について$(D\cup(U\setminus\{u\}))\setminus(V\setminus\{v\})=c(B)\cup\{v\}$が$\mathcal{F}$に属し、$v\notin c(B)$なので$c(B)\in\partial\mathcal{F}$である。

    最後に$|C(\partial\mathcal{F})|=|\partial\mathcal{F}|$より補題の不等式を得る。

    補題2。$r$元集合の族$\mathcal{F}$が、$\max U<\max V$を満たす空でない組$(U,V)$のすべてで圧縮済みなら、$\mathcal{F}$は始切片である。実際、$B\in\mathcal{F}$とし、$r$元集合$A$が余辞書式順序で$B$より前にあるとする。$U=A\setminus B$、$V=B\setminus A$は$\max U<\max V$を満たし、$c(B)=A$なので$A\in\mathcal{F}$である。

    本論に入る。$\mathcal{F}_0=\mathcal{A}$とする。$\mathcal{F}_j$が、$\max U<\max V$を満たすある組で圧縮済みでないなら、そのような組のうち$|U|$が最小のものをとり、$\mathcal{F}_{j+1}=C(\mathcal{F}_j)$とする。このとき補題1の仮定が成り立つ。実際、$u\in U$に対して$v=\min V$とする。$|U|=1$なら$U\setminus\{u\},V\setminus\{v\}$は空で、圧縮は何も変えない。$|U|\ge 2$なら$v\ne\max V$なので$\max(U\setminus\{u\})<\max(V\setminus\{v\})$であり、$|U|$の最小性より$\mathcal{F}_j$はこの組で圧縮済みである。よって$|\mathcal{F}_{j+1}|=|\mathcal{F}_j|$、$|\partial\mathcal{F}_{j+1}|\le|\partial\mathcal{F}_j|$である。

    動く集合$S$について$\max U<\max V$より$\sum_{i\in U}2^i<\sum_{i\in V}2^i$なので、$\sum_{i\in S}2^i$は真に減る。したがって$\sum_{S\in\mathcal{F}_j}\sum_{i\in S}2^i$は各段階で真に減り、操作は有限回で止まる。止まったときの族$\mathcal{B}$は、$|\mathcal{B}|=|\mathcal{A}|$、$|\partial\mathcal{B}|\le|\partial\mathcal{A}|$を満たし、補題2より始切片である。大きさの等しい始切片は一つなので$\mathcal{B}=\mathcal{C}$である。よって$|\partial\mathcal{C}|\le|\partial\mathcal{A}|$である。
  strategy: Compress A repeatedly with UV-compressions, which do not enlarge the shadow, until it becomes the initial segment.
  sketch:
  - 'setup: Reduce to |C| = |A| by passing to a subfamily of A.'
  - 'construct: Define UV-compression, which preserves the size of a family.'
  - 'derive: If the family is compressed for the smaller pairs (U - u, V - v), then the shadow of the UV-compression lies in the UV-compression of the shadow.'
  - 'derive: A family compressed for all pairs with max U < max V is an initial segment.'
  - 'derive: Compressing along a non-compressed pair with |U| minimal keeps the shadow from growing and strictly decreases the binary weight, so the process stops.'
  - 'conclude: The final family equals C, so the shadow of C is at most that of A.'
  openmath: (forall (n r F D) (-> (and (in n N) (in r N) (subset F (powerset (finset_range n))) (subset D (powerset (finset_range n))) (uniform_family F r) (colex_initial_segment D r) (<= (size D) (size F))) (<= (size (set_shadow D)) (size (set_shadow F)))))
  hard_negative:
    statement: 同じ条件で$|\partial\mathcal{A}|\le|\partial\mathcal{C}|$である。
    reason: $n=4$、$r=2$で$\mathcal{A}=\{\{0,1\},\{2,3\}\}$、$\mathcal{C}=\{\{0,1\},\{0,2\}\}$とすると$|\partial\mathcal{A}|=4$、$|\partial\mathcal{C}|=3$である。
  target: |
    ∀ (n r : ℕ) (𝒜 𝒞 : Finset (Finset (Fin n))), (∀ s ∈ 𝒜, s.card = r) → 𝒞.card ≤ 𝒜.card → Finset.Colex.IsInitSeg 𝒞 r → (Finset.shadow 𝒞).card ≤ (Finset.shadow 𝒜).card
  proof: |
    by
      intro n r 𝒜 𝒞 h1 h2 h3
      exact Finset.kruskal_katona (fun s hs => h1 s hs) h2 h3
- id: kruskal_katona_lovasz_form
  kind: textbook
  level: 3
  topic: 組合せ論・Kruskal-Katona の定理
  statement: ロヴァース形の Kruskal-Katona の定理。$i\le r\le k\le n$とし、$\mathcal{A}$を$\{0,\dots,n-1\}$の$r$元部分集合からなる族で$|\mathcal{A}|\ge\binom{k}{r}$とする。このとき$i$回反復した影は$|\partial^i\mathcal{A}|\ge\binom{k}{r-i}$を満たす。
  statement_en: Lovász form of Kruskal-Katona. If i ≤ r ≤ k ≤ n and A is a family of r-subsets of {0,...,n-1} with |A| ≥ C(k,r), then the i-th iterated shadow satisfies |∂^i A| ≥ C(k, r-i).
  assumptions:
  - $i\le r\le k\le n$
  - $\mathcal{A}$は$\{0,\dots,n-1\}$の$r$元部分集合からなる族
  - $|\mathcal{A}|\ge\binom{k}{r}$
  quantifiers:
  - 任意の自然数$i,r,k,n$と族$\mathcal{A}$
  conclusion: $|\partial^i\mathcal{A}|\ge\binom{k}{r-i}$である。
  answer: |
    $i\le r\le k\le n$とし、$\mathcal{A}$を$\{0,\dots,n-1\}$の$r$元部分集合からなる族で$|\mathcal{A}|\ge\binom{k}{r}$とする。$j=0,\dots,r$について、$\mathcal{C}_j$を$\{0,\dots,k-1\}$の$(r-j)$元部分集合全体とする。

    $\{0,\dots,k-1\}$に含まれる集合と、同じ大きさでこれに含まれない集合を比べると、対称差の最大元は$k$以上で後者に属する。よって前者が余辞書式順序で前に来るので、$\mathcal{C}_j$は始切片である。また$j<r$なら$\partial\mathcal{C}_j=\mathcal{C}_{j+1}$である。実際、$\mathcal{C}_j$の元から一つ元を除くと$\mathcal{C}_{j+1}$の元になる。逆に$\mathcal{C}_{j+1}$の元は大きさが$r-j-1<k$なので、$\{0,\dots,k-1\}$の元を一つ加えて$\mathcal{C}_j$の元に広げられる。

    $j\le i$についての帰納法で$|\mathcal{C}_j|\le|\partial^j\mathcal{A}|$を示す。$j=0$は仮定である。$j<i$で成り立つとする。$\partial^j\mathcal{A}$は$(r-j)$元部分集合の族なので、Kruskal-Katona の定理を$\mathcal{C}_j$と$\partial^j\mathcal{A}$に用いると$|\mathcal{C}_{j+1}|=|\partial\mathcal{C}_j|\le|\partial^{j+1}\mathcal{A}|$である。

    $j=i$とすると$|\partial^i\mathcal{A}|\ge|\mathcal{C}_i|=\binom{k}{r-i}$である。
  strategy: Compare A with the family of all r-subsets of {0,...,k-1} and iterate Kruskal-Katona.
  sketch:
  - 'construct: Let C_j be the family of all (r-j)-subsets of the first k elements, an initial segment of colex.'
  - 'derive: The shadow of C_j is C_{j+1}.'
  - 'induction: Kruskal-Katona applied to C_j and the j-th shadow of A gives |C_{j+1}| ≤ |∂^{j+1} A|.'
  - 'conclude: For j = i this is C(k, r-i) ≤ |∂^i A|.'
  openmath: (forall (i r k n F) (-> (and (in i N) (in r N) (in k N) (in n N) (<= i r) (<= r k) (<= k n) (subset F (powerset (finset_range n))) (uniform_family F r) (<= (binom k r) (size F))) (<= (binom k (- r i)) (size (iterated_shadow i F)))))
  hard_negative:
    statement: 同じ条件で$|\partial^i\mathcal{A}|\ge\binom{k}{r}$である。
    reason: $n=k=4$、$r=3$、$i=3$で$\mathcal{A}$を$3$元集合全体とすると$\partial^3\mathcal{A}=\{\emptyset\}$の大きさは$1$であり、$\binom{4}{3}=4$より小さい。
  target: |
    ∀ (n r k i : ℕ) (𝒜 : Finset (Finset (Fin n))), i ≤ r → r ≤ k → k ≤ n → (∀ s ∈ 𝒜, s.card = r) → k.choose r ≤ 𝒜.card → k.choose (r - i) ≤ ((Finset.shadow^[i]) 𝒜).card
  proof: |
    by
      intro n r k i 𝒜 h1 h2 h3 h4 h5
      exact Finset.kruskal_katona_lovasz_form h1 h2 h3 (fun s hs => h4 s hs) h5
- id: erdos_ko_rado_theorem
  kind: named
  level: 3
  topic: 組合せ論・エルデシュ・コ・ラドの定理
  statement: エルデシュ・コ・ラドの定理。$1\le r$、$2r\le n$とし、$\mathcal{A}$を$\{0,\dots,n-1\}$の$r$元部分集合からなる族で、どの二つの元も共通元を持つものとする。このとき$|\mathcal{A}|\le\binom{n-1}{r-1}$である。
  statement_en: Erdős-Ko-Rado theorem. If 1 ≤ r, 2r ≤ n and A is a family of r-subsets of {0,...,n-1} in which any two members have a common element, then |A| ≤ C(n-1, r-1).
  assumptions:
  - $1\le r$かつ$2r\le n$
  - $\mathcal{A}$は$\{0,\dots,n-1\}$の$r$元部分集合からなる族
  - $\mathcal{A}$のどの二つの元も共通元を持つ
  quantifiers:
  - 任意の自然数$n,r$と族$\mathcal{A}$
  conclusion: $|\mathcal{A}|\le\binom{n-1}{r-1}$である。
  answer: |
    $1\le r$、$2r\le n$とし、$\mathcal{A}$を条件を満たす族とする。Katona の円周法で示す。$X=\{0,\dots,n-1\}$の元を円周上に並べる並べ方$c$を考える。回転を区別せず向きを区別すると、並べ方は$(n-1)!$通りある。$c$で連続する$r$個の元の集合を$c$の弧と呼ぶ。弧は$n$個ある。

    まず$c$の弧で$\mathcal{A}$に属するものは高々$r$個であることを示す。$\mathcal{A}$に属する弧$I=(x_1,\dots,x_r)$が一つあるとする。$I$以外で$\mathcal{A}$に属する弧は$I$と交わるので、ある$j\in\{1,\dots,r-1\}$について、$x_j$で終わる弧$A_j$か、$x_{j+1}$で始まる弧$B_j$である。$A_j$と$B_j$は続けて並ぶ長さ$r$の弧で、$2r\le n$なので互いに素である。したがって各$j$について$A_j,B_j$の一方しか$\mathcal{A}$に属さない。よって$\mathcal{A}$に属する弧は$I$を含めて高々$1+(r-1)=r$個である。

    組$(c,S)$（$S\in\mathcal{A}$は$c$の弧）を数える。$r$元集合$S$を弧に持つ並べ方は$r!(n-r)!$通りある。よって$|\mathcal{A}|\,r!(n-r)!\le r\,(n-1)!$であり、$|\mathcal{A}|\le\frac{r(n-1)!}{r!(n-r)!}=\binom{n-1}{r-1}$である。
  strategy: Use Katona's cycle method and count arcs in cyclic orders.
  sketch:
  - 'setup: Consider cyclic arrangements of X and arcs of r consecutive elements.'
  - 'derive: At most r arcs of one arrangement belong to A, because 2r ≤ n makes opposite arcs at a cut disjoint.'
  - 'derive: Each r-set is an arc in r!(n-r)! arrangements.'
  - 'conclude: Double counting gives |A| ≤ C(n-1, r-1).'
  openmath: (forall (n r F) (-> (and (in n N) (in r N) (>= r 1) (<= (* 2 r) n) (subset F (powerset (finset_range n))) (uniform_family F r) (intersecting_family F)) (<= (size F) (binom (- n 1) (- r 1)))))
  hard_negative:
    statement: 仮定$2r\le n$を除いても$|\mathcal{A}|\le\binom{n-1}{r-1}$である。
    reason: $n=3$、$r=2$では$2$元集合全体の$3$個が互いに交わるが、$\binom{2}{1}=2$である。
  target: |
    ∀ (n r : ℕ) (𝒜 : Finset (Finset (Fin n))), 1 ≤ r → 2 * r ≤ n → (∀ s ∈ 𝒜, s.card = r) → (∀ s ∈ 𝒜, ∀ t ∈ 𝒜, (s ∩ t).Nonempty) → 𝒜.card ≤ (n - 1).choose (r - 1)
  proof: |
    by
      intro n r 𝒜 hr hn hs hi
      refine Finset.erdos_ko_rado ?_ (fun s h => hs s h) (by omega)
      intro s h t ht hd
      obtain ⟨a, ha⟩ := hi s h t ht
      rw [Finset.mem_inter] at ha
      exact Finset.disjoint_left.mp hd ha.1 ha.2
- id: pajor_card_le_shattered_sets
  kind: gap
  level: 3
  topic: 組合せ論・集合族の打ち砕き
  statement: Pajor の補題。有限集合の有限な族$\mathcal{A}$について、$\mathcal{A}$が打ち砕く集合の個数は$|\mathcal{A}|$以上である。ここで$\mathcal{A}$が$s$を打ち砕くとは、$s$の任意の部分集合が$s\cap S$（$S\in\mathcal{A}$）の形に書けることをいう。
  statement_en: Pajor's lemma. A finite family A of finite sets shatters at least |A| sets, where A shatters s when every subset of s has the form s ∩ S with S in A.
  assumptions:
  - $\mathcal{A}$は有限集合の有限な族
  - $\mathcal{A}$が$s$を打ち砕くとは、$s$の任意の部分集合が$s\cap S$（$S\in\mathcal{A}$）と書けること
  quantifiers:
  - 任意の有限な族$\mathcal{A}$
  conclusion: $\mathcal{A}$が打ち砕く集合の個数は$|\mathcal{A}|$以上である。
  answer: |
    $\mathcal{A}$を有限集合の有限な族とする。$\mathcal{A}$の元の和集合の大きさについての帰納法で示す。和集合が空なら$\mathcal{A}$は空か$\{\emptyset\}$である。前者では$|\mathcal{A}|=0$で成り立ち、後者では$\emptyset$を打ち砕くので成り立つ。

    和集合の元$a$を一つとり、$\mathcal{A}_0=\{S\in\mathcal{A}\mid a\notin S\}$、$\mathcal{A}_1=\{S\setminus\{a\}\mid S\in\mathcal{A},\,a\in S\}$とおく。$|\mathcal{A}|=|\mathcal{A}_0|+|\mathcal{A}_1|$である。どちらの族の元も$a$を含まず、和集合は小さくなるので、帰納法の仮定より、$\mathcal{A}_i$が打ち砕く集合の族$\mathcal{S}_i$は$|\mathcal{S}_i|\ge|\mathcal{A}_i|$を満たす。$\mathcal{S}_0,\mathcal{S}_1$の元は$a$を含まない。

    $s\in\mathcal{S}_0\cup\mathcal{S}_1$なら$\mathcal{A}$は$s$を打ち砕く。$\mathcal{A}_1$の元に$a$を加えても$s$との交わりは変わらないからである。$s\in\mathcal{S}_0\cap\mathcal{S}_1$なら$\mathcal{A}$は$s\cup\{a\}$も打ち砕く。実際、$a$を含まない部分集合は$\mathcal{A}_0$で、$a$を含む部分集合は$\mathcal{A}_1$で実現される。$s\cup\{a\}$は$a$を含むので、これらは$\mathcal{S}_0\cup\mathcal{S}_1$と重ならない。

    よって$\mathcal{A}$が打ち砕く集合は少なくとも$|\mathcal{S}_0\cup\mathcal{S}_1|+|\mathcal{S}_0\cap\mathcal{S}_1|=|\mathcal{S}_0|+|\mathcal{S}_1|\ge|\mathcal{A}|$個ある。
  strategy: Induct on the ground set by splitting the family at an element.
  sketch:
  - 'induction: Induct on the size of the union of the members.'
  - 'construct: Split A at an element a into A_0 and A_1 with a removed.'
  - 'derive: Sets shattered by A_0 or A_1 are shattered by A.'
  - 'derive: For s shattered by both, s with a added is also shattered by A.'
  - 'conclude: Inclusion-exclusion gives at least |A_0| + |A_1| shattered sets.'
  openmath: (forall (F) (-> (finite_set F) (<= (size F) (size (shatterer F)))))
  hard_negative:
    statement: 有限な族$\mathcal{A}$は$\mathcal{A}$自身の元をすべて打ち砕く。
    reason: $\mathcal{A}=\{\{1\}\}$は$\{1\}$の部分集合$\emptyset$を$\{1\}\cap S$の形に実現できないので、$\{1\}$を打ち砕かない。
  target: |
    ∀ (α : Type*) [DecidableEq α] (𝒜 : Finset (Finset α)), 𝒜.card ≤ 𝒜.shatterer.card
  proof: |
    by
      intro α _ 𝒜
      exact 𝒜.card_le_card_shatterer
- id: sauer_shelah_lemma
  kind: named
  level: 3
  topic: 組合せ論・VC 次元
  statement: Sauer-Shelah の補題。$n$元集合の部分集合族$\mathcal{A}$の$\mathrm{VC}$次元を$d$（打ち砕かれる集合の大きさの最大値、$\mathcal{A}$が空なら$0$）とすると、$|\mathcal{A}|\le\sum_{k=0}^d\binom{n}{k}$である。
  statement_en: Sauer-Shelah lemma. If a family A of subsets of an n-element set has VC dimension d, the largest size of a shattered set and 0 for the empty family, then |A| ≤ sum_{k=0}^d C(n,k).
  assumptions:
  - $X$は$n$元集合で$\mathcal{A}$は$X$の部分集合族
  - $d$は$\mathcal{A}$が打ち砕く集合の大きさの最大値（$\mathcal{A}$が空なら$0$）
  quantifiers:
  - 任意の有限集合$X$と族$\mathcal{A}$
  conclusion: $|\mathcal{A}|\le\sum_{k=0}^d\binom{n}{k}$である。
  answer: |
    $X$を$n$元集合、$\mathcal{A}$を$X$の部分集合族、$d$をその $\mathrm{VC}$ 次元とする。Pajor の補題により$\mathcal{A}$が打ち砕く集合は$|\mathcal{A}|$個以上ある。

    $\mathcal{A}$が打ち砕く集合はすべて$X$の部分集合で、大きさは$d$以下である。実際、$\mathcal{A}$の元の部分集合しか打ち砕けず、$d$の定義から大きさは$d$以下である。$X$の部分集合で大きさが$d$以下のものは$\sum_{k=0}^d\binom{n}{k}$個ある。

    よって$|\mathcal{A}|\le\sum_{k=0}^d\binom{n}{k}$である。
  strategy: Combine Pajor's lemma with a count of subsets of size at most d.
  sketch:
  - 'apply_theorem: Pajor''s lemma bounds |A| by the number of shattered sets.'
  - 'derive: Every shattered set is a subset of X of size at most d.'
  - 'conclude: The number of such subsets is the sum of C(n,k) for k ≤ d.'
  openmath: (forall (X F) (-> (and (finite_set X) (subset F (powerset X))) (<= (size F) (sum (integer_range 0 (vc_dimension F)) (lambda (k) (binom (size X) k))))))
  hard_negative:
    statement: 同じ条件で$|\mathcal{A}|\le\binom{n}{d}$である。
    reason: $X$の部分集合全体では$d=n$、$|\mathcal{A}|=2^n$であるが、$\binom{n}{n}=1$である。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (𝒜 : Finset (Finset α)), 𝒜.card ≤ ∑ k ∈ Finset.Iic 𝒜.vcDim, (Fintype.card α).choose k
  proof: |
    by
      intro α _ _ 𝒜
      exact 𝒜.card_le_card_shatterer.trans 𝒜.card_shatterer_le_sum_vcDim
- id: shatters_subset_mono
  kind: gap
  level: 2
  topic: 組合せ論・集合族の打ち砕き
  statement: 集合族$\mathcal{A}$が$s$を打ち砕くなら、$t\subseteq s$である任意の$t$も打ち砕く。
  statement_en: If a family A shatters s, then it shatters every subset t of s.
  assumptions:
  - $\mathcal{A}$は有限集合の族
  - $\mathcal{A}$は$s$を打ち砕く
  - $t\subseteq s$
  quantifiers:
  - 任意の族$\mathcal{A}$と集合$s,t$
  conclusion: $\mathcal{A}$は$t$を打ち砕く。
  answer: |
    $\mathcal{A}$を有限集合の族、$s$を$\mathcal{A}$が打ち砕く集合、$t\subseteq s$とする。$u\subseteq t$を任意にとる。$u\subseteq s$なので、打ち砕く仮定より$s\cap S=u$となる$S\in\mathcal{A}$がある。

    $t\subseteq s$より$t\cap S=t\cap(s\cap S)=t\cap u=u$である。よって$\mathcal{A}$は$t$を打ち砕く。
  strategy: Intersect the witness for a subset of t with the smaller set t.
  sketch:
  - 'setup: Take u contained in t, so u is contained in s.'
  - 'derive: There is S in A with s ∩ S = u.'
  - 'conclude: Then t ∩ S = t ∩ u = u.'
  openmath: (forall (F s t) (-> (and (subset t s) (shatters F s)) (shatters F t)))
  hard_negative:
    statement: $\mathcal{A}$が$s$を打ち砕くなら、$s$を含む任意の集合も打ち砕く。
    reason: $\mathcal{A}=\{\emptyset\}$は$\emptyset$を打ち砕くが、$\{1\}$は打ち砕かない。
  target: |
    ∀ (α : Type*) [DecidableEq α] (𝒜 : Finset (Finset α)) (s t : Finset α), t ⊆ s → 𝒜.Shatters s → 𝒜.Shatters t
  proof: |
    by
      intro α _ 𝒜 s t h hs
      exact hs.mono_right h
- id: intersecting_family_at_most_half
  kind: gap
  level: 2
  topic: 組合せ論・交わる集合族
  statement: $n$元集合の部分集合族$\mathcal{A}$のどの二つの元（同じ元でもよい）も共通元を持つなら、$2|\mathcal{A}|\le 2^n$である。
  statement_en: If any two members, possibly equal, of a family A of subsets of an n-element set have a common element, then 2|A| ≤ 2^n.
  assumptions:
  - $X$は$n$元集合
  - $\mathcal{A}$は$X$の部分集合族で、どの二つの元（同じ元でもよい）も共通元を持つ
  quantifiers:
  - 任意の有限集合$X$と族$\mathcal{A}$
  conclusion: $2|\mathcal{A}|\le 2^n$である。
  answer: |
    $X$を$n$元集合、$\mathcal{A}$を条件を満たす族とする。$X$の部分集合を、補集合との組$\{S,X\setminus S\}$に分ける。$S\neq X\setminus S$である組は$2^{n-1}$個あり、$n=0$では$S=X\setminus S=\emptyset$の一つである。

    $S$と$X\setminus S$は共通元を持たないので、$\mathcal{A}$は各組から高々一つしか含まない。同じ元でも共通元を持つので、$\mathcal{A}$は空集合を含まない。$n=0$では$\mathcal{A}$は空で成り立つ。$n\ge 1$では$|\mathcal{A}|\le 2^{n-1}$である。よって$2|\mathcal{A}|\le 2^n$である。
  strategy: A member and its complement are disjoint, so the family has at most one set from each complementary pair.
  sketch:
  - 'setup: Pair each subset with its complement.'
  - 'derive: The family contains at most one set from each pair.'
  - 'case_split: For n = 0 the family is empty.'
  - 'conclude: Otherwise there are 2^(n-1) pairs.'
  openmath: (forall (X F) (-> (and (finite_set X) (subset F (powerset X)) (intersecting_family F)) (<= (* 2 (size F)) (^ 2 (size X)))))
  hard_negative:
    statement: $n\ge 2$のとき同じ条件で$|\mathcal{A}|\le 2^{n-2}$である。
    reason: $X=\{1,2\}$、$\mathcal{A}=\{\{1\},\{1,2\}\}$は条件を満たし、$|\mathcal{A}|=2$は$2^0=1$より大きい。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (𝒜 : Finset (Finset α)), (𝒜 : Set (Finset α)).Intersecting → 2 * 𝒜.card ≤ 2 ^ Fintype.card α
  proof: |
    by
      intro α _ _ 𝒜 h
      simpa using h.card_le
- id: intersecting_family_extends_to_half
  kind: gap
  level: 3
  topic: 組合せ論・交わる集合族
  statement: 空でない$n$元集合の部分集合族$\mathcal{A}$のどの二つの元（同じ元でもよい）も共通元を持つなら、同じ性質を持ち$\mathcal{A}$を含む族$\mathcal{B}$で$2|\mathcal{B}|=2^n$となるものが存在する。
  statement_en: If any two members, possibly equal, of a family A of subsets of a nonempty n-element set have a common element, then A is contained in a family B with the same property and 2|B| = 2^n.
  assumptions:
  - $X$は空でない$n$元集合
  - $\mathcal{A}$は$X$の部分集合族で、どの二つの元（同じ元でもよい）も共通元を持つ
  quantifiers:
  - 任意の空でない有限集合$X$と族$\mathcal{A}$
  conclusion: $\mathcal{A}\subseteq\mathcal{B}$、$2|\mathcal{B}|=2^n$で同じ性質を持つ$\mathcal{B}$が存在する。
  answer: |
    $X$を空でない$n$元集合、$\mathcal{A}$を条件を満たす族とする。部分集合族は有限個なので、条件を満たし$\mathcal{A}$を含む族のうち極大なもの$\mathcal{B}$がとれる。

    任意の$S\subseteq X$について$S\in\mathcal{B}$または$X\setminus S\in\mathcal{B}$であることを示す。$S\notin\mathcal{B}$とする。$\mathcal{B}$の任意の元$U$が$X\setminus S$と交わることを示せば、極大性より$X\setminus S\in\mathcal{B}$である。

    $S=\emptyset$なら$X\setminus S=X$は空でなく、$\mathcal{B}$の元は空でないので、すべての元$U$と交わる。$S\ne\emptyset$なら、極大性より$\mathcal{B}\cup\{S\}$は条件を満たさないので、$\mathcal{B}$の元$T$で$S$と交わらないものがある。すると$T\subseteq X\setminus S$である。$T$は$\mathcal{B}$の任意の元$U$と交わるので、$X\setminus S$も$U$と交わる。$X\setminus S$自身も$T$を含むので空でない。

    $S$と$X\setminus S$は交わらないので、$\mathcal{B}$は各組$\{S,X\setminus S\}$からちょうど一つを含む。$n\ge 1$より組は$2^{n-1}$個あるので$2|\mathcal{B}|=2^n$である。
  strategy: Take a maximal intersecting family and show it contains exactly one set of each complementary pair.
  sketch:
  - 'setup: Choose a maximal intersecting family B containing A.'
  - 'case_split: If S is not in B, treat S empty and S nonempty.'
  - 'derive: The complement of S meets every member of B, so it belongs to B.'
  - 'derive: Exactly one set of each complementary pair lies in B.'
  - 'conclude: Since n ≥ 1, the family has 2^(n-1) members.'
  openmath: (forall (X F) (-> (and (finite_set X) (!= X emptyset) (subset F (powerset X)) (intersecting_family F)) (exists (H) (and (subset F H) (subset H (powerset X)) (intersecting_family H) (= (* 2 (size H)) (^ 2 (size X)))))))
  hard_negative:
    statement: $X$が空でも同じ$\mathcal{B}$が存在する。
    reason: $X=\emptyset$では$2^0=1$であり、$2|\mathcal{B}|=1$を満たす$\mathcal{B}$はない。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] [Nonempty α] (𝒜 : Finset (Finset α)), (𝒜 : Set (Finset α)).Intersecting → ∃ ℬ : Finset (Finset α), 𝒜 ⊆ ℬ ∧ 2 * ℬ.card = 2 ^ Fintype.card α ∧ (ℬ : Set (Finset α)).Intersecting
  proof: |
    by
      intro α _ _ _ 𝒜 h
      simpa using h.exists_card_eq
- id: maximal_intersecting_family_upper_closed
  kind: gap
  level: 2
  topic: 組合せ論・交わる集合族
  statement: 有限集合$X$の部分集合族$\mathcal{A}$がどの二つの元（同じ元でもよい）も共通元を持つ性質について極大なら、$\mathcal{A}$は上に閉じている。すなわち$S\in\mathcal{A}$、$S\subseteq T\subseteq X$なら$T\in\mathcal{A}$である。
  statement_en: A family of subsets of a finite set X that is maximal among families in which any two members, possibly equal, have a common element is closed under supersets.
  assumptions:
  - $X$は有限集合
  - $\mathcal{A}$は$X$の部分集合族で、どの二つの元（同じ元でもよい）も共通元を持つ
  - $\mathcal{A}$はこの性質について極大
  quantifiers:
  - 任意の有限集合$X$と族$\mathcal{A}$
  conclusion: $\mathcal{A}$は上に閉じている。
  answer: |
    $X$を有限集合、$\mathcal{A}$を条件を満たす極大な族とする。$S\in\mathcal{A}$、$S\subseteq T\subseteq X$とする。族$\mathcal{A}\cup\{T\}$が同じ性質を持つことを示す。

    $U\in\mathcal{A}$なら$S$と$U$は共通元を持ち、その元は$T$にも属するので$T$と$U$は交わる。また$S$は同じ元の条件より空でないので、$T$も空でなく、$T$は自分自身と交わる。よって$\mathcal{A}\cup\{T\}$は性質を持つ。

    極大性より$\mathcal{A}\cup\{T\}=\mathcal{A}$であり、$T\in\mathcal{A}$である。
  strategy: Show that adding a superset keeps the intersecting property and apply maximality.
  sketch:
  - 'setup: Take S in A and a superset T.'
  - 'derive: T meets every member of A because S does, and T is nonempty.'
  - 'conclude: Maximality forces T to belong to A.'
  openmath: (forall (X F) (-> (and (finite_set X) (subset F (powerset X)) (intersecting_family F) (forall (H) (-> (and (subset F H) (subset H (powerset X)) (intersecting_family H)) (= F H)))) (upper_family F X)))
  hard_negative:
    statement: 極大な族$\mathcal{A}$は下にも閉じている。
    reason: $X=\{1,2\}$で$\mathcal{A}=\{\{1\},\{1,2\}\}$は極大だが、$\emptyset\subset\{1\}$であり$\emptyset\notin\mathcal{A}$である。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (𝒜 : Finset (Finset α)), (𝒜 : Set (Finset α)).Intersecting → (∀ ℬ : Finset (Finset α), (ℬ : Set (Finset α)).Intersecting → 𝒜 ⊆ ℬ → 𝒜 = ℬ) → IsUpperSet (𝒜 : Set (Finset α))
  proof: |
    by
      intro α _ _ 𝒜 h hmax
      exact h.isUpperSet' hmax
- id: kleitman_union_intersecting_families
  kind: textbook
  level: 3
  topic: 組合せ論・交わる集合族
  statement: Kleitman の定理。空でない$n$元集合の部分集合族$\mathcal{F}_1,\dots,\mathcal{F}_k$（$k\le n$）がそれぞれ、どの二つの元（同じ元でもよい）も共通元を持つなら、$\left|\bigcup_{i}\mathcal{F}_i\right|\le 2^n-2^{n-k}$である。
  statement_en: Kleitman's theorem. If F_1, ..., F_k, with k ≤ n, are families of subsets of a nonempty n-element set and in each family any two members, possibly equal, have a common element, then their union has at most 2^n - 2^(n-k) members.
  assumptions:
  - $X$は空でない$n$元集合
  - $k\le n$
  - 各$\mathcal{F}_i$は$X$の部分集合族で、どの二つの元（同じ元でもよい）も共通元を持つ
  quantifiers:
  - 任意の有限集合$X$と族$\mathcal{F}_1,\dots,\mathcal{F}_k$
  conclusion: $\left|\bigcup_i\mathcal{F}_i\right|\le 2^n-2^{n-k}$である。
  answer: |
    $X$を空でない$n$元集合、$k\le n$とし、$\mathcal{F}_1,\dots,\mathcal{F}_k$を条件を満たす族とする。各$\mathcal{F}_i$を含む極大な族$\mathcal{G}_i$をとる。既知のとおり極大な族は上に閉じていて、$|\mathcal{G}_i|=2^{n-1}$である。$\bigcup_i\mathcal{F}_i\subseteq\bigcup_i\mathcal{G}_i$なので、$\bigcup_i\mathcal{G}_i$を評価すればよい。

    $\mathcal{L}_i$を$\mathcal{G}_i$の補族（$X$の部分集合のうち$\mathcal{G}_i$に属さないもの）とする。$\mathcal{L}_i$は下に閉じ、$|\mathcal{L}_i|=2^{n-1}$である。Harris-Kleitman の不等式によれば、下に閉じた族$\mathcal{L},\mathcal{M}$について$|\mathcal{L}||\mathcal{M}|\le 2^n|\mathcal{L}\cap\mathcal{M}|$である。下に閉じた族の共通部分は下に閉じているので、$j$についての帰納法で$\left|\bigcap_{i\le j}\mathcal{L}_i\right|\ge 2^{n-j}$を得る。$j+1$の段階では$2^{n-j}\cdot 2^{n-1}\le 2^n\left|\bigcap_{i\le j+1}\mathcal{L}_i\right|$である。

    $\bigcup_i\mathcal{G}_i$の補族は$\bigcap_i\mathcal{L}_i$なので、$\left|\bigcup_i\mathcal{G}_i\right|\le 2^n-2^{n-k}$である。
  strategy: Extend each family to a maximal one and apply Harris-Kleitman to the complementary lower sets.
  sketch:
  - 'setup: Extend each family to a maximal intersecting family of size 2^(n-1), which is upward closed.'
  - 'derive: The complements are lower sets of size 2^(n-1).'
  - 'apply_theorem: Harris-Kleitman gives a lower bound for intersections of lower sets.'
  - 'induction: The intersection of k complements has at least 2^(n-k) members.'
  - 'conclude: Taking complements gives the bound for the union.'
  openmath: (forall (X s f) (-> (and (finite_set X) (!= X emptyset) (finite_set s) (<= (size s) (size X)) (forall (i) (-> (in i s) (and (subset (family_value f i) (powerset X)) (intersecting_family (family_value f i)))))) (<= (size (indexed_union_over s f)) (- (^ 2 (size X)) (^ 2 (- (size X) (size s)))))))
  hard_negative:
    statement: 同じ条件で$\left|\bigcup_i\mathcal{F}_i\right|\le 2^{n-1}$である。
    reason: $X=\{1,2\}$、$\mathcal{F}_1=\{\{1\},\{1,2\}\}$、$\mathcal{F}_2=\{\{2\},\{1,2\}\}$では和集合の大きさは$3$であり、$2^1=2$より大きい。
  target: |
    ∀ (α ι : Type*) [Fintype α] [DecidableEq α] [Nonempty α] (s : Finset ι) (f : ι → Finset (Finset α)), s.card ≤ Fintype.card α → (∀ i ∈ s, (f i : Set (Finset α)).Intersecting) → (s.biUnion f).card ≤ 2 ^ Fintype.card α - 2 ^ (Fintype.card α - s.card)
  proof: |
    by
      intro α ι _ _ _ s f _ h
      classical
      exact Finset.card_biUnion_le_of_intersecting s f h
- id: harris_kleitman_lower_sets
  kind: textbook
  level: 3
  topic: 組合せ論・Harris-Kleitman の不等式
  statement: Harris-Kleitman の不等式。$n$元集合の部分集合族$\mathcal{A},\mathcal{B}$がともに下に閉じているなら、$|\mathcal{A}||\mathcal{B}|\le 2^n|\mathcal{A}\cap\mathcal{B}|$である。
  statement_en: Harris-Kleitman inequality. If families A and B of subsets of an n-element set are both closed under taking subsets, then |A||B| ≤ 2^n |A ∩ B|.
  assumptions:
  - $X$は$n$元集合
  - $\mathcal{A},\mathcal{B}$は$X$の部分集合族で、ともに下に閉じている
  quantifiers:
  - 任意の有限集合$X$と族$\mathcal{A},\mathcal{B}$
  conclusion: $|\mathcal{A}||\mathcal{B}|\le 2^n|\mathcal{A}\cap\mathcal{B}|$である。
  answer: |
    $X$を$n$元集合、$\mathcal{A},\mathcal{B}$を$X$の部分集合族でともに下に閉じているものとする。$n$についての帰納法で示す。$n=0$では部分集合は$\emptyset$だけであり、$\mathcal{A},\mathcal{B}$がともに$\{\emptyset\}$のときは$1\le 1$、それ以外では左辺が$0$である。

    $n\ge 1$とし、$a\in X$をとり、$Y=X\setminus\{a\}$とする。$\mathcal{A}_0=\{S\in\mathcal{A}\mid a\notin S\}$、$\mathcal{A}_1=\{S\setminus\{a\}\mid S\in\mathcal{A},\,a\in S\}$とおき、$\mathcal{B}$についても同様にする。これらは$Y$の部分集合の下に閉じた族である。$\mathcal{A}$が下に閉じているので$\mathcal{A}_1\subseteq\mathcal{A}_0$であり、$\mathcal{B}_1\subseteq\mathcal{B}_0$である。

    $|\mathcal{A}\cap\mathcal{B}|=|\mathcal{A}_0\cap\mathcal{B}_0|+|\mathcal{A}_1\cap\mathcal{B}_1|$である。帰納法の仮定より
    $2^n|\mathcal{A}\cap\mathcal{B}|=2\left(2^{n-1}|\mathcal{A}_0\cap\mathcal{B}_0|+2^{n-1}|\mathcal{A}_1\cap\mathcal{B}_1|\right)\ge 2\left(|\mathcal{A}_0||\mathcal{B}_0|+|\mathcal{A}_1||\mathcal{B}_1|\right)$
    である。$|\mathcal{A}_0|\ge|\mathcal{A}_1|$、$|\mathcal{B}_0|\ge|\mathcal{B}_1|$より$\left(|\mathcal{A}_0|-|\mathcal{A}_1|\right)\left(|\mathcal{B}_0|-|\mathcal{B}_1|\right)\ge 0$なので、最後の式は$\left(|\mathcal{A}_0|+|\mathcal{A}_1|\right)\left(|\mathcal{B}_0|+|\mathcal{B}_1|\right)=|\mathcal{A}||\mathcal{B}|$以上である。
  strategy: Induct on the ground set by splitting at an element and use a Chebyshev-type product inequality.
  sketch:
  - 'induction: Induct on n, with n = 0 checked directly.'
  - 'construct: Split both families at an element a.'
  - 'derive: The lower-set property gives A_1 ⊆ A_0 and B_1 ⊆ B_0.'
  - 'derive: The inductive hypothesis bounds both parts of the intersection.'
  - 'conclude: The nonnegative product of the differences gives the final inequality.'
  openmath: (forall (X F G) (-> (and (finite_set X) (subset F (powerset X)) (subset G (powerset X)) (lower_family F) (lower_family G)) (<= (* (size F) (size G)) (* (^ 2 (size X)) (size (inter F G))))))
  hard_negative:
    statement: 下に閉じているとは限らない族でも$|\mathcal{A}||\mathcal{B}|\le 2^n|\mathcal{A}\cap\mathcal{B}|$である。
    reason: $n=1$で$\mathcal{A}=\{\emptyset\}$、$\mathcal{B}=\{\{x\}\}$とすると、左辺は$1$、右辺は$0$である。$\mathcal{B}$は下に閉じていない。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (𝒜 ℬ : Finset (Finset α)), IsLowerSet (𝒜 : Set (Finset α)) → IsLowerSet (ℬ : Set (Finset α)) → 𝒜.card * ℬ.card ≤ 2 ^ Fintype.card α * (𝒜 ∩ ℬ).card
  proof: |
    by
      intro α _ _ 𝒜 ℬ h1 h2
      exact h1.le_card_inter_finset h2
- id: harris_kleitman_upper_lower_negative
  kind: gap
  level: 3
  topic: 組合せ論・Harris-Kleitman の不等式
  statement: $n$元集合の部分集合族$\mathcal{A}$が上に閉じ、$\mathcal{B}$が下に閉じているなら、$2^n|\mathcal{A}\cap\mathcal{B}|\le|\mathcal{A}||\mathcal{B}|$である。
  statement_en: If a family A of subsets of an n-element set is closed under supersets and B is closed under subsets, then 2^n |A ∩ B| ≤ |A||B|.
  assumptions:
  - $X$は$n$元集合
  - $\mathcal{A}$は上に閉じ、$\mathcal{B}$は下に閉じている
  quantifiers:
  - 任意の有限集合$X$と族$\mathcal{A},\mathcal{B}$
  conclusion: $2^n|\mathcal{A}\cap\mathcal{B}|\le|\mathcal{A}||\mathcal{B}|$である。
  answer: |
    $X$を$n$元集合、$\mathcal{A}$を上に閉じた族、$\mathcal{B}$を下に閉じた族とする。$\mathcal{A}^c$を$X$の部分集合のうち$\mathcal{A}$に属さないものの族とすると、$\mathcal{A}$が上に閉じているので$\mathcal{A}^c$は下に閉じている。$|\mathcal{A}^c|=2^n-|\mathcal{A}|$である。

    下に閉じた族についての Harris-Kleitman の不等式より$|\mathcal{A}^c||\mathcal{B}|\le 2^n|\mathcal{A}^c\cap\mathcal{B}|$である。$|\mathcal{A}^c\cap\mathcal{B}|=|\mathcal{B}|-|\mathcal{A}\cap\mathcal{B}|$なので
    $\left(2^n-|\mathcal{A}|\right)|\mathcal{B}|\le 2^n|\mathcal{B}|-2^n|\mathcal{A}\cap\mathcal{B}|$
    である。整理すると$2^n|\mathcal{A}\cap\mathcal{B}|\le|\mathcal{A}||\mathcal{B}|$である。
  strategy: Apply Harris-Kleitman to the complement of A and B, then rearrange.
  sketch:
  - 'translate: The complement of the upper family A is a lower family.'
  - 'apply_theorem: Apply Harris-Kleitman to the complement of A and B.'
  - 'derive: Expand the sizes of the complement and of its intersection with B.'
  - 'conclude: Rearrangement gives the inequality.'
  openmath: (forall (X F G) (-> (and (finite_set X) (subset F (powerset X)) (subset G (powerset X)) (upper_family F X) (lower_family G)) (<= (* (^ 2 (size X)) (size (inter F G))) (* (size F) (size G)))))
  hard_negative:
    statement: 上に閉じた族$\mathcal{A}$と上に閉じた族$\mathcal{B}$についても$2^n|\mathcal{A}\cap\mathcal{B}|\le|\mathcal{A}||\mathcal{B}|$である。
    reason: $n=1$で$\mathcal{A}=\mathcal{B}=\{\{x\}\}$とすると、左辺は$2$、右辺は$1$である。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (𝒜 ℬ : Finset (Finset α)), IsUpperSet (𝒜 : Set (Finset α)) → IsLowerSet (ℬ : Set (Finset α)) → 2 ^ Fintype.card α * (𝒜 ∩ ℬ).card ≤ 𝒜.card * ℬ.card
  proof: |
    by
      intro α _ _ 𝒜 ℬ h1 h2
      exact h1.card_inter_le_finset h2
- id: daykin_meets_joins_inequality
  kind: named
  level: 4
  topic: 組合せ論・Daykin の不等式
  statement: Daykin の不等式。有限集合の族$\mathcal{A},\mathcal{B}$について、$\mathcal{A}\wedge\mathcal{B}=\{S\cap T\}$、$\mathcal{A}\vee\mathcal{B}=\{S\cup T\}$（$S\in\mathcal{A}$、$T\in\mathcal{B}$）とおくと、$|\mathcal{A}||\mathcal{B}|\le|\mathcal{A}\wedge\mathcal{B}||\mathcal{A}\vee\mathcal{B}|$である。
  statement_en: Daykin inequality. For finite families A, B of finite sets, |A||B| ≤ |A ∧ B||A ∨ B|, where A ∧ B and A ∨ B consist of the intersections and the unions of members.
  assumptions:
  - $\mathcal{A},\mathcal{B}$は有限集合の有限な族
  quantifiers:
  - 任意の族$\mathcal{A},\mathcal{B}$
  conclusion: $|\mathcal{A}||\mathcal{B}|\le|\mathcal{A}\wedge\mathcal{B}||\mathcal{A}\vee\mathcal{B}|$である。
  answer: |
    $\mathcal{A},\mathcal{B}$を有限集合の有限な族とする。すべての元を含む有限集合$X$をとる。Ahlswede-Daykin の四関数定理を、次の形で$|X|$についての帰納法で示す。$X$の部分集合上の非負実数値関数$f_1,f_2,f_3,f_4$がすべての$a,b\subseteq X$で$f_1(a)f_2(b)\le f_3(a\cap b)f_4(a\cup b)$を満たすなら、$\left(\sum_af_1(a)\right)\left(\sum_af_2(a)\right)\le\left(\sum_af_3(a)\right)\left(\sum_af_4(a)\right)$である。

    $X=\emptyset$では仮定そのものである。$X=Y\cup\{z\}$（$z\notin Y$）とし、$a\subseteq Y$について$g_i(a)=f_i(a)+f_i(a\cup\{z\})$とおく。$\sum_{a\subseteq Y}g_i(a)=\sum_{a\subseteq X}f_i(a)$なので、$g_1,\dots,g_4$が$Y$で同じ条件を満たすことを示せばよい。

    $a,b\subseteq Y$を固定し、$c=a\cap b$、$d=a\cup b$とする。$p_0=f_1(a)$、$p_1=f_1(a\cup\{z\})$、$q_0=f_2(b)$、$q_1=f_2(b\cup\{z\})$、$u_0=f_3(c)$、$u_1=f_3(c\cup\{z\})$、$w_0=f_4(d)$、$w_1=f_4(d\cup\{z\})$とおく。仮定を四通りの組に使うと、$p_0q_0\le u_0w_0$、$p_0q_1\le u_0w_1$、$p_1q_0\le u_0w_1$、$p_1q_1\le u_1w_1$である。示すことは$(p_0+p_1)(q_0+q_1)\le(u_0+u_1)(w_0+w_1)$である。

    $u_0=0$なら$p_0q_0,p_0q_1,p_1q_0$はすべて$0$なので、左辺は$p_1q_1\le u_1w_1$である。$w_1=0$なら$p_0q_1,p_1q_0,p_1q_1$はすべて$0$なので、左辺は$p_0q_0\le u_0w_0$である。

    $t=u_0w_1>0$とする。$u_1w_0=\frac{(u_1w_1)(u_0w_0)}{t}\ge\frac{(p_1q_1)(p_0q_0)}{t}=\frac{(p_0q_1)(p_1q_0)}{t}$なので、右辺は$p_0q_0+p_1q_1+t+\frac{(p_0q_1)(p_1q_0)}{t}$以上である。$p_0q_1\le t$、$p_1q_0\le t$より$(t-p_0q_1)(t-p_1q_0)\ge 0$であり、これは$t+\frac{(p_0q_1)(p_1q_0)}{t}\ge p_0q_1+p_1q_0$を意味する。よって右辺は$p_0q_0+p_1q_1+p_0q_1+p_1q_0$以上であり、これは左辺に等しい。

    $\mathcal{A}\wedge\mathcal{B}=\{S\cap T\}$、$\mathcal{A}\vee\mathcal{B}=\{S\cup T\}$（$S\in\mathcal{A}$、$T\in\mathcal{B}$）とし、$f_1,f_2,f_3,f_4$を$\mathcal{A},\mathcal{B},\mathcal{A}\wedge\mathcal{B},\mathcal{A}\vee\mathcal{B}$の指示関数とする。$f_1(a)f_2(b)=1$なら$a\in\mathcal{A}$、$b\in\mathcal{B}$であり、$a\cap b\in\mathcal{A}\wedge\mathcal{B}$、$a\cup b\in\mathcal{A}\vee\mathcal{B}$なので、右辺も$1$である。したがって条件が成り立ち、定理より$|\mathcal{A}||\mathcal{B}|\le|\mathcal{A}\wedge\mathcal{B}||\mathcal{A}\vee\mathcal{B}|$である。
  strategy: Prove the four functions theorem by induction on the ground set and apply it to the indicator functions of the four families.
  sketch:
  - 'setup: Work in the Boolean lattice of a finite set containing all members.'
  - 'induction: Reduce the four functions theorem from X to X minus a point by summing each function over the two extensions.'
  - 'derive: The one-point step is the inequality obtained from (t - p)(t - q) ≥ 0.'
  - 'construct: Take the indicators of A, B, the meets and the joins, which satisfy the pointwise hypothesis.'
  - 'conclude: The four functions theorem on the whole lattice gives the inequality.'
  openmath: (forall (F G) (-> (and (finite_set F) (finite_set G)) (<= (* (size F) (size G)) (* (size (family_meets F G)) (size (family_joins F G))))))
  hard_negative:
    statement: 同じ族について$|\mathcal{A}||\mathcal{B}|\le|\mathcal{A}\wedge\mathcal{B}|$である。
    reason: $\mathcal{A}=\mathcal{B}=\{\emptyset,\{1\}\}$なら$|\mathcal{A}||\mathcal{B}|=4$であるが、$\mathcal{A}\wedge\mathcal{B}=\{\emptyset,\{1\}\}$の大きさは$2$である。
  target: |
    ∀ (α : Type*) [DecidableEq α] (𝒜 ℬ : Finset (Finset α)), 𝒜.card * ℬ.card ≤ (Finset.image₂ (fun a b => a ∩ b) 𝒜 ℬ).card * (Finset.image₂ (fun a b => a ∪ b) 𝒜 ℬ).card
  proof: |
    by
      intro α _ 𝒜 ℬ
      exact Finset.le_card_infs_mul_card_sups 𝒜 ℬ
- id: marica_schonheim_differences
  kind: textbook
  level: 4
  topic: 組合せ論・差集合の個数
  statement: マリカ・シェーンハイムの不等式（Daykin の不等式を既習とする）。有限集合の有限な族$\mathcal{A}$について、差の族$\{S\setminus T\mid S,T\in\mathcal{A}\}$の大きさは$|\mathcal{A}|$以上である。
  statement_en: Marica-Schönheim inequality, assuming the Daykin inequality. For a finite family A of finite sets, the family of differences S \ T with S, T in A has at least |A| members.
  assumptions:
  - $\mathcal{A}$は有限集合の有限な族
  - 既習の事実として Daykin の不等式を用いる
  quantifiers:
  - 任意の族$\mathcal{A}$
  conclusion: $\left|\{S\setminus T\mid S,T\in\mathcal{A}\}\right|\ge|\mathcal{A}|$である。
  answer: |
    $\mathcal{A}$を有限集合の有限な族とし、すべての元を含む有限集合$X$をとる。$\mathcal{B}=\{X\setminus T\mid T\in\mathcal{A}\}$とおくと$|\mathcal{B}|=|\mathcal{A}|$である。$\mathcal{D}=\{S\setminus T\mid S,T\in\mathcal{A}\}$とおく。

    $\mathcal{A}\wedge\mathcal{B}$の元は$S\cap(X\setminus T)=S\setminus T$の形なので、$\mathcal{A}\wedge\mathcal{B}=\mathcal{D}$である。$\mathcal{A}\vee\mathcal{B}$の元は$S\cup(X\setminus T)=X\setminus(T\setminus S)$の形なので、$\mathcal{A}\vee\mathcal{B}$は$\mathcal{D}$の元の補集合の族であり、大きさは$|\mathcal{D}|$である。

    Daykin の不等式より$|\mathcal{A}|^2=|\mathcal{A}||\mathcal{B}|\le|\mathcal{D}|^2$である。よって$|\mathcal{A}|\le|\mathcal{D}|$である。
  strategy: Apply the Daykin inequality to the family and the complements of its members.
  sketch:
  - 'construct: Let B be the family of complements of members of A.'
  - 'derive: The meets of A and B are exactly the differences.'
  - 'derive: The joins of A and B are the complements of the differences.'
  - 'apply_theorem: Daykin gives |A|^2 ≤ |D|^2.'
  openmath: (forall (F) (-> (finite_set F) (<= (size F) (size (family_differences F F)))))
  hard_negative:
    statement: 差の族の大きさは常に$|\mathcal{A}|+1$以上である。
    reason: $\mathcal{A}=\{\emptyset\}$では差の族は$\{\emptyset\}$で大きさは$1$である。
  target: |
    ∀ (α : Type*) [DecidableEq α] (𝒜 : Finset (Finset α)), 𝒜.card ≤ (Finset.image₂ (fun a b => a \ b) 𝒜 𝒜).card
  proof: |
    by
      intro α _ 𝒜
      exact 𝒜.card_le_card_diffs
- id: numberings_with_given_prefix_count
  kind: gap
  level: 2
  topic: 組合せ論・接頭辞の数え上げ
  statement: $n$元集合$X$の部分集合$s$について、全単射$f:X\to\{0,\dots,n-1\}$のうち$s=\{a\in X\mid f(a)<|s|\}$を満たすものの個数は$|s|!\,(n-|s|)!$である。
  statement_en: For a subset s of an n-element set X, the number of bijections f from X onto {0,...,n-1} with s = {a in X | f(a) < |s|} is |s|! (n-|s|)!.
  assumptions:
  - $X$は$n$元集合
  - $s\subseteq X$
  quantifiers:
  - 任意の有限集合$X$と部分集合$s$
  conclusion: 条件を満たす全単射は$|s|!\,(n-|s|)!$個ある。
  answer: |
    $X$を$n$元集合、$s\subseteq X$、$r=|s|$とする。全単射$f:X\to\{0,\dots,n-1\}$が条件を満たすとは、$f$が$s$を$\{0,\dots,r-1\}$の上に写し、$X\setminus s$を$\{r,\dots,n-1\}$の上に写すことである。

    このような$f$は、全単射$s\to\{0,\dots,r-1\}$と全単射$X\setminus s\to\{r,\dots,n-1\}$の組と一対一に対応する。前者は$r!$個、後者は$(n-r)!$個ある。よって個数は$r!\,(n-r)!$である。
  strategy: Split a valid bijection into its restrictions to s and to the complement of s.
  sketch:
  - 'translate: The condition says f maps s onto {0,...,r-1} and the complement onto the rest.'
  - 'construct: Such f correspond to pairs of bijections on the two parts.'
  - 'conclude: The number of pairs is r!(n-r)!.'
  openmath: (forall (X s) (-> (and (finite_set X) (subset s X)) (= (size (numberings_with_prefix X s)) (* (factorial (size s)) (factorial (- (size X) (size s)))))))
  hard_negative:
    statement: 同じ全単射の個数は$\binom{n}{|s|}$である。
    reason: $n=2$、$|s|=1$では全単射は$1$個で$1!\,1!=1$だが、$\binom{2}{1}=2$である。
  target: |
    ∀ (X : Type*) [Fintype X] [DecidableEq X] (s : Finset X), (Finset.univ.filter (fun f : X ≃ Fin (Fintype.card X) => ∀ a, a ∈ s ↔ (f a : ℕ) < s.card)).card = s.card.factorial * (Fintype.card X - s.card).factorial
  proof: |
    by
      intro X _ _ s
      have := Numbering.card_prefixed s
      simpa [Numbering.prefixed, Numbering.IsPrefix] using this
- id: colex_order_binary_weight
  kind: gap
  level: 2
  topic: 組合せ論・余辞書式順序
  statement: 自然数の有限集合$s,t$について、$\sum_{i\in s}2^i<\sum_{i\in t}2^i$であることと、余辞書式順序で$s<t$（$s\ne t$で、対称差の最大元が$t$に属する）であることは同値である。
  statement_en: For finite sets s and t of natural numbers, the sum of 2^i over s is less than the sum of 2^i over t if and only if s < t in colexicographic order, that is s ≠ t and the maximum of the symmetric difference lies in t.
  assumptions:
  - $s,t$は自然数の有限集合
  - 余辞書式順序で$s<t$とは、$s\ne t$で対称差の最大元が$t$に属すること
  quantifiers:
  - 任意の自然数の有限集合$s,t$
  conclusion: $\sum_{i\in s}2^i<\sum_{i\in t}2^i$と余辞書式順序の$s<t$は同値である。
  answer: |
    $s,t$を自然数の有限集合とする。$s\cap t$の項は両辺に共通なので$\sum_{s}2^i-\sum_{t}2^i=\sum_{s\setminus t}2^i-\sum_{t\setminus s}2^i$である。

    余辞書式順序で$s<t$とする。対称差の最大元を$m$とすると$m\in t\setminus s$である。$s\setminus t$の元は$m$より小さいので$\sum_{s\setminus t}2^i\le\sum_{i<m}2^i=2^m-1<2^m\le\sum_{t\setminus s}2^i$である。よって$\sum_s2^i<\sum_t2^i$である。

    逆を示す。$\sum_s2^i<\sum_t2^i$なら$s\ne t$である。対称差の最大元が$s$に属するなら、上の議論で$s,t$を入れ替えて$\sum_t2^i<\sum_s2^i$となり矛盾する。よって最大元は$t$に属し、$s<t$である。
  strategy: Cancel the common part and compare the top element of the symmetric difference with a geometric sum.
  sketch:
  - 'derive: The common elements cancel from both sums.'
  - 'derive: If the maximum m of the symmetric difference lies in t, the rest of s contributes at most 2^m - 1.'
  - 'contradiction: For the converse, the opposite position of m would reverse the inequality.'
  - 'conclude: The two orders coincide.'
  openmath: (forall (s t) (-> (and (finite_set s) (finite_set t) (subset s N) (subset t N)) (<-> (< (sum s (lambda (i) (^ 2 i))) (sum t (lambda (i) (^ 2 i)))) (colex_lt s t))))
  hard_negative:
    statement: $\sum_{s}2^i<\sum_{t}2^i$と$|s|<|t|$は同値である。
    reason: $s=\{2\}$、$t=\{0,1\}$では$|s|<|t|$だが、$\sum_s2^i=4>3=\sum_t2^i$である。
  target: |
    ∀ (s t : Finset ℕ), ∑ i ∈ s, 2 ^ i < ∑ i ∈ t, 2 ^ i ↔ toColex s < toColex t
  proof: |
    by
      intro s t
      exact Finset.geomSum_lt_geomSum_iff_toColex_lt_toColex le_rfl
- id: down_compression_preserves_size
  kind: gap
  level: 3
  topic: 組合せ論・下方圧縮
  statement: 有限集合の族$\mathcal{A}$と元$a$について、下方圧縮$\mathcal{D}_a(\mathcal{A})=\{S\in\mathcal{A}\mid S\setminus\{a\}\in\mathcal{A}\}\cup\{S\setminus\{a\}\mid S\in\mathcal{A},\,S\setminus\{a\}\notin\mathcal{A}\}$は$|\mathcal{D}_a(\mathcal{A})|=|\mathcal{A}|$を満たす。
  statement_en: For a finite family A of finite sets and an element a, the down-compression D_a(A), consisting of S in A with S \ {a} in A and of S \ {a} for S in A with S \ {a} not in A, satisfies |D_a(A)| = |A|.
  assumptions:
  - $\mathcal{A}$は有限集合の有限な族
  - $a$は元
  quantifiers:
  - 任意の族$\mathcal{A}$と元$a$
  conclusion: $|\mathcal{D}_a(\mathcal{A})|=|\mathcal{A}|$である。
  answer: |
    $\mathcal{A}$を有限集合の有限な族、$a$を元とする。写像$\phi:\mathcal{A}\to\mathcal{D}_a(\mathcal{A})$を、$S\setminus\{a\}\in\mathcal{A}$なら$\phi(S)=S$、そうでなければ$\phi(S)=S\setminus\{a\}$と定める。定義より$\phi$は全射である。

    単射を示す。$\phi(S)=\phi(T)$とする。どちらも第一の場合なら$S=T$である。どちらも第二の場合、$S\setminus\{a\}=T\setminus\{a\}$である。$S\setminus\{a\}\notin\mathcal{A}$かつ$S\in\mathcal{A}$より$a\in S$であり、同様に$a\in T$なので、$S=T$である。一方が第一の場合で他方が第二の場合、$\phi(S)=S\in\mathcal{A}$、$\phi(T)=T\setminus\{a\}\notin\mathcal{A}$となり、等しくない。

    よって$\phi$は全単射であり、$|\mathcal{D}_a(\mathcal{A})|=|\mathcal{A}|$である。
  strategy: Construct an explicit bijection from A onto its compression.
  sketch:
  - 'construct: Send S to itself when S \ {a} is in A and to S \ {a} otherwise.'
  - 'derive: The map is surjective by the definition of the compression.'
  - 'case_split: Check injectivity for each pair of cases.'
  - 'conclude: The map is a bijection, so sizes are equal.'
  openmath: (forall (a F) (-> (finite_set F) (= (size (down_compression a F)) (size F))))
  hard_negative:
    statement: $\mathcal{D}_a(\mathcal{A})$の元の大きさの和は$\mathcal{A}$の元の大きさの和に等しい。
    reason: $\mathcal{A}=\{\{a\}\}$では$\mathcal{D}_a(\mathcal{A})=\{\emptyset\}$であり、和は$1$から$0$に減る。
  target: |
    ∀ (α : Type*) [DecidableEq α] (a : α) (𝒜 : Finset (Finset α)), (Down.compression a 𝒜).card = 𝒜.card
  proof: |
    by
      intro α _ a 𝒜
      exact Down.card_compression a 𝒜
- id: cauchy_davenport_zmod_prime
  kind: named
  level: 3
  topic: 組合せ論・加法的組合せ論
  statement: Cauchy-Davenport の定理。素数$p$と$\mathbb{Z}/p\mathbb{Z}$の空でない部分集合$A,B$について、$|A+B|\ge\min(p,\,|A|+|B|-1)$である。
  statement_en: Cauchy-Davenport theorem. For a prime p and nonempty subsets A and B of Z/pZ, |A + B| ≥ min(p, |A| + |B| - 1).
  assumptions:
  - $p$は素数
  - $A,B$は$\mathbb{Z}/p\mathbb{Z}$の空でない部分集合
  quantifiers:
  - 任意の素数$p$と部分集合$A,B$
  conclusion: $|A+B|\ge\min(p,\,|A|+|B|-1)$である。
  answer: |
    $p$を素数、$A,B$を$\mathbb{Z}/p\mathbb{Z}$の空でない部分集合とする。すべての$A$について成り立つことを、$|B|$についての帰納法で示す。$|B|=1$なら$|A+B|=|A|=|A|+|B|-1$である。

    $|B|\ge 2$とする。$|A|=p$なら$A+B$は全体で成り立つ。$|A|<p$とする。任意の$d\ne 0$は$\mathbb{Z}/p\mathbb{Z}$を生成するので、$A+d=A$となるのは$A$が全体か空のときに限る。$b\ne b'$を$B$の元とし$d=b'-b$とおくと、$a\in A$、$a+d\notin A$を満たす$a$がある。$e=a-b$とおき、$B$を$B+e$に置き換える。$|B+e|=|B|$、$|A+(B+e)|=|A+B|$であり、$a=b+e\in B+e$、$a+d=b'+e\notin A$である。したがって$b+e\in A\cap(B+e)$であり、$b'+e\in(B+e)\setminus A$である。

    そこで$B'=B+e$について、$A'=A\cup B'$、$B''=A\cap B'$とおくと$B''$は空でなく、$|B''|<|B'|$である。$A'+B''\subseteq A+B'$であり、$|A'|+|B''|=|A|+|B'|$である。実際、$x\in A$なら$x+y\in A+B'$（$y\in B''\subseteq B'$）であり、$x\in B'$なら$x+y$は$y\in A$と$x\in B'$の和である。

    帰納法の仮定より$|A+B|=|A+B'|\ge|A'+B''|\ge\min(p,|A'|+|B''|-1)=\min(p,|A|+|B|-1)$である。
  strategy: Induct on |B| using the Dyson e-transform after translating B so that it meets A but is not contained in A.
  sketch:
  - 'induction: Induct on |B|, the case |B| = 1 being immediate.'
  - 'derive: If A is proper, a nonzero difference d of B moves some element of A outside A, since d generates Z/pZ.'
  - 'construct: Translate B so that it meets A and has an element outside A.'
  - 'construct: Replace (A, B) with (A ∪ B, A ∩ B), which keeps the total size and shrinks the sumset.'
  - 'conclude: The inductive hypothesis gives the bound.'
  openmath: (forall (p s t) (-> (and (in p P) (subset s (zmod_ring p)) (subset t (zmod_ring p)) (!= s emptyset) (!= t emptyset)) (<= (min_of p (- (+ (size s) (size t)) 1)) (size (sumset s t)))))
  hard_negative:
    statement: $p$が合成数でも$\mathbb{Z}/p\mathbb{Z}$の空でない部分集合について同じ不等式が成り立つ。
    reason: $\mathbb{Z}/4\mathbb{Z}$で$A=B=\{0,2\}$とすると$|A+B|=2$であり、$\min(4,3)=3$より小さい。
  target: |
    ∀ (p : ℕ), p.Prime → ∀ (s t : Finset (ZMod p)), s.Nonempty → t.Nonempty → min p (s.card + t.card - 1) ≤ (Finset.image₂ (· + ·) s t).card
  proof: |
    by
      intro p hp s t hs ht
      exact ZMod.cauchy_davenport hp hs ht
- id: sumset_lower_bound_linear_order
  kind: gap
  level: 2
  topic: 組合せ論・和集合の評価
  statement: 全順序加法群の空でない有限部分集合$A,B$について、$|A|+|B|\le|A+B|+1$である。
  statement_en: For nonempty finite subsets A and B of a linearly ordered abelian group, |A| + |B| ≤ |A + B| + 1.
  assumptions:
  - $G$は全順序加法群（加法は順序を保つ可換群）
  - $A,B$は$G$の空でない有限部分集合
  quantifiers:
  - 任意の全順序加法群$G$と部分集合$A,B$
  conclusion: $|A|+|B|\le|A+B|+1$である。
  answer: |
    $G$を全順序加法群、$A,B$を空でない有限部分集合とする。$a_0=\max A$、$b_0=\min B$とおく。集合$A+b_0=\{a+b_0\mid a\in A\}$と$a_0+B=\{a_0+b\mid b\in B\}$を考える。どちらも$A+B$に含まれ、大きさはそれぞれ$|A|,|B|$である。

    $A+b_0$の元はすべて$a_0+b_0$以下であり、$a_0+B$の元はすべて$a_0+b_0$以上である。したがって二つの集合の共通部分は$\{a_0+b_0\}$の一点である。

    よって$|A+B|\ge|A|+|B|-1$である。
  strategy: Compare the two translates A + min B and max A + B, which meet in a single point.
  sketch:
  - 'construct: Let a_0 = max A and b_0 = min B.'
  - 'derive: A + b_0 and a_0 + B lie in A + B and have sizes |A| and |B|.'
  - 'derive: Their intersection is the single point a_0 + b_0 by monotonicity.'
  - 'conclude: Counting the union gives the bound.'
  openmath: (forall (G s t) (-> (and (ordered_abelian_group G) (subset s G) (subset t G) (finite_set s) (finite_set t) (!= s emptyset) (!= t emptyset)) (<= (+ (size s) (size t)) (+ (size (sumset s t)) 1))))
  hard_negative:
    statement: 任意の有限な加法群の空でない部分集合について$|A|+|B|\le|A+B|+1$である。
    reason: $\mathbb{Z}/2\mathbb{Z}$で$A=B=\mathbb{Z}/2\mathbb{Z}$とすると左辺は$4$、右辺は$3$である。
  target: |
    ∀ (α : Type*) [LinearOrder α] [AddCommGroup α] [IsOrderedAddMonoid α] (s t : Finset α), s.Nonempty → t.Nonempty → s.card + t.card ≤ (Finset.image₂ (· + ·) s t).card + 1
  proof: |
    by
      intro α _ _ _ s t hs ht
      have h : s.card + t.card - 1 ≤ (Finset.image₂ (· + ·) s t).card := cauchy_davenport_add_of_linearOrder_isCancelAdd hs ht
      have h1 := hs.card_pos
      omega
- id: sumset_elementary_bounds
  kind: gap
  level: 1
  topic: 組合せ論・和集合の評価
  statement: 加法群の空でない有限部分集合$A,B$について、$\max(|A|,|B|)\le|A+B|\le|A||B|$である。
  statement_en: For nonempty finite subsets A and B of an additive group, max(|A|, |B|) ≤ |A + B| ≤ |A||B|.
  assumptions:
  - $G$は加法群
  - $A,B$は$G$の空でない有限部分集合
  quantifiers:
  - 任意の加法群$G$と部分集合$A,B$
  conclusion: $\max(|A|,|B|)\le|A+B|\le|A||B|$である。
  answer: |
    $G$を加法群、$A,B$を空でない有限部分集合とする。$b\in B$をとる。写像$a\mapsto a+b$は単射で$A$を$A+B$の中に写すので$|A|\le|A+B|$である。$a\in A$をとると、$b\mapsto a+b$も単射で$B$を$A+B$の中に写すので$|B|\le|A+B|$である。

    写像$A\times B\to A+B$、$(a,b)\mapsto a+b$は全射なので$|A+B|\le|A||B|$である。
  strategy: Use translations for the lower bound and the addition map for the upper bound.
  sketch:
  - 'derive: Right translation by an element of B embeds A into A + B.'
  - 'derive: Left translation by an element of A embeds B into A + B.'
  - 'conclude: Addition maps A × B onto A + B.'
  openmath: (forall (G s t) (-> (and (group G) (subset s G) (subset t G) (finite_set s) (finite_set t) (!= s emptyset) (!= t emptyset)) (and (<= (max_of (size s) (size t)) (size (sumset s t))) (<= (size (sumset s t)) (* (size s) (size t))))))
  hard_negative:
    statement: 同じ条件で$|A+B|=|A||B|$である。
    reason: $\mathbb{Z}$で$A=B=\{0,1\}$とすると$A+B=\{0,1,2\}$であり、$|A+B|=3$、$|A||B|=4$である。
  target: |
    ∀ (G : Type*) [AddGroup G] [DecidableEq G] (A B : Finset G), A.Nonempty → B.Nonempty → max A.card B.card ≤ (Finset.image₂ (· + ·) A B).card ∧ (Finset.image₂ (· + ·) A B).card ≤ A.card * B.card
  proof: |
    by
      intro G _ _ A B hA hB
      exact ⟨max_le (Finset.card_le_card_add_right hB) (Finset.card_le_card_add_left hA), Finset.card_add_le⟩
- id: sumset_full_group_by_pigeonhole
  kind: gap
  level: 1
  topic: 組合せ論・和集合の評価
  statement: 有限可換群$G$の部分集合$A,B$が$|A|+|B|>|G|$を満たすなら$A+B=G$である。
  statement_en: If subsets A and B of a finite abelian group G satisfy |A| + |B| > |G|, then A + B = G.
  assumptions:
  - $G$は有限可換群
  - $A,B\subseteq G$
  - $|A|+|B|>|G|$
  quantifiers:
  - 任意の有限可換群$G$と部分集合$A,B$
  conclusion: $A+B=G$である。
  answer: |
    $G$を有限可換群、$A,B\subseteq G$で$|A|+|B|>|G|$とする。$g\in G$を任意にとり、$g-B=\{g-b\mid b\in B\}$とおく。写像$b\mapsto g-b$は単射なので$|g-B|=|B|$である。

    $|A|+|g-B|>|G|$なので$A$と$g-B$は交わる。$a=g-b$（$a\in A$、$b\in B$）とすると$g=a+b\in A+B$である。よって$A+B=G$である。
  strategy: Apply the pigeonhole principle to A and the reflected set g - B.
  sketch:
  - 'setup: Fix g and form g - B, which has size |B|.'
  - 'derive: Since |A| + |B| > |G|, the sets A and g - B intersect.'
  - 'conclude: An intersection point writes g as a sum.'
  openmath: (forall (G s t) (-> (and (abelian_group G) (finite_set G) (subset s G) (subset t G) (> (+ (size s) (size t)) (size G))) (= (sumset s t) G)))
  hard_negative:
    statement: $|A|+|B|=|G|$でも$A+B=G$である。
    reason: $\mathbb{Z}/4\mathbb{Z}$で$A=B=\{0,2\}$なら$|A|+|B|=4$であるが、$A+B=\{0,2\}$である。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [Fintype G] [DecidableEq G] (A B : Finset G), Fintype.card G < A.card + B.card → Finset.image₂ (· + ·) A B = Finset.univ
  proof: |
    by
      intro G _ _ _ A B h
      ext g
      simp only [Finset.mem_univ, iff_true, Finset.mem_image₂]
      have hd : ¬ Disjoint A (B.image (fun b => g - b)) := by
        intro hd
        have h1 := Finset.card_union_of_disjoint hd
        have h2 : (B.image (fun b => g - b)).card = B.card := Finset.card_image_of_injective _ (sub_right_injective)
        have h3 := Finset.card_le_univ (A ∪ B.image (fun b => g - b))
        omega
      obtain ⟨x, hx1, hx2⟩ := Finset.not_disjoint_iff.mp hd
      obtain ⟨b, hb, rfl⟩ := Finset.mem_image.mp hx2
      exact ⟨g - b, hx1, b, hb, sub_add_cancel g b⟩
- id: erdos_ginzburg_ziv_theorem
  kind: named
  level: 3
  topic: 組合せ論・エルデシュ・ギンツブルグ・ジヴの定理
  statement: エルデシュ・ギンツブルグ・ジヴの定理（Cauchy-Davenport の定理を既習とする）。自然数$n$と整数の族$(a_i)_{i\in S}$が$|S|\ge 2n-1$を満たすなら、$|T|=n$で$n\mid\sum_{i\in T}a_i$となる$T\subseteq S$が存在する。
  statement_en: Erdős-Ginzburg-Ziv theorem. If n is a natural number and (a_i) is a family of integers indexed by a set S with |S| ≥ 2n-1, then there is T ⊆ S with |T| = n and n dividing the sum of a_i over T.
  assumptions:
  - $n$は自然数
  - $(a_i)_{i\in S}$は整数の族で、$S$は有限集合
  - $|S|\ge 2n-1$（$n=0$では$T=\emptyset$をとる）
  quantifiers:
  - 任意の自然数$n$と整数の族
  conclusion: $|T|=n$で$n\mid\sum_{i\in T}a_i$となる$T\subseteq S$が存在する。
  answer: |
    $n$を自然数、$(a_i)_{i\in S}$を$|S|\ge 2n-1$の整数の族とする。$n=0$では$T=\emptyset$をとれば$0\mid 0$である。$n=1$では一元集合$T$をとればよい。

    まず$n=p$が素数の場合を示す。$|S|\ge 2p-1$なら$S$を$2p-1$個の添字に制限し、$a_i$の$p$での剰余で昇順に$a_1,\dots,a_{2p-1}$と並べる。ある$i\le p-1$で$a_i\equiv a_{i+p-1}\pmod p$なら、$a_i,\dots,a_{i+p-1}$はすべて合同で、$p$個の和は$p$で割り切れる。

    そうでなければ、$i=1,\dots,p-1$について$A_i=\{a_i,a_{i+p-1}\}$は$\mathbb{Z}/p\mathbb{Z}$の二元集合である。Cauchy-Davenport の定理を繰り返し使うと、$|A_1+\dots+A_{p-1}|\ge\min(p,(p-1)\cdot 2-(p-2))=p$なので、和は$\mathbb{Z}/p\mathbb{Z}$全体である。よって$-a_{2p-1}$が表せる。これは$A_i$から一つずつ選んだ$p-1$個と$a_{2p-1}$の和が$0$になることを意味する。添字はすべて異なるので、$p$個の和が$p$で割り切れる。

    次に一般の$n$を素因数の個数についての帰納法で示す。$n=pm$（$p$は素数）とし、$m$について成り立つとする。$|S|\ge 2pm-1$である。素数の場合を繰り返し使い、互いに素な$p$元集合$T_1,\dots,T_{2m-1}$で$p\mid\sum_{i\in T_j}a_i$を満たすものを選ぶ。$j$回目までに使った添字は$pj$個であり、$j\le 2m-2$では$2pm-1-pj\ge 2p-1$なので選べる。$b_j=\frac1p\sum_{i\in T_j}a_i$とおく。$m$についての主張から$|J|=m$で$m\mid\sum_{j\in J}b_j$となる$J$がある。$T=\bigcup_{j\in J}T_j$とすると$|T|=pm=n$で$\sum_{i\in T}a_i=p\sum_{j\in J}b_j$は$pm=n$で割り切れる。
  strategy: Prove the prime case with Cauchy-Davenport on two-element sets, then induct on the number of prime factors.
  sketch:
  - 'case_split: Dispose of n = 0 and n = 1.'
  - 'setup: For prime p, sort 2p-1 residues into a_1 ≤ ... ≤ a_{2p-1}.'
  - 'case_split: Either p consecutive residues coincide, or the pairs {a_i, a_{i+p-1}} have two elements.'
  - 'apply_theorem: Cauchy-Davenport shows the sum of the pairs covers Z/pZ.'
  - 'induction: For n = pm, pick 2m-1 disjoint p-subsets with sums divisible by p and apply the case m.'
  openmath: (forall (n s a) (-> (and (in n N) (finite_set s) (forall (i) (-> (in i s) (in (fn_value a i) Z))) (<= (- (* 2 n) 1) (size s))) (exists (t) (and (subset t s) (= (size t) n) (dvd n (sum t (lambda (i) (fn_value a i))))))))
  hard_negative:
    statement: $|S|\ge 2n-2$（$n\ge 2$）でも同じ結論が成り立つ。
    reason: $n=2$、$|S|=2$で$a_1=0$、$a_2=1$とすると、$2$元部分集合の和は$1$で$2$で割り切れない。
  target: |
    ∀ (n : ℕ) (ι : Type*) (s : Finset ι) (a : ι → ℤ), 2 * n - 1 ≤ s.card → ∃ t ⊆ s, t.card = n ∧ (n : ℤ) ∣ ∑ i ∈ t, a i
  proof: |
    by
      intro n ι s a h
      exact Int.erdos_ginzburg_ziv a h
- id: ruzsa_triangle_inequality_differences
  kind: gap
  level: 3
  topic: 組合せ論・Ruzsa の三角不等式
  statement: Ruzsa の三角不等式。可換加法群の有限部分集合$A,B,C$について、$|A-C|\,|B|\le|A-B|\,|C-B|$である。
  statement_en: Ruzsa triangle inequality. For finite subsets A, B, C of an additive abelian group, |A - C||B| ≤ |A - B||C - B|.
  assumptions:
  - $G$は可換加法群
  - $A,B,C$は$G$の有限部分集合
  quantifiers:
  - 任意の可換加法群$G$と部分集合$A,B,C$
  conclusion: $|A-C|\,|B|\le|A-B|\,|C-B|$である。
  answer: |
    $G$を可換加法群、$A,B,C$を有限部分集合とする。$A-C$の各元$x$について、表示$x=a_x-c_x$（$a_x\in A$、$c_x\in C$）を一つ固定する。

    写像$\phi:(A-C)\times B\to(A-B)\times(C-B)$を$\phi(x,b)=(a_x-b,\,c_x-b)$で定める。第一成分から第二成分を引くと$a_x-c_x=x$なので、$\phi(x,b)$から$x$が定まる。さらに$a_x$が定まるので、第一成分から$b$も定まる。よって$\phi$は単射である。

    したがって$|A-C|\,|B|\le|A-B|\,|C-B|$である。
  strategy: Construct an injection from (A - C) × B into (A - B) × (C - B) using fixed representations.
  sketch:
  - 'setup: Fix a representation x = a_x - c_x for each x in A - C.'
  - 'construct: Map (x, b) to (a_x - b, c_x - b).'
  - 'derive: The difference of the coordinates recovers x, and then b is determined.'
  - 'conclude: The injection gives the inequality.'
  openmath: (forall (G s t u) (-> (and (abelian_group G) (subset s G) (subset t G) (subset u G) (finite_set s) (finite_set t) (finite_set u)) (<= (* (size (difference_set s u)) (size t)) (* (size (difference_set s t)) (size (difference_set u t))))))
  hard_negative:
    statement: 同じ条件で$|A-C|\,|B|\le|A-B|$である。
    reason: $A=C=\{0,1\}$、$B=\{0\}$とすると$|A-C|\,|B|=3$であり、$|A-B|=2$である。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [DecidableEq G] (A B C : Finset G), (Finset.image₂ (· - ·) A C).card * B.card ≤ (Finset.image₂ (· - ·) A B).card * (Finset.image₂ (· - ·) C B).card
  proof: |
    by
      intro G _ _ A B C
      exact Finset.ruzsa_triangle_inequality_sub_sub_sub A B C
- id: ruzsa_triangle_inequality_sums
  kind: gap
  level: 3
  topic: 組合せ論・Ruzsa の三角不等式
  statement: 和についての Ruzsa の三角不等式。可換加法群の有限部分集合$A,B,C$について、$|A+C|\,|B|\le|A+B|\,|B+C|$である。
  statement_en: Ruzsa triangle inequality for sums. For finite subsets A, B, C of an additive abelian group, |A + C||B| ≤ |A + B||B + C|.
  assumptions:
  - $G$は可換加法群
  - $A,B,C$は$G$の有限部分集合
  quantifiers:
  - 任意の可換加法群$G$と部分集合$A,B,C$
  conclusion: $|A+C|\,|B|\le|A+B|\,|B+C|$である。
  answer: |
    $G$を可換加法群、$A,B,C$を有限部分集合とする。$B$が空なら左辺は$0$である。$B$が空でないとする。

    空でない部分集合$B'\subseteq B$のうち$K=\frac{|A+B'|}{|B'|}$を最小にするものをとる。$K\le\frac{|A+B|}{|B|}$であり、すべての$Z\subseteq B'$について$|Z+A|\ge K|Z|$である。

    任意の有限集合$D$について$|D+B'+A|\le K|D+B'|$であることを、$|D|$についての帰納法で示す（プリュネッケ・ペトリディスの不等式）。$D=\emptyset$なら両辺は$0$である。$D=D'\cup\{g\}$（$g\notin D'$）とし、$Z=\{x\in B'\mid g+x+A\subseteq D'+B'+A\}$、$W=\{x\in B'\mid g+x\in D'+B'\}$とおく。$W\subseteq Z$である。

    $D+B'+A$は$D'+B'+A$と$g+B'+A$の和集合で、$g+Z+A$は前者に含まれる。よって
    $|D+B'+A|\le|D'+B'+A|+|B'+A|-|Z+A|\le K\left(|D'+B'|+|B'|-|Z|\right)$
    である。一方、$D+B'$は$D'+B'$と$g+(B'\setminus W)$の互いに素な和集合なので、$|D+B'|=|D'+B'|+|B'|-|W|\ge|D'+B'|+|B'|-|Z|$である。合わせると$|D+B'+A|\le K|D+B'|$である。

    $D=C$とする。$b\in B'$をとると$A+C+b\subseteq C+B'+A$なので$|A+C|\le|C+B'+A|$である。したがって
    $|A+C|\le|C+B'+A|\le K\,|C+B'|\le K\,|C+B|$
    である。$K\le\frac{|A+B|}{|B|}$なので$|A+C|\,|B|\le|A+B|\,|B+C|$である。
  strategy: Pass to a subset of B minimizing the doubling ratio and prove the Plünnecke-Petridis inequality for it by induction.
  sketch:
  - 'case_split: The case of empty B is trivial.'
  - 'setup: Choose a nonempty subset B'' of B minimizing K = |A + B''|/|B''|.'
  - 'induction: Induction on |D| gives the Plünnecke-Petridis inequality |D + B'' + A| ≤ K |D + B''|.'
  - 'derive: Translation gives |A + C| ≤ |C + B'' + A|.'
  - 'conclude: Since K ≤ |A + B|/|B|, the inequality follows.'
  openmath: (forall (G s t u) (-> (and (abelian_group G) (subset s G) (subset t G) (subset u G) (finite_set s) (finite_set t) (finite_set u)) (<= (* (size (sumset s u)) (size t)) (* (size (sumset s t)) (size (sumset t u))))))
  hard_negative:
    statement: 同じ条件で$|A+C|\,|B|^2\le|A+B|\,|B+C|$である。
    reason: $A=B=C=\{0,1\}$とすると左辺は$3\cdot 4=12$であり、右辺は$3\cdot 3=9$である。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [DecidableEq G] (A B C : Finset G), (Finset.image₂ (· + ·) A C).card * B.card ≤ (Finset.image₂ (· + ·) A B).card * (Finset.image₂ (· + ·) B C).card
  proof: |
    by
      intro G _ _ A B C
      exact Finset.ruzsa_triangle_inequality_add_add_add A B C
- id: plunnecke_ruzsa_inequality
  kind: named
  level: 4
  topic: 組合せ論・プリュネッケ・ルジャの不等式
  statement: プリュネッケ・ルジャの不等式。可換加法群の有限部分集合$A,B$（$A$は空でない）と自然数$m,n$について、$|mB-nB|\le\left(\frac{|A+B|}{|A|}\right)^{m+n}|A|$である。ここで$kB$は$B$の$k$重の和集合で$0B=\{0\}$である。
  statement_en: Plünnecke-Ruzsa inequality. For finite subsets A, B of an additive abelian group with A nonempty and natural numbers m, n, |mB - nB| ≤ (|A + B|/|A|)^(m+n) |A|, where kB is the k-fold sumset and 0B = {0}.
  assumptions:
  - $G$は可換加法群
  - $A,B$は$G$の有限部分集合で$A$は空でない
  - $m,n$は自然数
  - $kB$は$k$重の和集合で$0B=\{0\}$
  quantifiers:
  - 任意の可換加法群$G$、部分集合$A,B$、自然数$m,n$
  conclusion: $|mB-nB|\le\left(\frac{|A+B|}{|A|}\right)^{m+n}|A|$である。
  answer: |
    $G$を可換加法群、$A,B$を有限部分集合で$A$は空でなく、$m,n$を自然数とする。$kB$を$k$重の和集合（$0B=\{0\}$）とし、$K=\frac{|A+B|}{|A|}$とおく。$A$の空でない部分集合$A'$のうち$K'=\frac{|A'+B|}{|A'|}$を最小にするものをとる。$K'\le K$であり、すべての$Z\subseteq A'$について$|Z+B|\ge K'|Z|$である。

    任意の有限集合$D$について$|D+A'+B|\le K'|D+A'|$であることを、$|D|$についての帰納法で示す（プリュネッケ・ペトリディスの不等式）。$D=\emptyset$なら両辺は$0$である。$D=D'\cup\{g\}$（$g\notin D'$）とし、$Z=\{x\in A'\mid g+x+B\subseteq D'+A'+B\}$、$W=\{x\in A'\mid g+x\in D'+A'\}$とおく。$W\subseteq Z$である。

    $D+A'+B$は$D'+A'+B$と$g+A'+B$の和集合で、$g+Z+B$は前者に含まれる。よって
    $|D+A'+B|\le|D'+A'+B|+|A'+B|-|Z+B|\le K'\left(|D'+A'|+|A'|-|Z|\right)$
    である。一方、$D+A'$は$D'+A'$と$g+(A'\setminus W)$の互いに素な和集合なので、$|D+A'|=|D'+A'|+|A'|-|W|\ge|D'+A'|+|A'|-|Z|$である。合わせると$|D+A'+B|\le K'|D+A'|$である。

    $D=(k-1)B$として$k$についての帰納法を用いると$|A'+kB|\le K'^k|A'|$である。

    差についての Ruzsa の三角不等式を$mB,nB,A'$に適用する。$|X-Y|\,|Z|\le|X+Z|\,|Y+Z|$は、Ruzsa の不等式$|X-Y|\,|W|\le|X-W|\,|Y-W|$で$W=-Z$とした形である。よって
    $|mB-nB|\,|A'|\le|A'+mB|\,|A'+nB|\le K'^{m+n}|A'|^2$
    である。両辺を$|A'|$で割ると$|mB-nB|\le K'^{m+n}|A'|\le K^{m+n}|A|$である。
  strategy: Minimize the doubling ratio over subsets of A, prove and iterate the Plünnecke-Petridis inequality, and finish with the Ruzsa triangle inequality.
  sketch:
  - 'setup: Choose a nonempty A'' in A minimizing K'' = |A'' + B|/|A''|.'
  - 'induction: Induction on |D| gives the Plünnecke-Petridis inequality |D + A'' + B| ≤ K'' |D + A''|.'
  - 'induction: Iterating gives |A'' + kB| ≤ K''^k |A''|.'
  - 'apply_theorem: The Ruzsa triangle inequality bounds |mB - nB| |A''|.'
  - 'conclude: Dividing and using K'' ≤ K and |A''| ≤ |A| gives the bound.'
  openmath: (forall (G s t m n) (-> (and (abelian_group G) (subset s G) (subset t G) (finite_set s) (finite_set t) (!= s emptyset) (in m N) (in n N)) (<= (size (difference_set (iterated_sumset m t) (iterated_sumset n t))) (* (^ (/ (size (sumset s t)) (size s)) (+ m n)) (size s)))))
  hard_negative:
    statement: 同じ条件で$|mB-nB|\le\frac{|A+B|}{|A|}\,|A|$である。
    reason: $A=B=\{0,1\}$、$m=n=2$では$2B-2B=\{-2,\dots,2\}$の大きさは$5$であり、右辺は$|A+B|=3$である。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [DecidableEq G] (A B : Finset G) (m n : ℕ), A.Nonempty → (((Finset.image₂ (· - ·) (@nsmulRec (Finset G) ⟨{0}⟩ ⟨Finset.image₂ (· + ·)⟩ m B) (@nsmulRec (Finset G) ⟨{0}⟩ ⟨Finset.image₂ (· + ·)⟩ n B)).card : ℚ≥0)) ≤ ((Finset.image₂ (· + ·) A B).card / A.card : ℚ≥0) ^ (m + n) * A.card
  proof: |
    by
      intro G _ _ A B m n hA
      exact Finset.pluennecke_ruzsa_inequality_nsmul_sub_nsmul_add hA B m n
- id: ruzsa_covering_lemma
  kind: gap
  level: 3
  topic: 組合せ論・Ruzsa の被覆補題
  statement: Ruzsa の被覆補題。可換加法群の有限部分集合$A,B$（$B$は空でない）と実数$K$が$|A+B|\le K|B|$を満たすなら、$F\subseteq A$で$|F|\le K$かつ$A\subseteq F+(B-B)$となるものが存在する。
  statement_en: Ruzsa covering lemma. If A, B are finite subsets of an additive abelian group with B nonempty and K is a real number with |A + B| ≤ K|B|, then there is F ⊆ A with |F| ≤ K and A ⊆ F + (B - B).
  assumptions:
  - $G$は可換加法群
  - $A,B$は$G$の有限部分集合で$B$は空でない
  - $K$は実数で$|A+B|\le K|B|$
  quantifiers:
  - 任意の可換加法群$G$、部分集合$A,B$、実数$K$
  conclusion: $F\subseteq A$、$|F|\le K$、$A\subseteq F+(B-B)$を満たす$F$が存在する。
  answer: |
    $G$を可換加法群、$A,B$を有限部分集合で$B$は空でなく、$|A+B|\le K|B|$とする。$F\subseteq A$で、平行移動$f+B$（$f\in F$）が互いに素であるもののうち、極大なものをとる。

    これらの平行移動は$A+B$に含まれる大きさ$|B|$の互いに素な集合なので、$|F|\,|B|\le|A+B|\le K|B|$であり、$|F|\le K$である。

    $a\in A$をとる。極大性より$a+B$はある$f+B$（$f\in F$）と交わる。$a\in F$なら$a=f$としてよい。したがって$a+b=f+b'$（$b,b'\in B$）と書け、$a=f+(b'-b)\in F+(B-B)$である。よって$A\subseteq F+(B-B)$である。
  strategy: Take a maximal subset of A whose translates of B are disjoint.
  sketch:
  - 'construct: Choose a maximal F in A with the translates f + B pairwise disjoint.'
  - 'derive: Disjoint translates inside A + B give |F| ≤ K.'
  - 'derive: Maximality makes every a + B meet some f + B.'
  - 'conclude: Hence a lies in F + (B - B).'
  openmath: (forall (G s t K) (-> (and (abelian_group G) (subset s G) (subset t G) (finite_set s) (finite_set t) (!= t emptyset) (in K R) (<= (size (sumset s t)) (* K (size t)))) (exists (f) (and (subset f s) (<= (size f) K) (subset s (sumset f (difference_set t t)))))))
  hard_negative:
    statement: 同じ条件で$F\subseteq A$、$|F|\le K$、$A\subseteq F+B$を満たす$F$が存在する。
    reason: $\mathbb{Z}$で$A=B=\{1\}$、$K=1$とすると$F\subseteq\{1\}$であり、$F+B\subseteq\{2\}$は$1$を含まない。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [DecidableEq G] (A B : Finset G) (K : ℝ), B.Nonempty → ((Finset.image₂ (· + ·) A B).card : ℝ) ≤ K * B.card → ∃ F ⊆ A, (F.card : ℝ) ≤ K ∧ A ⊆ Finset.image₂ (· + ·) F (Finset.image₂ (· - ·) B B)
  proof: |
    by
      intro G _ _ A B K hB h
      exact Finset.ruzsa_covering_add hB h
- id: additive_energy_cauchy_schwarz
  kind: gap
  level: 3
  topic: 組合せ論・加法エネルギー
  statement: 可換加法群の有限部分集合$s,t$の加法エネルギー$E(s,t)=|\{(a,a',b,b')\in s\times s\times t\times t\mid a+b=a'+b'\}|$について、$|s|^2|t|^2\le|s+t|\,E(s,t)$である。
  statement_en: For finite subsets s, t of an additive abelian group with additive energy E(s,t), the number of quadruples (a,a',b,b') in s × s × t × t with a + b = a' + b', one has |s|^2 |t|^2 ≤ |s + t| E(s,t).
  assumptions:
  - $G$は可換加法群
  - $s,t$は$G$の有限部分集合
  - $E(s,t)$は$a+b=a'+b'$を満たす$(a,a',b,b')\in s\times s\times t\times t$の個数
  quantifiers:
  - 任意の可換加法群$G$と部分集合$s,t$
  conclusion: $|s|^2|t|^2\le|s+t|\,E(s,t)$である。
  answer: |
    $G$を可換加法群、$s,t$を有限部分集合とする。$x\in s+t$について$r(x)=|\{(a,b)\in s\times t\mid a+b=x\}|$とおく。組$(a,b)$を和で分類すると$\sum_{x\in s+t}r(x)=|s||t|$である。

    $E(s,t)$は$a+b=a'+b'$を満たす組の個数であり、共通の和$x$で分類すると$E(s,t)=\sum_{x\in s+t}r(x)^2$である。

    Cauchy-Schwarz の不等式より
    $|s|^2|t|^2=\left(\sum_{x\in s+t}r(x)\right)^2\le|s+t|\sum_{x\in s+t}r(x)^2=|s+t|\,E(s,t)$
    である。
  strategy: Count representations of each sum and apply Cauchy-Schwarz.
  sketch:
  - 'setup: Let r(x) be the number of representations of x as a + b.'
  - 'derive: The sum of r(x) is |s||t|.'
  - 'derive: The sum of r(x)^2 is the additive energy.'
  - 'apply_theorem: Cauchy-Schwarz gives the inequality.'
  openmath: (forall (G s t) (-> (and (abelian_group G) (subset s G) (subset t G) (finite_set s) (finite_set t)) (<= (* (^ (size s) 2) (^ (size t) 2)) (* (size (sumset s t)) (additive_energy s t)))))
  hard_negative:
    statement: 同じ条件で$|s|^2|t|^2\le E(s,t)$である。
    reason: $s=t=\{0,1\}$では$|s|^2|t|^2=16$であり、$r(0)=1$、$r(1)=2$、$r(2)=1$より$E(s,t)=6$である。
  target: |
    ∀ (G : Type*) [AddCommGroup G] [DecidableEq G] (s t : Finset G), s.card ^ 2 * t.card ^ 2 ≤ (Finset.image₂ (· + ·) s t).card * (((s ×ˢ s) ×ˢ (t ×ˢ t)).filter (fun x => x.1.1 + x.2.1 = x.1.2 + x.2.2)).card
  proof: |
    by
      intro G _ _ s t
      exact Finset.le_card_add_mul_addEnergy s t
- id: hales_jewett_theorem
  kind: named
  level: 4
  topic: 組合せ論・Ramsey 型定理
  statement: Hales-Jewett の定理。有限集合$\alpha$（文字）と有限集合$\kappa$（色）に対して有限集合$\iota$があり、語の集合$\alpha^\iota$の任意の$\kappa$彩色は単色の組合せ直線を持つ。ここで組合せ直線とは、$\iota$の空でない部分集合$I$と$I$の外の固定文字で定まる$\{w_x\mid x\in\alpha\}$で、$w_x$は$I$上で$x$、$I$の外で固定文字をとる語である。
  statement_en: Hales-Jewett theorem. For finite sets α and κ there is a finite set ι such that every coloring of the words α^ι by κ has a monochromatic combinatorial line, namely a set of words w_x, x in α, which take the value x on a fixed nonempty set I of coordinates and fixed letters outside I.
  assumptions:
  - $\alpha,\kappa$は有限集合
  - 組合せ直線は、空でない$I\subseteq\iota$と$I$の外の固定文字で定まる語の族$(w_x)_{x\in\alpha}$
  quantifiers:
  - 任意の有限集合$\alpha,\kappa$
  conclusion: ある有限集合$\iota$について、$\alpha^\iota$のすべての$\kappa$彩色に単色の組合せ直線がある。
  answer: |
    $\alpha,\kappa$を有限集合とし、$k=|\kappa|$とする。$\alpha$が空のときは、$\kappa$が空なら$\iota=\emptyset$では彩色が存在せず、$\kappa$が空でなければ一点の$\iota$で直線の条件は空虚に成り立つ。$|\alpha|=1$なら一点の$\iota$で直線は一点である。

    $|\alpha|$についての帰納法で示す。$\alpha=\alpha'\cup\{z\}$（$z\notin\alpha'$、$\alpha'$は空でない）とし、$\alpha'$については任意の色の個数で定理が成り立つとする。語の彩色$C$について、組合せ直線$L_1,\dots,L_r$が点$f$に集中するとは、$L_i(z)=f$がすべての$i$で成り立ち、$L_i$の$x\in\alpha'$の部分が色$c_i$で単色であり、$c_1,\dots,c_r$が相異なることとする。

    $r$についての帰納法で、$\iota_r$があって$\alpha^{\iota_r}$の任意の$\kappa$彩色は単色の直線か、$r$本の集中する直線を持つことを示す。$r=k$で後者が起きれば、$f$の色はある$c_i$に等しく、$L_i$が単色である。したがって$r=k$の場合が定理である。

    $r=0$では$\iota_0=\emptyset$でよい。$r$から$r+1$に進む。$\iota'$を、$\alpha'$と色の集合$\kappa^{\alpha^{\iota_r}}$に対する定理が与える有限集合とし、$\iota_{r+1}=\iota_r\sqcup\iota'$とする。彩色$C$に対し、$w\in\alpha'^{\iota'}$を写像$v\mapsto C(v,w)$で彩色する。単色の直線$\ell$を$\alpha'^{\iota'}$にとると、$C(v,\ell(x))$は$x\in\alpha'$によらない。これを$D(v)$とおく。$\ell$の動く座標と固定文字をそのまま使うと、$\ell(z)\in\alpha^{\iota'}$も定まる。

    $D$に帰納法の仮定を使う。$D$に単色の直線$L$があれば、$x\mapsto(L(x),\ell(a))$（$a\in\alpha'$を固定）は$C$の単色の直線である。そうでなければ$D$に点$f$に集中する直線$L_1,\dots,L_r$があり、色は$c_1,\dots,c_r$である。$x\mapsto(L_i(x),\ell(x))$と$x\mapsto(f,\ell(x))$を考える。これらの$z$での点はすべて$(f,\ell(z))$である。$x\in\alpha'$での色はそれぞれ$c_i$と$D(f)$である。$D(f)=c_i$なら$L_i$は$D$の単色の直線となり前の場合に帰着する。そうでなければ$r+1$本の集中する直線が得られる。
  strategy: Induct on the alphabet and, inside that, on the number of color-focused lines.
  sketch:
  - 'case_split: Handle alphabets of size at most 1 directly.'
  - 'setup: Define r color-focused lines at a point f.'
  - 'induction: Show that high enough dimension yields a monochromatic line or r focused lines.'
  - 'construct: Color words on the second block of coordinates by the induced function on the first block.'
  - 'apply_theorem: Apply the theorem for the smaller alphabet to get a line that makes the coloring independent of the letter.'
  - 'derive: Lift r focused lines of the induced coloring to r+1 focused lines or a monochromatic line.'
  - 'conclude: With r equal to the number of colors, the focus has the color of one line, which is then monochromatic.'
  openmath: (forall (a k) (-> (and (finite_set a) (finite_set k)) (exists (i) (and (finite_set i) (hales_jewett_dimension a k i)))))
  hard_negative:
    statement: 同じ条件で、任意の彩色について$I$が$\iota$全体である単色の直線（主対角線）がある。
    reason: $\alpha=\{0,1\}$、$\iota=\{1,2\}$で、語$(0,0)$と$(1,1)$に異なる色を塗ると、主対角線は単色でない。どの大きさの$\iota$でも同じ塗り方ができる。
  target: |
    ∀ (α κ : Type*) [Finite α] [Finite κ], ∃ (ι : Type) (_ : Fintype ι), ∀ C : (ι → α) → κ, ∃ l : Combinatorics.Line α ι, l.IsMono C
  proof: |
    by
      intro α κ _ _
      exact Combinatorics.Line.exists_mono_in_high_dimension α κ
- id: monochromatic_homothetic_copy
  kind: textbook
  level: 4
  topic: 組合せ論・Ramsey 型定理
  statement: 可換モノイド$M$の有限部分集合$S$と、$M$の任意の有限彩色について、正の整数$a$と$b\in M$があり、$\{as+b\mid s\in S\}$は単色である。Hales-Jewett の定理を既習とする。
  statement_en: For a finite subset S of a commutative additive monoid M and any finite coloring of M, there are a positive integer a and b in M such that {a s + b | s in S} is monochromatic. The Hales-Jewett theorem is assumed.
  assumptions:
  - $M$は可換モノイド（加法で書く）
  - $S\subseteq M$は有限
  - $C:M\to\kappa$は有限集合$\kappa$への彩色
  - 既習の事実として Hales-Jewett の定理を用いる
  quantifiers:
  - 任意の$M,S,\kappa,C$
  conclusion: $a>0$と$b\in M$があり、$C$は$\{as+b\mid s\in S\}$で一定である。
  answer: |
    $M$を可換モノイド、$S\subseteq M$を有限集合、$C:M\to\kappa$を有限彩色とする。Hales-Jewett の定理を文字集合$S$と色$\kappa$に適用して、有限集合$\iota$を得る。語$w\in S^\iota$に色$C\left(\sum_{i\in\iota}w_i\right)$を与えると、単色の組合せ直線$(w_s)_{s\in S}$がある。

    この直線の動く座標の集合を$I$（空でない）、$I$の外の固定文字の和を$b$、$a=|I|$とする。$w_s$は$I$上で$s$をとるので、$\sum_{i\in\iota}(w_s)_i=as+b$である。よって$C(as+b)$は$s\in S$によらない。$a>0$である。
  strategy: Apply Hales-Jewett with alphabet S and color each word by the color of its sum.
  sketch:
  - 'apply_theorem: Hales-Jewett for the alphabet S gives a finite index set.'
  - 'construct: Color a word by the color of the sum of its letters.'
  - 'derive: A monochromatic line has sum a s + b with a the number of active coordinates.'
  - 'conclude: Since the active set is nonempty, a is positive.'
  openmath: (forall (M S k c) (-> (and (add_comm_monoid M) (subset S M) (finite_set S) (finite_set k) (finite_coloring c M k)) (exists (a b) (and (in a N) (> a 0) (in b M) (exists (d) (forall (s) (-> (in s S) (= (fn_value c (+ (* a s) b)) d))))))))
  hard_negative:
    statement: 同じ条件で$a=1$にとれる。
    reason: $M=\mathbb{N}$、$S=\{0,1\}$で、偶数と奇数に異なる色を塗ると$\{b,b+1\}$は単色にならない。
  target: |
    ∀ (M κ : Type*) [AddCommMonoid M] (S : Finset M) [Finite κ] (C : M → κ), ∃ a : ℕ, 0 < a ∧ ∃ (b : M) (c : κ), ∀ s ∈ S, C (a • s + b) = c
  proof: |
    by
      intro M κ _ S _ C
      obtain ⟨a, ha, h⟩ := Combinatorics.exists_mono_homothetic_copy S C
      exact ⟨a, ha, h⟩
- id: van_der_waerden_theorem
  kind: named
  level: 4
  topic: 組合せ論・Ramsey 型定理
  statement: ファン・デル・ワールデンの定理（Hales-Jewett の定理を既習とする）。自然数全体の任意の有限彩色と自然数$k$について、公差が正で長さ$k$の単色の等差数列$b,b+a,\dots,b+(k-1)a$が存在する。
  statement_en: Van der Waerden's theorem, assuming the Hales-Jewett theorem. For any finite coloring of the natural numbers and any natural number k, there is a monochromatic arithmetic progression b, b+a, ..., b+(k-1)a with a > 0.
  assumptions:
  - $C:\mathbb{N}\to\kappa$は有限集合$\kappa$への彩色
  - $k$は自然数
  - 既習の事実として Hales-Jewett の定理を用いる
  quantifiers:
  - 任意の有限彩色$C$と自然数$k$
  conclusion: $a>0$と$b$があり、$C(b+ia)$は$0\le i<k$で一定である。
  answer: |
    $C:\mathbb{N}\to\kappa$を有限彩色、$k$を自然数とする。$k=0$なら条件は空虚に成り立つので$\kappa$が空でないことだけ確かめる。$\mathbb{N}$は空でなく$C$が存在するので$\kappa$は空でない。$k\ge 1$とする。

    Hales-Jewett の定理を文字集合$S=\{0,\dots,k-1\}$と色$\kappa$に適用して有限集合$\iota$を得る。語$w\in S^\iota$に色$C\left(\sum_{i\in\iota}w_i\right)$を与えると、単色の組合せ直線$(w_s)_{s\in S}$がある。動く座標の集合を$I$、$I$の外の固定文字の和を$b$、$a=|I|>0$とすると、$\sum_i(w_s)_i=b+sa$である。

    したがって$C(b+sa)$は$s=0,\dots,k-1$で一定である。
  strategy: Apply Hales-Jewett to the alphabet {0,...,k-1} and color words by the color of their sum.
  sketch:
  - 'setup: Take S = {0,...,k-1} as the alphabet.'
  - 'apply_theorem: Hales-Jewett gives a monochromatic line for the coloring by the sum of letters.'
  - 'derive: The sum along a line is b + s a with a the number of active coordinates.'
  - 'conclude: This is a monochromatic arithmetic progression of length k.'
  openmath: (forall (k c s) (-> (and (finite_set k) (finite_coloring c N k) (in s N)) (exists (a b d) (and (in a N) (> a 0) (in b N) (forall (i) (-> (and (in i N) (< i s)) (= (fn_value c (+ b (* i a))) d)))))))
  hard_negative:
    statement: 無限個の色を用いた彩色でも、長さ$k$の単色の等差数列が存在する。
    reason: すべての自然数に異なる色を塗ると、長さ$2$の単色の等差数列は存在しない。
  target: |
    ∀ (κ : Type*) [Finite κ] (C : ℕ → κ) (k : ℕ), ∃ a b : ℕ, 0 < a ∧ ∃ c : κ, ∀ i, i < k → C (b + i * a) = c
  proof: |
    by
      intro κ _ C k
      obtain ⟨a, ha, b, c, h⟩ := Combinatorics.exists_mono_homothetic_copy (Finset.range k) C
      refine ⟨a, b, ha, c, fun i hi => ?_⟩
      have := h i (Finset.mem_range.mpr hi)
      rw [← this, smul_eq_mul, add_comm, mul_comm]
- id: hindman_finite_sums_theorem
  kind: named
  level: 4
  topic: 組合せ論・Ramsey 型定理
  statement: Hindman の定理（$(\mathbb{Z}_{>0},+)$上の冪等な超フィルターの存在を既習とする）。自然数の任意の有限彩色$C$について、正の整数の無限列$(a_i)$があり、空でないすべての有限部分集合$s$について$C\left(\sum_{i\in s}a_i\right)$が同じ色である。
  statement_en: Hindman's theorem, assuming the existence of an idempotent ultrafilter on the positive integers. For every finite coloring C of the natural numbers there is a sequence of positive integers (a_i) such that C of the sum over s of a_i is the same color for all nonempty finite sets s of indices.
  assumptions:
  - $C:\mathbb{N}\to\kappa$は有限集合$\kappa$への彩色
  - 既習の事実として$\mathbb{Z}_{>0}$上の冪等な超フィルター（Ellis の補題）を用いる
  quantifiers:
  - 任意の有限彩色$C$
  conclusion: 正の整数の列$(a_i)$と色$c$があり、空でないすべての有限な添字集合$s$で$C\left(\sum_{i\in s}a_i\right)=c$である。
  answer: |
    $C:\mathbb{N}\to\kappa$を有限彩色とする。既習の Ellis の補題より、$\mathbb{Z}_{>0}$上の超フィルター$\mathcal{U}$で$\mathcal{U}+\mathcal{U}=\mathcal{U}$を満たすものが存在する。これは、$A\in\mathcal{U}$であることと$\{x\mid A-x\in\mathcal{U}\}\in\mathcal{U}$が同値であることを意味する。ここで$A-x=\{y\mid x+y\in A\}$である。

    色は有限個なので、ある色$c$の集合$A_0=\{n>0\mid C(n)=c\}$が$\mathcal{U}$に属する。$A\in\mathcal{U}$について$A^\star=\{x\in A\mid A-x\in\mathcal{U}\}$とおく。冪等性より$A^\star\in\mathcal{U}$である。また$x\in A^\star$なら$A^\star-x\in\mathcal{U}$である。実際、$B=A-x$は$\mathcal{U}$に属し、冪等性より$\{y\mid B-y\in\mathcal{U}\}\in\mathcal{U}$である。$B-y=A-(x+y)$なので、$y$が$B$とこの集合の共通部分に属するなら$x+y\in A^\star$である。

    列を順に作る。$a_0\in A_0^\star$をとる。$A_{n+1}=A_n^\star\cap(A_n^\star-a_n)$とおくと$A_{n+1}\in\mathcal{U}$なので、$a_{n+1}\in A_{n+1}^\star$をとれる。$A_{n+1}\subseteq A_n$である。

    添字集合$s$の要素の個数についての帰納法で、$\min s\ge n$なら$\sum_{i\in s}a_i\in A_n$であることを示す。$s=\{m\}$なら$a_m\in A_m\subseteq A_n$である。$s$の最小元を$m$、残りを$s'$とすると、$\min s'\ge m+1$なので$y=\sum_{i\in s'}a_i\in A_{m+1}\subseteq A_m^\star-a_m$である。したがって$a_m+y\in A_m^\star\subseteq A_m\subseteq A_n$である。

    $n=0$の場合から、空でないすべての$s$について$\sum_{i\in s}a_i\in A_0$であり、色は$c$である。
  strategy: Build the sequence greedily inside a color class that belongs to an idempotent ultrafilter.
  sketch:
  - 'setup: Take an idempotent ultrafilter and a color class A_0 in it.'
  - 'derive: For A in U, the set A* of x in A with A - x in U again lies in U.'
  - 'construct: Choose a_n in the star of A_n and define A_{n+1} by intersecting with a shift.'
  - 'induction: Sums over finite sets with minimum at least n lie in A_n.'
  - 'conclude: All nonempty finite sums lie in the color class A_0.'
  openmath: (forall (k c) (-> (and (finite_set k) (finite_coloring c N k)) (exists (a d) (and (forall (i) (-> (in i N) (> (seq_value a i) 0))) (forall (s) (-> (and (finite_set s) (subset s N) (!= s emptyset)) (= (fn_value c (sum s (lambda (i) (seq_value a i)))) d)))))))
  hard_negative:
    statement: 同じ結論が無限個の色の彩色でも成り立つ。
    reason: すべての自然数に異なる色を塗ると、$a_0$と$a_0+a_1$（$a_1>0$）の色は異なる。
  target: |
    ∀ (κ : Type*) [Finite κ] (C : ℕ → κ), ∃ (c : κ) (a : ℕ → ℕ), (∀ i, 0 < a i) ∧ ∀ s : Finset ℕ, s.Nonempty → C (∑ i ∈ s, a i) = c
  proof: |
    by
      intro κ _ C
      let cover : Set (Set ℕ+) := Set.range (fun k : κ => {n : ℕ+ | C n = k})
      have hfin : cover.Finite := Set.finite_range _
      have hcov : (⊤ : Set ℕ+) ⊆ ⋃₀ cover := by
        intro n _
        exact ⟨{m : ℕ+ | C m = C n}, ⟨C n, rfl⟩, rfl⟩
      obtain ⟨c, ⟨k, rfl⟩, a, ha⟩ := Hindman.exists_FS_of_finite_cover cover hfin hcov
      have key : ∀ (s : Finset ℕ) (hs : s.Nonempty), ∃ x ∈ Hindman.FS (a.drop (s.min' hs)), (x : ℕ) = ∑ i ∈ s, (a.get i : ℕ) := by
        intro s
        induction s using Finset.eraseInduction with
        | H s ih =>
          intro hs
          rcases (s.erase (s.min' hs)).eq_empty_or_nonempty with h | h
          · refine ⟨(a.drop (s.min' hs)).head, Hindman.FS.head _, ?_⟩
            rw [← Finset.add_sum_erase _ _ (s.min'_mem hs), h, Finset.sum_empty, add_zero, Stream'.head_drop]
          · obtain ⟨x, hx, hxs⟩ := ih _ (s.min'_mem hs) h
            refine ⟨(a.drop (s.min' hs)).head + x, Hindman.FS.cons _ _ ?_, ?_⟩
            · rw [Stream'.tail_eq_drop, Stream'.drop_drop, add_comm]
              have hlt : s.min' hs + 1 ≤ (s.erase (s.min' hs)).min' h := Nat.succ_le_of_lt (Finset.min'_lt_of_mem_erase_min' _ _ <| Finset.min'_mem _ _)
              obtain ⟨d, hd⟩ := Nat.exists_eq_add_of_le hlt
              rw [hd, ← Stream'.drop_drop] at hx
              rw [add_comm]
              exact Hindman.FS_iter_tail_sub_FS _ d hx
            · rw [← Finset.add_sum_erase _ _ (s.min'_mem hs), ← hxs, Stream'.head_drop]
              rfl
      refine ⟨k, fun i => (a.get i : ℕ), fun i => (a.get i).pos, fun s hs => ?_⟩
      obtain ⟨x, hx, hxs⟩ := key s hs
      have hc : C x = k := ha (Hindman.FS_iter_tail_sub_FS _ _ hx)
      show C (∑ i ∈ s, (a.get i : ℕ)) = k
      rw [← hxs]; exact hc
- id: szemeredi_regularity_lemma
  kind: named
  level: 4
  topic: 組合せ論・Szemerédi の正則性補題
  statement: Szemerédi の正則性補題（エネルギー増分の補題を既習とする）。$\varepsilon>0$と自然数$l$に対して$M(\varepsilon,l)$があり、$l\le|V|$を満たす有限グラフ$G=(V,E)$の頂点集合は、部分の個数が$l$以上$M(\varepsilon,l)$以下の等分割$P$を持つ。さらに$\varepsilon$一様でない部分の順序付きの組の個数は高々$\varepsilon|P|(|P|-1)$である。
  statement_en: Szemerédi regularity lemma, assuming the energy increment lemma. For ε > 0 and a natural number l there is M(ε,l) such that the vertex set of any finite graph with at least l vertices has an equipartition P with between l and M(ε,l) parts in which at most ε|P|(|P|-1) ordered pairs of parts are not ε-uniform.
  assumptions:
  - $\varepsilon>0$、$l$は自然数で$l\le|V|$
  - $G$は有限グラフ
  - 等分割は部分の大きさの差が高々$1$の分割
  - 組$(s,t)$が$\varepsilon$一様とは、$|s'|\ge\varepsilon|s|$、$|t'|\ge\varepsilon|t|$の部分集合で$|d(s',t')-d(s,t)|<\varepsilon$となること
  - 既習の事実として、一様でない等分割を細分すると辺エネルギーが$\varepsilon^5/4$以上増える補題を用いる
  quantifiers:
  - 任意の$\varepsilon>0$、$l$、有限グラフ$G$
  conclusion: 部分の個数が$l$以上$M(\varepsilon,l)$以下の$\varepsilon$一様な等分割が存在する。
  answer: |
    $\varepsilon>0$、$l$を自然数、$G=(V,E)$を$l\le|V|$の有限グラフとする。等分割$P$が$\varepsilon$一様であるとは、$\varepsilon$一様でない部分の順序付きの組が$\varepsilon|P|(|P|-1)$個以下であることとする。$\varepsilon'=\min(\varepsilon,1)$について結論が成り立てば、$\varepsilon'$一様な組は$\varepsilon$一様であり、例外の組の上界も大きくなるので、$\varepsilon$についても成り立つ。そこで$\varepsilon\le 1$とする。

    $P$の辺エネルギーを$q(P)=\frac{1}{|P|^2}\sum_{s\ne t}d(s,t)^2$とする。和は$P$の相異なる部分の順序付きの組にわたる。$0\le q(P)\le 1$である。

    既習のエネルギー増分補題は次の主張である。等分割$P$の部分の個数$m$が$m\ge 7$、$4^m\varepsilon^5\ge 100$、$m16^m\le|V|$を満たし、$P$が$\varepsilon$一様でないなら、部分の個数が$f(m)=m4^m$の等分割$Q$で$q(Q)\ge q(P)+\varepsilon^5/4$を満たすものがある。

    $m_0$を、$m_0\ge\max(l,7)$かつ$4^{m_0}\varepsilon^5\ge 100$を満たす最小の自然数とする。$t=\lfloor 4\varepsilon^{-5}\rfloor$とし、$f$を$m_0$に$t$回施した値を$m^*$とする。$M(\varepsilon,l)=m^*16^{m^*}$とおく。これは$\varepsilon,l$だけで定まる。

    $|V|\ge M(\varepsilon,l)$の場合を考える。部分の個数が$m_0$の等分割$P_0$をとる。$P_j$が$\varepsilon$一様でなければ、補題で$P_{j+1}$を作る。$j\le t$では部分の個数$m_j$は$m_0\le m_j\le m^*$を満たすので、補題の条件が成り立つ。$j$回の操作で$q(P_j)\ge j\varepsilon^5/4$である。$(t+1)\varepsilon^5/4>1$なので、操作は$t$回以内で止まり、止まったときの等分割は$\varepsilon$一様である。部分の個数は$l$以上$m^*$以下である。

    $|V|<M(\varepsilon,l)$の場合を考える。各頂点を一つの部分とする分割をとる。部分の個数$|V|$は$l$以上$M(\varepsilon,l)$以下である。$\varepsilon\le 1$なので、一点どうしの組で大きさの条件を満たす部分集合は全体だけであり、密度の差は$0$である。よってすべての組が$\varepsilon$一様である。
  strategy: Iterate the energy increment on refinements until the partition is uniform, using that energy is bounded by one.
  sketch:
  - 'setup: Define the edge energy of a partition, a number between 0 and 1.'
  - 'apply_theorem: A non-uniform equipartition has an equipartition refinement with energy larger by ε^5/4.'
  - 'derive: The iteration stops after at most 4 ε^(-5) steps.'
  - 'derive: The number of parts is bounded in terms of ε and l.'
  - 'case_split: For few vertices, use the partition into singletons.'
  openmath: (forall (G e l) (-> (and (finite_simple_graph G) (in e R) (> e 0) (in l N) (<= l (size (graph_vertices G)))) (exists (D) (and (regular_partition D G e) (<= l (partition_part_count D)) (<= (partition_part_count D) (szemeredi_bound e l))))))
  hard_negative:
    statement: 同じ条件で、部分の組がすべて$\varepsilon$一様である等分割がとれる。
    reason: 半グラフ（$a_i$と$b_j$を$i\le j$のときに結ぶ二部グラフ）では、$\varepsilon$が小さく頂点数が十分大きいとき、部分の個数が$M(\varepsilon,l)$以下のどの等分割にも一様でない組が残ることが知られている。一点ずつに分ける分割は一様だが、頂点数が大きいと部分の個数の上界を超える。定理は例外の組を許す形でしか成り立たない。
  target: |
    ∀ (α : Type*) [Fintype α] [DecidableEq α] (G : SimpleGraph α) [DecidableRel G.Adj] (ε : ℝ) (l : ℕ), 0 < ε → l ≤ Fintype.card α → ∃ P : Finpartition (Finset.univ : Finset α), P.IsEquipartition ∧ l ≤ P.parts.card ∧ P.parts.card ≤ SzemerediRegularity.bound ε l ∧ P.IsUniform G ε
  proof: |
    by
      intro α _ _ G _ ε l h1 h2
      exact szemeredi_regularity G h1 h2
- id: triangle_removal_lemma
  kind: textbook
  level: 4
  topic: 組合せ論・三角形除去補題
  statement: 三角形除去補題（Szemerédi の正則性補題を既習とする）。$\varepsilon>0$に対して$c(\varepsilon)>0$があり、$n$頂点の有限グラフ$G$の三角形の個数が$c(\varepsilon)n^3$未満なら、$G$の部分グラフ$G'$で三角形を持たず、$|E(G)|-|E(G')|<\varepsilon n^2$となるものが存在する。
  statement_en: Triangle removal lemma, assuming the regularity lemma. For ε > 0 there is c(ε) > 0 such that if a finite graph G on n vertices has fewer than c(ε) n^3 triangles, then G has a triangle-free subgraph G' with |E(G)| - |E(G')| < ε n^2.
  assumptions:
  - $\varepsilon>0$
  - $G$は$n$頂点の有限グラフ
  - 三角形の個数は$c(\varepsilon)n^3$未満
  - 既習の事実として正則性補題を用いる
  quantifiers:
  - 任意の$\varepsilon>0$と有限グラフ$G$
  conclusion: 三角形を持たない部分グラフ$G'$で、$|E(G)|-|E(G')|<\varepsilon n^2$を満たすものが存在する。
  answer: |
    $\varepsilon>0$、$G$を$n$頂点の有限グラフとする。$\varepsilon\ge 1$では$c(\varepsilon)=1$とする。このとき$n\ge 1$であり、すべての辺を除くと$|E(G)|\le n^2/2<\varepsilon n^2$である。$n=0$では仮定が成り立たない。

    そこで$\varepsilon<1$、$n\ge 1$とする。$\varepsilon_0=\varepsilon/16$、$l=\lceil 8/\varepsilon\rceil$とし、$M\ge l$を正則性補題の上界$M(\varepsilon_0,l)$とする。$c(\varepsilon)=\frac{(1-2\varepsilon_0)\varepsilon_0^3}{8M^3}$とおく。

    $n<M$なら$c(\varepsilon)n^3<1$なので、仮定より三角形はなく、$G'=G$でよい。$n\ge M$とする。正則性補題より、部分の個数が$l$以上$M$以下の$\varepsilon_0$一様な等分割$P$がある。部分の大きさは$\frac{n}{2M}$以上$\frac{2n}{|P|}$以下である。

    次の辺を除いて$G'$を作る。部分の内部の辺、一様でない組の間の辺、辺密度が$2\varepsilon_0=\varepsilon/8$未満の組の間の辺である。部分の内部の辺は$\frac{n^2}{|P|}\le\frac{\varepsilon n^2}{8}$本以下である。一様でない順序なしの組は$\frac{\varepsilon_0|P|^2}{2}$個以下なので、その間の辺は$2\varepsilon_0n^2=\frac{\varepsilon n^2}{8}$本以下である。密度の低い組は$\frac{|P|^2}{2}$個以下なので、その間の辺は$\frac{\varepsilon}{8}\cdot 2n^2=\frac{\varepsilon n^2}{4}$本以下である。合計は$\varepsilon n^2$未満である。

    $G'$に三角形があるとする。三頂点は相異なる部分$X,Y,Z$に属し、三つの組はどれも$\varepsilon_0$一様で密度が$2\varepsilon_0$以上である。$G$の三角形を数える。$\delta=\varepsilon_0$とおく。$X$の点のうち、$Y$内の隣接頂点が$\delta|Y|$個未満であるものの集合を$X_1$とする。$|X_1|\ge\delta|X|$なら$d(X_1,Y)<\delta$であり、$d(X,Y)\ge 2\delta$との差は$\delta$より大きいので、$(X,Y)$の一様性に反する。よって$|X_1|<\delta|X|$である。$Z$についても同様である。したがって$(1-2\delta)|X|$個以上の$x\in X$について、$x$の$Y$内の隣接頂点の集合$Y_x$と$Z$内の隣接頂点の集合$Z_x$は$|Y_x|\ge\delta|Y|$、$|Z_x|\ge\delta|Z|$を満たす。$(Y,Z)$の一様性より$d(Y_x,Z_x)>d(Y,Z)-\delta\ge\delta$なので、$Y_x,Z_x$の間の辺は$\delta^3|Y||Z|$本以上あり、各辺は$x$と三角形をなす。

    よって$G$の$X,Y,Z$の間の三角形は$(1-2\varepsilon_0)\varepsilon_0^3|X||Y||Z|\ge c(\varepsilon)n^3$個以上ある。これは仮定に反する。したがって$G'$は三角形を持たない。
  strategy: Clean the graph along a regular partition and use triangle counting on any surviving triangle.
  sketch:
  - 'apply_theorem: Take a regular equipartition with suitable constants.'
  - 'construct: Delete edges inside parts, between non-uniform pairs and between sparse pairs.'
  - 'derive: Fewer than ε n^2 edges are deleted.'
  - 'derive: A surviving triangle gives three uniform dense pairs, and uniformity then yields many triangles in G.'
  - 'contradiction: This contradicts the hypothesis for a suitable c(ε).'
  openmath: (forall (e) (-> (and (in e R) (> e 0)) (and (> (triangle_removal_constant e) 0) (forall (G) (-> (and (finite_simple_graph G) (< (size (graph_triangles G)) (* (triangle_removal_constant e) (^ (size (graph_vertices G)) 3)))) (exists (H) (and (subgraph_of H G) (graph_clique_free H 3) (< (- (size (graph_edges G)) (size (graph_edges H))) (* e (^ (size (graph_vertices G)) 2))))))))))
  hard_negative:
    statement: 同じ条件で$G$自身が三角形を持たない。
    reason: $n$が大きいとき、三角形を一つだけ持つグラフは三角形の個数が$1<c(\varepsilon)n^3$となるが、三角形を持つ。
  target: |
    ∀ (ε : ℝ), 0 < ε → 0 < SimpleGraph.triangleRemovalBound ε ∧ ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj], ((G.cliqueFinset 3).card : ℝ) < SimpleGraph.triangleRemovalBound ε * (Fintype.card V : ℝ) ^ 3 → ∃ G' ≤ G, ∃ _ : DecidableRel G'.Adj, ((G.edgeFinset.card : ℝ) - (G'.edgeFinset.card : ℝ)) < ε * ((Fintype.card V ^ 2 : ℕ) : ℝ) ∧ G'.CliqueFree 3
  proof: |
    by
      intro ε hε
      exact ⟨SimpleGraph.triangleRemovalBound_pos hε, fun V _ _ G _ h => SimpleGraph.triangle_removal h⟩
- id: roth_three_term_progressions
  kind: textbook
  level: 4
  topic: 組合せ論・Roth の定理
  statement: Roth の定理（三角形除去補題を既習とする）。$\varepsilon>0$に対して$N$があり、$n\ge N$、$A\subseteq\{0,\dots,n-1\}$、$|A|\ge\varepsilon n$なら、$A$は非自明な三項等差数列を含む。すなわち$A$は$a+c=2b$、$a\ne c$を満たす$a,b,c$を含む。
  statement_en: Roth's theorem, assuming the triangle removal lemma. For ε > 0 there is N such that if n ≥ N, A is a subset of {0,...,n-1} and |A| ≥ εn, then A contains a nontrivial three-term arithmetic progression.
  assumptions:
  - $\varepsilon>0$
  - $n\ge N$、$A\subseteq\{0,\dots,n-1\}$、$|A|\ge\varepsilon n$
  - 既習の事実として三角形除去補題を用いる
  quantifiers:
  - 任意の$\varepsilon>0$に対してある$N$
  conclusion: $A$は非自明な三項等差数列を含む。
  answer: |
    $\varepsilon>0$とし、$A\subseteq\{0,\dots,n-1\}$、$|A|\ge\varepsilon n$で、$A$が非自明な三項等差数列を含まないとする。$M=2n+1$とする。$2$は$\mathbb{Z}/M\mathbb{Z}$で可逆である。$A$の元$a_1,a_2,a_3$について$|a_1+a_2-2a_3|<2n<M$なので、$a_1+a_2\equiv 2a_3\pmod M$なら整数としても$a_1+a_2=2a_3$である。

    三部グラフ$G$を次のように作る。頂点は三つの$\mathbb{Z}/M\mathbb{Z}$の複製$X,Y,Z$である。$x\in X,y\in Y$は$y-x\in A$で、$y\in Y,z\in Z$は$z-y\in A$で、$x\in X,z\in Z$は$(z-x)/2\in A$で結ぶ。

    三角形$(x,y,z)$では、$a_1=y-x$、$a_2=z-y$、$a_3=(z-x)/2$が$A$の元で$a_1+a_2=2a_3$を満たす。$A$は非自明な三項等差数列を含まないので$a_1=a_2=a_3$である。よって三角形は$(x,a)$（$x\in\mathbb{Z}/M\mathbb{Z}$、$a\in A$）に対応する$(x,x+a,x+2a)$だけで、ちょうど$M|A|$個ある。これらの三角形は辺を共有しない。実際、一辺から組$(x,a)$が定まる。

    したがって三角形をなくすには$M|A|$本以上の辺を除く必要がある。一方、三角形の個数$M|A|\le M^2$は頂点数$3M$の三乗に比べて小さい。三角形除去補題を$\varepsilon'=\varepsilon/40$で適用すると、$M$が十分大きければ、除く辺は$\varepsilon'(3M)^2$本未満でよい。したがって$M|A|<\varepsilon'(3M)^2$である。すなわち$|A|<9\varepsilon'M=\frac{9\varepsilon(2n+1)}{40}<\varepsilon n$となり、$|A|\ge\varepsilon n$に矛盾する。この$M$の下限から$N$を定める。
  strategy: Encode three-term progressions as triangles of a tripartite graph and apply the removal lemma.
  sketch:
  - 'setup: Assume A has no nontrivial progression and work in Z/MZ with M = 2n+1.'
  - 'construct: Build a tripartite graph with edges given by differences in A.'
  - 'derive: Triangles correspond to progressions in A, so only the M|A| trivial ones exist.'
  - 'derive: Those triangles are edge-disjoint, so removing them needs at least M|A| edges.'
  - 'apply_theorem: The removal lemma bounds that number, which contradicts |A| ≥ εn for large n.'
  openmath: (forall (e) (-> (and (in e R) (> e 0)) (exists (M) (and (in M N) (forall (n s) (-> (and (in n N) (<= M n) (subset s (finset_range n)) (<= (* e n) (size s))) (not (three_ap_free s))))))))
  hard_negative:
    statement: 同じ条件で$A$は長さ$3$の公差$1$の等差数列を含む。
    reason: $A$を$3$の倍数全体とすると$|A|\ge n/3$であるが、公差$1$の等差数列は含まない。
  target: |
    ∀ (ε : ℝ), 0 < ε → ∃ N : ℕ, ∀ (n : ℕ) (A : Finset ℕ), N ≤ n → A ⊆ Finset.range n → ε * n ≤ A.card → ¬ ThreeAPFree (A : Set ℕ)
  proof: |
    by
      intro ε hε
      refine ⟨⌈cornersTheoremBound (ε / 3)⌉₊, fun n A hn hA hc => ?_⟩
      exact roth_3ap_theorem_nat ε hε ((Nat.le_ceil _).trans hn) A hA hc
- id: edge_density_add_complement
  kind: gap
  level: 2
  topic: グラフ理論・辺密度
  statement: グラフ$G$と互いに素な空でない頂点の有限集合$s,t$について、辺密度は$d_G(s,t)+d_{\overline{G}}(s,t)=1$を満たす。ここで$d_G(s,t)=\frac{e_G(s,t)}{|s||t|}$であり、$\overline{G}$は補グラフである。
  statement_en: For a graph G and disjoint nonempty finite sets s, t of vertices, the edge densities satisfy d_G(s,t) + d_{G^c}(s,t) = 1, where d_G(s,t) = e_G(s,t)/(|s||t|).
  assumptions:
  - $G$はグラフ
  - $s,t$は互いに素な空でない頂点の有限集合
  - $e_G(s,t)$は$s$の頂点と$t$の頂点を結ぶ辺の本数
  quantifiers:
  - 任意のグラフ$G$と集合$s,t$
  conclusion: $d_G(s,t)+d_{\overline{G}}(s,t)=1$である。
  answer: |
    $G$をグラフ、$s,t$を互いに素な空でない頂点の有限集合とする。$(x,y)\in s\times t$について、$s,t$が互いに素なので$x\ne y$である。したがって$x,y$は$G$で隣接するか、補グラフ$\overline{G}$で隣接するかのどちらか一方である。

    よって$e_G(s,t)+e_{\overline{G}}(s,t)=|s||t|$である。$s,t$は空でないので$|s||t|$で割ることができ、$d_G(s,t)+d_{\overline{G}}(s,t)=1$である。
  strategy: Each pair in s × t is an edge of exactly one of G and its complement because s and t are disjoint.
  sketch:
  - 'derive: Disjointness gives x ≠ y for every pair in s × t.'
  - 'derive: Each pair is adjacent in exactly one of G and its complement.'
  - 'conclude: Dividing the edge count identity by |s||t| gives the claim.'
  openmath: (forall (G s t) (-> (and (simple_graph G) (subset s (graph_vertices G)) (subset t (graph_vertices G)) (finite_set s) (finite_set t) (!= s emptyset) (!= t emptyset) (= (inter s t) emptyset)) (= (+ (edge_density G s t) (edge_density (graph_complement G) s t)) 1)))
  hard_negative:
    statement: $s,t$が交わっていても同じ等式が成り立つ。
    reason: $s=t=\{x\}$では$(x,x)$はどちらのグラフでも辺でないので、両方の密度が$0$で和は$0$である。
  target: |
    ∀ (V : Type*) [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (s t : Finset V), s.Nonempty → t.Nonempty → Disjoint s t → G.edgeDensity s t + Gᶜ.edgeDensity s t = 1
  proof: |
    by
      intro V _ G _ s t h1 h2 h3
      exact G.edgeDensity_add_edgeDensity_compl h1 h2 h3
- id: uniform_pair_mono_symm
  kind: gap
  level: 3
  topic: グラフ理論・一様な組
  statement: グラフ$G$の頂点の有限集合の組$(s,t)$が$\varepsilon$一様なら、$\varepsilon\le\varepsilon'$である$\varepsilon'$について$\varepsilon'$一様であり、組$(t,s)$も$\varepsilon$一様である。ここで$(s,t)$が$\varepsilon$一様とは、$s'\subseteq s$、$t'\subseteq t$、$|s'|\ge\varepsilon|s|$、$|t'|\ge\varepsilon|t|$なら$|d(s',t')-d(s,t)|<\varepsilon$となることである。
  statement_en: If a pair (s,t) of finite vertex sets of a graph is ε-uniform, then it is ε'-uniform for ε ≤ ε' and (t,s) is ε-uniform, where ε-uniform means |d(s',t') - d(s,t)| < ε for all s' ⊆ s, t' ⊆ t with |s'| ≥ ε|s| and |t'| ≥ ε|t|.
  assumptions:
  - $G$はグラフ、$s,t$は頂点の有限集合
  - $(s,t)$は$\varepsilon$一様
  - $\varepsilon\le\varepsilon'$
  quantifiers:
  - 任意のグラフ$G$、集合$s,t$、実数$\varepsilon,\varepsilon'$
  conclusion: $(s,t)$は$\varepsilon'$一様であり、$(t,s)$は$\varepsilon$一様である。
  answer: |
    $G$をグラフ、$s,t$を頂点の有限集合、$(s,t)$を$\varepsilon$一様、$\varepsilon\le\varepsilon'$とする。

    $s'\subseteq s$、$t'\subseteq t$で$|s'|\ge\varepsilon'|s|$、$|t'|\ge\varepsilon'|t|$とする。$\varepsilon\le\varepsilon'$なので$|s'|\ge\varepsilon|s|$、$|t'|\ge\varepsilon|t|$である。よって$|d(s',t')-d(s,t)|<\varepsilon\le\varepsilon'$であり、$(s,t)$は$\varepsilon'$一様である。

    隣接関係は対称なので$d(x,y)=d(y,x)$である。$t'\subseteq t$、$s'\subseteq s$で大きさの条件が成り立つとき、$|d(t',s')-d(t,s)|=|d(s',t')-d(s,t)|<\varepsilon$である。よって$(t,s)$も$\varepsilon$一様である。
  strategy: The size conditions weaken monotonically, and edge density is symmetric.
  sketch:
  - 'derive: The stronger size condition for ε'' implies that for ε.'
  - 'derive: The density bound below ε gives one below ε''.'
  - 'derive: Edge density is symmetric in its two arguments.'
  - 'conclude: Both claims follow from the definition.'
  openmath: (forall (G s t e f) (-> (and (simple_graph G) (uniform_pair G e s t) (<= e f)) (and (uniform_pair G f s t) (uniform_pair G e t s))))
  hard_negative:
    statement: $(s,t)$が$\varepsilon$一様で$\varepsilon'\le\varepsilon$なら$\varepsilon'$一様である。
    reason: $\varepsilon'=0$では$|d(s',t')-d(s,t)|<0$が要求され、どの組についても成り立たない。
  target: |
    ∀ (V : Type*) [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (s t : Finset V) (ε ε' : ℝ), ε ≤ ε' → G.IsUniform ε s t → G.IsUniform ε' s t ∧ G.IsUniform ε t s
  proof: |
    by
      intro V _ G _ s t ε ε' h1 h2
      exact ⟨h2.mono h1, h2.symm⟩
- id: edge_density_large_subsets_close
  kind: gap
  level: 3
  topic: グラフ理論・辺密度の比較
  statement: グラフ$G$の頂点の有限集合$s_2\subseteq s_1$、$t_2\subseteq t_1$と$\delta\ge 0$が$(1-\delta)|s_1|\le|s_2|$、$(1-\delta)|t_1|\le|t_2|$を満たすなら、辺密度は$|d(s_2,t_2)-d(s_1,t_1)|\le 2\delta$を満たす。空集合を含む組の密度は$0$とする。
  statement_en: If s_2 ⊆ s_1 and t_2 ⊆ t_1 are finite vertex sets of a graph and δ ≥ 0 with (1-δ)|s_1| ≤ |s_2| and (1-δ)|t_1| ≤ |t_2|, then |d(s_2,t_2) - d(s_1,t_1)| ≤ 2δ, with density 0 for pairs involving an empty set.
  assumptions:
  - $G$はグラフ、$s_2\subseteq s_1$、$t_2\subseteq t_1$は頂点の有限集合
  - $\delta\ge 0$
  - $(1-\delta)|s_1|\le|s_2|$、$(1-\delta)|t_1|\le|t_2|$
  - 空集合を含む組の密度は$0$
  quantifiers:
  - 任意のグラフ$G$、集合$s_1,s_2,t_1,t_2$、実数$\delta\ge 0$
  conclusion: $|d(s_2,t_2)-d(s_1,t_1)|\le 2\delta$である。
  answer: |
    $G$をグラフ、$s_2\subseteq s_1$、$t_2\subseteq t_1$、$\delta\ge 0$で大きさの仮定が成り立つとする。密度は$0$以上$1$以下なので、差の絶対値は$1$以下である。$\delta\ge 1/2$なら$2\delta\ge 1$で成り立つ。$\delta<1/2$とする。

    $s_1$か$t_1$が空なら、$s_2$か$t_2$も空なので両方の密度が$0$で成り立つ。空でないとする。$1-\delta>0$より$s_2,t_2$も空でない。$d_i=d(s_i,t_i)$、$e_i$を$s_i,t_i$の間の辺の本数、$N_i=|s_i||t_i|$、$x=N_2/N_1$とする。仮定より$x\ge(1-\delta)^2$である。

    $s_2\times t_2\subseteq s_1\times t_1$より$e_2\le e_1\le e_2+N_1-N_2$である。これを$N_1$で割ると$xd_2\le d_1\le xd_2+1-x$である。したがって$d_2-d_1\le(1-x)d_2\le 1-x$であり、$d_1-d_2\le(1-x)(1-d_2)\le 1-x$である。

    よって$|d_2-d_1|\le 1-x\le 1-(1-\delta)^2=2\delta-\delta^2\le 2\delta$である。
  strategy: Sandwich e_1 between e_2 and e_2 + N_1 - N_2 and divide by N_1.
  sketch:
  - 'case_split: Dispose of large δ and of empty sets.'
  - 'setup: Let x = |s_2||t_2|/(|s_1||t_1|), which is at least (1-δ)^2.'
  - 'derive: Counting edges gives e_2 ≤ e_1 ≤ e_2 + N_1 - N_2.'
  - 'derive: Dividing by N_1 gives |d_1 - d_2| ≤ 1 - x.'
  - 'conclude: This is at most 2δ.'
  openmath: (forall (G a b c d x) (-> (and (simple_graph G) (subset b a) (subset d c) (finite_set a) (finite_set c) (>= x 0) (<= (* (- 1 x) (size a)) (size b)) (<= (* (- 1 x) (size c)) (size d))) (<= (abs (- (edge_density G b d) (edge_density G a c))) (* 2 x))))
  hard_negative:
    statement: 同じ条件で$|d(s_2,t_2)-d(s_1,t_1)|\le\delta$である。
    reason: 互いに素な大きさ$10$の集合$s_1,t_1$と$9$元部分集合$s_2,t_2$をとり、$s_2\times t_2$の組だけを辺で結ぶ。$\delta=1/10$で$d(s_2,t_2)=1$、$d(s_1,t_1)=81/100$であり、差$19/100$は$\delta$より大きい。
  target: |
    ∀ (V : Type*) [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (s₁ s₂ t₁ t₂ : Finset V) (δ : ℝ), s₂ ⊆ s₁ → t₂ ⊆ t₁ → 0 ≤ δ → (1 - δ) * s₁.card ≤ s₂.card → (1 - δ) * t₁.card ≤ t₂.card → |(G.edgeDensity s₂ t₂ : ℝ) - G.edgeDensity s₁ t₁| ≤ 2 * δ
  proof: |
    by
      intro V _ G _ s₁ s₂ t₁ t₂ δ h1 h2 h3 h4 h5
      exact Rel.abs_edgeDensity_sub_edgeDensity_le_two_mul G.Adj h1 h2 h3 h4 h5
- id: regular_graph_degree_times_vertices
  kind: gap
  level: 1
  topic: グラフ理論・握手補題の一般形
  statement: 有限グラフ$G$が$k$正則（すべての頂点の次数が$k$）なら、$k|V|=2|E|$である。
  statement_en: If a finite graph is k-regular, then k|V| = 2|E|.
  assumptions:
  - $G=(V,E)$は有限単純グラフ
  - すべての頂点の次数は$k$
  quantifiers:
  - 任意の有限グラフ$G$と自然数$k$
  conclusion: $k|V|=2|E|$である。
  answer: |
    $G=(V,E)$を$k$正則な有限単純グラフとする。各辺は両端の二つの頂点に一度ずつ数えられるので、握手補題より$\sum_{v\in V}\deg v=2|E|$である。すべての$v$で$\deg v=k$なので、左辺は$k|V|$である。よって$k|V|=2|E|$である。
  strategy: Substitute constant degree into the handshake lemma.
  sketch:
  - 'apply_theorem: The handshake lemma gives the degree sum 2|E|.'
  - 'derive: All degrees equal k, so the degree sum is k|V|.'
  openmath: (forall (G k) (-> (and (finite_simple_graph G) (graph_regular G k)) (= (* k (size (graph_vertices G))) (* 2 (size (graph_edges G))))))
  hard_negative:
    statement: $3$正則なグラフの頂点数は奇数にもなり得る。
    reason: $3|V|=2|E|$の右辺は偶数なので$|V|$は偶数である。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (k : ℕ), G.IsRegularOfDegree k → k * Fintype.card V = 2 * G.edgeFinset.card
  proof: |
    by
      intro V _ _ G _ k h
      rw [← G.sum_degrees_eq_twice_card_edges]
      simp [h.degree_eq, mul_comm]
- id: min_max_degree_edge_bounds
  kind: gap
  level: 1
  topic: グラフ理論・握手補題の一般形
  statement: 有限グラフ$G=(V,E)$の最小次数$\delta$と最大次数$\Delta$について、$\delta|V|\le 2|E|\le\Delta|V|$である。頂点集合が空なら$\delta=\Delta=0$とする。
  statement_en: For a finite graph G = (V,E) with minimum degree δ and maximum degree Δ, δ|V| ≤ 2|E| ≤ Δ|V|, with δ = Δ = 0 for the empty vertex set.
  assumptions:
  - $G=(V,E)$は有限単純グラフ
  - $\delta,\Delta$は最小次数と最大次数（$V$が空なら$0$）
  quantifiers:
  - 任意の有限グラフ$G$
  conclusion: $\delta|V|\le 2|E|\le\Delta|V|$である。
  answer: |
    $G=(V,E)$を有限単純グラフとする。$V$が空なら三辺とも$0$である。$V$が空でないとする。すべての$v$で$\delta\le\deg v\le\Delta$である。これを$v\in V$で足すと$\delta|V|\le\sum_v\deg v\le\Delta|V|$である。握手補題より中央の和は$2|E|$である。
  strategy: Sum the degree bounds over all vertices and apply the handshake lemma.
  sketch:
  - 'case_split: The empty vertex set is immediate.'
  - 'derive: Each degree lies between δ and Δ.'
  - 'apply_theorem: Summing and using the handshake lemma gives the claim.'
  openmath: (forall (G) (-> (finite_simple_graph G) (and (<= (* (graph_min_degree G) (size (graph_vertices G))) (* 2 (size (graph_edges G)))) (<= (* 2 (size (graph_edges G))) (* (graph_max_degree G) (size (graph_vertices G)))))))
  hard_negative:
    statement: $2|E|\le\delta|V|$である。
    reason: 頂点が$3$個の道では$2|E|=4$であり、$\delta|V|=3$である。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj], G.minDegree * Fintype.card V ≤ 2 * G.edgeFinset.card ∧ 2 * G.edgeFinset.card ≤ G.maxDegree * Fintype.card V
  proof: |
    by
      intro V _ _ G _
      rw [← G.sum_degrees_eq_twice_card_edges]
      constructor
      · calc G.minDegree * Fintype.card V = ∑ _v : V, G.minDegree := by simp [mul_comm]
          _ ≤ _ := Finset.sum_le_sum fun v _ => G.minDegree_le_degree v
      · calc ∑ v, G.degree v ≤ ∑ _v : V, G.maxDegree := Finset.sum_le_sum fun v _ => G.degree_le_maxDegree v
          _ = _ := by simp [mul_comm]
- id: degree_add_complement_degree
  kind: gap
  level: 1
  topic: グラフ理論・補グラフ
  statement: 有限グラフ$G$と頂点$v$について、$\deg_G v+\deg_{\overline{G}}v+1=|V|$である。ここで$\overline{G}$は補グラフである。
  statement_en: For a finite graph G and a vertex v, deg_G v + deg_{G^c} v + 1 = |V|, where G^c is the complement.
  assumptions:
  - $G$は有限単純グラフ
  - $v$は頂点
  - $\overline{G}$は$G$の補グラフ
  quantifiers:
  - 任意の有限グラフ$G$と頂点$v$
  conclusion: $\deg_G v+\deg_{\overline{G}}v+1=|V|$である。
  answer: |
    $G$を有限単純グラフ、$v$を頂点とする。$v$と異なる頂点$w$は$|V|-1$個ある。各$w$について、$v,w$は$G$か$\overline{G}$のどちらか一方でちょうど隣接する。よって$\deg_G v+\deg_{\overline{G}}v=|V|-1$である。
  strategy: Classify the other vertices by adjacency in G or in its complement.
  sketch:
  - 'setup: There are |V| - 1 vertices other than v.'
  - 'derive: Each is adjacent to v in exactly one of G and its complement.'
  - 'conclude: Counting gives the identity.'
  openmath: (forall (G v) (-> (and (finite_simple_graph G) (in v (graph_vertices G))) (= (+ (+ (graph_degree G v) (graph_degree (graph_complement G) v)) 1) (size (graph_vertices G)))))
  hard_negative:
    statement: $\deg_G v+\deg_{\overline{G}}v=|V|$である。
    reason: 一頂点のグラフでは左辺は$0$であり、$|V|=1$である。自分自身はどちらのグラフでも隣接しない。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (v : V), G.degree v + Gᶜ.degree v + 1 = Fintype.card V
  proof: |
    by
      intro V _ _ G _ v
      have h1 := G.degree_compl v
      have h2 := G.degree_lt_card_verts v
      omega
- id: edges_add_complement_edges
  kind: gap
  level: 1
  topic: グラフ理論・補グラフ
  statement: 頂点数$n$の有限グラフ$G$の辺の本数と補グラフ$\overline{G}$の辺の本数の和は$\binom{n}{2}$である。
  statement_en: The number of edges of a finite graph G on n vertices plus the number of edges of its complement equals C(n,2).
  assumptions:
  - $G$は頂点数$n$の有限単純グラフ
  - $\overline{G}$は$G$の補グラフ
  quantifiers:
  - 任意の有限グラフ$G$
  conclusion: $|E(G)|+|E(\overline{G})|=\binom{n}{2}$である。
  answer: |
    $G$を頂点数$n$の有限単純グラフとする。異なる二頂点の組は$\binom{n}{2}$個ある。各組は$G$の辺か$\overline{G}$の辺のどちらか一方である。よって$|E(G)|+|E(\overline{G})|=\binom{n}{2}$である。
  strategy: Each pair of distinct vertices is an edge of exactly one of the two graphs.
  sketch:
  - 'setup: There are C(n,2) pairs of distinct vertices.'
  - 'derive: Each pair is an edge of exactly one of G and its complement.'
  - 'conclude: Summing gives the identity.'
  openmath: (forall (G) (-> (finite_simple_graph G) (= (+ (size (graph_edges G)) (size (graph_edges (graph_complement G)))) (binom (size (graph_vertices G)) 2))))
  hard_negative:
    statement: $|E(G)|=|E(\overline{G})|$である。
    reason: 頂点数$3$の完全グラフでは$|E(G)|=3$、$|E(\overline{G})|=0$である。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj], G.edgeFinset.card + Gᶜ.edgeFinset.card = (Fintype.card V).choose 2
  proof: |
    by
      intro V _ _ G _
      rw [← SimpleGraph.card_edgeFinset_top_eq_card_choose_two, ← Finset.card_union_of_disjoint]
      · congr 1
        ext e
        simp only [Finset.mem_union, SimpleGraph.mem_edgeFinset]
        rw [← Set.mem_union, ← SimpleGraph.edgeSet_sup, sup_compl_eq_top]
      · rw [SimpleGraph.disjoint_edgeFinset]
        exact disjoint_compl_right
- id: bipartite_degree_sums_edge_bound
  kind: gap
  level: 2
  topic: グラフ理論・二部グラフの辺
  statement: 有限グラフ$G$のすべての辺が互いに素な頂点集合$s,t$の間を結ぶなら、$\sum_{v\in s}\deg v=\sum_{w\in t}\deg w=|E|$であり、$|E|\le|s||t|$である。
  statement_en: If every edge of a finite graph joins two disjoint vertex sets s and t, then the sum of degrees over s and the sum over t both equal |E|, and |E| ≤ |s||t|.
  assumptions:
  - $G$は有限単純グラフ
  - $s,t$は互いに素な頂点集合
  - すべての辺は$s$の頂点と$t$の頂点を結ぶ
  quantifiers:
  - 任意の有限グラフ$G$と集合$s,t$
  conclusion: $\sum_{v\in s}\deg v=\sum_{w\in t}\deg w=|E|$かつ$|E|\le|s||t|$である。
  answer: |
    $G=(V,E)$を有限単純グラフ、$s,t$を互いに素な頂点集合で、すべての辺が$s$と$t$を結ぶとする。各辺は$s$の頂点をちょうど一つ含むので、辺をその$s$側の頂点で分類すると$\sum_{v\in s}\deg v=|E|$である。$t$についても同様に$\sum_{w\in t}\deg w=|E|$である。

    $v\in s$の隣接頂点はすべて$t$に属するので$\deg v\le|t|$である。したがって$|E|=\sum_{v\in s}\deg v\le|s||t|$である。
  strategy: Classify edges by their endpoint in s and bound each degree by |t|.
  sketch:
  - 'derive: Each edge has exactly one endpoint in s and one in t.'
  - 'derive: Hence the degree sums over s and over t equal |E|.'
  - 'derive: Neighbors of a vertex in s lie in t, so its degree is at most |t|.'
  - 'conclude: Summing gives |E| ≤ |s||t|.'
  openmath: (forall (G s t) (-> (and (finite_simple_graph G) (graph_bipartite_with G s t)) (and (= (sum s (lambda (v) (graph_degree G v))) (size (graph_edges G))) (= (sum t (lambda (w) (graph_degree G w))) (size (graph_edges G))) (<= (size (graph_edges G)) (* (size s) (size t))))))
  hard_negative:
    statement: 同じ条件で$\sum_{v\in s}\deg v=2|E|$である。
    reason: 辺が一本で$s,t$が一点ずつなら$\sum_{v\in s}\deg v=1$であり、$2|E|=2$である。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (s t : Finset V), G.IsBipartiteWith (s : Set V) (t : Set V) → (∑ v ∈ s, G.degree v = G.edgeFinset.card) ∧ (∑ w ∈ t, G.degree w = G.edgeFinset.card) ∧ G.edgeFinset.card ≤ s.card * t.card
  proof: |
    by
      intro V _ _ G _ s t h
      have h1 := SimpleGraph.isBipartiteWith_sum_degrees_eq_card_edges h
      have h2 := SimpleGraph.isBipartiteWith_sum_degrees_eq_card_edges' h
      refine ⟨h1, h2, ?_⟩
      rw [← h1]
      calc ∑ v ∈ s, G.degree v ≤ ∑ _v ∈ s, t.card := Finset.sum_le_sum fun v hv => SimpleGraph.isBipartiteWith_degree_le h hv
        _ = _ := by simp
- id: reachable_has_short_path
  kind: gap
  level: 1
  topic: グラフ理論・歩道と道
  statement: 有限グラフで$u$から$v$への歩道があるなら、$u$から$v$への道で長さが$|V|-1$以下のものがある。
  statement_en: In a finite graph, if there is a walk from u to v, then there is a path from u to v of length at most |V| - 1.
  assumptions:
  - $G=(V,E)$は有限単純グラフ
  - $u$から$v$への歩道がある
  quantifiers:
  - 任意の有限グラフ$G$と頂点$u,v$
  conclusion: 長さが$|V|$未満の$u$から$v$への道がある。
  answer: |
    $G=(V,E)$を有限単純グラフ、$u,v$を頂点とし、$u$から$v$への歩道があるとする。そのような歩道のうち最短のものを$p$とする。

    $p$が同じ頂点$x$を二度通るなら、一度目から二度目までの部分を除くと、より短い$u$から$v$への歩道が得られる。これは最短性に反する。よって$p$の頂点はすべて相異なり、$p$は道である。

    道の頂点は相異なるので、頂点数は$|V|$以下である。長さは頂点数より$1$小さいので、$|V|$未満である。
  strategy: A shortest walk repeats no vertex, and a path has at most |V| vertices.
  sketch:
  - 'setup: Take a shortest walk from u to v.'
  - 'contradiction: A repeated vertex would allow a shorter walk.'
  - 'derive: So the walk is a path with at most |V| vertices.'
  - 'conclude: Its length is less than |V|.'
  openmath: (forall (G u v) (-> (and (finite_simple_graph G) (graph_reachable G u v)) (exists (p) (and (graph_path p G u v) (< (walk_length p) (size (graph_vertices G)))))))
  hard_negative:
    statement: $u$から$v$へのどの歩道も長さが$|V|$未満である。
    reason: 頂点数$2$のグラフで$u,v,u,v$とたどる歩道は長さが$3$であり、$|V|=2$以上である。
  target: |
    ∀ (V : Type*) [Fintype V] (G : SimpleGraph V) (u v : V), G.Reachable u v → ∃ p : G.Walk u v, p.IsPath ∧ p.length < Fintype.card V
  proof: |
    by
      intro V _ G u v h
      obtain ⟨p, hp⟩ := h.exists_isPath
      exact ⟨p, hp, hp.length_lt⟩
- id: walk_contains_no_longer_path
  kind: gap
  level: 1
  topic: グラフ理論・歩道と道
  statement: グラフの$u$から$v$への歩道$p$に対して、$p$の頂点だけを通り、長さが$p$以下の$u$から$v$への道がある。
  statement_en: For a walk p from u to v in a graph, there is a path from u to v of length at most that of p using only vertices of p.
  assumptions:
  - $G$は単純グラフ
  - $p$は$u$から$v$への歩道
  quantifiers:
  - 任意のグラフ$G$と歩道$p$
  conclusion: $p$の頂点だけを通り、長さが$p$以下の$u$から$v$への道がある。
  answer: |
    $G$を単純グラフ、$p$を$u$から$v$への歩道とする。$p$の長さについての帰納法で示す。

    $p$が長さ$0$なら$u=v$で、$p$自身が道である。$p$の最初の辺を$u x$、残りの歩道を$p'$とする。帰納法の仮定より、$p'$の頂点だけを通り長さが$p'$以下の$x$から$v$への道$q$がある。$u$が$q$に現れないなら、$u x$に続けて$q$をたどる歩道は道であり、長さは$p$以下である。$u$が$q$に現れるなら、$q$の$u$から後の部分は$u$から$v$への道であり、長さは$q$以下である。いずれの道も$p$の頂点だけを通る。
  strategy: Induct on the length of the walk, removing the initial segment when u reappears.
  sketch:
  - 'induction: Induct on the length of the walk.'
  - 'derive: The rest of the walk contains a path q from x to v.'
  - 'case_split: Either u is not on q or q passes through u.'
  - 'conclude: In both cases a path from u to v with the required properties results.'
  openmath: (forall (G u v p) (-> (and (simple_graph G) (graph_walk p G u v)) (exists (q) (and (graph_path q G u v) (<= (walk_length q) (walk_length p)) (subset (walk_support q) (walk_support p))))))
  hard_negative:
    statement: 同じ条件で$p$の辺をすべて使う道がある。
    reason: 辺$uv$と$vw$を$u,v,w,v$の順にたどる歩道では、$u$から$v$への道は辺$vw$を使えない。
  target: |
    ∀ (V : Type*) [DecidableEq V] (G : SimpleGraph V) (u v : V) (p : G.Walk u v), ∃ q : G.Walk u v, q.IsPath ∧ q.length ≤ p.length ∧ q.support ⊆ p.support
  proof: |
    by
      intro V _ G u v p
      exact ⟨p.bypass, p.bypass_isPath, p.length_bypass_le_length, p.support_bypass_subset_support⟩
- id: disconnected_graph_complement_connected
  kind: gap
  level: 2
  topic: グラフ理論・連結性と補グラフ
  statement: 頂点集合が空でないグラフ$G$が連結でないなら、補グラフ$\overline{G}$は連結である。
  statement_en: If a graph G with nonempty vertex set is not connected, then its complement is connected.
  assumptions:
  - $G$は頂点集合が空でない単純グラフ
  - $G$は連結でない
  quantifiers:
  - 任意のグラフ$G$
  conclusion: $\overline{G}$は連結である。
  answer: |
    $G$を頂点集合が空でない単純グラフで連結でないものとする。$G$で互いに到達できない頂点は異なり、隣接しないので、補グラフ$\overline{G}$で隣接する。

    頂点$u,v$をとる。$G$で$u$と$v$が到達できないなら、$\overline{G}$で隣接する。$G$で到達できるとする。$G$は連結でないので、$G$で到達できない頂点の組$a,b$がある。$u$が$a$に到達できるなら、$u$は$b$に到達できない。このとき$v$も$b$に到達できないので、$\overline{G}$で$u,b,v$の順に結ばれる。$u$が$a$に到達できないなら、$v$も$a$に到達できないので、$\overline{G}$で$u,a,v$の順に結ばれる。

    よって$\overline{G}$の任意の二頂点は歩道で結ばれ、$\overline{G}$は連結である。
  strategy: Vertices in different components are adjacent in the complement; vertices in one component share a neighbor there.
  sketch:
  - 'derive: Vertices not reachable from each other in G are adjacent in the complement.'
  - 'case_split: Take u and v and split on reachability in G.'
  - 'construct: If u and v lie in one component, use a vertex outside that component as a middle point.'
  - 'conclude: The complement is connected.'
  openmath: (forall (G) (-> (and (simple_graph G) (!= (graph_vertices G) emptyset) (not (graph_connected G))) (graph_connected (graph_complement G))))
  hard_negative:
    statement: $G$が連結なら$\overline{G}$は連結でない。
    reason: 頂点が$4$個の道は連結であり、その補グラフも頂点が$4$個の道で連結である。
  target: |
    ∀ (V : Type*) [Nonempty V] (G : SimpleGraph V), ¬ G.Preconnected → Gᶜ.Connected
  proof: |
    by
      intro V _ G h
      have hadj : ∀ a b : V, ¬ G.Reachable a b → Gᶜ.Adj a b := by
        intro a b hab
        rw [SimpleGraph.compl_adj]
        exact ⟨fun e => hab (e ▸ SimpleGraph.Reachable.refl a), fun e => hab e.reachable⟩
      have hp : Gᶜ.Preconnected := by
        intro u v
        by_cases huv : G.Reachable u v
        · simp only [SimpleGraph.Preconnected, not_forall] at h
          obtain ⟨a, b, hab⟩ := h
          by_cases hua : G.Reachable u a
          · have hub : ¬ G.Reachable u b := fun hub => hab (hua.symm.trans hub)
            have hvb : ¬ G.Reachable v b := fun hvb => hub (huv.trans hvb)
            exact (hadj u b hub).reachable.trans (hadj v b hvb).reachable.symm
          · have hva : ¬ G.Reachable v a := fun hva => hua (huv.trans hva)
            exact (hadj u a hua).reachable.trans (hadj v a hva).reachable.symm
        · exact (hadj u v huv).reachable
      exact ⟨hp⟩
- id: tree_iff_connected_edge_count
  kind: textbook
  level: 2
  topic: グラフ理論・木の特徴付け
  statement: 有限グラフ$G=(V,E)$について、$G$が木であることと、$G$が連結で$|E|+1=|V|$であることは同値である。木の辺の個数の公式を含む。
  statement_en: A finite graph G = (V,E) is a tree if and only if it is connected and |E| + 1 = |V|. This contains the edge count formula for trees.
  assumptions:
  - $G=(V,E)$は有限単純グラフ
  - 木は連結で閉路を持たないグラフ
  quantifiers:
  - 任意の有限グラフ$G$
  conclusion: $G$が木であることと、連結かつ$|E|+1=|V|$であることは同値である。
  answer: |
    $G=(V,E)$を有限単純グラフとする。

    $G$が木なら連結であり、辺の個数の公式$|E|+1=|V|$が成り立つ。この公式は葉を一つずつ除く帰納法で得られる。頂点が$2$個以上の木には次数$1$の頂点があり、それを除いても木であり、頂点と辺が一つずつ減るからである。

    逆に$G$が連結で$|E|+1=|V|$とする。$G$が閉路を持つなら、閉路上の辺を一本除いても連結性は保たれる。これを閉路がなくなるまで繰り返すと、辺を一本以上除いた連結で閉路のない部分グラフ$T$が得られる。$T$は頂点集合が$V$の木なので$|E(T)|+1=|V|$である。すると$|E(T)|<|E|$より$|E|+1>|V|$となり、仮定に反する。よって$G$は閉路を持たず、木である。
  strategy: Use the edge count of trees in one direction and prune cycles in the other.
  sketch:
  - 'derive: A tree is connected with |E| + 1 = |V| by removing leaves inductively.'
  - 'setup: Conversely assume G is connected with |E| + 1 = |V|.'
  - 'construct: If G has a cycle, deleting cycle edges gives a spanning tree with fewer edges.'
  - 'contradiction: The spanning tree has |V| - 1 edges, contradicting the edge count.'
  openmath: (forall (G) (-> (finite_simple_graph G) (<-> (graph_tree G) (and (graph_connected G) (= (+ (size (graph_edges G)) 1) (size (graph_vertices G)))))))
  hard_negative:
    statement: $|E|+1=|V|$だけで$G$は木である。
    reason: 三角形と孤立点一つからなるグラフは$|V|=4$、$|E|=3$で等式を満たすが、連結でなく閉路も持つ。
  target: |
    ∀ (V : Type*) [Finite V] (G : SimpleGraph V), G.IsTree ↔ G.Connected ∧ Nat.card G.edgeSet + 1 = Nat.card V
  proof: |
    by
      intro V _ G
      exact SimpleGraph.isTree_iff_connected_and_card
- id: acyclic_iff_every_edge_bridge
  kind: gap
  level: 2
  topic: グラフ理論・橋と閉路
  statement: グラフ$G$が閉路を持たないことと、$G$のすべての辺が橋であることは同値である。ここで辺$uv$が橋とは、$uv$を除くと$u$から$v$へ到達できなくなることである。
  statement_en: A graph has no cycle if and only if every edge is a bridge, where an edge uv is a bridge when removing it makes v unreachable from u.
  assumptions:
  - $G$は単純グラフ
  - 辺$uv$が橋とは、$uv$を除くと$u$から$v$へ到達できなくなること
  quantifiers:
  - 任意のグラフ$G$
  conclusion: $G$が閉路を持たないことと、すべての辺が橋であることは同値である。
  answer: |
    $G$を単純グラフとする。

    $G$の辺$uv$が橋でないとする。$uv$を除いたグラフに$v$から$u$への道$q$がある。$q$に辺$uv$を加えると$G$の閉路になる。$q$の長さは$2$以上である。$q$の長さが$1$なら$q$は辺$uv$自身になるが、$uv$は除かれているからである。よって閉路を持たないならすべての辺は橋である。

    逆に$G$が閉路$c$を持つとし、$uv$を$c$の辺とする。$c$から$uv$を除くと、$uv$を使わない$u$から$v$への道が残る。したがって$uv$は橋でない。よってすべての辺が橋なら閉路はない。
  strategy: Translate between an edge outside the bridges and a cycle through that edge.
  sketch:
  - 'derive: A non-bridge uv gives a path from v to u avoiding uv of length at least 2.'
  - 'construct: Adding uv closes this path into a cycle.'
  - 'derive: An edge of a cycle has an alternative path around the cycle, so it is not a bridge.'
  - 'conclude: The two conditions are equivalent.'
  openmath: (forall (G) (-> (simple_graph G) (<-> (graph_acyclic G) (forall (u v) (-> (graph_adjacent G u v) (graph_bridge G u v))))))
  hard_negative:
    statement: すべての辺が橋であるグラフは連結である。
    reason: 互いに素な二本の辺からなるグラフでは、どの辺も橋だが連結でない。
  target: |
    ∀ (V : Type*) (G : SimpleGraph V), G.IsAcyclic ↔ ∀ e, e ∈ G.edgeSet → G.IsBridge e
  proof: |
    by
      intro V G
      exact SimpleGraph.isAcyclic_iff_forall_isBridge
- id: bridge_iff_on_no_cycle
  kind: gap
  level: 2
  topic: グラフ理論・橋と閉路
  statement: グラフ$G$の辺$uv$について、$uv$が橋であることと、$uv$を含む閉路が存在しないことは同値である。
  statement_en: An edge uv of a graph is a bridge if and only if no cycle contains uv.
  assumptions:
  - $G$は単純グラフ
  - $uv$は$G$の辺
  quantifiers:
  - 任意のグラフ$G$と辺$uv$
  conclusion: $uv$が橋であることと、$uv$を含む閉路がないことは同値である。
  answer: |
    $G$を単純グラフ、$uv$を辺とする。

    $uv$を含む閉路があるとする。閉路から$uv$を除くと、$uv$を使わない$u$から$v$への歩道が残る。よって$uv$を除いても$u$から$v$へ到達でき、$uv$は橋でない。

    $uv$が橋でないとする。$uv$を除いたグラフに$v$から$u$への道$q$がある。$q$は$uv$を使わないので長さが$2$以上である。$q$に辺$uv$を加えると、頂点が繰り返されない閉じた歩道になり、長さは$3$以上である。これは$uv$を含む閉路である。

    対偶により二つの条件は同値である。
  strategy: Turn a cycle through uv into a detour, and a detour into a cycle.
  sketch:
  - 'derive: A cycle through uv yields a walk from u to v avoiding uv.'
  - 'derive: A path from v to u avoiding uv has length at least 2.'
  - 'construct: Adding uv to that path gives a cycle through uv.'
  - 'conclude: Contraposition gives the equivalence.'
  openmath: (forall (G u v) (-> (and (simple_graph G) (graph_adjacent G u v)) (<-> (graph_bridge G u v) (not (graph_edge_on_cycle G u v)))))
  hard_negative:
    statement: 辺$uv$が橋なら$u$か$v$の次数は$1$である。
    reason: 二つの三角形を一本の辺で結ぶと、その辺は橋であるが、両端の次数は$3$である。
  target: |
    ∀ (V : Type*) (G : SimpleGraph V) (u v : V), G.Adj u v → (G.IsBridge s(u, v) ↔ ∀ (w : V) (c : G.Walk w w), c.IsCycle → s(u, v) ∉ c.edges)
  proof: |
    by
      intro V G u v h
      exact SimpleGraph.isBridge_iff_forall_cycle_notMem h
- id: acyclic_graph_is_bipartite
  kind: gap
  level: 2
  topic: グラフ理論・二部グラフの判定
  statement: 閉路を持たないグラフは$2$彩色可能である。
  statement_en: A graph without cycles has a proper vertex coloring with two colors.
  assumptions:
  - $G$は閉路を持たない単純グラフ
  quantifiers:
  - 任意のグラフ$G$
  conclusion: $G$は$2$彩色可能である。
  answer: |
    $G$を閉路を持たない単純グラフとする。各連結成分に根$r$を一つ選ぶ。閉路がないので、頂点$v$と同じ成分の根$r$を結ぶ道は一意である。その長さを$h(v)$とする。$v$の色を$h(v)$の偶奇で定める。

    $v,w$が隣接するとする。$r$から$v$への道$p$に$w$が現れるなら、$p$の$w$までの部分と辺$wv$は$r$から$v$への道である。一意性より、この道が$p$であり、$h(v)=h(w)+1$である。$p$に$w$が現れないなら、$p$に辺$vw$を加えた歩道は$r$から$w$への道であり、$h(w)=h(v)+1$である。

    どちらの場合も$h(v),h(w)$の偶奇は異なる。よってこの彩色は適切である。
  strategy: Color each vertex by the parity of its unique path length from a root of its component.
  sketch:
  - 'setup: Choose a root in each component; paths to the root are unique.'
  - 'construct: Color by the parity of the path length.'
  - 'case_split: For adjacent v and w, either w lies on the path to v or not.'
  - 'derive: In both cases the path lengths differ by exactly one.'
  - 'conclude: The coloring is proper.'
  openmath: (forall (G) (-> (and (simple_graph G) (graph_acyclic G)) (graph_colorable G 2)))
  hard_negative:
    statement: $2$彩色可能なグラフは閉路を持たない。
    reason: 長さ$4$の閉路は$2$彩色可能である。
  target: |
    ∀ (V : Type*) (G : SimpleGraph V), G.IsAcyclic → G.IsBipartite
  proof: |
    by
      intro V G h
      exact h.isBipartite
- id: clique_bounds_chromatic_number
  kind: gap
  level: 1
  topic: グラフ理論・色数の基本
  statement: 有限グラフ$G$の頂点集合$s$がクリーク（どの二頂点も隣接する）なら$|s|\le\chi(G)$である。頂点集合$V$上の完全グラフの色数は$|V|$である。
  statement_en: If a set s of vertices of a finite graph G is a clique, then |s| ≤ χ(G). The chromatic number of the complete graph on V is |V|.
  assumptions:
  - $G$は頂点集合$V$の有限単純グラフ
  - $s$はクリーク
  - $\chi(G)$は適切な頂点彩色に必要な色の個数の最小値
  quantifiers:
  - 任意の有限グラフ$G$とクリーク$s$
  conclusion: $|s|\le\chi(G)$であり、$V$上の完全グラフの色数は$|V|$である。
  answer: |
    $G$を頂点集合$V$の有限単純グラフ、$s$をクリークとする。適切な彩色では隣接する二頂点の色は異なるので、$s$の頂点の色はすべて異なる。よって色は$|s|$個以上必要であり、$|s|\le\chi(G)$である。

    $V$上の完全グラフでは$V$全体がクリークなので色は$|V|$個以上必要である。すべての頂点に異なる色を塗ると適切な彩色になるので、$|V|$個で足りる。よって色数は$|V|$である。
  strategy: Vertices of a clique need pairwise distinct colors.
  sketch:
  - 'derive: Colors on a clique are pairwise distinct.'
  - 'derive: So the number of colors is at least |s|.'
  - 'construct: Distinct colors on all vertices color the complete graph.'
  - 'conclude: The complete graph has chromatic number |V|.'
  openmath: (forall (G s) (-> (and (finite_simple_graph G) (subset s (graph_vertices G)) (graph_clique G s)) (and (<= (size s) (chromatic_number G)) (= (chromatic_number (complete_graph_on (graph_vertices G))) (size (graph_vertices G))))))
  hard_negative:
    statement: $\chi(G)$は最大クリークの大きさに等しい。
    reason: 長さ$5$の閉路では最大クリークの大きさは$2$だが、色数は$3$である。
  target: |
    ∀ (V : Type*) [Fintype V] (G : SimpleGraph V) (s : Finset V), G.IsClique (s : Set V) → (s.card : ℕ∞) ≤ G.chromaticNumber ∧ (⊤ : SimpleGraph V).chromaticNumber = Fintype.card V
  proof: |
    by
      intro V _ G s h
      exact ⟨h.card_le_chromaticNumber, SimpleGraph.chromaticNumber_top⟩
- id: cycle_graph_chromatic_number
  kind: textbook
  level: 2
  topic: グラフ理論・色数の基本
  statement: $n\ge 2$について、$\mathbb{Z}/n\mathbb{Z}$上の閉路グラフ（$i$と$i\pm 1$を結ぶ）の色数は、$n$が偶数なら$2$、$n$が奇数なら$3$である。
  statement_en: For n ≥ 2, the cycle graph on Z/nZ joining i to i ± 1 has chromatic number 2 when n is even and 3 when n is odd.
  assumptions:
  - $n\ge 2$
  - 閉路グラフは$\mathbb{Z}/n\mathbb{Z}$上で$i$と$i\pm 1$を結ぶグラフ
  quantifiers:
  - 任意の$n\ge 2$
  conclusion: 色数は$n$が偶数なら$2$、奇数なら$3$である。
  answer: |
    $n\ge 2$とし、$\mathbb{Z}/n\mathbb{Z}$の元を$0,1,\dots,n-1$で表す。辺があるので色は$2$個以上必要である。

    $n$が偶数なら、$i$の色を$i$の偶奇で定める。$i$と$i+1$は偶奇が異なり、$n-1$と$0$も偶奇が異なるので適切である。よって色数は$2$である。

    $n$が奇数なら$n\ge 3$である。$2$彩色があるとすると、$0,1,\dots,n-1$の順に色が交互になる。$n-1$は偶数なので$n-1$の色は$0$の色と同じだが、$n-1$と$0$は隣接するので矛盾する。よって色は$3$個以上必要である。$0,\dots,n-2$の色を偶奇で定め、$n-1$に第三の色を塗ると適切である。よって色数は$3$である。
  strategy: Alternate two colors along the cycle; parity decides whether the last edge is respected.
  sketch:
  - 'derive: An edge exists, so at least two colors are needed.'
  - 'case_split: Treat n even and n odd.'
  - 'construct: For even n, color by parity.'
  - 'contradiction: For odd n, two colors would force the adjacent vertices n-1 and 0 to share a color.'
  - 'construct: For odd n, a third color on n-1 gives a proper coloring.'
  openmath: (forall (n) (-> (and (in n N) (>= n 2)) (and (-> (exists (k) (and (in k N) (= n (* 2 k)))) (= (chromatic_number (cycle_graph n)) 2)) (-> (exists (k) (and (in k N) (= n (+ (* 2 k) 1)))) (= (chromatic_number (cycle_graph n)) 3)))))
  hard_negative:
    statement: 閉路グラフの色数は常に$2$である。
    reason: $n=3$では三角形になり、どの二頂点も隣接するので色は$3$個必要である。
  target: |
    ∀ (n : ℕ), 2 ≤ n → (Even n → (SimpleGraph.cycleGraph n).chromaticNumber = 2) ∧ (Odd n → (SimpleGraph.cycleGraph n).chromaticNumber = 3)
  proof: |
    by
      intro n h
      exact ⟨SimpleGraph.chromaticNumber_cycleGraph_of_even n h, SimpleGraph.chromaticNumber_cycleGraph_of_odd n h⟩
- id: chromatic_number_two_iff_bipartite_with_edge
  kind: gap
  level: 1
  topic: グラフ理論・二部グラフの判定
  statement: グラフ$G$の色数が$2$であることと、$G$が$2$彩色可能で少なくとも一本の辺を持つことは同値である。
  statement_en: A graph has chromatic number 2 if and only if it is 2-colorable and has at least one edge.
  assumptions:
  - $G$は単純グラフ
  quantifiers:
  - 任意のグラフ$G$
  conclusion: $\chi(G)=2$であることと、$2$彩色可能で辺を持つことは同値である。
  answer: |
    $G$を単純グラフとする。

    $\chi(G)=2$とする。色数の定義より$2$彩色可能である。辺がないなら、すべての頂点に同じ色を塗ると適切なので$\chi(G)\le 1$となり矛盾する。よって辺を持つ。

    逆に$G$が$2$彩色可能で辺$uv$を持つとする。$\chi(G)\le 2$である。$u,v$の色は異なるので色は$2$個以上必要である。よって$\chi(G)=2$である。
  strategy: A graph with no edge needs at most one color, and an edge forces two colors.
  sketch:
  - 'derive: Chromatic number 2 gives a 2-coloring.'
  - 'contradiction: With no edges one color would suffice.'
  - 'derive: Conversely an edge forces at least two colors.'
  - 'conclude: Hence the chromatic number is exactly 2.'
  openmath: (forall (G) (-> (simple_graph G) (<-> (= (chromatic_number G) 2) (and (graph_colorable G 2) (exists (u v) (graph_adjacent G u v))))))
  hard_negative:
    statement: $2$彩色可能なグラフの色数は$2$である。
    reason: 辺のない空でないグラフは$2$彩色可能だが、色数は$1$である。
  target: |
    ∀ (V : Type*) (G : SimpleGraph V), G.chromaticNumber = 2 ↔ G.IsBipartite ∧ G ≠ ⊥
  proof: |
    by
      intro V G
      exact SimpleGraph.chromaticNumber_eq_two_iff
- id: vertices_le_colors_times_independence
  kind: gap
  level: 2
  topic: グラフ理論・色数の基本
  statement: 有限グラフ$G$が$k$彩色可能なら、$|V|\le k\,\alpha(G)$である。ここで$\alpha(G)$は独立集合の大きさの最大値である。
  statement_en: If a finite graph G is k-colorable, then |V| ≤ k α(G), where α(G) is the independence number.
  assumptions:
  - $G=(V,E)$は有限単純グラフ
  - $G$は$k$彩色可能
  - $\alpha(G)$は独立集合の大きさの最大値
  quantifiers:
  - 任意の有限グラフ$G$と自然数$k$
  conclusion: $|V|\le k\,\alpha(G)$である。
  answer: |
    $G=(V,E)$を有限単純グラフ、$C$を$k$色の適切な彩色とする。各色$c$について$C^{-1}(c)$の頂点はどの二つも隣接しないので独立集合であり、大きさは$\alpha(G)$以下である。

    $V$は$k$個の色の類の互いに素な和集合である。よって$|V|=\sum_c|C^{-1}(c)|\le k\,\alpha(G)$である。
  strategy: Color classes are independent sets that partition the vertex set.
  sketch:
  - 'setup: Take a proper coloring with k colors.'
  - 'derive: Each color class is independent, so its size is at most α(G).'
  - 'conclude: Summing over the k classes gives the bound.'
  openmath: (forall (G k) (-> (and (finite_simple_graph G) (in k N) (graph_colorable G k)) (<= (size (graph_vertices G)) (* k (independence_number G)))))
  hard_negative:
    statement: 同じ条件で$|V|=k\,\alpha(G)$である。
    reason: 頂点が$3$個の道は$k=2$で彩色でき、$\alpha(G)=2$であるが、$|V|=3$である。
  target: |
    ∀ (V : Type*) [Fintype V] (G : SimpleGraph V) (k : ℕ), G.Colorable k → Fintype.card V ≤ k * G.indepNum
  proof: |
    by
      intro V _ G k ⟨C⟩
      classical
      have h : ∀ c ∈ (Finset.univ : Finset (Fin k)), (Finset.univ.filter (fun v => C v = c)).card ≤ G.indepNum := by
        intro c _
        refine SimpleGraph.IsIndepSet.card_le_indepNum ?_
        intro a ha b hb _ hab
        simp at ha hb
        exact C.valid hab (ha.trans hb.symm)
      calc Fintype.card V = ∑ c : Fin k, (Finset.univ.filter (fun v => C v = c)).card := by
            rw [← Finset.card_univ]
            exact Finset.card_eq_sum_card_fiberwise (fun _ _ => Finset.mem_univ _)
        _ ≤ ∑ _c : Fin k, G.indepNum := Finset.sum_le_sum h
        _ = _ := by simp
- id: triangle_free_adjacent_degree_sum
  kind: gap
  level: 1
  topic: グラフ理論・三角形を持たないグラフ
  statement: 三角形を持たない有限グラフで$u,v$が隣接するなら、$\deg u+\deg v\le|V|$である。
  statement_en: In a triangle-free finite graph, adjacent vertices u and v satisfy deg u + deg v ≤ |V|.
  assumptions:
  - $G=(V,E)$は三角形を持たない有限単純グラフ
  - $u,v$は隣接する
  quantifiers:
  - 任意の有限グラフ$G$と隣接する頂点$u,v$
  conclusion: $\deg u+\deg v\le|V|$である。
  answer: |
    $G=(V,E)$を三角形を持たない有限単純グラフ、$u,v$を隣接する頂点とする。$u$の隣接頂点の集合$N(u)$と$v$の隣接頂点の集合$N(v)$が共通元$w$を持つなら、$u,v,w$は三角形をなす。したがって$N(u)$と$N(v)$は互いに素である。

    よって$\deg u+\deg v=|N(u)\cup N(v)|\le|V|$である。
  strategy: The neighborhoods of adjacent vertices are disjoint in a triangle-free graph.
  sketch:
  - 'contradiction: A common neighbor of u and v would give a triangle.'
  - 'derive: So the neighborhoods are disjoint subsets of V.'
  - 'conclude: Their sizes add up to at most |V|.'
  openmath: (forall (G u v) (-> (and (finite_simple_graph G) (graph_clique_free G 3) (graph_adjacent G u v)) (<= (+ (graph_degree G u) (graph_degree G v)) (size (graph_vertices G)))))
  hard_negative:
    statement: 三角形を持たないグラフの隣接しない頂点についても$\deg u+\deg v\le|V|$である。
    reason: 完全二部グラフ$K_{2,3}$では、大きさ$2$の側の二頂点は隣接せず次数の和が$6$であり、$|V|=5$より大きい。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (u v : V), G.CliqueFree 3 → G.Adj u v → G.degree u + G.degree v ≤ Fintype.card V
  proof: |
    by
      intro V _ _ G _ u v hf huv
      have hd : Disjoint (G.neighborFinset u) (G.neighborFinset v) := by
        rw [Finset.disjoint_left]
        intro w hu hv
        rw [SimpleGraph.mem_neighborFinset] at hu hv
        exact hf {u, v, w} (SimpleGraph.is3Clique_triple_iff.mpr ⟨huv, hu, hv⟩)
      have := Finset.card_le_univ (G.neighborFinset u ∪ G.neighborFinset v)
      rw [Finset.card_union_of_disjoint hd, SimpleGraph.card_neighborFinset_eq_degree, SimpleGraph.card_neighborFinset_eq_degree] at this
      exact this
- id: mantel_triangle_free_edge_bound
  kind: textbook
  level: 2
  topic: グラフ理論・三角形を持たないグラフ
  statement: Mantel の定理。三角形を持たない$n$頂点の有限グラフの辺の本数$m$は$4m\le n^2$を満たす。トゥランの定理の$r=2$の場合を初等的に示す形である。
  statement_en: Mantel's theorem. A triangle-free finite graph with n vertices and m edges satisfies 4m ≤ n^2. This is the case r = 2 of Turán's theorem, proved elementarily.
  assumptions:
  - $G$は三角形を持たない$n$頂点の有限単純グラフ
  - $m$は辺の本数
  quantifiers:
  - 任意の有限グラフ$G$
  conclusion: $4m\le n^2$である。
  answer: |
    $G=(V,E)$を三角形を持たない$n$頂点の有限単純グラフ、$m=|E|$とする。$m=0$なら成り立つ。$m\ge 1$とすると$n\ge 1$である。隣接する$u,v$の隣接頂点の集合は互いに素なので、$\deg u+\deg v\le n$である。

    これを辺$uv$について足す。各頂点$v$は$\deg v$本の辺に現れるので、左辺は$\sum_{v}(\deg v)^2$である。よって$\sum_v(\deg v)^2\le mn$である。

    Cauchy-Schwarz の不等式と握手補題より$\sum_v(\deg v)^2\ge\frac{1}{n}\left(\sum_v\deg v\right)^2=\frac{4m^2}{n}$である。したがって$\frac{4m^2}{n}\le mn$であり、$m>0$で割って$4m\le n^2$を得る。
  strategy: Sum the degree bound over edges and apply Cauchy-Schwarz.
  sketch:
  - 'derive: Adjacent vertices have disjoint neighborhoods, so deg u + deg v ≤ n.'
  - 'derive: Summing over edges gives the sum of squared degrees at most mn.'
  - 'apply_theorem: Cauchy-Schwarz and the handshake lemma give a lower bound 4m^2/n.'
  - 'conclude: Dividing by m gives 4m ≤ n^2.'
  openmath: (forall (G) (-> (and (finite_simple_graph G) (graph_clique_free G 3)) (<= (* 4 (size (graph_edges G))) (^ (size (graph_vertices G)) 2))))
  hard_negative:
    statement: 三角形を持たないグラフは二部グラフである。
    reason: 長さ$5$の閉路は三角形を持たないが、奇閉路があるので二部グラフでない。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj], G.CliqueFree 3 → 4 * G.edgeFinset.card ≤ Fintype.card V ^ 2
  proof: |
    by
      intro V _ _ G _ h
      have h1 := SimpleGraph.CliqueFree.card_edgeFinset_le (r := 2) h
      have h2 : Fintype.card V % 2 < 2 := Nat.mod_lt _ (by norm_num)
      dsimp only at h1
      generalize Fintype.card V = n at *
      have h3 : (n % 2).choose 2 = 0 := Nat.choose_eq_zero_of_lt h2
      rw [h3, add_zero] at h1
      have h4 : (n ^ 2 - (n % 2) ^ 2) * (2 - 1) / (2 * 2) * 4 ≤ n ^ 2 := by
        have := Nat.div_mul_le_self ((n ^ 2 - (n % 2) ^ 2) * (2 - 1)) (2 * 2)
        simp only [Nat.reduceMul, Nat.reduceSub, mul_one] at this ⊢
        exact this.trans (Nat.sub_le _ _)
      omega
- id: locally_linear_edges_triple_triangles
  kind: gap
  level: 2
  topic: グラフ理論・三角形の数え上げ
  statement: 有限グラフのすべての辺がちょうど一つの三角形に含まれるなら、辺の本数は三角形の個数の$3$倍である。
  statement_en: If every edge of a finite graph lies in exactly one triangle, then the number of edges is three times the number of triangles.
  assumptions:
  - $G$は有限単純グラフ
  - すべての辺はちょうど一つの三角形に含まれる
  quantifiers:
  - 任意の有限グラフ$G$
  conclusion: 辺の本数は三角形の個数の$3$倍である。
  answer: |
    $G$をすべての辺がちょうど一つの三角形に含まれる有限単純グラフとする。辺$e$と三角形$T$で$e$が$T$の辺である組$(e,T)$を数える。

    仮定より各辺はちょうど一つの組に現れるので、組の個数は辺の本数である。各三角形はちょうど三本の辺を持つので、組の個数は三角形の個数の$3$倍である。よって辺の本数は三角形の個数の$3$倍である。
  strategy: Double count pairs consisting of an edge and a triangle containing it.
  sketch:
  - 'setup: Count pairs (e, T) with e an edge of the triangle T.'
  - 'derive: Each edge occurs in exactly one pair.'
  - 'derive: Each triangle occurs in exactly three pairs.'
  - 'conclude: Comparing gives the identity.'
  openmath: (forall (G) (-> (and (finite_simple_graph G) (locally_linear_graph G)) (= (size (graph_edges G)) (* 3 (size (graph_triangles G))))))
  hard_negative:
    statement: 任意の有限グラフで辺の本数は三角形の個数の$3$倍以上である。
    reason: 完全グラフ$K_5$は辺が$10$本で三角形が$10$個あり、$10<30$である。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj], G.LocallyLinear → G.edgeFinset.card = 3 * (G.cliqueFinset 3).card
  proof: |
    by
      intro V _ _ G _ h
      exact h.card_edgeFinset
- id: adjacency_matrix_power_counts_walks
  kind: textbook
  level: 2
  topic: グラフ理論・隣接行列と歩道
  statement: 有限グラフの隣接行列$A$について、$A^n$の$(u,v)$成分は、$u$から$v$への長さ$n$の歩道の個数に等しい。成分は任意の半環で考える。
  statement_en: For the adjacency matrix A of a finite graph over any semiring, the (u,v) entry of A^n equals the number of walks of length n from u to v.
  assumptions:
  - $G$は有限単純グラフ
  - $A$は半環$S$上の隣接行列
  - $n$は自然数
  quantifiers:
  - 任意の有限グラフ$G$、半環$S$、頂点$u,v$、自然数$n$
  conclusion: $(A^n)_{uv}$は$u$から$v$への長さ$n$の歩道の個数である。
  answer: |
    $G$を有限単純グラフ、$A$を隣接行列とする。$n$についての帰納法で、すべての$u,v$について示す。$n=0$では$A^0$は単位行列であり、長さ$0$の歩道は$u=v$のときだけ一つある。

    $n$で成り立つとする。$(A^{n+1})_{uv}=\sum_{w}A_{uw}(A^n)_{wv}$である。$A_{uw}$は$u,w$が隣接するとき$1$、そうでなければ$0$なので、この和は$u$に隣接する$w$についての$(A^n)_{wv}$の和である。帰納法の仮定より、これは$w$から$v$への長さ$n$の歩道の個数の和である。

    長さ$n+1$の$u$から$v$への歩道は、最初の一歩$u\to w$と$w$から$v$への長さ$n$の歩道の組に一意に分解される。よって和は長さ$n+1$の歩道の個数である。
  strategy: Induct on n by decomposing a walk into its first step and the rest.
  sketch:
  - 'induction: The case n = 0 is the identity matrix.'
  - 'derive: Expand the entry of A^(n+1) as a sum over neighbors of u.'
  - 'derive: A walk of length n+1 splits uniquely into a first step and a walk of length n.'
  - 'conclude: The entry counts walks of length n+1.'
  openmath: (forall (G u v n) (-> (and (finite_simple_graph G) (in u (graph_vertices G)) (in v (graph_vertices G)) (in n N)) (= (matrix_entry (^ (graph_adjacency_matrix G) n) u v) (size (walks_of_length G u v n)))))
  hard_negative:
    statement: $(A^n)_{uv}$は$u$から$v$への長さ$n$の道の個数である。
    reason: 辺$uv$一本のグラフで$n=2$、$u=v$とすると、$(A^2)_{uu}=1$であるが、長さ$2$の$u$から$u$への道はない。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (S : Type*) [Semiring S] (n : ℕ) (u v : V), (G.adjMatrix S ^ n) u v = (Fintype.card { p : G.Walk u v // p.length = n } : S)
  proof: |
    by
      intro V _ _ G _ S _ n u v
      exact G.adjMatrix_pow_apply_eq_card_walk n u v
- id: adjacency_square_diagonal_trace
  kind: gap
  level: 1
  topic: グラフ理論・隣接行列と次数
  statement: 有限グラフの可換半環上の隣接行列$A$について、$(A^2)_{ii}=\deg i$、$\operatorname{tr}A=0$、$\operatorname{tr}A^2=2|E|$である。
  statement_en: For the adjacency matrix A over a commutative semiring of a finite graph, (A^2)_{ii} = deg i, tr A = 0 and tr A^2 = 2|E|.
  assumptions:
  - $G=(V,E)$は有限単純グラフ
  - $A$は可換半環上の隣接行列
  - $i$は頂点
  quantifiers:
  - 任意の有限グラフ$G$、可換半環、頂点$i$
  conclusion: $(A^2)_{ii}=\deg i$、$\operatorname{tr}A=0$、$\operatorname{tr}A^2=2|E|$である。
  answer: |
    $G=(V,E)$を有限単純グラフ、$A$を隣接行列、$i$を頂点とする。$(A^2)_{ii}=\sum_jA_{ij}A_{ji}$である。$A_{ij}=A_{ji}$は$i,j$が隣接するとき$1$、そうでなければ$0$なので、和は$i$に隣接する$j$の個数$\deg i$である。

    単純グラフにループはないので$A_{ii}=0$であり、$\operatorname{tr}A=0$である。

    $\operatorname{tr}A^2=\sum_i\deg i$であり、握手補題よりこれは$2|E|$である。
  strategy: Expand the diagonal entries and use the handshake lemma.
  sketch:
  - 'derive: The diagonal entry of A^2 counts neighbors of i.'
  - 'derive: There are no loops, so the trace of A vanishes.'
  - 'apply_theorem: The handshake lemma gives tr A^2 = 2|E|.'
  openmath: (forall (G i) (-> (and (finite_simple_graph G) (in i (graph_vertices G))) (and (= (matrix_entry (^ (graph_adjacency_matrix G) 2) i i) (graph_degree G i)) (= (matrix_trace (graph_adjacency_matrix G)) 0) (= (matrix_trace (^ (graph_adjacency_matrix G) 2)) (* 2 (size (graph_edges G)))))))
  hard_negative:
    statement: $\operatorname{tr}A^2=|E|$である。
    reason: 辺一本のグラフでは$A^2$は単位行列で$\operatorname{tr}A^2=2$であり、$|E|=1$である。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (S : Type*) [CommSemiring S] (i : V), (G.adjMatrix S * G.adjMatrix S) i i = (G.degree i : S) ∧ Matrix.trace (G.adjMatrix S) = 0 ∧ Matrix.trace (G.adjMatrix S * G.adjMatrix S) = 2 * (G.edgeFinset.card : S)
  proof: |
    by
      intro V _ _ G _ S _ i
      refine ⟨G.adjMatrix_mul_self_apply_self i, by simp [Matrix.trace], ?_⟩
      simp only [Matrix.trace, Matrix.diag_apply, SimpleGraph.adjMatrix_mul_self_apply_self]
      have := G.sum_degrees_eq_twice_card_edges
      exact_mod_cast congrArg (Nat.cast : ℕ → S) this
- id: laplacian_quadratic_form_psd
  kind: gap
  level: 2
  topic: グラフ理論・Laplacian 行列
  statement: 有限グラフの実 Laplacian 行列$L=D-A$（$D$は次数の対角行列、$A$は隣接行列）について、$x\in\mathbb{R}^V$に対し$x^{\mathsf{T}}Lx=\frac12\sum_{i,j:\,i\sim j}(x_i-x_j)^2$であり、$L$は半正定値である。
  statement_en: For the real Laplacian matrix L = D - A of a finite graph, x^T L x = (1/2) sum over ordered adjacent pairs (i,j) of (x_i - x_j)^2 for x in R^V, and L is positive semidefinite.
  assumptions:
  - $G=(V,E)$は有限単純グラフ
  - $L=D-A$は実 Laplacian 行列
  - $x\in\mathbb{R}^V$
  quantifiers:
  - 任意の有限グラフ$G$とベクトル$x$
  conclusion: $x^{\mathsf{T}}Lx=\frac12\sum_{i\sim j}(x_i-x_j)^2$であり、$L$は半正定値である。
  answer: |
    $G=(V,E)$を有限単純グラフ、$L=D-A$、$x\in\mathbb{R}^V$とする。$x^{\mathsf{T}}Dx=\sum_i\deg(i)x_i^2$、$x^{\mathsf{T}}Ax=\sum_{i\sim j}x_ix_j$である。和$\sum_{i\sim j}$は順序付きの隣接組にわたる。

    一方$\sum_{i\sim j}(x_i-x_j)^2=\sum_{i\sim j}x_i^2+\sum_{i\sim j}x_j^2-2\sum_{i\sim j}x_ix_j$である。第一項と第二項はどちらも$\sum_i\deg(i)x_i^2$に等しい。よって$\frac12\sum_{i\sim j}(x_i-x_j)^2=x^{\mathsf{T}}Dx-x^{\mathsf{T}}Ax=x^{\mathsf{T}}Lx$である。

    右辺は$0$以上であり、$L$は対称なので、$L$は半正定値である。
  strategy: Expand the sum of squared differences and compare it with the degree and adjacency terms.
  sketch:
  - 'derive: Write x^T D x and x^T A x as sums.'
  - 'derive: Expanding the squares gives twice the degree term minus twice the adjacency term.'
  - 'conclude: The form is a sum of squares and L is symmetric, so L is positive semidefinite.'
  openmath: (forall (G x) (-> (finite_simple_graph G) (and (= (dot_product x (matrix_vector_mul (graph_laplacian_matrix G) x)) (/ (edge_difference_square_sum G x) 2)) (positive_semidefinite_matrix (graph_laplacian_matrix G)))))
  hard_negative:
    statement: $L$は正定値である。
    reason: すべての成分が$1$のベクトル$x$について$x^{\mathsf{T}}Lx=0$である。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (x : V → ℝ), x ⬝ᵥ Matrix.mulVec (G.lapMatrix ℝ) x = (∑ i : V, ∑ j : V, if G.Adj i j then (x i - x j) ^ 2 else 0) / 2 ∧ (G.lapMatrix ℝ).PosSemidef
  proof: |
    by
      intro V _ _ G _ x
      refine ⟨?_, G.posSemidef_lapMatrix ℝ⟩
      rw [← SimpleGraph.lapMatrix_toLinearMap₂' , Matrix.toLinearMap₂'_apply']
- id: laplacian_kernel_iff_constant_on_components
  kind: gap
  level: 2
  topic: グラフ理論・Laplacian 行列の核
  statement: 有限グラフの実 Laplacian 行列$L$と$x\in\mathbb{R}^V$について、$Lx=0$であることと、到達可能な任意の$i,j$で$x_i=x_j$であることは同値である。
  statement_en: For the real Laplacian L of a finite graph and x in R^V, Lx = 0 if and only if x_i = x_j whenever j is reachable from i.
  assumptions:
  - $G=(V,E)$は有限単純グラフ
  - $L$は実 Laplacian 行列
  - $x\in\mathbb{R}^V$
  quantifiers:
  - 任意の有限グラフ$G$とベクトル$x$
  conclusion: $Lx=0$は、$x$が各連結成分で定数であることと同値である。
  answer: |
    $G=(V,E)$を有限単純グラフ、$L$を実 Laplacian 行列、$x\in\mathbb{R}^V$とする。二次形式の公式$x^{\mathsf{T}}Lx=\frac12\sum_{i\sim j}(x_i-x_j)^2$を用いる。

    $Lx=0$なら$x^{\mathsf{T}}Lx=0$なので、右辺の各項は$0$であり、隣接するすべての$i,j$で$x_i=x_j$である。$j$が$i$から到達可能なら、$i$から$j$への歩道の辺に沿って値が等しいので$x_i=x_j$である。

    逆に到達可能なすべての$i,j$で$x_i=x_j$とする。$i$成分は$(Lx)_i=\deg(i)x_i-\sum_{j\sim i}x_j=\sum_{j\sim i}(x_i-x_j)$である。隣接する$j$は到達可能なので各項は$0$であり、$Lx=0$である。
  strategy: Use the quadratic form for one direction and the entrywise formula for the other.
  sketch:
  - 'derive: Lx = 0 makes the quadratic form vanish, so x agrees on adjacent vertices.'
  - 'induction: Following a walk, x agrees on reachable vertices.'
  - 'derive: The i-th entry of Lx is the sum of x_i - x_j over neighbors j of i.'
  - 'conclude: Constancy on components makes all these sums vanish.'
  openmath: (forall (G x) (-> (finite_simple_graph G) (<-> (= (matrix_vector_mul (graph_laplacian_matrix G) x) 0) (forall (i j) (-> (graph_reachable G i j) (= (fn_value x i) (fn_value x j)))))))
  hard_negative:
    statement: $Lx=0$ならすべての成分が等しい。
    reason: 互いに素な二本の辺からなるグラフで、一方の成分に$1$、他方に$0$をとると$Lx=0$であるが、成分は等しくない。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (x : V → ℝ), Matrix.mulVec (G.lapMatrix ℝ) x = 0 ↔ ∀ i j : V, G.Reachable i j → x i = x j
  proof: |
    by
      intro V _ _ G _ x
      exact G.lapMatrix_mulVec_eq_zero_iff_forall_reachable
- id: laplacian_kernel_dim_eq_component_count
  kind: textbook
  level: 2
  topic: グラフ理論・Laplacian 行列の核
  statement: 有限グラフの実 Laplacian 行列$L$の核の次元は、連結成分の個数に等しい。
  statement_en: The dimension of the kernel of the real Laplacian matrix of a finite graph equals the number of connected components.
  assumptions:
  - $G=(V,E)$は有限単純グラフ
  - $L$は実 Laplacian 行列
  quantifiers:
  - 任意の有限グラフ$G$
  conclusion: $\dim\ker L$は連結成分の個数に等しい。
  answer: |
    $G=(V,E)$を有限単純グラフとし、$C_1,\dots,C_c$を連結成分とする。$e_k\in\mathbb{R}^V$を$C_k$の頂点で$1$、他で$0$のベクトルとする。

    $x\in\ker L$であることは、$x$が各連結成分で定数であることと同値である。実際、$x^{\mathsf{T}}Lx=\frac12\sum_{i\sim j}(x_i-x_j)^2$より$Lx=0$なら隣接頂点で値が等しく、逆に各成分で定数なら$(Lx)_i=\sum_{j\sim i}(x_i-x_j)=0$である。

    したがって$\ker L$の元は$x=\sum_kt_ke_k$の形に一意に書ける。ここで$t_k$は$C_k$上の$x$の値である。$e_1,\dots,e_c$は台が互いに素で$0$でないので一次独立である。よって$e_1,\dots,e_c$は$\ker L$の基底であり、$\dim\ker L=c$である。
  strategy: The indicator vectors of the connected components form a basis of the kernel.
  sketch:
  - 'setup: Define the indicator vector of each component.'
  - 'derive: The kernel consists of the vectors constant on each component.'
  - 'derive: The indicators span the kernel and are linearly independent.'
  - 'conclude: The dimension equals the number of components.'
  openmath: (forall (G) (-> (finite_simple_graph G) (= (real_kernel_dimension (graph_laplacian_matrix G)) (component_count G))))
  hard_negative:
    statement: $L$の階数が連結成分の個数に等しい。
    reason: 頂点が$3$個の道では連結成分は$1$個であり、$L$の階数は$2$である。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj], Nat.card G.ConnectedComponent = Module.finrank ℝ (LinearMap.ker (Matrix.toLin' (G.lapMatrix ℝ)))
  proof: |
    by
      intro V _ _ G _
      rw [Nat.card_eq_fintype_card]
      exact G.card_connectedComponent_eq_finrank_ker_toLin'_lapMatrix
- id: connected_iff_laplacian_kernel_dim_one
  kind: gap
  level: 2
  topic: グラフ理論・Laplacian 行列の核
  statement: 頂点集合が空でない有限グラフが連結であることと、実 Laplacian 行列の核の次元が$1$であることは同値である。
  statement_en: A finite graph with nonempty vertex set is connected if and only if the kernel of its real Laplacian matrix has dimension 1.
  assumptions:
  - $G=(V,E)$は頂点集合が空でない有限単純グラフ
  - $L$は実 Laplacian 行列
  quantifiers:
  - 任意の有限グラフ$G$
  conclusion: $G$が連結であることと$\dim\ker L=1$は同値である。
  answer: |
    $G=(V,E)$を頂点集合が空でない有限単純グラフ、$L$を実 Laplacian 行列とする。$\dim\ker L$は連結成分の個数に等しい。この事実は、各連結成分の指示ベクトルが$\ker L$の基底になることから得られる。

    頂点集合が空でないので、$G$が連結であることと、連結成分がちょうど一つであることは同値である。よって$G$が連結であることと$\dim\ker L=1$は同値である。
  strategy: Translate connectivity into a single component and apply the kernel dimension formula.
  sketch:
  - 'apply_theorem: The kernel dimension equals the number of components.'
  - 'translate: For a nonempty vertex set, connected means exactly one component.'
  - 'conclude: Both conditions are equivalent.'
  openmath: (forall (G) (-> (and (finite_simple_graph G) (!= (graph_vertices G) emptyset)) (<-> (graph_connected G) (= (real_kernel_dimension (graph_laplacian_matrix G)) 1))))
  hard_negative:
    statement: $G$が連結であることと$L$が可逆であることは同値である。
    reason: 頂点が空でないとき$L$はすべての成分が$1$のベクトルを核に持つので、連結でも可逆でない。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] [Nonempty V] (G : SimpleGraph V) [DecidableRel G.Adj], G.Connected ↔ Module.finrank ℝ (LinearMap.ker (Matrix.toLin' (G.lapMatrix ℝ))) = 1
  proof: |
    by
      intro V _ _ _ G _
      rw [← G.card_connectedComponent_eq_finrank_ker_toLin'_lapMatrix, Fintype.card_eq_one_iff]
      constructor
      · intro h
        obtain ⟨v⟩ := ‹Nonempty V›
        refine ⟨G.connectedComponentMk v, fun c => ?_⟩
        induction c using SimpleGraph.ConnectedComponent.ind with
        | _ w => exact SimpleGraph.ConnectedComponent.sound (h.preconnected w v)
      · rintro ⟨c, hc⟩
        refine ⟨fun u v => ?_⟩
        have := (hc (G.connectedComponentMk u)).trans (hc (G.connectedComponentMk v)).symm
        exact SimpleGraph.ConnectedComponent.exact this
- id: hall_bipartite_perfect_matching
  kind: textbook
  level: 2
  topic: グラフ理論・Hall の定理と完全マッチング
  statement: Hall の定理の完全マッチング形。有限の二部グラフ$G$（すべての辺が互いに素な集合$a,b$の間を結ぶ）で、すべての頂点集合$S$について$|S|\le|N(S)|$なら、$G$は完全マッチングを持つ。ここで$N(S)$は$S$の頂点の隣接頂点全体である。
  statement_en: Perfect matching form of Hall's theorem. If every edge of a finite graph joins two disjoint sets a and b, and |S| ≤ |N(S)| for every vertex set S, then the graph has a perfect matching.
  assumptions:
  - $G$は有限単純グラフ
  - $a,b$は互いに素で、すべての辺が$a$と$b$を結ぶ
  - すべての頂点集合$S$について$|S|\le|N(S)|$
  quantifiers:
  - 任意の有限グラフ$G$と集合$a,b$
  conclusion: $G$は完全マッチングを持つ。
  answer: |
    $G=(V,E)$を有限単純グラフ、$a,b$を互いに素な集合で、すべての辺が$a$と$b$を結ぶとし、すべての$S\subseteq V$で$|S|\le|N(S)|$とする。

    $v\notin a\cup b$なら$S=\{v\}$で$|N(S)|\ge 1$であり、$v$に辺があることになるが、辺の端は$a\cup b$にあるので矛盾する。よって$V=a\cup b$である。

    $S=a$とすると、$N(a)\subseteq b$より$|a|\le|b|$である。同様に$|b|\le|a|$なので$|a|=|b|$である。

    $a$の部分集合$S$について$N(S)\subseteq b$で$|S|\le|N(S)|$なので、Hall の結婚定理により単射$f:a\to b$で$v$と$f(v)$が隣接するものがある。$|a|=|b|$より$f$は全単射である。辺$\{v,f(v)\}$（$v\in a$）の全体はすべての頂点をちょうど一度覆うので、完全マッチングである。
  strategy: Show the two sides have equal size and apply Hall's marriage theorem to one side.
  sketch:
  - 'derive: The condition for singletons forces all vertices into a ∪ b.'
  - 'derive: The condition for a and for b gives |a| = |b|.'
  - 'apply_theorem: Hall''s marriage theorem gives an injection from a to b along edges.'
  - 'conclude: Equal sizes make it a bijection, which is a perfect matching.'
  openmath: (forall (G a b) (-> (and (finite_simple_graph G) (graph_bipartite_with G a b) (neighbor_union_size_at_least G)) (has_perfect_matching G)))
  hard_negative:
    statement: 二部グラフ$G$で$|a|=|b|$なら完全マッチングを持つ。
    reason: $a=\{1,2\}$、$b=\{3,4\}$で辺が$13,23$だけなら、$S=\{1,2\}$で$|N(S)|=1$であり、完全マッチングはない。
  target: |
    ∀ (V : Type*) [Fintype V] (G : SimpleGraph V) [DecidableRel G.Adj] (a b : Set V), G.IsBipartiteWith a b → (∀ s : Set V, s.ncard ≤ (⋃ x ∈ s, G.neighborSet x).ncard) → ∃ M : G.Subgraph, M.IsPerfectMatching
  proof: |
    by
      intro V _ G _ a b h1 h2
      exact SimpleGraph.exists_isPerfectMatching_of_forall_ncard_le h1 h2
- id: regular_bipartite_perfect_matching
  kind: gap
  level: 2
  topic: グラフ理論・Hall の定理と完全マッチング
  statement: $k\ge 1$とする。有限の二部グラフが$k$正則なら完全マッチングを持つ。
  statement_en: For k ≥ 1, every k-regular finite bipartite graph has a perfect matching.
  assumptions:
  - $k\ge 1$
  - $G$は有限単純グラフで、すべての辺が互いに素な集合$a,b$の間を結ぶ
  - すべての頂点の次数は$k$
  quantifiers:
  - 任意の有限グラフ$G$、集合$a,b$、整数$k\ge 1$
  conclusion: $G$は完全マッチングを持つ。
  answer: |
    $k\ge 1$、$G$を$k$正則で、すべての辺が互いに素な集合$a,b$を結ぶ有限単純グラフとする。Hall の定理の完全マッチング形の条件を確かめる。

    頂点集合$S$をとり、$N(S)$を$S$の頂点の隣接頂点全体とする。$x\in S$、$y\in N(S)$で$x,y$が隣接する組$(x,y)$を数える。$x\in S$を固定すると、$x$の隣接頂点は$k$個あり、すべて$N(S)$に属するので、組は$k$個である。$y\in N(S)$を固定すると、$y$の隣接頂点は$k$個なので、組は$k$個以下である。

    よって$k|S|\le k|N(S)|$である。$k\ge 1$で割ると$|S|\le|N(S)|$である。Hall の定理より$G$は完全マッチングを持つ。
  strategy: Double count edges leaving S to verify Hall's condition.
  sketch:
  - 'setup: Fix a vertex set S and count adjacent pairs (x, y) with x in S.'
  - 'derive: Each x in S contributes exactly k pairs.'
  - 'derive: Each y in N(S) receives at most k pairs.'
  - 'apply_theorem: The resulting Hall condition gives a perfect matching.'
  openmath: (forall (G a b k) (-> (and (finite_simple_graph G) (graph_bipartite_with G a b) (in k N) (>= k 1) (graph_regular G k)) (has_perfect_matching G)))
  hard_negative:
    statement: 二部とは限らない$k$正則グラフ（$k\ge 1$）は完全マッチングを持つ。
    reason: 三角形は$2$正則だが、頂点が奇数個なので完全マッチングを持たない。
  target: |
    ∀ (V : Type*) [Fintype V] (G : SimpleGraph V) [DecidableRel G.Adj] (a b : Set V) (k : ℕ), 0 < k → G.IsBipartiteWith a b → G.IsRegularOfDegree k → ∃ M : G.Subgraph, M.IsPerfectMatching
  proof: |
    by
      intro V _ G _ a b k hk hb hr
      classical
      refine SimpleGraph.exists_isPerfectMatching_of_forall_ncard_le hb fun s => ?_
      have hN : (⋃ x ∈ s, G.neighborSet x) = ((s.toFinset.biUnion (fun x => G.neighborFinset x) : Finset V) : Set V) := by
        ext y
        simp
      rw [hN, Set.ncard_coe_finset, Set.ncard_eq_toFinset_card']
      set S := s.toFinset
      set T := S.biUnion (fun x => G.neighborFinset x)
      have hm : ∀ x ∈ S, k ≤ (Finset.bipartiteAbove G.Adj T x).card := by
        intro x hx
        have : G.neighborFinset x ⊆ Finset.bipartiteAbove G.Adj T x := by
          intro y hy
          rw [Finset.mem_bipartiteAbove]
          exact ⟨Finset.mem_biUnion.mpr ⟨x, hx, hy⟩, (G.mem_neighborFinset x y).mp hy⟩
        have h2 := Finset.card_le_card this
        rwa [G.card_neighborFinset_eq_degree, hr.degree_eq] at h2
      have hn : ∀ y ∈ T, (Finset.bipartiteBelow G.Adj S y).card ≤ k := by
        intro y _
        have : Finset.bipartiteBelow G.Adj S y ⊆ G.neighborFinset y := by
          intro x hx
          rw [Finset.mem_bipartiteBelow] at hx
          exact (G.mem_neighborFinset y x).mpr hx.2.symm
        have h2 := Finset.card_le_card this
        rwa [G.card_neighborFinset_eq_degree, hr.degree_eq] at h2
      have := Finset.card_mul_le_card_mul G.Adj hm hn
      exact Nat.le_of_mul_le_mul_right this hk
- id: tutte_perfect_matching_theorem
  kind: named
  level: 4
  topic: グラフ理論・Tutte の定理
  statement: Tutte の定理。有限グラフ$G$が完全マッチングを持つことと、すべての頂点集合$U$について$G-U$の奇数個の頂点を持つ連結成分の個数が$|U|$以下であることは同値である。
  statement_en: Tutte's theorem. A finite graph G has a perfect matching if and only if for every vertex set U the number of connected components of G - U with an odd number of vertices is at most |U|.
  assumptions:
  - $G=(V,E)$は有限単純グラフ
  - $U\subseteq V$について$o(G-U)$は$G-U$の奇数個の頂点を持つ連結成分の個数
  quantifiers:
  - 任意の有限グラフ$G$
  conclusion: $G$が完全マッチングを持つことと、すべての$U$で$o(G-U)\le|U|$であることは同値である。
  answer: |
    $G=(V,E)$を有限単純グラフとする。

    完全マッチング$M$があるとする。$U\subseteq V$をとる。$G-U$の奇成分$C$の頂点は$C$の内部だけでは対にならないので、$C$のある頂点は$M$で$U$の頂点と対になる。成分ごとに対となる$U$の頂点は異なるので$o(G-U)\le|U|$である。

    逆を示す。すべての$U$で$o(G-U)\le|U|$とし、完全マッチングがないと仮定する。$U=\emptyset$より$|V|$は偶数である。辺を加えても$o(G-U)$は増えない。奇成分が併合されるときは奇成分の個数が減るか変わらないからである。そこで完全マッチングを持たないまま辺を加えられない$G$を考えてよい。

    $S$をすべての頂点と隣接する頂点の集合とする。$G-S$のすべての成分が完全グラフなら、偶成分の内部で対を作る。$o(G-S)\le|S|$なので、奇成分は一頂点を$S$の相異なる頂点と対にして残りを内部で対にできる。残る$S$の頂点は$|V|$が偶数なので偶数個で、完全グラフをなすので対にできる。これは完全マッチングで矛盾である。

    よって$G-S$には$a,b,c$で$a\sim b$、$b\sim c$、$a\not\sim c$となるものがある。$b\notin S$より$b\not\sim d$となる$d$がある。極大性より、$G+ac$は完全マッチング$M_1$を持ち、$G+bd$は完全マッチング$M_2$を持つ。$M_1$は$ac$を含み、$M_2$は$bd$を含む。$M_1\triangle M_2$は長さが偶数の交互閉路の和である。

    $ac$と$bd$が異なる閉路にあるなら、$bd$を含む閉路$C$の上で$M_2$を$M_1$に入れ替えると、$ac$も$bd$も使わない$G$の完全マッチングが得られる。

    同じ閉路$C$にあるとする。$d$は$a,c$と異なる。$b\sim a$、$b\sim c$、$b\not\sim d$だからである。$d$から$b$と反対の向きに$C$をたどり、$a,c$のうち最初に現れる点までの道を$P$とする。$a,c$の役割は対称なので、その点を$c$とする。$d$の$M_2$の辺は$bd$なので、$P$は$M_1$の辺で始まる。$c$の$M_1$の辺は$ac$で$P$に含まれないので、$P$は$M_2$の辺で終わる。したがって$P$の$M_1$の辺は、$c$以外の$P$の頂点を覆う。

    $P$の頂点と$b$の上では$P$の$M_1$の辺と辺$bc$をとり、それ以外の頂点では$M_2$の辺をとる。$M_2$は$P$の頂点と$b$を互いの間で対にするので、これは完全マッチングである。$ac$も$bd$も使わないので$G$の完全マッチングであり、矛盾である。
  strategy: Prove necessity by counting and sufficiency via an edge-maximal counterexample and alternating cycles.
  sketch:
  - 'derive: In a perfect matching, each odd component of G - U has a vertex matched into U.'
  - 'setup: For sufficiency, take an edge-maximal graph without perfect matching satisfying the condition.'
  - 'case_split: If G - S is a union of cliques, for S the set of universal vertices, construct a perfect matching directly.'
  - 'construct: Otherwise pick a, b, c, d and the matchings M_1 of G + ac and M_2 of G + bd.'
  - 'contradiction: Alternating cycles of M_1 and M_2 yield a perfect matching of G.'
  openmath: (forall (G) (-> (finite_simple_graph G) (<-> (has_perfect_matching G) (forall (U) (-> (subset U (graph_vertices G)) (<= (odd_component_count_after_removal G U) (size U)))))))
  hard_negative:
    statement: 連結で頂点数が偶数のグラフは完全マッチングを持つ。
    reason: 頂点が$4$個の星$K_{1,3}$は連結だが、中心を$U$とすると奇成分が$3$個あり、$3>|U|=1$である。
  target: |
    ∀ (V : Type*) [Finite V] (G : SimpleGraph V), (∃ M : G.Subgraph, M.IsPerfectMatching) ↔ ∀ u : Set V, ¬ (Set.ncard u < Set.ncard ((⊤ : G.Subgraph).deleteVerts u).coe.oddComponents)
  proof: |
    by
      intro V _ G
      exact SimpleGraph.tutte
- id: turan_maximal_iff_isomorphic_turan_graph
  kind: textbook
  level: 3
  topic: グラフ理論・トゥラングラフ
  statement: トゥランの定理の一意性。$r\ge 1$とする。有限グラフ$G$が、$r+1$頂点のクリークを持たないグラフのうち辺の本数が最大であることと、$G$がトゥラングラフ$T(n,r)$に同型であることは同値である。ここで$n=|V|$、$T(n,r)$は$\{0,\dots,n-1\}$上で$r$で割った余りが異なる二頂点を結ぶグラフである。
  statement_en: Uniqueness in Turán's theorem. For r ≥ 1, a finite graph G has the maximum number of edges among graphs on its vertex set without an (r+1)-clique if and only if G is isomorphic to the Turán graph T(n,r), with n = |V|, where T(n,r) joins i, j in {0,...,n-1} when their residues mod r differ.
  assumptions:
  - $r\ge 1$
  - $G=(V,E)$は有限単純グラフ、$n=|V|$
  - $T(n,r)$は$\{0,\dots,n-1\}$上で$r$で割った余りが異なる二頂点を結ぶグラフ
  quantifiers:
  - 任意の有限グラフ$G$と$r\ge 1$
  conclusion: $G$が$r+1$クリークを持たないグラフで辺が最大であることと、$T(n,r)$に同型であることは同値である。
  answer: |
    $r\ge 1$、$G=(V,E)$を有限単純グラフ、$n=|V|$とする。

    $G$が$r+1$頂点のクリークを持たず辺の本数が最大であるとする。$s,t$が隣接しないなら$\deg s=\deg t$である。実際、$\deg s<\deg t$なら、$s$を$t$の複製に置き換えたグラフは$r+1$クリークを持たず、辺が増える。

    隣接しない関係は推移的である。$t\not\sim s$、$s\not\sim u$、$t\sim u$とすると、前段より$\deg t=\deg s=\deg u$である。$t$と$u$をともに$s$の複製に置き換えると、辺の本数は$|E|-(\deg t+\deg u-1)+2\deg s=|E|+1$となり、最大性に反する。

    よって隣接しない関係は同値関係で、$G$は完全多部グラフである。部分が$r+1$個以上あると$r+1$クリークができるので、部分は$r$個以下である。二つの部分の大きさが$2$以上違うなら、大きい部分から小さい部分へ一頂点を移すと辺が増える。部分が$r$個未満で大きさ$2$以上の部分があるなら、それを二つに分けると辺が増える。したがって部分は$\min(n,r)$個で、大きさの差は$1$以下である。これは$T(n,r)$に同型である。

    逆を示す。有限個のグラフの中に辺が最大のもの$G_0$がある。前段より$G_0$は$T(n,r)$に同型である。$G$が$T(n,r)$に同型なら$G$は$G_0$に同型で、辺の本数とクリークの有無は同型で保たれるので、$G$も辺が最大である。
  strategy: Use symmetrization to show a maximal graph is complete multipartite with balanced parts, then deduce the converse from existence of a maximal graph.
  sketch:
  - 'derive: Nonadjacent vertices have equal degree by the replacement argument.'
  - 'derive: Nonadjacency is transitive by replacing two adjacent vertices with copies of s.'
  - 'translate: So the graph is complete multipartite with at most r parts.'
  - 'derive: Moving or splitting vertices shows the parts are balanced and min(n,r) in number.'
  - 'conclude: Any maximal graph is isomorphic to T(n,r), which gives both directions.'
  openmath: (forall (G r) (-> (and (finite_simple_graph G) (in r N) (>= r 1)) (<-> (turan_maximal G r) (graph_isomorphic G (turan_graph (size (graph_vertices G)) r)))))
  hard_negative:
    statement: $r+1$クリークを持たないグラフのうち極大なもの（辺を足すとクリークができるもの）は$T(n,r)$に同型である。
    reason: $r=2$では長さ$5$の閉路は三角形を持たず、辺を足すと三角形ができるので極大だが、$T(5,2)$は二部グラフで同型でない。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj] (r : ℕ), 0 < r → (G.IsTuranMaximal r ↔ Nonempty (G ≃g SimpleGraph.turanGraph (Fintype.card V) r))
  proof: |
    by
      intro V _ _ G _ r hr
      exact SimpleGraph.isTuranMaximal_iff_nonempty_iso_turanGraph hr
- id: trail_incident_edges_parity
  kind: gap
  level: 2
  topic: グラフ理論・Euler 回路と小道
  statement: 同じ辺を二度通らない$u$から$v$への歩道（小道）$p$と頂点$x$について、$x$を端点に持つ$p$の辺の本数が偶数であることと、「$u\ne v$なら$x\ne u$かつ$x\ne v$」は同値である。
  statement_en: For a trail p from u to v, meaning a walk with no repeated edge, and a vertex x, the number of edges of p containing x is even if and only if u ≠ v implies x ≠ u and x ≠ v.
  assumptions:
  - $G$は単純グラフ
  - $p$は$u$から$v$への小道
  - $x$は頂点
  quantifiers:
  - 任意のグラフ$G$、小道$p$、頂点$x$
  conclusion: $x$を含む$p$の辺の本数が偶数であることと、$u\ne v\Rightarrow(x\ne u\wedge x\ne v)$は同値である。
  answer: |
    $G$を単純グラフ、$p=(v_0,\dots,v_m)$を$u=v_0$から$v=v_m$への小道、$x$を頂点とする。$m=0$なら$u=v$で辺がなく、本数は$0$であり、右の条件も成り立つ。$m\ge 1$とする。

    辺は相異なり、単純グラフに輪はないので、$x$を含む辺は、$v_i=x$となる位置$i$ごとの前後の辺に分かれ、重複しない。$0<i<m$の位置は$2$本、$i=0$や$i=m$の位置は$1$本を与える。よって本数は偶数と、$x=u$なら$1$、$x=v$なら$1$の和である。

    $u\ne v$のとき、$x$が$u$か$v$なら本数は奇数で、$x$がどちらでもなければ偶数である。$u=v$のとき、$x=u$なら$1+1$が加わり、そうでなければ何も加わらないので本数は偶数である。これは右の条件と一致する。
  strategy: Count incident edges position by position along the trail.
  sketch:
  - 'case_split: The trivial trail has no edges.'
  - 'derive: Interior occurrences of x contribute two distinct edges each.'
  - 'derive: End positions contribute one edge each.'
  - 'case_split: Compare parity for u ≠ v and u = v.'
  - 'conclude: This matches the stated condition.'
  openmath: (forall (G p u v x) (-> (and (simple_graph G) (graph_trail p G u v) (in x (graph_vertices G))) (<-> (exists (k) (and (in k N) (= (trail_incident_edge_count p x) (* 2 k)))) (-> (!= u v) (and (!= x u) (!= x v))))))
  hard_negative:
    statement: 同じ辺を二度通ってもよい歩道でも、$x$を含む辺を重複を除いて数えると同じ同値が成り立つ。
    reason: 閉じた歩道$u,x,u$では$u=v$なので右の条件は成り立つが、$x$を含む辺は重複を除くと$ux$の$1$本で奇数である。
  target: |
    ∀ (V : Type*) [DecidableEq V] (G : SimpleGraph V) (u v x : V) (p : G.Walk u v), p.IsTrail → (Even (p.edges.countP (fun e => x ∈ e)) ↔ (u ≠ v → x ≠ u ∧ x ≠ v))
  proof: |
    by
      intro V _ G u v x p h
      exact h.even_countP_edges_iff x
- id: hamiltonian_cycle_iff_cycle_length_card
  kind: gap
  level: 1
  topic: グラフ理論・Hamilton 閉路
  statement: 有限グラフの閉路$p$がすべての頂点を通る（Hamilton 閉路である）ことと、$p$の長さが$|V|$であることは同値である。
  statement_en: A cycle p of a finite graph visits every vertex, that is p is a Hamiltonian cycle, if and only if its length is |V|.
  assumptions:
  - $G=(V,E)$は有限単純グラフ
  - $p$は$a$を基点とする閉路
  quantifiers:
  - 任意の有限グラフ$G$と閉路$p$
  conclusion: $p$が Hamilton 閉路であることと、長さが$|V|$であることは同値である。
  answer: |
    $G=(V,E)$を有限単純グラフ、$p$を基点$a$の閉路とする。閉路は長さ$m$の閉じた歩道で、最初の点を除いた$m$個の頂点が相異なる。したがって$p$が通る頂点はちょうど$m$個である。

    $p$がすべての頂点を通るなら$m=|V|$である。逆に$m=|V|$なら、$p$が通る$m$個の頂点は$V$全体である。よって二つの条件は同値である。
  strategy: A cycle of length m visits exactly m distinct vertices.
  sketch:
  - 'derive: A cycle of length m visits exactly m distinct vertices.'
  - 'conclude: Those vertices are all of V exactly when m = |V|.'
  openmath: (forall (G a p) (-> (and (finite_simple_graph G) (graph_cycle p G a)) (<-> (hamiltonian_cycle p G a) (= (walk_length p) (size (graph_vertices G))))))
  hard_negative:
    statement: 長さが$|V|$の閉じた歩道はすべての頂点を通る。
    reason: 頂点$a,b,c,d$のグラフで$a,b,a,b,a$とたどる閉じた歩道は長さ$4$だが、$c,d$を通らない。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) (a : V) (p : G.Walk a a), p.IsHamiltonianCycle ↔ p.IsCycle ∧ p.length = Fintype.card V
  proof: |
    by
      intro V _ _ G a p
      exact SimpleGraph.Walk.isHamiltonianCycle_iff_isCycle_and_length_eq
- id: complete_graph_has_hamiltonian_cycle
  kind: gap
  level: 1
  topic: グラフ理論・Hamilton 閉路
  statement: 頂点が$3$個以上の完全グラフは Hamilton 閉路を持つ。
  statement_en: A complete graph with at least three vertices has a Hamiltonian cycle.
  assumptions:
  - $V$は$|V|\ge 3$の有限集合
  - $G$は$V$上の完全グラフ
  quantifiers:
  - 任意の$|V|\ge 3$の有限集合$V$
  conclusion: $G$は Hamilton 閉路を持つ。
  answer: |
    $V$を$|V|=n\ge 3$の有限集合、$G$を$V$上の完全グラフとする。$V$の元を$v_0,\dots,v_{n-1}$と並べる。完全グラフでは異なる二頂点はすべて隣接するので、$v_0,v_1,\dots,v_{n-1},v_0$は閉じた歩道である。$n\ge 3$なので辺$v_iv_{i+1}$はすべて異なり、頂点も$v_0$の繰り返しを除いて相異なる。よってこれは閉路で、すべての頂点を通る。
  strategy: List the vertices in any order and close up the list.
  sketch:
  - 'construct: Arrange the vertices in a sequence.'
  - 'derive: Consecutive vertices are adjacent in a complete graph.'
  - 'conclude: With at least three vertices this closes to a cycle through all vertices.'
  openmath: (forall (V) (-> (and (finite_set V) (>= (size V) 3)) (exists (a p) (hamiltonian_cycle p (complete_graph_on V) a))))
  hard_negative:
    statement: 頂点が$2$個の完全グラフも Hamilton 閉路を持つ。
    reason: 頂点が$2$個では閉路の長さが$2$になり、同じ辺を二度通るので閉路ではない。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V], 3 ≤ Fintype.card V → ∃ (a : V) (p : (⊤ : SimpleGraph V).Walk a a), p.IsHamiltonianCycle
  proof: |
    by
      intro V _ _ h
      obtain ⟨n, hn⟩ : ∃ n, Fintype.card V = n + 3 := ⟨Fintype.card V - 3, by omega⟩
      let e : Fin (n + 3) ≃ V := (Fintype.equivFinOfCardEq hn).symm
      let f : SimpleGraph.cycleGraph (n + 3) →g (⊤ : SimpleGraph V) := ⟨e, fun {a b} hab => by
        have : a ≠ b := hab.ne
        simpa using e.injective.ne this⟩
      have hc : (SimpleGraph.cycleGraph.cycle n).IsHamiltonianCycle := by
        rw [SimpleGraph.Walk.isHamiltonianCycle_iff_isCycle_and_length_eq, SimpleGraph.cycleGraph.length_cycle, Fintype.card_fin]
        exact ⟨SimpleGraph.cycleGraph.isCycle_cycle, rfl⟩
      exact ⟨_, _, hc.map (f := f) e.bijective⟩
- id: bipartite_hamiltonian_even_vertices
  kind: gap
  level: 1
  topic: グラフ理論・Hamilton 閉路
  statement: $2$彩色可能な有限グラフが Hamilton 閉路を持つなら、頂点数は偶数である。
  statement_en: If a 2-colorable finite graph has a Hamiltonian cycle, then its number of vertices is even.
  assumptions:
  - $G=(V,E)$は$2$彩色可能な有限単純グラフ
  - $p$は$G$の Hamilton 閉路
  quantifiers:
  - 任意の有限グラフ$G$と閉路$p$
  conclusion: $|V|$は偶数である。
  answer: |
    $G=(V,E)$を$2$彩色可能な有限単純グラフ、$p$を基点$a$の Hamilton 閉路とする。$p$の長さは$|V|$である。$p$に沿って一歩進むごとに色が入れ替わる。$p$は$a$に戻るので色も元に戻る。したがって歩数は偶数であり、$|V|$は偶数である。
  strategy: Colors alternate along the closed walk, so its length is even.
  sketch:
  - 'derive: The length of a Hamiltonian cycle is |V|.'
  - 'derive: Colors alternate along each step of the cycle.'
  - 'conclude: Returning to the start forces an even number of steps.'
  openmath: (forall (G a p) (-> (and (finite_simple_graph G) (graph_colorable G 2) (hamiltonian_cycle p G a)) (exists (k) (and (in k N) (= (size (graph_vertices G)) (* 2 k))))))
  hard_negative:
    statement: 頂点数が偶数の$2$彩色可能な連結グラフは Hamilton 閉路を持つ。
    reason: 頂点が$4$個の道は条件を満たすが、次数$1$の頂点があるので閉路を持たない。
  target: |
    ∀ (V : Type*) [Fintype V] [DecidableEq V] (G : SimpleGraph V) (a : V) (p : G.Walk a a), G.IsBipartite → p.IsHamiltonianCycle → Even (Fintype.card V)
  proof: |
    by
      intro V _ _ G a p hb hp
      rw [← hp.length_eq]
      exact SimpleGraph.two_colorable_iff_forall_loop_even.mp hb a p
- id: cayley_graph_connected_iff_generates
  kind: textbook
  level: 2
  topic: グラフ理論・Cayley グラフ
  statement: 群$M$の部分集合$s$の Cayley グラフ（$x\ne y$かつ$x^{-1}y\in s$または$y^{-1}x\in s$のとき$x,y$を結ぶ）が連結であることと、$s$が$M$を生成することは同値である。
  statement_en: The Cayley graph of a group M with respect to a subset s, joining x ≠ y when x^(-1) y or y^(-1) x lies in s, is connected if and only if s generates M.
  assumptions:
  - $M$は群、$s\subseteq M$
  - Cayley グラフは$x\ne y$かつ$x^{-1}y\in s$または$y^{-1}x\in s$のとき$x,y$を結ぶ
  quantifiers:
  - 任意の群$M$と部分集合$s$
  conclusion: Cayley グラフが連結であることと、$s$が$M$を生成することは同値である。
  answer: |
    $M$を群、$s\subseteq M$、$H$を$s$が生成する部分群とする。

    Cayley グラフが連結であるとする。$a$と$b$が隣接するなら$a^{-1}b\in s$または$(a^{-1}b)^{-1}\in s$なので$a^{-1}b\in H$である。歩道$a=x_0,x_1,\dots,x_m=b$について$a^{-1}b=\prod_i x_{i-1}^{-1}x_i\in H$である。$1$から任意の$x\in M$への歩道があるので$x\in H$である。よって$H=M$である。

    逆に$H=M$とする。$x\in H$なら、任意の$y$から$yx$へ到達できることを、$H$の元の構成についての帰納法で示す。$x\in s$なら、$y=yx$であるか、$y$と$yx$が隣接する。$x=1$は明らかである。$x=x_1x_2$なら$y$から$yx_1$へ、さらに$yx_1x_2$へ到達できる。$x=z^{-1}$なら、$yz^{-1}$から$yz^{-1}z=y$へ到達できるので、逆向きに$y$から$yz^{-1}$へ到達できる。

    $u,v\in M$について$x=u^{-1}v\in M=H$を用いると、$u$から$ux=v$へ到達できる。$M$は空でないので Cayley グラフは連結である。
  strategy: Walks correspond to products of generators and their inverses.
  sketch:
  - 'derive: Along a walk, a^(-1) b is a product of elements of s and their inverses.'
  - 'conclude: Connectivity from 1 shows every element lies in the generated subgroup.'
  - 'induction: Conversely, by induction on the subgroup, y reaches y x for every x in H.'
  - 'conclude: Taking x = u^(-1) v connects any two vertices.'
  openmath: (forall (M s) (-> (and (group M) (subset s M)) (<-> (graph_connected (cayley_graph M s)) (= (generated_subgroup s) M))))
  hard_negative:
    statement: Cayley グラフが連結であることと、$s$自身が$M$全体であることは同値である。
    reason: $\mathbb{Z}/3\mathbb{Z}$で$s=\{1\}$は全体でないが、Cayley グラフは三角形で連結である。
  target: |
    ∀ (M : Type*) [Group M] (s : Set M), (SimpleGraph.mulCayley s).Connected ↔ Subgroup.closure s = ⊤
  proof: |
    by
      intro M _ s
      constructor
      · intro h
        rw [eq_top_iff]
        intro x _
        obtain ⟨w⟩ := h.preconnected 1 x
        have key : ∀ (a b : M) (w : (SimpleGraph.mulCayley s).Walk a b), a⁻¹ * b ∈ Subgroup.closure s := by
          intro a b w
          induction w with
          | nil => simp
          | @cons a c b hadj _ ih =>
            have h1 : a⁻¹ * c ∈ Subgroup.closure s := by
              rcases ((SimpleGraph.mulCayley_adj _ _ _).mp hadj).2 with h | h
              · exact Subgroup.subset_closure h
              · have := (Subgroup.closure s).inv_mem (Subgroup.subset_closure h)
                simpa using this
            have := (Subgroup.closure s).mul_mem h1 ih
            simpa [mul_assoc] using this
        simpa using key 1 x w
      · intro h
        have key : ∀ x : M, x ∈ Subgroup.closure s → ∀ y, (SimpleGraph.mulCayley s).Reachable y (y * x) := by
          intro x hx
          induction hx using Subgroup.closure_induction with
          | mem g hg =>
            intro y
            by_cases he : y = y * g
            · rw [← he]
            · exact SimpleGraph.Adj.reachable ((SimpleGraph.mulCayley_adj _ _ _).mpr ⟨he, Or.inl (by simpa using hg)⟩)
          | one => intro y; simp
          | mul a b _ _ ha hb => intro y; rw [← mul_assoc]; exact (ha y).trans (hb _)
          | inv a _ ha =>
            intro y
            have := ha (y * a⁻¹)
            simpa using this.symm
        haveI : Nonempty M := ⟨1⟩
        refine ⟨fun u v => ?_⟩
        have := key (u⁻¹ * v) (by rw [h]; trivial) u
        simpa using this
