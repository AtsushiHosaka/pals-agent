  - $v_2(0)=\infty$とする
  quantifiers:
  - 任意の整数$x,y$と自然数$n$
  conclusion: $v_2(x^n-y^n)=v_2(x-y)+v_2(n)$である。
  answer: |
    $x,y$を$x$が奇数で$4\mid x-y$を満たす整数、$n$を自然数とする。$y$も奇数である。$n=0$なら両辺とも$\infty$なので、$n\geq 1$とする。

    $m$が奇数のとき、$x^m-y^m=(x-y)\sum_{i=0}^{m-1}x^iy^{m-1-i}$である。和は奇数$m$個の奇数の和なので奇数である。よって$v_2(x^m-y^m)=v_2(x-y)$である。

    次に、$x^2-y^2=(x-y)(x+y)$であり、$x+y=(x-y)+2y$である。$4\mid x-y$で$y$は奇数なので、$x+y\equiv 2\pmod 4$であり、$v_2(x+y)=1$である。よって$v_2(x^2-y^2)=v_2(x-y)+1$である。$x^2$は奇数で$4\mid x^2-y^2$なので、同じ操作を繰り返すと$v_2(x^{2^a}-y^{2^a})=v_2(x-y)+a$となる。

    $n=2^am$（$m$は奇数）と書くと$a=v_2(n)$である。奇数指数の場合を$x^{2^a},y^{2^a}$に使えば$v_2(x^n-y^n)=v_2(x^{2^a}-y^{2^a})=v_2(x-y)+v_2(n)$である。
  strategy: Split n into its 2-part and odd part; each squaring adds exactly 1 because x+y ≡ 2 modulo 4.
  sketch:
  - 'case_split: For n = 0 both sides are infinite.'
  - 'derive: For odd m the cofactor of x-y is a sum of an odd number of odd terms, so it is odd.'
  - 'derive: Since 4 | x-y and y is odd, x+y ≡ 2 modulo 4, so squaring adds 1 to the valuation.'
  - 'conclude: Write n = 2^a m and combine the two facts.'
  openmath: (forall (x y n) (-> (and (in x Z) (in y Z) (in n N) (not (dvd 2 x)) (dvd 4 (- x y))) (= (padic_valuation 2 (- (^ x n) (^ y n))) (+ (padic_valuation 2 (- x y)) (padic_valuation 2 n)))))
