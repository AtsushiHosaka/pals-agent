  - $f,g$は$A$に値をとる乗法的関数
  quantifiers:
  - 任意の可換環$A$と乗法的関数$f,g$
  conclusion: $f=g$とすべての素数べきでの一致は同値である。
  answer: |
    $A$を可換環、$f,g$を乗法的関数とする。$f=g$ならすべての素数べきで一致する。

    逆に、すべての素数$p$と自然数$i$で$f(p^i)=g(p^i)$とする。$f(0)=g(0)=0$である。$n\geq 1$を$n=\prod_jp_j^{e_j}$（$p_j$は相異なる素数）と素因数分解する。各$p_j^{e_j}$は互いに素なので、乗法性を繰り返し使って$f(n)=\prod_jf(p_j^{e_j})$、$g(n)=\prod_jg(p_j^{e_j})$である。$n=1$は空積で$f(1)=g(1)=1$である。仮定より両者は等しい。
  strategy: Use the prime factorization and multiplicativity on coprime prime powers.
  sketch:
  - 'derive: Equality on prime powers follows trivially from f = g.'
  - 'setup: Conversely factor n into powers of distinct primes.'
  - 'conclude: Multiplicativity reduces f(n) and g(n) to the same product.'
  openmath: (forall (A f g) (-> (and (comm_ring A) (multiplicative_arithmetic_function f A) (multiplicative_arithmetic_function g A)) (<-> (= f g) (forall (p i) (-> (and (in p P) (in i N)) (= (fn_value f (^ p i)) (fn_value g (^ p i))))))))
  hard_negative:
    statement: 乗法的関数$f,g$が等しいことと、すべての素数$p$で$f(p)=g(p)$であることは同値である。
    reason: $f=\zeta$（$n\geq 1$で$1$）と、$g=\mu^2$（平方因子をもたないとき$1$、それ以外$0$）は素数で一致するが、$g(4)=0\neq f(4)$である。
  target: |
    ∀ (A : Type*) [CommRing A] (f g : ArithmeticFunction A), f.IsMultiplicative → g.IsMultiplicative → (f = g ↔ ∀ p i : ℕ, Nat.Prime p → f (p ^ i) = g (p ^ i))
  proof: |
    by
      intro A _ f g hf hg
      exact ArithmeticFunction.IsMultiplicative.eq_iff_eq_on_prime_powers f hf g hg
- id: moebius_sum_multiplicative_squarefree
  kind: gap
  level: 3
  topic: 解析的整数論・メビウス関数
  statement: 可換環に値をとる乗法的関数$f$と平方因子をもたない正の整数$n$について、$\sum_{d\mid n}\mu(d)f(d)=\prod_{p\mid n}(1-f(p))$である。
  statement_en: For a multiplicative function f with values in a commutative ring and a squarefree positive integer n, the sum of μ(d)f(d) over the divisors d of n equals the product of (1-f(p)) over the primes p dividing n.
  assumptions:
  - $A$は可換環、$f$は$A$に値をとる乗法的関数
  - $n$は平方因子をもたない正の整数
  quantifiers:
  - 任意の可換環$A$、乗法的関数$f$、平方因子をもたない正の整数$n$
  conclusion: $\sum_{d\mid n}\mu(d)f(d)=\prod_{p\mid n}(1-f(p))$である。
  answer: |
    $A$を可換環、$f$を乗法的関数、$n$を平方因子をもたない正の整数とする。$n=p_1\cdots p_r$（相異なる素数）と書く。$n$の約数は部分集合$S\subseteq\{1,\dots,r\}$により$d_S=\prod_{i\in S}p_i$とちょうど表される。

    $\mu(d_S)=(-1)^{|S|}$であり、$f$は乗法的なので$f(d_S)=\prod_{i\in S}f(p_i)$である。よって
    $\sum_{d\mid n}\mu(d)f(d)=\sum_S\prod_{i\in S}(-f(p_i))=\prod_{i=1}^r(1-f(p_i))$である。最後の等号は積の展開である。$n=1$では両辺とも$1$である。
  strategy: Index the divisors by subsets of the prime factors and expand the product.
  sketch:
  - 'setup: Divisors of squarefree n correspond to subsets of its prime factors.'
  - 'derive: μ(d_S)f(d_S) is the product of -f(p_i) over i in S.'
  - 'conclude: Summing over subsets is the expansion of the product of (1-f(p_i)).'
  openmath: (forall (A f n) (-> (and (comm_ring A) (multiplicative_arithmetic_function f A) (in n N) (> n 0) (squarefree n)) (= (sum_over_divisors n (lambda (d) (* (moebius d) (fn_value f d)))) (product_over_prime_divisors n (lambda (p) (- 1 (fn_value f p)))))))
  hard_negative:
    statement: 乗法的関数$f$と平方因子をもたない$n$について$\sum_{d\mid n}f(d)=\prod_{p\mid n}(1-f(p))$である。
    reason: $f=\zeta$、$n=2$とすると左辺は$2$、右辺は$0$である。$\mu$の因子がなければ右辺は$\prod(1+f(p))$である。
  target: |
    ∀ (A : Type*) [CommRing A] (f : ArithmeticFunction A) (n : ℕ), f.IsMultiplicative → Squarefree n → ∏ p ∈ n.primeFactors, (1 - f p) = ∑ d ∈ n.divisors, (ArithmeticFunction.moebius d : A) * f d
  proof: |
    by
      intro A _ f n hf hn
      exact ArithmeticFunction.IsMultiplicative.prodPrimeFactors_one_sub_of_squarefree f hf hn
- id: totient_product_formula
  kind: gap
  level: 2
  topic: 解析的整数論・オイラー関数
  statement: 正の整数$n$について、$\varphi(n)=n\prod_{p\mid n}\left(1-\frac{1}{p}\right)$である。
  statement_en: For a positive integer n, φ(n) = n times the product of (1-1/p) over the primes p dividing n.
  assumptions:
  - $n$は正の整数
  quantifiers:
  - 任意の正の整数$n$
  conclusion: $\varphi(n)=n\prod_{p\mid n}(1-1/p)$である。
  answer: |
    $n$を正の整数とする。$n=\prod_jp_j^{e_j}$（$p_j$は相異なる素数、$e_j\geq 1$）と素因数分解する。$n=1$なら空積で両辺とも$1$である。

    互いに素な$m,m'$について$\varphi(mm')=\varphi(m)\varphi(m')$なので、$\varphi(n)=\prod_j\varphi(p_j^{e_j})$である。$\varphi(p^e)=p^{e-1}(p-1)=p^e(1-1/p)$である。

    よって$\varphi(n)=\prod_jp_j^{e_j}\prod_j(1-1/p_j)=n\prod_{p\mid n}(1-1/p)$である。
  strategy: Use multiplicativity of φ and its value on prime powers.
  sketch:
  - 'setup: Factor n into powers of distinct primes.'
  - 'apply_theorem: φ is multiplicative and φ(p^e) = p^e(1-1/p).'
  - 'conclude: Collecting factors gives the formula.'
  openmath: (forall (n) (-> (and (in n N) (> n 0)) (= (euler_phi n) (* n (product_over_prime_divisors n (lambda (p) (- 1 (/ 1 p))))))))
  hard_negative:
    statement: $\varphi(n)=\prod_{p\mid n}(p-1)$である。
    reason: $n=4$なら$\varphi(4)=2$だが、右辺は$1$である。素数べきの指数の寄与が落ちている。
  target: |
    ∀ n : ℕ, 0 < n → (Nat.totient n : ℚ) = n * ∏ p ∈ n.primeFactors, (1 - (p : ℚ)⁻¹)
  proof: |
    by
      intro n _
      exact Nat.totient_eq_mul_prod_factors n
- id: totient_as_moebius_sum
  kind: gap
  level: 3
  topic: 解析的整数論・メビウス関数
  statement: 正の整数$n$について、$\varphi(n)=\sum_{ab=n}\mu(a)\,b$である。つまり$\varphi=\mu*\mathrm{id}$である。
  statement_en: For a positive integer n, φ(n) is the sum of μ(a)b over the factorizations ab = n, that is, φ = μ * id.
  assumptions:
  - $n$は正の整数
  quantifiers:
  - 任意の正の整数$n$
  conclusion: $\varphi(n)=\sum_{ab=n}\mu(a)b$である。
  answer: |
    $n$を正の整数とする。正の整数$m$について$\sum_{d\mid m}\varphi(d)=m$である。実際、$\{1,\dots,m\}$の元を$m$との最大公約数で分類すると、$\gcd(x,m)=m/d$となる$x$は$\varphi(d)$個である。

    メビウスの反転公式を$f=\varphi$、$g(m)=m$に適用する。これは、すべての正の整数$m$で$g(m)=\sum_{d\mid m}f(d)$なら、すべての正の整数$m$で$f(m)=\sum_{ab=m}\mu(a)g(b)$が成り立つという公式である。$m=n$とすると$\varphi(n)=\sum_{ab=n}\mu(a)b$である。
  strategy: Invert the identity Σ_{d|m} φ(d) = m by Möbius inversion.
  sketch:
  - 'derive: Grouping 1, ..., m by gcd with m gives the sum of φ(d) over d | m equal to m.'
  - 'apply_theorem: Möbius inversion applied to this identity.'
  - 'conclude: This gives φ(n) as the sum of μ(a)b over ab = n.'
  openmath: (forall (n) (-> (and (in n N) (> n 0)) (= (euler_phi n) (sum_over_divisors n (lambda (d) (* (moebius d) (/ n d)))))))
  hard_negative:
    statement: $\varphi(n)=\sum_{d\mid n}\mu(d)$である。
    reason: $n=2$なら左辺は$1$、右辺は$\mu(1)+\mu(2)=0$である。$n/d$の因子が必要である。
  target: |
    ∀ n : ℕ, 0 < n → ∑ x ∈ n.divisorsAntidiagonal, (ArithmeticFunction.moebius x.1 : ℤ) * (x.2 : ℤ) = (Nat.totient n : ℤ)
  proof: |
    by
      intro n hn
      have h := (ArithmeticFunction.sum_eq_iff_sum_mul_moebius_eq (R := ℤ) (f := fun m => (Nat.totient m : ℤ)) (g := fun m => (m : ℤ))).1 (fun m _ => by
        have := Nat.sum_totient m
        exact_mod_cast this)
      exact h n hn
- id: divisor_count_and_sum_factorization_formula
  kind: gap
  level: 2
  topic: 解析的整数論・約数関数
  statement: 正の整数$n$の素因数分解を$n=\prod_{p\mid n}p^{e_p}$とすると、約数の個数は$\prod_{p\mid n}(e_p+1)$であり、約数の和は$\prod_{p\mid n}\sum_{k=0}^{e_p}p^k$である。
  statement_en: If n = the product of p^(e_p) is the prime factorization of a positive integer n, then the number of divisors of n is the product of (e_p+1), and the sum of the divisors is the product of the sums of p^k for 0 ≤ k ≤ e_p.
  assumptions:
  - $n$は正の整数
  - $e_p=v_p(n)$
  quantifiers:
  - 任意の正の整数$n$
  conclusion: 約数の個数と和は上の積で与えられる。
  answer: |
    $n$を正の整数とし、素因数を$p_1,\dots,p_r$、$e_j=v_{p_j}(n)$とする。素因数分解の一意性より、$n$の正の約数は$d=\prod_jp_j^{k_j}$（$0\leq k_j\leq e_j$）とちょうど一度ずつ表される。

    組$(k_1,\dots,k_r)$の個数は$\prod_j(e_j+1)$である。

    約数の和は$\sum_{k_1,\dots,k_r}\prod_jp_j^{k_j}$であり、積の展開より$\prod_j\sum_{k=0}^{e_j}p_j^k$に等しい。$n=1$では空積で、どちらも$1$である。
  strategy: Parametrize the divisors by exponent tuples and expand.
  sketch:
  - 'derive: Unique factorization parametrizes divisors by exponent tuples.'
  - 'derive: Counting tuples gives the product of (e_p+1).'
  - 'conclude: Expanding the product of geometric sums gives the divisor sum.'
  openmath: (forall (n) (-> (and (in n N) (> n 0)) (and (= (divisor_count n) (product_over_prime_divisors n (lambda (p) (+ (padic_valuation p n) 1)))) (= (sum_over_divisors n (lambda (d) d)) (product_over_prime_divisors n (lambda (p) (sum (integer_range 0 (padic_valuation p n)) (lambda (k) (^ p k)))))))))
  hard_negative:
    statement: 約数の個数は$\prod_{p\mid n}e_p$である。
    reason: $n=6$なら$e_2=e_3=1$で積は$1$だが、約数は$1,2,3,6$の$4$個である。
  target: |
    ∀ n : ℕ, n ≠ 0 → n.divisors.card = ∏ p ∈ n.primeFactors, (n.factorization p + 1) ∧ ∑ d ∈ n.divisors, d = ∏ p ∈ n.primeFactors, ∑ k ∈ Finset.range (n.factorization p + 1), p ^ k
  proof: |
    by
      intro n hn
      exact ⟨Nat.card_divisors hn, Nat.sum_divisors hn⟩
- id: summatory_convolution_with_one
  kind: gap
  level: 3
  topic: 解析的整数論・ディリクレ積
  statement: 可換環に値をとる数論的関数$f$と自然数$N$について、$\sum_{n=1}^N\sum_{d\mid n}f(d)=\sum_{d=1}^Nf(d)\lfloor N/d\rfloor$である。
  statement_en: For an arithmetic function f with values in a commutative ring and a natural number N, the sum over n ≤ N of the sum of f(d) over d | n equals the sum over d ≤ N of f(d)⌊N/d⌋.
  assumptions:
  - $A$は可換環
  - $f$は$A$に値をとる数論的関数
  - $N$は自然数
  quantifiers:
  - 任意の可換環$A$、数論的関数$f$、自然数$N$
  conclusion: $\sum_{n=1}^N\sum_{d\mid n}f(d)=\sum_{d=1}^Nf(d)\lfloor N/d\rfloor$である。
  answer: |
    $A$を可換環、$f$を数論的関数、$N$を自然数とする。左辺は、$1\leq n\leq N$、$d\mid n$を満たす組$(d,n)$にわたる$f(d)$の和である。

    和の順序を交換する。$d$を固定すると、$d\mid n$、$1\leq n\leq N$を満たす$n$は$d,2d,\dots,\lfloor N/d\rfloor d$の$\lfloor N/d\rfloor$個である。$d$は$1\leq d\leq N$を動く。よって左辺は$\sum_{d=1}^Nf(d)\lfloor N/d\rfloor$に等しい。
  strategy: Exchange the order of summation over pairs (d,n) with d | n.
  sketch:
  - 'setup: The left side sums f(d) over pairs d | n with n ≤ N.'
  - 'derive: For fixed d there are ⌊N/d⌋ multiples of d up to N.'
  - 'conclude: Exchanging the order gives the right side.'
  openmath: (forall (A f N1) (-> (and (comm_ring A) (arithmetic_function f A) (in N1 N)) (= (sum (integer_range 1 N1) (lambda (n) (sum_over_divisors n (lambda (d) (fn_value f d))))) (sum (integer_range 1 N1) (lambda (d) (* (fn_value f d) (floor (/ N1 d))))))))
  hard_negative:
    statement: $\sum_{n=1}^N\sum_{d\mid n}f(d)=\sum_{d=1}^Nf(d)$である。
    reason: $f=\zeta$、$N=2$とすると左辺は$1+2=3$、右辺は$2$である。各$d$は$\lfloor N/d\rfloor$回現れる。
  target: |
    ∀ (A : Type*) [CommRing A] (f : ArithmeticFunction A) (M : ℕ), ∑ n ∈ Finset.Ioc 0 M, (f * (ArithmeticFunction.zeta : ArithmeticFunction A)) n = ∑ n ∈ Finset.Ioc 0 M, f n * ((M / n : ℕ) : A)
  proof: |
    by
      intro A _ f M
      exact ArithmeticFunction.sum_Ioc_mul_zeta_eq_sum f M
- id: squarefree_times_square_decomposition
  kind: gap
  level: 1
  topic: 初等整数論・平方因子
  statement: 正の整数$n$は、正の整数$a,b$と平方因子をもたない$a$により$n=b^2a$と書ける。
  statement_en: Every positive integer n can be written as n = b^2 a with positive integers a, b and a squarefree.
  assumptions:
  - $n$は正の整数
  quantifiers:
  - 任意の正の整数$n$
  conclusion: 正の整数$a,b$で$b^2a=n$、$a$は平方因子をもたないものが存在する。
  answer: |
    $n$を正の整数とする。$b^2\mid n$となる正の整数$b$のうち最大のものをとる。$b=1$が条件を満たし、$b^2\leq n$なので最大値は存在する。$a=n/b^2$とおくと、$a$は正の整数で$n=b^2a$である。

    $a$が平方因子をもつとする。$t>1$で$t^2\mid a$となる。すると$(bt)^2\mid b^2a=n$であり、$bt>b$となって$b$の最大性に反する。よって$a$は平方因子をもたない。
  strategy: Take the largest b with b^2 dividing n.
  sketch:
  - 'construct: Choose the largest b with b^2 | n and set a = n/b^2.'
  - 'contradiction: A square factor t^2 of a would give the larger square (bt)^2 dividing n.'
  - 'conclude: Hence a is squarefree.'
  openmath: (forall (n) (-> (and (in n N) (> n 0)) (exists (a b) (and (in a N) (in b N) (> a 0) (> b 0) (= (* (^ b 2) a) n) (squarefree a)))))
  hard_negative:
    statement: 正の整数$n$は平方因子をもたない$a,b$により$n=ab$と書ける。
    reason: $n=8$とする。$a,b$がともに平方因子をもたなければ$v_2(ab)\leq 2$なので、$v_2(8)=3$に矛盾する。
  target: |
    ∀ n : ℕ, 0 < n → ∃ a b : ℕ, 0 < a ∧ 0 < b ∧ b ^ 2 * a = n ∧ Squarefree a
  proof: |
    by
      intro n hn
      exact Nat.sq_mul_squarefree_of_pos hn
- id: squarefree_product_iff
  kind: gap
  level: 1
  topic: 初等整数論・平方因子
  statement: 自然数$m,n$について、$mn$が平方因子をもたないことと、$m,n$が互いに素でともに平方因子をもたないことは同値である。
  statement_en: For natural numbers m, n, the product mn is squarefree if and only if m and n are coprime and both squarefree.
  assumptions:
  - $m,n$は自然数
  quantifiers:
  - 任意の自然数$m,n$
  conclusion: $mn$が平方因子をもたないことと、$\gcd(m,n)=1$かつ$m,n$がともに平方因子をもたないことは同値である。
  answer: |
    $m,n$を自然数とする。$x$が平方因子をもたないとは、$t^2\mid x$なら$t=1$となることをいう。$0$はすべての$t^2$で割れるので平方因子をもつ。

    $mn$が平方因子をもたないとする。$mn\neq 0$である。$t^2\mid m$なら$t^2\mid mn$なので$t=1$であり、$m$は平方因子をもたない。$n$も同様である。$t=\gcd(m,n)$とすると$t^2\mid mn$なので$t=1$である。

    逆に、$\gcd(m,n)=1$で$m,n$が平方因子をもたないとする。$m,n\neq 0$である。素数$p$について$p^2\mid mn$とすると、$\gcd(m,n)=1$より$p$は$m,n$の一方だけを割る。$p\mid m$なら$p\nmid n$なので$p^2\mid m$となり、仮定に反する。$p\mid n$でも同じである。よって$mn$は素数の平方で割れない。$t>1$で$t^2\mid mn$なら$t$の素因数$p$で$p^2\mid mn$となるので、$mn$は平方因子をもたない。
  strategy: A square dividing a coprime product must divide one factor; conversely gcd(m,n)^2 divides mn.
  sketch:
  - 'derive: Divisors of a squarefree number are squarefree, and gcd(m,n)^2 divides mn.'
  - 'setup: Conversely suppose p^2 | mn for a prime p.'
  - 'derive: Coprimality puts all of p^2 into one factor.'
  - 'conclude: This contradicts squarefreeness of that factor.'
  openmath: (forall (m n) (-> (and (in m N) (in n N)) (<-> (squarefree (* m n)) (and (= (gcd m n) 1) (squarefree m) (squarefree n)))))
  hard_negative:
    statement: $m,n$がともに平方因子をもたなければ$mn$も平方因子をもたない。
    reason: $m=n=2$とすると$mn=4$は平方である。互いに素の条件が必要である。
  target: |
    ∀ m n : ℕ, Squarefree (m * n) ↔ Nat.Coprime m n ∧ Squarefree m ∧ Squarefree n
  proof: |
    by
      intro m n
      exact Nat.squarefree_mul_iff
- id: squarefree_iff_omega_eq_bigomega
  kind: gap
  level: 2
  topic: 初等整数論・平方因子
  statement: 正の整数$n$について、次は同値である。(1) $n$は平方因子をもたない。(2) すべての素数$p$で$v_p(n)\leq 1$である。(3) 相異なる素因数の個数$\omega(n)$と重複を込めた素因数の個数$\Omega(n)$が等しい。
  statement_en: For a positive integer n the following are equivalent. (i) n is squarefree. (ii) v_p(n) ≤ 1 for all primes p. (iii) The number ω(n) of distinct prime factors equals the number Ω(n) of prime factors with multiplicity.
  assumptions:
  - $n$は正の整数
  quantifiers:
  - 任意の正の整数$n$
  conclusion: (1)、(2)、(3)は同値である。
  answer: |
    $n$を正の整数とする。$\Omega(n)=\sum_{p\mid n}v_p(n)$、$\omega(n)=\sum_{p\mid n}1$である。

    (1)と(2)の同値を示す。$p^2\mid n$は$v_p(n)\geq 2$と同値である。$t>1$で$t^2\mid n$なら、$t$の素因数$p$で$p^2\mid n$である。よって平方因子をもたないことは、すべての素数で$v_p(n)\leq 1$であることと同値である。

    (2)と(3)の同値を示す。$p\mid n$なら$v_p(n)\geq 1$である。$\Omega(n)-\omega(n)=\sum_{p\mid n}(v_p(n)-1)$は非負の整数の和である。これが$0$であることは、すべての$p\mid n$で$v_p(n)=1$であることと同値である。$p\nmid n$なら$v_p(n)=0$なので、これは(2)と同値である。
  strategy: Translate square factors into valuations and compare Ω-ω as a sum of nonnegative terms.
  sketch:
  - 'derive: A square factor exists exactly when some prime has valuation at least 2.'
  - 'derive: Ω(n)-ω(n) is the sum of v_p(n)-1 over p | n.'
  - 'conclude: This sum vanishes exactly when all valuations are at most 1.'
  openmath: (forall (n) (-> (and (in n N) (> n 0)) (and (<-> (squarefree n) (forall (p) (-> (in p P) (<= (padic_valuation p n) 1)))) (<-> (squarefree n) (= (distinct_prime_factor_count n) (prime_factor_count n))))))
  hard_negative:
    statement: 正の整数$n$について$\omega(n)=1$なら$n$は平方因子をもたない。
    reason: $n=4$なら$\omega(4)=1$だが$4$は平方である。$\omega(n)=1$は$n$が素数べきであることと同値である。
  target: |
    ∀ n : ℕ, n ≠ 0 → (Squarefree n ↔ ∀ p, n.factorization p ≤ 1) ∧ (Squarefree n ↔ ArithmeticFunction.cardDistinctFactors n = ArithmeticFunction.cardFactors n)
  proof: |
    by
      intro n hn
      exact ⟨Nat.squarefree_iff_factorization_le_one hn, (ArithmeticFunction.cardDistinctFactors_eq_cardFactors_iff_squarefree hn).symm⟩
- id: pow_sub_one_prime_forces_base_two_prime_exponent
  kind: gap
  level: 1
  topic: 初等整数論・メルセンヌ数
  statement: 自然数$a,n$（$n\neq 1$）について、$a^n-1$が素数ならば、$a=2$かつ$n$は素数である。底が$2$の場合によく知られた事実の一般形である。
  statement_en: For natural numbers a, n with n ≠ 1, if a^n-1 is prime, then a = 2 and n is prime. This is the general-base form of the known fact for base 2.
  assumptions:
  - $a,n$は自然数、$n\neq 1$
  - $a^n-1$は素数
  quantifiers:
  - 任意の自然数$a,n$
  conclusion: $a=2$かつ$n$は素数である。
  answer: |
    $a,n$を自然数で$n\neq 1$、$a^n-1$が素数であるとする。$a^n-1\geq 2$なので、$a\geq 2$かつ$n\geq 2$である。

    $a^n-1=(a-1)(a^{n-1}+\dots+a+1)$である。第2因子は$n\geq 2$より$a+1\geq 3$以上で$1$でない。素数なので第1因子が$1$であり、$a=2$である。

    $n=st$（$s,t\geq 2$）と仮定する。$2^n-1=(2^s-1)(2^{s(t-1)}+\dots+2^s+1)$であり、$2^s-1\geq 3$、第2因子は$2^s+1\geq 5$以上である。これは$2^n-1$が素数であることに反する。$n\geq 2$なので$n$は素数である。
  strategy: Factor a^n-1 first by a-1 and then by 2^s-1.
  sketch:
  - 'derive: The factorization with a-1 forces a = 2.'
  - 'contradiction: If n = st with s, t ≥ 2, then 2^s-1 is a proper factor of 2^n-1.'
  - 'conclude: Hence n is prime.'
  openmath: (forall (a n) (-> (and (in a N) (in n N) (!= n 1) (in (- (^ a n) 1) P)) (and (= a 2) (in n P))))
  hard_negative:
    statement: $n$が素数なら$2^n-1$は素数である。
    reason: $n=11$なら$2^{11}-1=2047=23\cdot 89$である。逆は成り立たない。
  target: |
    ∀ a n : ℕ, n ≠ 1 → Nat.Prime (a ^ n - 1) → a = 2 ∧ Nat.Prime n
  proof: |
    by
      intro a n hn h
      exact Nat.prime_of_pow_sub_one_prime hn h
- id: pow_add_one_prime_forces_two_power_exponent
  kind: gap
  level: 1
  topic: 初等整数論・フェルマー数
  statement: 自然数$a>1$と正の整数$n$について、$a^n+1$が素数ならば、$n$は$2$のべきである。底が$2$の場合によく知られた事実の一般形である。
  statement_en: For a natural number a > 1 and a positive integer n, if a^n+1 is prime, then n is a power of 2. This is the general-base form of the known fact for base 2.
  assumptions:
  - $a>1$は自然数
  - $n$は正の整数
  - $a^n+1$は素数
  quantifiers:
  - 任意の自然数$a>1$と正の整数$n$
  conclusion: ある自然数$m$で$n=2^m$である。
  answer: |
    $a>1$を自然数、$n$を正の整数とし、$a^n+1$が素数であるとする。$n=2^mt$（$t$は奇数）と書く。$t\geq 3$と仮定する。

    $b=a^{2^m}$とおく。$t$は奇数なので$b^t+1=(b+1)(b^{t-1}-b^{t-2}+\dots-b+1)$である。$a^n+1=b^t+1$である。$b\geq 2$より$1<b+1<b^t+1$なので、$b+1$は$a^n+1$の真の約数である。これは素数であることに反する。

    よって$t=1$であり、$n=2^m$である。
  strategy: An odd factor t of n gives the factor a^(n/t)+1.
  sketch:
  - 'setup: Write n = 2^m t with t odd.'
  - 'derive: For t ≥ 3, b+1 properly divides b^t+1 with b = a^(2^m).'
  - 'conclude: Hence t = 1.'
  openmath: (forall (a n) (-> (and (in a N) (> a 1) (in n N) (> n 0) (in (+ (^ a n) 1) P)) (exists (m) (and (in m N) (= n (^ 2 m))))))
  hard_negative:
    statement: すべての$m$について$2^{2^m}+1$は素数である。
    reason: オイラーが示したとおり、$2^{32}+1=641\cdot 6700417$である。
  target: |
    ∀ a n : ℕ, 1 < a → n ≠ 0 → Nat.Prime (a ^ n + 1) → ∃ m : ℕ, n = 2 ^ m
  proof: |
    by
      intro a n ha hn h
      exact Nat.pow_of_pow_add_prime ha hn h
- id: fermat_numbers_product_and_coprime
  kind: gap
  level: 2
  topic: 初等整数論・フェルマー数
  statement: フェルマー数$F_n=2^{2^n}+1$について、$\prod_{k=0}^{n-1}F_k=F_n-2$であり、$m\neq n$なら$\gcd(F_m,F_n)=1$である。
  statement_en: The Fermat numbers F_n = 2^(2^n)+1 satisfy that the product of F_k for 0 ≤ k < n equals F_n-2, and gcd(F_m,F_n) = 1 for m ≠ n.
  assumptions:
  - $F_n=2^{2^n}+1$
  - $m,n$は自然数
  quantifiers:
  - 任意の自然数$m,n$
  conclusion: $\prod_{k<n}F_k=F_n-2$であり、$m\neq n$なら$\gcd(F_m,F_n)=1$である。
  answer: |
    $F_n=2^{2^n}+1$とする。$n$に関する帰納法で$\prod_{k<n}F_k=F_n-2$を示す。$n=0$では左辺は空積$1$で、右辺は$3-2=1$である。$n$で成り立つとすると、$\prod_{k<n+1}F_k=(F_n-2)F_n=(2^{2^n}-1)(2^{2^n}+1)=2^{2^{n+1}}-1=F_{n+1}-2$である。

    $m<n$とする。$F_m$は$\prod_{k<n}F_k=F_n-2$を割り切る。よって$\gcd(F_m,F_n)$は$F_n-(F_n-2)=2$を割り切る。$F_m$は奇数なので$\gcd(F_m,F_n)=1$である。$m>n$は対称である。
  strategy: Prove the product identity by induction and deduce that a common divisor divides 2.
  sketch:
  - 'induction: The product identity follows from (2^(2^n)-1)(2^(2^n)+1) = 2^(2^(n+1))-1.'
  - 'derive: For m < n, F_m divides F_n-2, so gcd(F_m,F_n) divides 2.'
  - 'conclude: Fermat numbers are odd, so the gcd is 1.'
  openmath: (forall (m n) (-> (and (in m N) (in n N)) (and (= (product (integer_range 0 (- n 1)) (lambda (k) (fermat_number k))) (- (fermat_number n) 2)) (-> (!= m n) (= (gcd (fermat_number m) (fermat_number n)) 1)))))
  hard_negative:
    statement: すべてのフェルマー数は素数なので、互いに素であることは自明である。
    reason: $F_5=2^{32}+1=641\cdot 6700417$は合成数である。互いに素であることは素数性によらず積の恒等式から従う。
  target: |
    ∀ m n : ℕ, ∏ k ∈ Finset.range n, Nat.fermatNumber k = Nat.fermatNumber n - 2 ∧ (m ≠ n → Nat.Coprime (Nat.fermatNumber m) (Nat.fermatNumber n))
  proof: |
    by
      intro m n
      exact ⟨Nat.prod_fermatNumber n, fun h => Nat.coprime_fermatNumber_fermatNumber h⟩
- id: fermat_number_prime_factor_form
  kind: textbook
  level: 3
  topic: 初等整数論・フェルマー数
  statement: 自然数$n\geq 2$と素数$p$について、$p\mid F_n=2^{2^n}+1$ならば、ある自然数$k$で$p=k\cdot 2^{n+2}+1$である。
  statement_en: For a natural number n ≥ 2 and a prime p, if p divides the Fermat number F_n = 2^(2^n)+1, then p = k·2^(n+2)+1 for some natural number k.
  assumptions:
  - $n\geq 2$は自然数
  - $p$は素数で$p\mid F_n$
  quantifiers:
  - 任意の自然数$n\geq 2$と素数$p$
  conclusion: $p=k\cdot 2^{n+2}+1$となる自然数$k$が存在する。
  answer: |
    $n\geq 2$を自然数、$p$を$F_n$の素因数とする。$F_n$は奇数なので$p$は奇素数である。法$p$で$2^{2^n}\equiv -1$であり、$2^{2^{n+1}}\equiv 1$である。$-1\not\equiv 1$なので、$2$の位数はちょうど$2^{n+1}$である。

    位数は$p-1$を割り切るので、$2^{n+1}\mid p-1$である。$n\geq 2$より$8\mid p-1$である。第二補充法則より$2$は法$p$で平方である。$a^2\equiv 2\pmod p$とする。$a^{2^{n+1}}\equiv 2^{2^n}\equiv -1$、$a^{2^{n+2}}\equiv 1\pmod p$なので、$a$の位数はちょうど$2^{n+2}$である。

    位数は$p-1$を割り切るので、$2^{n+2}\mid p-1$である。したがって$p=k\cdot 2^{n+2}+1$と書ける。
  strategy: First get 8 | p-1 from the order of 2, then use a square root of 2 to gain one more factor of 2.
  sketch:
  - 'derive: The order of 2 modulo p is 2^(n+1), so 2^(n+1) | p-1.'
  - 'derive: Since n ≥ 2, p ≡ 1 modulo 8 and 2 is a square modulo p.'
  - 'derive: A square root a of 2 has order 2^(n+2).'
  - 'conclude: Hence 2^(n+2) | p-1.'
  openmath: (forall (n p) (-> (and (in n N) (>= n 2) (in p P) (dvd p (fermat_number n))) (exists (k) (and (in k N) (= p (+ (* k (^ 2 (+ n 2))) 1))))))
  hard_negative:
    statement: $n=1$でも$p\mid F_n$なら$p=k\cdot 2^{n+2}+1$である。
    reason: $F_1=5$であり、$5=k\cdot 8+1$となる自然数$k$はない。$n\geq 2$は必要である。
  target: |
    ∀ n p : ℕ, 1 < n → Nat.Prime p → p ∣ Nat.fermatNumber n → ∃ k : ℕ, p = k * 2 ^ (n + 2) + 1
  proof: |
    by
      intro n p hn hp h
      exact Nat.fermat_primeFactors_one_lt n p hn hp h
- id: mersenne_prime_factor_congruence
  kind: gap
  level: 2
  topic: 初等整数論・メルセンヌ数
  statement: 奇素数$p$と素数$q$について、$q\mid 2^p-1$ならば$q\equiv 1\pmod{2p}$である。
  statement_en: For an odd prime p and a prime q, if q divides 2^p-1, then q ≡ 1 modulo 2p.
  assumptions:
  - $p$は奇素数
  - $q$は素数で$q\mid 2^p-1$
  quantifiers:
  - 任意の奇素数$p$と素数$q$
  conclusion: $q\equiv 1\pmod{2p}$である。
  answer: |
    $p$を奇素数、$q$を$2^p-1$の素因数とする。$2^p-1$は奇数なので$q$は奇素数であり、$q\nmid 2$である。

    $2$の法$q$での位数を$d$とする。$2^p\equiv 1\pmod q$より$d\mid p$なので、$d=1$または$d=p$である。$d=1$なら$q\mid 2-1=1$となり起こらない。よって$d=p$である。フェルマーの小定理より$d\mid q-1$なので、$p\mid q-1$である。

    $q$は奇数なので$2\mid q-1$である。$p$は奇数なので$\gcd(2,p)=1$であり、$2p\mid q-1$である。
  strategy: The order of 2 modulo q equals p and divides q-1, and q-1 is even.
  sketch:
  - 'derive: q is odd because 2^p-1 is odd.'
  - 'derive: The order of 2 modulo q divides the prime p and is not 1.'
  - 'apply_theorem: Fermat''s little theorem gives p | q-1.'
  - 'conclude: Since q-1 is even and p is odd, 2p | q-1.'
  openmath: (forall (p q) (-> (and (in p P) (!= p 2) (in q P) (dvd q (- (^ 2 p) 1))) (dvd (* 2 p) (- q 1))))
  hard_negative:
    statement: $p=2$でも$q\mid 2^p-1$なら$q\equiv 1\pmod{2p}$である。
    reason: $p=2$なら$2^p-1=3$であり、$q=3\not\equiv 1\pmod 4$である。
  target: |
    ∀ p q : ℕ, Nat.Prime p → p ≠ 2 → Nat.Prime q → q ∣ 2 ^ p - 1 → q ≡ 1 [MOD 2 * p]
  proof: |
    by
      intro p q hp hp2 hq h
      haveI := Fact.mk hp
      haveI := Fact.mk hq
      have hpos : 1 ≤ 2 ^ p := Nat.one_le_two_pow
      have e1 : (2 : ZMod q) ^ p = 1 := by
        have h0 : ((2 ^ p - 1 : ℕ) : ZMod q) = 0 := (ZMod.natCast_eq_zero_iff _ _).2 h
        rw [Nat.cast_sub hpos] at h0
        push_cast at h0
        exact sub_eq_zero.1 h0
      have e2 : (2 : ZMod q) ≠ 1 := by
        intro e
        have h1 : (1 : ZMod q) = 0 := by linear_combination e
        exact one_ne_zero h1
      have e3 : (2 : ZMod q) ≠ 0 := by
        intro e
        rw [e, zero_pow hp.ne_zero] at e1
        exact zero_ne_one e1
      have o : orderOf (2 : ZMod q) = p := orderOf_eq_prime e1 e2
      have d : p ∣ q - 1 := o ▸ ZMod.orderOf_dvd_card_sub_one e3
      have qodd : q ≠ 2 := by
        rintro rfl
        exact e3 rfl
      have d2 : 2 ∣ q - 1 := by
        have := hq.eq_two_or_odd
        omega
      have c : Nat.Coprime 2 p := (Nat.coprime_primes Nat.prime_two hp).2 (Ne.symm hp2)
      have d3 := c.mul_dvd_of_dvd_of_dvd d2 d
      exact ((Nat.modEq_iff_dvd' hq.one_le).2 d3).symm
- id: lucas_primality_criterion_iff
  kind: textbook
  level: 3
  topic: 初等整数論・素数判定
  statement: リュカの判定法。自然数$p$（$p=0$では$p-1$を$0$と読む）が素数であることと、$a\in\mathbb{Z}/p\mathbb{Z}$で$a^{p-1}=1$かつ$p-1$のすべての素因数$q$で$a^{(p-1)/q}\neq 1$となるものが存在することは同値である。
  statement_en: Lucas's primality criterion. A natural number p (with p-1 read as 0 for p = 0) is prime if and only if there is a in Z/pZ with a^(p-1) = 1 and a^((p-1)/q) ≠ 1 for every prime divisor q of p-1.
  assumptions:
  - $p$は自然数（$p=0$では$p-1$を$0$と読む）
  quantifiers:
  - 任意の自然数$p$
  conclusion: $p$が素数であることと上の$a$の存在は同値である。
  answer: |
    $p$を自然数とする。

    $p$が素数とする。法$p$の原始根$a$をとる。位数は$p-1$なので$a^{p-1}=1$であり、$q\mid p-1$が素数なら$(p-1)/q<p-1$は位数より小さい正の整数なので$a^{(p-1)/q}\neq 1$である。

    逆に上の$a$があるとする。$p\leq 1$なら$p-1=0$（$p=0$では指数を$0$と読む）であり、素数$q=2$は$0$を割るので$a^{0/2}=a^0=1$となり、条件に反する。よって$p\geq 2$である。$p=2$は素数なので$p\geq 3$とする。$a^{p-1}=1$なので$a$は単元である。$a$の位数を$d$とすると$d\mid p-1$である。$d\neq p-1$なら$(p-1)/d>1$の素因数$q$をとると、$d\mid(p-1)/q$となり$a^{(p-1)/q}=1$となって条件に反する。よって$d=p-1$である。

    単元群$(\mathbb{Z}/p\mathbb{Z})^\times$は位数$p-1$の元をもつので$\varphi(p)\geq p-1$である。$\{1,\dots,p-1\}$のすべてが$p$と互いに素なので、$p$は素数である。
  strategy: Primitive roots give the forward direction; conversely the conditions force an element of order p-1, so φ(p) ≥ p-1.
  sketch:
  - 'apply_theorem: If p is prime, a primitive root satisfies the conditions.'
  - 'derive: Conversely p ≤ 1 is impossible, because q = 2 divides 0.'
  - 'derive: The conditions force the order of a to be p-1.'
  - 'conclude: Then φ(p) ≥ p-1, so p is prime.'
  openmath: (forall (p) (-> (and (in p N) (> p 0)) (<-> (in p P) (exists (a) (and (in a Z) (dvd p (- (^ a (- p 1)) 1)) (forall (q) (-> (and (in q P) (dvd q (- p 1))) (not (dvd p (- (^ a (/ (- p 1) q)) 1))))))))))
  hard_negative:
    statement: $a^{p-1}\equiv 1\pmod p$となる$a\not\equiv 0,1$があれば$p$は素数である。
    reason: $p=341=11\cdot 31$、$a=2$とすると$2^{340}\equiv 1\pmod{341}$である。$p-1$の素因数についての条件なしでは判定できない。
  target: |
    ∀ p : ℕ, Nat.Prime p ↔ ∃ a : ZMod p, a ^ (p - 1) = 1 ∧ ∀ q : ℕ, Nat.Prime q → q ∣ p - 1 → a ^ ((p - 1) / q) ≠ 1
  proof: |
    by
      intro p
      exact lucas_primality_iff p
- id: pepin_test_sufficient_condition
  kind: gap
  level: 3
  topic: 初等整数論・素数判定
  statement: 自然数$n$について、$3^{(F_n-1)/2}\equiv -1\pmod{F_n}$ならば、フェルマー数$F_n=2^{2^n}+1$は素数である。
  statement_en: For a natural number n, if 3^((F_n-1)/2) ≡ -1 modulo F_n, then the Fermat number F_n = 2^(2^n)+1 is prime.
  assumptions:
  - $n$は自然数
  - $3^{(F_n-1)/2}\equiv -1\pmod{F_n}$
  quantifiers:
  - 任意の自然数$n$
  conclusion: $F_n$は素数である。
  answer: |
    $n$を自然数、$N=F_n$とし、$3^{(N-1)/2}\equiv -1\pmod N$とする。$N\geq 3$は奇数である。$N-1=2^{2^n}$は$2$のべきである。

    仮定を平方すると$3^{N-1}\equiv 1\pmod N$である。よって$3$は法$N$で単元であり、その位数$d$は$2$のべきで、$N-1$を割り切る。$N\geq 3$なので$-1\not\equiv 1\pmod N$であり、$3^{(N-1)/2}\not\equiv 1$である。したがって$d$は$(N-1)/2$を割り切らず、$d=N-1$である。

    単元群$(\mathbb{Z}/N\mathbb{Z})^\times$が位数$N-1$の元をもつので、$\varphi(N)\geq N-1$である。したがって$\{1,\dots,N-1\}$のすべてが$N$と互いに素であり、$N$は素数である。
  strategy: The hypothesis gives an element of order N-1 because N-1 is a power of 2.
  sketch:
  - 'derive: Squaring gives 3^(N-1) ≡ 1 modulo N.'
  - 'derive: N-1 is a power of 2 and 3^((N-1)/2) ≠ 1, so the order of 3 is N-1.'
  - 'conclude: Thus φ(N) ≥ N-1, so N is prime.'
  openmath: (forall (n) (-> (and (in n N) (dvd (fermat_number n) (+ (^ 3 (/ (- (fermat_number n) 1) 2)) 1))) (in (fermat_number n) P)))
  hard_negative:
    statement: 奇数$N>1$について、$3^{(N-1)/2}\equiv -1\pmod N$ならば$N$は素数である。
    reason: $N=703=19\cdot 37$は合成数だが、$3^{351}\equiv -1\pmod{703}$である。証明は$N-1$が$2$のべきであることを使っており、フェルマー数に限られる。
  target: |
    ∀ n : ℕ, (3 : ZMod (Nat.fermatNumber n)) ^ ((Nat.fermatNumber n - 1) / 2) = -1 → Nat.Prime (Nat.fermatNumber n)
  proof: |
    by
      intro n h
      exact Nat.pepin_primality' n h
- id: lucas_lehmer_test
  kind: named
  level: 3
  topic: 初等整数論・素数判定
  statement: リュカ・レーマーの判定法。$s_0=4$、$s_{i+1}=s_i^2-2$とする。自然数$p\geq 3$について、$2^p-1$が素数であることと$2^p-1\mid s_{p-2}$は同値である。
  statement_en: The Lucas–Lehmer test. Let s_0 = 4 and s_(i+1) = s_i^2-2. For a natural number p ≥ 3, the number 2^p-1 is prime if and only if 2^p-1 divides s_(p-2).
  assumptions:
  - $p\geq 3$は自然数
  - $s_0=4$、$s_{i+1}=s_i^2-2$
  quantifiers:
  - 任意の自然数$p\geq 3$
  conclusion: $2^p-1$が素数であることと$2^p-1\mid s_{p-2}$は同値である。
  answer: |
    $p\geq 3$を自然数、$M=2^p-1$、$\omega=2+\sqrt 3$、$\bar\omega=2-\sqrt 3$とする。$\omega\bar\omega=1$であり、帰納法で$s_i=\omega^{2^i}+\bar\omega^{2^i}$である。実際$s_0=4$であり、$(\omega^{2^i}+\bar\omega^{2^i})^2-2=\omega^{2^{i+1}}+\bar\omega^{2^{i+1}}$である。

    奇素数$q$について、$X_q=(\mathbb{Z}/q\mathbb{Z})[T]/(T^2-3)$は$q^2$個の元をもつ環であり、$\sqrt 3$の像を$\alpha$と書く。

    十分性を示す。$M\mid s_{p-2}$で$M$が合成数と仮定する。$q$を$M$の最小の素因数とすると$q^2\leq M$で、$M$は奇数なので$q$は奇数である。$X_q$で$\omega^{2^{p-2}}+\bar\omega^{2^{p-2}}=0$である。$\omega^{2^{p-2}}$を掛けると$\omega^{2^{p-1}}=-1$であり、$\omega^{2^p}=1$である。$-1\neq 1$なので、$\omega$は単元群で位数$2^p$をもつ。単元群の位数は$q^2-1$以下なので$2^p\leq q^2-1<M<2^p$となり矛盾する。よって$M$は素数である。

    必要性を示す。$q=M$を素数とする。$p$は素数であり（$p$が合成数なら$M$は合成数）、$p\geq 3$は奇数である。$q\equiv 7\pmod 8$なので$2^{(q-1)/2}\equiv 1\pmod q$である。$q\equiv 1\pmod 3$、$q\equiv 3\pmod 4$なので、相互法則より$\left(\frac{3}{q}\right)=-\left(\frac{q}{3}\right)=-1$であり、$3^{(q-1)/2}\equiv -1\pmod q$である。

    $X_q$は体であり、フロベニウス写像より$(1+\alpha)^q=1+3^{(q-1)/2}\alpha=1-\alpha$である。よって$(1+\alpha)^{q+1}=(1+\alpha)(1-\alpha)=-2$である。$(1+\alpha)^2=2\omega$なので、$(2\omega)^{(q+1)/2}=-2$である。$2^{(q+1)/2}=2\cdot 2^{(q-1)/2}=2$より$2\omega^{(q+1)/2}=-2$であり、$\omega^{2^{p-1}}=\omega^{(q+1)/2}=-1$である。両辺に$\bar\omega^{2^{p-2}}$を掛けると$\omega^{2^{p-2}}=-\bar\omega^{2^{p-2}}$となり、$X_q$で$s_{p-2}=0$である。$s_{p-2}$は整数なので$q\mid s_{p-2}$である。
  strategy: Write s_i in terms of ω = 2+√3 and work in Z/q[√3]; compare the order of ω with the unit group for sufficiency and use Frobenius for necessity.
  sketch:
  - 'derive: s_i = ω^(2^i)+ω̄^(2^i) by induction.'
  - 'setup: Work in the ring X_q = Z/q[T]/(T^2-3).'
  - 'contradiction: If M | s_(p-2) with least prime factor q and q^2 ≤ M, then ω has order 2^p, exceeding the unit group.'
  - 'derive: If q = M is prime, then 2 is a square and 3 is a nonsquare modulo q.'
  - 'derive: Frobenius gives (1+α)^(q+1) = -2, hence ω^(2^(p-1)) = -1.'
  - 'conclude: Multiplying by ω̄^(2^(p-2)) gives s_(p-2) = 0 in X_q, so M | s_(p-2).'
  openmath: (forall (p) (-> (and (in p N) (>= p 3)) (<-> (in (- (^ 2 p) 1) P) (dvd (- (^ 2 p) 1) (lucas_lehmer_seq (- p 2))))))
  hard_negative:
    statement: 初項を$s_0=3$に変えても、同じ漸化式で同じ判定ができる。
    reason: $s_0=3$なら$s_1=7$、$s_2=47$、$s_3=2207$である。$p=5$では$M=31$は素数だが、$2207\equiv 6\pmod{31}$なので割り切れない。
  target: |
    ∀ p : ℕ, 3 ≤ p → (Nat.Prime (2 ^ p - 1) ↔ ((2 ^ p - 1 : ℕ) : ℤ) ∣ LucasLehmer.s (p - 2))
  proof: |
    by
      intro p hp
      obtain ⟨r, rfl⟩ : ∃ r, p = r + 2 := ⟨p - 2, by omega⟩
      have e : LucasLehmer.LucasLehmerTest (r + 2) ↔ ((2 ^ (r + 2) - 1 : ℕ) : ℤ) ∣ LucasLehmer.s (r + 2 - 2) := by
        unfold LucasLehmer.LucasLehmerTest LucasLehmer.lucasLehmerResidue
        rw [LucasLehmer.sZMod_eq_s]
        exact CharP.intCast_eq_zero_iff (ZMod (2 ^ (r + 2) - 1)) (2 ^ (r + 2) - 1) _
      rw [← e]
      exact ⟨fun h => lucas_lehmer_necessity (r + 2) hp h, fun h => lucas_lehmer_sufficiency (r + 2) (by omega) h⟩
- id: fermat_pseudoprimes_infinite
  kind: textbook
  level: 3
  topic: 初等整数論・素数判定
  statement: フェルマーの小定理の逆は成り立たない。正の整数$b$と自然数$m$に対して、$m$以上の合成数$n$で$n\mid b^{n-1}-1$となるものが存在する。つまり各底$b$の擬素数は無限個ある。
  statement_en: The converse of Fermat's little theorem fails. For a positive integer b and a natural number m there is a composite number n ≥ m with n | b^(n-1)-1, so each base b has infinitely many pseudoprimes.
  assumptions:
  - $b$は正の整数
  - $m$は自然数
  quantifiers:
  - 任意の正の整数$b$と自然数$m$
  conclusion: $m\leq n$の合成数$n$で$n\mid b^{n-1}-1$となるものが存在する。
  answer: |
    $b$を正の整数、$m$を自然数とする。$b=1$なら$b^{n-1}-1=0$なので、$m$以上の任意の合成数でよい。$b\geq 2$とする。

    素数$p>2$を$p\nmid b(b^2-1)$かつ$p\geq m$となるようにとる。$n=\frac{b^{2p}-1}{b^2-1}$とおく。$n=A B$、$A=\frac{b^p-1}{b-1}$、$B=\frac{b^p+1}{b+1}$である。$A,B$は$p$が奇数なので整数であり、ともに$1$より大きい。よって$n$は合成数である。また$n=\sum_{i=0}^{p-1}b^{2i}\geq b^{2p-2}\geq 2^{2p-2}>p\geq m$である。

    $2p\mid n-1$を示す。$n-1=\sum_{i=1}^{p-1}b^{2i}$は偶数個の同じ偶奇の項の和なので偶数である。また$(b^2-1)(n-1)=b^{2p}-b^2$である。フェルマーの小定理より$b^{2p}\equiv b^2\pmod p$なので、$p\mid(b^2-1)(n-1)$である。$p\nmid b^2-1$より$p\mid n-1$である。$p$は奇数なので$2p\mid n-1$である。

    $n\mid b^{2p}-1$であり、$2p\mid n-1$なので$b^{2p}-1\mid b^{n-1}-1$である。よって$n\mid b^{n-1}-1$である。
  strategy: Use the explicit composite n = (b^(2p)-1)/(b^2-1) for a large prime p and show 2p | n-1.
  sketch:
  - 'case_split: For b = 1 any composite number works.'
  - 'construct: For b ≥ 2 pick a large prime p not dividing b(b^2-1) and set n = (b^(2p)-1)/(b^2-1).'
  - 'derive: n is the product of (b^p-1)/(b-1) and (b^p+1)/(b+1), so it is composite.'
  - 'derive: n-1 is even and divisible by p by Fermat''s little theorem.'
  - 'conclude: Since n | b^(2p)-1 and 2p | n-1, n divides b^(n-1)-1.'
  openmath: (forall (b m) (-> (and (in b N) (> b 0) (in m N)) (exists (n) (and (in n N) (<= m n) (> n 1) (notin n P) (dvd n (- (^ b (- n 1)) 1))))))
  hard_negative:
    statement: 合成数$n$には、$n$と互いに素な$b$で$n\nmid b^{n-1}-1$となるものがつねに存在する。
    reason: カーマイケル数がこれの反例である。$n=561=3\cdot 11\cdot 17$では$2,10,16$がすべて$560$を割るので、$\gcd(b,561)=1$なら$b^{560}\equiv 1\pmod{561}$である。
  target: |
    ∀ b m : ℕ, 1 ≤ b → ∃ n : ℕ, m ≤ n ∧ 1 < n ∧ ¬ Nat.Prime n ∧ n ∣ b ^ (n - 1) - 1
  proof: |
    by
      intro b m hb
      obtain ⟨n, ⟨h1, h2, h3⟩, h4⟩ := Nat.exists_infinite_pseudoprimes hb m
      exact ⟨n, h4, h3, h2, h1⟩
- id: korselt_criterion_sufficient
  kind: gap
  level: 3
  topic: 初等整数論・素数判定
  statement: コルセルトの判定法の十分性。正の整数$n$が平方因子をもたず、$n$のすべての素因数$p$で$(p-1)\mid(n-1)$ならば、$n$と互いに素なすべての自然数$a$で$a^{n-1}\equiv 1\pmod n$である。
  statement_en: The sufficiency part of Korselt's criterion. If a positive integer n is squarefree and (p-1) | (n-1) for every prime factor p of n, then a^(n-1) ≡ 1 modulo n for every natural number a coprime to n.
  assumptions:
  - $n$は平方因子をもたない正の整数
  - $n$のすべての素因数$p$で$(p-1)\mid(n-1)$
  - $a$は自然数で$\gcd(a,n)=1$
  quantifiers:
  - 上の$n$と$n$と互いに素な任意の自然数$a$
  conclusion: $a^{n-1}\equiv 1\pmod n$である。
  answer: |
    $n$を平方因子をもたない正の整数とし、そのすべての素因数$p$で$(p-1)\mid(n-1)$とする。$a$を$n$と互いに素な自然数とする。$n=1$なら法$1$で明らかである。$n\geq 2$とする。

    $n$の素因数$p$をとる。$\gcd(a,n)=1$より$p\nmid a$である。$n-1=(p-1)k$と書くと、フェルマーの小定理より$a^{n-1}=(a^{p-1})^k\equiv 1\pmod p$である。

    $n$は平方因子をもたないので、相異なる素数の積$n=p_1\cdots p_r$である。各$p_i$が$a^{n-1}-1$を割り切り、$p_i$は互いに素なので、積$n$も$a^{n-1}-1$を割り切る。よって$a^{n-1}\equiv 1\pmod n$である。
  strategy: Apply Fermat's little theorem at each prime factor and combine by coprimality.
  sketch:
  - 'derive: For each prime factor p, Fermat''s little theorem and (p-1) | (n-1) give a^(n-1) ≡ 1 modulo p.'
  - 'derive: Squarefreeness writes n as a product of distinct primes.'
  - 'conclude: Distinct primes dividing a^(n-1)-1 have their product dividing it.'
  openmath: (forall (n a) (-> (and (in n N) (> n 0) (squarefree n) (forall (p) (-> (and (in p P) (dvd p n)) (dvd (- p 1) (- n 1)))) (in a N) (= (gcd a n) 1)) (dvd n (- (^ a (- n 1)) 1))))
  hard_negative:
    statement: 平方因子の条件を外しても結論は成り立つ。
    reason: $n=9$なら素因数$3$で$2\mid 8$だが、$a=2$は$2^8=256\equiv 4\pmod 9$である。
  target: |
    ∀ n a : ℕ, 0 < n → Squarefree n → (∀ p : ℕ, Nat.Prime p → p ∣ n → (p - 1) ∣ (n - 1)) → Nat.Coprime a n → a ^ (n - 1) ≡ 1 [MOD n]
  proof: |
    by
      intro n a hn hs hd hc
      rcases Nat.eq_or_lt_of_le (Nat.succ_le_of_lt hn) with h1 | h1
      · rw [← h1]
        exact Nat.modEq_one
      have ha : a ≠ 0 := by
        rintro rfl
        rw [Nat.coprime_zero_left] at hc
        omega
      have hpos : 1 ≤ a ^ (n - 1) := Nat.one_le_pow _ _ (Nat.pos_of_ne_zero ha)
      have key : n ∣ a ^ (n - 1) - 1 := by
        have hprod := Nat.prod_primeFactors_of_squarefree hs
        have hd2 : ∏ p ∈ n.primeFactors, p ∣ a ^ (n - 1) - 1 := by
          apply Finset.prod_primes_dvd
          · intro p hp
            exact (Nat.prime_of_mem_primeFactors hp).prime
          · intro p hp
            have pp := Nat.prime_of_mem_primeFactors hp
            have pn := Nat.dvd_of_mem_primeFactors hp
            haveI := Fact.mk pp
            obtain ⟨k, hk⟩ := hd p pp pn
            have hna : (a : ZMod p) ≠ 0 := by
              intro e
              have h2 : p ∣ a := (ZMod.natCast_eq_zero_iff a p).1 e
              have := Nat.dvd_gcd h2 pn
              rw [hc] at this
              exact pp.one_lt.ne' (Nat.dvd_one.1 this)
            have e1 : (a : ZMod p) ^ (n - 1) = 1 := by
              rw [hk, pow_mul, ZMod.pow_card_sub_one_eq_one hna, one_pow]
            apply (ZMod.natCast_eq_zero_iff _ _).1
            rw [Nat.cast_sub hpos]
            push_cast
            rw [e1, sub_self]
        rwa [hprod] at hd2
      exact ((Nat.modEq_iff_dvd' hpos).2 key).symm
- id: primorial_le_four_pow
  kind: gap
  level: 3
  topic: 解析的整数論・チェビシェフの評価
  statement: 自然数$n$について、$n$以下の素数すべての積$n\#$は$4^n$以下である。
  statement_en: For a natural number n, the product n# of all primes not exceeding n is at most 4^n.
  assumptions:
  - $n$は自然数
  - $n\#=\prod_{p\leq n}p$（$p$は素数）
  quantifiers:
  - 任意の自然数$n$
  conclusion: $n\#\leq 4^n$である。
  answer: |
    自然数$n$について累積帰納法で$n\#\leq 4^n$を示す。$n=0,1$では$n\#=1$である。$n=2$では$2\leq 16$である。

    $n\geq 3$を偶数とする。$n$は素数でないので$n\#=(n-1)\#\leq 4^{n-1}\leq 4^n$である。

    $n=2k+1$（$k\geq 1$）とする。$k+1<p\leq 2k+1$を満たす素数$p$は$(2k+1)!$を割り切り、$k!\,(k+1)!$を割り切らない。よってそのような$p$の積は$\binom{2k+1}{k}$を割り切る。$\binom{2k+1}{k}=\binom{2k+1}{k+1}$はともに$(1+1)^{2k+1}$の展開に現れるので、$2\binom{2k+1}{k}\leq 2^{2k+1}$であり、$\binom{2k+1}{k}\leq 4^k$である。

    $k+1<n$なので帰納法の仮定より$(k+1)\#\leq 4^{k+1}$である。したがって$n\#\leq(k+1)\#\binom{2k+1}{k}\leq 4^{k+1}4^k=4^{2k+1}=4^n$である。
  strategy: Induct, using that the primes in (k+1, 2k+1] divide the binomial coefficient C(2k+1,k) ≤ 4^k.
  sketch:
  - 'case_split: Small n and even n ≥ 4 follow directly.'
  - 'derive: For n = 2k+1 the primes between k+1 and 2k+1 divide C(2k+1,k).'
  - 'derive: C(2k+1,k) ≤ 4^k because it appears twice in the expansion of 2^(2k+1).'
  - 'conclude: Combining with (k+1)# ≤ 4^(k+1) gives n# ≤ 4^n.'
  openmath: (forall (n) (-> (in n N) (<= (primorial n) (^ 4 n))))
  hard_negative:
    statement: 自然数$n$について$n\#\leq 2^n$である。
    reason: $n=5$なら$5\#=30$で、$2^5=32$なので成り立つが、$n=7$なら$7\#=210>128$である。
  target: |
    ∀ n : ℕ, primorial n ≤ 4 ^ n
  proof: |
    by
      intro n
      exact primorial_le_four_pow n
- id: chebyshev_psi_eq_log_lcm
  kind: textbook
  level: 3
  topic: 解析的整数論・チェビシェフの評価
  statement: 自然数$n$について、チェビシェフ関数$\psi(n)=\sum_{m\leq n}\Lambda(m)$は$\log\operatorname{lcm}(1,2,\dots,n)$に等しい。ここで$\Lambda$はフォン・マンゴルト関数である。
  statement_en: For a natural number n, the Chebyshev function ψ(n), the sum of Λ(m) over m ≤ n with Λ the von Mangoldt function, equals log lcm(1, 2, ..., n).
  assumptions:
  - $n$は自然数
  - $\Lambda(p^k)=\log p$（$p$は素数、$k\geq 1$）、その他の$m$で$\Lambda(m)=0$
  - $n=0$では$\operatorname{lcm}$を$1$とする
  quantifiers:
  - 任意の自然数$n$
  conclusion: $\psi(n)=\log\operatorname{lcm}(1,\dots,n)$である。
  answer: |
    $n$を自然数とする。$\Lambda$の定義より、$\psi(n)=\sum_{m\leq n}\Lambda(m)$は$p^k\leq n$（$k\geq 1$）を満たす素数べきにわたる$\log p$の和である。素数$p$を固定すると、$p^k\leq n$となる$k\geq 1$は$\lfloor\log_pn\rfloor$個ある。よって$\psi(n)=\sum_{p\leq n}\lfloor\log_pn\rfloor\log p$である。

    $L=\operatorname{lcm}(1,\dots,n)$とおく。$v_p(L)=\max_{1\leq m\leq n}v_p(m)$である。$p^k\leq n$となる最大の$k$は$\lfloor\log_pn\rfloor$であり、$m=p^k$で最大値に達するので、$v_p(L)=\lfloor\log_pn\rfloor$である。よって$L=\prod_{p\leq n}p^{\lfloor\log_pn\rfloor}$であり、$\log L=\psi(n)$である。
  strategy: Compute both sides as the sum of ⌊log_p n⌋ log p over primes p ≤ n.
  sketch:
  - 'derive: Each prime p contributes ⌊log_p n⌋ log p to ψ(n).'
  - 'derive: The exponent of p in the lcm is the largest k with p^k ≤ n.'
  - 'conclude: Taking logarithms of the prime factorization gives the same sum.'
  openmath: (forall (n) (-> (in n N) (= (chebyshev_psi n) (ln (lcm_upto n)))))
  hard_negative:
    statement: 自然数$n$について、$\psi(n)=\log(n\#)$である。
    reason: $n=4$なら$\psi(4)=2\log 2+\log 3=\log 12$だが、$\log(4\#)=\log 6$である。$\log(n\#)$は$\theta(n)$である。
  target: |
    ∀ n : ℕ, Chebyshev.psi (n : ℝ) = Real.log (((Finset.Icc 1 n).lcm id : ℕ) : ℝ)
  proof: |
    by
      intro n
      exact Chebyshev.psi_eq_log_lcmUpto n
- id: chebyshev_psi_lower_bound
  kind: gap
  level: 3
  topic: 解析的整数論・チェビシェフの評価
  statement: 自然数$n$について、$n\log 2-\log(n+1)\leq\psi(n)$である。
  statement_en: For a natural number n, n log 2 - log(n+1) ≤ ψ(n), where ψ is the Chebyshev function.
  assumptions:
  - $n$は自然数
  - $\psi(n)=\sum_{m\leq n}\Lambda(m)$
  quantifiers:
  - 任意の自然数$n$
  conclusion: $n\log 2-\log(n+1)\leq\psi(n)$である。
  answer: |
    $n$を自然数、$L=\operatorname{lcm}(1,\dots,n)$（$n=0$では$L=1$）とする。$\psi(n)=\log L$である。

    $0\leq k\leq n$について$\binom{n}{k}\mid L$を示す。素数$p$をとる。$k$と$n-k$を$p$進法で足すときの繰り上がりは、桁$i$で$p^i\leq n$となる範囲でしか起こらない。クンマーの定理より$v_p\binom{n}{k}\leq\lfloor\log_pn\rfloor=v_p(L)$である。よって$\binom{n}{k}\mid L$であり、$\binom{n}{k}\leq L$である。

    二項定理より$2^n=\sum_{k=0}^n\binom{n}{k}\leq(n+1)L$である。対数をとると$n\log 2\leq\log(n+1)+\log L=\log(n+1)+\psi(n)$である。
  strategy: All binomial coefficients C(n,k) divide lcm(1,...,n), and their sum is 2^n.
  sketch:
  - 'apply_theorem: Kummer''s theorem gives v_p(C(n,k)) ≤ ⌊log_p n⌋ = v_p(L).'
  - 'derive: Hence C(n,k) ≤ L for all k.'
  - 'derive: Summing gives 2^n ≤ (n+1)L.'
  - 'conclude: Taking logarithms and using ψ(n) = log L gives the bound.'
  openmath: (forall (n) (-> (in n N) (<= (- (* n (ln 2)) (ln (+ n 1))) (chebyshev_psi n))))
  hard_negative:
    statement: 自然数$n$について、$n\log 3\leq\psi(n)$である。
    reason: $n=1$なら$\psi(1)=0$だが、$\log 3>0$である。
  target: |
    ∀ n : ℕ, (n : ℝ) * Real.log 2 - Real.log ((n : ℝ) + 1) ≤ Chebyshev.psi (n : ℝ)
  proof: |
    by
      intro n
      exact Chebyshev.psi_ge n
- id: chebyshev_psi_minus_theta_bound
  kind: gap
  level: 3
  topic: 解析的整数論・チェビシェフの評価
  statement: 実数$x\geq 1$について、$|\psi(x)-\theta(x)|\leq 2\sqrt x\log x$である。ここで$\theta(x)=\sum_{p\leq x}\log p$、$\psi(x)=\sum_{m\leq x}\Lambda(m)$である。
  statement_en: For a real number x ≥ 1, |ψ(x)-θ(x)| ≤ 2√x log x, where θ(x) is the sum of log p over primes p ≤ x and ψ(x) is the sum of Λ(m) over m ≤ x.
  assumptions:
  - $x\geq 1$は実数
  - $\theta(x)=\sum_{p\leq x}\log p$
  - $\psi(x)=\sum_{m\leq x}\Lambda(m)$
  quantifiers:
  - 任意の実数$x\geq 1$
  conclusion: $|\psi(x)-\theta(x)|\leq 2\sqrt x\log x$である。
  answer: |
    $x\geq 1$を実数とする。$\psi(x)$は$p^k\leq x$（$p$は素数、$k\geq 1$）にわたる$\log p$の和であり、$\theta(x)$はその$k=1$の部分である。よって$\psi(x)-\theta(x)$は$k\geq 2$、$p^k\leq x$にわたる$\log p$の和であり、$0$以上である。

    $k\geq 2$、$p^k\leq x$なら$p\leq\sqrt x$である。素数$p\leq\sqrt x$を固定すると、$p^k\leq x$となる$k\geq 1$の個数は$\lfloor\log_px\rfloor$なので、$k\geq 2$の項の寄与は$\lfloor\log_px\rfloor\log p\leq\log x$以下である。

    素数$p\leq\sqrt x$の個数は$\sqrt x$以下である。したがって$0\leq\psi(x)-\theta(x)\leq\sqrt x\log x\leq 2\sqrt x\log x$である。最後の不等号は$x\geq 1$で$\log x\geq 0$だからである。
  strategy: The difference is the contribution of proper prime powers, which involve only primes up to √x.
  sketch:
  - 'derive: ψ(x)-θ(x) is the sum of log p over p^k ≤ x with k ≥ 2.'
  - 'derive: Such p satisfy p ≤ √x, and each contributes at most log x.'
  - 'conclude: There are at most √x such primes.'
  openmath: (forall (x) (-> (and (in x R) (>= x 1)) (<= (abs (- (chebyshev_psi x) (chebyshev_theta x))) (* 2 (root x 2) (ln x)))))
  hard_negative:
    statement: 実数$x\geq 1$について$\psi(x)=\theta(x)$である。
    reason: $x=4$なら$\psi(4)=\log 12$、$\theta(4)=\log 6$である。素数の真のべきの寄与がある。
  target: |
    ∀ x : ℝ, 1 ≤ x → |Chebyshev.psi x - Chebyshev.theta x| ≤ 2 * Real.sqrt x * Real.log x
  proof: |
    by
      intro x hx
      exact Chebyshev.abs_psi_sub_theta_le_sqrt_mul_log hx
- id: chebyshev_prime_counting_upper_bound
  kind: textbook
  level: 3
  topic: 解析的整数論・チェビシェフの評価
  statement: 任意の$\varepsilon>0$に対して、十分大きいすべての実数$x$で$\pi(x)\leq(\log 4+\varepsilon)\frac{x}{\log x}$である。既知として、$\theta(x)\leq x\log 4$を使ってよい。
  statement_en: For every ε > 0 and all sufficiently large real x, π(x) ≤ (log 4+ε)x/log x. The bound θ(x) ≤ x log 4 may be taken as known.
  assumptions:
  - $\varepsilon>0$
  - $\pi(x)$は$x$以下の素数の個数
  - $\theta(x)=\sum_{p\leq x}\log p\leq x\log 4$（$x\geq 0$）は既知とする
  quantifiers:
  - 任意の$\varepsilon>0$と十分大きい実数$x$
  conclusion: $\pi(x)\leq(\log 4+\varepsilon)x/\log x$である。
  answer: |
    $\varepsilon>0$とする。$0<\delta<1$を$\frac{\log 4}{1-\delta}<\log 4+\frac{\varepsilon}{2}$となるようにとる。$x>1$について$y=x^{1-\delta}$とおく。

    $y$より大きく$x$以下の素数$p$では$\log p>\log y=(1-\delta)\log x$である。よって$\theta(x)\geq(\pi(x)-\pi(y))(1-\delta)\log x$である。$\pi(y)\leq y$と$\theta(x)\leq x\log 4$より、
    $\pi(x)\leq y+\frac{\theta(x)}{(1-\delta)\log x}\leq x^{1-\delta}+\frac{\log 4}{1-\delta}\cdot\frac{x}{\log x}$である。

    $x^{-\delta}\log x\to 0$（$x\to\infty$）なので、十分大きい$x$で$x^{1-\delta}\leq\frac{\varepsilon}{2}\cdot\frac{x}{\log x}$である。これらを合わせて$\pi(x)\leq(\log 4+\varepsilon)\frac{x}{\log x}$を得る。
  strategy: Discard primes up to x^(1-δ) and bound the remaining ones through θ(x).
  sketch:
  - 'setup: Choose δ small so that log 4/(1-δ) < log 4+ε/2, and put y = x^(1-δ).'
  - 'derive: Primes in (y,x] have log p > (1-δ) log x, so π(x)-π(y) ≤ θ(x)/((1-δ) log x).'
  - 'apply_theorem: Use θ(x) ≤ x log 4 and π(y) ≤ y.'
  - 'conclude: The term x^(1-δ) is at most (ε/2)x/log x for large x.'
  openmath: (forall (e) (-> (and (in e R) (> e 0)) (exists (a) (and (in a R) (forall (x) (-> (and (in x R) (>= x a)) (<= (prime_counting x) (/ (* (+ (ln 4) e) x) (ln x)))))))))
  hard_negative:
    statement: 十分大きい$x$で$\pi(x)\leq\frac{x}{2\log x}$である。
    reason: チェビシェフの下からの評価$\psi(n)\geq n\log 2-\log(n+1)$と$\psi(x)\leq\pi(x)\log x$より、$\pi(n)\geq\frac{n\log 2-\log(n+1)}{\log n}$である。$\log 2>1/2$なので、十分大きい$n$で$\pi(n)>\frac{n}{2\log n}$である。
  target: |
    ∀ ε : ℝ, 0 < ε → ∀ᶠ x : ℝ in Filter.atTop, (Nat.primeCounting ⌊x⌋₊ : ℝ) ≤ (Real.log 4 + ε) * x / Real.log x
  proof: |
    by
      intro ε hε
      exact Chebyshev.eventually_primeCounting_le hε
- id: von_mangoldt_sum_over_divisors
  kind: textbook
  level: 3
  topic: 解析的整数論・フォン・マンゴルト関数
  statement: 正の整数$n$について、フォン・マンゴルト関数は$\sum_{d\mid n}\Lambda(d)=\log n$を満たす。さらに$\sum_{d\mid n}\mu(d)\log d=-\Lambda(n)$である。
  statement_en: For a positive integer n, the von Mangoldt function satisfies that the sum of Λ(d) over d | n equals log n, and moreover the sum of μ(d) log d over d | n equals -Λ(n).
  assumptions:
  - $n$は正の整数
  - $\Lambda(p^k)=\log p$（$p$は素数、$k\geq 1$）、その他で$\Lambda=0$
  quantifiers:
  - 任意の正の整数$n$
  conclusion: $\sum_{d\mid n}\Lambda(d)=\log n$、$\sum_{d\mid n}\mu(d)\log d=-\Lambda(n)$である。
  answer: |
    $n$を正の整数とし、$n=\prod_jp_j^{e_j}$と素因数分解する。$n$の約数のうち$\Lambda$が零でないものは$p_j^k$（$1\leq k\leq e_j$）だけである。よって$\sum_{d\mid n}\Lambda(d)=\sum_j\sum_{k=1}^{e_j}\log p_j=\sum_je_j\log p_j=\log n$である。

    第二の等式を示す。メビウスの反転公式より、$\sum_{ab=n}\mu(a)\log b=\Lambda(n)$である。$\log b=\log n-\log a$なので、$\sum_{a\mid n}\mu(a)\log(n/a)=\log n\sum_{a\mid n}\mu(a)-\sum_{a\mid n}\mu(a)\log a$である。$n=1$なら$\log n=0$であり、$n\geq 2$なら$\sum_{a\mid n}\mu(a)=0$なので、第1項はどちらの場合も$0$である。したがって$\sum_{a\mid n}\mu(a)\log a=-\Lambda(n)$である。
  strategy: Group the divisors by prime powers, then apply Möbius inversion and split log(n/a).
  sketch:
  - 'derive: Only prime power divisors contribute, and p_j contributes e_j log p_j.'
  - 'conclude: The sum equals log n.'
  - 'apply_theorem: Möbius inversion gives Λ(n) as the sum of μ(a) log(n/a).'
  - 'derive: The term log n times the sum of μ(a) vanishes in all cases.'
  openmath: (forall (n) (-> (and (in n N) (> n 0)) (and (= (sum_over_divisors n (lambda (d) (von_mangoldt d))) (ln n)) (= (sum_over_divisors n (lambda (d) (* (moebius d) (ln d)))) (neg (von_mangoldt n))))))
  hard_negative:
    statement: すべての正の整数$n$で$\Lambda(n)=\log n$である。
    reason: $n=6$は素数べきでないので$\Lambda(6)=0$である。また$\Lambda(4)=\log 2\neq\log 4$である。
  target: |
    ∀ n : ℕ, 0 < n → ∑ d ∈ n.divisors, ArithmeticFunction.vonMangoldt d = Real.log n ∧ ∑ d ∈ n.divisors, (ArithmeticFunction.moebius d : ℝ) * Real.log d = -ArithmeticFunction.vonMangoldt n
  proof: |
    by
      intro n _
      exact ⟨ArithmeticFunction.vonMangoldt_sum, ArithmeticFunction.sum_moebius_mul_log_eq⟩
- id: log_factorial_von_mangoldt_formula
  kind: gap
  level: 3
  topic: 解析的整数論・フォン・マンゴルト関数
  statement: 自然数$N$について、$\log N!=\sum_{d=1}^N\Lambda(d)\lfloor N/d\rfloor$である。
  statement_en: For a natural number N, log N! equals the sum of Λ(d)⌊N/d⌋ for 1 ≤ d ≤ N.
  assumptions:
  - $N$は自然数
  quantifiers:
  - 任意の自然数$N$
  conclusion: $\log N!=\sum_{d=1}^N\Lambda(d)\lfloor N/d\rfloor$である。
  answer: |
    $N$を自然数とする。$\log N!=\sum_{n=1}^N\log n$である。正の整数$n$について$\log n=\sum_{d\mid n}\Lambda(d)$である。よって$\log N!=\sum_{n=1}^N\sum_{d\mid n}\Lambda(d)$である。

    和の順序を交換する。$d$を固定すると、$d\mid n$、$1\leq n\leq N$を満たす$n$は$\lfloor N/d\rfloor$個である。したがって$\log N!=\sum_{d=1}^N\Lambda(d)\lfloor N/d\rfloor$である。
  strategy: Sum the identity log n = Σ_{d|n} Λ(d) over n ≤ N and exchange the order.
  sketch:
  - 'derive: log N! is the sum of log n for n ≤ N.'
  - 'apply_theorem: log n is the sum of Λ(d) over d | n.'
  - 'conclude: Each d occurs for ⌊N/d⌋ values of n.'
  openmath: (forall (M) (-> (in M N) (= (ln (factorial M)) (sum (integer_range 1 M) (lambda (d) (* (von_mangoldt d) (floor (/ M d))))))))
  hard_negative:
    statement: $\log N!=\sum_{d=1}^N\Lambda(d)$である。
    reason: $N=2$なら左辺は$\log 2$で右辺も$\log 2$だが、$N=3$なら左辺は$\log 6$、右辺も$\log 6$であり、$N=4$では左辺は$\log 24$、右辺は$\log 12$である。
  target: |
    ∀ M : ℕ, Real.log (M.factorial : ℝ) = ∑ d ∈ Finset.Ioc 0 M, ArithmeticFunction.vonMangoldt d * ((M / d : ℕ) : ℝ)
  proof: |
    by
      intro M
      have h := ArithmeticFunction.sum_Ioc_mul_zeta_eq_sum (R := ℝ) ArithmeticFunction.vonMangoldt M
      rw [ArithmeticFunction.vonMangoldt_mul_zeta] at h
      rw [← h]
      induction M with
      | zero => simp
      | succ k ih =>
        have hk := ArithmeticFunction.sum_Ioc_mul_zeta_eq_sum (R := ℝ) ArithmeticFunction.vonMangoldt k
        rw [ArithmeticFunction.vonMangoldt_mul_zeta] at hk
        rw [Finset.sum_Ioc_succ_top (Nat.zero_le k), ← ih hk, Nat.factorial_succ, Nat.cast_mul, Real.log_mul (by positivity) (by positivity), ArithmeticFunction.log_apply, add_comm]
- id: euler_product_completely_multiplicative
  kind: textbook
  level: 3
  topic: 解析的整数論・オイラー積
  statement: 完備なノルム体$F$に値をとる$f:\mathbb{N}\to F$が完全乗法的で$f(0)=0$、$f(1)=1$であり、$\sum_n\|f(n)\|<\infty$であるとする。このとき無限積$\prod_p(1-f(p))^{-1}$は素数全体にわたって無条件に収束し、値は$\sum_nf(n)$である。
  statement_en: Let f from N to a complete normed field F be completely multiplicative with f(0) = 0, f(1) = 1 and the series of ‖f(n)‖ convergent. Then the product of (1-f(p))^(-1) over all primes converges unconditionally to the sum of f(n).
  assumptions:
  - $F$は完備なノルム体
  - $f$は完全乗法的で$f(0)=0$、$f(1)=1$
  - $\sum_n\|f(n)\|<\infty$
  quantifiers:
  - 任意の完備なノルム体$F$と上の$f$
  conclusion: $\prod_p(1-f(p))^{-1}$は無条件に収束して$\sum_nf(n)$に等しい。
  answer: |
    $F,f$を仮定のとおりとする。素数$p$について$\|f(p)\|<1$である。$\|f(p)\|\geq 1$なら$\|f(p^k)\|=\|f(p)\|^k\geq 1$となり、級数の収束に反するからである。よって$(1-f(p))^{-1}=\sum_{k\geq 0}f(p^k)$は絶対収束する。

    素数の有限集合$S$をとる。$S$の素数だけを素因数にもつ正の整数の集合を$M_S$とする。絶対収束する級数の積を展開し、素因数分解の一意性と完全乗法性を使うと、$\prod_{p\in S}(1-f(p))^{-1}=\sum_{m\in M_S}f(m)$である。

    $\varepsilon>0$とする。$\sum_{n\geq N}\|f(n)\|<\varepsilon$となる$N$をとる。$S$が$N$未満の素数をすべて含むなら、$N$未満の正の整数はすべて$M_S$に属する。$f(0)=0$なので、$\left\|\sum_nf(n)-\sum_{m\in M_S}f(m)\right\|\leq\sum_{n\geq N}\|f(n)\|<\varepsilon$である。

    したがって、素数の有限集合の包含に関する有向族の極限として、$\prod_{p\in S}(1-f(p))^{-1}$は$\sum_nf(n)$に収束する。
  strategy: Expand the finite products as sums over numbers with prime factors in S and compare with the full series.
  sketch:
  - 'derive: Convergence forces ‖f(p)‖ < 1, so (1-f(p))^(-1) is a geometric series.'
  - 'derive: Unique factorization turns the finite product over S into the sum over numbers composed of primes in S.'
  - 'setup: Given ε choose N with tail below ε.'
  - 'conclude: Any S containing the primes below N gives a product within ε of the sum.'
  openmath: (forall (F f) (-> (and (complete_normed_field F) (completely_multiplicative f F) (series_abs_summable f)) (prime_product_has_value (lambda (p) (inv_of (- 1 (fn_value f p)))) (series_sum f))))
  hard_negative:
    statement: 乗法的（完全乗法的とは限らない）$f$についても、同じ仮定で$\prod_p(1-f(p))^{-1}=\sum_nf(n)$である。
    reason: 実数値の乗法的関数$f(n)=\mu(n)n^{-2}$を考える。$\sum_nf(n)=\prod_p(1-p^{-2})\approx 0.608$であり、$\prod_p(1-f(p))^{-1}=\prod_p(1+p^{-2})^{-1}\approx 0.658$とは一致しない。乗法的な場合の因子は$\sum_kf(p^k)$である。
  target: |
    ∀ (F : Type*) [NormedField F] [CompleteSpace F] (f : ℕ →*₀ F), Summable (fun n => ‖f n‖) → HasProd (fun p : Nat.Primes => (1 - f p)⁻¹) (∑' n, f n)
  proof: |
    by
      intro F _ _ f hsum
      exact EulerProduct.eulerProduct_completely_multiplicative_hasProd hsum
- id: riemann_zeta_euler_product
  kind: named
  level: 3
  topic: 解析的整数論・オイラー積
  statement: リーマンゼータ関数のオイラー積。$\operatorname{Re}s>1$を満たす複素数$s$について、$\prod_p(1-p^{-s})^{-1}$は素数全体にわたって無条件に収束し、値は$\zeta(s)=\sum_{n\geq 1}n^{-s}$である。
  statement_en: The Euler product of the Riemann zeta function. For a complex number s with Re s > 1, the product of (1-p^(-s))^(-1) over all primes converges unconditionally to ζ(s), the sum of n^(-s) for n ≥ 1.
  assumptions:
  - $s$は複素数で$\operatorname{Re}s>1$
  quantifiers:
  - $\operatorname{Re}s>1$を満たす任意の複素数$s$
  conclusion: $\prod_p(1-p^{-s})^{-1}=\zeta(s)$である（無条件収束）。
  answer: |
    $s$を$\operatorname{Re}s>1$を満たす複素数とする。$f(0)=0$、$n\geq 1$で$f(n)=n^{-s}$とおく。$f(1)=1$であり、正の整数$m,n$について$(mn)^{-s}=m^{-s}n^{-s}$なので、$f$は完全乗法的である。

    $\|f(n)\|=n^{-\operatorname{Re}s}$であり、$\operatorname{Re}s>1$より$\sum_nn^{-\operatorname{Re}s}<\infty$である。完備なノルム体$\mathbb{C}$に値をとる完全乗法的関数についてのオイラー積の定理を適用すると、$\prod_p(1-f(p))^{-1}$は無条件に収束して$\sum_nf(n)=\zeta(s)$に等しい。$f(p)=p^{-s}$である。
  strategy: Apply the general Euler product theorem to the completely multiplicative function n to n^(-s).
  sketch:
  - 'setup: Define f(n) = n^(-s) for n ≥ 1 and f(0) = 0.'
  - 'derive: f is completely multiplicative and absolutely summable for Re s > 1.'
  - 'apply_theorem: The general Euler product theorem gives the claim.'
  openmath: (forall (s) (-> (and (in s C) (> (real_part s) 1)) (prime_product_has_value (lambda (p) (inv_of (- 1 (^ p (neg s))))) (riemann_zeta s))))
  hard_negative:
    statement: $\operatorname{Re}s>0$なら$\zeta(s)=\prod_p(1-p^{-s})^{-1}$であり、積は収束する。
    reason: $s=1$では$\prod_{p\leq x}(1-1/p)^{-1}\geq\sum_{n\leq x}1/n\to\infty$なので積は発散する。
  target: |
    ∀ s : ℂ, 1 < s.re → HasProd (fun p : Nat.Primes => (1 - ((p : ℕ) : ℂ) ^ (-s))⁻¹) (riemannZeta s)
  proof: |
    by
      intro s hs
      exact riemannZeta_eulerProduct_hasProd hs
- id: sum_of_prime_reciprocals_diverges
  kind: textbook
  level: 3
  topic: 解析的整数論・素数の逆数和
  statement: 素数全体にわたる$\sum_p1/p$は発散する。
  statement_en: The series of 1/p over all primes diverges.
  assumptions:
  - $p$は素数全体を動く
  quantifiers:
  - なし
  conclusion: $\sum_p1/p$は収束しない。
  answer: |
    $\sum_p1/p$が収束すると仮定する。$\sum_{p\geq k}1/p<1/2$となる正の整数$k$をとる。$r$を$k$未満の素数の個数とし、$M=4^{r+1}$とおく。$\{1,\dots,M\}$を二つに分ける。$A$を$k$以上の素因数をもつ数の集合、$B$をすべての素因数が$k$未満である数の集合とする。

    $k$以上の素数$p$の倍数で$M$以下のものは$\lfloor M/p\rfloor$個なので、$|A|\leq\sum_{p\geq k}M/p<M/2$である。

    $B$の元$n$は$n=sm^2$（$s$は平方因子をもたない）と書ける。$s$は$k$未満の素数の部分集合の積なので高々$2^r$通りである。$m\leq\sqrt M=2^{r+1}$である。よって$|B|\leq 2^r\cdot 2^{r+1}=M/2$である。

    したがって$M=|A|+|B|<M/2+M/2=M$となり矛盾する。よって$\sum_p1/p$は発散する。
  strategy: Erdős's argument. Count numbers up to M by whether they have a large prime factor.
  sketch:
  - 'setup: Assume convergence and take k with the tail of the series below 1/2; let M = 4^(r+1), where r counts primes below k.'
  - 'derive: Numbers up to M with a prime factor at least k number fewer than M/2.'
  - 'derive: Numbers with all prime factors below k are s m^2 with at most 2^r choices of s and 2^(r+1) of m.'
  - 'contradiction: The two counts add up to less than M.'
  openmath: (not (series_summable_fn (lambda (p) (prime_indicator_reciprocal p))))
  hard_negative:
    statement: $\sum_p1/p^2$も発散する。
    reason: $\sum_p1/p^2\leq\sum_{n\geq 1}1/n^2<\infty$である。発散は指数$1$の場合に起こる。
  target: |
    ¬ Summable (fun p : Nat.Primes => (1 / (p : ℕ) : ℝ))
  proof: |
    by
      exact Nat.Primes.not_summable_one_div
- id: prime_power_series_summable_iff
  kind: gap
  level: 3
  topic: 解析的整数論・素数の逆数和
  statement: 実数$r$について、素数全体にわたる級数$\sum_pp^r$が収束することと$r<-1$は同値である。
  statement_en: For a real number r, the series of p^r over all primes converges if and only if r < -1.
  assumptions:
  - $r$は実数
  quantifiers:
  - 任意の実数$r$
  conclusion: $\sum_pp^r$の収束と$r<-1$は同値である。
  answer: |
    $r$を実数とする。

    $r<-1$なら、$\sum_pp^r\leq\sum_{n\geq 1}n^r<\infty$である。項は正なので、$\sum_pp^r$は収束する。

    $r\geq-1$とする。素数$p\geq 2$について$p^r\geq p^{-1}$である。素数の逆数の和$\sum_p1/p$は発散するので、比較判定法より$\sum_pp^r$も発散する。
  strategy: Compare with the series of n^r for r < -1 and with prime reciprocals for r ≥ -1.
  sketch:
  - 'derive: For r < -1 the series is dominated by the convergent series of n^r.'
  - 'derive: For r ≥ -1 each term is at least 1/p.'
  - 'conclude: Divergence of the prime reciprocals gives divergence.'
  openmath: (forall (r) (-> (in r R) (<-> (series_summable_fn (lambda (p) (prime_indicator_power p r))) (< r (neg 1)))))
  hard_negative:
    statement: 自然数全体にわたる$\sum_nn^r$が収束することと$r<-1$は同値であり、素数に限ると$r<-1/2$で収束する。
    reason: $r=-3/4$なら$p^r\geq 1/p$なので、素数に限っても発散する。素数に限っても臨界指数は$-1$である。
  target: |
    ∀ r : ℝ, Summable (fun p : Nat.Primes => ((p : ℕ) : ℝ) ^ r) ↔ r < -1
  proof: |
    by
      intro r
      exact Nat.Primes.summable_rpow
- id: dirichlet_character_support_and_norm
  kind: gap
  level: 3
  topic: 解析的整数論・ディリクレ指標
  statement: 正の整数$N$を法とする複素数値のディリクレ指標$\chi$と整数$a$について、$\chi(a)\neq 0$であることと$\gcd(a,N)=1$は同値であり、$|\chi(a)|\leq 1$である。
  statement_en: For a complex Dirichlet character χ modulo a positive integer N and an integer a, χ(a) ≠ 0 if and only if gcd(a,N) = 1, and |χ(a)| ≤ 1.
  assumptions:
  - $N$は正の整数
  - $\chi$は法$N$の複素数値ディリクレ指標
  - $a$は整数
  quantifiers:
  - 任意の正の整数$N$、法$N$の指標$\chi$、整数$a$
  conclusion: $\chi(a)\neq 0$と$\gcd(a,N)=1$は同値であり、$|\chi(a)|\leq 1$である。
  answer: |
    $N$を正の整数、$\chi$を法$N$のディリクレ指標、$a$を整数とする。$\chi$は$\mathbb{Z}/N\mathbb{Z}$上の乗法的写像で$\chi(1)=1$であり、単元でない元で$0$をとるものである。

    $\gcd(a,N)=1$なら$a$は単元である。逆元$b$をとると$\chi(a)\chi(b)=\chi(1)=1$なので$\chi(a)\neq 0$である。$\gcd(a,N)\neq 1$なら$a$は単元でないので、定義より$\chi(a)=0$である。

    大きさを示す。$\chi(a)=0$なら明らかである。$a$が単元のとき、オイラーの定理より$a^{\varphi(N)}=1$なので$\chi(a)^{\varphi(N)}=1$である。よって$|\chi(a)|=1$である。
  strategy: Units have inverse values; units also have finite order, so their values are roots of unity.
  sketch:
  - 'derive: For a unit a, χ(a)χ(a^(-1)) = 1 shows χ(a) ≠ 0.'
  - 'derive: Non-units are sent to 0 by definition.'
  - 'conclude: Euler''s theorem makes χ(a) a root of unity for units a, so |χ(a)| ≤ 1.'
  openmath: (forall (M c a) (-> (and (in M N) (> M 0) (dirichlet_character c M) (in a Z)) (and (<-> (!= (fn_value c a) 0) (= (gcd a M) 1)) (<= (abs (fn_value c a)) 1))))
  hard_negative:
    statement: 法$N$の指標$\chi$について、すべての$a$で$|\chi(a)|=1$である。
    reason: $N=2$の指標は$\chi(2)=0$である。単元でない剰余では値は$0$である。
  target: |
    ∀ (N : ℕ) [NeZero N] (χ : DirichletCharacter ℂ N) (a : ℤ), (χ (a : ZMod N) ≠ 0 ↔ IsCoprime a (N : ℤ)) ∧ ‖χ (a : ZMod N)‖ ≤ 1
  proof: |
    by
      intro N _ χ a
      exact ⟨DirichletCharacter.apply_ne_zero_iff χ a, χ.norm_le_one _⟩
- id: dirichlet_character_sum_over_residues
  kind: gap
  level: 3
  topic: 解析的整数論・ディリクレ指標
  statement: 正の整数$N$を法とする複素数値のディリクレ指標$\chi$が単位指標でないならば、$\sum_{a\bmod N}\chi(a)=0$である。
  statement_en: If a complex Dirichlet character χ modulo a positive integer N is not the trivial character, then the sum of χ(a) over all residues a modulo N is 0.
  assumptions:
  - $N$は正の整数
  - $\chi$は法$N$の複素数値ディリクレ指標で、単位指標でない
  quantifiers:
  - 任意の正の整数$N$と単位指標でない法$N$の指標$\chi$
  conclusion: $\sum_{a\bmod N}\chi(a)=0$である。
  answer: |
    $N$を正の整数、$\chi$を単位指標でない法$N$の指標とし、$S=\sum_{a\bmod N}\chi(a)$とする。$\chi$は単位指標でないので、単元$b$で$\chi(b)\neq 1$となるものがある。

    $a\mapsto ba$は$\mathbb{Z}/N\mathbb{Z}$の全単射である。よって$S=\sum_a\chi(ba)=\chi(b)\sum_a\chi(a)=\chi(b)S$である。したがって$(1-\chi(b))S=0$であり、$\chi(b)\neq 1$より$S=0$である。
  strategy: Multiply by a unit where χ differs from 1, which permutes the residues.
  sketch:
  - 'setup: Choose a unit b with χ(b) ≠ 1.'
  - 'derive: Translation by b permutes the residues, so S = χ(b)S.'
  - 'conclude: Hence S = 0.'
  openmath: (forall (M c) (-> (and (in M N) (> M 0) (dirichlet_character c M) (!= c (dirichlet_trivial_character M))) (= (sum (integer_range 0 (- M 1)) (lambda (a) (fn_value c a))) 0)))
  hard_negative:
    statement: すべての法$N$の指標$\chi$について$\sum_{a\bmod N}\chi(a)=0$である。
    reason: 単位指標では和は$\varphi(N)$であり、$N\geq 1$で正である。
  target: |
    ∀ (N : ℕ) [NeZero N] (χ : DirichletCharacter ℂ N), χ ≠ 1 → ∑ a : ZMod N, χ a = 0
  proof: |
    by
      intro N _ χ h
      exact MulChar.sum_eq_zero_of_ne_one h
- id: dirichlet_character_orthogonality_over_characters
  kind: textbook
  level: 3
  topic: 解析的整数論・ディリクレ指標
  statement: 正の整数$N$と$a,b\in\mathbb{Z}/N\mathbb{Z}$（$a$は単元）について、法$N$の複素数値ディリクレ指標すべてにわたる和$\sum_\chi\chi(a^{-1})\chi(b)$は、$a=b$なら$\varphi(N)$、そうでなければ$0$である。既知として、有限アーベル群の指標の個数は群の位数に等しく、指標は単位元以外の元を分離することを使ってよい。
  statement_en: For a positive integer N and a, b in Z/NZ with a a unit, the sum of χ(a^(-1))χ(b) over all complex Dirichlet characters χ modulo N is φ(N) if a = b and 0 otherwise. It may be taken as known that a finite abelian group has as many characters as elements and that characters separate non-identity elements.
  assumptions:
  - $N$は正の整数
  - $a,b\in\mathbb{Z}/N\mathbb{Z}$、$a$は単元
  - 有限アーベル群の指標の個数と分離性は既知とする
  quantifiers:
  - 任意の正の整数$N$と$a,b$
  conclusion: 和は$a=b$なら$\varphi(N)$、それ以外なら$0$である。
  answer: |
    $N$を正の整数、$a,b\in\mathbb{Z}/N\mathbb{Z}$、$a$を単元とする。$G=(\mathbb{Z}/N\mathbb{Z})^\times$とすると、法$N$のディリクレ指標は$G$の指標と一対一に対応する。$c=a^{-1}b$とおくと$\chi(a^{-1})\chi(b)=\chi(c)$である。

    $b$が単元でないとき、$c$も単元でなく、すべての$\chi$で$\chi(c)=0$である。$a=b$は起こらないので結論は成り立つ。

    $b$が単元とする。$a=b$なら$c=1$であり、和は指標の個数$|G|=\varphi(N)$である。$a\neq b$なら$c\neq 1$である。分離性より$\psi(c)\neq 1$となる指標$\psi$がある。$\chi\mapsto\psi\chi$は指標全体の全単射なので、$T=\sum_\chi\chi(c)$は$T=\sum_\chi(\psi\chi)(c)=\psi(c)T$を満たす。よって$T=0$である。
  strategy: Reduce to the value of the sum at c = a^(-1)b and translate by a separating character.
  sketch:
  - 'setup: Put c = a^(-1)b, so the summand is χ(c).'
  - 'case_split: If b is not a unit, every term vanishes.'
  - 'derive: If c = 1, the sum counts the φ(N) characters.'
  - 'derive: If c ≠ 1, translation by a character ψ with ψ(c) ≠ 1 gives T = ψ(c)T.'
  - 'conclude: Hence T = 0.'
  openmath: (forall (M a b) (-> (and (in M N) (> M 0) (in a Z) (in b Z) (= (gcd a M) 1)) (and (-> (dvd M (- a b)) (= (dirichlet_character_sum M a b) (euler_phi M))) (-> (not (dvd M (- a b))) (= (dirichlet_character_sum M a b) 0)))))
  hard_negative:
    statement: $a$が単元でなくても、$a=b$なら和は$\varphi(N)$である。
    reason: $N=2$、$a=b=0$とすると、$\chi(0)=0$なので和は$0$であり、$\varphi(2)=1$ではない。
  target: |
    ∀ (N : ℕ) [NeZero N] (a b : ZMod N), IsUnit a → ∑ χ : DirichletCharacter ℂ N, χ a⁻¹ * χ b = if a = b then (Nat.totient N : ℂ) else 0
  proof: |
    by
      intro N _ a b ha
      exact DirichletCharacter.sum_char_inv_mul_char_eq ℂ ha b
- id: dirichlet_l_series_euler_product
  kind: textbook
  level: 4
  topic: 解析的整数論・ディリクレ L関数
  statement: 正の整数$N$を法とする複素数値のディリクレ指標$\chi$と$\operatorname{Re}s>1$を満たす複素数$s$について、$L(s,\chi)=\sum_{n\geq 1}\chi(n)n^{-s}$は絶対収束し、$\prod_p(1-\chi(p)p^{-s})^{-1}$は素数全体にわたって無条件に収束して$L(s,\chi)$に等しい。
  statement_en: For a complex Dirichlet character χ modulo a positive integer N and a complex s with Re s > 1, the series L(s,χ), the sum of χ(n)n^(-s) for n ≥ 1, converges absolutely, and the product of (1-χ(p)p^(-s))^(-1) over all primes converges unconditionally to L(s,χ).
  assumptions:
  - $N$は正の整数
  - $\chi$は法$N$の複素数値ディリクレ指標
  - $s$は複素数で$\operatorname{Re}s>1$
  quantifiers:
  - 任意の$N,\chi$と$\operatorname{Re}s>1$を満たす$s$
  conclusion: 級数は絶対収束し、オイラー積は無条件に収束して級数の和に等しい。
  answer: |
    $N$を正の整数、$\chi$を法$N$の指標、$s$を$\operatorname{Re}s>1$を満たす複素数とする。$f(0)=0$、$n\geq 1$で$f(n)=\chi(n)n^{-s}$とおく。

    $|\chi(n)|\leq 1$なので$\|f(n)\|\leq n^{-\operatorname{Re}s}$であり、$\operatorname{Re}s>1$より$\sum_n\|f(n)\|<\infty$である。これが級数の絶対収束である。

    $\chi$は完全乗法的で、$(mn)^{-s}=m^{-s}n^{-s}$なので、$f$は完全乗法的である。$f(1)=1$である。完全乗法的関数についてのオイラー積の定理より、$\prod_p(1-f(p))^{-1}$は無条件に収束して$\sum_nf(n)=L(s,\chi)$に等しい。$f(p)=\chi(p)p^{-s}$である。
  strategy: Apply the general Euler product theorem to χ(n)n^(-s).
  sketch:
  - 'derive: |χ(n)| ≤ 1 gives absolute convergence for Re s > 1.'
  - 'derive: n to χ(n)n^(-s) is completely multiplicative.'
  - 'apply_theorem: The general Euler product theorem gives the product formula.'
  openmath: (forall (M c s) (-> (and (in M N) (> M 0) (dirichlet_character c M) (in s C) (> (real_part s) 1)) (and (dirichlet_series_abs_summable c s) (prime_product_has_value (lambda (p) (inv_of (- 1 (* (fn_value c p) (^ p (neg s)))))) (dirichlet_l_series c s)))))
  hard_negative:
    statement: $\operatorname{Re}s>1$なら、$L(s,\chi)=\prod_p(1-p^{-s})^{-1}$である。
    reason: $\chi$を法$3$の非自明な指標、$s=2$とする。左辺の因子は$p=2$で$(1+2^{-2})^{-1}$、右辺は$(1-2^{-2})^{-1}$である。$L(2,\chi)<1$である一方、右辺は$\zeta(2)>1$である。
  target: |
    ∀ (N : ℕ) (χ : DirichletCharacter ℂ N) (s : ℂ), 0 < N → 1 < s.re → LSeriesSummable (fun n : ℕ => χ (n : ZMod N)) s ∧ HasProd (fun p : Nat.Primes => (1 - χ ((p : ℕ) : ZMod N) * ((p : ℕ) : ℂ) ^ (-s))⁻¹) (LSeries (fun n : ℕ => χ (n : ZMod N)) s)
  proof: |
    by
      intro N χ s _ hs
      exact ⟨DirichletCharacter.LSeriesSummable_of_one_lt_re χ hs, DirichletCharacter.LSeries_eulerProduct_hasProd χ hs⟩
- id: dirichlet_l_function_trivial_character
  kind: gap
  level: 4
  topic: 解析的整数論・ディリクレ L関数
  statement: 正の整数$N$と$s\neq 1$を満たす複素数$s$について、法$N$の単位指標$\chi_0$の$L$関数は$L(s,\chi_0)=\zeta(s)\prod_{p\mid N}(1-p^{-s})$を満たす。ここで$L$関数と$\zeta$は解析接続されたものである。
  statement_en: For a positive integer N and a complex number s ≠ 1, the L-function of the trivial character χ_0 modulo N satisfies L(s,χ_0) = ζ(s) times the product of (1-p^(-s)) over p | N. Here L and ζ denote the analytic continuations.
  assumptions:
  - $N$は正の整数
  - $s\neq 1$は複素数
  - $L(s,\chi_0)$と$\zeta(s)$は解析接続された関数
  quantifiers:
  - 任意の正の整数$N$と複素数$s\neq 1$
  conclusion: $L(s,\chi_0)=\zeta(s)\prod_{p\mid N}(1-p^{-s})$である。
  answer: |
    $N$を正の整数とする。$\chi_0(n)$は$\gcd(n,N)=1$なら$1$、それ以外なら$0$である。

    $\operatorname{Re}s>1$とする。オイラー積より$L(s,\chi_0)=\prod_{p\nmid N}(1-p^{-s})^{-1}$、$\zeta(s)=\prod_p(1-p^{-s})^{-1}$である。よって$L(s,\chi_0)=\zeta(s)\prod_{p\mid N}(1-p^{-s})$である。

    両辺は$\mathbb{C}\setminus\{1\}$で正則である。$\mathbb{C}\setminus\{1\}$は連結であり、両辺は開集合$\operatorname{Re}s>1$で一致する。一致の定理より$\mathbb{C}\setminus\{1\}$全体で一致する。
  strategy: Compare Euler products for Re s > 1 and extend by the identity theorem.
  sketch:
  - 'derive: For Re s > 1 the Euler product of L(s,χ_0) omits the factors with p | N.'
  - 'derive: Hence the identity holds for Re s > 1.'
  - 'apply_theorem: Both sides are holomorphic on the connected set C minus {1}.'
  - 'conclude: The identity theorem extends the equality.'
  openmath: (forall (M s) (-> (and (in M N) (> M 0) (in s C) (!= s 1)) (= (dirichlet_l_function (dirichlet_trivial_character M) s) (* (product_over_prime_divisors M (lambda (p) (- 1 (^ p (neg s))))) (riemann_zeta s)))))
  hard_negative:
    statement: 法$N$の単位指標について$L(s,\chi_0)=\zeta(s)$である。
    reason: $N=2$、$s=2$とすると、$L(2,\chi_0)=\sum_{n\text{ odd}}n^{-2}=\frac{3}{4}\zeta(2)$である。
  target: |
    ∀ (N : ℕ) [NeZero N] (s : ℂ), s ≠ 1 → DirichletCharacter.LFunctionTrivChar N s = (∏ p ∈ N.primeFactors, (1 - (p : ℂ) ^ (-s))) * riemannZeta s
  proof: |
    by
      intro N _ s hs
      exact DirichletCharacter.LFunctionTrivChar_eq_mul_riemannZeta hs
- id: dirichlet_l_value_at_one_nonzero
  kind: named
  level: 4
  topic: 解析的整数論・ディリクレ L関数
  statement: 正の整数$N$を法とする単位指標でない複素数値のディリクレ指標$\chi$について、解析接続された$L(s,\chi)$は$L(1,\chi)\neq 0$を満たす。既知として、$\chi\neq\chi_0$で$L(s,\chi)$は整関数であること、$\zeta(s)$の$s=1$での一位の極、ランダウの定理（非負係数のディリクレ級数の収束軸の実点は特異点である）を使ってよい。
  statement_en: For a non-trivial complex Dirichlet character χ modulo a positive integer N, the analytically continued L(s,χ) satisfies L(1,χ) ≠ 0. It may be taken as known that L(s,χ) is entire for χ ≠ χ_0, that ζ has a simple pole at 1, and Landau's theorem that a Dirichlet series with nonnegative coefficients has a singularity at the real point of its abscissa of convergence.
  assumptions:
  - $N$は正の整数
  - $\chi$は法$N$の単位指標でない複素数値ディリクレ指標
  - $L(s,\chi)$の整関数性、$\zeta$の一位の極、ランダウの定理は既知とする
  quantifiers:
  - 任意の正の整数$N$と単位指標でない法$N$の指標$\chi$
  conclusion: $L(1,\chi)\neq 0$である。
  answer: |
    $N$を正の整数、$\chi$を単位指標でない法$N$の指標とする。$L(1,\chi)=0$と仮定して矛盾を導く。

    $\chi$が実指標でないとする。$\bar\chi\neq\chi$も単位指標でなく、$L(1,\bar\chi)=\overline{L(1,\chi)}=0$である。$F(s)=\prod_{\psi}L(s,\psi)$（$\psi$は法$N$の指標全体）とおく。実数$s>1$でオイラー積の対数をとり、指標の直交性を使うと、$\log F(s)=\varphi(N)\sum_{p,k:\,p^k\equiv 1\,(N)}\frac{1}{kp^{ks}}\geq 0$である。よって$F(s)\geq 1$である。一方、$L(s,\psi_0)$は$s=1$で高々一位の極をもち、$L(s,\chi)$、$L(s,\bar\chi)$は$s=1$で零点をもち、他の因子は正則である。よって$F(s)\to 0$（$s\to 1^+$）となり矛盾する。

    $\chi$が実指標とする。$G(s)=\zeta(s)L(s,\chi)$とおく。$\zeta$の一位の極は$L(s,\chi)$の零点で打ち消されるので、$G$は整関数である。$\operatorname{Re}s>1$で$G(s)=\sum_na_nn^{-s}$、$a_n=\sum_{d\mid n}\chi(d)$である。$a_n$は乗法的であり、素数べき$p^k$で$a_{p^k}=\sum_{j=0}^k\chi(p)^j\geq 0$であり、$k$が偶数なら$a_{p^k}\geq 1$である。よって$a_n\geq 0$であり、$a_{m^2}\geq 1$である。

    $G$は整関数なので、ランダウの定理より級数は$s>0$のすべての実数で収束する。しかし$s=1/2$では$\sum_na_nn^{-1/2}\geq\sum_ma_{m^2}m^{-1}\geq\sum_m1/m=\infty$である。これは矛盾である。

    以上より$L(1,\chi)\neq 0$である。
  strategy: For complex χ use the positivity of the product of all L-functions; for real χ use Landau's theorem on ζ(s)L(s,χ).
  sketch:
  - 'case_split: Treat non-real and real characters separately.'
  - 'derive: For real s > 1, the product F of all L-functions satisfies F(s) ≥ 1.'
  - 'contradiction: For non-real χ, two zeros at s = 1 against one pole force F(s) to tend to 0.'
  - 'derive: For real χ, ζ(s)L(s,χ) would be entire with coefficients a_n ≥ 0 and a_(m^2) ≥ 1.'
  - 'apply_theorem: Landau''s theorem makes the series converge at s = 1/2.'
  - 'contradiction: At s = 1/2 the series dominates the harmonic series.'
  openmath: (forall (M c) (-> (and (in M N) (> M 0) (dirichlet_character c M) (!= c (dirichlet_trivial_character M))) (!= (dirichlet_l_function c 1) 0)))
  hard_negative:
    statement: 法$N$の単位指標$\chi_0$についても$L(s,\chi_0)$は$s=1$で有限で零でない値をとる。
    reason: $L(s,\chi_0)=\zeta(s)\prod_{p\mid N}(1-p^{-s})$は$s=1$で極をもつ。$N=1$なら$\zeta(s)$そのものであり、$s\to 1^+$で発散する。
  target: |
    ∀ (N : ℕ) [NeZero N] (χ : DirichletCharacter ℂ N), χ ≠ 1 → DirichletCharacter.LFunction χ 1 ≠ 0
  proof: |
    by
      intro N _ χ h
      exact DirichletCharacter.LFunction_apply_one_ne_zero h
- id: riemann_zeta_nonvanishing_on_re_ge_one
  kind: named
  level: 4
  topic: 解析的整数論・リーマンゼータ関数
  statement: $\operatorname{Re}s\geq 1$、$s\neq 1$を満たす複素数$s$について、解析接続された$\zeta(s)$は$\zeta(s)\neq 0$を満たす。既知として、$\zeta$の$\mathbb{C}\setminus\{1\}$での正則性、$s=1$での一位の極、オイラー積を使ってよい。
  statement_en: For a complex number s with Re s ≥ 1 and s ≠ 1, the analytically continued ζ(s) is nonzero. Holomorphy of ζ away from 1, the simple pole at 1 and the Euler product may be taken as known.
  assumptions:
  - $s$は複素数で$\operatorname{Re}s\geq 1$、$s\neq 1$
  - $\zeta$の正則性、一位の極、オイラー積は既知とする
  quantifiers:
  - 上の任意の複素数$s$
  conclusion: $\zeta(s)\neq 0$である。
  answer: |
    $s$を$\operatorname{Re}s\geq 1$、$s\neq 1$を満たす複素数とする。

    $\operatorname{Re}s>1$のとき、オイラー積は無条件に収束し、各因子$(1-p^{-s})^{-1}$は零でない。積が絶対収束するので値は零でない。実際、$\sum_p|p^{-s}|<\infty$である。

    $s=1+it$（$t\neq 0$）とし、$\zeta(1+it)=0$と仮定する。実数$\sigma>1$について、オイラー積の対数をとると、$\log|\zeta(\sigma+iu)|=\sum_p\sum_{k\geq 1}\frac{\cos(ku\log p)}{kp^{k\sigma}}$である。$3+4\cos\theta+\cos 2\theta=2(1+\cos\theta)^2\geq 0$なので、
    $3\log\zeta(\sigma)+4\log|\zeta(\sigma+it)|+\log|\zeta(\sigma+2it)|\geq 0$である。すなわち$\zeta(\sigma)^3|\zeta(\sigma+it)|^4|\zeta(\sigma+2it)|\geq 1$である。

    $\sigma\to 1^+$とする。一位の極より$\zeta(\sigma)^3=O((\sigma-1)^{-3})$である。$\zeta(1+it)=0$で$\zeta$は$1+it$で正則なので$|\zeta(\sigma+it)|^4=O((\sigma-1)^4)$である。$t\neq 0$より$1+2it\neq 1$なので、$|\zeta(\sigma+2it)|$は有界である。よって左辺は$0$に収束し、下界$1$に反する。したがって$\zeta(1+it)\neq 0$である。
  strategy: Use the Euler product for Re s > 1 and the 3-4-1 inequality on the boundary line.
  sketch:
  - 'derive: For Re s > 1 the convergent Euler product is nonzero.'
  - 'derive: The identity 3+4cos θ+cos 2θ = 2(1+cos θ)^2 gives ζ(σ)^3|ζ(σ+it)|^4|ζ(σ+2it)| ≥ 1.'
  - 'setup: Suppose ζ(1+it) = 0 with t ≠ 0 and let σ tend to 1 from above.'
  - 'contradiction: The pole of order 3 is beaten by the zero of order at least 4, so the product tends to 0.'
  openmath: (forall (s) (-> (and (in s C) (>= (real_part s) 1) (!= s 1)) (!= (riemann_zeta s) 0)))
  hard_negative:
    statement: $\operatorname{Re}s>0$、$s\neq 1$なら$\zeta(s)\neq 0$である。
    reason: リーマンゼータ関数は臨界帯$0<\operatorname{Re}s<1$に零点をもつ。たとえば$s=\frac{1}{2}+14.1347\dots i$は零点である。
  target: |
    ∀ s : ℂ, 1 ≤ s.re → s ≠ 1 → riemannZeta s ≠ 0
  proof: |
    by
      intro s hs _
      exact riemannZeta_ne_zero_of_one_le_re hs
- id: von_mangoldt_dirichlet_series_log_derivative
  kind: gap
  level: 4
  topic: 解析的整数論・リーマンゼータ関数
  statement: $\operatorname{Re}s>1$を満たす複素数$s$について、$\sum_{n\geq 1}\Lambda(n)n^{-s}$は絶対収束し、その値は$-\zeta'(s)/\zeta(s)$である。
  statement_en: For a complex number s with Re s > 1, the series of Λ(n)n^(-s) for n ≥ 1 converges absolutely and its value is -ζ'(s)/ζ(s).
  assumptions:
  - $s$は複素数で$\operatorname{Re}s>1$
  quantifiers:
  - $\operatorname{Re}s>1$を満たす任意の複素数$s$
  conclusion: 級数は絶対収束し、値は$-\zeta'(s)/\zeta(s)$である。
  answer: |
    $s$を$\operatorname{Re}s>1$を満たす複素数とする。$0\leq\Lambda(n)\leq\log n$であり、$\sum_n(\log n)n^{-\operatorname{Re}s}<\infty$なので、級数は絶対収束する。

    $\operatorname{Re}s>1$で$\zeta(s)=\sum_nn^{-s}$は広義一様収束するので、項別に微分できて$\zeta'(s)=-\sum_n(\log n)n^{-s}$である。

    $\log n=\sum_{d\mid n}\Lambda(d)$である。絶対収束する二つのディリクレ級数の積は、係数のディリクレ積を係数とするディリクレ級数である。よって$\left(\sum_n\Lambda(n)n^{-s}\right)\zeta(s)=\sum_n(\log n)n^{-s}=-\zeta'(s)$である。

    オイラー積より$\zeta(s)\neq 0$である。両辺を$\zeta(s)$で割って結論を得る。
  strategy: Multiply the series by ζ(s) using Λ * 1 = log, and identify the result with -ζ'(s).
  sketch:
  - 'derive: Λ(n) ≤ log n gives absolute convergence.'
  - 'derive: Termwise differentiation gives ζ''(s) as minus the series of (log n)n^(-s).'
  - 'apply_theorem: The identity log = Λ * 1 turns the product of series into that series.'
  - 'conclude: ζ(s) ≠ 0, so dividing gives the claim.'
  openmath: (forall (s) (-> (and (in s C) (> (real_part s) 1)) (and (series_abs_summable (von_mangoldt_dirichlet_terms s)) (= (series_sum (von_mangoldt_dirichlet_terms s)) (neg (/ (complex_deriv riemann_zeta_fn s) (riemann_zeta s)))))))
  hard_negative:
    statement: $\operatorname{Re}s>1$なら$\sum_n\mu(n)n^{-s}=-\zeta'(s)/\zeta(s)$である。
    reason: $\sum_n\mu(n)n^{-s}=1/\zeta(s)$である。$s=2$なら左辺は$6/\pi^2\approx 0.608$だが、右辺は$\sum_n\Lambda(n)n^{-2}\approx 0.570$である。
  target: |
    ∀ s : ℂ, 1 < s.re → LSeriesSummable (fun n : ℕ => ((ArithmeticFunction.vonMangoldt n : ℝ) : ℂ)) s ∧ LSeries (fun n : ℕ => ((ArithmeticFunction.vonMangoldt n : ℝ) : ℂ)) s = -deriv riemannZeta s / riemannZeta s
  proof: |
    by
      intro s hs
      exact ⟨ArithmeticFunction.LSeriesSummable_vonMangoldt hs, ArithmeticFunction.LSeries_vonMangoldt_eq_deriv_riemannZeta_div hs⟩
- id: central_binomial_lower_bound
  kind: gap
  level: 3
  topic: 解析的整数論・ベルトランの周辺
  statement: 自然数$n\geq 4$について、$4^n<n\binom{2n}{n}$である。
  statement_en: For a natural number n ≥ 4, 4^n < n C(2n,n).
  assumptions:
  - $n\geq 4$は自然数
  quantifiers:
  - 任意の自然数$n\geq 4$
  conclusion: $4^n<n\binom{2n}{n}$である。
  answer: |
    $n\geq 4$について帰納法で示す。$n=4$では$4^4=256$、$4\binom{8}{4}=280$なので成り立つ。

    $n\geq 4$で成り立つとする。$\binom{2n+2}{n+1}=\binom{2n}{n}\cdot\frac{(2n+1)(2n+2)}{(n+1)^2}=\binom{2n}{n}\cdot\frac{2(2n+1)}{n+1}$なので、$(n+1)\binom{2n+2}{n+1}=(4n+2)\binom{2n}{n}$である。

    帰納法の仮定より、$4^{n+1}=4\cdot 4^n<4n\binom{2n}{n}<(4n+2)\binom{2n}{n}=(n+1)\binom{2n+2}{n+1}$である。
  strategy: Induct using the recurrence between consecutive central binomial coefficients.
  sketch:
  - 'derive: The case n = 4 is 256 < 280.'
  - 'derive: The recurrence gives (n+1)C(2n+2,n+1) = (4n+2)C(2n,n).'
  - 'induction: Multiply the hypothesis by 4 and compare.'
  openmath: (forall (n) (-> (and (in n N) (>= n 4)) (< (^ 4 n) (* n (binomial (* 2 n) n)))))
  hard_negative:
    statement: 自然数$n\geq 1$について、$4^n<\binom{2n}{n}$である。
    reason: $n=1$では$4>2$である。一般に$\binom{2n}{n}\leq 4^n$であり、因子$n$がなければ逆向きである。
  target: |
    ∀ n : ℕ, 4 ≤ n → 4 ^ n < n * Nat.centralBinom n
  proof: |
    by
      intro n hn
      exact Nat.four_pow_lt_mul_centralBinom n hn
- id: central_binomial_no_prime_in_two_thirds_range
  kind: gap
  level: 3
  topic: 解析的整数論・ベルトランの周辺
  statement: 自然数$n>2$と素数$p$について、$p\leq n$かつ$2n<3p$ならば、$p\nmid\binom{2n}{n}$である。
  statement_en: For a natural number n > 2 and a prime p, if p ≤ n and 2n < 3p, then p does not divide C(2n,n).
  assumptions:
  - $n>2$は自然数
  - $p$は素数で$p\leq n$、$2n<3p$
  quantifiers:
  - 上の任意の$n,p$
  conclusion: $v_p\binom{2n}{n}=0$である。
  answer: |
    $n>2$を自然数、$p$を$p\leq n$、$2n<3p$を満たす素数とする。$2n<3p$と$n\geq 3$より$p>2$なので$p\geq 3$である。よって$p^2\geq 3p>2n$である。

    ルジャンドルの公式より$v_p((2n)!)=\lfloor 2n/p\rfloor$である。$p^2>2n$なので高次の項はない。$2p\leq 2n<3p$なので$\lfloor 2n/p\rfloor=2$である。

    同様に$v_p(n!)=\lfloor n/p\rfloor$である。$p\leq n$であり、$2n<3p$より$n<3p/2<2p$なので、$\lfloor n/p\rfloor=1$である。

    したがって$v_p\binom{2n}{n}=v_p((2n)!)-2v_p(n!)=2-2=0$である。
  strategy: Compute the valuations of (2n)! and n! by Legendre's formula.
  sketch:
  - 'derive: p ≥ 3, so p^2 > 2n and only the first Legendre term matters.'
  - 'derive: 2p ≤ 2n < 3p gives v_p((2n)!) = 2.'
  - 'derive: p ≤ n < 2p gives v_p(n!) = 1.'
  - 'conclude: Hence v_p(C(2n,n)) = 0.'
  openmath: (forall (n p) (-> (and (in n N) (> n 2) (in p P) (<= p n) (< (* 2 n) (* 3 p))) (not (dvd p (binomial (* 2 n) n)))))
  hard_negative:
    statement: $p\leq n$なら$p\nmid\binom{2n}{n}$である。
    reason: $n=6,p=3$とすると$\binom{12}{6}=924=3\cdot 308$である。条件$2n<3p$が要る。
  target: |
    ∀ n p : ℕ, 2 < n → Nat.Prime p → p ≤ n → 2 * n < 3 * p → ¬ p ∣ Nat.centralBinom n
  proof: |
    by
      intro n p hn hp h1 h2
      have h := Nat.factorization_centralBinom_of_two_mul_self_lt_three_mul hn h1 h2
      intro hd
      have := (hp.dvd_iff_one_le_factorization (Nat.centralBinom_ne_zero n)).1 hd
      omega
- id: fermat_last_theorem_exponent_three
  kind: named
  level: 4
  topic: 初等整数論・フェルマーの最終定理
  statement: 正の整数$a,b,c$について、$a^3+b^3\neq c^3$である（フェルマーの最終定理の$n=3$の場合）。既知として、$\mathbb{Z}[\omega]$（$\omega=e^{2\pi i/3}$）が単項イデアル整域であり単元は$\pm 1,\pm\omega,\pm\omega^2$であること、$\lambda=1-\omega$が素元で$3=-\omega^2\lambda^2$であることを使ってよい。
  statement_en: For positive integers a, b, c, a^3+b^3 ≠ c^3 (the case n = 3 of Fermat's last theorem). It may be taken as known that Z[ω], with ω = e^(2πi/3), is a principal ideal domain with units ±1, ±ω, ±ω^2, and that λ = 1-ω is a prime element with 3 = -ω^2 λ^2.
  assumptions:
  - $a,b,c$は正の整数
  - $\mathbb{Z}[\omega]$の単項イデアル整域性、単元、$\lambda$の性質は既知とする
  quantifiers:
  - 任意の正の整数$a,b,c$
  conclusion: $a^3+b^3\neq c^3$である。
  answer: |
    $a,b,c$を正の整数とし、$a^3+b^3=c^3$と仮定する。共通因子で割って、対ごとに互いに素としてよい。

    整数の立方は$9$で割って$0,\pm 1$余る。$3\nmid abc$なら$a^3+b^3-c^3\equiv\pm 1,\pm 3\pmod 9$となり$0$にならない。よって$a,b,c$のちょうど一つが$3$で割れる。移項して符号を変えると、$3\mid z$、$3\nmid xy$を満たす対ごとに互いに素な零でない整数で$x^3+y^3=z^3$となるものが得られる。整数として互いに素なら、ベズーの等式より$\mathbb{Z}[\omega]$でも互いに素である。整数$t$について$\lambda\mid t$と$3\mid t$は同値である。そこで、$x^3+y^3=\varepsilon z^3$（$\varepsilon$は単元）で、$x,y,z\in\mathbb{Z}[\omega]$が対ごとに互いに素で零でなく、$\lambda\mid z$であるものを考える。このとき$\lambda\nmid xy$である。そのような解のうち$n=v_\lambda(z)$が最小のものをとる。

    補題を示す。$\lambda\nmid\alpha$なら$\alpha^3\equiv\pm 1\pmod{\lambda^4}$である。$\mathbb{Z}[\omega]/(\lambda)\cong\mathbb{F}_3$なので、$\alpha$を$-\alpha$に替えて$\alpha=1+\lambda\beta$と書ける。$1-\omega=\lambda$、$1-\omega^2=\lambda(1+\omega)=-\lambda\omega^2$なので、$\alpha^3-1=(\alpha-1)(\alpha-\omega)(\alpha-\omega^2)=\lambda^3\beta(\beta+1)(\beta-\omega^2)$である。$\omega^2\equiv 1\pmod\lambda$なので、$\beta(\beta+1)(\beta-\omega^2)\equiv\beta(\beta+1)(\beta-1)\equiv 0\pmod\lambda$である。よって$\lambda^4\mid\alpha^3-1$である。

    補題より$x^3+y^3\equiv\pm 1\pm 1\pmod{\lambda^4}$である。これが$\lambda$で割れるので符号は打ち消し合い、$\lambda^4\mid\varepsilon z^3$である。よって$n\geq 2$である。

    $x^3+y^3=(x+y)(x+\omega y)(x+\omega^2y)$である。三つの因子の差は$\lambda y$の単元倍である。よって因子は法$\lambda$で合同であり、積が$\lambda$で割れるので、どの因子も$\lambda$で割れる。また、$\omega(x+y)-(x+\omega y)$、$\omega^2(x+y)-(x+\omega^2y)$、$\omega(x+\omega y)-(x+\omega^2y)$はいずれも$\lambda x$の単元倍である。二つの因子の公約元は$\lambda x$と$\lambda y$を割り、$x,y$は互いに素なので、$\lambda$を割る。したがって、どの二つの最大公約元も$\lambda$の単元倍である。合計の$\lambda$の指数は$3n\geq 6$なので、$y$を$\omega y$、$\omega^2y$に取り替えて、$x+y$の指数を$3n-2$、他の二つの指数を$1$としてよい。互いに素な因子の積が単元倍の立方なので、$x+y=\varepsilon_1\lambda^{3n-2}A^3$、$x+\omega y=\varepsilon_2\lambda B^3$、$x+\omega^2y=\varepsilon_3\lambda C^3$で、$A,B,C$は対ごとに互いに素で$\lambda$で割れない。

    恒等式$(x+y)+\omega(x+\omega y)+\omega^2(x+\omega^2y)=0$に代入し、$\lambda$で割ると$B^3+\varepsilon_4C^3=\varepsilon_5\lambda^{3(n-1)}A^3$（$\varepsilon_4,\varepsilon_5$は単元）を得る。$n\geq 2$なので右辺は$\lambda^3$で割れる。補題より$\pm 1+\varepsilon_4(\pm 1)\equiv 0\pmod{\lambda^2}$である。$\omega,\omega^2\not\equiv\pm 1\pmod{\lambda^2}$なので、$\varepsilon_4=\pm 1$である。$C$の符号を調整すると、$B^3+C^3=\varepsilon_5(\lambda^{n-1}A)^3$となる。$B,C,\lambda^{n-1}A$は対ごとに互いに素で零でなく、$\lambda\mid\lambda^{n-1}A$である。これは$v_\lambda(z)=n-1$の解であり、$n$の最小性に反する。
  strategy: Descend on the λ-adic valuation of z in Z[ω] for x^3+y^3 = εz^3.
  sketch:
  - 'derive: Modulo 9 exactly one of a, b, c is divisible by 3, giving x^3+y^3 = εz^3 with λ | z.'
  - 'derive: Units aside, λ-coprime cubes are ±1 modulo λ^4, so n = v_λ(z) ≥ 2.'
  - 'derive: The three factors of x^3+y^3 have pairwise gcd λ, so after rotating y they are λ^(3n-2) and λ times cubes.'
  - 'derive: Their linear relation gives B^3+ε_4 C^3 = ε_5 λ^(3(n-1)) A^3.'
  - 'derive: Congruences force ε_4 = ±1.'
  - 'contradiction: This is a solution with smaller valuation.'
  openmath: (forall (a b c) (-> (and (in a N) (in b N) (in c N) (> a 0) (> b 0) (> c 0)) (!= (+ (^ a 3) (^ b 3)) (^ c 3))))
  hard_negative:
    statement: 正の整数$a,b,c$について$a^3+b^3\neq c^2$である。
    reason: $a=1,b=2,c=3$とすると$1+8=9=3^2$である。右辺の指数を変えると成り立たない。
  target: |
    ∀ a b c : ℕ, a ≠ 0 → b ≠ 0 → c ≠ 0 → a ^ 3 + b ^ 3 ≠ c ^ 3
  proof: |
    by
      intro a b c ha hb hc
      exact fermatLastTheoremThree a b c ha hb hc
- id: fermat_last_theorem_exponents_divisible_by_three_or_four
  kind: gap
  level: 4
  topic: 初等整数論・フェルマーの最終定理
  statement: 自然数$n$が$3$または$4$で割り切れるならば、正の整数$a,b,c$について$a^n+b^n\neq c^n$である。既知として、指数$3$の場合と、$x^4+y^4=z^2$が零でない整数解をもたないことを使ってよい。
  statement_en: If a natural number n is divisible by 3 or 4, then a^n+b^n ≠ c^n for positive integers a, b, c. The case of exponent 3 and the fact that x^4+y^4 = z^2 has no solutions with x, y nonzero may be taken as known.
  assumptions:
  - $n$は$3$または$4$で割り切れる自然数
  - $a,b,c$は正の整数
  - 指数$3$の場合と$x^4+y^4=z^2$の非可解性は既知とする
  quantifiers:
  - 上の任意の$n$と正の整数$a,b,c$
  conclusion: $a^n+b^n\neq c^n$である。
  answer: |
    $n$を$3$または$4$で割り切れる自然数、$a,b,c$を正の整数とする。$a^n+b^n=c^n$と仮定する。

    $n=0$なら$1+1=1$となり矛盾するので、$n\geq 1$である。

    $n=3k$のとき、$(a^k)^3+(b^k)^3=(c^k)^3$であり、$a^k,b^k,c^k$は正の整数である。これは指数$3$の場合に反する。

    $n=4k$のとき、$(a^k)^4+(b^k)^4=(c^{2k})^2$であり、$a^k,b^k$は零でない整数である。これは$x^4+y^4=z^2$の非可解性に反する。

    よって$a^n+b^n\neq c^n$である。
  strategy: Rewrite the equation as a solution for exponent 3 or as x^4+y^4 = z^2.
  sketch:
  - 'case_split: The case n = 0 reduces to 2 = 1.'
  - 'derive: For n = 3k, powers a^k, b^k, c^k solve the exponent 3 equation.'
  - 'derive: For n = 4k, a^k, b^k, c^(2k) solve x^4+y^4 = z^2.'
  - 'contradiction: Both contradict the known results.'
  openmath: (forall (n a b c) (-> (and (in n N) (or (dvd 3 n) (dvd 4 n)) (in a N) (in b N) (in c N) (> a 0) (> b 0) (> c 0)) (!= (+ (^ a n) (^ b n)) (^ c n))))
  hard_negative:
    statement: 自然数$n$が偶数ならば、正の整数$a,b,c$について$a^n+b^n\neq c^n$である。
    reason: $n=2$なら$3^2+4^2=5^2$である。$2$の倍数ではなく$4$の倍数でなければこの議論は使えない。
  target: |
    ∀ n a b c : ℕ, (3 ∣ n ∨ 4 ∣ n) → a ≠ 0 → b ≠ 0 → c ≠ 0 → a ^ n + b ^ n ≠ c ^ n
  proof: |
    by
      intro n a b c h ha hb hc
      rcases h with h | h
      · exact FermatLastTheoremFor.mono h fermatLastTheoremThree a b c ha hb hc
      · exact FermatLastTheoremFor.mono h fermatLastTheoremFour a b c ha hb hc
