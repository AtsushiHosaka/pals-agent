  statement: 整域$A$の素元$p$と$x,y\in A$、自然数$n$について、$p\mid x-y$、$p\nmid x$で、$n$の$A$での像が$p$で割れないならば、$v_p(x^n-y^n)=v_p(x-y)$である。ここで$v_p$は$p$で割れる回数で、$v_p(0)=\infty$とする。
  statement_en: Let p be a prime element of an integral domain, x, y elements and n a natural number. If p | x-y, p does not divide x, and p does not divide the image of n, then v_p(x^n-y^n) = v_p(x-y), where v_p is the multiplicity of p with v_p(0) = ∞.
  assumptions:
  - $A$は整域、$p\in A$は素元
  - $x,y\in A$、$n$は自然数
  - $p\mid x-y$、$p\nmid x$、$p\nmid n$
  - $v_p(0)=\infty$とする
  quantifiers:
  - 任意の整域$A$、素元$p$、$x,y\in A$、自然数$n$
  conclusion: $v_p(x^n-y^n)=v_p(x-y)$である。
  answer: |
    $A$を整域、$p$を素元、$x,y\in A$、$n$を自然数とし、$p\mid x-y$、$p\nmid x$、$p\nmid n$とする。$p\nmid n$より$n\geq 1$である。

    $x^n-y^n=(x-y)S$、$S=\sum_{i=0}^{n-1}x^iy^{n-1-i}$と因数分解する。$y\equiv x\pmod p$より、各項は$x^{n-1}$と合同であり、$S\equiv nx^{n-1}\pmod p$である。$p$は素元で$p\nmid n$、$p\nmid x$なので、$p\nmid nx^{n-1}$である。よって$p\nmid S$である。

    素元については、$p^k\mid (x-y)S$かつ$p\nmid S$なら$p^k\mid x-y$である。これは$k$に関する帰納法で分かる。$k\geq 1$なら$p\mid (x-y)S$より$p\mid x-y$なので$x-y=pz$と書け、$A$が整域なので$p^{k-1}\mid zS$となるからである。したがって$p$で割れる回数は$x^n-y^n$と$x-y$で等しい。$x=y$なら両辺とも$\infty$である。
  strategy: Factor x^n-y^n and show the cofactor is congruent to n x^(n-1), which is prime to p.
  sketch:
  - 'derive: x^n-y^n = (x-y)S with S the geometric sum.'
  - 'derive: Modulo p, S is congruent to n x^(n-1).'
  - 'derive: Since p is prime and divides neither n nor x, p does not divide S.'
  - 'conclude: Multiplying by a factor prime to p does not change the multiplicity.'
  openmath: (forall (A p x y n) (-> (and (integral_domain A) (prime_element p A) (in x A) (in y A) (in n N) (dvd p (- x y)) (not (dvd p x)) (not (dvd p n))) (= (padic_valuation p (- (^ x n) (^ y n))) (padic_valuation p (- x y)))))
