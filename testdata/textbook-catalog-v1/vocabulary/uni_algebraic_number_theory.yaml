# Proposed additive OpenMath vocabulary (cd=pals2). The deployed validator does not accept it yet.
absolute_discriminant: {args: [term], returns: term, meaning: "discriminant of the number field K"}
absolute_value_equivalent: {args: [term, term], returns: prop, meaning: "two absolute values define the same topology, equivalently one is a positive power of the other"}
additive_haar_measure: {args: [term, term], returns: prop, meaning: "m is an additive Haar measure on the finite-dimensional real normed space E, in the order m E"}
adele_component: {args: [term, term], returns: term, meaning: "the component of the adele a at the place v, in the order a v"}
algebraic_integer: {args: [term], returns: prop, meaning: "x is integral over the integers"}
