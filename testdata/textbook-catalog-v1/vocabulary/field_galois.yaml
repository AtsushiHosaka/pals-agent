# Proposed additive OpenMath vocabulary for field and Galois theory (cd=pals2).
field_extension: {args: [term, term], returns: prop, meaning: "E is an extension field of F"}
finite_extension: {args: [term, term], returns: prop, meaning: "E is a finite extension of F"}
ext_degree: {args: [term, term], returns: term, meaning: "the degree [E:F] of E over F"}
algebraic_over: {args: [term, term], returns: prop, meaning: "the element x is algebraic over the field F"}
algebraic_extension: {args: [term, term], returns: prop, meaning: "E is an algebraic extension of F"}
minimal_polynomial: {args: [term, term], returns: term, meaning: "the minimal polynomial of x over F"}
polynomial_over: {args: [term, term], returns: prop, meaning: "f is a polynomial with coefficients in F"}
irreducible_over: {args: [term, term], returns: prop, meaning: "the polynomial f is irreducible over F"}
monic_polynomial: {args: [term], returns: prop, meaning: "the polynomial f is monic"}
poly_degree: {args: [term], returns: term, meaning: "the degree of the polynomial f"}
poly_eval: {args: [term, term], returns: term, meaning: "the value f(x) of the polynomial f at x"}
poly_derivative: {args: [term], returns: term, meaning: "the formal derivative of the polynomial f"}
simple_extension: {args: [term, term], returns: term, meaning: "the field F(x) generated by x over F"}
splitting_field: {args: [term, term, term], returns: prop, meaning: "E is a splitting field of f over F"}
isomorphic_over: {args: [term, term, term], returns: prop, meaning: "E and L are isomorphic as extensions of F"}
algebraically_closed: {args: [term], returns: prop, meaning: "the field K is algebraically closed"}
algebraic_closure_of: {args: [term, term], returns: prop, meaning: "E is an algebraic closure of F"}
normal_extension: {args: [term, term], returns: prop, meaning: "E is a normal extension of F"}
separable_extension: {args: [term, term], returns: prop, meaning: "E is a separable extension of F"}
separable_polynomial: {args: [term], returns: prop, meaning: "the polynomial f is separable"}
perfect_field: {args: [term], returns: prop, meaning: "the field K is perfect"}
adjoin_root: {args: [term], returns: term, meaning: "the quotient ring F[X]/(f) of the polynomial ring by f"}
adjoin_root_generator: {args: [term], returns: term, meaning: "the class of X in F[X]/(f)"}
finite_field: {args: [term], returns: prop, meaning: "K is a finite field"}
galois_field: {args: [term, term], returns: term, meaning: "the finite field of order p^n, in the order (p, n)"}
units_group: {args: [term], returns: term, meaning: "the multiplicative group of the field K"}
cyclic_group: {args: [term], returns: prop, meaning: "G is a cyclic group"}
solvable_group: {args: [term], returns: prop, meaning: "G is a solvable group"}
normal_subgroup: {args: [term, term], returns: prop, meaning: "N is a normal subgroup of G"}
quotient_group: {args: [term, term], returns: term, meaning: "quotient group G/N, in the order (G, N)"}
isomorphic_groups: {args: [term, term], returns: prop, meaning: "the groups G and H are isomorphic"}
cyclic_subgroup: {args: [term], returns: term, meaning: "cyclic subgroup generated by one element"}
ring_isomorphic: {args: [term, term], returns: prop, meaning: "the rings A and B are isomorphic"}
galois_extension: {args: [term, term], returns: prop, meaning: "E is a Galois extension of F"}
galois_group: {args: [term, term], returns: term, meaning: "the Galois group Gal(E/F)"}
frobenius_automorphism: {args: [term, term], returns: term, meaning: "the automorphism x to x^|F| of E over the finite field F"}
element_order: {args: [term], returns: term, meaning: "order of a group element"}
intermediate_field: {args: [term, term, term], returns: prop, meaning: "K is an intermediate field of E/F, in the order (K, F, E)"}
fixed_field: {args: [term, term], returns: term, meaning: "the subfield of E fixed by the group H, in the order (H, E)"}
fixing_subgroup: {args: [term, term], returns: term, meaning: "the automorphisms of E fixing K pointwise, in the order (K, E)"}
automorphism_apply: {args: [term, term], returns: term, meaning: "the image of x under the automorphism s, in the order (s, x)"}
field_group_action: {args: [term, term], returns: prop, meaning: "the finite group G acts faithfully on the field E by field automorphisms"}
finite_group: {args: [term], returns: prop, meaning: "G is a finite group"}
field_characteristic: {args: [term], returns: term, meaning: "the characteristic of the field K"}
cyclotomic_polynomial: {args: [term, term], returns: term, meaning: "the n-th cyclotomic polynomial over F, in the order (n, F)"}
primitive_root_of_unity: {args: [term, term], returns: prop, meaning: "x is a primitive n-th root of unity, in the order (x, n)"}
cyclotomic_extension: {args: [term, term, term], returns: prop, meaning: "E is generated over F by the n-th roots of unity, in the order (E, n, F)"}
euler_phi: {args: [term], returns: term, meaning: "Euler totient function of n"}
zmod_units: {args: [term], returns: term, meaning: "the unit group of the integers modulo n"}
product_over_divisors: {args: [term, term_function], returns: term, meaning: "the product of g(d) over the positive divisors d of n"}
polynomial_x_pow_sub: {args: [term, term], returns: term, meaning: "the polynomial X^n - a, in the order (n, a)"}
solvable_by_radicals: {args: [term, term], returns: prop, meaning: "x is obtained from F by field operations and radicals"}
polynomial_galois_group: {args: [term, term], returns: term, meaning: "the Galois group of a splitting field of f over F, in the order (f, F)"}
nonzero_in_field: {args: [term, term], returns: prop, meaning: "the integer n has nonzero image in the field F"}
nontrivial_ring: {args: [term], returns: prop, meaning: "R is not the zero ring"}
