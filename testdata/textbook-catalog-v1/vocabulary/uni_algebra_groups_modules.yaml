finite_index_subgroup: {args: [term, term], returns: prop, meaning: "H is a subgroup of finite index in G, in the order (H, G)"}
subgroup_normalizer: {args: [term, term], returns: term, meaning: "normalizer of H in G, in the order (H, G)"}
transposition_of: {args: [term, term], returns: term, meaning: "the permutation exchanging a and b and fixing every other point"}
cycle_type: {args: [term], returns: term, meaning: "multiset of the lengths, at least 2, of the cycles in the disjoint cycle decomposition of a permutation"}
