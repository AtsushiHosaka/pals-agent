# Proposed additive OpenMath vocabulary for undergraduate group and module basics (cd=pals2).
# Reused from other vocabulary files with the same args.
group: {args: [term], returns: prop, meaning: "G is a group"}
finite_group: {args: [term], returns: prop, meaning: "G is a finite group"}
abelian_group: {args: [term], returns: prop, meaning: "G is an abelian group"}
cyclic_group: {args: [term], returns: prop, meaning: "G is a cyclic group"}
solvable_group: {args: [term], returns: prop, meaning: "G is a solvable group"}
nilpotent_group: {args: [term], returns: prop, meaning: "G is a nilpotent group"}
group_mul: {args: [term, term], returns: term, meaning: "product ab of two elements of a group"}
group_inv: {args: [term], returns: term, meaning: "inverse of a group element"}
group_identity: {args: [term], returns: term, meaning: "identity element of the group G"}
group_pow: {args: [term, term], returns: term, meaning: "power g^n of a group element"}
element_order: {args: [term], returns: term, meaning: "order of a group element"}
normal_subgroup: {args: [term, term], returns: prop, meaning: "N is a normal subgroup of G"}
trivial_subgroup: {args: [term], returns: term, meaning: "trivial subgroup of G"}
subgroup_index: {args: [term, term], returns: term, meaning: "index [G:H], in the order (H, G)"}
subgroup_join: {args: [term, term], returns: term, meaning: "subgroup generated by the union of H and K"}
quotient_group: {args: [term, term], returns: term, meaning: "quotient group G/N, in the order (G, N)"}
quotient_map: {args: [term, term], returns: term, meaning: "natural projection from G onto G/N"}
group_center: {args: [term], returns: term, meaning: "center Z(G)"}
commutator_subgroup: {args: [term], returns: term, meaning: "commutator subgroup [G,G]"}
group_hom: {args: [term, term, term], returns: prop, meaning: "f is a group homomorphism from G to H, in the order (f, G, H)"}
group_kernel: {args: [term], returns: term, meaning: "kernel of a group homomorphism"}
group_image: {args: [term], returns: term, meaning: "image of a group homomorphism"}
surjective_function: {args: [term], returns: prop, meaning: "f is surjective"}
group_action: {args: [term, term], returns: prop, meaning: "the group G acts on the set X"}
action_stabilizer: {args: [term, term], returns: term, meaning: "stabilizer of x in G, in the order (G, x)"}
action_orbit_set: {args: [term, term], returns: term, meaning: "set of orbits of G on X"}
sylow_subgroup: {args: [term, term, term], returns: prop, meaning: "P is a Sylow p-subgroup of G, in the order (p, P, G)"}
symmetric_group: {args: [term], returns: term, meaning: "symmetric group on a finite set X"}
permutation_set: {args: [term], returns: term, meaning: "set of all bijections from A to A"}
finite_set: {args: [term], returns: prop, meaning: "S is a finite set"}
factorial: {args: [term], returns: term, meaning: "factorial n!"}
powerset: {args: [term], returns: term, meaning: "set of all subsets of A"}
nat_mod: {args: [term, term], returns: term, meaning: "remainder of natural number a divided by positive b"}
range_sum: {args: [term, term_function], returns: term, meaning: "finite sum of g(k) over k from 0 to n-1"}
is_ring: {args: [term], returns: prop, meaning: "R is a ring"}
is_module: {args: [term, term], returns: prop, meaning: "M is a module over the ring R"}
is_submodule: {args: [term, term], returns: prop, meaning: "N is a submodule of the module M"}
module_hom: {args: [term, term, term, term], returns: prop, meaning: "f is an R-linear map from M to N, in the order f R M N"}
map_kernel: {args: [term], returns: term, meaning: "kernel of a linear map"}
quotient_module: {args: [term, term], returns: term, meaning: "quotient module M/N"}
image_submodule: {args: [term, term], returns: term, meaning: "image f(N) of a submodule N under a linear map f"}
preimage_submodule: {args: [term, term], returns: term, meaning: "preimage of a submodule N under a linear map f"}
submodule_sum: {args: [term, term], returns: term, meaning: "sum N1+N2 of two submodules"}
submodule_inter: {args: [term, term], returns: term, meaning: "intersection of two submodules"}
linear_span: {args: [term], returns: term, meaning: "linear span of a set or family of vectors"}
bijective_map: {args: [term], returns: prop, meaning: "the map is bijective"}
finitely_generated_module: {args: [term, term], returns: prop, meaning: "M is a finitely generated R-module, in the order R M"}
whole_submodule: {args: [term], returns: term, meaning: "the module M seen as a submodule of itself"}
complementary_submodules: {args: [term, term, term], returns: prop, meaning: "p and q are complementary submodules of M, in the order p q M"}
ordered_pair: {args: [term, term], returns: term, meaning: "ordered pair (a, b)"}
finite_family_product: {args: [term, term_function], returns: term, meaning: "product over an index in the finite set t of the given family"}
# New symbols.
group_act: {args: [term, term], returns: term, meaning: "image g x of the point x under the group element g"}
action_kernel: {args: [term, term], returns: term, meaning: "kernel of the homomorphism from G to the permutations of X given by an action, in the order (G, X)"}
