# Proposed additive OpenMath vocabulary for the university commutative algebra cards (cd=pals2).
comm_ring: {args: [term], returns: prop, meaning: "R is a commutative ring with unity"}
nontrivial_ring: {args: [term], returns: prop, meaning: "R is not the zero ring"}
integral_domain: {args: [term], returns: prop, meaning: "R is an integral domain"}
reduced_ring: {args: [term], returns: prop, meaning: "R has no nonzero nilpotent elements"}
noetherian_ring: {args: [term], returns: prop, meaning: "R is a Noetherian ring"}
artinian_ring: {args: [term], returns: prop, meaning: "R is an Artinian ring"}
local_ring: {args: [term], returns: prop, meaning: "R is a local ring"}
ring_hom: {args: [term, term, term], returns: prop, meaning: "f is a ring homomorphism from R to S"}
ring_iso: {args: [term, term, term], returns: prop, meaning: "e is a ring isomorphism from A to B"}
ring_hom_injective: {args: [term], returns: prop, meaning: "the ring homomorphism f is injective"}
surjective: {args: [term], returns: prop, meaning: "f is surjective onto its codomain"}
fn_value: {args: [term, term], returns: term, meaning: "function value f(x)"}
unit_element: {args: [term, term], returns: prop, meaning: "a is a unit of R"}
nilpotent_element: {args: [term, term], returns: prop, meaning: "a is a nilpotent element of R"}
ideal_of: {args: [term, term], returns: prop, meaning: "I is an ideal of R"}
prime_ideal: {args: [term, term], returns: prop, meaning: "P is a prime ideal of R"}
maximal_ideal: {args: [term, term], returns: prop, meaning: "M is a maximal ideal of R"}
primary_ideal: {args: [term, term], returns: prop, meaning: "I is a primary ideal of R"}
unit_ideal: {args: [term], returns: term, meaning: "the whole ring R seen as an ideal"}
zero_ideal: {args: [term], returns: term, meaning: "the zero ideal of R"}
principal_ideal: {args: [term], returns: term, meaning: "the ideal generated by the element a"}
finitely_generated_ideal: {args: [term], returns: prop, meaning: "the ideal I is finitely generated"}
ideal_sum: {args: [term, term], returns: term, meaning: "sum I + J of two ideals"}
ideal_product: {args: [term, term], returns: term, meaning: "product IJ of two ideals"}
ideal_power: {args: [term, term], returns: term, meaning: "n-th power of the ideal I"}
ideal_radical: {args: [term], returns: term, meaning: "radical of the ideal I"}
ideal_comap: {args: [term, term], returns: term, meaning: "preimage of the ideal J under the ring homomorphism f"}
ideal_map: {args: [term, term], returns: term, meaning: "ideal generated by the image of I under the ring homomorphism f"}
quotient_ring: {args: [term, term], returns: term, meaning: "quotient ring R/I"}
residue_class: {args: [term, term], returns: term, meaning: "residue class of x modulo the ideal I"}
finite_set: {args: [term], returns: prop, meaning: "S is a finite set"}
family_value: {args: [term, term], returns: term, meaning: "member S_i of an indexed family of sets"}
family_union: {args: [term, term], returns: term, meaning: "union of the family U indexed by I"}
singleton_set: {args: [term], returns: term, meaning: "the singleton set containing x"}
set_closure: {args: [term], returns: term, meaning: "topological closure of S"}
algebra_over: {args: [term, term], returns: prop, meaning: "A is an algebra over R"}
algebra_map: {args: [term, term], returns: term, meaning: "structure homomorphism from R to the R-algebra A"}
finite_type_algebra: {args: [term, term], returns: prop, meaning: "the k-algebra R is finitely generated as an algebra, in the order R k"}
integral_element: {args: [term, term], returns: prop, meaning: "x is integral over R, in the order x R"}
integral_extension: {args: [term, term], returns: prop, meaning: "the R-algebra S is integral over R, in the order S R"}
submonoid_of: {args: [term, term], returns: prop, meaning: "M is a multiplicative submonoid of R"}
localization_of: {args: [term, term, term], returns: prop, meaning: "S is the localization of R at the submonoid M, in the order S R M"}
localization_at_prime: {args: [term, term, term], returns: prop, meaning: "S is the localization of R at the prime ideal P, in the order S R P"}
fraction_field_of: {args: [term, term], returns: prop, meaning: "K is a field of fractions of the integral domain A"}
fraction_embedding: {args: [term, term], returns: term, meaning: "canonical map from A into its field of fractions K"}
prime_spectrum: {args: [term], returns: term, meaning: "prime spectrum Spec R with the Zariski topology"}
spectrum_point_ideal: {args: [term], returns: term, meaning: "prime ideal corresponding to a point of the prime spectrum"}
spectrum_zero_locus: {args: [term], returns: term, meaning: "set V(s) of points of the prime spectrum whose ideal contains the subset s"}
module_over: {args: [term, term], returns: prop, meaning: "M is a module over R"}
submodule_of: {args: [term, term], returns: prop, meaning: "N is a submodule of M"}
finitely_generated_module: {args: [term, term], returns: prop, meaning: "M is a finitely generated R-module, in the order R M"}
finitely_generated_submodule: {args: [term], returns: prop, meaning: "the module N is finitely generated"}
ideal_smul_submodule: {args: [term, term], returns: term, meaning: "submodule IN generated by products of I and N"}
smul: {args: [term, term], returns: term, meaning: "scalar multiple a x of a vector x"}
colon_ideal: {args: [term, term], returns: term, meaning: "ideal quotient (I : J) of all r with rJ contained in I, in the order I J"}
minimal_prime_over: {args: [term, term], returns: prop, meaning: "P is minimal among the prime ideals containing the ideal I, in the order P I"}
ideal_height: {args: [term], returns: term, meaning: "height of the prime ideal P"}
all_ideals: {args: [term], returns: term, meaning: "set of all ideals of R"}
ideal_family_inf_over: {args: [term, term], returns: term, meaning: "intersection of the ideals F_i for i in the finite index set s, in the order F s"}
ideal_family_prod_over: {args: [term, term], returns: term, meaning: "product of the ideals F_i for i in the finite index set s, in the order F s"}
product_of_quotients: {args: [term, term, term], returns: term, meaning: "product ring of the quotients R/F_i for i in s, in the order R F s"}
maximal_ideals_of: {args: [term], returns: term, meaning: "set of all maximal ideals of R"}
product_of_residue_fields: {args: [term], returns: term, meaning: "product of the fields R/m over all maximal ideals m of R"}
basic_open: {args: [term], returns: term, meaning: "basic open set D(f) of primes not containing f"}
irreducible_subset: {args: [term], returns: prop, meaning: "the subset Z of a topological space is irreducible"}
algebra_adjoin_element: {args: [term, term], returns: term, meaning: "subalgebra R[x] generated by the element x over R, in the order R x"}
topological_basis: {args: [term, term], returns: prop, meaning: "B is a basis of the topology of X"}
range_of: {args: [term], returns: term, meaning: "range of a map"}
basic_open_family: {args: [term], returns: term, meaning: "set of all basic open subsets D(f) of the prime spectrum of R"}
ideal_generated_by: {args: [term], returns: term, meaning: "ideal generated by a subset of a ring"}
closed_in: {args: [term, term], returns: prop, meaning: "C is a closed subset of the topological space X"}
preimage: {args: [term, term], returns: term, meaning: "inverse image of B under f"}
ring_kernel: {args: [term], returns: term, meaning: "kernel of the ring homomorphism f"}
nilradical_of: {args: [term], returns: term, meaning: "nilradical of the commutative ring R"}
open_in: {args: [term, term], returns: prop, meaning: "U is an open subset of the topological space X"}
homeomorphism: {args: [term, term, term], returns: prop, meaning: "f from X to Y is a homeomorphism"}
ring_quotient_map: {args: [term], returns: term, meaning: "canonical projection onto the quotient by the ideal I"}
zero_module_of: {args: [term], returns: prop, meaning: "the module M has only the zero element"}
module_hom: {args: [term, term, term, term], returns: prop, meaning: "f is an R-linear map from M to N, in the order f R M N"}
injective: {args: [term], returns: prop, meaning: "f is injective"}
localized_map: {args: [term, term], returns: term, meaning: "map of localized modules induced by a linear map f at the submonoid S, in the order f S"}
integrally_closed_domain: {args: [term], returns: prop, meaning: "R is an integral domain integrally closed in its field of fractions"}
flat_module: {args: [term, term], returns: prop, meaning: "M is a flat R-module, in the order R M"}
irreducible_component: {args: [term, term], returns: prop, meaning: "Z is an irreducible component of the topological space X, in the order Z X"}
noetherian_space: {args: [term], returns: prop, meaning: "X is a Noetherian topological space"}
spec_map: {args: [term], returns: term, meaning: "map of prime spectra induced by a ring homomorphism f, sending a prime to its preimage"}
closed_embedding: {args: [term], returns: prop, meaning: "the continuous map f is a closed embedding"}
open_embedding: {args: [term], returns: prop, meaning: "the continuous map f is an open embedding"}
closed_map: {args: [term], returns: prop, meaning: "f sends closed sets to closed sets"}
connected_space: {args: [term], returns: prop, meaning: "X is a nonempty connected topological space"}
localization_away: {args: [term, term, term], returns: prop, meaning: "S is the localization of R at the powers of r, in the order S R r"}
integral_ring_hom: {args: [term], returns: prop, meaning: "every element of the target of the ring homomorphism f is integral over its image"}
localized_module: {args: [term, term], returns: term, meaning: "localization of the module M at the prime ideal p, in the order M p"}
localized_element: {args: [term, term], returns: term, meaning: "image x/1 of the element x in the localization at the prime ideal p, in the order x p"}
prime_complement: {args: [term], returns: term, meaning: "complement of the prime ideal p, as a multiplicative submonoid"}
image_of: {args: [term, term], returns: term, meaning: "image of the set S under f"}
unique_maximal_ideal: {args: [term], returns: term, meaning: "the unique maximal ideal of the local ring R"}
is_field: {args: [term], returns: prop, meaning: "the commutative ring R is a field"}
whole_submodule: {args: [term], returns: term, meaning: "the module M seen as a submodule of itself"}
monic_polynomial: {args: [term], returns: prop, meaning: "the polynomial f is monic"}
poly_degree: {args: [term], returns: term, meaning: "degree of the polynomial f"}
free_module: {args: [term, term], returns: prop, meaning: "M is a free R-module, in the order R M"}
associated_primes: {args: [term, term], returns: term, meaning: "set of associated primes of the R-module M, in the order R M"}
exact_pair: {args: [term, term], returns: prop, meaning: "the composable morphisms f and g satisfy gf = 0 and are exact at the middle object"}
multiset_mem: {args: [term, term], returns: prop, meaning: "x is an element of the finite multiset s"}
multiset_prod: {args: [term], returns: term, meaning: "product of the elements of a finite multiset"}
poly_coeff: {args: [term, term], returns: term, meaning: "coefficient of X^n in the polynomial f"}
module_annihilator: {args: [term, term], returns: term, meaning: "annihilator ideal of the R-module M, in the order R M"}
minimal_primes_of: {args: [term], returns: term, meaning: "set of prime ideals minimal over the ideal I"}
poly_eval: {args: [term, term], returns: term, meaning: "value f(a) of the polynomial f at a"}
finite_ideal_family_inf: {args: [term], returns: term, meaning: "intersection of a finite family of ideals"}
algebraic_over: {args: [term, term], returns: prop, meaning: "the element x is algebraic over the field F"}
ring_krull_dim: {args: [term], returns: term, meaning: "Krull dimension of the ring R"}
algebraically_closed: {args: [term], returns: prop, meaning: "the field K is algebraically closed"}
mv_polynomial_ring: {args: [term, term], returns: term, meaning: "polynomial ring over R in variables indexed by s, in the order s R"}
point_space: {args: [term, term], returns: term, meaning: "set of points with coordinates in K indexed by s, in the order s K"}
mv_eval: {args: [term, term], returns: term, meaning: "value of the polynomial p at the point x, in the order x p"}
valuation_ring: {args: [term], returns: prop, meaning: "R is a valuation ring"}
jacobson_radical: {args: [term], returns: term, meaning: "Jacobson radical of the commutative ring R"}
bijective_map: {args: [term], returns: prop, meaning: "the map is bijective"}
localization_product_map: {args: [term], returns: term, meaning: "canonical map from R to the product of its localizations at all prime ideals"}
discrete_valuation_ring: {args: [term], returns: prop, meaning: "R is a discrete valuation ring"}
irreducible_element: {args: [term, term], returns: prop, meaning: "a is an irreducible element of R"}
dedekind_domain: {args: [term], returns: prop, meaning: "R is a Dedekind domain"}
torsion_submodule: {args: [term, term], returns: term, meaning: "torsion submodule of M over R, in the order R M"}
ideal_family_inter: {args: [term_function], returns: term, meaning: "intersection of a family of ideals indexed by natural numbers"}
adic_complete: {args: [term, term], returns: prop, meaning: "the module M is complete and separated for the I-adic topology, in the order I M"}
polynomial_ring: {args: [term], returns: term, meaning: "polynomial ring R[X] in one variable"}
variable_family: {args: [term], returns: term, meaning: "index set with n variables for a polynomial ring"}
adic_completion_map: {args: [term, term], returns: term, meaning: "map of I-adic completions induced by a linear map f, in the order I f"}
regular_sequence_on: {args: [term, term], returns: prop, meaning: "the list rs is a regular sequence on the module M, including that (rs)M differs from M, in the order rs M"}
list_permutation: {args: [term, term], returns: prop, meaning: "the lists are permutations of each other"}
faithfully_flat: {args: [term, term], returns: prop, meaning: "M is a faithfully flat R-module, in the order R M"}
zero_submodule: {args: [term], returns: term, meaning: "zero submodule of M"}
poly_derivative: {args: [term], returns: term, meaning: "the formal derivative of the polynomial f"}
