# Proposed additive OpenMath vocabulary for ring theory cards (cd=pals2).
comm_ring: {args: [term], returns: prop, meaning: "R is a commutative ring with unity"}
nontrivial_ring: {args: [term], returns: prop, meaning: "R is not the zero ring"}
integral_domain: {args: [term], returns: prop, meaning: "R is an integral domain"}
is_field: {args: [term], returns: prop, meaning: "the commutative ring R is a field"}
euclidean_domain: {args: [term], returns: prop, meaning: "R is a Euclidean domain"}
principal_ideal_domain: {args: [term], returns: prop, meaning: "R is a principal ideal domain"}
unique_factorization_domain: {args: [term], returns: prop, meaning: "R is a unique factorization domain"}
gcd_domain: {args: [term], returns: prop, meaning: "R is an integral domain with greatest common divisors"}
noetherian_ring: {args: [term], returns: prop, meaning: "R is a Noetherian ring"}
reduced_ring: {args: [term], returns: prop, meaning: "R has no nonzero nilpotent elements"}
finite_ring: {args: [term], returns: prop, meaning: "the ring R has finitely many elements"}
infinite_ring: {args: [term], returns: prop, meaning: "the ring R has infinitely many elements"}
ring_hom: {args: [term, term, term], returns: prop, meaning: "f is a ring homomorphism from R to S"}
ring_iso: {args: [term, term, term], returns: prop, meaning: "e is a ring isomorphism from A to B"}
ring_kernel: {args: [term], returns: term, meaning: "kernel of the ring homomorphism f"}
ring_image: {args: [term], returns: term, meaning: "image subring of the ring homomorphism f"}
ring_hom_injective: {args: [term], returns: prop, meaning: "the ring homomorphism f is injective"}
ideal_of: {args: [term, term], returns: prop, meaning: "I is an ideal of R"}
zero_ideal: {args: [term], returns: term, meaning: "the zero ideal of R"}
unit_ideal: {args: [term], returns: term, meaning: "the whole ring R seen as an ideal"}
principal_ideal: {args: [term], returns: term, meaning: "the ideal generated by the element a"}
ideal_sum: {args: [term, term], returns: term, meaning: "sum I + J of two ideals"}
ideal_product: {args: [term, term], returns: term, meaning: "product IJ of two ideals"}
ideal_comap: {args: [term, term], returns: term, meaning: "preimage of the ideal J under the ring homomorphism f"}
ideal_map: {args: [term, term], returns: term, meaning: "ideal generated by the image of I under the ring homomorphism f"}
quotient_ring: {args: [term, term], returns: term, meaning: "quotient ring R/I"}
ring_quotient_map: {args: [term], returns: term, meaning: "canonical projection onto the quotient by the ideal I"}
residue_class: {args: [term, term], returns: term, meaning: "residue class of x modulo the ideal I"}
prime_ideal: {args: [term, term], returns: prop, meaning: "P is a prime ideal of R"}
maximal_ideal: {args: [term, term], returns: prop, meaning: "M is a maximal ideal of R"}
unit_element: {args: [term, term], returns: prop, meaning: "a is a unit of R"}
irreducible_element: {args: [term, term], returns: prop, meaning: "a is an irreducible element of R"}
prime_element: {args: [term, term], returns: prop, meaning: "a is a prime element of R"}
nilpotent_element: {args: [term, term], returns: prop, meaning: "a is a nilpotent element of R"}
int_adjoin_sqrt: {args: [term], returns: term, meaning: "the ring Z[sqrt d]"}
polynomial_ring: {args: [term], returns: term, meaning: "polynomial ring R[X] in one variable"}
poly_var: {args: [], returns: term, meaning: "the indeterminate X of a polynomial ring"}
poly_const: {args: [term], returns: term, meaning: "constant polynomial with value a"}
poly_eval: {args: [term, term], returns: term, meaning: "value f(a) of the polynomial f at a"}
poly_degree: {args: [term], returns: term, meaning: "degree of the polynomial f"}
poly_coeff: {args: [term, term], returns: term, meaning: "coefficient of X^n in the polynomial f"}
poly_leading_coeff: {args: [term], returns: term, meaning: "leading coefficient of the polynomial f"}
poly_map: {args: [term, term], returns: term, meaning: "polynomial obtained by applying the ring homomorphism to the coefficients"}
monic_polynomial: {args: [term], returns: prop, meaning: "f is a monic polynomial"}
primitive_polynomial: {args: [term], returns: prop, meaning: "only units divide all coefficients of f"}
ring_characteristic: {args: [term, term], returns: prop, meaning: "p is the characteristic of the ring R"}
fraction_field_of: {args: [term, term], returns: prop, meaning: "K is a field of fractions of the integral domain A"}
fraction_embedding: {args: [term, term], returns: term, meaning: "canonical map from A into its field of fractions K"}
nilradical_of: {args: [term], returns: term, meaning: "nilradical of the commutative ring R"}
jacobson_radical: {args: [term], returns: term, meaning: "Jacobson radical of the commutative ring R"}
module_over: {args: [term, term], returns: prop, meaning: "M is a module over R"}
submodule_of: {args: [term, term], returns: prop, meaning: "N is a submodule of M"}
finitely_generated_submodule: {args: [term], returns: prop, meaning: "the module N is finitely generated"}
ideal_smul_submodule: {args: [term, term], returns: term, meaning: "submodule IN generated by products of I and N"}
zero_submodule: {args: [term], returns: term, meaning: "zero submodule of M"}
finitely_generated_ideal: {args: [term], returns: prop, meaning: "the ideal I is finitely generated"}
matrix_ring: {args: [term, term], returns: term, meaning: "ring of square matrices over R indexed by n"}
matrix_det: {args: [term], returns: term, meaning: "determinant of the square matrix A"}
ideal_sequence_term: {args: [term, term], returns: term, meaning: "n-th ideal I_n of a sequence of ideals"}
