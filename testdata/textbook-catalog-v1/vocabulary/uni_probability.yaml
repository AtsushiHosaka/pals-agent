# Proposed additive OpenMath vocabulary for undergraduate probability theory (cd=pals2).
adapted_process: {args: [term, term], returns: prop, meaning: "(adapted_process F X): X_n is F_n-measurable for each n"}
ae_eq: {args: [term, term, term], returns: prop, meaning: "(ae_eq mu f g): f equals g almost everywhere with respect to mu"}
ae_iff_mem_limsup: {args: [term, term, term], returns: prop, meaning: "(ae_iff_mem_limsup mu A F): almost surely, the point lies in limsup A_n exactly when the sum over k of E[1_{A_{k+1}} | F_k] diverges to infinity"}
ae_in: {args: [term, term, term], returns: prop, meaning: "(ae_in P X s): X takes values in the set s almost surely under P"}
ae_le: {args: [term, term, term], returns: prop, meaning: "(ae_le mu f g): f is at most g almost everywhere with respect to mu"}
ae_tends_to: {args: [term, term_function, term], returns: prop, meaning: "(ae_tends_to P (lambda (n) Y_n) L): Y_n converges to L almost surely under P"}
bayes_risk: {args: [term, term, term], returns: term, meaning: "(bayes_risk l k m) is the infimum over Markov estimators of the average risk under the loss l, model k and prior m"}
bernoulli_measure: {args: [term], returns: term, meaning: "law on the real line with mass p at 1 and mass 1-p at 0"}
beta_measure: {args: [term, term], returns: term, meaning: "beta distribution with parameters a and b"}
brownian_motion: {args: [term, term], returns: prop, meaning: "(brownian_motion B mu): B is a pre-Brownian motion with almost surely continuous paths"}
cdf_of: {args: [term, term], returns: term, meaning: "(cdf_of mu x) is the distribution function mu((-infinity, x]) at x"}
char_fun: {args: [term, term], returns: term, meaning: "(char_fun mu t) is the characteristic function of mu at t, the integral of exp(i<x,t>)"}
char_fun_function: {args: [term], returns: term, meaning: "the characteristic function of mu as a function of t"}
closed_interval: {args: [term, term], returns: term, meaning: "closed interval [a, b] of real numbers"}
complex_conj: {args: [term], returns: term, meaning: "complex conjugate of z"}
complex_i: {args: [], returns: term, meaning: "the imaginary unit i of the complex numbers"}
cond_expectation: {args: [term, term, term], returns: term, meaning: "(cond_expectation P X G) is the conditional expectation E[X|G]"}
cond_prob: {args: [term, term, term], returns: term, meaning: "(cond_prob P B A) is the conditional probability P(B|A)"}
cond_variance: {args: [term, term, term], returns: term, meaning: "(cond_variance mu X G) is E[(X - E[X|G])^2 | G]"}
cont_diff: {args: [term, term], returns: prop, meaning: "f is of class C^k; arguments k, f"}
continuous_on_set: {args: [term, term], returns: prop, meaning: "f is continuous on the set S"}
convex_on_set: {args: [term, term], returns: prop, meaning: "(convex_on_set g s): g is convex on the set s"}
coordinate_rv: {args: [term], returns: term, meaning: "the coordinate function x -> x_i viewed as a random variable"}
covariance: {args: [term, term, term], returns: term, meaning: "(covariance P X Y) is the covariance of X and Y under P"}
dot_product: {args: [term, term], returns: term, meaning: "standard dot product of coordinate vectors"}
euclidean_space: {args: [term], returns: term, meaning: "n-dimensional Euclidean space"}
event_in_sigma: {args: [term, term], returns: prop, meaning: "(event_in_sigma A G): the set A is measurable with respect to the sigma-algebra G"}
expectation: {args: [term, term], returns: term, meaning: "(expectation P X) is the expectation of X under P"}
exponential_measure: {args: [term], returns: term, meaning: "exponential distribution with rate r"}
factorial: {args: [term], returns: term, meaning: "factorial n!"}
falling_factorial: {args: [term, term], returns: term, meaning: "falling factorial n(n-1)...(n-k+1), the number of k-permutations of n objects"}
fd_inner_product_space: {args: [term, term], returns: prop, meaning: "E is a finite-dimensional inner product space over K, where K is R or C (arguments K, E)"}
filtration_limit: {args: [term], returns: term, meaning: "the sigma-algebra generated by all F_n"}
filtration_of: {args: [term], returns: prop, meaning: "F is a filtration indexed by the natural numbers"}
finite_kernel: {args: [term], returns: prop, meaning: "k is a finite kernel"}
finite_measure: {args: [term], returns: prop, meaning: "mu is a finite measure"}
finite_set: {args: [term], returns: prop, meaning: "S is a finite set"}
fn_limit_at_bot: {args: [term_function, term], returns: prop, meaning: "f(x) tends to L as x tends to minus infinity; arguments f, L"}
fn_limit_at_top: {args: [term_function, term], returns: prop, meaning: "f(x) tends to L as x tends to plus infinity; arguments f, L"}
fn_monotone: {args: [term_function], returns: prop, meaning: "f is nondecreasing on the whole real line"}
gamma_fn: {args: [term], returns: term, meaning: "Euler gamma function Gamma(s)"}
gamma_measure: {args: [term, term], returns: term, meaning: "gamma distribution with shape a and rate r, in the order (a, r)"}
gaussian_measure: {args: [term, term], returns: term, meaning: "(gaussian_measure m v) is the real normal distribution with mean m and variance v"}
gaussian_process: {args: [term, term], returns: prop, meaning: "(gaussian_process X mu): all finite-dimensional laws of X under mu are Gaussian"}
fn_superlevel_set: {args: [term, term], returns: term, meaning: "the set of x with e <= f(x)"}
generated_sigma: {args: [term], returns: term, meaning: "sigma-algebra generated by the family of sets p"}
geometric_measure: {args: [term], returns: term, meaning: "geometric distribution on the natural numbers with success probability p, counting failures before the first success"}
half_line_right: {args: [term], returns: term, meaning: "half line [a, infinity)"}
has_law: {args: [term, term, term], returns: prop, meaning: "(has_law P X m): X has law m under P"}
hitting_time_after: {args: [term, term, term], returns: term, meaning: "(hitting_time_after X B n) is the first k >= n with X_k in B, and infinity if there is none"}
identity_rv: {args: [], returns: term, meaning: "the identity map viewed as a random variable on the real line"}
increasing_ae: {args: [term, term], returns: prop, meaning: "(increasing_ae mu A): almost surely n -> A_n is nondecreasing"}
indep_rv: {args: [term, term, term], returns: prop, meaning: "(indep_rv P X Y): random variables X and Y are independent under P"}
indep_shift_past: {args: [term, term, term], returns: prop, meaning: "(indep_shift_past B s mu): the process t -> B(s+t) - B(s) is independent of (B_u, u <= s) under mu"}
indep_sigma: {args: [term, term, term], returns: prop, meaning: "(indep_sigma P G H): sigma-algebras G and H are independent under P"}
independent_increments_on: {args: [term, term, term], returns: prop, meaning: "(independent_increments_on B mu t): the increments of B along the monotone finite sequence t are mutually independent under mu"}
integrable_rv: {args: [term, term], returns: prop, meaning: "(integrable_rv X P): X is integrable under P"}
integral_real_line: {args: [term_function], returns: term, meaning: "integral of f over the whole real line"}
integrated_min_posterior_loss: {args: [term, term, term], returns: term, meaning: "(integrated_min_posterior_loss l k m) is the integral over the marginal of the data of the infimum over actions y of the posterior expected loss of y"}
iterated_deriv: {args: [term_function, term, term], returns: term, meaning: "n-th derivative of f evaluated at x; arguments f, n, x"}
jointly_gaussian: {args: [term, term, term], returns: prop, meaning: "(jointly_gaussian mu X Y): the pair (X, Y) has a Gaussian law under mu"}
kernel_apply: {args: [term, term, term], returns: term, meaning: "(kernel_apply k a s) is the mass k(a, s)"}
kernel_comp: {args: [term, term], returns: term, meaning: "(kernel_comp h k) is the composition taking a to the integral of h(b, -) against k(a, db)"}
kernel_detailed_balance: {args: [term, term], returns: prop, meaning: "(kernel_detailed_balance k m): the integral of k(x,B) over A against m equals the integral of k(x,A) over B against m, for all measurable A and B"}
kernel_lintegral_apply: {args: [term, term, term, term], returns: term, meaning: "(kernel_lintegral_apply h k a s) is the integral of h(b, s) against k(a, db)"}
l1_tends_to: {args: [term, term_function, term], returns: prop, meaning: "(l1_tends_to mu (lambda (n) Y_n) L): E|Y_n - L| tends to 0"}
law_of: {args: [term, term], returns: term, meaning: "(law_of mu X) is the image measure of mu under X"}
limsup_events: {args: [term], returns: term, meaning: "limsup of a sequence of events: the event that infinitely many occur"}
linear_isometry_equiv_of: {args: [term, term], returns: prop, meaning: "f is a surjective linear isometry of the real inner product space E onto itself, in the order (f, E)"}
little_o_at: {args: [term_function, term_function, term], returns: prop, meaning: "f is little-o of g as the variable tends to a; arguments f, g, a"}
lp_norm: {args: [term, term, term], returns: term, meaning: "L^p(mu) norm of f"}
map_compose: {args: [term, term], returns: term, meaning: "composite g after f of two maps, in the order g f"}
markov_kernel: {args: [term], returns: prop, meaning: "k is a Markov kernel"}
martingale: {args: [term, term, term], returns: prop, meaning: "(martingale P X F): X is a martingale for the filtration F under P"}
matrix_entry: {args: [term, term, term], returns: term, meaning: "entry of A in row i and column j, in the order (A, i, j)"}
matrix_quadratic_form: {args: [term, term], returns: term, meaning: "(matrix_quadratic_form S t) is the value t^T S t"}
matrix_transpose: {args: [term], returns: term, meaning: "transpose of a matrix"}
matrix_vector: {args: [term, term], returns: term, meaning: "matrix A applied to the coordinate vector x (arguments A, x)"}
measurable_event: {args: [term], returns: prop, meaning: "A is a measurable set of the sample space"}
measurable_map: {args: [term], returns: prop, meaning: "f is a measurable map"}
measurable_set: {args: [term], returns: prop, meaning: "A is a measurable set"}
measurable_uncurried_loss: {args: [term], returns: prop, meaning: "the loss l is jointly measurable"}
measurable_wrt: {args: [term, term], returns: prop, meaning: "(measurable_wrt X G): X is strongly measurable with respect to G"}
measure_bind: {args: [term, term], returns: term, meaning: "(measure_bind m k) is the measure taking s to the integral of k(x, s) against m(dx)"}
measure_comp_prod: {args: [term, term], returns: term, meaning: "(measure_comp_prod m k) is the joint law on pairs (x,y) with x from m and y from k(x, -)"}
measures_tend_weakly: {args: [term, term], returns: prop, meaning: "the sequence of probability measures m converges weakly to mu"}
mgf: {args: [term, term, term], returns: term, meaning: "(mgf P X t) is the moment generating function E[exp(tX)]"}
min_of: {args: [term, term], returns: term, meaning: "minimum of a and b"}
monotone_finite_times: {args: [term], returns: prop, meaning: "t is a nondecreasing finite sequence of nonnegative times"}
multivariate_gaussian: {args: [term, term], returns: term, meaning: "Gaussian measure on R^n with mean m and covariance matrix S, in the order (m, S)"}
mutually_indep_events: {args: [term, term], returns: prop, meaning: "(mutually_indep_events P A): the family of events A is mutually independent under P"}
mutually_indep_rv: {args: [term, term], returns: prop, meaning: "(mutually_indep_rv P X): the family of random variables X is mutually independent under P"}
norm: {args: [term], returns: term, meaning: "norm of a vector"}
open_half_line_right: {args: [term], returns: term, meaning: "open half-line from a to plus infinity"}
pairwise_indep_rv: {args: [term, term], returns: prop, meaning: "(pairwise_indep_rv P X): the family of random variables X is pairwise independent under P"}
partial_sum_rv: {args: [term, term], returns: term, meaning: "(partial_sum_rv X n) is the random variable X_0 + ... + X_{n-1}"}
pi_system: {args: [term], returns: prop, meaning: "the family of sets p is closed under finite nonempty intersections"}
pointwise_max: {args: [term, term], returns: term, meaning: "pointwise maximum of two random times"}
pointwise_min: {args: [term, term], returns: term, meaning: "pointwise minimum of two random times"}
poisson_measure: {args: [term], returns: term, meaning: "Poisson distribution with parameter r"}
positive_infinity: {args: [], returns: term, meaning: "the extended real value +infinity"}
positive_part_rv: {args: [term], returns: term, meaning: "pointwise positive part max(X, 0) of a random variable"}
positive_semidefinite_matrix: {args: [term], returns: prop, meaning: "the real symmetric matrix is positive semidefinite"}
posterior_kernel: {args: [term, term], returns: term, meaning: "(posterior_kernel k m) is the Bayesian posterior of the model k under the prior m"}
pre_brownian_motion: {args: [term, term], returns: prop, meaning: "(pre_brownian_motion B mu): B on [0,infinity) has the centered Gaussian finite-dimensional laws with covariance min(s,t), with no path regularity required"}
predictable_process: {args: [term, term], returns: prop, meaning: "(predictable_process F A): A_{n+1} is F_n-measurable for each n"}
prob: {args: [term, term], returns: term, meaning: "(prob P A) is the probability P(A)"}
probability_measure: {args: [term], returns: prop, meaning: "P is a probability measure"}
prod_over: {args: [term, term_function], returns: term, meaning: "finite product of the indexed expression over the finite set S"}
product_measure_family: {args: [term, term], returns: term, meaning: "(product_measure_family I m) is the product over the finite index set I of copies of the measure m"}
restricted_expectation: {args: [term, term, term], returns: term, meaning: "(restricted_expectation mu X A) is the integral of X over the event A"}
right_continuous_real_fn: {args: [term_function], returns: prop, meaning: "the real function is right-continuous at every point"}
running_max: {args: [term, term], returns: term, meaning: "(running_max X n) is the maximum of X_0, ..., X_n"}
scaled_process: {args: [term, term], returns: term, meaning: "(scaled_process B c) is the process t -> B(ct) / sqrt(c)"}
series_has_sum: {args: [term_function, term], returns: prop, meaning: "the series over natural numbers n of g(n) converges unconditionally to s"}
shifted_process: {args: [term, term], returns: term, meaning: "(shifted_process B s) is the process t -> B(s+t) - B(s)"}
sigma_of_family: {args: [term, term], returns: term, meaning: "(sigma_of_family X S) is the sigma-algebra generated by X_i for i in S"}
sigma_of_rv: {args: [term], returns: term, meaning: "sigma-algebra generated by the random variable X"}
singleton_set: {args: [term], returns: term, meaning: "the singleton set containing x"}
square_integrable_rv: {args: [term, term], returns: prop, meaning: "(square_integrable_rv X P): X has a finite second moment under P"}
standard_borel_nonempty: {args: [term], returns: prop, meaning: "T is a nonempty standard Borel space"}
std_gaussian: {args: [term], returns: term, meaning: "standard Gaussian measure on the finite-dimensional real inner product space E"}
stopped_process: {args: [term, term], returns: term, meaning: "(stopped_process X t) is the process n -> X at the minimum of n and t"}
stopped_sigma: {args: [term, term], returns: term, meaning: "(stopped_sigma F t) is the sigma-algebra of events before the stopping time t"}
stopped_value: {args: [term, term], returns: term, meaning: "(stopped_value X t) is the random variable X_t"}
stopping_time: {args: [term, term], returns: prop, meaning: "(stopping_time F t): t takes values in the natural numbers and infinity and {t <= n} is F_n-measurable for each n"}
sub_sigma_algebra: {args: [term], returns: prop, meaning: "G is a sub-sigma-algebra of the ambient sigma-algebra"}
subgaussian_mgf: {args: [term, term, term], returns: prop, meaning: "(subgaussian_mgf X c mu): E[exp(tX)] is finite and at most exp(c t^2 / 2) for every real t"}
sublevel_event: {args: [term, term], returns: term, meaning: "(sublevel_event X x) is the event {X <= x}"}
submartingale: {args: [term, term, term], returns: prop, meaning: "(submartingale P X F): X is a submartingale for the filtration F under P"}
sum_prob_series: {args: [term, term], returns: term, meaning: "(sum_prob_series mu A) is the sum in [0, infinity] of mu(A_n) over n"}
supermartingale: {args: [term, term, term], returns: prop, meaning: "(supermartingale mu X F): X is a supermartingale for the filtration F under mu"}
swap_image: {args: [term], returns: term, meaning: "image of a measure on pairs under (x,y) -> (y,x)"}
tail_sigma: {args: [term], returns: term, meaning: "tail sigma-algebra of the sequence X, the intersection over n of sigma(X_k, k >= n)"}
tends_to_at_top: {args: [term_function, term], returns: prop, meaning: "the real sequence given by the function tends to L as n tends to infinity"}
transform_process: {args: [term, term], returns: term, meaning: "(transform_process A X) is the process n -> sum over k < n of A_{k+1} (X_{k+1} - X_k)"}
uniform_interval_measure: {args: [term, term], returns: term, meaning: "uniform distribution on the closed interval [a,b]"}
uniformly_integrable_family: {args: [term, term], returns: prop, meaning: "(uniformly_integrable_family X mu): the sequence X is uniformly integrable in L1 under mu"}
upcrossings_before: {args: [term, term, term, term], returns: term, meaning: "(upcrossings_before a b X k) is the number of upcrossings of [a,b] completed by the path X before time k"}
variance: {args: [term, term], returns: term, meaning: "(variance P X) is the variance of X under P"}
