complete_space: {args: [term], returns: prop, meaning: "X is a complete metric space"}
complex_banach_algebra: {args: [term], returns: prop, meaning: "A is a complete normed unital complex algebra"}
complex_imaginary_unit: {args: [], returns: term, meaning: "the imaginary unit i"}
