banach_algebra: {args: [term], returns: prop, meaning: "A is a complete normed unital ring or algebra"}
banach_space: {args: [term], returns: prop, meaning: "E is a Banach space"}
bijective_on: {args: [term, term, term], returns: prop, meaning: "f is a bijection from E to F"}
