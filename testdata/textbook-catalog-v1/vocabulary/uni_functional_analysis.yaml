# Proposed additive OpenMath vocabulary for university functional analysis (cd=pals2).
additive_haar_measure: {args: [term, term], returns: prop, meaning: "m is an additive Haar measure on the finite-dimensional real normed space E, in the order m E"}
adjoint: {args: [term], returns: term, meaning: "Hilbert space adjoint of a bounded operator"}
