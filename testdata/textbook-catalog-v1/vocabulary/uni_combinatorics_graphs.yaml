# Proposed additive OpenMath vocabulary for university combinatorics and graph theory.
add_comm_monoid: {args: [term], returns: prop, meaning: "M is a commutative monoid written additively"}
abelian_group: {args: [term], returns: prop, meaning: "G is an abelian group"}
additive_energy: {args: [term, term], returns: term, meaning: "number of quadruples (a,a',b,b') in s x s x t x t with a + b = a' + b', in the order s t"}
bell_number: {args: [term], returns: term, meaning: "n-th Bell number, defined by B_0 = 1 and B_(n+1) = sum_i C(n,i) B_(n-i)"}
binary_trees_with_nodes: {args: [term], returns: term, meaning: "set of rooted binary trees with exactly n internal nodes"}
binom: {args: [term, term], returns: term, meaning: "binomial coefficient n choose k"}
catalan_number: {args: [term], returns: term, meaning: "n-th Catalan number defined by the convolution recurrence"}
cayley_graph: {args: [term, term], returns: term, meaning: "Cayley graph of the group M with respect to s, with x adjacent to y when x differs from y and x^-1 y or y^-1 x lies in s"}
chromatic_number: {args: [term], returns: term, meaning: "least number of colors of a proper vertex coloring of G"}
colex_initial_segment: {args: [term, term], returns: prop, meaning: "the family is an initial segment of the colexicographic order on the r-element sets, in the order F r"}
colex_lt: {args: [term, term], returns: prop, meaning: "s precedes t in colexicographic order, that is the maximum of the symmetric difference lies in t"}
comm_ring: {args: [term], returns: prop, meaning: "R is a commutative ring with unity"}
comm_semiring: {args: [term], returns: prop, meaning: "R is a commutative semiring"}
complete_graph_on: {args: [term], returns: term, meaning: "complete graph on the vertex set V"}
component_count: {args: [term], returns: term, meaning: "number of connected components of a finite graph"}
compositions_of: {args: [term], returns: term, meaning: "set of ordered sequences of positive integers with sum n"}
cycle_graph: {args: [term], returns: term, meaning: "graph on Z/nZ with i adjacent to i+1 and i-1 when these differ from i"}
derangement_number: {args: [term], returns: term, meaning: "number of fixed-point-free permutations of an n-element set"}
difference_set: {args: [term, term], returns: term, meaning: "difference set A - B of two finite subsets of an additive group"}
dot_product: {args: [term, term], returns: term, meaning: "standard dot product of coordinate vectors"}
down_compression: {args: [term, term], returns: term, meaning: "down-compression of a family F along an element a, in the order a F"}
dyck_concat: {args: [term, term], returns: term, meaning: "concatenation of two Dyck words"}
dyck_nest: {args: [term], returns: term, meaning: "the Dyck word U p D obtained by enclosing the word p"}
dyck_semilength: {args: [term], returns: term, meaning: "number of up-steps of a Dyck word"}
dyck_word: {args: [term], returns: prop, meaning: "p is a Dyck word"}
dyck_words: {args: [term], returns: term, meaning: "set of Dyck words with n up-steps and n down-steps"}
edge_density: {args: [term, term, term], returns: term, meaning: "edge density of the pair of vertex sets, the number of edges between s and t divided by |s||t|, and 0 when s or t is empty, in the order G s t"}
edge_difference_square_sum: {args: [term, term], returns: term, meaning: "sum over the edges uv of G of (x_u - x_v)^2, in the order G x"}
factorial: {args: [term], returns: term, meaning: "factorial n!"}
family_differences: {args: [term, term], returns: term, meaning: "family of all differences a minus b for a in F and b in G"}
family_joins: {args: [term, term], returns: term, meaning: "family of all unions of a in F with b in G"}
family_meets: {args: [term, term], returns: term, meaning: "family of all intersections of a in F with b in G"}
family_slice: {args: [term, term], returns: term, meaning: "subfamily of the members of F with exactly r elements, in the order F r"}
finite_coloring: {args: [term, term, term], returns: prop, meaning: "c is a coloring of the set X by the finite set k, in the order c X k"}
finite_simple_graph: {args: [term], returns: prop, meaning: "G is a simple graph on a finite vertex set"}
finset_range: {args: [term], returns: term, meaning: "the index set {0, ..., n-1}"}
formal_power_series_mk: {args: [term_function], returns: term, meaning: "formal power series with the given coefficient function"}
generated_subgroup: {args: [term], returns: term, meaning: "subgroup generated by a set of elements"}
graph_acyclic: {args: [term], returns: prop, meaning: "G has no cycle"}
graph_adjacency_matrix: {args: [term], returns: term, meaning: "adjacency matrix of a finite simple graph"}
graph_adjacent: {args: [term, term, term], returns: prop, meaning: "u and v are adjacent in G"}
graph_bipartite_with: {args: [term, term, term], returns: prop, meaning: "s and t are disjoint and every edge of G joins s to t, in the order G s t"}
graph_bridge: {args: [term, term, term], returns: prop, meaning: "uv is an edge of G whose removal disconnects u from v, in the order G u v"}
graph_clique: {args: [term, term], returns: prop, meaning: "the vertices in s are pairwise adjacent in G, in the order G s"}
graph_clique_free: {args: [term, term], returns: prop, meaning: "G contains no clique on k vertices"}
graph_colorable: {args: [term, term], returns: prop, meaning: "G has a proper vertex coloring with k colors"}
graph_complement: {args: [term], returns: term, meaning: "complement of a simple graph"}
graph_connected: {args: [term], returns: prop, meaning: "G is connected and has a vertex"}
graph_cycle: {args: [term, term, term], returns: prop, meaning: "p is a cycle at a in G, in the order p G a"}
graph_degree: {args: [term, term], returns: term, meaning: "degree of vertex v in G"}
graph_edge_on_cycle: {args: [term, term, term], returns: prop, meaning: "the edge uv lies on some cycle of G, in the order G u v"}
graph_edges: {args: [term], returns: term, meaning: "edge set of a graph"}
graph_isomorphic: {args: [term, term], returns: prop, meaning: "the two simple graphs are isomorphic"}
graph_laplacian_matrix: {args: [term], returns: term, meaning: "Laplacian matrix D - A of a finite simple graph"}
graph_max_degree: {args: [term], returns: term, meaning: "maximum degree of a finite graph, 0 for the empty vertex set"}
graph_min_degree: {args: [term], returns: term, meaning: "minimum degree of a finite graph, 0 for the empty vertex set"}
graph_path: {args: [term, term, term, term], returns: prop, meaning: "p is a path from u to v in G"}
graph_reachable: {args: [term, term, term], returns: prop, meaning: "there is a walk from u to v in G, in the order G u v"}
graph_regular: {args: [term, term], returns: prop, meaning: "every vertex of G has degree k, in the order G k"}
graph_trail: {args: [term, term, term, term], returns: prop, meaning: "p is a walk from u to v in G with no repeated edge, in the order p G u v"}
graph_tree: {args: [term], returns: prop, meaning: "G is a tree"}
graph_triangles: {args: [term], returns: term, meaning: "set of triangles, the 3-cliques, of a simple graph"}
graph_vertices: {args: [term], returns: term, meaning: "vertex set of a graph"}
graph_walk: {args: [term, term, term, term], returns: prop, meaning: "p is a walk from u to v in G, in the order p G u v"}
group: {args: [term], returns: prop, meaning: "G is a group"}
hales_jewett_dimension: {args: [term, term, term], returns: prop, meaning: "the finite index set i is such that every coloring of the words over the finite alphabet a by the finite set k has a monochromatic combinatorial line, in the order a k i"}
hamiltonian_cycle: {args: [term, term, term], returns: prop, meaning: "p is a cycle at a in G visiting every vertex, in the order p G a"}
has_perfect_matching: {args: [term], returns: prop, meaning: "G has a set of edges covering each vertex exactly once"}
independence_number: {args: [term], returns: term, meaning: "largest size of a set of pairwise nonadjacent vertices of G"}
integer_range: {args: [term, term], returns: term, meaning: "set of integers k with a <= k <= b"}
intersecting_family: {args: [term], returns: prop, meaning: "any two members of the family, possibly equal, have a common element"}
iterated_shadow: {args: [term, term], returns: term, meaning: "the i-th iterated lower shadow of a family, in the order i F"}
iterated_sumset: {args: [term, term], returns: term, meaning: "n-fold sumset nB of a finite subset B, with 0B = {0}, in the order n B"}
locally_linear_graph: {args: [term], returns: prop, meaning: "every edge of the graph lies in exactly one triangle"}
lower_family: {args: [term], returns: prop, meaning: "the family of sets is closed under taking subsets"}
matrix_entry: {args: [term, term, term], returns: term, meaning: "entry of A in row i and column j, in the order (A, i, j)"}
matrix_trace: {args: [term], returns: term, meaning: "trace of a square matrix"}
matrix_vector_mul: {args: [term, term], returns: term, meaning: "matrix-vector product Ax"}
max_of: {args: [term, term], returns: term, meaning: "maximum of two real numbers"}
min_of: {args: [term, term], returns: term, meaning: "minimum of a and b"}
multiset_member: {args: [term, term], returns: prop, meaning: "a occurs in the multiset m, in the order a m"}
multiset_multiplicity_factorial_prod: {args: [term], returns: term, meaning: "product over the distinct values i of the multiset m of the factorial of the multiplicity of i"}
multiset_prod: {args: [term], returns: term, meaning: "product of the elements of a finite multiset"}
multiset_sum: {args: [term], returns: term, meaning: "sum of the entries of a finite multiset of natural numbers"}
neighbor_union_size_at_least: {args: [term], returns: prop, meaning: "every vertex set S of G satisfies |S| <= |N(S)|, N(S) being the union of the neighborhoods"}
numberings_with_prefix: {args: [term, term], returns: term, meaning: "bijections f from X to {0,...,|X|-1} under which s is exactly the set of elements with f(a) < |s|, in the order X s"}
odd_component_count_after_removal: {args: [term, term], returns: term, meaning: "number of connected components with an odd number of vertices of G minus the vertex set U, in the order G U"}
ordered_abelian_group: {args: [term], returns: prop, meaning: "G is a linearly ordered abelian group"}
partition_count_series_restricted: {args: [term], returns: term, meaning: "power series over Z whose coefficient of X^n is the number of partitions of n with all parts satisfying the predicate p"}
partition_euler_factor_product_tends_to: {args: [term, term], returns: prop, meaning: "the coefficientwise convergent infinite product over i >= 1 of the factors sum_j X^(ij), for p(i), and 1 otherwise, has the power series f as limit, in the order p f"}
partition_part_count: {args: [term], returns: term, meaning: "number of parts of a finite partition"}
partitions_distinct_parts: {args: [term], returns: term, meaning: "set of partitions of n whose parts are pairwise distinct"}
partitions_multiplicity_below: {args: [term, term], returns: term, meaning: "set of partitions of n in which every part occurs fewer than m times, in the order n m"}
partitions_no_part_divisible: {args: [term, term], returns: term, meaning: "set of partitions of n with no part divisible by m, in the order n m"}
partitions_odd_parts: {args: [term], returns: term, meaning: "set of partitions of n all of whose parts are odd"}
pentagonal_number: {args: [term], returns: term, meaning: "generalized pentagonal number k(3k-1)/2 for an integer k"}
perm_of_cycle_type: {args: [term, term], returns: term, meaning: "set of permutations of the finite set A whose cycle lengths at least 2 form the multiset m, in the order A m"}
positive_semidefinite_matrix: {args: [term], returns: prop, meaning: "the real symmetric matrix is positive semidefinite"}
power_series_coeff: {args: [term, term], returns: term, meaning: "coefficient of X^n in the formal power series f, in the order f n"}
power_series_const: {args: [term], returns: term, meaning: "constant formal power series with value a"}
power_series_derivative: {args: [term], returns: term, meaning: "the formal derivative of the power series f"}
power_series_exp: {args: [term], returns: term, meaning: "the exponential power series with coefficients 1/n! over the Q-algebra A"}
power_series_rescale: {args: [term, term], returns: term, meaning: "the power series f(aX) obtained by replacing X with aX, in the order a f"}
powerset: {args: [term], returns: term, meaning: "set of all subsets of A"}
real_kernel_dimension: {args: [term], returns: term, meaning: "dimension over the reals of the kernel of a real square matrix"}
regular_partition: {args: [term, term, term], returns: prop, meaning: "P is an equipartition of the vertices of G such that all but an e fraction of pairs of parts are e-uniform, in the order P G e"}
semistandard_tableau: {args: [term, term], returns: prop, meaning: "T is a semistandard filling of the Young diagram m by natural numbers, in the order T m"}
set_shadow: {args: [term], returns: term, meaning: "lower shadow of a family of sets, all sets obtained from a member by removing one element"}
shatterer: {args: [term], returns: term, meaning: "family of all sets shattered by F"}
shatters: {args: [term, term], returns: prop, meaning: "every subset of s has the form s intersected with a member of F, in the order F s"}
simple_graph: {args: [term], returns: prop, meaning: "G is a finite or infinite simple graph"}
stirling_first: {args: [term, term], returns: term, meaning: "unsigned Stirling number of the first kind c(n,k), defined by c(n+1,k+1) = n c(n,k+1) + c(n,k)"}
stirling_second: {args: [term, term], returns: term, meaning: "Stirling number of the second kind S(n,k), defined by S(n+1,k+1) = (k+1) S(n,k+1) + S(n,k)"}
subgraph_of: {args: [term, term], returns: prop, meaning: "H is a subgraph of G on the same vertex set, in the order H G"}
subset_antichain: {args: [term, term], returns: prop, meaning: "the family F of subsets of X is an antichain under inclusion"}
sumset: {args: [term, term], returns: term, meaning: "sumset A + B of two finite subsets of an additive group or semigroup"}
szemeredi_bound: {args: [term, term], returns: term, meaning: "the tower-type upper bound on the number of parts in the regularity lemma, in the order e l"}
tableau_entry: {args: [term, term, term], returns: term, meaning: "entry of the tableau T in row i and column j, in the order T i j"}
tends_to_at_top: {args: [term_function, term], returns: prop, meaning: "the real sequence given by the function tends to L as n tends to infinity"}
three_ap_free: {args: [term], returns: prop, meaning: "the set of natural numbers contains no three-term arithmetic progression with nonzero difference"}
trail_incident_edge_count: {args: [term, term], returns: term, meaning: "number of edges of the walk p containing the vertex x, in the order p x"}
triangle_removal_constant: {args: [term], returns: term, meaning: "the positive constant in the triangle removal lemma depending on e"}
turan_graph: {args: [term, term], returns: term, meaning: "Turan graph on {0,...,n-1} with i, j adjacent exactly when their residues mod r differ, in the order n r"}
turan_maximal: {args: [term, term], returns: prop, meaning: "G has no clique on r+1 vertices and the largest edge count among such graphs on its vertex set, in the order G r"}
uniform_family: {args: [term, term], returns: prop, meaning: "every member of the family F has exactly r elements, in the order F r"}
uniform_pair: {args: [term, term, term, term], returns: prop, meaning: "the pair of vertex sets s, t is e-uniform in the graph G, in the order G e s t"}
upper_family: {args: [term, term], returns: prop, meaning: "the family of subsets of X is closed under taking supersets within X, in the order F X"}
vc_dimension: {args: [term], returns: term, meaning: "largest size of a set shattered by F, and 0 for the empty family"}
walk_length: {args: [term], returns: term, meaning: "number of edges of a walk"}
walk_support: {args: [term], returns: term, meaning: "set of vertices visited by a walk"}
walks_of_length: {args: [term, term, term, term], returns: term, meaning: "set of walks of length n from u to v in G, in the order G u v n"}
word_first_letter: {args: [term], returns: term, meaning: "first letter of a nonempty word"}
word_last_letter: {args: [term], returns: term, meaning: "last letter of a nonempty word"}
young_col_length: {args: [term, term], returns: term, meaning: "number of cells in column j of the Young diagram m, in the order m j"}
young_diagram: {args: [term], returns: prop, meaning: "m is a Young diagram, a finite lower set of cells in N x N"}
young_row_length: {args: [term, term], returns: term, meaning: "number of cells in row i of the Young diagram m, in the order m i"}
young_transpose: {args: [term], returns: term, meaning: "conjugate Young diagram obtained by swapping rows and columns"}
zmod_ring: {args: [term], returns: term, meaning: "the ring Z/nZ of integers modulo n, with Z/0Z equal to Z"}
dyck_up_step: {args: [], returns: term, meaning: "the up-step letter of a Dyck word"}
dyck_down_step: {args: [], returns: term, meaning: "the down-step letter of a Dyck word"}
empty_dyck_word: {args: [], returns: term, meaning: "the empty Dyck word"}
power_series_x: {args: [], returns: term, meaning: "the formal power series indeterminate X"}
family_value: {args: [term, term], returns: term, meaning: "member S_i of an indexed family of sets"}
indexed_union_over: {args: [term, term], returns: term, meaning: "union of the members S_i for i in I"}
algebra_over: {args: [term, term], returns: prop, meaning: "A is an algebra over R"}
