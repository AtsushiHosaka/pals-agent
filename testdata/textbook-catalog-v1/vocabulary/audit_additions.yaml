# New pals2 symbols needed by the validated patches (audit 2026-11-03). Copy to vocabulary/audit_additions.yaml.
logb:
  args: [term, term]
  returns: term
  meaning: logarithm of x to base a, argument order (a, x)
module_zero:
  args: [term]
  returns: term
  meaning: zero element of the module M
module_smul:
  args: [term, term]
  returns: term
  meaning: scalar multiple r x in a module
ideal_mul:
  args: [term, term]
  returns: term
  meaning: product ideal IJ
proposition_holds:
  args: [term]
  returns: prop
  meaning: the propositional variable P is true
ae_measurable_fn:
  args: [term, term]
  returns: prop
  meaning: f is almost-everywhere measurable with respect to the measure mu
monoid:
  args: [term]
  returns: prop
  meaning: G is a monoid
has_homology:
  args: [term, term]
  returns: prop
  meaning: the complex K has homology in degree i
ordinal_add:
  args: [term, term]
  returns: term
  meaning: ordinal sum a + b, which is not commutative
cardinal_add:
  args: [term, term]
  returns: term
  meaning: cardinal sum a + b
cardinal_mul:
  args: [term, term]
  returns: term
  meaning: cardinal product a * b
cardinal_pow:
  args: [term, term]
  returns: term
  meaning: cardinal exponentiation a to the power b
canonical_ring_hom:
  args: [term, term]
  returns: term
  meaning: the canonical ring homomorphism from R to S
aut_group_over:
  args: [term, term]
  returns: term
  meaning: group of automorphisms of the field extension E over F
euclidean_ambient_dimension:
  args: [term]
  returns: prop
  meaning: the ambient Euclidean space has dimension n
transvection_product:
  args: [term]
  returns: prop
  meaning: the matrix is a product of transvections
real_tends_to:
  args: [term_function, term]
  returns: prop
  meaning: the real sequence n to a_n given by a function tends to r
ring_product:
  args: [term, term]
  returns: term
  meaning: product ring R times S
power_series_var:
  args: [term]
  returns: term
  meaning: the indeterminate X of the formal power series ring over S
smooth_manifold_modeled_on:
  args: [term, term]
  returns: prop
  meaning: M is a smooth manifold modeled on the vector space E
prime_power_cyclic_sum_family:
  args: [term, term, term]
  returns: term
  meaning: direct sum of the cyclic groups Z/p_i^(e_i) for i below k
hom_post_compose:
  args: [term, term]
  returns: term
  meaning: the map k to f after k between Hom(X, A) and Hom(X, B)
formal_power_series_over:
  args: [term, term_function]
  returns: term
  meaning: formal power series over the ring S with the given coefficient function
binomial_measure:
  args: [term, term]
  returns: term
  meaning: binomial distribution with n trials and success probability p
# Symbols defined in other domain files that patched or moved cards use, so single-domain checks see them.
compact_in:
  args:
  - term
  - term
  returns: prop
  meaning: K is a compact subset of X
continuous_between:
  args:
  - term
  - term
  - term
  returns: prop
  meaning: f from X to Y is continuous
division_point:
  args:
  - term
  - term
  - term
  returns: term
  meaning: the point a + r(b - a) on the line through a and b (arguments a, b, r)
euclidean_plane_ambient:
  args: []
  returns: prop
  meaning: the ambient Euclidean space has dimension two
finite_set:
  args:
  - term
  returns: prop
  meaning: S is a finite set
has_deriv_at:
  args:
  - term_function
  - term
  - term
  returns: prop
  meaning: f is differentiable at a with derivative u; arguments f, u, a
holds_at:
  args:
  - term
  - term
  returns: prop
  meaning: the predicate P holds at n
indexed_union_over:
  args:
  - term
  - term
  returns: term
  meaning: union of the members S_i for i in I
injective_function:
  args:
  - term
  returns: prop
  meaning: f is injective
inner_product:
  args:
  - term
  - term
  returns: term
  meaning: inner product of x and y
inner_product_space:
  args:
  - term
  returns: prop
  meaning: E is an inner product space
interval_integral:
  args:
  - term
  - term
  - term_function
  returns: term
  meaning: oriented definite integral of f from a to b; arguments a, b, f
is_glb:
  args:
  - term
  - term
  returns: prop
  meaning: a is the greatest lower bound of the set S
linear_span:
  args:
  - term
  returns: term
  meaning: linear span of a set or family of vectors
metric_space:
  args:
  - term
  returns: prop
  meaning: X is a metric space
natural_range:
  args:
  - term
  returns: term
  meaning: the finite index set of natural numbers 0, ..., n-1
on_plane:
  args:
  - term
  - term
  - term
  - term
  returns: prop
  meaning: p lies in the affine span of a, b and c, in the order p a b c
ordered_pair:
  args:
  - term
  - term
  returns: term
  meaning: ordered pair (a, b)
poly_degree:
  args:
  - term
  returns: term
  meaning: the degree of the polynomial f
polynomial_over:
  args:
  - term
  - term
  returns: prop
  meaning: f is a polynomial with coefficients in F
subspace_topology_on:
  args:
  - term
  - term
  returns: term
  meaning: subset A of X with the subspace topology
uniformly_continuous_map:
  args:
  - term
  - term
  - term
  returns: prop
  meaning: f from X to Y is uniformly continuous
