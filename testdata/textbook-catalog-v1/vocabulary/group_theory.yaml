# Proposed additive OpenMath vocabulary for group theory (cd=pals2).
group: {args: [term], returns: prop, meaning: "G is a group"}
finite_group: {args: [term], returns: prop, meaning: "G is a finite group"}
abelian_group: {args: [term], returns: prop, meaning: "G is an abelian group"}
cyclic_group: {args: [term], returns: prop, meaning: "G is a cyclic group"}
simple_group: {args: [term], returns: prop, meaning: "G is a simple group"}
solvable_group: {args: [term], returns: prop, meaning: "G is a solvable group"}
nilpotent_group: {args: [term], returns: prop, meaning: "G is a nilpotent group"}
p_group: {args: [term, term], returns: prop, meaning: "G is a p-group for the prime p, in the order (p, G)"}
group_mul: {args: [term, term], returns: term, meaning: "product ab of two elements of a group"}
group_inv: {args: [term], returns: term, meaning: "inverse of a group element"}
group_identity: {args: [term], returns: term, meaning: "identity element of the group G"}
group_pow: {args: [term, term], returns: term, meaning: "power g^n of a group element"}
element_order: {args: [term], returns: term, meaning: "order of a group element"}
normal_subgroup: {args: [term, term], returns: prop, meaning: "N is a normal subgroup of G"}
trivial_subgroup: {args: [term], returns: term, meaning: "trivial subgroup of G"}
subgroup_index: {args: [term, term], returns: term, meaning: "index [G:H], in the order (H, G)"}
subgroup_product: {args: [term, term], returns: term, meaning: "set product HK of two subgroups"}
subgroup_join: {args: [term, term], returns: term, meaning: "subgroup generated by the union of H and K"}
left_coset: {args: [term, term], returns: term, meaning: "left coset aH, in the order (a, H)"}
generated_subgroup: {args: [term], returns: term, meaning: "subgroup generated by a set of elements"}
cyclic_subgroup: {args: [term], returns: term, meaning: "cyclic subgroup generated by one element"}
quotient_group: {args: [term, term], returns: term, meaning: "quotient group G/N, in the order (G, N)"}
group_center: {args: [term], returns: term, meaning: "center Z(G)"}
commutator_subgroup: {args: [term], returns: term, meaning: "commutator subgroup [G,G]"}
abelianization: {args: [term], returns: term, meaning: "abelianization G/[G,G]"}
group_hom: {args: [term, term, term], returns: prop, meaning: "f is a group homomorphism from G to H, in the order (f, G, H)"}
group_kernel: {args: [term], returns: term, meaning: "kernel of a group homomorphism"}
group_image: {args: [term], returns: term, meaning: "image of a group homomorphism"}
injective_function: {args: [term], returns: prop, meaning: "f is injective"}
surjective_function: {args: [term], returns: prop, meaning: "f is surjective"}
isomorphic_groups: {args: [term, term], returns: prop, meaning: "the groups G and H are isomorphic"}
group_iso: {args: [term, term, term], returns: prop, meaning: "e is a group isomorphism from G to H, in the order (e, G, H)"}
group_action: {args: [term, term], returns: prop, meaning: "the group G acts on the set X"}
action_orbit: {args: [term, term], returns: term, meaning: "orbit of x under G, in the order (G, x)"}
action_stabilizer: {args: [term, term], returns: term, meaning: "stabilizer of x in G, in the order (G, x)"}
action_fixed_points: {args: [term, term], returns: term, meaning: "set of points of X fixed by g, in the order (g, X)"}
action_orbit_set: {args: [term, term], returns: term, meaning: "set of orbits of G on X"}
sylow_subgroup: {args: [term, term, term], returns: prop, meaning: "P is a Sylow p-subgroup of G, in the order (p, P, G)"}
sylow_set: {args: [term, term], returns: term, meaning: "set of Sylow p-subgroups of G, in the order (p, G)"}
symmetric_group: {args: [term], returns: term, meaning: "symmetric group on a finite set X"}
alternating_group: {args: [term], returns: term, meaning: "alternating group on a finite set X"}
permutation_sign: {args: [term], returns: term, meaning: "sign of a permutation"}
transposition: {args: [term], returns: prop, meaning: "the permutation is a transposition"}
three_cycle: {args: [term], returns: prop, meaning: "the permutation is a 3-cycle"}
cycle_permutation: {args: [term], returns: prop, meaning: "the permutation is a cycle"}
cycle_length: {args: [term], returns: term, meaning: "length of a cycle"}
direct_product: {args: [term, term], returns: term, meaning: "direct product G x H of two groups"}
semidirect_product: {args: [term, term], returns: term, meaning: "semidirect product of N by H for the conjugation action"}
right_coset: {args: [term, term], returns: term, meaning: "right coset Hg, in the order (H, g)"}
subgroup_preimage: {args: [term, term], returns: term, meaning: "preimage of a subgroup under a homomorphism, in the order (f, N)"}
subgroup_image: {args: [term, term], returns: term, meaning: "image of a subgroup under a homomorphism, in the order (f, M)"}
quotient_map: {args: [term, term], returns: term, meaning: "natural projection from G onto G/N"}
conjugate_subgroup: {args: [term, term], returns: term, meaning: "conjugate subgroup gHg^-1, in the order (g, H)"}
noncentral_conjugacy_classes: {args: [term], returns: term, meaning: "set of conjugacy classes of G with more than one element"}
prime_power_cyclic_sum: {args: [term, term], returns: term, meaning: "direct sum of the cyclic groups Z/p_i^(e_i) for a finite family of primes p and exponents e"}
