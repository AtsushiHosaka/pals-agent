# Proposed additive OpenMath vocabulary for advanced undergraduate topics.
field: {args: [term], returns: prop, meaning: "K is a field"}
finite_group: {args: [term], returns: prop, meaning: "G is a finite group"}
group: {args: [term], returns: prop, meaning: "G is a group"}
group_mul: {args: [term, term], returns: term, meaning: "product ab of two elements of a group"}
group_inv: {args: [term], returns: term, meaning: "inverse of a group element"}
group_algebra: {args: [term, term], returns: term, meaning: "group algebra k[G], in the order k G"}
order_invertible_in: {args: [term, term], returns: prop, meaning: "the order of the finite group G is invertible in the field k, in the order G k"}
module_over: {args: [term, term], returns: prop, meaning: "M is a module over R"}
submodule_of: {args: [term, term], returns: prop, meaning: "N is a submodule of M"}
complementary_submodules: {args: [term, term, term], returns: prop, meaning: "p and q are complementary submodules of M, in the order p q M"}
linear_representation: {args: [term, term, term, term], returns: prop, meaning: "rho is a linear representation of G on the k-vector space V, in the order rho k G V"}
irreducible_representation: {args: [term], returns: prop, meaning: "rho is an irreducible representation"}
equivalent_representations: {args: [term, term], returns: prop, meaning: "the representations rho and sigma are isomorphic"}
intertwining_map: {args: [term, term, term], returns: prop, meaning: "f is an intertwining map from rho to sigma, in the order f rho sigma"}
rep_character: {args: [term, term], returns: term, meaning: "value at g of the character of rho, in the order rho g"}
finite_dim_space: {args: [term], returns: prop, meaning: "E is finite dimensional"}
algebraically_closed: {args: [term], returns: prop, meaning: "the field K is algebraically closed"}
bijective: {args: [term], returns: prop, meaning: "f is bijective"}
surjective: {args: [term], returns: prop, meaning: "f is surjective onto its codomain"}
scalar_action: {args: [term, term], returns: term, meaning: "scalar multiple c v"}
group_average_inner_product: {args: [term, term, term], returns: term, meaning: "normalized character pairing of rho and sigma over the finite group G, the sum of chi_rho(g) chi_sigma(g^-1) divided by the order of G, in the order G rho sigma"}
commutative_ring: {args: [term], returns: prop, meaning: "R is a commutative ring"}
lie_ring: {args: [term], returns: prop, meaning: "L is a Lie ring"}
lie_algebra: {args: [term, term], returns: prop, meaning: "L is a Lie algebra over R, in the order L R"}
lie_bracket: {args: [term, term], returns: term, meaning: "Lie bracket [x, y]"}
lie_ideal: {args: [term, term], returns: prop, meaning: "I is a Lie ideal of L"}
lie_ideal_bracket: {args: [term, term], returns: term, meaning: "ideal [I, J] generated by the brackets of two Lie ideals"}
lie_derived_series: {args: [term, term], returns: term, meaning: "k-th term of the derived series of L, in the order L k"}
lie_algebra_hom: {args: [term, term, term], returns: prop, meaning: "f is a Lie algebra homomorphism from L to M, in the order f L M"}
solvable_lie_algebra: {args: [term], returns: prop, meaning: "L is a solvable Lie algebra"}
nilpotent_lie_algebra: {args: [term], returns: prop, meaning: "L is a nilpotent Lie algebra"}
noetherian_module: {args: [term, term], returns: prop, meaning: "M is a Noetherian R-module, in the order R M"}
adjoint_map: {args: [term, term], returns: term, meaning: "adjoint endomorphism ad_L(x), in the order L x"}
nilpotent_op: {args: [term], returns: prop, meaning: "the operator is nilpotent"}
number_field: {args: [term], returns: prop, meaning: "K is a number field"}
ring_of_integers: {args: [term], returns: term, meaning: "ring of integers of the number field K"}
dedekind_domain: {args: [term], returns: prop, meaning: "R is a Dedekind domain"}
class_group: {args: [term], returns: term, meaning: "ideal class group of the Dedekind domain R"}
class_number: {args: [term], returns: term, meaning: "class number of the number field K"}
principal_ideal_domain: {args: [term], returns: prop, meaning: "R is a principal ideal domain"}
finite_set: {args: [term], returns: prop, meaning: "S is a finite set"}
finite_extension: {args: [term, term], returns: prop, meaning: "E is a finite extension of F"}
relative_norm: {args: [term, term, term], returns: term, meaning: "norm N_{L/K}(x) of x from L down to K, in the order K L x"}
extension_degree: {args: [term, term], returns: term, meaning: "degree [L:K] of a field extension, in the order L K"}
unit_element: {args: [term, term], returns: prop, meaning: "a is a unit of R"}
cyclotomic_over_rationals: {args: [term, term], returns: prop, meaning: "K is the n-th cyclotomic extension of the rationals, in the order K n"}
primitive_root_of_unity: {args: [term, term], returns: prop, meaning: "z is a primitive n-th root of unity, in the order z n"}
algebraic_integer: {args: [term], returns: prop, meaning: "x is integral over the integers"}
integer_adjoin: {args: [term], returns: term, meaning: "subring Z[z] generated by z over the integers"}
padic_field: {args: [term], returns: term, meaning: "field Q_p of p-adic numbers"}
padic_integers: {args: [term], returns: term, meaning: "ring Z_p of p-adic integers"}
padic_norm: {args: [term, term], returns: term, meaning: "p-adic norm of x, in the order p x"}
complete_space: {args: [term], returns: prop, meaning: "X is a complete metric space"}
polynomial_over: {args: [term, term], returns: prop, meaning: "f is a polynomial with coefficients in F"}
poly_eval: {args: [term, term], returns: term, meaning: "value f(a) of the polynomial f at a"}
poly_derivative: {args: [term], returns: term, meaning: "the formal derivative of the polynomial f"}
weierstrass_curve: {args: [term, term], returns: prop, meaning: "W is a Weierstrass curve over the field F, in the order W F"}
weierstrass_points: {args: [term], returns: term, meaning: "nonsingular affine points of W together with the point at infinity"}
point_add: {args: [term, term], returns: term, meaning: "sum of two points in the chord-tangent group law"}
point_neg: {args: [term], returns: term, meaning: "negative of a point in the chord-tangent group law"}
point_zero: {args: [term], returns: term, meaning: "point at infinity of the Weierstrass curve W"}
first_order_language: {args: [term], returns: prop, meaning: "L is a first-order language"}
first_order_theory: {args: [term, term], returns: prop, meaning: "T is a first-order theory in the language L, in the order T L"}
first_order_structure: {args: [term, term], returns: prop, meaning: "M is a structure for the language L, in the order M L"}
first_order_satisfiable: {args: [term], returns: prop, meaning: "the theory T has a model"}
first_order_finitely_satisfiable: {args: [term], returns: prop, meaning: "every finite subset of the theory T has a model"}
elementary_embedding: {args: [term, term, term], returns: prop, meaning: "there is an elementary embedding of M into N for the language L, in the order L M N"}
language_cardinality: {args: [term], returns: term, meaning: "cardinality of the symbols of the language L"}
aleph_zero: {args: [], returns: term, meaning: "the cardinal aleph-null"}
infinite_set: {args: [term], returns: prop, meaning: "S is an infinite set"}
nat_mod: {args: [term, term], returns: term, meaning: "remainder of a on division by m, in the order a m"}
seq_length: {args: [term], returns: term, meaning: "length of a finite sequence"}
homological_complex: {args: [term, term], returns: prop, meaning: "K is a homological complex in the category C, in the order K C"}
abelian_category: {args: [term], returns: prop, meaning: "C is an abelian category"}
preadditive_category: {args: [term], returns: prop, meaning: "C is a preadditive category"}
chain_map: {args: [term, term, term], returns: prop, meaning: "f is a chain map from K to L, in the order f K L"}
morphism_comp: {args: [term, term], returns: term, meaning: "composite of morphisms, first f then g, in the order f g"}
identity_morphism: {args: [term], returns: term, meaning: "identity morphism of the object X"}
morphism_between: {args: [term, term, term], returns: prop, meaning: "d is a morphism from X to Y, in the order d X Y"}
homology_object: {args: [term, term], returns: term, meaning: "homology of the complex K in degree i, in the order K i"}
successive_degrees: {args: [term, term], returns: prop, meaning: "the differential of the complex shape goes from degree i to degree j"}
homology_map: {args: [term, term], returns: term, meaning: "map induced by the chain map f on homology in degree i, in the order f i"}
chain_homotopic: {args: [term, term], returns: prop, meaning: "the chain maps f and g are chain homotopic"}
short_exact_complexes: {args: [term, term], returns: prop, meaning: "the composable chain maps f and g form a short exact sequence of complexes"}
exact_pair: {args: [term, term], returns: prop, meaning: "the composable morphisms f and g satisfy gf = 0 and are exact at the middle object"}
