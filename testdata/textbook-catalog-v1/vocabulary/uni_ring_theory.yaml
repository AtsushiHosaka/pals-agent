# Proposed additive OpenMath vocabulary for the undergraduate ring theory cards (cd=pals2).
comm_ring: {args: [term], returns: prop, meaning: "R is a commutative ring with unity"}
integral_domain: {args: [term], returns: prop, meaning: "R is an integral domain"}
is_field: {args: [term], returns: prop, meaning: "the commutative ring R is a field"}
algebraically_closed: {args: [term], returns: prop, meaning: "the field K is algebraically closed"}
principal_ideal_domain: {args: [term], returns: prop, meaning: "R is a principal ideal domain"}
unique_factorization_domain: {args: [term], returns: prop, meaning: "R is a unique factorization domain"}
gcd_domain: {args: [term], returns: prop, meaning: "R is an integral domain with greatest common divisors"}
noetherian_ring: {args: [term], returns: prop, meaning: "R is a Noetherian ring"}
discrete_valuation_ring: {args: [term], returns: prop, meaning: "R is a discrete valuation ring"}
dedekind_domain: {args: [term], returns: prop, meaning: "R is a Dedekind domain"}
integrally_closed_domain: {args: [term], returns: prop, meaning: "R is an integral domain integrally closed in its field of fractions"}
fraction_field_of: {args: [term, term], returns: prop, meaning: "K is a field of fractions of the integral domain A"}
fraction_embedding: {args: [term, term], returns: term, meaning: "canonical map from A into its field of fractions K"}
ideal_of: {args: [term, term], returns: prop, meaning: "I is an ideal of R"}
zero_ideal: {args: [term], returns: term, meaning: "the zero ideal of R"}
principal_ideal: {args: [term], returns: term, meaning: "the ideal generated by the element a"}
ideal_sum: {args: [term, term], returns: term, meaning: "sum I + J of two ideals"}
ideal_product: {args: [term, term], returns: term, meaning: "product IJ of two ideals"}
ideal_is_principal: {args: [term], returns: prop, meaning: "the ideal I is generated by one element"}
ideal_extension_to_polynomials: {args: [term], returns: term, meaning: "ideal of R[X] generated by the ideal I of R"}
prime_ideal: {args: [term, term], returns: prop, meaning: "P is a prime ideal of R"}
maximal_ideal: {args: [term, term], returns: prop, meaning: "M is a maximal ideal of R"}
prime_ideals_of: {args: [term], returns: term, meaning: "the set of prime ideals of R"}
unit_element: {args: [term, term], returns: prop, meaning: "a is a unit of R"}
irreducible_element: {args: [term, term], returns: prop, meaning: "a is an irreducible element of R"}
prime_element: {args: [term, term], returns: prop, meaning: "a is a prime element of R"}
nilpotent_element: {args: [term, term], returns: prop, meaning: "a is a nilpotent element of R"}
associated_elements: {args: [term, term], returns: prop, meaning: "a and b differ by a unit factor"}
coprime_elements: {args: [term, term], returns: prop, meaning: "there are x and y with ax + by = 1"}
dvd: {args: [term, term], returns: prop, meaning: "a divides b"}
fn_value: {args: [term, term], returns: term, meaning: "function value f(x)"}
finite_set: {args: [term], returns: prop, meaning: "S is a finite set"}
finite_family_product: {args: [term, term_function], returns: term, meaning: "product over an index in the finite set t of the given family"}
multiset_mem: {args: [term, term], returns: prop, meaning: "x is an element of the finite multiset s"}
multiset_prod: {args: [term], returns: term, meaning: "product of the elements of a finite multiset"}
multisets_associated: {args: [term, term], returns: prop, meaning: "the finite multisets correspond bijectively with corresponding elements associated"}
polynomial_ring: {args: [term], returns: term, meaning: "polynomial ring R[X] in one variable"}
poly_var: {args: [], returns: term, meaning: "the indeterminate X of a polynomial ring"}
poly_const: {args: [term], returns: term, meaning: "constant polynomial with value a"}
poly_eval: {args: [term, term], returns: term, meaning: "value f(a) of the polynomial f at a"}
poly_degree: {args: [term], returns: term, meaning: "degree of the polynomial f"}
poly_coeff: {args: [term, term], returns: term, meaning: "coefficient of X^n in the polynomial f"}
poly_leading_coeff: {args: [term], returns: term, meaning: "leading coefficient of the polynomial f"}
poly_derivative: {args: [term], returns: term, meaning: "the formal derivative of the polynomial f"}
poly_comp: {args: [term, term], returns: term, meaning: "the composite polynomial f(g), in the order f g"}
poly_map: {args: [term, term], returns: term, meaning: "polynomial obtained by applying the ring homomorphism to the coefficients"}
poly_content: {args: [term], returns: term, meaning: "normalized greatest common divisor of the coefficients of f"}
monic_polynomial: {args: [term], returns: prop, meaning: "f is a monic polynomial"}
primitive_polynomial: {args: [term], returns: prop, meaning: "only units divide all coefficients of f"}
coprime_polys: {args: [term, term], returns: prop, meaning: "polynomials p and q are coprime"}
squarefree_poly: {args: [term], returns: prop, meaning: "the polynomial is squarefree"}
power_series_ring: {args: [term], returns: term, meaning: "ring R[[X]] of formal power series in one variable"}
power_series_const: {args: [term], returns: term, meaning: "constant formal power series with value a"}
power_series_coeff: {args: [term, term], returns: term, meaning: "coefficient of X^n in the formal power series f, in the order f n"}
power_series_order: {args: [term], returns: term, meaning: "least index of a nonzero coefficient of f, infinite for f = 0"}
krull_valuation: {args: [term, term], returns: prop, meaning: "v is a valuation on the ring R with values in a totally ordered group with zero, in the order v R"}
max_of: {args: [term, term], returns: term, meaning: "maximum of two elements of a totally ordered set"}
is_ring: {args: [term], returns: prop, meaning: "R is a ring"}
finite_ring: {args: [term], returns: prop, meaning: "the ring R has finitely many elements"}
infinite_ring: {args: [term], returns: prop, meaning: "the ring R has infinitely many elements"}
quotient_ring: {args: [term, term], returns: term, meaning: "quotient ring R/I"}
ring_hom: {args: [term, term, term], returns: prop, meaning: "f is a ring homomorphism from R to S"}
ring_isomorphic: {args: [term, term], returns: prop, meaning: "the rings A and B are isomorphic"}
reduced_ring: {args: [term], returns: prop, meaning: "R has no nonzero nilpotent elements"}
jacobson_radical: {args: [term], returns: term, meaning: "Jacobson radical of the commutative ring R"}
nilradical_of: {args: [term], returns: term, meaning: "nilradical of the commutative ring R"}
ideal_power: {args: [term, term], returns: term, meaning: "n-th power of the ideal I"}
unit_ideal: {args: [term], returns: term, meaning: "the whole ring R seen as an ideal"}
ring_characteristic: {args: [term, term], returns: prop, meaning: "p is the characteristic of the ring R"}
matrix_ring: {args: [term, term], returns: term, meaning: "ring of square matrices over R indexed by n"}
left_artinian_ring: {args: [term], returns: prop, meaning: "descending chains of left ideals of the ring R stabilize; for commutative R this is an Artinian ring"}
left_noetherian_ring: {args: [term], returns: prop, meaning: "ascending chains of left ideals of the ring R stabilize; for commutative R this is a Noetherian ring"}
gaussian_int: {args: [], returns: term, meaning: "the ring of Gaussian integers Z[i]"}
int_adjoin_sqrt: {args: [term], returns: term, meaning: "the ring Z[sqrt d]"}
power_series_x: {args: [], returns: term, meaning: "the formal power series indeterminate X"}
group_algebra: {args: [term, term], returns: term, meaning: "group algebra k[G], in the order k G"}
finite_group: {args: [term], returns: prop, meaning: "G is a finite group"}
ideal_map: {args: [term, term], returns: term, meaning: "ideal generated by the image of I under the ring homomorphism f"}
ring_kernel: {args: [term], returns: term, meaning: "kernel of the ring homomorphism f"}
ring_quotient_map: {args: [term], returns: term, meaning: "canonical projection onto the quotient by the ideal I"}
factorial: {args: [term], returns: term, meaning: "factorial n!"}
matrix_entry: {args: [term, term, term], returns: term, meaning: "entry of A in row i and column j, in the order (A, i, j)"}
surjective: {args: [term], returns: prop, meaning: "f is surjective onto its codomain"}
injective: {args: [term], returns: prop, meaning: "f is injective"}
division_ring: {args: [term], returns: prop, meaning: "D is a division ring, possibly noncommutative"}
left_ideal_of: {args: [term, term], returns: prop, meaning: "I is a left ideal of the ring R, in the order I R"}
left_principal_ideal: {args: [term], returns: term, meaning: "the left ideal Ra generated by the element a"}
idempotent_element: {args: [term, term], returns: prop, meaning: "e is an idempotent of R, in the order e R"}
zmod_ring: {args: [term], returns: term, meaning: "the ring Z/nZ of integers modulo n, with Z/0Z equal to Z"}
squarefree: {args: [term], returns: prop, meaning: "the natural number has no square factor other than 1"}
relatively_prime_elements: {args: [term, term], returns: prop, meaning: "every common divisor of a and b is a unit"}
subring_of: {args: [term, term], returns: prop, meaning: "S is a subring of R containing its identity, in the order S R"}
subring_image_in_quotient: {args: [term, term], returns: term, meaning: "image of the subring S in the quotient R/I, in the order S I"}
ideal_direct_product: {args: [term, term], returns: term, meaning: "the ideal I x J of the product ring R x S, in the order I J"}
ring_nat_cast: {args: [term, term], returns: term, meaning: "the image of the natural number n in the ring R, in the order n R"}
matrix_unit: {args: [term, term, term], returns: term, meaning: "the matrix with entry a at row i and column j and zeros elsewhere, in the order i j a"}
scalar_matrix: {args: [term], returns: term, meaning: "the diagonal matrix with every diagonal entry equal to r"}
ring_center: {args: [term], returns: term, meaning: "the center of the ring R"}
simple_ring: {args: [term], returns: prop, meaning: "R is a nonzero ring whose only two-sided ideals are 0 and R"}
semisimple_ring: {args: [term], returns: prop, meaning: "R is a semisimple module over itself on the left"}
ring_jacobson_radical: {args: [term], returns: term, meaning: "the intersection of all maximal left ideals of a possibly noncommutative ring R"}
real_quaternions: {args: [], returns: term, meaning: "the ring of Hamilton quaternions over the real numbers"}
quaternion_re: {args: [term], returns: term, meaning: "the real part of the quaternion x"}
quaternion_im_i: {args: [term], returns: term, meaning: "the coefficient of i in the quaternion x"}
quaternion_im_j: {args: [term], returns: term, meaning: "the coefficient of j in the quaternion x"}
quaternion_im_k: {args: [term], returns: term, meaning: "the coefficient of k in the quaternion x"}
poly_root_multiplicity: {args: [term, term], returns: term, meaning: "multiplicity of a as a root of f, in the order f a"}
poly_roots_multiset: {args: [term], returns: term, meaning: "the finite multiset of roots of f counted with multiplicity"}
multiset_esymm: {args: [term, term], returns: term, meaning: "k-th elementary symmetric polynomial of a finite multiset, in the order s k"}
poly_iterated_derivative: {args: [term, term], returns: term, meaning: "k-th formal derivative of f, in the order f k"}
ring_frobenius: {args: [term, term], returns: term, meaning: "the ring map x to x^p on a commutative ring of characteristic p, in the order A p"}
sqrt_ring_norm: {args: [term], returns: term, meaning: "the norm a^2 - d b^2 of a + b sqrt d in Z[sqrt d]"}
sqrt_ring_conj: {args: [term], returns: term, meaning: "the conjugate a - b sqrt d of a + b sqrt d in Z[sqrt d]"}
power_series_derivative: {args: [term], returns: term, meaning: "the formal derivative of the power series f"}
power_series_exp: {args: [term], returns: term, meaning: "the exponential power series with coefficients 1/n! over the Q-algebra A"}
power_series_eval_neg: {args: [term], returns: term, meaning: "the power series f(-X)"}
ring_image: {args: [term], returns: term, meaning: "image subring of the ring homomorphism f"}
range_sum: {args: [term, term_function], returns: term, meaning: "finite sum of g(k) over k from 0 to n-1"}
ideal_sequence_term: {args: [term, term], returns: term, meaning: "n-th ideal I_n of a sequence of ideals"}
nontrivial_ring: {args: [term], returns: prop, meaning: "R is not the zero ring"}
ring_iso: {args: [term, term, term], returns: prop, meaning: "e is a ring isomorphism from A to B"}
complex_i: {args: [], returns: term, meaning: "the imaginary unit i of the complex numbers"}
nat_mod: {args: [term, term], returns: term, meaning: "remainder of a on division by m, in the order a m"}
matrix_ring_family_product: {args: [term, term, term], returns: term, meaning: "finite product over i below k of the d_i by d_i matrix rings over D_i, in the order k D d"}
