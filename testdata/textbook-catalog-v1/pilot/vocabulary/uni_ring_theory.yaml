# Proposed additive OpenMath vocabulary for the undergraduate ring theory cards (cd=pals2).
comm_ring: {args: [term], returns: prop, meaning: "R is a commutative ring with unity"}
integral_domain: {args: [term], returns: prop, meaning: "R is an integral domain"}
is_field: {args: [term], returns: prop, meaning: "the commutative ring R is a field"}
algebraically_closed: {args: [term], returns: prop, meaning: "the field K is algebraically closed"}
principal_ideal_domain: {args: [term], returns: prop, meaning: "R is a principal ideal domain"}
unique_factorization_domain: {args: [term], returns: prop, meaning: "R is a unique factorization domain"}
gcd_domain: {args: [term], returns: prop, meaning: "R is an integral domain with greatest common divisors"}
noetherian_ring: {args: [term], returns: prop, meaning: "R is a Noetherian ring"}
discrete_valuation_ring: {args: [term], returns: prop, meaning: "R is a discrete valuation ring"}
dedekind_domain: {args: [term], returns: prop, meaning: "R is a Dedekind domain"}
integrally_closed_domain: {args: [term], returns: prop, meaning: "R is an integral domain integrally closed in its field of fractions"}
fraction_field_of: {args: [term, term], returns: prop, meaning: "K is a field of fractions of the integral domain A"}
fraction_embedding: {args: [term, term], returns: term, meaning: "canonical map from A into its field of fractions K"}
ideal_of: {args: [term, term], returns: prop, meaning: "I is an ideal of R"}
zero_ideal: {args: [term], returns: term, meaning: "the zero ideal of R"}
principal_ideal: {args: [term], returns: term, meaning: "the ideal generated by the element a"}
ideal_sum: {args: [term, term], returns: term, meaning: "sum I + J of two ideals"}
ideal_product: {args: [term, term], returns: term, meaning: "product IJ of two ideals"}
ideal_is_principal: {args: [term], returns: prop, meaning: "the ideal I is generated by one element"}
ideal_extension_to_polynomials: {args: [term], returns: term, meaning: "ideal of R[X] generated by the ideal I of R"}
prime_ideal: {args: [term, term], returns: prop, meaning: "P is a prime ideal of R"}
maximal_ideal: {args: [term, term], returns: prop, meaning: "M is a maximal ideal of R"}
prime_ideals_of: {args: [term], returns: term, meaning: "the set of prime ideals of R"}
unit_element: {args: [term, term], returns: prop, meaning: "a is a unit of R"}
irreducible_element: {args: [term, term], returns: prop, meaning: "a is an irreducible element of R"}
prime_element: {args: [term, term], returns: prop, meaning: "a is a prime element of R"}
nilpotent_element: {args: [term, term], returns: prop, meaning: "a is a nilpotent element of R"}
associated_elements: {args: [term, term], returns: prop, meaning: "a and b differ by a unit factor"}
coprime_elements: {args: [term, term], returns: prop, meaning: "there are x and y with ax + by = 1"}
dvd: {args: [term, term], returns: prop, meaning: "a divides b"}
fn_value: {args: [term, term], returns: term, meaning: "function value f(x)"}
finite_set: {args: [term], returns: prop, meaning: "S is a finite set"}
finite_family_product: {args: [term, term_function], returns: term, meaning: "product over an index in the finite set t of the given family"}
multiset_mem: {args: [term, term], returns: prop, meaning: "x is an element of the finite multiset s"}
multiset_prod: {args: [term], returns: term, meaning: "product of the elements of a finite multiset"}
multisets_associated: {args: [term, term], returns: prop, meaning: "the finite multisets correspond bijectively with corresponding elements associated"}
polynomial_ring: {args: [term], returns: term, meaning: "polynomial ring R[X] in one variable"}
poly_var: {args: [], returns: term, meaning: "the indeterminate X of a polynomial ring"}
poly_const: {args: [term], returns: term, meaning: "constant polynomial with value a"}
poly_eval: {args: [term, term], returns: term, meaning: "value f(a) of the polynomial f at a"}
poly_degree: {args: [term], returns: term, meaning: "degree of the polynomial f"}
poly_coeff: {args: [term, term], returns: term, meaning: "coefficient of X^n in the polynomial f"}
poly_leading_coeff: {args: [term], returns: term, meaning: "leading coefficient of the polynomial f"}
poly_derivative: {args: [term], returns: term, meaning: "the formal derivative of the polynomial f"}
poly_comp: {args: [term, term], returns: term, meaning: "the composite polynomial f(g), in the order f g"}
poly_map: {args: [term, term], returns: term, meaning: "polynomial obtained by applying the ring homomorphism to the coefficients"}
poly_content: {args: [term], returns: term, meaning: "normalized greatest common divisor of the coefficients of f"}
monic_polynomial: {args: [term], returns: prop, meaning: "f is a monic polynomial"}
primitive_polynomial: {args: [term], returns: prop, meaning: "only units divide all coefficients of f"}
coprime_polys: {args: [term, term], returns: prop, meaning: "polynomials p and q are coprime"}
squarefree_poly: {args: [term], returns: prop, meaning: "the polynomial is squarefree"}
power_series_ring: {args: [term], returns: term, meaning: "ring R[[X]] of formal power series in one variable"}
power_series_x: {args: [], returns: term, meaning: "the formal power series indeterminate X"}
formal_power_series_mk: {args: [term_function], returns: term, meaning: "formal power series with the given coefficient function"}
power_series_const: {args: [term], returns: term, meaning: "constant formal power series with value a"}
power_series_coeff: {args: [term, term], returns: term, meaning: "coefficient of X^n in the formal power series f, in the order f n"}
power_series_order: {args: [term], returns: term, meaning: "least index of a nonzero coefficient of f, infinite for f = 0"}
krull_valuation: {args: [term, term], returns: prop, meaning: "v is a valuation on the ring R with values in a totally ordered group with zero, in the order v R"}
max_of: {args: [term, term], returns: term, meaning: "maximum of two elements of a totally ordered set"}
