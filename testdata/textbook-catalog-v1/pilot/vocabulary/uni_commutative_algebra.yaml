# Proposed additive OpenMath vocabulary for the university commutative algebra cards (cd=pals2).
comm_ring: {args: [term], returns: prop, meaning: "R is a commutative ring with unity"}
nontrivial_ring: {args: [term], returns: prop, meaning: "R is not the zero ring"}
integral_domain: {args: [term], returns: prop, meaning: "R is an integral domain"}
reduced_ring: {args: [term], returns: prop, meaning: "R has no nonzero nilpotent elements"}
noetherian_ring: {args: [term], returns: prop, meaning: "R is a Noetherian ring"}
artinian_ring: {args: [term], returns: prop, meaning: "R is an Artinian ring"}
local_ring: {args: [term], returns: prop, meaning: "R is a local ring"}
ring_hom: {args: [term, term, term], returns: prop, meaning: "f is a ring homomorphism from R to S"}
ring_iso: {args: [term, term, term], returns: prop, meaning: "e is a ring isomorphism from A to B"}
ring_hom_injective: {args: [term], returns: prop, meaning: "the ring homomorphism f is injective"}
surjective: {args: [term], returns: prop, meaning: "f is surjective onto its codomain"}
fn_value: {args: [term, term], returns: term, meaning: "function value f(x)"}
unit_element: {args: [term, term], returns: prop, meaning: "a is a unit of R"}
nilpotent_element: {args: [term, term], returns: prop, meaning: "a is a nilpotent element of R"}
ideal_of: {args: [term, term], returns: prop, meaning: "I is an ideal of R"}
prime_ideal: {args: [term, term], returns: prop, meaning: "P is a prime ideal of R"}
maximal_ideal: {args: [term, term], returns: prop, meaning: "M is a maximal ideal of R"}
primary_ideal: {args: [term, term], returns: prop, meaning: "I is a primary ideal of R"}
unit_ideal: {args: [term], returns: term, meaning: "the whole ring R seen as an ideal"}
zero_ideal: {args: [term], returns: term, meaning: "the zero ideal of R"}
principal_ideal: {args: [term], returns: term, meaning: "the ideal generated by the element a"}
finitely_generated_ideal: {args: [term], returns: prop, meaning: "the ideal I is finitely generated"}
ideal_sum: {args: [term, term], returns: term, meaning: "sum I + J of two ideals"}
ideal_product: {args: [term, term], returns: term, meaning: "product IJ of two ideals"}
ideal_power: {args: [term, term], returns: term, meaning: "n-th power of the ideal I"}
ideal_radical: {args: [term], returns: term, meaning: "radical of the ideal I"}
ideal_comap: {args: [term, term], returns: term, meaning: "preimage of the ideal J under the ring homomorphism f"}
ideal_map: {args: [term, term], returns: term, meaning: "ideal generated by the image of I under the ring homomorphism f"}
quotient_ring: {args: [term, term], returns: term, meaning: "quotient ring R/I"}
residue_class: {args: [term, term], returns: term, meaning: "residue class of x modulo the ideal I"}
finite_set: {args: [term], returns: prop, meaning: "S is a finite set"}
family_value: {args: [term, term], returns: term, meaning: "member S_i of an indexed family of sets"}
family_union: {args: [term, term], returns: term, meaning: "union of the family U indexed by I"}
singleton_set: {args: [term], returns: term, meaning: "the singleton set containing x"}
set_closure: {args: [term], returns: term, meaning: "topological closure of S"}
algebra_over: {args: [term, term], returns: prop, meaning: "A is an algebra over R"}
algebra_map: {args: [term, term], returns: term, meaning: "structure homomorphism from R to the R-algebra A"}
finite_type_algebra: {args: [term, term], returns: prop, meaning: "the k-algebra R is finitely generated as an algebra, in the order R k"}
integral_element: {args: [term, term], returns: prop, meaning: "x is integral over R, in the order x R"}
integral_extension: {args: [term, term], returns: prop, meaning: "the R-algebra S is integral over R, in the order S R"}
submonoid_of: {args: [term, term], returns: prop, meaning: "M is a multiplicative submonoid of R"}
localization_of: {args: [term, term, term], returns: prop, meaning: "S is the localization of R at the submonoid M, in the order S R M"}
localization_at_prime: {args: [term, term, term], returns: prop, meaning: "S is the localization of R at the prime ideal P, in the order S R P"}
fraction_field_of: {args: [term, term], returns: prop, meaning: "K is a field of fractions of the integral domain A"}
fraction_embedding: {args: [term, term], returns: term, meaning: "canonical map from A into its field of fractions K"}
prime_spectrum: {args: [term], returns: term, meaning: "prime spectrum Spec R with the Zariski topology"}
spectrum_point_ideal: {args: [term], returns: term, meaning: "prime ideal corresponding to a point of the prime spectrum"}
spectrum_zero_locus: {args: [term], returns: term, meaning: "set V(s) of points of the prime spectrum whose ideal contains the subset s"}
module_over: {args: [term, term], returns: prop, meaning: "M is a module over R"}
submodule_of: {args: [term, term], returns: prop, meaning: "N is a submodule of M"}
finitely_generated_module: {args: [term, term], returns: prop, meaning: "M is a finitely generated R-module, in the order R M"}
finitely_generated_submodule: {args: [term], returns: prop, meaning: "the module N is finitely generated"}
ideal_smul_submodule: {args: [term, term], returns: term, meaning: "submodule IN generated by products of I and N"}
smul: {args: [term, term], returns: term, meaning: "scalar multiple a x of a vector x"}
colon_ideal: {args: [term, term], returns: term, meaning: "ideal quotient (I : J) of all r with rJ contained in I, in the order I J"}
minimal_prime_over: {args: [term, term], returns: prop, meaning: "P is minimal among the prime ideals containing the ideal I, in the order P I"}
ideal_height: {args: [term], returns: term, meaning: "height of the prime ideal P"}
all_ideals: {args: [term], returns: term, meaning: "set of all ideals of R"}
ideal_family_inf_over: {args: [term, term], returns: term, meaning: "intersection of the ideals F_i for i in the finite index set s, in the order F s"}
ideal_family_prod_over: {args: [term, term], returns: term, meaning: "product of the ideals F_i for i in the finite index set s, in the order F s"}
product_of_quotients: {args: [term, term, term], returns: term, meaning: "product ring of the quotients R/F_i for i in s, in the order R F s"}
maximal_ideals_of: {args: [term], returns: term, meaning: "set of all maximal ideals of R"}
product_of_residue_fields: {args: [term], returns: term, meaning: "product of the fields R/m over all maximal ideals m of R"}
basic_open: {args: [term], returns: term, meaning: "basic open set D(f) of primes not containing f"}
irreducible_subset: {args: [term], returns: prop, meaning: "the subset Z of a topological space is irreducible"}
algebra_adjoin_element: {args: [term, term], returns: term, meaning: "subalgebra R[x] generated by the element x over R, in the order R x"}
