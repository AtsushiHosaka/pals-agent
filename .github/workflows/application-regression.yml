name: Agent application regression

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: agent-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Worker qualification. The job name and this file path are the identity that the
# parent repository's release-source-checks requires; do not rename either.
#
# What this establishes, and what it does not:
#   * The full unit/story/integration suite of the exact source runs once.
#   * Every failure must be listed in tests/qualification/agent_regression_manifest.json
#     with a cause AND must fail the same way on the retained verifier anchor
#     (189b443) in the same environment. A test that passes on the anchor and fails on
#     the candidate, or that is new and failing, blocks.
#   * Skips and never-executed modules must be listed with a reason; the 42 declared
#     runtime-core modules must run with no failure and no skip.
#   * Linux runs every case except the disjoint five-case real Lean module.
#     A standard Mac runs that module with the pinned workspace and sandbox-exec.
#     The final gate checks both original reports from this exact source/run.
#     No real database/model or deployed image is exercised.
jobs:
  linux-regression:
    name: agent-regression-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: parent-fixture/pals-agent
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_PROGRESS: "1"
      UV_PYTHON_DOWNLOADS: never
      AWS_EC2_METADATA_DISABLED: "true"
      RETAINED_VERIFIER_ANCHOR: 189b44378e6e63e5ab7c92d9c5b7d6507acd80f0
    steps:
      - name: Check out the immutable public parent fixture contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AtsushiHosaka/pals
          ref: b6b101177e5ce650eb3d03adc5f64f17e0540d96
          path: parent-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: parent-fixture/pals-agent
          fetch-depth: 0
      - name: Verify the requested source revision and the retained anchor
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git -C .. rev-parse HEAD)" = b6b101177e5ce650eb3d03adc5f64f17e0540d96
          test "$(git rev-parse "$RETAINED_VERIFIER_ANCHOR^{commit}")" = "$RETAINED_VERIFIER_ANCHOR"
          test "$(git cat-file commit "$RETAINED_VERIFIER_ANCHOR" | git hash-object -t commit --stdin)" = "$RETAINED_VERIFIER_ANCHOR"
          git merge-base --is-ancestor "$RETAINED_VERIFIER_ANCHOR" HEAD
          cp scripts/agent_regression_gate.py tests/qualification/agent_regression_manifest.json "$RUNNER_TEMP/"
          printf '{"source_revision":"%s","workflow_run_id":"%s","partition":"linux"}\n' \
            "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/linux-source.json"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install the locked declared development environment
        run: uv sync --locked --extra dev --python 3.12.13
      - name: Lint the qualification gate
        run: |
          uv run --no-sync ruff check \
            scripts/agent_regression_gate.py \
            tests/unit/test_agent_regression_gate.py
      - name: Run the full suite on the candidate source
        run: |
          # Exit 0 (all passed) and 1 (some tests failed) are the only outcomes that may
          # proceed; interrupted (2), internal error (3), usage (4) or no tests (5) block.
          status=0
          uv run --no-sync python -m pytest -p no:cacheprovider tests \
            --ignore=tests/integration/test_general_recipe_stage_real.py \
            --junitxml="$RUNNER_TEMP/candidate.xml" || status=$?
          test "$status" -le 1
          test -s "$RUNNER_TEMP/candidate.xml"
      - name: Re-run the failing test files on the retained verifier anchor
        run: |
          candidate_head="$(git rev-parse HEAD)"
          python "$RUNNER_TEMP/agent_regression_gate.py" failing-files \
            --report "$RUNNER_TEMP/candidate.xml" > "$RUNNER_TEMP/failing-files.txt"
          existing=()
          while read -r path; do
            if git cat-file -e "$RETAINED_VERIFIER_ANCHOR:$path" 2>/dev/null; then existing+=("$path"); fi
          done < "$RUNNER_TEMP/failing-files.txt"
          git checkout --quiet --detach "$RETAINED_VERIFIER_ANCHOR"
          uv sync --locked --extra dev --python 3.12.13
          if [ "${#existing[@]}" -gt 0 ]; then
            status=0
            uv run --no-sync python -m pytest -p no:cacheprovider "${existing[@]}" \
              --junitxml="$RUNNER_TEMP/anchor.xml" || status=$?
            test "$status" -le 1
            test -s "$RUNNER_TEMP/anchor.xml"
          else
            printf '<testsuites/>' > "$RUNNER_TEMP/anchor.xml"
          fi
          git checkout --quiet --detach "$candidate_head"
      - name: Keep the reports for audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-linux-reports
          path: |
            ${{ runner.temp }}/candidate.xml
            ${{ runner.temp }}/anchor.xml
            ${{ runner.temp }}/failing-files.txt
            ${{ runner.temp }}/linux-source.json
          if-no-files-found: error

  general-recipe-real:
    name: general-recipe-real
    runs-on: macos-15-intel
    timeout-minutes: 40
    defaults:
      run:
        working-directory: parent-fixture/pals-agent
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_PROGRESS: "1"
      UV_PYTHON_DOWNLOADS: never
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: parent-fixture/pals-agent
      - name: Verify the exact real-Lean source partition
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          printf '{"source_revision":"%s","workflow_run_id":"%s","partition":"general_recipe_real"}\n' \
            "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/mac-source.json"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install exact CPython from uv's macOS distribution
        timeout-minutes: 10
        env:
          UV_PYTHON_DOWNLOADS: manual
        run: |
          uv python install 3.12.13
          installed="$(uv python find --managed-python 3.12.13)"
          "$installed" -c 'import sys; assert sys.version_info[:3] == (3, 12, 13)'
      - name: Install the locked declared development environment
        run: |
          uv sync --locked --extra dev --python 3.12.13
          uv run --no-sync python - <<'PYCODE'
          import sys
          from pathlib import Path
          assert sys.version_info[:3] == (3, 12, 13)
          assert Path(sys.executable).parent == Path.cwd()/'.venv/bin'
          PYCODE
      - name: Freeze the candidate Lean workspace outside both source checkouts
        run: |
          echo "AGENT_TEST_BASE_PATH=$PATH" >> "$GITHUB_ENV"
          export PALS_GENERAL_RECIPE_STAGE_TEST_WORKSPACE="$RUNNER_TEMP/agent-lean-workspace"
          export PALS_GENERAL_RECIPE_STAGE_TEST_LAKE="$RUNNER_TEMP/agent-lean-home/.elan/bin/lake"
          export ELAN_HOME="$RUNNER_TEMP/agent-lean-home/.elan"
          printf '%s\n' "PALS_GENERAL_RECIPE_STAGE_TEST_WORKSPACE=$PALS_GENERAL_RECIPE_STAGE_TEST_WORKSPACE" \
            "PALS_GENERAL_RECIPE_STAGE_TEST_LAKE=$PALS_GENERAL_RECIPE_STAGE_TEST_LAKE" \
            "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          mkdir "$PALS_GENERAL_RECIPE_STAGE_TEST_WORKSPACE"
          cp lean-workspace/lean-toolchain lean-workspace/lake-manifest.json \
            lean-workspace/lakefile.lean "$PALS_GENERAL_RECIPE_STAGE_TEST_WORKSPACE/"
          test "$(cat "$PALS_GENERAL_RECIPE_STAGE_TEST_WORKSPACE/lean-toolchain")" = leanprover/lean4:v4.32.0-rc1
      - name: Reuse only the exact OS, architecture, toolchain and manifest cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/agent-lean-workspace/.lake
            ${{ runner.temp }}/agent-lean-home/.elan/toolchains
          key: agent-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('parent-fixture/pals-agent/lean-workspace/lean-toolchain') }}-${{ hashFiles('parent-fixture/pals-agent/lean-workspace/lake-manifest.json') }}
      - name: Install the pinned Lean toolchain with the official setup action
        timeout-minutes: 10
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        env:
          HOME: ${{ runner.temp }}/agent-lean-home
        with:
          lake-package-directory: ${{ runner.temp }}/agent-lean-workspace
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Obtain and verify the exact Mathlib cache without changing its lock
        timeout-minutes: 10
        run: |
          cd "$PALS_GENERAL_RECIPE_STAGE_TEST_WORKSPACE"
          lake exe cache get
          lake env lean --version | grep -F '4.32.0-rc1'
          cd "$GITHUB_WORKSPACE/parent-fixture/pals-agent"
          uv run --no-sync python - <<'PYCODE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from pals_agent import sandbox
          original = Path('lean-workspace')
          prepared = Path(os.environ['PALS_GENERAL_RECIPE_STAGE_TEST_WORKSPACE'])
          for name in ('lean-toolchain', 'lake-manifest.json', 'lakefile.lean'):
              assert hashlib.sha256((original/name).read_bytes()).digest() == hashlib.sha256((prepared/name).read_bytes()).digest(), name
          manifest = json.loads((prepared/'lake-manifest.json').read_bytes())
          for package in manifest['packages']:
              actual = subprocess.check_output(['git', '-C', str(prepared/'.lake/packages'/package['name']), 'rev-parse', 'HEAD'], text=True).strip()
              assert actual == package['rev'], package['name']
          assert sandbox.available(), 'real macOS containment is required'
          PYCODE
      - name: Run only the disjoint real-Lean module without changing test deadlines
        timeout-minutes: 10
        env:
          PATH: ${{ env.AGENT_TEST_BASE_PATH }}
        run: |
          uv run --no-sync python -m pytest -p no:cacheprovider \
            tests/integration/test_general_recipe_stage_real.py \
            --junitxml="$RUNNER_TEMP/general-recipe.xml"
      - name: Keep the original real-Lean report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-lean-reports
          path: |
            ${{ runner.temp }}/general-recipe.xml
            ${{ runner.temp }}/mac-source.json
          if-no-files-found: error

  agent-regression:
    name: agent-regression
    needs: [linux-regression, general-recipe-real]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: parent-fixture/pals-agent
    steps:
      - name: Require both real partitions to finish successfully
        env:
          LINUX_RESULT: ${{ needs.linux-regression.result }}
          LEAN_RESULT: ${{ needs.general-recipe-real.result }}
        working-directory: .
        run: test "$LINUX_RESULT" = success && test "$LEAN_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: parent-fixture/pals-agent
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Download only this workflow run's Linux reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-linux-reports
          path: ${{ runner.temp }}/linux
      - name: Download only this workflow run's real-Lean report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-lean-reports
          path: ${{ runner.temp }}/lean
      - name: Qualify the original disjoint reports, never a supplied PASS
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python scripts/agent_regression_gate.py check \
            --candidate "$RUNNER_TEMP/linux/candidate.xml" \
            --anchor "$RUNNER_TEMP/linux/anchor.xml" \
            --manifest tests/qualification/agent_regression_manifest.json \
            --supplement "$RUNNER_TEMP/lean/general-recipe.xml" \
            --candidate-metadata "$RUNNER_TEMP/linux/linux-source.json" \
            --supplement-metadata "$RUNNER_TEMP/lean/mac-source.json" \
            --source-revision "$EXPECTED_SOURCE" --workflow-run-id "$GITHUB_RUN_ID"
