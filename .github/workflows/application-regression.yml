name: Agent application regression

on:
  pull_request:
  push:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: agent-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-regression:
    name: agent-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_PROGRESS: "1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify the requested source revision
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install the locked declared development environment
        run: uv sync --locked --extra dev --python 3.12.13
      - name: Check the changed verifier boundary
        run: |
          uv run --no-sync ruff check \
            pals_agent/lean_verifier/http_server.py \
            tests/unit/test_isolated_verifier_http_server.py
      - name: Verify the real TLS boundary and existing closed protocol
        run: |
          uv run --no-sync python -m pytest -q -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/agent-regression.xml" \
            tests/unit/test_isolated_verifier_http_server.py
      - name: Require executed setup-failure regressions with no skips
        if: always()
        env:
          REGRESSION_REPORT: ${{ runner.temp }}/agent-regression.xml
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          cases = ET.parse(os.environ["REGRESSION_REPORT"]).findall(".//testcase")
          assert len(cases) >= 27, "required verifier regressions did not execute"
          assert all(not any(case.find(tag) is not None for tag in ("skipped", "failure", "error")) for case in cases)
          assert sum(case.attrib["name"].startswith("test_sandbox_setup_failure_is_unavailable_and_never_proof_repair_feedback[") for case in cases) == 2
          PY
