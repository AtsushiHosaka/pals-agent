name: Agent application regression

on:
  pull_request:
  push:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: agent-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Worker qualification. The job name and this file path are the identity that the
# parent repository's release-source-checks requires; do not rename either.
#
# What this establishes, and what it does not:
#   * The full unit/story/integration suite of the exact source runs once.
#   * Every failure must be listed in tests/qualification/agent_regression_manifest.json
#     with a cause AND must fail the same way on the retained verifier anchor
#     (189b443) in the same environment. A test that passes on the anchor and fails on
#     the candidate, or that is new and failing, blocks.
#   * Skips and never-executed modules must be listed with a reason; the 42 declared
#     runtime-core modules must run with no failure and no skip.
#   * It does NOT run real Lean/Mathlib, a real database, a real model or the deployed
#     images; the listed baseline failures remain unqualified, not "passing".
jobs:
  agent-regression:
    name: agent-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: parent-fixture/pals-agent
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_PROGRESS: "1"
      UV_PYTHON_DOWNLOADS: never
      AWS_EC2_METADATA_DISABLED: "true"
      RETAINED_VERIFIER_ANCHOR: 189b44378e6e63e5ab7c92d9c5b7d6507acd80f0
    steps:
      - name: Check out the immutable public parent fixture contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AtsushiHosaka/pals
          ref: b6b101177e5ce650eb3d03adc5f64f17e0540d96
          path: parent-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: parent-fixture/pals-agent
          fetch-depth: 0
      - name: Verify the requested source revision and the retained anchor
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git -C .. rev-parse HEAD)" = b6b101177e5ce650eb3d03adc5f64f17e0540d96
          test "$(git rev-parse "$RETAINED_VERIFIER_ANCHOR^{commit}")" = "$RETAINED_VERIFIER_ANCHOR"
          test "$(git cat-file commit "$RETAINED_VERIFIER_ANCHOR" | git hash-object -t commit --stdin)" = "$RETAINED_VERIFIER_ANCHOR"
          git merge-base --is-ancestor "$RETAINED_VERIFIER_ANCHOR" HEAD
          cp scripts/agent_regression_gate.py tests/qualification/agent_regression_manifest.json "$RUNNER_TEMP/"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install the locked declared development environment
        run: uv sync --locked --extra dev --python 3.12.13
      - name: Lint the qualification gate
        run: |
          uv run --no-sync ruff check \
            scripts/agent_regression_gate.py \
            tests/unit/test_agent_regression_gate.py
      - name: Run the full suite on the candidate source
        run: |
          # Exit 0 (all passed) and 1 (some tests failed) are the only outcomes that may
          # proceed; interrupted (2), internal error (3), usage (4) or no tests (5) block.
          status=0
          uv run --no-sync python -m pytest -p no:cacheprovider tests \
            --junitxml="$RUNNER_TEMP/candidate.xml" || status=$?
          test "$status" -le 1
          test -s "$RUNNER_TEMP/candidate.xml"
      - name: Re-run the failing test files on the retained verifier anchor
        run: |
          candidate_head="$(git rev-parse HEAD)"
          python "$RUNNER_TEMP/agent_regression_gate.py" failing-files \
            --report "$RUNNER_TEMP/candidate.xml" > "$RUNNER_TEMP/failing-files.txt"
          existing=()
          while read -r path; do
            if git cat-file -e "$RETAINED_VERIFIER_ANCHOR:$path" 2>/dev/null; then existing+=("$path"); fi
          done < "$RUNNER_TEMP/failing-files.txt"
          git checkout --quiet --detach "$RETAINED_VERIFIER_ANCHOR"
          uv sync --locked --extra dev --python 3.12.13
          if [ "${#existing[@]}" -gt 0 ]; then
            status=0
            uv run --no-sync python -m pytest -p no:cacheprovider "${existing[@]}" \
              --junitxml="$RUNNER_TEMP/anchor.xml" || status=$?
            test "$status" -le 1
            test -s "$RUNNER_TEMP/anchor.xml"
          else
            printf '<testsuites/>' > "$RUNNER_TEMP/anchor.xml"
          fi
          git checkout --quiet --detach "$candidate_head"
      - name: Keep the reports for audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-regression-reports
          path: |
            ${{ runner.temp }}/candidate.xml
            ${{ runner.temp }}/anchor.xml
            ${{ runner.temp }}/failing-files.txt
          if-no-files-found: warn
      - name: Require no new failure, unexplained skip or unexecuted module
        run: |
          python "$RUNNER_TEMP/agent_regression_gate.py" check \
            --candidate "$RUNNER_TEMP/candidate.xml" \
            --anchor "$RUNNER_TEMP/anchor.xml" \
            --manifest "$RUNNER_TEMP/agent_regression_manifest.json"
