name: Real Lean regression (prototype)

# pals#505 prototype: run the tests that need the pinned Lean/Mathlib, which application-regression.yml
# lists as skipped or known failures (it installs no Lean). Free GitHub-hosted runner only.
# Not a required check and not read by the sign gate. It runs on demand and when this file changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/real-lean.yml

permissions:
  contents: read

concurrency:
  group: real-lean-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-lean:
    name: real-lean
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: parent-fixture/pals-agent
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_PROGRESS: "1"
      UV_PYTHON_DOWNLOADS: never
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Check out the immutable public parent fixture contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AtsushiHosaka/pals
          ref: b6b101177e5ce650eb3d03adc5f64f17e0540d96
          path: parent-fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: parent-fixture/pals-agent
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install the locked development environment
        run: uv sync --locked --extra dev --python 3.12.13
      - name: Install elan and the pinned toolchain
        run: |
          started=$(date +%s)
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean-workspace
          xargs elan toolchain install < lean-toolchain
          echo "elan+toolchain: $(( $(date +%s) - started )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fetch the pinned Mathlib build cache
        run: |
          started=$(date +%s)
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean-workspace
          lake update
          lake exe cache get
          du -sh .lake | tee -a "$GITHUB_STEP_SUMMARY"
          echo "mathlib cache: $(( $(date +%s) - started )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the whole suite with the real Lean (serial, skips reported)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          WS="$PWD/lean-workspace"
          TC="$HOME/.elan/toolchains/$(sed 's#/#--#; s#:#---#' "$WS/lean-toolchain")"
          LEAN="$TC/bin/lean"; LAKE="$TC/bin/lake"
          LP="$(for d in "$WS"/.lake/packages/*/.lake/build/lib/lean; do printf '%s:' "$d"; done)$TC/lib/lean"
          export PALS_LEAN_WORKSPACE="$WS" PALS_LEAN_PROJECT_DIR="$WS" PALS_FRONTIER_TEST_WORKSPACE="$WS"
          export PALS_PARALLEL_REAL_PROJECT="$WS" PALS_PARALLEL_REAL_SCRATCH="$RUNNER_TEMP/parallel-scratch"
          mkdir -p "$PALS_PARALLEL_REAL_SCRATCH"
          export PALS_ACCELERATION_REAL_PROJECT="$WS" PALS_ACCELERATION_REAL_LEAN="$LEAN" PALS_ACCELERATION_REAL_LAKE="$LAKE" PALS_ACCELERATION_REAL_ELAN_HOME="$HOME/.elan"
          export PALS_FORGERY_LEAN="$LEAN" PALS_FORGERY_LAKE="$LAKE" PALS_FORGERY_MATHLIB_PROJECT="$WS"
          export PALS_GEOMETRY_LEAN="$LEAN" PALS_GEOMETRY_LAKE="$LAKE" PALS_GEOMETRY_LEAN_WORKSPACE="$WS"
          export PALS_SQUARE_LEAN_PROJECT="$WS" PALS_SQUARE_LEAN_BINARY="$LEAN"
          export PALS_POWER_RECIPE_LEAN_PATH="$LP" PALS_TEST_MATHLIB_PACKAGES="$WS/.lake/packages"
          export PALS_RESIDENT_LEAN="$LEAN" PALS_RESIDENT_LEAN_PATH="$LP" PALS_RESIDENT_LEAN_PROJECT="$WS"
          export PALS_GENERAL_RECIPE_LEAN=1
          started=$(date +%s)
          status=0
          uv run --no-sync python -m pytest -p no:cacheprovider tests -rs --durations=40 \
            --junitxml="$RUNNER_TEMP/real-lean.xml" > "$RUNNER_TEMP/real-lean.log" 2>&1 || status=$?
          echo "suite: $(( $(date +%s) - started )) s, pytest exit $status" | tee -a "$GITHUB_STEP_SUMMARY"
          tail -n 80 "$RUNNER_TEMP/real-lean.log"
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          counts = {"passed": 0, "failed": 0, "skipped": 0}
          skips, fails = {}, []
          for case in ET.parse(os.environ["RUNNER_TEMP"] + "/real-lean.xml").getroot().iter("testcase"):
              name = case.get("classname") + "::" + case.get("name")
              skipped = case.find("skipped")
              if case.find("failure") is not None or case.find("error") is not None:
                  counts["failed"] += 1; fails.append(name)
              elif skipped is not None:
                  counts["skipped"] += 1; skips[skipped.get("message", "")[:120]] = skips.get(skipped.get("message", "")[:120], 0) + 1
              else:
                  counts["passed"] += 1
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          print("counts:", counts, file=out)
          print("\nskips by reason:", file=out)
          for reason, n in sorted(skips.items(), key=lambda kv: -kv[1]): print(f"- {n} x {reason}", file=out)
          print("\nfailures:", file=out)
          for name in fails: print("- " + name, file=out)
          PY
          exit 0
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-lean-reports
          path: |
            ${{ runner.temp }}/real-lean.xml
            ${{ runner.temp }}/real-lean.log
          if-no-files-found: warn
